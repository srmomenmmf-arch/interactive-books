رؤية وهذه العقيدة تنفخ فيه فيحصل في قلبه اعتداد وهزة وفرح وركون إلى ما اعتقده، فتلك العزة والهزة والركون إلى العقيدة هي خلق الكبر، ولهذا كان عليه الصلاة والسلام يتعوذ من نفخ الشيطان، وقال: نفخه الكبرياء، وقد قدمنا هذا الحديث، واستأذن رجل عمر في القصص فقال: أخشى أن تنتفخ حتى تبلغ الثريا.", "فالإنسان إذا رأى نفسه بعين الاستعظام كبر وانتفخ وحقر من دونه وازدراه وأنف عن مساواته فازداد كبره، وترفع عن مجالسته ومؤاكلته، ورأى أن حقه أن يقوم ذلك الشخص ماثلا بين يديه، فإن اشتد كبره استنكف عن استخدامه، وصفة هذا المتكبر أنه ينظر إلى العامة كأنه ينظر إلى الحمير استجهالا لهم واستخفافا.", "حاشية: (١) تحرفت في (ف) إلى: (هي).", "وآفة الكبر عظيمة، وغائلته هائلة، وفيه يهلك الخواص من الخلق، وقلما ينفك عنه العباد والزهاد والعلماء فضلا عن العوام، وكيف لا تعظم آفته وقد روينا عن النبي ﷺ أنه قال: لا يدخل الجنة من في قلبه مثقال ذرة من كبر. وإنما صار حجابا دون الجنة؛ لأنه يحول بين العبد وبين أخلاق المؤمنين كلها، وتلك الأخلاق هي أبواب الجنة، والكبر يغلقها كلها؛ لأنه لا يقدر أن يحب للمؤمنين ما يحب لنفسه، ولا على التواضع ولا على ترك الحقد والحسد والغضب وكظم الغيظ وقبول النصح وفيه شيء من الكبر، ولا يسلم من الازدراء بالناس ومن اغتيابهم، فما من خلق ذميم إلا والمتكبر مضطر إليه ليحفظ به عزه، والأخلاق الذميمة متلازمة، وبعضها داع إلى بعض، وشر أنواع الكبر ما يمنع من استفادة العلم وقبول الحق والانقياد له.", "**بيان**", "**المتكبر عليه وأقسامه ودرجاته وثمرات الكبر فيه**"]], "ic": "book"}, {"story": ["كتاب ذم الكبر والعجب (٨ من ٣٣)، ص٩٠٣", ["اعلم أن الآدمي قد خلق ظلوما جهولا، فتارة يتكبر على الخلق، وتارة على الخالق، فأما التكبر على الخالق فهو أفحش أنواع الكبر، ولا مثار له إلا الجهل المحض والطغيان مثل قول فرعون: ﴿أَنَا۠ رَبُّكُمُ ٱلْأَعْلَىٰ﴾ [النازعات: ٢٤]، وصعود نمرود ليقاتل رب السماء، ولذلك قال تعالى: ﴿إِنَّ ٱلَّذِينَ يَسْتَكْبِرُونَ عَنْ عِبَادَتِى سَيَدْخُلُونَ جَهَنَّمَ دَاخِرِينَ﴾ [غافر: ٦٠]، وقال: ﴿وَمَن يَسْتَنكِفْ عَنْ عِبَادَتِهِۦ وَيَسْتَكْبِرْ﴾ [النساء: ١٧٢]، وقال: ﴿وَإِذَا قِيلَ لَهُمُ ٱسْجُدُوا۟ لِلرَّحْمَٰنِ قَالُوا۟ وَمَا ٱلرَّحْمَٰنُ أَنَسْجُدُ لِمَا تَأْمُرُنَا﴾ [الفرقان: ٦٠].", "وأما المتكبر على الخلق فينقسم قسمين: ＊＊أحدهما＊＊: التكبر على الرسل من حيث تعزز النفس وترفعها عن الانقياد لبشر مثل سائر الناس، وذلك قد يقع عند ابتداء الدعاية، فيصرف عن الفكر في أمر الرسول، فيبقى صاحبه في ظلمة الجهل ممتنعا عن الانقياد، وهو يظن أنه في ذلك محق، وقد تحصل لصاحبه المعرفة بصدق الرسول ولكن لا تطاوعه نفسه على الانقياد للحق، كما حكى الله عز وجل عنهم: ﴿وَجَحَدُوا۟ بِهَا وَٱسْتَيْقَنَتْهَآ أَنفُسُهُمْ﴾ [النمل: ١٤]، وحكى عن قولهم: ﴿أَنُؤْمِنُ لِبَشَرَيْنِ مِثْلِنَا﴾ [المؤمنون: ٤٧]، ﴿إِنْ أَنتُمْ إِلَّا بَشَرٌ مِّثْلُنَا﴾ [إبراهيم: ١٠]، ﴿لَوْلَآ أُنزِلَ عَلَيْنَا ٱلْمَلَـٰٓئِكَةُ أَوْ نَرَىٰ رَبَّنَا لَقَدِ ٱسْتَكْبَرُوا۟ فِىٓ أَنفُسِهِمْ﴾ [الفرقان: ٢١]، وقال فرعون: ﴿أَوْ جَآءَ مَعَهُ ٱلْمَلَـٰٓئِكَةُ مُقْتَرِنِينَ﴾ [الزخرف: ٥٣]، فقال عز وجل: ﴿وَٱسْتَكْبَرَ هُوَ وَجُنُودُهُۥ فِى ٱلْأَرْضِ بِغَيْرِ ٱلْحَقِّ﴾ [القصص: ٣٩]، فهذا متكبر على الله وعلى رسوله. قال وهب بن منبه: قال له موسى: آمن بي ولك ملكك. قال: حتى أشاور هامان. فشاوره فقال: بينما أنت رب تعبد صرت عبدا تعبد. فاستنكف عن عبودية الله وعن اتباع موسى.", "وقال تعالى فيما حكى عن المشركين: ﴿لَوْلَا نُزِّلَ هَـٰذَا ٱلْقُرْءَانُ عَلَىٰ رَجُلٍ مِّنَ ٱلْقَرْيَتَيْنِ عَظِيمٍ﴾ [الزخرف: ٣١]، فطلبوا من هو أعلى رتبة في الدنيا من رسول الله ﷺ،", "وقالوا: ﴿أَهَـٰٓؤُلَآءِ مَنَّ ٱللَّهُ عَلَيْهِم مِّنۢ بَيْنِنَآ﴾ [الأنعام: ٥٣]، وهذا قريب من التكبر على الله، وإن كان دونه؛ لأنه تكبر على قبول أمر الله والتواضع لرسوله.", "**والقسم الثاني**: التكبر على العباد باحتقارهم عند استعظامه لنفسه، وهذا عظيم من وجهين:"]], "ic": "book"}, {"story": ["كتاب ذم الكبر والعجب (٩ من ٣٣)، ص٩٠٤", ["**أحدهما**: أن الكبر والعظمة لا يليق إلا بالملك القادر لا بالعبد المملوك العاجز، فالمتكبر منازع لله عز وجل في صفة لا تليق إلا بجلاله، ومثاله أن يأخذ الغلام قلنسوة الملك فيضعها على رأسه ويجلس على سريره، فما أعظم استخفافه بالملك، ولهذا قال تعالى فيما قدمناه: «العز إزاري والكبرياء ردائي فمن نازعني شيئا منهما عذبته». وإذا كان الكبر على عبادة لا يليق إلا به، فالمتكبر عليهم قد جنى عليه؛ لأن من استرذل خواص السلطان وترفع عليهم واستأثر بما حق الملك أن يستأثر به منهم، فهو منازع للملك.", "**الوجه الثاني**: أن الكبر يدعو إلى مخالفة الله تعالى في أوامره؛ لأن المتكبر إذا سمع الحق من عبد من عباد الله تعالى استنكف من قبوله وتشمر لجحده، ولذلك ترى أكثر المناظرين يأنفون من قبول الحق إذا اتضح على لسان واحد منهم، ويتشمرون لجحده، ويحتالون لدفعه، وذلك من أخلاق الكفار حين قالوا: ﴿لَا تَسْمَعُوا۟ لِهَـٰذَا ٱلْقُرْءَانِ وَٱلْغَوْا۟ فِيهِ لَعَلَّكُمْ تَغْلِبُونَ﴾ [فصلت: ٢٦]، فكل من ناظر للغلبة والإفحام لا لاغتنام الظفر بالحق، فقد شاركهم في هذا الخلق، وبعضهم تحمله الأنفة من قبول الوعظ، كما قال عز وجل: ﴿وَإِذَا قِيلَ لَهُ ٱتَّقِ ٱللَّهَ أَخَذَتْهُ ٱلْعِزَّةُ بِٱلْإِثْمِ﴾ [البقرة: ٢٠٦].", "فالتكبر على العباد يدعو إلى التكبر على أمر الله تعالى، كما حمل إبليس كبره على آدم أن امتنع عن امتثال أمر الله في السجود، ولذلك شرح رسول الله ﷺ الكبر بهاتين الآفتين، فقال: «الكبر من بطر الحق وغمط الناس». ورواه عبد الله بن مسعود عن النبي ﷺ أن رجلا قال: إن الرجل يحب أن يكون ثوبه حسنا ونعله حسنة؟ فقال رسول الله ﷺ: «إن الله جميل يحب الجمال، الكبر بطر الحق وغمط الناس».", "وروى أبو هريرة أن رجلا أتى النبي ﷺ فقال: إني رجل حبب إلي الجمال، وأعطيت منه ما ترى حتى ما أحب أن يفوقني أحد ـ إما قال: بشراك نعلي، وإما قال: بشسعي(١)، أفمن الكبر ذاك؟ قال: لا، ولكن الكبر من بطر الحق وغمط الناس. ومعنى غمط: أزرى بالناس واستخف بهم، ويقال: غمط بكسر الميم أيضا، ويروى غمض وغمص، بفتح الميم وكسرها وهو بمعنى غمط.", "حاشية: (١) الشسع: سير يمسك النعل بأصابع القدم.", "**بيان**", "**ما به التكبر**", "اعلم أنه لا يتكبر إلا من استعظم نفسه، ولا يستعظمها إلا وهو يعتقد لها صفة من صفات الكمال، ومجامع ذلك يرجع إلى كمال ديني أو دنيوي، والديني: هو العلم والعمل، والدنيوي: هو النسب والجمال والقوة والمال وكثرة الأنصار، فهذه سبعة أسباب:"]], "ic": "book"}, {"story": ["كتاب ذم الكبر والعجب (١٠ من ٣٣)، ص٩٠٦", ["**الأول: العلم**؛ وما أسرع الكبر إلى العلماء، فإن العالم لا يلبث أن يتعزز بعز العلم فيستعظم نفسه ويحتقر الناس، وينظر إليهم نظره إلى البهائم، ويتوقع أن يبدؤوه بالسلام، وإن بدأ أحدا منهم، أو رد عليه بشرا، أو قام له، أو أجاب دعوته رأى له صنيعة عنده ويدا عليه يلزم شكرها؛ لأنه يرى أن له عليهم أن يزوروه ولا يزورهم، ويعودوه ولا يعودهم، ويستسخرهم في حوائجه كأنهم عبيد له أو أجراء، هذا فيما يتعلق بالدنيا.", "وأما في أمر الآخرة فتكبره عليهم بأن يرى نفسه عند الله أعلى وأفضل منهم، فيخاف عليهم أكثر مما يخاف على نفسه، ويرجو لنفسه أكثر مما يرجو لهم، وهذا بأن يسمى جاهلا أولى من أن يسمى عالما، بل العلم الحقيقي هو الذي يعرف الإنسان به نفسه وربه، وخطر الخاتمة، وحجة الله على العلماء، وعظم خطر العلم، كما سيأتي في طريق معالجة الكبر بالعلم، وهذه العلوم تزيد العالم خوفا وتواضعا وتخشعا، وتقتضي أن يرى أن كل الناس خير منه لعظم حجة الله عليه بالعلم، وتقصيره في القيام بشكر نعمة العلم، ولهذا قال أبو الدرداء: من ازداد علما ازداد وجعا.", "فإن قيل: فما بال بعض العلماء يزداد بالعلم كبرا وأمنا؟", "فالجواب: أن لذلك سببين:", "**أحدهما**: أن يكون اشتغاله بما يسمى علما وليس بعلم حقيقي، كعلم المجادلة واللغة والنحو والشعر والحساب والطب، فهذه الأشياء إذا امتلأ منها الإنسان امتلأ بها كبرا، وهي بأن تسمى صناعات أولى من أن تسمى علوما، بل العلم هو ما يعرف به العبد ربه ونفسه وخطر أمره في لقاء الله، وهذا يورث الخشية والتواضع دون الكبر، قال الله تعالى: ﴿إِنَّمَا يَخْشَى ٱللَّهَ مِنْ عِبَادِهِ ٱلْعُلَمَـٰٓؤُا۟﴾ [فاطر: ٢٨].", "**السبب الثاني**: أن يخوض العبد في العلم وهو خبيث الدخلة سيئ الأخلاق، لم يشتغل أولا بتهذيب نفسه ورياضتها، ولا بتزكية قلبه بالمجاهدات، فيبقى (١-١)خبيث الجوهر، فأي علم حل في قلبه صادف منزلا(١-١) خبيثا، فلم تطب ثماره ولم يظهر في الخير أثره، وقد ضرب وهب بن منبه لهذا مثلا، فقال: العلم كالغيث، ينزل من السماء حلوا صافيا، فتشربه الأشجار بعروقها، فتحوله على قدر طعومها، فيزداد المر مرارة والحلو حلاوة، فكذلك العلم، يحفظه الرجال فتحوله(٢) على قدر همهما وأهوائها، فيزيد المتكبر كبرا والمتواضع تواضعا، وهذا لأن من كانت همته الكبر وهو جاهل، فإذا حفظ وجد ما يتكبر به، فازداد كبرا، وإذا كان الرجل خائفا مع جهله، فإذا ازداد علما علم أن الحجة قد تأكدت عليه فيزداد خوفا وإشفاقا وذلا وتواضعا، فالعلم من أعظم ما يتكبر به، ولذلك قال عمر بن الخطاب: لا تكونوا جبابرة العلماء، فلا يقي علمكم بجهلكم."]], "ic": "book"}, {"story": ["كتاب ذم الكبر والعجب (١١ من ٣٣)، ص٩٠٧", ["وروي عن حذيفة أنه صلى بقوم، فلما سلم قال: لتلتمسن إماما غيري أو لتصلن وحدانا، إني رأيت [في نفسي](٣) أنه ليس في القوم أفضل مني. فإذا كان مثل حذيفة لم يسلم، فكيف بالضعفاء؟", "وما أعز وجود عالم يستحق أن يقال له: عالم، ثم لا يحركه عز العلم وخيلاؤه، فإن وجد ذلك فهو صديق زمانه، وذلك الذي يكون النظر إليه عبادة", "حاشية: (١-١) سقط من (ف).", "حاشية: (٢) في (ف): (فتحفظه).", "حاشية: (٣) زيادة من الإحياء توضح المعنى.", "فضلا عن الاستفادة من أنفاسه وأحواله، هيهات بعيد وجود ذلك في زماننا، بل يبعد في زماننا وجود عالم يختلج في قلبه التأسف والحزن على فوات هذه الخصلة.", "**الثاني**: العمل والعبادة؛ وليس يخلو أربابها من الكبر، ويظهر أثر ذلك منهم في الدنيا والدين.", "أما الدنيا: فهو أنهم يرون غيرهم بزيارتهم أولى منهم بزيارة غيرهم، ويتوقعون قيام الناس بقضاء حوائجهم وتوقيرهم، والتوسيع لهم في المجالس، وذكرهم بالتقوى، وتقديمهم على سائر الناس على نحو ما ذكرنا في حق العلماء، وكأنهم يرون عبادتهم منة على الخلق.", "وأما في الدين فهو أنهم يرون الناس هالكين، ويرون أنفسهم ناجية. وفي أفراد مسلم من حديث أبي هريرة عن النبي ﷺ أنه قال: «إذا قال الرجل: هلك الناس، فهو أهلكهم»(١).", "وإنما يقول هذا من يزدري عباد الله ويحتقرهم، فهم على ما بهم ربما كانوا خيرا من هذا القائل؛ لأنهم يتقربون إلى الله بالدنو منه، وهو يتمقت إليه بالتباعد عنهم، فما أجدره أن ينزل في مقامهم بسوء اعتقاده، ويصعدون إلى مكانه بحسن ظنونهم، كما روي أن بعض فساق بني إسرائيل رأى عابدا فقرب منه، فأنف منه العابد فتباعد، فأوحى الله تعالى إلى نبي ذلك الزمان: قل لهما فليستأنفا العمل، فقد غفر لهذا وأحبط عمل هذا. وهذا لأن المراد من العباد القلوب، فإذا ذل قلب العاصي، فقد أطاع الله بقلبه، وإذا تكبر قلب الطائع، فقد عصى الله بقلبه، ولذلك قال الحسن: إن أقواما جعلوا الكبر في قلوبهم، والتواضع في ثيابهم، كصاحب الكساء في كسائه أعجب من صاحب المطرف(٢) بمطرفه، مالهم تفاقدوا؟ وهذا لأن", "حاشية: (١) أخرجه أحمد (٢٦٢٣)، وأهلكهم: رويت بضم الكاف وهي الرواية المشهورة، أي: أشدهم هلاكا أو أحقهم بإهلاك، ورويت بفتح الكاف، أي: هو جعلهم هالكين، فهو أهلكهم لكونه أقنط عباد الله عن رحمته.", "حاشية: (٢) المطرف: ثوب مربع له أعلام."]], "ic": "book"}, {"story": ["كتاب ذم الكبر والعجب (١٢ من ٣٣)، ص٩٠٩", ["صاحب الخز يذل، وصاحب الصوف يذل، وهذه الآفة قلما ينفك عنها أكثر العباد، حتى إنه لو آذاه مؤذ استبعد أن يغفر الله له، واعتقد أن الله قد مقت ذلك الشخص، ولو آذى ذلك غيره لم يكبر عنده وهذا لعظم قدره عند نفسه، وهذا جهل وجمع بين العجب والكبر، وربما تحدى بعضهم إذا أوذي فقال: سترون ما يجري على هذا المؤذي لي. فإن نكب ذلك الشخص زعم هذا أنه من كراماته، مع أنه يرى أن خلقا من الكفار يؤذون الله ورسوله ويسلمون في الدنيا من المكاره، فهذه حالة المغترين، فأما الأكياس، فعلى مثل حالة عطاء السلمي، كان إذا وقعت صاعقة ظن أن ما يصيب الناس بسببه، وكما قال بكر المزني بعرفة: ما أشرفه من مقام لولا أني فيهم. فكم بين هؤلاء وبين من يمتن(١) بعمله، ومن اعتقد جزما أنه فوق أحد من المسلمين فقد أحبط عمل نفسه بجهله.", "واعلم أن العلماء والعباد في آفة الكبر على ثلاث درجات:", "**الدرجة الأولى**: أن يكون الكبر مستقرا في قلب الإنسان منهم، فهو يرى نفسه خيرا من غيره، إلا أنه يجتهد ويتواضع، ويفعل فعل من يرى غيره خيرا من نفسه، فهذا في قلبه شجرة الكبر مغروسة، إلا أنه قد قطع أغصانها.", "**الدرجة الثانية**: أن يظهر ذلك على أفعاله بالترفع في المجالس، والتقدم على الأقران، والإنكار على من يقصر في حقه، فترى العالم يصعر خده للناس، كأنه معرض عنهم، والعابد يعبس وجهه كأنه مستقذر لهم، وهذان قد جهلا ما أدب الله به نبيه حين قال: ﴿وَٱخْفِضْ جَنَاحَكَ لِمَنِ ٱتَّبَعَكَ مِنَ ٱلْمُؤْمِنِينَ﴾ [الشعراء: ٢١٥] منا منهما بعملهما.", "**الدرجة الثالثة**: أن يظهر الكبر بلسانه كالدعاوي والمفاخرة والمباهاة وتزكية النفس وحكاية الأحوال والتشمير لغلبة الغير في العلم والعمل، ويقول العابد في معرض المفاخرة لغيره: من هو؟ وما عمله؟ وما زهده؟ أنا لم أفطر منذ كذا وكذا، ولا أنام الليل، وأختم القرآن كل يوم، وقصدني فلان فهلك ماله أو أخذ ماله أو مرض.", "حاشية: (١) في (ف): (تميز).", "وهذا إذا حصل مع قوم يصلون بالليل ربما كلف نفسه أكثر من تعبده ليظهر لهم قوته وعجزهم. ويقول العالم في مفاخرته: أنا متفنن في العلوم، ومطلع على الحقائق، رأيت فلانا وفلانا، فمن فلان؟ ومن لقي؟ ثم يجتهد في المناظرة أن يغلب ولا يغلب، ويسهر الليل في تحصيل علوم يتجمل بها في المحافل، كعلم الجدل والعلوم الغريبة ليعرب(١) بها على الأقران، ويتحفظ الأحاديث بألفاظها وأسانيدها ليرد على من أخطأ فيها، فيبين فضله ونقصان أقرانه، ويفرح إذا أخطأ واحد منهم ليرد عليه، ويسوءه إذا أصاب وأحسن أن يرى أنه أعظم منه."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "وقد يورث العجب بالقوة التهجم في الحروب على التهلكة، وعلاج ذلك أن يعلم أن ذلك أمر زائل، وأن حمى يوم تزيل قوة البدن، ويسير من الفتن يدفع قوة ____", "o": ["العزائم", "للقريب", "وكثيرها", "تخاسسا"], "h": "راجع: ص٩٣٨"}, {"t": "fill", "d": 2, "q": "قال البخاري: حدثنا آدم قال: حدثنا شعبة قال: حدثنا محمد بن زياد عن أبي هريرة عن النبي ﷺ قال: «بينما رجل يمشي في حلة تعجبه نفسه، مرجل ____، خسف الله به، فهو يتجلجل إلى يوم القيامة». هذه", "o": ["جمته", "والنقص", "صوركم", "وممتثل"], "h": "راجع: ص٨٩٥"}, {"t": "fill", "d": 2, "q": "وعلاجه: ما ذكرنا في الكبر بالجمال، وهو التفكر في ____ الباطن وبداية الأمر ونهايته من", "o": ["أقذار", "أمامة", "أتباعه", "الفلاحة"], "h": "راجع: ص٩٣٨"}, {"t": "fill", "d": 2, "q": "فإن قيل: كيف يصح للعالم أن يتواضع للفاسق والمبتدع ويرى نفسه دونهما، فإذن يكون جاهلا ____", "o": ["بقدر", "وقاص", "رحمته", "المغرب"], "h": "راجع: ص٩٢٤"}, {"t": "fill", "d": 2, "q": "الثالث: العجب بالعقل والكياسة، والتفطن لدقائق الأمور، وهذا يثمر الاستبداد بالرأي وترك المشاورة، ____ المخالفين", "o": ["واستجهال", "وتخفون", "فاجتهد", "ومجامع"], "h": "راجع: ص٩٣٩"}, {"t": "fill", "d": 2, "q": "أحدهما: أن الكبر والعظمة لا يليق إلا بالملك القادر لا بالعبد المملوك العاجز، فالمتكبر منازع لله عز وجل في صفة لا تليق إلا بجلاله، ومثاله أن يأخذ الغلام قلنسوة الملك فيضعها على ____ ويجلس على", "o": ["رأسه", "التصدق", "الشيوخ", "يترك"], "h": "راجع: ص٩٠٤"}]}, {"t": "كتاب ذم الكبر والعجب - القسم ٣ من ٦", "b": [{"story": ["كتاب ذم الكبر والعجب (١٣ من ٣٣)، ص٩١٠", ["فهذه أخلاق الكبر التي ثمرتها التعزز بالعلم والعمل، فليت شعري من عرف هذه الأخلاق من نفسه، وسمع قول رسول الله ﷺ : ((لا يدخل الجنة من في قلبه مثقال حبة من خردل من كبر)) كيف يستعظم نفسه ويتكبر على غيره؟ وهو على مقتضى قول رسول الله ﷺ من أهل النار؟ فهذا هو الكبر بالعلم والعمل.", "**الثالث**: التكبر بالنسب والحسب؛ فالذي له نسب شريف يستحقر من ليس له ذلك النسب، وإن كان أرفع منه علما وعملا، وقد يرى بعضهم أن الناس له موالي وعبيد، ويأنف من مخالطتهم.", "وثمرة هذا الكبر على اللسان التفاخر به، فيقول لغيره: يا نبطي، يا أرمني، يا عامي، من أنت ومن أبوك؟ وأنا فلان بن فلان، وكيف يكلمني مثلك؟ وهذا عرق في النفس لا ينفك عنه نسيب(٢)، وإن كان صالحا أو عاقلا، إلا أنه قد لا يترشح منه ذلك عند اعتدال أحواله، فإن غلبه غضب، أطفأ نور بصيرته وترشح منه. قال ابن عباس: يقول الرجل للرجل: أنا أكرم منك. وليس أحد أكرم من أحد إلا بتقوى الله تعالى.", "**الرابع**: التفاخر بالجمال؛ وأكثر ما يجري هذا بين النساء، ويدعوهن إلى التنقص والثلب(٣) والغيبة وذكر العيوب، كما روينا عن عائشة رضي الله عنها أنها", "حاشية: (١) يعرب: أي يأتي بالغريب الذي يعسر فهمه.", "حاشية: (٢) تصحفت في (ف) إلى: (بسيب).", "حاشية: (٣) ثلب فلانا: عابه وتنقصه.", "حكت امرأة عند رسول الله ﷺ ذكرت قصرها، فقال النبي ﷺ: «قد اغتبتيها». وهذا إنما ينشأ من الكبر؛ لأنها لو كانت قصيرة لما ذكرتها فكأنها أعجبت بطول نفسها، فاستقصرت المرأة في جنبها(١).", "**الخامس**: الكبر بالمال؛ وذلك يجري بين الملوك في الخزائن، وبين التجار في البضائع، وبين الدهاقين(٢) في الأرضين، وبين المتجملين في لباسهم وخيولهم ومراكبهم، فيستحقر الغني الفقير ويتكبر عليه، ويقول له: أنت مكدي(٣) ومسكين، وأنا لو أردت لاشتريت مثلك واستخدمت من هو فوقك، ومن أنت؟ وما معك؟ وأثاث بيتي يساوي أكثر من جميع مالك، وأنا أنفق في اليوم ما لا تأكله في سنة. وكل ذلك لاستعظامه الغنى واحتقاره الفقر، وكل ذلك جهل منه بآفة الغنى وفضيلة الفقر، وإليه الإشارة بقوله تعالى: ﴿فَقَالَ لِصَـٰحِبِهِۦ وَهُوَ يُحَاوِرُهُۥٓ أَنَا۠ أَكْثَرُ مِنكَ مَالًا وَأَعَزُّ نَفَرًا﴾ [الكهف: ٣٤]، حتى أجابه وقال: ﴿إِن تَرَنِ أَنَا۠ أَقَلَّ مِنكَ مَالًا وَوَلَدًا فَعَسَىٰ رَبِّىٓ أَن يُؤْتِيَنِ خَيْرًا مِّن جَنَّتِكَ﴾.. الآية [الكهف: ٣٩ ـ ٤٠]، وإنما كان ذلك منه تكبرا بالمال والولد، ومن ذلك تكبر قارون إذ قال تعالى في وصفه: ﴿فَخَرَجَ عَلَىٰ قَوْمِهِۦ فِى زِينَتِهِۦ﴾.. إلى قوله: ﴿يَـٰلَيْتَ لَنَا مِثْلَ مَآ أُوتِىَ قَـٰرُونُ﴾ [القصص: ٧٩].", "**السادس**: التكبر بالقوة، وشدة البطش على أهل الضعف."]], "ic": "book"}, {"story": ["كتاب ذم الكبر والعجب (١٤ من ٣٣)، ص٩١١", ["**السابع**: التكبر بالأتباع والأنصار والتلامذة والغلمان والعشيرة والأقارب والبنين؛ ويجري ذلك بين الملوك في المكاثرة بالجنود، وبين العلماء بالمستفيدين.", "وفي الجملة؛ فكل ما هو نعمة وأمكن أن يعتقد كمالا وإن لم يكن في نفسه كمالا أمكن أن يتكبر به، حتى إن المخنث يتكبر على أقرانه بزيادة معرفته وقدرته في صنعة التخنيث؛ لأنه يرى ذلك كمالا فيفتخر به، وكذلك الفاسق قد يفتخر بكثرة الشرب والفجور لظنه أن ذلك كمال.", "حاشية: (١) تصحفت في الأصل إلى: (حسنها).", "حاشية: (٢) الدهاقين: جمع دهقان، وهو رئيس القرية.", "حاشية: (٣) المكدي: هو السائل الفقير، فالكدية حرفة السائل الملح.", "فهذه مجامع ما يتكبر به العباد بعضهم على بعض، فيتكبر من يدلي بشيء من ذلك على من لا يدلي بما هو دونه في اعتقاده، وربما كان مثله وفوقه عند الله، كالعالم الذي يتكبر بعلمه على من هو أعلم منه، لظنه أنه الأعلم، ولحسن اعتقاده في نفسه.", "**بيان**", "**البواعث على التكبر وأسبابه المهيجة له**", "قد ذكرنا أن الكبر خلق باطن، وأن ما يظهر من الأفعال والأخلاق ثمرته، وينبغي أن يسمى تكبرا، ويخص باسم الكبر المعنى الباطن، وهذا الباطن له موجب واحد، وهو العجب، فإن من أعجب بنفسه وبعمله وعلمه أو شيء من أسبابه استعظم نفسه وتكبر.", "فأما التكبر الظاهر فأسبابه ثلاثة: سبب في المتكبر، وسبب في المتكبر عليه، وسبب يتعلق بغيرهما.", "أما السبب الذي في المتكبر، فهو العجب.", "والذي يتعلق بالمتكبر عليه؛ هو الحقد والحسد.", "والذي يتعلق بغيرهما هو الرياء.", "فتصير الأسباب بهذا الاعتبار أربعة: العجب، والحقد، والحسد، والرياء.", "أما العجب: فقد ذكرنا أنه يورث الكبر الباطن، (١-١)والكبر الباطن(١-١) يثمر التكبر الظاهر في الأعمال والأقوال والأحوال.", "وأما الحقد؛ فإنه قد يحمل على التكبر من عجب، كالذي يتكبر على من يرى أنه مثله أو فوقه، ولكن قد غضب عليه بسبب سبق منه، فأورثه الغضب حقدا ورسخ في قلبه بغضه، ولا تطاوعه نفسه أن يتواضع له، وإن كان عنده مستحقا للتواضع، فكم من رذل(٢) لا تطاوعه النفس على التواضع لواحد من الأكابر لحقده", "حاشية: (١-١) سقط من (ف).", "حاشية: (٢) سقطت من (ف)، والرذل: الردي.", "عليه وبغضه له، ويحمله ذلك على رد الحق إذا جاءه من جهته وعلى الأنفة من قبول نصحه، وعلى أن يجتهد في التقدم عليه، وإن علم أنه لا يستحق ذلك، وعلى أن لا يستحله وإن ظلمه، ولا يعتذر إليه وإن جنى عليه، ولا يسأله عما هو جاهل به."]], "ic": "book"}, {"story": ["كتاب ذم الكبر والعجب (١٥ من ٣٣)، ص٩١٤", ["وأما الحسد(١)، فإنه أيضا يوجب البغض للمحسود وإن لم يكن من جهته إيذاء وسبب يقتضي الغضب والحقد، ويدعو الحسد أيضا إلى جحد الحق حتى يمنع من قبول النصح وتعلم العلم، فكم من جاهل يشتاق إلى العلم وقد بقي في رذيلة الجهل لاستنكافه أن يستفيد من واحد من أهل بلده أو أقاربه حسدا وبغيا عليه، فهو يعرض عنه ويتكبر عليه مع معرفته بأنه يستحق التواضع له لفضل علمه، ولكن الحسد يبعثه على أن يعامله بأخلاق التكبر، وإن كان في باطنه ليس يرى نفسه فوقه.", "وأما الرياء؛ فهو أيضا يدعو إلى أخلاق المتكبرين حتى إن الرجل ليناظر من يعلم أنه أفضل منه وليس بينه وبينه معرفة ولا محاسدة ولا حقد، ولكن يمتنع من قبول الحق منه ولا يتواضع له في الاستفادة خيفة أن يقول الناس: إنه أفضل منه، فيكون باعثه على التكبر عليه الرياء المجرد، ولو خلا معه بنفسه لكان لا يتكبر عليه، وأما الذي يتكبر بالعجب أو الحسد أو الحقد فإنه يتكبر أيضا عند الخلوة به ما لم يكن معهما ثالث، وكذلك قد ينتمي إلى نسب شريف كاذبا، وهو يعلم أنه كاذب، ثم يتكبر به على من ليس ينسب إلى ذلك النسب، ويترفع عليه في المجالس، ويتقدم عليه في الطريق، ولا يرضى بمساواته في الكرامة والتوقير، وهو عالم باطنا بأنه لا يستحق ذلك، ولا كبر في باطنه لمعرفته بأنه كاذب في دعوى النسب، ولكن يحمله الرياء على أفعال المتكبرين.", "حاشية: (١) تحرفت في (ف) إلى: (الحقد).", "**بيان**", "**أخلاق المتواضعين ومجامع ما يظهر فيه أثر التواضع والتكبر**", "اعلم أن التكبر يظهر في شمائل الرجل، كصعر(١) في وجهه ونظره شزرا(٢)، وإطراق رأسه، وجلوسه متربعا ومتكئا، وفي أقواله حتى في صوته ونغمته، وصيغة إيراده الكلام، ويظهر في مشيه وتبختره وقيامه وجلوسه وحركاته وسكناته وسائر تقلباته في أحواله وأقواله، فمن المتكبرين من يجمع ذلك كله، ومنهم من يتكبر في بعض ذلك ويتواضع في بعضه.", "ومن خصال المتكبر(٣) أن يحب قيام الناس له أو بين يديه، والقيام للإنسان على ضربين: قيام على رأسه وهو قاعد، فهذا منهي عنه قال عليه الصلاة والسلام: «من أحب أن يتمثل له الرجال قياما، فليتبوأ مقعده من النار». وهذه عادة الأعاجم والمتكبرين.", "وقيام عند مجيء الإنسان، وقد كان السلف لا يكادون يفعلون ذلك. قال أنس: لم يكن شخص أحب إليهم من رسول الله ﷺ، وكانوا إذا رأوه لم يقوموا له؛ لما يعلمون من كراهته لذلك؟", "وقد قال العلماء: يستحب القيام للوالدين، والإمام العادل، وفضلاء الناس. واعلم أنه قد صار هذا كالشعار بين الأفاضل، فإذا تركه الإنسان في حق من يصلح أن يفعل في حقه لم يؤمن أن ينسبه إلى إهانته والتقصير في حقه، فيوجب ذلك نوع", "حاشية: (١) الصعر: الميل والازورار.", "حاشية: (٢) نظر شزرا: أي نظر بمؤخر عينه كالمعرض المتغضب.", "حاشية: (٣) في (ف): (المتكبرين)."]], "ic": "book"}, {"story": ["كتاب ذم الكبر والعجب (١٦ من ٣٣)، ص٩١٦", ["حقد، فاستحباب هذا للقائم لا يمنع الذي يقام له أن يكره ذلك ويرى أنه ليس بأهل لذلك.", "ومنها: أن لا يمشي إلا ومعه من يمشي خلفه، وقد كان السلف يكرهون هذا، وقد روينا عن ابن مسعود أن ناسا تبعوه، فقال: ألكم حاجة؟ قالوا: لا، ولكن أردنا أن نمشي معك. قال: فارجعوا، فإنه ذلة للتابع، وفتنة للمتبوع. ومشى قوم خلف الحسن فمنعهم، وكان ابن سيرين لا يترك أحدا يمشي معه.", "ومنها: أن لا يزور أحدا تكبرا على الناس، وقد روينا أن سفيان الثوري قدم الرملة؛ فبعث إليه إبراهيم بن أدهم أن تعال فحدثنا، فجاءهم سفيان، فقيل له: يا أبا إسحاق، تبعث إليه بمثل هذا؟ فقال: أردت أن أنظر كيف تواضعه.", "ومنها: أن يستنكف من جلوس (١-١)من ليس في مرتبته(١-١) إلى جانبه، أو مشيه معه، وقد أنبأنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أبو بكر بن مالك قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا هشيم قال: حدثنا حميد عن أنس قال: إن كانت الأمة من أهل المدينة لتأخذ بيد رسول الله ﷺ، فتنطلق به في حاجتها. وقال ابن وهب: جلست إلى عبد العزيز بن أبي رواد تمس فخذي فخذه، فتحيت نفسي عنه، فأخذ ثيابي فجرني إليه، وقال لي: لم تفعلون بي ما تفعلون بالجبابرة وإني لا أعرف منكم رجلا شرا مني؟!", "ومنها: أن لا يتعاطى بيده شغلا في بيته، وقد أخبرنا هبة الله بن محمد قال: أخبرنا أبو علي التميمي قال: أخبرنا أحمد بن جعفر قال: أخبرنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا وكيع ومحمد بن جعفر قالا: حدثنا شعبة عن الحكم عن إبراهيم عن الأسود قال: قلت لعائشة: ما كان النبي ﷺ يصنع إذا دخل بيته؟ قالت: كان يكون في مهنة(٢) أهله، فإذا حضرت الصلاة خرج فصلى. انفرد بإخراجه البخاري(٣).", "حاشية: (١-١) في (ف) بدلا عنها: (غيره).", "حاشية: (٢) مهنة أهله: خدمة أهله.", "حاشية: (٣) أخرجه البخاري (٦٧٦)، وأحمد (٢٤٢٢٦) و(٢٤٩٤٨).", "وقد روينا عن عمر بن عبد العزيز أنه بات عنده ضيف فكاد السراج يطفأ، فقال الضيف: أقوم فأصلحه؟ فقال له: ليس من كرم الرجل أن يستخدم ضيفه. قال: أفأوقظ الغلام؟ فقال: لا. فقام هو وأصلح المصباح، ثم قال: قمت وأنا عمر، ورجعت وأنا عمر.", "ومنها: أن لا يحمل متاعه من سوقه إلى بيته، وقد اشترى رسول الله ﷺ شيئا وحمله، وكان أبو بكر يحمل الثياب إلى السوق يتجر فيها، واشترى عمر لحما فعلقه بيده وحمله إلى بيته، واشترى علي بن أبي طالب تمرا بدرهم فحمله في ملحفته، فقال له قائل: أحمل عنك؟ قال: لا، أبو العيال أحق أن يحمل. وكان أبو عبيدة بن الجراح يحمل سطلا له إلى الحمام، ودخل حذيفة المدائن وهو أمير عليها وهو راكب على بغل بإكاف وبيده رغيف وعرق(١) وهو يأكله. وأقبل أبو هريرة يوما من السوق وقد حمل حزمة حطب وهو يومئذ خليفة مروان، فقال لرجل: أوسع الطريق للأمير."]], "ic": "book"}, {"story": ["كتاب ذم الكبر والعجب (١٧ من ٣٣)، ص٩١٧", ["ومنها: الترفع في اللباس وقد قال عليه الصلاة والسلام: البذاذة من الإيمان. أشار بذلك إلى الثياب الدون، وكان عمر بن الخطاب يلبس إزارا فيه اثنتا عشرة رقعة، وكان عمر بن عبد العزيز يرقع قميصه من بين يديه ومن خلفه.", "فإن قيل: فقد رويتم عن النبي ﷺ أنه سئل عن الرجل يحب أن يكون ثوبه حسنا أمن الكبر هو؟ قال: لا.", "فالجواب: أن الناس يختلفون في ذلك؛ فمنهم من يقصد الثوب الجميل لنفسه لا ليتكبر به، وعلى هذا يحمل الحديث، ومنهم من يريد بذلك الكبر، والغالب أن من قصد الرفيع لرؤية الناس أراد التكبر.", "ومنها: أن لا يحتمل الأذى، فربما قابل بأوفى منه، وقد ذكرنا في كتاب الغضب فضل الحلم والصفح، وفي الجملة من أراد أن ينفي الكبر ويستعمل التواضع فعليه بسيرة رسول الله ﷺ، وقد سبقت إشارتنا إليها في كتاب آداب المعيشة.", "حاشية: (١) العرق: العظم أخذ عنه معظم اللحم وبقي عليه لحوم رقيقة.", "**بيان**", "**الطريق في معالجة الكبر واكتساب التواضع**", "اعلم أن الكبر من المهلكات، ولا يخلو منه أحد، فمداواته فرض عين.", "وفي معالجته مقامان: أحدهما: استئصال أصله من سنخه(١) وقلع شجرته من مغرسها في القلب.", "**والثاني**: دفع العارض منه بالأسباب الخاصة التي بها يتكبر الإنسان على غيره.", "**المقام الأول في استئصال أصله**: وعلاجه علمي وعملي، ولا يتم الشفاء إلا بمجموعهما.", "**أما العلمي**: فهو أن يعرف نفسه ويعرف ربه، ويكفيه ذلك في إزالة الكبر، فإذا عرف نفسه حق المعرفة علم أنه أذل من كل ذليل، وأنه لا يليق به إلا التواضع والذل، وإذا عرف ربه علم أن العظمة والكبرياء لا تليق إلا بالله سبحانه، وأما معرفته ربه وعظمته فيكفيه أن ينظر في آثار قدرته وعجائب صنعه، فتلوح له العظمة وتظهر له المعرفة، وأما معرفة نفسه فيكفيه أن ينظر في أصل وجوده بعد العدم من تراب ثم من نطفة خرجت من مجرى البول، ثم من علقة، ثم من مضغة، فقد صار شيئا مذكورا وهو من أخس(٢) الموجودات لكونه جمادا لا يسمع ولا يبصر ولا يحس ولا يتحرك، فقد ابتدئ بموته قبل حياته، وبضعفه قبل قوته، وبجهله قبل علمه، وببكمه قبل نطقه، وبعجزه قبل قدرته، وبفقره قبل غناه، وقد أشار الله عز وجل إلى هذا بقوله: ﴿مِنْ أَىِّ شَىْءٍ خَلَقَهُۥ مِن نُّطْفَةٍ خَلَقَهُۥ فَقَدَّرَهُۥ﴾ [عبس: ١٨ ـ ١٩]، ثم امتن عليه بقوله: ﴿ثُمَّ ٱلسَّبِيلَ يَسَّرَهُۥ﴾ [عبس: ٢٠] قوله: ﴿فَجَعَلْنَـٰهُ سَمِيعًا", "حاشية: (١) سنخ كل شيء أصله، والجمع أسناخ.", "حاشية: (٢) تصحفت في (ف) إلى: (أحس)."]], "ic": "book"}, {"story": ["كتاب ذم الكبر والعجب (١٨ من ٣٣)، ص٩١٩", ["بَصِيرًا﴾ [الإنسان: ٢]. فأحياه بعد الموت، وأحسن تصويره وأخرجه إلى الدنيا فأشبعه وأرواه وكساه وهداه وقواه، وإنما أوجده بعد العدم وخلقه من النطفة ليعرفه خساسة ذاته فتبين له آثار نعمه عليه، ومن هذه بدايته فأي وجه لكبره وفخره وبطره؟ على أنه لو أدام له الوجود على اختياره لكان لطغيانه طريق، فأما وقد سلط عليه الأخلاط المتضادة والأمراض الهائلة، ثم بينما بنيانه قد تم وهي وتهدم، فلا يملك لنفسه ضرا ولا نفعا، بينا هو يذكر الشيء نسيه ويستذل (١-١)الشيء فيرديه، ويروم(١-١) الشيء فلا يناله، ثم لا يأمن أن يسلب حياته بغتة، هذا وسط أحواله، وذاك أول أمره، وأما آخر مورده فالموت الذي يعيده جمادا كما كان، ثم يلقى في التراب فيصير جيفة منتنة، ثم تبلى أعضاؤه وتنخر عظامه ويأكل الدود أجزاءه، وأحسن حاله أن يعود ترابا يعمل منه الكيزان، ويعمر منه البنيان، ثم ما أحسن حاله لو ترك، لا بل يحييه بعد طول البلى ليقاسي شدائد البلاء، فيجمع أجزاءه المتفرقة، ويحضره عرصة(٢) القيامة، فيرى أرضا مبدلة، وجبالا مسيرة، وسماء منشقة، ونجوما مكدرة، وشمسا مكورة، وأحوالا مظلمة، وجحيما تزفر، وصحائف تنشر. ويقال له: اقرأ كتابك. فيقول: وما كتابي؟ فيقال: كان قد وكل بك في حياتك التي كنت تفرح بها وتتكبر بنعيمها ملكان يحصيان ما تنطق به أو تعمل من قليل أو كثير وقيام وقعود وأكل وشرب، وقد نسيت ذلك وأحصاه الله، فهلم إلى الحساب عليه، واستعد جوابا له، وإلا فأنت تساق إلى النار. فما لمن هذه حاله والتكبر؟ فإن صار إلى النار، فالبهائم أصلح حالا منه، لأنها تعود إلى التراب آمنة للعذاب، فإن دخل إلى النار فمن يصف قبح منظره، ونتن ريحه وشدة عذابه، ومن هذه حاله وهو على شك من العفو عن خطئه كيف يتكبر؟ ومن الذي يسلم من ذنب يستحق به العقوبة؟ وما مثله إلا كمثل رجل جنى على ملك جناية استحق أن يضرب لأجلها ألف سوط، فحبس في السجن ليخرج فيعاقب، فهو منتظر أن يدعى به لذلك، أفتراه يتكبر على أهل السجن؟ وهل الدنيا إلا سجن؟ وهل المعاصي إلا موجبة للعقاب؟", "حاشية: (١-١) سقط من (ف).", "حاشية: (٢) العرصة: ساحة الدار، أو البقعة الواسعة بين الدور لا بناء فيها.", "فهذا هو العلاج العلمي القالع لأصل الكبر.", "وأما العلاج العملي؛ فهو التواضع بالفعل لله تعالى ولعباده، وذلك بالمواظبة على استعمال أخلاق المتواضعين، وقد روينا عن رسول الله ﷺ أنه كان يأكل على الأرض، ويجيب دعوة المملوك، ويرقع ثوبه ويخصف نعله إلى غير ذلك من أخلاقه الظاهرة، ولا يتم التواضع إلا بالعمل، ولهذا أمر العرب بالصلاة؛ لأنهم كانوا يأنفون من الانحناء، فظهرت مذلتهم بالسجود.", "المقام الثاني: فيما يعرض من التكبر بالأسباب السبعة المذكورة:"]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "الطبيب ينفع بعض الأمراض لا الكل، ويوضح هذا أن ____ الصحابة كانوا خائفين من الآخرة، فكان أبو بكر يقول", "o": ["سادات", "مجاز", "القدر", "استحسن"], "h": "راجع: ص٩٤٠"}, {"t": "fill", "d": 2, "q": "والذي يخلصك من هذا أن تحضر في قلبك عند مشاهدة المبتدع أو الفاسق، أو عند أمرهما بالمعروف ونهيهما عن المنكر ____ أشياء", "o": ["ثلاثة", "والخالق", "الصبر", "الغيبة"], "h": "راجع: ص٩٢٥"}, {"t": "fill", "d": 2, "q": "وروي عن ابن مسعود أنه قال: الهلاك في اثنتين القنوط والعجب. وإنما جمع بينهما لأن السعادة لا ____ إلا بالطلب والتشمير، والقانط لا يطلب، والمعجب يظن أنه قد ظفر بمراده، فلا", "o": ["تنال", "ربما", "حذرك", "تميل"], "h": "راجع: ص٩٣٢"}, {"t": "fill", "d": 2, "q": "وقال أبو بكر الهذلي: بينما نحن مع الحسن، إذ مر عليه ابن الأهتم، يريد المقصورة، وعليه جباب خز قد نضد بعضها على بعض على ساقه وهو يمشي يتبختر، فنظر إليه الحسن فقال: أف أف، شامخ بأنفه، ثاني ____، مصعر", "o": ["عطفه", "اقتضى", "داراه", "تفهيم"], "h": "راجع: ص٨٩٦"}, {"t": "fill", "d": 2, "q": "وفي أفراد مسلم من حديث ابن ____ عن النبي ﷺ قال", "o": ["مسعود", "الأحوال", "نفسه", "يتخلفون"], "h": "راجع: ص٨٩٣"}, {"t": "fill", "d": 2, "q": "الامتحان الرابع: أن يحمل حاجة نفسه وحاجة أهله ورفقائه من السوق إلى البيت، فإن أبت نفسه ذلك فهو كبر ورياء، فإن كان لا ____ إلا عند مشاهدة الناس، فهو رياء، وكل ذلك من أمراض القلب وعلله المهلكة له", "o": ["يثقل", "يتظاهر", "الثدي", "كالخوف"], "h": "راجع: ص٩٢٩"}]}, {"t": "كتاب ذم الكبر والعجب - القسم ٤ من ٦", "b": [{"story": ["كتاب ذم الكبر والعجب (١٩ من ٣٣)، ص٩٢٠", ["وقد ذكرنا في كتاب ذم الجاه أن الكمال الحقيقي هو العلم والعمل، وما عداه مما يفنى بالموت فكمال وهمي، فمن هذا يعسر على العالم أن لا يتكبر، ولكنا نذكر طريق(١) العلاج من العلم والعمل في جميع الأسباب السبعة:", "فنبدأ بالنسب، فنقول: من اعتراه الكبر من جهة النسب، فليداوي قلبه بمعرفة أمرين:", "**أحدهما**: أن هذا تعزز بكمال غيره، ولذلك قيل:", "لئن فخرت بآباء ذوي شرف  لقد صدقت ولكن بئس ما ولدوا", "وكيف يجبر الخسيس في صفات ذاته خسته بكمال غيره؟!", "**والثاني**: أن يعرف نسبه الحقيقي، فيعرف أباه وجده، فإن أباه القريب نطفة قذرة، وجده البعيد تراب ذليل، فأخس الأشياء ما إليه انتسابه.", "**السبب الثاني**: الكبر بالجمال: ودواؤه أن ينظر إلى باطنه نظر العقلاء، ولا ينظر إلى ظاهره نظر البهائم، ومتى نظر إلى باطنه رأى من القبائح ما يكدر تعززه بجماله فإن الرجيع في أمعائه والبول في مثانته، والبصاق في فيه، والمخاط في أنفه، والوسخ في أذنيه، والدم في عروقه، والريح المنتنة في مغابنه، يتردد إلى الخلاء، ويغسل آثار الأنجاس، ويعلم ما يخرج منه، ثم قد علم أنه قد خلق من", "حاشية: (١) ليست في (ف).", "الأقذار الشنيعة من نطفة ودم حيض وأجري في مجاري الأقذار، ولولا تعاهده لنفسه بتنظيف ظاهره لكان أقذر من البهائم بكثير، ثم سيصير جيفة أقذر من كل قذر، فكيف يفتخر بجماله الذي هوكخضراء الدمن(١)، ثم هو بعرض التغير، ثم كيف يحسن أن يفتخر على من نقصه ليس إليه؟ ومن تأمل هذه الأمور أخرجت من قلبه داء الكبر بالجمال.", "**السبب الثالث**: التكبر بالقوة: ويدفع ذلك أن يعلم أنه لو آلمه عرق عاد أعجز من كل عاجز، وأن حمى يوم تحلل من قوته مالا يعود في مدة، وأن شوكة لو دخلت في رجله لأعجزته، وبقة لو دخلت في أذنه لقلقلته، ثم هو يمشي إلى الضعف ويدنو من العجز، كما قال شاب لشيخ رآه يمشي كالمقيد فقال: يا شيخ، من قيدك؟ قال: الذي خلفته يفتل قيدك.", "ثم أي فخر في صفة تسبق إليها البهائم، فإن الفيل والجمل أقوى من الآدمي.", "**السبب الرابع**: الغنى وكثرة المال: وفي معناه كثرة الأتباع والأنصار، والتكبر بتولية السلطان، وكل ذلك تكبر بمعنى خارج عن ذات الإنسان، وهو أقبح أنواع الكبر، فإن المتكبر بماله يتكبر بفرسه وداره، ولو مات فرسه وانهدمت داره عاد ذليلا، والمتكبر بتمكين السلطان له في الولاية بنى أمره على قلب هو أشد تقلبا من الريشة في أرض صفصف(٢) في يوم ريح عاصف، فإن تغير عليه عاد أذل الخلق، والمتكبر بالغنى لو تأمل خلقا من اليهود وجدهم أغنى منه فأف لشرف يسبقك به اليهود، ويستلبه السارق في لحظة، فيعود صاحبه ذليلا."]], "ic": "book"}, {"story": ["كتاب ذم الكبر والعجب (٢٠ من ٣٣)، ص٩٢١", ["فهذه أسباب ليست في ذات الإنسان، وقد علم أن ما في ذاته ليس إليه دوام وجوده، وكل ما ليس إليك فليس لك، وكل الأشياء لواهبها، إن أبقاها بقيت، وإن استرجعها زالت، وإنما أنت عبد مملوك لا تقدر على شيء، ومن عرف هذا زال كبره، فإن الإنسان لو افتخر بماله ومنازله وغلمانه وخيله وحريته فشهد شاهدان", "حاشية: (١) خضراء الدمن: الشجرة الخضراء في المنبت السوء، تكون سريعة الفساد ولا تثمر.", "حاشية: (٢) أرض صفصف: فلاة لا نبات فيها.", "عدلان عند الحاكم أنه رقيق لفلان وأن أبويه كانا مملوكين له، فحكم بذلك الحاكم وجاء مالكه فأخذه وما في يديه، وهو يخشى مع ذلك أن ينكل به في العقوبة لتفريطه في ماله وتقصيره عن طلب مالكه، فحبسه في منزل قد أحاطت به الحيات والهوام، فبقي لا يملك نفسه ولا ماله ولا يعرف طريقا للخلاص، فهل يحسن بهذا أن يفتخر أو يذل ويخضع؟ وهذه صفة الآدمي إذا تفكر في نفسه وماله وأنه لا يملك من ذلك شيئا، ثم هو بين آفات وشهوات وأمراض هي كالحيات والعقارب، ومن هذه حاله لا يتكبر بقدرته وقوته، إذ لا قدرة له ولا قوة.", "فهذا طريق علاج التكبر بالأسباب، وهو أهون من علاج التكبر بالعلم والعمل، فإنهما كمالان في النفس جديران بأن يفرح بهما، ولكن في التكبر بهما أيضا نوع من الجهل خفي على ما سنذكره.", "**السبب الخامس**: التكبر بالعلم: وهو أعظم الآفات، وأغلب الأدواء، وأبعدها عن قبول العلاج إلا بعد جهد جهيد، وهذا لأن قدر العلم عظيم عند الله وعند الناس فهو أعظم من قدر المال والجمال وغيرهما، بل لا قدر لهما أصلا إلا إذا كان معهما علم وعمل، فالعالم عاجز عن أن لا يستعظم نفسه بالإضافة إلى الجاهل مع معرفته بفضل العلم، ولن يقدر العالم على دفع الكبر إلا بمعرفة أمرين:", "**أحدهما**: أن يعلم أن حجة الله على أهل العلم آكد، وأنه يغفر للجاهل سبعون ذنبا قبل أن يغفر للعالم ذنب واحد؛ لأن من عصى عن معرفة وعلم فجنايته(١) أفحش؛ إذ لم يقض حق نعمة الله عليه في العلم، وقد مثل الله عز وجل من لا يعلم ولا يعمل بالكلب والحمار فقال في بلعام(٢): ﴿وَٱتْلُ عَلَيْهِمْ نَبَأَ ٱلَّذِىٓ ءَاتَيْنَـٰهُ ءَايَـٰتِنَا فَٱنسَلَخَ مِنْهَا﴾ إلى قوله: ﴿فَمَثَلُهُۥ كَمَثَلِ ٱلْكَلْبِ إِن تَحْمِلْ عَلَيْهِ يَلْهَثْ أَوْ تَتْرُكْهُ", "حاشية: (١) تصحفت في (ف) إلى: (خيانته).", "حاشية: (٢) هو بلعام بن باعوراء، يقال إنه كان يعلم الاسم الأعظم، وإن قومه سألوه أن يدعو على موسى عليه السلام، فلما أجابهم جعل لسانه لا يطيعه بل ينطلق بالدعاء على نفسه وقومه ينظر تفسير ابن كثير ٣/ ٥٠٧ ـ ٥١٢."]], "ic": "book"}, {"story": ["كتاب ذم الكبر والعجب (٢١ من ٣٣)، ص٩٢٣", ["يَلْهَثْ﴾ [الأعراف: ١٧٦]، وقال في اليهود: ﴿مَثَلُ ٱلَّذِينَ حُمِّلُوا۟ ٱلتَّوْرَىٰةَ ثُمَّ لَمْ يَحْمِلُوهَا كَمَثَلِ ٱلْحِمَارِ يَحْمِلُ أَسْفَارًۢا﴾ [الجمعة: ٥]، وفي الصحيحين من حديث أسامة بن زيد عن النبي ﷺ أنه قال: «يجاء بالرجل يوم القيامة فيلقى في النار، فتندلق أقتابه، فيدوركما يدور الحمار برحاه، فيجتمع أهل النار عليه، فيقولون: أي فلان، ما شأنك؟ أليس كنت تأمرنا بالمعروف وتنهانا عن المنكر؟ فيقول: كنت آمركم بالمعروف ولا آتيه، وأنهاكم عن المنكر وآتيه».", "ويكفي العالم هذا الخطر، فأي عالم لم يأمر بما لم يأته؟", "فمتى خطر للعالم عظم قدره بالإضافة إلى الجاهل، فليتفكر في الخطر العظيم الذي هو بصدده، فإن خطره أعظم من خطر غيره، كما أن قدره أعظم من قدر غيره، فهذا بذاك، وهو كالملك المخاطر بروحه في ملكه لكثرة أعدائه، فإنه إذا أخذ وقهر ود لو كان فقيرا، فكم من عالم يود في الآخرة سلامة الجهال، ولا ينتهي العالم إلى أن يكون أكبر من الصحابة، وقد كان أحدهم يقول: ليتني كنت طائرا. ويقول الآخر: ليتني كنت تبنة(١). ويقول الآخر: ليتني إذا مت لا أبعث.", "وكذلك لخوف خطر العاقبة، فمتى أخطر العالم بخاطره ذكر خطره زال كبره ورأى نفسه كأنه شر الخلق، ومثاله مثال عبد أمره سيده بأوامر فشرع فيها وترك بعضها وأدخل النقصان في بعضها، وشك في بعضها هل أداه على ما يرتضيه سيده أم لا؟ فأخبره مخبر أن مولاه مرسل إليه رسولا يخرجه من كل ما هو فيه عريانا ذليلا، ويلقيه على بابه في الشمس والحر زمانا طويلا حتى إذا ضاق عليه الأمر وبلغ به الجهد أمر برفع حسابه وفتش عن جميع أعماله قليلها وكثيرها، ثم أمر به إلى سجن ضيق وعذاب دائم، وقد علم أن سيده قد فعل بطوائف من عبيده مثل ذلك وعفا عن بعضهم، وهو لا يدري هل يعفى عنه أم لا؟ فإذا تفكر في ذلك انكسرت نفسه، وبطل كبره، وظهر خوفه وتواضع لكل الخلق لعل واحدا منهم يكون من شفعائه إن نزل به عذاب، فكذلك العالم إذا تفكر فيما ضيعه من أوامر ربه بجناياته الظاهرة", "حاشية: (١) سيرد بعد قليل أن عمر رضي الله عنه هو الذي كان يقول ذلك.", "بجوارحه وذنوبه الباطنة من الرياء والعجب والنفاق وغير ذلك، وعلم ما هو بصدده من الخطر العظيم فارقه الكبر.", "**الثاني**: أن العالم يعلم أن الكبر لا يليق إلا بالله سبحانه وأنه إذا تكبر صار ممقوتا عند الله بغيضا(١)، وقد أحب الله منه أن يتواضع، وقال له: إن لك عندي قدرا ما لم تر لنفسك قدرا، فإن رأيت لنفسك قدرا فلا قدر لك. فلابد أن يكلف نفسه ما يحب مولاه، وهذا يزيل التكبر عن قلبه، ولو تيقن أنه لا ذنب له؛ فإن من نازع الله رداء الكبرياء قصمه.", "فإن قيل: كيف يصح للعالم أن يتواضع للفاسق والمبتدع ويرى نفسه دونهما، فإذن يكون جاهلا بقدر العلم؟"]], "ic": "book"}, {"story": ["كتاب ذم الكبر والعجب (٢٢ من ٣٣)، ص٩٢٤", ["فالجواب: أنه إنما يمكن ذلك بالتفكر في خطر الخاتمة، فإنه لو رأى كافرا تصور إسلام ذلك وكفره هو، وكذلك إذا رأى مبتدعا تصور هدايته وضلال نفسه، فالعواقب مطوية عن العباد، وإذا رأى جاهلا قال: هذا عصى الله بجهل وأنا عصيته بعلم، فهو أعذر مني. وإن نظر إلى أكبر منه قال: هذا أطاع الله قبلي. وإن نظر إلى صغير قال: إني عصيت الله قبله.", "فإن قال قائل: قد أمرت ببغض المبتدع والفاسق فكيف أتواضع لهما؟", "فالجواب: أن هذا قد يشتبه على أكثر الناس لامتزاج الغضب لله سبحانه في إنكار البدعة والفسق بكبر النفس والإذلال بالعلم والورع، فكم من عابد جاهل وعالم مغرور إذا رأى فاسقا قد جلس إلى جنبه أزعجه من مكانه وتنزه عنه لكبر باطن في نفسه(٢)، وهو يظن أنه قد غضب لله، وذلك أن التكبر على المطيع شر، فالحذر منه ممكن، فأما التكبر على الفاسق والمبتدع فإنه يشبه الغضب لله وهو خير، فإن الغضبان يتكبر على من غضب عليه، والمتكبر يغضب فهما ممتزجان وملتبسان لا يميز بينهما إلا الموفقون.", "حاشية: (١) تصحفت في (ف) إلى: (تغيظا).", "حاشية: (٢) في (ف): (قلبه).", "والذي يخلصك من هذا أن تحضر في قلبك عند مشاهدة المبتدع أو الفاسق، أو عند أمرهما بالمعروف ونهيهما عن المنكر ثلاثة أشياء:", "أحدها: التفاتك إلى ما سبق من ذنوبك وخطاياك، ليصغر عند ذلك قدرك في عينك.", "والثاني: أن تكون ملاحظتك لما أنت متميز به من العلم واعتقاد الحق والعمل الصالح من حيث أن ذلك نعمة من الله عليك وله المنة فيه لا لك، فترى ذلك منه حتى لا تعجب بنفسك، وإذا لم تعجب لم تتكبر.", "والثالث: ملاحظة إبهام عاقبتك وعاقبته، فربما ختم له بالخير ولك بالشر، وذلك يشغلك عن التكبر عليه.", "فإن قلت: فكيف أغضب مع هذه الأحوال؟"]], "ic": "book"}, {"story": ["كتاب ذم الكبر والعجب (٢٣ من ٣٣)، ص٩٢٥", ["فأقول: تغضب لمولاك إذا أمرك أن تغضب لا لنفسك، وأنت في غضبك لا ترى نفسك ناجيا وصاحبك هالكا، بل يكون خوفك على نفسك بما علم الله من خفايا ذنوبك أكثر من خوفك عليه مع الجهل بالخاتمة، وأعرفك ذلك بمثال لتعلم أنه ليس من ضرورة الغضب لله أن تتكبر على المغضوب عليه وترى قدرك فوق قدره. أقول: إذا كان للملك غلام وولد هو قرة عينه، وقد وكل الغلام بالولد وأمره أن يضربه إذا أساء، ويغضب عليه، فإن الغلام يغضب على الولد كلما أساء، ويكون غضبه لمولاه، ولأنه أمره بذلك، ويطلب بالغضب التقرب إلى سيده من غير أن يتكبر على الولد؛ لأن الولد أعز منه لا محالة، فليس من ضرورة الغضب التكبر، فكذلك يمكنك أن تنظر إلى المبتدع والفاسق وتظن أنه ربما كان قدرهما عند الله في الآخرة أعظم، لجواز أن يكون سبقت لهما الحسنى ولك الشر، فتغضب بحكم الأمر محبة لمولاك، إذ جرى ما يكرهه، مع التواضع لمن يجوز أن يكون عنده أقرب منك في الآخرة، فهكذا يكون بعض العلماء الأكياس فينضم إليه الخوف والتواضع، فأما المغرور فإنه يتكبر ويرجو لنفسه أكثر مما يرجو لغيره مع جهل العاقبة، وذلك غاية الغرور، فهذا سبيل التواضع لمن عصى الله أو اعتقد البدعة مع الغضب عليه ومجانبته بحكم الأمر.", "السبب السابع: التكبر بالورع والعبادة: وذلك من أعظم الفتن على العباد، وعلاجه أن يلزم العابد قلبه التواضع لجميع العباد، فإذا رأى عالما تواضع له لما قد عرف من فضيلة العلم، فقد قال رسول الله ﷺ: «فضل العالم على العابد كفضلي على أدناكم».", "فإن قال العابد: إنما ذلك لعالم عامل بعلمه، فما تقول في عالم فاجر؟", "فيقال له: إن الحسنات يذهبن السيئات، وكما أن العلم حجة على العالم، فهو وسيلة له، وكفارة لذنوبه، وإذا كان الأمر في ذلك غائبا عنا لزمنا التواضع لصورة العلم.", "فإن قيل: فهذا الخبر الذي ذكرتموه يقتضي أن يرى العالم نفسه فوق العابد.", "فالجواب: أن خوف العالم من العواقب يمنعه من ذلك، إذ من الجائز أن يموت على حالة تكون حالة الجاهل الفاسق خيرا منها، فربما كان ذلك لذنب يحسبه هينا وهو عند الله عظيم قد أوجب له المقت، كما قال الحسن: أخاف أن يكون اطلع علي في بعض ذنوبي، فقال: اذهب لا غفرت لك.", "على أنه ينبغي للعالم والعابد أن يكون كل واحد منهما خائفا على نفسه راجيا لغيره، فيندفع التكبر، فهذه حال العابد مع العالم."]], "ic": "book"}, {"story": ["كتاب ذم الكبر والعجب (٢٤ من ٣٣)، ص٩٢٦", ["فأما مع غير العالم، فهم ينقسمون في حقه إلى مستورين وإلى مكشوفين، فينبغي أن لا يتكبر على المستور، فلعله أقل منه ذنوبا، وأكثر منه عبادة، وأشد منه حبا لله تعالى، وأما المكشوف حاله فما يمكنك أن تقول: إن ذنوبه أكثر من ذنوبي؟ لأن عدد الذنب من الجهتين غير ممكن، بلى يمكن أن يعلم أن ذنوبه أشد كالقتل والشرب والزنا، ومع ذلك فلا ينبغي أن يتكبر عليه، إذ ذنوب القلب من الكبر والرياء ومساكنة الوساوس في صفات الحق كلها شديد، وربما أوجب بعضها المقت، وربما حصلت من ذلك الفاسق طاعات كالخوف لله والحب له والإخلاص في الأعمال تكفر عنه قبائحه، فإذا انكشف الغطاء في القيامة رأيته فوقك بدرجات وربما سلم وهلكت.", "والإمكان البعيد فيما عليك ينبغي أن يكون قريبا عندك إن كنت مشفقا على نفسك، فلا تتفكر فيما هو ممكن لغيرك، بل فيما هو مخوف في حقك، فإنه لا تزر وازرة وزر أخرى، وعذاب غيرك لا يخفف شيئا عن عذابك، فإذا تفكرت في هذا الخطر كان عندك شغل شاغل عن التكبر وعن أن ترى نفسك فوق غيرك.", "واعلم أنه من جوز أن يكون عند الله شقيا، فلا سبيل له إلى التكبر، ومن غلبه الخوف رأى كل أحد خيرا منه، أخبرنا محمد بن أبي منصور وعلي بن أبي عمر قالا: أخبرنا طراد بن محمد ورزق الله قالا: أخبرنا أبو الحسين بن بشران قال: أخبرنا ابن صفوان. قال: حدثنا عبد الله بن محمد القرشي قال: حدثني إبراهيم بن سعيد قال: حدثني صبيح الفرغاني قال: حدثنا مخلد بن الحسين عن الجلد بن أيوب قال: كان عابد في بني إسرائيل في صومعته منذ ستين سنة، وأنه أتي في منامه فقيل له: إن فلانا الإسكاف خير منك. فلما انتبه قال: رؤيا، ثم سكت، فلما كان من القابلة رأى مثل ذلك في منامه، فلم يزل يرى في منامه مرارا حتى تبين له أنه أمر فنزل من صومعته فأتى الإسكاف، فلما رآه الإسكاف قام من عمله وتلقاه وجعل يتمسح به، وقال له: ما أنزلك من صومعتك؟ قال: أنت أنزلتني، أخبرني ما عملك؟ فكأنه كره أن يخبره ثم قال: أجل، أعمل النهار وأكسب، فما رزق الله من شيء أتصدق بنصفه، وأكل مع عيالي النصف، وأصوم النهار. فانطلق من عنده، فلما كان أيضا قيل للراهب(١): سله مم صفرة وجهه؟ فأتاه فقال: مم صفرة وجهك؟ فقال: إني رجل لا يكاد يرفع لي أحد إلا ظننت أنه في الجنة وأنا في النار. قال: فإنما فضل على الراهب بإزرائه على نفسه."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "وقال أبو سليمان الداراني: سمعت أبا جعفر يبكي في خطبته، فحضرتني نية في أن أقوم إليه فأكلمه بما أعرف من فعله إذا نزل، ثم ____ في أني أقوم إلى خليفة أعظه والناس جلوس، فيرمقوني بأبصارهم، فيتداخلني", "o": ["تفكرت", "تكبرا", "مكيدة", "وحصول"], "h": "راجع: ص٩٣٢"}, {"t": "fill", "d": 2, "q": "فإن أعجب برأيه وعلمه وعقله، فإن ذلك العجب يمنعه من الازدياد مما به عجب، فيقتنع بما عنده، ____ من التعلم والاستشارة، وربما عجب برأي فاسد، ويمنعه العجب من سماع قول نصيح، ولهذا قال الحكماء", "o": ["ويستنكف", "فعليكم", "يعتابه", "أمانته"], "h": "راجع: ص٩٣٣"}, {"t": "fill", "d": 2, "q": "السبب الرابع: الغنى وكثرة المال: وفي معناه كثرة الأتباع والأنصار، والتكبر بتولية السلطان، وكل ذلك تكبر بمعنى خارج عن ذات الإنسان، وهو أقبح ____ الكبر، فإن المتكبر بماله يتكبر بفرسه وداره، ولو", "o": ["أنواع", "صدرك", "أتبع", "وألفاظه"], "h": "راجع: ص٩٢١"}, {"t": "fill", "d": 2, "q": "والثالث: ملاحظة إبهام عاقبتك وعاقبته، فربما ختم له ____ ولك بالشر، وذلك يشغلك عن التكبر", "o": ["بالخير", "يرقى", "المطول", "تأنفين"], "h": "راجع: ص٩٢٥"}, {"t": "fill", "d": 2, "q": "وروى أبو أمامة عن النبي ﷺ أنه قال: «ما من أحد إلا ومعه ملكان، وعليه حكمة يمسكانها، فإن هو رفع رأسه جبذاها ثم قالا: اللهم ضعه، وإن وضع ____ قالا: اللهم", "o": ["نفسه", "بالبذل", "ثواب", "يجافي"], "h": "راجع: ص٨٩٨"}, {"t": "fill", "d": 2, "q": "أخبرنا عبد الأول بن عيسى قال: أخبرنا الداودي قال: أخبرنا ابن أعين السرخسي قال: أخبرنا الفربري قال: أخبرنا البخاري قال: حدثنا أحمد بن يونس قال: حدثنا ____ قال: حدثنا موسى بن عقبة عن سالم عن أبيه عن", "o": ["زهير", "الزرع", "يبقى", "سوقة"], "h": "راجع: ص٨٩٥"}]}, {"t": "كتاب ذم الكبر والعجب - القسم ٥ من ٦", "b": [{"story": ["كتاب ذم الكبر والعجب (٢٥ من ٣٣)، ص٩٢٧", ["والذي يدل على فضيلة هذه الخصلة قوله تعالى: ﴿يُؤْتُونَ مَآ ءَاتَوا۟ وَّقُلُوبُهُمْ وَجِلَةٌ﴾ [المؤمنون: ٦٠]، أي يؤتون الطاعات وهم على وجل من قبولها، وقوله تعالى: ﴿إِنَّ ٱلَّذِينَ هُم مِّنْ خَشْيَةِ رَبِّهِم مُّشْفِقُونَ﴾ [المؤمنون: ٥٧]، وقد وصف الله الملائكة مع سلامتهم من الذنوب ومواظبتهم على العبادة بالإشفاق، فقال تعالى: ﴿يُسَبِّحُونَ ٱلَّيْلَ وَٱلنَّهَارَ لَا يَفْتُرُونَ﴾ [الأنبياء: ٢٠] ﴿وَهُم مِّنْ خَشْيَتِهِۦ مُشْفِقُونَ﴾ [الأنبياء: ٢٨].", "حاشية: (١) أي: قيل له في الرؤيا.", "واعلم أنه إذا زال الخوف مما سبق به القضاء حصل الأمن من فكر الله فوقع الكبر، وهو سبب الهلاك، فإذن ما يفسده العابد بإضمار الكبر واحتقار الخلق أكثر مما يصلحه بظاهر الأعمال.", "فهذه معارف بها يزال داء الكبر، إلا أن النفس بعد هذه المعرفة قد تضمر التواضع وتدعي البراءة من التكبر، وهي كاذبة، فإذا جاء الابتلاء عادت إلى طبعها، فلا ينبغي أن يكتفى بمجرد المعرفة، بل ينبغي أن تكمل بالعمل وتجرب بأفعال المتواضعين في مواقع هيجان الكبر من النفس، وبيانه أن يمتحن النفس بامتحانات خمسة هي أدلة على استخراج ما في الباطن:", "**الأول**: أنه إذا تكلم في مسألة مع بعض أقرانه، فظهر شيء من الحق على لسان القرين، فثقل عليه قبوله والانقياد له والاعتراف له والشكر على تنبيهه وتعريفه، فذلك يدل على أن فيه كبرا دفينا، فليتق الله وليشتغل بعلاجه، إما من حيث العلم فبأن يذكر نفسه خسة نفسه وخطر عاقبته، وأن الكبر لا يليق إلا بالله تعالى، وإما بالمال فبأن يكلف نفسه ما ثقل عليه من الاعتراف بالحق، فيطلق اللسان بالحمد والثناء، ويقر على نفسه بالعجز، ويشكره على الاستفادة، ويقول: ما أحسن ما تفطنت له، وقد كنت غافلا عنه فجزاك الله خيرا كما نبهتني له، فالحكمة ضالة المؤمن، فإذا وجدها فينبغي أن يشكر من دله عليها، فإذا واظب على ذلك مرات متوالية صار ذلك طبعا، ومتى ثقل عليه الثناء على أقرانه بما فيهم، ففيه كبر، فإن كان ذلك لا يثقل عليه في الخلوة ويثقل عليه في الملأ، فليس فيه كبر، وإنما فيه رياء، فليعالج الرياء بما ذكرناه من دوائه، وإن ثقل عليه في الخلوة والملأ جميعا، ففيه الكبر والرياء جميعا، ولا ينفعه الخلاص من أحدهما ما لم يتخلص من الثاني، فليعالج كلا الداءين فإنهما جميعا مهلكان.", "**الامتحان الثاني**: أن يجتمع مع الأقران والأمثال في المحافل، فيقدمهم على نفسه، ويمشي خلفهم، ويجلس دونهم، فإن ثقل عليه ذلك، فهو متكبر، فليواظب عليه تكلفا حتى يسقط عنه ثقله، فبذلك يزايله الكبر. وهاهنا للشيطان مكيدة؛ وهو أن يجلس في صف النعال، أو يجعل بينه وبين الأقران بعض الأراذل، فيظن أن"]], "ic": "book"}, {"story": ["كتاب ذم الكبر والعجب (٢٦ من ٣٣)، ص٩٢٩", ["ذلك تواضع وهو عين الكبر، فإن ذلك يخف على نفوس المتكبرين إذ يوهمون أنهم تركوا مكانهم بالاستحقاق والتفضيل، فيكون قد تكبر، وتكبر بإظهار التواضع أيضا، بل ينبغي أن يقدم أقرانه ويجلس إلى جانبهم، ولا ينحط عنهم في صف النعال، فذلك هو الذي يخرج خبث الكبر من الباطن.", "**الامتحان الثالث**: أن يجيب دعوة الفقير، ويمر إلى السوق في حاجة الرفقاء والأقارب، فإن ثقل ذلك عليه فهو كبر؛ لأن هذه الأفعال من مكارم الأخلاق، وثوابها جزيل، فنفور النفس عنها ليس إلا لخبث في الباطن، فليشتغل بإزالته بالمواظبة عليه، مع تذكر جميع ما ذكرناه من المعارف التي تزيل داء الكبر.", "**الامتحان الرابع**: أن يحمل حاجة نفسه وحاجة أهله ورفقائه من السوق إلى البيت، فإن أبت نفسه ذلك فهو كبر ورياء، فإن كان لا يثقل إلا عند مشاهدة الناس، فهو رياء، وكل ذلك من أمراض القلب وعلله المهلكة له إن لم يتدارك، وقد أهمل الناس طب القلوب واشتغلوا بطب الأجساد، مع أن الأجساد قد كتب عليها الموت والقلوب دائمة السلامة، وقد ذكرنا في أخلاق المتواضعين أنهم كانوا يحملون حاجات نفوسهم.", "**الامتحان الخامس**: أن يلبس ثياب بذلة، فإن نفور النفس عن ذلك في الملأ رياء، وفي الخلوة كبر، وقد كان النبي ﷺ يلبس الصوف، ويحلب الشاة، ويلعق أصابعه، ويجيب دعوة المملوك، وقيل لأبي موسى الأشعري: إنهم يتخلفون عن الجمعات بسبب ثيابهم(١). فلبس عباءة فصلى فيها بالناس.", "وكان لعمر بن عبد العزيز مسح(٢) يلبسه بالليل.", "وقد بينا أن ما يختص بالملأ فهو الرياء، وما يكون في الخلوة فهو الكبر، فليعرف ذلك، فإن من لا يعرف الشر لا يتقيه، ومن لا يدرك المرض لا يداويه.", "حاشية: (١) أي سبب ابتذالها واهترائها فهم يستحيون الحضور فيها إلى الجمعات.", "حاشية: (٢) المسح: كساء من صوف أسود.", "**بيان**", "**غاية الرياضة في خلق التواضع**", "اعلم أن هذا الخلق كسائر الأخلاق، له طرفان ووسط، فطرفه الذي يميل إلى الزيادة يسمى: تكبرا، وطرفه الذي يميل إلى النقصان يسمى: تخاسسا ومذلة، والوسط يسمى تواضعا."]], "ic": "book"}, {"story": ["كتاب ذم الكبر والعجب (٢٧ من ٣٣)، ص٩٣٠", ["والمحمود أن يتواضع في غير مذلة، ومن غير تخاسس، فخير الأمور أوساطها، فمن تقدم على أمثاله فهو متكبر، ومن تأخر عنهم فهو متواضع؛ لأنه قد وضع شيئا من قدره، فإذا دخل على العالم إسكاف فتنحى له عن مجلسه وأجلسه فيه، ثم قدم له نعله ومشى خلفه إلى باب الدار، فهذا تخاسس وتذلل، وذلك غير محمود، بل المحمود العدل، وهو أن يعطي كل ذي حق حقه، فينبغي أن يتواضع بمثل هذا لأمثاله ولمن يقرب منه درجته، فبهذا يكون متواضعا، فإن فعل ذلك وليس يخف عليه، فهو متكلف للتواضع لا متواضع؛ لأن الخلق ما صدر بسهولة من غير روية، وأما تواضعه للسوقي فبالقيام والبشر في الكلام، والرفق في السؤال، وإجابة دعوته، والسعي في حاجته وأمثال ذلك، وأن لا يرى نفسه خيرا منه، بل يكون على نفسه أخوف منه على غيره، فلا يحقره ولا يستصغره، ولأنه لا يعرف الخاتمتين، فمن نزل عن مراعاة قدره جدا، فقد خرج إلى طرف النقصان، فليرفع نفسه، فليس للمؤمن أن يذل نفسه على أن الميل إلى النقصان أهون من الميل إلى طرف الزيادة بالتكبر، كما أن الميل إلى طرف التبذير في المال أحمد من الميل إلى البخل، فالتبذير والبخل مذمومان، وأحدهما أفحش، وكذلك التكبر والتذلل والمحمود العدل.", "**الشطر الثاني من الكتاب**", "**في العجب**", "وفيه بيان ذم العجب، وآفته، وبيان حقيقة العجب والإدلال وحدهما، وبيان صلاح العجب على الجملة، وبيان أقسام ما به العجب، وتفصيل علاجه.", "**بيان**", "**ذم العجب وآفاته**", "العجب مذموم في القرآن والسنة، وقال الله تعالى: ﴿وَيَوْمَ حُنَيْنٍ إِذْ أَعْجَبَتْكُمْ كَثْرَتُكُمْ﴾ [التوبة: ٢٥] فذكر ذلك في معرض الإنكار عليهم، وقال تعالى: ﴿لَا تُبْطِلُوا۟ صَدَقَـٰتِكُم بِٱلْمَنِّ وَٱلْأَذَىٰ﴾ [البقرة: ٢٦٤]، والمن نتيجة استعظام الصدقة واستعظامها هو العجب بها، وفي الصحيحين من حديث أبي هريرة عن النبي ﷺ أنه قال: «بينا رجل يتبختر في بردين وقد أعجبته نفسه فخسف به الأرض، فهو يتجلجل(١) فيها حتى يوم القيامة».", "وقال ﷺ: «ثلاث مهلكات: شح مطاع، وهوى متبع، وإعجاب المرء بنفسه».", "أنبأنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا عبد الرحمن بن مهدي قال: حدثنا سليمان بن المغيرة عن ثابت عن عبد الرحمن بن أبي ليلى عن صهيب", "حاشية: (١) تصحفت في (ف) إلى: (يتخلخل)."]], "ic": "book"}, {"story": ["كتاب ذم الكبر والعجب (٢٨ من ٣٣)، ص٩٣٢", ["قال: كان رسول الله ﷺ إذا صلى همس شيئا لا أفهمه ولا يخبرنا به، فقال: «أفطنتم لي؟» قلنا: نعم. قال: «إني ذكرت نبيا من الأنبياء أعطي جنودا من قومه، فقال: من يكافئ هؤلاء ـ أو: من يقوم لهؤلاء؟ ـ أو غيرها من الكلام، فأوحي إليه: أن اختر لقومك إحدى ثلاث: إما أن نسلط عليهم عدوا من غيرهم، أو الجوع، أو الموت؟ فاستشار قومه في ذلك، فقالوا: أنت نبي الله نكل ذلك إليك خر لنا. فقام إلى صلاته فصلى ما شاء الله ثم قال: أي رب، أما عدو من غيرهم فلا، أو الجوع فلا، ولكن الموت. فسلط عليهم الموت، فمات منهم سبعون ألفا، فهمسي الذي ترون أني أقول: اللهم بك أقاتل، وبك أصاول، ولا حول ولا قوة إلا بالله»(١).", "وروي عن النبي ﷺ أنه قال: «لو لم تذنبوا لخشيت عليكم ما هو أكبر من ذلك العجب العجب». فجعل العجب أكبر من الذنوب.", "وروي عن ابن مسعود أنه قال: الهلاك في اثنتين القنوط والعجب. وإنما جمع بينهما لأن السعادة لا تنال إلا بالطلب والتشمير، والقانط لا يطلب، والمعجب يظن أنه قد ظفر بمراده، فلا يسعى.", "وقال مطرف: لأن أبيت نائما وأصبح نادما، أحب إلي من أن أبيت قائما وأصبح معجبا.", "وقيل لداود الطائي: أرأيت رجلا دخل على هؤلاء الأمراء فأمرهم بالمعروف ونهاهم عن المنكر؟ قال: أخاف عليه السوط. قيل: إنه يقوى. قال: أخاف عليه السيف. قيل: إنه يقوى. قال: أخاف عليه الداء الدفين العجب.", "وقال أبو سليمان الداراني: سمعت أبا جعفر يبكي في خطبته، فحضرتني نية في أن أقوم إليه فأكلمه بما أعرف من فعله إذا نزل، ثم تفكرت في أني أقوم إلى خليفة أعظه والناس جلوس، فيرمقوني بأبصارهم، فيتداخلني التزين، فيأمر بي فأقتل على غير تصحيح، فسكت.", "حاشية: (١) أخرجه أحمد (٢٣٩٢٧)، وابن حبان في صحيحه (١٩٧٥).", "**بيان**", "**آفة العجب**", "العجب يدعو إلى الكبر؛ لأنه أحد أسبابه كما سبق بيانه، فيتولد من العجب الكبر، ومن الكبر الآفات الكثيرة، هذا مع الخلق، فأما مع الخالق، فإن العجب بالطاعات نتيجة استعظامها والتبجح بها، فكأنه يمن على الله سبحانه بفعلها، وينسى نعمته عليه بتوفيقه لها، ثم يثمر إعجابه بها العمى عن آفاتها، ورب آفة دخلت فيها فأفسدتها.", "وإنما يتفقد آفات الأعمال(١) من خاف ردها دون من رضيها فأعجب بها، ثم يظن أنها قد جعلت له من الله مكانا، وأنه قد استوجب بها أجرا، ويثمر ذلك الظن حمده لنفسه والثناء عليها، ونسيانه للذنوب الكثيرة احتقارا لها، فلا يتشاغل بتلافيها ظنا منه أن ما قد عظم عنده من حسناته يغمرها.", "**فصل**"]], "ic": "book"}, {"story": ["كتاب ذم الكبر والعجب (٢٩ من ٣٣)، ص٩٣٣", ["فإن أعجب برأيه وعلمه وعقله، فإن ذلك العجب يمنعه من الازدياد مما به عجب، فيقتنع بما عنده، ويستنكف من التعلم والاستشارة، وربما عجب برأي فاسد، ويمنعه العجب من سماع قول نصيح(٢)، ولهذا قال الحكماء: عجب المرء بنفسه أحد حساد عقله. وما أضر العجب بالمحاسن. وقال إبراهيم الخواص: العجب يمنع من معرفة قدر النفس.", "**فصل**", "وربما عجب الإنسان برأيه في باب الاعتقاد، وكان ما عجب به من واقعاته ضلالا فهلك، ولو أنه استعان بالعلماء على واقعة لانكشف له الخطأ والصواب.", "حاشية: (١) تحرفت في (ف) إلى: (آيات).", "حاشية: (٢) تحرفت في (ف) إلى: (تقبيح).", "**بيان**", "**حقيقة العجب والإدلال وحدهما**", "العجب إنما يكون بوصف كمال من علم أو عمل أو مال أو غير ذلك، فيسكن المعجب إلى ذلك الوصف سكون ناس للمنعم به، فإن انضاف إلى ذلك أن يرى ذلك حقا له عند الله، لصفاء جوهره أو في مقابلة طاعته، كان إدلالا، فكأنه يرى لنفسه على الله دالة، كما لو أعطى هو فقيرا شيئا فمن عليه به كان معجبا، فإن استخدم الفقير أو استبعد تخلفه عن خدمته كان مدلا عليه، فالعجب يحصل باستعظام ما عجب به، والإدلال يوجب توقع الجزاء، مثل من يتوقع إجابة دعائه، وينكر رده، ولا يتعجب من رد دعاء الفساق، فهذا المدل.", "**بيان**", "**علاج العجب على الجملة**", "اعلم أن علاج كل علة هو مقابلة سببها بضده، وعلى العجب الجهل المحض، فعلاجه المعرفة المضادة لذلك الجهل فقط، فلنفرض العجب بفعل داخل تحت اختيار العبد، كالعبادة، والصدقة، والغزو، وسياسة الخلق، فإن العجب بهذا أغلب من العجب بالجمال والقوة والنسب وما لا يدخل تحت اختياره، فنقول: لا يخلو أن يعجب المتعبد بالعمل من جهة أنه محله ومجراه أو من جهة أنه بقوته وقدرته، فإن كان يعجب به من جهة أنه محله ومجراه، فهذا جهل؛ لأن المحل مجرى لا مدخل له في الإيجاد والتحصيل، فكيف يعجب بما ليس إليه؟ وإن كان يعجب به من جهة أنه منه وباختياره، فينبغي أن يتأمل الأسباب التي بها تم عمله من أعضائه وقدرته، فيعلم أن وجودها من كرم الله سبحانه إذ منع غيره ما رزقه من كمال الأعضاء واستعمال القدرة في الطاعة، فإن خطر له: إن الله سبحانه رآني أهلا لما أنعم به علي؛ فالتأهل للنعمة نعمة من منه، وإذا كان الكل منه فينبغي أن يعجبك جوده لا نفسك، فهو المنعم بإيجادك، وإيجاد صفاتك، وإيجاد أعمالك، وأسباب أعمالك، فلا معنى لعجب عامل بعمله، ولا عالم بعلمه، ولا جميل بجماله، ولا غني بغناه، إذ كل ذلك من فضل الله سبحانه، وإنما الآدمي محل لفيض النعم عليه، وكونه محلا نعمة أيضا.", "فإن قال قائل: لا يمكنني أن أجهل أعمالي، وأني أنا عملتها، ولولا أنها أعمالي ما انتظرت عليها ثوابا، وإذا كانت أعمالي فكيف لا أعجب بها؟", "فالجواب من وجهين: أحدهما: هو صريح الحق، والآخر فيه مسامحة."]], "ic": "book"}, {"story": ["كتاب ذم الكبر والعجب (٣٠ من ٣٣)، ص٩٣٥", ["أما صريح الحق، فهو: أنك وقدرتك وإرادتك وحركتك كله من خلق(١) الله", "حاشية: (١) ليست في الأصل.", "تعالى، واختراعه، فما عملت إذ عملت، ولا رميت إذ رميت؛ لأنه خلقك، وخلق أعضاءك، وخلق فيها القوة والقدرة والصحة، وخلق لك العقل والعلم والإرادة، ولو أردت أن تنفي عن نفسك شيئا من هذا لم تقدر، ثم خلق الحركات في أعضائك مستبدا باختراعها من غير مشاركة من جهتك معه في الاختراع، إلا أنه خلق ذلك على ترتيب، فلم يخلق الحركة حتى خلق في العضو قوة، وفي القلب إرادة، ولم يخلق الإرادة حتى خلق العلم بالمراد، ولم يخلق العلم حتى خلق القلب الذي هو محل العلم، فتدريجه في الخلق شيئا بعد شيء هو الذي خيل إليك أنك أوجدت عملك، وقد غلطت، وإيضاح ذلك وكيفية الثواب على عمل هو من خلق الله سيأتي تقريره في كتاب الشكر، فإنه أليق به فارجع إليه.", "ونحن الآن نزيل إشكالك بالجواب الثاني الذي فيه المسامحة، فنقول: احسب أن العمل حصل بقدرتك، فمن أين قدرتك؟ ولا يتصور العمل إلا بوجودك ووجود عملك وإرادتك وقدرتك، وكل ذلك من الله تعالى لا منك، فإن كان العمل بالقدرة فالقدرة مفتاحه، وهذا المفتاح بيد الله، وما لم يعطك المفتاح لا يمكنك العمل، كما لو قعدت عند خزانة مغلقة لم تقدر على ما فيها إلا أن تعطى مفتاحها، فإذا نوولت المفتاح فمددت يدك فأخذته، فينبغي أن يكون إعجابك بإعطاء الخازن المفتاح لا بمد يدك؛ لأن مؤنة مد اليد يسيرة، وإنما الشأن في تسليم المفتاح، فكذلك إذا خلقت لك القدرة، وسلطت الإرادة الجازمة، وحركت الدواعي، وصرفت الصوارف، فحينئذ يسهل العمل عليك، فمن العجائب أن تعجب بنفسك وتنسى تسهيل الأمور التي بتسهيلها سهل عملك، أما سلط دواعي الفساد على الفساق وحرك دواعي الخير عندك؟ لا بوسيلة سبقت منك ولا بجريمة سبقت منهم، بل لإيثاره إياك واصطفائه لك؟", "وسيأتي في كتاب التوحيد والتوكل من بيان تسلسل الأسباب والمسببات ما يستبين به أنه لا فاعل إلا الله ولا خالق سواه.", "والعجب ممن رزقه الله عقلا وأفقره، كيف يعترض ويقول: ما هذا الفقر مع وجود العلم والعقل؟ أفصارت النعمة حجة لطلب نعمة أخرى؟ وكيف لم تبين", "للعاقل وجوه الحكمة في الفقر فيثمر ذلك عنده الصبر، ولو خفيت عليه الحكمة لكفاه التسليم للمالك، ثم إن المؤمن يشغله خوفه من سلب ما أنعم به عليه عن إعجابه بها، خصوصا إذا تفكر فعلم أنها وهبت بغير وسيلة، وحرمها أقوام من غير جناية، وأن المعطي يفعل ما يشاء، فهذا هو العلاج القامع لمادة العجب من القلب، (١-١)وفي الصحيحين من حديث أبي هريرة عن النبي ﷺ أنه قال: «لن يدخل أحدا منكم عمله الجنة» قالوا: ولا أنت يا رسول الله؟ قال: «ولا أنا، إلا أن يتغمدني الله بفضل منه»(١-١).", "حاشية: (١-١) سقط من الأصل.", "**بيان**", "**أقسام ما به العجب وتفصيل علاجه**"]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "فإن قال قائل: لا يمكنني أن أجهل أعمالي، وأني أنا عملتها، ولولا أنها أعمالي ما انتظرت عليها ثوابا، وإذا كانت أعمالي فكيف لا ____", "o": ["أعجب", "وتظهر", "وأنكر", "بمراء"], "h": "راجع: ص٩٣٥"}, {"t": "fill", "d": 2, "q": "السبب الثالث: التكبر بالقوة: ويدفع ذلك أن يعلم أنه لو آلمه عرق عاد أعجز من كل عاجز، وأن حمى يوم تحلل من قوته مالا يعود في مدة، وأن شوكة لو دخلت في ____ لأعجزته، وبقة لو دخلت في أذنه لقلقلته، ثم", "o": ["رجله", "تلقى", "موقن", "ينصره"], "h": "راجع: ص٩٢١"}, {"t": "fill", "d": 2, "q": "فالجواب: أن هذا قد يشتبه على أكثر الناس لامتزاج الغضب لله سبحانه في إنكار البدعة والفسق بكبر النفس والإذلال بالعلم والورع، فكم من عابد جاهل ____ مغرور إذا رأى فاسقا قد جلس إلى جنبه أزعجه من مكانه", "o": ["وعالم", "فمضيت", "الصحراء", "المحبة"], "h": "راجع: ص٩٢٤"}, {"t": "fill", "d": 2, "q": "وقد روينا عن عمر بن عبد العزيز أنه بات عنده ضيف فكاد السراج يطفأ، ____ الضيف", "o": ["فقال", "السابق", "النصوص", "أنسه"], "h": "راجع: ص٩١٧"}, {"t": "fill", "d": 2, "q": "فالجواب: أن الناس يختلفون في ذلك؛ فمنهم من يقصد الثوب الجميل لنفسه لا ليتكبر به، وعلى هذا يحمل الحديث، ومنهم من يريد بذلك الكبر، ____ أن من قصد الرفيع لرؤية الناس أراد", "o": ["والغالب", "والإيمان", "مستطيل", "والأنثى"], "h": "راجع: ص٩١٧"}, {"t": "fill", "d": 2, "q": "أما بعد؛ فقد روى مسلم في أفراده من حديث الأغر عن أبي هريرة وأبي سعيد أنهما ____", "o": ["قالا", "بفتح", "نصيحتك", "الطيش"], "h": "راجع: ص٨٨٩"}]}, {"t": "كتاب ذم الكبر والعجب - القسم ٦ من ٦", "b": [{"story": ["كتاب ذم الكبر والعجب (٣١ من ٣٣)، ص٩٣٨", ["اعلم أن العجب يكون بالأسباب التي بها يقع الكبر، وقد سبق ذكر هذا، وقد يكون العجب بما لا يتكبر به كعجب الإنسان بالرأي الخطأ. وجملة ما يقع به العجب ثمانية أقسام:", "**الأول**: أن يعجب ببدنه وحسن صورته وجمال نفسه، وينسى أن ذلك نعمة من الله تعالى، وأنه بعرضة الزوال(١).", "**وعلاجه**: ما ذكرنا في الكبر بالجمال، وهو التفكر في أقذار الباطن وبداية الأمر ونهايته من البلى.", "**والثاني**: العجب بالقوة والبطش، كما عجب قوم عاد فقالوا: ﴿مَنْ أَشَدُّ مِنَّا قُوَّةً﴾ [فصلت: ١٥]، فأهلكوا بالريح، وعجب عوج(٢) بقوته فاقتلع قطعة من جبل ليلقيها على قوم موسى فنقبها الله عز وجل فصارت في عنقه، وقد يتكل الإنسان على قوته، كما قد روينا أن بني إسرائيل تذاكروا: هل يمكن الإنسان أن يمضي عليه يوم ولا يعصي الله فيه؟ فحدث داود نفسه بذلك سكونا إلى قوته في المجاهدة فابتلي يومئذ بالذنب، وقال سليمان: لأطوفن الليلة على مئة امرأة تلد كل امرأة منهن غلاما يجاهد في سبيل الله، فحرم ذلك.", "وقد يورث العجب بالقوة التهجم في الحروب على التهلكة، وعلاج ذلك أن يعلم أن ذلك أمر زائل، وأن حمى يوم تزيل قوة البدن، ويسير من الفتن يدفع قوة العزائم.", "حاشية: (١) أي أنه مظنة لأن يعرض له الزوال.", "حاشية: (٢) هو عوج بن عنق، قيل: إنه ولد في منزل آدم عليه السلام وعاش إلى زمن موسى عليه السلام، وقيل: هو رجل من الفراعنة كان يوصف من الطول بأمر شنيع لا يكاد يصدق، وذكر أنه كان إذا قام كان السحاب له مئزرا، ولعل ذلك من الإسرائيليات.", "**الثالث**: العجب بالعقل والكياسة، والتفطن لدقائق الأمور، وهذا يثمر الاستبداد بالرأي وترك المشاورة، واستجهال المخالفين لرأيه.", "**وعلاجه**: أن يتعرف مقدار عقله لا من أعدائه لا من أصدقائه، ومن الحكماء لا من نفسه، فربما عظم من نفسه ما ليس بمعظم، ثم يشكر الله تعالى على ما رزقه، (١-١)«وليعلم أنه ما أوتي من العلم إلا قليلا»(١-١)، ثم ليعلم أنه بأدنى مرض يصيب الدماغ يفسد ذلك، ثم يكون خائفا من تحول الحال، وأن يعاقب لعدم شكره على تلك النعم بزوالها.", "**الرابع**: العجب بالنسب، كما يتخيل الشريف أنه ينجو بسبب شرف آبائه، ويظن بعضهم أن جميع الخلق عبيد لهم."]], "ic": "book"}, {"story": ["كتاب ذم الكبر والعجب (٣٢ من ٣٣)، ص٩٣٩", ["**وعلاجه**: أن يعلم أنه متى خالف آباءه في أفعالهم وظن أنه يلحق بهم، فقد جهل، وإن اقتدى بآبائه، فإنه لم يكن العجب من أخلاقهم، بل الخوف والإزراء على النفس، وإنما شرفوا بالطاعة والخصال المحمودة لا بنفس النسب، وإنه قد شاركهم فيه من ليس بمؤمن، وقد بين الله سبحانه أن الشرف بالتقوى لا بالنسب فقال عز وجل: ﴿إِنَّ أَكْرَمَكُمْ عِندَ ٱللَّهِ أَتْقَىٰكُمْ﴾ [الحجرات: ١٣]، وقال عليه الصلاة والسلام: «يا فاطمة، لا أغني عنك من الله شيئا». فمن علم أن آباءه كانوا على قدم التقوى والتواضع ولم يقف في مقامهم، فقط طعن في نسب نفسه بلسان حاله.", "فإن قال قائل: إنما يرجو الشريف أن يشفع فيه ذو قرابته.", "فالجواب: أن كل المسلمين يرجون الشفاعة، وقد يشفع في الشخص بعد إحراقه بالنار، وقد يقوى الذنب فلا تنجي منه الشفاعة، وفي الصحيحين من حديث أبي هريرة عن النبي ﷺ أنه قال: «لا ألفين أحدكم يجيء يوم القيامة على رقبته بعير له رغاء، فيقول: يا رسول الله أغثني. فأقول: لا أملك لك شيئا، قد أبلغتك».", "ومثل المنهمك في الذنوب اعتمادا على رجاء الشفاعة كمثل المريض المنهمك في الشهوات اعتمادا على أن يطبه طبيبه الحاذق المشفق، وذلك جهل، فإن اجتهاد", "حاشية: (١-١) سقط من (ف).", "الطبيب ينفع بعض الأمراض لا الكل، ويوضح هذا أن سادات الصحابة كانوا خائفين من الآخرة، فكان أبو بكر يقول: ليتني كنت كبشا ذبحني أهلي. وقال عمر: ليتني كنت تبنة في حائط ولا أحاسب. وقالت عائشة: ليتني كنت نسيا منسيا. فكيف يتكل على الشفاعة من ليس له مثل مراتب هؤلاء؟", "**الخامس**: العجب بنسب ظلمة الأمراء.", "وعلاجه: أن يتفكر في مخازيهم ويتذكر ذلهم في القيامة واحتقارهم وتعلق الخصماء بهم، فينبغي لمن عصم من أولادهم(١) من مثل أفعالهم أن يشكر الله تعالى على سلامة دينه ويستغفر لهم.", "**السادس**: العجب بكثرة العدد من الأولاد والخدم والعشيرة والأقارب والأتباع، كما قال الكفار: ﴿نَحْنُ أَكْثَرُ أَمْوَٰلًا وَأَوْلَـٰدًا﴾ [سبأ: ٣٥].", "وعلاجه: ما ذكرنا في الكبر، وهو أن يتفكر في ضعفه وضعفهم، وأن كلهم عبيد عجزة لا يملكون لأنفسهم ضرا ولا نفعا، وأنهم سيفترقون عنه إذا مات، وينفرد عنهم في قبره، ويهربون منه في يوم القيامة، فأي غناء عند من يفارقك في أشد أحوالك؟", "**السابع**: العجب بالمال، كما قال صاحب البستان ﴿أَنَا۠ أَكْثَرُ مِنكَ مَالًا وَأَعَزُّ نَفَرًا﴾ [الكهف: ٣٤].", "وعلاجه: أن يتفكر في آفات المال، وكثرة حقوقه، وعظم غوائله، والسؤال عن كسبه وإنفاقه، وسبق الفقراء له إلى الجنة، وفيما ذكرناه في كتاب الزهد، وكتاب ذم الدنيا، وكتاب ذم المال ما يخوف من الغنى."]], "ic": "book"}, {"story": ["كتاب ذم الكبر والعجب (٣٣ من ٣٣)، ص٩٤٠", ["**الثامن**: العجب بالرأي الخطأ، كما قال الله تعالى: ﴿أَفَمَن زُيِّنَ لَهُۥ سُوٓءُ عَمَلِهِۦ فَرَءَاهُ حَسَنًا﴾ [فاطر: ٨] وقال: ﴿وَهُمْ يَحْسَبُونَ أَنَّهُمْ يُحْسِنُونَ صُنْعًا﴾ [الكهف: ١٠٤]، وجميع أهل البدع إنما أصروا عليها إعجابهم بآرائهم.", "حاشية: (١) تحرفت في (ف) إلى: (هؤلاء).", "وعلاج هذا أشد من علاج غيره؛ لأن ذا الرأي الخطأ جاهل بخطئه، ومعالجة الداء الذي لا يعرف لا تمكن، والجهل داء لا يعرف فتعسر مداواته، ومتى كان هذا الشخص معجبا برأيه لم يصغ إلى نصيح، وكيف يترك ما يعتقده نجاة له.", "وإنما علاج مثل هذا في الجملة: أن يكون متهما لرأيه أبدا، لا يغتر به إلا أن يشهد له قاطع من كتاب أو سنة أو دليل عقلي جامع لشروط الأدلة، ولن يعرف ذلك إلا بمجالسة أهل العلم وممارسة الكتاب والسنة، والأولى لمن لا يتفرغ لاستغراق العمر في العلم أن لا يخوض في المذاهب، ولكن يقف على اعتقاد الجمل، وأن الله سبحانه واحد لا شريك له، ليس كمثله شيء وهو السميع البصير، وأن رسوله صادق فيما جاء به، ويؤمن بما جاء به القرآن من غير بحث ولا نقير(١)، ويصرف زمنه في التقوى وأداء الطاعات، فمتى خاض في المذاهب ورام ما لا يصل إلى معرفته مثله هلك.", "**آخر كتاب ذم الكبر والعجب**", "حاشية: (١) التنقير: التفتيش والبحث الشديد."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "ومثل المنهمك في الذنوب اعتمادا على رجاء الشفاعة كمثل المريض المنهمك في الشهوات اعتمادا على أن يطبه طبيبه ____ المشفق، وذلك جهل، فإن اجتهاد", "o": ["الحاذق", "ومده", "وعملا", "وثقابة"], "h": "راجع: ص٩٣٩"}, {"t": "fill", "d": 2, "q": "وفي الصحيحين من حديث حارثة بن وهب عن ____ ﷺ أنه قال", "o": ["النبي", "بحافظ", "نالوا", "حاجة"], "h": "راجع: ص٨٩٣"}, {"t": "fill", "d": 2, "q": "للعاقل وجوه الحكمة في الفقر فيثمر ذلك عنده الصبر، ولو خفيت عليه الحكمة لكفاه التسليم للمالك، ثم إن المؤمن يشغله خوفه من سلب ما أنعم به عليه عن إعجابه بها، خصوصا إذا تفكر فعلم أنها وهبت بغير وسيلة، وحرمها أقوام من غير جناية، وأن المعطي يفعل ما يشاء، فهذا هو العلاج ____ لمادة العجب من القلب، وفي الصحيحين من حديث أبي هريرة عن النبي ﷺ أنه قال", "o": ["القامع", "واستصغار", "اللباب", "الحرص"], "h": "راجع: ص٩٣٧"}, {"t": "fill", "d": 2, "q": "الرابع: العجب بالنسب، كما يتخيل الشريف أنه ينجو بسبب شرف آبائه، ويظن ____ أن جميع الخلق عبيد", "o": ["بعضهم", "تضعه", "بمضاجع", "تقويته"], "h": "راجع: ص٩٣٩"}, {"t": "fill", "d": 2, "q": "واعلم أنه من جوز أن يكون عند الله شقيا، فلا سبيل له إلى التكبر، ومن غلبه الخوف رأى كل أحد خيرا منه، أخبرنا محمد بن أبي منصور وعلي بن أبي عمر ____", "o": ["قالا", "ليحسن", "منسوب", "ملاحظة"], "h": "راجع: ص٩٢٧"}, {"t": "fill", "d": 2, "q": "اعلم أنه لا يتكبر إلا من استعظم نفسه، ولا يستعظمها إلا وهو يعتقد لها صفة من ____ الكمال، ومجامع ذلك يرجع إلى كمال ديني أو دنيوي، والديني", "o": ["صفات", "بالقرب", "وفضله", "سلاح"], "h": "راجع: ص٩٠٦"}]}], "sum": [["الصفحات", "ص٨٨٩ - ص٩٤٢"]], "_nq": 36}, {"id": "l12", "title": "كتاب ذم الغرور", "group": "كتاب ذم الغرور", "map": {"center": "كتاب\nذم الغرور", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "كتاب ذم الغرور - القسم ١ من ٥", "b": [{"pic": ["books", "book"], "cap": "ص٩٤٣ - ص٩٧٨"}, {"story": ["كتاب ذم الغرور (١ من ٢٩)، ص٩٤٣", ["وهو الكتاب العاشر من ربع المهلكات", "الحمد لله مدبر الأحوال والأمور، ومدهر الأحيان والدهور، ومصرف الأوقات والعصور، ومعيد الصور عند نفخ الصور بمشيئته السلامة والثبور، وبإرادته الحزن والحبور، وبحكمته الكسر والجبور، وإلى قضائه السرور والشرور، بث الشبهة بين الحجج ثم شعشع النور، وأقام العقل نصيحا يصيح قبل العثور: فلا تغرنكم الحياة الدنيا، ولا يغرنكم بالله الغرور.", "أحمده حمدا يدوم بدوام الأيام والشهور، وأشهد له بالتوحيد شهادة تخرج قائلها من الظلمات إلى النور، وأن محمدا عبده ورسوله أرسله وقد زين الشيطان الخدع والغرور، فأوضح الحق وهتك الزور، ونسخ بنهار شريعته ظلام كل ديجور، صلى الله عليه وعلى من بايعه وتابعه إلى يوم الحشر والحضور.", "أما بعد: فإن مفتاح السعادة اليقظة والفطنة، ومنبع الشقاوة الغرور والغفلة، فلا نعمة أعظم من الإيمان والمعرفة، ولا وصول إلى ذلك إلا بنور البصيرة، ولا نقمة أعظم من الكفر والمعصية، ولا داعي إلى ذلك إلا عمى القلب بظلمة الجهالة، فقلوب أرباب اليقظة كمشكاة فيها مصباح، وقلوب المغترين كظلمات في بحر لجي.", "وإذا عرف أن الغرور هو أم الشقاء ومنبع الهلكة، فلا بد من شرح مداخله ومجاريه، وتفصيل ما يكثر وقوع الغرور فيه، ليحذره المريد.", "وفرق المغترين كثيرة، وأحوالهم مختلفة، فمنهم من يرى المنكر معروفا، كمن يزخرف المساجد من المال الحرام، ومنهم من لا يميز بين ما يسعى فيه لنفسه وبين ما يسعى فيه لله سبحانه، كالواعظ الذي غرضه القبول والجاه، ومنهم من يترك الفرض ويشتغل بالنافلة، كمن يتعبد ويترك الكسب للعيال، ومنهم من يشتغل بالقشر عن اللب، كمن هو مقصور في الصلاة على تصحيح مخارج الحروف دون فهم ما يتلوه.", "**بيان ذم الغرور**", "يكفي في ذم الغرور قوله تعالى: ﴿فَلَا تَغُرَّنَّكُمُ ٱلْحَيَوٰةُ ٱلدُّنْيَا وَلَا يَغُرَّنَّكُم بِٱللَّهِ ٱلْغَرُورُ﴾ [لقمان: ٣٣] وقوله: ﴿وَغَرَّكُمُ ٱلْأَمَانِىُّ﴾ [الحديد: ١٤]، وقال النبي ﷺ: «الكيس من دان نفسه وعمل لما بعد الموت، والعاجز من أتبع نفسه هواها وتمنى على الله الأماني».", "وكل ما ورد في فضل العلم وذم الجهل فهو دليل على ذم الغرور؛ لأن الغرور عبارة عن بعض أنواع الجهل، إذ الجهل هو أن يعتقد الشيء ويراه على خلاف ما هو به، والغرور جهل، إلا أنه ليس كل جهل بغرور، بل يستدعي الغرور مغرورا فيه مخصوصا ومغرورا به، ومتى اعتقد الإنسان شيئا يوافق الهوى وكان السبب الموجب للجهل شبهة ومخيلة فاسدة تظن دليلا سمي الجهل الحاصل بذلك غرورا، فالغرور سكون النفس إلى ما يوافق الهوى، ويميل إليه الطبع عن شبهة وخدعة من الشيطان، ودرجات الغرور تتفاوت.", "**ذكر غرور الكفار**"]], "ic": "book"}, {"story": ["كتاب ذم الغرور (٢ من ٢٩)، ص٩٤٥", ["منهم من غرته الدنيا، فقال: النقد خير من النسيئة، والدنيا نقد والآخرة نسيئة، ومنهم من قال: لذات الدنيا متيقنة، ولذات الآخرة مشكوك فيها، واليقين خير من الشك؟", "وعلاج هذا الغرور بالنظر في دليل التوحيد وصدق الرسول، فحينئذ يثبت خبره بأن الآخرة خير.", "فأما قولهم: النقد خير من النسيئة. فهو محل التلبيس، وذلك أنه إذا كان النقد مثل النسيئة، فالنقد خير، وإن كان أقل منه(١)، فالنسيئة خير، ولذلك يبذل هذا", "حاشية: (١) في (ف): (منها).", "الكافر في تجارته درهما ليأخذ عشرة نسيئة، ولا يقول حينئذ: النقد خير من النسيئة، ويترك لذيذ الأطعمة خوفا من ألم المرض في المستقبل، ومعلوم أن عمر الإنسان بالإضافة إلى مدة الآخرة ليس بجزء من ألف ألف جزء، إلا أن ينقطع النفس عن الآخرة، بل ترك شيئا حقيرا ليأخذ ما لا نهاية لعدده ولا منقطع لأمده، وإنما أراد من قال: النقد خير من النسيئة إذا كانت النسيئة مثل النقد.", "وأما قولهم: اليقين خير من الشك، (١-١)يجعلها يقينا(١-١)، فإنا قد رأينا من يترك متيقنا لمشكوك يرجو بتركه أفضل مما ترك، أو يخاف من تناول ما تناول، فإن التاجر في بيعه على يقين، وفي ربحه على شك، والمتفقه في اجتهاده على يقين، وفي إدراكه رتبة العلم على شك، والمريض يشرب الدواء المر وهو من الشفاء في شك، ثم إن الحزم دأب العقلاء بالاتفاق، وكل ذلك ترك لليقين بالشك، فمن شك في الآخرة فإن الحزم عنده أن يصبر عما نهي عنه مدة عمره، وهي قليلة بالإضافة إلى أيام الآخرة، فلو لم تكن الآخرة وعدا صادقا لم يفته إلا التنعم في مدة حياته المحقرة، وإن كانت صدقا، فعذاب النار لا يطاق، ومن هذا قول أبي العلاء:", "قال المنجم والطبيب كلاهما  لا تنشر الأموات قلت إليكما", "إن صح قولكما فلست بخاسر  أو صح قولي فالخسار عليكما", "هذا جواب مقصوده إفحام المعترض بقوله: اليقين خير من الشك، وإلا فالآخرة متيقنة، وإنما يحصل اليقين بها بالنظر في صدق الرسول المخبر عنها بالمعجزات الخارقة.", "وأما ملابسو المعاصي مع سلامة عقائدهم، فإنهم قد شاركوا الكفار في هذا الغرور؛ لأنهم آثروا الدنيا على الآخرة، إلا أن أمرهم أسهل من جهة أن أصل الإيمان يمنعهم من عقاب الأبد.", "وقد يغتر الكافر بأن يقول: إن كان ثم معاد فأنا أحق به من غيري. كقول ذلك القائل: ﴿وَلَئِن رُّدِدتُّ إِلَىٰ رَبِّى لَأَجِدَنَّ خَيْرًا مِّنْهَا مُنقَلَبًا﴾ [الكهف: ٣٦]، وقول الآخر:", "حاشية: (١-١) ليس في (ف)."]], "ic": "book"}, {"story": ["كتاب ذم الغرور (٣ من ٢٩)، ص٩٤٧", ["﴿لَأُوتَيَنَّ مَالًا وَوَلَدًا﴾ [مريم: ٧٧]، وسبب هذا الاغترار أنهم رأوا نعم الدنيا متوفرة عليهم والعذاب بعيدا عنهم، فقاسوا أمر الآخرة على ذلك، وزعموا أن الإحسان يقتضي المحبة، ولولا أنه يحبنا ما أعطانا، ومن أحسن إلي في الماضي أحسن إلي في المستقبل، ولو علموا أن ما أعطوه عليهم لا لهم لم يقولوا هذا، قال عز وجل: ﴿إِنَّمَا نُمْلِى لَهُمْ لِيَزْدَادُوٓا۟ إِثْمًا﴾ [آل عمران: ١٧٨]، وما منعه المؤمن من الدنيا فحمية، وقد كشف هذا قوله تعالى: ﴿فَأَمَّا ٱلْإِنسَـٰنُ إِذَا مَا ٱبْتَلَىٰهُ رَبُّهُۥ فَأَكْرَمَهُۥ وَنَعَّمَهُۥ فَيَقُولُ رَبِّىٓ أَكْرَمَنِ وَأَمَّا إِذَا مَا ٱبْتَلَىٰهُ فَقَدَرَ عَلَيْهِ رِزْقَهُۥ فَيَقُولُ رَبِّىٓ أَهَـٰنَنِ كَلَّا﴾ [الفجر: ١٥ ـ ١٧]. أي ليس هذا بكرامة ولا هذا بهوان.", "وعلاج هذا الغرور معرفة دلائل الكرامة ودلائل الهوان.", "ومن هذا الجنس اغترار العصاة بقولهم: إن الله كريم، وإنا نتكل على عفوه ونتوسل إليه بالتوحيد. وربما اغتروا بصلاح آبائهم كالشرفاء، وقياسهم: أن من أحب إنسانا أحب أولاده، وأن الله عز وجل يحب آباءنا، وقد نسوا أن نوحا عليه السلام أراد أن يستصحب ابنه في السفينة فقيل له: ﴿إِنَّهُۥ لَيْسَ مِنْ أَهْلِكَ﴾ [هود: ٤٦]، وأن استغفار إبراهيم لأبيه لم ينفعه، ولا شفاعة محمد في أمه، وإنما يحب الله عز وجل المطيع، فلو أن ولدا عصى وكان الأب مطيعا لم يبغض الوالد بمعصية الولد، فكذلك طاعة الوالد لا توجب محبة الولد، ومن ظن أنه ينجو بتقوى أبيه كان كمن ظن أنه يشبع بأكل أبيه، والتقوى فرض عين.", "وقولهم: إن الله كريم. كلام صحيح، ولكن الشياطين تخدعهم به، وقد كشف ذلك قول الرسول ﷺ: «والعاجز من أتبع نفسه هواها وتمنى على الله».", "وأما تعلقهم بالرجاء؛ فإن الرجاء له أسباب، قال الله عز وجل: ﴿إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَٱلَّذِينَ هَاجَرُوا۟ وَجَـٰهَدُوا۟ فِى سَبِيلِ ٱللَّهِ أُو۟لَـٰٓئِكَ يَرْجُونَ رَحْمَتَ ٱللَّهِ﴾ [البقرة: ٢١٨]، فبين أن الرجاء بمثل هؤلاء يليق، أفترى من استؤجر لإصلاح أواني فكسرها، يحسن أن يرجو أخذ الأجرة؟ وقد قال العلماء: من رجا شيئا طلبه، ومن خاف شيئا هرب منه، والعجب ممن لم ينكح كيف يرجو الولد، فمن تاب ورجا العفو،", "فرجاؤه صحيح، ومن رجا الغفران مع الإصرار فهو مغرور، وليعلم أن الله سبحانه مع سعة رحمته شديد العقاب، وقد قضى بتخليد الكفار في النار مع أنه لا يضره كفرهم، وقد سلط الأمراض والمحن على خلق من عباده في الدنيا، وهو قادر على إزالتها، ثم قد خوفنا عقابه، فكيف لا نخاف؟ فالخوف والرجاء سائقان يبعثان على العمل، وما لا يبعث على العمل فهو غرور."]], "ic": "book"}, {"story": ["كتاب ذم الغرور (٤ من ٢٩)، ص٩٤٨", ["ويوضح هذا: أن رجاء أكثر الخلق يحملهم على البطالة وإيثار المعاصي، فعلمت أنه غرور، والعجب من القرن الأول عملوا وخافوا، ثم أهل هذا الزمان أمنوا مع التقصير واطمأنوا تراهم عرفوا من كرم الله عز وجل ما لم يعرفه الأنبياء وصالحو السلف؟ وإذا كان هذا الأمر يدرك بالمنى فلم تعب أولئك وكثر بكاؤهم؟ وهل ذم أهل الكتاب بقوله: ﴿يَأْخُذُونَ عَرَضَ هَـٰذَا ٱلْأَدْنَىٰ وَيَقُولُونَ سَيُغْفَرُ لَنَا﴾ [الأعراف: ١٦٩] إلا لمثل هذه الحال؟", "**فصل**", "ويقرب من هذا الغرور أقوام لهم طاعات ومعاصي إلا أن معاصيهم أكثر، فهم يظنون أن حسناتهم ترجح، فترى الواحد منهم يتصدق بدراهم(١) ويكون ما تناوله من الغصب أضعاف ذلك، ولعل الذي تصدق به من المغصوب، ويتكل على تلك الصدقة، وما هذا إلا كمن وضع درهما في كفة وألفا في أخرى، ثم رجا أن يرجح الدرهم بالألف.", "ومنهم من يظن أن طاعاته أكثر من معاصيه، وسبب هذا الظن أنه يحفظ عدد حسناته ولا يحاسب (٢-٢)على سيئاته(٢-٢) ولا يتفقد ذنوبه كالذي يستغفر الله أو يسبحه(٣) مئة مرة في يوم، ثم يغتاب المسلمين ويتكلم بما لا يرضي طول النهار، فهو ينظر في فضائل الاستغفار والتسبيح، ولا ينظر في عقوبة الغيبة والكلام المنهي عنه.", "حاشية: (١) في (ف): (بدرهم).", "حاشية: (٢-٢) سقط من الأصل.", "حاشية: (٣) ليست في الأصل.", "**فصل**", "ويقع الاغترار في الأغلب في حق أربع طوائف: العلماء، والعباد، والمتصوفة، والأغنياء."]], "ic": "book"}, {"story": ["كتاب ذم الغرور (٥ من ٢٩)، ص٩٤٩", ["**فأما أهل العلم**، فالمغترون منهم فرق: ففرقة منهم أحكموا العلوم الشرعية والعقلية، وتعمقوا فيها واشتغلوا بها، وأهملوا تفقد الجوارح وحفظها عن المعاصي وإلزامها الطاعات، واغتروا بعلمهم، وظنوا أنهم من الله بمكان، وأنه لا يعذب مثلهم، وقد بلغوا ما بلغوا من العلم، بل يقبل في الخلق شفاعتهم، ولو نظر هؤلاء بعين البصيرة علموا أن علم المعاملة لا يراد إلا للعمل، ولولا العمل لم يكن له قدر، ومثال هذا كمريض به علة لا يزيلها إلا دواء مركب من أخلاط كثيرة لا يعرفها إلا حذاق الأطباء، فسعى في طلب طبيب حاذق فعلمه الدواء وبين له معادن الأخلاط ومقاديرها وكيف تجمع، فكتب نسخة وعاد إلى منزله، فجعل يكرر قراءة النسخة ويعلمها المرضى، ولا يشتغل بشربها، فهل ينفعه ذلك من مرضه؟ هيهات؟ لا وجه لنفعه إلا أن يستعمل الدواء الموصوف ويصبر على مرارته، ثم هو على خطر من الشفاء، فهكذا الفقيه إذا أحكم علم الطاعات ولم يعملها، وعلم المعاصي ولم يجتنبها، وعلم الأخلاق المذمومة ولم يطهر نفسه منها، فإن الله تعالى قال: ﴿قَدْ أَفْلَحَ مَن زَكَّىٰهَا﴾ [الشمس: ٩]، ولم يقل: قد أفلح من تعلم كيف يزكيها(١)، فإن تلا عليه الشيطان فضائل العلم فليذكر له ما ورد في العالم الفاجر، كقوله تعالى: ﴿فَمَثَلُهُۥ كَمَثَلِ ٱلْكَلْبِ﴾ [الأعراف: ١٧٦]، ﴿كَمَثَلِ ٱلْحِمَارِ يَحْمِلُ أَسْفَارًا﴾ [الجمعة: ٥]، وقد سبق في كتاب العلم ما ورد من هذا كثير.", "فأما من يدعي علم معرفة الله سبحانه ثم يضيع أوامره وحدوده فغروره(٢) أشد، ومثاله مثال من أراد خدمة ملك فعرف الملك وعرف أخلاقه وأوصافه، ولم يتعرف ما يحبه ويكرهه، وما يغضب لأجله ويرضى به، أو عرف ذلك إلا أنه لابس ما", "حاشية: (١) في (ف): (تزكيتها).", "حاشية: (٢) سقطت من (ف).", "يغضب به وتعطل عن كل ما يحبه، ثم أراد التقرب إلى الملك وهو متلوث بكل ما يكرهه، عاطل عن كل ما يحبه، فتوسل إليه بمعرفته، فهذا مغرور جدا، إذ لو ترك جميع ما عرفه واشتغل بمعرفة ما يحبه ويكرهه كان ذلك أقرب له إلى نيل مراده، بل تقصيره في التقوى واتباعه للهوى دليل على أنه لم ينكشف له من معرفة الله سبحانه إلا الأسماء دون المعاني، إذ لو عرف الله سبحانه حق معرفته لخاف منه واتقاه، فمن عرف من صفات الله تعالى أنه يهلك الخلق ولا يبالي، ويعذب من يشاء، ولا تأخذه رقة، فإنه يشتد خوفه منه. وما أحسن ما قال الحسن البصري وقد قيل له في مسألة: خالفت الفقهاء. فقال: وهل رأيت فقيها قط؟ إنما الفقيه الذي يخشى الله عز وجل."]], "ic": "book"}, {"story": ["كتاب ذم الغرور (٦ من ٢٩)، ص٩٥٠", ["وفرقة أخرى أحكموا العلم والعمل، فواظبوا على الطاعات(١) الظاهرة وتركوا المعاصي، إلا أنهم لم يتفقدوا قلوبهم ليمحوا الصفات المذمومة(٢) منها، كالكبر، والحسد، والرياء، وطلب العلو، وإرادة السوء للنظراء، وطلب الشهرة(٣)، وربما لم يعلم بعضهم أن هذا مذموم، فلم يحترز منه، ولم يتأمل قول النبي ﷺ: «أدنى الرياء شرك»، وقوله: «لا يدخل الجنة من في قلبه مثقال ذرة من كبر»، وقوله: «الحسد يأكل الحسنات كما تأكل النار الحطب»، وغير ذلك من الأخبار التي يحويها ربع المهلكات من الأخلاق المذمومة، فهؤلاء زينوا ظواهرهم وأهملوا بواطنهم ونسوا قوله عليه السلام: «إن الله لا ينظر إلى صوركم وأموالكم، وإنما ينظر إلى قلوبكم وأعمالكم»، فتعاهدوا الأعمال ولم يتعاهدوا القلوب، والقلب هو الأصل إذ لا ينجو إلا من أتى الله بقلب سليم، ومثال هؤلاء كبير الحش(٤) ظاهرها جص وباطنها نتن، وكالقبور ظاهرها مزين وباطنها جيفة، وكبيت باطنه مظلم وعلى سطحه سراج، وأقرب الأمثلة من هذا رجل زرع زرعا فنبت ونبت", "حاشية: (١) تحرفت في (ف) إلى: (الصفات).", "حاشية: (٢) سقطت من (ف).", "حاشية: (٣) تحرفت في (ف) إلى (الشهوة).", "حاشية: (٤) الحش: الكنيف.", "معه حشيش يفسده، فأمر بتنقية الزرع من الحشيش بقلعه، فأخذ يجز رؤوسه وأطرافه ويترك أصوله، (١-١)فلم تزل أصوله(١-١) تقوى وتنبت، فمغارس المعاصي هي الأخلاق الذميمة في القلب، فمن لم يطهر القلب منها لم تتم له الطاعات الظاهرة إلا مع آفات كثيرة، فمثله كمثل من به جرب فأمر بالطلاء وشرب الدواء، فالطلاء لإزالة الظاهر والدواء لقلع المادة من الباطن، فقنع بالطلاء وترك شرب الدواء، ثم تناول مما يزيد في المادة فلم يزل ما به."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "وفرقة منهم ادعوا حسن الخلق والتواضع والسماحة، فتصدوا لخدمة الصوفية، فجمعوا قوما وتكلفوا بخدمتهم، واتخذوا ذلك شبكة للرياسة وجمع المال، وإنما غرضهم التكبر وهم يظهرون الخدمة والتواضع، وغرضهم الارتفاق وهم يظهرون أن غرضهم الإرفاق، وغرضهم الاستتباع وهم يظهرون أن غرضهم الخدمة والتبعية، ثم إنهم يجمعون من الحرام أو الشبهات وينفقون عليهم لتكثر أتباعهم وينتشر بالخدمة اسمهم، وبعضهم يأخذ أموال السلاطين وينفق عليهم، وبعضهم يأخذها لينفق في طريق الحج على الصوفية ويزعم أن غرضه البر والإرفاق، وباعث جميعهم الرياء والسمعة، وآية ذلك إهمالهم لجميع أوامر الله تعالى ظاهرا وباطنا، ورضاهم بأخذ الحرام والإنفاق منه، ومثال من ينفق الحرام في طريق الحج لإرادة الخير كمن يعمر مساجد الله ويطليها بالعذرة ويزعم أن قصده ____", "o": ["العمارة", "انقيادا", "بقليل", "فيدفع"], "h": "راجع: ص٩٦٩"}, {"t": "fill", "d": 2, "q": "وفرقة أخرى تغلب عليها الوسوسة في إخراج حروف الفاتحة وسائر الأذكار من مخارجها، فلا يزال أحدهم يحتاط في التشديدات والفرق بين الضاد والظاء فوق الحاجة، وتصحيح مخارج الحروف في جميع صلاته لا يهمه غيره، ولا يتفكر فيما سواه، ذاهلا عن معنى القرآن والاتعاظ به، وصرف الفهم إلى أسراره، وهذا من أقبح أنواع الغرور، فإنه لم يكلف الخلق في تلاوتهم القرآن من تحقيق مخارج الحروف إلا ما جرت به عادتهم في الكلام، ومثال هؤلاء مثال من حمل رسالة إلى سلطان، فأخذ يؤدي الرسالة بالتأني في مخارج الحروف وتكرارها، وهو غافل عن مقصود الرسالة ____ حرمة المجلس، فما أجراه بالطرد والتأديب", "o": ["ومراعاة", "بالحج", "النفع", "أنبياء"], "h": "راجع: ص٩٦٢"}, {"t": "fill", "d": 2, "q": "وفرقة أخرى غلبهم البخل، فلا تسمح نفوسهم إلا بأداء الزكاة فقط، ثم إنهم يخرجون من المال الرديء ويطلبون من الفقراء من يخدمهم ويتردد في ____،", "o": ["حاجاتهم", "يزداد", "فاستشار", "بالنشوء"], "h": "راجع: ص٩٧٢"}, {"t": "fill", "d": 2, "q": "فالجواب: إنا نخاف عليه الأمن من مكر الله، فإنه ربما ظن أنه قد أهل لشيء فسكن إلى تلك العطية، ولم يخف من التغيير بل سبيله أن يكون ____ لجملة ذلك من فضل الله، ثم يكون خائفا أن يكون قد شذت عنه صفة من", "o": ["مشاهدا", "مليكه", "فجاءه", "والطاعة"], "h": "راجع: ص٩٧٨"}, {"t": "fill", "d": 2, "q": "يغضب به وتعطل عن كل ما يحبه، ثم أراد التقرب إلى الملك وهو متلوث بكل ما يكرهه، عاطل عن كل ما يحبه، فتوسل إليه بمعرفته، فهذا مغرور جدا، إذ لو ترك جميع ما عرفه واشتغل بمعرفة ما يحبه ويكرهه كان ذلك أقرب له إلى نيل مراده، بل تقصيره في التقوى واتباعه للهوى دليل على أنه لم ينكشف له من معرفة الله سبحانه إلا ____ دون المعاني، إذ لو عرف الله سبحانه حق معرفته لخاف منه واتقاه، فمن عرف من صفات الله تعالى أنه يهلك الخلق ولا يبالي، ويعذب من يشاء، ولا تأخذه رقة، فإنه يشتد خوفه منه", "o": ["الأسماء", "بنغماتهم", "دنياوية", "التجرد"], "h": "راجع: ص٩٥٠"}, {"t": "fill", "d": 2, "q": "فإن قيل: فإن فهم المريد هذه المكيدة فاشتغل بنفسه عن الخلق أو نصحهم وراعى شرط الإخلاص، فهل بقي ____", "o": ["عليه", "أعماه", "بدعوى", "فأصل"], "h": "راجع: ص٩٧٧"}]}, {"t": "كتاب ذم الغرور - القسم ٢ من ٥", "b": [{"story": ["كتاب ذم الغرور (٧ من ٢٩)، ص٩٥١", ["وفرقة أخرى علموا أن هذه الأخلاق الباطنة مذمومة، إلا أنهم لعجبهم بأنفسهم يظنون أنهم منفكون عنها وأنهم أرفع عند الله من أن يبتليهم بذلك، وإنما يبتلى به العوام دون من بلغ مبلغهم من العلم، فإذا ظهر عليهم مخايل الكبر والرئاسة وطلب العلو قال أحدهم: ما هذا كبر، وإنما هو طلب عز الدين وإظهار شرف العلم وإرغام أنف المبتدعين، فإني لو لبست الدون من الثياب، وجلست في الدون من المجلس شمت بي أعداء الدين، وكان ذلي ذلا للإسلام. وينسى المغرور أن إبليس هو الذي قد سول له هذا، بدليل أن رسول الله ﷺ وأصحابه كانوا يتواضعون ويؤثرون الفقر والمسكنة، وقد روينا عن عمر بن الخطاب أنه لما قدم الشام عرضت له مخاضة(٢)، فنزل عن بعيره، فقال أبو عبيدة: لقد صنعت اليوم صنيعا عظيما عند أهل الأرض. فصك(٣) في صدره وقال: أوه لو غيرك يقول هذا يا أبا عبيدة؟ إنكم كنتم أذل الناس وأحقر الناس فأعزكم الله برسوله، فمهما تطلبوا العز بغيره يذلكم الله. وفي رواية عنه أنه لما قدم الشام استقبله الناس وهو على بعيره، فقيل له: لو ركبت برذونا(٤) يلقاك عظماء الناس ووجوههم. فقال عمر: ألا أراكم هاهنا إنما الأمر من ههنا ـ وأشار بيده إلى السماء ـ خلوا سبيل جملي.", "حاشية: (١-١) سقط من (ف).", "حاشية: (٢) المخاضة: الموضع القليل الماء الذي يعبر فيه الناس النهر مشاة وركبانا.", "حاشية: (٣) أي: ضرب في صدره ودفعه بقوة.", "حاشية: (٤) البرذون: يطلق على غير العربي من الخيل والبغال، عظيم الخلقة قوي الأرجل غليظ الأعضاء.", "ثم العجب من مغرور يطلب عز الدين بالثياب الرفيعة والخيول الفارهة، وربما طلبه بلبس الحرير، وربما أطلق لسانه في أقرانه حسدا، وزعم أنه إنما تكلم غضبا للحق، وينكشف هذا بأنه لو طعن في غيره من أهل العلم أو زوحم غ
