، وهو الغنيمة المأخوذة بالقهر، والفيء الذي يحصل من مالهم في يده من غير قتال، والجزية وأموال المصالحة، وهي التي تؤخذ بالشرط والمعاقدة. والقسم الثاني: المأخوذ من المسلمين ولا يحل منه إلا قسمان: مال الميت الذي لم يخلف وارثا، والأموال الضائعة التي لا يتعين لها مالك، والأوقاف التي لا متولي لها، فما يحال به الإنسان من ذلك، كالخمس الذي قد روعي في أخذه الحق، والجزية التي تؤخذ بقانون الشرع فذلك مباح، إلا أن الأوقاف ينبغي أن ينظر في شرط الواقف، ولا يعتبر فيما يحييه السلطان شرط؛ لأنه ملكه يعطي منه من يشاء ما يشاء، وإنما ينظر هل أحياه بتسخير وظلم؟ وقد قبل جماعة من السلف عطايا السلطان لعلمهم أن يده تشتمل على حلال، فإن تناول في وقت ما ليس له لم يوجب ذلك الامتناع إلا على جهة الورع، وقد تورع جماعة عن ذلك، وكان فيهم من يأخذه فيتصدق به، وأما في هذا الزمان فالاحتراز أولى؛ لأنه قد علم طريق الأخذ، ثم لا ينال إلا بالذل والسؤال والسكوت عن الإنكار، وقد كان بعض السلف لا يأخذ، ويعلل بأن باقي المستحقين لم يأخذوا، وهذا ليس بشيء؛ لأنه يأخذ حقه ويبقى أولئك في مقام مظلوم وليس المال مشتركا.", "حاشية: (١) ليست في الأصل.", "**النظر الثاني:** في قدر المأخوذ، وصفة الأخذ، ولنفرض المال من أموال المصالح، فإن ما عداه قد تعين مستحقه إن كان من وقف أو صدقة أو خمس أو غنيمة أو فيء، ولا يجوز صرف أموال المصالح إلا إلى من فيه مصلحة عامة، فلو أنه اشتغل بالكسب لتعطل ما هو فيه، فله في بيت المال الكفاية، كالعلماء والأجناد الذين يحرسون المملكة، والكتاب، والحساب، والوكلاء وكل من يحتاج إليه في ترتيب ديوان الخراج فإنما نعني العمال على الأموال الحلال، وللسلطان أن يزيد من شاء على قدر كفايته، وأن يخص بعضهم بفضل جائزة."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "اعلم أن من أخذ مالا من سلطان فلا بد أن ينظر في ثلاثة ____", "o": ["أشياء", "خلافة", "لأحدهم", "تؤثره"], "h": "راجع: ص٤٠٢"}, {"t": "fill", "d": 2, "q": "النظر الأول: في جهات الدخل للسلطان وكل ما يحل للسلطان سوى ما يحييه من الأرض وما يشترك فيه الرعية قسمان: مأخوذ من الكفار، وهو الغنيمة المأخوذة بالقهر، ____ الذي يحصل من مالهم في يده من غير قتال،", "o": ["والفيء", "العباس", "ورده", "النعلين"], "h": "راجع: ص٤٠٢"}, {"t": "fill", "d": 2, "q": "النظر الثاني: في قدر المأخوذ، وصفة الأخذ، ولنفرض المال من أموال المصالح، فإن ما عداه قد تعين مستحقه إن كان من وقف أو ____ أو خمس أو غنيمة أو فيء، ولا يجوز صرف أموال المصالح إلا إلى من فيه مصلحة", "o": ["صدقة", "أصبح", "وكلامه", "مقصوده"], "h": "راجع: ص٤٠٣"}]}], "sum": [["الصفحات", "ص٤٠٢ - ص٤٠٣"]], "_nq": 3}, {"id": "l24", "title": "الباب السادس فيما يحل من مخالطة السلاطين الظلمة ويحرم وحكم غشيانهم وإكرامهم", "group": "كتاب الحلال والحرام", "map": {"center": "الباب\nالسادس فيما", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب السادس فيما يحل من مخالطة السلاطين الظلمة ويحرم وحكم غشيانهم وإك", "b": [{"pic": ["books", "book"], "cap": "ص٤٠٤ - ص٤١٠"}, {"story": ["الباب السادس فيما يحل من مخالطة السلاطين الظلمة ويحرم وحكم غ (١ من ٥)، ص٤٠٤", ["**فيما يحل من مخالطة السلاطين الظلمة ويحرم وحكم غشيانهم وإكرامهم**", "اعلم أن لك مع الأمراء والعمال الظلمة ثلاثة أحوال:", "**الحالة الأولى:** وهي شرها؛ أن تدخل عليهم، والثانية: وهي دونها أن يدخلوا عليك، والثالثة: وهي الأسلم أن تعتزل عنهم، فلا تراهم ولا يرونك.", "**أما الحالة الأولى:** وهي الدخول عليهم، فهو مذموم، فقد أخبرنا هبة الله بن محمد قال: أخبرنا الحسن بن علي التميمي قال: أخبرنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد بن حنبل قال: حدثني أبي قال: حدثنا محمد يعني ابن الصباح قال: حدثنا إسماعيل بن زكريا، عن الحسن بن حكم النخعي، عن عدي بن ثابت، عن أبي حازم، عن أبي هريرة، قال: قال رسول الله ﷺ: «من أتى أبواب السلاطين افتتن، وما ازداد عبد من السلطان قربا إلا ازداد من الله بعدا». قال أحمد: وحدثنا عبد الرزاق قال: أخبرنا معمر عن ابن خثيم عن عبد الرحمن بن سابط عن جابر بن عبد الله أن النبي ﷺ قال لكعب بن عجرة: «أعاذك الله من إمارة السفهاء» قال: وما إمارة السفهاء؟ قال: «أمراء يكونون بعدي لا يقتدون بهدي، ولا يستنون بسنتي، فمن صدقهم بكذبهم وأعانهم على ظلمهم، فأولئك ليسوا مني ولست منهم ولا يردون على حوضي، ومن لم يصدقهم بكذبهم ولم يعنهم على ظلمهم، فأولئك مني وأنا منهم، وسيردون على حوضي».", "وقال حذيفة: إياكم ومواقف الفتن. قيل: وما مواقف الفتن؟ قال: أبواب الأمراء، يدخل أحدكم على الأمير فيصدقه بالكذب، ويقول ما ليس فيه.", "وقال ميمون بن مهران: لا تدخلن على سلطان وإن قلت: آمره بطاعة الله.", "وقيل لعلقمة: لو دخلت على الأمراء فعرفوا لك شرفك. فقال: أخاف أن ينقصوا مني أكثر مما أنتقص منهم.", "وقال محمد بن واسع: لقضم القصب وسف التراب خير من الدنو من السلطان.", "وكتب أبو حازم إلى الزهري، وكان يخالط السلاطين: اعلم أن أدنى(١) ما ارتكبت وأعظم ما احتقبت أن آنست الظالم وسهلت له طريق البغي بدنوك حين أدنيت، وإجابتك حين دعيت، فما أخلقك أن تسأل غدا عن ما أردت بإغضائك عن ظلم الظلمة، وإنك أخذت ما ليس لمن أعطاك، جعلوك قطبا تدور عليه(٢) رحى باطلهم، وجسرا يعبرون بك إلى بلائهم، وسلما إلى ضلالتهم، يدخلون بك الشك على العلماء، ويقتادون بك قلوب الجهال إليهم، فلم يبلغ أخص وزرائهم ولا أقوى أعوانهم إلا دون ما بلغت من إصلاح فسادهم، فما أيسر ما عمروا لك في جنب ما خربوا عليك، وما أقل ما أعطوك في قدر ما أخذوا منك، فانظر لنفسك، فإنه لا ينظر لها غيرك، وحاسبها حساب رجل مسؤول، أين شكرك لمن استحملك كتابه، واستودعك علمه، ما يؤمنك أن تكون من الذين قال الله عز وجل: ﴿فَخَلَفَ مِنۢ بَعْدِهِمْ خَلْفٌ وَرِثُوا۟ ٱلْكِتَـٰبَ يَأْخُذُونَ عَرَضَ هَـٰذَا ٱلْأَدْنَىٰ﴾ [الأعراف: ١٦٩].", "وقال بشر الحافي: ما أقبح أن يقال: أين فلان العالم؟ فيقال: بباب الأمير."]], "ic": "book"}, {"story": ["الباب السادس فيما يحل من مخالطة السلاطين الظلمة ويحرم وحكم غ (٢ من ٥)، ص٤٠٥", ["وقال بعض الأمراء لبعض الزهاد: لم لا تأتينا؟ قال: أخاف إن أدنيتني فتنتني، وإن أقصيتني حرمتني، وليس في يدك ما أريده، ولا في يدي ما أخافك عليه، وإنما أتاك من أتاك ليستغني بك عن من سواك، وقد استغنيت عنك بمن أغناك عني.", "فهذه الآثار تبين كراهة مخالطة السلاطين، ونحن نفصل ذلك تفصيلا فقهيا نميز فيه المحظور من المكروه والمباح، فنقول: الداخل على السلطان معرض لأن", "حاشية: (١) في (ظ): «أذل».", "حاشية: (٢) في الأصل: «عليك».", "يعصي الله عز وجل إما بفعله، وإما بسكوته، وإما بقوله، وإما باعتقاده، ولا ينفك عن أحد هذه الأمور، أما الفعل؛ فالدخول عليهم في غالب الأحوال يكون إلى دور مغصوبة، والدخول فيها بغير إذن السالك حرام؛ فإن فرض الظالم في موضع غير مغصوب كالموات(١) مثلا، فإن كان تحت خيمة أو مظلة من ماله فهو حرام، والدخول عليه غير جائز؛ لأنه انتفاع بالحرام، واستظلال به، فإن فرض ذلك حلالا لم يعص بالدخول من حيث أنه دخول، ولا بقوله: السلام عليكم(٢). ولكن إن سجد أو ركع أو مثل قائما في سلامه وخدمته كان مكرما للظالم بسبب ولايته التي هي آلة ظلمه، والتواضع للظالم معصية، بل من تواضع لغني ليس بظالم لأجل غناه لا لمعنى آخر يقتضي التواضع ذهب ثلثا دينه، فكيف إذا تواضع للظالم؟ فلا يباح إلا مجرد السلام، فأما تقبيل اليد فهو معصية إلا عند خوف، أو لإمام عادل، أو عالم يستحق ذلك بأمر ديني، وقد قبل أبو عبيدة بن الجراح يد عمر بن الخطاب. فإن ترك الداخل جميع ذلك واقتصر على السلام، فلا يخلو من الجلوس على بساطهم وأغلب أموالهم الحرام، هذا من حيث الفعل.", "فأما السكوت، فهو أنه سيرى في مجالسهم من الفرش الحرير وأواني الفضة والحرير الملبوس عليهم وعلى غلمانهم ما هو حرام، وكل من رأى سيئة وسكت عليها فهو شريك فيها، بل يسمع من كلامهم ما هو فحش وكذب وشتم وإيذاء، والسكوت عن جميع ذلك حرام؛ لأنه يجب عليه الأمر بالمعروف والنهي عن المنكر.", "فإن قلت: إنه يخاف على نفسه فهو معذور في السكوت.", "قلنا: صدقت، إلا أنه مستغن عن أن يعرض نفسه لارتكاب ما لا يباح إلا بعذر؛ لأنه لو لم يدخل ولم يشاهد لم يجب عليه الأمر والنهي، وكل من علم بفساد في مكان وعلم أنه إذا حضر لم يقدر على إزالته لم يجز له أن يحضر.", "حاشية: (١) تحرفت في الأصل إلى: «الميراث».", "حاشية: (٢) في الأصل: «عليك»."]], "ic": "book"}, {"story": ["الباب السادس فيما يحل من مخالطة السلاطين الظلمة ويحرم وحكم غ (٣ من ٥)، ص٤٠٧", ["وأما القول؛ فهو أن يدعو للظالم أو يثني عليه أو يصدقه فيما يقول من باطل بصريح قوله أو بتحريك رأسه أو باستبشار في وجهه، أو يظهر له الحب والموالاة والاشتياق إلى لقائه والحرص على طول بقائه، فإنه في الغالب لا يقتصر على السلام بل يتكلم، ولا يعدو كلامه هذه الأقسام، وأما دعاؤه فلا يجوز له إلا أن يقول: أصلحك الله، أو وفقك، فقد جاء في الأثر: «من دعا للظالم بطول البقاء فقد أحب أن يعصى الله عز وجل»، فإن جاوز الدعاء إلى الثناء كان به كاذبا ومنافقا ومكرما للظالم»، وفي الأثر: «إن الله ليغضب إذا مدح الفاسق». فإن جاوز ذلك إلى التصديق له فيما يقول والتزكية فيما يعمل كان عاصيا بذلك معينا له على المعصية، فإن جاوز ذلك إلى إظهار المحبة والتشوق إلى لقائه وطول بقائه، فإن كان كاذبا عصى(١) معصية الكذب والنفاق، وإن كان صادقا عصى بحبه بقاء ظالم ينبغي له أن يمقته في الله، فإن أحبه لظلمه فهو عاص بمحبته، وإن أحبه لسبب آخر، فهو عاص من حيث إنه لم يبغضه، وكان الواجب عليه أن يبغضه.", "فإن سلم من ذلك كله وهيهات، لم يسلم من فساد يتطرق إلى قلبه، فإنه ينظر إلى توسعهم في النعم فيزدري نعم الله عليه، ثم يقتدي به غيره في الدخول، ويكون مكثرا لسواد الظلمة مجملا لهم، إن كان ممن يتجمل به، وقد دعي سعيد بن المسيب إلى البيعة للوليد وسليمان ابني عبد الملك فقال: لا أبايع اثنين ما اختلف الليل والنهار. فقالوا: ادخل من هذا الباب واخرج من الآخر. قال: لا والله لا يقتدي بي أحد من الناس. فجلد مئة وألبس المسوح، فعلى ما بينا لا يجوز الدخول على الأمراء الظلمة إلا بعذرين؛ أحدهما: إلزام(٢) من جهتهم يخاف من الخلاف فيه الأذى، والثاني: أن يدخل لرفع ظلم عن مسلم، فيجوز بشرط أن لا يكذب ولا يثني ولا يدع نصيحة يتوقع لها قبولا، فهذا حكم الدخول(٣).", "حاشية: (١) في الأصل: «عصى الله».", "حاشية: (٢) في (ظ): «إلى أمر».", "حاشية: (٣) ورد هنا في هامش (ظ) ما نصه: «للشيخ جلال الدين السيوطي كتاب سماه: ما رواه الأساطين في تحريم دخول العلماء على الأمراء والسلاطين». وذكره حاجي خليفة في كشف الظنون ٢/ ١٥٧٤ باسم: «ما رواه الأساطين في الدخول على السلاطين».", "**الحالة الثانية:** أن يدخل عليه السلطان زائرا، فجواب السلام لا بد منه، وأما القيام والإكرام فلا يحرم مقابلة له على إكرامه، فإنه بإكرام العلم والدين مستحق للحمد، كما أنه بالظلم مستحق للذم، فإن دخل عليه وحده، وقدر أن لا يقوم له إعزازا للدين واحتقارا للظلم وغضبا لله سبحانه من سوء فعله كان ذلك الأولى، وإن دخل عليه في جمع فمراعاة جشمة أرباب الولايات فيما بين الرعايا مهم، فلا بأس بالقيام على هذه النية، وإن علم أن ذلك لا يورث فسادا في الرعية ولا يناله أذى من غضبه، فترك القيام أولى."]], "ic": "book"}, {"story": ["الباب السادس فيما يحل من مخالطة السلاطين الظلمة ويحرم وحكم غ (٤ من ٥)، ص٤٠٨", ["ثم يجب عليه أن ينصحه ويعرفه تحريم ما يفعله مما لا يدري أنه محرم، فأما إعلامه بتحريم الظلم وشرب الخمر فلا فائدة فيه، بل عليه أن يخوفه من ركوب المعاصي مهما ظن أن التخويف يؤثر فيه، وعليه أن يرشده إلى المصالح، ومتى عرف طريقا للشرع يحصل به غرض الظالم عرفه إياه، فإذن يجب عليه تعريفه ما يجهل، وتخويفه مما يتجرأ عليه، وإرشاده إلى ما هو غافل عنه مما يغنيه عن الظلم، وقد كان جماعة من السلف يدخلون على الأمراء ويعظونهم، وسنذكر جملة من ذلك في كتاب الأمر بالمعروف.", "فأما العلماء الذين يريدون الدنيا فإنهم يدخلون على السلاطين للتقرب إليهم، فيدلونهم على الرخص ويستنبطون لهم بدقائق الحيل طرق السعة فيما يوافق أغراضهم، وإن وعظهم في خلال ذلك كان قصدهم اكتساب الجاه عندهم، فإن قالوا: إنما قصدنا زجرهم. فعلامة صدقهم في ذلك أنه لو تولى وعظهم شخص آخر فرحوا إذ كفوهم هذا المهم، فأما إذا أحبوا وعظهم دون غيرهم، فقد بان سوء القصد، وربما قالوا: إنما ندخل لنشفع في مسلم. ومعيار صدقهم ما تقدم من وقوع شفاعة غيرهم.", "**الحالة الثالثة:** أن يعتزل عنهم، فلا يراهم ولا يرونه، والسلامة في ذلك، ثم ينبغي له أن يعتقد بغضهم على ظلمهم، ولا يحب بقاءهم، ولا يثني عليهم، ولا يستخبر عن أحوالهم، ولا يتقرب إلى المصلين بهم، ولا يتأسف على ما يفوته بسبب مفارقتهم، كما قال حاتم الأصم: إنما بيني وبين الملوك يوم واحد؛ أما", "أمس فلا يجدون لذته، وأنا وإياهم من غد على وجل، وإنما هو اليوم، فما عسى أن يكون في اليوم؟", "وإذ قد تكلما في الدخول عليهم فلنرسم في الأحوال العارضة في مخالطتهم ومباشرة أموالهم.", "**مسائل:** مسألة: إذا بعث إليك السلطان مالا لتفرقه على الفقراء، فإن كان له مالك معين لم يحل أخذه، وإن لم يكن، بل كان حكمه أن يتصدق به كما سبق بيانه، فلك أن تأخذه وتتولى تفرقته، ومن العلماء من امتنع من أخذه، ولولا ثلاث غوائل لا تؤمن لرأينا أن الأولى أخذه:", "**الغائلة الأولى:** أن يظن السلطان بسبب أخذك أن ماله طيب، ولولا ذلك لم تأخذه، فإن كان كذلك، فلا تأخذه، فإنه لا يفي الخير في مباشرتك التفرقة بما يحصل لهم من الجرأة على كسب الحرام."]], "ic": "book"}, {"story": ["الباب السادس فيما يحل من مخالطة السلاطين الظلمة ويحرم وحكم غ (٥ من ٥)، ص٤٠٩", ["**الغائلة الثانية:** أن ينظر إليك غيرك من العلماء والجهال، فيقتدون بك في الأخذ، ويستدلون به على جوازه ثم لا يفرقون، وهذا يكون تسببا لإضلال خلق كثير، قال وهب بن منبه: أكره رجل على أكل لحم الخنزير فلم يأكل، فجعل له لحم غنم وقيل: كل. فلم يفعل، وقال: قد علم الناس أني إنما أكرهت على لحم الخنزير، فمن أين يعلمون أن الذي أكلته لحم غنم؟ ودخل وهب وطاووس على محمد بن يوسف أخي الحجاج في غداة باردة، فقال لغلامه: هلم ذلك الطيلسان وألقه على طاووس. فألقاه عليه، فما زال يحرك كتفيه حتى وقع عنه، فغضب محمد بن يوسف، فقال وهب: إن كنت لغنيا عن أن تغضبه، لو أخذت الطيلسان فتصدقت به. فقال: لولا أن يقول من بعدي: أخذه طاوس، ثم لا يصنع به ما أصنع لفعلت.", "**الغائلة الثالثة:** أن يتحرك قلبك إلى حبه لتخصيصه إياك وإيثاره لك بما أعطاك، فتحب حينئذ بقاءه وتكره عزله، وتحب اتساع ولايته، وكل ذلك حب للظلم، فإن كان كذلك، فهذا السم القاتل ولا خير فيما يحبب إليك أهل الظلم، أخبرنا", "محمد بن أبي القاسم قال: أخبرنا حمد بن أحمد قال: أخبرنا أبو نعيم الحافظ قال: أخبرنا أبو بكر بن مالك قال: حدثنا عبد الله بن أحمد قال: حدثنا هارون بن معروف قال: حدثنا ضمرة عن ابن شوذب قال: قسم أمير البصرة على أهل البصرة، فبعث إلى مالك بن دينار فقبل، فأتاه محمد بن واسع فقال: يا مالك، قبلت جوائز السلطان؟ فقال: يا أبا بكر، سل جلسائي. فقالوا: اشترى بها رقابا فأعتقهم. فقال له محمد: أنشدك الله أقلبك له الساعة على ما كان قبل أن يجيزك؟ قال: اللهم لا. قال: ترى أي شيء دخل عليك؟ فقال مالك لجلسائه: إنما مالك حمار، إنما يعبد الله مثل محمد بن واسع.", "**مسألة:** إذا جاز أخذ أموالهم وتفرقتها، فهل يجوز أن تسرق أموالهم، أو تخفى وديعتهم وتنكر وتفرق على الناس؟", "فالجواب: لا يجوز؛ لأنه ربما يكون لها مالك معين، ويكون السلطان على عزم أن يردها عليه، بخلاف ما يبعثه ليتصدق به، فإنه قد دل بإنفاذه أنه لا يعرف مالكه، ثم كيف يسرق ويحتمل أن يكون ما سرقه ملكا للسلطان حصل له بشراء في ذمته؟ فإن اليد دلالة على الملك.", "**مسألة:** وإذا كان أكثر أموالهم الحرام حرمت معاملتهم، وكل ما فيه إعانتهم على الظلم لا يجوز، ولا يجوز التجارة في الأسواق التي بنوها بالمال الحرام، وقد لعن رسول الله ﷺ في الخمر عشرة حتى العاصر(١) والمعتصر، ولعن آكل الربا وموكله وكاتبه وشاهديه.", "**مسألة:** ما يبنيه الظلمة من القناطر والمساجد والسقايات ينبغي أن ينظر فيه، فإن كانت تلك الأعيان التي بنيت بها معروفة المالك لم يجز العبور عليها إلا لضرورة يحل بها مثل ذلك من مال الغير، وإن لم يعرف مالكها، فحكمها أن ترصد للخيرات، فيجوز العبور عليها، والورع الامتناع.", "حاشية: (١) تحرفت في الأصل إلى: «العاصي»."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "وأما القول؛ فهو أن يدعو للظالم أو يثني عليه أو يصدقه فيما يقول من باطل بصريح قوله أو بتحريك رأسه أو  وألف بين نفوس المخلصين فصاروا خلانا، ونزع الغل من صدور المؤمنين فباتوا أخدانا، ومن عليهم بذلك وأنزل به قرآنا ﴿وَاذْكُرُوا۟ نِعْمَتَ ٱللَّهِ عَلَيْكُمْ إِذْ كُنتُمْ أَعْدَآءً فَأَلَّفَ بَيْنَ قُلُوبِكُمْ فَأَصْبَحْتُم بِنِعْمَتِهِۦٓ إِخْوَٰنًا﴾ [آل عمران: ١٠٣]، نحمده إذ أوطأنا من أوطان الألفة أوطانا، وتعاهدنا بلطفه(١) أحيانا فأحيانا، ونصلي على رسوله محمد أشرف الخلائق إنسانا، وعلى آله وأصحابه الذين كانوا أنصارا للدين وأعوانا، وسلم تسليما كثيرا.", "أما بعد، فإن المحبة في الله تعالى والأخوة في دينه من أفضل القربات، وألطف ما يستفاد من الطاعات في مجاري العادات، ولها شروط، وفيها حقوق بمراعاتها تصفو الأخوة عن شوائب الأكدار ونزعات الشيطان، فبالقيام بحقوقها يقرب إلى الله سبحانه، ونحن نبين مقاصد هذا الكتاب في ثلاثة أبواب إن شاء الله تعالى:", "الباب الأول: في فضيلة الألفة والأخوة في الله، وشروطها، ودرجاتها، وفوائدها.", "الباب الثاني: في حقوق الصحبة، وآدابها، ولوازمها.", "الباب الثالث: في حق المسلم، والرحم، والجوار، والملك، وكيفية المعاشرة مع من يدلي بهذه الأسباب.", "حاشية: (١) بعدها في الأصل: «بالقوم» ولا داعي لها."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "الباب الثالث: في حق المسلم، والرحم، والجوار، والملك، وكيفية المعاشرة مع من يدلي ____", "o": ["بهذه", "المسوح", "أبيح", "بالبول"], "h": "راجع: ص٤١١"}, {"t": "fill", "d": 2, "q": "أما بعد، فإن المحبة في الله تعالى والأخوة في دينه من أفضل القربات، وألطف ما يستفاد من الطاعات في مجاري العادات، ولها شروط، وفيها حقوق بمراعاتها تصفو الأخوة عن شوائب ____ ونزعات الشيطان، فبالقيام بحقوقها يقرب إلى الله سبحانه، ونحن نبين مقاصد هذا الكتاب في ثلاثة أبواب إن شاء الله تعالى", "o": ["الأكدار", "يتشاغلوا", "واستدركت", "والمعين"], "h": "راجع: ص٤١١"}]}], "sum": [["الصفحات", "ص٤١١ - ص٤١١"]], "_nq": 2}, {"id": "l26", "title": "الباب الأول في فضيلة الألفة والأخوة وشروطها ودرجاتها وفوائدها", "group": "كتاب آداب الصحبة والأخوة والمعاشرة مع الخلق", "map": {"center": "الباب\nالأول في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الأول في فضيلة الألفة والأخوة وشروطها ودرجاتها وفوائدها - القسم ١ من ٢", "b": [{"pic": ["books", "book"], "cap": "ص٤١٢ - ص٤٢٤"}, {"story": ["الباب الأول في فضيلة الألفة والأخوة وشروطها ودرجاتها وفوائده (١ من ١٠)، ص٤١٢", ["**في فضيلة الألفة والأخوة وشروطها ودرجاتها وفوائدها**", "**فضيلة الألفة والأخوة**", "اعلم أن الألفة ثمرة حسن الخلق، والتفرق ثمرة سوء الخلق، فحسن الخلق يوجب التحاب والتوالف والتوافق، وسوء الخلق يثمر التباغض والتحاسد والتدابر، ومهما كان المثمر محمودا كانت الثمرة محمودة، ولا يخفى فضل حسن الخلق، فقد قال تعالى: ﴿وَإِنَّكَ لَعَلَىٰ خُلُقٍ عَظِيمٍ﴾ [القلم: ٤] أخبرنا عبد الأول قال: أخبرنا الداودي قال: أخبرنا ابن أعين قال: حدثنا الفربري قال: حدثنا البخاري قال: حدثنا عمر بن حفص قال: حدثنا أبي قال: حدثنا الأعمش قال: حدثنا شقيق عن مسروق عن عبد الله بن عمرو عن النبي ﷺ أنه قال: «خياركم أحاسنكم أخلاقا». أخرجاه في الصحيحين، وفي حديث أبي الدرداء عن النبي ﷺ أنه قال: «ما شيء أثقل في ميزان المؤمن يوم القيامة من خلق حسن» رواه الترمذي وحكم بصحته، وروى أبو داود من حديث أبي هريرة عن النبي ﷺ أنه قال: «أكمل المؤمنين إيمانا أحسنهم خلقا». وفي حديث أبي ثعلبة الخشني عن النبي ﷺ أنه قال: «أحبكم إلي وأقربكم مني في الآخرة محاسنكم أخلاقا، وإن أبغضكم إلي وأبعدكم مني في الآخرة مساوئكم أخلاقا الثرثارون المتفيهقون المتشدقون»(١). وفي حديث عائشة رضي الله عنها عن النبي ﷺ أنه قال: «إن المؤمن ليدرك بحسن خلقه درجات قائم الليل وصائم النهار» وفي حديث أبي هريرة عن النبي ﷺ أنه سئل عن أكثر ما يدخل", "حاشية: (١) الثرثارون: الذين يكثرون الكلام تكلفا وخروجا عن الحق، والمتفيهقون: هم الذين يتوسعون في الكلام ويفتحون به أفواههم، والمتشدقون: الذين يلوون شدقهم في الكلام تفاصحا.", "الناس الجنة فقال: «تقوى الله وحسن الخلق». وفي حديث آخر أن النبي ﷺ كان يدعو، فيقول: «اللهم اهدني لأحسن الأخلاق، لا يهدي لأحسنها إلا أنت، واصرف عني سيئها، إنه لا يصرف سيئها إلا أنت». وقالت أم حبيبة: أرأيت المرأة يكون لها زوجان في الدنيا فتموت(١) ويموتان، فيدخلون الجنة، فلأيهما تكون؟ قال: «لأحسنهما خلقا يا أم حبيبة، ذهب حسن الخلق بخير الدنيا والآخرة».", "وإذا ثبت أن ثمرة الخلق الحسن الألفة، فقد ورد الثناء على الألفة، لا سيما إذا كانت الرابطة الدين والتقوى، قال الله تعالى: ﴿لَوْ أَنفَقْتَ مَا فِى ٱلْأَرْضِ جَمِيعًا مَّآ أَلَّفْتَ بَيْنَ قُلُوبِهِمْ وَلَـٰكِنَّ ٱللَّهَ أَلَّفَ بَيْنَهُمْ﴾ [الأنفال: ٦٣] وذم الفرقة فقال: ﴿وَلَا تَفَرَّقُوا۟﴾ [آل عمران: ١٠٣]."]], "ic": "book"}, {"story": ["الباب الأول في فضيلة الألفة والأخوة وشروطها ودرجاتها وفوائده (٢ من ١٠)، ص٤١٣", ["وأما المحبة في الله تعالى، ففي الصحيحين من حديث أبي هريرة عن النبي ﷺ أنه قال: «سبعة يظلهم الله عز وجل في ظله» فذكر منهم «رجلين تحابا في الله اجتمعا على ذلك وتفرقا عليه» وفيهما من حديث أنس عن النبي ﷺ أنه قال: «ثلاث من كن فيه وجد بهن حلاوة الإيمان: أن يكون الله ورسوله أحب إليه مما سواهما، وأن يحب المرء لا يحبه إلا لله، وأن يكره أن يعود في الكفر بعد إذ أنقذه الله منه، كما يكره أن توقد له نار فيقذف فيها». وفي أفراد مسلم من حديث أبي هريرة عن النبي ﷺ أنه قال: «إن الله تعالى يقول يوم القيامة: أين المتحابون بجلالي؟ اليوم أظلهم في ظلي يوم لا ظل إلا ظلي». وروى أبو مسلم الخولاني عن معاذ بن جبل عن النبي ﷺ أنه قال: «المتحابون في الله على منابر من نور في ظل العرش يوم لا ظل إلا ظله» قال: فلقيت عبادة بن الصامت فذكرت له حديث معاذ فقال: سمعت رسول الله ﷺ يحكي عن ربه عز وجل يقول: «حقت محبتي للمتحابين في، وحقت محبتي للمتباذلين في، وحقت محبتي للمتزاورين في، والمتحابون في الله على منابر من نور في ظل العرش يوم لا ظل إلا ظله». وفي حديث البراء بن عازب عن النبي ﷺ أنه قال: «أوثق عرى الإيمان أن تحب في الله وتبغض في الله». وفي حديث أبي هريرة عن النبي ﷺ أنه قال: «إن من عباد الله", "حاشية: (١) في الأصل: «فيموت».", "لعبادا يغبطهم الأنبياء والشهداء» قيل: من هم لعلنا نحبهم؟ قال: «هم قوم تحابوا بروح الله عز وجل على غير أموال ولا أنساب، وجوههم نور، وهم على منابر من نور، لا يخافون إذا خاف الناس، ولا يحزنون إذا حزن الناس». وفي حديث عمرو بن عبسة عن النبي ﷺ أنه قال: «إن الله عز وجل يقول: حقت محبتي للذين يتحابون من أجلي وحقت محبتي للذين يتصافون من أجلي».", "وقال أبو أمامة: من أحب لله، وأبغض لله، وأعطى لله، ومنع لله، فقد استكمل الإيمان.", "وقال أبو زرعة بن عمرو بن جرير: ما تحاب رجلان في الله عز وجل إلا كان أفضلهما أشدهما حبا لصاحبه.", "**وأما زيارة الإخوان:** فأخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا يزيد قال: أخبرنا حماد بن سلمة عن ثابت البناني عن أبي رافع عن أبي هريرة عن النبي ﷺ أنه قال: «خرج رجل يزور أخا له في الله عز وجل في قرية أخرى، فأرصد الله عز وجل بمدرجته ملكا فلما مر به قال: أين تريد؟ قال: أريد فلانا. قال: لقرابة؟ قال: لا. قال: فلنعمة له عندك تربها؟(١) قال: لا. قال: فلم تأتيه؟ قال: إني أحبه في الله عز وجل قال: فإني رسول الله إليك أنه يحبك لحبك إياه فيه». انفرد بإخراجه مسلم. وفي الصحيحين من حديث ابن مسعود وغيره عن النبي ﷺ أنه قال: «المرء مع من أحب»."]], "ic": "book"}, {"story": ["الباب الأول في فضيلة الألفة والأخوة وشروطها ودرجاتها وفوائده (٣ من ١٠)، ص٤١٤", ["وكان عمر بن الخطاب يذكر الأخ بالليل، فيقول: يا طولها من ليلة. فإذا صلى الغداة غدا إليه فإذا لقيه التزمه واعتنقه.", "وقال عمران بن حطان: لقد أحببت في الله ألف أخ كلهم أعرف اسمه واسم أبيه واسم قبيلته، وأعرف مكان داره. وهذا يدل على أنه كان يزورهم.", "وكان معروف الكرخي يقول: امش اثني عشر ميلا زر أخا في الله عز وجل.", "حاشية: (١) تربها: تحفظها.", "**بيان معنى الأخوة في الله تعالى وتمييزها عن الأخوة في الدنيا**", "اعلم أن الصحبة قد تقع بالاتفاق، كصحبة المسافرين والجيران، وتقع بالقصد، فتوجب المجالسة والمخالطة والمجاورة، ولا يكون هذا إلا لمحبوب، فإن غير المحبوب يجتنب، والمحبوب إما أن يحب لذاته، أو ليتوصل به إلى مقصود، وذلك المقصود، إما أن يكون مقصورا على الدنيا وحظوظها، أو متعلقا بالآخرة أو بالله تعالى، فهذه أربعة أقسام:", "**القسم الأول:** وهو حب الإنسان لذاته، فإنه ممكن، وهو أن يكون في ذاته محبوبا عندك تلتذ برؤيته ومعرفته ومشاهدة أخلاقه لاستحسانك لها، وكل جميل لذيذ في حق من أدرك جماله، وكل لذيذ محبوب، واللذة تتبع الاستحسان، والاستحسان يتبع المناسبة والملاءمة والموافقة بين الطباع، ثم ذلك المستحسن إما أن يكون في الصورة الظاهرة، وهي حسن الخلقة، أو في الصورة الباطنة، وهي كمال العقل وحسن الخلق، ويتبع حسن الأخلاق حسن الأفعال، وكل ذلك مستحسن عند الطبع السليم، وكل مستحسن مستلذ به ومحبوب بل في ائتلاف القلوب أمر أغمض من هذا وهو المناسبة الباطنة الموجبة للألفة، فإن شبه الشيء ينجذب إليه بالطبع، وفي الصحيحين من حديث عائشة عن النبي ﷺ أنه قال: «الأرواح جنود مجندة، فما تعارف منها ائتلف، وما تناكر منها اختلف». والائتلاف نتيجة التناسب الذي عبر عنه بالتعارف، والتناكر نتيجة التباين، قال الشاعر:", "وقائل كيف تفارقتما  فقلت قولا فيه إنصاف", "لم يك من شكلي ففارقته  والناس أشكال وألاف", "فقد ظهر من هذا أن الإنسان قد يحب لذاته بمجرد المجانسة والمناسبة في الطباع الباطنة والأخلاق الخفية، ويدخل في هذا القسم الحب للجمال إذا لم يكن المقصود قضاء الشهوة فإن الصورة الجميلة مستلذة في عينها، وإن قدر فقد أصل", "الشهوة حتى يستلذ النظر إلى الفواكه والأنوار والأزهار والتفاح المشرب بحمرة وإلى الماء والخضرة من غير غرض سوى عينها، وهذا هو الحب بالطبع."]], "ic": "book"}, {"story": ["الباب الأول في فضيلة الألفة والأخوة وشروطها ودرجاتها وفوائده (٤ من ١٠)، ص٤١٦", ["**القسم الثاني:** أن يحبه لينال من ذاته غير ذاته، فيكون وسيلة إلى محبوب غيره، والوسيلة إلى المحبوب محبوب، وما يحب لغيره كان ذلك الغير هو المحبوب بالحقيقة، ولكن الطريق إلى المحبوب محبوب، ولذلك أحب الناس الذهب والفضة ولا غرض فيهما إلا أنهما وسيلة إلى المحبوبات، فمن الناس من يحب كما يحب الذهب والفضة من حيث إنهما وسيلة إلى المقصود، إذ بهما يتوصل إلى نيل جاه أو مال أو علم، كما يحب الرجل سلطانا لانتفاعه بماله أو جاهه، ويحب خواصه لتحسينهم حاله عنده، فالمتوسل إليه إن كان مقصور الفائدة على الدنيا لم يكن من جملة الحب في الله، وإن لم يكن مقصور الفائدة على الدنيا ولكنه لا يقصد به إلا الدنيا، كحب التلميذ لأستاذه، فهو أيضا خارج عن الحب لله، فإنه إنما يحبه ليحصل منه العلم لنفسه، فمحبوبه العلم، فإذا كان لا يقصد العلم للتقرب إلى الله بل لينال به الجاه والمال والقبول عند الخلق، فمحبوبه الجاه والقبول، والعلم وسيلة إليه، و الأستاذ وسيلة إلى العلم، فليس في شيء من ذلك حب لله، إذ يتصور كل ذلك ممن لا يؤمن بالله أصلا.", "ثم ينقسم هذا إلى مذموم ومباح، فإن كان يقصد به التوصل إلى مقاصد مذمومة من قهر الأقران وظلم الرعايا بولاية القضاء كان الحب مذموما، وإن كان يقصد به التوصل إلى مباح، فهو مباح، وإنما تكتسب الوسيلة الحكم والصفة من المقصد المتوسل إليه، فإنها تابعة له غير قائمة بنفسها.", "**القسم الثالث:** أن يحبه لا لذاته بل لغيره، وذلك الغير ليس راجعا إلى حظوظه في الدنيا بل يرجع إلى حظوظه في الآخرة، فهذا أيضا ظاهر لا غموض فيه، وذلك كمن يحب أستاذه وشيخه؛ لأنه يتوسل به إلى تحصيل العلم، وتحسين العمل، ومقصوده من العلم والعمل الفوز في الآخرة، فهذا من جملة المحبين في الله، وكذلك من يحب تلميذه؛ لأنه يتلقف منه العلم، وينال بواسطته رتبة التعليم، ويرقى به إلى درجة التعظيم في ملكوت السماء، إذ قال عيسى ابن مريم عليه السلام: من"]], "ic": "book"}, {"story": ["الباب الأول في فضيلة الألفة والأخوة وشروطها ودرجاتها وفوائده (٥ من ١٠)، ص٤١٧", ["علم وعمل وعلم فذاك يدعى عظيما في ملكوت السماء. ولا يتم التعليم إلا بمتعلم، فهو إذن آلة في تحصيل هذا الكمال، وإن أحبه، لأنه آلة له إذ جعل صدره مزرعة لحرثه الذي هو سبب ترقيه إلى رتبة التعظيم(١) في ملكوت السماء، فهو محب في الله، بل الذي يتصدق بأموال الله، ويجمع الضيفان ويهيئ لهم الأطعمة اللذيذة تقربا إلى الله عز وجل، فأحب طباخا لحسن صنعته في الطبخ، فهو في جملة المحبين في الله عز وجل، وكذا لو أحب من يتولى له إيصال الصدقة إلى المستحقين، فقد أحبه في الله، بل نزيد على هذا ونقول: إذا أحب من يخدمه بنفسه في غسل ثيابه، وكنس بيته، وطبخ طعامه وتفرغه بذلك للعلم والعمل ومقصوده من استخدامه في هذه الأعمال الفراغ للعبادة، فهو محب في الله، بل نزيد عليه ونقول: إذا أحب من ينفق ماله عليه ويواسيه بكسوته وطعامه ومسكنه وجميع أغراضه التي يقصدها في دنياه، ومقصوده من جملة ذلك الفراغ للعلم والعمل للتقرب إلى الله تعالى، فهو محب في الله، فقد كان جماعة من السلف تكفل بكفايتهم جماعة من أهل الثروة، وكان المواسي والمواسى جميعا من المتحابين في الله، بل نزيد على ذلك ونقول: من نكح امرأة صالحة ليتحصن بها عن وساوس الشيطان، ويصون بها دينه، وليولد له ولد صالح يدعو له، فأحب زوجته لأنها آلته في هذه المقاصد الدينية، فهو محب في الله سبحانه، فلذلك قال في الإنفاق على العيال: «حتى اللقمة يرفعها الرجل إلى فم امرأته».", "واعلم أن كل حب لولا الإيمان بالله واليوم الآخر لم يوجد، فهو حب في الله، وكذلك كل زيادة في الحب لولا الإيمان بالله (٢-٢)واليوم الآخر(٢-٢) لم تكن تلك الزيادة، فتلك الزيادة من الحب في الله، فذلك وإن دق فهو عزيز.", "**القسم الرابع:** أن يحب لله وفي الله، لا لينال منه علما أو عملا، أو يتوسل به إلى أمر وراء ذاته، وهذا أعلى الدرجات، وهو أدقها وأغمضها.", "حاشية: (١) في (ظ): «العظمة».", "حاشية: (٢-٢) سقط من (ظ).", "ومن آثار الحب أن يتعدى من المحبوب إلى كل من يتعلق بالمحبوب، فإن من أحب إنسانا حبا شديدا أحب محب ذلك الإنسان، وأحب محبوبه ومن يخدمه ويثني (١-١)عليه أو يثني المحبوب عليه(١-١) ومنه قول القائل(٢):", "أمر على الديار ديار ليلى  أقبل ذا الجدار وذا الجدارا", "وما حب الديار شغفن قلبي  ولكن حب من سكن الديارا", "وهذا إنما يقع من إفراط المحبة وقوتها، فمن أحب الله تعالى واستولى حبه على قلبه أحب كل موجود من آثار قدرته، فإن من أحب إنسانا أحب خطه وصنعته.", "وحب الله تعالى تارة يكون لصدق الرجاء في وعده، وتارة لما سبق من زيادته، وتارة لذاته، وسيأتي تحقيق ذلك في كتاب المحبة إن شاء الله تعالى."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "يخصمه، فالأمر فيه أخف، ولكنه في وقت مباشرته إن صودف وجب منعه بما يمتنع به، فإن كان النصح يرده نصح وتلطف به، وإن كان التغليظ ____ فعل", "o": ["أنفع", "وإحياء", "البرء", "فرشكم"], "h": "راجع: ص٤٢٢"}, {"t": "fill", "d": 2, "q": "واعلم أنه لا يصلح للصحبة كل أحد، ولا بد أن يتميز المصحوب بصفات وخصال يرغب بسببها في صحبته، وتشترط تلك الخصال بحسب الفوائد المطلوبة من الصحبة، إذ معنى الشرط ما لا بد منه ____، ويطلب من الصحبة فوائد دينية ودنيوية", "o": ["للوصول", "بنوه", "ويغفر", "بأحد"], "h": "راجع: ص٤٢٢"}, {"t": "fill", "d": 2, "q": "الثاني: صاحب الماخور الذي يهيئ أسباب الفساد ويسهل طرقه على الخلق، فهذا يؤذي الناس في دينهم، وذلك ____ الإهانة والإعراض", "o": ["يقتضي", "صفحة", "مربع", "أتفقد"], "h": "راجع: ص٤٢١"}, {"t": "fill", "d": 2, "q": "الثالث: المبتدع العامي الذي لا يقدر أن يدعو ولا يخاف الاقتداء به، فأمره أهون والأولى أن يتلطف به في النصح، فإن قلوب العوام سريعة التقلب، فإن لم ____ النصح وكان في الإعراض عنه تقبيح لبدعته في", "o": ["ينفع", "وهجرها", "يعجز", "وللذي"], "h": "راجع: ص٤٢١"}, {"t": "fill", "d": 2, "q": "فقد ظهر من هذا أن الإنسان قد يحب لذاته بمجرد المجانسة والمناسبة في الطباع الباطنة والأخلاق الخفية، ويدخل في هذا ____ الحب للجمال إذا لم يكن المقصود قضاء الشهوة فإن الصورة الجميلة مستلذة في عينها، وإن قدر فقد أصل", "o": ["القسم", "وعمله", "ارتفعت", "واجبا"], "h": "راجع: ص٤١٥"}, {"t": "fill", "d": 2, "q": "أعدائهم فيهم ويفرحه عند الثناء عليهم، وكل ذلك حب لله؛ لأنهم خواص عباد الله، ومن أحب ملكا أحب خواصه وخدمه، وقد يغلب الحب فلا يبقى للنفس حظ إلا فيما هو حظ المحبوب، وقد يكون الحب بحيث يترك بعض الحظوظ دون بعض، كمن تسمح نفسه بأن يشاطر محبوبه ماله، فمقادير الأموال موازين المحبة إذ لا تعرف درجة المحبوب إلا بمحبوب يترك في مقابلته، فمن استغرقه الحب لم يبق له محبوب سوى ربه، فحصل من هذا أن كل من أحب عالما أو عابدا، أو أحب عبدا راغبا في علم أو عبادة أو في خير، فإنما أحبه لله وفي الله، وله في ذلك من الثواب ____ قوة حبه، فهذا شرح الحب في الله ودرجاته، وبهذا يتضح البغض في الله أيضا، ولكن نزيده بيانا", "o": ["بقدر", "يستمد", "والسلم", "غنمك"], "h": "راجع: ص٤١٩"}]}, {"t": "الباب الأول في فضيلة الألفة والأخوة وشروطها ودرجاتها وفوائدها - القسم ٢ من ٢", "b": [{"story": ["الباب الأول في فضيلة الألفة والأخوة وشروطها ودرجاتها وفوائده (٦ من ١٠)، ص٤١٨", ["وكيف ما اتفقت محبة الله، فإذا قويت تعدت إلى كل متعلق به ضربا من التعلق حتى يتعلق بما هو مؤلم مكروه، إلا أن فرط الحب يضعف الإحساس بالألم، كالفرح بقرصة من المحبوب فيها نوع معاتبة، وقد انتهت محبة الله بقوم قالوا: لا نفرق بين البلاء والنعمة إذ الكل من الله. وسيأتي تحقيق ذلك في كتاب المحبة إن شاء الله.", "والمقصود أن حب الله تعالى إذا قوي أثمر حب كل من يقوم بحق عبادة الله في علم أو عمل، وأثمر حب كل من فيه صفة هي مرضية عند الله من خلق حسن، أو تأدب بأدب الشرع، وما من مؤمن محب للآخرة ومحب لله سبحانه إذا أخبر عن حال رجلين أحدهما عالم عابد والآخر جاهل فاسق إلا وجد في نفسه ميلا إلى العالم العابد، ثم يضعف ذلك الميل ويقوى بحسب ضعف إيمانه وقوته، وبحسب ضعف حبه لله وقوته، ولو كان الحب مقصورا على حظ ينال من المحبوب في الحال أو المآل لما تصور حب الموتى من العلماء والعباد بل من الأنبياء، ومعلوم أن حب الجميع مكنون(٣) في قلب كل مسلم متدين ويبين ذلك بغضبه عند طعن", "حاشية: (١-١) سقط من (ظ).", "حاشية: (٢) هو مجنون ليلى قيس بن الملوح.", "حاشية: (٣) في (ظ): «مكتوب».", "أعدائهم فيهم ويفرحه عند الثناء عليهم، وكل ذلك حب لله؛ لأنهم خواص عباد الله، ومن أحب ملكا أحب خواصه وخدمه، وقد يغلب الحب فلا يبقى للنفس حظ إلا فيما هو حظ المحبوب، وقد يكون الحب بحيث يترك بعض الحظوظ دون بعض، كمن تسمح نفسه بأن يشاطر محبوبه ماله، فمقادير الأموال موازين المحبة إذ لا تعرف درجة المحبوب إلا بمحبوب يترك في مقابلته، فمن استغرقه الحب لم يبق له محبوب سوى ربه، فحصل من هذا أن كل من أحب عالما أو عابدا، أو أحب عبدا راغبا في علم أو عبادة أو في خير، فإنما أحبه لله وفي الله، وله في ذلك من الثواب بقدر قوة حبه، فهذا شرح الحب في الله ودرجاته، وبهذا يتضح البغض في الله أيضا، ولكن نزيده بيانا.", "**بيان البغض في الله عز وجل:** اعلم أن من يحب في الله لا بد أن يبغض في الله، فإنك إذا أحببت إنسانا لأنه مطيع لله ومحبوب عنده، فإن عصاه فلا بد أن تبغضه؛ لأنه عاص لله عز وجل وممقوت عنده، ولكل واحد من الحب والبغض دفين في القلب يترشح بظهور أفعال المحبين والمبغضين في المقاربة والمباعدة والمخالفة والموافقة، فإذا ظهر في الفعل سمي موالاة ومعاداة، ولذلك قال: هل واليت في وليا أو عاديت في عدوا؟"]], "ic": "book"}, {"story": ["الباب الأول في فضيلة الألفة والأخوة وشروطها ودرجاتها وفوائده (٧ من ١٠)، ص٤١٩", ["ومن اجتمعت فيه خصال محمودة ومكروهة فإنك تحبه من وجه وتبغضه من وجه، كمن له زوجة حسناء فاجرة، فينبغي أن تحب المسلم لإسلامه وتبغضه لمعصيته، فتكون معه على حال متوسطة بين الانقباض والاسترسال، والتودد والتوحش، ولا تبالغ في إكرامه مبالغتك في إكرام من يوافقك على جميع أغراضك، ثم يميل ذلك التوسط إلى جانب الإهانة عند غلبة الخيانة، وإلى طرف الإكرام والمحاملة عند غلبة الموافقة، فأما ما يجري منه مجرى الهفوة التي تعلم أنه نادم عليها، فالأولى حينئذ الإغماض والستر، فإذا أصر على معصيته فلا بد من إظهار أثر البغض بالإعراض عنه والتباعد، وتغليظ القول له على حسب غلظ المعصية وخفتها، وأما في الفعل فتقطع معونته ونصره، وتسعى في إفساد أغراضه عليه، كفعل الأعداء المبغضين، ولكن فيما يفسد عليه طريق المعصية لا فيما لا يؤثر.", "**بيان مراتب الذين يبغضون في الله وكيف معاملتهم:** اعلم أن المخالف لأمر الله تعالى لا يخلو إما أن يكون مخالفا في عقده، أو في عمله، والمخالف في العقد إما كافر أو مبتدع، والمبتدع إما داع إلى بدعته أو ساكت إما لعجزه أو باختياره، فأقسام الفساد في الاعتقاد ثلاثة.", "**الأول:** الكفر، والكافر إن كان محاربا، فهو مستحق للقتل والإرقاق، وليس بعد هذين الأمرين إهانة، وأما الذمي، فإنه لا يجوز إيذاؤه إلا بالإعراض عنه والتحقير له بالاضطرار إلى أضيق الطرق، وبترك المفاتحة بالسلام، فإذا قال: السلام عليك. قلت: وعليك. والأولى الكف عن مخالطته ومعاملته ومؤاكلته، ومن المكروه الاسترسال إليه والانبساط معه كما يفعل بالأصدقاء، قال الله تعالى: ﴿لَّا تَجِدُ قَوْمًا يُؤْمِنُونَ بِٱللَّهِ وَٱلْيَوْمِ ٱلْـَٔاخِرِ يُوَآدُّونَ مَنْ حَآدَّ ٱللَّهَ وَرَسُولَهُۥ وَلَوْ كَانُوٓا۟ ءَابَآءَهُمْ أَوْ أَبْنَآءَهُمْ أَوْ إِخْوَٰنَهُمْ أَوْ عَشِيرَتَهُمْ﴾ [المجادلة: ٢٢] وقال تعالى: ﴿لَا تَتَّخِذُوا۟ عَدُوِّى وَعَدُوَّكُمْ أَوْلِيَآءَ تُلْقُونَ إِلَيْهِم بِٱلْمَوَدَّةِ﴾ [الممتحنة: ١]."]], "ic": "book"}, {"story": ["الباب الأول في فضيلة الألفة والأخوة وشروطها ودرجاتها وفوائده (٨ من ١٠)، ص٤٢٠", ["**الثاني:** المبتدع الذي يدعو إلى بدعته، فإن كانت البدعة بحيث يكفر بها، فأمره أشد من الذمي؛ لأنه لا يقر بجزيته ولا يسامح بعقد ذمة، وإن كان ممن لا يكفر بها، فأمره بينه وبين الله تعالى أخف من أمر الكافر لا محالة، ولكن الأمر في الإنكار عليه أشد منه على الكافر؛ لأن شر الكافر غير متعد، فإن المسلمين اعتقدوا كفره فلا يلتفتون إلى قوله، إذ لا يدعى لنفسه الإسلام واعتقاد الحق، فأما المبتدع الذي يدعو إلى البدعة، وزعم أن ما يدعو إليه حق، فهو سبب لغواية الخلق، فشره متعد، فالاستحباب في إظهار بغضه ومعاداته والانقطاع عنه وتحقيره والتشنيع عليه ببدعته وتنفير الناس عنه أشد، وإن سلم في خلوة، فلا بأس برد جوابه، وإن علم أن الإعراض عنه والسكوت عن جوابه يقبح في نفسه بدعته ويؤثر في زجره، فترك الجواب أولى، وإن كان في ملأ، فترك الجواب أولى تنفيرا للناس عنه وتقبيحا لبدعته في أعينهم. قال سفيان الثوري: من صافح مبتدعا فقد نقض الإسلام عروة عروة. وقال الفضيل: من أحب صاحب بدعة أحبط الله عمله، وأخرج نور الإسلام من قلبه.", "**الثالث:** المبتدع العامي الذي لا يقدر أن يدعو ولا يخاف الاقتداء به، فأمره أهون والأولى أن يتلطف به في النصح، فإن قلوب العوام سريعة التقلب، فإن لم ينفع النصح وكان في الإعراض عنه تقبيح(١) لبدعته في عينه تأكد الاستحباب في الإعراض، وإن علم أن ذلك لا يؤثر فيه لجمود طبعه، ورسوخ اعتقاده في قلبه، فالإعراض أولى؛ لأن البدعة إذا لم يبالغ في تقبيحها شاعت بين الخلق وعم فسادها، وأما العاصي بفعله وبعمله لا باعتقاده، فلا يخلو إما أن يكون بحيث يتأذى به غيره، كالظلم والغصب وشهادة الزور والغيبة والمشي بالنميمة وأمثال ذلك، أو يكون مما لا يقتصر عليه ويؤذي غيره، وذلك ينقسم إلى من يدعو غيره إلى الفساد، كصاحب الماخور(٢) الذي يجمع بين الرجال والنساء ويهيئ أسباب الشرب والفساد لأهل الفساد، أو لا يدعو غيره إلى فعله، كالذي يسرق ويزني، وهذا الذي لا يدعو غيره إما أن يكون عصيانه بكبيرة أو بصغيرة، وإما أن يكون مصرا أو غير مصر، فهذه التقسيمات يتحصل منها ثلاثة أقسام، ولكل قسم منها رتبة، وبعضها أشد من بعض، فلا نسلك بالكل مسلكا واحدا.", "**القسم الأول:** وهو أشدها؛ ما يتضرر به الناس، كالظلم والغصب وشهادة الزور والغيبة والنميمة، فهؤلاء الأولى الإعراض عنهم، وترك مخالطتهم والانقباض عن معاملتهم؛ لأن المعصية شديدة فيما يرجع إلى إيذاء الخلق، ثم هؤلاء يتقسمون إلى من يظلم في الدماء، وإلى من يظلم في الأموال، وإلى من يظلم في الأعراض، وبعضها أشد من بعض، والاستحباب في إهانتهم والإعراض عنهم مؤكد جدا، ومتى توقع من الإهانة لهم الزجر لهم ولغيرهم تأكد."]], "ic": "book"}, {"story": ["الباب الأول في فضيلة الألفة والأخوة وشروطها ودرجاتها وفوائده (٩ من ١٠)، ص٤٢١", ["**الثاني:** صاحب الماخور الذي يهيئ أسباب الفساد ويسهل طرقه على الخلق، فهذا يؤذي الناس في دينهم، وذلك يقتضي الإهانة والإعراض والمقاطعة.", "**الثالث:** الذي يفسق في نفسه بشرب خمر، أو ترك واجب، أو مقارفة محظور", "حاشية: (١) في الأصل: «يقبح».", "حاشية: (٢) الماخور: بيت الريبة ومجمع أهل الفسق والفساد.", "يخصمه، فالأمر فيه أخف، ولكنه في وقت مباشرته إن صودف وجب منعه بما يمتنع به، فإن كان النصح يرده نصح وتلطف به، وإن كان التغليظ أنفع فعل.", "**بيان الصفات المشروطة فيمن تختار**(١) **صحبته:** قد روينا عن النبي ﷺ أنه قال: «المرء على دين خليله، فلينظر أحدكم من يخالل».", "واعلم أنه لا يصلح للصحبة كل أحد، ولا بد أن يتميز المصحوب بصفات وخصال يرغب بسببها في صحبته، وتشترط تلك الخصال بحسب الفوائد المطلوبة من الصحبة، إذ معنى الشرط ما لا بد منه للوصول، ويطلب من الصحبة فوائد دينية ودنيوية.", "أما الدنياوية، فكالانتفاع بالمال أو الجاه أو مجرد الاستئناس بالمشاهدة والمحاورة وليس ذلك من غرضنا.", "وأما الدينية فيجتمع فيها أغراض مختلفة، فمنها الاستفادة بالعلم والعمل، ومنها الاستفادة من الجاه تحصنا به عن إيذاء يكدر القلب ويصد عن العبادة، ومنها الاستفادة بالمال للاكتفاء به عن تضييع الأوقات في طلب القوت، ومنها الاستعانة في المهمات، فيكون عدة في المصائب، وقوة في الأحوال، ومنها التبرك لمجرد الدعاء، ومنها انتظار الشفاعة في الآخرة، كما قال بعض السلف: استكثروا من الإخوان، فإن لكل مؤمن شفاعة. فهذه فوائد تستدعي كل فائدة شروطا لا تحصل إلا بها.", "وفي الجملة؛ فينبغي أن يكون فيمن يؤثر صحبته خمس خصال: أن يكون عاقلا، حسن الخلق، غير فاسق، ولا مبتدع، ولا حريص على الدنيا.", "أما العقل، فهو رأس المال، وهو الأصل ولا خير في صحبة الأحمق، قال علي رضي الله عنه:", "فلا تصحب أخا الجهل  وإياك وإياه", "حاشية: (١) في الأصل: «يختار».", "فكم من جاهل أردى  حكيما حين آخاه", "يقاس المرء بالمرء  إذا ما هو ماشاه", "وللشيء على الشيء  مقاييس وأشباه", "وللقلب على القلب  دليل حين يلقاه", "واعلم أن الأحمق يريد أن ينفعك فيضرك، ونعني بالعاقل الذي يفهم الأمور على ما هي عليه إما بنفسه وإما إذا فهم.", "وأما حسن الخلق فلا بد منه، إذ رب عاقل يدرك الأشياء على ما هي عليه، ولكن إذا غلبه غضب أو شهوة أطاع هواه وخالف ما هو المعلوم عنده لعجزه عن قهر الهوى، فلا خير في صحبته.", "وأما الفاسق المصر على الفسق، فإنه لا يخاف الله، ومن لا يخاف الله لا تؤمن غائلته، ولا يوثق بصداقته، وقد قال تعالى: ﴿فَأَعْرِضْ عَن مَّن تَوَلَّىٰ عَن ذِكْرِنَا وَلَمْ يُرِدْ إِلَّا ٱلْحَيَوٰةَ ٱلدُّنْيَا﴾ [النجم: ٢٩] وقال تعالى: ﴿وَٱتَّبِعْ سَبِيلَ مَنْ أَنَابَ إِلَىَّ﴾ [لقمان: ١٥]."]], "ic": "book"}, {"story": ["الباب الأول في فضيلة الألفة والأخوة وشروطها ودرجاتها وفوائده (١٠ من ١٠)، ص٤٢٣", ["وأما المبتدع، فيخاف من صحبته سراية البدعة، وقد قال عمر بن الخطاب: عليك بإخوان الصدق تعش في أكنافهم، فإنهم زينة في الرخاء، وعدة في البلاء، وضع أمر أخيك على أحسنه حتى يجيئك(١) ما يغلبك منه، واعتزل عدوك، واحذر صديقك إلا الأمين، ولا أمين إلا من يخشى الله، ولا تصحب الفاجر تعلم من فجوره، ولا تطلعه على سرك، واستشر في أمرك الذين يخشون الله تعالى، وقال حكيم لابنه: اصحب من إذا صحبته زانك، وإن خدمته صانك، وإن قعدت بك مؤنة مانك(٢). وقال آخر: لا تصحب إلا من يكتم سرك، ويستر عيبك، ويؤثرك بالرغائب، ويكون معك في النوائب، وينشر حسنك، ويطوي سيئك، فإن لم تجده فلا تصحب إلا نفسك. وروي عن علي رضي الله عنه:", "حاشية: (١) في الأصل: «يحبك».", "حاشية: (٢) مانه مونا: احتمل مؤونته وقام بكفايته.", "إن أخاك الصدق من كان معك  ومن يضر نفسه لينفعك", "ومن إذا ريب الزمان صدعك  شتت شمل نفسه ليجمعك", "وقال حكيم: الناس أربعة؛ فواحد حلو كله، فلا تشبع منه، وآخر مر كله، فلا تأكل منه، وآخر فيه حموضة فخذ منه قبل أن يأخذ منك، وآخر فيه ملوحة فخذ منه وقت الحاجة فقط.", "وقال جعفر الصادق: لا تصحب خمسة: الكذاب، فإنك منه على غرور، وهو مثل السراب، يقرب منك البعيد ويبعد منك القريب، والأحمق، فإنك لست منه على شيء، يريد أن ينفعك فيضرك، والبخيل، فإنه يقطع بك أحوج ما تكون إليه، والجبان، فإنه يسلمك ونفسه عند الشدائد(١)، والفاسق، فإنه يبيعك بأكلة أو أقل منها. قيل: وما أقل منها؟ قال: الطمع فيها ثم لا ينالها.", "وأما الديانة وعدم الفسق، فإن الفاسق يهون المعصية، وأما الحريص على الدنيا، فإن الطبع يسرق من الطبع من حيث لا يدري، فمجالسة الحريص تحرك الحرص، كما أن مجالسة الزاهد تحرك الزهد، ومن لم يجد من فيه هذه الشرائط فالوحدة خير له، قال أبو ذر: الوحدة خير من جليس السوء، والجليس الصالح خير من الوحدة.", "حاشية: (١) في الأصل: «الشدة»."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "والمقصود أن حب الله تعالى إذا قوي أثمر حب كل من يقوم بحق عبادة الله في علم أو عمل، وأثمر حب كل من فيه صفة هي مرضية عند الله من خلق حسن، أو تأدب بأدب الشرع، وما من مؤمن محب للآخرة ومحب لله سبحانه إذا أخبر عن حال رجلين أحدهما عالم عابد والآخر جاهل فاسق إلا وجد في نفسه ميلا إلى العالم ____، ثم يضعف ذلك الميل ويقوى بحسب ضعف إيمانه وقوته، وبحسب ضعف حبه لله وقوته، ولو كان الحب مقصورا على حظ ينال من المحبوب في الحال أو المآل لما تصور حب الموتى من العلماء والعباد بل من الأنبياء، ومعلوم أن حب الجميع مكنون في قلب كل مسلم متدين ويبين ذلك بغضبه عند طعن", "o": ["العابد", "رزقه", "تتوب", "يصرف"], "h": "راجع: ص٤١٨"}, {"t": "fill", "d": 2, "q": "وأما المبتدع، فيخاف من صحبته سراية ____، وقد قال عمر بن الخطاب", "o": ["البدعة", "ويدل", "لعبة", "أمامه"], "h": "راجع: ص٤٢٣"}, {"t": "fill", "d": 2, "q": "بيان مراتب الذين يبغضون في الله ____ معاملتهم", "o": ["وكيف", "موسى", "جواد", "العبدي"], "h": "راجع: ص٤٢٠"}, {"t": "fill", "d": 2, "q": "وأما الديانة وعدم الفسق، فإن الفاسق يهون المعصية، وأما الحريص على الدنيا، فإن الطبع يسرق من الطبع من حيث لا يدري، فمجالسة الحريص تحرك الحرص، كما أن مجالسة الزاهد تحرك الزهد، ومن لم يجد من فيه هذه ____ فالوحدة خير له، قال أبو ذر", "o": ["الشرائط", "توفية", "وهيئة", "قلابة"], "h": "راجع: ص٤٢٤"}, {"t": "fill", "d": 2, "q": "بيان البغض في الله عز وجل: اعلم أن من يحب في الله لا بد أن يبغض في الله، فإنك إذا أحببت إنسانا لأنه مطيع لله ومحبوب عنده، فإن عصاه فلا بد أن تبغضه؛ لأنه عاص لله عز وجل وممقوت عنده، ____ واحد من", "o": ["ولكل", "للجمع", "وملكه", "بمكروه"], "h": "راجع: ص٤١٩"}, {"t": "fill", "d": 2, "q": "القسم الرابع: أن يحب لله وفي الله، لا لينال منه علما أو ____، أو يتوسل به إلى أمر وراء ذاته، وهذا أعلى الدرجات، وهو أدقها", "o": ["عملا", "ذنبك", "وضمان", "أحدا"], "h": "راجع: ص٤١٧"}]}], "sum": [["الصفحات", "ص٤١٢ - ص٤٢٤"]], "_nq": 12}, {"id": "l27", "title": "الباب الثاني في حقوق الأخوة والصحبة", "group": "كتاب آداب الصحبة والأخوة والمعاشرة مع الخلق", "map": {"center": "الباب\nالثاني في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الثاني في حقوق الأخوة والصحبة - القسم ١ من ٢", "b": [{"pic": ["books", "book"], "cap": "ص٤٢٥ - ص٤٣٦"}, {"story": ["الباب الثاني في حقوق الأخوة والصحبة (١ من ٩)، ص٤٢٥", ["**في حقوق الأخوة والصحبة**", "اعلم أن عقد الأخوة رابطة بين الشخصين، كعقد النكاح بين الزوجين، فكما أن النكاح يقتضي حقوقا يلزم الوفاء بها، فكذا عقد الأخوة، فلأخيك عليك ثمان حقوق.", "**الحق الأول:** في المال، وذلك على ثلاث مراتب:", "أدناها: أن تنزله منزلة عبدك أو خادمك، فتقوم بحاجته من فضول مالك من غير أن تحوجه إلى السؤال، فإن أحوجته إلى السؤال فذلك غاية التقصير في حق الأخوة.", "**المرتبة الثانية:** أن تنزله منزلة نفسك، وترضى بمشاركته إياك في مالك حتى تسمح بمشاطرته مالك، وفي الصحيحين من حديث أنس أن النبي ﷺ آخى بين عبد الرحمن بن عوف وسعد بن الربيع، فقال سعد لعبد الرحمن: إني أكثر الأنصار مالا فأقسم مالي نصفين، ولي امرأتان، فانظر أعجبهما إليك فسمها لي أطلقها، فإذا انقضت عدتها فتزوجها. فقال: بارك الله لك في أهلك ومالك، أين سوقكم؟ فدلوه على السوق فما انقلب إلا ومعه فضل من أقط وسمن.", "**المرتبة الثالثة:** وهي العليا أن تؤثره على نفسك، وتقدم حاجته على حاجتك، وهذا منتهى درجات المتحابين، وقد روينا أن أخوين جازا في برية، فإذا سبع، فقال أحدهما للآخر: قف حتى أمضي أنا فيشتغل بي عنك، فقال: والله ما تطيب نفسي. فمرا جميعا، فلم يعرض الأسد لهما.", "واعلم أنه إذا لم تكن مع أخيك في بعض هذه الرتب الثلاثة، فاعلم أن عقد الأخوة لم ينعقد بعد في الباطن، وإنما الجاري بينكما مخالطة رسمية لا وقع لها.", "قال الحسن البصري: كنا نعد البخيل الذي يقرض أخاه، وليس من المروءة أن يربح الرجل على صديقه.", "وكان مؤرق العجلي يأتي بالصرة فيها الأربع مئة والخمس مئة فيودعها الأخ من إخوانه ثم يلقاه بعد فيقول: انتفع بها فهي لك. وروينا أن مسروقا ادان دينا ثقيلا، وكان على خيثمة دين، فذهب مسروق فقضى دين خيثمة وهو لا يعلم، وذهب خيثمة فقضى دين مسروق وهو لا يعلم.", "ودخلوا على الحسن وهو نائم فجعل بعضهم يأكل من فاكهة في بيته فانتبه، فقال: رحمك الله، هذا والله فعل الإخوان."]], "ic": "book"}, {"story": ["الباب الثاني في حقوق الأخوة والصحبة (٢ من ٩)، ص٤٢٦", ["وقال أبو جعفر الباقر لأصحابه: أيدخل أحدكم يده في كم أخيه فيأخذ ما يريد؟ قالوا: لا. قال: فلستم بإخوان كما تزعمون. وورث خيثمة مئة(١) ألف فأنفقها على إخوانه، وكان بعض السلف يقول: إني لأستحيي من الله أن أسأل الله الجنة لأخ من إخواني وأبخل عليه بدينار أو درهم. وجاء رجل إلى صديق له فأخبره بدين عليه، فدخل إلى بيته فوزن له أربع مئة دينار(٢) ثم خرج فأعطاه ثم دخل باكيا، فقالت له زوجته: هلا تعللت عليه إذا كان إعطاؤه يشق عليك. فقال: إنما أبكي لأني لم أتفقد حاله، فاحتاج أن يقول لي ذلك. وقال(٣) أبو سليمان الداراني: لو أن الدنيا كلها لقمة ثم جاءني أخ لي لأحببت أن أضعها في فيه. وقال يحيى بن معاذ: بئس الصديق صديق تحتاج أن تقول له: اذكرني في دعائك، أو أن تعيش معه بالمداراة، أو تحتاج أن تعتذر إليه. أخبرنا محمد بن ناصر قال: أخبرنا حمد بن أحمد قال: أخبرنا أبو نعيم الأصفهاني قال: حدثنا أبي قال: حدثنا أحمد بن محمد بن عمر قال: حدثنا رياح بن الجراح العبدي قال: حدثنا أبو بكر بن سفيان قال: جاء فتح الموصلي إلى صديق له يقال له: عيسى التمار، فلم يجده في المنزل، فقال للخادم: أخرجي إلي كيس أخي. فأخرجته، فأخذ منه درهمين،", "حاشية: (١) في (ظ): «متا».", "حاشية: (٢) سقطت من الأصل.", "حاشية: (٣) تحرفت في الأصل إلى: «وكان».", "وجاء عيسى إلى منزله، فأخبرته الجارية بمجيء فتح وأخذه الدرهمين فقال: إن كنت صادقة فأنت حرة. فنظر فإذا هي صادقة، فعتقت.", "**الحق الثاني:** في الإعانة بالنفس في قضاء الحاجات، والقيام بها، وهذه أيضا لها درجات، كما أن للمواساة بالمال درجات، فأدناها: القيام بالحاجة عند السؤال والقدرة لكن مع البشاشة والاستبشار، وأوسطها القيام بالحوائج لا عن سؤال، وأعلاها تقديم حوائجه على حوائج النفس، وقد كان في السلف من يتفقد عيال أخيه بعد موته أربعين سنة يقوم بحوائجهم. واعلم أن هذا التفقد ثمرة الشفقة، والشفقة ثمرة الأخوة، فإذا لم تثمر الأخوة شفقة، فليست أخوة، ومن تمام الشفقة تنغص العيش في الملذوذ عند فقد الأخ، والاستيحاش له عند الانفراد بذلك.", "**الحق الثالث:** على اللسان بالسكوت تارة، وبالنطق أخرى، أما السكوت؛ فهو أن يسكت عن ذكر عيوبه في حضرته وغيبته، وعن الرد عليه ومماراته ومنافسته، وعن السؤال عن ما يكره ظهوره من أحواله، ولا يسأله إذا لقيه: إلى أين؟ فربما لم يرد إعلامه بذلك، وأن يكتم أسراره ولو بعد القطيعة، ولا يقدح في أحبابه وأهله، ولا يبلغه قدح غيره فيه، فإن الذي سبك من بلغك، وقد كان النبي ﷺ لا يواجه أحدا بشيء يكرهه، بل ينبغي أن لا يخفي ما يسمع(١) من الثناء عليه، فإن السرور بذلك يحصل من المبلغ ثم من القائل، وإخفاء ذلك من الحسد."]], "ic": "book"}, {"story": ["الباب الثاني في حقوق الأخوة والصحبة (٣ من ٩)، ص٤٢٧", ["وفي الجملة ينبغي أن يسكت عن كل كلام يكرهه إلا إذا وجب عليه النطق في أمر بمعروف ونهي عن منكر، ولم يجد رخصة في السكوت، فإن مواجهته بذلك إحسان إليه في المعنى، وإن كان أساء في الظاهر، فأما ذكر مساوئه وعيوبه فهو من الغيبة، وذلك حرام، وينبغي أن يرد عن ذلك شيئان، أحدهما: مطالعة أحوال النفس، فإنك سترى فيك مذموما، وقدر أنه عاجز عن قهر نفسه في تلك الخصلة الواحدة، كما أنك عاجز فيما أنت مبتلى(٢) به، و: أي الرجال المهذب.", "حاشية: (١) في الأصل: «ما لا يسمع».", "حاشية: (٢) تحرفت في الأصل إلى: «صلى».", "**والثاني:** أن تعلم أنك لو طلبت منزها عن كل عيب لم تجد، وما أحد إلا له محاسن ومساو، فإذا غلبت المحاسن فهو الغاية، قال ابن المبارك: المؤمن من يطلب المعاذير، والمنافق يطلب العثرات. وقال الفضيل: الفتوة: الصفح عن زلات الإخوان.", "وكما أنه يجب عليك السكوت بلسانك عن مساوئه يجب عليك السكوت بقلبك، وذلك بترك إساءة الظن به، وذلك بأن تحمل أفعاله على الحسن مهما أمكن، وأما ما انكشف بيقين ومشاهدة فاحمله (١-١)على سهو(١-١) ونسيان ما أمكن.", "واعلم أن سوء الظن به ينقسم إلى ما يسمى تفرسا، وهو الذي يستند إلى علامة، فإن ذلك يحرك الظن تحريكا ضروريا لا يمكن دفعه، وإلى ما منشؤه سوء اعتقادك فيه، فإذا صدر منه فعل له وجهان حملك سوء الاعتقاد على أن تنزله على الوجه الردي من غير علامة تخصصه به، وذلك جناية عليه بالباطن، وقد قال عليه الصلاة والسلام: «إياكم والظن، فإن الظن أكذب الحديث».", "واعلم أن سوء الظن يدعو إلى التجسس، وقد قال عز وجل: ﴿وَلَا تَجَسَّسُوا۟﴾ [الحجرات: ١٢] وقال عليه الصلاة والسلام: «لا تقاطعوا ولا تدابروا وكونوا عباد الله إخوانا».", "واعلم أن ستر العيوب والتغافل عنها شيمة أهل الدين، ويكفيك في هذا أنك تدعو فتقول: يا من أظهر الجميل وستر القبيح. فالمرضي عند الله تعالى من تخلق بأخلاقه.", "واعلم أنه لا يكمل إيمان المرء حتى يحب لأخيه ما يحب لنفسه، وأقل درجات الأخوة أن يعامل أخاه بما يحب أن يعامله به، ولا شك أنك تنتظر من أخيك أن يستر عورتك، وأن يسكت عن مساوئك، فلو ظهر لك منه ضد ذلك اشتد غيظك، فكيف تنتظر منه ما لا تعزم عليه له ومتى التمست من الإنصاف ما لا تسمح به دخلت في قوله تعالى: ﴿وَيْلٌ لِّلْمُطَفِّفِينَ ٱلَّذِينَ إِذَا ٱكْتَالُوا۟ عَلَى ٱلنَّاسِ يَسْتَوْفُونَ وَإِذَا كَالُوهُمْ أَو وَّزَنُوهُمْ يُخْسِرُونَ﴾ [المطففين: ١-٣]. ومنشأ التقصير في ستر العورة أو", "حاشية: (١-١) سقط من الأصل.", "السعي في كشفها الحقد والحسد، فإن الحقود الحسود يمتلئ باطنه بالخبث، ولكنه يحبسه في باطنه ويخفيه ما لم يجد له مجالا، فإذا وجد فرصة رشح الباطن بخبثه الدفين، ومتى انطوى الباطن على حقد وحسد كان الافتراق أولى من الاجتماع."]], "ic": "book"}, {"story": ["الباب الثاني في حقوق الأخوة والصحبة (٤ من ٩)، ص٤٢٩", ["ومن ذلك أن يسكت عن إفشاء سره الذي استودعه، وفي أفراد البخاري من حديث أبي بكر الصديق أنه قال: لم أكن لأفشي سر رسول الله ﷺ. وفي الصحيحين من حديث أنس قال: قلت لأمي: بعثني رسول الله ﷺ في حاجة قالت: وما هي؟ قلت: سر. قالت: احفظ على رسول الله سره. وفي حديث جابر بن عبد الله عن النبي ﷺ أنه قال: «إذا حدث الرجل ثم التفت فهي أمانة». وقال العباس لابنه عبد الله: إني أرى هذا الرجل يقدمك ـ يعني: عمر ـ فلا تفشين له سرا. وقال عمرو بن العاص: ما وضعت سري عند أحد فلمته على إفشائه، وكيف ألومه وقد ضقت به ذرعا. وقال الحسن البصري: من الخيانة أن تحدث بسر أخيك. وقال ذو النون: لا خير في صحبة من لا يحب أن يراك إلا معصوما، ومن أفشى السر عند الغضب فهو اللئيم؛ لأن إخفاءه عند الرضا تقتضيه الطباع السليمة كلها. وقيل لأبي يزيد: من نصحب؟(١) قال: من يعلم منك ما يعلمه الله ثم يستر عليك كما يستر الله عز وجل. وقال بعض الحكماء: من ارتاد لسره فقد ضيعه، وما كنت كاتمه من عدوك فاكتمه من صديقك. وقيل لأعرابي: كيف كتمانك للسر؟ فقال: ألتحف عليه التحاف الجناح على الخوافي. وقال ابن المعتز:", "ومستودعي سرا تبوأت كتمه  فأودعته صدري فصار له قبرا", "فعارضه آخر(٢) فقال:", "وما السر في صدري كثاو بقبره  لأني أرى المقبور ينتظر النشرا", "ولكنني أنساه حتى كأنني  بما كان منه لم أحط ساعة خبرا", "ولو جاز كتم السر بيني وبينه  عن السر والأحشاء لم تعلم السرا", "حاشية: (١) في الأصل: «يصحب».", "حاشية: (٢) هو محمد بن داود الأصبهاني كما في الإتحاف ٧/ ١٠٢.", "ومن ذلك: السكوت عن المماراة والمدافعة في كل ما يتكلم به الأخ، روى أبو هريرة عن النبي ﷺ أنه قال: «لا يستكمل عبد حقيقة الإيمان حتى يدع المراء وإن كان محقا». واعلم أن أشد الأسباب لإثارة الحقد بين الإخوان المماراة، ولا يبعث عليها إلا إظهار التمييز بزيادة الفضل والعقل واحتقار المردود عليه، ومن ماري أخاه فقد نسبه إلى الجهل والحمق، أو إلى الغفلة والسهو عن فهم الشيء على ما هو عليه، وكل ذلك استحقار، وهو يوغر الصدر، ويوجب المعاداة، وهي ضد الأخوة."]], "ic": "book"}, {"story": ["الباب الثاني في حقوق الأخوة والصحبة (٥ من ٩)، ص٤٣٠", ["**الحق الرابع:** على اللسان بالنطق، فإن الأخوة كما تقتضي السكوت عن المكروه تقتضي النطق بالمحبوب، بل هو أخص الأخوة؛ لأن من قنع بالسكوت صحب أهل القبور، وإنما يراد الإخوان ليستفاد منهم لا ليتخلص من أذاهم؛ لأن السكوت معناه كف الأذى، فعليه أن يتودد إليه بلسانه، ويتفقده في أحواله، ويسأله عما عرض له، ويظهر شغل قلبه بسببه، ويبدي السرور بما يسر به، وفي حديث المقدام بن معدي كرب عن النبي ﷺ أنه قال: «إذا أحب أحدكم أخاه فليعلمه». رواه الترمذي وصححه. وأخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا زيد(١) ـ يعني ابن الحباب ـ قال: حدثني حسين بن واقد قال: حدثني ثابت البناني قال: حدثني أنس بن مالك قال: كنت جالسا عند رسول الله ﷺ إذ مر رجل فقال رجل من القوم: يا رسول الله، إني لأحب هذا الرجل. قال: «هل أعلمته ذلك؟» فقال: لا. فقال: «قم فأعلمه» فقام إليه فقال: يا هذا والله إني لأحبك في الله عز وجل. قال: أحبك الذي أحببتني له. وإنما أمره بإعلامه؛ لأنه إذا علم بحب هذا أحبه، والتحاب بين المؤمنين مطلوب شرعا، وفي أفراد مسلم من حديث أبي هريرة عن النبي ﷺ أنه قال: «والذي نفسي بيده لا تدخلوا الجنة حتى تؤمنوا، ولا تؤمنوا حتى تحابوا، أولا أدلكم على شيء إذا فعلتموه تحاببتم؟ أفشوا السلام بينكم». ومن ذلك أن يدعوه", "حاشية: (١) تحرف في (ظ) إلى: «يزيد».", "بأحب أسمائه إليه، (١-١)وقال عمر بن الخطاب: ثلاث يصفين لك ود أخيك: تسلم عليه إذا لقيته، وتوسع له في المجلس، وتدعوه بأحب أسمائه(١-١).", "ومن ذلك أن تثني عليه بما يعرف من محاسن أحواله عند من يؤثر هو الثناء عنده، فإن ذلك من أعظم الأسباب في جلب المحبة، وكذلك الثناء على أولاده وأهله وأفعاله حتى على خلقه وعقله(٢)، وهيأته وخطه وتصنيفه وجميع ما يفرح به من غير إفراط ولا كذب، وآكد من ذلك أن تبلغه ثناء من أثنى عليه مع إظهار الفرح به، فإن إخفاء ذلك محض الحسد، ومن ذلك أن تشكره على صنيعته في حقك، بل على نيته وإن لم يتم، فإن من لم يحمد أخاه على حسن نيته لم يحمده على حسن الصنيعة."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "ودخلوا على الحسن وهو نائم فجعل بعضهم يأكل من ____ في بيته فانتبه، فقال", "o": ["فاكهة", "يكلفون", "مكانك", "ردعه"], "h": "راجع: ص٤٢٦"}, {"t": "fill", "d": 2, "q": "وجاء عيسى إلى منزله، فأخبرته الجارية بمجيء فتح ____ الدرهمين فقال", "o": ["وأخذه", "يسمعون", "كالفصد", "ويكدر"], "h": "راجع: ص٤٢٧"}, {"t": "fill", "d": 2, "q": "اعلم أن عقد الأخوة رابطة بين الشخصين، كعقد النكاح بين الزوجين، فكما أن النكاح ____ حقوقا يلزم الوفاء بها، فكذا عقد الأخوة، فلأخيك عليك ثمان حقوق", "o": ["يقتضي", "يعلمه", "وعلته", "أخلاط"], "h": "راجع: ص٤٢٥"}, {"t": "fill", "d": 2, "q": "فقال: أحوج ما كان إلي الآن، آخذ بيده وأتلطفه في المعاتبة. وحكي أن أخوين عابدين في بني إسرائيل رأى أحدهما امرأة فأحبها فواقعها وأقام عندها ____ أن يرجع إلى أخيه، فافتقده أخوه وسأل عنه، فدل عليه فدخل", "o": ["واستحى", "الوصية", "شعبتي", "يتخلص"], "h": "راجع: ص٤٣٣"}, {"t": "fill", "d": 2, "q": "ومن ذلك التعليم والنصيحة فليس حاجة أخيك إلى العلم بأقل من حاجته إلى المال، فإذا كنت غنيا بالعلم فواسه وأرشده، فإن أرشدته فلم يعمل بمقتضى ذلك فعليك نصحه بأن تبين له قبح فعله ____ له الحسن، إلا أن ذلك ينبغي أن يكون", "o": ["وتحسن", "الحالات", "والرخص", "وعقبة"], "h": "راجع: ص٤٣١"}, {"t": "fill", "d": 2, "q": "ومن تمام هذا الأمر أن ترى الفضل لإخوانك عليك، فتكون لهم على نفسك لا لنفسك عليهم، فتنزل نفسك معهم منزلة الخادم، وتنظر إلى محاسنهم لا إلى عيوبهم فإن أبصرتهم بعينك نظرت إليهم نظر مودة، وإذا سمعت كلامهم سمعته متلذذا به مستبشرا من غير أن تقطعه عليهم ولا تعارضهم فيه، ولا ____ يدك عن معاونتهم، وأن تمشي وراءهم مشي الأتباع، ومتى تم الاتحاد خفت هذه الحقوق وانطوى بساط التكلف", "o": ["تقبض", "تقدم", "سقتها", "الأيام"], "h": "راجع: ص٤٣٥"}]}, {"t": "الباب الثاني في حقوق الأخوة والصحبة - القسم ٢ من ٢", "b": [{"story": ["الباب الثاني في حقوق الأخوة والصحبة (٦ من ٩)، ص٤٣١", ["وأعظم من ذلك تأثيرا في جلب المحبة الذب عنه في غيبته إذا قصد بسوء، فحق الأخوة التشمير في الحماية والنصرة وتبكيت المعتاب، فالسكوت عن ذلك تقصير في حق الأخوة، وموجب لتنفير القلب، وفي الصحيح عن النبي ﷺ أنه قال: «المسلم أخو المسلم لا يظلمه ولا يسلمه». ومعلوم أن إهماله للذب عن عرضه إسلام له، وأخنس بأخ يراك والكلاب تمزق لحمك فلا تحركه الشفقة للذب عنك، ومعلوم أن تمزيق العرض أشد من تمزيق اللحم، ولك في ذلك معياران: أحدهما: أن تقدر أن الذي قيل فيه قد قيل فيك، وهو حاضر، فتقول: ما تحب أن يقوله. والثاني: أن تقدر أنه حاضر من وراء جدار يتسمع عليك، فما تحرك في قلبك من نصرته في حضوره ينبغي أن يتحرك في غيبته، ومن لم يكن مخلصا في إخائه فهو منافق ومن لم يحقق في هذا الأمر فالعزلة أولى به من المخالطة.", "ومن ذلك التعليم والنصيحة فليس حاجة أخيك إلى العلم بأقل من حاجته إلى المال، فإذا كنت غنيا بالعلم فواسه وأرشده، فإن أرشدته فلم يعمل بمقتضى ذلك فعليك نصحه بأن تبين له قبح فعله وتحسن له الحسن، إلا أن ذلك ينبغي أن يكون", "حاشية: (١-١) سقط من الأصل.", "حاشية: (٢) سقطت من (ظ).", "في سر، وفي الصحيحين من حديث ابن عمر عن النبي ﷺ أنه قال: «إن الله عز وجل يدني المؤمن فيضع عليه كنفه ويستره من الناس ويقرره بذنوبه ويقول له: أتعرف ذنب كذا؟ أتعرف ذنب كذا؟ حتى إذا قرره بذنوبه ورأى في نفسه أنه قد هلك قال: فإني قد سترتها عليك في الدنيا، وأنا أغفرها لك اليوم». وقيل لمسعر: أتحب أن يخبرك أحد بعيوبك؟ فقال: إن كان ناصحا فنعم، وإن كان يريد أن يؤنبني فلا. فالفرق بين التوبيخ والنصيحة الإعلان والإسرار، كما أن الفرق بين المداراة والمداهنة بالعرض الباعث على الإغضاء، فإن أغضيت لسلامة دينك ولما ترى فيه من إصلاح(١) أخيك بالإغضاء فأنت مدار، وإن أغضيت لحظ نفسك واجتلاب شهواتك وسلامة جاهك، فأنت مداهن.", "فإن قلت: ذكر العيوب يوحش القلوب(٢) فيؤثر في الأخوة.", "قلنا: إنما أمرناك أن تنبهه على ما قد خفي عنه، إما من خطأ ظاهر قد خفي عنه قبح إيثاره له، أو من زلل باطن لا يدري به، فتكون كمن حذر شخصا من عقرب تحت ذيله، وذلك ينبعث من الشفقة ويزيد في الأخوة عند العقلاء، وقد روي عن عمر أنه كان يقول: رحم الله امرأ أهدى إلينا عيوبنا. وكتب حذيفة المرعشي إلى يوسف بن أسباط: بلغني أنك بعت دينك بحبتين وقفت على صاحب لبن(٣) فقلت: بكم هذا؟ فقال: بسدس. فقلت له: لا بل بثمن. فقال: هو لك، وكان يعرفك. اكشف عن رأسك قناع الغافلين، وانتبه من رقدة الموتى."]], "ic": "book"}, {"story": ["الباب الثاني في حقوق الأخوة والصحبة (٧ من ٩)، ص٤٣٢", ["**الحق الخامس:** العفو عن الزلات، فإن كانت زلته في دينه فتلطف في نصحه مهما أمكن، ولا تترك زجره ووعظه، فإن أبى فالمصارمة، ولا تكون إلا إذا لم يبق حيلة؛ لأن المقصود ردعه بالتلطف والاحتيال، فإذا لم ينجح كانت المصارمة الرادعة، فقد روي أن بعض القدماء مال عن الاستقامة، فقيل لأخيه: ألا تهجره؟", "حاشية: (١) في الأصل: «إسلام».", "حاشية: (٢) في الأصل: «القلب».", "حاشية: (٣) تحرفت في (ظ): إلى: «لي».", "فقال: أحوج ما كان إلي الآن، آخذ بيده وأتلطفه في المعاتبة. وحكي أن أخوين عابدين في بني إسرائيل رأى أحدهما امرأة فأحبها فواقعها وأقام عندها واستحى أن يرجع إلى أخيه، فافتقده أخوه وسأل عنه، فدل عليه فدخل إليه وهو عندها فاعتنقه وجعل يقبله، فأنكره الآخر، وقال: لا أعرفك. لقوة استحيائه منه، فقال: قم يا أخي فقد علمت شأنك وما كنت قط أحب إلي ولا أعز عندي من ساعتك هذه. فلما رأى أن ذلك لم يسقطه من عينه قام فانصرف معه.", "وإن كانت الزلة في حق الأخ مما يوجب إيحاشه فالأولى العفو والاحتمال وإقامة الأعذار، فإذا رأيت قلبك لا يقبل العذر فقل له: أنت المعيب لا هو. قال الشاعر:", "خذ من خليلك ما صفا  دون الذي فيه الكدر", "فالعمر أقصر من معا  تبة الخليل على الغير", "وقال آخر:", "ولست بمستبق أخا لا تلمه  على شعث أي الرجال المهذب", "وإذا رأيت ذلك التجني ينسلى إلى المودة فيشعبها فتلطف في عتابه سرا.", "**الحق السادس:** الدعاء للأخ في حياته وبعد مماته بكل ما تدعو به لنفسك، ولا تفرق بينك وبينه في ذلك، وفي أفراد مسلم من حديث أبي الدرداء عن النبي ﷺ أنه قال: «دعوة المرء المسلم لأخيه بظهر الغيب مستجابة، عند رأسه ملك موكل كلما دعا لأخيه بخير قال الملك الموكل به: آمين، ولك بمثل». وقد كان أبو الدرداء يدعو لخلق كثير من إخوانه يسميهم بأسمائهم، وكان الإمام أحمد بن حنبل يدعو في السحر لستة نفر.", "وأما الدعاء بعد الموت، فقد قال عمرو بن حريث(١): إذا دعا العبد لأخيه الميت أتى بها ملك قبره، فقال: يا صاحب القبر الغريب هذه هدية من أخ عليك شفيق.", "حاشية: (١) تحرفت في النسخ إلى: «جرير».", "**الحق السابع:** الوفاء والإخلاص، ومعنى الوفاء الثبات على الحب، وإدامته إلى الموت، وبعد موت الأخ مع أولاده وأصدقائه؛ لأن الحب إنما يراد للآخرة ولا وجه لانقطاعه، وقد أكرم النبي ﷺ عجوزا، وقال: «إنها كانت تغشانا في أيام خديجة وإن حسن العهد من الإيمان». ومن الوفاء أن لا يتغير على أخيه في التواضع وإن ارتفع شأنه، واتسعت ولايته، وعظم جاهه، وقد روى الربيع عن الشافعي أنه آخى رجلا ببغداد فولي السيبين(١)، فتغير له عما كان عليه، فكتب إليه الشافعي:", "اذهب فودك من فؤادي طالق  أبدا وليس طلاق ذات البين", "فإن ارعويت فإنها تطليقة  ويدوم ودك لي على ثنتين", "وإن امتنعت شفعتها بمثالها  فتكون تطليقين في حيضين"]], "ic": "book"}, {"story": ["الباب الثاني في حقوق الأخوة والصحبة (٨ من ٩)، ص٤٣٤", ["فإذا الثلاث أتتك مني بتة  لم تغن عنك ولاية السيبين", "واعلم أنه ليس من الوفاء موافقة الأخ فيما يخالف الدين، فقد كان الشافعي آخى محمد بن عبد الحكم وكان يقربه ويقبل عليه، فلما احتضر قيل له: إلى من نجلس بعدك يا أبا عبد الله؟ فاستشرف له محمد بن عبد الحكم وهو عند رأسه ليؤمئ إليه فقال: أبو يعقوب البويطي. فانكسر لها محمد، مع أن محمدا كان قد حمل عنه مذهبه، لكن البويطي كان أقرب إلى الزهد والورع فنصح الشافعي المسلمين وترك المداهنة فانقلب ابن عبد الحكم عن مذهب الشافعي وصار من أصحاب مالك.", "ومن الوفاء الجزع من مفارقة الأخ، كما قال الشاعر:", "وجدت مصيبات الزمان جميعها  سوى فرقة الأحباب هينة الخطب", "وقال معروف الكرخي: لو أحببت أحدا لم أحب مفارقته ليلا ولا نهارا، ولزرته في كل وقت، ولآثرنه على نفسي في كل حال.", "حاشية: (١) السيبين: هما السيب الأعلى والسيب الأسفل، اسم كورة بالعراق.", "ومن الوفاء أن لا يسمع بلاغات الناس على صديقه، ولا يصادق عدو صديقه، قال الشافعي: إذا أطاع صديقك عدوك، فقد اشتركا في عداوتك.", "**الحق الثامن:** التخفيف، وترك التكلف والتكليف، وذلك بأن لا يكلف أخاه ما يشق عليه، بل يروح سره عن مهماته وحاجاته، ولا يستمد من جاهه ولا ماله، ولا يكلفه التفقد لأحواله والقيام بحقوقه(١)، ولا التواضع له، بل يكون قصده بمحبته الله تعالى وحده، والتبرك بدعائه، والاستئناس بلقائه، والاستعانة به على دينه، والتقرب إلى الله بالقيام بحقوقه، وتمام التخفيف طي بساط الاحتشام حتى لا يستحيي منه فيما لا يستحيي فيه من نفسه، قال جعفر بن محمد: أثقل إخواني علي من يتكلف لي وأتحفظ منه، وأخفهم على قلبي من أكون معه كما أكون وحدي. وقال يوسف بن الحسين: قلت لذي النون: من أصحب؟ قال: من إذا أذنبت تاب. وقال بعض الحكماء: من سقطت كلفته دامت ألفته.", "ومن تمام هذا الأمر أن ترى الفضل لإخوانك عليك، فتكون لهم على نفسك لا لنفسك عليهم، فتنزل نفسك معهم منزلة الخادم، وتنظر إلى محاسنهم لا إلى عيوبهم فإن أبصرتهم بعينك نظرت إليهم نظر مودة، وإذا سمعت كلامهم سمعته متلذذا به مستبشرا من غير أن تقطعه عليهم ولا تعارضهم فيه، ولا تقبض يدك عن معاونتهم، وأن تمشي وراءهم مشي الأتباع، ومتى تم الاتحاد خفت هذه الحقوق وانطوى بساط التكلف.", "**خاتمة لهذا الباب نذكر فيها جملة من آداب المعاشرة للخلق:**", "من حسن المعاشرة أن تتوقر في غير كبر، وتتواضع في غير ذلة، وأن تلقى الصديق والعدو بوجه الرضا من غير ذل لهم ولا خوف منهم، وتحفظ في مجالسك من تشبيك أصابعك، والعبث بلحيتك وخاتمك، وتخليل أسنانك، وإدخال إصبعك في أنفك، وكثرة بصاقك، وطرد الذباب عن وجهك، والتثاؤب(٢)، وأصغ إلى من", "حاشية: (١) في الأصل: «الحقوقه».", "حاشية: (٢) تحرفت في الأصل إلى: «الثياب»."]], "ic": "book"}, {"story": ["الباب الثاني في حقوق الأخوة والصحبة (٩ من ٩)، ص٤٣٦", ["حدثك، ولا تسأله الإعادة، ولا تحدث عن إعجابك بولدك وجاريتك وتصنيفك، ولا تتصنع تصنع المرأة في التزين، ولا تبذل تبذل العبد، ولا يعلم أهلك فضلا عن غيرهم مقدار مالك، فإنهم إن رأوه قليلا هنت عندهم، وإن كان كثيرا لم تبلغ رضاهم أبدا، وخوفهم من غير عنف، ولن لهم من غير ضعف، ولا تهازل أمتك وعبدك فيسقط وقارك، ولا تكثر الالتفات إلى ما وراءك، ولا تجالس السلطان، فإن فعلت فاحذر الكذب والغيبة، وصن سره، واحذر الدعابة عنده، وتحفظ من الجشاء بحضرته والتحلل، فإن قربك فكن منه على حذر، وإن استرسل إليك فلا تأمن انقلابه عليك، وارفق به رفقك بالصبي، وكلمه بما يشتهيه، ولا تدخل بينه وبين أهله وحشمه، فإنها زلة لا تقال، وربما احتمل الملك كل شيء إلا إفشاء السر والقدح في الملك والتعرض للحرم، وإياك وصديق العافية، ولا تجعل مالك أكرم من عرضك، وإذا دخلت مجلسا فاجلس فيما هو أقرب إلى التواضع، ولا تجلس على الطريق فإن جلست فغض البصر، وانصر المظلوم، وأرشد الضال، ولا تبصق في جهة القبلة، ولا عن يمينك لكن عن يسارك تحت قدمك اليسرى، واحذر مجالسة العوام، فإن فعلت فبالتغافل عن ما يجري من سوء أخلاقهم، وترك الخوض في حديثهم، واحذر المراح فإن اللبيب يحقد عليك في المزاح، والسفيه يجترئ عليك."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "حدثك، ولا تسأله الإعادة، ولا تحدث عن إعجابك بولدك وجاريتك وتصنيفك، ولا تتصنع تصنع المرأة في التزين، ولا تبذل تبذل العبد، ولا يعلم أهلك فضلا عن غيرهم مقدار مالك، فإنهم إن رأوه قليلا هنت عندهم، وإن كان كثيرا لم تبلغ رضاهم أبدا، وخوفهم من غير عنف، ولن لهم من غير ضعف، ولا تهازل أمتك وعبدك فيسقط وقارك، ولا تكثر الالتفات إلى ما وراءك، ولا تجالس السلطان، فإن فعلت فاحذر الكذب والغيبة، وصن سره، واحذر الدعابة عنده، وتحفظ من الجشاء بحضرته والتحلل، فإن قربك فكن منه على حذر، وإن استرسل إليك فلا تأمن انقلابه عليك، وارفق به رفقك بالصبي، وكلمه بما يشتهيه، ولا تدخل بينه وبين أهله وحشمه، فإنها زلة لا تقال، وربما احتمل الملك كل شيء إلا إفشاء السر والقدح في الملك والتعرض للحرم، وإياك وصديق العافية، ولا تجعل مالك أكرم من عرضك، وإذا دخلت مجلسا فاجلس فيما هو أقرب إلى التواضع، ولا تجلس على الطريق فإن جلست فغض البصر، وانصر ____، وأرشد الضال، ولا تبصق في جهة القبلة، ولا عن ي
