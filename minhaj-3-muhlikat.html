أما الهيئة فتشعث شعر الرأس، وحلق الشارب، والإطراق(١) في حالة المشي، وإبقاء أثر السجود على الوجه، وغلظ الثياب، ولبس الصوف، وتشميرها كثيرا، وتقصير الأكمام، وترك الثوب مخرقا، غير نظيف، كل ذلك ليظهر من نفسه أنه متبع للسنة(٢)، ومقتد بالصالحين.", "ومن ذلك لبس المرقعة، والثياب الزرق تشبها بالصوفية، مع الإفلاس من صفاتهم في الباطن.", "ومنه التقنع فوق العمامة لاتقاء غبار الطريق، ولتنصرف إليه الأعين بتميزه بتلك العلامة، وكذلك لبس الطيلسان لمن ليس من العلماء، ليوهم أنه منهم.", "والمراؤون بالزي على طبقات، فمنهم من يطلب المنزلة عند أهل الصلاح بإظهار التزهد(٣)، فيلبس الثياب المخرقة الغليظة، الوسخة القصيرة، ليرائي بغلظها وقصرها، ووسخها وتخرقها، ولو كلف أن يلبس ثوبا وسطا نظيفا، مما كان السلف يلبسونه، لكان عنده بمنزلة الذبح، لخوفه أن يقول الناس: قد بدا له من الزهد، وقد رجع عن تلك الطريقة.", "وطبقة أخرى يطلبون القبول عند أهل الصلاح، وعند أهل الدنيا من الملوك والتجار، فلو أنهم لبسوا الثياب الفاخرة، لم يقبلهم القراء، ولو لبسوا الثياب المخرقة الدنيئة، لازدرتهم أعين الملوك والأغنياء، فهم يريدون الجمع بين قبول أهل الدين والدنيا، فيطلبون الأصواف الدقيقة، والأكسية الرقيقة، والفوط الرفيعة، فيلبسونها، ولعل قيمة ثوب أحدهم قيمة ثوب الغني، ولونه وهيئته لون ثياب الصلحاء، فيلتمسون القبول عند الفريقين.", "حاشية: (١) تصحفت في الأصل إلى: (الأطراف).", "حاشية: (٢) تحرفت في الأصل إلى: (معتقد).", "حاشية: (٣) في الأصل: (الزهد)."]], "ic": "book"}, {"story": ["كتاب ذم الجاه والرياء (١٧ من ٤١)، ص٨٤٩", ["وهؤلاء لو كلفوا لبس ثوب خشن أو وسخ لكان عندهم كالذبح، خوفا من السقوط من أعين الملوك والأغنياء(١)، ولو كلفوا لبس الدبيقي(٢)، والكتان الرقيق الأبيض، أو القصب(٣) المعلم ـ وإن كانت قيمته دون قيمة ثيابهم ـ لعظم عليهم ذلك، خوفا من أن يقول أهل الصلاح: قد رغبوا في زي أهل الدنيا.", "وكل من رأى منزلته تثبت له بزي مخصوص، ثقل عليه الانتقال إلى ما دونه، أو فوقه خوفا من المذمة.", "وأما أهل الدنيا فمراءاتهم بالثياب النفيسة، والمراكب الرفيعة، وأنواع التجمل في الملبس والمسكن وأثاث البيت، وهم يلبسون في بيوتهم الثياب الخشنة، ويشتد عليهم لو برزوا بتلك الهيئة.", "**القسم الثالث**: الرياء بالقول، ورياء أهل الدين بالوعظ والتذكير، وحفظ الأخبار والآثار لأجل المحاورة، إظهارا لغزارة العلم، ودلالة على شدة العناية بأحوال السلف الصالحين، وتحريك الشفتين بالذكر في محضر الناس، والأمر بالمعروف والنهي عن المنكر بمشهد الخلق، وإظهار الغضب للمنكرات، والأسف على مقارفة الناس المعاصي، وخفض الصوت في الكلام، وترقيقه بقراءة القرآن، ليدلوا بذلك على الحزن والخوف، وادعاء حفظ الحديث ولقاء الشيوخ، وقصد إفحام المناظر، إلى غير ذلك. وأما أهل الدنيا، فمراءاتهم بحفظ الأشعار والأمثال، والتفاصح في الكلام، وحفظ الغريب للإغراب، وإظهار التودد إلى الناس لاستمالة القلوب.", "**القسم الرابع**: الرياء بالعمل، كمراءاة المصلي بطول القيام ومده، وتطويل الركوع والسجود، وإطراق الرأس، وترك الالتفات، وإظهار الخشوع، وتسوية", "حاشية: (١) سقط من (ف).", "حاشية: (٢) الدبيقي من الثياب: نسبة إلى دبيق، بلدة كانت من قرى دمياط بمصر تعمل فيها الثياب الرقيقة.", "حاشية: (٣) القصب: ثياب ناعمة رقيقة من الكتان، وأحدها: قصبي.", "القدمين واليدين، وكذلك بالصوم والغزو، والحج والصدقة، وإطعام الطعام، والإخبات في المشي، كإرخاء الجفون، وتنكيس الرأس، حتى إن المرائي قد يسرع في حاجته، فإذا رآه أحد من أهل الدين، رجع إلى الوقار، خوفا من أن ينسبه إلى العجلة وقلة الأدب، فإذا غاب الرجل عاد إلى عجلته، ومن الناس من يتكلف هذه المشية في الخلوة، لئلا يغيرها في حال الجلوة(١)، وهذا قد صار مرائيا في الخلوة أيضا؛ لأنه إنما حسنها في الخلوة، ليكون كذلك في الجلوة.", "وأما أهل الدنيا، فمراءاتهم بالتبختر والاختيال، وتحريك اليدين(٢)، وتقريب الخطا، والأخذ بأطراف الذيل، وإدارة العطفين(٣)، ليدلوا بذلك على الحشمة."]], "ic": "book"}, {"story": ["كتاب ذم الجاه والرياء (١٨ من ٤١)، ص٨٥٠", ["**القسم الخامس**: المراءاة بالأصحاب والزائرين والمخالطين، كالذي يتكلف أن يستزير عالما، ليقال: إن فلانا قد زار فلانا. أو عابدا، ليقال: إن أهل الدين يتبركون به (٤-٤)ويترددون إليه(٤-٤). أو ملكا من الملوك، أو عاملا من عمال السلاطين، ليقال: إنهم يتبركون به(٥-٥)، (٥-٥)لعظم رتبته في الدين. والذي يكثر ذكر الشيوخ، ليقال: إنه لقي شيوخا كثيرة، واستفاد منهم. فيباهي بشيوخه، وربما قال عند مجادلته لغيره: ومن لقيت أنت؟ أنا قد لقيت فلانا، ودرت البلاد، وخدمت الشيوخ.", "فهذه مجامع ما يرائي به المراؤون، وهم يطلبون بذلك الجاه والمنزلة في قلوب العباد، ومنهم من يقنع بحسن الاعتقادات فيه، فكم من راهب(٦) انزوى إلى ديره سنين كثيرة، وكم من عابد اعتزل إلى قلة(٧) جبل مدة مديدة، وإنما حياته من حيث", "حاشية: (١) سقطت من الأصل، والجلوة: التكشف والظهور.", "حاشية: (٢) تحرفت في الأصل إلى: (البدن).", "حاشية: (٣) العطفان: المنكبان أو الإبطان.", "حاشية: (٤-٤) سقط من الأصل.", "حاشية: (٥-٥) سقط من (ف).", "حاشية: (٦) في (ف): (زاهد)؟", "حاشية: (٧) القلة: أعلى الشيء، وخصها بعضهم بالرأس والسنام والجبل.", "علمه بقيام جاهه في قلوب الخلق، مع أنه قد قطع طمعه من أموالهم، لكنه يحب مجرد الجاه، فإنه لذيذ على ما سبق بيانه، بل يلتمس مع ذلك إطلاق الألسن بالثناء. ومنهم من يريد انتشار الصيت في البلاد لتكثر الرحلة إليه. ومنهم من يريد الاشتهار عند الملوك لتقبل شفاعته، وتنجز الحوائج على يديه، فيقوم له بذلك جاه عند العامة. ومنهم من يقصد التوصل بذلك إلى جمع حطام.", "فإن قيل: هل الرياء حرام، أم مباح، أم مكروه؟", "فالجواب: أن فيه تفصيلا، فإن الرياء هو طلب الجاه، وهو إما أن يكون بالعبادات، أو بغيرها، فإن كان بغير العبادات فهو كطلب المال، فلا يحرم من حيث إنه طلب(١) منزلة في قلوب العباد، ولكن كما يمكن كسب المال بتلبيسات وأسباب محظورة، كذلك الجاه، وكما أن كسب قليل من المال ـ وهو ما يحتاج إليه الإنسان ـ محمود، فكسب قليل من الجاه ـ وهو ما يسلم من الآفات ـ حسن، وهو الذي طلبه يوسف عليه السلام في قوله: ﴿إِنِّى حَفِيظٌ عَلِيمٌ﴾ [يوسف: ٥٥]", "وكما أن المال(٢) فيه سم ناقع وترياق فكذلك الجاه، بل أشد، فإن فتنة الجاه أعظم من فتنة المال، وكما أنا لا نقول: تملك المال الكثير حرام، فلا نقول أيضا: تملك القلوب الكثيرة حرام، إلا إذا حمله كثرة المال وكثرة الجاه على مباشرة ما لا يجوز، غير أن انصراف الهم إلى سعة الجاه، كانصراف الهم إلى كثرة المال، لا يقدر محب الجاه والمال على ترك معاصي القلب واللسان وغيرها."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "القسم الرابع: الرياء بالعمل، كمراءاة المصلي بطول القيام ومده، ____ الركوع والسجود، وإطراق الرأس، وترك الالتفات، وإظهار الخشوع،", "o": ["وتطويل", "التعيير", "ويزعم", "مضجعك"], "h": "راجع: ص٨٤٩"}, {"t": "fill", "d": 2, "q": "والثاني: ذكر الترمذي أن بعض أهل العلم فسره فقال: معناه أن يعجبه ثناء الناس عليه بالخير، لقوله ﷺ: «أنتم شهداء ____ في الأرض». فأما إذا أعجبه ليعلم الناس منه الخير ويكرم عليه، فهذا", "o": ["الله", "وينكر", "خلقان", "مندوب"], "h": "راجع: ص٨٦٦"}, {"t": "fill", "d": 2, "q": "الثالثة: أن يكون له قصد الثواب وقصد الرياء متساويين، بحيث لو كان كل واحد منهما خاليا عن الآخر لم يبعثه على العمل، فلما اجتمعا انبعثت الرغبة، أو كان كل واحد لو انفرد ____ بحمله على العمل،", "o": ["لاستقل", "ترياق", "علاج", "فسحة"], "h": "راجع: ص٨٥٦"}, {"t": "fill", "d": 2, "q": "وإذا كان الرياء هو الداء الدفين، الذي هو أعظم شبكة للشياطين، وجب شرح القول في سببه وحقيقته، ودرجاته وأقسامه، وطرق معالجته، ____ منه", "o": ["والحذر", "بالتكرم", "العظم", "الندم"], "h": "راجع: ص٨١٨"}, {"t": "fill", "d": 2, "q": "الدرجة الأولى: ـ وهي أغلظها ـ أن لا يكون مراده الثواب أصلا، كالذي يصلي بين أظهر الناس، ولو انفرد لكان لا يصلي، بل ____ يصلي بغير طهارة مع الناس، فهذا قد جرد قصده للرياء، فهو الممقوت عند الله،", "o": ["ربما", "ينبسط", "وغرور", "تملك"], "h": "راجع: ص٨٥٥"}, {"t": "fill", "d": 2, "q": "وأي خير للإنسان في مدح ____ إذا كان عند الله مذموما", "o": ["الناس", "المعاش", "البلغة", "إشارتنا"], "h": "راجع: ص٨٧٢"}]}, {"t": "كتاب ذم الجاه والرياء - القسم ٤ من ٧", "b": [{"story": ["كتاب ذم الجاه والرياء (١٩ من ٤١)، ص٨٥١", ["فأما سعة الجاه من غير حرص منك على طلبه، ومن غير اهتمام بزواله إن زال، فلا ضرر فيه، إذ لا جاه أوسع من جاه رسول الله ﷺ، وعلماء الدين بعده، ولكن انصراف الهم إلى طلب الجاه نقصان في الدين، ولا يوصف بالتحريم.", "فعلى هذا نقول: تحسين الثوب الذي يلبسه الإنسان عند الخروج إلى الناس، إنما هو ليراه الناس، وكذلك: كل تجمل لهم، ولا يقال: إنه منهي عنه، وقد تختلف", "حاشية: (١) سقطت من (ف).", "حاشية: (٢) سقطت من (ف).", "المقاصد بذلك، فأكثر الناس يحبون أن لا يروا بعين نقص في حال، فهم يتزينون لتتم أحوالهم، وهذا لا يذم، وفي أفراد مسلم، من حديث ابن مسعود، عن النبي ﷺ، أنه قال: «لا يدخل الجنة من كان في قلبه مثقال ذرة من كبر». فقال رجل: إن الرجل يحب أن يكون ثوبه حسنا، ونعله حسنة(١). قال: «إن الله جميل يحب الجمال، الكبر: بطر الحق وغمط الناس»(٢).", "ومن الناس من يؤثر إظهار نعمة الله عليه، وقد أمر بذلك رسول الله ﷺ،", "فأخبرنا هبة الله بن مالك، قال: حدثنا عبد الله بن أحمد، قال: حدثني أبي، قال: حدثنا محمد بن جعفر، قال: حدثنا شعبة، عن أبي إسحاق، قال: سمعت أبا الأحوص يحدث عن أبيه، قال: أتيت رسول الله ﷺ وأنا قشف(٣) الهيئة، فقال: «هل لك مال؟» قال: قلت: نعم. قال: «من أي المال؟» قال: قلت: من كل المال، من الإبل والرقيق والخيل والغنم. فقال: «إذا آتاك الله مالا فلير عليك»(٤).", "ومنهم من يحب أن لا يزدرى، ومنهم من يؤثر أن يتزين لزوجته، كما قال ابن عباس رضي الله عنهما: إني لأحب أن أتزين لها كما أحب أن تتزين لي. إلى غير ذلك من المقاصد التي لا تذم.", "وقد كان السلف إذا تزاوروا تجملوا في اللباس، وكانوا يلبسون أجود الثياب للجمعة والعيدين، ومنه حديث عمر أنه قال لرسول الله ﷺ: لو اشتريت هذه الحلة فلبستها للوفد. ولم ينكر عليه رسول الله ﷺ(٥).", "حاشية: (١) في (ف): (حسنا).", "حاشية: (٢) أخرجه مسلم (٩١)، وبطر الحق: إنكاره، وغمط الناس: احتقارهم.", "حاشية: (٣) قشف الهيئة: رث الهيئة لم يتعهد نفسه بالغسل والنظافة.", "حاشية: (٤) أخرجه أحمد (١٥٨٨٨)، والطيالسي (١٣٠٣)، وعبد الرزاق (٢٠٥١٣)، وأبو داود (٤٠٦٣)، والترمذي (٢٠٠٦)، والنسائي في الكبرى (٩٤٨٤) و(٩٤٨٦)، والطحاوي في شرح المشكل (٣٠٤١) ـ (٣٠٤٣)، وابن حبان (٥٤١٦) و(٥٤١٧)، والطبراني في الكبير ١٩/ (٦٠٧) ـ (٦٢٤)، والحاكم ١/ ٢٤ ـ ٢٥ و٤/ ١٨١.", "حاشية: (٥) قول المصنف رحمه الله: (ولم ينكر عليه رسول الله ﷺ) غير سديد، بل قد أنكر رسول الله ﷺ على عمر اختياره لتلك الحلة لكونها من الحرير وقال فيها: (إنما يلبس هذه من لا خلاق له في الآخرة). والحديث في البخاري (٨٨٦) و(٩٤٨)، ومسلم (٢٠٦٨).", "وكان مالك بن أنس(١) يلبس أجود ثيابه ويتطيب، إذا أراد أن يروي حديث رسول الله ﷺ.", "وأما العبادات كالصدقة والصلاة والغزو والحج، فللمرائي فيها حالتان:"]], "ic": "book"}, {"story": ["كتاب ذم الجاه والرياء (٢٠ من ٤١)، ص٨٥٣", ["إحداهما: أن لا يكون له قصد إلا الرياء المحض دون الأجر، وهذا يبطل عبادته؛ لأن الأعمال بالنيات، وهذا لا يقصد العبادة، ثم لا يقتصر على إحباط عبادته حتى نقول: عاد كما كان قبل العبادة، بل نقول: يعصي بذلك ويأثم لمعنيين:", "أحدهما: يتعلق بالعباد، وهو التلبيس والمكر؛ لأنه خيل إليهم أنه مطيع بالله تعالى، وهو أنه إذا قصد بعبادة الله سواه فهو مستهزئ، ومثاله مثال من وقف طول النهار بين يدي الملك، ومراده ملاحظة جاريته، فإن هذا يستهزئ بالملك؛ لأنه لم يقصد التقرب إليه بخدمته، وأي محنة تزيد على أن يقصد العبد بطاعة الله تعالى مراعاة عبد ضعيف لا يملك له ضرا ولا نفعا؟ وهل ذلك إلا لأنه ظن أن ذلك العبد أقدر على تحصيل أغراضه من الله تعالى؟ وأنه أولى بالتقرب إليه من الله تعالى إذ آثره على مالك الملوك، فجعله مقصود عبادته، ورفعه على المولى؟ ولهذا سماه رسول الله ﷺ: الشرك الأصغر.", "إلا أن بعض درجات الرياء أشد من بعض، كما سيأتي بيانه إن شاء الله تعالى. ولا يخلو شيء منه عن إثم، ولو لم يكن في الرياء إلا أنه يركع ويسجد لغير الله لكان فيه كفاية، فإنا من لم يقصد التقرب إلى الله فقد قصد غير الله، إلا أن المرائي يقصد تعظيم نفسه في قلب من عظم عنده، بإظهار صورة التعظيم لله، فلذلك يكون شركه خفيا لا جليا، وهذا لا يقع إلا عند من يوهمه الشيطان أن العباد يملكون من ضره ونفعه، ورزقه وأجله، ومصالح حاله(٢) وماله أكثر مما يملكه الله تعالى، فلذلك عدل بوجهه عن الله إليهم، وأقبل بقلبه عليهم، ويستميل ذلك قلوبهم،", "حاشية: (١) في (ف): (أنس بن مالك). وما في الأصل هو الصواب. انظر السير ٨/ ٦٤.", "حاشية: (٢) تحرفت في (ف) إلى: (أجله).", "ولو وكله الله إليهم في الدنيا لكان ذلك أقل مكافأة له على صنيعه؛ لأنهم عاجزون عن أنفسهم، فكيف لغيرهم(١)؟! هذا في الدنيا، فكيف في يوم لا يجزي والد عن ولده، والأنبياء تقول فيه: «نفسي نفسي»(٢)؟!", "فكيف يستبدل(٣) الجاهل ما يرتقبه بطمعه الكاذب في الدنيا من الناس، عن ثواب الآخرة ونيل القرب من الله سبحانه؟!", "فلا ينبغي أن يشك في أن المرائي بطاعة الله في سخط الله.", "[الحالة الثانية: أن يقصد بعمله الرياء ويقصد معه الأجر والثواب، وفي ذلك تفصيل سيأتي بيانه إن شاء الله تعالى](٤).", "حاشية: (١) في الأصل: (بغيرهم).", "حاشية: (٢) قطعة من حديث الشفاعة، أخرجه البخاري (٣٣٤٠) و(٤٧١٢)، ومسلم (١٩٤) من حديث أبي هريرة.", "حاشية: (٣) تحرفت في الأصل إلى: (يستدل).", "حاشية: (٤) ما بين معقوفين زيادة لا بد منها، فقد تابع المصنف رحمه الله الغزالي في عدم ذكر الحالة الثانية التي ربما لم تذكر سهوا، وهي ستأتي مفصلة في الباب التالي.", "**بيان**", "**درجات الرياء**", "اعلم أن بعض أبواب الرياء أشد وأغلظ من بعض، واختلافه باختلاف أركانه وتفاوت الدرجات فيه، وأركانه ثلاثة:"]], "ic": "book"}, {"story": ["كتاب ذم الجاه والرياء (٢١ من ٤١)، ص٨٥٥", ["١ ـ نفس قصد الرياء.", "٢ ـ والمراءى به.", "٣ ـ والمراءى لأجله.", "١ ـ ＊＊الركن الأول: نفس قصد الرياء＊＊:", "وذلك لا يخلو إما أن يكون مجردا دون إرادة الله والثواب، وإما أن يكون مع إرادة الله والثواب، ثم لا يخلو أن تكون إرادة الثواب أقوى وأغلب، أو أضعف، أو مساوية لإرادة العبادة(١)، فتكون الدرجات أربعا:", "**الدرجة الأولى**: ـ وهي أغلظها ـ أن لا يكون مراده الثواب أصلا، كالذي يصلي بين أظهر الناس، ولو انفرد لكان لا يصلي، بل ربما يصلي بغير طهارة مع الناس، فهذا قد جرد قصده للرياء، فهو الممقوت عند الله، وكذلك من يخرج الصدقة خوفا من مذمة الناس، وهو لا يقصد الثواب، ولو خلا بنفسه لما أداها، فهذه الدرجة العليا من الرياء.", "**الثانية**: أن يكون له قصد الثواب أيضا، لكن قصدا ضعيفا، بحيث لو كان في الخلوة لكان لا يفعله، ولا يحمله ذلك القصد(٢) على العمل، فهذا قريب مما قبله،", "حاشية: (١) في النسخ: (العباد)، والمثبت من الإحياء.", "حاشية: (٢) سقطت من (ف).", "وما فيه من شائبة قصد الثواب لا يستقل بحمله على العمل، فلا ينفي عنه الإثم والمقت.", "**الثالثة**: أن يكون له قصد الثواب وقصد الرياء متساويين، بحيث لو كان كل واحد منهما(١) خاليا عن الآخر لم يبعثه على العمل، فلما اجتمعا انبعثت الرغبة، أو كان كل واحد لو انفرد لاستقل بحمله على العمل، فهذا قد أفسد مثل ما أصلح وما يسلم من الإثم.", "**الرابعة**: أن يكون اطلاع الناس مقويا لنشاطه، ولو لم يكن لكان لا يترك العبادة، ولو كان قصد الرياء وحده لما أقدم، فهذا يثاب على قصده الصحيح، ويعاقب على قصده الفاسد.", "٢ ـ ＊＊الركن الثاني المراءى به وهو الطاعات＊＊:", "وذلك ينقسم إلى الرياء بأصول العبادات، وإلى الرياء بأوصافها:", "**القسم الأول** ـ وهو **الأغلظ** ـ: الرياء بالأصول، وهو على ثلاث درجات:", "**الدرجة الأولى**: الرياء بأصل الإيمان، وهذا أغلظ أبواب الرياء، وصاحبه كافر مخلد في النار، وهو الذي يظهر كلمتي الشهادة، وباطنه مشحون بالتكذيب، وهو يرائي بظاهر الإسلام، وهذه صفة المنافق، قال الله عز وجل في صفتهم: ﴿يُرَآءُونَ ٱلنَّاسَ وَلَا يَذْكُرُونَ ٱللَّهَ إِلَّا قَلِيلًا﴾ [النساء: ١٤٢].", "وهذه الصفة تقل في زماننا، ولكن يكثر نفاق من ينسلخ من الدين باطنا، فيجحد الجنة والنار والدار الآخرة ميلا إلى قول الملحدة، أو يعتقد طي بساط(٢) الشرع والأحكام، ميلا إلى أهل الإباحة، أو يعتقد كفرا أو بدعة وهو يظهر خلافه.", "فهؤلاء من المنافقين المرائين المخلدين في النار، وليس وراء هذا الرياء رياء، وحال هؤلاء أشد من حال الكفار المجاهرين؛ لأنهم جمعوا بين كفر الباطن ونفاق الظاهر.", "حاشية: (١) سقطت من الأصل.", "حاشية: (٢) تحرف في (ف) إلى: (بمناط)."]], "ic": "book"}, {"story": ["كتاب ذم الجاه والرياء (٢٢ من ٤١)، ص٨٥٧", ["**الدرجة الثانية**: الرياء بأصول العبادات مع التصديق بأصل الدين، وهذا أيضا عظيم عند الله، ولكنه دون الأول بكثير، ومثاله: أن يكون مال الرجل في يد غيره، فأمره بإخراج الزكاة خوفا من ذمه، والله يعلم أنه لو كان في يده لما أخرجها، أو يدخل وقت الصلاة وهو في جمع، وعادته ترك الصلاة في الخلوة، وكذلك يصوم رمضان، وهو يشتهي خلوة من الخلق ليفطر، وكذلك يحضر الجمعة، ولولا مذمة الناس لم يحضر، أو يصل رحمه، ويبر والديه، لا عن رغبة لكن خوفا من الناس(١)، أو يغزو أو يحج لذلك، فهذا مراء، معه أصل الإيمان بالله، يعتقد أنه لا معبود سواه، ولو كلف أن يعبد(٢) غير الله أو يسجد لغيره لم يفعل، ولكنه يترك العبادات للكسل، وينشط عند اطلاع الخلق، فتكون منزلته عند الخلق أحب إليه من منزلته عند الخالق، وخوفه من مذمة الناس أعظم من خوفه من عقاب الله، ورغبته في محمدتهم أشد من رغبته في ثواب الله، وهذا غاية الجهل، وما أجدر صاحبه بالمقت.", "**الدرجة الثالثة**: أن لا يرائي بالأعمال ولا بالفرائض، ولكن يرائي بالسنن والنوافل التي لو تركها لم يعص، ولكنه يكسل عنها في الخلوة، لفتور رغبته في ثوابها، ولإيثاره لذة الكسل على ما يرجى من الأجر، ثم يبعثه الرياء على الفعل، وذلك كحضور الجماعة في الصلاة، وعيادة المريض، واتباع الجنائز، وغسل الميت، والتهجد بالليل، وصيام عرفة وعاشوراء، والاثنين والخميس، فقد يفعل المرائي جملة ذلك خوفا من المذمة، أو طلبا للمحمدة، ويعلم الله منه أنه لو خلا بنفسه لما زاد على أداء الفرائض، فهذا أيضا عظيم، ولكنه دون ما قبله، فإن الذي قبله آثر حمد الخلق على حمد الخالق، وهذا أيضا قد فعل ذلك، واتقى ذم الخلق دون ذم الخالق، فكان ذم الخلق عنده أعظم من عقاب الله، وأما هذا فلم يفعل ذلك؛ لأنه لم يخف عقابا على ترك النافلة لو تركها، ويحتمل أن يكون عقابه نصف عقاب الأول، فهذا هو الرياء بأصول العبادات.", "حاشية: (١) سقطت من (ف).", "حاشية: (٢) في الأصل: (يقصد).", "**القسم الثاني**: الرياء بأوصاف العبادات لا بأصولها، وهو أيضا على ثلاث درجات:", "**الدرجة الأولى**: أن يرائي بفعل ما في تركه نقصان العبادة، كالذي غرضه أن يخفف الركوع والسجود، ولا يطيل القراءة، فإذا رآه الناس أحسن الركوع والسجود(١)، وترك الالتفات، وتمم القعود بين السجدتين، وهذا يتضمن زيادة تعظيم الخلق على تعظيم الخالق، كما لو كان بين يدي إنسان متكئا، فدخل غلامه، فاستوى، فإن ذلك تقديم للغلام على السيد، وكذلك الذي يعتاد إخراج الزكاة من الذهب الرديء والحب الردي، فإذا اطلع(٢) عليه أحد أخرجه من الجيد خوفا من مذمته، وكذلك الصائم، يصون صومه عن الغيبة والرفث خوفا من المذمة، فهذا أيضا من الرياء المحظور؛ لأن فيه تقديما للمخلوق على الخالق، ولكنه دون الرياء بأصول التطوعات."]], "ic": "book"}, {"story": ["كتاب ذم الجاه والرياء (٢٣ من ٤١)، ص٨٥٨", ["فإن قال المرائي: إنما فعلت ذلك صيانة لألسنتهم عن الغيبة، فإنهم إذا رأوا تخفيف الركوع والسجود، وكثرة الالتفات أطلقوا ألسنتهم بذمي وغيبتي.", "فيقال له: هذه مكيدة من الشيطان، فإن ضررك بنقصان صلاتك أعظم من ضررك بغيبة غيرك، فلو كان باعثك الدين لكانت شفقتك على نفسك أكثر، فإن من يراعي جانب غلام الملك ينبغي أن تكون مراقبته للملك أكثر، إلا أن للمرائي في هذا حالتين:", "**إحداهما**: أن يطلب بذلك المنزلة والمحمدة عند الناس، وذلك حرام.", "**والثانية**: أن يقول: ليس يحضرني الإخلاص في تحسين الركوع والسجود، ولو خففت كانت صلاتي عند الله ناقصة، وآذاني الناس بذمهم وغيبتهم، فأستفيد بتحسين الهيئة دفع مذمتهم(٣)، ولا أرجو عليه ثوابا، فهو خير من أن أترك تحسين الصلاة، فيفوت الثواب وتحصل المذمة.", "حاشية: (١) سقطت من (ف).", "حاشية: (٢) في الأصل: (طلع).", "حاشية: (٣) في (ف): (ذمهم).", "فيقال له: الواجب عليك أن تحسن العبادة وتخلص، ولا يجوز لك أن تدفع(١) الذم بالمراءاة.", "**الدرجة الثانية**: أن يرائي بفعل ما لا نقصان في تركه، ولكن فعله(٢) في حكم التكملة والتتمة للعبادة، كالتطويل في الركوع والسجود(٣)، ومد القيام، وتحسين الهيئة في رفع اليدين، والمبادرة إلى التكبيرة الأولى، وتحسين الاعتدال، والزيادة في القراءة على السور المعتادة، وكذلك طول الصمت في الصوم، واختيار الأجود في الزكاة، وإعتاق الرقبة الغالية، وكل ذلك مما لو خلا بنفسه لكان لا يفعله. قال بشر الحافي: سمعت خالدا الطحان يقول: اتقوا سرائر الشرك. قلت: وما هي؟ قال: أن تصلي فتلحظك العيون، فتطيل السجود.", "**الدرجة الثالثة**: أن يرائي بزيادات خارجة عن نفس النوافل أيضا، كحضوره الجماعة قبل القوم، وقصده الصف الأول، وتوجهه إلى يمين الإمام، ونحو ذلك وكل ذلك يعلم الله منه أنه لو خلا بنفسه لكان لا يبالي أين وقف، ولا متى أحرم، فهذه درجات الرياء بالإضافة إلى ما يراءى به، وبعضه أشد من بعض، والكل مذموم.", "٣ ـ ＊＊الركن الثالث: المراءى لأجله＊＊:", "فإن للمرائي مقصودا لا محالة، وإنما يرائي لإدراك مال أو جاه، أو غرض من الأغراض، وله أيضا ثلاث درجات:", "**الدرجة الأولى**: وهي أشدها وأعظمها؛ أن يكون مقصوده التمكن من معصية، كالذي يرائي بعباداته، ويظهر التقوى والورع، ويمتنع من الشبهات، وغرضه أن يعرف بالأمانة، فيولى القضاء والأوقاف وأموال اليتامى فيأخذها، أو يعطى الصدقات ليفرقها، فيستأثر بما يقدر عليه منها، أو يودع الودائع، ونحو ذلك.", "حاشية: (١) في (ف): (ترفع).", "حاشية: (٢) في الأصل: (حكمه).", "حاشية: (٣) سقطت من الأصل."]], "ic": "book"}, {"story": ["كتاب ذم الجاه والرياء (٢٤ من ٤١)، ص٨٦٠", ["وقد يظهر بعضهم زي التصوف، وهيئة الخشوع والمواعظ، وقصده بلوغ غرض لا يحل، وربما حضر مجالس الوعظ ومقصوده ملاحظة النسوان، أو يخرج إلى الحج ومراده الظفر بمعصية في الطريق، فهؤلاء أبغض المرائين إلى الله تعالى؛ لأنهم جعلوا طاعة(١) ربهم سلما إلى معصيته، ويقرب من هؤلاء من اتهم بجريمة وهو مصر عليها، ويريد أن ينفي التهمة عن نفسه، فيظهر التقوى لنفي التهمة، وكالذي جحد وديعة واتهمه الناس بها، فأخذ يتصدق بالمال ليقال: هذا يتصدق بمال نفسه، فكيف يستحل مال غيره؟", "**الدرجة الثانية**: أن يكون غرضه نيل حظ مباح من مال أو نكاح امرأة، فيتشاغل بالذكر وإظهار الزهد ليرغب فيه، وكالذي يرغب أن يتزوج بنت عالم عابد، فيظهر العلم والعبادة ليرغب في تزويجه ابنته، فهذا رياء محظور؛ لأنه طلب بطاعة الله متاع الدنيا، ولكنه دون الأول؛ لأن المطلوب بهذا مباح في نفسه.", "**الدرجة الثالثة**: أن لا يقصد نيل حظ وإدراك مال أو نكاح، ولكن يظهر عبادته خيفة أن ينظر إليه بعين النقص، أو يعتقد أنه من جملة العامة، وهو يريد أن يعد من الخاصة والزهاد، كالذي يمشي فيطلع عليه الناس، فيحسن المشي، ويترك العجلة، كي لا يقال: إنه من أهل اللهو لا من أهل الوقار. وكذلك يسبق إلى الضحك، أو يبدو(٢) منه المزاح، فيخاف أن ينظر إليه بعين الاحتقار، فيتبع ذلك بالاستغفار، وتنفس الصعداء، وإظهار الحزن ويقول: ما أعظم غفلة الآدمي عن نفسه. والله يعلم منه أنه لو كان في خلوة لم يثقل عليه ذلك، وإنما يخاف أن ينظر إليه بعين الاحتقار، لا بعين التوقير.", "وكالذي يرى جماعة يصلون التراويح، أو يتهجدون، أو يصومون الاثنين والخميس، أو يتصدقون، فيوافقهم خيفة أن ينسب إلى الكسل، ولو خلا بنفسه لكان لا يفعل شيئا من ذلك.", "حاشية: (١) في الأصل: (إطاعة).", "حاشية: (٢) في الأصل: (يندر)."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "وهؤلاء لو كلفوا لبس ثوب خشن أو وسخ لكان عندهم كالذبح، خوفا من السقوط من أعين الملوك والأغنياء، ولو كلفوا لبس الدبيقي، ____ الرقيق الأبيض، أو القصب المعلم ـ وإن كانت قيمته دون قيمة ثيابهم ـ لعظم عليهم ذلك، خوفا من أن يقول أهل الصلاح", "o": ["والكتان", "ثورانا", "وملبس", "العواري"], "h": "راجع: ص٨٤٩"}, {"t": "fill", "d": 2, "q": "ولم يزل المخلصون خائفين من الرياء الخفي، يجتهدون لذلك في مخادعة الناس عن أعمالهم الصالحة، ويحرصون على إخفائها أعظم ما يحرص الناس على إخفاء فواحشهم، كل ذلك رجاء أن يخلص عملهم، فيجازيهم الله في القيامة بإخلاصهم، فكانوا كزوار بيت الله إذا توجهوا إلى مكة، فإنهم يستصحبون معهم الذهب الخالص، لعلمهم أن أرباب البوادي لا يروج عندهم الزائف والبهرج، والحاجة تشتد في البادية، ولا وطن يفزع إليه، فلا ينجي إلا الخالص من ____، فكذا يشاهد أرباب القلوب القيامة والزاد الذي يتزودونه من التقوى", "o": ["النقد", "بعفو", "مشتهيا", "انقطع"], "h": "راجع: ص٨٦٤"}, {"t": "fill", "d": 2, "q": "وينبغي للزاهد المعتزل عن الناس أن لا يخطر بقلبه معرفة الناس زهده واستعظامهم محله، فإن ذلك يغرس الرياء في صدره، فتتيسر عليه العبادات في خلوته، وإنما ____ معرفته بأن الناس يعلمون اعتزاله", "o": ["يسهلها", "فانطلق", "ولينتفع", "لجهنم"], "h": "راجع: ص٨٨٧"}, {"t": "fill", "d": 2, "q": "وكان أبو العالية إذا جلس إليه ____ من أربعة قام", "o": ["أكثر", "ينجزه", "يتنزه", "يطرد"], "h": "راجع: ص٨٢٢"}, {"t": "fill", "d": 2, "q": "ويشهد للرياء بهذه الأسباب، وأنها الباعثة للمرائي، ما أخبرنا به هبة ____ بن محمد، قال", "o": ["الله", "الإبل", "يستبين", "ويفسده"], "h": "راجع: ص٨٦٩"}]}, {"t": "كتاب ذم الجاه والرياء - القسم ٥ من ٧", "b": [{"story": ["كتاب ذم الجاه والرياء (٢٥ من ٤١)، ص٨٦١", ["وكالذي يعطش في يوم عرفة أو عاشوراء، وفي الأشهر الحرم، فلا يشرب خوفا من أن يعلم الناس أنه غير صائم، فإذا ظنوا به الصوم امتنع عن الأكل لأجله، أو يدعى إلى طعام فيمتنع فيظن أنه صائم، وقد لا يصرح بأنه صائم، ولكن يقول: لي عذر. وهو جمع بين خبيثين، فإنه يرى أنه صائم، ثم يرى أنه مخلص ليس بمراء، وأنه يحترز من أن يذكر عبادته للناس فيكون مرائيا، فيريد أن يقال: إنه ساتر لعبادته. ثم إن اضطر إلى شرب لم يصبر عن أن يذكر لنفسه فيه عذرا تصريحا أو تعريضا، بأن يتعلل بمرض يقتضي فرط العطش ويمنع من الصوم، أو يقول: أفطرت تطبيبا لقلب فلان، ثم قد لا يذكر ذلك متصلا بشربه، كي لا يظن به أنه يعتذر رياء، ولكنه يصبر، ثم يذكر عذره في معرض حكاية، مثل أن يقول: إن فلانا محب للإخوان، شديد الرغبة في أن يأكل الإنسان من طعامه، وقد ألح علي اليوم، ولم أجد بدا من تطبيب قلبه. ومثل أن يقول: إن أمي ضعيفة القلب، مشفقة علي، تظن أني لو صمت يوما مرضت، فلا تدعني أصوم.", "فهذا وما يجري مجراه علامات الرياء، فلا يسبق إلى اللسان إلا لرسوخ عرق الرياء في الباطن، وأما المخلص فإنه لا يبالي كيف نظر الخلق إليه، بل يقنع بعلم الله سبحانه.", "فهذه درجات الرياء ومراتب أصناف المرائين، وجميعهم تحت مقت الله وغضبه، وهو من أشد المهلكات، وقد يزل في دقائقه فحول العلماء، فضلا عن العباد الجهلة بآفات النفوس، وغوائل القلوب(١).", "حاشية: (١) في الأصل: (وشر غوائل).", "**بيان**", "**الرياء الخفي الذي هو أخفى من دبيب النمل**", "اعلم أن الرياء جلي وخفي.", "فالجلي: هو الذي يبعث على العمل ويحمل عليه، ولو قصد الثواب، وهو أجلاه.", "وأخفى منه قليلا هو مالا يحمل على العمل مجرده، إلا أنه يخفف العمل الذي أريد به وجه الله، كالذي يعتاد التهجد كل ليلة، فإذا نزل عنده ضيف نشط له، وخف عليه، وعلم أنه لولا رجاء الثواب لكان لا يصلي لمجرد رياء الضيفان.", "وأخفى من ذلك ما لا يؤثر في العمل، ولا في التسهيل والتخفيف أيضا، ولكنه مع ذلك مستبطن في القلب، ومتى لم يؤثر في الدعاء إلى العمل لم يمكن أن يعرف إلا بالعلامات."]], "ic": "book"}, {"story": ["كتاب ذم الجاه والرياء (٢٦ من ٤١)، ص٨٦٢", ["وأجلى علاماته أن يسر باطلاع الناس على طاعته، فرب عبد يخلص في عمله، ولا يعتقد الرياء، بل يكرهه ويرده، ويتمم العمل كذلك، ولكن إذا اطلع الناس عليه سره ذلك، وارتاح له، وروح ذلك عن قلبه شدة العبادة، وهذا السرور يدل على رياء خفي، منه ترشح السرور، ولولا التفات القلب إلى الناس لما ظهر سروره عند اطلاع الناس، فلقد كان الرياء مستكنا في القلب استكنان النار في الحجر، فأظهر منه اطلاع الخلق أثر الفرح والسرور، ثم إذا استشعر لذة السرور بالاطلاع، ولم يقابل ذلك بكراهية، فيصير ذلك قوتا وغذاء للعرق الخفي من الرياء، حتى يتحرك حركة خفية، فيتقاضى تقاضيا خفيا، أن يتكلف شيئا يطلع عليه بالتعريض، وإلقاء الكلام عرضا، وإن كان لا يدعو إلى التصريح.", "وقد يخفى فلا يدعو إلى الإظهار بالنطق تعريضا لا تصريحا، ولكن بالشمائل،", "كإظهار النحول والصفار، وخفض الصوت، ويبس(١) الشفتين، وجفاف(٢) الريق، وآثار الدموع، وغلبة النعاس الدال على طول التهجد.", "وأخفى من ذلك أن يختفي بحيث لا يريد الاطلاع عليه، لكنه مع ذلك إذا رأى الناس أحب أن يبدؤوه بالسلام، وأن يقابلوه بالبشاشة والتوقير، وأن يثنوا عليه، وينشطوا في قضاء حوائجه، ويسامحوه في المعاملة، ويوسعوا له المكان، فإن قصر في ذلك مقصر ثقل ذلك على قلبه، كأن نفسه تتقاضى الاحترام على الطاعة التي أخفاها، مع أنه لم يطلع عليه، ولو لم تكن قد سبقت منه تلك الطاعة لما كان يستبعد تقصير الناس في حقه، ومتى لم يكن وجود العبادة كعدمها في كل ما يتعلق بالخلق، لم يكن قد قنع بعلم الله، ولم يكن خاليا عن شوب(٣) خفي من الرياء، أخفى من دبيب النمل، وكل ذلك يوشك أن يحبط الأجر، ولا يسلم منه إلا الصديقون.", "وقد روينا عن وهب بن منبه أن رجلا من العباد قال لأصحابه: إنا قد فارقنا الأموال والأولاد مخافة الطغيان، وإنا نخاف أن يكون قد دخل علينا في أمرنا هذا من الطغيان أكثر مما دخل على أهل الأموال في أموالهم، إن أحدنا إذا لقي أحب أن يعظم لمكان دينه، وإن سأل حاجة أحب أن تقضى له(٤) لمكان دينه، وإن اشترى شيئا أحب أن يرخص له لمكان دينه. فبلغ ذلك ملكهم، فركب في موكبه، فإذا السهل والجبل قد امتلأ من الناس، فقال العابد: ما هذا؟ قيل: هذا الملك. فقال لصاحبه: ائتني بطعام. فأتاه ببقل وزيت وقلوب الشجر، فجعل يحشو شدقه، ويأكل أكلا عنيفا، (٥-٥)فقال الملك: أين صاحبكم؟ قالوا: هذا. فقال له: كيف أنت؟ قال: كالناس. فقال الملك: ما عند هذا خير. فانصرف عنه، فقال: الحمد لله الذي(٥-٥) صرفه عني وهو لي لائم(٦).", "حاشية: (١) في (ف): (تيبس).", "حاشية: (٢) في (ف): (جفوف).", "حاشية: (٣) الشوب: الخلط.", "حاشية: (٤) سقطت من (ف).", "حاشية: (٥-٥) سقط من الأصل.", "حاشية: (٦) حلية الأولياء ٤/ ٤٨ ـ ٤٩."]], "ic": "book"}, {"story": ["كتاب ذم الجاه والرياء (٢٧ من ٤١)، ص٨٦٤", ["ولم يزل المخلصون خائفين من الرياء الخفي، يجتهدون لذلك في مخادعة الناس عن أعمالهم الصالحة، ويحرصون على إخفائها أعظم ما يحرص الناس على إخفاء فواحشهم، كل ذلك رجاء أن يخلص عملهم، فيجازيهم الله في القيامة بإخلاصهم، فكانوا كزوار بيت الله إذا توجهوا إلى مكة، فإنهم يستصحبون معهم الذهب الخالص، لعلمهم أن أرباب البوادي لا يروج عندهم الزائف والبهرج(١)، والحاجة تشتد في البادية(٢)، ولا وطن يفزع إليه، فلا ينجي إلا الخالص من النقد، فكذا يشاهد أرباب القلوب القيامة والزاد الذي يتزودونه من التقوى.", "فإذا شوائب الرياء الخفي كثيرة لا تنحصر، ومتى أدرك الإنسان من نفسه تفرقة، بين أن يطلع على عبادته إنسان أو بهيمة أو طفل، ففيه شعبة من الرياء، فإنه لما قطع طمعه عن البهائم، لم يبال حضرت أم غابت، فلو كان مخلصا قانعا بعلم الله، لاستحقر عقلاء العباد كما احتقر صبيانهم ومجانينهم، وعلم أن العقلاء لا يقدرون له على رزق ولا أجل، ولا زيادة ثواب، ونقصان عقاب، كما لا يقدر عليه البهائم والصبيان والمجانين، فإذا لم يجد ذلك ففيه شوب خفي، ولكن ليس كل شوب محبطا للأجر ومفسدا للعمل، بل فيه تفصيل.", "فإن قيل: فما ترى أحدا ينفك عن السرور إذا عرفت طاعته، فهل جميع ذلك مذموم؟", "**فالجواب**: إن السرور ينقسم إلى محمود ومذموم؛ فأما المحمود فأربعة أقسام:", "**الأول**: أن يكون قصده إخفاء الطاعة والإخلاص لله، ولكن لما اطلع(٣) عليه الخلق علم أن الله أطلعهم، وأظهر الجميل من أحواله، فيستدل بذلك على حسن صنيع الله، ونظره له، ولطفه به، وأنه يستر الطاعة والمعصية، فيظهر الله عليه الطاعة، ويستر عليه المعصية، ولا لطف أعظم من ستر القبيح، وإظهار الجميل،", "حاشية: (١) البهرج: الردئ والباطل.", "حاشية: (٢) تحرفت في (ف) إلى: (الباطنة).", "حاشية: (٣) بعدها في الأصل لفظ الجلالة.", "فيكون فرحه بجميل نظر الله له، لا بحمد الناس وقيام المنزلة في قلوبهم، وقد قال الله تعالى: ﴿قُلْ بِفَضْلِ ٱللَّهِ وَبِرَحْمَتِهِۦ فَبِذَٰلِكَ فَلْيَفْرَحُوا۟﴾ [يونس: ٥٨]", "**الثاني**: أن يستدل بإظهار الله الجميل وستره القبيح عليه في الدنيا، أنه كذلك يفعل به في الآخرة، فقد روى علي رضي الله عنه، عن النبي ﷺ أنه قال: «من أذنب ذنبا في الدنيا، فستر الله عليه، وعفا عنه، فالله أكرم من أن يعود في شيء قد عفى عنه»(١).", "فعلى الأول؛ يكون الفرح بالقبول في الحال، من غير ملاحظة المستقبل، وعلى الثاني؛ يكون الالتفات إلى المستقبل."]], "ic": "book"}, {"story": ["كتاب ذم الجاه والرياء (٢٨ من ٤١)، ص٨٦٥", ["**والثالث**: أن يظن رغبة المطلعين على الاقتداء به في الطاعة، فتتضاعف بذلك أجره، فيكون له أجر العلانية بما ظهر آخرا، وأجر السر بما قصده أولا، ومن اقتدي به في طاعة فله أجر أعمال المقتدين به(٢)، من غير أن ينقص من أجورهم شيء، وتوقع ذلك جدير بأن يكون سبب السرور، فإن ظهور مخايل الربح لذيذة، وموجبة للسرور لا محالة، وفي أفراد مسلم من حديث أبي ذر قال: قيل لرسول الله: أرأيت الرجل يعمل العمل من الخير، ويحمده الناس عليه؟ قال: «تلك عاجل بشرى المؤمن»(٣).", "**والرابع**: أن يحمده المطلعون على طاعته، فيفرح بطاعتهم لله في مدحهم، وبحبهم للمطيع، وبميل قلوبهم إلى الطاعة، إذ في الناس من يحسد المطيع ويذمه، ويهزأ به، وينسبه إلى الرياء، فيفرح هذا بحسن إيمان عباد الله.", "حاشية: (١) أخرجه أحمد (٧٧٥)، والترمذي (٢٦٢٦)، وابن ماجه (٢٦٠٤)، والبزار (٤٨٢)، والطحاوي في شرح المشكل (٢١٨١)، والطبراني في الصغير (٤٦)، والحاكم ٢/ ٤٤٥ و٤/ ٣٨٨، والبيهقي في السنن ٨/ ٣٢٨.", "حاشية: (٢) ليست في (ف).", "حاشية: (٣) أخرجه مسلم (٢٦٤٢)، والطيالسي (٤٥٥)، وابن أبي شيبة ١١/ ٥٣، وأحمد (٢١٣٨٠) و(٢١٤٠٠) و(٢١٤٧٧)، وابن ماجه (٤٢٢٥) وابن حبان (٣٦٧).", "**والخامس**: أن يكون فرحه لقيام منزلته في قلوب الناس، حتى يمدحونه ويعظمونه، ويقومون بقضاء حوائجه، ويكرمونه، فهذا المكروه المذموم.", "فإن قيل: فما وجه حديث أبي هريرة قال: قال رجل: يا رسول الله، الرجل يعمل العمل فيسره، فإذا اطلع عليه أعجبه ذلك. فقال رسول الله ﷺ: «له أجران: أجر السر وأجر العلانية»(١).", "فالجواب من وجوه:", "**أحدها**: تضعيف هذا الحديث، فإن أكثر من يرويه يقفه على أبي صالح، ولا يذكر فيه أبا هريرة، وقد رواه الترمذي عن أبي صالح، عن أبي هريرة مرفوعا، وقال: هو حديث غريب(٢).", "**والثاني**(٣): ذكر الترمذي أن بعض أهل العلم فسره فقال: معناه أن يعجبه ثناء الناس عليه بالخير، لقوله ﷺ: «أنتم شهداء الله في الأرض»(٤). فأما إذا أعجبه ليعلم الناس منه الخير ويكرم عليه، فهذا رياء.", "**الثالث**: قال بعض أهل العلم: يعجبه إذا اطلع عليه، رجاء أن يعمل بعمله، فيكون له مثل أجر من عمل.", "حاشية: (١) أخرجه الطيالسي (٢٤٣٠)، والبخاري في التاريخ الكبير ٢/ ٢٢٨، والترمذي (٢٣٨٤) وابن ماجه (٤٢٢٦)، وابن حبان (٣٧٥)، والطبراني في الأوسط (٤٦٩٩)، والبغوي في شرح السنة (٤١٤١) عن أبي صالح ذكوان عن أبي هريرة مرفوعا.", "وأخرجه البخاري في التاريخ الكبير ٢/ ٢٢٨ من عدة طرق عن أبي صالح مرسلا.", "حاشية: (٢) هكذا في النسخ وتحفة الأشراف ٩/ ٣٤٢، وشرح السنة (٤١٤١)، وفي مطبوع سنن الترمذي: (حديث حسن غريب).", "حاشية: (٣) ليست في النسخ، واستدركت من سنن الترمذي لبيان بقية الوجوه في الجواب.", "حاشية: (٤) أخرجه البخاري (١٣٦٧)، ومسلم (٩٤٩).", "**بيان**"]], "ic": "book"}, {"story": ["كتاب ذم الجاه والرياء (٢٩ من ٤١)، ص٨٦٧", ["**ما يحبط العمل من الرياء الخفي والجلي وما لا يحبط**", "إذا عقد العبد العبادة على الإخلاص، ثم ورد عليه وارد الرياء، فلا يخلو أن يكون ورد عليه بعد فراغه، أو قبل الفراغ.", "فإن ورد عليه بعد الفراغ سرور بالظهور من غير إظهار، فهذا لا يحبط العمل، إذ العمل قد تم على نعت الإخلاص، فلا ينعطف ما طرأ بعده عليه، لا سيما إذا لم يتكلف هو إظهاره والتحدث به، وإنما اتفق إظهاره بإظهار الله له.", "فأما إن تحدث به بعد تمامه، وأظهره فهذا مخوف، والغالب على من أخبر بالعمل بعد تمامه ليمدح، أنه قد كان في قلبه وقت مباشرة العمل نوع رياء، فإن سلم من ذلك أثيب على إخلاصه، وعوقب على ريائه بالتحديث، فإن نجا من ذلك نقص أجره.", "كما روينا عن سفيان الثوري أنه قال: بلغني: «أن العبد يعمل العمل سرا، فلا يزال الشيطان به حتى يعلنه، فيكتب في العلانية، ثم لا يزال الشيطان به حتى يحب أن يحمد عليه، فينسخ من العلانية، فيثبت(١) في الرياء»(٢).", "فانظر إلى هذا الكيد الخفي، فإن بين عمل السر والعلانية سبعين درجة.", "وأما إذا ورد وارد الرياء قبل الفراغ من الصلاة التي عقدها على الإخلاص،", "حاشية: (١) في الأصل: (فيكتب).", "حاشية: (٢) لا يصح مرفوعا، فالزهري لم يذكر عمن أخذه، وأخرجه الخطيب البغدادي في تاريخه ٦/ ٦٣، والمصنف في الموضوعات ٣/ ١٥٤ من حديث أنس بنحوه، وإسناده تالف، فيه خلف بن محمد وهو ضعيف جدا، وعيسى بن موسى غنجار يروي عن الكذابين ويدلس، وإسماعيل بن أبي زياد السكوني، دجال كذاب، وأبان بن أبي عياش متروك.", "فإن كان مجرد سرور لم يؤثر في العمل، وإن كان رياء باعثا على العمل، وختمت به العبادة، حبط الأجر، مثل أن يكون في صلاة فيحضر من ينظر إليه، فيطيل ليرى.", "فأما ما يقارن العبادة حال العقد، بأن يبتدئ الصلاة على قصد الرياء، فإن أتمها على ذلك لم يعتد بها، وإن ندم فيها على فعله فالذي أراه: له ابتداؤها.", "**بيان**", "**دواء الرياء، وطريق معالجة القلب فيه**", "قد عرفت بما تقدم أن الرياء محبط للأعمال، وسبب لمقت الله عز وجل، وأنه من المهلكات، وما هذا حاله فجدير بالتشمير عن ساق الجد في إزالته، وهذه المجاهدة يضطر إليها الخلق كلهم؛ لأن الصبي يخلق ضعيف العقل والتمييز، فيرى تصنع الناس بعضهم لبعض، فيغلب عليه حب التصنع ضرورة، وإنما يعلم أن التصنع مهلك بعد كمال عقله، وقد انغرس الرياء في قلبه، فيفتقر حينئذ في قمعه إلى مجاهدة شديدة، ومكابدة قوية، ولا ينفك عن الاحتياج إلى هذه المجاهدة، ولكنها تشق أولا، وتخف آخرا، وفي علاجه مقامان:", "أحدهما: قلع عروقه وأصوله التي منها انشعابه.", "والثاني: رفع ما يخطر منه في الحال.", "**المقام الأول**: في قلع عروقه، واستئصال أصوله: وأصله حب الجاه والمنزلة، وإذا فصل رجع إلى ثلاثة أصول، وهي:", "١ ـ حب لذة الحمد.", "٢ ـ الفرار من ألم الذم.", "٣ ـ الطمع فيما في أيدي الناس."]], "ic": "book"}, {"story": ["كتاب ذم الجاه والرياء (٣٠ من ٤١)، ص٨٦٩", ["ويشهد للرياء بهذه الأسباب، وأنها الباعثة للمرائي، ما أخبرنا به هبة الله بن محمد، قال: أخبرنا الحسن بن علي التميمي، قال: أخبرنا أحمد بن جعفر، قال: حدثنا عبد الله بن أحمد، قال: حدثني أبي، قال: حدثنا أبو معاوية، قال: حدثنا الأعمش، عن شقيق، عن أبي موسى، قال: جاء رجل إلى النبي ﷺ فقال: يا رسول الله، أرأيت الرجل يقاتل شجاعة، ويقاتل حمية، ويقاتل رياء، فأي ذلك في", "سبيل الله؟ قال: فقال رسول الله ﷺ: «من قاتل لتكون كلمة الله هي العليا، فهو في سبيل الله عز وجل» أخرجاه في الصحيحين(١).", "ومعنى قوله: يقاتل شجاعة. أي: ليذكر ويحمد بالألسنة. ومعنى قوله: حمية. أنه يأنف أن يقهر أو يذم بأنه مقهور. ومعنى: يقاتل رياء. أي: ليرى مكانه، وهذا هو طلب لذة الجاه والقدر في القلوب.", "وقد لا يشتهي الإنسان الحمد، ولا يطمع فيه، ولكنه يحذر من الذم، كالبخيل بين الأسخياء، فإنهم(٢) إذا تصدقوا(٣) تصدق كي لا يبخل، وكذلك الجبان بين الشجعان، فيثبت ولا يفر لئلا يذم، فكلاهما لا يطمع في الحمد؛ لأنه قد يئس منه، لكنه يتقي الذم، وقد يفتي الإنسان بغير علم حذرا من الذم بالجهل.", "فهذه الأمور الثلاثة هي التي تحرك المرائي إلى الرياء، وعلاجه ما ذكرناه في الشطر الأول من الكتاب على الجملة، ولكنا الآن نذكر ما يخص الرياء.", "وليس يخفى أن الإنسان إنما يقصد الشيء ويرغب فيه، لظنه أنه خير له ونافع ولذيذ، إما في الحال وإما في المآل، فإن علم أنه لذيذ في الحال ولكنه ضار في المآل، سهل عليه قطع الرغبة عنه، كمن يعلم أن العسل لذيذ، ولكن إذا بان له أن فيه سما أعرض عنه، وكذلك طريق هذه الرغبة، أن يعلم ما فيها من المضرة، ومتى عرف الإنسان مضرة الرياء، وما يفوته من صلاح قلبه، ومن المنزلة في الآخرة، وما يتعرض له من العقاب والمقت والخزي، حين ينادى عليه على رؤوس العباد: يا فاجر يا مرائي(٤) [كان ذلك رادعا له عنه](٥) هذا مع ما يتعرض له من تشتت الهم بسبب ملاحظة قلوب الخلق، فإن رضى الناس غاية لا تدرك، فكل ما يرضى به فريق يسخط به فريق، ومن طلب رضاهم في سخط الله سخط الله عليه وأسخطهم", "حاشية: (١) أخرجه أحمد (١٩٥٤٣)، والبخاري (١٢٣)، ومسلم (١٩٠٤).", "حاشية: (٢) في (ف): (فإنه).", "حاشية: (٣) سقطت من (ف).", "حاشية: (٤) أخرجه الديلمي في الفردوس (٦٦١٩) عن جبلة اليحصبي مرسلا.", "حاشية: (٥) زيادة من الإحياء يتم بها المعنى.", "عليه، ثم أي عرض له في مدحهم وإيثار ذم الله لأجل حمدهم، ولا يزيده حمدهم(١) رزقا ولا أجلا، ولا ينفعه يوم فقره وفاقته؟!!"]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "وأما أهل الدنيا فمراءاتهم بالثياب النفيسة، والمراكب الرفيعة، وأنواع التجمل في الملبس والمسكن وأثاث البيت، وهم يلبسون في ____ الثياب الخشنة، ويشتد عليهم لو برزوا بتلك الهيئة", "o": ["بيوتهم", "يرفع", "فأرسل", "اعبروها"], "h": "راجع: ص٨٤٩"}, {"t": "fill", "d": 2, "q": "وإنما ينبغي أن ينظر إلى قصده الباطن، ولا يلتفت إلى وساوس الشيطان، ويبلو أمره، بأن يماثل القوم في مكان يراهم فيه وهم لا يرونه، فإن رأى نفسه تسخو بالتعبد فذاك لله، وإن لم تسخ كان سخاؤها عندهم رياء، ____ قد يوجب", "o": ["وكذلك", "الشرك", "تزود", "البساط"], "h": "راجع: ص٨٨٤"}, {"t": "fill", "d": 2, "q": "وإنما كمال القوة في دفع الخاطر الأول، ورده قبل أن يتلوه ____", "o": ["الثاني", "بثوب", "ويحتقرهم", "نميمته"], "h": "راجع: ص٨٧٣"}, {"t": "fill", "d": 2, "q": "اعلم أن أصل الجاه هو انتشار الصيت والاشتهار، وذلك خطر عظيم، تبعد سلامة صاحبه، والسلامة في الخمول، إلا أن تكون الشهرة من الله تعالى للشخص بمعنى ما قصده الشخص، كما شهر الإمام أحمد ابن حنبل رحمه الله حين نصر القرآن، وقد كان ابن سيرين إذا دخل السوق كبر ____، وقد قال أبو حبيب البدوي لسفيان الثوري", "o": ["الناس", "فعليكم", "يسقط", "إلينا"], "h": "راجع: ص٨٢٠"}, {"t": "fill", "d": 2, "q": "والثالث: أن يظن رغبة المطلعين على الاقتداء به في الطاعة، فتتضاعف بذلك أجره، فيكون له أجر العلانية بما ظهر آخرا، وأجر السر بما ____ أولا، ومن اقتدي به في طاعة فله أجر أعمال المقتدين به، من غير", "o": ["قصده", "جديدا", "ينفرون", "فمرض"], "h": "راجع: ص٨٦٥"}, {"t": "fill", "d": 2, "q": "وإن كنت خاليا عن الصفة التي مدحت بها ففرحك بالمدح غاية الجنون، ومثلك ____ من قيل له", "o": ["مثال", "إساءته", "استدل", "ليستر"], "h": "راجع: ص٨٤٠"}]}, {"t": "كتاب ذم الجاه والرياء - القسم ٦ من ٧", "b": [{"story": ["كتاب ذم الجاه والرياء (٣١ من ٤١)، ص٨٧١", ["وأما الطمع فيما في أيديهم فيزيله بأن يعلم أن الله هو المسخر للقلوب بالمنع والإعطاء، وأنه لا رازق إلا الله، ومن طمع في الخلق لم يخل من الذل والخيبة، وإن وصل إلى المراد لم يخل عن المنة والمهانة، فكيف يترك ما عند الله برجاء(٢) كاذب، ووهم فاسد قد يصيب وقد يخطئ؟! وإذا أصاب لم تف لذته بألم منته ومذلته.", "وأما ذمهم فلم يحذر منه؟! ولا يزيده ذمهم شيئا لم يكتبه الله عليه؟! ولا يعجل أجله، ولا يؤخر رزقه؟! والعباد كلهم عجزة، لا يملكون لأنفسهم نفعا ولا ضرا، ولا يملكون موتا ولا حياة ولا نشورا.", "فإذا قرر في (٣-٣)نفسه آفة(٣-٣) هذه الأسباب وضرها، فترت رغبته، وأقبل على الله قلبه، فإن العاقل لا يرغب فيما يكثر ضرره ويقل نفعه، ويكفيه أن الناس لو علموا ما في باطنه من قصد الرياء لمقتوه، وسيكشف الله عز وجل عن سره، حتى يبغضه إلى الناس، ويعرفهم أنه مراء مقيت عند الله، ولو أخلص لله لكشف الله لهم إخلاصه، وحببه إليهم، وسخرهم له، وأطلق ألسنتهم بحمده والثناء عليه، مع أنه لا كمال(٤) في مدحهم، ولا نقصان في ذمهم، كما قال شاعر بني تميم(٥): إن مدحي زين، وإن ذمي شين. فقال رسول الله ﷺ: «ذاك الله»(٦).", "حاشية: (١) في (ف): (مدحهم).", "حاشية: (٢) تحرفت في الأصل إلى: (جائز).", "حاشية: (٣-٣) سقط من الأصل.", "حاشية: (٤) في الأصل: (جمال).", "حاشية: (٥) هو الأقرع بن حابس التميمي المجاشعي، صحابي من الأشراف في الجاهلية والإسلام، كان من المؤلفة قلوبهم ثم حسن إسلامه وشهد فتح مكة وحنينا والطائف، واستشهد بجوزجان نحو سنة (٣١) هـ. الإصابة ١/ ١٠١، الأعلام ٥/ ٢.", "حاشية: (٦) أخرجه أحمد (١٥٩٩١)، وابن أبي عاصم في الآحاد والمثاني (١١٧٨)، والطبراني في الكبير (٨٧٨)، وأبو نعيم في معرفة الصحابة (١٠٣٣)، وابن الأثير في أسد الغابة ١/ ١٣٠،", "=", "وأي خير للإنسان في مدح الناس إذا كان عند الله مذموما؟! وأي شر له في ذمهم إذا كان عند الله محمودا؟!", "فمن أحضر في قلبه الآخرة ونعيمها المؤبد، احتقر ما يتعلق بالخلق أيام الحياة، مع ما فيه من الكدر والتنغيص، واجتمع همه، وانصرف إلى الله سبحانه قلبه، وتخلص من مذلة الرياء ومقاساة قلوب الخلق، وانعطف من إخلاصه أنوار على قلبه، ينشرح بها صدره، وينفتح له من لطائف المكاشفات ما يزيد به أنسه بالله عز وجل، ووحشته من الخلق، واحتقاره للدنيا، واستعظامه للآخرة، وسقط محل الخلق من قلبه، وانحلت عنه داعية الرياء، وتذلل له منهج الإخلاص. فهذا وما قدمناه في الشطر الأول هي الأدوية العلمية القالعة لمغارس الرياء.", "وأما الدواء العملي فهو: أن يعود نفسه إخفاء العبادات، وإغلاق الأبواب دونها، كما تغلق الأبواب دون الفواحش، حتى يقنع قلبه بعلم الله واطلاعه على عبادته، ولا تنازعه النفس إلى طلب علم غير الله به."]], "ic": "book"}, {"story": ["كتاب ذم الجاه والرياء (٣٢ من ٤١)، ص٨٧٢", ["ولا دواء للرياء مثل إخفاء الأعمال، وذلك يشق في بداية المجاهدة، وإذا صبر عليه مدة بالتكلف سقط عنه ثقله، وهان عليه ذلك بتواصل ألطاف الله، وما يمد به عباده من حسن التوفيق والتأييد، فعلى العبد المجاهدة، ومن الله التوفيق.", "**المقام الثاني**: في دفع العارض منه في أثناء العبادة، وذلك لابد من تعلمه أيضا، فإن من جاهد نفسه، وقلع مغارس الرياء من قلبه بالقناعة وقطع(١) الطمع، وإسقاط نفسه من أعين المخلوقين، واحتقار مدحهم وذمهم، فالشيطان لا يتركه في أثناء العبادة، بل يعارضه بخطرات الرياء، ولا تنقطع عنه نزغاته، وهوى النفس وميلها لا ينمحي بالكلية، فلابد أن يتشمر لدفع ما يعرض من خاطر الرياء.", "وخواطر الرياء ثلاثة، قد تخطر دفعة واحدة كالخاطر الواحد، وقد تترادف على التدريج:", "حاشية (تتمة): عن أبي سلمة بن عبد الرحمن عن الأقرع بن حابس، وإسناده ضعيف لانقطاعه، فأبو سلمة لم يسمع من الأقرع.", "حاشية: (١) سقطت من (ف).", "فالأول: العلم باطلاع الخلق، ورجاء اطلاعهم، ثم يتلوه هيجان الرغبة من النفس في حمدهم وحصول المنزلة عندهم، [وهو الثاني](١)، ثم يتلوه قبول النفس له والركون إليه، وعقد الضمير على تحقيقه، [وهو الثالث](٢).", "فالأول: معرفة، والثاني: حالة تسمى الشهوة والرغبة. والثالث: فعل يسمى العزم وتصميم العقد.", "وإنما كمال القوة في دفع الخاطر الأول، ورده قبل أن يتلوه الثاني. فإذا خطر له معرفة اطلاع الخلق أو رجاء اطلاعهم، دفع ذلك بأن قال: مالك وللخلق علموا أو لم يعلموا؟! والله عليم بحالك، فأي فائدة في علم غيره؟!", "فإن هاجت الرغبة إلى لذة الحمد بذكر ما رسخ في قلبه من ذلك ذكرها آفات الرياء، وتعرضه للمقت، وخيبته في أحوج أوقاته إلى أعماله، فكما أن معرفة اطلاع الناس تثير شهوة ورغبة في الرياء، فمعرفة آفة(٣) الرياء تثير كراهة له تقابل تلك الشهوة، والشهوة تدعو إلى الإباء، والكراهة تدعو إلى القبول، والنفس تطاوع أقواهما وأغلبهما، فإذا لابد في رد الرياء من ثلاثة أمور: المعرفة والكراهة والإباء.", "وقد يشرع العبد في العبادة على عزم الإخلاص، ثم يرد خاطر الرياء فيقبله، ولا تحضره المعرفة، ولا الكراهة التي كان الضمير منطويا عليها، وسبب ذلك امتلاء القلب بخوف الذم وحب الحمد، واستيلاء الحرص عليه، بحيث لا يبقى في القلب متسع لغيره(٤)، فتعزب عن القلب المعرفة السابقة بآفات الرياء وشؤم عاقبته، إذ لم يبق موضع في القلب خال عن شهوة الحمد خوف الذم، وهو كالذي يحدث نفسه بالحلم وذم الغضب، ويعزم على التحلم عند جريان سبب الغضب، ثم يجري", "حاشية: (١) زيادة من الإحياء يقتضيها السياق.", "حاشية: (٢) زيادة من الإحياء يقتضيها السياق.", "حاشية: (٣) في الأصل: (آفات).", "حاشية: (٤) في الأصل: (لغير الله) والمثبت من (ف) موافق للإحياء والإتحاف."]], "ic": "book"}, {"story": ["كتاب ذم الجاه والرياء (٣٣ من ٤١)، ص٨٧٤", ["من الأسباب ما يشتد به غضبه، فينسى سابق عزمه، ويمتلئ قلبه غيظا يمنع من تذكر آفة الغضب، ويشغل عنه، فكذلك حلاوة الشهوة تملأ القلب، وتدفع نور المعرفة، مثل مرارة الغضب، ومثل هذا ما جرى للصحابة حين بايعوا رسول الله ﷺ (١-١)تحت الشجرة(١-١) أن لا يفروا(٢)، ثم إن أكثر القلوب امتلأت يوم حنين بالخوف، ففروا ناسين للعهد السابق(٣).", "وأكثر الشهوات التي تهجم فجأة هكذا تكون، فتنسى معرفة المضرة الداخلة في عقد الإيمان، فإذا نسيت المعرفة لم تظهر الكراهة، فإن الكراهة ثمرة المعرفة.", "وقد يتذكر، فيعلم أن الذي خطر له هو خاطر الرياء الذي يعرضه لسخط الله، ولكنه يستمر عليه لشدة شهوته، فيغلب هواه عقله، ولا يقدر على ترك لذة الحال، فيسوف بالتوبة، أو يتشاغل عن التفكر في ذلك لشدة الشهوة، فكم من عالم يحضره كلام لا يدعوه إلى قوله إلا رياء الخلق، وهو يعلم ذلك، ويستمر عليه، ولا تنفعه معرفته إذا خلت المعرفة عن الكراهة.", "وقد تحضر المعرفة والكراهة، ثم يجيب داعي الرياء، وذلك حين تكون الكراهة ضعيفة بالإضافة إلى قوة الشهوة، وهذا أيضا لا ينتفع بكراهته، إذ الغرض من الكراهة أن تصرف عن الفعل.", "فإذا لا فائدة إلا في اجتماع الثلاث: المعرفة والكراهة والإباء، فالإباء ثمرة الكراهة، والكراهة ثمرة المعرفة، وقوة المعرفة بحسب قوة الإيمان ونور المعرفة، وضعف المعرفة بحسب الغفلة وحب الدنيا ونسيان الآخرة، وقلة التفكر فيما عند الله، وقلة التأمل في آفات الحياة الدنيا وعظيم نعيم الآخرة، وبعض ذلك ينتج بعضا ويثمره، وأصل ذلك كله حب الدنيا وغلبة الشهوات، فهو رأس كل خطيئة،", "حاشية: (١-١) سقط من الأصل.", "حاشية: (٢) أخرجه البخاري (٢٩٦٠)، ومسلم (١٨٦٠) من حديث سلمة بن الأكوع، وفيه أن البيعة كانت على الموت، وأخرجه مسلم (١٨٥٦) من حديث جابر و(١٨٥٨) من حديث معقل ابن يسار، ولفظه: (بايعناه على أن لا نفر، ولم نبايعه على الموت).", "حاشية: (٣) حديث غزوة حنين أخرجه مسلم (١٧٧٥) من حديث العباس رضي الله عنه.", "ومنبع كل ذنب؛ لأن حلاوة حب الجاه والمنزلة ونعيم الدنيا هي التي تسلب القلب، وتحول بينه وبين التفكر في العاقبة، والاستضاءة بأنوار العلم.", "فإن قيل: فما تقول فيمن لا يرى إلا أن طبعه يحب الرياء؟ فالجواب: أنه لم يكلف الإنسان محو ما في طبعه، إنما كلف مخالفة ما في طباعه.", "**بيان**", "**الرخصة في قصد إظهار الطاعات**", "اعلم أن في إسرار الأعمال فائدة الإخلاص، والنجاة من الرياء، وفي الإظهار فائدة الاقتداء، وترغيب الناس في الخير، ولكن فيه آفة الرياء.", "والإظهار قسمان: أحدهما: في نفس العمل، والآخر: بالتحدث بالعمل."]], "ic": "book"}, {"story": ["كتاب ذم الجاه والرياء (٣٤ من ٤١)، ص٨٧٦", ["**فالقسم الأول**: كإظهار الصدقة في الملأ لترغيب الناس فيها، كما روي في الصحيح أن رسول الله ﷺ حث على الصدقة، فجاء أنصاري بصرة، فتتابع الناس، فقال رسول الله ﷺ: «من سن في الإسلام سنة حسنة فله أجرها وأجر من عمل بها بعده، من غير أن ينقص من أجورهم شيء»(١).", "واعلم أن الأعمال منها ما لا يمكن إسراره، فالمبادرة إليه ليس من الإعلان، بل هو تحريض مجز، كالحج والجهاد، فالأفضل البدار إليه للتحريض(٢) لا للرياء، ومنها ما يمكن إسراره، كالصدقة والصلاة، فإن كان إظهار الصدقة يؤذي المتصدق عليه، لكنه يرغب الناس في الصدقة، فالسر أفضل؛ لأن الإيذاء حرام، فإن لم يكن فيه إيذاء فقد اختلف الناس في الأفضل، فقال قوم: السر أفضل من العلانية، وإن كان فيها قدوة وقال قوم: السر أفضل من علانية لا قدوة فيها، والعلانية للقدوة أفضل من السر. وهذا هو الصحيح لمكان فضل الاقتداء، وإنما", "حاشية: (١) أخرجه أحمد (١٩١٧٤) (٦٩) [٤/ ٢٠٦٠]، ومسلم (١٠١٧)، والطيالسي (٦٧٠)، وابن أبي شيبة ٣/ ١٠٩ ـ ١١٠، والنسائي في المجتبى ٥/ ٧٥٨ وفي ا لكبرى (٢٣٣٥) وابن حبان (٣٣٠٨)، والطبراني في الكبير (٢٣٧٢) والبيهقي في السنن ٤/ ١٧٥ وفي الشعب (٣٣١٩) والبغوي في شرح السنة (١٦٦١)، عن جرير بن عبد الله البجلي.", "حاشية: (٢) في الأصل: (للتحريض إليه).", "يخاف من الظهور الرياء، ومتى حصلت شائبة الرياء لم ينفعه اقتداء غيره، إلا أن على الذي يظهر العمل وظيفتين:", "إحداهما: أن يظهره حيث يعلم أنه يقتدى به، أو يظن ذلك ظنا، وإنما يصح الإظهار بنية القدوة ممن هو في محل القدوة، على من هو في محل الاقتداء به.", "والثانية: أن يراقب قلبه، فإنه ربما يكون فيه حب الرياء الخفي، فيدعوه إلى الإظهار بحجة الاقتداء، وإنما شهوة التحمل بالعمل، وبكونه مقتدى به، وهذا حال كل من يظهر أعماله، إلا الأقوياء المخلصون، وقليل ما هم، فلا ينبغي للضعيف أن يخدع نفسه بذلك، فيهلك وهو لا يشعر، فإن مثال الضعيف مثال الغريق الذي يحسن سباحة ضعيفة، فنظر إلى جماعة من الغرقى فرحمهم، فأقبل عليهم حتى يتشبثوا به، فهلكوا وهلك، ويا ليت الرياء كان كالغرق، فإن ألم الغرق ساعة، وعذاب الرياء دائم مدة مديدة، وها هنا مزلة أقدام العباد والعلماء، فإنهم يتشبهون بالأقوياء في الإظهار، ولا تقوى قلوبهم على الإخلاص، فتحبط أجورهم بالرياء.", "والتفطن لذلك غامض، ومحكه أن يعرض على نفسه، أنه لو قيل له: أخف العمل حتى يقتدي الناس بعالم آخر من أقرانك، ويكون لك في السر مثل أجر الإعلان. فإن مال قلبه إلى أن يكون هو المقتدى به، وهو المظهر للعمل، فباعثه الرياء دون طلب الأجر؛ لأنه إنما يميل إلى الإظهار لقصد ملاحظة أعين الناس، فليحذر العبد خدع النفس، وفي الإظهار أخطار، والسلامة في الإخفاء."]], "ic": "book"}, {"story": ["كتاب ذم الجاه والرياء (٣٥ من ٤١)، ص٨٧٧", ["**القسم الثاني**: أن يتحدث بما فعله بعد الفراغ، وحكمه حكم إظهار نفس العمل، والخطر في هذا أشد لأن مؤونة النطق خفيفة على اللسان، وقد تجري في الحكاية زيادة ومبالغة، وللنفس لذة في إظهار الدعاوى عظيمة، إلا أنه لو تطرق إليه الرياء، لم يؤثر في إفساد العبادة الماضية بعد الفراغ منها، فهو من هذا الوجه أهون، والحكم فيه: أن من قوي وتم إخلاصه، وصغر الناس في عينيه، واستوى عنده مدحهم وذمهم، وذكر ذلك عند من يرجو الاقتداء به فجائز، بل مندوب إليه إن صفت النية وسلمت؛ لأنه ترغيب في الخير، والترغيب في الخير خير.", "وقد نقل مثل هذا عن جماعة. فقال عمر: ما أبالي أصبحت على يسر أو على عسر؛ لأني لا أدري أيهما خير لي. وقال عثمان بن عفان رضي الله عنه: ما تغنيت ولا تمنيت، ولا مسست ذكري بيميني منذ بايعت رسول الله(١). وقال ابن مسعود: ما أصبحت على حال فتمنيت أن أكون على حال(٢) غيرها. وقال شداد بن أوس: ما تكلمت بكلمة منذ أسلمت إلا وأنا أزمها وأخطمها(٣) غير كلمتي هذه. وكان قد قال لغلامه: ائتنا بالسفرة نعبث بها(٤). وقال أبو سفيان المغيرة(٥) لأهله حين احتضر: لا تبكوا علي، فإني ما تنطفت(٦) بخطيئة منذ أسلمت.", "وهذا كثير في كلام السلف، وكله إظهار لأحوال شريفة، وفيها غاية المراءاة إذا صدرت ممن يرائي بها، وغاية الترغيب إذا صدرت ممن يقتدى به، فيجوز مثل هذا للأقوياء بالشروط التي ذكرناها.", "حاشية: (١) أخرجه أبو يعلى في مسنده (٣٩٥٨) مطولا عن أنس بن مالك في سياق قصة، وهو حديث موضوع، في إسناده صقر بن عبد الرحمن، كذاب، وقال ابن حجر في المطالب العالية (٣٨٤٢): هذا حديث موضوع فيه كلام.", "حاشية: (٢) سقطت من (ف).", "حاشية: (٣) أزمها وأخطمها: أي أضع لها زماما وخطاما كي لا تخرج، وإن خرجت تكون مضبوطة محكمة كالدابة عليها الزمام والخطام.", "حاشية: (٤) حلية الأولياء ١/ ٢٦٥.", "حاشية: (٥) في الأصل و(ف): (أبو سفيان بن المغيرة)، وهو خطأ، فهو أبو سفيان المغيرة بن الحارث بن عبد المطلب الهاشمي ابن عم رسول الله ﷺ، توفي سنة (٢٠) هـ. السير ١/ ٢٠٢.", "حاشية: (٦) تحرفت في (ف) إلى: (ما نطقت). وقوله: (ما تنطفت) أي: ما تلطخت ولا تنجست ولا اتهمت بخطيئة.", "**بيان**", "**الرخصة في كتمان الذنوب وكراهة اطلاع الناس على المذنب، وكراهة ذمهم له**", "ربما ظن ظان أن كتمان الخطايا رياء، وليس كذلك، إنما المحظور أن يستر الإنسان الخطايا ليرى أنه ورع، وأنه خائف من الله، وهو ليس كذلك.", "فأما الصادق الذي لا يرائي فله ستر المعاصي، ويصح قصده في ذلك، واغتمامه باطلاع الناس عليه من أوجه:", "**الأول**: أن يفرح بستر الله تعالى عليه، وإذا افتضح اغتم لهتك الله ستره، وخاف أن يهتك ستره في القيامة، فهذا غم ينشأ من قوة الإيمان."]], "ic": "book"}, {"story": ["كتاب ذم الجاه والرياء (٣٦ من ٤١)، ص٨٧٩", ["**الثاني**: أنه قد علم أن الله تعالى يكره ظهور المعاصي، ويحب سترها، كما قال ﷺ: «من ارتكب شيئا من هذه القاذورات فليستتر بستر الله عز وجل»(١).", "فهذا وإن عصى بالذنب فلم يخل قلبه عن محبة ما أحبه الله، وهذا ينشأ من قوة الإيمان بكراهة الله ظهور المعاصي، وأثر الصدق فيه أن يكره ظهور الذنب من غيره أيضا، ويغتم به.", "الثالث: أن يكره ذم الناس له به، من حيث أن ذلك يغمه، ويشغل قلبه وعقله عن طاعة الله تعالى، فإن الطبع يتأثر بالذم، وبهذه العلة أيضا ينبغي أن يكره الحمد الذي يشغله عن الله تعالى، ويستغرق قلبه، ويصرفه عن الذكر، وهذا أيضا من قوة الإيمان، إذ صدق الرغبة في فراغ القلب لأجل الطاعة من الإيمان.", "حاشية: (١) أخرجه الطحاوي في شرح مشكل الآثار (٩١)، والحاكم ٤/ ٢٤٤ و٣٨٣، و البيهقي في السنن ٨/ ٣٣٠ عن ابن عمر رضي الله عنهما.", "فإن قيل: فهل يجوز للإنسان أن يحب حمد الناس له بالصلاح وحبهم إياه بسببه؟ وقد قال رجل للنبي ﷺ: دلني على عمل يحبني الله عليه، ويحبني الناس. فقال ﷺ: «ازهد في الدنيا يحبك الله، وانبذ إليهم هذا الحطام يحبوك»(١)؟", "فالجواب: إن من أحب ذلك ليعرف به حب الله له فهذا محمود(٢)؛ لأنه إذا أحبه حببه إلى عباده، ومن أحب ذلك على طاعة بعينها فقد طلب العوض عنها(٣).", "حاشية: (١) أخرجه ابن ماجه (٤١٠٢)، والعقيلي في الضعفاء ٢/ ١١، والطبراني في الكبير ٦/ ٥٩٧٢، وابن عدي في الكامل ٣/ ٤٥٨، والحاكم ٤/ ٣١٣، وأبو نعيم في الحلية ٧/ ١٣٦، وفي أخبار أصفهان ٢/ ٢٤٤ ـ ٢٤٥، والقضاعي في مسند الشهاب (٦٤٣)، والبيهقي في الشعب (١٠٥٢٢)، وابن الجوزي في العلل المتناهية (١٣٥٢) من طريق خالد ابن عمرو، عن الثوري، عن أبي حازم، عن سهل بن سعد الساعدي مرفوعا.", "حاشية: (٢) ورد هنا في هامش (ف) حاشية نصها: (فالأولى محمودة، والثانية مذمومة، إذ لم يقنع بثواب الله، بقي حالة ثالثة مباحة، أن تحب أن يحبوك بصفات محمودة سوى الطاعات، وذلك كحب المال، لأن ملك القلوب وسيلة إلى الأغراض كملك المال، فلا فرق).", "حاشية: (٣) جاء في (ف) بعد هذا زيادة، ولعلها من الناسخ، ونصها: (رواه ابن ماجه وغيره عن سهل ابن سعد الساعدي قال: أتى النبي ﷺ رجل فقال: يا رسول الله: دلني على عمل إذا أنا عملته أحبني الله وأحبني الناس. فقال ﷺ: (ازهد في الدنيا يحبك الله، وازهد فيما في أيدي الناس يحبوك). لفظ ابن ماجه. قال الترمذي حديث حسن.", "هكذا ورد في متن (ف): (الترمذي) وشطب الناسخ عليها، فالحديث ليس عند الترمذي، وورد في الهامش كلمة لعلها: (النووي) فقد أورده النووي في رياض الصالحين (٤٧٢) وحسنه.", "**بيان**", "**ترك الطاعات خوفا من الرياء والآفات**", "اعلم أن من الناس من يترك العمل خوفا من أن يكون مرائيا به، وذلك غلط، وموافقة للشيطان، إلا أنا نفصل فنقول:", "الطاعات تنقسم إلى:"]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "فإذن معنى الربوبية: التفرد بالوجود، وهو الكمال، وكل إنسان يحب بطبعه أن يكون منفردا بالكمال، فإذا عجزت النفس عن درك منتهى الكمال لم تسقط ____ للكمال، فهي محبة له، وملتذة به لذاته، لا لمعنى آخر وراء", "o": ["شهوتها", "البرمكي", "كذلك", "بإظهار"], "h": "راجع: ص٨٣٠"}, {"t": "fill", "d": 2, "q": "اعلم أن الكمال الحقيقي العلم والحرية، أما العلم فمعرفة الله سبحانه وتعالى، وأما الحرية ____ من أسر الشهوات تشبها بالملائكة، الذين لا تستفزهم شهوة، ولا يستهويهم غضب", "o": ["فالخلاص", "بالزلل", "للعاقل", "الانتساب"], "h": "راجع: ص٨٣٢"}, {"t": "fill", "d": 2, "q": "وأهل الدنيا يراؤون بهذه الخمس، إلا أن طلب الجاه وقصد الرياء بأعمال ليست من ____ الطاعات أهون من الرياء بالطاعات", "o": ["جملة", "فينمي", "عبادة", "البهم"], "h": "راجع: ص٨٤٧"}, {"t": "fill", "d": 2, "q": "[الحالة الثانية: أن يقصد بعمله الرياء ويقصد معه الأجر والثواب، وفي ذلك تفصيل ____ بيانه إن شاء الله", "o": ["سيأتي", "قرآنا", "خالط", "فكلمه"], "h": "راجع: ص٨٥٤"}, {"t": "fill", "d": 2, "q": "١ ـ أن يكون قد صدق فيما قال، وقصد النصح والشفقة، فينبغي أن تتقلد منته، ولا تغضب، فإن من أهدى إليك عيوبك فقد حذرك المهالك، ثم ____ بإزالة ما ذمك به", "o": ["اشتغل", "اليم", "مكان", "طهارة"], "h": "راجع: ص٨٤١"}, {"t": "fill", "d": 2, "q": "اعلم أن من الناس من يترك العمل خوفا من أن يكون مرائيا به، وذلك غلط، وموافقة ____، إلا أنا نفصل فنقول", "o": ["للشيطان", "افتحوا", "فمقتضى", "الفناء"], "h": "راجع: ص٨٨١"}]}, {"t": "كتاب ذم الجاه والرياء - القسم ٧ من ٧", "b": [{"story": ["كتاب ذم الجاه والرياء (٣٧ من ٤١)، ص٨٨١", ["١ ـ ما لا لذة في عينه، كالصلاة، والصوم، والحج، والغزو، فإنها مجاهدات، وإنما تصير لذيذة من حيث إنها توصل إلى حمد الناس، وحمد الناس لذيذ.", "٢ ـ وإلى ما هو لذيذ، كالخلافة، والقضاء، والولايات، (١-١)وإمامة الصلاة(١-١)، والتذكير، والتدريس، وإنفاق المال على الخلق، وغير ذلك مما تعظم الآفة فيه لتعلقه بالخلق، ولما فيه من اللذة.", "فأما القسم الأول: وهو الطاعات اللازمة للبدن، التي لا تتعلق بالغير، ولا لذة في عينها، كالصلاة، والصوم، فخطرات الرياء فيها ثلاث:", "إحداهن: ما يدخل قبل العمل، فيبعث على الابتداء لرؤية الناس، وليس معه باعث الدين، فهذا ينبغي أن يترك؛ لأنه معصية لا طاعة فيه؛ لأنه تشبث(٢) بصورة الطاعة إلى طلب المنزلة.", "الثانية: أن ينبعث لأجل الله، ولكن يعترض الرياء مع عقد العبادة أولها، فلا ينبغي أن يترك العمل؛ لأنه وجد باعثا دينيا، فليشرع في العمل، وليجاهد نفسه في دفع الرياء، وتحصيل الإخلاص بالمعالجة التي ذكرناها، من إلزام النفس كراهة الرياء، والإباء عن القبول.", "حاشية: (١-١) سقط من (ف).", "حاشية: (٢) تحرفت في الأصل إلى: (بسبب).", "الثالثة: أن يترك العمل خوفا من أن يقال: هو مراء، وذلك من مكائد الشيطان. قال إبراهيم النخعي: إذا أتاك الشيطان وأنت في صلاة، فقال: إنك ترائي. فزدها طولا.", "فإن قيل: فقد روي عن جماعة من السلف أنهم تركوا العبادة خوفا من الرياء، فنقل عن إبراهيم النخعي(١) أن إنسانا دخل عليه، فأطبق المصحف، وترك القراءة، وقال: لا يرى هذا أني أقرأ كل ساعة(٢). وكان بعضهم يأتيه البكاء فيصرفه إلى الضحك مخافة الشهرة.", "فالجواب: أنا قد روينا عنهم كثيرا من إظهارهم الطاعات، فيحمل هذا المضاد لذلك على أنهم أحسوا من نفوسهم بنوع تزين فقطعوا.", "وأما القسم الثاني: وهو ما يتعلق بالخلق، وتعظم فيه الآفات والأخطار، فأعظمها الخلافة، فإنها من أعظم العبادات، وفي الصحيحين: أن النبي ﷺ قال: «سبعة يظلهم الله في ظله...» فذكر منهم الإمام العادل(٣).", "إلا أن السلف ما زالوا يهربون(٤) من الإمارة لما فيها من الخطر، وذلك أنها توجب الجاه، وتحصل لذة الاستيلاء، ونفاذ الأمر، وهو أعظم ملاذ الدنيا، والأغلب على صاحبها موافقة هواه، ولذلك قال ﷺ لعبد الرحمن بن سمرة: يا عبد الرحمن، لا تسأل الإمارة(٥).", "فالأقوياء لا تضرهم الولايات(٦)، والضعفاء تؤذيهم، ولذلك تولاها أبو بكر", "حاشية: (١) سقطت من (ف).", "حاشية: (٢) حلية الأولياء ٤/ ٢٢٠.", "حاشية: (٣) أخرجه البخاري (٦٦٠)، ومسلم (١٠٣١) من حديث أبي هريرة.", "حاشية: (٤) في (ف): (يرهبون).", "حاشية: (٥) أخرجه البخاري (٦٦٢٢)، ومسلم (١٦٥٢).", "حاشية: (٦) في (ف): (الولاية).", "الصديق رضي الله عنه، وقال لرجل(١): لا تأمرن على اثنين(٢). والقضاء إمارة، فهو كالخلافة، ومن لم يتمكن من القضاء بالحق ثم كره العزل فقد كان خادما لهواه."]], "ic": "book"}, {"story": ["كتاب ذم الجاه والرياء (٣٨ من ٤١)، ص٨٨٣", ["وأما الفتوى والتدريس والوعظ ورواية الحديث فآفته عظيمة كآفة الولايات، وقد كان الخائفون من السلف يتدافعون الفتوى، والواعظ يجد لقبول كلامه وصياح الناس (٣-٣)في مجلسه(٣-٣) لذة شديدة، فلا يؤمن لذلك أن يميل إلى زخرف من الكلام باطل، لينال به مقصوده من تحريك القلوب، ليعظم به منزلته عندهم، وعلامة هذا أنه يفرح إذا سمع شيئا يصلح للمنبر، ولو كان محقا لفرح به لأجل صلاحه لطريق السعادة.", "فإن قيل: فهذا القول يوجب تعطيل القضاء والفتوى والتذكير.", "قلنا: ليس كذلك، فإن حب الرئاسة لا يترك ذلك يندرس، على أنا لا نذم العلوم، إنما نذم سوء القصد بها، وعلامة الصحيح القصد أنه لو ظهر أعلم منه لم يحسده، لكن لا بأس بالغبطة، فإذا رأيت العلماء يتحاسدون ويتغايرون، فمرادهم الدنيا لا الآخرة.", "حاشية: (١) هو رافع بن عمرو الطائي أبو الحسن السنبسي، صحابي من العارفين بمفاوز الصحراء، توفي آخر خلافة عمر. الإصابة ٢/ ٤٤٠.", "حاشية: (٢) الأثر أخرجه ابن حجر في الإصابة ٢/ ٤٤٠، وصح مرفوعا من حديث أبي ذر أن رسول الله ﷺ قال له: (يا أبا ذر، إني أراك ضعيفا، وإني أحب لك ما أحب لنفسي، لا تأمرن على اثنين، ولا تولين مال يتيم). أخرجه أحمد (٢١٥٦٣)، ومسلم (١٨٢٦)، وأبو داود (٢٨٦٨)، والنسائي في المجتبى ٦/ ٢٥٥، وفي الكبرى (٦٤٦١) وابن حبان (٥٥٦٤).", "حاشية: (٣-٣) سقط من (ف).", "**بيان**", "**ما يصح من نشاط العبد للعبادة بسبب رؤية الخلق وما لا يصح**", "قد يبيت الرجل مع المتهجدين، فيصلون أكثر الليل، وعادته قيام ساعة قريبة، فيوافقهم، أو يصومون فيصوم، ولولاهم ما انبعث هذا النشاط، فربما ظن ظان أن هذا رياء، وليس كذلك على الإطلاق، بل فيه تفصيل؛ وهو أن كل مؤمن يرغب في عبادة الله تعالى، ولكن تعوقه العوائق، وتستهويه الغفلة، فربما كانت مشاهدة الغير سببا في زوال الغفلة واندفاع العوائق، فإن الإنسان إذا كان في منزله تمكن من النوم على فراش وثير، وتمتع بزوجته(١)، فإذا بات في مكان غريب اندفعت هذه الشواغل، وحصلت له أسباب تبعث على الخير، منها مشاهدة العابدين، وهي موجبة لتحرك داعية الدين، وربما صعب عليه النوم لتغير مكانه، فاغتنم زوال النوم، وقد يعسر عليه الصوم في منزله لكثرة المطاعم الشهية في منزله، فإذا لم يجدها في غيره لم يشق عليه الصوم، وفي مثل هذه الأحوال ينتدب الشيطان للصد عن الطاعة، ويقول: إن عملت كنت مرائيا، لأنها ليست بعادتك. فلا ينبغي له أن يلتفت إليه.", "وكذا إذا قال له: تعبد لكيلا يرموك بالكسل.", "وإنما ينبغي أن ينظر إلى قصده الباطن، ولا يلتفت إلى وساوس الشيطان، ويبلو(٢) أمره، بأن يماثل القوم في مكان يراهم فيه وهم لا يرونه، فإن رأى نفسه تسخو بالتعبد فذاك لله، وإن لم تسخ كان سخاؤها عندهم رياء، وكذلك قد يوجب"]], "ic": "book"}, {"story": ["كتاب ذم الجاه والرياء (٣٩ من ٤١)، ص٨٨٤", ["حاشية: (١) ورد في هامش (ف) ما نصه: (مختصر العين، حاشية: الوثير الوطيء، وقد وثر وثارة).", "حاشية: (٢) يبلو: يختبر ويمتحن.", "بكاء الناس عند التذكرة بكاء من لولا بكاؤهم ما بكى، واختبار هذا بالعلامة التي ذكرناها، وهي أنه يمثل نفسه في مكان لا يرونه، فإن كان البكاء يهيج حينئذ لأجل بكائهم فهو لله، وإن لم يهج إلا عندهم فهو رياء، وقس على هذا ما لم نذكره من الأنين والقلق.", "وقد يقع في الأنين الذي يوجبه الخوف نوع من الرياء، وهو تطويل مدته، وفي الدمعة حفظها على الخد حتى ترى، وقد يصعق صعقة صحيحة، ثم تزول سريعا، فيستديم إظهار الضعف والأنين، ويتكئ(١) على غيره، يرى أنه يضعف عن القيام، ويتمايل في المشي، ويقرب الخطا، فهذه كلها مكائد من الشيطان، فإذا خطرت فعلاجها أن يتذكر أن الناس لو عرفوا نفاقه في الباطن واطلعوا على ضميره لمقتوه، وأن الله مطلع على ضميره، وهو له أشد مقتا.", "وقد كان من دعاء علي بن الحسين رضي الله عنهما: اللهم إني أعوذ بك من أن تحسن في لامعة العيون علانيتي، وتقبح لك فيما أخلو به سريرتي(٢).", "وهذه جمل آفات الرياء، فكن بحاثا عنها، وتفقد نيتك، فإن الرياء أخفى من دبيب النمل، حتى إنه ربما خفي رياء النفس على النفس.", "حاشية: (١) في النسخ: (يبكي) وهو تصحيف، والمثبت من الإحياء.", "حاشية: (٢) حلية الأولياء ٣/ ١٣٤.", "**بيان**", "**ما ينبغي للمريد أن يلزم نفسه قبل العمل وبعده وفيه**", "أولى ما ألزم المريد قلبه القناعة بعلم الله في جميع طاعاته، وإنما يقنع بذلك من خاف الله ورجاه، فأما من خاف غيره وارتجاه فإنه يشتهي اطلاعه على محاسن أحواله، فليحذر من يجد ذلك من مقت الله، وليراقب نفسه عند الطاعات الشاقة، فإن النفس حينئذ تكاد تغلي حرصا على الإفشاء، وتقول: مثل هذا العلم العظيم والتعبد الكثير لو عرفه الناس لسجدوا لك، فكيف تخفيه، فيجهل محلك؟!", "فليجبها، وليقل: وكيف أبيع هذا العمل بحمد الخلق، وهم عاجزون عن نفعي وضري؟!", "ولا ينبغي أن يؤيس نفسه من الإخلاص، بأن يقول: إنما يقدر على الإخلاص الأقوياء، وأنا من المخلطين. فيترك لذلك المجاهدة في تحصيل الإخلاص، لأن المخلط إلى ذلك أحوج من المتقي؛ لأن المتقي إن فسدت نوافله بقيت فرائضه كاملة، والمخلط لا تخلو فرائضه عن نقصان وحاجة إلى جبران بالنوافل، وقد روى أبو هريرة عن النبي ﷺ أنه قال: «إن أول ما يحاسب به العبد يوم القيامة من عمله صلاته، فإن صلحت فقد أفلح وأنجح، وإن فسدت فقد خاب وخسر، فإن انتقص من فريضته شيئا قال الرب تبارك وتعالى: انظروا، هل لعبدي من تطوع؟ فيكمل به ما انتقص من الفريضة، ثم يكون سائر عمله على ذلك»(١)."]], "ic": "book"}, {"story": ["كتاب ذم الجاه والرياء (٤٠ من ٤١)، ص٨٨٦", ["حاشية: (١) أخرجه أحمد (٧٩٠٢) و(٩٤٩٤)، والبخاري في التاريخ الكبير ٢/ ٣٣ ـ ٣٥، وأبو داود (٨٦٤) و (٨٦٥)، والترمذي (٤١٣)، والنسائي في المجتبى ١/ ٢٣٢، وفي الكبرى (٣٢٢)، وابن ماجه (١٤٢٥) و(١٤٢٦)، والطحاوي في شرح مشكل الآثار (٢٥٥٣)، والدارقطني في العلل ٨/ ٢٤٨.", "وينبغي للإنسان الخوف من الرياء الخفي أن يدخل عليه ولا يعلم، وأن يكتم عمله بعد الفراغ منه، وينبغي للمتقرب إلى الله تعالى بتعليم العلم أن لا يأخذ على ذلك أجرا، ليصح قصده ـ كما ذكرناه في كتاب العلم(١) من أخلاق العلماء ـ في ذلك.", "وينبغي للزاهد المعتزل عن الناس أن لا يخطر بقلبه معرفة الناس زهده واستعظامهم محله، فإن ذلك يغرس الرياء في صدره، فتتيسر عليه العبادات في خلوته، وإنما يسهلها معرفته بأن الناس يعلمون اعتزاله.", "قال إبراهيم بن أدهم: تعلمت المعرفة من راهب يقال له: سمعان، دخلت عليه صومعته، فقلت له: منذ كم أنت في صومعتك هذه؟ قال: منذ سبعين سنة، قلت: ما طعامك؟ قال: يا حنيفي، وما دعاك إلى هذا؟ قلت: أحببت أن أعلم. قال: في كل ليلة حمصة. قلت: فما الذي يهيج من قلبك حتى تكفيك هذه الحمصة؟ قال: ترى الدير بحذائك؟ قلت: نعم. قال: إنهم يأتوني في كل سنة يوما واحدا، فيزينون صومعتي، ويطوفون حولها، ويعظموني بذلك، فكلما تثاقلت نفسي عن العبادة ذكرتها عز تلك الساعة، فأنا أحتمل جهد سنة لعز ساعة، فاحتمل يا حنيفي جهد ساعة لعز الأبد. فوقر في قلبي المعرفة فقال: أزيدك؟ فقلت: نعم. قال: انزل عن الصومعة. فنزلت، فأدلى إلي ركوة(٢) فيها عشرون حمصة، فقال لي: ادخل الدير، فقد رأوا ما أدليت إليك. فلما دخلت الدير اجتمعت النصارى، فقالوا: يا حنيفي، ما الذي أدلى إليك الشيخ؟ قلت: من قوته. قالوا: وما تصنع به؟ نحن أحق به. قالوا: ساوم. قلت: عشرين دينارا. فأعطوني عشرين دينارا، فرجعت إلى الشيخ، فقال: (٣-٣)يا حنيفي، ما الذي صنعت؟ قلت: بعته منهم. قال: بكم؟ قلت: بعشرين دينارا(٣-٣). قال: أخطأت، لو ساومتهم عشرين ألفا لأعطوك، هذا عز من لا يعبده، فانظر كيف يكون عز من يعبده؟ يا حنيفي، أقبل على ربك، (٤-٤)ودع الذهاب والجيئة(٤-٤).", "حاشية: (١) تحرفت في (ف) إلى: (العمل).", "حاشية: (٢) الركوة: إناء صغير من الجلد يشرب فيه الماء.", "حاشية: (٣-٣) زيادة من الإحياء والحلية.", "حاشية: (٤-٤) زيادة من الإحياء والحلية. والقصة أوردها أبو نعيم في الحلية ٨/ ٢٩."]], "ic": "book"}, {"story": ["كتاب ذم الجاه والرياء (٤١ من ٤١)، ص٨٨٨", ["فقد بان بهذا أن استشعار النفوس عز العظمة في القلوب يكون باعثا في الخلوة، وقد لا يشعر الإنسان من نفسه بهذه الآفة، وعلامة سلامته منها أن يكون الخلق عنده والبهائم بمثابة(١)، ويكون عمله عمل من ليس على الأرض غيره، فإذا خطرت خطرات ضعيفة من الالتفات إلى الخلق سهل ردها، ومن المعلوم أن زيادة الإقبال على الغني لا على الفقير محض حب للدنيا، إلا أن يكون في الغني معنى يزيد به على الفقير، فإن وجد ذلك المعنى في الفقير فالفقير أحق بالإكرام، ولما كان مقصود سفيان الثوري صحيحا كان الأغنياء أذل الناس في مجلسه(٢).", "**آخر كتاب ذم الجاه والرياء.**", "حاشية: (١) أي: بمثابة واحدة.", "حاشية: (٢) في (ف): (الدنيا)."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "ويقرب من هذا خفض الصوت، وإغارة العينين، وذبول الشفتين، ليستدل بذلك على أنه مواظب على الصوم، وأن توقير الشرع هو الذي خفض من صوته، وشدة الجوع هي التي وهنت قواه، ولهذا قال ____ عليه السلام", "o": ["عيسى", "يتصاعد", "الغائب", "الجيد"], "h": "راجع: ص٨٤٧"}, {"t": "fill", "d": 2, "q": "الثالث: قال بعض أهل العلم: يعجبه إذا اطلع عليه، رجاء أن يعمل ____، فيكون له مثل أجر من", "o": ["بعمله", "وتركت", "نقلها", "محبوبا"], "h": "راجع: ص٨٦٦"}, {"t": "fill", "d": 2, "q": "فهذه درجات الرياء ومراتب أصناف المرائين، وجميعهم تحت مقت الله وغضبه، وهو من أشد المهلكات، وقد يزل في دقائقه فحول العلماء، فضلا عن العباد الجهلة بآفات النفوس، ____ القلوب", "o": ["وغوائل", "فيعرف", "تعذر", "الصفات"], "h": "راجع: ص٨٦١"}, {"t": "fill", "d": 2, "q": "أخبرنا الكروخي، قال: أخبرنا أبو عامر الأزدي وأبو بكر الغورجي، قالا: أنبأنا الجراحي، قال: حدثنا المحبوبي، قال: حدثنا ____، قال: حدثنا يوسف ابن سلمان، قال: حدثنا حاتم بن إسماعيل، عن محمد بن عجلان،", "o": ["الترمذي", "هدايته", "لظالم", "فأفسدت"], "h": "راجع: ص٨٢٠"}, {"t": "fill", "d": 2, "q": "وأما أهل الدنيا، فمراءاتهم بالتبختر والاختيال، وتحريك اليدين، وتقريب الخطا، والأخذ بأطراف الذيل، ____ العطفين، ليدلوا بذلك على الحشمة", "o": ["وإدارة", "نازع", "الركوة", "يداوي"], "h": "راجع: ص٨٥٠"}, {"t": "fill", "d": 2, "q": "وذلك لا يخلو إما أن يكون مجردا دون إرادة الله والثواب، وإما أن يكون مع إرادة الله والثواب، ثم لا يخلو أن تكون إرادة الثواب أقوى ____، أو أضعف، أو مساوية لإرادة العبادة، فتكون الدرجات أربعا", "o": ["وأغلب", "وتحرق", "الأمم", "المحرقة"], "h": "راجع: ص٨٥٥"}]}], "sum": [["الصفحات", "ص٨١٧ - ص٨٨٨"]], "_nq": 40}, {"id": "l11", "title": "كتاب ذم الكبر والعجب", "group": "كتاب ذم الكبر والعجب", "map": {"center": "كتاب\nذم الكبر", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "كتاب ذم الكبر والعجب - القسم ١ من ٦", "b": [{"pic": ["books", "book"], "cap": "ص٨٨٩ - ص٩٤٢"}, {"story": ["كتاب ذم الكبر والعجب (١ من ٣٣)، ص٨٨٩", ["الحمد لله المتعالي في عزته عن شبيه، المتقدس في عظمته عن تشبيه، الكبرياء رداؤه ومنازعه سفيه، ذم المتعظم ـ وقد خلق ذليلا ـ بما ليس فيه ﴿إِن فِى صُدُورِهِمْ إِلَّا كِبْرٌ مَّا هُم بِبَـٰلِغِيهِ﴾(١) [غافر: ٥٦] أحمده على إنعام لا أحصيه، وأشهد أنه لا مثل يوازيه، ولا ند يناويه، وأصلي على رسوله محمد وآله وتابعيه، وأسلم تسليما كثيرا.", "أما بعد؛ فقد روى مسلم في أفراده من حديث الأغر عن أبي هريرة وأبي سعيد أنهما قالا: قال رسول الله ﷺ: «يقول الله عز وجل: العز إزاري، والكبرياء ردائي، فمن نازعني شيئا منهما عذبته»(٢).", "قال أبو سليمان الخطابي: ومعنى هذا الكلام أن الكبرياء والعظمة صفتان لله اختص بهما لا يشركه فيهما أحد، ولا ينبغي لمخلوق أن يتعاطاهما؛ لأن صفة المخلوق التواضع والتذلل، وضرب الرداء والإزار مثلا، يقول ـ والله أعلم ـ: كما لا يشرك الإنسان في ردائه وإزاره أحد، فكذلك لا يشركني في الكبرياء والعظمة مخلوق.", "وقد روي عن النبي ﷺ أنه قال: «ثلاث مهلكات: شح مطاع، وهوى متبع، وإعجاب المرء بنفسه».", "حاشية: (١) في الأصل: (قلوبهم)، وهو خطأ، والمثبت نص الآية.", "حاشية: (٢) أخرجه مسلم (٢٦٢٠).", "فالكبر والعجب داءان مهلكان والمتكبر والمعجب سقيمان بمرضهما، ممقوتان عند خالقهما.", "ونحن نقسم هذا الكتاب شطرين؛ شطر في الكبر، وشطر في العجب، نستقصي فيهما بيانهما والله الموفق.", "**الشطر الأول من الكتاب**", "وفيه بيان ذم الكبر، وبيان ذم الاختيال، وبيان فضيلة التواضع، وبيان حقيقة الكبر وآفته، وبيان من يتكبر عليه، ودرجات الكبر، وبيان ما به التكبر، وبيان البواعث على التكبر، وبيان أخلاق المتواضعين، وما يظهر فيه الكبر، وبيان امتحان النفس في خلق الكبر، وبيان المحمود من خلق التواضع والمذموم منه.", "**بيان**", "**ذم الكبر**", "قد ذم الله تعالى الكبر في مواضع من كتابه، وذم كل جبار متكبر، فقال عز وجل: ﴿سَأَصْرِفُ عَنْ ءَايَـٰتِىَ ٱلَّذِينَ يَتَكَبَّرُونَ فِى ٱلْأَرْضِ بِغَيْرِ ٱلْحَقِّ﴾ [الأعراف: ١٤٦]، وقال تعالى: ﴿وَٱسْتَفْتَحُوا۟ وَخَابَ كُلُّ جَبَّارٍ عَنِيدٍ﴾ [إبراهيم: ١٥]، وقال تعالى: ﴿إِنَّهُۥ لَا يُحِبُّ ٱلْمُسْتَكْبِرِينَ﴾ [النحل: ٢٣]، وقال: ﴿لَقَدِ ٱسْتَكْبَرُوا۟ فِىٓ أَنفُسِهِمْ وَعَتَوْا۟ عُتُوًّا كَبِيرًا﴾ [الفرقان: ٢١]، وقال: ﴿إِنَّ ٱلَّذِينَ يَسْتَكْبِرُونَ عَنْ عِبَادَتِى سَيَدْخُلُونَ جَهَنَّمَ دَاخِرِينَ﴾ [غافر: ٦٠]، وقال: ﴿كَذَٰلِكَ يَطْبَعُ ٱللَّهُ عَلَىٰ كُلِّ قَلْبِ مُتَكَبِّرٍ جَبَّارٍ﴾ [غافر: ٣٥]."]], "ic": "book"}, {"story": ["كتاب ذم الكبر والعجب (٢ من ٣٣)، ص٨٩٢", ["أنبأنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أحمد بن جعفر قال: أخبرنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا أبو الجواب، قال: حدثنا عمار بن رزيق عن عطاء بن السائب عن أبي عبد الرحمن عن عبد الله بن مسعود عن النبي ﷺ أنه كان يتعوذ من الشيطان من همزه ونفثه ونفخه. قال: وهمزه: الموتة، ونفثه: الشعر، ونفخه: الكبرياء(١).", "أخبرنا محمد بن عمر الأرموي وأحمد بن ظفر المغازلي قالا: أخبرنا عبد الصمد بن المأمون قال: أخبرنا علي بن عمر الدارقطني قال: حدثنا أبو محمد بن صاعد قال: حدثنا أحمد بن منيع قال: حدثنا مروان بن شجاع قال: حدثنا إبراهيم ابن أبي عبلة عن أبي سلمة قال: التقى عبد الله بن عمرو وابن عمر على المروة، فنزلا فتحدثنا، ثم مضى عبد الله بن عمرو وقعد ابن عمر يبكي، فقيل له: ما يبكيك؟ فقال: هذا ـ يعني عبد الله بن عمرو ـ زعم أنه سمع رسول الله ﷺ يقول:", "حاشية: (١) أخرجه أحمد (٣٨٢٨)، وأبو يعلى (٥٣٨٠) والبيهقي في السنن ٢/ ٣٦.", "«من كان في قلبه مثقال حبة من خردل من كبر كبه الله عز وجل في النار على وجهه».", "قال الدارقطني: وأنبأنا محمد بن القاسم بن زكريا قال: أخبرنا أبو كريب قال: حدثنا أبو معاوية عن عمر بن راشد عن إياس بن سلمة عن أبيه قال: قال رسول الله ﷺ: «لا يزال الرجل يذهب بنفسه حتى يكتب من الجبارين حتى يصيبه ما أصابهم».", "وفي أفراد مسلم من حديث ابن مسعود عن النبي ﷺ قال: «لا يدخل الجنة من كان في قلبه مثقال ذرة من كبر».", "وفي الصحيحين من حديث أبي هريرة عن النبي ﷺ قال: «قالت النار: أوثرت بالمتكبرين والمتجبرين».", "وفي الصحيحين من حديث حارثة بن وهب عن النبي ﷺ أنه قال: «ألا أخبركم بأهل النار؛ كل جواظ جعظري(١) مستكبر»(٢).", "وروى أبو هريرة عن النبي ﷺ أنه قال: «يخرج عنق من النار يوم القيامة له عينان يبصر بهما، وأذنان يسمع بهما، ولسان ينطق به، فيقول: إني وكلت بثلاثة: بكل جبار عنيد، وبكل من ادعى مع الله إلها آخر، وبالمصورين»(٣).", "أخبرنا الكروخي قال: أخبرنا أبو عامر الأزدي وأبو بكر الغورجي قالا: حدثنا الجراحي قال: حدثنا المحبوبي قال: حدثنا الترمذي قال: حدثنا محمد بن يحيى الأزدي قال: حدثنا عبد الصمد بن عبد الوارث، قال: حدثنا هاشم بن سعيد", "حاشية: (١) ورد هنا بحاشية (ف) ما نصه: (الجواظ: الجموع المنوع، وقيل: الكثير اللحم المختال في مشيته، وقيل: الذي لا يستقيم على أمر يصانع هنا وهنا، وقيل: الفاجر، والجعظري فسر في الحديث بأنه الغليظ الفظ، وقيل: هو الذي يتمدح وينتفخ بما ليس عنده وفيه بطر).", "حاشية: (٢) أخرجه البخاري (٤٥٦٩)، ومسلم (٢٨٤٦).", "حاشية: (٣) أخرجه بهذا اللفظ أحمد (١٨٧٢٨)، وأخرجه البخاري (٤٩١٨) و(٦٠٧١) و(٦٦٥٧)، ومسلم (٢٨٥٣)، وأحمد (١٨٧٣٠) بلفظ: (كل عتل جواظ مستكبر)."]], "ic": "book"}, {"story": ["كتاب ذم الكبر والعجب (٣ من ٣٣)، ص٨٩٤", ["الكوفي قال: حدثني زيد الخثعمي عن أسماء بنت عميس قالت: سمعت رسول الله ﷺ يقول: «بئس العبد عبد تخيل واختال ونسي الكبير المتعال، وبئس العبد عبد تجبر واعتدى ونسي الجبار الأعلى، بئس العبد عبد سها ولها ونسي المقابر والبلى، بئس العبد عبد عتا وطغى ونسي المبتدا والمنتهى، بئس العبد عبد يختل الدنيا بالدين، وبئس العبد عبد يختل الدين بالشبهات، بئس العبد عبد طمع يقوده، بئس العبد عبد هوى يضله، بئس العبد عبد رغب يذله».", "وروى أبو هريرة عن النبي ﷺ أنه قال: «يحشر الجبارون المتكبرون يوم القيامة في صور الذر تطؤهم الناس لهوانهم على الله عز وجل».", "وقال محمد بن واسع: دخلت على بلال بن أبي بردة فقلت له: إن أباك حدثني عن أبيه عن النبي ﷺ أنه قال: «إن في جهنم واديا يقال له: هبهب، حقا على الله أن يسكنه كل جبار، فإياك أن تكون ممن يسكنه».", "أنبأنا محمد بن ناصر قال: أخبرنا أحمد بن جعفر قال: أخبرنا أبو علي التميمي قال: أخبرنا أبو بكر بن مالك قال: أخبرنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا إبراهيم بن إسحاق قال: حدثنا ابن المبارك عن معمر عن يحيى بن المختار عن الحسن قال: تراهم يهدرون عنده هدير الفحالة: أنت والله، أنت والله. وتراه مقنعا ساكتا، يحسب حميقا(١) أنه كما يقال له. قال: وترى أحدهم يتحرك في مشيته يسحب عظامه عظما عظما لا يمشي طبيعته.", "وقال سفيان بن عيينة: من كانت معصيته في شهوة فارج له التوبة، فإن آدم عليه السلام عصى مشتهيا فغفر له، فإذا كانت معصيته في كبر فاخش على صاحبه اللعنة، فإن إبليس عصى متكبرا فلعن.", "حاشية: (١) في (ف): (حمق). وحميق: تصغير أحمق.", "**بيان**", "**ذم الاختيال وإظهار آثار الكبر في المشي وجر الثياب**", "قال الله عز وجل: ﴿ثُمَّ ذَهَبَ إِلَىٰٓ أَهْلِهِۦ يَتَمَطَّىٰٓ﴾ [القيامة: ٣٣]، قال مجاهد: يتبختر. قال الفراء: المطا: هو الظهر، فهو يلوي ظهره تبخترا(١).", "أخبرنا عبد الأول بن عيسى قال: أخبرنا الداودي قال: أخبرنا ابن أعين السرخسي قال: أخبرنا الفربري قال: أخبرنا البخاري قال: حدثنا أحمد بن يونس قال: حدثنا زهير قال: حدثنا موسى بن عقبة عن سالم عن أبيه عن النبي ﷺ أنه قال: «من جر ثوبه خيلاء لم ينظر الله إليه يوم القيامة» قال أبو بكر: يا رسول الله، إن أحد شقي إزاري ليسترخي، إلا أني أتعاهد ذلك منه. فقال رسول الله ﷺ: «لست ممن يصنعه خيلاء». قال البخاري: وحدثنا عبد الله بن يوسف قال: أخبرنا مالك عن أبي الزناد عن الأعرج عن أبي هريرة أن رسول الله ﷺ قال: «لا ينظر الله يوم القيامة إلى من جر إزاره بطرا»."]], "ic": "book"}, {"story": ["كتاب ذم الكبر والعجب (٤ من ٣٣)، ص٨٩٥", ["قال البخاري: حدثنا آدم قال: حدثنا شعبة قال: حدثنا محمد بن زياد عن أبي هريرة عن النبي ﷺ قال: «بينما رجل يمشي في حلة تعجبه نفسه، مرجل جمته(٢)، خسف الله به، فهو يتجلجل(٣) إلى يوم القيامة». هذه الأحاديث الثلاثة مخرجة في الصحيحين.", "حاشية: (١) في (ف): (كبرا).", "حاشية: (٢) الجمة: ما ترامى من شعر الرأس على المنكبين.", "حاشية: (٣) ورد هنا في هامش (ف) حاشية نصها: (بجيمين للكافة، ورواه بعضهم بخاءين معجمتين والأول أصح وأعرف، والتجلجل: التنوخ في الأرض مع حركة واضطراب قال الخليل: قال الأصمعي: هو الذهاب بالشيء والمجيء به، وأصله التردد، ومنه: تجلجل في كلامه وتلجلج، إذا تردد. وأما يتخلخل فبعيد هاهنا إلا أن يكون من قولهم: تخلخلت العظم؛ أي: أخذت ما عليه من لحم، أو من التخلل والتداخل خلال الأرض، وأظهر التضعيف. قال القاضي: ورويناه في غير البخاري ومسلم: يتحلحل، بحاءين مهملتين).", "أخبرنا هبة الله بن محمد قال: أخبرنا أبو علي التميمي قال: أخبرنا أبو بكر بن جعفر قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا أبو النضر. قال: حدثنا جرير عن عبد الرحمن بن ميسرة عن جبير بن نفير عن بسر بن جحاش القرشي أن النبي ﷺ بزق يوما في كفه، فوضع عليها إصبعه ثم قال: (١-١)«قال الله»(١-١): يا ابن آدم أنى تعجزني وقد خلقتك من مثل هذه، حتى إذا سويتك وعدلتك مشيت بين بردين وللأرض منك وئيد، فجمعت ومنعت، حتى إذا بلغت التراقي قلت: أتصدق. وأنى أوان الصدقة؟!(٢)", "أخبرنا هبة الله بن أحمد الجريري قال: أخبرنا أبو طالب العشاري قال: حدثنا ابن سمعون قال: حدثنا علي بن أحمد بن الهيثم قال: حدثنا عيسى بن موسى قال: حدثنا يحيى بن أبي بكير قال: حدثنا الربيع بن بدر عن هارون بن رئاب عن مجاهد عن أبي هريرة قال: قال رسول الله ﷺ: «ريح الجنة توجد من مسيرة عام، لا يجد ريحها مختال، ولا منان بعمله، ولا مدمن خمر».", "وروى عروة عن عائشة قالت: لبست مرة درعا لي جديدا، فجعلت أنظر إليه وأعجب به، فقال أبو بكر: ما تنظرين؟ إن الله ليس بناظر إليك؟ قلت: ومم ذاك؟ قال: أما علمت أن العبد إذا دخله العجب بزينة الدنيا مقته ربه حتى يفارق تلك الزينة؟ قالت: فنزعته فتصدقت به. فقال أبو بكر: عسى ذاك أن يكفر عنك.", "وقال يزيد بن ميسرة: كانت أحبار بني إسرائيل ـ الصغير منهم والكبير ـ لا يمشون إلا بالعصي مخافة أن يختال الماشي في مشيته.", "وقال أبو بكر الهذلي: بينما نحن مع الحسن، إذ مر عليه ابن الأهتم، يريد المقصورة، وعليه جباب خز قد نضد بعضها على بعض على ساقه وهو يمشي يتبختر، فنظر إليه الحسن فقال: أف أف، شامخ بأنفه، ثاني عطفه، مصعر خده", "حاشية: (١-١) سقط من الأصل."]], "ic": "book"}, {"story": ["كتاب ذم الكبر والعجب (٥ من ٣٣)، ص٨٩٦", ["حاشية: (٢) أخرجه أحمد (١٧٨٤٢) ـ (١٧٨٤٥)، والتراقي: العظام المكتنفة لنقرة النحر عن يمين وشمال، وواحدتها: ترقوة. ويكنى ببلوغ النفس التراقي عن الإشفاء على الموت واقترابه.", "ينظر في عطفيه، أي حميق أنت تنظر في عطفيك في نعم غير مشكورة ولا مذكورة، غير مأخوذ بأمر الله فيها، ولا مؤدى حق الله منها، والله أن يمشي أحدهم طبيعته أو يتخلج إلا تخلج المجنون، في كل عضو من أعضائه لله نعمة، وللشيطان به لعبة. فسمع ابن الأهتم فرجع يعتذر إليه، فقال: لا تعتذر إلي، وتب إلى ربك، أما سمعت قول الله تعالى: ﴿وَلَا تَمْشِ فِى ٱلْأَرْضِ مَرَحًا إِنَّكَ لَن تَخْرِقَ ٱلْأَرْضَ وَلَن تَبْلُغَ ٱلْجِبَالَ طُولًا﴾ [الإسراء: ٣٧].", "ومر بالحسن شاب عليه بزة حسنة، فدعاه فقال: ابن آدم معجب بشبابه، معجب بجماله، كأن القبر قد وارى بدنك، وكأنك قد لاقيت عملك، ويحك! داو قلبك، فإن حاجة الله إلى العباد صلاح قلوبهم.", "وروي أن عمر بن عبد العزيز حج قبل أن يستخلف، فنظر إليه طاووس وهو يختال في مشيته، فغمز جنبه بإصبعه، ثم قال: ليست هذه مشية من في بطنه خرء. فقال عمر كالمعتذر: يا عم، لقد ضرب كل عضو مني على هذه المشية حتى تعلمتها.", "أنبأنا أحمد بن أحمد المتوكلي قال: أخبرنا أبو بكر بن ثابت قال: أخبرنا علي بن المظفر الأصبهاني(١) قال: حدثنا أحمد بن محمد الشطوي قال: حدثنا حسين بن جعفر بن سليمان الضبعي قال: سمعت أبي يقول: مر والي البصرة بمالك بن دينار يرفل، فصاح به مالك: أقل من مشيتك هذه. فهم خدمه به فقال: دعوه، ما أراك تعرفني. فقال له مالك: ومن أعرف بك مني؟! أما أولك فنطفة مذرة، وأما آخرك فجيفة قذرة، ثم أنت بين ذلك تحمل العذرة. فنكس الوالي رأسه ومشى.", "حاشية: (١) ليست في (ف).", "**بيان**", "**فضيلة التواضع**", "أخبرنا إسماعيل بن أحمد السمرقندي قال: أخبرنا محمد بن هبة الله الطبري قال: أخبرنا علي بن محمد بن بشران قال: أخبرنا الحسن بن صفوان قال: حدثنا عبد الله قال: حدثني أبي قال: حدثنا يحيى بن أيوب قال: حدثنا إسماعيل بن جعفر قال: أخبرني العلاء بن عبد الرحمن عن أبيه عن أبي هريرة أن رسول الله ﷺ قال: «ما تواضع أحد لله عز وجل إلا رفعه الله عز وجل». انفرد بإخراجه مسلم.", "وروى أبو أمامة عن النبي ﷺ أنه قال: «ما من أحد إلا ومعه ملكان، وعليه حكمة(١) يمسكانها، فإن هو رفع رأسه جبذاها ثم قالا: اللهم ضعه، وإن وضع نفسه قالا: اللهم ارفعه».", "وروى ركب المصري عن النبي ﷺ أنه قال: «طوبى لمن تواضع في غير منقصة».", "وقال عليه الصلاة والسلام: «خيرني ربي بين أن أكون عبدا رسولا، أو ملكا نبيا، وكان صفيي من الملائكة جبريل، فرفعت رأسي، فقال: تواضع لربك. فقلت: عبدا رسولا»."]], "ic": "book"}, {"story": ["كتاب ذم الكبر والعجب (٦ من ٣٣)، ص٨٩٨", ["وقال عمر بن الخطاب: إن العبد إذا تواضع لله رفع الله حكمته وقال: انتعش(٢) رفعك الله. وإذا تكبر وعدا طوره وهصه(٣) الله إلى الأرض وقال: اخسأ خسأك الله. فهو في نفسه كبير، وفي أعين الناس حقير حتى إنه لأحقر عندهم من الخنزير.", "حاشية: (١) الحكمة محركة: نحو لجام الدابة، سميت بذلك لأنها تحكمها وتذللها لراكبها.", "حاشية: (٢) انتعش: أي ارتفع.", "حاشية: (٣) وهصه: رماه رميا عنيفا.", "وقال جرير: انتهيت مرة إلى شجرة تحتها رجل نائم قد استظل بنطع(١) له وقد جاوزت الشمس النطع فسويته عليه، ثم إنه استيقظ، فإذا هو سلمان الفارسي، فذكرت له ما صنعت، فقال: يا جرير، تواضع لله في الدنيا، فإنه من تواضع لله في الدنيا رفعه الله يوم القيامة.", "وقالت عائشة: إنكم لتغفلون عن أفضل العبادة؛ التواضع.", "وفيما أوحى الله عز وجل إلى موسى عليه السلام: إني إنما أقبل صلاة من تواضع لعظمتي، ولم يتعظم على خلقي، وألزم قلبه خوفي، وقطع النهار بذكري، وكف نفسه عن الشهوات من أجلي، وأطعم الجائع، وكسا العاري، وآوى الغريب، فذاك الذي يشرق نور وجهه يوم القيامة، مثل الشمس، يدعوني فألبي له، ويسألني فأعطيه، أجعل له في الجهالة حلما، وفي الظلمات نورا، أكلؤه(٢) بعزتي، وأستحفظه بكلامي، فمثل ذلك العبد في الناس كمثل جنات الفردوس في الجنان؛ لا تنقطع ثمارها، ولا تتغير عن حالها.", "وقال الحسن: التواضع أن تخرج من منزلك فلا تلقى مسلما إلا رأيت له فضلا عليك.", "وروينا عن محمد بن واسع أنه شكى إليه ابنه فأقبل عليه فقال: يا بني تستطيل على الناس وأمك اشتريتها بأربعمائة درهم، وأما أبوك فلا أكثر الله في المسلمين مثله.", "وقال بكر بن عبد الله: إذا رأيت من هو أكبر منك فقل: سبقني بالإيمان والعمل الصالح، فهو خير مني، وإذا رأيت من هو أصغر منك فقل: سبقته إلى الذنوب، فهو خير مني، وإذا رأيت إخوانك يعظمونك ويصفونك، فقل: هذا فضل أخذوا به، وإذا رأيت منهم تقصيرا فقل: هذا ذنب أحدثته.", "حاشية: (١) النطع: بساط من الجلد.", "حاشية: (٢) أكلؤه: أحفظه.", "وقال الفضيل: التواضع أن تخضع للحق وتنقاد له ولو سمعته من أجهل الناس قبلته.", "وقال الفضيل لسفيان بن عيينة: إن كنت ترى أن في هذا المسجد أحدا هو دونك فقد ابتليت ببلية عظيمة.", "وقال أبو سليمان: لا يتواضع العبد حتى يعرف نفسه.", "ويقال: التواضع في الخلق كلهم حسن، وفي الأغنياء أحسن، والكبر في الخلق كلهم قبيح، وفي الفقراء أقبح.", "**بيان**", "**حقيقة الكبر وآفته**"]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "ومنها: أن لا يحتمل الأذى، فربما قابل بأوفى منه، وقد ذكرنا في كتاب الغضب فضل الحلم والصفح، وفي الجملة من أراد أن ينفي ____ ويستعمل التواضع فعليه بسيرة رسول الله ﷺ، وقد سبقت إشارتنا إليها في كتاب آداب", "o": ["الكبر", "حصائد", "تكره", "تبدي"], "h": "راجع: ص٩١٧"}, {"t": "fill", "d": 2, "q": "وربما عجب الإنسان برأيه في باب الاعتقاد، وكان ما عجب به من واقعاته ضلالا فهلك، ولو أنه استعان بالعلماء على واقعة لانكشف له ____ والصواب", "o": ["الخطأ", "متواضعا", "شقاوتك", "بإزاء"], "h": "راجع: ص٩٣٣"}, {"t": "fill", "d": 2, "q": "وأما في الدين فهو أنهم يرون الناس هالكين، ويرون ____ ناجية", "o": ["أنفسهم", "إطلاق", "والثناء", "لجزعت"], "h": "راجع: ص٩٠٨"}, {"t": "fill", "d": 2, "q": "وثمرة هذا الكبر على اللسان التفاخر به، ____ لغيره", "o": ["فيقول", "امرأ", "أعجزه", "والتقوى"], "h": "راجع: ص٩١٠"}, {"t": "fill", "d": 2, "q": "عدلان عند الحاكم أنه رقيق لفلان وأن أبويه كانا مملوكين له، فحكم بذلك الحاكم وجاء مالكه فأخذه وما في يديه، وهو يخشى مع ذلك أن ينكل به في العقوبة لتفريطه في ماله وتقصيره عن طلب مالكه، فحبسه في منزل قد أحاطت به الحيات والهوام، فبقي لا يملك نفسه ولا ماله ولا يعرف طريقا للخلاص، فهل يحسن بهذا أن يفتخر أو يذل ____", "o": ["ويخضع", "فاحتاج", "واستخف", "فيتبدل"], "h": "راجع: ص٩٢٢"}, {"t": "fill", "d": 2, "q": "فضلا عن الاستفادة من أنفاسه وأحواله، هيهات بعيد وجود ذلك في زماننا، بل يبعد في زماننا وجود عالم يختلج في قلبه التأسف ____ على فوات هذه الخصلة", "o": ["والحزن", "تلمظ", "يتحرك", "والمكتفي"], "h": "راجع: ص٩٠٨"}]}, {"t": "كتاب ذم الكبر والعجب - القسم ٢ من ٦", "b": [{"story": ["كتاب ذم الكبر والعجب (٧ من ٣٣)، ص٩٠١", ["اعلم أن الكبر خلق باطن، وتصدر عنه أعمال هي ثمرته، فيظهر على الجوارح، وذلك الخلق هو رؤية النفس فوق المتكبر عليه، فإن الكبر يستدعي متكبرا عليه ومتكبرا به، وبه ينفصل الكبر عن العجب كما سيأتي بيانه، فإن العجب لا يستدعي غير المعجب بل لو لم يخلق الإنسان إلا وحده تصور أن يكون معجبا ولا يتصور أن يكون متكبرا إلا أن يكون مع غيره، وهو يرى نفسه فوق ذلك الغير في صفات الكمال، فعند ذلك يكون متكبرا، ولا يكفي أن يستعظم نفسه ولكن يرى غيره أعظم من نفسه أو مثل نفسه، فلا يتكبر عليه، ولا يكفي أن يستحقر غيره فإنه مع ذلك لو رأى نفسه أحقر لم يتكبر، ولو رأى غيره مثل نفسه لم يتكبر بل يرى لنفسه مرتبة ولغيره مرتبة، ثم يرى مرتبة نفسه فوق مرتبة غيره، فعند هذه الاعتقادات الثلاثة يحصل فيه خلق الكبر، لا أن هذه الرؤية تنفي(١) الكبر بل هذه ال
