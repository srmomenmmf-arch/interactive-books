: ["كتاب شرح عجائب القلب (٣ من ١٧)، ص٥٦٧", ["وإنما افتقر القلب إلى هذه الجنود؛ لأنه مفتقر إلى المركب والزاد لسفره الذي لأجله خلق، وهو السفر إلى الله تعالى، وقطع المنازل إلى لقائه، ومركبه البدن، وزاده العلم، والمنزل الأدنى الدنيا، والمنزل الأقصى الآخرة، فافتقر إلى تعهد المركب الذي هو البدن وحفظه، وذلك بجلب ما يوافقه من الغذاء وغيره، وبأن يدفع عنه ما ينافيه ويهلكه، فافتقر لأجل جلب الغذاء إلى جندين؛ باطن، وهو الشهوة، وظاهر وهو اليد والأعضاء الجالبة للغذاء، فخلق في القلب من الشهوات ما احتاج إليه، وخلقت الأعضاء التي هي آلات الشهوة.", "وافتقر لأجل دفع المهلكات إلى جندين، باطن وهو الغضب الذي به تدفع المهلكات وينتقم من الأعداء، وظاهر وهي الأعضاء التي بها يعمل بمقتضى الغضب كاليد والرجل، وكمل ذلك بأمور خارجة عن البدن، كالأسلحة وغيرها.", "ثم المحتاج إلى الغذاء إذا لم يعرف الغذاء لم تنفعه شهوة الغذاء وآلته، فافتقر للمعرفة إلى جندين؛ باطن، وهو إدراك البصر والذوق والشم والسمع واللمس، وظاهر، وهو العين والأذن والأنف وغيرها.", "حاشية: (١) في الأصل: «جنده».", "وتفصيل وجه الحاجة إليها ووجه الحكمة فيها يطول شرحه(١)، وقد أشرنا إلى طرف يسير منه في كتاب الشكر.", "فجملة جنود القلب يحصرها ثلاثة أصناف:", "صنف باعث ومستحث إما إلى جلب الموافق النافع، كالشهوة، وإما إلى دفع الضار المنافي، كالغضب، وقد يعبر عن هذا الباعث بالإرادة.", "**والثاني** هو المحرك للأعضاء إلى تحصيل هذه المقاصد، ويعبر عن هذا الثاني بالقدرة، وهي جنود مبثوثة في جميع الأعضاء لاسيما العضلات منها والأوتار.", "**والثالث** وهو المدرك المتعرف للأشياء كالجواسيس، وهي قوة البصر والسمع والشم والذوق وغيرها، وهي مبثوثة في أعضاء معينة، ويعبر عن هذا بالعلم والإدراك.", "ومع كل واحد من هذه الجنود الباطنة جنود ظاهرة، وهي الأعضاء المركبة من الشحم واللحم والعصب والدم والعظم التي أعدت آلات لهذه الجنود، وإن قوة البطش إنما تبطش بالأصابع، وقوة البصر إنما تدرك(٢) الشيء بالعين، وكذا سائر القوى.", "ولسنا نتكلم في الجنود الظاهرة التي هي الأعضاء، فإنها معلومة، وإنما نتكلم في جنود لم تروها. وهذا المدرك من هذه الجملة ينقسم إلى ما أسكن المنازل الظاهرة وهي الحواس الخمس، أعني السمع والبصر والشم والذوق واللمس، وإلى ما أسكن منازل باطنة وهي تجاويف الدماغ وهي أيضا خمسة، فإن الإنسان بعد رؤية الشيء يغمض عينيه، فيدرك صورته في نفسه وهو الخيال، ثم تبقى تلك الصورة معه بسبب شيء يحفظه، وهو الجند الحافظ، ثم يتفكر فيما حفظه، فيركب بعض ذلك إلى بعض، ثم يتذكر ما نسيه ويعود إليه، ثم يجمع جملة معاني المحسات في خياله بالحس المشترك بين المحسات ففي الباطن حس مشترك وتخيل", "حاشية: (١) في (ظ): «ذكره».", "حاشية: (٢) سقطت من الأصل."]], "ic": "book"}, {"story": ["كتاب شرح عجائب القلب (٤ من ١٧)، ص٥٦٩", ["وتفكر وتذكر وحفظ لولا خلق الله تعالى قوة الحفظ والفكر والذكر والتخيل لكان يخلو الدماغ عنه كما تخلو عنه اليد والرجل، فتلك القوى جنود باطنة وأماكنها أيضا باطنة.", "فهذه أقسام جنود القلب، وينتفع بذلك أقوياء العلماء، فأما شرح ذلك بحيث يدركه فهم الضعفاء، فإنه يطول، إلا أنا نجتهد في تفهيم الضعفاء بضرب الأمثلة.", "**بيان**", "**أمثلة القلب مع جنوده الباطنة**", "اعلم أن جندي الغضب والشهوة قد ينقادان للقلب، انقيادا تاما، فيعينه(١) ذلك على طريقه الذي يسلكه، وقد يستعصيان عليه استعصاء بغي وتمرد حتى يملكاه ويستعبداه، وفي ذلك هلاكه وانقطاعه عن سفره الذي به وصوله إلى سعادة الأبد.", "وللقلب جند آخر، وهو العلم والحكمة والتفكر، كما سيأتي شرحه، فينبغي له أن يستعين بهذا الجند الذي هو حزب الله على هذين الجندين اللذين قد يلتحقان بحزب الشيطان، فإن ترك الاستعانة وسلط على نفسه جند الغضب والشهوة هلك يقينا، وخسر خسرانا مبينا، وذلك حال أكثر الخلق، فإن عقولهم صارت مسخرة لشهواتهم في استنباط الحيل لقضاء الشهوة، وكان ينبغي أن تكون الشهوة مسخرة لعقولهم فيما يفتقر العقل إليه.", "ونحن نقرب هذا إلى القلب بثلاثة أمثلة:", "**المثال الأول**: أن نقول: مثل نفس الإنسان في بدنه ـ ونعني بالنفس اللطيفة المذكورة ـ كمثل وال في مدينته ومملكته، فإن البدن مملكة النفس وعالمها ومستقرها ومدينتها، وجوارحه بمنزلة الصناع والفعلة، والقوة العقلية المفكرة له كالمشير الناصح والوزير العاقل، والشهوة له كعبد سوء يجلب الطعام والميرة إلى المدينة، والغضب والحمية له كصاحب الشرطة، والعبد الجالب للميرة كذاب ممار مخادع خبيث يتمثل بصورة الناصح، وتحت نصحه الشر الهائل، والسم القاتل، وديدنه معاداة الوزير الناصح في كل تدبير يدبره، فلا يخلو عن معارضته في آرائه ساعة، والوالي في مملكته متى استشار في تدبيراته وزيره معرضا عن قول هذا العبد", "حاشية: (١) تحرفت في (ظ) إلى: «يعوده».", "الخبيث، بل مستدلا بإشاراته على أن الصواب في ضد ما يشير به، وأدب صاحب شرطته، وأمره أن يأتمر لوزيره، وأن يتسلط من جهة الوزير على هذا العبد الخبيث وأتباعه وأنصاره حتى يكون العبد مسوسا لا سائسا، ومأمورا(١) مدبرا لا أميرا(٢) مدبرا؛ استقام أمر بلده، وانتظم العدل بسببه، فكذلك النفس، متى استعانت بالعقل، وأدبت الحمية والغضب، وسلطته على الشهوة؛ اعتدلت قواها، وحسنت أخلاقها، ومن عدل عن هذه الطريقة أضله الله على علم.", "وسيأتي كيفية مجاهدة هذه الجنود، وتسليط بعضها على بعض في كتاب رياضة النفس، إن شاء الله تعالى."]], "ic": "book"}, {"story": ["كتاب شرح عجائب القلب (٥ من ١٧)، ص٥٧١", ["**المثال الثاني**: إن البدن كالمدينة، والعقل ـ أعني: المدرك من الإنسان ـ كمملك مدبر لها، وقواه المدركة من الحواس الظاهرة والباطنة كجنوده وأعوانه، وأعضاؤه كرعيته، والنفس الأمارة بالسوء التي هي الشهوة والغضب كعدو ينازعه في مملكته، ويسعى في إهلاك رعيته، فصار بدنه كثغر، ونفسه فيه كمرابط، فإن جاهد عدوه فقهره حمد إثر ذلك، وإن ضيع ثغره ذم عاقبة فعله، فقيل له: يا راعي السوء، أكلت اللحم، وشربت اللبن، ولم ترد الضالة ولم تجبر الكسير.", "وإلى هذه المجاهدة أشار صلى الله عليه وسلم بقوله: «رجعتم من الجهاد الأصغر إلى الجهاد الأكبر».", "**المثال الثالث**: مثل العقل كمثل فارس متصيد، وشهوته كفرسه، وغضبه ككلبه، فمتى كان الفارس حاذقا، وفرسه مروضا، وكلبه مؤدبا ومعلما، كان جديرا بالنجح، ومتى كان هو في نفسه أخرق، وكان الفرس جموحا، والكلب عقورا؛ فلا فرسه ينبعث تحته منقادا، ولا كلبه يسترسل بإشارته مطيعا، فهو خليق بأن يعطب، فضلا عن أن ينال ما طلب، وإنما خرق(٣) الفارس مثال لجهل الإنسان", "حاشية: (١) سقطت من (ظ).", "حاشية: (٢) سقطت من (ظ).", "حاشية: (٣) في (ظ): «خروق».", "وقلة حكمته، وكلال بصيرته، وجماح الفرس مثال لغلبة الشهوة، خصوصا شهوة البطن والفرج، وعقر الكلب مثال لغلبة الغضب واستيلائه.", "**بيان**", "**خاصية قلب الإنسان**", "اعلم أن جميع الحيوان قد شارك الآدمي في وجود الشهوة والغضب والحواس الظاهرة والباطنة، حتى إن الشاة ترى الذئب بعينها، وتعلم عداوته لها بقلبها فتهرب منه، فذلك إدراك بالباطن.", "فأما ما يختص به قلب الإنسان الذي لأجله عظم شرفه وصلح للقرب من الله تعالى، فهو راجع إلى علم وإرادة.", "أما العلم، فهو العلم بالأمور الدنيوية والأخروية والحقائق العقلية، فإن هذه أمور وراء المحسات لا يشارك الآدمي فيها الحيوانات، بل العلوم الكلية الضرورية من خواص العقل، فإن الإنسان يحكم أن الفرس الواحد لا يتصور أن يكون في مكانين في حالة واحدة، وهذا حكم منه على كل فرس، ومعلوم أنه لم يدرك بالحس إلا بعض الأفراس، فحكمه على جميع الأفراس زائد على ما أدركه بالحس، وإذا فهمت هذا في العلم الضروري، فهو في جميع النظريات أظهر."]], "ic": "book"}, {"story": ["كتاب شرح عجائب القلب (٦ من ١٧)، ص٥٧٣", ["وأما الإرادة، فإنه إذا أدرك بالعقل عاقبة الأمر وطريق الصلاح فيه انبعث من ذاته شوق إلى وجه المصلحة وإلى تعاطي أسبابها وإرادتها، وذلك غير إرادة الشهوة، فإن العاقل يريد الفصد والحجامة ويترك لذيذ الطعام في المرض، والشهوة تنفر من ذلك، ولو خلق الله تعالى العقل المعرف لعواقب الأمور ولم يخلق هذا الباعث المحرك للأعضاء على مقتضى حكم العقل لكان حكم العقل ضائعا، فقد بان اختصاص قلب الإنسان بعلوم وإرادات تنفك عنها سائر الحيوانات، بل ينفك عنها الصبي في أول الفطرة، وإنما تحدث فيه عند البلوغ، وإنما الموجود في الصبي الشهوة والغضب والحواس الظاهرة والباطنة، ثم للصبي في حصول هذه العلوم فيه درجتان:", "إحداهما: أن يشتمل قلبه على جملة العلوم الضرورية الأولية، كالعلم باستحالة المستحيلات وجواز الجائزات الظاهرة، فتكون العلوم النظرية فيه غير حاصلة، إلا أنها صارت ممكنة قريبة الإمكان والحصول، فيكون كمن عرف الحروف المفردة دون المركبة، فإنه قد قارب الكتابة.", "والدرجة الثانية: أن تحصل له العلوم المكتسبة بالتجارب والفكر، وتكون كالمخزونة عنده، فإذا شاء رجع إليها وحاله حال الحاذق بالكتابة يقال له: كاتب، وإن لم يباشر الكتابة لقدرته عليها.", "وهذا الذي ذكرناه هو غاية درجة الإنسانية إلا أن في هذه الدرجة مراتب يتفاوت الخلق فيها تارة بكثرة المعلومات وقلتها، وتارة بشرف المعلومات وحسنها، وتارة بطريق تحصيلها إذ بعضها يحصل لبعض القلوب بإلهام إلهي على سبيل المكاشفة، وبعضها بتعلم واكتساب، وفي هذا المقام تتباين منازل العلماء والحكماء والأولياء والأنبياء، ولا حصر لتلك المنازل، وإنما يعرف كل سالك المنزل الذي بلغه، فيعرفه ويعرف ما خلفه من المنازل لا ما بين يديه، كما لا يعرف الجنين حال الطفل، ولا الطفل حال المميز، ولا المميز حال العاقل، ولا العاقل حال الأولياء والأنبياء، وأقصى الرتب فيها رتبة النبي الذي تنكشف له الحقائق من غير اكتساب بل بكشف إلهي في أسرع وقت.", "فقد بان من هذه الجملة أن خاصية الإنسان العلم والحكمة، وأشرف أنواع العلم العلم بالله وصفاته، فالبدن مركب النفس، والنفس محل العلم، والعلم خاصية الإنسان التي لها خلق، فكما أن الفرس يشارك الحمار في قوة الحمل ويختص بالكر والفر وحسن الهيئة، فيكون الفرس مخلوقا لأجل تلك الخاصية، فإن فقدت منه نزل إلى خضيض رتبة الحمار، فكذلك الإنسان يشارك الحمار والفرس في أمور، ويفارقه في أمور وهي خاصيته، وتلك الخاصية من صفات الملائكة المقربين، والإنسان على رتبة بين البهائم والملائكة، فإن الإنسان من حيث يتغذى وينسل نبات، ومن حيث يحس ويتحرك حيوان، ومن حيث صورته وقامته فكالصورة المنقوشة على الحائط، وإنما خاصيته معرفة حقائق الأشياء، فمن"]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "فالعالم عبارة عن القلب الذي فيه يحل مثال حقائق الأشياء، والمعلوم عبارة عن حقائق الأشياء، والعلم عبارة عن حصول المثال في المرآة، كما أن القبض مثلا يستدعي قابضا، كاليد، ومقبوضا كالسيف، ووصولا بين السيف واليد بحصول السيف في اليد ويسمى قابضا، فكذلك وصول مثال المعلوم إلى القلب يسمى علما، وقد كانت الحقيقة موجودة والقلب موجودا؛ لأن العلم عبارة عن وصول الحقيقة إلى القلب، كما كان السيف موجودا واليد موجودة ولم يكن اسم الأخذ والقبض حاصلا لعدم وقوع السيف في اليد، إلا أن القبض عبارة عن حصول السيف بعينه في اليد، والمعلوم بعينه لا يحصل في القلب، فمن علم النار لم يحصل عين النار في قلبه، ولكن الحاصل حده وحقيقته ____ لصورتها، فتمثيله بالمرآة أولى؛ لأن عين الإنسان لا تحصل في المرآة، وإنما يحصل مثال مطابق له، فكذلك حصول مثال مطابق لحقيقة المعلوم في القلب يسمى علما", "o": ["المطابق", "وموضع", "الأغر", "مخالطة"], "h": "راجع: ص٥٧٩"}, {"t": "fill", "d": 2, "q": "ثم المحتاج إلى الغذاء إذا لم يعرف الغذاء لم تنفعه شهوة الغذاء وآلته، فافتقر للمعرفة إلى جندين؛ باطن، وهو إدراك البصر والذوق والشم والسمع واللمس، وظاهر، وهو العين والأذن والأنف ____", "o": ["وغيرها", "زاحمني", "اكتسبوا", "وينصحه"], "h": "راجع: ص٥٦٧"}, {"t": "fill", "d": 2, "q": "وهذا الذي ذكرناه هو غاية درجة الإنسانية إلا أن في هذه الدرجة مراتب يتفاوت الخلق فيها تارة بكثرة المعلومات وقلتها، وتارة بشرف المعلومات وحسنها، وتارة بطريق تحصيلها إذ بعضها يحصل لبعض القلوب بإلهام إلهي على سبيل المكاشفة، وبعضها بتعلم واكتساب، وفي هذا المقام تتباين منازل العلماء والحكماء والأولياء والأنبياء، ولا حصر لتلك المنازل، وإنما يعرف كل سالك المنزل الذي ____، فيعرفه ويعرف ما خلفه من المنازل لا ما بين يديه، كما لا يعرف الجنين حال الطفل، ولا الطفل حال المميز، ولا المميز حال العاقل، ولا العاقل حال الأولياء والأنبياء، وأقصى الرتب فيها رتبة النبي الذي تنكشف له الحقائق من غير اكتساب بل بكشف إلهي في أسرع وقت", "o": ["بلغه", "يطرد", "دعوة", "مجموع"], "h": "راجع: ص٥٧٤"}, {"t": "fill", "d": 2, "q": "وإنما ذمت العجلة؛ لأن العمل ينبغي أن يكون على بصيرة، ولا تحصل البصيرة إلا بالتثبت، وقد أوصى إبليس أعوانه ____", "o": ["فقال", "فعرفها", "فيدعو", "حبها"], "h": "راجع: ص٥٨٨"}, {"t": "fill", "d": 2, "q": "وأكثر القلوب قد فتحها جند الشيطان وملكها، فامتلأت بالوساوس الداعية إلى إيثار العاجلة وإطراح الآخرة، ومبدأ استيلائها اتباع الهوى، ولا يطرد جند الشيطان من القلب إلا ذكر ____ تعالى؛ لأنه لا قرار لجنده مع الذكر", "o": ["الله", "وكبيت", "وغرور", "يختص"], "h": "راجع: ص٥٨٦"}, {"t": "fill", "d": 2, "q": "وهي تنقسم إلى ضرورية لا يدرى من أين تحصل ولا كيف حصلت، كعلم الإنسان أن الشخص الواحد لا يكون في مكانين، والشيء الواحد لا يكون حادثا قديما موجودا معدوما معا، فإن هذه علوم يجد الإنسان نفسه منذ الصبا مفطورا عليها، ولا يدري متى حصل له هذا العلم، ولا من أين حصل، غير أنه يعلم أن الله ____ هو الذي خلقه", "o": ["تعالى", "يشفى", "يطابق", "وسلطت"], "h": "راجع: ص٥٨٣"}]}, {"t": "كتاب شرح عجائب القلب - القسم ٢ من ٣", "b": [{"story": ["كتاب شرح عجائب القلب (٧ من ١٧)، ص٥٧٥", ["استعمل جميع أعضائه وقواه على وجه الاستعانة بها على العلم والعمل فقد تشبه بالملائكة، فحقيق بأن يلتحق بهم، وجدير بأن يسمى ملكا وربانيا، ومن صرف همته إلى اتباع اللذات البدنية، فقد انحط إلى حضيض البهائم، فيصير إما غمرا كثور، وإما شرها كخنزير، وإما ضرعا ككلب، وإما حقودا كجمل، وإما متكبرا كنمر، وإما ذا روغان كثعلب، أو يجمع ذلك كله(١) كشيطان مريد، فمن قدرت له السعادة كان قلبه مستقر ملكه، فهو يجري القوة الخيالية المودعة في مقدم الدماغ مجرى خازنه، واللسان مجرى ترجمانه، والأعضاء المتحركة مجرى كتابه، والحواس الخمس مجرى جواسيسه فإنها أصحاب أخبار تلتقطها من العالم، فالعين تلتقط أخبار الألوان، والسمع أخبار الأصوات، وكذلك البقية، فإذا التقطت الأخبار أدتها إلى القوة الخيالية التي هي كصاحب البريد، ويسلمها صاحب البريد إلى الخازن، وهي الحافظة، ويعرضها الخازن على الملك، فيقتبس منها ما يحتاج إليه في تدبير مملكته وإتمام سفره الذي هو بصدده، وقمع عدوه الذي هو مبتلى به، فإذا فعل ذلك كان موفقا شاكرا لنعمة الله، وإذا عطل هذه الجملة أو استعملها في مراعاة أعدائه وهم الشهوة والغضب وسائر الحظوظ العاجلة، أو في عمارة طريقه وهي الدنيا دون منزله، وهو الآخرة، كان مخذولا كافرا لنعمة الله تعالى.", "حاشية: (١) ليست في الأصل.", "**بيان**", "**مجامع أوصاف القلب ومثاله**"]], "ic": "book"}, {"story": ["كتاب شرح عجائب القلب (٨ من ١٧)، ص٥٧٦", ["اعلم أن الإنسان قد صحب في تركيبه وخلقته أربع صفات: السبعية، والبهيمية والشيطانية والربانية، فهو من حيث سلط عليه الغضب يتعاطى أفعال السباع من العداوة والتهجم على الناس بالضرب والشتم، ومن حيث سلطت عليه الشهوة يتعاطى أفعال البهائم من الشره والحرص والشبق، ومن حيث مشاركته للبهائم في الغضب والشهوة وطبعه يدعوه إلى تحصيل الأغراض بالمكر والخداع فيه شيطانية، ومن حيث أنه في نفسه أمر رباني كما قال تعالى: ﴿قُلِ ٱلرُّوحُ مِنْ أَمْرِ رَبِّى﴾ [الإسراء: ٨٥]، فهو يحب الاستعلاء والاستبداد بالأمور والانسلال عن ربقة العبودية، ويشتهي الاطلاع(١) على العلوم كلها، وكل هذه الصفات مجموعة في القلب، فكأن المجموع في إهاب الإنسان خنزير وكلب وشيطان وحكيم؛ فالخنزير الشهوة تدعو إلى الفحشاء، والكلب الغضب يدعو إلى الظلم والإيذاء، والشيطان هوى يهيج شهوة الخنزير وغيظ السبع، ويغري أحدهما بالآخر، ويحسن لهما ما هما مجبولان عليه، والحكيم الذي هو مثال العقل مأمور بأن يدفع كيد الشيطان، ويكسر شرة الخنزير، فإن قهر الكل وجعلهم تحت سياسته ظهر العدل في المملكة واستقام الأمر، وإن عجز عن قهرهم قهروه، فاستخدموه، فلا يزال في استنباط الحيل وتدقيق الفكر ليشبع الخنزير ويرضي الكلب، وهذا حال(٢) أكثر الناس مهما كان أكثر همهم البطن والفرج ومنافسة الأعداء، فهؤلاء في طاعة أهوائهم كعباد الأصنام، فكيف ينكرون عليهم؟ وأي ظلم أكبر من أن يجعل العقل وهو المالك مملوكا؟! فأصبح وهو السيد عبدا.", "حاشية: (١) تحرفت في الأصل إلى: «الأضلاع».", "حاشية: (٢) في الأصل: «وهذه حالة».", "ومن فعل ذلك انتشر إلى قلبه من هذه الأحوال صفات تتراكم عليه، فتصير رينا وطابعا، وذلك أن طاعة الشهوة تورث الخبث والوقاحة واللعب والحرص والملق والحسد وغير ذلك.", "وأما طاعة الغضب ينتشر منها إلى القلب صفة التهور والبذخ والتكبر والعجب واحتقار الخلق وشهوة الظلم وغير ذلك.", "وأما طاعة الشيطان وطاعة الشهوة والغضب فيحصل منها صفة المكر والخداع والدهاء والتلبيس والخب والغش وغير ذلك.", "ولو عكس الأمر وقهر الجميع تحت سياسة الصفة الربانية لاستقر في القلب من الصفات الربانية العلم والحكمة، ولانتشر إليه من ضبط الشهوة وردها إلى الاعتدال صفات شريفة كالعفة والقناعة والزهد والورع والتقوى والحياء وأمثال ذلك.", "ويحصل له من ضبط قوة الغضب وردها إلى حد الاعتدال صفة الشجاعة والكرم والصبر والحلم والاحتمال والعفو والوقار وغير ذلك."]], "ic": "book"}, {"story": ["كتاب شرح عجائب القلب (٩ من ١٧)، ص٥٧٧", ["والقلب في حكم مرآة وقد اكتنفته هذه الأمور المؤثرة فيه، وهذه الآثار على التوالي واصلة إلى القلب؛ أما الآثار المحمودة التي ذكرناها فإنها تزيد مرآة القلب جلاء وإشراقا ونورا وضياء حتى ينكشف له حقيقة الأمر المطلوب في الدين، فيصير للإنسان من قلبه واعظ، كما قال عليه الصلاة والسلام: «إذا أراد الله بعبد خيرا جعل له واعظا من قلبه».", "وأما الآثار المذمومة فإنها مثل دخان مظلم يتصاعد إلى مرآة القلب ولا يزال يتراكم إلى أن يسود القلب ويظلم، فيصير محجوبا عن الله تعالى بالكلية، كما قال تعالى: ﴿وَنَطْبَعُ عَلَىٰ قُلُوبِهِمْ فَهُمْ لَا يَسْمَعُونَ﴾ [الأعراف: ١٠٠] فإذا طبع على القلب عظم أمر الدنيا واستهان بأمر الآخرة، فإذا طرق سمعه ذكر الآخرة دخل من أذن وخرج من أذن، ولم يصل إلى القلب، وقد قال عليه الصلاة والسلام: «إن المؤمن إذا أذنب كانت نكتة سوداء في قلبه، فإذا تاب ونزع واستغفر صقل قلبه، وإن زاد", "زادت حتى تعلو قلبه». فذلك الران الذي ذكر الله عز وجل في كتابه: ﴿كَلَّا بَلْ رَانَ عَلَىٰ قُلُوبِهِم مَّا كَانُوا۟ يَكْسِبُونَ﴾ [المطففين: ١٤].", "وأما من أتبع المعصية حسنة فإنه كمن يتنفس في المرآة ثم يمسح النفس، فيزول ما ستر وجه المرآة.", "**بيان**", "**مثال القلب بالإضافة إلى العلوم خاصة**", "اعلم أن محل العلوم هو القلب، أعني اللطيفة المدبرة لجميع الجوارح المطاعة المخدومة من جميع الأعضاء وهي بالإضافة إلى حقائق المعلومات كالمرآة بالإضافة إلى صور المتلونات(١)، فكما أن للملون(٢) صورة، ومثال تلك الصورة ينطبع في المرآة فيحصل، فكذلك لكل معلوم حقيقة، وتلك الحقيقة صورته، فتنطبع في مرآة القلب وتتضح فيها، وكما أن المرآة غير وصورة الأشخاص غير، وحصول مثالها في المرآة غير، فهي ثلاثة أمور، فكذلك هاهنا ثلاثة أمور: القلب، وحقائق الأشياء، وحصول نفس الحقائق في القلب وحضورها فيه.", "فالعالم عبارة عن القلب الذي فيه يحل مثال حقائق الأشياء، والمعلوم عبارة عن حقائق الأشياء، والعلم عبارة عن حصول المثال في المرآة، كما أن القبض مثلا يستدعي قابضا، كاليد، ومقبوضا كالسيف، ووصولا بين السيف واليد بحصول السيف في اليد ويسمى قابضا، فكذلك وصول مثال المعلوم إلى القلب يسمى علما، وقد كانت الحقيقة موجودة والقلب موجودا؛ لأن العلم عبارة عن وصول الحقيقة إلى القلب، كما كان السيف موجودا واليد موجودة ولم يكن اسم الأخذ والقبض حاصلا لعدم وقوع السيف في اليد، إلا أن القبض عبارة عن حصول السيف بعينه في اليد، والمعلوم بعينه لا يحصل في القلب، فمن علم النار لم يحصل عين النار في قلبه، ولكن الحاصل حده وحقيقته المطابق لصورتها، فتمثيله بالمرآة أولى؛ لأن عين الإنسان لا تحصل في المرآة، وإنما يحصل مثال مطابق له، فكذلك حصول مثال مطابق لحقيقة المعلوم في القلب يسمى علما."]], "ic": "book"}, {"story": ["كتاب شرح عجائب القلب (١٠ من ١٧)، ص٥٧٩", ["حاشية: (١) تحرفت في الأصل إلى: «المتكونات».", "حاشية: (٢) تحرفت في الأصل إلى: «المتلون».", "واعلم أنه قد يمتنع انكشاف الصورة في المرآة لخمسة أشياء:", "**أحدها**: نقصان صورتها كجوهر الحديد قبل أن يدور ويشكل ويصقل.", "**والثاني**: لخبث صدئه وكدورته، وإن كان تام الشكل.", "**والثالث**: لكونه معدولا به عن جهة الصورة إلى غيرها، كما إذا كانت الصورة وراء المرآة.", "**والرابع**: لحجاب مرسل بين المرآة والصورة.", "**والخامس**: للجهل بالجهة التي فيها الصورة المطلوبة حتى يتعذر بسببه أن يحاذي بها شطر الصورة وجهتها.", "فكذلك القلب مرآة مستعدة لأن يتجلى فيها الحق في الأمور كلها، وإنما خلت القلوب عن العلوم التي خلت عنها لهذه الأسباب الخمسة:", "**أولها**: نقصان(١) في ذاته كقلب الصبي فإنه لا تتجلى له المعلومات لنقصانه.", "**والثاني**: لكدورة المعاصي والخبث الذي تراكم على وجه القلب من كثرة الشهوات، فإن ذلك يمنع صفاء القلب وجلاءه فيمتنع ظهور الحق بقدر ظلمته وتراكمه.", "**والثالث**: أن يكون معدولا به عن جهة الحقيقة المطلوبة، فإن قلب المطيع الصالح وإن كان صافيا، فإنه ليس يتضح فيه جلية الحق لأنه ليس يطلب الحق وليس يحاذي بمرآته شطر المطلوب، بل ربما يكون مستوعب الهم بتهيئة أسباب المعاش، أو بتفصيل الطاعات البدنية، ولا يصرف فكره إلى الحقائق الخفية الإلهية، فلا ينكشف إلا ما هو متفكر فيه.", "**والرابع**: الحجاب، فإن المطيع القاهر لشهواته المتجرد للفكر في حقيقة من الحقائق قد لا ينكشف له ذلك، لكونه محجوبا عنه باعتقاد سبق إليه منذ الصبا على", "حاشية: (١) في الأصل: «نقصان الصورة وهي زيادة».", "سبيل التقليد، وبهذا حجب أكثر المتكلمين والمتعصبين للمذاهب، بل أكثر الصالحين؛ لأنهم محجوبون باعتقادات تقليدية رسخت في قلوبهم، فصارت حجابا بينهم وبين إدراك الحقائق.", "**والخامس**: الجهل بالجهة التي منها يقع العثور على المطلوب، فإن طالب العلم ليس يمكنه أن يحصل العلم بالمجهول إلا بالتذكر للعلوم التي تناسب مطلوبه حتى إذا تذكرها ورتبها في نفسه ترتيبا مخصوصا يعرفه العلماء بطرائق(١) الاعتبار، فعند ذلك يكون قد عثر على جهة المطلوب فتنجلي حقيقة المطلوب لقلبه، فإن العلوم المطلوبة التي ليست فطرية لا تقتنص إلا بشبكة العلوم الحاصلة، بل كل علم فلا يحصل إلا بعلمين سابقين يأتلفان ويزدوجان على وجه مخصوص، فيحصل من ازدواجهما علم ثالث على مثال ما يحصل النتاج من ازدواج الفحل والأنثى، فالجهل بتلك الأصول وبكيفية الازدواج هو المانع من العلم."]], "ic": "book"}, {"story": ["كتاب شرح عجائب القلب (١١ من ١٧)، ص٥٨١", ["ومثاله: أن يريد الإنسان أن يرى ظهره في المرآة، فإنه إن رفع المرآة بإزاء وجهه لم يكن قد حاذى بها شطر الظهر فلا يظهر فيها الظهر، وإن رفعها وراء ظهره وبإزائه كان قد عدل بالمرآة عن العين فلا يرى المرآة ولا صورة الظهر فيها، فيحتاج إلى مرآة أخرى ينصبها وراء الظهر وهذه في مقابلتها بحيث يبصرها حتى تنطبع صورة الظهر في المرآة المحاذية للظهر، ثم تنطبع صورة هذه المرآة في المرآة الأخرى التي في مقابلة العين، ثم تدرك العين صورة الظهر، وكذلك في اقتناص العلوم طرق عجيبة فيها ازورارات وتحريفات أعجب مما ذكرنا في المرآة وقليل من يهتدي إلى الحيلة في تلك الازورارات.", "فهذه هي الأسباب المانعة للقلوب من معرفة حقائق الأمور، وإلا فكل قلب هو صالح بالفطرة لمعرفة الحقائق؛ لأنه أمر رباني شريف فارق سائر جواهر العالم بهذه الخاصية والشرف؛ وبهذه الخاصية حمل أمانة الله عز وجل التي عجزت عن حملها السماوات والأرض والجبال، وتلك الأمانة هي المعرفة والتوحيد، فقلب", "حاشية: (١) في (ظ): «بطريق».", "كل آدمي مستعد لحمل الأمانة ومطيق لها في الأصل، ولكن تثبطه عن النهوض بأعبائها والوصول إلى تحقيقها الأسباب التي ذكرناها، ولذلك قال عليه الصلاة والسلام: «كل مولود يولد على الفطرة، وإنما أبواه يهودانه وينصرانه...».", "وهذا التجلي والإيمان(١) له ثلاث مراتب:", "**المرتبة الأولى**: إيمان العوام في بداياتهم وهو إيمان المقلد المحض.", "**والثاني**: إيمان العلماء بالدليل.", "**والثالث**: إيمان الموقنين، واليقين أبلغ العلوم المكتسبة.", "ونبين لك هذه المراتب بمثال؛ وهو أن تصديقك بكون زيد مثلا في الدار له ثلاث درجات:", "الأولى: أن يخبرك به من جربت عليه الصدق ولم تعرف منه الكذب، فإن قلبك يسكن إليه ويطمئن، وهذا هو الإيمان بمجرد التقليد، وهو مثل إيمان العوام.", "الرتبة الثانية: أن تسمع كلام زيد وصوته في الدار، ولكن من وراء جدار، فتستدل به على كونه في الدار، فيكون هذا التصديق أقوى من التصديق بالخبر عنه، هذا إيمان ممزوج بدليل، ويتطرق إليه الخطأ من جهة أن الأصوات تشتبه.", "الرتبة الثالثة: أن تدخل الدار فتراه بعينك، فهذه هي المعرفة الحقيقية، وهي معرفة الصديقين والمقربين، ثم يتفاوت أهل هذا المقام في مقادير العلوم، ودرجات الكشف مثل أن ترى زيدا قريبا منك في وقت إشراق الشمس، ويراه آخر من بعد في وقت العشاء، فهذا متيقن(٢) إلا أنه لا يبين له خفايا صورته.", "حاشية: (١) سقطت من الأصل.", "حاشية: (٢) في الأصل: «موقن».", "**بيان**", "**حال القلب بالإضافة إلى أقسام العلوم العقلية والدينية والدنياوية والأخراوية**", "اعلم أن القلب بغريزته مستعد لقبول حقائق المعلومات كما سبق، ولكن العلوم التي تحل فيه تنقسم إلى عقلية وشرعية.", "فالعقلية تنقسم إلى ضرورية ومكتسبة، والمكتسبة تنقسم إلى دنياوية وأخراوية."]], "ic": "book"}, {"story": ["كتاب شرح عجائب القلب (١٢ من ١٧)، ص٥٨٣", ["أما العقلية، فنعني بها ما تقضي به غريزة العقل ولا يؤخذ بالسماع والتقليد.", "وهي تنقسم إلى ضرورية لا يدرى من أين تحصل ولا كيف حصلت، كعلم الإنسان أن الشخص الواحد لا يكون في مكانين، والشيء الواحد لا يكون حادثا قديما موجودا معدوما معا، فإن هذه علوم يجد الإنسان نفسه منذ الصبا مفطورا عليها، ولا يدري متى حصل له هذا العلم، ولا من أين حصل، غير أنه يعلم أن الله تعالى هو الذي خلقه.", "وإلى مكتسبة، وهي المستفادة بالتعلم والاستدلال، والقلب جار مجرى العين، وغريزة العقل فيه جارية مجرى قوة البصر في العين.", "وأما العلوم الدينية، فهي المأخوذة من الأنبياء عليهم السلام، وذلك يحصل بالتعلم لكتاب الله وسنة رسوله وفهم معانيهما، وبه كمال صفة القلب وسلامته من الأمراض؛ لأن العلوم العقلية غير كافية في سلامته وإن كان محتاجا إليها، كما أن العقل غير كاف في استدامة أسباب صحة البدن، بل يحتاج إلى معرفة خواص الأدوية(١) والعقاقير بطريق التعلم من الأطباء، إذ مجرد العقل لا يهدي إليه، ولكن لا يمكن فهمه بعد سماعه إلا بالعقل، ولا غنى بالعقل عن السمع، ولا بالسمع عن العقل، فالداعي إلى محض التقليد، مع عزل العقل بالكلية جاهل، والمكتفي", "حاشية: (١) تحرفت في الأصل إلى: «الأسماء».", "بمجرد العقل عن القرآن والسنة مغرور، فاجمع بين الأصلين، فإن العلوم العقلية كالأغذية، والعلوم الشرعية كالأدوية، والمريض يتضرر بالغذاء إذا فاته الدواء، فكذلك أمراض القلب لا يمكن علاجها إلا بأدوية مستفادة من الشريعة، وهي لطائف العبادات والأعمال التي ركبها الأنبياء لإصلاح القلوب، فمن لا يداوي قلبه المريض بمعالجات العبادات الشرعية اكتفاء بالعلوم العقلية، فإنه يستضر بها كما يستضر المريض بالغذاء.", "ومن ظن أن العلوم العقلية مناقضة للعلوم الشرعية، وأن الجمع بينهما غير ممكن، فهو ظن صادر عن عمى في عين البصيرة، وهذا ربما خفي عليه الجمع بين بعض علوم الشرع فظن بعضها مناقضا لبعض، فانسل من الدين انسلال(١) الشعرة من العجين، وذلك لأن عجزه خيل إليه تناقضا في الدين، فمثله كمثل أعمى دخل دارا فتعثر فيها بأواني الدار، فقال: ما بال هذه الأواني تركت على الطريق؟ وهلا ردت إلى مواضعها. فقيل له: الأواني في مواضعها، وإنما أنت لا تهتدي إلى الطريق لعماك، فالعجب منك كيف لم تحل تعثرك(٢) على عماك، وأحلته على تقصير غيرك.", "واعلم أن العلوم العقلية تنقسم إلى: دنياوية، كعلم الطب والحساب والهندسة.", "وأخراوية، كالعلم بالله وصفاته وأفعاله، والعلم بأحوال القلب وآفات الأعمال. وقل أن يشتغل أحد بأحد القسمين. إلا ويقصر في الآخر.", "ومتى رأيت مشغولا بعلوم الدنيا يجحد بعض علوم الدين فاعلم أن ذلك لبعده عنه، ومن أين يظفر سالك الشرق بما في طريق الغرب؟"]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "اعلم أن العلوم التي ليست ضرورية وإنما تحصل في القلب في بعض الأحوال يختلف الحال في حصولها، ____ تهجم على القلب من حيث لا يدري، وتارة تكتسب بطريق الاستدلال والتعلم", "o": ["فتارة", "والرقيق", "تمسك", "اجعل"], "h": "راجع: ص٥٨٥"}, {"t": "fill", "d": 2, "q": "المثال الثاني: إن البدن كالمدينة، والعقل ـ أعني: المدرك من الإنسان ـ كمملك مدبر لها، وقواه المدركة من الحواس الظاهرة والباطنة كجنوده وأعوانه، وأعضاؤه كرعيته، ____ الأمارة بالسوء التي هي الشهوة", "o": ["والنفس", "الصمد", "الموافقة", "بكوامن"], "h": "راجع: ص٥٧١"}, {"t": "fill", "d": 2, "q": "القلب الثالث: قلب يبتدئ فيه خاطر الهوى، فيدعو إلى الشر، فيلحقه خاطر الإيمان فيدعو إلى الخير، فتنبعث النفس بشهوتها إلى نصرة خاطر الشر، فتقوى الشهوة، فينبعث ____، فيدفع في وجه الهوى ويقبح فعله", "o": ["العقل", "أنساها", "تسهيل", "الرحمن"], "h": "راجع: ص٥٩٢"}, {"t": "fill", "d": 2, "q": "وأخراوية، كالعلم بالله وصفاته وأفعاله، والعلم بأحوال القلب وآفات ____", "o": ["الأعمال", "كالمريض", "الإجمال", "بإخراجه"], "h": "راجع: ص٥٨٤"}, {"t": "fill", "d": 2, "q": "المثال الثالث: مثل العقل كمثل فارس متصيد، وشهوته كفرسه، وغضبه ككلبه، فمتى كان الفارس حاذقا، وفرسه مروضا، ____ مؤدبا ومعلما، كان جديرا بالنجح، ومتى كان هو في نفسه أخرق، وكان الفرس جموحا، والكلب", "o": ["وكلبه", "العامري", "ويعلى", "المنبت"], "h": "راجع: ص٥٧١"}, {"t": "fill", "d": 2, "q": "الرتبة الثالثة: أن تدخل الدار فتراه بعينك، فهذه هي المعرفة الحقيقية، وهي معرفة الصديقين والمقربين، ثم يتفاوت أهل هذا المقام في ____ العلوم، ودرجات الكشف مثل أن ترى زيدا قريبا منك في وقت إشراق", "o": ["مقادير", "تزيد", "عدوا", "بمذموم"], "h": "راجع: ص٥٨٢"}]}, {"t": "كتاب شرح عجائب القلب - القسم ٣ من ٣", "b": [{"story": ["كتاب شرح عجائب القلب (١٣ من ١٧)، ص٥٨٤", ["قال الله عز وجل: ﴿يَعْلَمُونَ ظَٰهِرًا مِّنَ ٱلْحَيَوٰةِ ٱلدُّنْيَا وَهُمْ عَنِ ٱلْـَٔاخِرَةِ هُمْ غَٰفِلُونَ﴾ [الروم: ٧]، وقال تعالى: ﴿فَأَعْرِضْ عَن مَّن تَوَلَّىٰ عَن ذِكْرِنَا وَلَمْ يُرِدْ إِلَّا ٱلْحَيَوٰةَ ٱلدُّنْيَا ۞ ذَٰلِكَ مَبْلَغُهُم مِّنَ ٱلْعِلْمِ﴾ [النجم: ٢٩ - ٣٠].", "حاشية: (١) في الأصل: «كانسلال».", "حاشية: (٢) في الأصل: «بعثرتك».", "**بيان**", "**الفرق بين الإلهام والتعليم**", "اعلم أن العلوم التي ليست ضرورية وإنما تحصل في القلب في بعض الأحوال يختلف الحال(١) في حصولها، فتارة تهجم على القلب من حيث لا يدري، وتارة تكتسب بطريق الاستدلال والتعلم.", "فأما الذي يهجم على القلب، فمنه مالا يدري العبد كيف حصل، وذلك الإلهام، وهو للأولياء.", "ومنه ما يعرف سببه، وذلك الوحي، وهو للأنبياء.", "ومنه ما يحصل بطريق الاكتساب، وهو يختص بالعلماء.", "وحقيقة القول في هذا: أن القلب مستعد لتجلي الحقائق فيه، وإنما حيل بينه وبينها بالأسباب الخمسة التي سبق ذكرها(٢)، فهي كالحجاب المسدل، والحجاب تارة يزال بيد، وتارة بهبوب ريح تحركه.", "حاشية: (١) في الأصل: «الأحوال».", "حاشية: (٢) تقدمت في الصفحة ٥٨٠ - ٥٨١.", "**بيان**", "**تسلط الشيطان على القلب بالوسواس**", "القلب بأصل فطرته قابل للهدى(١)، وبما(٢) وضع فيه من الشهوة والهوى مائل إلى ذلك، والتطارد فيه بين جندي الملائكة والشياطين دائم إلى أن ينفتح(٣) القلب لأحدهما فيتمكن ويستوطن، ويكون الاجتياز(٤) الثاني اختلاسا، كما قال تعالى: ﴿مِن شَرِّ ٱلْوَسْوَاسِ ٱلْخَنَّاسِ﴾ [الناس: ٤]، وهو الذي إذا ذكر الله خنس، وإذا وقعت الغفلة انبسط.", "وأكثر القلوب قد فتحها جند الشيطان وملكها، فامتلأت بالوساوس الداعية إلى إيثار العاجلة وإطراح الآخرة، ومبدأ استيلائها(٥) اتباع الهوى، ولا يطرد جند الشيطان من القلب إلا ذكر الله تعالى؛ لأنه لا قرار لجنده مع الذكر.", "حاشية: (١) تحرفت في الأصل إلى: «الهوى».", "حاشية: (٢) تحرفت في الأصل إلى: «ربما».", "حاشية: (٣) في (ظ): «ينفسح».", "حاشية: (٤) في (ظ): «اختيار».", "حاشية: (٥) في (ظ): «استلابها».", "**بيان**", "**تفصيل مداخل الشيطان إلى القلب**", "اعلم أن مثل القلب كمثل حصن، والشيطان عدو يريد أن يدخل الحصن ويملكه ويستولي عليه، ولا يمكن حفظ الحصن إلا بحراسة أبوابه وثلمه(١)، ولا يقدر على حراسة أبوابه من لا يعرف أبوابه.", "ولا يتوصل إلى دفع الشيطان إلا بمعرفة مداخله، ومداخل الشيطان وأبوابه صفات(٢) العبد وهي كثيرة، إلا أنا نشير إلى الأبواب العظيمة الجارية مجرى الدروب التي لا تضيق عن كثرة جنود الشيطان."]], "ic": "book"}, {"story": ["كتاب شرح عجائب القلب (١٤ من ١٧)، ص٥٨٧", ["فمن أبوابه العظيمة: الحسد والحرص، ومتى كان العبد حريصا على شيء أعماه حرصه وأصمه، وغطى نور البصيرة التي تعرف مداخل الشيطان، وكذلك إذا كان حسودا، فيجد حينئذ الشيطان الفرصة، فيحسن عند الحريص كل ما يوصله إلى شهوته، وإن كان منكرا وفاحشا، وقد روي أن إبليس ركب السفينة مع نوح، وقال له: إنما أهلك الناس بالحسد والحرص، فبالحسد لعنت، وبالحرص أصبت حاجتي من آدم.", "ومن أبوابه العظيمة: الغضب والشهوة، فإن الغضب غول العقل، وإذا ضعف جند العقل هجم جند الشيطان فلعب بالإنسان، وقد روي أن إبليس يقول: إذا كان العبد حديدا قلبناه كما يقلب الصبيان الكرة. وقال: كيف يغلبني ابن آدم وإذا رضي جئت(٣) حتى أكون في قلبه، وإذا غضب طرت حتى أكون في رأسه.", "حاشية: (١) الثلم: جمع ثلمة، وهي الشق.", "حاشية: (٢) في (ظ): (وصفات).", "حاشية: (٣) تحرفت في الأصل إلى: (حيث).", "ومن أبوابه: حب التزين في المنزل والشياب والأثاث، فلا يزال يدعو إلى عمارة الدار وتزيين سقوفها وحيطانها والتزين بالثياب والأثاث، فيستسخر الإنسان طول عمره في ذلك.", "ومن أبوابه: الشبع، فإنه يقوي الشهوة ويثقل عن الطاعة.", "ومن أبوابه: الطمع في الناس، فإن من طمع في شخص بالغ في الثناء عليه بما ليس فيه، وداهنه(١)، ولم يأمره بمعروف، ولم ينهه عن منكر.", "ومن أبوابه: العجلة وترك التثبت، وقد قال عليه الصلاة والسلام: العجلة من الشيطان، والتأني من الله تعالى.", "وإنما ذمت العجلة؛ لأن العمل ينبغي أن يكون على بصيرة، ولا تحصل البصيرة إلا بالتثبت، وقد أوصى إبليس أعوانه فقال: ائتو بني آدم من قبل العجلة والخفة(٢).", "ومن أبوابه: حب المال، ومتى تمكن من قلب أفسده وحمله على الطلب له من غير وجهه، وأخرجه إلى البخل وخوفه الفقر، فمنع الحقوق اللازمة.", "ومن أبوابه: حمل العوام على التعصبات في المذاهب دون العمل بمقتضاها، فترى من يتعصب لأبي بكر أو لعلي يلبس الحرير ويشرب الخمر، ويظن أن نفس التعصب ينفعه.", "ومن أبوابه: حمل العوام على التفكر في ذات الله وصفاته، وفي أمور لا يبلغها حد عقولهم حتى يشككهم في أصل الدين، ويخيل لهم في الله تعالى خيالا يتقدس عنه، فيصير الإنسان بذلك كافرا أو مبتدعا، وهو مسرور بما وقر في صدره يظن أن ذلك معرفة.", "ومن أبوابه: سوء الظن بالمسلمين، ومن حكم على مسلم بسوء ظنه فقد احتقره وأطلق لسانه بغيبته، ورأى نفسه خيرا منه، وإنما يترشح سوء الظن لخبث الظان؛ لأن المؤمن يطلب المعاذير للمؤمن، والمنافق يبحث عن عيوبه.", "حاشية: (١) داهنه: داراه ولاينه.", "حاشية: (٢) الخفة: الطيش.", "وينبغي للعاقل الاحتراز عن مواقف التهم لئلا يساء به الظن، فقد قال عليه الصلاة والسلام لرجلين رأياه يمشي مع امرأة بالليل: «إنها صفية»."]], "ic": "book"}, {"story": ["كتاب شرح عجائب القلب (١٥ من ١٧)، ص٥٨٩", ["فهذا طرف من ذكر مداخل الشيطان، وعلاج هذه الآفات سد المداخل وتطهير القلب من الصفات المذمومة، وسيأتي لكل صفة منها كتاب إن شاء الله تعالى.", "وإذا قلعت من القلب أصول هذه الصفات بقي للشيطان بالقلب خطرات واجتيازات(١) من غير استقرار، فيمنعه من ذلك الذكر لله تعالى، إلا أنه لا يكون الذكر ذكرا إلا بعد تطهير القلب من الصفات المذمومة، وعمارته بالتقوى، وإلا كان الذكر كحديث النفس، لا يدفع سلطان الشيطان.", "ومثال الشيطان مثال كلب جائع يقرب منك، فإن لم يكن بين يديك لحم أو خبز، فإنه ينزجر بأن تقول له: اخسأ. فمجرد الصوت يدفعه، وإن كان بين يديك شيء من ذلك وهو جائع لم يندفع بمجرد الكلام، فكذلك القلب الخالي عن قوت(٢) الشيطان ينزجر بمجرد الذكر.", "وأما القلوب التي يغلب عليها الهوى، فإنها تدفع حقيقة الذكر إلى حواشي القلب، فلا يتمكن من سويدائه(٣)، فيستقر الشيطان في السويداء.", "وإذا أردت مصداق هذا، فتأمل حالك في صلاتك، وانظر إلى الشيطان كيف يجذب(٤) قلبك في مثل هذه المواضع إلى ذكر السوق وحساب المعاملين وتدبير أمور الدنيا، وذلك لأن القلب مشحون بالأخلاط، فدخول شربة الدواء إليها يثيرها(٥)، وإنما ينبغي استعمال الحمية قبل الشربة، لينتفع بالدواء ويستخرج بقايا محتبسة.", "حاشية: (١) تصحفت في النسخ إلى «اختيارات»، والمثبت من (الإحياء).", "حاشية: (٢) تحرفت في (ظ) إلى: (قرب).", "حاشية: (٣) في النسخ (سويدائها)، والمثبت من (الإحياء)، وسويداء القلب: داخله.", "حاشية: (٤) تصحفت في (ظ) إلى: (يحدث).", "حاشية: (٥) تحرفت في الأصل إلى: (شرها).", "**بيان**", "**مايؤاخذ به العبد من وساوس القلوب وخواطرها ومايعفى عنه**", "اعلم أنه قد عفي عن حديث النفس، ويدخل في ذلك ما همت به، ومن تركه لعائق رجونا له المسامحة، إلا أن يكون عزما، فإن العزم على الخطيئة خطيئة، قال عليه الصلاة والسلام: «إذا التقى المسلمان بسيفيهما، فالقاتل والمقتول في النار» قيل: مابال المقتول؟ قال: «إنه أراد قتل صاحبه».", "وكيف لا تقع المؤاخذة بالعزم والأعمال بالنية؟! وهل الكبر والرياء والعجب إلا أمور باطنة؟! ولو أن إنسانا رأى على فراشه أجنبية وظنها زوجته لم يأثم بوطئها، ولو رأى زوجته فظنها أجنبية أثم، وكل هذا متعلق بقصد القلب.", "فإن قيل: هل يتصور انقلاع الوسواس من القلب؟", "فالجواب: أنه يجوز أن ينقطع الوسواس عن قوم وقتا دون وقت، أو في حال دون حال، فأما على الدوام في كل الأحوال فلا، فإن النبي ﷺ لبس خميصة(١)، فقال: «شغلتني أعلامها». ولبس خاتما ثم رماه، وقال: «نظرة إليكم ونظرة إليه».", "وإنما تزيد الوساوس بأسبابها، ومن أنشب مخالبه في الدنيا وطمع أن يتخلص(٢) من الشيطان، كان كمن انغمس في العسل وظن أن الذباب لا يقع(٣) عليه.", "حاشية: (١) الخميصة: ثوب أسود أو أحمر له أعلام.", "حاشية: (٢) في الأصل: (يخلص)."]], "ic": "book"}, {"story": ["كتاب شرح عجائب القلب (١٦ من ١٧)، ص٥٩٠", ["حاشية: (٣) في الأصل: (يقع).", "**بيان**", "**سرعة تقلب القلوب**", "اعلم أن القلب تكتنفه الصفات التي ذكرناها، وتنصب إليه الآثار من الأبواب التي وصفناها، فكأنه هدف يصاب على الدوام من كل جانب، فإذا أصابه شيء فتأثر به أصابه من جانب آخر ما يضاده فتغير وصفه، فإن الشيطان ينزل به فيدعوه إلى الهوى، فينزل الملك فيصرفه عنه، وتارة يجذبه شيطان إلى شيء وشيطان آخر إلى غيره.", "ولاطلاع رسول الله ﷺ على عظيم(١) صنع الله في القلوب كان يحلف فيقول: «لا ومقلب القلوب». أخبرنا عبد الأول قال: أخبرنا الداوودي قال: أخبرنا ابن أعين قال: أخبرنا الفربري قال: حدثنا البخاري قال: حدثنا محمد بن يوسف عن سفيان عن موسى بن عقبة عن سالم عن ابن عمر قال: كانت يمين رسول الله ﷺ إذا حلف: «لا ومقلب القلوب». انفرد بإخراجه البخاري. وأخبرنا هبة الله بن محمد قال: أخبرنا الحسن بن علي التميمي قال: أخبرنا أبو بكر بن مالك قال: حدثنا عبد الله بن أحمد قال: حدثنا أبي قال: حدثنا حيوة قال: أخبرني أبو هانئ أنه سمع أبا عبد الرحمن الحبلي أنه سمع عبد الله بن عمرو أنه سمع رسول الله ﷺ يقول: «إن قلوب بني آدم كلها بين أصبعين من أصابع الرحمن تبارك وتعالى كقلب واحد يصرف كيف يشاء» ثم قال رسول الله: «اللهم مصرف القلوب اصرف قلوبنا إلى طاعتك». انفرد بإخراجه مسلم.", "وفي حديث أنس عن النبي ﷺ أنه كان يكثر أن يقول: «اللهم يا مقلب القلوب ثبت قلبي على دينك». قال: فقلنا له: يارسول الله آمنا بك وبما جئت به، فهل", "حاشية: (١) في الأصل: (عظم).", "تخاف علينا؟ قال: نعم، إن القلوب بين أصبعين من أصابع الله عز وجل يقلبها تبارك وتعالى».", "أخبرنا عبد الرحمن بن محمد، قال: أخبرنا محمد بن علي الدجاجي قال: أخبرنا علي بن معروف قال: حدثنا محمد بن الهيثم قال: حدثنا أحمد بن عبد الجبار قال: حدثنا أبو بكر بن عياش عن الأعمش عن أبي سفيان عن أنس قال: قال رسول الله ﷺ: «مثل القلب كمثل ريشة بأرض فلاة تقلبها الرياح».", "واعلم أن القلوب في الثبات(١) على الخير والشر والتردد بينهما ثلاثة:", "الأول: قلب عمر بالتقوى، وزكي بالرياضة، وطهر عن خبائث الأخلاق، فتنقدح فيه خواطر الخير من خزائن الغيب، فيمده الملك بالهدى.", "والقلب الثاني: قلب مخذول مشحون بالهوى، مدنس بالخبائث، ملوث بالأخلاق الذميمة، قد ألف عقله خدمة الهوى، فانبسطت فيه الظلمات فقوي فيه سلطان الشيطان لاتساع مكانه بسبب انتشار الهوى، فيقبل عليه بالتزيين والغرور، فيضعف سلطان الإيمان بالوعد والوعيد، ويمتلئ القلب بدخان الهوى، فينعدم النور، ويصير كالعين الممتلئة بالدخان لا يمكنها النظر، فلا يؤثر عنده زجر ولا وعظ."]], "ic": "book"}, {"story": ["كتاب شرح عجائب القلب (١٧ من ١٧)، ص٥٩٢", ["القلب الثالث: قلب يبتدئ فيه خاطر الهوى، فيدعو إلى الشر، فيلحقه خاطر الإيمان فيدعو إلى الخير، فتنبعث النفس بشهوتها إلى نصرة خاطر الشر(٢)، فتقوى الشهوة، فينبعث العقل، فيدفع في وجه الهوى ويقبح فعله ويشبهه بالبهيمة والسبع في تهجمه على الشر وقلة اكتراثه بالعواقب، فتميل النفس إلى نصح العقل، فيحمل الشيطان حملة على العقل ويقوي داعي الهوى، ويقول: أما ترى فلانا وفلانا كيف يطلقون أنفسهم في هواها؟ حتى يعد له جماعة من العلماء، فتميل النفس إلى الشيطان، فيحمل الملك حملة على الشيطان ويقول(٣): هل هلك إلا من نسي", "حاشية: (١) تصحفت في الأصل إلى (النيات).", "حاشية: (٢) سقط من (ظ).", "حاشية: (٣) سقطت من الأصل.", "العاقبة؟ أفتستثقل الصبر عن شهوة ولا تستقل ألم النار؟ أو تغتر بغفلة الناس عن أنفسهم؟ أرأيت لو وقفوا كلهم في الصيف في الشمس ولك بيت بارد أكنت توافقهم أم تطلب المصلحة؟ أفتخالفهم في مر الشمس ولا تخالفهم فيما يؤول إلى النار؟!", "فتميل النفس إلى قول الملك، ويقع التردد بين الجندين إلى أن يغلب على القلب ما هو أولى به من الصفات الملكية أو الشيطانية، فمن خلق للخير يسر له، أو للشر يسر له، ﴿فَمَن يُرِدِ ٱللَّهُ أَن يَهْدِيَهُۥ يَشْرَحْ صَدْرَهُۥ لِلْإِسْلَٰمِ وَمَن يُرِدْ أَن يُضِلَّهُۥ يَجْعَلْ صَدْرَهُۥ ضَيِّقًا حَرَجًا كَأَنَّمَا يَصَّعَّدُ فِى ٱلسَّمَآءِ﴾ [الأنعام: ١٢٥].", "فهذا القدر من شرح أحوال القلب يكفي في معرفة أغوار علم المعاملة وأسرارها، فلينتفع به من لا يقنع بالظواهر ولا يجتزئ بالقشور عن اللباب.", "**آخر كتاب عجائب القلب**(١)", "حاشية: (١) ورد هنا في هامش النسخة (ظ) ما نصه: (آخر الجزء الثامن من أصل الشيخ المصنف)."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "ومثاله: أن يريد الإنسان أن يرى ظهره في المرآة، فإنه إن رفع المرآة بإزاء وجهه لم يكن قد حاذى بها شطر الظهر فلا يظهر فيها الظهر، وإن رفعها وراء ظهره وبإزائه كان قد عدل بالمرآة عن ____ فلا يرى المرآة", "o": ["العين", "بحسدك", "الكربة", "والجلوة"], "h": "راجع: ص٥٨١"}, {"t": "fill", "d": 2, "q": "الأول: قلب عمر بالتقوى، وزكي بالرياضة، وطهر عن خبائث الأخلاق، فتنقدح فيه ____ الخير من خزائن الغيب، فيمده الملك", "o": ["خواطر", "بأيام", "وبئس", "ويكرهون"], "h": "راجع: ص٥٩٢"}, {"t": "fill", "d": 2, "q": "والثاني هو المحرك للأعضاء إلى تحصيل هذه المقاصد، ويعبر عن هذا الثاني بالقدرة، وهي جنود مبثوثة في جميع الأعضاء لاسيما ____ منها والأوتار", "o": ["العضلات", "تفصيلا", "وأوضاع", "الحراسة"], "h": "راجع: ص٥٦٨"}, {"t": "fill", "d": 2, "q": "اعلموا وفقكم الله أن أشرف ما في الإنسان قلبه، فهو العالم بالله، العامل له، الساعي إليه، المتقرب المكاشف بما عنده، وإنما الجوارح أتباع وخدم للقلب، يستخدمها استخدام الملوك للعبيد، والراعي للرعية، والذي ينتشر على الجوارح من العبادات أنوار القلب، والذي يسري إليها من ____ آثاره، فتارة يظلم بالزلل، وتارة يستنير بالتقوى، ومن عرف قلبه عرف ربه، فأكثر الخلق جاهلون بقلوبهم ونفوسهم، والله يحول بين المرء وقلبه، وحيلولته أن يمنعه من معرفته ومشاهدته", "o": ["الفواحش", "فأحببت", "والمخلط", "نقصان"], "h": "راجع: ص٥٦٣"}, {"t": "fill", "d": 2, "q": "ومن أبوابه العظيمة: الغضب والشهوة، فإن الغضب غول العقل، وإذا ضعف جند العقل هجم جند الشيطان فلعب بالإنسان، وقد روي أن ____ يقول: إذا كان العبد حديدا قلبناه كما يقلب الصبيان الكرة. وقال: كيف يغلبني", "o": ["إبليس", "ليدل", "التسليم", "نعيمها"], "h": "راجع: ص٥٨٧"}, {"t": "fill", "d": 2, "q": "الرتبة الثانية: أن تسمع كلام زيد وصوته في الدار، ولكن من وراء جدار، فتستدل به على كونه في الدار، فيكون هذا التصديق ____ من التصديق بالخبر عنه، هذا إيمان ممزوج بدليل، ويتطرق إليه الخطأ من جهة أن", "o": ["أقوى", "يشاء", "وكانوا", "يشغله"], "h": "راجع: ص٥٨٢"}]}], "sum": [["الصفحات", "ص٥٦١ - ص٥٩٤"]], "_nq": 18}, {"id": "l4", "title": "كتاب رياضة النفس وتهذيب الخلق ومعالجة أمراض القلب", "group": "كتاب رياضة النفس وتهذيب الخلق ومعالجة أمراض القلب", "map": {"center": "كتاب\nرياضة النفس", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "كتاب رياضة النفس وتهذيب الخلق ومعالجة أمراض القلب - القسم ١ من ٣", "b": [{"pic": ["books", "book"], "cap": "ص٥٩٥ - ص٦٢٤"}, {"story": ["كتاب رياضة النفس وتهذيب الخلق ومعالجة أمراض القلب (١ من ١٦)، ص٥٩٥", ["الحمد لله الذي صرف الأمور بتدبيره، وأجرى الأحوال على تقديره، وفوض تحسين الأخلاق إلى العبد وتشميره، واستحثه على تهذيبها بترغيبه وتحذيره، وسهل على خواص عباده إصلاحها بتيسيره.", "أحمده على قليل الإنعام وكثيره، وأصلي على محمد صفيه ونبيه وبشيره ونذيره، وعلى آله وأصحابه ما رقص غصن بورق(١) على غديره، وسلم تسليما كثيرا.", "أما بعد، فالخلق الحسن صفة الأنبياء والصديقين، والأخلاق السيئة سموم قاتلة تنخرط بصاحبها في سلك الشيطان، وأمراض تفوت حياة الأبد، فينبغي تعرف العلل ثم التشمير(٢) في معالجتها.", "ونحن نشير في هذا الكتاب إلى جمل من أمراض القلوب وكيفية القول في معالجتها في الجملة من غير تفصيل لعلاج خصوص الأمراض، فإن ذلك يأتي في بقية الكتب من هذا الربع، وغرضنا الآن النظر الكلي في تهذيب الأخلاق وتمهيد منهاجها، ونحن نذكر ذلك ونجعل علاج البدن مثالا له ليقرب من الأفهام دركه،", "حاشية: (١) الورق: جمع ورقاء، وهي الحمامة.", "حاشية: (٢) تحرفت في الأصل إلى: (التعرف).", "ويتضح ذلك ببيان فضيلة حسن الخلق، ثم بيان حقيقة حسن الخلق، ثم بيان قبول الأخلاق للتغير بالرياضة، ثم بيان السبب الذي به (١-١)ينال حسن الخلق، ثم بيان تفضيل الطريق إلى تهذيب الأخلاق ورياضة النفوس، ثم بيان العلامات التي بها يعرف مرض القلوب، ثم(١-١) بيان الطريق الذي به يتعرف الإنسان عيوب نفسه، ثم بيان شواهد العقل على أن طريق المعالجة للقلوب بترك الشهوات، ثم بيان علامات حسن الخلق، ثم بيان الطريق في رياضة الصبيان في أول النشوء، ثم بيان شروط الإرادة ومقدمات المجاهدة، فهي أحد عشر فصلا تجمع مقاصد الكتاب إن شاء الله تعالى.", "حاشية: (١-١) سقط من (ظ).", "**بيان**", "**فضيلة حسن الخلق وذم سوء الخلق**", "قد ذكرنا في أول كتاب آداب الصحبة فضائل حسن الخلق، فلينظر من ثم لئلا يعاد.", "واعلم أن الناس قد تكلموا في حسن الخلق متعرضين لثمرته لا لحقيقته، ثم لم يستوعبوا جميع ثمراته، بل ذكر كل منهم من ثمراته ما حضر في ذهنه، فقال الحسن(١): حسن الخلق: بسط الوجه، وبذل الندى، وكف الأذى.", "وقال قوم: احتمال الأذى، وبذل المال. وأقوالهم في هذا كثيرة، وكلها يعرض لبعض ثمرات حسن الخلق لا لنفسه.", "وكشف الحقيقة في هذا أن يقال: كثير ما يستعمل ذكر الخلق مع الخلق، فيقال: فلان حسن الخلق والخلق. أي: حسن الظاهر والباطن."]], "ic": "book"}, {"story": ["كتاب رياضة النفس وتهذيب الخلق ومعالجة أمراض القلب (٢ من ١٦)، ص٥٩٧", ["فالمراد بالخلق: الصورة الظاهرة، ويراد بالخلق: الصورة الباطنة، وذلك لأن الإنسان مركب من جسد ونفس، فالجسد مدرك بالبصر، والنفس مدركة بالبصيرة، ولكل واحد منهما هيئة وصورة إما قبيحة، وإما جميلة، والنفس المدركة بالبصيرة أعظم قدرا من الجسد المدرك بالبصر، ولذلك عظم الله سبحانه أمره بأن إضافة إلى نفسه، فقال: ﴿إِنِّى خَٰلِقٌۢ بَشَرًا مِّن طِينٍ فَإِذَا سَوَّيْتُهُۥ وَنَفَخْتُ فِيهِ مِن رُّوحِى﴾ [ص: ٧١ - ٧٢]، فنبه على أن الجسد منسوب إلى الطين، والروح منسوبة إلى الله تعالى.", "والمراد بالنفس والروح هاهنا شيء واحد، فالخلق عبارة عن هيئة للنفس راسخة تصدر عنها الأفعال بسهولة ويسر من غير حاجة إلى فكر وروية، فإن كانت", "حاشية: (١) يعني الحسن البصري رحمه الله.", "الهيئة بحيث تصدر عنها الأفعال الجميلة المحمودة عقلا وشرعا سميت الهيئة خلقا حسنا.", "وإن كان الصادر منها أفعالا قبيحة سميت الهيئة التي هي المصدر خلقا سيئا.", "وإنما قلنا: إنها هيئة راسخة، لأن من يصدر منه بذل المال على الندور لحالة عارضة لا يقال: خلقه السخاء، ما لم يثبت ذلك في نفسه ثبوت رسوخ.", "وإنما شرحنا أن تصدر منه الأفعال بسهولة من غير روية؛ لأن من تكلف بذل المال والسكوت عند الغضب بجهد وروية لا يقال: خلقه السخاء والحلم.", "فها هنا أربعة أمور:", "أحدها: فعل الجميل والقبيح.", "والثاني: القدرة عليهما.", "والثالث: المعرفة بهما.", "والرابع: هيئة للنفس بها تميل إلى أحد الجانبين وتيسر عليها أحد الأمرين إما الحسن وإما القبيح.", "وليس الخلق عبارة عن الفعل، فرب شخص خلقه السخاء، فلا يبذل، إما لفقد المال أو لمانع، وربما يكون خلقه البخل وهو يبذل المال لباعث أو لرياء.", "وليس هو عبارة عن القوة؛ لأن نسبة القوة إلى الإمساك والإعطاء بل إلى الضدين واحدة، وكل إنسان قد خلق بالفطرة قادرا على الإعطاء والإمساك، وذلك لا يوجب خلق البخل ولا خلق السخاء.", "ولا هو عبارة عن المعرفة، فإن المعرفة تتعلق بالجميل والقبيح جميعا على وجه واحد، بل هو عبارة عن المعنى الرابع، وهي الهيئة التي(١) بها تستعد النفس لأن يصدر منها الإمساك أو البذل.", "حاشية: (١) سقطت من الأصل.", "فالخلق إذن عبارة عن هيئة النفس وصورتها الباطنة، كما أن حسن الصورة الظاهرة مطلقا لا يتم بحسن العينين دون الأنف والفم والخد، بل لابد من حسن الجميع ليتم حسن الظاهر، فكذلك في الباطن أربعة أركان لابد من الحسن في جميعها حتى يتم حسن الخلق، فإذا استوت الأركان الأربعة واعتدلت وتناسبت حصل حسن الخلق، وهي: قوة العلم، وقوة الغضب، وقوة الشهوة، وقوة العدل بين هذه القوى الثلاث."]], "ic": "book"}, {"story": ["كتاب رياضة النفس وتهذيب الخلق ومعالجة أمراض القلب (٣ من ١٦)، ص٥٩٩", ["أما قوة العلم فحسنها وصلاحها في أن تصير بحيث يسهل بها درك الفرق بين الصدق والكذب في الأقوال، وبين الحق والباطل في الاعتقادات، وبين القبيح والجميل في الأفعال، وإذا صلحت هذه القوة أثمرت الحكمة، والحكمة رأس الأخلاق الحسنة.", "وأما قوة الغضب، فحسنها في أن تقتصر انقباضها وانبساطها على حد ما تقتضيه الحكمة، وكذلك الشهوة حسنها وصلاحها في أن تكون تحت إشارة، الحكمة - أعني إشارة الدين والعقل.", "وأما قوة العدل فهي في ضبط قوة الغضب والشهوة تحت إشارة العقل والشرع، فالعقل منزلته منزلة الناصح المشير وقوة العدل هي القدرة، ومنزلتها منزلة المنفذ الممضي إشارة العقل، والغضب هو الذي تنفذ فيه الإشارة.", "ومثال الغضب مثال كلب الصيد، فإنه يحتاج إلى أن يؤدب حتى يكون استرساله وتوقفه بحسب الإشارة لا بحسب هيجان النفس.", "ومثال الشهوة مثال الفرس الذي يركب في طلب الصيد، فإنه تارة يكون مروضا مؤدبا، وتارة لا يكون.", "فمن استوت فيه هذه الصفات واعتدلت فهو حسن الخلق بالإضافة إلى ذلك المعنى خاصة، كالذي يحسن بعض أجزاء وجهه دون بعض.", "وحسن القوة الغضبية واعتدالها يعبر عنه بالشجاعة، وحسن قوة الشهوة واعتدالها يعبر عنه بالعفة، فإن مالت قوة الغضب عن الاعتدال إلى طرف الزيادة سمي ذلك", "تهورا، وإن مالت إلى الضعف والنقصان سمي ذلك جبنا وخورا، وإن مالت قوة الشهوة إلى طرف الزيادة سمي ذلك شرها، وإن مالت إلى النقصان سمي جمودا.", "والمحمود هو الوسط، وهو الفضيلة، والطرفان رذيلتان مذمومتان.", "والعدل إذا(١) فات فليس له طرفان زيادة ونقصان، بل له ضد واحد، وهو الجور.", "وأما الحكمة فيسمى إفراطها عند الاستعمال في الأغراض الفاسدة خبا(٢)، ويسمى تفريطها بلها، والوسط هو الذي يخص باسم الحكمة.", "فإذن أمهات الأخلاق وأصولها أربعة: الحكمة والشجاعة والعفة والعدل.", "ونعني بالحكمة حالة للنفس بها يدرك الصواب من الخطأ في جميع الأفعال(٣) الاختيارية.", "ونعني بالعدل حالة للنفس وقوة بها تسوس الغضب والشهوة وتحملهما على مقتضى الحكمة وتضبطهما في الاسترسال والانقباض على حسب مقتضاها.", "ونعني بالشجاعة كون قوة الغضب منقادة للعقل في إقدامها وإحجامها.", "ونعني بالعفة تأدب قوة الشهوة بتأديب(٤) العقل والشرع. فمن اعتدال هذه الأصول الأربعة تصدر الأخلاق الجميلة كلها، إذ من اعتدال قوة العقل يصدر حسن التدبير وجودة الذهن وثقابة(٥) الرأي، وإصابة الظن والتفطن لدقائق(٦) الأعمال وخفايا آفات النفوس.", "ومن إفراطها يصدر المنكر والخداع والدهاء.", "حاشية: (١) في الأصل: (فإذا).", "حاشية: (٢) الخب: الخداع والغش.", "حاشية: (٣) في الأصل: (الأحوال).", "حاشية: (٤) في النسخ: (بتعديل) والمثبت من الإحياء.", "حاشية: (٥) في الأصل: (نقاية)، وثقابة الرأي: نفوذه في إصابة الصواب.", "حاشية: (٦) في الأصل: (بدقائق)."]], "ic": "book"}, {"story": ["كتاب رياضة النفس وتهذيب الخلق ومعالجة أمراض القلب (٤ من ١٦)، ص٦٠١", ["ومن تفريطها يصدر البله والحمق والجنون، والفرق بين الحمق والجنون أن الأحمق مقصوده صحيح ولكن سلوكه للطريق فاسد فلا تكون له رؤية صحيحة في طريق الوصول إلى الغرض، وأما المجنون فإنه يختار ما لا ينبغي أن يختار، فيكون أصل إيثاره واختياره فاسدا.", "وأما خلق(١) الشجاعة فيصدر منه الكرم والنجدة والشهامة(٢) والاحتمال والحلم والثبات وكظم الغيظ والوقار والتودة وأمثالها، وهي أخلاق محمودة.", "وأما إفراطها، وهو التهور، فيصدر منه الصلف والبذخ والاستشاطة والتكبر والعجب.", "وأما تفريطها فيصدر منه المهانة والذلة والجزع والخساسة وصغر النفس والانقباض عن تناول الحق الواجب.", "وأما خلق العفة فيصدر منه السخاء والحياء والصبر والمسامحة والقناعة والورع والطلاقة(٣) والظرف وقلة الطمع.", "وأما ميلها إلى الإفراط والتفريط فيصدر منه الحرص والشره والوقاحة والخبث والتبذير والتقتير والرياء والملق والحسد والشماتة وغير ذلك.", "فأمهات محاسن الأخلاق هذه الأربع، وهي: الحكمة والشجاعة والعفة والعدل، والباقي فروعها، فمن جمع كمال هذه الأخلاق استحق أن يكون بين الخلق ملكا مطاعا يرجعون إليه ويقتدون به، ومن انفك عن هذه الأخلاق واتصف بأضدادها، فينبغي أن يبعد كما يبعدالشيطان، فالإيمان بالله ورسوله ثمرة العقل ومنتهى الحكمة، والمجاهدة بالمال هو السخاء الذي يرجع إلى ضبط قوة الشهوة، والمجاهدة بالنفس هي الشجاعة التي ترجع إلى استعمال قوة الغضب على شرط", "حاشية: (١) تحرفت في (ظ) إلى: (حكم).", "حاشية: (٢) تحرفت في (ظ) إلى: (الشهادة).", "حاشية: (٣) سقطت من (ظ).", "العقل وحد الاعتدال، وقد وصف الله تعالى الصحابة فقال: ﴿أَشِدَّآءُ عَلَى ٱلْكُفَّارِ رُحَمَآءُ بَيْنَهُمْ﴾ [الفتح: ٢٩]، فأشار إلى أن للشدة موضعا وللرحمة موضعا، وليس الكمال في الشدة بكل حال، ولا في الرحمة بكل حال.", "فهذا بيان معنى الخلق وحسنه وقبحه، وبيان أركانه وثمراته وفروعه.", "**بيان**", "**قبول الأخلاق للتغيير بطريق الرياضة**", "قد زعم بعض من غلبت عليه البطالة فاستثقل الرياضة أن الأخلاق لا يتصور تغييرها، واستدل على ذلك بشيئين:", "**أحدهما**: أن الخلق هو صورة الباطن، كما أن الخلق هو صورة الظاهر، فكما لا يمكن تغيير الخلقة الظاهرة بأن يجعل القبيح حسنا، فكذلك لا يمكن تغيير الخلقة الباطنة.", "**والثاني**: أن الغضب والشهوة من مقتضى المزاج والطبع، ولا يمكن تغيير الطبع.", "**والجواب**: أنه لو كانت الأخلاق لا تقبل التغيير لم يكن للمواعظ والوصايا معنى، وقد قال عليه الصلاة والسلام: «حسنوا أخلاقكم». وكيف ينكر تغيير الأخلاق ونحن نرى الصيد المتوحش ينقل إلى الأنس، والكلب يعلم ترك الأكل، والفرس يعلم حسن المشي وجودة الانقياد."]], "ic": "book"}, {"story": ["كتاب رياضة النفس وتهذيب الخلق ومعالجة أمراض القلب (٥ من ١٦)، ص٦٠٣", ["وكشف الغطاء عن ذلك أنا نقول: ما خلق كاملا لا يحتمل التغيير لا يتغير، وما وجد ناقصا وجعلت فيه قوة الكمال إن وجد شرطه أمكن تكميله، فإن النواة ليست نخلة، ولكنها خلقت خلقة يمكن أن تصير نخلة بشرط أن يضاف إليها التربية، وإذا كانت النواة تقبل الانتقال لأنها هيئت لذلك، فالأخلاق أقبل.", "ولسنا نريد برياضة الغضب والشهوة قمع(١) أثرهما بالكلية؛ لأنه لا يمكن، وإنما نريد أن نقودهما بالرياضة إلى مقام الاعتدال، وذلك ممكن، ولذلك أمرت به", "حاشية: (١) في (ظ): (منع).", "الشريعة، إلا أن بعض المروض سريع القبول للصلاح، وبعضه مستصعب، ولاختلاف الأشياء في ذلك سببان:", "**أحدهما**: قوة الغريزة في أصل الجبلة وامتداد مدة الوجود، وأصعب الأحوال أمرا وأعصاه على التغيير الشهوة، فإن الشهوة أقدم وجودا في الإنسان، لأنها مخلوقة في فطرة الصبي، والغضب يخلق له بعد ذلك بمدة.", "**والثاني**: أن الخلق قد يتأكد بكثرة العمل بمقتضاه وباعتقاد كونه حسنا، وبإدامة الرياضة وتعريف الصواب يتقشع غيم العادة.", "وأما خيال من وقع له أن مافي الجبلة لا يتغير فقد بينا أنه ليس المقصود قمع هذه الصفات بالكلية، كيف والشهوة إنما خلقت لفائدة ضرورية في الجبلة؟ ولو انقطعت شهوة الطعام لهلك الإنسان، أو شهوة الوقاع لانقطع النسل، أو انعدم الغضب بالكلية لم يدفع الإنسان عن نفسه ما يهلكه، ومتى بقي أصل الشهوة بقي حب المال الذي يوصله إلى الشهوة.", "وإنما المطلوب من الرياضة رد الشهوة إلى الاعتدال الذي هو وسط بين الإفراط والتفريط، فكذلك المطلوب من الغضب حسن الحمية وأن يخلو عن التهور والجبن جميعا، وقد قال عز وجل ﴿أَشِدَّآءُ عَلَى ٱلْكُفَّارِ﴾ [الفتح: ٢٩]، وإنما تصدر الشدة عن الغضب، ولو بطل الغضب لامتنع جهاد الكفار، وكيف يقصد قلع الغضب والرسول ﷺ يقول: «إنما أنا بشر أغضب كما يغضب البشر». وقد قال تعالى: ﴿وَٱلْكَٰظِمِينَ ٱلْغَيْظَ﴾ [آل عمران: ١٣٤]، وما قال: الفاقدين الغيظ.", "ومما يدل على أن المراد من الرياضة الاعتدال أن السخاء خلق مطلوب شرعا، وهو وسط بين طرفي التبذير والتقتير، وقد أثنى الله عز وجل عليه فقال: ﴿وَٱلَّذِينَ إِذَآ أَنفَقُوا۟ لَمْ يُسْرِفُوا۟ وَلَمْ يَقْتُرُوا۟ وَكَانَ بَيْنَ ذَٰلِكَ قَوَامًا﴾ [الفرقان: ٦٧]، وكذلك المطلوب في شهوة الطعام الاعتدال دون الشره والتقلل، قال الله عز وجل: ﴿وَكُلُوا۟ وَٱشْرَبُوا۟ وَلَا تُسْرِفُوٓا۟﴾ [الأعراف: ٣١]، إلا أن الشيخ المرشد للمريد إذا رأى له ميلا إلى الغضب والشهوة حسن أن يبالغ في ذمهما على الإطلاق ليرده إلى التوسط.", "**بيان**", "**السبب الذي به ينال حسن الخلق في الجملة**"]], "ic": "book"}, {"story": ["كتاب رياضة النفس وتهذيب الخلق ومعالجة أمراض القلب (٦ من ١٦)، ص٦٠٥", ["قد بينا أن حسن الخلق يكون بالاعتدال، وهذا الاعتدال تارة يحصل بكمال في الفطرة منحة الخالق، فكم من صبي يخلق صادقا سخيا حكيما، وتارة يحصل بالاكتساب وذلك بالرياضة، وهي حمل النفس على الأعمال الجالبة(١) للخلق المطلوب، فمن أراد أن يحصل خلق الجود فليتكلف فعل الجواد من البذل ليصير ذلك طبعا له، وكذلك من أراد التواضع تكلف أفعال المتواضعين، وكذلك جميع الأخلاق المحمودة.", "وإن كان بين المحب لما يفعله والمتكلف لما يكرهه تباعد إلا أن للعادة أثرا، فمن أراد أن يكون كاتبا تعاطى فعل الكتاب، أو فقيها تعاطى فعل الفقهاء من التكرار حتى تنعطف على قلبه صفة الفقه، إلا أنه لا ينبغي أن يطلب تأثير ذلك في يومين وثلاثة، وإنما يؤثر في الدوام، كما لا يطلب في النمو علو القامة في يومين وثلاثة.", "وكما لا ينبغي أن يستهان بقليل الطاعات، فإن دوامها يؤثر، كذلك لا يستهان بيسير الذنوب، وكما أن تعاطي أسباب الفضائل يؤثر في النفس ويغير طبعها، فمساكنة الكسل تصير عادة فيحرم كل خير، وقد تكتسب الأخلاق الحسنة بمصاحبة أهل الخير، فإن الطبع لص يسرق الخير والشر.", "حاشية: (١) تصحفت في الأصول إلى: (الخالية).", "**بيان**", "**تفصيل الطريق إلى تهذيب الأخلاق**", "قد عرفت أن الاعتدال في الأخلاق هو صحة في النفس والميل عن الاعتدال سقم ومرض، فاعلم أن مثال النفس في علاجها بمحو الرذائل وكسب الفضائل مثال البدن، وعلاجه بمحو العلل عنه واكتساب الصحة له وجلبها إليه، فكما أن الغالب على أصل(١) المزاج الاعتدال والعلة عارضة، فكذلك كل مولود يولد على الفطرة، وإنما أبواه يهودانه وينصرانه، وذلك بالتعويد والتعليم.", "وكما أن البدن في الابتداء لا يخلق كاملا وإنما يكمل بالنشوء والتربية بالغذاء، فكذلك النفس تخلق ناقصة قابلة للكمال، وإنما تكمل بالتزكية وتهذيب الأخلاق والتغذية بالعلم.", "وكما أن البدن إن كان صحيحا فشأن الطبيب تمهيد القانون الحافظ للصحة، وإن كان مريضا فشأنه جلب الصحة إليه، فكذا النفس إن كانت زكية طاهرة مهذبة الأخلاق فينبغي أن يسعى لحفظها وحفظ صحتها وجلب مزيد قوة إليها واكتساب زيادة صفاء لها، وإن كانت عديمة الكمال والصفاء فينبغي أن يسعى لجلب ذلك إليها.", "وكما أن العلة المغيرة لاعتدال البدن الموجبة للمرض لا تعالج إلا(٢) بضدها إن كانت من حرارة فبالبرودة، وإن كانت من برودة فبالحرارة، فكذا الرذيلة التي هي مرض القلب علاجها بضدها، فيعالج مرض الجهل بالتعلم، ومرض البخل بالتسخي(٣)، ومرض الكبر بالتواضع ومرض الشره(٤) بالكف عن المشتهى تكلفا.", "حاشية: (١) ليست في (ظ).", "حاشية: (٢) سقطت من (ظ).", "حاشية: (٣) أي حض النفس على السخاء.", "حاشية: (٤) في الأصل: (الشهوة)."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "وأما خيال من وقع له أن مافي الجبلة لا يتغير فقد بينا أنه ليس المقصود قمع هذه الصفات بالكلية، كيف والشهوة إنما خلقت لفائدة ____ في الجبلة", "o": ["ضرورية", "انبساطا", "تعطوا", "همام"], "h": "راجع: ص٦٠٤"}, {"t": "fill", "d": 2, "q": "فأما تفصيل الرياضة في كل صفة، فسيأتي بيانه، فإن أغلب الصفات على الإنسان شهوة بطنه وفرجه ولسانه، ثم الغضب الذي هو كالجند لحماية الشهوات، ثم مهما أحب الإنسان شهوة البطن والفرج وأنس بها أحب الدنيا ولا يتمكن منها إلا بالمال والجاه، وإذا طلب المال والجاه حدث فيه الكبر والعجب والرياسة، ____ ظهر ذلك ولم تسمح نفسه بترك الدين رأسا تمسك من الدين بما فيه الرياسة وغلب عليه الغرور", "o": ["فإذا", "للتبن", "فيكون", "الصفوة"], "h": "راجع: ص٦٢٣"}, {"t": "fill", "d": 2, "q": "ويحسن أن يسمح له بعد خروجه من المكتب في لعب جميل يستريح به من تعب ____، كما قيل", "o": ["التأديب", "لجهنم", "والديه", "واستحالة"], "h": "راجع: ص٦٢٠"}, {"t": "fill", "d": 2, "q": "وكشف الغطاء عن ذلك أنا نقول: ما خلق كاملا لا يحتمل التغيير لا يتغير، وما وجد ناقصا وجعلت فيه قوة الكمال إن وجد شرطه أمكن ____، فإن النواة ليست نخلة، ولكنها خلقت خلقة يمكن أن تصير نخلة بشرط أن يضاف", "o": ["تكميله", "وغيرها", "غيظه", "رئاسة"], "h": "راجع: ص٦٠٣"}, {"t": "fill", "d": 2, "q": "الطريق الثالث: أن يستفيد معرفة عيوب نفسه من ألسنة أعدائه، فإن عين السخط تبدي المساوي، وانتفاع الإنسان بعدو مشاحن يذكر عيوبه أكثر من انتفاعه بصديق مداهن ____ عنه", "o": ["يخفي", "تقديم", "فليجلس", "هفوة"], "h": "راجع: ص٦١٢"}, {"t": "fill", "d": 2, "q": "فإذا بدت فيه مخايل التمييز وأولها الحياء، وذلك من إشراق نور العقل عليه، فتلك بشارة النجابة، لأنها تدل على اعتدال ____ وصفاء القلب، وهي مبشرة بكمال العقل عند البلوغ، وهذا يستعان على تأديبه بحياته", "o": ["الأخلاق", "ليتحقق", "أطلقوا", "محروما"], "h": "راجع: ص٦١٨"}]}, {"t": "كتاب رياضة النفس وتهذيب الخلق ومعالجة أمراض القلب - القسم ٢ من ٣", "b": [{"story": ["كتاب رياضة النفس وتهذيب الخلق ومعالجة أمراض القلب (٧ من ١٦)، ص٦٠٧", ["وكما أنه لابد من احتمال مرارة الدواء وشدة الصبر عن المشتهيات لعلاج الأبدان المريضة كذلك لابد من احتمال مرارة المجاهدة والصبر لمداواة مرض القلب بل هو أولى، فإن مرض البدن يخلص منه الموت، ومرض القلب عذاب يدوم بعد الموت أبدا، وكما أن كل مبرد لا يكفي لعلة سببها الحرارة إلا إذا كان على حد مخصوص، ويختلف ذلك بالشدة والضعف والكثرة والقلة، ولابد له من عيار يعرف به مقدار النافع منه، فإن لم يحفظ عياره زاد الفساد، فكذلك ما تعالج به الأخلاق، فإن الطبيب لا يعالج مالم يعرف أن العلة من حرارة أو برودة، فإن كانت من حرارة نظر إلى درجتها، هل هي ضعيفة أو قوية، فإذا عرف ذلك التفت إلى أحوال البدن وأحوال الزمان وسن المريض وصناعته وأحواله، ثم عالج بحسب ذلك، فكذلك المعلم الذي يطب نفوس المريدين ينبغي له أن لا يهجم عليهم بالرياضة في(١) فن مخصوص حتى يعرف أخلاقهم وأمراضهم، إذ ليس علاج كل مرض واحدا؛ فإذا رأى جاهلا بالشرع علمه، وإذا رأى متكبرا حمله على ما يوجب التواضع، أو شديد الغضب ألزمه الحلم، وإن رآه لا يسخو بترك خلقه درجة إلى التغيير.", "وليس غرضنا ذكر دواء كل مرض؛ لأن ذلك سيأتي في بقية الكتب إن شاء الله تعالى، وإنما الغرض الآن التنبيه على أن الطريق الكلي مخالفة النفس فيما ألفت من المذمومات.", "وأشد حاجة الرائض لنفسه إلى قوة العزم، فمتى كان مترددا بعد فلاحه(٢)، ومتى أحس من نفسه ضعف العزم تصبر، فإن نقضت نفسه عزيمتها عاقبها لئلا تعاود، كما قال رجل لنفسه: تتكلمين فيما لا يعنيك، لأعاقبنك بصوم سنة.", "حاشية: (١) في الأصل: (إلى).", "حاشية: (٢) تحرفت في (ظ) إلى: (فلا وجه).", "**بيان**", "**علامات مرض القلب وعلامات عوده إلى الصحة**", "اعلم أنه كما أن كل عضو من أعضاء البدن خلق لفعل خاص به، وإنما مرضه أن يتعذر عليه الفعل الذي خلق له حتى لا تصدر منه أصلا، أو تصدر مع نوع من الاضطراب، فمرض اليد أن يتعذر عليها البطش، ومرض العين أن يتعذر عليها الإبصار، ومرض القلب أن يتعذر عليه(١) فعله الخاص به الذي خلق لأجله وهو العلم والحكمة والمعرفة وحب الله تعالى وعبادته وإيثار ذلك على كل شهوة.", "ولو أن الإنسان عرف كل شيء، ولم يعرف الله تعالى كأنه لم يعرف شيئا، وعلامة المعرفة المحبة فمن عرف الله أحبه، وعلامة المحبة أن لا يؤثر عليه شيئا من المحبوبات، فمن آثر عليه شيئا من المحبوبات فقلبه مريض، كما أن المعدة التي تؤثر أكل الطين على الخبز، أو قد سقطت عنها شهوة الخبز مريضة."]], "ic": "book"}, {"story": ["كتاب رياضة النفس وتهذيب الخلق ومعالجة أمراض القلب (٨ من ١٦)، ص٦٠٨", ["ومرض القلب خفي قد لا يعرفه صاحبه فلذلك يغفل عنه، فإن عرفه صعب عليه الصبر على مرارة دوائه؛ لأن دواءه مخالفة الهوى، وذلك نزع الروح، وإن وجد من نفسه الصبر لم يجد طبيبا حاذقا يعالجه، فإن الأطباء هم العلماء، وقد استولى المرض عليهم، والطبيب المريض قل ما يلتفت إلى علاجه، فلهذا صار الداء عضالا والمرض مزمنا، واندرس هذا العلم وأنكر بالكلية طب القلوب ومرضها، وأقبل الناس على أعمال ظاهرها عبادات وباطنها عادات ومراءاة، فهذه علامة أصل المرض.", "فأما علامة عوده إلى الصحة بعد المعالجة، فهو أن ينظر في العلة التي يعالجها، فإن كان يعالج داء البخل، فعلاجه ببذل المال وإنفاقه، ولكنه قد يبذل", "حاشية: (١) في الأصل: (عليها).", "المال إلى حد يصير به مبذرا، فيكون التبذير أيضا داء، ويكون كمن يعالج البرودة بالحرارة حتى تغلب الحرارة، وهو أيضا داء، بل المطلوب الاعتدال بين الحرارة والبرودة، وكذلك المطلوب الاعتدال بين التقتير والتبذير حتى يكون على الوسط، فإن أردت أن تعرف الوسط، فانظر إلى الفعل الذي يوجبه الخلق المحذور، فإن كان أسهل عليك وألذ من الذي يضاده، فالغالب عليك ذلك الخلق الموجب له، مثل أن يكون إمساك المال وجمعه ألذ عندك وأيسر عليك من بذله لمستحقيه، فاعلم أن الغالب عليك خلق البخل، فزد في المواظبة على البذل، فإن صار البذل للمستحق ألذ عندك وأخف عليك من الإمساك بالحق فقد غلب عليك التبذير، فارجع إلى المواظبة على الإمساك.", "ولا تزال تراقب نفسك وتستدل على خلقك بتيسير الأفعال وتعسرها حتى تنقطع علاقة قلبك عن المال، فلا تميل إلى بذله ولا إلى إمساكه، بل يصير عندك كالماء، فلا تميل إلى بذله ولا إلى إمساكه، بل يصير عندك كالماء، فلا تطلب فيه إلا إمساكه لحاجة محتاج (١-١)أو بذله لحاجة محتاج(١-١)، ولا يرجع عندك البذل على الإمساك، وكل قلب صار كذلك فقد جاء الله سليما عن هذا المقام خاصة، ويجب أن يكون سليما عن سائر الأخلاق حتى لا يكون له علاقة بشيء مما يتعلق بالدنيا حتى ترحل النفس عن الدنيا منقطعة العلائق عنها، غير ملتفتة إليها ولا متشوفة إلى أسبابها، فحينئذ ترجع إلى ربها رجوع النفس المطمئنة.", "ولما كان الوسط الحقيقي بين الطرفين في غاية الغموض بل هو أدق من الشعر وأحد من السيف، فلا جرم من استوى على(٢) هذا الصراط المستقيم في الدنيا جاز على مثل هذا الصراط في الآخرة، وقلما ينفك العبد عن ميل عن الصراط المستقيم - أعني الوسط - حتى لا يميل إلى أحد الجانبين، فيكون قلبه متعلقا بالجانب الذي مال إليه، فلذلك لا ينفك عن عذاب ما واجتاز على النار وإن كان مثل البرق.", "حاشية: (١-١) سقطت من الأصل.", "حاشية: (٢) في الأصل: (إلى)."]], "ic": "book"}, {"story": ["كتاب رياضة النفس وتهذيب الخلق ومعالجة أمراض القلب (٩ من ١٦)، ص٦١٠", ["ولأجل عسر الاستقامة قيل للعبد: قل في كل يوم مرات ﴿ٱهْدِنَا ٱلصِّرَٰطَ ٱلْمُسْتَقِيمَ﴾ [الفاتحة: ٦]، ورأى بعضهم رسول الله ﷺ (١-١)في المنام(١-١)، فقال: يارسول الله، قلت: شيبتني هود(٢). فلم قلت ذلك؟ قال: لقوله تعالى: ﴿فَٱسْتَقِمْ كَمَآ أُمِرْتَ﴾ [هود: ١١٢](٣).", "فالاستقامة على سواء السبيل في غاية الغموض، ولكن ينبغي أن يجتهد الإنسان في القرب من الاستقامة إن لم يقدر على حقيقة الاستقامة، فمن أراد النجاة فليعلم أنه لا نجاة إلا بالعمل الصالح، ولا تصدر الأعمال الصالحة إلا عن الأخلاق الحسنة، فليتفقد كل عبد صفاته وأخلاقه، وليشتغل بعلاج واحد منها بعد واحد.", "حاشية: (١-١) سقط من الأصل.", "حاشية: (٢) بعدها في الأصل: (وأخواتها).", "حاشية: (٣) الرائي هو محمد بن عمر بن شبويه الشبوي المروزي راوي صحيح البخاري عن أبي عبد الله الفربري، كان من كبار مشايخ الصوفية، توفي نحو سنة (٣٨٠)هـ. والخبر في الرسالة القشيرية: ٩٤، وشعب الإيمان للبيهقي (٢٤٣٩)، وتفسير القرطبي ١١/ ٢٢٥، وسير أعلام النبلاء ١٦/ ٤٢٣ - ٤٢٤، والدر المنثور للسيوطي ٨/ ٩، وجامع العلوم والحكم ١/ ٥٠٩.", "**بيان**", "**الطريق الذي به يتبين الإنسان عيوب نفسه**", "اعلم أن الله تعالى إذا أراد بعبد خيرا بصره بعيوب نفسه، فمن كملت بصيرته لم تخف عليه عيوبه، وإذا عرف العيوب أمكنه العلاج، ولكن أكثر الخلق جاهلون بعيوب أنفسهم، يرى أحدهم القذى(١) في عين أخيه ولا يرى الجذع في عين نفسه، فمن أراد أن يقف على عيب نفسه، فله أربع طرق:", "الطريق الأول: أن يجلس بين يدي شيخ بصير بعيوب النفس، مطلع على خفايا الآفات ويحكمه على نفسه، ويتبع إشارته في مجاهدته، فيعرفه الشيخ عيب نفسه، ويعرفه طريق علاجه، وهذا أمر قد عز في هذا الزمان وجوده، فمن وقع (٢-٢)به فقد وقع(٢-٢) بالطبيب الحاذق، فلا ينبغي أن يفارقه.", "الطريق الثاني: أن يطلب صديقا صدوقا بصيرا متدينا وينصبه رقيبا على نفسه ليلاحظ أحواله وأفعاله، فينبهه على المكروه من أخلاقه وأفعاله وعيوبه الباطنة والظاهرة، وقد كان عمر بن الخطاب رضي الله عنه يقول: رحم الله امرأ أهدى إلينا عيوبنا.", "وسأل سلمان لما قدم عليه عن عيوبه، فقال: سمعت أنك جمعت بين أدمين(٣) على مائدة، وأن لك حلتين؛ حلة بالنهار وحلة بالليل. فقال: هل بلغك غير هذا؟ قال: لا. قال: أما هذان فقد كفيتهما.", "وكان يسأل حذيفة: هل أنا من المنافقين؟ وهذا لأن كل من علت مرتبته في اليقظة زاد اتهامه لنفسه، إلا أن هذا قد عسر أيضا؛ لأنه قد قل في الأصدقاء من", "حاشية: (١) القذى: جمع قذاة، وهي ما يقع في العين من تبن وتراب ووسخ.", "حاشية: (٢-٢) سقط من (ظ).", "حاشية: (٣) الأدم والإدام: الطعام."]], "ic": "book"}, {"story": ["كتاب رياضة النفس وتهذيب الخلق ومعالجة أمراض القلب (١٠ من ١٦)، ص٦١٢", ["يترك المداهنة فيخبر بالعيب أو يترك الحسد فلا يزيد على القدر الواجب، فإن المداهن يخفي بعض عيوبك، والحسود يرى ما ليس بعيب عيبا، وقد كان السلف يحبون من ينبههم على عيوبهم، ونحن الآن أبغض الناس إلينا من يعرفنا عيوبنا، وهذا دليل على ضعف إيماننا؛ لأن الأخلاق السيئة كالعقارب، ولو أن منبها نبهنا على أن تحت ثوب أحدنا عقربا لتقلدنا له منة واشتغلنا بقتل العقرب، وإنما نكاية لدغها على البدن ولا يدوم ألمها أكثر من يوم، ونكاية الأخلاق الرديئة على القلب، وألمها في الآخرة دائم، فكوننا لا نفرح بقول من ينبهنا عليها دليل على ضعف الإيمان.", "الطريق الثالث: أن يستفيد معرفة عيوب نفسه من ألسنة أعدائه، فإن عين السخط تبدي المساوي، وانتفاع الإنسان بعدو مشاحن يذكر عيوبه أكثر من انتفاعه بصديق مداهن يخفي عنه عيوبه.", "الطريق الرابع: أن يخالط الناس، فكل ما يراه مذموما فيما بين الخلق فليجتنبه.", "قيل لعيسى عليه وعلى نبينا السلام: من أدبك؟ فقال: ما أدبني أحد، رأيت جهل الجاهل فجانبته.", "**بيان**", "**الشواهد على أن الطريق في معالجة أمراض القلوب ترك الشهوات**", "اعلم أن شهوات النفوس(١) لم توضع إلا لفائدة قد سبق بيانها، إذ لولا شهوة المطعم ما تنوول الغذاء، ولولا شهوة النكاح لانقطع النسل، وإنما المذموم فضول الشهوات وطغيانها وإن قوما لم يفهموا هذا القدر، فأخذوا يتركون كل ما تشتهيه النفس، وهذا ظلم لها بإسقاط حقها، إذ لها على الآدمي حق لقول الشارع: «إن لنفسك عليك حقا» حتى إن قائلا منهم يقول: منذ كذا وكذا سنة أشتهي كذا فلا أتناوله. وهذا انحراف عن الجادة، فقد كان رسول الله ﷺ يتناول المشتهى من الحلواء والعسل، وكان أحب الشاة إليه الذراع فيطلبها، ويختار الماء البائت، ويقبل المرأة، ويمص اللسان وهذا أقوى تنبيه للشهوة، فلا تلتفتن إلى زاهد قل علمه، فحرم نفسه حظها من المشتهى على الإطلاق، فإنه إلى الظلم أقرب منه إلى العدل.", "وإنما يترك المشتهى إذا صعبت الطريق إليه، مثل أن لا يحصل إلا بوجه مكروه، أو خيف من تناوله انحلال عزم النفس فتطمع النفس في استدامته، أو حذر من ذلك زيادة شبع فيثقل عن عبادة ربه(٢)، فينبغي حينئذ جهاد النفس في إنالتها مرادها، فذاك كالطب للمريض يمدح ولا يذم.", "ولا بأس بالرفق بالنفس لتقوى على السلوك، ومن قويت عزيمته فأطاق جهادها بالكلية إلا أنه لا يمنعها مصالحها، فما أحسن تلك الحال لأنها تكون معه", "حاشية: (١) في (ظ): (النفس).", "حاشية: (٢) ليست في (ظ)."]], "ic": "book"}, {"story": ["كتاب رياضة النفس وتهذيب الخلق ومعالجة أمراض القلب (١١ من ١٦)، ص٦١٤", ["كالبازي(١) تحاط عينه(٢) ليحصل له الفطام عن الطيران وينسى ما كان قد ألفه من ذلك، ثم يطعم على الكف ليأنس بالمطعم، فكذلك من قويت عزيمته يحبس نفسه في الخلوة ليمنع السمع والبصر ما ألفا، ثم يعود نفسه الذكر ليأنس بالمذكور، فليصبر ذو العزم على مضض هذا الأمر، فإنه سيحلو له كما يحلو الفطام للطفل بعد كراهته له، فلو رد إلى الثدي كرهه، ومن عرف قصر العمر بالإضافة إلى مدة حياة الآخرة حمل مشقة سفر أيام لتنعم الأبد، فعند الصباح يحمد القوم السرى(٣).", "حاشية: (١) البازي: جنس من الصقور الصغيرة أو المتوسطة الحجم، تميل أجنحتها إلى القصر، وتميل أرجلها وأذنابها إلى الطول، ومن أنواعه الباشق والبيدق.", "حاشية: (٢) في (ظ): (عينيه).", "حاشية: (٣) يضرب هذا المثل للرجل يتحمل المشقة رجاء الراحة، ويقال: إن أول من قاله خالد بن الوليد رضي الله عنه عندما توجه من اليمامة إلى العراق عبر الصحراء، وحمل معه الماء في بطون مئة من الإبل كما أشار عليه رافع الطائي فلما اجتازها وصل إلى الماء قال:", "لله در رافع أنى اهتدى  فوز من قرار إلى سوى", "خمسا إذا سار به الجيش بكى  ما سارها من قبله إنس يرى", "عند الصباح يحمد القوم السرى  وتنجلي عنهم غيابات الكرى", "ينظر مجمع الأمثال للميداني ١/ ٦٢٣.", "**بيان**", "**علامات حسن الخلق**", "ربما جاهد المريد نفسه حتى ترك فواحش المعاصي ثم ظن أنه قد هذب خلقه واستغنى عن المجاهدة، وليس كذلك، فإن حسن الخلق مجموع صفات المؤمنين، وقد وصفهم الله تعالى فقال: ﴿إِنَّمَا ٱلْمُؤْمِنُونَ ٱلَّذِينَ إِذَا ذُكِرَ ٱللَّهُ وَجِلَتْ قُلُوبُهُمْ﴾ إلى قوله: ﴿أُو۟لَٰٓئِكَ هُمُ ٱلْمُؤْمِنُونَ حَقًّا﴾ [الأنفال: ٢ ـ ٤]، وقال: ﴿ٱلتَّٰٓئِبُونَ ٱلْعَٰبِدُونَ﴾ إلى قوله: ﴿وَبَشِّرِ ٱلْمُؤْمِنِينَ﴾ [التوبة: ١١٢]، وقال: ﴿قَدْ أَفْلَحَ ٱلْمُؤْمِنُونَ﴾ إلى قوله: ﴿ٱلْوَٰرِثُونَ﴾ [المؤمنون: ١ ـ ١٠]، وقال: ﴿وَعِبَادُ ٱلرَّحْمَٰنِ ٱلَّذِينَ يَمْشُونَ عَلَى ٱلْأَرْضِ هَوْنًا﴾ إلى آخر السورة [الفرقان: ٦٣ ـ ٧٧]، فمن أشكل عليه حاله، فليعرض نفسه على هذه الآيات، فوجود جميع هذه الصفات علامة حسن الخلق، وفقد جميعها علامة سوء الخلق، ووجود بعضها دون بعض يدل على البعض دون البعض، فليشتغل بحفظ ما وجده وتحصيل ما فقده.", "وقد وصف رسول الله ﷺ المؤمن(١) بصفات كثيرة وأشار بجميعها إلى محاسن الأخلاق، ففي الصحيحين من حديث أنس عن النبي ﷺ أنه قال: «والذي نفسي بيده، لا يؤمن عبد حتى يحب لأخيه ما يحب لنفسه». وفيهما من حديث أبي هريرة عن النبي ﷺ أنه قال: «من كان يؤمن بالله واليوم الآخر فلا يؤذي جاره، ومن كان يؤمن بالله واليوم الآخر فليكرم ضيفه» و«من كان يؤمن بالله واليوم الآخر فليقل خيرا أو ليصمت».", "وفي حديث أبي هريرة عن النبي ﷺ أنه قال: «أكمل المؤمنين إيمانا أحسنهم خلقا»."]], "ic": "book"}, {"story": ["كتاب رياضة النفس وتهذيب الخلق ومعالجة أمراض القلب (١٢ من ١٦)، ص٦١٥", ["حاشية: (١) في (ظ): (المؤمنين).", "ومن حسن الخلق احتمال الأذى، ففي الصحيحين من حديث أنس قال: كنت أمشي مع رسول الله ﷺ وعليه برد نجراني غليظ الحاشية، فأدركه أعرابي فجبذه(١) برداءه جبذة شديدة حتى نظرت إلى صفحة عاتق رسول الله قد أثرت بها حاشية البرد من شدة جبذته، ثم قال: يا محمد، مر لي من مال الله الذي عندك. فالتفت إليه رسول الله ﷺ ثم ضحك، ثم أمر له بعطاء.", "وكان عليه الصلاة والسلام إذا آذاه قومه يقول: «اللهم اغفر لقومي فإنهم لا يعلمون».", "وقيل للأحنف بن قيس: ممن تعلمت حسن الخلق؟", "فقال: من قيس بن عاصم، بينا هو جالس في داره إذ جاءت خادم له بسفود(٢) عليه شواء، فسقط من يدها، فوقع على ابن له فمات، فدهشت الجارية، فقال: لا روع عليك أنت حرة لوجه الله.", "وكان أويس(٣) إذا رماه الصبيان بالحجارة يقول: يا إخوتاه إن كان ولا بد فارموني بالصغار لئلا تدموا ساقي فتمنعوني من الصلاة.", "وقالت امرأة لمالك بن دينار: يا مرائي. فقال: وجدت اسمي الذي أضله أهل البصرة.", "وخرج إبراهيم بن أدهم إلى بعض البراري فاستقبله جندي فقال: أين العمران؟ فأشار إلى المقبرة، فضرب رأسه(٤) فشجه، فلما أخبر أنه إبراهيم بن أدهم جعل يقبل يده ورجله، فقال: إنه لما ضرب رأسي سألت الله له الجنة، لأني علمت أني أوجر بضربه إياي، فلم أحب أن يكون نصيبي منه الخير ونصيبه مني الشر.", "حاشية: (١) الجبذ والجذب واحد.", "حاشية: (٢) السفود: عود من حديد ينظم اللحم فيه ليشوى.", "حاشية: (٣) يعني أويس بن عامر القرني.", "حاشية: (٤) في الأصل: (رأسه ووجهه).", "ودعي رجل أبا عثمان الحيري(١) إلى دعوة فلما بلغ منزله قال له: ليس لهذا وجه. فرجع أبو عثمان فعاد، فدعاه فجاء، فقال: ارجع. ثم رجع فدعاه فجاء، فلما رآه لا يتغير قال: إنما أردت أن أختبرك. فقال أبو عثمان: الذي رأيت مني خلق كلب إذا دعي أجاب، وإذا زجر انزجر.", "واجتاز بسكة فطرح عليه رماد من سطح، فجعل أصحابه يتكلمون، فقال: من استحق النار فصولح على الرماد لا ينبغي أن يغضب.", "فهذه نفوس ذللت بالرياضة، فاعتدلت أخلاقها، ونقيت عن الغش(٢) بواطنها فأثمرت الرضا بالقضاء، وهذا منتهى حسن الخلق، ومن لم يجد من نفسه بعض هذه العلامات التي وجدها هؤلاء، فينبغي له أن يداوم الرياضة ليصل، فإنه بعد ما وصل.", "حاشية: (١) هو سعد بن إسماعيل الحيري النيسابوري، صحب شاه الكرماني ويحيى بن معاذ الرازي، توفي سنة (٢٩٨)هـ.", "حاشية: (٢) تحرفت في الأصل إلى: (الغبن).", "**بي
