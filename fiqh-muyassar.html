لقة به", "s": []}]}, "paras": [{"t": "الباب التاسع عشر: إحياء الموات", "b": [{"pic": ["scroll", "book"], "cap": "ص263-265"}, {"story": ["المسألة الأولى: في معناه وحكمه", ["1- معناه: الموات لغة: هو ما لا روح فيه، والمراد به الأرض التي لم تعمر ولا مالك لها.", "وفي الاصطلاح: هو الأرض المنفكة عن الاختصاصات وملك معصوم، فهو الأرض الخراب التي لم يجر عليها ملك لأحد، ولم يوجد فيها أثر عمارة. أو وجد فيها أثر ملك وعمارة، ولم يعلم لها مالك.", "2- حكمه وأدلته: والأصل فيه قوله ﷺ: «من أحيا أرضا ميتة فهي له، وليس لعرق ظالم حق». والعرق الظالم: أن يجيء الرجل إلى أرض قد أحياها غيره، فيغرس فيها، أو يزرع؛ ليستوجب بذلك الأرض.", "وقد يكون الإحياء مستحبا لحاجة الناس والدواب ونفعهم؛ لقوله ﷺ: «من أحيا أرضا ميتة فله فيها أجر، وما أكلته العوافي فهو له صدقة».", {"note": "حاشية (ص263): جمع العافية والعافي، وهو: كل طالب رزق من طير أو إنسان أو بهيمة."}]], "ic": "scroll"}, {"story": ["المسألة الثانية: شروطه وما يحصل به", ["يشترط لصحة إحياء الموات شرطان:", "1- أنه لم يجر على الأرض ملك مسلم، فإن جرى ذلك حرم التعرض لها بالإحياء إلا بإذن شرعي.", "2- أن يكون المحيي مسلما، فلا يجوز إحياء الكافر مواتا في دار الإسلام.", "ويحصل الإحياء بأمور:", "1- إذا أحاطه بحائط منيع مما جرت به العادة فقد أحياه؛ لقوله ﷺ: «من أحاط حائطا على أرض فهي له».", "2- إذا حفر في الأرض الموات بئرا، فوصل إلى الماء، فقد أحياها، وإن لم يصل إلى الماء فهو الأحق من غيره، وكذلك لو حفر فيها نهرا.", "3- إذا أوصل إلى الأرض الموات ماء أجراه من عين أو نهر أو غير ذلك، فقد أحياها بذلك.", "4- إذا غرس فيها شجرا، وكانت قبل ذلك لا تصلح للغراس، فنقاها، وغرسها فقد أحياها.", "5- ومن العلماء من قال: إن الإحياء لا يقف عند هذه الأمور، ويرجع فيه إلى العرف، فما عده الناس إحياء فهو إحياء، وما لا يعد إحياء فلا يعتبر."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: بعض الأحكام المتعلقة به", ["1- من أحيا شيئا من أرض الموات فقد ملكه؛ لعموم الأحاديث المتقدمة، ومنها قوله ﷺ: «من أحيا أرضا ميتة فهي له».", "2- حريم المعمور: لا يملك بالإحياء؛ لأن مالك المعمور يستحق مرافقه.", {"note": "حاشية (ص264): حريم الشيء: هو ما حوله من حقوقه ومرافقه، سمي بذلك؛ لأنه يحرم على غير مالكه أن يستبد بالانتفاع به."}, "2- لإمام المسلمين إقطاع الأرض الموات لمن يحييها؛ لحديث وائل بن حجر: «أن النبي ﷺ أقطعه أرضا بحضرموت».", "4- يجوز للإمام أن يحمي العشب في أرض الموات لإبل الصدقة وخيل المجاهدين، إذا احتاج إلى ذلك، ولم يكن فيه ضيق أو مضرة على المسلمين، وليس ذلك لأحد سوى إمام المسلمين؛ لأنه مشروع للمصلحة العامة، ففي حديث الصعب بن جثامة مرفوعا: «لا حمى إلا لله ولرسوله». ومعنى حماه: أي جعله حمى، أي: محظورا لا يقرب."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "الموات لغة:", "o": ["ما لا روح فيه", "الأرض المزروعة", "الأرض المبنية", "المال"], "h": "راجع: ص263 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «من أحيا أرضا ميتة»:", "o": ["فهي له", "فهي لبيت المال", "فهي للإمام", "فهي للجيران"], "h": "راجع: ص263 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "العرق الظالم هو أن يجيء الرجل إلى أرض:", "o": ["قد أحياها غيره، فيغرس فيها أو يزرع ليستوجب بذلك الأرض", "ميتة فيحييها", "مباحة فيسكنها", "له فيبيعها"], "h": "راجع: ص263 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "يشترط في المحيي أن يكون:", "o": ["مسلما", "غنيا", "عالما", "قويا"], "h": "راجع: ص264 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "من أمور الإحياء:", "o": ["الإحاطة بحائط منيع", "وضع علامة فقط", "النظر إلى الأرض", "السكوت"], "h": "راجع: ص264 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "إذا حفر في الأرض الموات بئرا فوصل إلى الماء فقد أحياها.", "a": true, "h": "راجع: ص264 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "من العلماء من قال: يرجع في الإحياء إلى العرف.", "a": true, "h": "راجع: ص264 (المسألة الثانية)"}, {"t": "mcq", "d": 3, "q": "أقطع النبي ﷺ وائل بن حجر:", "o": ["أرضا بحضرموت", "أرضا بخيبر", "بستانا بالمدينة", "دارا بمكة"], "h": "راجع: ص265 (المسألة الثالثة)"}, {"t": "mcq", "d": 3, "q": "قال ﷺ: «لا حمى إلا»:", "o": ["لله ولرسوله", "للإمام", "للمسلمين", "للفقراء"], "h": "راجع: ص265 (المسألة الثالثة)"}]}], "sum": [["في معناه وحكمه", "ص263-265"], ["شروطه وما يحصل به", "ص263-265"], ["بعض الأحكام المتعلقة به", "ص263-265"]]}, {"id": "l68", "title": "الباب العشرون: الجعالة", "group": "الكتاب السابع: المعاملات", "map": {"center": "الباب العشرون\nالمعاملات", "nodes": [{"t": "معناها وحكمها", "s": []}, {"t": "الأحكام المتعلقة بها", "s": []}]}, "paras": [{"t": "الباب العشرون: الجعالة", "b": [{"pic": ["scroll", "book"], "cap": "ص265-266"}, {"story": ["المسألة الأولى: معناها وحكمها", ["1- معناها: الجعالة: التزام عوض معلوم، على عمل معين، بقطع النظر عن فاعله.", "مثاله: أن يقول: من وجد سيارتي المفقودة فله ألف ريال.", "2- حكمها وأدلتها: وهي من العقود المباحة شرعا، ويدل عليها قوله تعالى: ﴿ولمن جاء به حمل بعير وأنا به زعيم﴾ [يوسف: 72].", "وعن أبي سعيد الخدري رضي الله عنه: «أن ناسا من أصحاب النبي ﷺ، مروا بحي من أحياء العرب، فاستضافوهم، فلم يضيفوهم، فلدغ سيد الحي، فقالوا للصحابة: هل فيكم من راق؟ قالوا: نعم، لكن لا نفعل إلا أن تجعلوا لنا جعلا، فجعلوا لهم قطيع شياه، فرقاه رجل منهم بفاتحة الكتاب فبرأ الرجل، فأتوهم بالشياه، فقالوا: لا نأخذها حتى نسأل رسول الله ﷺ، فلما رجعوا سألوه، فقال لهم ﷺ: «خذوا منهم، واضربوا لي معكم بسهم»."]], "ic": "scroll"}, {"story": ["المسألة الثانية: الأحكام المتعلقة بها", ["ويتعلق بالجعالة الأحكام الآتية:", "1- يشترط في الملتزم بالجعل أن يكون صحيح التصرف، وفي العامل أن يكون قادرا على العمل.", "2- أن يكون العمل مباحا، فلا تصح على محرم كغناء، أو صناعة خمر، أو نحوهما.", "3- ألا يوقت العمل بوقت محدد، فلو قال: من رد جملي إلى نهاية الأسبوع فله دينار؛ لم يصح.", "4- أنها عقد جائز، لكل من الطرفين فسخها، فإن فسخها الجاعل فللعامل أجرة المثل، وإن فسخها العامل فلا شيء له."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "الجعالة هي التزام:", "o": ["عوض معلوم على عمل معين بقطع النظر عن فاعله", "عمل بلا عوض", "هبة مال", "رهن مال"], "h": "راجع: ص265 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "من أدلة الجعالة قوله تعالى:", "o": ["﴿ولمن جاء به حمل بعير وأنا به زعيم﴾", "﴿وأقيموا الصلاة﴾", "﴿والعصر﴾", "﴿قل هو الله أحد﴾"], "h": "راجع: ص265 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "رقى الرجل سيد الحي بـ:", "o": ["فاتحة الكتاب", "سورة الإخلاص", "آية الكرسي", "سورة يس"], "h": "راجع: ص265 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "قال النبي ﷺ لهم: «خذوا منهم،»:", "o": ["واضربوا لي معكم بسهم", "ولا تعودوا", "وردوا نصفها", "واتركوا الباقي"], "h": "راجع: ص265 (المسألة الأولى)"}, {"t": "tf", "d": 2, "q": "تصح الجعالة على صناعة الخمر.", "a": false, "h": "راجع: ص266 (المسألة الثانية)"}, {"t": "tf", "d": 3, "q": "يشترط ألا يوقت العمل بوقت محدد.", "a": true, "h": "راجع: ص266 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "إذا فسخها الجاعل فللعامل:", "o": ["أجرة المثل", "لا شيء", "نصف الجعل", "الجعل كاملا"], "h": "راجع: ص266 (المسألة الثانية)"}]}], "sum": [["معناها وحكمها", "ص265-266"], ["الأحكام المتعلقة بها", "ص265-266"]]}, {"id": "l69", "title": "الباب الحادي والعشرون: اللقطة واللقيط", "group": "الكتاب السابع: المعاملات", "map": {"center": "الباب الحادي والعشرون\nالمعاملات", "nodes": [{"t": "معنى اللقطة وحكمها", "s": []}, {"t": "أقسام اللقطة", "s": []}, {"t": "بعض الأحكام المتعلقة بها", "s": []}, {"t": "في اللقيط", "s": []}]}, "paras": [{"t": "الباب الحادي والعشرون: اللقطة واللقيط", "b": [{"pic": ["scroll", "book"], "cap": "ص266-269"}, {"story": ["المسألة الأولى: معنى اللقطة وحكمها", ["1- معناها: اللقطة لغة: الشيء الملقوط، وهي اسم الشيء الذي تجده ملقى فتأخذه.", "وفي الشرع: هي أخذ مال محترم من مضيعة؛ ليحفظه، أو ليتملكه بعد التعريف.", "2- حكمها وأدلتها: والأصل فيها حديث زيد بن خالد الجهني رضي الله عنه: أن النبي ﷺ سئل عن لقطة الذهب أو الورق (الفضة) فقال: «اعرف وكاءها وعفاصها، ثم عرفها سنة، فإن لم تعرف فاستنفقها، ولتكن عندك وديعة، فإن جاء طالبها يوما من الدهر فأدها إليه»، وسأله عن ضالة الإبل، فقال: «ما لك ولها، دعها، فإن معها حذاءها وسقاءها، ترد الماء، وتأكل الشجر، حتى يلقاها ربها»، وسأله عن الشاة، فقال: «خذها، فإنما هي لك، أو لأخيك، أو للذئب».", {"note": "حاشية (ص267): الوكاء: الخيط الذي تشد به الصرة والكيس وغيرهما، والعفاص: الوعاء تكون فيه النفقة، من جلد أو غير ذلك. والمقصود: معرفة الملتقط بالعلامات حتى يعلم صدق واصفها إذا وصفها."}]], "ic": "scroll"}, {"story": ["المسألة الثانية: أقسام اللقطة", ["1- ما لا تتبعه همة الناس: كالسوط والرغيف والثمرة والعصا، وهذا يجوز التقاطه، وللملتقط الانتفاع به، وتملكه بلا تعريف.", "2- ما يمتنع بنفسه من صغار السباع وغيرها: كالإبل والخيل والبقر والبغال، وهذا يحرم التقاطه ولا يملكه ملتقطه بتعريفه؛ لقوله ﷺ في حديث زيد بن خالد المتقدم: «ما لك ولها، دعها، فإن معها حذاءها وسقاءها، ترد الماء، وتأكل الشجر، حتى يجدها ربها».", "3- ما يجوز التقاطه ويلزمه تعريفه: كالذهب والفضة والمتاع، وما لا يمتنع من صغار السباع كالغنم والدجاج ونحوهما، وذلك لحديث زيد بن خالد المتقدم. هذا لمن وثق في نفسه، وقدر على تعريفها."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: بعض الأحكام المتعلقة بها", ["1- إذا كان الملقوط حيوانا مأكولا، فهو مخير بين أكله ودفع قيمته في الحال، أو بيعه، والاحتفاظ بقيمته لصاحبه بعد معرفة أوصافه، أو حفظه، والإنفاق عليه من ماله، ولا يملكه، ويرجع بنفقته على مالكه إذا جاء واستلمه، وإذا جاء صاحبها قبل أن يأكلها الملتقط فله أخذها.", "2- إذا كان الملقوط مما يخشى فساده كالفاكهة، فللملتقط أكله ودفع قيمته لمالكه، أو بيعه وحفظ ثمنه حتى يأتي مالكه.", "3- أما النقود والأواني والمتاع فيلزمه حفظ الجميع أمانة بيده والتعريف بها في مجامع الناس.", "4- لا يجوز أخذ اللقطة إلا إذا أمن على نفسه منها واستطاع أن يعرف بها؛ لأن التعريف باللقطة واجب، فإذا التقطها يعرف صفتها، ثم يعرفها سنة كاملة، وذلك بالمناداة عليها في مجامع الناس، فإن جاء صاحبها ووصفها بما يطابق صفتها دفعها إليه، فإن لم يأت صاحبها بعد تعريفها عاما كاملا تكون ملكا له.", "5- الملتقط يتملك اللقطة، بعد تعريفها ومرور الحول، لكن لا يتصرف فيها إلا بعد معرفة أوصافها. فمتى جاء طالبها بما ينطبق على تلك الأوصاف دفعها إليه بلا بينة ولا يمين؛ لأمره ﷺ بذلك في حديث زيد بن خالد المتقدم.", "6- لقطة الصبي والسفيه يتصرف فيها ولي أمرهما، بما سبق بيانه.", "7- لقطة الحرم لا تملك بحال، ويجب التعريف بها طول الدهر."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: في اللقيط", ["اللقيط: هو الطفل الذي يوجد منبوذا في شارع، أو باب مسجد ونحوه، أو ضل عن أهله، ولا يعرف له نسب ولا كفيل.", "ولا ينبغي ترك اللقيط؛ لقوله تعالى: ﴿وتعاونوا على البر والتقوى﴾ [المائدة: 2]", "فعموم الآية يدل على وجوب أخذ اللقيط، فالتقاطه والإنفاق عليه فرض على الكفاية، ولأن في أخذه إحياء لنفسه.", "وما وجد معه من المال فهو له، عملا بالظاهر، ولأن يده عليه؛ وينفق عليه منه، فإن لم يكن معه مال أنفق عليه من بيت المال.", "واللقيط حر مسلم في جميع أحكامه، إلا إذا وجد ببلد الكفر، فإنه كافر.", "ويثبت نسب اللقيط بإقرار من يدعيه ممن يمكن كونه منه، فإن تنازع فيه أكثر من واحد ولا بينة عرض على القافة.", {"note": "حاشية (ص268): جمع قائف، وهو الذي يتتبع الآثار ويعرفها، ويعرف شبه الرجل بأخيه وأبيه. (النهاية: قوف)."}, "والأحق بحضانة اللقيط واجده، بشرط أن يكون حرا أمينا عدلا رشيدا، ولا حضانة لكافر ولا فاسق على مسلم.", "ويشترط في الملتقط: العقل، والبلوغ، والحرية، والإسلام، والعدالة، والرشد. فلا يصح التقاط الصبي، والمجنون، والعبد، والكافر للمسلم، والفاسق، والسفيه."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "اللقطة لغة:", "o": ["الشيء الملقوط", "المال المدفون", "المال المسروق", "الهدية"], "h": "راجع: ص266 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "اللقطة في الشرع:", "o": ["أخذ مال محترم من مضيعة ليحفظه أو ليتملكه بعد التعريف", "أخذ مال بالقوة", "بيع المال", "هبة المال"], "h": "راجع: ص266 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ في لقطة الذهب والفضة: «ثم عرفها»:", "o": ["سنة", "شهرا", "أسبوعا", "يوما"], "h": "راجع: ص266 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ في ضالة الإبل: «ما لك ولها»، لأن معها:", "o": ["حذاءها وسقاءها", "راعيها", "صاحبها", "ولدها"], "h": "راجع: ص266 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ في الشاة: «خذها، فإنما هي لك، أو لأخيك، أو»:", "o": ["للذئب", "للفقير", "للجار", "للقاضي"], "h": "راجع: ص267 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "ما لا تتبعه همة الناس كالسوط والرغيف والثمرة:", "o": ["يجوز التقاطه وتملكه بلا تعريف", "يحرم التقاطه", "يجب تعريفه سنة", "يدفع للحاكم"], "h": "راجع: ص267 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "ما يمتنع بنفسه من صغار السباع كالإبل والخيل والبقر يحرم التقاطه.", "a": true, "h": "راجع: ص267 (المسألة الثانية)"}, {"t": "mcq", "d": 3, "q": "إذا كان الملقوط مما يخشى فساده كالفاكهة فللملتقط:", "o": ["أكله ودفع قيمته لمالكه أو بيعه وحفظ ثمنه", "رميه", "تركه", "إعطاؤه لأي شخص"], "h": "راجع: ص267 (المسألة الثالثة)"}, {"t": "mcq", "d": 3, "q": "لقطة الحرم:", "o": ["لا تملك بحال ويجب التعريف بها طول الدهر", "تملك بعد سنة", "تملك فورا", "تباع"], "h": "راجع: ص268 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "اللقيط هو الطفل الذي:", "o": ["يوجد منبوذا في شارع أو باب مسجد ونحوه ولا يعرف له نسب ولا كفيل", "يتيم الأب", "له أب غائب", "عنده مال"], "h": "راجع: ص268 (المسألة الرابعة)"}, {"t": "tf", "d": 2, "q": "التقاط اللقيط والإنفاق عليه فرض على الكفاية.", "a": true, "h": "راجع: ص268 (المسألة الرابعة)"}, {"t": "tf", "d": 2, "q": "اللقيط حر مسلم في جميع أحكامه إلا إذا وجد ببلد الكفر.", "a": true, "h": "راجع: ص268 (المسألة الرابعة)"}]}], "sum": [["معنى اللقطة وحكمها", "ص266-269"], ["أقسام اللقطة", "ص266-269"], ["بعض الأحكام المتعلقة بها", "ص266-269"], ["في اللقيط", "ص266-269"]]}, {"id": "l70", "title": "الباب الثاني والعشرون: الوقف", "group": "الكتاب السابع: المعاملات", "map": {"center": "الباب الثاني والعشرون\nالمعاملات", "nodes": [{"t": "معناه وحكمه", "s": []}, {"t": "الأحكام المتعلقة به", "s": []}]}, "paras": [{"t": "الباب الثاني والعشرون: الوقف", "b": [{"pic": ["scroll", "book"], "cap": "ص269-270"}, {"story": ["المسألة الأولى: معناه وحكمه", ["1- معناه: الوقف حبس عين يمكن الانتفاع بها مع بقائها، تقربا إلى الله تعالى، فهو: حبس الأصل وتسبيل الثمرة.", "مثاله: أن يوقف دارا ويؤجرها، ويصرف الأجرة على المحتاجين، أو المساجد، أو طباعة الكتب الدينية أو نحو ذلك.", "2- حكمه وأدلته: وهو من الأعمال المستحبة، والأصل فيه، ما ورد عن عمر رضي الله عنه، أنه أصاب أرضا بخيبر، فقال: يا رسول الله، أصبت أرضا بخيبر لم أصب مالا قط أنفس عندي منه فما تأمرني به؟ قال: «إن شئت حبست أصلها وتصدقت بها غير أنه لا يباع أصلها، ولا يوهب، ولا يورث». وعن أبي هريرة رضي الله عنه أن النبي ﷺ قال: «إذا مات ابن آدم انقطع عمله إلا من ثلاث صدقة جارية أو علم ينتفع به أو ولد صالح يدعو له». فالمقصود بالصدقة الجارية: الوقف."]], "ic": "scroll"}, {"story": ["المسألة الثانية: الأحكام المتعلقة به", ["ويتعلق بالوقف الأحكام الآتية:", "1- أن يكون الواقف جائز التصرف، عاقلا بالغا حرا رشيدا.", "2- كون الوقف مما ينتفع به انتفاعا دائما مع بقاء عينه، وأن يعينه.", "3- أن يكون الوقف على بر ومعروف، كالمساجد، والمساكين، وكتب العلم ونحو ذلك؛ لأنه قربة إلى الله تعالى، فيحرم الوقف على معابد الكفار، أو لشراء محرم.", "4- إذا تعطلت منافع الوقف، ولم يمكن الانتفاع به، فيباع، ويصرف ثمنه في مثله، فإن كان مسجدا صرف ثمنه في مسجد آخر، أو كان دارا بيعت، واشتري بثمنها دار أخرى؛ لأن ذلك أقرب إلى مقصود الواقف.", "5- الوقف عقد لازم، يثبت بمجرد القول، ولا يجوز فسخه، ولا بيعه.", "6- أن يكون الموقوف معينا، فلا يصح وقف غير المعين.", "7- أن يكون الوقف منجزا، فلا يصح الوقف المعلق ولا المؤقت، إلا على موته.", "8- يجب العمل بشرط الواقف، إذا كان لا يخالف الشرع.", "9- إذا وقف على أولاده استوى فيه الذكور والإناث."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "الوقف هو:", "o": ["حبس الأصل وتسبيل الثمرة", "بيع الأصل", "هبة الأصل", "رهن الأصل"], "h": "راجع: ص269 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "أصاب عمر رضي الله عنه أرضا في:", "o": ["خيبر", "مكة", "الشام", "اليمن"], "h": "راجع: ص269 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ لعمر: «حبست أصلها وتصدقت بها غير أنه»:", "o": ["لا يباع أصلها ولا يوهب ولا يورث", "يباع", "يوهب", "يورث"], "h": "راجع: ص269 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "المقصود بالصدقة الجارية:", "o": ["الوقف", "الزكاة", "الكفارة", "النذر"], "h": "راجع: ص269 (المسألة الأولى)"}, {"t": "tf", "d": 2, "q": "الوقف عقد لازم يثبت بمجرد القول ولا يجوز فسخه ولا بيعه.", "a": true, "h": "راجع: ص270 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "يصح الوقف على معابد الكفار.", "a": false, "h": "راجع: ص270 (المسألة الثانية)"}, {"t": "mcq", "d": 3, "q": "إذا تعطلت منافع الوقف ولم يمكن الانتفاع به:", "o": ["يباع ويصرف ثمنه في مثله", "يترك", "يورث", "يهدم"], "h": "راجع: ص270 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "يجب العمل بشرط الواقف:", "o": ["إذا كان لا يخالف الشرع", "دائما", "إذا وافق الورثة", "إذا أذن القاضي"], "h": "راجع: ص270 (المسألة الثانية)"}]}], "sum": [["معناه وحكمه", "ص269-270"], ["الأحكام المتعلقة به", "ص269-270"]]}, {"id": "l71", "title": "الباب الثالث والعشرون: الهبة والعطية", "group": "الكتاب السابع: المعاملات", "map": {"center": "الباب الثالث والعشرون\nالمعاملات", "nodes": [{"t": "معناها وأدلتها", "s": []}, {"t": "شروط الهبة", "s": []}, {"t": "بعض الأحكام المتعلقة بها", "s": []}]}, "paras": [{"t": "الباب الثالث والعشرون: الهبة والعطية", "b": [{"pic": ["scroll", "book"], "cap": "ص270-272"}, {"story": ["المسألة الأولى: معناها وأدلتها", ["1- معناها: الهبة هي التبرع من جائز التصرف في حياته لغيره، بمال معلوم أو غيره، بلا عوض.", "2- حكمها وأدلتها: والهبة مستحبة إذا قصد بها وجه الله، كالهبة لصالح، أو فقير، أو صلة رحم، فعن أبي هريرة رضي الله عنه أن رسول الله ﷺ قال: «تهادوا تحابوا». وعن عائشة رضي الله عنها قالت: «كان رسول الله ﷺ يقبل الهدية، ويثيب عليها». وتكره إن كانت رياء وسمعة ومباهاة."]], "ic": "scroll"}, {"story": ["المسألة الثانية: شروط الهبة", ["ويتعلق بالهبة الأحكام الآتية:", "1- أن تكون من جائز التصرف، وهو الحر المكلف الرشيد.", "2- أن يكون الواهب مختارا، فلا تصح من المكره.", "3- أن يكون الموهوب مما يصح بيعه، فما لا يصح بيعه لا تصح هبته، مثل: الخمر، والخنزير.", "4- أن يقبل الموهوب له الشيء الموهوب، لأن الهبة عقد تمليك فافتقر إلى الإيجاب والقبول.", "5- أن تكون الهبة حالة منجزة، فلا تصح الهبة المؤقتة، مثل: وهبتك هذا شهرا أو سنة؛ لأن الهبة عقد تمليك، فلا تصح مؤقتة.", "6- أن تكون بغير عوض، لأنها تبرع محض."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: بعض الأحكام المتعلقة بها", ["ويتعلق بالهبة الأحكام الآتية:", "1- تلزم الهبة إذا قبضها الموهوب له بإذن الواهب، وليس للواهب الرجوع فيها لقوله ﷺ: «العائد في هبته كالكلب يقيء ثم يعود في قيئه». إلا إذا كان أبا، فإن له الرجوع فيما وهبه لابنه؛ لحديث ابن عباس رضي الله عنهما أن النبي ﷺ قال: «لا يحل للرجل أن يعطي العطية، فيرجع فيها، إلا الوالد فيما يعطي ولده».", "2- يجب على الأب المساواة بين أبنائه في الهبة، فلو خص بعضهم بها، أو فاضل بينهم في العطاء دون رضاهم لم يصح ذلك، وإن رضوا صحت الهبة؛ وذلك لحديث النعمان بن بشير رضي الله عنه: أن أباه تصدق عليه ببعض ماله، فقال له النبي ﷺ: «أكل ولدك أعطيت مثله؟» قال: لا، قال: «فاتقوا الله واعدلوا بين أولادكم» وفي رواية: «لا تشهدني على جور».", "3- إذا فاضل الأب في مرض موته بين أبنائه، أو خص أحدهم بعطية دون الآخرين، لم يصح إلا إذا أجاز ذلك بقية الورثة.", "4- تصح الهبة المعلقة، كأن يقول: إذا قدم المسافر، أو نزل المطر، وهبتك كذا.", "5- تصح هبة الدين لمن هو في ذمته، ويعتبر ذلك إبراء له.", "6- لا ينبغي رد الهبة والهدية، وإن قلت، وتسن الإثابة عليها؛ لفعله ﷺ، فعن عائشة رضي الله عنها قالت: «كان رسول الله ﷺ يقبل الهدية، ويثيب عليها»."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "الهبة هي التبرع من جائز التصرف في حياته لغيره:", "o": ["بلا عوض", "بعوض", "بشرط الرد", "بعد الموت"], "h": "راجع: ص270 (المسألة الأولى)"}, {"t": "mcq", "d": 1, "q": "قال ﷺ: «تهادوا»:", "o": ["تحابوا", "تباغضوا", "تفاخروا", "تبايعوا"], "h": "راجع: ص270 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "تكره الهبة إذا كانت:", "o": ["رياء وسمعة ومباهاة", "لفقير", "لصالح", "صلة رحم"], "h": "راجع: ص271 (المسألة الأولى)"}, {"t": "tf", "d": 2, "q": "تصح الهبة من المكره.", "a": false, "h": "راجع: ص271 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "ما لا يصح بيعه:", "o": ["لا تصح هبته", "تصح هبته", "تصح بإذن القاضي", "تصح بالإكراه"], "h": "راجع: ص271 (المسألة الثانية)"}, {"t": "tf", "d": 3, "q": "لا تصح الهبة المؤقتة، مثل: وهبتك هذا شهرا أو سنة.", "a": true, "h": "راجع: ص271 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «العائد في هبته كالكلب»:", "o": ["يقيء ثم يعود في قيئه", "ينبح", "يعض", "يجوع"], "h": "راجع: ص271 (المسألة الثالثة)"}, {"t": "mcq", "d": 3, "q": "يجوز الرجوع في الهبة لـ:", "o": ["الأب فيما وهبه لابنه", "الأخ", "الجد فقط", "الأم والأخ"], "h": "راجع: ص271 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ للنعمان بن بشير: «فاتقوا الله»:", "o": ["واعدلوا بين أولادكم", "وأطيعوا آباءكم", "وتصدقوا", "وأقرضوا"], "h": "راجع: ص272 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "تصح هبة الدين لمن هو في ذمته ويعتبر ذلك إبراء له.", "a": true, "h": "راجع: ص272 (المسألة الثالثة)"}]}], "sum": [["معناها وأدلتها", "ص270-272"], ["شروط الهبة", "ص270-272"], ["بعض الأحكام المتعلقة بها", "ص270-272"]]}, {"id": "l72", "title": "الباب الأول: تصرفات المريض", "group": "الكتاب الثامن: المواريث والوصايا والعتق", "map": {"center": "الباب الأول\nالمواريث والوصايا", "nodes": [{"t": "تصرفات المريض", "s": []}]}, "paras": [{"t": "الباب الأول: تصرفات المريض", "b": [{"pic": ["scroll", "book"], "cap": "ص273-274"}, {"story": ["تصرفات المريض", ["الإنسان إذا كان صحيحا ومعافى فإنه يتصرف في ماله بكل حرية، ولكن بحدود ما جاء به الشرع.", "أما إذا كان مريضا، فلا يخلو المرض أن يكون غير مخوف، بمعنى أنه لا يخاف أن يموت بسببه كوجع الضرس والأصبع والصداع وآلام الجسم التي لا تؤثر، ويمكن شفاؤها وبرؤها، فهذا المريض يكون تصرفه لازما كتصرف الصحيح فتصح عطيته، وهبته، من جميع ماله، وإن تطور إلى مرض مخوف ومات بسببه، فالعبرة بحاله عند العطية والهبة، وهو في هذه الحال في حكم الصحيح.", "أما إذا كان المرض مخوفا، بأن يتوقع منه الموت كالأمراض الخبيثة والمستعصية، فإن تبرعاته في هذه الحال تنفذ من ثلثه لا من رأس المال، فإن كانت في حدود الثلث فما دونه نفذت. وإن زادت على ذلك فإنها لا تنفذ إلا بإجازة الورثة لها بعد الموت. لقوله ﷺ: «إن الله تصدق عليكم عند وفاتكم بثلث أموالكم زيادة في أعمالكم». فدل الحديث وما ورد بمعناه على أنه يجوز التصرف للمريض مرض الموت في ثلث المال؛ لأن عطيته من رأس المال تضر بالورثة، فردت إلى الثلث كالوصية.", "أما إذا كان المرض مزمنا، ولكنه غير مخوف، ولم يلزمه الفراش، كمرض السكر وغيره، ففي هذه الحال تصبح تبرعاته من جميع ماله كتبرعات الصحيح؛ لأنه لا يخاف منه تعجيل الموت، كالشيخ الكبير.", "أما إذا لزمه الفراش فلا تصح تبرعاته ولا وصاياه إلا في حدود الثلث لغير الوارث؛ لأنه مريض ملازم لفراشه يخشى عليه من الموت، فلا تعتبر تصرفاته وتبرعاته في هذه الحال كالمريض مرض الموت."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "المرض غير المخوف كوجع الضرس والصداع، تصرف صاحبه:", "o": ["لازم كتصرف الصحيح", "لا ينفذ", "ينفذ في الثلث فقط", "ينفذ بإذن القاضي"], "h": "راجع: ص273 (تصرفات المريض)"}, {"t": "mcq", "d": 2, "q": "المرض المخوف تنفذ تبرعات صاحبه من:", "o": ["ثلثه", "جميع ماله", "نصف ماله", "ربع ماله"], "h": "راجع: ص273 (تصرفات المريض)"}, {"t": "mcq", "d": 2, "q": "إذا زادت تبرعات المريض مرض الموت على الثلث فإنها:", "o": ["لا تنفذ إلا بإجازة الورثة بعد الموت", "تنفذ مطلقا", "تبطل مطلقا", "تنفذ بإذن الحاكم"], "h": "راجع: ص273 (تصرفات المريض)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «إن الله تصدق عليكم عند وفاتكم بثلث أموالكم»:", "o": ["زيادة في أعمالكم", "لتتصدقوا", "لتقسموها", "لتوصوا بها لأي أحد"], "h": "راجع: ص273 (تصرفات المريض)"}, {"t": "tf", "d": 2, "q": "المريض بمرض مزمن غير مخوف كالسكر تصبح تبرعاته من جميع ماله كتبرعات الصحيح.", "a": true, "h": "راجع: ص273 (تصرفات المريض)"}]}], "sum": [["تصرفات المريض", "ص273-274"]]}, {"id": "l73", "title": "الباب الثاني: الوصية", "group": "الكتاب الثامن: المواريث والوصايا والعتق", "map": {"center": "الباب الثاني\nالمواريث والوصايا", "nodes": [{"t": "معناها وأدلة مشروعيتها", "s": []}, {"t": "الأحكام المتعلقة بها", "s": []}]}, "paras": [{"t": "الباب الثاني: الوصية", "b": [{"pic": ["scroll", "book"], "cap": "ص274-276"}, {"story": ["المسألة الأولى: معناها وأدلة مشروعيتها", ["1- تعريفها: الوصية لغة: معناها العهد إلى الغير، أو الأمر.", "وشرعا: هبة الإنسان غيره عينا، أو دينا، أو منفعة، على أن يملك الموصى له الهبة بعد موت الموصي.", "وقد تشمل الوصية ما هو أعم من ذلك، وتكون بمعنى: الأمر بالتصرف بعد الموت - كما عرفها بعضهم بذلك - فتشمل الوصية لشخص بغسله، أو الصلاة عليه إماما، أو دفع شيء من ماله لجهة.", "2- أدلة مشروعيتها: وهي مشروعة بالكتاب والسنة والإجماع:", "لقوله تعالى: ﴿كتب عليكم إذا حضر أحدكم الموت إن ترك خيرا الوصية للوالدين والأقربين بالمعروف حقا على المتقين﴾ [البقرة: 180].", "ولما روى ابن عمر رضي الله عنهما قال: قال رسول الله ﷺ: «ما حق امرئ مسلم يبيت ليلتين وله شيء يريد أن يوصي فيه إلا ووصيته مكتوبة عند رأسه». وقد أجمع العلماء على جوازها."]], "ic": "scroll"}, {"story": ["المسألة الثانية: الأحكام المتعلقة بها", ["ويتعلق بالوصية الأحكام الآتية:", "1- يجب على المسلم أن يدون ما له وما عليه من الحقوق في وصية يبين فيها ذلك؛ لحديث ابن عمر السابق.", "2- تستحب الوصية بشيء من المال، يصرف في طرق البر والخير والإحسان، فعن أبي الدرداء رضي الله عنه أن رسول الله ﷺ قال: «إن الله تصدق عليكم بثلث أموالكم عند وفاتكم زيادة في حسناتكم ليجعلها لكم زيادة في أعمالكم».", "3- جواز الوصية بالثلث فأقل، أما جواز الثلث: فلحديث سعد بن أبي وقاص رضي الله عنه حين سأل النبي ﷺ في مرض موته: أتصدق بثلثي مالي؟ قال: «لا»، قلت: فبالشطر؟ قال: «لا». قلت: فبالثلث؟ قال: «الثلث والثلث كثير». وأما استحباب أقل من الثلث: فلقول ابن عباس رضي الله عنهما: لو أن الناس غضوا من الثلث إلى الربع، فإن رسول الله ﷺ قال: «الثلث والثلث كثير».", "4- أن الوصية لا تصح بأكثر من ثلث ما يملك لمن له وارث؛ لحديث سعد ابن أبي وقاص المتقدم، إلا إذا أجاز الورثة ذلك، أما إذا لم يكن له وارث فتصح بالمال كله.", "5- لا تصح الوصية لأحد من الورثة؛ لما روى أبو أمامة رضي الله عنه، أن رسول الله ﷺ قال: «إن الله قد أعطى كل ذي حق حقه فلا وصية لوارث».", "6- تحرم الوصية بأمر فيه معصية؛ لأنها شرعت لزيادة حسنات الموصي، كما مضى في حديث أبي الدرداء.", "7- أن الديون والواجبات الشرعية كالزكاة والحج والكفارات مقدمة على الوصية لقوله تعالى: ﴿من بعد وصية يوصى بها أو دين﴾ [النساء: 11]، وقال علي رضي الله عنه: «قضى النبي ﷺ بالدين قبل الوصية».", "8- يشترط في الموصي أن يكون جائز التصرف في ماله، فيكون عاقلا، بالغا، حرا، مختارا.", "9- يحرم أن يوصي لجهة معصية، كأن يوصي لمعابد الكفار، أو لشراء آلات اللهو أو نحو ذلك، وتكون وصية باطلة.", "10- تستحب الوصية لمن له مال كثير؛ وارثه غير محتاج؛ لقوله تعالى: ﴿كتب عليكم إذا حضر أحدكم الموت إن ترك خيرا الوصية﴾ [البقرة: 180]، والخير هو المال الكثير، وتكره لمن ماله قليل ووارثه محتاج؛ لقوله ﷺ: «إنك أن تذر ورثتك أغنياء، خير من أن تذرهم عالة يتكففون الناس». وكثير من أصحاب النبي ﷺ ماتوا، ولم يوصوا.", "11- تحرم الوصية إذا كان قصد الموصي المضارة بالورثة؛ لقوله تعالى: ﴿غير مضار﴾ [النساء: 12].", "12- لا يصح قبول الوصية ولا ملكها إلا بعد موت الموصي؛ لأن ذلك وقت ثبوت حقه، هذا إذا كانت الوصية لمعين، أما إن كانت لغير معين، كالفقراء والمساكين، أو على طلبة العلم، أو المساجد، ودور الأيتام، فإنها لا تحتاج إلى قبول وتلزم بمجرد الموت.", "13- يجوز للموصي أن يرجع في وصيته أو بعضها، وله نقضها. قال عمر رضي الله عنه: «يغير الرجل ما شاء من وصيته».", "14- تصح الوصية لكل شخص يصح تمليكه سواء أكان مسلما أم كافرا. قال تعالى: ﴿إلا أن تفعلوا إلى أوليائكم معروفا﴾ [الأحزاب: 6]."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "الوصية لغة معناها:", "o": ["العهد إلى الغير أو الأمر", "الهبة", "البيع", "القرض"], "h": "راجع: ص274 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "الوصية شرعا هي هبة الإنسان غيره عينا أو دينا أو منفعة على أن يملك الموصى له الهبة:", "o": ["بعد موت الموصي", "في حياة الموصي", "بعد سنة", "فورا"], "h": "راجع: ص274 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "قال ابن عمر: قال رسول الله ﷺ: «ما حق امرئ مسلم يبيت»:", "o": ["ليلتين وله شيء يريد أن يوصي فيه إلا ووصيته مكتوبة عند رأسه", "ثلاث ليال", "ليلة", "شهرا"], "h": "راجع: ص274 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "لما سأل سعد بن أبي وقاص النبي ﷺ عن الوصية بالثلث قال له:", "o": ["الثلث والثلث كثير", "الشطر", "الثلثان", "كل المال"], "h": "راجع: ص275 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "لا تصح الوصية بأكثر من ثلث ما يملك لمن له وارث إلا إذا أجاز الورثة ذلك.", "a": true, "h": "راجع: ص275 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «إن الله قد أعطى كل ذي حق حقه فلا»:", "o": ["وصية لوارث", "ميراث", "دين", "هبة"], "h": "راجع: ص275 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "الديون والواجبات الشرعية مقدمة على الوصية.", "a": true, "h": "راجع: ص275 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "يشترط في الموصي أن يكون:", "o": ["جائز التصرف عاقلا بالغا حرا مختارا", "صبيا", "مجنونا", "مكرها"], "h": "راجع: ص276 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "تحرم الوصية إذا كان قصد الموصي المضارة بالورثة.", "a": true, "h": "راجع: ص276 (المسألة الثانية)"}, {"t": "tf", "d": 3, "q": "لا يصح قبول الوصية ولا ملكها إلا بعد موت الموصي.", "a": true, "h": "راجع: ص276 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "يجوز للموصي أن يرجع في وصيته أو بعضها.", "a": true, "h": "راجع: ص276 (المسألة الثانية)"}]}], "sum": [["معناها وأدلة مشروعيتها", "ص274-276"], ["الأحكام المتعلقة بها", "ص274-276"]]}, {"id": "l74", "title": "الباب الثالث: في العتق، والكتابة، والتدبير", "group": "الكتاب الثامن: المواريث والوصايا والعتق", "map": {"center": "الباب الثالث\nالمواريث والوصايا", "nodes": [{"t": "في تعريف العتق، ومشروعيته، وفضله، ", "s": []}, {"t": "أركان العتق، وشروطه، وصيغته وألفاظ", "s": []}, {"t": "من أحكام العتق", "s": []}, {"t": "التدبير", "s": []}, {"t": "المكاتب", "s": []}]}, "paras": [{"t": "الباب الثالث: في العتق، والكتابة، والتدبير", "b": [{"pic": ["scroll", "book"], "cap": "ص277-282"}, {"story": ["المسألة الأولى: في تعريف العتق، ومشروعيته، وفضله، وحكمة مشروعيته", ["1- تعريف العتق:", "العتق لغة: بكسر العين وسكون التاء: الحرية والخلوص، مشتق من قولهم: عتق الفرس، إذا سبق، وعتق الفرخ: طار واستقل وخلص.", "وشرعا: هو تحرير الرقبة وتخليصها من الرق، وإزالة الملك عنها، وتثبيت الحرية لها.", "2- أدلة مشروعيته:", "الأصل في مشروعية العتق: الكتاب، والسنة، والإجماع.", "أما الكتاب: فقوله تعالى: ﴿فتحرير رقبة﴾ [النساء: 92] وقوله تعالى: ﴿فتحرير رقبة من قبل أن يتماسا﴾ [المجادلة: 3].", "وأما السنة: فعن أبي هريرة رضي الله عنه، عن النبي ﷺ قال: «من أعتق رقبة، أعتق الله بكل عضو منها عضوا من أعضائه من النار، حتى فرجه بفرجه».", "وأجمعت الأمة على صحة العتق، وحصول القربة به إلى الله تعالى.", "3- فضله:", "العتق من أفضل القربات وأجل الطاعات، لما جاء في فضل العتق من قوله تعالى: ﴿فك رقبة﴾ [البلد: 13] يعني: تخليص الشخص من الرق، وقد ورد ذلك في معرض بيان الطريق التي فيها النجاة والخير لمن سلكها؛ ألا وهي: عتق الرقاب. وتقدم معنا حديث أبي هريرة قبل قليل في فضل العتق، وعن أبي أمامة رضي الله عنه أيضا عن النبي ﷺ قال: «أيما امرئ مسلم، أعتق امرأ مسلما، كان فكاكه من النار...» الحديث. والنصوص في فضل العتق كثيرة جدا.", "وعتق الرجل أفضل من عتق المرأة، والرقبة الأغلى ثمنا والأنفس عند أهلها أفضل من غيرها.", "4- الحكمة من مشروعيته:", "شرع العتق في الإسلام لغايات نبيلة، وحكم بليغة. فمن ذلك: أنه تخليص الآدمي المعصوم من ضرر الرق، وملك نفسه، وتمكينه من التصرف في نفسه ومنافعه حسب إرادته واختياره.", "ومنها: أن الله عز وجل جعله كفارة للقتل، والوطء في رمضان، والأيمان."]], "ic": "scroll"}, {"story": ["المسألة الثانية: أركان العتق، وشروطه، وصيغته وألفاظه", ["1- أركانه ثلاثة:", "أ- المعتق: وهو الشخص الذي وقع منه العتق لغيره.", "ب- المعتق: وهو الشخص الذي عتق، أو وقع عليه العتق.", "ج- الصيغة: وهي الألفاظ التي يقع بها العتق.", "2- شروطه: يشترط لصحة العتق ووقوعه ما يلي:", "- أن يكون المعتق ممن يجوز تصرفه، وهو: البالغ العاقل الرشيد المختار، فلا يصح العتق من الصبي، ولا المجنون ولا المعتوه، ولا المكره؛ لقوله ﷺ: «رفع القلم عن ثلاثة، عن الصبي حتى يبلغ، وعن المجنون حتى يفيق، وعن النائم حتى يستيقظ». ولا يصح عتق المكره، كما لا تصح سائر تصرفاته.", "- أن يكون مالكا لمن يعتقه، فلا يصح العتق من غير المالك.", "- ألا يتعلق بالمعتق حق لازم يمنع عتقه، كدين أو جناية، فلا يصح عتقه حتى يؤدي الدين، أو تدفع دية جناية.", "- لا بد أن يكون العتق بلفظ صريح، أو ما يقوم مقامه من الكنايات، ولا يكفي في ذلك مجرد النية؛ لأنه إزالة ملك فلا يحصل بالنية المجردة.", "3- صيغته وألفاظه:", "- ألفاظه إما صريحة، وهي ما كان بلفظ العتق والتحرير، وما تصرف منهما، مثل: أنت حر أو محرر، أو عتيق، أو معتق، أو: أعتقتك.", "- وإما كنائية، كقوله: اذهب حيث شئت، أو: لا سبيل لي عليك، أو: لا سلطان لي عليك، أو: اغرب، أو ابعد عني، أو: خليتك، ونحو ذلك. وهذه الكنايات لا يحصل العتق بها، إلا إذا نوى قائلها العتق."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: من أحكام العتق", ["1- يجوز الاشتراك في العبد والأمة في الملك، بأن يملكه أكثر من شخص.", "2- إذا أعتق شخص نصيبه في عبد مشترك فقد عتق نصيبه من هذا العبد.", "وأما نصيب شريكه: فإن كان المعتق موسرا عتق نصيب شريكه من العبد، وقومت عليه حصة شريكه ودفع له القيمة. أما إذا كان الشريك المعتق معسرا غير موسر، فلا يعتق نصيب شريكه، ويسعى العبد في تحصيل قيمة نصيب هذا الشريك، فيعتق بعد تسليم ما عليه، ويكون في ذلك كالمكاتب.", "ودليل ذلك: قوله ﷺ: «من أعتق شركا له في عبد، فكان له مال يبلغ ثمن العبد قوم عليه العبد قيمة عدل، فأعطى شركاءه حصصهم، وعتق عليه العبد، وإلا فقد عتق منه ما عتق»، ولقوله ﷺ: «من أعتق نصيبا أو شقيصا - في مملوك، فخلاصه عليه في ماله، إن كان له مال، وإلا قوم عليه، فاستسعي به غير مشقوق عليه». والظاهر أن ذلك يكون باختيار العبد.", {"note": "حاشية (ص279): الشقص والشقيص: النصيب في العين المشتركة من كل شيء."}, {"note": "حاشية (ص279): يعني: طلب منه السعي في تحصيل القيمة ليخلص نفسه ويعتق."}, "3- يرث المعتق جميع مال من أعتقه دون العكس، لأن المعتق ولاؤه لمن أعتقه، كما قال ﷺ: «الولاء لمن أعتق». وقد جعل النبي ﷺ الولاء كالنسب، فقال: «الولاء لحمة كلحمة النسب».", {"note": "حاشية (ص280): معناه: المخالطة في الولاء، وأنها تجري مجرى النسب في الميراث."}, "4- من ضرب عبده ظلما، أو ضربا مبرحا، أو مثل به، أو أفسده، أو قطع له عضوا أو نحو ذلك، فإنه يعتق عليه، لقوله ﷺ: «من ضرب غلاما له حدا لم يأته، أو لطمه، فإن كفارته أن يعتقه». أما ما كان من ذلك ضربا خفيفا على سبيل التأديب فلا شيء فيه."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: التدبير", ["1- تعريفه: التدبير هو تعليق عتق الرقيق بموت سيده.", "يقال: دبر الرجل عبده تدبيرا: إذا أعتقه بعد موته، وكذا: أعتقه عن دبر.", "والمدبر: هو العبد الذي حصل له التدبير، سمي بذلك؛ لأن عتقه جعل دبر حياة سيده، فالموت يكون دبر الحياة.", "2- حكمه، ودليل ذلك:", "التدبير جائز، وهو صحيح باتفاق العلماء، والأصل فيه حديث جابر رضي الله عنه: أن رجلا من الأنصار أعتق غلاما له عن دبر، لم يكن له مال غيره، فبلغ ذلك النبي ﷺ، فقال: «من يشتريه مني؟» فاشتراه نعيم بن عبد الله بثمانمائة درهم، فدفعها إليه.", "3- من أحكام المدبر:", "- يجوز بيع المدبر مطلقا للحاجة، وأجاز بعض أهل العلم بيعه مطلقا للحاجة وغيرها؛ لما تقدم في حديث جابر.", "- المدبر يعتق من الثلث، لا من رأس المال؛ لأن حكمه حكم الوصية، فكلاهما لا ينفذ إلا بعد الموت.", "- ويجوز لسيده هبته؛ لأن الهبة مثل البيع.", "- يجوز للسيد وطء أمته المدبرة؛ لأنها مملوكته، وقد قال تعالى: ﴿إلا على أزواجهم أو ما ملكت أيمانهم فإنهم غير ملومين﴾ [المؤمنون: 6]."]], "ic": "scroll"}, {"story": ["المسألة الخامسة: المكاتب", ["1- تعريفه:", "الكتابة والمكاتبة لغة: مأخوذة من كتب بمعنى أوجب، والزم.", "وشرعا: هي إعتاق العبد نفسه من سيده بمال يكون في ذمته يؤدى مؤجلا.", "فالمكاتب - بفتح التاء -: هو العبد الذي علق عتقه بمال يدفعه لسيده، وبكسرها: من تقع منه. وسميت كتابة؛ لأن السيد يكتب بينه وبين عبده كتابا بما اتفقا عليه.", "2- حكم المكاتبة، ودليل ذلك:", "الكتابة جائزة مستحبة إذا طلبها العبد الصدوق المكتسب القادر على أداء المال الذي اشترطه عليه سيده، لقوله تعالى: ﴿والذين يبتغون الكتب مما ملكت أيمانكم فكاتبوهم إن علمتم فيهم خيرا﴾ [النور: 33].", "3- من أحكام المكاتبة:", "- يعتق العبد أو الأمة ويصيرا حرين متى أديا ما اتفقا عليه مع سيدهما، لقوله ﷺ: «المكاتب عبد ما بقي عليه من مكاتبته درهم». فمفهومه: أنه متى أدى ما عليه لم يعد عبدا، ويصير حرا بالأداء.", "- لا يعتق العبد إلا إذا أدى جميع كتابته، للحديث الماضي.", "- ولاء المكاتب يكون لسيده إذا أدى ما عليه، لقوله ﷺ: «الولاء لمن أعتق».", "- على السيد أن يضع عن المكاتب شيئا من المال الذي كاتبه عليه، لقوله تعالى: ﴿وآتوهم من مال الله الذي آتاكم﴾ [النور: 33]. قال ابن عباس رضي الله عنهما في هذه الآية: ضعوا عنهم من مكاتبتهم. ويخير السيد بين وضعه عنه وأخذه منه، ودفعه إليه.", "- يجعل المال على المكاتب منجما، نجمين فصاعدا، على أن تكون النجوم معلومة، ويعلم في كل نجم قدر المال المؤدى.", "- ليس للمكاتب أن يتزوج إلا بإذن سيده، لقوله ﷺ: «أيما عبد تزوج بغير إذن مواليه، فهو عاهر». ولا يتسرى كذلك إلا بإذنه.", "- يجوز بيع المكاتب، وتبقى الكتابة عليه في يد مشتريه، فإن أدى ما عليه عتق، ويكون ولاؤه لمشتريه، لقوله ﷺ لعائشة في قصة بريرة: «اشتريها وأعتقيها... فإن الولاء لمن أعتق»."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "العتق شرعا هو:", "o": ["تحرير الرقبة وتخليصها من الرق وإزالة الملك عنها", "بيع الرقبة", "تأجير الرقبة", "هبة الرقبة"], "h": "راجع: ص277 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «من أعتق رقبة، أعتق الله بكل عضو منها عضوا من أعضائه من النار»:", "o": ["حتى فرجه بفرجه", "حتى قلبه", "حتى لسانه", "حتى بصره"], "h": "راجع: ص277 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "﴿فك رقبة﴾ معناها:", "o": ["تخليص الشخص من الرق", "بيع الرقبة", "شراء الرقبة", "حبس الرقبة"], "h": "راجع: ص277 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "عتق الرجل:", "o": ["أفضل من عتق المرأة", "أقل من عتق المرأة", "مثل عتق المرأة", "غير جائز"], "h": "راجع: ص278 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "جعل الله العتق كفارة لـ:", "o": ["القتل والوطء في رمضان والأيمان", "السرقة", "الغيبة", "الزنا"], "h": "راجع: ص278 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "أركان العتق:", "o": ["ثلاثة: المعتق والمعتق والصيغة", "اثنان", "أربعة", "خمسة"], "h": "راجع: ص278 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "لا يصح العتق من الصبي ولا المجنون ولا المكره.", "a": true, "h": "راجع: ص278 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "يكفي في العتق مجرد النية بلا لفظ.", "a": false, "h": "راجع: ص279 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "من ألفاظ العتق الصريحة:", "o": ["أنت حر", "اذهب حيث شئت", "اغرب", "ابعد عني"], "h": "راجع: ص279 (المسألة الثانية)"}, {"t": "mcq", "d": 3, "q": "الكنايات لا يحصل بها العتق إلا:", "o": ["إذا نوى قائلها العتق", "بشهادة اثنين", "بإذن القاضي", "بعد سنة"], "h": "راجع: ص279 (المسألة الثانية)"}, {"t": "mcq", "d": 3, "q": "إذا أعتق شريك نصيبه في عبد مشترك وكان موسرا:", "o": ["قوم عليه نصيب شريكه وعتق العبد كله", "لا يعتق", "يعتق نصيبه فقط", "يباع العبد"], "h": "راجع: ص279 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «الولاء»:", "o": ["لمن أعتق", "لمن اشترى", "للورثة", "للحاكم"], "h": "راجع: ص280 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "من ضرب غلامه حدا لم يأته أو لطمه فكفارته:", "o": ["أن يعتقه", "أن يصوم", "أن يطعم", "أن يعتذر"], "h": "راجع: ص280 (المسألة الثالثة)"}, {"t": "mcq", "d": 1, "q": "التدبير هو:", "o": ["تعليق عتق الرقيق بموت سيده", "بيع الرقيق", "كتابة الرقيق", "هبة الرقيق"], "h": "راجع: ص280 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "اشترى نعيم بن عبد الله المدبر بـ:", "o": ["ثمانمائة درهم", "مائة درهم", "ألف درهم", "خمسمائة درهم"], "h": "راجع: ص280 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "المدبر يعتق من:", "o": ["الثلث", "رأس المال", "نصف المال", "الربع"], "h": "راجع: ص281 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «المكاتب عبد ما بقي عليه من مكاتبته»:", "o": ["درهم", "دينار", "نصف", "ثلث"], "h": "راجع: ص281 (المسألة الخامسة)"}, {"t": "tf", "d": 2, "q": "ليس للمكاتب أن يتزوج إلا بإذن سيده.", "a": true, "h": "راجع: ص282 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "قال ابن عباس في قوله تعالى ﴿وآتوهم من مال الله الذي آتاكم﴾:", "o": ["ضعوا عنهم من مكاتبتهم", "اعتقوهم", "بيعوهم", "اطردوهم"], "h": "راجع: ص282 (المسألة الخامسة)"}]}], "sum": [["في تعريف العتق، ومشروعيته، وفضله، ", "ص277-282"], ["أركان العتق، وشروطه، وصيغته وألفاظ", "ص277-282"], ["من أحكام العتق", "ص277-282"], ["التدبير", "ص277-282"]]}, {"id": "l75", "title": "الباب الرابع: الفرائض والمواريث", "group": "الكتاب الثامن: المواريث والوصايا والعتق", "map": {"center": "الباب الرابع\nالمواريث والوصايا", "nodes": [{"t": "معناها والحث على تعلمها", "s": []}, {"t": "الحقوق المتعلقة بالتركة وأسباب الم", "s": []}, {"t": "أقسام الورثة", "s": []}, {"t": "أقسام الورثة باعتبار الإرث", "s": []}, {"t": "في التعصيب", "s": []}]}, "paras": [{"t": "الباب الرابع: الفرائض والمواريث", "b": [{"pic": ["scroll", "book"], "cap": "ص282-291"}, {"story": ["المسألة الأولى: معناها والحث على تعلمها", ["علم الفرائض من أهم العلوم، فيجب على المسلمين الاهتمام به والتفقه فيه؛ لأن الحاجة ماسة إليه.", "ويسمى هذا العلم بالفرائض جمع فريضة، مأخوذة من الفرض وهو التقدير، كما قال تعالى: ﴿فنصف ما فرضتم﴾ [البقرة: 237] أي قدرتم.", "والفرض في الشرع: نصيب مقدر شرعا لمستحقه. وعلم الفرائض: هو العلم بالمواريث من حيث فقه أحكامها ومعرفة الحساب الموصل إلى قسمتها.", "والمواريث: جمع ميراث، وهو الحق المخلف عن الميت المنقول إلى الوارث.", "ويجب على المسلم أن يهتم بشأن المواريث، ولا يتصرف فيها تصرفا يغيرها عن وضعها الشرعي، فيورث غير الوارث أو يحرم الوارث من جميع حقوقه أو بعضها، فيعرض نفسه بذلك لسخط الله، وعقابه."]], "ic": "scroll"}, {"story": ["المسألة الثانية: الحقوق المتعلقة بالتركة وأسباب الميراث وموانعه", ["1- حقوق التركة: التركة هي ما يتركه الميت من الأموال النقدية، والعينية، والحقوق. ويتعلق بتركة الميت أربعة حقوق:", "1- مؤنة تجهيزه من ثمن كفن، وحنوط وأجرة دفن وغسل وغير ذلك.", "2- قضاء الديون، وديون الله مقدمة كالزكاة، وصدقة الفطر، والكفارة، والنذر، ثم ديون الآدميين.", "3- إخراج الوصايا بشرط أن تكون في حدود الثلث فأقل.", "4- الإرث، فيقسم ما بقي بعد ذلك على ورثته القسمة الشرعية.", "والإرث: هو انتقال مال الميت من بعده إلى حي، حسبما جاء في كتاب الله وسنة رسوله ﷺ.", "وقد يتعلق بالتركة حق للغير حال الحياة، وهي الحقوق العينية، كحق البائع في تسلم المبيع، وحق الراهن في المرهون؛ فهي تقدم على تجهيز الميت؛ لتعلقها بعين المال قبل صيرورته تركة.", "2- أسباب الإرث: أسباب الإرث ثلاثة، وهي:", "الأول: النكاح، وهو عقد الزوجية الصحيح بشاهدين وولي، ولو لم يحصل به وطء ولا خلوة، لعموم قوله تعالى: ﴿ولكم نصف ما ترك أزواجكم﴾ [النساء: 12].", "الثاني: النسب، أي: القرابة من الميت، وهي: الاتصال العضوي بين إنسان وآخرين بولادة قريبة أو بعيدة، وتشمل الأصول، والفروع، والحواشي.", "فالأصول: هم الآباء والأجداد وإن علوا بمحض الذكور، والفروع: هم الأولاد وأولاد البنين وإن نزلوا، والحواشي: هم الإخوة وبنوهم وإن نزلوا، والأعمام وإن علوا، وبنوهم وإن نزلوا.", "الثالث: الولاء، وهو رابطة سببها نعمة المعتق على رقيقه بالعتق، ولا يرث العتيق معتقه بالإجماع، فانحصرت أسباب الإرث في اثنين: النسب، والزواج الصحيح.", "3- موانع الإرث: موانع الإرث ثلاثة:", "1- القتل: اتفق العلماء على أن القتل العمد المحرم مانع من الميراث، فمن قتل مورثه ظلما لا يرثه؛ لقوله ﷺ: «ليس للقاتل من الميراث شيء».", "2- الرق: فلا يرث العبد قريبه؛ لأنه إذا ورث شيئا فسيكون لسيده دونه، وهو كذلك لا يورث؛ لأنه لا ملك له.", "3- اختلاف الدين بين المورث والوارث: فإن ذلك مانع من الميراث؛ لقوله ﷺ: «لا يرث الكافر المسلم ولا المسلم الكافر»."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: أقسام الورثة", ["الورثة على قسمين: ذكور، وإناث.", "فالوارثون من الذكور عشرة:", "1-2- الابن وابنه وإن نزل، لقوله تعالى: ﴿يوصيكم الله في أولادكم للذكر مثل حظ الأنثيين﴾ [النساء: 11].", "3-4- الأب وأبوه وإن علا كأبي الأب وأبي الجد، لقوله تعالى: ﴿ولأبويه لكل واحد منهما السدس مما ترك إن كان له ولد﴾ [النساء: 11]. والجد أب، وقد أعطاه النبي ﷺ السدس.", "5- الأخ من أي الجهات كان، سواء أكان شقيقا أو لأب أو لأم؛ لقوله تعالى: ﴿إن امرؤ هلك ليس له ولد وله أخت فلها نصف ما ترك وهو يرثها إن لم يكن لها ولد﴾ [النساء: 176]. وقال تعالى: ﴿وإن كان رجل يورث كلالة أو امرأة وله أخ أو أخت فلكل واحد منهما السدس﴾ [النساء: 12].", "6- ابن الأخ لغير أم، أما ابن الأخ لأم فلا يرث؛ لأنه من ذوي الأرحام.", "7-8- العم وابن العم من أبيه شقيقا أو لأب، لا لأم فإنه من ذوي الأرحام.", "9- الزوج، لقوله تعالى: ﴿ولكم نصف ما ترك أزواجكم﴾ [النساء: 12].", "10- المعتق ومن يحل محله؛ لقوله ﷺ: «الولاء لحمة كلحمة النسب»، وقوله ﷺ: «إنما الولاء لمن أعتق».", {"note": "حاشية (ص285): اللحمة: القرابة."}, "أما الوارثات من النساء فسبع:", "1-2- البنت وبنت الابن وإن نزل أبوها لمحض الذكور؛ لقوله تعالى: ﴿يوصيكم الله في أولادكم للذكر مثل حظ الأنثيين فإن كن نساء فوق اثنتين فلهن ثلثا ما ترك وإن كانت واحدة فلها النصف﴾ [النساء: 11].", "3- الأم؛ لقوله تعالى: ﴿ولأبويه لكل واحد منهما السدس مما ترك إن كان له ولد فإن لم يكن له ولد وورثه أبواه فلأمه الثلث فإن كان له إخوة فلأمه السدس﴾ [النساء: 11].", "4- الجدة؛ وقد فرض النبي ﷺ للجدة السدس؛ لحديث بريدة رضي الله عنه أن النبي ﷺ جعل للجدة السدس، إذا لم يكن دونها أم، فهي ترث، بشرط عدم وجود الأم.", "5- الأخت؛ من أي الجهات كانت شقيقة أو لأب أو لأم؛ لقوله تعالى: ﴿وإن كان رجل يورث كلالة أو امرأة وله أخ أو أخت فلكل واحد منهما السدس﴾ [النساء: 12]. وقال تعالى: ﴿إن امرؤ هلك ليس له ولد وله أخت فلها نصف ما ترك﴾ [النساء: 176]. وقوله تعالى: ﴿فإن كانتا اثنتين فلهما الثلثان مما ترك﴾ [النساء: 176].", "6- الزوجة؛ لقوله تعالى: ﴿ولهن الربع مما تركتم﴾ [النساء: 12].", "7- المعتقة؛ لقوله ﷺ: «إنما الولاء لمن أعتق»."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: أقسام الورثة باعتبار الإرث", ["القسم الأول: من يرث بالفرض - أي النصيب المقدر - فقط، وهم سبعة: الزوجان، والجدتان، والأم، وولداها.", "القسم الثاني: من يرث بالتعصيب - أي بلا تقدير - فقط، وهم اثنا عشر: الابن وابنه، والأخ الشقيق وابنه، والأخ لأب وابنه، والعم الشقيق وابنه، والعم لأب وابنه، والمعتق والمعتقة.", "القسم الثالث: من يرث بالتعصيب تارة، وبالفرض أخرى، ويجمع بينهما، وهما: الأب والجد.", "القسم الرابع: من يرث بالفرض تارة، وبالتعصيب أخرى، ولا يجمع بينهما، وهم: أصحاب النصف ما عدا الزوج، وأصحاب الثلثين.", "وجملة أصحاب الفروض واحد وعشرون:", "والفروض المعينة لأصحاب الفروض ستة، هي: النصف، والربع، والثمن، والثلثان، والثلث، والسدس.", "أولا: أصحاب النصف وهم خمسة:", "1- الزوج: عند عدم الفرع الوارث ذكر أو أنثى من الزوج أو من غيره.", "2- البنت: عند انفرادها عمن يشاركها من أخواتها، وانفرادها عمن يعصبها من إخوتها.", "3- بنت ابن: عند عدم المشارك والمعصب، والفرع الوارث.", "4- الأخ الشقيق: عند عدم المعصب والمشارك والفرع الوارث، والأصل الوارث.", "5- الأخت لأب: عند عدم المعصب والمشارك والفرع الوارث، والأصل الوارث والأخ الشقيق والأخت الشقيقة.", "ثانيا: أصحاب الربع وهم اثنان:", "1- الزوج: يستحقه عند وجود الفرع الوارث.", "2- الزوجة: تستحقه عند عدم الفرع الوارث.", "ثالثا: أصحاب الثمن: الزوجة فأكثر، عند وجود الفرع الوارث.", "رابعا: أصحاب الثلثين أربعة وهم:", "1- البنات: عند عدم المعصب، وهو ابن الميت لصلبه في حالة كونهن اثنتين فأكثر، كونهن جمعا.", "2- بنات الابن: عند عدم المعصب وهو ابن الابن، وعدم الفرع الوارث، وأن يكن اثنتين فأكثر.", "3- الأخوات الشقائق: أن يكن اثنتين فأكثر وعدم المعصب لهما وهو الأخ الشقيق فأكثر، وعدم الفرع الوارث، وهم الأولاد وأولاد البنين.", "4- الأخوات لأب: أن يكن اثنتين فأكثر، عند عدم المعصب، وعدم الفرع الوارث، وعدم الأشقاء والشقائق.", "خامسا: أصحاب الثلث اثنان وهما:", "1- الأم: تستحقه عند عدم الفرع الوارث وعدم الجمع من الأخوة والأخوات.", "2- الأخوة لأم: أن يكونوا اثنين فأكثر، وعدم الفرع الوارث من الأولاد وأولاد البنين، وعدم الأصل الوارث من الذكور وهما الأب والجد.", "سادسا: أصحاب السدس سبعة وهم:", "1- الأب: عند وجود الفرع الوارث من الأولاد وأولاد البنين.", "2- الجد: عند وجود الفرع الوارث من الأولاد وأولاد البنين.", "3- الأم: عند وجود الفرع الوارث وعند وجود الجمع من الأخوة.", "4- الجدة: عند عدم وجود الأم.", "5- بنت الابن: عند عدم المعصب وعدم الفرع الوارث الذي أعلى منها، سوى صاحبة النصف، فإنها لا تأخذ السدس إلا معها.", "6- الأخت لأب: عند عدم المعصب وهو أخوها، وأن تكون مع أخت شقيقة وارثة للنصف فرضا.", "7- الأخ أو الأخت لأم: عند عدم الفرع الوارث، وعدم الأصل من الذكور الوارثين، وأن يكون منفردا."]], "ic": "scroll"}, {"story": ["المسألة الخامسة: في التعصيب", ["العصبة: هم الذين يرثون بلا تقدير؛ لأن العاصب إذا انفرد حاز جميع المال، وإذا كان معه صاحب فرض أخذ ما بقي بعد الفرض.", "لقول النبي ﷺ: «ألحقوا الفرائض بأهلها، فما بقي فلأولى رجل ذكر».", "يعني: أقرب رجل.", "والعصبة على ثلاثة أقسام: عصبة بالنفس، وعصبة بالغير، وعصبة مع الغير.", "1- العصبة بالنفس: هم الابن وابنه وإن نزل، والأب والجد من قبل الأب وإن علا، والأخ الشقيق والأخ لأب وابناهما من قبل الأب وإن علا، والأخ الشقيق والأخ لأب وابناهما وإن نزلا، والعم الشقيق والعم لأب وإن علوا وابناهما وإن نزلا، والمعتق والمعتقة، فمن انفرد منهم حاز جميع المال، وإذا كانوا مع أصحاب الفروض يأخذون ما بقي، وإن لم يبق شيء أسقطوا.", "2- العصبة بالغير: هم البنت، وبنت الابن، والأخت الشقيقة والأخت لأب، كل واحدة منهن مع أخيها، وتزيد بنت الابن بأنه يعصبها ابن في درجتها مطلقا أخوها أو ابن عمها وابن الابن الذي هو أنزل منها إذا احتاجت إليه. ومن عداهم من الذكور لا ترث أخواتهم معهم شيئا كأبناء الإخوة والأعمام وأبناء الأعمام.", "3- العصبة مع الغير: وهم الأخوات الشقيقات مع البنات وبنات الابن، وإذا اجتمع عاصبان فأكثر، فإن اتحدا في الجهة والقوة والدرجة اشتركا في الميراث كالأبناء والأخوة، وإن اختلفا في الجهة يقدم الأقوى كالابن والأب، وإن اتحدا في الجهة واختلفا في الدرجة يقدم الأقرب درجة، كالابن مع ابن الابن، وإن اتحدا في الجهة والدرجة، واختلفا في القوة، فيقدم الأقوى، كالأخ الشقيق مع الأخ لأب."]], "ic": "scroll"}, {"story": ["المسألة السادسة: الحجب", ["الحجب هو: المنع من كل الميراث أو بعضه لوجود شخص آخر أحق منه.", "وهو على قسمين:", "1- حجب الأوصاف: ويكون فيمن اتصف بأحد موانع الإرث: الرق، أو القتل، أو اختلاف الدين، فمن اتصف بواحدة من هذه الأوصاف لم يرث لوجوده كالعدم، ويدخل على جميع الورثة.", "2- حجب الأشخاص: وينصرف إليه اسم الحجب عند الإطلاق. وهو على قسمين:", "الأول: حجب الحرمان: وهو منع شخص معين من الإرث بالكلية، ويدخل على جميع الورثة ما عدا ستة: الأب والأم، والزوج والزوجة، والابن والبنت.", "الثاني: حجب نقصان: وهو منعه من إرث أكثر إلى إرث أقل.", "وسبب هذا الحجب: وجود شخص أحق منه، ولذلك سمي حجب الأشخاص. وهو سبعة أنواع:", "1- انتقال من فرض إلى فرض أقل منه، وهذا في حق من له فرضان، كالزوجين، والأم، وبنت الابن، والأخت لأب.", "2- الانتقال من فرض إلى تعصيب، وهذا في حق ذوات النصف والثلثين، إذا كان معهن من يعصبهن.", "3- انتقال من تعصيب إلى فرض أقل منه، وهذا في حق الأب والجد من الإرث بالتعصيب إلى الإرث بالفرض.", "4- انتقال من تعصيب إلى تعصيب أقل منه، وهو في حق الأخت الشقيقة أو لأب، فإن لهما مع أخيهما أقل مما لهما مع البنت أو بنت الابن.", "5- المزاحمة في الفرض، كازدحام الزوجين في الربع والجدات في السدس.", "6- المزاحمة في التعصيب، كازدحام العصبات في المال أو فيما أبقت الفروض.", "7- المزاحمة في العول في حق ذوي الفروض في الأصول التي يدخلها العول.", {"note": "حاشية (ص291): العول: هو الزيادة في سهام ذوي الفروض، والنقصان من مقادير أنصبتهم في الإرث."}, "وعلى هذا نقول: إن من أدلى بواسطة حجبته تلك الواسطة، والأصول لا يحجبهم إلا الأصول، والفروع لا تحجبهم إلا فروع أعلى منهم، والحواشي تحجبهم الأصول والفروع والحواشي."]], "ic": "scroll"}, {"story": ["المسألة السابعة: في ذوي الأرحام", ["ذوو الأرحام: هم كل قريب ليس بذي فرض ولا عصبة، وهم على أربعة أصناف:", "1- من ينتمي إلى الميت، وهم أولاد البنات، وأولاد بنات البنين، وإن نزلوا.", "2- من ينتمي إليهم الميت، وهم الأجداد الساقطون والجدات السواقط، وإن علوا.", "3- من ينتمي إلى أبوي الميت، وهم أولاد الأخوات وبنات الأخوة وأولاد الأخوة لأم ومن يدلي بهم، وإن نزلوا.", "4- من ينتمي إلى أجداد الميت وجداته، وهم الأعمام لأم والعمات مطلقا وبنات الأعمام مطلقا والأخوال وإن تباعدوا وأولادهم، وإن نزلوا. ودليل توريثهم قوله تعالى: ﴿وأولوا الأرحام بعضهم أولى ببعض في كتاب الله﴾ [الأنفال: 75]. وقال ﷺ: «الخال وارث من لا وارث له». وكيفية توريثهم أن ينزل كل واحد منهم منزلة من أدلى به، فيجعل له نصيبه. والله أعلم."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "الفرض في الشرع:", "o": ["نصيب مقدر شرعا لمستحقه", "نصيب غير مقدر", "مال الغنيمة", "مال الزكاة"], "h": "راجع: ص283 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "المواريث جمع ميراث، وهو:", "o": ["الحق المخلف عن الميت المنقول إلى الوارث", "مال الدين", "مال الوصية", "مال الهبة"], "h": "راجع: ص283 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "عدد الحقوق المتعلقة بتركة الميت:", "o": ["أربعة", "اثنان", "ثلاثة", "خمسة"], "h": "راجع: ص283 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "أول الحقوق المتعلقة بالتركة:", "o": ["مؤنة تجهيز الميت", "الوصية", "الإرث", "الدين"], "h": "راجع: ص283 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "أسباب الإرث ثلاثة، وهي:", "o": ["النكاح والنسب والولاء", "النكاح والصداقة والجوار", "النسب والهبة", "الولاء والوصية"], "h": "راجع: ص284 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "موانع الإرث ثلاثة، وهي:", "o": ["القتل والرق واختلاف الدين", "الفقر والمرض والسفر", "الجنون والصغر والمرض", "الغنى والجهل والبعد"], "h": "راجع: ص284 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «ليس للقاتل من الميراث»:", "o": ["شيء", "نصف", "ثلث", "ربع"], "h": "راجع: ص284 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "يرث الكافر المسلم ولا يرث المسلم الكافر.", "a": false, "h": "راجع: ص284 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "عدد الوارثين من الذكور:", "o": ["عشرة", "سبعة", "اثنا عشر", "ثمانية"], "h": "راجع: ص285 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "عدد الوارثات من النساء:", "o": ["سبع", "عشر", "خمس", "ست"], "h": "راجع: ص285 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "الفروض المعينة لأصحاب الفروض:", "o": ["ستة", "ثلاثة", "أربعة", "ثمانية"], "h": "راجع: ص287 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "أصحاب النصف:", "o": ["خمسة", "اثنان", "أربعة", "سبعة"], "h": "راجع: ص287 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "الزوج يستحق الربع عند:", "o": ["وجود الفرع الوارث", "عدم الفرع الوارث", "عدم الأولاد", "عدم الأب"], "h": "راجع: ص287 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "الزوجة تستحق الثمن عند:", "o": ["وجود الفرع الوارث", "عدم الفرع الوارث", "عدم الأم", "عدم الجد"], "h": "راجع: ص287 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "العصبة هم الذين يرثون:", "o": ["بلا تقدير", "بتقدير", "بالفرض فقط", "بالوصية"], "h": "راجع: ص288 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «ألحقوا الفرائض بأهلها، فما بقي»:", "o": ["فلأولى رجل ذكر", "فللفقراء", "فللحاكم", "فلبيت المال"], "h": "راجع: ص289 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "العصبة على ثلاثة أقسام:", "o": ["بالنفس وبالغير ومع الغير", "بالنسب والسبب", "بالفرض والتقدير", "بالقرب والبعد"], "h": "راجع: ص289 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "الحجب هو:", "o": ["المنع من كل الميراث أو بعضه لوجود شخص آخر أحق منه", "إعطاء الميراث", "تقسيم الميراث", "نقل الميراث"], "h": "راجع: ص289 (المسألة السادسة)"}, {"t": "mcq", "d": 2, "q": "الحجب على قسمين:", "o": ["حجب الأوصاف وحجب الأشخاص", "حجب الأموال وحجب الأولاد", "حجب القرب والبعد", "حجب الذكور والإناث"], "h": "راجع: ص290 (المسألة السادسة)"}, {"t": "mcq", "d": 3, "q": "حجب الحرمان لا يدخل على ستة هم:", "o": ["الأب والأم والزوج والزوجة والابن والبنت", "الأخ والأخت والعم والعمة", "الجد والجدة والخال والخالة", "الابن والأخ والعم"], "h": "راجع: ص290 (المسألة السادسة)"}, {"t": "mcq", "d": 2, "q": "ذوو الأرحام هم:", "o": ["كل قريب ليس بذي فرض ولا عصبة", "كل من له فرض", "كل عصبة", "كل من تزوج الميت"], "h": "راجع: ص291 (المسألة السابعة)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «الخال»:", "o": ["وارث من لا وارث له", "لا يرث", "يرث النصف", "يحجب الأم"], "h": "راجع: ص291 (المسألة السابعة)"}]}], "sum": [["معناها والحث على تعلمها", "ص282-291"], ["الحقوق المتعلقة بالتركة وأسباب الم", "ص282-291"], ["أقسام الورثة", "ص282-291"], ["أقسام الورثة باعتبار الإرث", "ص282-291"]]}, {"id": "l76", "title": "الباب الأول: النكاح", "group": "الكتاب التاسع: النكاح والطلاق", "map": {"center": "الباب الأول\nالنكاح والطلاق", "nodes": [{"t": "تعريف النكاح، وأدلة مشروعيته", "s": []}, {"t": "الحكمة في مشروعية النكاح", "s": []}, {"t": "حكم النكاح واختيار الزوجة", "s": []}, {"t": "من أحكام الخطبة، وآدابها", "s": []}, {"t": "حكم النظر إلى المخطوبة", "s": []}]}, "paras": [{"t": "الباب الأول: النكاح", "b": [{"pic": ["scroll", "book"], "cap": "ص292-302"}, {"story": ["المسألة الأولى: تعريف النكاح، وأدلة مشروعيته", ["أ- تعريف النكاح:", "النكاح لغة: الضم والجمع والتداخل، يقال: مأخوذ من: تناكحت الأشجار، إذا انضم بعضها إلى بعض، أو من: نكح المطر الأرض، إذا اختلط بثراها.", "وشرعا: عقد يتضمن إباحة استمتاع كل من الزوجين بالآخر، على الوجه المشروع.", "ب- أدلة مشروعية النكاح:", "الأصل في مشروعية النكاح: الكتاب والسنة والإجماع.", "فقد دل على مشروعية النكاح آيات كثيرة: منها قوله تعالى: ﴿فانكحوا ما طاب لكم من النساء مثنى وثلاث وربع فإن خفتم ألا تعدلوا فواحدة أو ما ملكت أيمانكم﴾ [النساء: 3]. وقوله تعالى: ﴿وأنكحوا الأيامى منكم والصالحين من عبادكم وإمائكم﴾ [النور: 32].", {"note": "حاشية (ص292): الأيامى: جمع أيم وهو من لا زوج له من الرجال، ومن لا زوج لها من النساء."}, "وأحاديث كثيرة، منها حديث ابن مسعود رضي الله عنه عن النبي ﷺ قال: «يا معشر الشباب من استطاع منكم الباءة فليتزوج، فإنه أغض للبصر، وأحصن للفرج، ومن لم يستطع فعليه بالصوم، فإنه له وجاء». وحديث معقل بن يسار رضي الله عنه أن رسول الله ﷺ قال: «تزوجوا الودود الولود فإني مكاثر بكم الأمم».", {"note": "حاشية (ص292): الباءة: النكاح والتزوج، والمقصود هنا: تكاليف الزواج ومؤنه."}, "وقد أجمع المسلمون على مشروعية النكاح."]], "ic": "scroll"}, {"story": ["المسألة الثانية: الحكمة في مشروعية النكاح", ["لقد شرع الله سبحانه وتعالى النكاح لحكم سامية يمكن إجمالها في الآتي:", "1- إعفاف الفروج؛ إذ خلق الله تعالى هذا الإنسان، وغرز في كيانه الغريزة الجنسية، فشرع الله الزواج؛ لإشباع هذه الرغبة، ولعدم العبث فيها.", "2- حصول السكن والأنس بين الزوجين وحصول الراحة والاستقرار؛ قال تعالى: ﴿ومن آياته أن خلق لكم من أنفسكم أزواجا لتسكنوا إليها وجعل بينكم مودة ورحمة﴾ [الروم: 21].", "3- حفظ الأنساب وترابط القرابة والأرحام بعضها ببعض.", "4- بقاء النسل البشري، وتكثير عدد المسلمين، لإغاظة الكفار بهم، ولنشر دين الله.", "5- الحفاظ على الأخلاق من الهبوط والتردي في هاوية الزنى والعلاقات المشبوهة."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: حكم النكاح واختيار الزوجة", ["1- حكم النكاح: يختلف حكم النكاح من شخص لآخر:", "أولا: يكون واجبا إذا كان الشخص يخاف على نفسه من الوقوع في الزنى؛ وكان قادرا على تكاليف الزواج ونفقاته؛ لأن الزواج طريق إعفافه، وصونه عن الوقوع في الحرام. فإن لم يستطع فعليه بالصوم، وليستعفف حتى يغنيه الله من فضله.", "ثانيا: يكون مندوبا مسنونا إذا كان الشخص ذا شهوة ويملك مؤنة النكاح، ولا يخاف على نفسه الزنى، لعموم الآيات والأحاديث الواردة في الحث على الزواج والترغيب فيه.", "ثالثا: يكون مكروها إذا كان الشخص غير محتاج إليه، بأن كان عنينا، أو كبيرا، أو مريضا لا شهوة له. والعنين: الذي لا يقدر على إتيان النساء، أو لا يشتهيهن.", "2- اختيار الزوجة ومقومات ذلك:", "ويسن نكاح المرأة ذات الدين والعفاف والأصل الطيب والحسب والجمال؛ لحديث أبي هريرة رضي الله عنه أن النبي ﷺ قال: «تنكح المرأة لأربع: لمالها، ولحسبها، ولجمالها، ولدينها، فاظفر بذات الدين تربت يداك». فيحرص على ذات الدين في المقام الأول، ويجعل ذلك أساس الاختيار لا غيره، ويسن أيضا اختيار الزوجة الولود؛ لحديث أنس رضي الله عنه عن النبي ﷺ أنه قال: «تزوجوا الودود الولود فإني مكاثر بكم الأمم يوم القيامة». ويسن اختيار البكر؛ لحديث جابر رضي الله عنه أن النبي ﷺ قال له: «فهلا بكرا تلاعبها وتلاعبك»، إلا إذا كانت هناك مصلحة ترجح نكاح الثيب، فيقدمها على البكر؛ ويختار الجميلة؛ لأنها أسكن لنفسه، وأغض لبصره، وأدعى لمودته.", {"note": "حاشية (ص294): معنى (تربت يداك): أي افتقرت يداك، والتصقت بالتراب. وهي كلمة يراد بها الحث والتحريض، لا الدعاء."}]], "ic": "scroll"}, {"story": ["المسألة الرابعة: من أحكام الخطبة، وآدابها", ["الخطبة: هي إظهار الرغبة في الزواج بامرأة معينة، وإعلام وليها بذلك.", "ومن أحكام الخطبة وآدابها:", "1- تحرم خطبة المسلم على خطبة أخيه الذي أجيب لطلبه ولو تعريضا، وعلم الثاني بإجابة الأول؛ لقوله ﷺ: «لا يخطب الرجل على خطبة أخيه حتى ينكح أو يترك»، وذلك لما في التقدم للخطبة من الإفساد على الأول، وإيقاع العداوة.", "2- يحرم التصريح بخطبة المعتدة البائن؛ لقوله تعالى: ﴿ولا جناح عليكم فيما عرضتم به من خطبة النساء﴾ [البقرة: 235] فيجوز له التعريض، كأن يقول: وددت أن ييسر الله لي امرأة صالحة، أو: إني أريد الزواج، فنفي الحرج عن المعرض بالخطبة يدل على عدم جواز التصريح، فقد يحملها الحرص على الزواج على الإخبار بانقضاء عدتها قبل انقضائها. وأما المعتدة الرجعية فيحرم حتى التعريض؛ لأنها في حكم الزوجات.", "3- من استشير في خاطب أو مخطوبة وجب عليه أن يذكر ما فيهما من محاسن ومساوئ، ولا يكون ذلك من الغيبة، بل من النصيحة المرغب فيها شرعا.", "4- الخطبة مجرد وعد بالزواج، وإبداء الرغبة فيه، وليست زواجا؛ لذا يبقى كل من الخاطب والمخطوبة أجنبيا عن الآخر."]], "ic": "scroll"}, {"story": ["المسألة الخامسة: حكم النظر إلى المخطوبة", ["من أراد أن يخطب امرأة يشرع ويسن له النظر إلى ما يظهر منها عادة، كوجهها وكفيها وقدميها؛ لحديث سهل بن سعد رضي الله عنه: «أن امرأة جاءت إلى النبي ﷺ قالت: يا رسول الله، جئت لأهب لك نفسي، فصعد النظر إليها وصوبه، ثم طأطأ رأسه». وحديث أبي هريرة رضي الله عنه قال: كنت عند النبي ﷺ فأتاه رجل فأخبره أنه تزوج امرأة من الأنصار، فقال له رسول الله ﷺ: «أنظرت إليها؟» قال: لا، قال: «فاذهب فانظر إليها، فإن في أعين الأنصار شيئا».", {"note": "حاشية (ص295): قيل: المراد صغر، وقيل: زرقة."}, "وحديث جابر رضي الله عنه قال: قال رسول الله ﷺ: «إذا خطب أحدكم المرأة، فإن استطاع أن ينظر إلى ما يدعوه إلى نكاحها فليفعل». قال: فخطبت امرأة، فكنت أتخبأ لها، حتى رأيت منها ما دعاني إلى نكاحها، فتزوجتها.", "والحكمة من ذلك: أن النظر أدعى لحظوتها في نفسه، ومن ثم أدعى للألفة والمحبة ودوام المودة بينهما، كما في قوله ﷺ للمغيرة، وقد خطب امرأة: «انظر إليها، فإنه أحرى أن يؤدم بينكما». أي: تكون بينكما المحبة والاتفاق."]], "ic": "scroll"}, {"story": ["المسألة السادسة: شروط النكاح وأركانه", ["1- شروط النكاح: يشترط في النكاح الآتي:", "1- تعيين كل من الزوجين: فلا يصح عقد النكاح على واحدة لا يعينها كقوله: «زوجتك بنتي» إن كان له أكثر من واحدة، أو يقول: «زوجتها ابنك» إن كان له عدة أبناء. بل لا بد من تعيين ذلك بالاسم: كفاطمة ومحمد، أو بالصفة: كالكبرى أو الصغرى.", "2- رضا كل من الزوجين بالآخر: فلا يصح نكاح الإكراه؛ لحديث أبي هريرة رضي الله عنه أن رسول الله ﷺ قال: «لا تنكح الأيم حتى تستأمر، ولا البكر حتى تستأذن».", "3- الولاية في النكاح: فلا يعقد على المرأة إلا وليها؛ لقوله ﷺ: «لا نكاح إلا بولي»، ويشترط في الولي أن يكون: رجلا، بالغا، عاقلا، حرا، عدلا ولو ظاهرا.", "4- الشهادة على عقد النكاح: فلا يصح إلا بشاهدي عدل مسلمين، بالغين، عدلين، ولو ظاهرا؛ لقول النبي ﷺ: «لا نكاح إلا بولي وشاهدي عدل، وما كان غير ذلك فهو باطل». قال الترمذي: «العمل على هذا عند أهل العلم من أصحاب النبي ﷺ ومن بعدهم من التابعين وغيرهم قالوا: لا نكاح إلا بشهود..» واشتراط الشهادة في النكاح احتياط للنسب خوف الإنكار.", "5- خلو الزوجين من الموانع التي تمنع من الزواج، من نسب أو سبب، كرضاع ومصاهرة واختلاف دين، ونحو ذلك من الأسباب؛ كأن يكون أحدهما محرما بحج، أو عمرة.", "2- أركان النكاح: وأركان النكاح التي بها قوامه ووجوده هي:", "1- العاقدان: وهما الزوج والزوجة الخاليان من موانع الزواج التي سبقت الإشارة إليها، والآتي ذكرها في بحث المحرمات.", "2- الإيجاب: وهو اللفظ الصادر من الولي، أو من يقوم مقامه (وكيلا) بلفظ إنكاح أو تزويج.", "3- القبول: وهو اللفظ الصادر من الزوج أو من يقوم مقامه، بلفظ: قبلت، أو: رضيت هذا الزواج.", "ولا بد من تقدم الإيجاب على القبول."]], "ic": "scroll"}, {"story": ["المسألة السابعة: المحرمات في النكاح", ["المحرمات في النكاح قسمان: قسم التحريم المؤبد، وقسم التحريم المؤقت.", "القسم الأول: المحرمات تأبيدا:", "يحرم تأبيدا أربع عشرة امرأة: سبع يحرمن بالنسب وسبع بالسبب. ويقصد بالتأبيد عدم جواز نكاحهن أبدا، مهما كانت الأحوال. ولهذه الحرمة ثلاثة أسباب: القرابة، والمصاهرة، والرضاع.", "أولا: المحرمات بالقرابة:", "1- الأم وأم الأم وأم الأب. ويعبر عنهن بأصول الإنسان.", "2- البنت وبنت البنت وبنت الابن. ويعبر عنهن بفروع الإنسان.", "3- الأخت الشقيقة أو الأخت لأب أو الأخت لأم. ويعبر عنهن بفروع الأبوين.", "4- بنت الأخ الشقيق، وبنت الأخ لأب وبنت الأخ لأم.", "5- بنت الأخت الشقيقة أو لأب أو لأم.", "6- العمة وهي أخت الأب، ومثلها عمة الأب وعمة الأم. ويعبر عنهن بفروع الجدين من جهة الأب.", "7- الخالة وهي أخت الأم ومثلها خالة الأم وخالة الأب. ويعبر عنهن بفروع الجدين من جهة الأم.", "فهؤلاء النسوة لا يجوز نكاح واحدة منهن بحال؛ لقوله تعالى: ﴿حرمت عليكم أمهاتكم وبناتكم وأخواتكم وعماتكم وخالاتكم وبنات الأخ وبنات الأخت﴾ [النساء: 23].", "ثانيا: المحرمات بالمصاهرة:", "ويحرم بها الآتي:", "1- زوجة الأب ومثلها زوجة الجد أب الأب، وزوجة الجد أب الأم. ويعبر عنهن بزوجات الأصول؛ لقوله تعالى: ﴿ولا تنكحوا ما نكح آباؤكم من النساء إلا ما قد سلف إنه كان فاحشة ومقتا وساء سبيلا﴾ [النساء: 22].", "2- زوجة الابن، وزوجة ابن الابن، وابن البنت أيضا، وهكذا زوجات الفروع؛ لقوله تعالى: ﴿وحلائل أبنائكم الذين من أصلابكم﴾ [النساء: 23].", "3- أم الزوجة، ومثل أمها جميع أصولها من النساء كأم الزوجة؛ لقوله تعالى: ﴿وأمهات نسائكم﴾ [النساء: 23]. وهؤلاء الثلاثة يحرمن بمجرد العقد، سواء دخل بالسبب المحرم أو لم يدخل.", "4- بنت الزوجة وهي المسماة بالربيبة، فهي حرام على زوج أمها؛ لقوله تعالى: ﴿وربائبكم اللاتي في حجوركم من نسائكم اللاتي دخلتم بهن﴾ [النساء: 23]. ولا يشترط في التحريم أن تكون الربيبة تربت في حجر زوج أمها، وإنما ذكر قيد الحجر لبيان الغالب. فهذه البنت تحرم على الرجل إذا دخل بأمها، فإن لم يدخل بها، كأن طلق الأم، أو ماتت قبل الدخول، فإنه يجوز له نكاح ابنتها؛ لقوله تعالى: ﴿فإن لم تكونوا دخلتم بهن فلا جناح عليكم﴾ [النساء: 23].", "5- يحرم على المرأة زوج أمها، وزوج ابنتها، وابن زوجها، وأبو زوجها.", "ثالثا: المحرمات بالرضاع:", "يحرم بالرضاع سبع نسوة، ذكر القرآن الكريم منهن اثنتين، وألحقت السنة بهن خمسا.", "أ) المحرمات بالقرآن الكريم:", "1- الأم بالرضاع: وهي المرأة التي أرضعتك، ويلحق بها أمها، وأم أمها، وأم أبيها.", "2- الأخت بالرضاع: وهي التي رضعت من أمك أو رضعت من أمها أو رضعت أنت وهي من امرأة واحدة، أو رضعت من زوجة أبيها، أو رضعت هي من زوجة أبيك؛ لقوله تعالى: ﴿وأمهاتكم اللاتي أرضعنكم وأخواتكم من الرضاعة﴾ [النساء: 23].", "ب) المحرمات بالسنة المطهرة:", "1- بنت الأخ من الرضاع.", "2- بنت الأخت من الرضاع.", "3- العمة من الرضاع. وهي التي رضعت مع أبيك.", "4- الخالة من الرضاع. وهي التي رضعت مع أمك.", "5- البنت من الرضاع. وهي التي رضعت من زوجتك، فيكون الرجل أبا لها من الرضاع.", "ودليل تحريم هؤلاء النساء من السنة حديث عائشة رضي الله عنها قالت: قال رسول الله ﷺ: «إن الرضاعة تحرم ما تحرم الولادة». وحديث ابن عباس رضي الله عنهما قال: قال رسول الله ﷺ في بنت حمزة: «إنها لا تحل لي، إنها ابنة أخي من الرضاعة، ويحرم من الرضاعة ما يحرم من الرحم».", "القسم الثاني: المحرمات تأقيتا:", "يحرم تأقيتا عدة نساء يمكن تقسيمهن إلى نوعين:", "النوع الأول: ما يحرم من أجل الجمع.", "النوع الثاني: ما كان تحريمه لعارض.", "النوع الأول: ما يحرم من أجل الجمع:", "1- الجمع بين الأختين، سواء كانتا من النسب أو من الرضاع، وسواء عقد عليهما معا أو متفرقا. لقوله تعالى: ﴿وأن تجمعوا بين الأختين﴾ [النساء: 23].", "2- الجمع بين المرأة وعمتها وبين المرأة وخالتها، وبين المرأة وبنت أختها. أو بنت أخيها، أو بنت ابنها، أو بنت ابنتها.", "والقاعدة هنا: أن الجمع يحرم بين كل امرأتين لو فرضت إحداهما ذكرا لما جاز له أن يتزوج الأخرى. ودليل ذلك حديث أبي هريرة رضي الله عنه أن رسول الله ﷺ قال: «لا يجمع بين المرأة وعمتها، ولا بين المرأة وخالتها».", "وحديث أبي هريرة رضي الله عنه: «أن رسول الله ﷺ نهى أن تنكح المرأة على عمتها، ولا العمة على بنت أخيها، ولا المرأة على خالتها، ولا الخالة على بنت أختها، ولا تنكح الكبرى على الصغرى، ولا الصغرى على الكبرى». كما أجمع العلماء على هذا التحريم.", "النوع الثاني: ما كان تحريمه لعارض:", "1- يحرم تزوج المعتدة من الغير؛ لقوله تعالى: ﴿ولا تعزموا عقدة النكاح حتى يبلغ الكتاب أجله﴾ [البقرة: 235].", "2- يحرم تزوج من طلقها ثلاثا حتى يطأها زوج غيره، بنكاح صحيح؛ لقوله تعالى: ﴿فإن طلقها فلا تحل له من بعد حتى تنكح زوجا غيره﴾ [البقرة: 230].", "3- يحرم تزوج المحرمة حتى تحل من إحرامها؛ لحديث عثمان رضي الله عنه أن رسول الله ﷺ قال: «لا ينكح المحرم، ولا ينكح، ولا يخطب».", "4- يحرم تزوج الكافر بالمرأة المسلمة؛ لقوله تعالى: ﴿ولا تنكحوا المشركين حتى يؤمنوا﴾ [البقرة: 221].", "5- ويحرم على الرجل المسلم أن يتزوج الكافرة إلا الكتابية، فيجوز له أن يتزوج بها؛ لقوله تعالى: ﴿ولا تنكحوا المشركات حتى يؤمن﴾ [البقرة: 221]، وقوله تعالى: ﴿والمحصنات من الذين أوتوا الكتاب من قبلكم﴾ [المائدة: 5]. يعني: فهن حل لكم.", "6- يحرم على الحر المسلم أن يتزوج الأمة المسلمة، إلا إذا خاف على نفسه الزنى، ولم يقدر على مهر الحرة، أو ثمن الأمة، فيجوز حينئذ تزوج الأمة المسلمة؛ لقوله تعالى: ﴿ومن لم يستطع منكم طولا أن ينكح المحصنات المؤمنات فمن ما ملكت أيمانكم من فتياتكم المؤمنات﴾ إلى قوله تعالى: ﴿ذلك لمن خشي العنت منكم﴾ [النساء: 25].", "7- يحرم على العبد المسلم أن يتزوج سيدته؛ لأن العلماء أجمعوا على ذلك، وللمنافاة بين كونها سيدته وكونه زوجا لها.", "8- يحرم على السيد أن يتزوج مملوكته؛ لأن عقد الملك أقوى من عقد النكاح."]], "ic": "scroll"}, {"story": ["المسألة الثامنة: حكم نكاح الكتابية", ["لقد أباح الإسلام نكاح الحرائر من أهل الكتاب؛ لقوله تعالى: ﴿اليوم أحل لكم الطيبات وطعام الذين أوتوا الكتاب حل لكم وطعامكم حل لهم والمحصنات من المؤمنات والمحصنات من الذين أوتوا الكتاب من قبلكم إذا آتيتموهن أجورهن﴾ [المائدة: 5].", "وقد أجمع العلماء على جواز نكاح نساء أهل الكتاب.", "ويقصد بأهل الكتاب الذين يجوز نكاح نسائهم: أهل التوراة والإنجيل؛ لقوله تعالى: ﴿أن تقولوا إنما أنزل الكتاب على طائفتين من قبلنا﴾ [الأنعام: 156]."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "ما تعريف النكاح شرعا؟", "o": ["عقد يتضمن إباحة استمتاع كل من الزوجين بالآخر، على الوجه المشروع", "هو المال الذي وجب على الزوج دفعه لزوجته", "فرقة تجري بين الزوجين على عوض", "حل قيد النكاح أو بعضه"], "h": "راجع: ص292 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "من الأمور التي يشترط لصحة النكاح:", "o": ["الولاية والشهادة", "أن يكون الصداق ذهبا", "إعلان الدف", "الوليمة"], "h": "راجع: ص296 (المسألة السادسة)"}, {"t": "tf", "d": 1, "q": "يحرم الجمع بين المرأة وعمتها وبين المرأة وخالتها.", "a": true, "h": "راجع: ص301 (المسألة السابعة)"}, {"t": "tf", "d": 2, "q": "يجوز للمسلم أن يتزوج الكتابية.", "a": true, "h": "راجع: ص302 (المسألة الثامنة)"}]}], "sum": [["تعريف النكاح، وأدلة مشروعيته", "ص292-302"], ["الحكمة في مشروعية النكاح", "ص292-302"], ["حكم النكاح واختيار الزوجة", "ص292-302"], ["من أحكام الخطبة، وآدابها", "ص292-302"]]}, {"id": "l77", "title": "الباب الثاني: في الصداق وحقوق الزواج وواجباته، وليمة العرس", "group": "الكتاب التاسع: النكاح والطلاق", "map": {"center": "الباب الثاني\nالنكاح والطلاق", "nodes": [{"t": "تعريف الصداق، ومشروعيته، وحكمه", "s": []}, {"t": "حده، وحكمته، وتسميته", "s": []}, {"t": "حكم المغالاة في الصداق", "s": []}, {"t": "الحقوق الزوجية", "s": []}, {"t": "إعلان النكاح", "s": []}]}, "paras": [{"t": "الباب الثاني: في الصداق وحقوق الزواج وواجباته، وليمة العرس", "b": [{"pic": ["scroll", "book"], "cap": "ص302-311"}, {"story": ["المسألة الأولى: تعريف الصداق، ومشروعيته، وحكمه", ["أ- تعريف الصداق:", "لغة: مأخوذ من الصدق خلاف الكذب.", "وشرعا: هو المال الذي وجب على الزوج دفعه لزوجته، بسبب عقد النكاح.", "وسمي الصداق صداقا لإشعاره بصدق رغبة باذله في النكاح، ويسمى أيضا: المهر، والنحلة، والعقر.", "ب- مشروعيته:", "الأصل في مشروعية الصداق الكتاب والسنة والإجماع، كما سيأتي بيانه في الكلام على حكم الصداق.", "ج- حكم الصداق:", "يجب على الزوج دفع المال بمجرد تمام العقد، ولا يجوز إسقاطه. ودل على هذا قوله تعالى: ﴿وآتوا النساء صدقاتهن نحلة﴾ [النساء: 4]، وقوله تعالى: ﴿فما استمتعتم به منهن فآتوهن أجورهن فريضة﴾ [النساء: 24]. وقوله تعالى: ﴿لا جناح عليكم إن طلقتم النساء ما لم تمسوهن أو تفرضوا لهن فريضة﴾ [البقرة: 236].", "وحديث سهل بن سعد رضي الله عنه قال: أتت امرأة النبي ﷺ فقالت: إني وهبت نفسي لله ولرسوله، فقال: «مالي في النساء من حاجة»، فقال رجل: زوجنيها، قال: «أعطها ثوبا» الحديث، وحديث أنس بن مالك رضي الله عنه أن رسول الله ﷺ رأى على عبد الرحمن بن عوف أثر زعفران، فقال النبي ﷺ: «مهيم»؟ - يعني: ما شأنك وما أمرك؟ - فقال: يا رسول الله تزوجت امرأة، فقال: «ما أصدقتها»؟ قال: وزن نواة من ذهب، فقال: «بارك الله لك، أولم ولو بشاة».", "وأجمع المسلمون على مشروعية الصداق في النكاح."]], "ic": "scroll"}, {"story": ["المسألة الثانية: حده، وحكمته، وتسميته", ["أ- حد الصداق:", "لا حد لأقل الصداق ولا أكثره، فكل ما صح أن يكون ثمنا أو أجرة صح أن يكون صداقا؛ لقوله تعالى: ﴿وأحل لكم ما وراء ذلكم أن تبتغوا بأموالكم﴾ [النساء: 24]، فأطلق المال ولم يقدره بحد معين. ولحديث سهل بن سعد رضي الله عنه وفيه أن النبي ﷺ قال في المرأة الواهبة نفسها: «أعطها ولو خاتما من حديد». فدل هذا على جواز أقل ما يطلق عليه مال.", "وأما الدليل على أنه يجوز ولو كان كثيرا، فقوله تعالى: ﴿وإن أردتم استبدال زوج مكان زوج وآتيتم إحداهن قنطارا فلا تأخذوا منه شيئا﴾ [النساء: 20]، والقنطار المال الكثير.", "ب- الحكمة من مشروعية الصداق:", "الحكمة من تشريع الصداق: هي إظهار صدق رغبة الزوج في معاشرة زوجته معاشرة شريفة، وبناء حياة زوجية كريمة. كما أن فيه إعزازا للمرأة، وإكراما لها، وتمكينا لها من أن تتهيأ للزواج بما تحتاج إليه من لباس ونفقات.", "ج- الحكمة في جعل الصداق بيد الرجل:", "جعل الإسلام الصداق على الزوج؛ رغبة منه في صيانة المرأة من أن تمتهن كرامتها في سبيل جمع المال الذي تقدمه مهرا للرجل، وهذا يتفق مع المبدأ التشريعي: في أن الرجل هو المكلف بواجبات النفقة، دون المرأة.", "د- ملكية الصداق:", "الصداق ملك للزوجة وحدها، ولا حق لأحد فيه من أوليائها، وإن كان لهم حق قبضه، إلا أنهم يقبضونه لحسابها وملكها؛ لقوله تعالى: ﴿فإن طبن لكم عن شيء منه نفسا فكلوه هنيئا مريئا﴾ [النساء: 4]، وقوله تعالى: ﴿فلا تأخذوا منه شيئا أتأخذونه بهتانا وإثما مبينا﴾ [النساء: 20].", "هـ- تسمية الصداق في العقد:", "يسن تسمية الصداق في عقد الزواج وتحديده؛ لأن النبي ﷺ لم يخل نكاحا من تسمية المهر فيه، ولأن في تسميته دفعا للخصومة والنزاع بين الزوجين.", "و- شروط المهر وما يكون مهرا وما لا يكون:", "1- أن يكون مالا متقوما مباحا، مما يجوز تملكه وبيعه والانتفاع به، فلا يجوز بخمر وخنزير ومال مغصوب يعلمانه.", "2- أن يكون سالما من الغرر، بأن يكون معلوما معينا، فلا يصح بالمجهول كدار غير معينة، أو دابة مطلقة، أو ما يثمر شجرة مطلقا، أو هذا العام ونحو ذلك.", "وعلى هذا، يصح المهر بكل ما يصلح أن يكون ثمنا، أو أجرة، من عين أو دين أو منفعة معلومة.", "ز- تعجيل المهر وتأجيله:", "يجوز تعجيل المهر وتأجيله، كله أو بعضه، حسب عرف الناس وعاداتهم، بشرط ألا يكون الأجل مجهولا جهالة فاحشة، وألا تكون المدة بعيدة جدا؛ لأن ذلك مظنة سقوط الصداق."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: حكم المغالاة في الصداق", ["يستحب عدم المغالاة في المهر لما يلي:", "1- حديث عائشة رضي الله عنها عن النبي ﷺ أنه قال: «من يمن المرأة تسهيل أمرها وقلة صداقها». واليمن: البركة.", "2- عن عمر رضي الله عنه أنه قال: «ألا لا تغالوا في صدق النساء، فإنه لو كان مكرمة في الدنيا أو تقوى عند الله عز وجل كان أولاكم بها رسول الله ﷺ، ما أصدق رسول الله ﷺ امرأة من نسائه، ولا أصدقت امرأة من بناته أكثر من اثنتي عشرة أوقية، وإن الرجل ليغلي بصدقة امرأته، حتى يكون لها عداوة في قلبه، وحتى يقول: كلفت لكم علق القربة».", {"note": "حاشية (ص306): علق القربة: حبلها الذي تعلق به؛ فالمراد: تحملت لأجلك كل شيء حتى علق القربة."}, "3- وعن أبي سلمة قال: سألت عائشة رضي الله عنها عن صداق رسول الله ﷺ؟ فقالت: اثنتي عشرة أوقية ونشا. قالت: أتدري ما النش؟ قلت: لا أدري. قالت: نصف أوقية."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: الحقوق الزوجية", ["إذا وقع عقد النكاح صحيحا ترتب عليه كثير من الحقوق بين الزوجين، وهي:", "أولا: حقوق الزوجة:", "للزوجة على زوجها حقوق مالية كالصداق والنفقة، وحقوق معنوية غير مالية، كالعدل، وإحسان العشرة، وطيب المعاملة. ونفصل ذلك على النحو التالي:", "1- المهر: وهو حق للزوجة على زوجها؛ لقوله تعالى: ﴿وآتوا النساء صدقاتهن نحلة﴾ [النساء: 4]، وغير ذلك من الأدلة التي سبق ذكرها.", "2- النفقة والكسوة والسكنى: فيجب على الزوج تحصيلها للمرأة؛ لقوله تعالى: ﴿والوالدات يرضعن أولادهن حولين كاملين لمن أراد أن يتم الرضاعة وعلى المولود له رزقهن وكسوتهن بالمعروف﴾ [البقرة: 233].", "ولقوله تعالى: ﴿الرجال قوامون على النساء بما فضل الله بعضهم على بعض وبما أنفقوا من أموالهم﴾ [النساء: 34].", "ولحديث حكيم بن معاوية القشيري عن أبيه رضي الله عنه قال: قلت يا رسول الله ما حق الزوجة؟ فقال: «أن تطعمها إذا طعمت، وأن تكسوها إذا اكتسيت».", "ولحديث جابر رضي الله عنه في خطبة رسول الله ﷺ وفيه: «ولهن عليكم رزقهن وكسوتهن بالمعروف».", "3- إعفاف الزوجة بالجماع؛ مراعاة لحقها ومصلحتها في النكاح، ودفعا للفتنة عنها، لعموم قوله تعالى: ﴿فإذا تطهرن فأتوهن من حيث أمركم الله﴾ [البقرة: 222]. وقوله تعالى: ﴿نساؤكم حرث لكم فأتوا حرثكم أنى شئتم﴾ [البقرة: 223]، ولقوله ﷺ: «وفي بضع أحدكم صدقة» يعني: الجماع.", "4- حسن معاشرتها، ومعاملتها بالمعروف؛ لقوله تعالى: ﴿وعاشروهن بالمعروف﴾ [النساء: 19] فيكون حسن الخلق مع زوجته رفيقا بها، صابرا على ما يصدر منها، محسنا للظن بها. قال ﷺ: «خيركم خيركم لأهله».", "5- العدل بين نسائه في المبيت والنفقة، لمن كانت له أكثر من زوجة؛ لقوله تعالى: ﴿فإن خفتم ألا تعدلوا فواحدة...﴾ [النساء: 3]. وعن أنس رضي الله عنه قال: كان للنبي ﷺ تسع نسوة، فكان إذا قسم بينهن، لا ينتهي إلى المرأة الأولى إلا في تسع...", "ثانيا: حق الزوج:", "وحق الزوج على زوجته أعظم من حقها عليه؛ لقوله سبحانه: ﴿وللرجال عليهن درجة﴾ [البقرة: 228]، ولقوله ﷺ: «لو كنت آمرا أحدا أن يسجد لأحد لأمرت المرأة أن تسجد لزوجها، ولا تؤدي المرأة حق الله عز وجل عليها كله، حتى تؤدي حق زوجها عليها كله».", "ومن حقوق الزوج على زوجته:", "1- حفظ سره وعدم إفشائه لأحد؛ لقوله تعالى: ﴿فالصالحات قانتات حافظات للغيب بما حفظ الله﴾ [النساء: 34].", "2- وجوب طاعته في المعروف؛ لقوله تعالى: ﴿الرجال قوامون على النساء﴾ [النساء: 34].", "3- تمكينه من نفسها إذا دعاها إلى فراشه، ما لم يكن هناك مانع شرعي؛ لقوله ﷺ: «إذا دعا الرجل امرأته إلى فراشه فأبت أن تجيء فبات غضبان عليها، لعنتها الملائكة حتى تصبح».", "4- المحافظة على بيته وماله وأولاده وحسن تربيتهم؛ لقوله ﷺ: «كلكم راع، وكلكم مسئول عن رعيته... والمرأة راعية في بيت زوجها وهي مسئولة عن رعيتها». وقوله ﷺ: «ولكم عليهن أن لا يوطئن فرشكم أحدا تكرهونه».", "5- المعاشرة بالمعروف، وحسن الخلق، وكف الأذى عنه؛ لقوله ﷺ: «لا تؤذي امرأة زوجها في الدنيا، إلا قالت زوجته من الحور العين: لا تؤذيه، قاتلك الله، فإنما هو دخيل يوشك أن يفارقك إلينا». والدخيل: الضيف والنزيل.", "ثالثا: الحقوق المشتركة بين الزوجين:", "أغلب الحقوق الماضي ذكرها حقوق مشتركة بين الزوجين، وبخاصة حق الاستمتاع، وما يتبعه من حقوق، وكذا تحسين كل من الزوجين خلقه لصاحبه، وتحمل أذاه ومعاشرته بالمعروف، فلا يماطله بحقه ولا يتكره لبذله، ولا يتبعه أذى ومنة؛ لقوله تعالى: ﴿وعاشروهن بالمعروف﴾ [النساء: 19]، وقوله سبحانه وتعالى: ﴿ولهن مثل الذي عليهن بالمعروف﴾ [البقرة: 228]، وقول النبي ﷺ: «خيركم خيركم لأهله».", "كما يسن للزوج إمساك زوجته حتى مع كراهته لها؛ لقوله تعالى: ﴿وعاشروهن بالمعروف فإن كرهتموهن فعسى أن تكرهوا شيئا ويجعل الله فيه خيرا كثيرا﴾ [النساء: 19]."]], "ic": "scroll"}, {"story": ["المسألة الخامسة: إعلان النكاح", ["يسن إعلان النكاح، وإظهاره، وإشاعته، والضرب عليه بالدف؛ لقوله ﷺ: «فصل ما بين الحرام والحلال، الصوت والدف في النكاح»، ويكون الضرب بالدف للنساء دون الرجال، شرط ألا يصحب ذلك فحش في القول، أو ما يخالف الشرع."]], "ic": "scroll"}, {"story": ["المسألة السادسة: الوليمة في النكاح", ["الوليمة: طعام العرس يدعى إليه الناس ويجمعون.", "ويسن عمل وليمة للنكاح؛ لحديث عبد الرحمن بن عوف أنه تزوج امرأة فقال له النبي ﷺ: «أولم ولو بشاة»، و«أولم النبي ﷺ على زينب بخبز ولحم»، و«أولم النبي ﷺ على بعض نسائه بمدين من شعير»."]], "ic": "scroll"}, {"story": ["المسألة السابعة: حكم إجابة دعوة وليمة العرس", ["يجب على من دعي لوليمة عرس أن يجيب؛ لحديث ابن عمر رضي الله عنهما أنه قال: قال رسول الله ﷺ: «إذا دعي أحدكم إلى الوليمة فليأتها»، وحديث أبي هريرة رضي الله عنه، أن رسول الله ﷺ قال: «من لم يجب الدعوة فقد عصى الله ورسوله».", "شروط إجابة دعوة وليمة العرس:", "1- أن تكون هي الوليمة الأولى، فإن أولم في أكثر من يوم استحبت في الثاني، وكرهت في الثالث؛ لحديث ابن مسعود رضي الله عنه أن النبي ﷺ قال: «طعام أول يوم حق، وطعام يوم الثاني سنة، وطعام يوم الثالث سمعة، ومن سمع سمع الله به».", "2- أن يكون الداعي مسلما؛ فلا تجب إجابة دعوة الكافر.", "3- أن يكون الداعي من غير العصاة المجاهرين بالمعصية، وألا يكون ظالما أو صاحب مال حرام.", "4- أن تكون الدعوة معينة؛ فإن دعاه في جمع فلا تجب الإجابة.", "5- أن يكون القصد من الدعوة التودد والتقرب؛ فإن دعاه لخوف منه، أو طمع في جاه، فلا تجب الإجابة.", "6- ألا يكون في الوليمة منكر؛ كخمر وغناء ومعازف واختلاط رجال بنساء، فإن وجد شيئا من ذلك فلا تجب الدعوة؛ لحديث جابر رضي الله عنه أن رسول الله ﷺ قال: «من كان يؤمن بالله واليوم الآخر، فلا يقعدن على مائدة يدار عليها الخمر». فإن كان المدعو يستطيع إزالة المنكر بحضوره وجب عليه الحضور، وإجابة الدعوة، وإزالة المنكر؛ لحديث أبي سعيد الخدري رضي الله عنه عن رسول الله ﷺ قال: «من رأى منكم منكرا فليغيره بيده، فإن لم يستطع فبلسانه، فإن لم يستطع فبقلبه، وذلك أضعف الإيمان»."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "ما معنى الصداق شرعا؟", "o": ["هو المال الذي وجب على الزوج دفعه لزوجته، بسبب عقد النكاح", "عوض تدفعه المرأة لزوجها", "طعام العرس", "ما يعطيه الولي للزوج"], "h": "راجع: ص302 (المسألة الأولى)"}, {"t": "tf", "d": 1, "q": "الصداق ملك للزوجة وحدها.", "a": true, "h": "راجع: ص304 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "ما حكم الوليمة في النكاح؟", "o": ["تسن", "تحرم", "تكره", "لا تشرع"], "h": "راجع: ص309 (المسألة السادسة)"}, {"t": "tf", "d": 2, "q": "يستحب عدم المغالاة في المهر.", "a": true, "h": "راجع: ص305 (المسألة الثالثة)"}]}], "sum": [["تعريف الصداق، ومشروعيته، وحكمه", "ص302-311"], ["حده، وحكمته، وتسميته", "ص302-311"], ["حكم المغالاة في الصداق", "ص302-311"], ["الحقوق الزوجية", "ص302-311"]]}, {"id": "l78", "title": "الباب الثالث: في الخلع", "group": "الكتاب التاسع: النكاح والطلاق", "map": {"center": "الباب الثالث\nالنكاح والطلاق", "nodes": [{"t": "معناه، وأدلة مشروعيته", "s": []}, {"t": "الأحكام المتعلقة به، والحكمة منه", "s": []}]}, "paras": [{"t": "الباب الثالث: في الخلع", "b": [{"pic": ["scroll", "book"], "cap": "ص311-313"}, {"story": ["المسألة الأولى: معناه، وأدلة مشروعيته", ["أ- تعريف الخلع:", "الخلع لغة: مأخوذ من خلع الثوب؛ لأن كلا من الزوجين لباس للآخر.", "وشرعا: فرقة تجري بين الزوجين على عوض تدفعه المرأة لزوجها، بألفاظ مخصوصة.", "ب- مشروعية الخلع:", "الخلع مشروع؛ لقوله تعالى: ﴿فإن خفتم ألا يقيما حدود الله فلا جناح عليهما فيما افتدت به﴾ [البقرة: 229].", "ولحديث ابن عباس رضي الله عنهما: أن امرأة ثابت بن قيس أتت النبي ﷺ فقالت: يا رسول الله، ثابت بن قيس، ما أعتب عليه في خلق ولا دين، ولكني أكره الكفر في الإسلام، فقال النبي ﷺ: «أتردين عليه حديقته؟» قالت: نعم، فقال رسول الله ﷺ: «اقبل الحديقة وطلقها تطليقة».", {"note": "حاشية (ص311): أي: أنها تكره الوقوع في كفران العشير، والتقصير في حقه عليها وما يجب له، وذلك لشدة بغضها إياه، لا لعيب عليه في خلق ولا دين."}]], "ic": "scroll"}, {"story": ["المسألة الثانية: الأحكام المتعلقة به، والحكمة منه", ["أ- أحكام الخلع:", "تتلخص أحكام الخلع في الآتي:", "1- أن الخلع جائز لسوء العشرة بين الزوجين، ولا يقع إلا بعوض مالي، تفرضه الزوجة للزوج.", "2- لا يقع من غير الزوجة الرشيدة؛ لأن غير الرشيدة لا تملك التصرف لنقص الأهلية.", "3- إذا خالع الرجل امرأته ملكت المرأة بذلك أمر نفسها، ولم يبق للزوج عليها من سلطان، ولا رجعة له عليها.", "4- لا يلحق المخالعة طلاق، أو ظهار، أو إيلاء، أثناء عدتها من زوجها الذي خالعها، لأنها تصير أجنبية عن زوجها.", "5- يجوز الخلع في الحيض والطهر الذي جامعها فيه؛ لعدم الضرر عليها بذلك، فإن الله سبحانه أطلقه، ولم يقيده بزمن دون زمن.", "6- يحرم على الرجل أن يؤذي زوجته ويمنعها حقوقها، حتى يضطرها إلى خلع نفسها؛ لقوله تعالى: ﴿ولا تعضلوهن لتذهبوا ببعض ما آتيتموهن إلا أن يأتين بفاحشة مبينة﴾ [النساء: 19].", "7- يكره للمرأة ويحظر عليها مخالعة زوجها مع استقامة الحال ودون سبب يقتضيه، كأن يكون الزوج معيبا في خلقه ولم تطق المرأة البقاء معه، أو كان سيئا في خلقه، أو خافت ألا تقيم حدود الله.", "ب- الحكمة من مشروعية الخلع:", "من المعلوم أن الزواج ترابط بين الزوجين وتعاشر بالمعروف. قال تعالى: ﴿ومن آياته أن خلق لكم من أنفسكم أزواجا لتسكنوا إليها وجعل بينكم مودة ورحمة﴾ [الروم: 21]. فهذه ثمرة النكاح، فإذا لم يتحقق هذا المعنى، فلم توجد المودة من الطرفين أو لم توجد من الزوج وحده، فساءت العشرة، وتعسر العلاج، فإن الزوج مأمور بتسريح الزوجة بإحسان؛ لقوله تعالى: ﴿فإمساك بمعروف أو تسريح بإحسان﴾ [البقرة: 229]. فإذا وجدت المحبة من جانب الزوج دون الزوجة بأن كرهت خلق زوجها، أو كرهت نقص دينه، أو خافت إثما بترك حقه، فإنه في هذه الحالة يباح للمرأة طلب فراق على عوض تبذله له، وتفتدي به نفسها؛ لقوله تعالى: ﴿فإن خفتم ألا يقيما حدود الله فلا جناح عليهما فيما افتدت به﴾ [البقرة: 229]."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "ما معنى الخلع شرعا؟", "o": ["فرقة تجري بين الزوجين على عوض تدفعه المرأة لزوجها، بألفاظ مخصوصة", "حل قيد النكاح أو بعضه", "طعام العرس", "المال الذي يجب على الزوج"], "h": "راجع: ص311 (المسألة الأولى)"}, {"t": "tf", "d": 2, "q": "لا يلحق المخالعة طلاق أثناء عدتها من زوجها الذي خالعها.", "a": true, "h": "راجع: ص312 (المسألة الثانية)"}]}], "sum": [["معناه، وأدلة مشروعيته", "ص311-313"], ["الأحكام المتعلقة به، والحكمة منه", "ص311-313"]]}, {"id": "l79", "title": "الباب الرابع: في
