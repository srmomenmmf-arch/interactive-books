ه: يهدف الإسلام من إقامة حد القذف إلى صيانة المجتمع، والمحافظة على أعراض الناس، وقطع ألسنة السوء، وسد باب إشاعة الفاحشة بين المؤمنين."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: شروط إيجاب حد القذف", ["لا يجب حد القذف إلا إذا توافرت شروط في القاذف، وشروط في المقذوف، حتى يصبح جريمة تستحق عقوبة الجلد:", "أولا: شروط القاذف، وهي خمسة:", "1- أن يكون بالغا، فلا حد على الصغير.", "2- أن يكون عاقلا، فلا حد على المجنون والمعتوه.", "3- ألا يكون أصلا للمقذوف، كالأب والجد والأم والجدة، فلا حد على الوالد - الأب أو الأم - إن قذف ولده - الابن أو البنت - وإن سفل.", "4- أن يكون مختارا، فلا حد على النائم والمكره.", "5- أن يكون عالما بالتحريم، فلا حد على الجاهل.", "ثانيا: شروط المقذوف، وهي خمسة أيضا:", "1- أن يكون المقذوف مسلما، فلا حد على من قذف كافرا؛ لأن حرمته ناقصة.", "2- أن يكون عاقلا، فلا حد على من قذف المجنون.", "3- أن يكون بالغا أو يكون ممن يطأ ويوطأ مثله، وهو ابن عشر وبنت تسع فأكثر.", "4- أن يكون عفيفا عن الزنى في الظاهر، فلا حد على من قذف الفاجر.", "5- أن يكون المقذوف حرا، فلا حد على من قذف مملوكا، لقوله ﷺ: «من قذف مملوكه بالزنى، يقام عليه الحد يوم القيامة، إلا أن يكون كما قال».", "قال الإمام النووي رحمه الله: «فيه إشارة إلى أنه لا حد على قاذف العبد في الدنيا، وهذا مجمع عليه، لكن يعزر قاذفه؛ لأن العبد ليس بمحصن...».", "فتبين مما تقدم أن شرط إقامة الحد على القاذف أن يكون المقذوف محصنا، وهو من كان: مسلما، عاقلا، حرا، عفيفا عن الزنى، بالغا أو يكون ممن يطأ أو يوطأ مثله. وذلك لقوله تعالى: ﴿والذين يرمون المحصنات﴾ [النور: 4]. فمفهوم ذلك: أنه لا يجلد من قذف غير المحصن."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: شروط إقامة حد القذف", ["إذا وجب حد القذف فإنه لا بد من شروط أربعة لإقامته، وهي:", "1- مطالبة المقذوف للقاذف، واستدامة الطلب حتى إقامة الحد؛ لأن حد القذف حق للمقذوف لا يقام إلا بطلبه ويسقط بعفوه. فإذا عفا عن القاذف سقط الحد عنه، لكنه يعزر بما يردعه عن التمادي في القذف المحرم.", "2- ألا يأتي القاذف ببينة على ثبوت ما قذف به - وهي أربعة شهداء -؛ لقوله تعالى: ﴿ثم لم يأتوا بأربعة شهداء فاجلدوهم﴾ [النور: 4].", "3- ألا يصدقه المقذوف فيما قذفه به ويقر به، فإن أقر المقذوف، وصدق القاذف، فلا حد؛ لأن ذلك أبلغ في إقامة البينة.", "4- ألا يلاعن القاذف المقذوف، إن كان القاذف زوجا، فإن لاعنها سقط الحد، كما مضى في اللعان."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "ما القذف شرعا؟", "o": ["الرمي بزنى أو لواط ولم تكمل البينة", "الرمي بالحجارة فقط", "السرقة", "شرب المسكر"], "h": "راجع: ص368 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "كم جلدة يجلد القاذف الحر؟", "o": ["ثمانين", "مائة", "خمسين", "أربعين"], "h": "راجع: ص369 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "ما عقوبة القاذف مع الجلد؟", "o": ["رد شهادته والحكم بفسقه", "التغريب", "السجن سنة", "القطع"], "h": "راجع: ص369 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "يشترط في المقذوف أن يكون مسلما.", "a": true, "h": "راجع: ص370 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "يقام حد القذف دون طلب المقذوف.", "a": false, "h": "راجع: ص370 (المسألة الرابعة)"}]}], "sum": [["معنى القذف وحكمه", "ص368-371"], ["حد القذف والحكمة منه", "ص368-371"], ["شروط إيجاب حد القذف", "ص368-371"], ["شروط إقامة حد القذف", "ص368-371"]]}, {"id": "l93", "title": "الباب الرابع: في حد شارب الخمر", "group": "الكتاب الحادي عشر: الحدود", "map": {"center": "الباب الرابع\nالحدود", "nodes": [{"t": "تعريف الخمر وحكمه وحكمة تحريمه", "s": []}, {"t": "حد شارب الخمر، وشروطه، وبم يثبت؟", "s": []}, {"t": "حكم المخدرات والاتجار بها", "s": []}]}, "paras": [{"t": "الباب الرابع: في حد شارب الخمر", "b": [{"pic": ["scroll", "book"], "cap": "ص371-374"}, {"story": ["المسألة الأولى: تعريف الخمر وحكمه وحكمة تحريمه", ["1- تعريف الخمر:", "الخمر لغة: كل ما خامر العقل، أي: غطاه من أي مادة كان.", "وشرعا: كل ما أسكر سواء كان عصيرا أو نقيعا من العنب أو غيره، أو مطبوخا أو غير مطبوخ. والسكر: هو اختلاط العقل، والمسكر: هو الشراب الذي جعل صاحبه سكران، والسكران: خلاف الصاحي.", "2- حكمه:", "حكم الخمر التحريم، وكذا سائر المسكرات، فكل مسكر خمر، فلا يجوز شرب الخمر، سواء كان قليلا أو كثيرا، وشربه كبيرة من الكبائر، والخمر محرمة بالكتاب والسنة والإجماع؛ لقوله تعالى: ﴿يا أيها الذين آمنوا إنما الخمر والميسر والأنصاب والأزلام رجس من عمل الشيطان فاجتنبوه لعلكم تفلحون﴾ [المائدة: 90]. فالأمر بالاجتناب دليل على التحريم.", "ولحديث عائشة رضي الله عنها أن رسول الله ﷺ قال: «كل شراب أسكر فهو حرام».", "وعن ابن عمر رضي الله عنهما مرفوعا: «كل مسكر خمر، وكل خمر حرام». والأحاديث في تحريمها، والتنفير منها، كثيرة جدا تبلغ التواتر.", "وقد أجمعت الأمة على تحريمها.", "3- الحكمة في تحريم الخمر:", "لقد أنعم الله عز وجل على الإنسان بنعم كثيرة، منها نعمة العقل التي ميزه بها عن سائر المخلوقات، ولما كانت المسكرات من شأنها أن تفقد الإنسان نعمة العقل، وتثير الشحناء والبغضاء بين المؤمنين، وتصد عن الصلاة، وعن ذكر الله، حرمها الشارع، فالخمر خطرها عظيم، وشرها جسيم، فهي مطية الشيطان التي يركبها للإضرار بالمسلمين. قال الله تعالى: ﴿إنما يريد الشيطان أن يوقع بينكم العداوة والبغضاء في الخمر والميسر ويصدكم عن ذكر الله وعن الصلاة﴾ [المائدة: 91]."]], "ic": "scroll"}, {"story": ["المسألة الثانية: حد شارب الخمر، وشروطه، وبم يثبت؟", ["1- حد شارب الخمر:", "حد شارب الخمر الجلد، ومقداره: أربعون جلدة، ويجوز أن يبلغ ثمانين جلدة، وذلك راجع لاجتهاد الإمام، يفعل الزيادة عند الحاجة إلى ذلك، إذا أدمن الناس الخمر، ولم يرتدعوا بالأربعين؛ لحديث علي بن أبي طالب رضي الله عنه في قصة الوليد بن عقبة: «جلد النبي ﷺ أربعين، وأبو بكر أربعين، وعمر ثمانين، وكل سنة، وهذا أحب إلي». ولحديث أنس رضي الله عنه: «أن النبي ﷺ كان يضرب في الخمر بالنعال والجريد أربعين».", "2- شروط إقامة حد الخمر: يشترط لإقامة الحد على السكران شروط، وهي:", "- أن يكون مسلما، فلا حد على الكافر.", "- أن يكون بالغا، فلا حد على الصبي.", "- أن يكون عاقلا، فلا حد على المجنون، والمعتوه.", "- أن يكون مختارا، فلا حد على المكره والناسي وأمثالهم. وهذه الشروط الثلاثة يدل عليها قوله ﷺ: «إن الله تجاوز لأمتي عن الخطأ والنسيان وما استكرهوا عليه». وقوله ﷺ: «رفع القلم عن ثلاثة ...» الحديث. وقد تقدما مرارا.", "- أن يكون عالما بالتحريم، فلا حد على الجاهل.", "- أن يعلم أن هذا الشراب خمر، فإن شربه على أنه شراب آخر، فلا حد عليه.", "3- ما يثبت به حد الخمر:", "يثبت حد الخمر بأحد أمرين:", "1- الإقرار بالشرب، كأن يقر، ويعترف بأنه شرب الخمر مختارا.", "2- البينة، وهي شهادة رجلين عدلين، مسلمين عليه."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: حكم المخدرات والاتجار بها", ["1- حكم المخدرات سوى الخمر:", "يقصد بالمخدرات ما يغشي العقل والفكر، ويصيب متعاطيها بالكسل، والثقل، والفتور، من البنج والأفيون والحشيش ونحوها. والمخدرات حرام كيفما كان تعاطيها؛ لحديث عائشة رضي الله عنها: أن رسول الله ﷺ قال: «كل شراب أسكر فهو حرام». ولحديث ابن عمر رضي الله عنهما، أن رسول الله ﷺ قال: «كل مسكر خمر، وكل مسكر حرام...» الحديث، ولعظم خطر هذه المواد المخدرة، وشدة إفسادها، وفتكها بشباب الأمة، ورجالها، وشغلهم عن طاعة ربهم، وجهاد أعدائهم، ومعالي الأمور.", "2- حكم الاتجار بالمواد المخدرة:", "ورد النهي عن رسول الله ﷺ في تحريم بيع الخمر، فقد روى جابر رضي الله عنه عن النبي ﷺ أنه قال: «إن الله حرم بيع الخمر والميتة والخنزير، والأصنام». ولقوله ﷺ: «إن الله إذا حرم شيئا حرم ثمنه».", "ولذا قال العلماء: إن ما حرم الله الانتفاع به يحرم بيعه، وأكل ثمنه.", "ولما كانت المخدرات يتناولها اسم الخمر، فإن النهي عن بيع الخمر يتناول هذه المخدرات شرعا، فلا يجوز بيعها إذن، ويكون المال المكتسب من الاتجار بها حراما."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "ما الخمر شرعا؟", "o": ["كل ما أسكر سواء كان عصيرا أو نقيعا أو مطبوخا أو غير مطبوخ", "عصير العنب فقط", "كل شراب بارد", "الماء المالح"], "h": "راجع: ص371 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "ما مقدار حد شارب الخمر؟", "o": ["أربعون جلدة، ويجوز أن يبلغ ثمانين", "مائة جلدة", "عشر جلدات", "القطع"], "h": "راجع: ص372 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "بم يثبت حد الخمر؟", "o": ["بالإقرار أو بشهادة رجلين عدلين مسلمين", "بشهادة امرأة", "بالرائحة وحدها", "بالظن"], "h": "راجع: ص373 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "المخدرات حرام كالخمر.", "a": true, "h": "راجع: ص373 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "يجوز الاتجار بالمواد المخدرة.", "a": false, "h": "راجع: ص374 (المسألة الثالثة)"}]}], "sum": [["تعريف الخمر وحكمه وحكمة تحريمه", "ص371-374"], ["حد شارب الخمر، وشروطه، وبم يثبت؟", "ص371-374"], ["حكم المخدرات والاتجار بها", "ص371-374"]]}, {"id": "l94", "title": "الباب الخامس: في حد السرقة", "group": "الكتاب الحادي عشر: الحدود", "map": {"center": "الباب الخامس\nالحدود", "nodes": [{"t": "تعريف السرقة، وحكمها، وحد فاعلها، ", "s": []}, {"t": "شروط وجوب حد السرقة وقطع السارق", "s": []}, {"t": "الشفاعة في حد السرقة، وهبة المسروق", "s": []}, {"t": "كيفية القطع وموضعه", "s": []}]}, "paras": [{"t": "الباب الخامس: في حد السرقة", "b": [{"pic": ["scroll", "book"], "cap": "ص374-378"}, {"story": ["المسألة الأولى: تعريف السرقة، وحكمها، وحد فاعلها، والحكمة من إقامة الحد فيها", ["1- تعريف السرقة:", "السرقة لغة: الأخذ خفية.", "وشرعا: أخذ مال الغير خفية ظلما من حرز مثله بشروط معينة، على ما سيأتي بيانه إن شاء الله.", "2- حكم السرقة:", "السرقة حرام؛ لأنها اعتداء على حقوق الآخرين، وأخذ أموالهم بالباطل. قد دل على تحريمها الكتاب والسنة والإجماع، وهي من كبائر الذنوب؛ فقد لعن الله صاحبها كما في حديث أبي هريرة رضي الله عنه عن النبي ﷺ قال: «لعن الله السارق، يسرق البيضة فتقطع يده، ويسرق الحبل فتقطع يده». وغير ذلك من الأحاديث في تحريم السرقة، والتنفير منها.", "3- حد فاعلها:", "ويجب على فاعلها الحد، وهو: قطع يده، رجلا كان، أو امرأة؛ لقوله تعالى: ﴿والسارق والسارقة فاقطعوا أيديهما جزاء بما كسبا نكالا من الله والله عزيز حكيم﴾ [المائدة: 38].", "ولحديث عائشة رضي الله عنها، قالت: «كان رسول الله ﷺ يقطع السارق في ربع دينار فصاعدا»، ولحديث عائشة أيضا قالت: إن قريشا أهمهم شأن المرأة المخزومية التي سرقت، وفيه قوله ﷺ: «وايم الله لو أن فاطمة بنت محمد سرقت لقطعت يدها»، ثم أمر بتلك المرأة التي سرقت، فقطعت يدها.", "وأجمع المسلمون على تحريم السرقة، وعلى وجوب قطع يد السارق في الجملة.", "4- الحكمة من إقامة حد السرقة:", "احترم الإسلام المال، واحترم حق الأفراد في امتلاكه، وحرم الاعتداء على هذا الحق: بسرقة أو اختلاس أو غش أو خيانة أو رشوة، أو غير ذلك من وجوه أكل أموال الناس بالباطل.", "ولما كان السارق عضوا فاسدا في المجتمع - إذ لو ترك لسرى شره، وعم خطره وضرره - شرع الإسلام بتر هذا العضو الفاسد، عقابا لهذه اليد على ظلمها وعدوانها، وردعا لغيره عن اقتراف مثل هذه الجريمة، وصيانة لأموال الناس وحقوقهم."]], "ic": "scroll"}, {"story": ["المسألة الثانية: شروط وجوب حد السرقة وقطع السارق", ["يشترط لإقامة حد السرقة وقطع السارق الشروط التالية:", "1- أن يكون أخذ المال على وجه الخفية، فإن لم يكن كذلك فلا قطع؛ فالمنتهب على وجه الغلبة، والمغتصب، والمختطف، والخائن لا قطع عليهم؛ لقوله ﷺ: «ليس على خائن، ولا منتهب، ولا مختلس قطع».", "2- أن يكون السارق مكلفا - بالغا عاقلا - فلا قطع على الصغير والمجنون؛ لأنهما مرفوع عنهما التكليف كما مر، ولكن يؤدب الصغير إذا سرق.", "3- أن يكون السارق مختارا، فلا قطع على المكره؛ لأنه معذور؛ لقوله ﷺ: «رفع عن أمتي الخطأ والنسيان وما استكرهوا عليه».", "4- أن يكون عالما بالتحريم، فلا قطع على جاهل بتحريم السرقة.", "5- أن يكون المسروق مالا محترما، فما ليس بمال لا حرمة له؛ كآلات اللهو والخمر والخنزير والميتة، وكذا ما كان مالا لكنه غير محترم؛ كمال الكافر الحربي، فإن الكافر الحربي حلال الدم والمال - لا قطع فيه.", "6- أن يبلغ الشيء المسروق نصابا، وهو ربع دينار ذهبا فأكثر، أو ثلاثة دراهم فضة أو ما يقابل أحدهما من النقود الأخرى، فلا قطع في أقل من ذلك؛ لقوله ﷺ: «لا تقطع يد السارق إلا في ربع دينار فصاعدا».", "7- أن يكون المال المسروق من حرز مثله، وهو المكان الذي يحفظ فيه المال في العادة، وهو يختلف باختلاف الأموال والبلدان وغير ذلك، ويرجع فيه إلى العرف، فإن سرق من غير حرز، كأن يجد بابا مفتوحا، أو حرزا مهتوكا، فلا قطع عليه.", "8- أن تنتفي الشبهة عن السارق، فإن كان له شبهة فيما سرق فلا قطع عليه؛ فإن الحدود تدرأ بالشبهات، فلا قطع على من سرق من مال أبيه، وكذا من سرق من مال ابنه؛ لأن نفقة كل منهما تجب في مال الآخر. ولا يقطع الشريك بالسرقة من مال له فيه شرك. وكذا كل من له استحقاق في مال، فأخذ منه، فلا قطع عليه، لكن يؤدب ويرد ما أخذ.", "9- أن تثبت السرقة عند الحاكم، إما بشهادة عدلين أو بإقرار السارق؛ لعموم قوله تعالى: ﴿واستشهدوا شهيدين من رجالكم﴾ [البقرة: 282]. وأما الإقرار فلأن الإنسان غير متهم في الإقرار على نفسه بالإضرار بها.", "10- أن يطالب المسروق منه بماله؛ لأن المال يباح بالبذل والإباحة، فيحتمل إباحة صاحبه له، أو إذنه بدخول حرزه، أو غير ذلك مما يسقط الحد."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: الشفاعة في حد السرقة، وهبة المسروق للسارق", ["1- الشفاعة في حد السرقة: لا تجوز الشفاعة في حد السرقة، ولا في غيره من الحدود، إذا علمه الإمام ووصل الأمر إليه؛ لقوله ﷺ لأسامة بن زيد لما أراد الشفاعة للمرأة المخزومية التي سرقت: «أتشفع في حد من حدود الله؟!». وقد تقدم الكلام على ذلك في أول الحدود.", "2- هبة المسروق للسارق: يجوز هبة الشيء المسروق للسارق، وعفو المسروق منه عنه، قبل رفع الأمر للحاكم. أما إذا وصل إليه فلا؛ لحديث صفوان ابن أمية في السارق الذي أخذ رداءه من تحت رأسه، فلما رفع الأمر إلى النبي ﷺ وأمر بقطعه، قال صفوان: (إني أعفو وأتجاوز). وفي رواية: (قال: يا رسول الله هو له). فقال رسول الله ﷺ: «هلا قبل أن تأتيني به؟»."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: كيفية القطع وموضعه", ["إذا توافرت الشروط السابق ذكرها، ووجب القطع، قطعت يد السارق اليمنى من مفصل الكف، وبعد القطع تحسم يد السارق بكيها بالنار، أو غمسها في زيت مغلي، أو غير ذلك من الوسائل التي توقف نزف الدم، وتجعل الجرح يندمل، حتى لا يتعرض المقطوع للتلف والهلاك.", "فإذا عاد السارق إلى السرقة ثانية، قطعت رجله اليسرى."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "ما السرقة لغة؟", "o": ["الأخذ خفية", "الأخذ علانية", "الأخذ بالقوة", "الإتلاف"], "h": "راجع: ص374 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "ما حد السارق؟", "o": ["قطع يده", "الجلد", "الرجم", "الحبس"], "h": "راجع: ص375 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "ما نصاب السرقة؟", "o": ["ربع دينار ذهبا فأكثر", "دينار واحد", "عشرة دراهم", "لا نصاب لها"], "h": "راجع: ص376 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "تجوز الشفاعة في حد السرقة إذا وصل الأمر إلى الإمام.", "a": false, "h": "راجع: ص377 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "تقطع يد السارق اليمنى من مفصل الكف.", "a": true, "h": "راجع: ص378 (المسألة الرابعة)"}, {"t": "tf", "d": 2, "q": "المنتهب والمختلس والخائن يقطعون.", "a": false, "h": "راجع: ص376 (المسألة الثانية)"}]}], "sum": [["تعريف السرقة، وحكمها، وحد فاعلها، ", "ص374-378"], ["شروط وجوب حد السرقة وقطع السارق", "ص374-378"], ["الشفاعة في حد السرقة، وهبة المسروق", "ص374-378"], ["كيفية القطع وموضعه", "ص374-378"]]}, {"id": "l95", "title": "الباب السادس: في التعزير", "group": "الكتاب الحادي عشر: الحدود", "map": {"center": "الباب السادس\nالحدود", "nodes": [{"t": "تعريف التعزير، وحكمه، والحكمة منه", "s": []}, {"t": "أنواع المعاصي التي توجب التعزير", "s": []}, {"t": "مقدار التعزير", "s": []}, {"t": "أنواع العقوبات التعزيرية", "s": []}]}, "paras": [{"t": "الباب السادس: في التعزير", "b": [{"pic": ["scroll", "book"], "cap": "ص378-380"}, {"story": ["المسألة الأولى: تعريف التعزير، وحكمه، والحكمة منه", ["1- تعريف التعزير:", "التعزير لغة: المنع والرد ويأتي بمعنى النصرة مع التعظيم، كما في قوله تعالى: ﴿وتعزروه وتوقروه﴾ [الفتح: 9]، فإنه يمنع المعادي من الإيذاء. كما يأتي بمعنى الإهانة، يقال: عزره بمعنى أدبه على ذنب وقع منه، فهو بذلك من الأضداد. والأصل فيه المنع.", "واصطلاحا: التأديب في كل معصية لا حد فيها ولا كفارة.", "2- حكم التعزير:", "التعزير واجب في كل معصية لا حد فيها ولا كفارة من الشارع، من فعل المحرمات وترك الواجبات إذا رآه الإمام؛ لحديث أبي بردة بن نيار رضي الله عنه أن النبي ﷺ قال: «لا يجلد فوق عشر جلدات إلا في حد من حدود الله»، ولأنه ﷺ «حبس في تهمة». وكان عمر رضي الله عنه يعزر ويؤدب بالنفي، وحلق الرأس، وغير ذلك. والتعزير راجع إلى الإمام أو نائبه، يفعله إذا رأى المصلحة في فعله، ويتركه إذا اقتضت المصلحة تركه.", "3- الحكمة من مشروعية التعزير:", "شرع التعزير؛ صيانة للمجتمع من الفوضى والفساد، ودفعا للظلم، وردعا وزجرا للعصاة وتأديبا لهم."]], "ic": "scroll"}, {"story": ["المسألة الثانية: أنواع المعاصي التي توجب التعزير", ["المعاصي التي توجب التعزير نوعان:", "1- ترك الواجبات مع القدرة على أدائها؛ كقضاء الديون، وأداء الأمانات وأموال اليتامى، فإن هذه الأمور ومثلها يعاقب عليها من ترك أداءها حتى يؤديها؛ لحديث أبي هريرة رضي الله عنه أن النبي ﷺ قال: «مطل الغني ظلم». وفي رواية: «لي الواجد يحل عرضه، وعقوبته».", "2- فعل المحرمات؛ كأن يختلي رجل بامرأة أجنبية أو يباشرها في غير الفرج، أو يقبلها أو يمازحها، وكإتيان المرأة المرأة، ففي هذا وأمثاله التعزير؛ إذ لم يرد فيه عقوبة محددة."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: مقدار التعزير", ["لم يقدر الشارع حدا معينا في عقوبة التعزير، وإنما المرجع في ذلك لاجتهاد الحاكم وتقديره لما يراه مناسبا للفعل، حتى إن بعض العلماء يرى أن التعزير قد يصل إلى القتل إذا اقتضت المصلحة، كقتل الجاسوس المسلم، والمفرق لجماعة المسلمين، وغيرهما ممن لا يندفع شرهم إلا بالقتل."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: أنواع العقوبات التعزيرية", ["يمكن أن تصنف العقوبات التعزيرية حسب متعلقاتها على النحو التالي:", "1- ما يتعلق بالأبدان، كالجلد والقتل.", "2- ما يتعلق بالأموال؛ كالإتلاف والغرم، كإتلاف الأصنام وتكسيرها، وإتلاف آلات اللهو والطرب وأوعية الخمر.", "3- ما هو مركب منهما؛ كجلد السارق من غير حرز مع إضعاف الغرم عليه، فقد قضى ﷺ على من سرق من الثمر المعلق قبل أن يؤويه الجرين: بالحد وغرمه مرتين. والجرين: موضع تجفيف التمر.", "4- ما يتعلق بتقييد الإرادة؛ كالحبس، والنفي.", "5- ما يتعلق بالمعنويات؛ كإيلام النفوس بالتوبيخ، والزجر."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "ما التعزير اصطلاحا؟", "o": ["التأديب في كل معصية لا حد فيها ولا كفارة", "عقوبة مقدرة شرعا", "القصاص", "الدية"], "h": "راجع: ص378 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "إلى من يرجع تقدير التعزير؟", "o": ["إلى الإمام أو نائبه", "إلى المجني عليه", "إلى الجاني", "إلى أي شخص"], "h": "راجع: ص378 (المسألة الأولى)"}, {"t": "tf", "d": 2, "q": "لم يقدر الشارع حدا معينا في عقوبة التعزير.", "a": true, "h": "راجع: ص379 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "مطل الغني الذي يقدر على الأداء من المعاصي الموجبة للتعزير.", "a": true, "h": "راجع: ص379 (المسألة الثانية)"}]}], "sum": [["تعريف التعزير، وحكمه، والحكمة منه", "ص378-380"], ["أنواع المعاصي التي توجب التعزير", "ص378-380"], ["مقدار التعزير", "ص378-380"], ["أنواع العقوبات التعزيرية", "ص378-380"]]}, {"id": "l96", "title": "الباب السابع: في حد الحرابة", "group": "الكتاب الحادي عشر: الحدود", "map": {"center": "الباب السابع\nالحدود", "nodes": [{"t": "تعريف الحرابة، وحد المحاربين", "s": []}, {"t": "شروط وجوب الحد على المحاربين", "s": []}, {"t": "سقوط الحد عن المحاربين", "s": []}]}, "paras": [{"t": "الباب السابع: في حد الحرابة", "b": [{"pic": ["scroll", "book"], "cap": "ص380-382"}, {"story": ["المسألة الأولى: تعريف الحرابة، وحد المحاربين", ["1- تعريف الحرابة:", "لغة: مأخوذ من حرب حربا أي: أخذ جميع ماله.", "وشرعا: البروز لأخذ مال أو لقتل أو لإرهاب، مكابرة، اعتمادا على الشوكة، مع البعد عن مسافة الغوث، من كل مكلف ملتزم للأحكام، ولو كان ذميا أو مرتدا.", "وتسمى أيضا: قطع الطريق.", "2- حد الحرابة وعقوبة المحاربين:", "الأصل في إقامة الحد على المحاربين وقطاع الطرق وعقوبتهم قوله تعالى: ﴿إنما جزاء الذين يحاربون الله ورسوله ويسعون في الأرض فسادا أن يقتلوا أو يصلبوا أو تقطع أيديهم وأرجلهم من خلاف أو ينفوا من الأرض﴾ [المائدة: 33].", "وتختلف عقوبة المحاربين وحدهم باختلاف الجرائم التي ارتكبوها، وذلك على النحو التالي:", "- من قتل منهم وأخذ المال: قتل وصلب، حتى يشتهر أمره، ولا يجوز العفو عنه بإجماع العلماء.", "- ومن قتل منهم ولم يأخذ المال: قتل ولم يصلب.", "- ومن أخذ المال ولم يقتل: قطعت يده ورجله من خلاف في آن واحد.", "- ومن أخاف الناس والطريق فقط، ولم يقتل، ولم يأخذ مالا، نفي من الأرض وشرد وطرد، فلا يترك يأوي إلى بلد.", "وهذا التفصيل في عقوبتهم مأخوذ من أن (أو) في الآية للتنويع في العقوبة وترتيبها لا للتخيير، وهو مروي عن ابن عباس رضي الله عنهما."]], "ic": "scroll"}, {"story": ["المسألة الثانية: شروط وجوب الحد على المحاربين", ["يشترط لتطبيق الحد على المحاربين شروط، أهمها:", "1- التكليف: فلا بد من البلوغ والعقل حتى يعد الشخص محاربا، ويقام عليه الحد. فالمجنون والصبي لا يعدان محاربين، ولا يقام عليهما الحد؛ لعدم تكليف واحد منهما شرعا.", "2- أن يأتوا مجاهرة، ويأخذوا المال قهرا. فإن أخذوه مختفين فهم سراق، وإن اختطفوه، وهربوا فهم منتهبون، فلا قطع عليهم.", "3- ثبوت كونهم محاربين، إما بإقرارهم أو بشهادة عدلين، كما في السرقة.", "4- أن يكون المال الذي يؤخذ في حرز، بأن يأخذوه من يد صاحبه قهرا، فإن كان المال متروكا ليس بيد أحد، لم يكن آخذه محاربا."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: سقوط الحد عن المحاربين", ["يسقط حد الحرابة إذا تاب الجاني المحارب قبل القدرة عليه وتمكن الحاكم منه، كأن يهرب أو يختفي ثم يتوب؛ لقوله تعالى: ﴿إلا الذين تابوا من قبل أن تقدروا عليهم فاعلموا أن الله غفور رحيم﴾ [المائدة: 34]، فيسقط عنه ما كان واجبا لله، من النفي عن البلد، وقطع اليد والرجل، وتحتم القتل. إلا أن حقوق الآدميين من نفس أو طرف أو مال لا تسقط؛ لأنه حق لآدمي تعلق به فلا يسقط كالدين، إلا أن يعفو عنه من استحقها.", "أما من تاب بعد القدرة عليه، ورفعه إلى ولي الأمر، فلا يسقط الحد عنه، وإن كان صادقا في توبته."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "ما الحرابة؟", "o": ["البروز لأخذ مال أو لقتل أو لإرهاب مكابرة اعتمادا على الشوكة", "أخذ المال خفية", "شرب المسكر", "الرمي بالزنى"], "h": "راجع: ص380 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "ما عقوبة من قتل وأخذ المال من المحاربين؟", "o": ["قتل وصلب", "قتل ولم يصلب", "النفي", "قطع اليد والرجل من خلاف"], "h": "راجع: ص381 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "ما عقوبة من أخاف الناس والطريق فقط، ولم يقتل ولم يأخذ مالا؟", "o": ["النفي من الأرض", "القتل", "الصلب", "القطع"], "h": "راجع: ص381 (المسألة الأولى)"}, {"t": "tf", "d": 2, "q": "يسقط حد الحرابة إذا تاب المحارب قبل القدرة عليه.", "a": true, "h": "راجع: ص381-382 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "المجنون والصبي يعدان محاربين.", "a": false, "h": "راجع: ص381 (المسألة الثانية)"}]}], "sum": [["تعريف الحرابة، وحد المحاربين", "ص380-382"], ["شروط وجوب الحد على المحاربين", "ص380-382"], ["سقوط الحد عن المحاربين", "ص380-382"]]}, {"id": "l97", "title": "الباب الثامن: في الردة", "group": "الكتاب الحادي عشر: الحدود", "map": {"center": "الباب الثامن\nالحدود", "nodes": [{"t": "تعريفها، وشروطها، وحكم المرتد", "s": []}, {"t": "الأمور التي تحصل بها الردة", "s": []}, {"t": "الأحكام المتعلقة بالردة", "s": []}]}, "paras": [{"t": "الباب الثامن: في الردة", "b": [{"pic": ["scroll", "book"], "cap": "ص382-384"}, {"story": ["المسألة الأولى: تعريفها، وشروطها، وحكم المرتد", ["1- تعريف الردة:", "الردة في اللغة: الرجوع عن الشيء، ومنه الرجوع عن الإسلام.", "وفي الاصطلاح: الكفر بعد الإسلام طوعا بنطق، أو اعتقاد، أو شك، أو فعل.", "2- شروطها: أما شروطها: فالعقل والتمييز والاختيار.", "فلا يحكم على مجنون، أو صبي غير مميز، أو مكره بالردة، إذا وقعت منهم.", "3- حكم المرتد: أما حكمه في الدنيا: فهو القتل؛ لقوله ﷺ: «من بدل دينه فاقتلوه». وينبغي قبل القتل أن يستتاب، ويدعى إلى الإسلام، وأن يضيق عليه ويحبس ثلاثة أيام، فإن تاب وإلا قتل؛ لحديث اليهودي الذي كان أسلم ثم ارتد. فقال معاذ رضي الله عنه لأبي موسى: «لا أنزل عن دابتي حتى يقتل»، فقتل. وفي رواية: «وكان قد استتيب قبل ذلك». ولقول عمر رضي الله عنه لما بلغه أن رجلا كفر بعد إسلامه فضربت عنقه قبل أن يستتاب: «فهلا حبستموه ثلاثا، فأطعمتموه كل يوم رغيفا، واستتبتموه، لعله يتوب، أو يراجع أمر ربه. اللهم إني لم أحضر، ولم أرض إذ بلغني».", "والذي يتولى قتله الإمام أو نائبه؛ لأنه حق لله تعالى فيكون إلى ولي الأمر.", "ولا يقتل الصبي المميز - ولو قيل بصحة ردته - حتى يبلغ.", "وأما حكمه في الآخرة: فقد بينه الله تعالى في قوله: ﴿ومن يرتدد منكم عن دينه فيمت وهو كافر فأولئك حبطت أعمالهم في الدنيا والآخرة وأولئك أصحاب النار هم فيها خالدون﴾ [البقرة: 217]."]], "ic": "scroll"}, {"story": ["المسألة الثانية: الأمور التي تحصل بها الردة", ["والردة تحصل بارتكاب ما يوجبها جدا أو هزلا أو استهزاء، كالشرك بالله بجميع أنواعه، وجحود الصلاة وغيرها من أركان الإسلام، وسب الله ورسوله ﷺ، وجحود القرآن الكريم كله أو بعضه، ومن اعتقد أن بعض الناس يجوز له الخروج عن شريعة محمد ﷺ كغلاة الصوفية، وكذلك من ظاهر المشركين وأعانهم على المسلمين، وغير ذلك من أنواع الردة التي تحصل بارتكاب ناقض من نواقض الإسلام الكثيرة. ومن ذلك: تحكيم القوانين الوضعية ممن يرى أنها أصلح مما جاءت به الشريعة الإسلامية أو أنها مساوية لها.", "وعلى هذا فإنه يمكن حصر الأمور التي تحصل بها الردة فيما يلي:", "1- القول: كمن سب الله تعالى أو رسوله أو الملائكة، أو ادعى النبوة، أو ادعى علم الغيب، وكذا الشرك بالله تعالى.", "2- الفعل: كالسجود للصنم والقبر ونحو ذلك، أو إلقاء المصحف، أو تعمد امتهانه، أو مظاهرة المشركين، ومعاونتهم على المسلمين، وغير ذلك.", "3- الاعتقاد: مثل اعتقاد الشريك لله تعالى والصاحبة والولد، أو اعتقاد حل الزنا أو الخمر، أو اعتقاد أن هدي غير النبي ﷺ أكمل من هديه.", "4- الشك: كأن يشك في حرمة ما أجمع على حله، أو حل ما أجمع على حرمته، ومثله لا يجهله لكونه نشأ بين المسلمين."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: الأحكام المتعلقة بالردة", ["1- المكره إذا نطق بما يوجب ردته بسبب الإكراه فإنه لا يحكم بارتداده؛ لقوله تعالى: ﴿إلا من أكره وقلبه مطمئن بالإيمان﴾ [النحل: 106].", "2- المرتد يستتاب ثلاثة أيام فإن تاب وإلا قتل، وقتله للإمام أو نائبه، كما مضى بيان ذلك.", "3- المرتد يمنع من التصرف في ماله، فإن أسلم مكن من التصرف فيه، وإن مات على ردته أو قتل مرتدا فماله فيء لبيت مال المسلمين؛ لأنه لا وارث له، لأن المسلم لا يرث الكافر، ولا يرثه أحد من الكفار؛ لأنه لا يقر على ردته.", "4- المرتد لا يغسل ولا يصلى عليه، ولا يدفن مع المسلمين إذا قتل على ردته.", "5- تحصل توبة المرتد بإتيانه بالشهادتين، لعموم قوله ﷺ: «أمرت أن أقاتل الناس حتى يقولوا: لا إله إلا الله، فإذا قالوها عصموا مني دماءهم وأموالهم إلا بحقها». ومن كانت ردته بسبب جحود شيء من أمور الدين فتوبته إلى جانب الإتيان بالشهادتين: إقراره بما جحد وأنكر، ورجوعه عما كفر به."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "ما الردة في الاصطلاح؟", "o": ["الكفر بعد الإسلام طوعا بنطق أو اعتقاد أو شك أو فعل", "الرجوع عن السفر", "ترك النافلة", "المعصية الصغيرة"], "h": "راجع: ص382 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "ما شروط الردة؟", "o": ["العقل والتمييز والاختيار", "البلوغ فقط", "الحرية فقط", "الذكورة"], "h": "راجع: ص382 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "ما حكم المرتد في الدنيا؟", "o": ["القتل بعد الاستتابة", "الجلد", "الحبس مدة", "الغرامة"], "h": "راجع: ص382 (المسألة الأولى)"}, {"t": "tf", "d": 2, "q": "المكره على النطق بما يوجب الردة لا يحكم بارتداده.", "a": true, "h": "راجع: ص384 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "المرتد يغسل ويصلى عليه.", "a": false, "h": "راجع: ص384 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "يستتاب المرتد ثلاثة أيام.", "a": true, "h": "راجع: ص384 (المسألة الثالثة)"}]}], "sum": [["تعريفها، وشروطها، وحكم المرتد", "ص382-384"], ["الأمور التي تحصل بها الردة", "ص382-384"], ["الأحكام المتعلقة بالردة", "ص382-384"]]}, {"id": "l98", "title": "الباب الأول: الأيمان", "group": "الكتاب الثاني عشر: الأيمان والنذور", "map": {"center": "الباب الأول\nالأيمان والنذور", "nodes": [{"t": "في تعريف الأيمان", "s": []}, {"t": "أقسام اليمين", "s": []}, {"t": "كفارة اليمين وشروط وجوبها", "s": []}, {"t": "صور لبعض الأيمان الجائزة والممنوعة", "s": []}]}, "paras": [{"t": "الباب الأول: الأيمان", "b": [{"pic": ["scroll", "book"], "cap": "ص385-389"}, {"story": ["المسألة الأولى: في تعريف الأيمان", ["الأيمان لغة: جمع يمين، وهو الحلف أو القسم، وسمي الحلف يمينا؛ لأنهم كانوا إذا تحالفوا ضرب كل واحد منهم بيمينه على يمين صاحبه.", "وشرعا: توكيد الشيء المحلوف عليه بذكر اسم الله، أو صفة من صفاته."]], "ic": "scroll"}, {"story": ["المسألة الثانية: أقسام اليمين", ["تنقسم اليمين من حيث انعقادها وعدم انعقادها إلى ثلاثة أقسام:", "1- اليمين اللغو: وهو الحلف من غير قصد اليمين، كأن يقول: لا والله، وبلى والله، وهو لا يريد بذلك يمينا ولا يقصد به قسما، فهذا يعد لغوا، أو يحلف على شيء يظن صدقه فيظهر خلافه؛ لقوله تعالى: ﴿لا يؤاخذكم الله باللغو في أيمانكم﴾ [المائدة: 89]. قالت عائشة رضي الله عنها: «أنزلت هذه الآية ﴿لا يؤاخذكم الله باللغو في أيمانكم﴾ في قول الرجل: لا والله، وبلى والله، وكلا والله». وهذه اليمين لا كفارة فيها، ولا مؤاخذة، ولا إثم على صاحبها.", "2- اليمين المنعقدة: وهي اليمين التي يقصدها الحالف ويصمم عليها، وتكون على المستقبل من الأفعال، وتكون على أمر ممكن، فهذه يمين منعقدة مقصودة، فتجب فيها عند الحنث كفارة، لقوله تعالى:", "﴿لا يؤاخذكم الله باللغو في أيمانكم ولكن يؤاخذكم بما عقدتم الأيمان﴾ [المائدة: 89].", "3- اليمين الغموس: وهي اليمين الكاذبة التي تهضم بها الحقوق، أو التي يقصد بها الغش والخيانة، فصاحبها يحلف على الشيء وهو يعلم أنه كاذب، وهي كبيرة من الكبائر، ولا تنعقد هذه اليمين، ولا كفارة فيها؛ لأنها أعظم من أن تكفر، ولأنها يمين غير منعقدة، فلا توجب الكفارة كاللغو. وتجب التوبة منها، ورد الحقوق إلى أصحابها إذا ترتب عليها ضياع حقوق. وسميت هذه اليمين غموسا لأنها تغمس صاحبها في الإثم، ثم في نار جهنم عياذا بالله. ودليل حرمتها قوله تعالى: ﴿ولا تتخذوا أيمانكم دخلا بينكم فتزل قدم بعد ثبوتها وتذوقوا السوء بما صددتم عن سبيل الله ولكم عذاب عظيم﴾ [النحل: 94].", "ولحديث ابن عمر رضي الله عنهما أن النبي ﷺ قال: «الكبائر: الإشراك بالله، وعقوق الوالدين، وقتل النفس، واليمين الغموس»، ولحديث أبي هريرة رضي الله عنه أن النبي ﷺ قال: «خمس ليس لهن كفارة: الشرك بالله، وقتل النفس بغير حق وبهت مؤمن، ويمين صابرة، يقطع بها مالا بغير حق»."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: كفارة اليمين وشروط وجوبها", ["1- كفارة اليمين: شرع الله عز وجل لعباده كفارة اليمين التي يكون بها تحلة اليمين والخروج منها، وذلك رحمة بهم، قال الله تعالى: ﴿قد فرض الله لكم تحلة أيمانكم﴾ [التحريم: 2].", "وقال ﷺ: «من حلف على يمين، فرأى غيرها خيرا منها، فليأتها، وليكفر عن يمينه». وهذه الكفارة تجب على الشخص إذا حنث في يمينه، ولم يف بموجبها.", "وكفارة اليمين فيها تخيير وترتيب. فيخير من لزمته بين إطعام عشرة مساكين لكل مسكين نصف صاع من الطعام، أو كسوة عشرة مساكين لكل واحد ثوب يجزئه في الصلاة، أو عتق رقبة مؤمنة سليمة من العيوب، فمن لم يجد شيئا من هذه الثلاثة المذكورة صام ثلاثة أيام؛ لقوله تعالى: ﴿لا يؤاخذكم الله باللغو في أيمانكم ولكن يؤاخذكم بما عقدتم الأيمان فكفارته إطعام عشرة مساكين من أوسط ما تطعمون أهليكم أو كسوتهم أو تحرير رقبة فمن لم يجد فصيام ثلاثة أيام﴾ [المائدة: 89].", "فجمعت كفارة اليمين بين التخيير والترتيب، تخيير بين الإطعام والكسوة والعتق، وترتيب بين هذه الثلاثة وبين الصيام.", "2- شروط وجوب كفارة اليمين:", "لا تجب الكفارة في اليمين إذا نقضها الحالف، ولم يف بموجبها، إلا بشروط ثلاثة، وهي:", "الشرط الأول: أن تكون اليمين منعقدة، بأن يقصد الحالف عقدها على أمر مستقبل كما مضى بيان ذلك، ولا تنعقد اليمين إلا بالله أو باسم من أسمائه أو صفة من صفاته؛ لقوله تعالى: ﴿لا يؤاخذكم الله باللغو في أيمانكم ولكن يؤاخذكم بما عقدتم الأيمان﴾ [المائدة: 89].", "فدل ذلك على أن الكفارة لا تجب إلا في اليمين المنعقدة، أما من سبق اليمين على لسانه بلا قصد فلا تنعقد يمينه، ولا كفارة عليه.", "الشرط الثاني: أن يحلف مختارا، فمن حلف مكرها لم تنعقد يمينه ولا كفارة عليه فيها؛ لقوله ﷺ: «رفع عن أمتي الخطأ والنسيان وما استكرهوا عليه».", "الشرط الثالث: أن يحنث في يمينه، بأن يفعل ما حلف على تركه، أو يترك ما حلف على فعله، ذاكرا ليمينه مختارا، أما إذا حنث في يمينه ناسيا أو مكرها فلا كفارة عليه للحديث المتقدم.", "● الاستثناء في اليمين:", "من حلف فقال في يمينه: إن شاء الله، فلا حنث عليه ولا كفارة، إذا نقض يمينه؛ لقوله ﷺ: «من حلف فقال: إن شاء الله لم يحنث».", "● نقض اليمين والحنث فيها:", "الأصل أن يفي الحالف بيمينه، لكن قد ينقضه لمصلحة، أو ضرورة. وقد شرع له كفارة ذلك كما سبق. ويمكن تقسيم نقض اليمين، والحنث فيها بحسب المحلوف عليه، على النحو التالي:", "1- أن يكون نقض اليمين واجبا: وذلك إذا حلف على ترك واجب، كمن حلف أن لا يصل رحمه، أو حلف على فعل محرم، كأن يحلف ليشربن خمرا؛ فهنا يجب عليه نقض يمينه، وتلزمه الكفارة؛ لأنه حلف على معصية.", "2- أن يكون نقض اليمين حراما: كما لو حلف على فعل واجب، أو ترك محرم، وجب عليه الوفاء، ويحرم عليه نقض اليمين؛ لأن حلفه في هذه الحالة تأكيد لما كلف الله به عباده.", "3- أن يكون نقض اليمين مباحا: وذلك إذا حلف على فعل مباح أو تركه."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: صور لبعض الأيمان الجائزة والممنوعة", ["إن اليمين الجائزة هي التي يحلف فيها باسم الله، أو بصفة من صفاته.", "كأن يقول: والله أو: وجه الله أو: وعظمته وكبريائه..؛ لحديث ابن عمر رضي الله عنهما أن رسول الله ﷺ أدرك عمر بن الخطاب رضي الله عنه وهو يسير في ركب، يحلف بأبيه، فقال: «ألا إن الله ينهاكم أن تحلفوا بآبائكم، من كان حالفا فليحلف بالله أو ليصمت». ولحديث ابن عمر رضي الله عنهما قال: كانت يمين النبي ﷺ: «لا ومقلب القلوب». وكذلك لو قال: أقسم بالله لأفعلن كذا فهو يمين إن نواها؛ لقوله تعالى: ﴿وأقسموا بالله جهد أيمانهم﴾ [النحل: 38].", "ومن الأيمان الممنوعة:", "1- الحلف بغير الله تعالى، كقوله: وحياتك، والأمانة..؛ لحديث عبد الله ابن عمر رضي الله عنهما أن النبي ﷺ قال: «فمن كان حالفا فليحلف بالله أو ليصمت».", "2- الحلف بأنه يهودي أو نصراني أو أنه بريء من الله أو من رسول الله ﷺ فعل كذا فعلته؛ لحديث بريدة رضي الله عنه عن أبيه رضي الله عنه أن النبي ﷺ قال: «من حلف، فقال: إني بريء من الإسلام، فإن كان كاذبا فهو كما قال، وإن كان صادقا فلن يرجع إلى الإسلام سالما».", "3- الحلف بالآباء والطواغيت؛ لحديث عبد الرحمن بن سمرة رضي الله عنه قال: قال رسول الله ﷺ: «لا تحلفوا بالطواغي، ولا بآبائكم»."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "ما الأيمان لغة؟", "o": ["جمع يمين، وهو الحلف أو القسم", "جمع إيمان", "الصدق", "العهد فقط"], "h": "راجع: ص385 (المسألة الأولى)"}, {"t": "mcq", "d": 1, "q": "ما اليمين اللغو؟", "o": ["الحلف من غير قصد اليمين", "الحلف الكاذب لأخذ حق غيره", "الحلف على أمر مستقبل بقصد", "الحلف بالنبي"], "h": "راجع: ص385 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "ما اليمين الغموس؟", "o": ["اليمين الكاذبة التي تهضم بها الحقوق", "اليمين المنعقدة", "يمين المكره", "يمين النائم"], "h": "راجع: ص386 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "من خصال كفارة اليمين:", "o": ["إطعام عشرة مساكين", "صيام شهرين", "ذبح شاة", "حج"], "h": "راجع: ص386-387 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "لا كفارة في اليمين اللغو.", "a": true, "h": "راجع: ص385 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "من حلف فقال: إن شاء الله لم يحنث.", "a": true, "h": "راجع: ص388 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "يجوز الحلف بالآباء.", "a": false, "h": "راجع: ص389 (المسألة الرابعة)"}]}], "sum": [["في تعريف الأيمان", "ص385-389"], ["أقسام اليمين", "ص385-389"], ["كفارة اليمين وشروط وجوبها", "ص385-389"], ["صور لبعض الأيمان الجائزة والممنوعة", "ص385-389"]]}, {"id": "l99", "title": "الباب الثاني: النذور", "group": "الكتاب الثاني عشر: الأيمان والنذور", "map": {"center": "الباب الثاني\nالأيمان والنذور", "nodes": [{"t": "تعريف النذر، ومشروعيته، وحكمه", "s": []}, {"t": "شروط النذر، وألفاظه", "s": []}, {"t": "أقسام النذر", "s": []}, {"t": "أنواع النذر وأحكامه", "s": []}, {"t": "صور من النذر الذي لا يجوز الوفاء ب", "s": []}]}, "paras": [{"t": "الباب الثاني: النذور", "b": [{"pic": ["scroll", "book"], "cap": "ص389-393"}, {"story": ["المسألة الأولى: تعريف النذر، ومشروعيته، وحكمه", ["1- تعريف النذر:", "النذر لغة: الإيجاب، تقول: نذرت كذا إذا أوجبته على نفسك.", "وشرعا: إلزام مكلف مختار نفسه شيئا لله تعالى.", "2- مشروعية النذر وحكمه:", "النذر مشروع بالكتاب والسنة والإجماع، كما سيأتي ذكره من الأدلة على ذلك.", "وأما حكم النذر ابتداء فإنه مكروه غير مستحب؛ لحديث ابن عمر رضي الله عنهما أن النبي ﷺ نهى عن النذر وقال: «إنه لا يرد شيئا، وإنما يستخرج به من الشحيح»، ولأن الناذر يلزم نفسه بشيء لا يلزمه في أصل الشرع، فيحرج نفسه، ويثقلها بذلك، ولأنه مطلوب من المسلم فعل الخير بلا نذر.", "إلا أنه إذا نذر فعل طاعة وجب عليه الوفاء به؛ لقوله تعالى: ﴿وما أنفقتم من نفقة أو نذرتم من نذر فإن الله يعلمه﴾ [البقرة: 270]، وقوله تعالى: ﴿يوفون بالنذر ويخافون يوما كان شره مستطيرا﴾ [الإنسان: 7]، ولحديث عائشة رضي الله عنها أن النبي ﷺ قال: «من نذر أن يطيع الله فليطعه، ومن نذر أن يعصي الله فلا يعصه».", "فقد مدح الله عز وجل الموفين بالنذر وأثنى عليهم، وأمر ﷺ بالوفاء به، فدل ذلك على أن النهي المتقدم عن النبي ﷺ إنما هو للكراهة لا للتحريم، وأن المنهي عنه والمكروه هو ابتداء النذر والدخول فيه، أما الوفاء به، وإنجازه لمن لزمه فواجب، وطاعة لله سبحانه. والنذر نوع من أنواع العبادة لا يجوز صرفه لغير الله تعالى، فمن نذر لقبر أو ولي ونحوه، فقد أشرك بالله تعالى شركا أكبر، والعياذ بالله."]], "ic": "scroll"}, {"story": ["المسألة الثانية: شروط النذر، وألفاظه", ["1- شروط النذر: لا يصح النذر إلا من شخص بالغ عاقل مختار، فلا يصح النذر من الصبي، ولا من المجنون والمعتوه، ولا من المكره؛ لقوله ﷺ: «رفع القلم عن ثلاثة...» الحديث، ولقوله: «إن الله تجاوز لأمتي عن الخطأ...» الحديث، وقد تقدما مرارا.", "2- ألفاظ النذر: صيغ النذر وألفاظه أن يقول: «لله علي أن أفعل كذا»، أو: «علي نذر كذا». ونحو ذلك من الألفاظ التي يصرح فيها بذكر النذر."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: أقسام النذر", ["1- النذر الصحيح وغير الصحيح:", "ينقسم النذر باعتبار صحته وعدم صحته إلى: صحيح وغير صحيح، أو: جائز وممنوع، أو منعقد وغير منعقد.", "فيكون النذر صحيحا منعقدا واجب الوفاء: إذا كان طاعة وقربة، يتقرب بها الناذر إلى الله تعالى.", "ويكون غير صحيح ولا منعقد ولا واجب الوفاء: إذا كان معصية لله تعالى؛ كالنذر للقبور والأولياء أو الأنبياء، أو نذر أن يقتل، أو أن يشرب الخمر، ونحو ذلك من المعاصي، فإن هذا النذر لا ينعقد، ويحرم الوفاء به.", "2- النذر المطلق والمقيد:", "أ- النذر المطلق: هو الذي يلتزمه الشخص ابتداء دون تعليقه على شرط، وقد يقع شكرا لله على نعمة أو لغير سبب، كأن يقول الشخص: لله علي أن أصلي كذا أو أصوم كذا. فيجب الوفاء به.", "ب- النذر المقيد: وهو ما كان معلقا على شرط وحصول شيء، كأن يقول: إن شفى الله مريضي، أو قدم غائبي، فعلي كذا. وهذا يلزم الوفاء به، عند تحقق شرطه، وحصول مطلوبه."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: أنواع النذر وأحكامه", ["ينقسم النذر بحسب الأحكام المترتبة عليه، ولزوم الوفاء به من عدمه، إلى خمسة أنواع:", "1- النذر المطلق: نحو قوله: لله علي نذر. ولم يسم شيئا، فيلزمه كفارة يمين، سواء كان مطلقا أو مقيدا؛ لحديث عقبة بن عامر رضي الله عنه قال: قال رسول الله ﷺ: «كفارة النذر إذا لم يسم كفارة يمين».", "2- نذر اللجاج والغضب: وهو تعليق نذره بشرط يقصد به المنع من فعل شيء أو الحمل عليه أو التصديق أو التكذيب، كقوله: إن كلمتك، أو إن لم أخبرك بك، أو إن لم يكن هذا الخبر صحيحا، أو إن كان كذبا فعلي الحج، أو العتق...، فهذا النذر خارج مخرج اليمين للحث على فعل شيء أو المنع منه، ولم يقصد به النذر ولا القربة، فهذا يخير فيه بين فعل ما نذره أو كفارة يمين؛ لقوله ﷺ: «كفارة النذر كفارة يمين».", "3- النذر المباح: وهو أن ينذر فعل الشيء المباح، نحو: أن ينذر لبس ثوب أو ركوب دابة.. ونحو ذلك، واختار شيخ الإسلام ابن تيمية أنه لا شيء عليه فيه؛ لحديث ابن عباس رضي الله عنهما قال: بينما النبي ﷺ يخطب إذا هو برجل قائم، فسأل عنه، فقالوا: أبو إسرائيل، نذر أن يقوم في الشمس، ولا يستظل، ولا يتكلم، وأن يصوم، فقال: «مروه فليتكلم، وليستظل، وليقعد، وليتم صومه».", "4- نذر المعصية: وهو أن ينذر فعل معصية، كنذر شرب خمر، والنذر للقبور، أو لأهل القبور من الأموات، وصوم أيام الحيض، ويوم النحر، فهذا النذر لا ينعقد ولا يجب الوفاء به؛ لحديث عائشة رضي الله عنها أن النبي ﷺ قال: «ومن نذر أن يعصي الله فلا يعصه»؛ لأن معصية الله لا تباح في حال من الأحوال، ولا يلزمه به كفارة.", "5- نذر التبرر: وهو نذر الطاعة، كنذر فعل الصلاة والصيام والحج، سواء أكان مطلقا، أم معلقا على حصول شيء، فيجب الوفاء به إن كان مطلقا، وعند حصول الشرط إن كان معلقا؛ لحديث عائشة رضي الله عنها أن النبي ﷺ قال: «من نذر أن يطيع الله فليطعه»."]], "ic": "scroll"}, {"story": ["المسألة الخامسة: صور من النذر الذي لا يجوز الوفاء به", ["إن النذر الذي لا يجوز الوفاء به هو نذر المعصية وهذا يتحقق في صور، منها:", "1- نذر شرب الخمر أو صوم أيام الحيض؛ لحديث عائشة رضي الله عنها أن النبي ﷺ قال: «ومن نذر أن يعصي الله فلا يعصه».", "2- النذر الذي يقع للأموات كأن يقول: يا سيدي فلان: إن رد غائبي، أو عوفي مريضي، أو قضيت حاجتي، فلك من النقد أو الطعام أو الشمع أو الزيت كذا وكذا. فهذا باطل، وهو شرك أكبر والعياذ بالله؛ لأنه نذر للمخلوق، وهو لا يجوز؛ لأن النذر عبادة، وهي لا تكون إلا لله.", "3- إذا نذر أن يسرج قبرا، أو شجرة، لم يجز الوفاء به، ويصرف قيمة ذلك للمصالح؛ لأنه معصية، ولا نذر في معصية؛ للحديث المتقدم."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "ما النذر لغة؟", "o": ["الإيجاب", "المنع", "الحلف", "الدعاء"], "h": "راجع: ص389 (المسألة الأولى)"}, {"t": "mcq", "d": 1, "q": "ما النذر شرعا؟", "o": ["إلزام مكلف مختار نفسه شيئا لله تعالى", "كل يمين", "هدية لفقير", "ذبح الأضحية"], "h": "راجع: ص389 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "ما حكم النذر ابتداء؟", "o": ["مكروه غير مستحب", "واجب", "حرام", "مستحب"], "h": "راجع: ص390 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "ما حكم نذر المعصية؟", "o": ["لا ينعقد ولا يجب الوفاء به", "يجب الوفاء به", "يجب فيه صيام", "يستحب"], "h": "راجع: ص392 (المسألة الرابعة)"}, {"t": "tf", "d": 2, "q": "من نذر لقبر أو ولي فقد أشرك بالله شركا أكبر.", "a": true, "h": "راجع: ص390 (المسألة الأولى)"}, {"t": "tf", "d": 2, "q": "من نذر أن يطيع الله وجب عليه الوفاء.", "a": true, "h": "راجع: ص393 (المسألة الرابعة)"}, {"t": "tf", "d": 2, "q": "يصح النذر من الصبي والمجنون.", "a": false, "h": "راجع: ص390 (المسألة الثانية)"}]}], "sum": [["تعريف النذر، ومشروعيته، وحكمه", "ص389-393"], ["شروط النذر، وألفاظه", "ص389-393"], ["أقسام النذر", "ص389-393"], ["أنواع النذر وأحكامه", "ص389-393"]]}, {"id": "l100", "title": "الباب الأول: في الأطعمة", "group": "الكتاب الثالث عشر: الأطعمة والذبائح والصيد", "map": {"center": "الباب الأول\nالأطعمة والذبائح", "nodes": [{"t": "تعريفها والأصل فيها", "s": []}, {"t": "ما نص الشارع على حله، وإباحته", "s": []}, {"t": "ما نص الشارع على تحريمه", "s": []}, {"t": "ما سكت عنه الشارع", "s": []}, {"t": "ما يكره أكله", "s": []}]}, "paras": [{"t": "الباب الأول: في الأطعمة", "b": [{"pic": ["scroll", "book"], "cap": "ص394-403"}, {"story": ["المسألة الأولى: تعريفها والأصل فيها", ["1- تعريفها: الأطعمة جمع طعام، وهو ما يأكله الإنسان ويتغذى به من الأقوات وغيرها أو يشربه.", "2- الأصل فيها: تنطلق القاعدة الشرعية في معرفة ما يحل من الأطعمة وما يحرم من قوله تعالى: ﴿قل لا أجد في ما أوحي إلي محرما على طاعم يطعمه إلا أن يكون ميتة أو دما مسفوحا أو لحم خنزير فإنه رجس أو فسقا أهل لغير الله به فمن اضطر غير باغ ولا عاد فإن ربك غفور رحيم﴾ [الأنعام: 145]، ومن قوله سبحانه وتعالى: ﴿ويحل لهم الطيبات ويحرم عليهم الخبائث﴾ [الأعراف: 157]، ومن قوله تعالى: ﴿قل من حرم زينة الله التي أخرج لعباده والطيبات من الرزق﴾ [الأعراف: 32]. والمراد بالطيبات: ما تستطيبه النفس وتشتهيه؛ لأن الطعام لما كان يتغذى به الإنسان، فإن أثره ينعكس على أخلاقه، فالطعام الطيب يكون أثره طيبا، والخبيث يكون على الضد من ذلك؛ لذا أباح الله سبحانه الطيب من المطاعم، وحرم الخبيث منها.", "فالأصل في الأطعمة الحل، إلا ما حرمه الشارع الحكيم؛ ولذا قال تعالى: ﴿وقد فصل لكم ما حرم عليكم إلا ما اضطررتم إليه﴾ [الأنعام: 119].", "وقد جاء هذا التفصيل مشتملا على أمور ثلاثة:", "1- النص على المباح.", "2- النص على الحرام.", "3- ما سكت عنه الشارع.", "وقد بين النبي ﷺ ذلك بقوله: «إن الله فرض فرائض فلا تضيعوها، وحد حدودا فلا تعتدوها، وحرم أشياء فلا تنتهكوها، وسكت عن أشياء رحمة لكم من غير نسيان فلا تبحثوا عنها»."]], "ic": "scroll"}, {"story": ["المسألة الثانية: ما نص الشارع على حله، وإباحته", ["والأصل في ذلك والقاعدة: أن كل طعام طاهر لا مضرة فيه فإنه مباح، والأطعمة المباحة على نوعين: حيوانات ونباتات؛ كالحبوب والثمار، والحيوانات على نوعين: برية وبحرية.", "أولا: الحيوان البحري: وهو كل حيوان لا يعيش إلا في البحر؛ كالسمك بأنواعه المختلفة وكذا غيره من حيوانات البحر، إلا ما فيه سم فإنه يحرم للضرر، وكذا يحرم من طعام البحر ما كان مستخبثا مستقذرا كالضفادع، مع ما جاء من النهي عن قتلها، وكالتمساح؛ لكونه مستخبثا، ولأن له نابا يفترس به، لعموم قوله تعالى: ﴿ويحرم عليهم الخبائث﴾ [الأعراف: 157].", "ويجوز أكل الحيوان البحري سواء صاده مسلم أو غيره، وسواء كان له شبه، يجوز أكله في البر أم لم يكن. والحيوان البحري لا يحتاج إلى تذكية؛ لقوله تعالى: ﴿أحل لكم صيد البحر وطعامه متاعا لكم وللسيارة﴾ [المائدة: 96].", "قال ابن عباس رضي الله عنهما: «ألا إن صيده ما صيد، وطعامه ما لفظ البحر». ولحديث أبي هريرة رضي الله عنه قال: سأل رجل رسول الله ﷺ، فقال: يا رسول الله إنا نركب البحر، ونحمل معنا القليل من الماء، فإن توضأنا به عطشنا، أفنتوضأ بماء البحر؟ فقال رسول الله ﷺ: «هو الطهور ماؤه الحل ميتته».", "ثانيا: الحيوان البري: والحلال من الحيوان البري المنصوص عليه يمكن تلخيصه في الآتي:", "أ) الأنعام: لقوله تعالى: ﴿والأنعام خلقها لكم فيها دفء ومنافع ومنها تأكلون﴾ [النحل: 5]، وقوله سبحانه: ﴿يا أيها الذين آمنوا أوفوا بالعقود أحلت لكم بهيمة الأنعام إلا ما يتلى عليكم﴾ [المائدة: 1]. والمقصود ببهيمة الأنعام: الإبل والبقر والغنم.", "ب) الخيل: لحديث جابر بن عبد الله رضي الله عنه قال: «نهى النبي ﷺ يوم خيبر عن لحوم الحمر، ورخص في لحوم الخيل».", "ج) الضب: لحديث ابن عباس رضي الله عنه قال: «أكل الضب على مائدة رسول الله ﷺ». وقوله ﷺ: «كلوا فإنه حلال، ولكنه ليس من طعامي».", "د) الحمار الوحشي: وهو غير المستأنس: لحديث أبي قتادة رضي الله عنه: أنه رأى حمارا وحشيا فعقره، فقال النبي ﷺ: «هل معكم من لحمه شيء؟» قال: معنا رجله، فأخذها، فأكلها.", "هـ) الأرنب: لما رواه أنس رضي الله عنه أنه أخذ أرنبا، فذبحها أبو طلحة، وبعث بوركها إلى النبي ﷺ فقبله.", "و) الضبع: لما روى جابر رضي الله عنه قال: سألت رسول الله ﷺ عن الضبع، فقال: «هو صيد ويجعل فيه كبش إذا صاده»، أي: وهو محرم، قال الحافظ ابن حجر: «وقد ورد في حل الضبع أحاديث لا بأس بها».", "ز) الدجاج: لما روى أبو موسى رضي الله عنه، قال: «رأيت رسول الله ﷺ يأكل لحم دجاج». ويلحق بالدجاج الأوز والبط؛ لأنهما من الطيبات، فتدخل في قوله تعالى: ﴿أحل لكم الطيبات﴾ [المائدة: 4].", "ح) الجراد: لحديث عبد الله بن أبي أوفى رضي الله عنه قال: «غزونا مع النبي ﷺ سبع غزوات أو ستا، كنا نأكل معه الجراد»."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: ما نص الشارع على تحريمه", ["والأصل فيما يحرم من الأطعمة: أن كل طعام نجس مستقذر فيه مضرة، لا يجوز أكله، وذلك على النحو التالي:", "1- المحرمات من الطعام في كتاب الله محصورة في عشرة أشياء وردت في قوله تعالى: ﴿حرمت عليكم الميتة والدم ولحم الخنزير وما أهل لغير الله به والمنخنقة والموقوذة والمتردية والنطيحة وما أكل السبع إلا ما ذكيتم وما ذبح على النصب﴾ [المائدة: 3].", "- أما الميتة: فهي ما مات حتف أنفه، وفارقته الحياة بدون ذكاة شرعية، وحرمت لما فيها من المضرة بسبب الدم المحتقن وخبث التغذية، وتجوز للمضطر بقدر الحاجة، ويستثنى من الميتة: السمك والجراد، فإنهما حلال.", "- والدم: المراد به الدم المسفوح، فإنه حرام؛ لقوله تعالى في آية أخرى: ﴿أو دما مسفوحا﴾ [الأنعام: 145]، أما ما يبقى من الدم في خلال اللحم، وفي العروق بعد الذبح، فمباح، وكذا ما جاء الشرع بحله من الدم: كالكبد والطحال.", "- ولحم الخنزير: لأنه قذر، ويتغذى على القاذورات، ولمضرته البالغة، وقد جمع الله عز وجل هذه الثلاثة في قوله: ﴿إلا أن يكون ميتة أو دما مسفوحا أو لحم خنزير فإنه رجس أو فسقا أهل لغير الله به﴾ [الأنعام: 145].", "- وما أهل لغير الله به: أي ذبح على غير اسمه تعالى، وهذا حرام لما فيه من الشرك المنافي للتوحيد؛ فإن الذبح عبادة لا يجوز صرفها لغير الله تعالى، كما قال عز وجل: ﴿فصل لربك وانحر﴾ [الكوثر: 2].", "- والمنخنقة: وهي التي تخنق فتموت، إما قصدا أو بغير قصد.", "- والموقوذة: هي التي تضرب بعصا أو شيء ثقيل، فتموت.", "- والمتردية: هي التي تتردى من مكان عال، فتموت.", "- والنطيحة: هي التي تنطحها أخرى، فتقتلها.", "- وما أكل السبع: هي التي يعدو عليها أسد أو نمر أو ذئب أو فهد أو كلب، فأكل بعضها، فتموت بسبب ذلك. فما أدرك من هذه الخمسة الأخيرة، وبه حياة، فذكي، فإنه حلال الأكل؛ لقوله تعالى في الآية المذكورة: ﴿إلا ما ذكيتم﴾ [المائدة: 3].", "- وما ذبح على النصب: وهي حجارة كانت منصوبة حول الكعبة، وكانوا في الجاهلية يذبحون عندها، فهذه لا يحل أكلها؛ لأن ذلك من الشرك الذي حرمه الله، كما مضى فيما أهل لغير الله به.", "ويحرم من الأطعمة أيضا:", "2- ما فيه مضرة: كالسم، والخمر، وسائر المسكرات والمفترات؛ لقوله تعالى: ﴿ولا تلقوا بأيديكم إلى التهلكة﴾ [البقرة: 195]، وقوله عز وجل: ﴿ولا تقتلوا أنفسكم﴾ [النساء: 29].", "3- ما قطع من الحي: لحديث أبي واقد الليثي رضي الله عنه قال: قال رسول الله ﷺ: «ما قطع من البهيمة وهي حية فهو ميتة».", "4- سباع البهائم: وهي التي تفترس بنابها أي: تنهش من حيوانات البر كالأسد والذئب والنمر والفهد والكلب؛ لحديث أبي ثعلبة الخشني رضي الله عنه قال: «نهى رسول الله ﷺ عن كل ذي ناب من السباع»، ولقوله ﷺ: «كل ذي ناب من السباع فأكله حرام».", "5- سباع الطير: وهي التي تصيد بمخلبها؛ كالعقاب والباز والصقر والحدأة والبومة؛ لحديث ابن عباس رضي الله عنه قال: «نهى رسول الله ﷺ عن كل ذي ناب من السباع، وعن كل ذي مخلب من الطيور».", {"note": "حاشية (ص399): المخلب للطير والسبع كالظفر للإنسان؛ لأن الطائر يخلب الجلد بمخلبه، أي: يقطعه ويمزقه."}, "6- ويحرم من الطيور ما يأكل الجيف: كالنسر والرخم والغراب؛ لخبث ما يتغذى به.", "7- يحرم كل حيوان ندب قتله: كالحية والعقرب والفأرة والحدأة؛ لحديث عائشة رضي الله عنها أن رسول الله ﷺ قال: «خمس من الدواب كلهن فاسق يقتلن في الحرم الغراب والحدأة والعقرب والفأرة والكلب العقور»، ولكونها مستخبثة مستقذرة.", "8- الحمر الأهلية: لما روى جابر: «أن النبي ﷺ نهى يوم خيبر عن لحوم الحمر الأهلية».", "9- ما يستخبث من الأطعمة: كالفأرة والحية والذباب والزنبور والنحل؛ لقول الله تعالى: ﴿ويحرم عليهم الخبيث﴾ [الأعراف: 157].", "10- الجلالة: وهي التي أكثر أكلها النجاسة؛ لما روى ابن عمر رضي الله عنهما قال: «نهى رسول الله ﷺ عن أكل الجلالة» وسواء في ذلك الإبل والبقر والغنم والدجاج ونحوها، فإذا حبست بعيدا عن النجاسات، وأطعمت الطاهرات، حل أكلها. وكان ابن عمر رضي الله عنهما يحبسها ثلاثا إذا أراد أكلها، وقيل: تحبس أكثر من ذلك."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: ما سكت عنه الشارع", ["ما سكت عنه الشارع، ولم يرد نص بتحريمه، فهو حلال؛ لأن الأصل في الأشياء الإباحة، دل على هذا قوله تعالى: ﴿هو الذي خلق لكم ما في الأرض جميعا﴾ [البقرة: 29].", "وحديث أبي الدرداء رضي الله عنه أن رسول الله ﷺ قال: «ما أحل الله في كتابه فهو حلال وما حرم فهو حرام وما سكت عنه فهو عفو فاقبلوا من الله عافيته فإن الله لم يكن لينسى شيئا»، وتلا: ﴿وما كان ربك نسيا﴾ [مريم: 64]."]], "ic": "scroll"}, {"story": ["المسألة الخامسة: ما يكره أكله", ["يكره أكل البصل والثوم وما كان في معناهما مما له رائحة كريهة؛ كالكراث والفجل، ولا سيما عند حضور المساجد وغيرها من مجامع الذكر والعبادة؛ لحديث جابر رضي الله عنه أن رسول الله ﷺ قال: «من أكل من هذه الشجرة المنتنة فلا يقربن مسجدنا، فإن الملائكة تتأذى مما يتأذى منه الإنس» يعني: شجرة الثوم: وفي رواية: «حتى يذهب ريحها». فإن طبخ هاتين البقلتين حتى يذهب ريحهما فلا بأس بأكلهما؛ لقول عمر بن الخطاب رضي الله عنه: «فمن أكلهما فليمتهما طبخا». وفي رواية لجابر: «ما أراه يعني إلا نيئه»."]], "ic": "scroll"}, {"story": ["المسألة السادسة: آداب الأكل", ["للأكل آداب ينبغي الحرص عليها، وهي:", "1- التسمية عند ابتداء الأكل: لحديث عمر بن أبي سلمة رضي الله عنه قال: كنت غلاما في حجر رسول الله ﷺ، وكانت يدي تطيش في الصحفة، فقال لي رسول الله ﷺ: «يا غلام، سم الله، وكل بيمينك، وكل مما يليك» فما زالت تلك طعمتي بعد.", {"note": "حاشية (ص401): ومعنى تطيش: تتحرك في نواحي القصعة ولا تقتصر على موضع واحد."}, "2- الأكل باليمين: للحديث السابق.", "3- الأكل مما يلي الشخص: للحديث السابق أيضا، إلا إذا علم أن مجالسه لا يتأذى، ولا يكره ذلك، فلا بأس أن يأكل حينئذ من نواحي القصعة؛ لحديث أنس رضي الله عنه في قصة الخياط الذي دعا النبي ﷺ إلى طعام، قال أنس: «فرأيته - يعني النبي ﷺ - يتتبع الدباء من حوالي القصعة». أو كان الشخص وحده ليس معه أحد، أو كان الطعام مشتملا على ألوان متعددة، فيجوز له الأخذ مما ليس أمامه، أو لم يؤذ بذلك أحدا.", "4- الحمد في آخره: لحديث أبي أمامة رضي الله عنه قال: كان رسول الله ﷺ إذا رفعت المائدة من بين يديه يقول: «الحمد لله حمدا كثيرا طيبا مباركا فيه غير مودع ولا مستغنى عنه ربنا»، ولقوله ﷺ: «إن الله ليرضى عن العبد أن يأكل الأكلة فيحمده عليها أو يشرب الشربة فيحمده عليها».", "5- الأكل على السفر: لحديث أنس بن مالك رضي الله عنه قال: «ما أكل نبي الله ﷺ على خوان، ولا في سكرجة، ولا خبز له مرقق»، قال: فقلت لقتادة: فعلى ما كانوا يأكلون؟ قال: على هذه السفر.", {"note": "حاشية (ص402): الخوان: ما يوكل عليه، وهو المائدة، معرب. والسفرة: التي يؤكل عليها أيضا، سميت كذلك لأنها تبسط إذا أكل عليها. والسكرجة: إناء صغير يؤكل فيه الشيء القليل من الأدم، وهي فارسية. وربما كان تركه الأكل على الخوان لأنه من عادة العجم يكون على هيئة معينة، وربما يقال ذلك في السكرجة أيضا."}, "6- كراهية الأكل متكئا: لحديث عائشة رضي الله عنها قالت: قلت يا رسول الله كل - جعلني الله فداك - متكئا، فإنه أهون عليك، فأصغى برأسه حتى كاد أن تصيب جبهته الأرض، قال: «لا، بل آكل كما يأكل العبد، وأجلس كما يجلس العبد»، ولحديث أبي جحيفة رضي الله عنه قال: قال رسول الله ﷺ: «إني لا آكل متكئا».", "7- عدم عيب الطعام الذي لا يريد أكله: لحديث أبي هريرة رضي الله عنه قال: «ما عاب رسول الله ﷺ طعاما قط، إن اشتهاه أكله وإلا تركه».", "8- الأكل من جوانب القصعة وكراهية الأكل من وسط القصعة: لحديث ابن عباس رضي الله عنه عن النبي ﷺ أنه أتي بقصعة من ثريد، فقال: «كلوا من جوانبها، ولا تأكلوا من وسطها، فإن البركة تنزل في وسطها».", "9- الأكل بثلاثة أصابع، ولعقها بعد الأكل: لحديث كعب بن مالك رضي الله عنه قال: «كان النبي ﷺ يأكل بثلاثة أصابع، ولا يمسح يده، حتى يلعقها».", "10- أكل ما سقط منه أثناء الطعام أو تناثر: لقوله ﷺ: «إذا سقطت لقمة أحدكم فليمط عنها الأذى وليأكلها، ولا يدعها للشيطان».", "11- مسح القصعة التي يأكل فيها ولعقها: يقول أنس رضي الله عنه في الحديث الماضي: «وأمرنا - يعني النبي ﷺ أن نسلت القصعة» يعني: نمسحها، ونتبع ما بقي فيها من طعام. وفي رواية: «أن النبي ﷺ أمر بلعق الأصابع والصحفة»، وقال: «إنكم لا تدرون في أيه البركة»."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "ما الأطعمة؟", "o": ["جمع طعام، وهو ما يأكله الإنسان ويتغذى به أو يشربه", "جمع ذبيحة", "جمع صيد", "جمع مائدة"], "h": "راجع: ص394 (المسألة الأولى)"}, {"t": "mcq", "d": 1, "q": "ما الأصل في الأطعمة؟", "o": ["الحل إلا ما حرمه الشارع", "التحريم", "الكراهة", "التوقف"], "h": "راجع: ص394 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "ما حكم ما سكت عنه الشارع ولم يرد نص بتحريمه؟", "o": ["حلال", "حرام", "مكروه", "مشتبه"], "h": "راجع: ص400 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "ما الحيوان البحري المذكور في النص مما لا يحتاج إلى تذكية؟", "o": ["كل حيوان لا يعيش إلا في البحر", "السمك الكبير فقط", "ما صاده مسلم فقط", "لا شيء"], "h": "راجع: ص395 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "ما الجلالة؟", "o": ["التي أكثر أكلها النجاسة", "كل ذي ناب", "ما قطع من الحي", "ما مات حتف أنفه"], "h": "راجع: ص400 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "يحرم كل ذي ناب من السباع وكل ذي مخلب من الطيور.", "a": true, "h": "راجع: ص399 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "يستحب الأكل متكئا.", "a": false, "h": "راجع: ص402 (المسألة السادسة)"}, {"t": "tf", "d": 2, "q": "من آداب الأكل التسمية في أوله والحمد في آخره.", "a": true, "h": "راجع: ص401 (المسألة السادسة)"}]}], "sum": [["تعريفها والأصل فيها", "ص394-403"], ["ما نص الشارع على حله، وإباحته", "ص394-403"], ["ما نص الشارع على تحريمه", "ص394-403"], ["ما سكت عنه الشارع", "ص394-403"]]}, {"id": "l101", "title": "الباب الثاني: أحكام الذبائح", "group": "الكتاب الثالث عشر: الأطعمة والذبائح والصيد", "map": {"center": "الباب الثاني\nالأطعمة والذبائح", "nodes": [{"t": "معناها، وأنواع التذكية، وحكمها", "s": []}, {"t": "شروط صحة الذبح", "s": []}, {"t": "آداب الذبح", "s": []}, {"t": "مكروهات الذبح", "s": []}, {"t": "حكم ذبائح أهل الكتاب", "s": []}]}, "paras": [{"t": "الباب الثاني: أحكام الذبائح", "b": [{"pic": ["scroll", "book"], "cap": "ص403-408"}, {"story": ["المسألة الأولى: معناها، وأنواع التذكية، وحكمها", ["1- تعريف الذبائح:", "لغة: الذبائح جمع ذبيحة، بمعنى مذبوحة.", "وشرعا: الحيوان الذي تمت تذكيته على وجه شرعي. والتذكية: هي ذبح - أو نحر - الحيوان البري المأكول المقدور عليه، بقطع حلقومه ومريئه، أو عقر الممتنع غير المقدور عليه منها. والعقر معناه: الجرح.", "2- أنواع التذكية: وحيث إن الذبح يراد به الحيوان الذي تمت تذكيته على الوجه الشرعي؛ فإنه من المناسب بيان أنواع التذكية التي تبيح أكل الحيوان.", "وهي تنقسم إلى ثلاثة أقسام، كما يتضح من التعريف السالف للتذكية:", "أولا: الذبح: وهو قطع الحلق من الحيوان بشروط.", "ثانيا: النحر: وهو قطع لبة الحيوان، وهي أسفل العنق، وهو التذكية المسنونة للإبل؛ لقوله تعالى: ﴿فصل لربك وانحر﴾ [الكوثر: 2].", "ثالثا: العقر: وهو قتل الحيوان غير المقدور عليه من الصيد والأنعام، بجرحه في غير الحلق واللبة في أي مكان من جسمه؛ لحديث رافع رضي الله عنه قال: ند بعير، فأهوى إليه رجل بسهم فحبسه، فقال رسول الله ﷺ: «ما ند عليكم فاصنعوا به هكذا».", {"note": "حاشية (ص404): ند: نفر وذهب على وجهه شاردا."}, "3- حكم التذكية: حكم تذكية الحيوان المقدور عليها أنها لازمة، لا يحل شيء من الحيوان المذكور عليها بدونها، وذلك بلا خلاف بين أهل العلم؛ لقوله تعالى: ﴿حرمت عليكم الميتة﴾ [المائدة: 3]، وغير المذكى ميتة، إلا السمك والجراد، وكل مالا يعيش إلا في الماء، فيحل بدون ذكاة، كما مضى بيانه في الأطعمة."]], "ic": "scroll"}, {"story": ["المسألة الثانية: شروط صحة الذبح", ["تنقسم هذه الشروط إلى أقسام ثلاثة:", "1- شروط تتعلق بالذابح.", "2- شروط تتعلق بالمذبوح.", "3- شروط تتعلق بآلة الذبح.", "أولا: الشروط المتعلقة بالذابح:", "1- أهلية الذابح: بأن يكون الذابح عاقلا مميزا، سواء أكان ذكرا أم أنثى، مسلما أم كتابيا. قال تعالى: ﴿إلا ما ذكيتم﴾ [المائدة: 3]، وهذه الآية في ذبيحة المسلم. وقال تعالى: ﴿وطعام الذين أوتوا الكتاب حل لكم﴾ [المائدة: 5] وهذه الآية في ذبيحة الكتابي، قال ابن عباس: «طعامهم: ذبائحهم». أما سائر الكفار من غير أهل الكتاب، وكذا المجنون، والسكران، والصبي غير المميز، فلا تحل ذبائحهم.", {"note": "حاشية (ص404): رواه البخاري معلقا، ووصله البيهقي."}, "2- ألا يذبح لغير الله عز وجل أو على غير اسمه، فلو ذبح لصنم أو مسلم أو نبي لم تحل؛ لقوله تعالى عند ذكر المحرم من الأطعمة: ﴿وما أهل لغير الله به﴾ [المائدة: 3]", "فإذا توافر هذان الشرطان في الذابح حلت ذبيحته، لا فرق في الذابح بين أن يكون رجلا أو امرأة، كبيرا أو صغيرا، حرا أو عبدا.", "ثانيا: الشروط المتعلقة بالمذبوح:", "1- أن يقطع من الحيوان الحلقوم، والمريء، والودجين. والحلقوم هو مجرى النفس. والمريء هو مجرى الطعام. والودجان هما العرقان المتقابلان المحيطان بالحلقوم؛ لحديث رافع بن خديج رضي الله عنه قال: قال رسول الله ﷺ: «ما أنهر الدم، وذكر اسم الله عليه فكلوه، ليس السن والظفر». فقد اشترط في الذبح أن يسيل الدم. والذبح بقطع الأشياء المشار إليها من الحيوان. وفي هذا المحل خاصة أسرع في إسالة دمه وزهوق روحه، فيكون أطيب للحم، وأخف وأيسر على الحيوان. وما أصابه سبب الموت كالمنخنقة والموقوذة والمتردية والنطيحة وما أكل السبع، وكذا المريضة، وما وقع في شبكة، أو أنقذه من مهلكة، إذا أدركه وفيه حياة مستقرة - كتحريك يده، أو رجله، أو طرف عينيه - فذكاة فهو حلال؛ لقوله تعالى: ﴿إلا ما ذكيتم﴾ [المائدة: 3] أي: فليس بحرام.", "وأما ما عجز عن ذبحه في المحل المذكور، لعدم التمكن منه، كالصيد، والنعم المتوحشة، والواقع في بئر ونحو ذلك، فذكاته بجرحه في أي موضع من بدنه فيكون ذلك ذكاة له؛ لحديث رافع بن خديج المتقدم في البعير الذي ند وشرد فأصابه رجل بسهم، فأوقفه، فقال النبي ﷺ: «ما ند عليكم فاصنعوا به هكذا».", "2- أن يذكر اسم الله عز وجل عند الذبح؛ لقوله تعالى: ﴿ولا تأكلوا مما لم يذكر اسم الله عليه وإنه لفسق﴾ [الأنعام: 121]، ويسن أن يكبر مع التسمية؛ لما روي عنه ﷺ في الأضحية أنه لما ذبحها «سمى وكبر». وفي رواية: أنه كان يقول: «باسم الله، والله أكبر».", "ثالثا: الشرط المتعلق بآلة الذبح:", "أن تكون الآلة مما يجرح بحده من حديد ونحاس وحجر، وغير ذلك مما يقطع الحلقوم، وينهر الدم، عدا السن والظفر؛ لحديث رافع رضي الله عنه أن رسول الله ﷺ قال: «ما أنهر الدم، وذكر اسم الله عليه فكلوه، ليس السن والظفر».", "ويدخل في حكم السن والظفر في المنع سائر أنواع العظام، سواء أكانت من آدمي أم غيره.", "وسبب المنع من ذلك ما ذكر في الحديث، وتمامه: «وسأحدثكم عن ذلك: أما السن فعظم، وأما الظفر فمدى الحبشة».", "أما النهي عن الذبح بالعظام: فلأنها تنجس بالدم، وقد نهى النبي ﷺ عن تنجيسها؛ لأنها زاد إخواننا من الجن.", "وأما الظفر: فللنهي عن التشبه بالكفار."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: آداب الذبح", ["للذبح آداب ينبغي للذابح التقيد بها، وهي:", "1- أن يحد الذابح شفرته؛ لحديث شداد بن أوس رضي الله عنه أن رسول الله ﷺ قال: «إن الله كتب الإحسان على كل شيء، فإذا قتلتم فأحسنوا القتلة، وإذا ذبحتم فأحسنوا الذبحة، وليحد أحدكم شفرته، وليرح ذبيحته».", "2- أن يضجع الدابة لجنبها الأيسر، ويترك رجلها اليمنى تتحرك بعد الذبح؛ لتستريح بتحريكها؛ لحديث شداد بن أوس المتقدم قبل قليل. ولحديث أبي الخير أن رجلا من الأنصار حدثه عن رسول الله ﷺ أنه أضجع أضحيته ليذبحها، فقال رسول الله ﷺ للرجل: «أعني على ضحيتي» فأعانه.", "3- نحر الإبل قائمة معقولة ركبتها اليسرى. والنحر: الطعن بمحدد في اللبة، وهي الوهدة التي بين أصل العنق والصدر؛ لقوله تعالى: ﴿فاذكروا اسم الله عليها صواف﴾ [الحج: 36] أي: «قياما من ثلاث». ومر ابن عمر رضي الله عنه على رجل قد أناخ بدنته لينحرها، فقال: «ابعثها قياما مقيدة سنة محمد ﷺ».", "4- ذبح سائر الحيوان غير الإبل: لقوله تعالى: ﴿إن الله يأمركم أن تذبحوا بقرة﴾ [البقرة: 67]، ولحديث أنس «أن النبي ﷺ ذبح الكبشين اللذين ضحى بهما»."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: مكروهات الذبح", ["1- يكره الذبح بآلة كالة - أي: غير قاطعة -؛ لأن ذلك تعذيب للحيوان؛ لحديث شداد بن أوس الماضي، وفيه: «وليحد أحدكم شفرته، وليرح ذبيحته». ولحديث ابن عمر رضي الله عنه: «أن رسول الله ﷺ أمر أن تحد الشفار وأن توارى عن البهائم».", "2- يكره كسر عنق الحيوان أو سلخه قبل زهوق روحه؛ لحديث شداد بن أوس رضي الله عنه: «وإذا ذبحتم فأحسنوا الذبحة»، ولقول عمر رضي الله عنه: «لا تعجلوا الأنفس أن تزهق».", "3- يكره حد السكين والحيوان يبصره؛ لحديث ابن عمر السابق وفيه: «وأن توارى عن البهائم»."]], "ic": "scroll"}, {"story": ["المسألة الخامسة: حكم ذبائح أهل الكتاب", ["تحل ذبائح أهل الكتاب من اليهود والنصارى؛ لقوله تعالى: ﴿وطعام الذين أوتوا الكتاب حل لكم﴾ [المائدة: 5]، أي: ذبائح أهل الكتاب من اليهود والنصارى حل لكم أيها المسلمون. قال ابن عباس رضي الله عنه: «طعامهم: ذبائحهم».", "فذبائح أهل الكتاب من اليهود والنصارى حلال بإجماع المسلمين؛ لأنهم يعتقدون تحريم الذبح لغير الله، وتحريم الميتات، بخلاف غيرهم من الكفار من عبدة الأوثان والزنادقة والمرتدين والمجوس، فإنه لا تحل ذبائحهم، وكذا المشركون شركا أكبر، من عباد القبور والأضرحة ونحوهم."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "ما معنى الذبائح لغة؟", "o": ["جمع ذبيحة، بمعنى مذبوحة", "جمع صيد", "جمع طعام", "جمع آلة"], "h": "راجع: ص403 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "ما النحر؟", "o": ["قطع لبة الحيوان، وهي أسفل العنق", "قطع الحلقوم فقط", "جرح الحيوان في أي مكان", "ذبح الحيوان بالسن"], "h": "راجع: ص404 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "ما الذي يجب قطعه في الذبح؟", "o": ["الحلقوم والمريء والودجان", "الحلقوم فقط", "المريء فقط", "الودجان فقط"], "h": "راجع: ص405 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "ما الذي لا يجوز الذبح به؟", "o": ["السن والظفر", "الحديد", "الحجر", "النحاس"], "h": "راجع: ص406 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "كيف تنحر الإبل؟", "o": ["قائمة معقولة ركبتها اليسرى", "مضجعة على جنبها الأيسر", "مضجعة على جنبها الأيمن", "جالسة"], "h": "راجع: ص407 (المسألة الثالثة)"}, {"t": "tf", "d": 1, "q": "يشترط أن يذكر اسم الله عند الذبح.", "a": true, "h": "راجع: ص406 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "تحل ذبائح أهل الكتاب من اليهود والنصارى.", "a": true, "h": "راجع: ص408 (المسألة الخامسة)"}, {"t": "tf", "d": 2, "q": "تحل ذبائح المجوس.", "a": false, "h": "راجع: ص408 (المسألة الخامسة)"}]}], "sum": [["معناها، وأنواع التذكية، وحكمها", "ص403-408"], ["شروط صحة الذبح", "ص403-408"], ["آداب الذبح", "ص403-408"], ["مكروهات الذبح", "ص403-408"]]}, {"id": "l102", "title": "الباب الثالث: أحكام الصيد", "group": "الكتاب الثالث عشر: الأطعمة والذبائح والصيد", "map": {"center": "الباب الثالث\nالأطعمة والذبائح", "nodes": [{"t": "في تعريف الصيد، وحكمه، ودليل مشروع", "s": []}, {"t": "الصيد المباح وغير المباح", "s": []}, {"t": "شروط إباحة الصيد", "s": []}]}, "paras": [{"t": "الباب الثالث: أحكام الصيد", "b": [{"pic": ["scroll", "book"], "cap": "ص408-412"}, {"story": ["المسألة الأولى: في تعريف الصيد، وحكمه، ودليل مشروعيته", ["1- تعريف الصيد:", "الصيد لغة: مصدر صاد يصيد صيدا أي: قنصه، وأخذه خلسة وحيلة، سواء أكان مأكولا أم غير مأكول. وأطلق على المصيد، تسمية للمفعول باسم المصدر، فيقال للحيوان المصيد: صيد.", "وشرعا: اقتناص حيوان حلال متوحش طبعا، غير مملوك، ولا مقدور عليه.", "والوحش: هو كل حيوان غير مستأنس من دواب البر.", "2- مشروعية الصيد:", "الصيد مشروع مباح؛ لقوله تعالى: ﴿أحلت لكم بهيمة الأنعام إلا ما يتلى عليكم غير محلي الصيد وأنتم حرم﴾ [المائدة: 1].", "وقوله تعالى: ﴿وإذا حللتم فاصطادوا﴾ [المائدة: 2].", "ولحديث عدي بن حاتم رضي الله عنه أن النبي ﷺ قال: «إذا أرسلت كلبك المعلم، وذكرت اسم الله عليه فكل».", "هذا إن كان الصيد لحاجة الإنسان، أما إن كان لمجرد اللعب واللهو، فهو مكروه؛ لكونه من العبث، ولنهيه ﷺ أن تصبر البهائم. أي: تتخذ غرضا للرمي."]], "ic": "scroll"}, {"story": ["المسألة الثانية: الصيد المباح وغير المباح", ["الصيد كله مباح بحريه وبريه إلا في حالات:", "الحالة الأولى: يحرم صيد الحرم للمحرم وغيره، وذلك بالإجماع، لقوله ﷺ يوم فتح مكة: «إن هذا البلد حرمه الله يوم خلق السموات والأرض... لا يعضد شوكه، ولا ينفر صيده». قال الحافظ ابن حجر: «قيل: هو كناية عن الاصطياد». قال العلماء: يستفاد من النهي عن التنفير تحريم الإتلاف بالأولى.", "الحالة الثانية: يحرم على المحرم صيد البر، أو اصطياده، أو الإعانة على صيده بدلالة أو إشارة أو نحو ذلك؛ لقوله تعالى: ﴿يا أيها الذين آمنوا لا تقتلوا الصيد وأنتم حرم﴾ [المائدة: 95].", "وكذلك يحرم عليه الأكل مما صاده، أو صيد لأجله، أو أعان على صيده، لقوله تعالى: ﴿وحرم عليكم صيد البر ما دمتم حرما﴾ [المائدة: 96]. وقد رد النبي ﷺ حمارا وحشيا أهداه إليه الصعب بن جثامة، وقال: «إنا لم نرده عليك إلا أنا حرم». يعني: من أجل أنا حرم."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: شروط إباحة الصيد", ["يشترط لحل الصيد وإباحته شروط، وذلك في الصائد، وآلة الصيد.", "أولا: شروط الصائد:", "يشترط في الصائد الذي يحل صيده ما يشترط في الذابح بأن يكون مسلما أو كتابيا، عاقلا، فلا يحل ما صاده مجنون أو سكران، ولا يحل ما صاده مجوسي أو وثني أو مرتد؛ لأن الصائد بمنزلة المذكي. أما ما لا يحتاج إلى ذكاة كالحوت والجراد، فيباح إذا صاده من لا تحل ذبيحته. وأن يكون الصائد قاصدا للصيد؛ لأن الرمي بالآلة وإرسال الجارحة جعل بمنزلة الذبح، فاشترط له القصد.", "ثانيا: شروط آلة الصيد:", "الآلة نوعان:", "1- ما له حد يجرح؛ كالسيف والسكين والسهم: وهذا يشترط فيه ما يشترط في آلة الذبح بأن ينهر الدم، ويكون غير سن وظفر، وأن يجرح الصيد بحده لا بثقله؛ لحديث رافع بن خديج رضي الله عنه قال: قال رسول الله ﷺ: «ما أنهر الدم، وذكر اسم الله عليه فكلوه».", "وسئل رسول الله ﷺ عن صيد المعراض فقال: «ما خزق فكل، وما قتل بعرضه فلا تأكل». وفي معنى المعراض: الحجارة، والعصا، والفخ، وقطع الحديد ونحوه مما ليس محددا، إلا الرصاص الذي يستعمل اليوم في البنادق، فإنه حلال صيده؛ لأن به قوة دفع تخزق، وتنهر الدم.", {"note": "حاشية (ص411): المعراض: سهم بلا ريش ولا نصل، وإنما يصيب بعرضه دون حده. وخزق السهم الرمية: طعنها ونفذ فيها."}, "2- الجارحة من سباع البهائم أو جوارح الطير: فيجوز الصيد بسباع البهائم التي تصيد بنابها وجوارح الطير التي تصيد بمخلبها؛ لقوله تعالى: ﴿وما علمتم من الجوارح مكلبين تعلمونهن مما علمكم الله فكلوا مما أمسكن عليكم واذكروا اسم الله عليه﴾ [المائدة: 4]. ومثال سباع البهائم: الكلب، الفهد، النمر. ومثال جوارح الطير: الصقر، الباز، الشاهين.", "شروط الاصطياد بسباع البهائم وجوارح الطير:", "يشترط في الاصطياد بسباع البهائم وجوارح الطير أن تكون معلمة، أي: أنها تعلم آداب أخذ الصيد؛ وذلك بأن تتصف بالصفات التالية:", "1- أن تقصد إلى الحيوان الذي يراد صيده إذا أرسلت إليه، ولا تقصد شيئا غيره.", "2- أن تنزجر إذا زجرت، فتتوقف إذا استوقفها صاحبها. وهذان الشرطان معتبران في الكلب خاصة؛ لأن الفهد لا يكاد يجيب داعيا، وإن اعتبر متعلما.", "أما الطير: فتعليمها يعتبر بأمرين كذلك: أن تسترسل إذا أرسلت، وأن ترجع إذا دعيت.", "3- ألا تأكل شيئا من الصيد إذا قتلته، قبل أن تصل به إلى صاحبها الذي أرسلها.", "والأصل في اعتبار هذه الشروط قوله تعالى: ﴿قل أحل لكم الطيبات وما علمتم من الجوارح مكلبين تعلمونهن مما علمكم الله فكلوا مما أمسكن عليكم﴾ [المائدة: 4].\"", "وحديث عدي بن حاتم رضي الله عنه، عن النبي ﷺ، قال: «إذا أرسلت الكلب المعلم، وسميت، فأمسك، وقتل، فكل، وإن أكل فلا تأكل، فإنما أمسك على نفسه».", "التسمية عند رمي الصيد:", "ومن الشروط أيضا: التسمية عند رمي الصيد أو إرسال الجارحة؛ لقوله تعالى: ﴿فكلوا مما أمسكن عليكم واذكروا اسم الله عليه﴾ [المائدة: 4]، ولحديث عدي بن حاتم رضي الله عنه مرفوعا: «إذا أرسلت كلبك فاذكر اسم الله عليه... وإن رميت سهمك فاذكر اسم الله عليه». وفي لفظ: «إذا أرسلت كلبك المعلم، وذكرت اسم الله عليه فكل». فإن ترك التسمية سهوا حل الصيد. والله أعلم.", "حكم إدراك الصيد حيا:", "إذا أدرك الصائد الصيد وفيه حياة مستقرة، فإنه يجب ذكاته، ولا يحل بدونها، أما إذا أدركه ولا حياة فيه مستقرة، فإنه يجوز أكله بدون ذكاة."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "ما الصيد شرعا؟", "o": ["اقتناص حيوان حلال متوحش طبعا، غير مملوك، ولا مقدور عليه", "ذبح الأنعام", "أكل الحيوان البحري", "اتخاذ الحيوان غرضا للرمي"], "h": "راجع: ص409 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "ما حكم الصيد لمجرد اللعب واللهو؟", "o": ["مكروه", "واجب", "حرام", "مستحب"], "h": "راجع: ص409 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "من الحالات التي يحرم فيها الصيد:", "o": ["صيد الحرم للمحرم وغيره", "صيد البحر", "صيد الطير", "صيد الجراد"], "h": "راجع: ص409 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "ما شرط الجارحة التي يصاد بها؟", "o": ["أن تكون معلمة", "أن تكون صغيرة", "أن تأكل من الصيد", "أن تكون بيضاء"], "h": "راجع: ص411 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "لا يحل ما صاده مجوسي أو وثني أو مرتد.", "a": true, "h": "راجع: ص410 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "إذا أدرك الصائد الصيد وفيه حياة مستقرة فإنه يجب ذكاته.", "a": true, "h": "راجع: ص412 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "إن ترك التسمية سهوا حل الصيد.", "a": true, "h": "راجع: ص412 (المسألة الثالثة)"}]}], "sum": [["في تعريف الصيد، وحكمه، ودليل مشروع", "ص408-412"], ["الصيد المباح وغير المباح", "ص408-412"], ["شروط إباحة الصيد", "ص408-412"]]}, {"id": "l103", "title": "الباب الأول: في القضاء", "group": "الكتاب الرابع عشر: القضاء والشهادات", "map": {"center": "الباب الأول\nالقضاء والشهادات", "nodes": [{"t": "في تعريف القضاء، وحكمه، وأدلة مشرو", "s": []}, {"t": "شروط القاضي", "s": []}, {"t": "آداب القاضي وأخلاقه، وما ينبغي له ", "s": []}, {"t": "طريق الحكم وصفته", "s": []}]}, "paras": [{"t": "الباب الأول: في القضاء", "b": [{"pic": ["scroll", "book"], "cap": "ص413-417"}, {"story": ["المسألة الأولى: في تعريف القضاء، وحكمه، وأدلة مشروعيته", ["1- تعريفه: القضاء في اللغة: الحكم والفصل. وإحكام الشيء والفراغ منه، يقال: قضى يقضي قضاء إذا حكم وفصل.", "وفي الاصطلاح: تبيين الحكم الشرعي، والإلزام به، وفصل الخصومات، وقطع المنازعات.", "وسمي القضاء حكما لما فيه من منع الظالم، مأخوذ من الحكمة التي توجب وضع الشيء في موضعه.", "2- حكمه والحكمة منه: القضاء فرض على الكفاية إذا قام به من يكفي سقط الإثم عن الباقين، وإن امتنع كل الصالحين عنه أثموا؛ لأن الناس لا يستقيم أمرهم بدونه، وهو من القرب العظيمة، ففيه نصرة المظلوم، وإقامة الحدود، وإعطاء كل مستحق حقه، والإصلاح بين الناس، وقطع المخاصمات والمنازعات؛ ليستتب الأمن، ويقل الفساد.", "لذا يجب على الإمام تعيين القضاة حسب ما تقتضيه الحاجة والمصلحة؛ لئلا تضيع الحقوق ويعم الظلم؛ وفيه فضيلة عظيمة، وأجر كبير لمن دخل فيه، وقام بحقه، وهو من أهله، وفيه إثم عظيم لمن دخل فيه ولم يؤد حقه ولم يكن من أهله.", "3- أدلة مشروعيته: الأصل فيه الكتاب، والسنة، والإجماع.", "فدليل مشروعيته من الكتاب قوله تعالى: ﴿يا داود إنا جعلناك خليفة في الأرض فاحكم بين الناس بالحق﴾ [ص: 26].", "ومن السنة قوله ﷺ: «إذا حكم الحاكم فاجتهد ثم أصاب فله أجران، وإذا حكم واجتهد ثم أخطأ فله أجر».", "وقد تولى النبي ﷺ منصب القضاء، ونصب القضاة، وكذلك فعل أصحابه من بعده، والسلف الصالح.", "أما الإجماع: فقد أجمع المسلمون على مشروعية نصب القضاة، والحكم بين الناس."]], "ic": "scroll"}, {"story": ["المسألة الثانية: شروط القاضي", ["يشترط فيمن يتولى القضاء الشروط الآتية:", "1- أن يكون مسلما؛ لأن الإسلام شرط للعدالة، والكافر ليس بعدل، كما أن تولي الكافر القضاء رفعة له، والمطلوب إذلاله.", "2- أن يكون مكلفا - أي: بالغا عاقلا -؛ لأن الصبي والمجنون غير مكلفين، وتحت ولاية غيرهما.", "3- الحرية؛ لأن الرقيق مشغول بحقوق سيده وليس له ولاية، فليس أهلا للقضاء، كالمرأة.", "4- الذكورة: فلا تتولى المرأة القضاء؛ لأنها ليست من أهل الولاية، قال النبي ﷺ: «لن يفلح قوم ولوا أمرهم امرأة».", "5- العدالة: فلا يولى الفاسق؛ لقوله تعالى: ﴿يا أيها الذين آمنوا إن جاءكم فاسق بنبأ فتبينوا﴾ [الحجرات: 6]. فإذا كان لا يقبل خبره، فعدم قبول حكمه من باب أولى.", "6- السلامة من العاهات المزمنة كالصمم والعمى والخرس؛ لأنه لا يتمكن مع هذه العاهات من الفصل بين الخصوم، وفي اشتراط البصر نظر.", "7- أن يكون عالما بالأحكام الشرعية التي ولي للقضاء بها ولو في مذهبه الذي يقلد فيه إماما من الأئمة."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: آداب القاضي وأخلاقه، وما ينبغي له وما لا ينبغي", ["1- ينبغي أن يكون القاضي قويا ذا هيبة من غير تكبر ولا عنف؛ لينا من غير ضعف؛ لئلا يطمع القوي في باطله، وييئس الضعيف من عدله.", "2- أن يكون حليما متأنيا؛ لئلا يغضب من كلام الخصم فيمنعه الحكم.", "3- أن يكون فطنة ويقظة، لا يؤتى من غفلة ولا يخدع لغرة.", "4- ينبغي أن يكون القاضي عفيفا ورعا، نزيها عما حرم الله.", "5- أن يكون قنوعا صدوقا، ذا رأي ومشورة.", "قال علي رضي الله عنه: «لا ينبغي أن يكون القاضي قاضيا حتى تكون فيه خمس خصال: عفيف، حليم، عالم بما كان قبله، يستشير ذوي الألباب، لا يخاف في الله لومة لائم».", "6- يحرم على القاضي أن يسار أحد الخصمين، أو يحابي أحدهما، أو يلقنه حجته، أو يعلمه كيف يدعي.", "7- يحرم على القاضي أن يقضي وهو غضبان غضبا شديدا؛ لقوله ﷺ: «لا يقضي حاكم بين اثنين وهو غضبان». ويقاس على الغضب كل ما يشوش على الفكر من المشكلات والهموم، والجوع والعطش والتعب، والمرض وغيرها.", "8- يحرم على القاضي قبول الرشوة؛ لحديث أبي هريرة رضي الله عنه، قال: قال رسول الله ﷺ: «لعن الله الراشي والمرتشي في الحكم»، فالرشوة تمنعه من الحكم بالحق لصاحبه أو تجعله يحكم بالباطل للمبطل، وكلاهما شر عظيم.", "9- يحرم على القاضي قبول الهدايا من الخصمين أو من أحدهما، ومن كانت له عادة من قبل القضاء فلا بأس، بشرط ألا يكون لهذا المهدي خصومة يحكم له فيها. ولو تورع عن ذلك كله لكان أفضل له. فالقاضي ينبغي له ألا ينزه نفسه عن جميع ما يؤثر في قضائه وسمعته، حتى البيع والشراء لا ينبغي له أن يبيع ويشتري بنفسه ممن يعرفه، خشية المحاباة؛ فإن المحاباة في البيع والشراء كالهدية. وإنما يتعاطى البيع والشراء بوكيل لا يعرف أنه له.", "10- لا يجوز للقاضي أن يقضي لنفسه ولا لقرابته، ممن لا تقبل شهادته له، ولا يحكم على عدوه؛ لقيام التهمة في هذه الأحوال.", "11- لا يحكم القاضي بعلمه؛ لأن ذلك يفضي إلى تهمته.", "12- يستحب للقاضي أن يتخذ كاتبا يكتب له الوقائع، وغيره ممن يحتاجه لمساعدته، كالحاجب والمزكي والمترجم وغيرهم، لكثرة انشغاله بأمور الناس فيحتاج من يساعده.", "13- يتعين على القاضي أن يحكم بما في كتاب الله وسنة رسول الله ﷺ، فإن لم يجد قضى بالإجماع، فإن لم يجد وكان من أهل الاجتهاد اجتهد، وإن لم يكن من أهل الاجتهاد فلعله أن يستفتي في ذلك فيأخذ بفتوى المفتي.", "14- يجب على القاضي العدل بين الخصمين في كل شيء، كتب عمر رضي الله عنه إلى أبي موسى: «واس بين الناس في وجهك، ومجلسك، وعدلك؛ حتى لا ييئس الضعيف من عدلك، ولا يطمع الشريف في حيفك»."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: طريق الحكم وصفته", ["يتوصل القاضي إلى الحكم في قضية ما باتباع الخطوات التالية:", "- إذا حضر عنده الخصمان أجلسهما بين يديه، وسألهما: أيكما المدعي؟ أو يسكت حتى يتكلم المدعي فيستمع دعواه.", "- فإن جاءت الدعوى على الوجه الصحيح، سأل القاضي المدعى عليه عن موقفها حيالها، فإن أقر بها قضى عليه، وإن أنكر طالب المدعي بالبينة.", "- فإن كانت للمدعي بينة طالبه بإحضارها، واستمع شهادتها، وحكم بها بشروطها، ولا يحكم بعلمه.", "- فإن لم يكن للمدعي بينة أعلمه القاضي أن اليمين على خصمه؛ لقوله ﷺ للحضرمي الذي ادعى أرضا غلبه عليها الكندي: «ألك بينة؟» قال: لا. قال: «فلك يمينه»، ولقوله ﷺ: «البينة على المدعي، واليمين على المدعى عليه».", "- فإن قبل المدعي يمين المدعى عليه حلفه القاضي وخلى سبيله؛ لأن الأصل براءة الذمة.", "- فإن نكل المدعى عليه عن اليمين وأبى أن يحلف، قضى عليه الحاكم بالنكول، فالنكول - يعني: الامتناع - قرينة ظاهرة دالة على صدق المدعي، وقد حكم بالنكول عثمان رضي الله عنه وجماعة من أهل العلم.", "وذهب جماعة آخرون إلى أن اليمين ترد على المدعي إذا نكل المدعى عليه، فيحلف، ويستحق، ولا سيما إذا قوي جانبه.", "- فإذا حلف المدعى عليه وخلى الحاكم سبيله، فأحضر المدعي بينة بعد ذلك حكم له بها؛ لأن يمين المنكر لا تزيل الحق، وإنما هي مزيلة للخصومة."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "ما معنى القضاء في اللغة؟", "o": ["الحكم والفصل", "الشهادة", "اليمين", "البينة"], "h": "راجع: ص413 (المسألة الأولى)"}, {"t": "mcq", "d": 1, "q": "ما حكم القضاء؟", "o": ["فرض على الكفاية", "فرض عين", "سنة", "مباح"], "h": "راجع: ص413 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "أي هذه ليست من شروط القاضي؟", "o": ["أن يكون غنيا", "أن يكون مسلما", "أن يكون عاقلا بالغا", "أن يكون عدلا"], "h": "راجع: ص414 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "على من تكون البينة؟", "o": ["على المدعي", "على المدعى عليه", "على القاضي", "على الشاهد"], "h": "راجع: ص417 (المسألة الرابعة)"}, {"t": "tf", "d": 2, "q": "يحرم على القاضي أن يقضي وهو غضبان غضبا شديدا.", "a": true, "h": "راجع: ص415 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "يجوز للقاضي قبول الرشوة.", "a": false, "h": "راجع: ص415 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "يحكم القاضي بعلمه.", "a": false, "h": "راجع: ص416 (المسألة الثالثة)"}]}], "sum": [["في تعريف القضاء، وحكمه، وأدلة مشرو", "ص413-417"], ["شروط القاضي", "ص413-417"], ["آداب القاضي وأخلاقه، وما ينبغي له ", "ص413-417"], ["طريق الحكم وصفته", "ص413-417"]]}, {"id": "l104", "title": "الباب الثاني: في الشهادات", "group": "الكتاب الرابع عشر: القضاء والشهادات", "map": {"center": "الباب الثاني\nالقضاء والشهادات", "nodes": [{"t": "في تعريفها، وحكمها، وأدلتها", "s": []}, {"t": "شروط الشاهد الذي تقبل شهادته", "s": []}, {"t": "الأحكام المتعلقة بالشهادة", "s": []}]}, "paras": [{"t": "الباب الثاني: في الشهادات", "b": [{"pic": ["scroll", "book"], "cap": "ص418-423"}, {"story": ["المسألة الأولى: في تعريفها، وحكمها، وأدلتها", ["1- تعريفها: الشهادة في اللغة: هي الخبر القاطع، مشتقة من المشاهدة؛ لأن الشاهد يخبر عما شاهده وعاينه.", "والمراد بها عند الفقهاء: الإخبار بحق للغير على الغير في مجلس القضاء.", "أو: هي الإخبار بما علمه الشاهد بلفظ خاص، وهو: أشهد أو شهدت، أو ما يقوم مقامهما.", "2- حكمها: تحمل الشهادة في غير حق الله تعالى - يعني في حق الآدميين - فرض على الكفاية، إذا وجد من يقوم بذلك كفى عن الآخرين لحصول الغرض، وإن لم يوجد إلا من يكفي تعين عليه؛ لقوله تعالى: ﴿ولا يأب الشهداء إذا ما دعوا﴾ [البقرة: 282].", "وأما أداؤها وإثباتها عند الحاكم: ففرض عين على من تحملها متى دعي إلى أدائها؛ لقوله تعالى: ﴿ولا تكتموا الشهادة ومن يكتمها فإنه آثم قلبه﴾ [البقرة: 283]، وهذا وعيد شديد لمن كتمها، فدل على فرضية أدائها على من تحملها، متى دعي إلى ذلك.", "ويشترط لوجوب تحملها وأدائها: انتفاء الضرر عن الشاهد، فإن كان يلحقه من ذلك ضرر في عرضه أو ماله أو نفسه أو أهله، فلا يجب عليه؛ لقوله ﷺ: «لا ضرر ولا ضرار».", "3- أدلة مشروعيتها: دل على مشروعية الشهادة الكتاب والسنة والإجماع.", "أما الكتاب فقوله تعالى: ﴿ولا يأب الشهداء إذا ما دعوا﴾ [البقرة: 282]، وقوله تعالى: ﴿وأقيموا الشهادة لله﴾ [الطلاق: 2]. وقوله تعالى: ﴿ولا تكتموا الشهادة ومن يكتمها فإنه آثم قلبه﴾ [البقرة: 283].", "وقوله تعالى: ﴿وأشهدوا ذوي عدل منكم﴾ [الطلاق: 2]. وقوله تعالى: ﴿واستشهدوا شهيدين من رجالكم فإن لم يكونا رجلين فرجل وامرأتان ممن ترضون من الشهداء﴾ [البقرة: 282].", "ومن السنة: حديث ابن مسعود رضي الله عنه أن النبي ﷺ قال: «شاهداك أو يمينه»، وحديث ابن عباس رضي الله عنه أن النبي ﷺ قال: «البينة على المدعي، واليمين على من أنكر».", "وقد أجمع العلماء على مشروعيتها؛ لإثبات الحقوق، ولأن الحاجة داعية إليها."]], "ic": "scroll"}, {"story": ["المسألة الثانية: شروط الشاهد الذي تقبل شهادته", ["يشترط فيمن تقبل شهادته الشروط التالية:", "1- الإسلام: فلا تقبل شهادة الكافر؛ لقوله تعالى: ﴿وأشهدوا ذوي عدل منكم﴾ [الطلاق: 2]، وقوله عز وجل: ﴿ممن ترضون من الشهداء﴾ [البقرة: 282] والكافر ليس بعدل ولا مرضي، وتقبل شهادة الكفار من أهل الكتاب في حال الوصية في السفر لأجل الضرورة، وذلك إذا لم يوجد غيرهم؛ لقوله تعالى: ﴿يا أيها الذين آمنوا شهادة بينكم إذا حضر أحدكم الموت حين الوصية اثنان ذوا عدل منكم أو آخران من غيركم إن أنتم ضربتم في الأرض فأصابتكم مصيبة الموت﴾ [المائدة: 106].", "قال ابن عباس وجماعة كثيرون في قوله: ﴿أو آخران من غيركم﴾: من غير المسلمين، يعني أهل الكتاب.", "2- البلوغ والعقل: فلا شهادة لصغير وإن اتصف بالعدالة؛ لأنه غير كامل العقل، فهو ناقص الأهلية. لكن تقبل شهادة الصبيان بعضهم على بعض في الجروح خاصة، وبخاصة قبل تفرقهم إذا اتفقت كلمتهم. وكذا لا تقبل شهادة المجنون والمعتوه والسكران؛ لأن شهادتهم لا تفيد اليقين الذي يحكم بمقتضاه.", "3- الكلام: فلا تقبل شهادة الأخرس، ولو فهمت إشارته؛ وإنما قبلت إشارته في الأحكام الخاصة به للضرورة. لكن لو أدى الشهادة بخطه كتابة قبلت؛ لدلالة الخط على الألفاظ.", "4- الحفظ والضبط واليقظة: فلا تقبل شهادة المغفل والمعروف بكثرة الخطإ والسهو؛ لعدم حصول الثقة بقوله؛ لاحتمال أن يكون ذلك من غلطه، لكن تقبل ممن يقل منه ذلك؛ لأنه لا يسلم منه أحد.", "5- العدالة: فلا تقبل شهادة الفاسق؛ لقوله تعالى: ﴿وأشهدوا ذوي عدل منكم﴾ [الطلاق: 2]، والعدل: هو المستقيم في دينه، الذي لم تظهر منه ريبة، ذو المروءة، المؤدي للواجبات والمستحبات، المجتنب للمحرمات والمكروهات."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: الأحكام المتعلقة بالشهادة", ["1- يجب على الشاهد أن يكون على علم بما يشهد به، فلا يجوز له أن يشهد بما لا يعلم، قال الله عز وجل: ﴿ولا تقف ما ليس لك به علم﴾ [الإسراء: 36]. وقال تعالى: ﴿إلا من شهد بالحق وهم يعلمون﴾ [الزخرف: 86] أي: على بصيرة وعلم.", "والعلم يحصل بالسماع أو بالرؤية أو بالشهرة والاستفاضة فيما لا يحصل إلا بها غالبا كالنسب والموت.", "2- لا تقبل شهادة الأب لابنه ولا العكس؛ لحصول التهمة، وكذلك أحد الزوجين لصاحبه. وتقبل الشهادة عليهم؛ فلو شهد على أبيه أو ابنه أو زوجته أو شهدت عليه قبلت؛ لعدم التهمة في ذلك، قال الله تعالى: ﴿يا أيها الذين آمنوا كونوا قوامين بالقسط شهداء لله ولو على أنفسكم أو الوالدين والأقربين﴾ [النساء: 135]", "3- لا تقبل شهادة العدو على عدوه، ولا من يجر إلى نفسه نفعا بها، أو يدفع بها ضررا عن نفسه، أما العداوة في الدين فلا تمنع من قبول الشهادة، فتقبل شهادة المسلم على الكافر، والسني على المبتدع.", "4- يجب على الشاهد أن يشهد بالحق ولو على أقرب الناس إليه ولا تجوز المحاباة، قال تعالى: ﴿يا أيها الذين آمنوا كونوا قوامين بالقسط شهداء لله ولو على أنفسكم أو الوالدين والأقربين﴾ [النساء: 135] أي: وإن كانت الشهادة على والديك وقرابتك، فلا تراعهم فيها، بل اشهد بالحق وإن عاد ضررها عليهم.", "5- تقبل الشهادة على الشهادة؛ لأن الحاجة تدعو إلى ذلك، ولكن يشترط تعذر شهود الأصل لمرض أو موت أو غيرهما، مع ثبوت عدالة شاهد الأصل والفرع معا.", "6- لا تقبل شهادة الزور، وهو الكذب، وهي من الكبائر لقوله تعالى: ﴿فاجتنبوا الرجس من الأوثان واجتنبوا قول الزور﴾ [الحج: 30].", "وقوله ﷺ: «ألا أنبئكم بأكبر الكبائر؟» قالوا: بلى يا رسول الله. قال: «الإشراك بالله، وعقوق الوالدين» - وجلس وكان متكئا فقال - «ألا وقول الزور»، فما زال يكررها حتى قلنا: ليته سكت، ولأن فيها رفعا للعدل وتحقيقا للجور والظلم.", "7- لا يجوز للشاهد أخذ الأجرة على أداء الشهادة، لكن لو عجز عن المشي إلى محل أداء الشهادة فله أخذ أجرة الركوب.", "8- عدد الشهود يختلف باختلاف المشهود به: فالزنى واللواط لا يقبل فيهما أقل من أربعة شهود من الرجال؛ لقوله تعالى: ﴿لولا جاءوا عليه بأربعة شهداء﴾ [النور: 13].", "أما بقية الحدود كالسرقة والقذف، وكذلك ما ليس بمال ولا يقصد به المال، وكان مما يطلع عليه الرجال في الغالب، كالنكاح والطلاق والرجعة والظهار والنسب والوكالة والوصية ونحو ذلك، فيقبل فيها شاهدان من الرجال. ولا تقبل فيه شهادة النساء؛ لقوله تعالى في الرجعة: ﴿وأشهدوا ذوي عدل منكم﴾ [الطلاق: 2]؛ فيقاس عليه سائر ما ذكر، فإنه ليس بمال ولا يقصد به المال، فأشبه العقوبات.", "أما المال وما يقصد به المال، كالبيع والإجارة والأجل والقرض والرهن والوديعة ونحو ذلك من العقود المالية، فيقبل فيه شهادة الرجلين أو الرجل والمرأتين؛ لقوله تعالى: ﴿واستشهدوا شهيدين من رجالكم فإن لم يكونا رجلين فرجل وامرأتان ممن ترضون من الشهداء﴾ [البقرة: 282].", "ويقبل أيضا في المال وما يقصد به المال شهادة رجل واحد ويمين المدعي لقضاء النبي ﷺ بها.", "أما ما لا يطلع عليه الرجال في الغالب كعيوب النساء المستورة والثيوبة والبكارة والولادة والرضاع واستهلال المولود ونحو ذلك فتقبل فيه شهادة النساء منفردات، ويكفي امرأة واحدة عدلة.", "ومن ادعى الفقر بعد أن كان غنيا، فيشترط لإثبات ذلك شهادة ثلاثة رجال؛ لقوله ﷺ في حديث قبيصة بن المخارق فيمن تحل له المسألة: «ورجل أصابته فاقة حتى يقوم ثلاثة من ذوي الحجا من قومه: لقد أصابت فلانا فاقة».", {"note": "حاشية (ص423): والحجا: العقل."}, "9- لا يشترط في أداء لفظ الشهادة أن يقول: (أشهد) أو (شهدت)، بل يكفي في ذلك قوله: رأيت كذا وكذا، أو سمعت، أو نحو ذلك؛ لعدم ورود ما يدل على اشتراط ذلك.", "وبعد، فهذا ما يسر الله - سبحانه - جمعه في هذا المختصر، نسأل الله أن يجعله خالصا لوجهه الكريم، وأن ينفع به عباده المؤمنين، وآخر دعوانا أن الحمد لله رب العالمين، وصلى الله وسلم وبارك على نبينا محمد وعلى آله وصحبه أجمعين."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "ما الشهادة في اللغة؟", "o": ["الخبر القاطع", "الحكم", "اليمين", "الدعوى"], "h": "راجع: ص418 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "ما حكم تحمل الشهادة في حقوق الآدميين؟", "o": ["فرض على الكفاية", "فرض عين دائما", "مباح", "محرم"], "h": "راجع: ص418 (المسألة الأ
