"cap": "ص٤٣٧ - ص٤٥٨"}, {"story": ["الباب الثالث في حقوق المسلم والرحم والجوار والملك وكيفية الم (١ من ١٦)، ص٤٣٧", ["**في حقوق المسلم والرحم والجوار والملك وكيفية المعاشرة مع من يدلي بهذه الأسباب**", "اعلم أنه لا بد للإنسان من مخالطة جنسه، فيتعين لذلك أدب المخالطة، وأدب الخليط على قدر حقه، وحقه على قدر الرابطة التي بها وقعت المخالطة، والرابطة إما القرابة، وهي أخصها، أو أخوة الإسلام، وهي أعمها، أو الجوار، أو صحبة السفر، أو الدرس، أو الصداقة والأخوة، ولكل واحدة من هذه الروابط درجات، فالقرابة لها حق، ولكن حق الرحم المحرم آكد، وللمحرم حق ولكن حق الوالدين آكد، وكذلك حق الجار يختلف بحسب قربه من الدار وبعده.", "ويتأكد حق المسلم بتأكد المعرفة، والتعلم آكد من حق صحبة السفر، وكذلك الصداقة تتفاوت فإنها إذا قويت صارت أخوة، فإن ازدادت صارت محبة، فإن ازدادت صارت خلة. والمحبة ما يتمكن من حبة القلب، والخلة ما يتخلل جميع أجزاء القلب، ولهذا قال عليه الصلاة والسلام: «لو كنت متخذا خليلا لاتخذت أبا بكر خليلا، ولكن صاحبكم خليل الله» يشير إلى أنه لم يكن يستوعب قلبه سوى حب الله عز وجل، وقد اتخذ عليا أخا فقال له: «أما ترضى أن تكون مني بمنزلة هارون من موسى إلا أنه لا نبي بعدي» فعدل بعلي عن النبوة، كما عدل بأبي بكر عن الخلة، فقد شارك أبو بكر عليا في الأخوة وزاد عليه بمقاربة الخلة وأهليته لها لو كان للشركة في الخلة مجال، وليس قبل المعرفة رابطة، ولا بعد الخلة درجة، وما سواهما من الدرجات بينهما.", "وقد ذكرنا حق الصحبة والأخوة، ويدخل فيه ما وراءهما من المحبة والخلة، وإنما تتفاوت الرتب في تلك الحقوق كما سبق بحسب تفاوت رتب الأخوة والمحبة حتى ينتهي أقصاها إلى أن يوجب الإيثار بالنفس والمال، كما آثر أبو بكر", "رسول الله ﷺ بالسلامة حين سد ثقب الغار برجله، وآثره طلحة بن عبيد الله حين وقاه بيده، وكان عمرو بن قميئة قد علا رسول الله ﷺ فضربه بالسيف على شقه الأيمن يوم أحد فاتقاه طلحة بيده فشلت يده.", "ونحن الآن نذكر حق أخوة الإسلام، وحق الرحم، وحق الوالدين، وحق الجوار، وحق الملك يعني: ملك اليمين فإن ملك النكاح قد تقدم في كتابه."]], "ic": "book"}, {"story": ["الباب الثالث في حقوق المسلم والرحم والجوار والملك وكيفية الم (٢ من ١٦)، ص٤٣٨", ["**حقوق المسلم:** يسلم عليه إذا لقيه، ويجيبه إذا دعاه، ويشمته إذا عطس، ويعوده إذا مرض ويشهد جنازته إذا مات، ويبر قسمه إذا أقسم عليه، وينصح له إذا استنصحه، ويحفظه بظهر الغيب إذا غاب، ويحب له ما يحب لنفسه، ويكره له ما يكره لنفسه، وجميع هذا منقول في الآثار، وقد أخبرنا هبة الله بن محمد قال: أخبرنا الحسن بن علي التميمي قال: أخبرنا أبو بكر بن مالك قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا محمد بن مصعب قال: حدثنا الأوزاعي عن الزهري عن سعيد بن المسيب عن أبي هريرة قال: سمعت رسول الله ﷺ يقول: «حق المسلم على المسلم خمس: يسلم عليه إذا لقيه، ويشمته إذا عطس، ويعوده إذا مرض، ويشهد(١) جنازته إذا مات، ويجيبه إذا دعاه» أخرجاه في الصحيحين، ورواه مسلم في أفراده فقال فيه: «حق المسلم على المسلم ست فزاد: وإذا استنصحك فانصح له».", "ومن الحقوق العامة أن يحب للمسلمين كافة ما يحب لنفسه، ويكره لهم ما يكره لنفسه؛ لأن المسلمين كالجسد الواحد، وفي الصحيحين من حديث النعمان بن بشير عن النبي ﷺ أنه قال: «مثل المؤمنين في توادهم وتراحمهم وتعاطفهم مثل الجسد إذا اشتكى منه عضو تداعى له سائر الجسد بالسهر والحمى». وفي الصحيحين من حديث أنس عن النبي ﷺ أنه قال: «والذي نفسي بيده، لا يؤمن عبد حتى يحب لأخيه ما يحب لنفسه». وفيهما من حديث أبي موسى عن النبي ﷺ أنه قال: «المؤمن للمؤمن كالبنيان يشد بعضه بعضا» وشبك بين أصابعه.", "حاشية: (١) في (ظ): «يشيع».", "ومنها: أن لا يؤذي أحدا من المسلمين بفعل ولا قول، وفي الصحيحين من حديث أبي موسى قال: قالوا: يا رسول الله أي المسلمين أفضل؟ قال: «من سلم المسلمون من لسانه ويده». وفيهما من حديث عبد الله بن عمرو (١-١)عن النبي ﷺ أنه قال: «المسلم من سلم المسلمون من لسانه ويده»(١-١). وفي أفراد مسلم من حديث أبي هريرة أنه قال: «لقد رأيت رجلا يتقلب في الجنة في شجرة قطعها عن الطريق كانت تؤذي الناس». وفي أفراده من حديث أبي برزة قال: قلت: يا رسول الله، علمني شيئا أنتفع به. قال: «اعزل الأذى عن طريق المسلمين» وقال عليه الصلاة والسلام: «لا يحل لمسلم أن يروع مسلما».", "ومنها أن يتواضع لكل مسلم ولا يتكبر عليه، وفي أفراد البخاري من حديث أنس قال: إن كانت الأمة من أهل المدينة لتأخذ بيد رسول الله ﷺ فتنطلق به في حاجتها حيث شاءت.", "ومنها أن لا يسمع بلاغات الناس بعضهم على بعض، ولا يبلغ بعضهم ما يسمع من بعض، وفي الصحيحين من حديث حذيفة عن النبي ﷺ أنه قال: «لا يدخل الجنة قتات» وفي لفظ: «نمام». وفي الصحيحين من حديث ابن عباس عنه أنه مر بقبرين فقال: «إنهما ليعذبان، وما يعذبان في كبير؛ أما أحدهما فكان لا يستبرئ من بوله، وأما الآخر فكان يمشي بين الناس بالنميمة»."]], "ic": "book"}, {"story": ["الباب الثالث في حقوق المسلم والرحم والجوار والملك وكيفية الم (٣ من ١٦)، ص٤٣٩", ["ومنها أن لا يزيد في الهجرة لمن يعرفه على ثلاثة أيام، وفي الصحيحين من حديث أبي أيوب وأنس كلاهما عن النبي ﷺ أنه قال: «لا يحل لمسلم أن يهجر أخاه فوق ثلاث، يلتقيان فيصد هذا ويصد هذا، وخيرهما الذي يبدأ بالسلام». وفي أفراد مسلم من حديث أبي هريرة عن النبي ﷺ أنه قال: «إن أبواب الجنة تفتح يوم الاثنين والخميس، فيغفر لكل عبد لا يشرك بالله شيئا، إلا رجل بينه وبين أخيه شحناء فيقال: أنظروهما حتى يصطلحا. مرتين». وفي حديث أبي خراش السلمي", "حاشية: (١-١) سقط من: (ظ).", "عن النبي ﷺ أنه قال: (١-١)«من هجر أخاه سنة فهو كسفك دمه». وفي حديث أبي هريرة عن النبي ﷺ أنه قال(١-١): «لا يحل لرجل أن يهجر مؤمنا فوق ثلاثة أيام، فإذا مرت به ثلاثة أيام فليلقه فليسلم عليه، فإن رد عليه السلام فقد اشتركا في الأجر، وإن لم يرد عليه، فقد برئ المسلم من الهجرة».", "واعلم أن هذه الهجرة إنما هي فيما يتعلق بأمور الدنيا مما يوجب عتبا وموجدة كتقصير في حقوق العشرة ونحوها، فينبغي أن يقنع في التأديب بهجر ثلاث، ثم يعفو، فقد قال عليه الصلاة والسلام: «ما زاد الله عبدا بعفو إلا عزا». فأما ما كان في حق الدين فإن هجر أهل الأهواء والبدع والمعاصي ينبغي أن يدوم ما لم تظهر منهم التوبة والرجوع إلى الحق، فإن النبي ﷺ قد نهى الناس عن تكليم كعب بن مالك وصاحبيه إلى أن نزلت التوبة.", "ومنها أن يحسن إلى كل من قدر أن يحسن إليه من المسلمين ما استطاع، ففي أفراد البخاري من حديث جابر بن عبد الله عن النبي ﷺ أنه قال: «كل معروف صدقة، ومن المعروف أن تلقى أخاك بوجه طلق، وأن تفرغ من دلوك في إنائه» أخبرنا ابن الحصين قال: أخبرنا أبو علي التميمي قال: أخبرنا أبو بكر بن مالك قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا أبو معاوية قال: حدثنا الأعمش عن أبي صالح عن أبي هريرة قال: قال رسول الله ﷺ: «من نفس عن مؤمن كربة من كرب الدنيا نفس الله عنه كربة من كرب يوم القيامة، ومن ستر مسلما ستره الله في الدنيا والآخرة، ومن يسر على معسر يسر الله عليه في الدنيا والآخرة، والله في عون العبد ما كان العبد في عون أخيه». انفرد بإخراجه مسلم. قال أحمد: وحدثنا يزيد قال: أخبرنا سلام بن مسكين عن عقيل بن طلحة قال: حدثنا أبو جري الهجيمي، قال: أتيت رسول الله ﷺ فقلت: يا رسول الله، إنا قوم من أهل البادية فعلمنا شيئا ينفعنا الله به. قال: «لا تحقرن من المعروف شيئا، ولو أن تفرغ من دلوك في إناء المستسقي، ولو أن تكلم أخاك ووجهك إليه منبسط، وإن امرؤ سبك بما يعلم فيك، فلا تسبه بما تعلم فيه، فإن أجره لك ووباله على من قاله».", "حاشية: (١-١) سقط من (ظ)."]], "ic": "book"}, {"story": ["الباب الثالث في حقوق المسلم والرحم والجوار والملك وكيفية الم (٤ من ١٦)، ص٤٤١", ["ومنها: أن لا يدخل على أحد من المسلمين إلا بإذنه، ويستأذن ثلاثا، فإن لم يؤذن له انصرف، وفي الصحيحين من حديث أبي سعيد عن النبي ﷺ أنه قال: «من استأذن ثلاثا فلم يؤذن له فليرجع».", "ومنها: أن يخالق الناس بخلق حسن، وذلك أن يعامل كلا على حسب طريقته، فإنه متى لقي الجاهل بالعلم واللاهي بالفقه، والغني بالبيان آذى وتأذى.", "ومنها: أن يوقر المشايخ، ويرحم الصبيان، فقد روي عن النبي ﷺ أنه قال: «ليس منا من لم يوقر كبيرنا، ويرحم الصبيان» وقال عليه الصلاة والسلام: «من إجلال الله إكرام ذي الشيبة المسلم». ومن تمام توقير المشايخ أن لا يتكلم بين أيديهم إلا أن يأذنوا، وقد روى أنس بن مالك عن النبي ﷺ أنه قال: «ما أكرم شاب شيخا لسنه إلا قيض الله له من يكرمه عند سنه». وفي هذا الحديث بشارة بطول العمر فليتنبه لها، فلا يوفق لتوقير الشيوخ إلا من قضى الله له بطول العمر. وكان التلطف بالصبيان من عادة رسول الله ﷺ، وكان يقول لأخي أنس: «يا أبا عمير ما فعل النغير». وفي أفراد مسلم من حديث عبد الله بن جعفر قال: كان رسول الله ﷺ إذا قدم من سفر تلقي بالصبيان من أهل بيته، وإنه قدم مرة من سفره فسبق بي إليه، فحملني بين يديه، ثم جيء بأحد ابني فاطمة إما حسن وإما حسين، فأردفه خلفه، فدخلنا المدينة ثلاثة على دابة.", "ومنها: أن يكون مع الخلق كافة طلق الوجه رفيقا، وقد ذكرنا في حديث أبي جري: «ولو أن تكلم أخاك ووجهك إليه منبسط». وذكرنا في حديث عدي بن حاتم عن النبي ﷺ أنه قال: «اتقوا النار ولو بشق تمرة، فمن لم يجد فبكلمة طيبة».", "وقال علي رضي الله عنه: حرمت النار على كل هين لين سهل قريب.", "وقال عروة: مكتوب في الحكمة: لتكن كلمتك طيبة، وليكن وجهك بسيطا تكن أحب إلى الناس ممن يعطيهم العطاء.", "وقال عبد الملك بن عمير: إذا أحب الله عبدا أحسن خلقه وخلقه. ووصف ابن المبارك حسن الخلق فقال: بسط الوجه، وبذل المعروف، وكف الأذى.", "ومنها: أن لا يعد بوعد إلا وفى به، فقد أخبرنا أبو بكر المزرفي وأبو الحسن الموحد وأبو عبد الله البارع وأبو سعد الزوزني وأبو منصور القزاز وأبو النجم الشيخي قالوا: أخبرنا أبو جعفر بن المسلمة قال: أخبرنا أبو الفضل الزهري قال: حدثنا أبو جعفر الفريابي، قال: حدثنا قتيبة قال: حدثنا إسماعيل بن جعفر عن أبي سهيل بن مالك عن أبيه عن أبي هريرة أن رسول الله ﷺ قال: «آية المنافق ثلاث؛ إذا حدث كذب، وإذا وعد أخلف، وإذا اؤتمن خان». أخرجاه في الصحيحين."]], "ic": "book"}, {"story": ["الباب الثالث في حقوق المسلم والرحم والجوار والملك وكيفية الم (٥ من ١٦)، ص٤٤٢", ["ومنها: أن ينصف الناس من نفسه، ولا يأتي إليهم إلا ما يحب أن يؤتى إليه، قال الحسن البصري: اصحب الناس بما تحب أن يصاحبوك به تكن مسلما. وقال الحسن: أوحى الله تعالى إلى آدم أربع كلمات، وقال: فيهن جماع الأمر لك ولولدك، وواحدة لي، وواحدة لك، وواحدة بيني وبينك، وواحدة بينك وبين الخلق، فأما التي لي: تعبدني ولا تشرك بي شيئا، وأما التي لك؛ فعملك أجزيك به أفقر ما تكون إليه، وأما التي بيني وبينك؛ فعليك الدعاء وعلي الإجابة، وأما التي بينك وبين الناس؛ فتصحبهم بالذي تحب أن يصحبوك به.", "وسأل موسى ربه عز وجل: أي عبادك أعدل؟ قال: من أنصف من نفسه.", "ومنها: زيادة التوقير لذوي الهيئات فقد قال عليه الصلاة والسلام: «إذا أتاكم كريم قوم فأكرموه» وقال: «أقيلوا ذوي الهيئات عثراتهم».", "ومنها: أن يصلح ذات البين بين المسلمين، وفي الصحيحين من حديث أم كلثوم بنت عقبة عن النبي ﷺ أنه قال: «ليس الكذاب الذي يصلح بين الناس، فينمي خيرا، أو يقول خيرا» قالت: ولم أسمعه يرخص في شيء مما يقول الناس إلا في ثلاث؛ في الحرب، والإصلاح بين الناس، وحديث الرجل امرأته، وحديث المرأة زوجها.", "ومنها: أن يستر عورات المسلمين، وقد ذكرنا آنفا عن النبي ﷺ أنه قال: «من ستر مسلما ستره الله في الدنيا والآخرة.»", "واعلم أنه من تأمل ستر الله عز وجل على العصاة اقتدى بلطفه، فإنه جعل الشهادة في الزنا أن يشهد أربعة من العدول أنهم شاهدوا ذلك كالميل في المكحلة، وهذا لا يتفق. ومن هذا أثر كرمه في الدنيا يرجى منه ذلك في الآخرة.", "وفي الصحيحين من حديث عبادة بن الصامت عن النبي ﷺ أنه قال: «بايعوني على أن لا تشركوا بالله شيئا، ولا تسرقوا، ولا تزنوا، ولا تقتلوا أولادكم، ولا تأتوا ببهتان تفترونه بين أيديكم وأرجلكم، ولا تعصوا في معروف، فمن وفى منكم فأجره على الله، ومن أصاب من ذلك شيئا (١-١)فعوقب في الدنيا، فهو كفارة له، ومن أصاب من ذلك شيئا(١-١) فستره الله، فهو إلى الله إن شاء عفى عنه، وإن شاء عاقبه» فبايعناه على ذلك. وقد روى علي رضي الله عنه عن النبي ﷺ أنه قال: «من أذنب في الدنيا ذنبا فستره الله عليه وعفا عنه، فالله أكرم من أن يعود في شيء قد عفا عنه». وقد أخبرنا هبة الله بن محمد قال: أخبرنا الحسن بن علي قال: أخبرنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا أسود بن عامر قال: حدثنا أبو بكر - يعني ابن عياش - عن الأعمش عن سعيد بن عبد الله بن جريج عن أبي برزة الأسلمي قال: قال رسول الله ﷺ: «يا معشر من آمن بلسانه ولم يدخل الإيمان قلبه لا تغتابوا المسلمين، ولا تتبعوا عوراتهم، فإنه من يتبع عوراتهم يتبع الله عورته، ومن يتبع الله عورته يفضحه في بيته»."]], "ic": "book"}, {"story": ["الباب الثالث في حقوق المسلم والرحم والجوار والملك وكيفية الم (٦ من ١٦)، ص٤٤٣", ["ومنها: أن يتقي مواضع التهم صيانة لقلوب الناس عن سوء الظن به، ولألسنتهم عن غيبته، فإنهم إذا عصوا الله بذكره وكان هو السبب في ذلك كان شريكا، قال تعالى: ﴿وَلَا تَسُبُّوا۟ ٱلَّذِينَ يَدْعُونَ مِن دُونِ ٱللَّهِ فَيَسُبُّوا۟ ٱللَّهَ عَدْوًۢا بِغَيْرِ عِلْمٍۢ﴾ [الأنعام: ١٠٨]. وفي الصحيحين من حديث عبد الله بن عمرو عن النبي ﷺ أنه قال: «من الكبائر شتم الرجل والديه» قالوا: يا رسول الله، وهل يشتم الرجل والديه؟ قال: «نعم، يسب أبا الرجل فيسب أباه، ويسب أمه فيسب أمه». وفيهما من حديث صفية بنت حيي قالت: كان رسول الله ﷺ معتكفا، فأتيته أزوره ليلا،", "حاشية: (١-١) سقط من (ظ).", "فحدثته ثم قمت فانقلبت، فقام معي، فمر رجلان من الأنصار، فلما رأيا رسول الله ﷺ أسرعا، فقال النبي ﷺ: «على رسلكما فإنها صفية بنت حيي» فقالا: سبحان الله يا رسول الله! قال: «إن الشيطان يجري من الإنسان مجرى الدم، وإني خشيت أن يقذف في قلوبكما شرا - أو قال: شيئا». وفي هذا الحديث من الفقه أنه يستحب للإنسان أن يتحرز من كل أمر من المكروه نجري به الظنون ويخطر بالقلوب طلبا لسلامته من الناس وسلامتهم من سوء الظن به، وقد قال عمر رضي الله عنه: من أقام نفسه مقام تهمة فلا يلومن من أساء به الظن.", "ومنها: أن يشفع لكل من له حاجة من المسلمين إلى من له عنده منزلة، ويسعى في قضاء حوائجهم، وفي الصحيحين من حديث أبي موسى رضي الله عنه، عن النبي ﷺ أنه كان(١) إذا أتاه طالب حاجة أقبل على جلسائه فقال: «اشفعوا تؤجروا، وليقض الله على لسان نبيه ما أحب». وقال ﷺ لبريرة في حق زوجها: «لو راجعتيه» فقالت: أتأمرني؟ قال: «لا، إنما أنا شفيع».", "ومنها: أن يبدأ بالسلام على(٢) كل مسلم قبل أن يكلمه، فقد ذكرنا آنفا عن رسول الله ﷺ أنه قال: «أفشوا السلام بينكم». وفي الصحيحين من حديث عبد الله بن عمرو رضي الله عنهما أن رجلا سأل رسول الله ﷺ: أي الإسلام خير؟ قال: «تطعم الطعام، وتقرأ السلام على من عرفت ومن لم تعرف». وفيهما من حديث ثابت(٣) قال: مر أنس على صبيان فسلم عليهم، وقال: كان النبي ﷺ يفعله. وفيهما من حديث أبي هريرة، عن النبي ﷺ قال: «ليسلم الصغير على الكبير، والمار على القاعد، والقليل على الكثير».", "ومن السنة المصافحة، ففي أفراد البخاري من حديث قتادة قال: قلت لأنس: أكانت المصافحة في أصحاب رسول الله ﷺ؟ قال: نعم. وفي حديث آخر عن", "حاشية: (١) تحرفت في الأصل إلى: «قال».", "حاشية: (٢) سقطت من الأصل.", "حاشية: (٣) هو ثابت البناني.", "أنس رضي الله عنه قال: قال رسول الله ﷺ: «يقدم عليكم غدا قوم هم أرق قلوبا للإسلام منكم» فقدم الأشعريون، فيهم أبو موسى، فلما دنوا من المدينة جعلوا يرتجزون ويقولون:", "غدا نلقى الأحبه  محمدا وحزبه", "فلما أن قدموا تصافحوا، فكانوا أول من أحدث المصافحة."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "واعلم أن هذه الهجرة إنما هي فيما يتعلق بأمور الدنيا مما يوجب عتبا وموجدة كتقصير في حقوق العشرة ____، فينبغي أن يقنع في التأديب بهجر ثلاث، ثم يعفو، فقد قال عليه الصلاة والسلام", "o": ["ونحوها", "الجاهل", "فتغير", "أطعته"], "h": "راجع: ص٤٤٠"}, {"t": "fill", "d": 2, "q": "وكان ظبيان بن علي من أبر الناس بأمه فباتت أمه ليلة وفي صدرها عليه شيء فقام على رجليه قائما وكره أن يوقظها، وكره أن يقعد حتى إذا ضعف جاء غلامان من غلمانه فما زال معتمدا عليهما حتى ____ من قبل نفسها", "o": ["استيقظت", "بدرهم", "النجوم", "وتفضيلها"], "h": "راجع: ص٤٥٥"}, {"t": "fill", "d": 2, "q": "حقوق الوالدين: أخبرنا عبد الأول قال: أخبرنا الداوودي قال: أخبرنا ابن أعين قال: حدثنا الفربري قال: حدثنا البخاري قال: حدثنا آدم قال: حدثنا ____ قال: حدثنا حبيب بن أبي ثابت عن أبي العباس المكي عن", "o": ["شعبة", "أحدها", "يحكم", "أصبحوا"], "h": "راجع: ص٤٥٣"}, {"t": "fill", "d": 2, "q": "ومنها: أن يخالق الناس بخلق حسن، وذلك أن يعامل كلا على حسب طريقته، فإنه متى لقي الجاهل بالعلم ____ بالفقه، والغني بالبيان آذى", "o": ["واللاهي", "استدلوا", "بنفسه", "الفتوة"], "h": "راجع: ص٤٤١"}, {"t": "fill", "d": 2, "q": "حقوق المملوك: قد سبق بيان حقوق ملك النكاح، وأما ملك اليمين، فقد روي عن النبي ﷺ أنه قال عند موته: «الصلاة، وما ملكت أيمانكم». وفي الصحيحين من حديث المعرور بن ____ قال: لقيت أبا ذر بالربذة وعليه", "o": ["سويد", "خيام", "لأهله", "الجديد"], "h": "راجع: ص٤٥٦"}, {"t": "fill", "d": 2, "q": "وعلى غلامه حلة، فسألته عن ذلك، فقال: قال لي النبي ﷺ: «إخوانكم خولكم جعلهم الله تحت أيديكم، فمن كان ____ تحت يده فليطعمه مما يأكل، وليلبسه مما يلبس، ولا تكلفوهم ما يغلبهم، فإن كلفتموهم فأعينوهم».", "o": ["أخوه", "دركات", "فغضب", "ويجود"], "h": "راجع: ص٤٥٧"}]}, {"t": "الباب الثالث في حقوق المسلم والرحم والجوار والملك وكيفية المعاشرة مع م - القسم ٢ من ٣", "b": [{"story": ["الباب الثالث في حقوق المسلم والرحم والجوار والملك وكيفية الم (٧ من ١٦)، ص٤٤٥", ["أخبرنا أبو القاسم بن عبد الواحد، قال: أخبرنا أبو علي ابن المذهب، قال: أخبرنا أبو بكر ابن مالك، قال: حدثنا عبد الله بن أحمد، قال: حدثني أبي، قال: حدثنا محمد بن بكر، قال: حدثنا ميمون المرئي، قال: حدثنا ميمون بن سياه، عن أنس بن مالك، عن نبي الله ﷺ قال: «ما من مسلمين التقيا، فأخذ أحدهما بيد صاحبه إلا كان حقا على الله عز وجل أن يحضر دعاءهما ولا يفرق بين أيديهما حتى يغفر لهما».", "أخبرنا محمد بن عمر الأرموي، قال: أخبرنا أبو الحسين المهتدي قال: أخبرنا محمد بن الحسين الخفاف، قال: أخبرنا عبد الله بن محمد المؤدب، قال: حدثنا أبو بكر محمد بن عبد الله الأشناني، قال: حدثنا يحيى بن معين، قال: حدثنا عبد الله بن إدريس، قال: أخبرنا شعبة، عن عمرو بن مرة، عن عبد الرحمن بن أبي ليلى، عن البراء رضي الله عنه قال: صافحني النبي ﷺ فغمز على كفي، فقال لي: «يا براء، أتدري لم غمزت على كفك؟» قلت: لا يا رسول الله. قال: «إذا صافح المؤمن المؤمن نزلت عليهما مئة رحمة، تسعة وتسعون لأبشهما وأحسنهما خلقا».", "ولا بأس بتقبيل يد المعظم في الدين تبركا به، فقد روى ابن عمر قال: قبلنا يد رسول الله ﷺ. وقد قبل عمر رأس أبي بكر، ولقي أبو عبيدة عمر بن الخطاب فقبل يده.", "ولا بأس بالمعانقة، فقد قالت عائشة: لما قدم جعفر، تلقاه رسول الله ﷺ واعتنقه. وقال الشعبي: كان أصحاب رسول الله ﷺ إذا قدموا من سفر تعانقوا.", "وأما الانحناء فمنهي عنه، روى أنس قال: قلنا: يا رسول الله، أينحني بعضنا لبعض؟ فقال: «لا».", "وأما الأخذ بالركاب لتوقير العلماء، فقد فعل ذلك ابن عباس بزيد بن ثابت.", "وأما القيام على سبيل الإكرام لأهل الدين فحسن.", "ومنها: أن يصون عرض أخيه المسلم ونفسه وماله عن ظلم الغير، ويناضل دونه وينصره.", "وفي أفراد البخاري من حديث أنس عن النبي ﷺ أنه قال: «انصر أخاك ظالما أو مظلوما» قيل: يا رسول الله هذا ننصره مظلوما، فكيف ننصره ظالما؟ قال: «تمنعه من الظلم». وفي حديث أبي الدرداء عن النبي ﷺ أنه قال: «ما من امرئ مسلم يرد عن عرض أخيه إلا كان حقا على الله عز وجل أن يرد عنه نار جهنم يوم القيامة». وفي حديث جابر عن النبي ﷺ: «ما من امرئ مسلم يخذل مسلما في موطن ينتقص فيه من عرضه وينتهك فيه من حرمته إلا خذله الله في موطن يحب فيه نصرته، وما من امرئ مسلم ينصر مسلما في موطن ينتقص فيه من عرضه وينتهك فيه من حرمته إلا نصره الله في موطن يحب فيه نصرته». وفي حديث أبي أمامة بن سهل عن أبيه عن النبي ﷺ أنه قال: «من أذل عنده مؤمن وهو يقدر على أن ينصره، فلم ينصره أذله الله عز وجل على رؤوس الخلائق»."]], "ic": "book"}, {"story": ["الباب الثالث في حقوق المسلم والرحم والجوار والملك وكيفية الم (٨ من ١٦)، ص٤٤٦", ["ومنها: تشميت العاطس، وفي حديث علي رضي الله عنه عن النبي ﷺ أنه قال: «إذا عطس أحدكم فليقل: الحمد لله، وليقل من حوله: يرحمك الله، وليقل هو: يهديكم الله ويصلح بالكم». أنبأنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أبو بكر مالك قال: حدثنا عبد الله بن أحمد، قال: حدثني أبي قال: حدثنا هاشم بن القاسم قال: حدثنا شعبة عن محمد بن أبي ليلى عن أخيه عن أبيه عن أبي أيوب عن النبي ﷺ أنه قال: «إذا عطس أحدكم، فليقل: الحمد لله على كل حال، وليقل الذي يشمته: يرحمكم الله. وليقل الذي يرد عليه: يهديكم الله ويصلح بالكم». وفي أفراد البخاري من حديث أبي هريرة عن النبي ﷺ قال: «إن الله يحب العطاس ويكره التثاؤب، فإذا عطس أحدكم وحمد الله كان حقا على كل مسلم سمعه أن يقول له: يرحمك الله». وفي الصحيحين من حديث أنس قال: عطس رجلان عند", "النبي ﷺ فشمت أحدهما، ولم يشمت الآخر، فقال الذي لم يشمته: عطس فلان فشمته وعطست فلم تشمتني. فقال: «إن هذا حمد الله وإنك لم تحمد الله».", "ومنها: أنه إذا بلي بذي شر فينبغي(١) أن يجامله ويتقيه، وفي الصحيحين من حديث عائشة قالت: استأذن رجل على رسول الله ﷺ وأنا عنده، فقال: «بئس أخو العشيرة، وبئس ابن العشيرة» ثم أذن له، فلما جلس تطلق النبي ﷺ في وجهه وانبسط، فلما خرج قلت: يا رسول الله قلت له ما قلت ثم ألنت له القول؟ قال: «يا عائشة، متى عهدتني فحاشا؟ إن شر الناس عند الله منزلة من تركه الناس اتقاء فحشه». وقال أبو الدرداء: إنا لنكشر في وجوه أقوام ونضحك إليهم وإن قلوبنا لتلعنهم. وقال محمد ابن الحنفية: ليس بحكيم من لم يعاشر بالمعروف من لا يجد من معاشرته بدا حتى يجعل الله له فرجا.", "ومنها: أن يجتنب مخالطة الأغنياء، ويختلط بالمساكين، ويحسن إلى الأيتام، فقد روي عن النبي ﷺ أنه كان يقول: «اللهم أحيني مسكينا، وأمتني مسكينا، واحشرني في زمرة المساكين». وأما اليتيم، ففي أفراد البخاري من حديث سهل بن سعد عن النبي ﷺ أنه قال: «أنا وكافل اليتيم كهاتين في الجنة» وأشار بالسبابة والوسطى. وفي حديث أبي هريرة عن النبي ﷺ أنه قال: «خير بيت من المسلمين بيت فيه يتيم يحسن إليه، وشر بيت في المسلمين بيت فيه يتيم يساء إليه».", "ومنها: النصيحة لكل مسلم، وفي الصحيحين من حديث جرير بن عبد الله قال: بايعت رسول الله ﷺ على إقام الصلاة، وإيتاء الزكاة، والنصح لكل مسلم. وفي أفراد مسلم (٢-٢)من حديث تميم الداري عن النبي ﷺ أنه قال: «إن الدين النصيحة، إن الدين النصيحة، إن الدين النصيحة». قالوا: لمن يا رسول الله؟ قال: «لله، ولكتابه، ولنبيه، ولأئمة المؤمنين وعامتهم».", "ومنها: عيادة مرضاهم، وفي الصحيحين من حديث البراء بن عازب: أمرنا رسول الله ﷺ بعيادة المريض. وفي أفراد مسلم(٢-٢) من حديث ثوبان عن النبي ﷺ", "حاشية: (١) سقطت من الأصل."]], "ic": "book"}, {"story": ["الباب الثالث في حقوق المسلم والرحم والجوار والملك وكيفية الم (٩ من ١٦)، ص٤٤٧", ["حاشية: (٢-٢) سقط من (ظ).", "أنه قال: «عائد المريض في مخرفة(١) الجنة». وفي لفظ: «من عاد مريضا لم يزل في خرفة الجنة حتى يرجع» قيل: يا رسول الله، وما خرفة الجنة؟ قال: «جناها». وفي حديث علي رضي الله عنه عن النبي ﷺ أنه قال: «من عاد مريضا بكرة شيعه سبعون ألف ملك كلهم يستغفر له حتى يمسي، وكان له خريف في الجنة، وإن عاده مساء شيعه سبعون ألف ملك كلهم يستغفر له حتى يصبح، وكان له خريف في الجنة».", "وفي حديث أبي هريرة عن النبي ﷺ أنه قال: «إذا عاد المسلم أخاه أو زاره قال الله عز وجل: طبت وطاب ممشاك، وتبوأت في الجنة منزلا».", "ومن آداب(٢) العائد أن يضع يده على المريض ويسأله كيف هو، وليخفف الجلوس، ويظهر الرقة، ويدعو بالعافية، ويغض البصر عن عورات المكان، وفي الصحيحين من حديث عائشة أن رسول الله ﷺ كان إذا أتى مريضا أو أتي به قال: «أذهب البأس، رب الناس، اشف وأنت الشافي، لا شفاء إلا شفاؤك، شفاء لا يغادر سقما» قالت: وكان يقول بإصبعه هكذا - تعني أنه يضع السبابة على الأرض - ثم يرفعها ويقول: «بسم الله، تربة أرضنا، بريقة بعضنا، يشفى به سقيمنا بإذن ربنا».", "وفي حديث ابن عباس عن النبي ﷺ أنه قال: «ما من عبد مسلم يعود مريضا لم يحضر أجله فيقول سبع مرات: أسأل الله العظيم، رب العرش العظيم أن يشفيك. إلا عوفي».", "ويستحب للمريض أن يفعل ما أخرجه مسلم في أفراده من حديث عثمان بن أبي العاص أنه شكى إلى رسول الله ﷺ وجعا يجده في جسده منذ أسلم، فقال له رسول الله ﷺ: «ضع يدك على الذي يألم من جسدك، وقل: بسم الله، ثلاثا، وقل سبع مرات: أعوذ بالله وقدرته من شر ما أجد وأحاذر».", "حاشية: (١) المخرفة: موضع خرف الثمار وقطعها وجنيها، ومخارف الجنة: مجاني ثمارها.", "حاشية: (٢) في (ظ): «أدب».", "وجملة أدب المريض: حسن الصبر، وقلة الشكوى والتضجر، والفزع إلى الدعاء، والتوكل على الله سبحانه.", "ومنها: أن يشيع جنائزهم، ففي الصحيحين من حديث أبي هريرة عن النبي ﷺ أنه قال: «من شهد جنازة حتى يصلى عليها فله قيراط، ومن شهدها حتى تدفن فله قيراطان» قيل: ما القيراطان يا رسول الله؟ قال: «مثل الجبلين العظيمين».", "واعلم أن المقصود من التشييع قضاء حق المسلمين والاعتبار، قال الأعمش: كنا نشهد الجنائز فلا ندري من نعزي لحزن القوم كلهم. وفي الصحيحين من حديث أنس عن النبي ﷺ أنه قال: «يتبع الميت ثلاثة، فيرجع اثنان ويبقى معه واحد؛ يتبعه أهله وماله وعمله، فيرجع أهله وماله ويبقى عمله»."]], "ic": "book"}, {"story": ["الباب الثالث في حقوق المسلم والرحم والجوار والملك وكيفية الم (١٠ من ١٦)، ص٤٤٩", ["ومنها: أن يزور قبورهم، والمقصود من ذلك الدعاء والاعتبار وترقيق القلب، (١-١)وفي أفراد مسلم من حديث بريدة عن النبي ﷺ أنه قال: «نهيتكم عن زيارة القبور فزوروها» قال: وكان يعلمهم إذا خرجوا إلى المقابر أن يقول قائلهم: السلام عليكم أهل الديار من المؤمنين والمسلمين، وإنا إن شاء الله بكم لاحقون، أنتم لنا فرط، ونحن لكم تبع، فنسأل الله لنا ولكم العافية. وسيأتي في ذكر الموت ما يتعلق بالقبور(١-١).", "وأدب تشييع الجنائز لزوم الخشوع، وترك الحديث، وملاحظة الميت، والتفكر في الموت والاستعداد له، والمشي أمام الجنازة.", "فهذه جملة تنبه على آداب المعاشرة مع عموم الخلق، والجملة الجامعة أن لا تستصغر منهم أحدا فعلمه خير منك، ولا تعظم صاحب الدنيا منهم لدنياه، فالدنيا كلها صغيرة، ولا تبذلن دينك لتنال به الدنيا، ولا تعاديهم إلا أن ترى معصية فتعادي أفعالهم، وانظر إليهم بعين(٢) الرحمة لتعرضهم لمقت الله وعقوبته، ولا تسكن إلى مدحهم لك، ولا تشك إليهم أحوالك فيكلك الله إليهم، ولا تطمع", "حاشية: (١-١) سقط من (ظ).", "حاشية: (٢) تحرفت في الأصل إلى: «بغير».", "أن يكونوا لك في الغيب كما هم في العلانية، ولا تطمع بما في أيديهم فتستعجل الذل، ولا تعل(١) عليهم تكبرا لاستغنائك عنهم فربما عوقبت بالاحتياج إليهم، وإذا سألت أحدا منهم حاجة فقضاها فهو أخ مستفاد، وإن لم يقضها، فلا تعاتبه فيصير عدوا تطول عليك مقاساته، ولا تشتغل بوعظ من لا ترى فيه مخايل القبول فيعاديك، ولا تكافئهم على سوء الضرر فيزيد الضر ويضيع العمر، وكن فيهم سميعا لحقهم نطوقا به، أصم عن باطلهم صموتا عنه، واحذر الأكثرين منهم فصحبتهم خسران، ويندر من يصلح، ظاهرهم ثياب، وباطنهم ذئاب، يقطعون بالظنون، ويتغامزون وراءك بالعيون، ويتربصون لصديقهم من حسدهم ريب المنون، يحصون عليك العثرات في صحبتهم ليجبهوك بها في غضبهم فلا تعقد خنصرك(٢) إلا على من جربته في فقر وغنى، وعزل ولاية، وسفر وحضر، ومعاملة وشدة، فإذا رضيته في هذه الأحوال فاتخذه أبا إن كان كبيرا، وابنا إن كان صغيرا، وأخا إن كان مثلا."]], "ic": "book"}, {"story": ["الباب الثالث في حقوق المسلم والرحم والجوار والملك وكيفية الم (١١ من ١٦)، ص٤٥٠", ["**وأما حقوق الجار:** فاعلم أن الجوار يقتضي حقا وراء ما تقتضيه أخوة الإسلام، فيستحق الجار المسلم ما يستحقه كل مسلم وزيادة، وفي الصحيحين من حديث أبي هريرة عن النبي ﷺ أنه قال: «من كان يؤمن بالله واليوم الآخر، فلا يؤذ جاره». وفيهما من حديث ابن عمر وعائشة كلاهما عن النبي ﷺ أنه قال: «ما زال جبريل يوصيني بالجار حتى ظننت أنه سيورثه». وفي أفراد البخاري من حديث عائشة قالت: قلت: يا رسول الله، إن لي جارين، فإلى أيهما أهدي؟ قال: «إلى أقربهما منك بابا» وفي أفراده من حديث أبي هريرة عن رسول الله ﷺ قال: «لا والله لا يؤمن، لا والله لا يؤمن، لا والله لا يؤمن» قالوا: ومن ذاك يا رسول الله؟ قال: «جار لا يأمن جاره بوائقه» قيل: ما بوائقه؟ قال: «شره». وفي أفراد مسلم من حديث أبي ذر أن رسول الله ﷺ قال(٣) له: «يا أبا ذر، إذا طبخت قدرا فأكثر", "حاشية: (١) تحرفت في النسخ إلى: «تصل»، والمثبت من الإحياء.", "حاشية: (٢) أي لا تعد صديقا إلا من اتصف بالآتي، وكانوا إذا بدأوا العد أشاروا بالخنصر أولا.", "حاشية: (٣) سقطت من الأصل.", "المرقة، وتعاهد جيرانك، أو اقسم بين جيرانك» وفي حديث أبي هريرة قال: قالوا للنبي ﷺ: إن فلانة تصوم الدهر، وتقوم الليل وتؤذي جيرانها بلسانها. قال: «لا خير فيها، هي في النار». وفي حديث ابن عباس عن النبي ﷺ قال: «ليس المؤمن الذي يشبع وجاره جائع».", "وقال الحسن البصري: يا ابن آدم، أحسن جوار من جاورك تكن مؤمنا. وسئل عن الجار فقال: أربعون دارا أمامه، وأربعون خلفه، وأربعون عن يمينه وأربعون عن يساره.", "وجاء في الحديث: «الجيران ثلاثة: جار له حق واحد، وجار له حقان، وجار له ثلاثة حقوق؛ فالجار الذي له ثلاثة حقوق: الجار المسلم ذو الرحم، فله حق الجوار، وحق الإسلام، وحق الرحم. وأما الذي له حقان: فالجار المسلم، فله حق الجوار وحق الإسلام، وأما الذي له حق واحد: فالجار المشرك».", "واعلم أنه ليس حق الجوار كف الأذى فقط، بل احتمال الأذى، ثم الرفق وإسداء الخير.", "وجملة حق الجار أن يبدأه بالسلام، ولا يطيل معه الكلام، ولا يكثر عن حاله السؤال، ويعوده في المرضى ويعزيه في المصيبة، ويهنيه في الفرح، ويظهر له المشاركة في السرور معه، ويصفح عن زلاته ولا يتطلع إلى داره، ولا يضايقه في وضع الخشب على جداره، ولا في صب الماء في ميزابه ولا في مطرح التراب من فنائه، ولا يتبعه النظر فيما يحمله إلى داره، ويستر ما ينكشف له من عوراته، ولا يتسمع عليه كلامه، ويغض طرفه عن حرمته(١)، وينعشه من صرعته إذا نابته نائبة، ويلاحظ حوائج أهله إذا غاب.", "**حقوق الأقارب والرحم:** روى البخاري ومسلم في الصحيحين من حديث أبي هريرة عن النبي ﷺ أنه قال: «إن الله عز وجل خلق الخلق حتى إذا فرغ منهم", "حاشية: (١) في (ظ): «حرمه»."]], "ic": "book"}, {"story": ["الباب الثالث في حقوق المسلم والرحم والجوار والملك وكيفية الم (١٢ من ١٦)، ص٤٥٢", ["قامت الرحم فقالت: هذا مقام العائذ من القطيعة. قال: نعم، أما ترضين أن أصل من وصلك، وأقطع من قطعك؟ قالت: بلى. قال: فذاك لك» ثم قال رسول الله ﷺ: «اقرأوا إن شئتم: ﴿فَهَلْ عَسَيْتُمْ إِن تَوَلَّيْتُمْ أَن تُفْسِدُوا۟ فِى ٱلْأَرْضِ وَتُقَطِّعُوٓا۟ أَرْحَامَكُمْ أُو۟لَٰٓئِكَ ٱلَّذِينَ لَعَنَهُمُ ٱللَّهُ فَأَصَمَّهُمْ وَأَعْمَىٰٓ أَبْصَٰرَهُمْ﴾ [محمد: ٢٢-٢٣]». وفيهما من حديث عائشة عن النبي ﷺ أنه قال: «الرحم معلقة بالعرش تقول: من وصلني وصله الله، ومن قطعني قطعه الله». وفيهما من حديث أنس عن النبي ﷺ أنه قال: «من أحب أن يوسع الله عز وجل عليه في رزقه، وينسأ له في أثره، فليصل رحمه». وفي أفراد البخاري من حديث عبد الله بن عمرو عن النبي ﷺ أنه قال: «ليس الواصل بالمكافئ ولكن الواصل الذي إذا قطعت رحمه وصلها». وفي أفراد مسلم من حديث أبي هريرة أن رجلا قال: يا رسول الله، إن لي قرابة أصلهم ويقطعوني، وأحسن إليهم ويسيئون إلي، وأحلم عنهم ويجهلون علي. قال: «إن كنت كما تقول فكأنما تسفهم المل، ولا يزال معك من الله ظهير ما دمت على ذلك». والمعنى: أنك منصور عليهم قد انقطع احتجاجهم عليك بحق القرابة، كما ينقطع كلام من سف الملة، وهي الرماد الحار، ومنه قول العرب: بفيك الأثلب. أي: ا لحجر الذي يسكت الناطق.", "وفي الصحيحين من حديث جبير بن مطعم عن النبي ﷺ قال: «لا يدخل الجنة قاطع» قال سفيان: يعني قاطع رحم. وفي حديث أبي هريرة عن النبي ﷺ أنه قال: «إن أعمال بني آدم تعرض على الله عز وجل كل خميس فلا يقبل عمل قاطع رحم» وروى عبد الله ابن أبي أوفى عن النبي ﷺ أنه قال: «إن الرحمة لا تنزل على قوم فيهم قاطع رحم».", "أخبرنا الكروخي قال: أخبرنا أبو عامر الأزدي وأبو بكر الغورجي قالا: أخبرنا الجراحي قال: حدثنا المحبوبي قال: حدثنا أبو عيسى الترمذي قال: حدثني علي بن حجر قال: أخبرنا إسماعيل بن إبراهيم عن عيينة بن عبد الرحمن عن أبيه عن أبي بكرة قال: قال رسول الله ﷺ: «ما من ذنب أجدر أن يعجل الله لصاحبه العقوبة في الدنيا مع ما يدخر له في الآخرة من البغي وقطيعة الرحم» قال الترمذي: هذا حديث صحيح.", "وقد ذكرنا في كتاب الصدقة أن النبي ﷺ قال: «أفضل الصدقة على ذي الرحم الكاشح(١)». وقال لأبي طلحة وقد تصدق بحائطه: «أرى أن تجعله في قرابتك». وروي عن عمر بن الخطاب أنه كتب إلى عماله: مروا الأقارب أن يتزاوروا لا يتجاوروا. وإنما قال ذلك؛ لأن التجاور يوجب التزاحم على الحقوق، وربما يورث ذلك الوحشة والقطيعة."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "ومنها: أن يزور قبورهم، والمقصود من ذلك الدعاء والاعتبار وترقيق القلب، وفي أفراد مسلم من حديث بريدة عن النبي ﷺ أنه قال: «نهيتكم عن ____ القبور فزوروها» قال: وكان يعلمهم إذا خرجوا إلى المقابر أن", "o": ["زيارة", "لرفيقه", "فأمير", "النسل"], "h": "راجع: ص٤٤٩"}, {"t": "fill", "d": 2, "q": "وجاء في الحديث: «الجيران ثلاثة: جار له حق واحد، وجار له حقان، وجار له ثلاثة حقوق؛ فالجار الذي له ثلاثة حقوق: الجار ____ ذو الرحم، فله حق الجوار، وحق الإسلام، وحق الرحم. وأما الذي له حقان: فالجار", "o": ["المسلم", "حذرا", "يديك", "تقتلك"], "h": "راجع: ص٤٥١"}, {"t": "fill", "d": 2, "q": "وأما حقوق الجار: فاعلم أن الجوار يقتضي حقا وراء ما تقتضيه أخوة الإسلام، فيستحق الجار المسلم ما يستحقه كل مسلم وزيادة، وفي الصحيحين من حديث أبي هريرة عن ____ ﷺ أنه قال: «من كان يؤمن بالله واليوم", "o": ["النبي", "ليزعه", "بالصبي", "المياه"], "h": "راجع: ص٤٥٠"}, {"t": "fill", "d": 2, "q": "واعلم أن المقصود من التشييع قضاء حق المسلمين ____، قال الأعمش", "o": ["والاعتبار", "استمرار", "الإحرام", "وأصولها"], "h": "راجع: ص٤٤٩"}, {"t": "fill", "d": 2, "q": "وقال عبد الملك بن عمير: إذا أحب الله عبدا أحسن خلقه وخلقه. ووصف ابن المبارك حسن الخلق فقال: بسط الوجه، ____ المعروف، وكف", "o": ["وبذل", "محارم", "وتكره", "الخبري"], "h": "راجع: ص٤٤١"}, {"t": "fill", "d": 2, "q": "وفي حديث ابن عباس عن النبي ﷺ أنه قال: «ما من عبد مسلم يعود مريضا لم يحضر أجله فيقول سبع ____: أسأل الله العظيم، رب العرش العظيم أن يشفيك. إلا", "o": ["مرات", "مؤثران", "وإقبال", "يسعد"], "h": "راجع: ص٤٤٨"}]}, {"t": "الباب الثالث في حقوق المسلم والرحم والجوار والملك وكيفية المعاشرة مع م - القسم ٣ من ٣", "b": [{"story": ["الباب الثالث في حقوق المسلم والرحم والجوار والملك وكيفية الم (١٣ من ١٦)، ص٤٥٣", ["**حقوق الوالدين:** أخبرنا عبد الأول قال: أخبرنا الداوودي قال: أخبرنا ابن أعين قال: حدثنا الفربري قال: حدثنا البخاري قال: حدثنا آدم قال: حدثنا شعبة قال: حدثنا حبيب بن أبي ثابت عن أبي العباس المكي عن عبد الله بن عمرو قال: جاء رجل يستأذن النبي ﷺ في الجهاد فقال له رسول الله ﷺ: «أحي والداك؟» قال: نعم. قال: «ففيهما فجاهد». أخرجاه في الصحيحين، وفي أفراد مسلم من حديث أبي هريرة عن النبي ﷺ أنه قال: «لا يجزي ولد والده إلا أن يجده مملوكا فيشتريه فيعتقه». وفي أفراده من حديث ابن عمر أنه كان إذا خرج إلى مكة كان له حمار يتروح عليه إذا مل ركوب الراحلة، وعمامة يشد بها رأسه، فبينما هو يوما على ذلك الحمار إذ مر به أعرابي، فقال: ألست فلان بن فلان؟ قال: بلى، فأعطاه الحمار وقال: اركب هذا. والعمامة وقال: اشدد بها رأسك. فقال له أصحابه: غفر الله لك أعطيت هذا الأعرابي حمارا كنت تروح عليه، وعمامة كنت تشد بها رأسك؟ فقال: إني سمعت رسول الله ﷺ يقول: «إن من أبر البر صلة الرجل أهل ود أبيه بعد أن يولي»، وإن أباه كان صديقا لعمر.", "**تقديم الأم في البر:** أخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: حدثنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا هاشم قال: حدثنا محمد بن طلحة عن عبد الله بن شبرمة عن أبي زرعة عن أبي هريرة قال: قال رجل: يا رسول الله، أي الناس أحق مني بحسن الصحبة؟ قال: «أمك»", "حاشية: (١) الكاشح: هو الذي يضمر العداوة ويطوي عليها كشحه، والكشح: ما بين الخاصرة والضلوع.", "قال: ثم من؟ قال: «ثم أمك» قال: ثم من؟ قال: «ثم أمك» قال: ثم من؟ قال: «ثم أبوك» أخرجاه في الصحيحين.", "قال الإمام أحمد: وحدثنا خلف بن الوليد قال: حدثنا ابن عياش عن بحير بن سعد عن خالد بن معدان عن المقدام بن معدي كرب عن النبي ﷺ قال: «إن الله يوصيكم بأمهاتكم، إن الله يوصيكم بأمهاتكم، إن الله يوصيكم بآبائكم، إن الله يوصيكم بالأقرب فالأقرب».", "قال الإمام أحمد: وحدثنا عبد الرزاق قال: أخبرنا معمر عن الزهري عن عمرة عن عائشة قالت: قال رسول الله ﷺ: «نمت فرأيتني في الجنة، فسمعت صوت قارئ يقرأ، فقلت: من هذا؟ قالوا: هذا حارثة بن النعمان». قال رسول الله: «كذاك البر، كذاك البر» وكان أبر الناس بأمه.", "وقالت , "وفي الصحيحين من حديث أبي بكرة وعبد الله بن عمرو وأنس عن النبي ﷺ أنه عد في الكبائر عقوق الوالدين، أخبرنا هبة الله بن محمد الحريري قال: أخبرنا أبو بكر محمد بن علي الخياط قال أخبرنا أبو عبد الله أحمد بن محمد بن يوسف العلاف، قال: حدثنا عبد الله بن إسحاق بن إبراهيم الخراساني قال: حدثنا", "حاشية: (١) أي: يدلكها ويكسبها لتستريح.", "حاشية: (٢) يعني أخاه عمر بن المنكدر، والخبر في سير أعلام النبلاء ٥/ ٣٥٩.", "أحمد بن عبيد بن ناصح قال: حدثنا شبابة بن سوار قال: حدثنا المغيرة بن مسلم عن عطاء عن ابن عباس قال: قال رسول الله ﷺ: «من أمسى مرضيا لوالديه وأصبح أصبح وله بابان مفتوحان من الجنة، ومن أصبح وأمسى مسخطا لوالديه أصبح وأمسى وله بابان مفتوحان إلى النار، وإن واحدا فواحدا» فقال رجل: يا رسول الله، وإن ظلماه؟ فقال: «وإن ظلماه، وإن ظلماه، وإن ظلماه»"]], "ic": "book"}, {"story": ["الباب الثالث في حقوق المسلم والرحم والجوار والملك وكيفية الم (١٥ من ١٦)، ص٤٥٦", ["(١-١)وقال ابن عمر: بكاء الوالدين من العقوق(١-١).", "قال ابن محيريز: من مشى بين يدي أبيه فقد عقه، إلا أن يمشي فيميط الأذى عن طريقه، ومن دعا أباه باسمه أو بكنيته فقد عقه، إلا أن يقول: يا أبة.", "وينبغي للولد أن يتقي المسابة لئلا يكون سببا في سب والديه، فإنه قد روي في الصحيحين من حديث عبد الله بن عمرو عن النبي ﷺ أنه قال: «إن من أكبر الكبائر أن يلعن الرجل والديه» قيل: وكيف يلعن الرجل والديه؟ قال: «يسب أبا الرجل فيسب أباه، ويسب أمه فيسب أمه».", "**حقوق الولد:** لما كانت الطباع تميل عن الوالدين إهمالا احتيج إلى زيادة وصية بهما ولما كانت تميل إلى الولد لم يحتج إلى تأكيد الوصية به، إلا أنه قد يغلب هوى الوالد للولد فيترك تعليمه وتأديبه، وقد قال تعالى: ﴿قُوٓا۟ أَنفُسَكُمْ وَأَهْلِيكُمْ نَارًا﴾ [التحريم: ٦]، قال المفسرون: معناه علموهم وأدبوهم.", "وينبغي للوالد أن يحسن اسم ولده وأدبه، ويعق(٢) عنه إذا ولد، فإذا بلغ سبع سنين أمره بالصلاة، وجنبه قرناءه، فإذا بلغ زوجه.", "**حقوق المملوك:** قد سبق بيان حقوق ملك النكاح، وأما ملك اليمين، فقد روي عن النبي ﷺ أنه قال عند موته: «الصلاة، وما ملكت أيمانكم». وفي الصحيحين من حديث المعرور بن سويد قال: لقيت أبا ذر بالربذة وعليه حلة،", "حاشية: (١-١) سقط من (ظ).", "حاشية: (٢) أي يذبح عنه عقيقة، وهي عن الغلام شاتين وعن الأنثى شاة.", "وعلى غلامه حلة، فسألته عن ذلك، فقال: قال لي النبي ﷺ: «إخوانكم خولكم جعلهم الله تحت أيديكم، فمن كان أخوه تحت يده فليطعمه مما يأكل، وليلبسه مما يلبس، ولا تكلفوهم ما يغلبهم، فإن كلفتموهم فأعينوهم». وفيهما من حديث أبي هريرة عن النبي ﷺ أنه قال: «من قذف مملوكه وهو بريء مما قال جلد يوم القيامة، إلا أن يكون كما قال».", "وفي أفراد البخاري من حديث أبي هريرة عن النبي ﷺ أنه قال: «إذا أتى أحدكم خادمه بطعامه، فإن لم يجلسه معه فليناوله لقمة أو لقمتين، أو أكلة أو أكلتين، فإنه ولي علاجه».", "وأخرج مسلم في أفراده من حديث أبي هريرة عن النبي ﷺ أنه قال: «للمملوك طعامه وكسوته، ولا يكلف من العمل إلا ما يطيق».", "وفي أفراده من حديث أبي مسعود قال: بينا أنا أضرب مملوكا لي إذا رجل ينادي من خلفي: اعلم أبا مسعود، اعلم أبا مسعود، فالتفت فإذا رسول الله ﷺ فقال: «والله لله أقدر عليك منك على هذا» قال: فحلفت أن لا أضرب مملوكا أبدا. وفي لفظ: فقلت: يا رسول الله، هو حر لوجه الله. فقال: «أما لو لم تفعل للفحتك النار».", "وفي أفراده من حديث ابن عمر عن النبي ﷺ أنه قال: «من ضرب غلاما له حدا لم يأته، أو لطمه، فإن كفارته أن يعتقه».", "ودخل رجل على سلمان وهو يعجن، فقال: أتعبنا(١) الخادم في شغل فكرهنا أن نجمع عليه عملين."]], "ic": "book"}, {"story": ["الباب الثالث في حقوق المسلم والرحم والجوار والملك وكيفية الم (١٦ من ١٦)، ص٤٥٧", ["وقيل للأحنف بن قيس: ممن تعلمت الحلم؟ فقال: من قيس بن عاصم. قيل: فما بلغ من حلمه؟ قال: بينما هو جالس في بيته أتته جارية له بسفود(٢) عليه شواء،", "حاشية: (١) في الأصل: «بعثنا».", "حاشية: (٢) السفود: عود من حديد يظم فيه اللحم ليشوى.", "فسقط السفود من يدها على ابن له فمات، فدهشت الجارية، فقال: أنت حرة لا بأس عليك.", "وكان عبد الله بن عون إذا عصاه غلامه قال: ما أشبهك بمولاك، مولاك يعصي مولاه وأنت تعصي مولاك. وأغضبه يوما فقال: إنما تريد أن أضربك، اذهب فأنت حر.", "فجملة حق المملوك أن يطعمه، ويكسوه، ولا يكلفه ما لا يطيق، ولا ينظر إليه بعين الازدراء، وأن يعفو عن زلته، وليتذكر عند زلله زلل نفسه، فيعفو عنه رجاء عفو الله عنه.", "**آخر كتاب آداب الصحبة**"]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "ومن الحقوق العامة أن يحب للمسلمين كافة ما يحب لنفسه، ويكره لهم
