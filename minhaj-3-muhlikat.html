رة نفيسة ساذجة خالية عن كل نقش وصورة، وهو قابل لكل نقش، ومائل إلى كل ما يمال به إليه، فإن عود الخير وعلمه نشأ عليه وشاركه في ثوابه أبواه ومؤدبه، وإن عود الشر وأهمل إهمال البهائم شقي وهلك وكان الوزر في عنق الوالي عليه، وقد قال الله تعالى: ﴿قُوٓا۟ أَنفُسَكُمْ وَأَهْلِيكُمْ نَارًا﴾ [التحريم: ٦]، قال علي بن أبي طالب في تفسيره: علموهم وأدبوهم.", "ولا شك في أن الأب يحذر عليه من أن تصيبه نار الدنيا، فينبغي أن يكون أحذر عليه من نار الأخرى.", "وصيانته بأن يؤدبه ويهذبه ويعلمه محاسن الأخلاق ويحفظه من قرناء السوء، ولا يعوده التنعم، ولا يحبب إليه الزينة وأسباب الرفاهية فيضيع عمره في طلبها إذا كبر، بل ينبغي أن يراقبه من أول عمره، فلا يستعمل في رضاعه وحضانته إلا امرأة صالحة متدينة تأكل الحلال، فإن اللبن الحاصل له من الحرام لا بركة فيه، فإذا نشأ عليه الصبي انعجنت طينته من الخبيث، فمال طبعه إلى ما يناسب ذلك من الخبائث.", "فإذا بدت فيه مخايل(١) التمييز وأولها الحياء، وذلك من إشراق نور العقل عليه، فتلك بشارة النجابة، لأنها تدل على اعتدال الأخلاق وصفاء القلب، وهي مبشرة بكمال العقل عند البلوغ، وهذا يستعان على تأديبه بحياته.", "وأول ما يغلب عليه من الصفات شره الطعام، فينبغي أن يعلم آداب الأكل من التسمية، والأكل باليمين، وتصغير اللقم إلى غير ذلك، ويعود الخبز وحده في", "حاشية: (١) المخايل: الدلائل والمظان.", "بعض الأوقات لئلا يألف الإدام فيراه كالحتم، ويقبح عنده كثرة الأكل، فإنه يشبه الكثير الأكل بالبهائم(١)، ويحبب إليه الثياب البيض(٢) دون الملونة والإبريسم(٣)، ويقرر عنده أن ذلك من شأن النساء والمخنثين، ويمنع من مخالطة الصبيان الذين عودوا التنعم، وعن من يسمعه ما يرغبه في ذلك، فإن الصبي إذا أهمل في ابتداء نشوئه خرج رديء الأخلاق.", "ثم يشتغل في المكتب بتعلم القرآن وأحاديث الأخيار لينغرس في قلبه حب الصالحين، ويحفظ من الأشعار التي فيها ذكر العشق وأهله.", "ومتى ظهر من الصبي خلق جميل أو فعل حميد، فينبغي أن يكرم عليه ويجازى عليه بما يفرح به، ويمدح بين أظهر الناس، فإذا خالف ذلك في بعض الأحوال تغوفل عنه ولم يكاشف، فإن إظهار ذلك ربما يفيده جسارة حتى لا يبالي بالمكاشفة بعد ذلك، فإن عاود عويتب سرا، وخوف من اطلاع الناس عليه، ولا يكثر عليه العتاب؛ لأن ذلك يهون عنده سماع الملامة.", "وليكن الأب حافظا هيبة الكلام معه ولا يوبخه إلا أحيانا.", "وينبغي للأم أن تخوفه بالأب، وتزجره عن القبائح."]], "ic": "book"}, {"story": ["كتاب رياضة النفس وتهذيب الخلق ومعالجة أمراض القلب (١٤ من ١٦)، ص٦١٩", ["وينبغي أن يمنع النوم نهارا، فإنه يورث الكسل، ولا يمنع النوم ليلا، ولكن يمنع الفرش الوطيئة(٤) لتتصلب أعضاؤه ولا يسخف(٥) بدنه فلا يصبر عن التنعم، بل يعود الخشونة في المفرش والملبس والمطعم، ويعود في بعض النهار المشي والحركة والرياضة لئلا يغلب عليه الكسل، ويمنع أن يفتخر على أقرانه بشيء مما يملكه والداه أو بمطاعمه وملابسه، ويعود التواضع والإكرام لمن عاشره، ويمنع أن", "حاشية: (١) في الأصل: (بأن يشبه بالبهائم).", "حاشية: (٢) في الأصل: (البياض).", "حاشية: (٣) الإبريسم: أحسن الحرير.", "حاشية: (٤) الوطيئة: اللينة.", "حاشية: (٥) يسخف: يرق ويلين.", "يأخذ شيئا من صبي مثله، ويعلم أن الأخذ لؤم ودناءة، وأن الرفعة في الإعطاء والجود، ويقبح عنده حب الذهب والفضة.", "ويعود أن لا يبصق في مجلسه، ولا يتثاءب، ولا يمتخط بحضرة غيره، ولا يستدبر أحدا، ولا يضع رجلا على رجل.", "ويمنع من كثرة الكلام ويعود أن لا يتكلم إلا جوابا، وأن يحسن الاستماع إذا تكلم غيره ممن هو أكبر منه، وأن يقوم لمن فوقه، ويجلس بين يديه، ويمنع من لهو الكلام وفحشه ومن مخالطة من يفعل ذلك.", "وأصل تأديب الصبيان حفظهم من قرناء السوء.", "ويحسن أن يسمح له بعد خروجه من المكتب في لعب جميل يستريح به من تعب التأديب، كما قيل: روحوا القلوب تعي الذكر(١).", "وينبغي أن يعلم طاعة والديه ومعلمه وتعظيمهم، وإذا بلغ سبع سنين أمر بالصلاة ولم يسامح في ترك الطهارة ليتعود، ويخوف من الكذب والخيانة، وإذا قارب البلوغ ألقيت إليه أسرار الأمور.", "وأعلم أن الأطعمة أدوية، ومقصودها تقوية البدن على طاعة الله، وأن الدنيا لا بقاء لها، وأن الموت يقطع نعيمها، وهو منتظر في كل ساعة، وأن العاقل من تزود لآخرته.", "فإن كان نشوءه صالحا ثبت(٢) هذا في قلبه كما يثبت النقش في الحجر، وإن لم يكن، نبا(٣) هذا عن قلبه.", "وقد قال سهل بن عبد الله: كنت ابن ثلاث سنين وأنا أقوم بالليل أنظر إلى صلاة خالي محمد بن سوار، فقال لي خالي يوما: ألا تذكر الله الذي خلقك؟ قلت:", "حاشية: (١) هو في مصنف ابن أبي شيبة (٣٦١٢٤)، وحلية الأولياء ٣/ ١٠٤، من قول قسامة بن زهير المازني البصري التابعي المتوفى نحو سنة ٨٠ هجرية، ينظر تهذيب الكمال ٢٣/ ٦٠٢.", "حاشية: (٢) في الأصل: (يثبت).", "حاشية: (٣) أي جاوزه ولم يثبت فيه."]], "ic": "book"}, {"story": ["كتاب رياضة النفس وتهذيب الخلق ومعالجة أمراض القلب (١٥ من ١٦)، ص٦٢١", ["كيف أذكره؟ قال: قل بقلبك عند تقلبك في ثيابك ثلاث مرات من غير أن تحرك لسانك: الله معي، الله ناظر إلي، الله شاهدي(١) فقلت ذلك ليالي ثم أعلمته، فقال: قلها في كل ليلة سبع مرات. فقلت ذلك ثم أعلمته، فقال: قلها في كل ليلة إحدى عشرة مرة. فقلت ذلك، فوقع في قلبي حلاوته، فلما كان بعد سنة قال لي خالي: احفظ ما علمتك ودم عليه إلى أن تدخل القبر. فلم أزل على ذلك سنين(٢)، فوجدت له حلاوة في سري(٣)، ثم قال لي خالي: يا سهل، من كان الله معه وهو ناظر إليه وشاهده يعصيه؟ إياك والمعصية. ومضيت إلى المكتب وحفظت القرآن وأنا ابن ست سنين أو سبع، ثم كنت أصوم الدهر وقوتي من خبز الشعير، ثم وقعت لي مسألة وأنا ابن ثلاث عشرة سنة، فجئت البصرة وسألت علماءها فلم يشفني أحد، فجئت إلى عبادان(٤) إلى رجل يعرف بأبي حبيب العباداني(٥)، فسألته عنها فأجابني، فأقمت عنده مدة أنتفع بكلامه، ثم كنت أقوم الليل كله.", "حاشية: (١) في (ظ): (مشاهدي).", "حاشية: (٢) في (ظ): (عشر سنين).", "حاشية: (٣) في الأصل: (قلبي).", "حاشية: (٤) عبادان: جزيرة قرب البصرة.", "حاشية: (٥) واسمه حمزة بن عبد الله.", "**بيان**", "**شروط الإرادة ومقدمات المجاهدة وتدريج المريد في سلوك سبل الرياضة**", "اعلم أن من شاهد الآخرة بقلبه مشاهدة يقين أصبح بالضرورة مريدا حرث(١) الآخرة مشتاقا إليها سالكا سبيلها، مستهينا بالدنيا ولذاتها، فإن من كان معه خرزة فرأى(٢) جوهرة نفيسة لم يبق له رغبة في الخرزة، فإذا قيل له: بعها بالجوهرة أسرع.", "فمن رزقه الله تعالى الانتباه لذلك، فليعلم أن لذلك شرطا لابد من تقديمه في بداية الإرادة، ومعتصما لابد من التمسك به، وحصنا لابد من التحصن(٣) به ليأمن الأعداء القاطعين عليه الطريق، ووظائف(٤) لابد له من ملازمتها في وقت (٥-٥)سلوك الطريق(٥-٥).", "وأما الشرط الذي لابد من تقدمه؛ فرفع الحجاب الذي يحجبه عن الحق، وهو الذنوب.", "وأما المعتصم؛ فشيخ يدله على الطريق لئلا تتخطفه الشياطين في السبل.", "وأما الحصن، فالخلوة، وبها يحصل الصمت عن الفضول، وغض البصر عما يشغل القلب، ويصفو الفكر للنظر(٦) في الأخلاق فيدفع منها ما يؤذي ويقوم ما مال.", "حاشية: (١) تصحفت في (ظ) إلى: (حزب).", "حاشية: (٢) في الأصل: (فاري).", "حاشية: (٣) في الأصل: (التحصين).", "حاشية: (٤) في الأصل: (وضائف).", "حاشية: (٥-٥) سقط من الأصل.", "حاشية: (٦) في الأصل: (عن النظر).", "وأما الوظائف، فمخالفة الهوى وكثرة الذكر والاقتصاد في الأوراد، ومنتهى الرياضة أن يجد قلبه مع الله أبدا، ولا يمكن ذلك، إلا بأن يخلو من غيره، ولا يخلو إلا بطول المجاهدة، فهذا منهاج رياضة المريد وترتيبه في التدريج."]], "ic": "book"}, {"story": ["كتاب رياضة النفس وتهذيب الخلق ومعالجة أمراض القلب (١٦ من ١٦)، ص٦٢٣", ["فأما تفصيل الرياضة في كل صفة، فسيأتي بيانه، فإن أغلب الصفات على الإنسان شهوة بطنه وفرجه ولسانه، ثم الغضب الذي هو كالجند لحماية الشهوات، ثم مهما أحب الإنسان شهوة البطن والفرج وأنس بها أحب الدنيا ولا يتمكن منها إلا بالمال والجاه، وإذا طلب المال والجاه حدث فيه الكبر والعجب والرياسة، فإذا ظهر ذلك ولم تسمح نفسه بترك الدين رأسا تمسك من الدين بما فيه الرياسة وغلب عليه الغرور.", "وها نحن نستكمل ربع المهلكات بالكتب التي وعدنا بها في أول كتابنا هذا، ونختمها بكتاب الغرور وتعرف طرق المعالجة(١)، فإن ما ذكرناه في الكتاب الأول من هذا الربع(٢) شرح لصفات القلب الذي هو معدن صورة المنجيات والمهلكات، وما ذكرناه في الكتاب الثاني(٣)، إشارة كلية إلى طريق تهذيب الأخلاق ومعالجة أمراض القلوب.", "وأما تفصيلها، ففي هذه الكتب الآتية يأتي إن شاء الله تعالى.", "**آخر كتاب رياضة النفس**", "حاشية: (١) في الأصل: (المجاهدة).", "حاشية: (٢) يعني كتاب شرح عجائب القلب.", "حاشية: (٣) يعني كتاب رياضة النفس وتهذيب الأخلاق."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "يترك المداهنة فيخبر بالعيب أو يترك الحسد فلا يزيد على القدر الواجب، فإن المداهن يخفي بعض عيوبك، والحسود يرى ما ليس بعيب عيبا، وقد كان السلف يحبون من ينبههم على عيوبهم، ونحن الآن أبغض الناس إلينا من يعرفنا عيوبنا، وهذا دليل على ضعف إيماننا؛ لأن الأخلاق السيئة كالعقارب، ولو أن منبها نبهنا على أن تحت ثوب أحدنا ____ لتقلدنا له منة واشتغلنا بقتل العقرب، وإنما نكاية لدغها على البدن ولا يدوم ألمها أكثر من يوم، ونكاية الأخلاق الرديئة على القلب، وألمها في الآخرة دائم، فكوننا لا نفرح بقول من ينبهنا عليها دليل على ضعف الإيمان", "o": ["عقربا", "يرفل", "أفراد", "وفريد"], "h": "راجع: ص٦١٢"}, {"t": "fill", "d": 2, "q": "أما بعد، فالخلق الحسن صفة الأنبياء والصديقين، والأخلاق السيئة سموم قاتلة تنخرط بصاحبها في سلك الشيطان، وأمراض ____ حياة الأبد، فينبغي تعرف العلل ثم التشمير في معالجتها", "o": ["تفوت", "خمسة", "فسبه", "ووقع"], "h": "راجع: ص٥٩٥"}, {"t": "fill", "d": 2, "q": "وكشف الحقيقة في هذا أن يقال: كثير ما يستعمل ذكر الخلق مع الخلق، فيقال: فلان حسن الخلق والخلق. أي: حسن ____", "o": ["الظاهر", "والوعظ", "مؤثر", "مجاري"], "h": "راجع: ص٥٩٧"}, {"t": "fill", "d": 2, "q": "وقد وصف رسول الله ﷺ المؤمن بصفات كثيرة وأشار بجميعها إلى محاسن ____، ففي الصحيحين من حديث أنس عن النبي ﷺ أنه قال", "o": ["الأخلاق", "لانكشف", "أصلحت", "بخطيئة"], "h": "راجع: ص٦١٥"}, {"t": "fill", "d": 2, "q": "قد عرفت أن الاعتدال في الأخلاق هو صحة في النفس والميل عن الاعتدال سقم ومرض، فاعلم أن مثال النفس في علاجها بمحو الرذائل وكسب الفضائل مثال البدن، وعلاجه بمحو العلل عنه واكتساب الصحة له وجلبها إليه، فكما أن الغالب على أصل المزاج الاعتدال والعلة عارضة، فكذلك كل مولود يولد على الفطرة، وإنما أبواه ____ وينصرانه، وذلك بالتعويد والتعليم", "o": ["يهودانه", "والصداع", "الأعمال", "الرمانة"], "h": "راجع: ص٦٠٦"}, {"t": "fill", "d": 2, "q": "ويعود أن لا يبصق في مجلسه، ولا يتثاءب، ولا يمتخط بحضرة غيره، ولا يستدبر أحدا، ولا يضع ____ على رجل", "o": ["رجلا", "وكتابا", "وقضاء", "حقنا"], "h": "راجع: ص٦٢٠"}]}], "sum": [["الصفحات", "ص٥٩٥ - ص٦٢٤"]], "_nq": 18}, {"id": "l5", "title": "كتاب كسر الشهوتين شهوة البطن وشهوة الفرج", "group": "كتاب كسر الشهوتين شهوة البطن وشهوة الفرج", "map": {"center": "كتاب\nكسر الشهوتين", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "كتاب كسر الشهوتين شهوة البطن وشهوة الفرج - القسم ١ من ٢", "b": [{"pic": ["books", "book"], "cap": "ص٦٢٥ - ص٦٤٤"}, {"story": ["كتاب كسر الشهوتين شهوة البطن وشهوة الفرج (١ من ١١)، ص٦٢٥", ["وهو الكتاب الثالث من ربع المهلكات", "الحمد لله الحكيم فيما يقضيه(١)، العادل فيما يمضيه، الكريم فيما يسديه، العليم بما يسره العبد ويبديه، فهو الذي يمرضه ويشفيه، وهو الذي يميته ويحييه، وهو الذي يطعمه ويسقيه، سلط عليه شهوة البطن ليحصل غذاءه مما يشتهيه، وشهوة الفرج ليظهر خلفه كما كان خلفا لأبيه، وأمره برد اشتطاطهما يمتحنه ويبتليه، لينظر كيف يطيعه وينزجر عن معاصيه.", "أحمده على نعمه الوافرة وأياديه، وأقر له بالتوحيد عن ترو لا عن بديه، وأصلي على نبيه النبيه(٢) ورسوله الوجيه، صلاة تزلفه لديه وتخطيه وترفع منزلته وتعليه، وعلى آله وأصحابه وتابعيه، وتدوم إلى يوم يفر المرء من أخيه، وأمه وأبيه، وسلم تسليما كثيرا.", "أما بعد؛ فإن من أعظم المهلكات شهوة البطن(٣)، فبها أخرج آدم من الجنة، والبطن ينبوع الآفات؛ لأن من شهوته تحدث شهوة الفرج، ثم ينبع شهوة المطعم", "حاشية: (١) في الأصل: (يقضيه).", "حاشية: (٢) تصحفت في الأصل إلى: (البنية).", "حاشية: (٣) بعدها في (ظ): (والفرج).", "والمنكح شدة الرغبة في المال والجاه، ثم يتبع ذلك أنواع الرعونات من المنافسة والحسد والتفاخر والكبر ويتداعى الأمر في ذلك إلى الحقد والعداوة، ثم يفضي بصاحبه إلى اقتحام الفحشاء والمنكر، وكل ذلك متولد من بطر الشبع.", "وإذ قد بان عظم آفة شهوة البطن وجب شرح غوائلها وآفاتها، وإيضاح طريق(١) المجاهدة لها، ونحن نوضح ذلك بعون الله تعالى في فصول يجمعها بيان فضيلة الجوع، ثم فوائد الجوع، ثم طريق الرياضة في التقلل، ثم بيان اختلاف حكم الجوع وفضيلته باختلاف أحوال الناس، ثم بيان الرياء في ترك الشهوة، ثم القول في شهوة الفرج، (٢-٢)ثم بيان ما يصلح للمريد من النكاح وتركه، ثم بيان فضيلة من يخالف شهوة الفرج(٢-٢) والعين.", "حاشية: (١) في الأصل: (طرق).", "حاشية: (٢-٢) سقط من (ظ).", "**بيان**", "**فضيلة الجوع وذم الشبع**", "أخبرنا عبد الأول قال: أخبرنا الداودي قال: أخبرنا ابن أعين قال: حدثنا الفربري قال: حدثنا البخاري قال: حدثنا إسماعيل قال: حدثنا مالك عن أبي الزناد عن الأعرج عن أبي هريرة قال: قال رسول الله ﷺ: «يأكل المسلم في معى واحد، والكافر في سبعة أمعاء».", "قال البخاري: وحدثنا محمد بن يسار، قال: حدثنا عبد الصمد قال: حدثنا شعبة عن واقد بن محمد عن نافع قال: كان ابن عمر لا يأكل حتى يؤتى بمسكين يأكل معه فأدخلت رجلا يأكل معه فأكل كثيرا، فقال: يا نافع، لا تدخل هذا علي، فإني سمعت رسول الله ﷺ يقول: «المؤمن يأكل في معى واحد، والكافر يأكل في سبعة أمعاء». أخرجاه والذي قبله في الصحيحين.", "وفي الصحيحين من حديث أبي هريرة عن النبي ﷺ أنه قال: «طعام الاثنين كافي الثلاثة، وطعام الثلاثة كافي الأربعة».", "وفي أفراد مسلم من حديث جابر عن النبي ﷺ مثله، وزاد: «وطعام الأربعة يكفي الثمانية»."]], "ic": "book"}, {"story": ["كتاب كسر الشهوتين شهوة البطن وشهوة الفرج (٢ من ١١)، ص٦٢٧", ["أخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد، قال: حدثني أبي، قال: حدثنا أبو المغيرة قال: حدثنا سليمان بن سليم الكناني قال: حدثنا يحيى بن جابر الطائي قال: سمعت المقدام بن معدي كرب يقول: سمعت رسول الله ﷺ يقول: «ما ملأ آدمي وعاء شرا من بطن، حسب ابن آدم أكلات يقمن صلبه، فإن كان لا محالة فثلث لطعامه وثلث لشرابه وثلث لنفسه».", "قال الإمام أحمد: وحدثنا محمد بن جعفر، قال: حدثنا شعبة، قال: سمعت أبا إسرائيل يقول: سمعت جعدة قال: سمعت رسول الله ﷺ ورأى رجلا سمينا، فجعل النبي ﷺ يومئ إلى بطنه بيده ويقول: «لوكان هذا في غير هذا لكان خيرا لك».", "وقال رجل لابن عمر: أجعل لك جوارش(١)؟ قال: وأي شيء الجوارش؟ قال: شيء، إذا كظك(٢) الطعام وأصبت منه سهل عليك. فقال ابن عمر: ما شبعت من الطعام منذ أربعة أشهر، وما ذاك أن لا أكون له واجدا، ولكني عهدت قوما يشبعون مرة ويجوعون أخرى.", "وقيل لسمرة: إن ابنك لم ينم الليلة. قال: أبشما(٣)؟ قيل: بشما. قال: لو مات لم أصل عليه.", "وقال عقبة الراسبي: دخلت على الحسن(٤) فوافقته يتغدى، فقال: هلم. فقلت: أكلت حتى لا أستطيع أن آكل. فقال: سبحان الله وأيأكل المسلم حتى لا يستطيع أن يأكل؟", "**فصل**", "واعلم أنه قد رويت في هذا المعنى أحاديث لا تثبت فتتكبناها.", "وقد بالغ جماعة من الزهاد والصوفية في التقلل والصبر على الجوع وأمروا به، وحثوا عليه، وكل ذلك من سوء الفهم للمقصود، وقد بينا عيب ما سلكوا في كتابنا المسمى بتلبيس إبليس، وهذا الكتاب قد ضمنا تنزيهه عن ذكر ما لا يصلح لئلا يذهب الزمان ببيان رد الفاسد، وأودعنا بيان الغلط المذكور من ذلك في الكتاب", "حاشية: (١) الجوارش: معجون فارسي معرب، معناه بالعربية: الهاضوم، لأنه يستعمل لإصلاح المعدة والأطعمة وتحليل الرياح قصد السبيل فيما في اللغة العربية من الدخيل ١/ ٤٠٢.", "حاشية: (٢) كظك الطعام: ملأ بطنك حتى لا تكاد تطيق النفس.", "حاشية: (٣) البشم: الإكثار من الطعام حتى التخمة.", "حاشية: (٤) يعني الحسن البصري.", "الذي صنف هذا الكتاب عليه في كتاب آخر(١)، ونحن نصدع بمر الحق من غير محاباة، فنقول:", "اعلم أن الله عز وجل جعل قوام هذا البدن بالأغذية، وأقام الشهوة تحث على تناولها، إلا أن للأغذية انبساطا في المعى بعد التناول، فينبغي للإنسان أن يرفع يده عن الطعام وهو يشتهيه بعض الشهوة؛ لأنه ينبسط في المعدة فيذهب أثر ذلك المتقاضي.", "فأما الشبع فإنه يؤذي؛ لأنه تناول بما تقتضيه الشهوة، فإذا انبسط الطعام تأذى المتناول، فلذلك ذم، وهو يوجب رهل البدن(٢) وتكاسله وكثرة النوم وبلادة الذهن وذلك(٣) بتكثير البخار في الدماغ حتى يغطي مكان الفكر وموضع الذكر، ويجلب أمراضا أخر(٤)."]], "ic": "book"}, {"story": ["كتاب كسر الشهوتين شهوة البطن وشهوة الفرج (٣ من ١١)، ص٦٢٩", ["ومقام العدل رفع اليد مع بقاء شيء من الشهوة، ونهاية المقام الحسن قول النبي ﷺ: «ثلث طعام، وثلث شراب، وثلث نفس». : فالأكل على مقام العدل يصح البدن وينفي المرض، وذلك أن لا يتناول الطعام حتى يشتهيه، ثم يرفع يده وهو يشتهيه، فمن قصر عن هذه الحالة بقي في نفسه المنازعة إلى الطعام، فشغل ذلك قلبه، كما لو كان عنده وقت أكله كلب فلم يلق إليه، فإنه لا يهنيه الأكل.", "ثم الدوام على التقلل يضعف القوى، فإن عرض جهاد لم يجد قوة، وإن كانت له زوجة لم يمكن قضاء حقها، وإن افتقر إلى كسب لم يقدر على القيام به.", "وقد قلل أقوام مطاعمهم حتى قصروا عن الفرائض، وظنوا بجهلهم أن ما فعلوه فضيلة، وليس كذلك، فإنها حالة ما سلكها رسول الله ﷺ ولا أصحابه، وإنما كانوا", "حاشية: (١) يريد المصنف كتابه (إعلام الأحياء بأغلاط الإحياء) ينظر ما تقدم في الصفحة ٨.", "حاشية: (٢) أي: استرخاؤه وسمنه.", "حاشية: (٣) ليست في (ظ).", "حاشية: (٤) ليست في (ظ).", "يجوعون إذا لم يجدوا، وربما وجدوا وآثروا، وكانوا لا يشبعون إذا أكلوا ويذمون البطنة، ويمدحون الجوع إشارة منهم إلى الحالة المتوسطة التي ذكرناها(١).", "فأما التقلل المحكي عن الجاهلين بأحوال السلف وأوضاع الحكم مثل أن أحدهم كان يزن قوته بكربة(٢)، فتنشف كل يوم، وآخر قلل حتى وقف على رغيف في كل يوم، فهذا إلى النهي والكراهة أقرب منه إلى الفضيلة.", "وقد كره العلماء التقلل منهم: الإمام أحمد، فقال: لا يعجبني.", "وحكي عن ابن مهدي أن قوما تقللوا فقطعهم عن الفرض، وهذا لما ذكرنا من أن التقلل يضعف القوى، ثم هو موجب لتنشيف الرطوبات، ويبس الدماغ فيخرج الإنسان إلى الخيالات الفاسدة، وربما خرج إلى الجنون.", "فهذه أحوال مسروقة من الترهبن لقرب عهد هذه الشريعة بتلك.", "والاعتبار ينبغي أن يكون بحالة نبينا ﷺ وأصحابه، فما منهم من سلك هذه الطريق، إلا أنه قد نقل عن ابن الزبير أنه كان يبقى أياما لا يأكل، وهذا يحتمل أن يكون عادة له، ويحتمل أن يكون لا يأكل الخبز ويقنع بغيره، فإن العرب ربما اقتنعت بالتمرات أو بشربة لبن عن الخبز، ويحتمل أن يكون ذلك في حالة قتاله ومحاصرته(٣)، فهي قضية في عين محتملة.", "حاشية: (١) في (ظ): (التي أشرنا إليها).", "حاشية: (٢) الكربة: هي أصل السعفة الغليظة التي تيبس فتصير مثل الكتف. اللسان (كرب)، والمخصص لابن سيده ١١/ ١٠٦، والمقصود أنه يزن طعامه بالكربة الرطبة فيكون كثيرا، ثم في كل يوم تنشف الكربة ويخف وزنها وبالتالي يخف وزن طعامه الذي يأكله، وقد ذكر ذلك المصنف في صيد الخاطر: ٥٧.", "حاشية: (٣) وذلك في سنة (٧٣) هجرية عندما حاصره الحجاج بن يوسف الثقفي في مكة لكي ينزل تحت طاعة عبد الملك بن مروان، ودام الحصار نحو خمسة أشهر ونصف إلى أن أصابته ضربة منجنيق فمات منها رحمه الله تعالى. ينظر البداية والنهاية ١٢/ ١٧٧ وما بعدها.", "**بيان**"]], "ic": "book"}, {"story": ["كتاب كسر الشهوتين شهوة البطن وشهوة الفرج (٤ من ١١)، ص٦٣١", ["**طريق الرياضة في كسر شهوة البطن**", "من تعود استدامة الشبع فينبغي له أن يقلل من مطعمه يسيرا يسيرا مع الزمان إلى أن يقف على(١) حد لا ينقص فيه قوته ولا يضعف بدنه.", "فأما التقلل الذي يضعف القوى فقد بينا وجه ذمه، فلا يلتفت إلى كلام من مدحه.", "حاشية: (١) في الأصل: (في).", "**بيان**", "**اختلاف حكم الجوع وفضيلته باختلاف أحوال الناس**", "اعلم أن المطلوب الأقصى في جميع الأحوال والأخلاق الوسط، إذ خير الأمور أوساطها، وما جاء في المنقولات مما قد أوردنا بعضه من فضائل الجوع إنما المراد به التوسط، إلا أن من أسرار الشرع أنه إذا رأى الطبع مائلا بالكلية إلى فن يطلب فيه الغرض الأقصى جاء بالمبالغة في المنع، فظن الجاهل أن المراد مضادة ما يقتضيه الطبع بغاية الإمكان، فأما العالم فيعلم أن المقصود الوسط، وإنما نظر إلى غاية فقابلها بغاية ليتقابل الباعث والمانع، فيتقاومان، فيحصل الاعتدال.", "وهذا القدر خفي عن جهال المتزهدين، فبالغوا في التقلل قصدا للتقرب، وإنما قربوا من الظلم؛ لأن الذي طلبوه من بقاء البدن بلا غذاء أو بيسير لا يمكن؛ لأنه موضوع على خلاف هذا، فالأولى في الأكل تناول مالا يثقل عن العبادة ولا يمنع من الطاعة، ويكون سببا لبقاء القوة، فلا يحس المتناول بجوع ولا شبع، فحينئذ يصح البدن، ويجتمع(١) الهم، ويصفو الفكر.", "حاشية: (١) في (ظ): (يجتمع).", "**بيان**", "**آفة الرياء المتطرق إلى من يترك أكل الشهوات أو يقلل الأكل**", "اعلم أن تارك الشهوات تدخل عليه آفتان عظيمتان هما أعظم من أكل الشهوات:", "**إحداهما**: أن لا يقدر على ترك بعض الشهوات ويريد أن لا يعرف بأنه يشتهيها، فيأكلها في الخلوة، وهذا شرك خفي، بل ينبغي(١) له إذا ابتلي بذلك أن يظهره فيكون إظهاره بدلا عن المجاهدة بالترك، وقد كان أهل المعرفة على ضد هذا، كان أحدهم يشتري الشهوة ويعلقها في بيته وهو زاهد فيها ليستر زهده، وهذا هو الزهد في الزهد بإظهار ضده، وهو عمل الصديقين؛ لأنه تجريع للنفس كأس الصبر مرتين، والثانية أمر.", "**والآفة الثانية**: أن يشتهي أن يشتهر بترك الشهوة، فهذا قد خالف شهوة ضعيفة، وهي شهوة الأكل، وأطاع شهوة هي شر منها، وهي شهوة الجاه، وهي الشهوة الخفية، وكسر هذه الشهوة أولى من كسر الأولى؛ لأن من ترك شهوة الطعام ووقع في شهوة الرياء كمن هرب من عقرب إلى حية، فليتناول منها، فهو أصلح له.", "قال أبو سليمان(٢): إذا قدمت إليك شهوة وكنت تاركا لها فأصب منها يسيرا، ولا تعط نفسك مناها فتكون قد أسقطت عن نفسك الشهرة بالأكل ونغصت(٣) عليها إذ لم تبالغ.", "حاشية: (١) سقطت من الأصل.", "حاشية: (٢) هو أبو سليمان الداراني.", "حاشية: (٣) تصحفت في الأصل إلى: «وتعصب».", "**القول في شهوة الفرج**", "اعلم أن شهوة الوقاع سلطت على الآدمي لفائدتين:"]], "ic": "book"}, {"story": ["كتاب كسر الشهوتين شهوة البطن وشهوة الفرج (٥ من ١١)، ص٦٣٤", ["**إحداهما**: أن يدرك لذة يقيس عليها لذات الآخرة، وما لم يدرك جنسه بالذوق لا يعظم الشوق إليه.", "**والثانية**: بقاء النسل، إلا أنه إذا لم ترد هذه الشهوة إلى حالة الاعتدال جلبت آفات ومحنا، ولولا هذه الشهوة ما كان «النساء حبائل(١) الشيطان»، وقد قال إبليس: سهمي الذي إذا رميت به لم أخطئ: النساء.", "وقد أخبرنا موهوب بن أحمد قال: أخبرنا أبو القاسم بن البسري قال: حدثنا المخلص قال: حدثنا البغوي قال: حدثنا أبو بكر بن أبي شيبة قال: حدثنا أبو خالد الأحمر قال: حدثنا سليمان التيمي عن أبي عثمان عن أسامة بن زيد عن النبي ﷺ قال: «ما تركت في الناس بعدي فتنة أضر على الرجال من النساء»(٢).", "وقال سعيد بن المسيب: ما يئس الشيطان من ابن آدم قط إلا أتاه من قبل النساء. ثم قال وهو ابن تسع وثمانين سنة، وقد ذهبت إحدى عينيه وهو يعشو(٣) بالأخرى: وما شيء عندي أخوف من النساء(٤).", "وقال يوسف بن أسباط: لو ائتمنني رجل على بيت مال لظننت أني أؤدي إليه الأمانة، ولو ائتمنني على زنجية أن أخلو معها ساعة واحدة ما ائتمنت نفسي عليها.", "وقال الثوري: ائتمنني على بيت مملوء مالا، ولا تأتمنني على جارية سوداء لا تحل لي.", "حاشية: (١) الحبائل: جمع حبالة، وهو ما يصاد به من أي شيء كان.", "حاشية: (٢) أخرجه أحمد في المسند (٢١٨٢٩)، والنسائي في الكبرى (٩٢٧٠) والبزار في مسنده (٢٥٩٦).", "حاشية: (٣) أي: يبصر بها بصرا ضعيفا.", "حاشية: (٤) سير أعلام النبلاء ٤/ ٢٣٧.", "واعلم أنه للخوف من مواقعة هذه الزلة حرمت الخلوة بالأجنبية؛ أخبرنا سعيد ابن أحمد (١-١)بن الحسن(١-١) قال: أخبرنا علي بن أحمد بن البسري قال: أخبرنا المخلص قال: حدثنا البغوي قال: حدثنا الحسن بن عرفة قال: حدثنا جرير بن عبد الحميد عن عبد الملك بن عمير عن جابر بن سمرة قال: خطب عمر بالجابية(٢) فقال: إن رسول الله ﷺ قام في مثل مقامي هذا فقال: «ألا لا يخلون رجل بامرأة، فإن ثالثهما الشيطان».", "وقد روينا أن إبليس لقي موسى عليه السلام فقال له: يا موسى، لا تخل بامرأة لا تحل لك، فإنه ما خلا رجل بامرأة لا تحل له إلا كنت صاحبه دون أصحابي حتى أفتنه بها(٣).", "**فصل**", "واعلم أن هذه الشهوة لها إفراط يقهر العقل حتى يصرف همة الرجل إلى التمتع بالنساء، فيشغله عن ذكر الآخرة، وربما جر إلى الفواحش وقد ينتهي بأربابها إلى أمرين شنيعين:", "**أحدهما**: أن يتناولوا ما يقوي شهواتهم للاستكثار من الوقاع، ومثلهم كمثل من بلي بسباع ضارية فنامت عنه في بعض الأوقات، فاحتال لإثارتها وتهييجها، ثم احتال لمعالجتها، وهؤلاء يحركون أنفسهم لإخراج الحرارة الغريزية، وقل أن يطول بقاؤهم."]], "ic": "book"}, {"story": ["كتاب كسر الشهوتين شهوة البطن وشهوة الفرج (٦ من ١١)، ص٦٣٥", ["**والأمر الثاني**: أنه قد تنتهي هذه الشهوة ببعض أربابها إلى العشق، وهو مجاوزة في البهيمية لحد البهائم؛ لأن المتعشق لم يقنع بإراقة شهوة الوقاع، وهي أقبح الشهوات وأجدرها أن يستحيا منها حتى اعتقد أن الشهوة لا تنقضي إلا من", "حاشية: (١-١) ليس في (ظ).", "حاشية: (٢) الجابية: قرية في الجنوب الغربي من مدينة دمشق.", "حاشية: (٣) أورده المصنف في كتاب (ذم الهوى): ١٦٣.", "محل واحد، والبهيمة تقضي الشهوة أين اتفق وتكتفي به، وهذا لا يكتفي [إلا](١) بمحل واحد معين حتى يزداد بمطلوبه ذلا إلى ذل وعبودية إلى عبودية، وحتى يستسخر العقل لخدمة الشهوة، وإنما خلق العقل ليكون مطاعا لا خادما للشهوة محتالا لها، وما العشق إلا مرض قلب فارغ لا همة له، وإنما يجب الاحتراز من أوائله بترك معاودة النظر والفكر، وإلا فمتى استحكم عسر قلعه، وقد وضعت لهذا كتابا كبيرا سميته بذم الهوى(٢)، وذكرت فيه علاج هذا المرض إذا وقع.", "واعلم أن مثل من يكسر العشق في أول انبعاثه مثل من يصرف عنان الدابة عند توجهها إلى باب لتدخله، وما أهون منعها بصرف عنانها، ومثال من يعالجه بعد استحكامه مثل من يترك الدابة حتى تدخل وتجاوز الباب ثم يأخذ بذيلها يجرها إلى وراء، وما أعظم التفاوت بين الأمرين.", "فليكن الاحتياط في بدايات الأمور، فإن أواخرها يفتقر إلى علاج شديد، وقد لا ينجع، وقد يقع عند خلق من الناس عشق المال والجاه واللعب بالنرد والشطرنج والطيور، فتستولي هذه الأشياء على القلوب فلا يصبرون عنها، وينغص عليهم الدين والدنيا، ومتى أفرطت شهوة الوقاع كسرت بالنكاح تارة وبالجوع أخرى، وفي الصحيحين أن النبي ﷺ قال: «يا معشر الشباب، عليكم بالباءة، فمن لم يستطع فليصم، فإن الصوم له وجاء».", "حاشية: (١) ليست في النسخ، وأثبتت من الإحياء.", "حاشية: (٢) وقد طبع بدار الجيل في بيروت سنة ١٤٢٠هـ - ١٩٩٩م بتحقيق عصام فارس الحرستاني ومحمد إبراهيم الزغلي.", "**بيان**", "**ما على المريد في ترك التزويج وفعله**", "اعلم أن للسلوك حلاوة تشغل المبتدي، قال ابن مسروق: كنت مع الجنيد فمر في بعض دروب بغداد، وإذا مغن يقول:", "منازل كنت تهواها وتألفها  أيام كنت على الأيام منصور", "فبكى وقال: ذكرت بدايتي وجدة سعيي.", "واعلم أنه إذا كشف الحجاب عن قلب المريد في بدايته لهي عن شهوات الدنيا وصارت الخلوة حبيبا له، والصوم أليفا، وجهاد النفس مستلذا، فمتى وجد هذا فليقبل على ما فتح له منه، وليشتغل به حتى يتمكن مما قد حصل له.", "وكذلك طالب العلم ينبغي له أن يجمع همه في الطلب ويؤخر النكاح إلى أن يتمكن مما يريد، فإن الإمام أحمد لم يتزوج حتى بلغ الأربعين سنة، وإنما يفعل هذا مالم يخف على نفسه من فتنة، وعلامة الفتنة ضعفه عن غض بصره(١)، أو وسواس يطرأ على قلبه، وتصوير لنيل هذه الشهوة."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "قال البخاري: وحدثنا محمد بن يسار، قال: حدثنا عبد الصمد قال: حدثنا شعبة عن واقد بن محمد عن نافع قال: كان ابن عمر لا يأكل حتى يؤتى بمسكين يأكل معه فأدخلت رجلا يأكل معه ____ كثيرا، فقال: يا نافع، لا", "o": ["فأكل", "زهدا", "نصرته", "رجوع"], "h": "راجع: ص٦٢٧"}, {"t": "fill", "d": 2, "q": "قال الإمام أحمد: وحدثنا محمد بن جعفر، قال: حدثنا شعبة، قال: سمعت أبا إسرائيل يقول: سمعت جعدة قال: سمعت رسول الله ﷺ ورأى رجلا سمينا، ____ النبي ﷺ يومئ إلى بطنه بيده ويقول: «لوكان هذا في غير هذا لكان", "o": ["فجعل", "ثبتت", "فخذي", "حلية"], "h": "راجع: ص٦٢٨"}, {"t": "fill", "d": 2, "q": "وفي الصحيحين من حديث أبي هريرة عن ____ ﷺ أنه قال", "o": ["النبي", "لكدورة", "والتذلل", "الأمراء"], "h": "راجع: ص٦٤١"}, {"t": "fill", "d": 2, "q": "أحدهما: أن يتناولوا ما يقوي شهواتهم للاستكثار من الوقاع، ومثلهم كمثل من بلي بسباع ضارية فنامت عنه في بعض الأوقات، فاحتال لإثارتها وتهييجها، ثم احتال لمعالجتها، وهؤلاء يحركون ____ لإخراج الحرارة", "o": ["أنفسهم", "بشكل", "وخزائنها", "للخلاص"], "h": "راجع: ص٦٣٥"}, {"t": "fill", "d": 2, "q": "وقال سعيد بن المسيب: ما يئس الشيطان من ابن آدم قط إلا أتاه من قبل النساء. ثم قال وهو ابن تسع وثمانين سنة، وقد ذهبت إحدى عينيه وهو ____ بالأخرى: وما شيء عندي أخوف من", "o": ["يعشو", "يستقبح", "زدتنا", "وأربعة"], "h": "راجع: ص٦٣٤"}, {"t": "fill", "d": 2, "q": "واعلم أنه إذا كشف الحجاب عن قلب المريد في بدايته لهي عن شهوات الدنيا وصارت الخلوة حبيبا له، والصوم أليفا، وجهاد النفس مستلذا، فمتى وجد هذا ____ على ما فتح له منه، وليشتغل به حتى يتمكن مما قد حصل له", "o": ["فليقبل", "يسمعون", "الادعاء", "بطلبك"], "h": "راجع: ص٦٣٧"}]}, {"t": "كتاب كسر الشهوتين شهوة البطن وشهوة الفرج - القسم ٢ من ٢", "b": [{"story": ["كتاب كسر الشهوتين شهوة البطن وشهوة الفرج (٧ من ١١)، ص٦٣٧", ["وإذا كان الجوع والصوم لا يمنع إطلاق البصر ولا يدفع هذه الوسوسة، فليبادر بالنكاح، فقد قال عليه الصلاة والسلام: «زنا العينين النظر»، وأول هذه الآفة النظر.", "وليكن المتعبد حذرا من مجالسة المردان والنظر إليهم، فإن المتعبد قد أغلق باب النظر إلى النساء في الغالب ولاذ به الصبيان للتعلم والطلب، فخطره في ذلك أعظم من خطر النساء.", "حاشية: (١) في الأصل: (البصر).", "وقد قال بعض التابعين: ما أنا بأخوف على الشاب التائب من سبع ضار(١) من غلام أمرد يجلس إليه، وقد ذكرنا في هذا بابا طويلا في كتاب ذم الهوى.", "ومعلوم قوة الفتنة بهذا الفن فكم قد زل فيها من متعبد.", "ومن أراد النكاح لتسكين هذه الفورة فلينظر إلى امرأة تعفه، ولينظر في مطلوب نفسه، فإن الناس يتفاوتون، فمنهم من يقنع بأي امرأة كانت، فإن الإمام أحمد خطب امرأة فسمعت بالخطبة أختها وهي عوراء فكأنها انكسرت، فخطب العوراء، وهذا أمر لا يصبر عليه كل أحد، ومن الناس من لا يعفه إلا المستحسن، فيتعين عليه أن يطلب المستحسن، ولكن ينبغي أن يراعي جانب الدين في المرأة أولا، فإن المستحسنة إذا لم يكن لها دين هلكت وأهلكت، ولم يحصل المقصود منها.", "والبكر أولى ما اختير؛ لأنها تنشأ على أخلاق الزوج وتألفه، فليجتهد في تحصيل بكر مستحسنة قد ربيت في بيت أهل دين فقراء، فهذه الغاية، وقد تقدم ما يتعلق بالنكاح في كتابه.", "أخبرنا محمد بن ناصر قال: أخبرنا حمد بن أحمد قال: أخبرنا أبو نعيم أحمد ابن عبد الله قال: حدثنا عمر بن أحمد بن عثمان قال: حدثنا عبد الله بن سليمان بن الأشعث قال: حدثنا أحمد بن عبد الرحمن بن وهب قال: حدثني عمي عبد الله بن وهب، [عن عطاف بن خالد](٢) عن ابن حرملة عن ابن أبي وداعة قال: كنت أجالس سعيد بن المسيب ففقدني أياما، فلما جئته قال: أين كنت؟ قلت: توفيت أهلي فاشتغلت بها. فقال: ألا أخبرتنا فشهدناها، قال: ثم أردت أن أقوم، فقال: هل استحدثت امرأة؟ فقلت: يرحمك الله ومن يزوجني وما أملك إلا درهمين أو ثلاثة؟ فقال: أنا. فقلت: أو تفعل؟ قال: نعم، ثم حمد الله وصلى على النبي ﷺ وزوجني على درهمين - أو قال: ثلاثة - فقمت وما أدري ما أصنع من الفرح، فصرت إلى منزلي وجعلت أتفكر ممن آخذ وممن أستدين، فصليت المغرب", "حاشية: (١) السبع الضاري: المولع بأكل اللحم.", "حاشية: (٢) ما بين معقوفين سقط من النسخ، واستدرك من المصادر."]], "ic": "book"}, {"story": ["كتاب كسر الشهوتين شهوة البطن وشهوة الفرج (٨ من ١١)، ص٦٣٩", ["وانصرفت إلى منزلي وكنت وحدي صائما، فقدمت عشائي لأفطر وكان خبزا وزيتا، فإذا بالباب يقرع، فقلت: من هذا؟ فقال: سعيد. قال: ففكرت في كل إنسان اسمه سعيد إلا سعيد بن المسيب فإنه لم ير أربعين سنة إلا بين بيته والمسجد، فقمت فخرجت فإذا سعيد بن المسيب، فظننت أنه قد بدا له فقلت: يا أبا محمد، ألا أرسلت إلي فآتيك(١)؟ قال: لا، أنت أحق أن يؤتى. قلت: فما تأمر؟ فقال: إنك كنت رجلا عزبا فتزوجت، فكرهت أن تبيتك الليلة وحدك، وهذه امرأتك. فإذا هي قائمة من خلفه في طوله، ثم أخذ بيدها فدفعها في الباب ورد الباب، فسقطت المرأة من الحياء، فاستوقفت من الباب ثم تقدمتها إلى القصعة التي فيها الزيت والخبز، فوضعتها في ظل السراج لكي لا تراه، ثم صعدت إلى السطح فرميت الجيران فجاءوني فقالوا: ما شأنك؟ قلت: ويحكم زوجني سعيد بن المسيب ابنته اليوم وقد جاء بها على غفلة. فقالوا: سعيد بن المسيب زوجك؟! قلت: نعم، وهو ذا هي في الدار. فنزلوا إليها وبلغ أمي فجاءت وقالت: وجهي من وجهك حرام إن مسستها قبل أن أصلحها إلى ثلاثة أيام. قال: فأقمت ثلاثا ثم دخلت بها، فإذا هي من أجمل الناس، وإذا هي أحفظ الناس لكتاب الله عز وجل وأعلمهم بسنة رسول الله ﷺ وأعرفهم بحق زوج. قال: فمكثت شهرا لا يأتيني سعيد ولا آتيه، فلما كان قرب الشهر أتيت سعيدا وهو في حلقته، فسلمت عليه فرد علي السلام ولم يكلمني حتى تقوض(٢) أهل المجلس، فلما لم يبق غيري قال: ما حال ذلك الإنسان؟ قلت: خيرا يا أبا محمد، على ما يحب الصديق ويكره العدو. قال: إن رابك شيء فالعصا. وانصرفت إلى منزلي فوجه إلي بعشرين ألف درهم(٣).", "قال عبد الله بن سليمان(٤): وكانت بنت سعيد بن المسيب قد خطبها عبد الملك بن مروان لابنه الوليد حين ولاه العهد فأبى سعيد أن يزوجه، فلم يزل عبد", "حاشية: (١) في الأصل: (فأتيتك).", "حاشية: (٢) تقوض: تفرق.", "حاشية: (٣) القصة في حلية الأولياء ٢/ ١٦٧ - ١٦٩، والمنتظم للمصنف ٦/ ٣٢٤ - ٣٢٥، ووفيات الأعيان ٢/ ٣٧٦ - ٣٧٧، وسير أعلام النبلاء ٤/ ٢٣٣ - ٢٣٤.", "حاشية: (٤) هو عبد الله بن سليمان بن الأشعث راوي القصة.", "الملك يحتال على سعيد حتى ضربه مئة سوط في يوم بارد، وصب عليه جرة ماء، وألبسه جبة صوف.", "قال عبد الله: وابن أبي وداعة هذا هو كثير بن المطلب بن أبي وداعة(١).", "حاشية: (١) هو كثير بن المطلب بن أبي وداعة، أبو سعيد السهمي القرشي المكي، تنظر ترجمته في التاريخ الكبير للبخاري ٧/ ٢٠٨، والثقات لابن حبان ٥/ ٣٣١، وتهذيب الكمال ٢٤/ ١٦١.", "**بيان**", "**فضيلة من يخالف(١) شهوة الفرج والعين**"]], "ic": "book"}, {"story": ["كتاب كسر الشهوتين شهوة البطن وشهوة الفرج (٩ من ١١)، ص٦٤١", ["شهوة الفرج أغلب الشهوات وأعصاها على العقل إذا هاجت، فمن امتنع عن مواقعتها في الحرام للحياء من الخلق أو لخوفهم أو لحفظ منصبه، فلا ثواب له في امتناعه؛ لأنه آثر حظا من حظوظ النفس على حظ آخر، إلا أن من العصمة أن لا يقدر، وقد أفادته هذه العوائق دفع الإثم، وإنما الفضل والأجر في ترك الحرام مع القدرة خوفا من الله عز وجل، قال الله تعالى: ﴿وَلِمَنْ خَافَ مَقَامَ رَبِّهِۦ جَنَّتَانِ﴾ [الرحمن: ٤٦]، قال مجاهد: هو الذي إذا هم بمعصية ذكر مقام ربه عليه فيها فانتهى(٢).", "وفي الصحيحين من حديث أبي هريرة عن النبي ﷺ أنه قال: «سبعة يظلهم الله عز وجل في ظله يوم لا ظل إلا ظله. . » فعد منهم رجلا دعته امرأة ذات منصب وجمال إلى نفسها فقال: إني أخاف الله عز وجل.", "وفي الصحيحين من حديث ابن عمر عن النبي ﷺ: «أن ثلاثة نفر دخلوا غارا فانحطت على فم غارهم صخرة من الجبل فأطبقت عليهم، فقال بعضهم لبعض: انظروا أعمالا عملتموها لله صالحة فادعوه بها لعله يفرج عنكم. فقال أحدهم: اللهم إنه كانت لي ابنة عم أحبها كأشد ما يحب الرجال النساء، فطلبت إليها نفسها فأبت حتى آتيها بمئة دينار، فسعيت حتى جمعت مئة دينار، فلما قعدت بين رجليها قالت: يا عبد الله، اتق الله ولا تفض(٣) الخاتم إلا بحقه. فقمت عنها، اللهم إن كنت تعلم أني فعلت ذلك ابتغاء وجهك فافرج لنا منها، ففرج لهم منها فرجة» وذكر قصة الآخرين.", "حاشية: (١) في الأصل: (يخاف).", "حاشية: (٢) تفسير الطبري ٢٢/ ٢٣٦، وأورده المصنف في كتاب ذم الهوى: ٢٥٦.", "حاشية: (٣) في (ظ): (تفتح).", "وقد روينا عن سليمان بن يسار(١) أن امرأة دخلت إليه فسألته نفسه، فامتنع عليها، فقالت له: أدن، فخرج هاربا من منزله، وتركها فيه، فرأى في منامه يوسف النبي (٢-٢)على نبينا و(٢-٢) عليه السلام، فقال: أنت يوسف؟ قال: نعم أنا يوسف الذي هممت، وأنت سليمان الذي لم تهم(٣)."]], "ic": "book"}, {"story": ["كتاب كسر الشهوتين شهوة البطن وشهوة الفرج (١٠ من ١١)، ص٦٤٢", ["وروينا عن أحمد بن سعيد العابد عن أبيه قال: كان عندنا بالكوفة شاب متعبد ملازم للمسجد الجامع لا يكاد يخرج منه، وكان حسن الوجه، فنظرت إليه امرأة ذات جمال وعقل فشغفت به، وطال ذلك عليها(٤) فوقفت له يوما على طريقه، فقالت له: يا فتى اسمع مني كلمات. فمضى ولم يكلمها، ثم وقفت له بعد ذلك على طريقه، فقالت: اسمع مني كلمات. فأطرق وقال: هذا موقف تهمة وأنا والله(٥) أكره أن أكون للتهمة موضعا. فقالت له: والله ما وقفت موقفي هذا جهالة مني بأمرك، وأنتم معشر العباد في مثال القوارير إلا أن جملة ما أكلمك به أن جوارحي كلها مشغولة بك، فالله الله في أمري وأمرك. فمضى الشاب إلى منزله وأراد أن يصلي فلم يعقل كيف يصلي فأخذ قرطاسا وكتب كتابا وخرج، فإذا المرأة واقفة، فألقى إليها الكتاب ورجع، وكان في الكتاب: اعلمي أيتها المرأة أن الله تعالى إذا عصي حلم، وإذا عاود العبد المعصية ستر، فإذا لبس العبد للمعصية ملابسها غضب الله تعالى لنفسه غضبة تضيق منها السماوات والأرض، فمن ذا(٦)", "حاشية: (١) هو سليمان بن يسار أبو أيوب المدني مولى أم المؤمنين ميمونة، تنظر ترجمته في طبقات ابن سعد ٥/ ١٧٤، وسير أعلام النبلاء ٤/ ٤٤٤.", "حاشية: (٢-٢) ليس في الأصل.", "حاشية: (٣) حلية الأولياء ٢/ ١٩٠ - ١٩١، وشعب الإيمان (٧١١١) و(٧٢٨٠)، وذكرها المصنف في صفة الصفوة ٢/ ٨٢، وفي كتاب ذم الهوى: ٢٧١، وأوردها الذهبي في السير ٤/ ٤٤٦، وقال: إسنادها منقطع. ومثل هذه الرؤى والأحلام لا تعني تفضيل أحد من العباد والزهاد على أي نبي من الأنبياء عليهم وعلى نبينا الصلاة والسلام، ويوسف عليه السلام لم يقع منه هم البتة بل هو منفي لوجود البرهان، قال تعالى: ﴿وَهَمَّ بِهَا لَوْلَآ أَن رَّءَا بُرْهَٰنَ رَبِّهِۦ﴾ ينظر البحر المحيط لأبي حيان ٥/ ٢٩٥.", "حاشية: (٤) في (ظ): «عليه».", "حاشية: (٥) ليست في (ظ).", "حاشية: (٦) في الأصل: (الذي)."]], "ic": "book"}, {"story": ["كتاب كسر الشهوتين شهوة البطن وشهوة الفرج (١١ من ١١)، ص٦٤٣", ["يطيق غضبه؟ فإن كان ما ذكرت باطلا فإني أذكرك يوما تكون السماء كالمهل، وتكون الجبال كالعهن، وتجثو الأمم لصولة الجبار العظيم، وإني والله قد ضعفت عن إصلاح نفسي فكيف بإصلاح غيري، وإن كان ما ذكرت حقا فإني أدلك على طبيب يداوي(١) الكلوم الممرضة والأوجاع المرمضة(٢)، ذاك الله رب العالمين، فاقصديه على صدق المسألة، فإني متشاغل عنك بقوله تعالى: ﴿وَأَنذِرْهُمْ يَوْمَ ٱلْـَٔازِفَةِ إِذِ ٱلْقُلُوبُ لَدَى ٱلْحَنَاجِرِ كَٰظِمِينَ مَا لِلظَّٰلِمِينَ مِنْ حَمِيمٍ وَلَا شَفِيعٍ يُطَاعُ يَعْلَمُ خَآئِنَةَ ٱلْأَعْيُنِ وَمَا تُخْفِى ٱلصُّدُورُ﴾ [غافر: ١٨ - ١٩]، فأين المهرب من هذه الآية؟ ثم جاءت بعد ذلك بأيام، فوقفت له على طريقه فلما رآها من بعيد أراد أن يرجع(٣) إلى منزله، فقالت: يا فتى لا ترجع، فلا كان الملتقى بعدها أبدا إلا بين يدي الله تعالى. وبكت بكاء كثيرا، وقالت: امنن علي بموعظة أحملها وأوصني بوصية أعمل بها. فقال: أوصيك بحفظ نفسك من نفسك وأذكرك قوله تعالى: ﴿وَهُوَ ٱلَّذِى يَتَوَفَّىٰكُم بِٱلَّيْلِ وَيَعْلَمُ مَا جَرَحْتُم بِٱلنَّهَارِ﴾ [الأنعام: ٦٠]، فأطرقت وبكت بكاء شديدا أشد من بكائها الأول، ثم أفاقت فلزمت بيتها وأخذت في العبادة، فلم تزل على ذلك حتى ماتت كمدا، وكان الفتى يذكرها بعد موتها ويبكي ويقول: إني ذبحت طمعها مني في أول أمرها، وجعلت قطعها ذخيرة لي عند الله عز وجل(٤).", "وقد(٥) ذكرت من هذا الفن الكثير في كتاب ذم الهوى فليطالع من هناك.", "**آخر كتاب كسر الشهوتين**", "حاشية: (١) تحرفت في النسخ إلى: (هذا وولي)، وفي ذم الهوى: (هو أولى) والمثبت من الإحياء.", "حاشية: (٢) المرمضة: المحرقة.", "حاشية: (٣) في (ظ): (الرجوع).", "حاشية: (٤) أوردها المصنف في كتاب ذم الهوى: ٥١١ - ٥١٣.", "حاشية: (٥) قبلها في (ظ): (قال المصنف)."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "أما بعد؛ فإن من أعظم المهلكات شهوة البطن، فبها أخرج آدم من الجنة، والبطن ينبوع الآفات؛ لأن من ____ تحدث شهوة الفرج، ثم ينبع شهوة المطعم", "o": ["شهوته", "مستحسنة", "فالسر", "المخلوق"], "h": "راجع: ص٦٢٥"}, {"t": "fill", "d": 2, "q": "إحداهما: أن لا يقدر على ترك بعض الشهوات ويريد أن لا يعرف بأنه يشتهيها، فيأكلها في الخلوة، وهذا شرك خفي، بل ينبغي له إذا ____ بذلك أن يظهره فيكون إظهاره بدلا عن المجاهدة بالترك، وقد كان أهل", "o": ["ابتلي", "خسران", "فاستبطأ", "بلقب"], "h": "راجع: ص٦٣٣"}, {"t": "fill", "d": 2, "q": "وحكي عن ابن مهدي أن قوما تقللوا فقطعهم عن الفرض، وهذا لما ذكرنا من أن التقلل يضعف القوى، ثم هو موجب لتنشيف الرطوبات، ____ الدماغ فيخرج الإنسان إلى الخيالات الفاسدة، وربما خرج إلى الجنون", "o": ["ويبس", "نظروا", "ولطفه", "ينتمي"], "h": "راجع: ص٦٣٠"}, {"t": "fill", "d": 2, "q": "اعلم أن للسلوك حلاوة تشغل المبتدي، قال ابن ____", "o": ["مسروق", "تراقب", "للمحمدة", "البدنية"], "h": "راجع: ص٦٣٧"}, {"t": "fill", "d": 2, "q": "وقد قال بعض التابعين: ما أنا بأخوف على الشاب التائب من سبع ضار من غلام أمرد يجلس إليه، وقد ذكرنا في هذا بابا طويلا في ____ ذم", "o": ["كتاب", "ونسبه", "وإزاره", "غيرها"], "h": "راجع: ص٦٣٨"}, {"t": "fill", "d": 2, "q": "والمنكح شدة الرغبة في المال والجاه، ثم يتبع ذلك أنواع الرعونات من المنافسة والحسد والتفاخر والكبر ويتداعى الأمر في ذلك إلى الحقد والعداوة، ثم يفضي بصاحبه إلى اقتحام الفحشاء والمنكر، وكل ذلك ____ من بطر الشبع", "o": ["متولد", "فزعا", "فقسمه", "تمكن"], "h": "راجع: ص٦٢٦"}]}], "sum": [["الصفحات", "ص٦٢٥ - ص٦٤٤"]], "_nq": 12}, {"id": "l6", "title": "كتاب آفات اللسان", "group": "كتاب آفات اللسان", "map": {"center": "كتاب\nآفات اللسان", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "كتاب آفات اللسان - القسم ١ من ٥", "b": [{"pic": ["books", "book"], "cap": "ص٦٤٥ - ص٧٠٠"}, {"story": ["كتاب آفات اللسان (١ من ٣٠)، ص٦٤٥", ["وهو الكتاب الرابع من ربع المهلكات", "الحمد لله الذي خلق الإنسان وجمله، ووهب له الإيمان وكمله، وأنزل إليه القرآن وراسله، وعلمه البيان ففضله، وأطلق له بما يريد(١) مقوله، فنطق بشكر ما أعطاه وخوله، وكشف ستر الضمير الذي أسبله وأبرز كل علم حواه وحصله، وكما رب(٢) اللسان أمره فربما قتله.", "أحمده ما كبر عبد أو هلله، وأشهد أن الواحد لا شريك له، وأصلي على رسوله محمد الذي أرسله، ونبيه الذي فخمه وبجله، وعلى من صحبه وتبعه وقبله، وسلم تسليما كثيرا.", "أما بعد؛ فإن اللسان من نعم الله العظيمة، ولطائف صنعه(٣) الغريبة، فإنه صغير جرمه عظيم طاعته وجرمه، إذ لا يتبين الكفر والإيمان - وهما غاية الطاعة والعصيان - إلا بشهادة اللسان، فاللسان متعرض بالموجود والمعدوم والخالق والمخلوق والمظنون والموهوم بالإثبات والنفي وهذه خاصية لا توجد في سائر الأعضاء، فإن العين لا تصل إلى غير الألوان والصور، والأذن لا تصل إلى غير الأصوات، واليد لا تصل إلى غير الأجسام، واللسان ليس لمجاله منتهى، وأعصى", "حاشية: (١) في (ظ): (ما يزيد).", "حاشية: (٢) رب: أصلح.", "حاشية: (٣) في الأصل: (صنعته).", "الأشياء على الإنسان اللسان، فمن أرخى عنانه ساقه إلى البوار، «وهل يكب الناس على مناخرهم في النار إلا حصائد ألسنتهم».", "وقد تساهل أكثر الناس في الاحتراز عن آفاته وغفلوا عن غوائله، ونحن بتوفيق الله تعالى نفصل مجامع آفات اللسان، ونذكر واحدة واحدة منها بحدودها وأسبابها وغوائلها، وتعريف طريق الاحتراز منها، وإيراد ما ورد في ذمها؛ فنذكر أولا فضل الصمت، ونردفه بذكر آفة الكلام فيما لا يعني، ثم آفة فضول الكلام، ثم آفة الخوض في الباطل، ثم آفة المراء والمجادلة، ثم آفة الخصومة، ثم آفة التقعر في الكلام وتكلف التصنع في الفصاحة، ثم آفة الفحش والسب والبذاء، ثم آفة اللعن، ثم آفة الغناء والشعر، ثم آفة المزاح، ثم آفة السخرية والاستهزاء، ثم آفة إفشاء السر، ثم آفة الوعد الكاذب، ثم آفة الكذب في القول واليمين، ثم آفة الغيبة، ثم آفة النميمة، ثم آفة ذي اللسانين، ثم آفة المدح، ثم آفة الغفلة عن دقائق الخطأ في فحوى الكلام لا سيما فيما يتعلق بالله وصفاته ويرتبط بأمر الدين، ثم آفة سؤال العوام عن صفات الله سبحانه، وعن كلامه، وجملة هذه الآفات عشرون آفة.", "**بيان**", "**عظم خطر اللسان وفضيلة الصمت**", "اعلم أن خطر اللسان عظيم لكثرة آفات الكلام، ولهذه الآفات في القلب حلاوة، ولها من الطبع بواعث، ولا نجاة من هذا الخطر إلا بالصمت، فلذلك مدح الشرع الصمت، ففي الصمت نجاة من الآفات مع أنه يجمع الهم ويفرغ الفكر."]], "ic": "book"}, {"story": ["كتاب آفات اللسان (٢ من ٣٠)، ص٦٤٧", ["أخبرنا هبة الله بن محمد قال: أخبرنا الحسن بن علي التميمي قال: أخبرنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا عفان قال: حدثنا عمر بن علي قال: سمعت أبا حازم عن سهل بن سعد عن النبي ﷺ قال: «من توكل لي ما بين لحييه(١) وما بين رجليه، توكلت له بالجنة»(٢).", "قال الإمام أحمد: وأخبرنا ابن نمير ويعلى قالا: حدثنا حجاج - يعني ابن دينار - عن شعيب بن خالد عن حسين بن علي قال: قال رسول الله ﷺ: «إن من حسن إسلام المرء قلة الكلام فيما لا يعنيه»(٣).", "قال الإمام أحمد: حدثنا زيد بن الحباب قال: أخبرني علي بن مسعدة قال: حدثنا قتادة عن أنس قال: قال رسول الله ﷺ: «لا يستقيم إيمان عبد حتى يستقيم قلبه، ولا يستقيم قلبه حتى يستقيم لسانه، ولا يدخل رجل الجنة حتى يأمن جاره بوائقه»(٤).", "حاشية: (١) اللحي: عظم الحنك، والمعنى: من ضمن لي حفظ فمه وفرجه. .", "حاشية: (٢) أخرجه أحمد (٢٢٨٢٣)، والبخاري (٦٤٧٤) و(٦٨٠٧) والترمذي (٢٤٠٨)، والبيهقي في الشعب (٥٤٠٧)، وأبو يعلى في مسنده (٧٥٥٥)، وابن حبان (٥٧٠١).", "حاشية: (٣) أخرجه أحمد (١٧٣٢) وإسناده ضعيف لانقطاعه فشعيب بن خالد لم يدرك الحسين بن علي.", "حاشية: (٤) أخرجه أحمد (١٣٠٤٨)، وإسناده ضعيف لضعف علي بن مسعدة الباهلي، وأخرجه ابن أبي الدنيا في الصمت (٩)، وفي مكارم الأخلاق (٣٤٢) والقضاعي في مسند الشهاب (٨٨٧) من طريق زيد بن الحباب به.", "قال الإمام أحمد: حدثنا قتيبة قال: حدثنا بكر بن مضر عن يزيد بن الهاد عن محمد بن إبراهيم عن عيسى بن طلحة عن أبي هريرة أنه سمع رسول الله ﷺ يقول: «إن العبد ليتكلم بالكلمة يزل(١) بها في النار أبعد ما بين المشرق والمغرب»(٢).", "قال الإمام أحمد: حدثنا أبو معاوية قال: حدثنا محمد بن عمرو بن علقمة الليثي عن أبيه عن جده علقمة عن بلال بن الحارث قال: قال رسول الله ﷺ: «إن الرجل ليتكلم بالكلمة من رضوان الله، ما يظن أن تبلغ ما بلغت، يكتب الله عز وجل بها له رضوانه إلى يوم يلقاه، وإن الرجل ليتكلم بالكلمة من سخط الله، ما يظن أن تبلغ ما بلغت، فيكتب الله بها عليه سخطه إلى يوم القيامة»(٣). فكان علقمة يقول: كم من كلام قد منعنيه حديث بلال بن الحارث."]], "ic": "book"}, {"story": ["كتاب آفات اللسان (٣ من ٣٠)، ص٦٤٨", ["قال (٤-٤)الإمام أحمد(٤-٤): حدثنا عبد الرزاق قال: أخبرنا معمر عن عاصم بن أبي النجود عن أبي وائل عن معاذ بن جبل قال: كنت مع رسول الله ﷺ في سفر، فأصبحت يوما قريبا منه ونحن نسير، فقلت: يا نبي الله، أخبرني بعمل يدخلني الجنة، ويباعدني من النار. قال: «لقد سألت عن عظيم، وإنه ليسير على من يسره الله عليه، تعبد الله ولا تشرك به شيئا، وتقيم الصلاة، وتؤتي الزكاة، وتصوم رمضان، وتحج البيت» ثم قال: «ألا أدلك على أبواب الخير؟ الصوم جنة، والصدقة تطفئ الخطيئة، وصلاة الرجل في جوف الليل» ثم قرأ: ﴿تَتَجَافَىٰ جُنُوبُهُمْ عَنِ ٱلْمَضَاجِعِ﴾ حتى بلغ ﴿يَعْمَلُونَ﴾ [السجدة: ١٦ - ١٧]، ثم قال: «ألا أخبرك برأس الأمر وعموده وذروة سنامه؟» فقلت: بلى يا رسول الله. قال: «رأس الأمر", "حاشية: (١) تصحفت في الأصل إلى: (نزل).", "حاشية: (٢) أخرجه أحمد (٨٩٢٣)، والبخاري (٦٤٧٧)، ومسلم (٢٩٨٨) (٤٩) و(٥٠).", "حاشية: (٣) أخرجه أحمد (١٥٨٢٥)، والحميدي (٩١١)، وهناد في الزهد (١١٤١)، والترمذي (٢٣١٩)، وابن ماجه (٣٩٦٩) وابن حبان (٢٨٠) و(٢٨١) و(٢٨٧)، والطبراني في الكبير (١١٢٩) - (١١٣٢)، والحاكم ١/ ٤٥، والبيهقي في السنن ٨/ ١٦٥، وفي الشعب (٤٩٥٧)، والبغوي في شرح السنة (٤١٢٤).", "حاشية: (٤-٤) ليس في (ظ).", "الإسلام، وعموده الصلاة، وذروة سنامه الجهاد» ثم قال: «ألا أخبرك بملاك ذلك كله؟» فقلت: بلى يا نبي الله. فأخذ بلسانه، فقال: «كف عليك هذا» فقلت: يا رسول الله، وإنا لمؤاخذون بما نتكلم به؟ فقال: «ثكلتك أمك يا معاذ، وهل يكب الناس في النار على وجوههم - أو قال: على مناخرهم - إلا حصائد ألسنتهم؟!»(١).", "قال الإمام أحمد: حدثنا (٢-٢)علي بن(٢-٢) إسحاق قال: أخبرنا عبد الله(٣)، قال: أخبرنا معمر عن الزهري عن عبد الرحمن بن ماعز عن سفيان بن(٤) عبد الله الثقفي قال: قلت: يا رسول الله، حدثني بأمر أعتصم به. قال: «قل: ربي الله، ثم استقم». قال: قلت: يا رسول الله، ما أخوف ما تخاف علي؟ قال: فأخذ بلسان نفسه، ثم قال: «هذا»(٥).", "وروى ابن مسعود عن النبي ﷺ أنه قال: «إن أكثر خطايا ابن آدم في لسانه».", "وروى ابن عمر عن النبي ﷺ أنه قال: «من كف لسانه ستر الله عورته».", "وقال قيس(٦): رأيت أبا بكر الصديق أخذ بطرف لسانه، وهو يقول: هذا أوردني الموارد.", "وقد سئل رسول الله ﷺ: ما أكثر ما يدخل النار؟ قال: «الأجوفان؛ الفم والفرج».", "وقال ابن مسعود: والله ما شيء أحوج إلى طول سجن من لسان.", "حاشية: (١) أخرجه أحمد (٢٢٠١٦)، وعبد الرزاق (٢٠٣٠٣)، والطبراني في الكبير ٢٠/ (٢٦٦) والترمذي (٢٦١٦)، وابن ماجه (٣٩٧٣)، والنسائي في الكبرى (١١٣٩٤).", "حاشية: (٢-٢) سقط من (ظ).", "حاشية: (٣) يعني عبد الله بن المبارك.", "حاشية: (٤) تحرفت في الأصل إلى: (عن)."]], "ic": "book"}, {"story": ["كتاب آفات اللسان (٤ من ٣٠)، ص٦٤٩", ["حاشية: (٥) أخرجه أحمد (١٥٤١٩)، والترمذي (٢٤١٠)، وابن أبي الدنيا في الصمت (٧)، وابن حبان (٥٦٩٩)، والبيهقي في الشعب (٤٩٢٠).", "حاشية: (٦) هو قيس بن أبي حازم البجلي، أبو عبد الله الكوفي، تقريب التهذيب: ٣٩٢.", "وقال شداد بن أوس لغلامه: ائتنا بالسفرة نعبث بها. فأنكرت عليه، فقال: والله ما تكلمت منذ أسلمت بكلمة إلا وأنا أخطمها وأزمها(١) إلا كلمتي هذه.", "وقال أبو الدرداء: أنصف أذنيك من فيك، فإنما جعلت لك أذنان وفم واحد لتسمع أكثر(٢) مما تتكلم به.", "وقال فضيل الرقاشي: لا تقطع النهار بكيت وكيت، فإنه محفوظ عليك ما قلت.", "وكان الربيع بن خيثم شديد الاحتراز في الكلام، فقالت له بنية له: يا أبة، أذهب ألعب؟ قال: اذهبي فقولي خيرا. فقيل له: وما عليك أن تقول لها. فقال: وما علي أن لا يكتب هذا في صحيفتي.", "وصحبه رجل عشرين سنة قال: فما سمعت منه كلمة تعاب.", "وقال مجاهد: كانوا يكتفون من الكلام باليسير.", "وقال يونس بن عبيد: ما من الناس أحد يكون لسانه منه على بالي إلا رأيت ذلك صلاحا في سائر عمله.", "وقال بشر بن منصور: كنا عند أيوب فلغطنا(٣) وتكلمنا فقال: كفوا، فلو أردت أن أخبركم بكل شيء تكلمت به اليوم لفعلت.", "وقال خارجة بن مصعب: صحبت ابن عون أربعا وعشرين سنة، فما أعلم أن الملائكة كتبت عليه خطيئة.", "وكان وهب بن منبه يعد كلامه كل يوم ويحفظه.", "وقال الفضيل بن عياض: كان بعض أصحابنا يعد كلامه من الجمعة إلى الجمعة.", "حاشية: (١) أي: يضع لها الخطام والزمام يشدها به.", "حاشية: (٢) تحرفت في (ظ) إلى: (الخير).", "حاشية: (٣) تصحفت في الأصل إلى: (فلفظنا).", "وقال عمر بن عبدالعزيز: من لم يعد كلامه من عمله كثرت ذنوبه.", "وقال مخلد بن الحسين: ما تكلمت بكلمة أريد أن أعتذر منها خمسين سنة.", "وقال سميط بن عجلان: يا ابن آدم، إنك ما دمت ساكتا فأنت سالم، فإذا تكلمت فخذ حذرك.", "وقال حاتم الأصم: لو أن صاحب حبر جلس إليك يكتب كلامك لاحترزت منه، وكلامك يعرض على الله عز وجل فلا تحترز!", "وقال معروف الكرخي: كلام العبد فيما(١) لا يعنيه خذلان من الله تعالى.", "وقال بعض الحكماء: اللسان حية مسكنها الفم.", "حاشية: (١) تحرفت في الأصل إلى: (مما).", "**ذكر آفات الكلام**", "**الآفة الأولى: الكلام فيما لا يعني**", "اعلم أنه من علم قدر زمنه وأنه رأس ماله لم ينفقه إلا في فائدة، وهذا العلم يوجب حبس اللسان عما لا يعني؛ لأنه من ترك ذكر الله تعالى واشتغل بمباح لا يعنيه كان كمن قدر على أخذ(١) جوهرة فأخذ عوضها مدرة(٢)، وهذا خسران للعمر الشريف القدر.", "أخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا القطيعي قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا موسى بن داود قال: حدثنا عبدالله بن عمر(٣) عن ابن شهاب عن علي بن حسين عن أبيه قال: قال رسول الله ﷺ: «من حسن إسلام المرء، تركه ما لا يعنيه»(٤)."]], "ic": "book"}, {"story": ["كتاب آفات اللسان (٥ من ٣٠)، ص٦٥٢", ["وقال أنس: استشهد منا غلام يوم أحد، فوجد على بطنه صخرة مربوطة من الجوع، فمسحت أمه التراب عن وجهه، وقالت: هنيئا لك يا بني بالجنة. فقال النبي ﷺ: «وما يدريك؟ لعله كان يتكلم فيما لا يعنيه، ويمنع ما لا يضره».", "قال عمر بن الخطاب: لا تتعرض(٥) لما لا يعنيك.", "وقيل للقمان الحكيم: ما بلغ من حكمتك؟ فقال: لا أسأل عما كفيت، ولا أتكلف ما لا يعنيني.", "حاشية: (١) ليست في (ظ).", "حاشية: (٢) المدرة: قطعة من الطين.", "حاشية: (٣) هو عبد الله بن عمر بن حفص بن عاصم بن عمر بن الخطاب. تقريب التهذيب: ٢٥٦.", "حاشية: (٤) أخرجه أحمد (١٧٣٧)، والطبراني في الكبير (٢٨٨٦)، وفي الصغير (١٠٨٠).", "حاشية: (٥) في الأصل: (لا تعرضن فيما)، وفي (ظ): (لا تعترض ما)، والمثبت من الإحياء.", "وقال معاوية لرجل: (١-١)ما بلغ من حلمك(١-١)؟ قال: لا يعنيني ما لا يعنيني.", "وقال مورق العجلي: أمر أنا في طلبه منذ عشرين سنة لم أقدر عليه، ولست بتارك طلبه أبدا. قالوا: وما هو؟ قال: الصمت عما لا يعنيني.", "واعلم أنك إذا سألت غيرك عما لا يعنيك ضيعت وقتك، وألجأت المسؤول إلى أن يضيع زمانه بالجواب، وربما لقيت شخصا فقلت: من أين؟ فكره أن يخبرك، فإن صدق لحقه ضرر، وإن كذب لحقه إثم.", "وقد روي أن لقمان دخل على داود عليه السلام وهو يسرد الدرع(٢)، فجعل يتعجب مما رأى، وأراد أن يسأله عن ذلك فمنعته حكمته، فأمسك نفسه ولم يسأله، فلما فرغ قام داود فلبس الدرع، ثم قال: نعم الدرع للحرب. فقال لقمان: الصمت حكم وقليل فاعله(٣). أي حصل العلم بالمراد من غير سؤال.", "**الآفة الثانية: فضول الكلام**", "وهذا يتناول الخوض في ما لا يعني، والزيادة فيما يعني على قدر الحاجة، ومتى حصل المقصود بكلمتين فذكر الثالثة فضول، إلا أن يراد بها التوكيد، فيكون مقصودا صحيحا.", "قال ابن مسعود: أنذركم فضول القول، بحسب أحدكم ما أبلغ(٤) حاجته.", "وقال عطاء بن أبي رباح: كان من قبلكم يكرهون فضول الكلام، أما يستحيي أحدكم أن لو نشرت صحيفته التي أملاها صدر نهاره كان أكثر ما فيها ليس من أمر دينه ولا دنياه.", "حاشية: (١-١) في (ظ): (ما بقي حلمك).", "حاشية: (٢) سرد الدرع: نسجها، فشك طرفي كل حلقتين وسمرهما.", "حاشية: (٣) شعب الإيمان (٥٠٢٦).", "حاشية: (٤) في الأصل: (ما بلغ).", "وقال إبراهيم النخعي: يهلك الناس في خلتين: فضول الكلام، وفضول المال.", "وعلاج هذه الآفة من جنس علاج التي قبلها، وذلك بالنظر إلى قدر شرف العمر، فليحذر من التفريط فيه.", "**الآفة الثالثة: الخوض في الباطل**", "وهو الكلام في المعاصي، كذكر مجالس الخمر، ومقامات الفساق، وأنواع الباطل لا تحصى لكثرتها، وقد ذكرنا في حديث بلال بن الحارث عن النبي ﷺ أنه قال: «إن الرجل ليتكلم بالكلمة من سخط الله ما يظن أن تبلغ ما بلغت، يكتب الله بها عليه سخطه إلى يوم القيامة»(١)."]], "ic": "book"}, {"story": ["كتاب آفات اللسان (٦ من ٣٠)، ص٦٥٤", ["وفي الصحيحين من حديث أبي هريرة عن النبي ﷺ أنه قال: «إن العبد ليتكلم بالكلمة يزل بها في النار أبعد ما بين المشرق والمغرب»(٢).", "وقال عليه الصلاة والسلام: «إن أعظم الناس خطايا يوم القيامة أكثرهم خوضا في الباطل».", "ورأى أبو الدرداء امرأة سليطة اللسان، فقال: لو كانت هذه خرساء لكان خيرا لها.", "**الآفة الرابعة: المراء والمجادلة**", "فقد روي عن ابن عباس عن النبي ﷺ أنه قال: «لا تمار أخاك».", "وقال عليه الصلاة والسلام: «من ترك المراء وهو محق بني له(٣) بيت في ربض الجنة».", "حاشية: (١) تقدم في الصفحة ٦٤٨.", "حاشية: (٢) تقدم في الصفحة ٦٤٨.", "حاشية: (٣) في (ظ): (بنى الله له).", "وقال مسلم بن يسار: إياكم والمراء فإنها ساعة جهل العالم، وبها يبتغي الشيطان زلته.", "واعلم أن المراء هو كثرة الملاحاة للشخص لبيان غلطه وإفحامه، والباعث عليه الترفع وبيان نقص الملاحى، وهما شهوتان للنفس باطنتان.", "أما قصد الترفع فمقتضى الكبر.", "وأما بيان نقص الغير فطبع السبعية، وهاتان الخلتان تخرج إلى فنون من المعاصي.", "وإنما ينبغي للإنسان أن ينكر المنكر من القول ويبين الصواب، فإن قبل منه وإلا ترك المماراة، هذا إذا كان الأمر متعلقا بالدين، فأما إذا كان في أمور الدنيا فلا وجه للمجادلة فيه.", "وعلاج هذه الآفة بكسر الكبر الباعث على إظهار الفضل وتنقص الغير؛ لأن علاج كل علة بإماطة سببها، وسبب المراء ما ذكرناه، وقد سبق ذكر المراء في كتاب آداب الصحبة.", "**الآفة الخامسة: الخصومة**", "وهو أمر وراء المراء؛ لأن المراء طعن في كلام الغير لإظهار خلل فيه، والخصومة لجاج في الكلام يقصد بها استيفاء مطلوب.", "وفي الصحيحين من حديث عائشة عن النبي ﷺ أنه قال: «إن أبغض الرجال إلى الله عز وجل الألد الخصم».", "وروى أبو هريرة عن النبي ﷺ أنه قال: «من جادل في خصومة بغير علم لم يزل في سخط الله حتى ينزع».", "وقال عمر بن عبد العزيز: من جعل دينه غرضا للخصومات أكثر التنقل.", "واعلم أن ذم الخصومات إنما يتعلق بمن خاصم بغير علم، أو خاصم بالباطل، ومن الناس من يقصد بالخصومة قهر الخصم حتى يقول: مرادي غلبته، ولو أخذت منه المال الذي أخاصمه فيه رميته في بئر ولا أبالي.", "وبعد؛ فالأولى لمن له حق أن يصدف(١) عن الخصومة مهما أمكن؛ لأن الخصومة توغر الصدر وتهيج الغضب وتورث الحقد، وتخرج إلى تناول العرض، ووقوف المخاصم على حد الاعتدال متعذر.", "**الآفة السادسة: التقعر في الكلام**", "وذلك يكون بالتشدق وتكلف التسجيع وغريب الكلام.", "أخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا محمد بن أبي عدي، عن داود عن مكحول، عن أبي ثعلبة الخشني قال: قال رسول الله ﷺ: «إن أبغضكم إلي وأبعدكم مني في الآخرة مساوئكم أخلاقا، الثرثارون المتفيهقون المتشدقون»(٢)."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "وكتب فتح بن شخرف على باب بيته: رحم الله ____ دخل على هذا الميت فلم يذكر الموتى عنده إلا", "o": ["ميتا", "وجره", "متصفا", "ونسبته"], "h": "راجع: ص٦٧٦"}, {"t": "fill", "d": 2, "q": "وقال بكر بن عبد الله: إذا رأيتم الرجل موكلا بعيوب ____ ناسيا لعيبه، فاعلموا أنه قد مكر", "o": ["الناس", "تطلق", "حسدهم", "المرائي"], "h": "راجع: ص٦٧٦"}, {"t": "fill", "d": 2, "q": "وروى جابر عن النبي ﷺ أنه قال: «إياكم والغيبة، فإن الغيبة أشد من الزنا، إن الرجل قد يزني فيتوب فيتوب الله عليه، وإن ____ الغيبة لا يغفر له حتى يغفر له", "o": ["صاحب", "أخبر", "يحضره", "يؤذن"], "h": "راجع: ص٦٧٥"}, {"t": "fill", "d": 2, "q": "فإذا تحققت هفوة مسلم فانصحه في السر ولا تغتبه، فإذا وعظته فلا تعظه وأنت مسرور باطلاعك على نقصه لينظر إليك بعين التعظيم، وينظر إليه بعين الاستصغار وترتفع عليه بدالة الوعظ، وليكن قصدك تخليصه من الإثم وأنت حزين، كما ____ على نفسك إذا دخل عليك نقصان", "o": ["تحزن", "عمار", "يعرفه", "القرية"], "h": "راجع: ص٦٨٧"}, {"t": "fill", "d": 2, "q": "وكل من نقلت إليه النميمة مثل أن يقال له: قال فيك فلان كذا، أو فعل في حقك كذا، أو هو ____ في إفساد أمرك، ونحو هذا، فعليه ستة", "o": ["يدبر", "مماراة", "التالي", "ويتكبر"], "h": "راجع: ص٦٩٢"}, {"t": "fill", "d": 2, "q": "قال الإمام أحمد: حدثنا قتيبة قال: حدثنا بكر بن مضر عن يزيد بن الهاد عن محمد بن إبراهيم عن عيسى بن طلحة عن أبي هريرة أنه سمع رسول الله ﷺ يقول: «إن العبد ____ بالكلمة يزل بها في النار أبعد ما بين", "o": ["ليتكلم", "أرزاق", "يعمى", "قذرة"], "h": "راجع: ص٦٤٨"}]}, {"t": "كتاب آفات اللسان - القسم ٢ من ٥", "b": [{"story": ["كتاب آفات اللسان (٧ من ٣٠)، ص٦٥٦", ["أخبرنا علي بن محمد بن حسنون قال: أخبرنا أبو محمد بن أبي عثمان قال: أخبرنا أبو القاسم بن المنذر قال: أخبرنا ابن صفوان قال: حدثنا أبو بكر القرشي قال: حدثنا ابن أبي شيبة قال: حدثنا حفص بن غياث عن إسماعيل بن أبي خالد عن مصعب قال: جاء عمر بن سعد إلى أبيه يسأله حاجة فتكلم بين يدي حاجته بكلام، فقال له سعد(٣): ما كنت من حاجتك بأبعد منها اليوم، إني سمعت رسول الله ﷺ يقول: «يأتي على الناس زمان يتخللون فيه الكلام بألسنتهم كما تتخلل البقر الكلأ بألسنتها».", "حاشية: (١) صدف عن الشيء: مال عنه وأعرض.", "حاشية: (٢) أخرجه أحمد (١٧٧٣٢) و(١٧٧٤٣) وابن أبي شيبة ٨/ ٥١٥، وابن حبان (٤٨٢)، والطبراني في الكبير ٢٢/ (٥٨٨)، والبيهقي في شعب الإيمان (٧٩٨٩)، وقوله: الثرثارون: هم الذين يكثرون الكلام تكلفا وخروجا عن الحق، والمتفيهقون: هم الذين يتوسعون في الكلام ويفتحون به أفواههم، من الفهق، وهو الإملاء والاتساع بلا احتياط.", "حاشية: (٣) يعني سعد بن أبي وقاص رضي الله عنه.", "قال القرشي(١): وحدثنا إسماعيل بن إبراهيم قال: حدثنا علي بن ثابت عن عبد الحميد بن جعفر الأنصاري عبد الله بن الحسن عن أمه فاطمة بنت الحسين عن فاطمة بنت رسول الله ﷺ قالت: قال رسول الله ﷺ: «شرار أمتي الذين غذوا بالنعيم، الذين يأكلون ألوان الطعام، ويلبسون ألوان الثياب، ويتشدقون في الكلام»(٢).", "وقال عمر بن الخطاب: إن شقاشق(٣) الكلام من شقائق الشيطان.", "واعلم أنه إنما كان التقعر مكروها لمكان التكلف والتصنع، ثم لا يليق بالمحاورات التقعر (٤-٤)وتكليف الغريب(٤-٤)؛ لأن المقصود الفهم، فربما لم يفهم، وكذل تكلف السجع في المحاورات، كما قال ذلك الأعرابي: أندي(٥) من لا أكل ولا شرب ولا استهل(٦)، ومثل ذلك يطل(٧).", "ولا يدخل في هذه الكراهة تحسين ألفاظ الخطب والتذكير من غير إفراط ولا اغتراب؛ لأن المقصود من ذلك تحريك القلوب وتشويقها وقبضها وبسطها، ولرشاقة اللفظ تأثير، فهو لائق به.", "حاشية: (١) هو عبد الله بن محمد بن عبيد بن سفيان، أبو بكر القرشي الشهير بابن أبي الدنيا، صاحب التصانيف الكثيرة، توفي سنة (٢٨١)هـ. سير أعلام النبلاء ١٣/ ٣٩٧، وطبقات الحنابلة ١/ ١٩٢.", "حاشية: (٢) رواه ابن أبي الدنيا في الغيبة والنميمة (١٠)، وابن عدي في الكامل ٥/ ١٩٥٦، والبيهقي في شعب الإيمان (٥٦٦٩)، والمنذري في الترغيب والترهيب (٣٠٩٦).", "حاشية: (٣) الشقاشق: جمع شقشقة، وهي الكلام بتفاصح وتقعر.", "حاشية: (٤-٤) ليس في (ظ).", "حاشية: (٥) أي: تدفع الدية.", "حاشية: (٦) استهل الصبي: رفع صوته بالبكاء وصاح عند الولادة."]], "ic": "book"}, {"story": ["كتاب آفات اللسان (٨ من ٣٠)، ص٦٥٧", ["حاشية: (٧) يقال: طل دمه، أي هدر وبطل ولم يثأر به ولم تؤخذ ديته، وقال له رسول الله ﷺ لما قال ذلك: (أسجعا كسجع الأعراب؟). الحديث أخرجه أحمد و(١/ ١٨١٣) و(١٨١٤٨) و(١٨١٤٩) و(١٨١٧٧)، ومسلم (١٦٨٢)، وعبد الرزاق (١٨٣٥١)، وابن أبي شيبة ٩/ ٢٥٥، وأبو داود (٤٥٦٩)، والنسائي في الكبرى (٧٠٢٦ - ٧٠٢٨) من حديث المغيرة بن شعبة.", "**الآفة السابعة: الفحش والسب والبذاء**", "وهو مذموم منهي عنه، ومصدره الخبث واللؤم، روي عن عبد الله بن عمرو عن النبي ﷺ أنه قال: «إياكم والفحش، فإن الله لا يحب الفحش ولا التفحش»(١)، «الجنة حرام على كل فاحش يدخلها»(٢).", "وقال عليه الصلاة والسلام: «أربعة يؤذون أهل النار على ما بهم من الأذى، يسعون بين الحميم والجحيم، يدعون بالويل والثبور...» فذكر منهم «رجلا يسيل فوه قيحا ودما، فيقال له: ما بال الأبعد قد آذانا على ما بنا من الأذى؟ فيقول: إن الأبعد كان ينظر إلى كل كلمة قذعة(٣) خبيثة، فيستلذها كما يستلذ الرفث».", "وقال ابن مسعود: ألأم خلق المؤمن الفحش.", "واعلم أن الفحش والبذاء هو التعبير عن الأمور المستقبحة بالعبارات الصريحة، وأكثر ذلك في ألفاظ الجماع وما يتعلق به، فإن أهل الخير يتحاشون عن تلك العبارات ويكنون عنها، كما قال ابن عباس: إن الله حيي كريم يكني بالحسن عن القبيح، كنى باللمس عن الجماع.", "ومن هذا الجنس أن لا يقال للأبرص ومن به البواسير: كيف برصك؟ بل: كيف العارض الذي تشكوه؟", "وكان عمر بن عبد العزيز يتحفظ في منطقه ولا يتكلم بشيء فخرج له خراج في إبطه، فقالوا: أي شيء عسى أن يقول الآن؟ فسألوه: أين خرج هذا منك؟ فقال: في باطن يدي.", "حاشية: (١) أخرجه النسائي في الكبرى (١١٥١٩)، وهو بطوله عند أحمد (٦٤٨٧)، وابن حبان (٥١٧٦)، والطيالسي (٢٢٧٢)، والبيهقي في الشعب (٧٤٥٨) و(١٠٨٣٤) وفي السنن: ١٠/ ٢٤٣.", "حاشية: (٢) أخرجه أبو نعيم في الحلية ١/ ٢٨٨، والعراقي في المغني عن حمل الأسفار ٣/ ١١٧، والزبيدي في إتحاف السادة المتقين ٧/ ٤٧٨، وأورده المناوي في فيض القدير ٣/ ٣٦٣ ونسبه لابن أبي الدنيا في فضل الصمت، من حديث عبد الله بن عمرو بن العاص.", "حاشية: (٣) قذعة: قبيحة سيئة.", "وأما السب؛ فقد قال عليه الصلاة والسلام: «سباب المسلم فسوق، والمستبان ما قالا فعلى البادي ما لم يعتد المظلوم».", "**الآفة الثامنة: اللعن**", "أخبرنا عبد الأول قال: أخبرنا الداودي قال: أخبرنا ابن أعين السرخسي قال: أخبرنا الفربري قال: حدثنا البخاري قال: حدثنا موسى بن إسماعيل قال: حدثنا وهيب قال: حدثنا أيوب عن أبي قلابة عن ثابت بن الضحاك عن النبي ﷺ أنه قال: «لعن المؤمن كقتله». أخرجاه في الصحيحين.", "وفي أفراد مسلم من حديث أبي الدرداء عن النبي ﷺ: «إن اللعانين لا يكونون شهداء ولا شفعاء يوم القيامة»."]], "ic": "book"}, {"story": ["كتاب آفات اللسان (٩ من ٣٠)، ص٦٥٩", ["وفي أفراده من حديث أبي هريرة عن النبي ﷺ قال: «لا ينبغي لصديق أن يكون لعانا».", "وقال حذيفة: ما تلاعن قوم قط إلا حق عليهم القول.", "أخبرنا هبة الله بن محمد قال: أخبرنا الحسن بن علي التميمي قال: أخبرنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد بن حنبل قال: حدثني أبي قال: حدثنا إسماعيل عن أيوب عن أبي قلابة عن أبي المهلب عن عمران بن حصين قال: بينما رسول الله ﷺ في بعض أسفاره وامرأة من الأنصار على ناقة، فضجرت فلعنتها، فسمع ذلك رسول الله ﷺ فقال: «خذوا ما عليها ودعوها، فإنها ملعونة». قال عمران: فكأني أنظر إليها الآن تمشي في الناس ما يعرض لها أحد؛ يعني الناقة(١). انفرد بإخراجه مسلم، وإنما نهاهم عن ركوب الناقة عقوبة لصاحبها اللاعن لها.", "وقالت عائشة: سمع النبي ﷺ أبا بكر لعن(٢) بعض رقيقه، فقال له النبي ﷺ:", "حاشية: (١) تحرفت في الأصل إلى: (الناس)، والحديث أخرجه مسلم (٢٥٩٥) (٨٠) وأحمد (١٩٨٧٠).", "حاشية: (٢) في الأصل: (يلعن).", "«يا أبا بكر، الصديقون لعانون!» قال: فأعتق أبو بكر يومئذ بعض رقيقه، وجاء إلى النبي ﷺ فقال: والله لا أعود.", "واعلم أن الأولى بالإنسان حفظ لسانه، فربما لعن من لا يجوز لعنه.", "وقد قال ابن عون: إنما هما كلمتان تخرجان من صحيفتي يوم القيامة: لا إله إلا الله، ولعن الله فلانا، ولأن يخرج من صحيفتي: لا إله إلا الله، أحب إلي من أن يخرج: لعن الله فلانا.", "**الآفة التاسعة: الغناء والشعر**", "فأما الكلام في الغناء، فقد سبق.", "وأما الشعر، فإنه كلام منظوم، حسنه كحسن الكلام وقبيحه كقبيح الكلام، قال عليه الصلاة والسلام: «إن من الشعر لحكمة». إلا أن التجرد له عن بقية العلوم مذموم.", "قال عليه الصلاة والسلام: «لأن يمتلئ جوف أحدكم قيحا يريه(١)، خير له من أن يمتلئ شعرا».", "**الآفة العاشرة: المزاح**", "فإنه دليل على انبساط وطيب قلب، فلا ينهى عما كان يسيرا وكان صدقا، فقد كان عليه الصلاة والسلام يمزح، وكان من مزاحه ﷺ أنه قال لرجل: «يا ذا الأذنين».", "وقال لآخر: «إني حاملك على ولد الناقة» فقال: وكيف يطبقني ولد الناقة؟ فقال: «وهل تلد الإبل إلا النوق»، وقال لعجوز: «إنه لا تدخل الجنة عجوز» ثم قرأ: ﴿إِنَّآ أَنشَأْنَٰهُنَّ إِنشَآءً﴾ [الواقعة: ٣٥]، وقال لأخرى: «زوجك الذي في عينيه بياض».", "حاشية: (١) يريه، من الوري، أي: حتى يغلبه ويشغله عن ذكر الله ويفسده.", "وقد اتفق في مزاحه عليه الصلاة والسلام ثلاثة أشياء:", "**أحدها**: كونه حقا، فقد قال عليه الصلاة والسلام: «إني لأمزح ولا أقول إلا حقا».", "**والثاني**: أن جمهور مزاحه كان مع النساء والصبيان ومن يحتاج إلى ملاينة من ضعفاء الرجال."]], "ic": "book"}, {"story": ["كتاب آفات اللسان (١٠ من ٣٠)، ص٦٦١", ["**الثالث**: أنه كان نادرا، فلا ينبغي أن يحتج به من يريد الدوام عليه، فإن حكم النادر ليس كحكم الدائم، ولو أن إنسانا دار مع الحبشة ليلا ونهارا ينظر إلى لعبهم، واحتج بأن رسول الله ﷺ وقف لعائشة وأذن لها أن تنظر إلى لعب(١) الحبشة لكان غالطا؛ لندور ذلك، (٢-٢)فالإفراط في المزاح والمداومة عليه منهي عنه(٢-٢)؛ لأنه يخرج إلى هوان الممازح وإضحاك الناس به ويسقط الوقار، ويوجب الضغائن والأحقاد، قال عليه الصلاة والسلام: «لا تمار أخاك ولا تمازحه». وقال عمر: من مزح استخف به.", "وقال سعيد بن العاص لابنه: يا بني، لا تمازح الشريف فيحقد عليك، ولا الدني فيجترئ عليك.", "وقال عمر بن عبد العزيز: إياك(٣) والمزاحة، فإنها تورث الضغينة.", "**الآفة الحادية عشرة: السخرية والاستهزاء**", "ومعنى السخرية: الاحتقار والاستهانة والتنبيه على العيوب والنقائص على وجه يضحك منه، وقد يكون ذلك بالمحاكاة في الفعل والقول، وقد يكون بالإشارة والإيماء، وكله ممنوع منه في الشرع، قال الله تعالى: ﴿لَا يَسْخَرْ قَوْمٌ مِّن قَوْمٍ عَسَىٰٓ أَن يَكُونُوا۟ خَيْرًا مِّنْهُمْ وَلَا نِسَآءٌ مِّن نِّسَآءٍ عَسَىٰٓ أَن يَكُنَّ خَيْرًا مِّنْهُنَّ وَلَا تَلْمِزُوٓا۟ أَنفُسَكُمْ وَلَا تَنَابَزُوا۟ بِٱلْأَلْقَٰبِ﴾ [الحجرات: ١١].", "حاشية: (١) ليست في الأصل.", "حاشية: (٢-٢) في العبارة في (ظ) تقديم وتأخير.", "حاشية: (٣) تحرفت في الأصل إلى: (إياي).", "وروت أم هانئ عن النبي ﷺ أنه قال في قوله تعالى: ﴿وَتَأْتُونَ فِى نَادِيكُمُ ٱلْمُنكَرَ﴾ [العنكبوت: ٢٩]، قال: «كانوا يحذفون أهل الطريق، ويسخرون منهم».", "وقالت عائشة رضي الله عنها: حكيت(١) إنسانا، فقال رسول الله ﷺ: «ما أحب أني حكيت إنسانا وأن لي كذا وكذا».", "وروى معاذ عن النبي ﷺ أنه قال: «من عير أخاه بذنب قد تاب منه، لم يمت حتى يعمله».", "وروى الحسن عن النبي ﷺ أنه قال: «إن المستهزئين بالناس يفتح لأحدهم باب من الجنة، فيقال: هلم هلم، فيجيء بكربه وغمه، فإذا أتى أغلق دونه، ثم يفتح له باب آخر، فيقال: هلم هلم، فيجيء بكربه وغمه، فإذا أتى أغلق دونه، فما يزال كذلك حتى إن الرجل ليفتح له الباب فيقال: هلم هلم، فما يأتيه».", "**الآفة الثانية عشرة: إفشاء السر**", "وهو منهي عنه لما فيه من الإيذاء والتهاون بحق المعارف والأصدقاء.", "وفي الصحيحين من حديث أنس أن رسول الله ﷺ بعثه في حاجة، فقالت له أم سليم: ما حبسك؟ فقال: بعثني رسول الله ﷺ في حاجة. فقالت: وما هي؟ قال: سر. قالت: احفظ على رسول الله ﷺ سره. قال: ما حدثت به أحدا بعد.", "وفي أفراد البخاري من حديث أبي بكر الصديق أنه قال: لم أكن لأفشي سر رسول الله.", "وروى جابر عن النبي ﷺ أنه قال: «إذا حدث الرجل [بحديث](٢) ثم التفت، فهي أمانة»(٣).", "حاشية: (١) يقال: حكاه وحاكاه أي: ماثله وقلده وشابهه في قول أو فعل."]], "ic": "book"}, {"story": ["كتاب آفات اللسان (١١ من ٣٠)، ص٦٦٢", ["حاشية: (٢) ليست في النسخ، وأثبتت من مصادر التخريج.", "حاشية: (٣) أخرجه أحمد (١٥٠٦٢)، وأبو يعلى (٢٢١٢).", "وقال عمرو بن العاص: ما وضعت سري عند أحد فأفشاه، فلمته على إفشائه، وكيف ألومه وقد ضقت به ذرعا(١).", "وقال الحسن(٢): من الخيانة أن تحدث بسر أخيك.", "قال بعض الحكماء: من ارتاد لسره فقد ضيعه، وما كنت كاتمه من عدوك، (٣-٣)فلا تظهر عليه(٣) صديقك.", "وقيل لأعرابي: كيف كتمانك للسر؟ فقال: ألتحف عليه التحاف الجناح على الخوافي(٤).", "وقال آخر: إن سرك من دمك، فلا تضعه إلا عند من تثق به.", "وقدسبق في كتاب آداب الصحبة الكلام في كتمان السر.", "**الآفة الثالثة عشرة: الوعد الكاذب**", "فإن اللسان سباق إلى الوعد، والنفس ربما لم تسمح بالوفاء فيصير الوعد خلفا، وذلك من علامات النفاق، وقد قال الله عز وجل: ﴿يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ أَوْفُوا۟ بِٱلْعُقُودِ﴾ [المائدة: ١]. وقد أثنى الله عز وجل على نبيه إسماعيل، فقال: ﴿إِنَّهُۥ كَانَ صَادِقَ ٱلْوَعْدِ﴾ [مريم: ٥٤].", "قال يزيد الرقاشي: وعد إسماعيل نبي الله رجلا ميعادا، فجلس له إسماعيل اثنين وعشرين يوما مكانه لا يبرح لميعاده، ولهى الآخر عن ذلك حتى جاء بعد ذلك.", "وفي مرسلات الحسن عن النبي ﷺ أنه قال: «العدة(٥) عطية».", "حاشية: (١) أخرجه البخاري في الأدب المفرد (٨٨٦).", "حاشية: (٢) يعني الحسن البصري.", "حاشية: (٣-٣) في الأصل: (فاكتمه من).", "حاشية: (٤) الخوافي: جمع خافية، وهي إحدى ريشات أربع إذا ضم الطائر جناحه خفيت.", "حاشية: (٥) العدة: الوعد، والمقصود أنها بمنزلة العطية فلا ينبغي الخلف فيها كما لا ينبغي الرجوع في العطية.", "أخبرنا علي بن محمد بن حسنون قال: أخبرنا أبو محمد بن أبي عثمان قال: أخبرنا القاضي أبو القاسم بن المنذر قال: أخبرنا ابن صفوان قال: حدثنا أبو بكر القرشي قال: حدثنا أحمد بن إبراهيم قال: حدثنا محمد بن سنان العوفي قال: حدثنا إبراهيم بن طهمان عن بديل بن ميسرة عن عبد الكريم بن عبد الله بن شقيق عن أبيه عن عبد الله بن أبي الحمساء(١) قال: بايعت النبي ﷺ ببيع قبل أن يبعث فبقيت له بقية فوعدته أن آتيه بها في مكانه ذلك، فنسيت يومي والغد، وأتيته في اليوم الثالث وهو في مكانه فقال: «يا فتى، لقد شققت علي، أنا ها هنا منذ ثلاث أنتظرك».", "قال أحمد بن إبراهيم: وحدثني محمد بن كثير عن الأوزاعي عن هارون بن رئاب(٢) قال: لما حضرت عبد الله بن عمرو الوفاة قال: إنه كان خطب إلي ابنتي رجل من قريش، وقد كان مني إليه شبيه بالوعد، فوالله لا ألقى الله بثلث النفاق، أشهدكم أني قد زوجتها إياه."]], "ic": "book"}, {"story": ["كتاب آفات اللسان (١٢ من ٣٠)، ص٦٦٤", ["وإنما أشار إلى الحديث الصحيح: «ثلاث من كن فيه فهو منافق؛ إذا وعد أخلف...». غير أن العلماء حملوا هذه على من وعد وهو على عزم الإخلاف وترك الوفاء من غير عذر، فأما من عزم على الوفاء وعرض له عذر منعه من الوفاء، فليس بمنافق، إلا أنه ينبغي له أن يحترز من صورة النفاق كما يحترز من حقيقته.", "وقال عبد ربه القصاب: واعدت ابن سيرين فنسيت، ثم ذكرت فأتيته قريبا من نصف النهار، وإذا به ينتظرني؛ فقال: لو لم تجئ حتى غربت الشمس ما قمت من مقامي هذا إلا إلى صلاة أو حاجة لا بد منها.", "وقال شعبة: ما واعدت أيوب موعدا قط إلا قال لي حين يفارقني: ليس بيني وبينك موعد. فإذا جئت وجدته قد سبقني.", "حاشية: (١) تحرف في (ظ) إلى: (الحمساء) وهو عبد الله بن أبي الحمساء العامري. الإصابة ت (٥٢٢٧).", "حاشية: (٢) تصحفت في النسخ إلى: (رباب)، ينظر تقريب التهذيب: ٤٩٩.", "وكان أصحاب عبد الله بن مسعود يقولون: إذا وعد فقال: إن شاء الله. فما أخلف.", "وكان يقول عوف بن النعمان في الجاهلية: لأن أموت قائما عطشانا أحب إلي من أن أكون مخلفا للوعد.", "**الآفة الرابعة عشرة: الكذب في القول واليمين**", "أخبرنا هبة الله بن محمد قال: أخبرنا الحسن بن علي التميمي قال: أخبرنا أحمد بن جعفر قال: أخبرنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا أبو معاوية قال: حدثنا الأعمش عن شقيق عن عبد الله(١) قال: قال رسول الله ﷺ: «عليكم بالصدق، فإن الصدق يهدي إلى البر، وإن البر يهدي إلى الجنة، وما يزال الرجل يصدق حتى يكتب عند الله صديقا، وإياكم والكذب، فإن الكذب يهدي إلى الفجور، وإن الفجور يهدي إلى النار، وما يزال الرجل يكذب ويتحرى الكذب حتى يكتب عند الله كذابا»(٢). أخرجاه في الصحيحين.", "وأخرجا من حديث أبي هريرة عن النبي ﷺ أنه قال: «آية المنافق ثلاث؛ إذا حدث كذب، وإذا وعد أخلف، وإذا اؤتمن خان»(٣).", "وأخرجا من حديث سمرة عن النبي ﷺ قال: «هل رأى أحد منكم الليلة رؤيا؟» فقلت: لا. قال: «لكن أنا رأيت الليلة رجلين أتياني، فأخذا بيدي، فأخرجاني إلى فضاء، فمرا بي على رجل، ورجل قائم بيده كلوب(٤) من حديد يدخله في شدقه،", "حاشية: (١) يعني ابن مسعود رضي الله عنه.", "حاشية: (٢) أخرجه أحمد (٣٦٣٨) و(٣٧٢٧) و(٣٨٩٦) و(٤٠٢٢) و(٤٠٩٥) و(٤١٠٨) و(٤١٦٠) و(٤١٨٧)، والبخاري (٦٠٩٤)، ومسلم (٢٦٠٧)(١٠٣) - (١٠٥).", "حاشية: (٣) أخرجه البخاري (٣٣) و(٢٦٨٢) و(٢٧٤٩) و(٦٠٩٥)، ومسلم (٥٩).", "حاشية: (٤) الكلوب والكلاب: حديدة معوجة الرأس ينشل بها الشيء أو يعلق.", "فيشق حتى يبلغ قفاه، (١)ثم يخرجه(١) فيدخله في شدقه الآخر، ويلتئم(٢) هذا الشدق، فقلت: من هذا؟...، فقالا: هو كذاب يكذب(٣) الكذبة فتحمل عنه في الآفاق، فهو يصنع به ما رأيت إلى يوم القيامة، ثم يصنع الله به ما شاء»(٤)."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "أما الأسباب الثلاثة التي في الخاصة، فهي أغمضها وأدقها؛ لأنها شرور ____ الشيطان في معرض الخير", "o": ["أخرجها", "الجميع", "أكلا", "صفتان"], "h": "راجع: ص٦٨٤"}, {"t": "fill", "d": 2, "q": "وليس لك أن تظن بالمسلم ش ل).", "حاشية: (٤) أخرجه بطوله أحمد (٢٠١٦٥)، والبخاري (١٣٨٦) و(٧٠٤٧)، وأخرجه مسلم (٢٢٧٥) مختصرا.", "حاشية: (٥) ليست في النسخ، وأثبتت من مصادر التخريج.", "حاشية: (٦) أخرجه أحمد (١٢٣٣٦)، والبخاري (٥٩٧٧)، ومسلم (٨٨).", "حاشية: (٧) المتشبع: الذي يظهر الشبع وليس بشبعان، ومعناه هنا: أنه يظهر أنه حصل له فضيلة وليست حاصلة.", "حاشية: (٨) أخرجه أحمد (٢٦٩٢١)، والبخاري (٥٢١٩)، ومسلم (٢١٣٠)، وقوله: (كلابس ثوبي زور) أي: كمن أحاط به الزور من كل جانب، فنيته وعمله كلاهما زور.", "حاشية: (٩) في النسخ: (الكذب)، والمثبت من مصادر التخريج.", "حاشية: (١٠) أخرجه أحمد (٢٥١٨٣)، والبيهقي في الشعب (٤٨١٧)، وعبد الرزاق في المصنف (٢٠١٩٥)، وابن حبان (٥٧٣٦)، والبغوي في شرح السنة (٣٥٧٦).", "وقال عليه الصلاة والسلام: «اكفلوا لي بست أكفل لكم بالجنة؛ إذا حدث أحدكم فلا يكذب».", "وقال أبو بكر الصديق: إياكم والكذب، فإنه مجانب للإيمان.", "وقال عمر: من يكذب يفجر، ومن يفجر يهلك.", "وقال علي بن أبي طالب: أعظم الخطايا عند الله، اللسان الكذوب.", "وقال ابن مسعود: لا يصلح الكذب في جد ولا هزل، ولا أن يعد أحدكم صبيه شيئا ثم لا ينجزه له.", "وقال مسروق: ليس شيء عند الله أعظم من الكذب.", "وقال الليث بن سعد: كانت ترمص(١) عينا سعيد بن المسيب حتى يبلغ الرمص خارج عينيه إلى المآقي، فيقال: لو مسحت هذا، فيقول: فأين قول الطبيب: لا تمس عينيك، فأقول: لا أفعل.", "وقال عمر بن عبد العزيز(٢-٢) ما كذبت كذبة منذ شددت علي إزاري. وكلمه الوليد في شيء فقال له: كذبت. فقال له عمر(٢-٢): ما كذبت منذ علمت أن الكذب يشين صاحبه.", "وقال ابن السماك: ما أراني أوجر على تركي الكذب، إنما أدعه أنفة.", "وقال ابن المبارك: أول عقوبة الكاذب من كذبه أن يرد عليه صدقه.", "فأما الكذب في اليمين بالله تعالى، ففي الصحيحين من حديث عبد الله بن عمرو عن النبي ﷺ قال: «الكبائر: الإشراك بالله، وعقوق الوالدين، وقتل النفس، واليمين الغموس».", "وأخرجا من حديث ابن مسعود عن النبي ﷺ أنه قال: «من حلف على يمين هو فيها فاجر ليقتطع بها مال امرئ مسلم، لقي الله عز وجل وهو عليه غضبان»."]], "ic": "book"}, {"story": ["كتاب آفات اللسان (١٤ من ٣٠)، ص٦٦٧", ["حاشية: (١) رمصت العين ترمص رمصا: اجتمع في موقها وسخ أبيض.", "حاشية: (٢-٢) سقط من (ظ).", "وفي أفراد مسلم من حديث أبي أمامة عن النبي ﷺ قال: «من اقتطع حق(١) امرئ مسلم بيمينه، فقد أوجب الله له النار، وحرم عليه الجنة» فقال له رجل: وإن كان شيئا يسيرا؟ قال: «وإن كان قضيبا من أراك»(٢).", "حاشية: (١) في الأصل: (مال) وما في (ظ) موافق لرواية مسلم.", "حاشية: (٢) أخرجه مسلم (١٣٧).", "**بيان**", "**ما رخص فيه من الكذب**", "اعلم أن الكلام وسيلة إلى المقاصد، فكل مقصود محمود يمكن التوصل إليه بالصدق والكذب جميعا، فالكذب فيه حرام، وإن أمكن التوصل إليه بالكذب دون الصدق، فالكذب فيه مباح إن كان تحصيل ذلك المقصود مباحا، وواجب إن كان المقصود واجبا، كما أن عصمة دم المسلم واجبة، فمهما كان في الصدق سفك دم مسلم قد اختفى من ظالم، فالكذب فيه واجب، ومهما كان لا يتم مقصود حرب، أو إصلاح ذات البين، أو استمالة قلب المجني عليه إلا بكذب، فالكذب مباح.", "إلا أنه ينبغي أن يحترز عنه ما أمكن، لأنه إذا فتح باب الكذب فربما تداعى إلى ما يمكن أن يستغنى عنه وإلى مالا يقتصر إلى حد الضرور، (١)فبان من هذا أن الكذب حرام في الأصل إلا لضرورة(١).", "وقد بينت(٢) الضرورة فيما أخبرنا به ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا يعقوب قال: (٣)حدثنا أبي عن صالح(٣) بن كيسان، قال: حدثنا محمد بن مسلم أن حميد بن عبد الرحمن بن عوف أخبره أن أمه أم كلثوم بنت عقبة أخبرته أنها سمعت رسول الله ﷺ يقول: «ليس الكذاب بالذي يصلح بين الناس فينمي(٤) خيرا أو يقول خيرا». وقالت: لم أسمعه يرخص في شيء مما يقول الناس إلا في", "حاشية: (١-١) سقط من (ظ).", "حاشية: (٢) تصحفت في الأصل إلى: (ثبتت).", "حاشية: (٣-٣) في الأصل: (عن أبي صالح) وهو غلط.", "حاشية: (٤) فينمي: أي ينقل من أحد الطرفين إلى الطرف الآخر خيرا، مما يرجى به الإصلاح بينهما، وإن لم يطابق الواقع.", "ثلاث: في الحرب، والإصلاح بين الناس، وحديث الرجل امرأته، وحديث المرأة زوجها. أخرجاه في الصحيحين(١).", "أخبرنا علي بن محمد بن حسنون قال: أخبرنا أبو محمد بن أبي عثمان قال: أخبرنا أبو القاسم بن المنذر قال: أخبرنا ابن صفوان قال: حدثنا أبو بكر القرشي قال: حدثنا داود بن عمرو الضبي قال: حدثنا داود بن عبد الرحمن العطار عن عبد الله بن عثمان بن خثيم عن شهر بن حوشب عن أسماء بنت يزيد أن رسول الله ﷺ قال: «أيها الناس، ما يحملكم على أن تتابعوا(٢) بالكذب كما يتتابع الفراش في النار؟ كل الكذب يكتب على ابن آدم إلا ثلاث خصال: رجل كذب امرأته ليرضيها، ورجل كذب بين امرأين ليصلح بينهما، ورجل كذب في خديعة الحرب»."]], "ic": "book"}, {"story": ["كتاب آفات اللسان (١٥ من ٣٠)، ص٦٧٠", ["فهذه الثلاث ورد فيها صريح الاستثناء، ويضاف إليها ما في معناها إذا ارتبط به غرض مقصود صحيح له أو لغيره.", "أما الذي له؛ فمثل أن يأخذه ظالم ويسأله عن ماله، فله أن ينكر، أو يأخذه السلطان ويسأله عن فاحشة بينه وبين الله ارتكبها، فله أن ينكر ويقول: ما زنيت ولا شربت. قال رسول الله ﷺ: «من أتى شيئا من هذه القاذورات، فليستتر بستر الله». وذلك، لأن إظهار الفاحشة فاحشة أخرى، وللرجل أن يحفظ دمه وماله الذي يؤخذ ظلما وعرضه بلسانه، وإن كان كاذبا.", "وأما عرض غيره؛ فمثل أن يسأل عن سر أخيه، فله أن ينكره، وأن يصلح بين اثنين وبين الضرتين من نسائه بأن يظهر لكل واحدة منهما أنها أحب إليه (٣)من الأخرى(٣)، وإن كانت امرأته لا تطيعه إلا بأن يعدها مالا يقدر عليه، فله أن يعدها في الحال تطييبا لقلبها، وكذلك إذا احتاج إلى أن يعتذر إلى إنسان، ولم يصح قبول الاعتذار إلا بإنكار ذنب وزيادة تودد، فلا بأس به.", "حاشية: (١) أخرجه البخاري (٢٦٩٢) ومسلم (٢٦٠٥) وأحمد (٢٧٢٧٢).", "حاشية: (٢) يقال: تتابع فلان في الشر وعليه، أي: تهافت وأسرع.", "حاشية: (٣-٣) سقط من (ظ).", "وإنما أبيح الكذب في هذه الأشياء، وإن كان محذورا؛ لأن الصدق فيها يتولد منه محذور أيضا، فينبغي أن يقابل المحذورين ويزنهما بميزان عدل، فإذا رأى أن المحذور الحاصل بالصدق أشد وقعا في الشرع من الكذب، فله الكذب، وإن كان ذلك المقصود أهون من مقصود الصدق، وجب الصدق، فإن تقابل الأمر(١) وتردد، فالصدق أولى؛ لأن الكذب مباح لضرورة وحاجة مهمة، فإذا شك في كون الحاجة مهمة، فالأصل التحريم.", "ولأجل غموض إدراك مراتب المقاصد ينبغي أن يحترز الإنسان من الكذب ما أمكنه.", "ومهما كانت الحاجة له فيستحب أن يترك أغراضه ويهجر الكذب، وأما إذا تعلق بعرض غيره، فلا يجوز المسامحة بحق الغير والإضرار به.", "وأكثر كذب الناس إنما هو لحظوظ أنفسهم، ثم أكثره لزيادات المال والجاه، ولأمور ليس فواتها محذورا، حتى إن المرأة لتحكي عن زوجها ما تتفاخر به وتكذب لأجل مراغمة الضرات، وذلك حرام.", "أخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أبو بكر بن مالك قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا أبو معاوية قال: حدثنا هشام بن عروة عن فاطمة بنت المنذر عن أسماء بنت أبي بكر قالت: جاءت امرأة إلى النبي ﷺ فقالت: يا رسول الله، إن علي ضرة، فهل علي جناح أن أتشبع من زوجي بما لم يعطني؟ فقال رسول الله ﷺ: «المتشبع بما لم يعط، كلابس ثوبي زور». أخرجاه في الصحيحين(٢).", "واعلم أنه يدخل في هذا فتوى العالم بما لا يتحققه وروايته للحديث الذي لا يتثبت(٣) فيه، إذ غرضه أن يظهر فضل نفسه، فهو لذلك يستنكف أن يقول: لا أدري. وذلك حرام.", "حاشية: (١) في (ظ): (الأمران).", "حاشية: (٢) أخرجه البخاري (٥٢١٩)، ومسلم (٢١٣٠)، وأحمد (١٦٩٢١)."]], "ic": "book"}, {"story": ["كتاب آفات اللسان (١٦ من ٣٠)، ص٦٧١", ["حاشية: (٣) في الأصل: (يثبت).", "**ذكر الكلام في المعاريض**", "أخبرنا (١-١)المبارك بن علي(١)، قال: أخبرنا شجاع بن فارس قال: أخبرنا محمد ابن علي بن الفتح قال: أخبرنا عمر بن ثابت قال: أخبرنا علي بن أحمد بن أبي قيس قال: حدثنا أبو بكر القرشي قال: حدثنا (٢-٢)إسماعيل بن إبراهيم(٢) بن بسام قال: حدثنا داود بن الزبرقان عن سعيد بن أبي عروبة، عن قتادة، عن زرارة بن أوفى، عن عمران بن حصين قال: قال رسول الله ﷺ: إن في المعاريض(٣) لمندوحة(٤) عن الكذب(٥).", "ورواه أبو عوانة عن قتادة عن مطرف عن عمران، فوقفه، وهو الأشبه(٦).", "وقال عمر بن الخطاب: أما في المعاريض ما يغني المسلم عن الكذب(٧).", "وقال: ما يسرني أن لي بما أعلم من معاريض القول مثل أهلي ومالي(٨).", "واعلم أن المعاريض إنما تصلح عند الحاجة إليها، فأما مع غير الحاجة فمكروهة؛ لأنها تشبه الكذب.", "حاشية: (١-١) في (ظ): (ابن المبارك). وهو غلط.", "حاشية: (٢-٢) في الأصل: (إبراهيم بن إسماعيل) وهو غلط.", "حاشية: (٣) المعاريض: جمع معراض، من التعريض بالقول، وهو خلاف التصريح، والتورية بالشيء عن الشيء.", "حاشية: (٤) مندوحة: فسحة وسعة.", "حاشية: (٥) أخرجه عن عمران بن حصين مرفوعا ابن عدي في الكامل ١/ ٣٥ و٣/ ٩٦، والبيهقي في السنن ١٠/ ١٩٩، وفي الشعب (٤٧٩٥)، والقضاعي في مسند الشهاب (١٠١١).", "حاشية: (٦) أخرجه البخاري في الأدب المفرد (٨٥٧)، وابن أبي شيبة (٢٦٠٩٦) والطبراني في الكبير ١٨/ ١٠٦، وهناد في الزهد (١٣٧٨)، والبيهقي في السنن ١٠/ ١٩٩، وفي الشعب (٤٧٩٤) موقوفا، وقال عقبه: هذا هو الصحيح موقوفا.", "حاشية: (٧) أخرجه البخاري في الأدب المفرد (٨٨٤)، وا
