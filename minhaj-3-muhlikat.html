حان الله ما أعجب ما بينكما في الطبع! أنت تحنو عليه، وهو يسعى في سفك دمك! أشهد إنك لكريم، وإنه للئيم. ثم أذن له في الانصراف، فلما ولى قال الأمير: أدام الله عيش مثلك في الناس.", "حاشية: (١) في (ظ): (فأتحفه).", "**بيان**", "**حقيقة الحسد وحكمه ومراتبه**", "اعلم أنه لا حسد إلا على نعمة، فإذا أنعم الله على أخيك نعمة فلك فيها حالتان:", "**إحداهما**: أن تكره تلك النعمة وتحب زوالها، وهذه الحالة تسمى حسدا؛ لأن الحسد كراهة النعمة وحب زوالها عن المنعم عليه.", "**والحالة الثانية**: أن لا تحب زوالها ولا تكره وجودها ودوامها لكنك تشتهي لنفسك مثلها، وهذا يسمى غبطة.", "قال العلماء: والحسد حرام؛ لأنه تسخط لقضاء الله في تفضيل بعض عباده على بعض.", "قلت(١): واعلم أني ما رأيت أحدا حقق الكلام في هذا كما ينبغي، ولا بد من كشفه، فأقول:", "فاعلم أن النفس قد جبلت على حب الرفعة، فهي لا تحب أن يعلوها جنسها فيما يمكن حصوله لها من النعم، فإذا علا عليها جنسها في ذلك شق عليها وكرهته، وأحبت زوال ما علاها به الجنس ليقع التساوي، وهذا أمر مركوز في الطباع لا يسلم منه أحد، ولا يقدر على صرفه عن نفسه، وقد روينا آنفا عن النبي ﷺ أنه قال: «ثلاث لا ينجو منهن أحد» فذكر منهن الحسد.", "وإنما يعالج ذلك تارة بالرضا بالقضاء، وتارة بالزهد وحساب الآخرة، فيتسلى بذلك ولا يعمل بمقتضى ما في النفس أصلا ولا ينطق، كما", "حاشية: (١) قبلها في (ظ): (قال الشيخ المصنف).", "أخبرنا المبارك بن علي قال: أخبرنا هبة الله بن أحمد بن ثابت قال: أخبرنا أبو طالب العشاري قال: أخبرنا أبو الحسين بن أخي ميمي قال: حدثنا أحمد بن محمد بن جعفر قال: حدثنا أبو بكر القرشي قال: حدثنا محمد بن سلام الجمحي قال: حدثنا حماد بن سلمة عن حميد قال: سمعت رجلا يسأل الحسن: هل يحسد المؤمن؟ قال: ما أنساك بني يعقوب لا أبالك؟ نعم، ولكن غمه في صدرك ولا يضرك.", "قلت(١): وهذا القول يوضح ما ذكرته، فإنه من لم يعمل بمقتضى مافي جبلته من الحسد كما فعل إخوة يوسف ولم ينطق بذم المحسود لم يضره ما وضع في الجبلة، وتكون كراهته لما في جبلته من ذلك تكفر ذلك.", "وهذا إنما يقرب الأمر فيه إذا كانت النعم تتعلق بالأغراض الدنيوية المحضة.", "وأما من يحسد نبيا على نبوته فيحب أن لا يكون، أو عالما على ما رزق من العلم، فيؤثر أن لا يرزق ذلك، أو أن يزول عنه، فهذا لا عذر فيه، ولا تجبل عليه إلا النفوس الكافرة أو الشريرة."]], "ic": "book"}, {"story": ["كتاب ذم الغضب والحقد والحسد (٢٣ من ٣٢)، ص٧٣٨", ["فأما إذا تشاغل بالعلم فأحب أن يسبق أقرانه، ويطلع على مالم يدركوه، فإنه لا يأثم؛ لأنه لا يؤثر زوال ذلك عنهم، بل أحب الارتفاع عليهم لتزيد حظوته عند ربه، كما لو استبق عبدان إلى حاجة مولاهما فأحب أحدهما أن يسبق صاحبه(٢)، وقد قال تعالى: ﴿وَفِى ذَٰلِكَ فَلْيَتَنَافَسِ ٱلْمُتَنَٰفِسُونَ﴾ [المطففين: ٢٦]، وفي الصحيحين من حديث ابن عمر عن النبي ﷺ أنه قال: «لا حسد إلا في اثنتين: رجل آتاه الله القرآن، فهو يقوم به آناء الليل والنهار، ورجل آتاه الله مالا، فهو ينفقه في الحق آناء الليل والنهار».", "حاشية: (١) قبلها في (ظ): (قال المصنف).", "حاشية: (٢) سقطت من (ظ).", "**بيان**", "**أسباب الحسد والمنافسة**", "**أما المنافسة**:", "فسببها حب ما فيه المنافسة، فإن كان ذلك أمرا دينيا فسببه حب الله تعالى وطاعته، وإن كان دنيويا، فسببه حب مباحات الدنيا والتنعم بها. وإنما ننظر الآن في الحسد المذموم، ومداخله كثيرة جدا، ولكن يحصر جملتها سبعة أسباب: العداوة، والتعزز، والتكبر، والتعجب، والخوف من فوت المقاصد المحبوبة، وحب الرياسة، وخبث(١) النفس وبخلها، فإنه إنما يكره النعمة عليه إما لأنه عدوه، فلا يريد له الخير، وهذا لا يختص بالأمثال، بل قد يحسد الخسيس الملك ويحب زوال نعمته؛ لأنه مبغض له بسبب إساءته إليه أو إلى من يحبه، وإما أن يكون من حيث يعلم أنه يستكبر بالنعمة عليه وهو لا يطيق احتمال كبره لعزة نفسه، وهو المراد بالتعزز، وإما أن يكون في طبعه أن يتكبر على المحسود ويمتنع ذلك عليه بنعمته، وهو المراد بالتكبر، وإما أن تكون النعمة عظيمة والمنصب كبيرا فتعجب من فوز مثله بمثل تلك النعمة وهو التعجب، وإما أن يخاف من فوات مقاصده بسبب نعمته بأن يتوصل بها إلى مزاحمته في أغراضه، وإما أن يكون لحب الرياسة التي تنبني على الاختصاص بنعمة لا يساوى فيها، وإما أن لا يكون لسبب من هذه الأسباب بل لخبث النفس(٢) وشحها بالخير على عباد الله تعالى.", "ولابد من شرح هذه الأسباب:", "**السبب الأول: العداوة والبغضاء**: وهو أشد أسباب الحسد، فإن من آذاه إنسان بسبب من الأسباب وخالفه في غرضه بوجه من الوجوه أبغضه قلبه وغضب عليه،", "حاشية: (١) في الأصل: (حب).", "حاشية: (٢) في (ظ): (النفوس).", "ورسخ في نفسه الحقد، والحقد يقتضي التشفي والانتقام، فإن عجز المبغض عن أن يتشفى بنفسه أحب أن يتشفى منه الزمان، وربما يحيل ذلك على كرامته عند الله، فمهما أصاب عدوه بلية فرح وظنه مكافأة من جهة الله على بغضه وأنه لأجله، ومهما أصابته نعمة ساءه ذلك؛ لأنه ضد مراده، وربما يظهر له أنه لا منزلة له عند الله حين لم ينتقم له من عدوه الذي آذاه، بل أنعم عليه."]], "ic": "book"}, {"story": ["كتاب ذم الغضب والحقد والحسد (٢٤ من ٣٢)، ص٧٤٠", ["وبالجملة؛ فالحسد يلزم البغض والعداوة ولا يفارقهما وإنما غاية التقى أن لا يبغي، وأن يكره ذلك من نفسه. فأما أن يبغض إنسانا ثم يستوي عنده مسرته ومساءته فهذا غير ممكن، وقد وصف الله سبحانه الكفار بالحسد للعداوة، فقال عز وجل: ﴿وَدُّوا۟ مَا عَنِتُّمْ قَدْ بَدَتِ ٱلْبَغْضَآءُ مِنْ أَفْوَٰهِهِمْ﴾ إلى قوله: ﴿إِن تَمْسَسْكُمْ حَسَنَةٌ تَسُؤْهُمْ﴾ [آل عمران: ١١٨ - ١٢٠].", "واعلم أن الحسد بسبب(١) البغض ربما أفضى إلى التنازع والقتال واستغراق العمر في التحيل لإزالة نعمة المحسود.", "**السبب الثاني: التعزز**: وهو أن يثقل عليه أن يترفع عليه غيره، فإذا أصاب بعض نظرائه ولاية أو مالا خاف أن يتكبر عليه، وهو لا يطيق تكبره، ولا تسمح نفسه باحتمال تفاخره عليه، فليس من غرضه أن يتكبر، بل من غرضه أن يدفع كبره، فإنه قد رضي بمساواته مثلا، ولكن لا يرضى بترفعه(٢) عليه.", "**السبب الثالث**: أن يكون في طبعه أن يتكبر عليه ويستصغره ويستخدمه، ويتوقع منه الانقياد له والمتابعة في أغراضه، فإذا نال نعمة خاف أن لا يحتمل تكبره ويترفع عن متابعته، وربما يتشوف إلى مساواته أو إلى أن يترفع عليه، فيعود متكبرا بعد أن كان متكبرا عليه.", "ومن التعزز والتكبر كان حسد أكثر الكفار لرسول الله ﷺ، فأنفوا(٣) أن يتقدم", "حاشية: (١) ليست في (ظ).", "حاشية: (٢) في (ظ): (يرتفع).", "حاشية: (٣) تصحفت في الأصل إلى: (فانقوا).", "عليهم يتيم فقير فقالوا: ﴿لَوْلَا نُزِّلَ هَٰذَا ٱلْقُرْءَانُ عَلَىٰ رَجُلٍ مِّنَ ٱلْقَرْيَتَيْنِ عَظِيمٍ﴾ [الزخرف: ٣١]، والمعنى: لو كان هذا، لم يثقل علينا اتباع من هو عظيم. وكذلك قالوا في المؤمنين: ﴿أَهَٰٓؤُلَآءِ مَنَّ ٱللَّهُ عَلَيْهِم مِّنۢ بَيْنِنَآ﴾ [الأنعام: ٥٣]، احتقارا لهم وأنفة منهم.", "**السبب الرابع: التعجب**: كما أخبر الله تعالى عن الأمم الماضية إذ قالوا: ﴿مَآ أَنتُمْ إِلَّا بَشَرٌ مِّثْلُنَا﴾ [يس: ١٥]، وقالوا: ﴿وَلَئِنْ أَطَعْتُمْ بَشَرًا مِّثْلَكُمْ إِنَّكُمْ إِذًا لَّخَٰسِرُونَ﴾ [المؤمنون: ٣٤]، فتعجبوا من أن يفوز برتبة الرسالة بشر مثلهم، فحسدوهم وأحبوا زوال تلك الرتبة عنهم جزعا أن يفضل عليهم من هو مثلهم في الخلقة لا عن قصد تكبر وطلب رياسة وتقدم عداوة، وقالوا متعجبين: ﴿أَبَعَثَ ٱللَّهُ بَشَرًا رَّسُولًا﴾ [الإسراء: ٩٤] فقال تعالى: ﴿أَوَعَجِبْتُمْ أَن جَآءَكُمْ ذِكْرٌ مِّن رَّبِّكُمْ عَلَىٰ رَجُلٍ مِّنكُمْ لِيُنذِرَكُمْ﴾ [الأعراف: ٦٣]."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "وأما شدة الحرص على فضول العيش؛ فتزال بالقناعة بقدر ____ طلبا لعز الاستغناء وترفعا عن ذل الحاجة", "o": ["الضرورة", "بأصابع", "فجمعوا", "فبالأحوج"], "h": "راجع: ص٧١٥"}, {"t": "fill", "d": 2, "q": "وقال عمرو بن ميمون: رأى موسى عليه السلام رجلا عند العرش فغبطه بمكانه فسأل عنه فقالوا: نخبرك بعمله؛ لا يحسد الناس على ما آتاهم ____ من فضله، ولا يمشي بالنميمة، ولا يعق", "o": ["الله", "لقلبه", "يكمد", "ولحسن"], "h": "راجع: ص٧٣٤"}, {"t": "fill", "d": 2, "q": "وقد روى أبو ذر رضي ____ عنه عن النبي ﷺ أنه قال", "o": ["الله", "بقلبك", "عنيد", "خطبها"], "h": "راجع: ص٧١٩"}, {"t": "fill", "d": 2, "q": "اعلم أن الحسد من الأمراض العظيمة للقلوب، ولا تداوى أمراض القلوب إلا بالعلم والعمل، والعلم النافع لمرض الحسد هو أن تعرف تحقيقا أن الحسد ضرر عليك في الدين والدنيا، وأنه لا ضرر به على المحسود في الدنيا والدين، بل ينتفع به في الدنيا والدين، ____ عرفت هذا عن بصيرة ولم تكن عدو نفسك وصديق عدوك فارقت الحسد لا محالة", "o": ["فإذا", "الجشمة", "أحاسب", "أعراض"], "h": "راجع: ص٧٤٧"}, {"t": "fill", "d": 2, "q": "أخبرنا إسماعيل بن أحمد قال: أخبرنا إسماعيل بن أحمد قال: أخبرنا محمد ابن هبة الله الطبري قال: أخبرنا ابن بشران، قال: حدثنا ابن صفوان. قال: حدثنا أبو بكر القرشي، قال: حدثنا إبراهيم بن محمد بن ____", "o": ["عرعرة", "السبب", "فوقكم", "اعتيادا"], "h": "راجع: ص٧١٩"}, {"t": "fill", "d": 2, "q": "ورسخ في نفسه الحقد، والحقد يقتضي التشفي والانتقام، فإن عجز المبغض عن أن يتشفى بنفسه أحب أن يتشفى منه الزمان، وربما يحيل ذلك على كرامته عند الله، فمهما أصاب عدوه بلية فرح وظنه مكافأة من جهة الله على بغضه وأنه لأجله، ومهما أصابته نعمة ساءه ذلك؛ لأنه ضد مراده، وربما يظهر له أنه لا منزلة له عند الله حين لم ينتقم له من عدوه الذي ____، بل أنعم عليه", "o": ["آذاه", "مساجد", "بقاؤهم", "بمثل"], "h": "راجع: ص٧٤٠"}]}, {"t": "كتاب ذم الغضب والحقد والحسد - القسم ٥ من ٦", "b": [{"story": ["كتاب ذم الغضب والحقد والحسد (٢٥ من ٣٢)، ص٧٤١", ["**السبب الخامس: الخوف من فوت المقاصد**: وذلك يختص بمتزاحمين على مقصود واحد، فإن كل واحد يحسد صاحبه في كل نعمة تكون عونا له في الانفراد بمقصوده، ومن هذا الجنس تحاسد الضرات في التزاحم على مقاصد الزوجية، وتحاسد الإخوة في التزاحم على نيل المرتبة من قلبي الأبوين للتوصل إلى مقاصد الكرامة والمال، وكذلك تحاسد التلميذين لأستاذ واحد في نيل المنزلة من قلب الأستاذ، وتحاسد ندماء الملك وخواصه في نيل المنزلة من قلبه للتوصل به إلى الجاه والمال، وكذلك تحاسد الواعظين في البلدة الواحدة إذا كان غرضهما المال ونيل القبول.", "**السبب السادس: حب الرياسة،** وطلب نفس الجاه من غير توسل به إلى مقصود، وذلك كالرجل الذي يريد أن يكون عديم النظير في فن من الفنون إذا غلب عليه حب الثناء واستفزه الفرح بما يمدح به من أنا واحد الدهر وفريد العصر في فنه، وأنه لا نظير له فإذا سمع بنظير له في أقصى العالم ساءه ذلك، وأحب موته أو زوال النعمة التي بها يشاركه في المنزلة من علم أو شجاعة أو عبادة أو صناعة أو ثروة أو غير ذلك مما يتفرد هو به ويفرح بسبب تفرده، وليس السبب في هذا عداوة", "ولا تعززا ولا تكبرا على المحسود، ولا خوفا من فوات مقصود سوى تمحض الرياسة بدعوى الانفراد، وهذا وراء ما بين آحاد العلماء من طلب الجاه والمنزلة في قلوب الناس للتوصل إلى مقاصد سوى الرياسة.", "وقد كان علماء اليهود ينكرون معرفة رسول الله ﷺ ولا يؤمنون خيفة أن تبطل رئاستهم واستتباعهم.", "**السبب السابع: خبث النفس**: وشحها على عباد الله عز وجل، فإنك تجد من لا يشتغل برئاسة ولا تكبر ولا طلب مال، فإذا وصف عنده حسن حال عبد من عباد الله تعالى فيما أنعم به عليه شق ذلك عليه، وإذا وصف له اضطراب أمور الناس وإدبارهم وفوات مقاصدهم وتنغص عيشهم، فرح به، فهو أبدا يحب الإدبار لغيره، ويبخل بنعمة الله على عباده، كأنهم يأخذون ذلك من ملكه وخزائنه، وقد قال العلماء: البخيل من يبخل بمال نفسه، والشحيح الذي يبخل بمال غيره، فهذا يبخل بنعمة الله على عباده الذين ليس بينه وبينهم عداوة ولا رابطة، وهذا ليس له سبب إلا خبث في النفس ورذالة في الطبع من جهة الجبلة، ومعالجته شديدة؛ لأن الحسد الثابت بسائر الأسباب(١) أسبابه عارضة، يتصور زوالها فيطمع في إزالتها، وهذا خبث في الجبلة(٢) لا عن سبب عارض فتعسر إزالته.", "فهذه أسباب الحسد، وقد يجتمع بعضها أو أكثرها أو جميعها في شخص واحد، فيعظم فيه الحسد لذلك، فلا يقدر على إخفاء ما عنده فيظهر العداوة بالمكاشفة، وأكثر المحاسدات يجتمع فيها جملة من هذه الأسباب وقلما يتجرد سبب منها.", "حاشية: (١) سقطت من الأصل.", "حاشية: (٢) في النسخ: (الجملة) والمثبت من الإحياء.", "**بيان**"]], "ic": "book"}, {"story": ["كتاب ذم الغضب والحقد والحسد (٢٦ من ٣٢)، ص٧٤٣", ["**السبب في كثرة الحسد بين الأمثال والأقران والإخوة وبني العم وذوي القربى وتأكده وقلته في غيرهم وضعفه**", "اعلم أن الحسد إنما يكثر بين قوم تكثر بينهم الأسباب التي ذكرناها وإنما يقوى بين قوم تجتمع فيهم جملة من هذه الأسباب وتتظاهر، إذ الشخص الواحد يجوز أن يحسد لأنه يمتنع من قبول التكبر، ولأنه يتكبر، ولأنه عدو، ولغير ذلك من الأسباب.", "وهذه الأسباب إنما تكثر بين أقوام تجمعهم روابط يجتمعون بسببها في مجالس المخاطبات، ويتواردون على الأغراض، فإذا خالف واحد صاحبه في غرض من أغراضه نفر طبعه وأبغضه، وثبت الحقد في قلبه، فعند ذلك يريد أن يستحقره ويتكبر عليه ويكافئه على مخالفته لغرضه، ويكره تمكنه من النعمة التي توصله إلى أغراضه.", "وتترادف جملة الأسباب، إذ لا رابطة بين شخصين في بلدين، فلا يكون بينهما محاسدة، إنما إذا تجاورا في مسكن أو سوق أو مسجد أو مدرسة تواردا على مقاصد تتناقض فيها أغراضهم، فيثور من التناقض التنافر والتباغض، ومنه تثور بقية أسباب الحسد، فلذلك ترى العالم يحسد العالم دون العابد، والعابد يحسد العابد دون العالم، والتاجر يحسد التاجر، بل الإسكاف(١) يحسد الإسكاف ولا يحسد البزاز(٢) إلا لسبب آخر سوى الاجتماع في الحرفة، ويحسد الرجل أخاه وابن عمه", "حاشية: (١) الإسكاف: صانع الأحذية ومصلحها.", "حاشية: (٢) البزاز: بائع البز، وهو نوع من الثياب.", "أكثر مما يحسد الأجانب، والمرأة تحسد ضرتها وسرية زوجها أكثر مما تحسد أم الزوج وابنته؛ لأن مقصد البزاز غير مقصد الإسكاف، فلا يتزاحمون على المقاصد، إذ مقصد البزاز الثروة ولا يحصلها إلا بكثرة الزبون، وإنما ينازعه في ذلك بزاز آخر، إذ حريف(١) البزاز لا يطلب الإسكاف، بل البزاز، ثم مزاحمة البزاز المجاور له أكثر من مزاحمة البعيد عنه إلى ظرف السوق، فلا جرم يكون حسده للجار أكثر، وكذلك الشجاع يحسد الشجاع ولا يحسد العالم؛ لأن مقصده أن يذكر بالشجاعة ويشتهر بها وينفرد بهذه الخصلة، ولا يزاحمه العالم على هذا الغرض، وكذلك يحسد العالم العالم ولا يحسد الشجاع، ثم حسد الواعظ للواعظ أكثر من حسده للفقيه والطبيب؛ لأن التزاحم بينهما على مقصود أخص.", "فأصل هذه المحاسدات العداوة، وأصل العداوة التزاحم على غرض واحد، والغرض الواحد لا يجمع متباعدين، بل يجمع متناسبين، فلذلك يكثر الحسد بينهم.", "إلا أن من اشتد حرصه على الجاه وأحب الصيت في جميع أطراف العالم بما هو فيه، فإنه يحسد كل من هو في العالم وإن بعد ممن يساهمه في الخصلة التي يتفاخر بها."]], "ic": "book"}, {"story": ["كتاب ذم الغضب والحقد والحسد (٢٧ من ٣٢)، ص٧٤٤", ["ومنشأ جميع ذلك حب الدنيا، فإن الدنيا هي التي تضيق على المتزاحمين، وأما الآخرة فلا ضيق فيها، وإنما مثال الآخرة نعمة العلم، فمن أحب معرفة الله تعالى ومعرفة صفاته وملائكته وأنبيائه وملكوت أرضه وسمائه، لم يحسد غيره إذا عرف ذلك أيضا؛ لأن المعرفة لا تضيق على العارفين بل المعلوم الواحد يعرفه ألف عالم، ويفرح بمعرفته ويلتذ به، ولا تنقص لذة واحد بسبب غيره، بل يحصل بكثرة(٢) العارفين زيادة الأنس وثمرة الإفادة والاستفادة، فلذلك لا يكون بين علماء الدين محاسدة؛ لأن مقصودهم معرفة الله، وهو بحر واسع لا ضيق فيه،", "حاشية: (١) الحريف، كشريف، المعامل لصاحب الحرفة، والجمع حرفاء.", "حاشية: (٢) تحرفت في (ظ) إلى: (فكرة).", "وغرضهم المنزلة عند الله ولا ضيق فيها أيضا فيما عند الله؛ لأن أجل ما عند الله من التنعيم لذة بقائه وليس فيها ممانعة ولا مزاحمة، ولا يضيق بعض الناظرين على بعض، بل يزيد الأنس بكثرتهم، إلا أنه إذا قصد العلماء بالعلم المال والجاه تحاسدوا، لأن المال هو أعيان وأجسام إذا وقعت في يد واحد خلت عنها يد الآخر، ومعنى الجاه ملك القلوب، ومتى امتلأ قلب شخص بتعظيم عالم انصرف عن تعظيم الآخر أو نقص منه لا محالة، فيكون ذلك سببا للمحاسدة، وإذا امتلأ قلب شخص بالفرح بمعرفة الله تعالى لم يمنع ذلك أن يمتلئ قلب غيره به وأن يفرح به، فالفرق بين العلم والمال أن المال لا يحل في يد ما لم يرتحل عن يد أخرى، والعلم في قلب العالم مستقر ويحل في قلب غيره بتعليمه من غير أن يرتحل عن قلبه، فالمال أجسام وأعيان ولها نهاية، فلو ملك الإنسان جميع ما في الأرض لم يبق بعده مال ليملكه غيره، والعلم لا نهاية له، ولا يتصور استيعابه، فمن عود نفسه الفكر في جلال الله وعظمته وملكوته صار ذلك ألذ عنده من كل نعيم، ولم يكن ممنوعا عنه ولا مزاحما فيه، فلا يكون في قلبه حسد لواحد من الخلق؛ لأن غيره لو عرف مثل معرفته لما نقص من لذته بل زادت لذته بمؤانسته، فتكون لذة هذا في مطالعة عجائب الملكوت على الدوام أعظم من لذة من ينظر إلى أشجار الجنة وبساتينها بالعين الظاهرة، فإن نعيم العارف وجنته معرفته التي هي صفة ذاته يأمن زوالها ويجني أبدا ثمارها، فهو بروحه وقلبه معتنق بفاكهة علمه، وهي فاكهة قطوفها دانية، غير مقطوعة ولا ممنوعة، فإن وجد كثير من العارفين لم يكونوا متحاسدين، بل إخوانا على سرر متقابلين، فهذه حالهم وهم في الدنيا، فما يظن بهم عند انكشاف الغطاء ومشاهدة المحبوب في العقبى؟"]], "ic": "book"}, {"story": ["كتاب ذم الغضب والحقد والحسد (٢٨ من ٣٢)، ص٧٤٥", ["فقد عرفت أنه لا حسد إلا في التوارد على مقصود يضيق عن الوفاء بالكل، ولهذا لا ترى الناس يتحاسدون على النظر إلى زينة السماء لأنها لسعة الأقطار وافية بجميع الأبصار، فعليك إن كنت بصيرا وعلى نفسك مشفقا أن تطلب نعيما لا زحمة فيه ولذة لا مكدر لها، ولا يوجد ذلك في الدنيا إلا في معرفة الله سبحانه ومعرفة صفاته وأفعاله وعجائب ملكوته ولا ينال ذلك في الآخرة إلا بهذه المعرفة أيضا،", "فإن كنت لا تشتاق إلى معرفة الله سبحانه، ولم تجد لذتها وضعفت فيها رغبتك، فلست برجل، إنما هذا شأن الرجال؛ لأن الشوق بعد الذوق، ومن لم يذق لم يعرف، ومن لم يعرف لم يشتق، ومن لم يشتق لم يطلب، ومن لم يطلب لم يدرك، ومن لم يدرك بقي مع المحرومين.", "**بيان**", "**الدواء الذي به ينفى مرض الحسد عن القلب**", "اعلم أن الحسد من الأمراض العظيمة للقلوب، ولا تداوى أمراض القلوب إلا بالعلم والعمل، والعلم النافع لمرض الحسد هو أن تعرف تحقيقا أن الحسد ضرر عليك في الدين والدنيا، وأنه لا ضرر به على المحسود في الدنيا والدين، بل ينتفع به في الدنيا والدين، فإذا عرفت هذا عن بصيرة ولم تكن عدو نفسك وصديق عدوك فارقت الحسد لا محالة.", "أما كونه ضررا عليك في الدين؛ فإنك بالحسد سخطت قضاء الله تعالى، وكرهت نعمته التي قسمها لعباده وعدله الذي أقامه في ملكه بخفي حكمته، فاستنكرت ذلك واستشنعته، وهذه جناية على عين التوحيد وقذى في بصر الإيمان، وناهيك بها جناية على الدين، وقد انضاف إليه(١) أنك غششت رجلا من المؤمنين(٢) وتركت نصيحته، وفارقت أنبياء الله عز وجل وأولياءه في حبهم الخير لعباده، وشاركت إبليس وسائر الكفار في محبتهم للمؤمنين البلايا وزوال النعم، وهذه خبائث في القلب تأكل حسنات القلب كما تأكل النار الحطب وتمحوها كما يمحو الليل النهار.", "وأما كونه ضررا في الدنيا عليك؛ فهو أنك تتألم(٣) بحسدك وتتعذب به، ولا تزال في كمد وغم، إذ أعداؤك لا يخليهم الله عن نعم يفيضها عليهم، فلا تزال تتعذب بكل نعمة تراها، وتتألم بكل بلية تنصرف عنهم، فتبقى مغموما محروما(٤)", "حاشية: (١) في الأصل: (إليك).", "حاشية: (٢) في الأصل: (المسلمين).", "حاشية: (٣) تحرفت في (ظ) إلى: (سالم).", "حاشية: (٤) في النسخ: (مرحوما)، والمثبت من الإحياء.", "متشعب القلب ضيق الصدر كما لا تشتهي لأعدائك، وكما يشتهي أعداؤك لك، فقد كنت تريد المحنة لعدوك فتنجزت في الحال محنتك وغمك نقدا، ولا تزول النعمة عن المحسود بحسدك.", "ولو لم تكن تؤمن بالبعث والحساب لكان مقتضى الفطنة إن كنت عاقلا أن تحذر من الحسد لما فيه من ألم القلب ومساءته مع عدم النفع، فكيف وأنت عالم بما في الحسد من العذاب الشديد في الآخرة؟ فالعجب من عاقل يتعرض لسخط الله من غير نفع يناله بل مع ضرر يحتمله وألم يقاسيه، فيهلك دينه ودنياه من غير جدوى ولا فائدة."]], "ic": "book"}, {"story": ["كتاب ذم الغضب والحقد والحسد (٢٩ من ٣٢)، ص٧٤٨", ["وأما قولنا: لا ضرر على المحسود في دينه ودنياه. فواضح؛ لأن النعمة لا تزول عنه بحسدك، بل ما قدره الله من إقبال ونعمة فلا بد أن يدوم إلى أجل قدره الله، فلا حيلة في دفعه ولا سبيل إلى تغييره، إذ لكل أجل كتاب، وإذا لم تزل النعمة بالحسد لم يكن على المحسود ضرر في الدنيا ولا إثم في الأخرى.", "وأما قولنا: إن المحسود ينتفع به في الدين والدنيا. فواضح؛ أما منفعته في الدين، فهو أنه مظلوم من جهتك لا سيما إذا أخرجك(١) الحسد إلى القول والفعل بالغيبة والقدح فيه وذكر مساوئه وهتك ستره، فإنك تهدي إليه بذلك حسناتك، فتلقاه في القيامة وأنت مفلس؛ فكأنك أردت زوال النعمة عنه فلم تزل وزالت نعم كانت عليك إذ نقلت إليه حسناتك فأضفت إلى نعمته نعمة وأضفت إلى شقاوتك شقاوة(٢).", "وأما منفعته في الدنيا، فهو أن أهم أغراض الخلق غم الأعداء وشقاوتهم، ولا عذاب أعظم مما أنت فيه من الحسد، وغاية أماني أعدائك أن يكونوا في نعمة وأن تكون في حسرة بسببهم، وقد فعلت بنفسك ما هو مرادهم، ولذلك لا يشتهي عدوك موتك بل يشتهي طول حياتك لتنظر إلى عذاب الحسد لتنظر إلى نعمة الله عليه فيتقطع قلبك حسدا، كما قال الشاعر:", "حاشية: (١) في النسخ: (أخرجت)، و المثبت من الإحياء.", "حاشية: (٢) سقطت من الأصل.", "لا مات أعداؤك بل خلدوا  حتى يروا منك الذي يكمد", "لا زلت محسودا على نعمة  فإنما الكامل من يحسد", "ففرح عدوك بغمك وحسدك أعظم من فرحه بنعمته، ولو علم خلاصك من ألم الحسد وعذابه لكان ذلك أعظم بلية عليه، فما أنت فيما تلازمه من غم الحسد إلا كما يشتهيه عدوك، فإذا تأملت ما ذكرنا علمت أنك عدو نفسك وصديق عدوك إذا تعاطيت ما تضررت به في الدنيا والآخرة وانتفع به عدوك في الدنيا والآخرة، وصرت مذموما عند الخلق والخالق، شقيا في الحال والمآل، ونعمة المحسود دائمة شئت أو أبيت.", "ثم لم تقتصر على تحصيل مراد عدوك حتى توصلت إلى إدخال أعظم سرور على إبليس الذي هو أعدى أعدائك؛ لأنه لما رآك قد حرمت النعم التي خص عدوك بها خاف أن تحب ذلك له فتشاركه في الثواب بسبب المحبة؛ لأن من أحب الخير للمسلمين كان شريكا في الخير، ومن فاته اللحاق بدرجة الأكابر في الدين، فلا ينبغي أن يفوته ثواب الحب لهم، فلما خاف إبليس أن تحب ما أنعم الله له على عبده في دينه ودنياه فتفوز بثواب الحب بغضه إليك حتى لا تلحقه بحبك كما لم تلحقه بعملك.", "وفي الصحيحين من حديث ابن مسعود وأبي موسى عن النبي ﷺ أنه قال: «المرء مع من أحب»."]], "ic": "book"}, {"story": ["كتاب ذم الغضب والحقد والحسد (٣٠ من ٣٢)، ص٧٤٩", ["أخبرنا عبد الأول قال: أخبرنا الداوودي قال: أخبرنا ابن أعين قال: حدثنا الفربري قال: حدثنا البخاري قال: حدثنا سليمان بن حرب قال: حدثنا حماد بن زيد(١) عن ثابت عن أنس أن رجلا سأل النبي ﷺ عن الساعة، فقال: متى الساعة؟ قال: «وماذا أعددت لها؟» قال: لا شيء، إلا أني أحب الله ورسوله. فقال: «أنت مع من أحببت». قال أنس: فما فرحنا بشيء فرحنا بقول النبي ﷺ: «أنت مع من", "حاشية: (١) تحرف في النسخ إلى: (زياد) والمثبت من صحيح البخاري (٣٦٨٨).", "أحببت». قال أنس: فأنا أحب النبي ﷺ وأبا بكر وعمر، وأرجو أن أكون معهم بحبي إياهم وإن لم أعمل بمثل أعمالهم. أخرجاه في الصحيحين.", "فانظر إلى إبليس كيف حسدك ففوت عليك ثواب الحب، ثم لم يقنع بذلك حتى بغضه إليك حتى أثمت، وكيف لا تأثم؟! وربما حسدت عالما وأحببت أن يخطئ في دين الله وينكشف خطؤه ويفتضح، وتحب أن يخرس لسانه حتى لايتكلم، ويمرض حتى لا يعلم ولا يتعلم، فليتك إذ فاتك اللحاق به ثم اغتممت بسببه سلمت من الإثم، فقد نفذ عليك حسد إبليس وما نفذ حسدك على عدوك بل على نفسك بل لو كوشفت بحالك في يقظة أو منام لرأيت نفسك في صورة من يرمي حجرا إلى عدوه ليصيب به مقتله، فلا يصيبه، بل يرجع على حدقته اليمنى فيقلعها، فيزيد غضبه، فيعود يرميه بأشد من الأولى فيرجع الحجر على عينه الأخرى فيعميها، فيزداد غيظه، فيعود فيرميه ثالثا فيعود الحجر على رأسه فيشجه، وعدوه سالم يضحك به.", "واعلم أن حالك في الحسد أقبح حالا من هذا المثل؛ لأن الحجر العائد لم يفوت إلا العين، ولو بقيت لفاتت بالموت، والحسد يعود بالإثم، والإثم لا يفوت بالموت، ولعله يسوق إلى غضب الله تعالى وإلى النار، فذهاب العين في الدنيا خير من بقاء عين يدخل بها إلى النار.", "فانظر كيف انتقم الله من الحاسد إذ أراد زوال النعمة عن المحسود، فلم يزلها عنه وأزال نعمة الحاسد إذ السلامة من الغم والكمد نعمة، والسلامة من الإثم نعمة، وقد زالتا عنه تصديقا لقوله تعالى: ﴿وَلَا يَحِيقُ ٱلْمَكْرُ ٱلسَّيِّئُ إِلَّا بِأَهْلِهِۦ﴾ [فاطر: ٤٣].", "وربما يبتلى بعين ما يشتهيه لعدوه، وقل ما يشمت شامت بمساءة إلا ويبتلى بمثلها، فقد روينا عن النبي ﷺ أنه قال: «لا تظهر الشماتة لأخيك، فيعافيه الله ويبتليك». فهذا إثم الحسد نفسه، فكيف ما يجر إليه الحسد من الأخلاق وجحود الحق وإطلاق اللسان واليد بالفواحش في التشفي من الأعداء، وهو الداء الذي هلكت فيه الأمم السالفة.", "فهذه هي الأدوية العلمية، فإذا تفكر الإنسان فيها بذهن صاف وقلب حاضر خمدت نار الحسد من قلبه؛ لأنه يعلم أنه مسخط لربه ومهلك نفسه ومفرح عدوه ومنغص عيشه."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "وهذه الأسباب إنما تكثر بين أقوام تجمعهم روابط يجتمعون بسببها في مجالس المخاطبات، ويتواردون على الأغراض، فإذا خالف واحد صاحبه في غرض من أغراضه نفر طبعه وأبغضه، وثبت الحقد في قلبه، فعند ذلك يريد أن يستحقره ويتكبر عليه ويكافئه على مخالفته لغرضه، ويكره تمكنه من ____ التي توصله إلى أغراضه", "o": ["النعمة", "لاقيت", "وباؤوا", "المحاورة"], "h": "راجع: ص٧٤٣"}, {"t": "fill", "d": 2, "q": "وقسم معاوية قطفا، فبعث منها بقطيفة إلى شيخ من أهل دمشق، فلم تعجبه، فجعل عليه ____ أن يضرب بها رأس معاوية، فأتى معاوية فأخبره، فقال له معاوية", "o": ["يمينا", "مرقعا", "بينهما", "التحفت"], "h": "راجع: ص٧٢٤"}, {"t": "fill", "d": 2, "q": "وإنما ينبسط الدم إذا غضب على من دونه واستشعر القدرة عليه، فإن صدر الغضب ممن فوقه وكان معه يأس من الانتقام تولد منه انقباض الدم من ظاهر ____ إلى جوف القلب، فصار حزنا، ولذلك يصفر اللون، وإن كان على نظير يشك فيه تردد الدم بين انقباض وانبساط فيحمر ويصفر ويضطرب", "o": ["الجلد", "أرضيت", "ومعالجة", "الدرداء"], "h": "راجع: ص٧٠٦"}, {"t": "fill", "d": 2, "q": "أخبرنا إسماعيل بن أحمد قال: أخبرنا محمد بن هبة الله الطبري قال: أخبرنا ابن بشران قال: أخبرنا ابن ____ قال: حدثنا أبو بكر القرشي قال: حدثنا", "o": ["صفوان", "قولي", "الخائض", "ومشابهة"], "h": "راجع: ص٧٢٩"}, {"t": "fill", "d": 2, "q": "السبب السابع: خبث النفس: وشحها على عباد الله عز وجل، فإنك تجد من لا يشتغل برئاسة ولا تكبر ولا طلب مال، فإذا وصف عنده حسن حال عبد من عباد الله ____ فيما أنعم به عليه شق ذلك عليه، وإذا وصف له", "o": ["تعالى", "يقصدوا", "يشرع", "اسمع"], "h": "راجع: ص٧٤٢"}, {"t": "fill", "d": 2, "q": "وقال أيوب السختياني: لا ينبل الرجل حتى تكون فيه خصلتان: العفة عما في أيدي ____، والتجاوز عن ما يكون", "o": ["الناس", "للملون", "وظنه", "وفضل"], "h": "راجع: ص٧٣٠"}]}, {"t": "كتاب ذم الغضب والحقد والحسد - القسم ٦ من ٦", "b": [{"story": ["كتاب ذم الغضب والحقد والحسد (٣١ من ٣٢)، ص٧٥١", ["أما العمل النافع فيه، فهو أن تتكلف بقيض ما يأمرك به الحسد، فإذا بعثه على القدح في المحسود كلف نفسه المدح له والثناء عليه، وإن حمله التكبر عليه ألزم نفسه التواضع له والاعتذار إليه، وإن بعثه على كف الإنعام عنه ألزم نفسه الزيادة في الإنعام، وقد كان جماعة من السلف إذا بلغهم أن شخصا اغتابهم أهدوا إليه وأعطوه، وأخبرنا أبو منصور القزاز قال: أخبرنا أبو بكر أحمد بن علي بن ثابت قال: حدثني التنوخي قال: كنت في جامع المنصور والخطيب على المنبر، وعلى يساري علي بن طلحة البصري، فمددت عيني فرأيت عبد الصمد(١) بالقرب مني، فقام ومشى نحوي، فقمت إليه فقال لي: اجلس أيها القاضي فليس إليك قصدت، ولا لك أردت بمجيئي، أنا هذا أردت وإليه قصدت - يعني ابن طلحة - وذلك أن نفسي تأباه، فأردت أن أذلها بقصده وأخالف إرادتها. فقام ابن طلحة إليه وقبل رأسه.", "واعلم أنه إذا جرت المواصلة والثناء والتواضع والمهاداة للحسود انقطعت في الغالب مادة الحسد؛ لأن السرور بالنعمة يستميل قلب المنعم عليه ويستعطفه ويحمله على مقابلة ذلك بالإحسان، ثم يصير تكلف المحسود في العطاء والمواصلة طبعا يوجب طيب قلبه للحاسد فتنكسر سورة العداوة(٢) من الجانبين ويقل غربها(٣) ويقرب القلوب من التآلف ويبعد عن التناقض، وقد قال عليه الصلاة والسلام: «تهادوا تحابوا».", "ولا ينبغي أن تسمع قول إبليس: إن مصانعتك للحسود مذلة ومهانة. فإن ذلك من خدع العدو؛ لأن المقصود سلامة القلوب والأديان وبذلك تحصل.", "حاشية: (١) هو عبد الصمد بن عمر بن محمد أبو القاسم الواعظ، والخبر في تاريخ بغداد ١١/ ٤٤.", "حاشية: (٢) في النسخ: (العدو)، والمثبت من الإحياء.", "حاشية: (٣) يقل غربها، أي: يكسر حدها.", "فهذه أدوية الحسد، وهي نافعة جدا، إلا أنها مرة بمرة، ومما يسهل شربها أن تعلم أنه ما يكون كل ماتريد، فأرد ما يكون، وهذا هو الدواء الكلي.", "وأما الدواء المفصل؛ فهو تتبع أسباب الحسد من الكبر وعزة النفس وغير ذلك مما سبق.", "وسيأتي تفصيل مداواة هذه الأسباب في مواضعها، فإنها مواد هذا المرض، ولا ينقمع المرض إلا بقمع المادة، وإذا لم تقمع المادة لم يحصل إلا تسكين المرض وتطفئته، ثم لا يزال يعود مرة بعد أخرى ويطول التعب في تسكينه مع بقاء مواده، فإنه ما دام محبا للجاه فلا بد أن يحسد من استأثر بالجاه والمنزلة في قلوب الناس دونه، ويغمه ذلك لا محالة، وإنما غايته أن يهون الغم على نفسه ولا يظهر شيئا من آثاره بلسانه ولا يده، وأما الخلو عنه رأسا، فلا يمكنه.", "**بيان**", "**القدر الواجب في نفي الحسد عن القلب**"]], "ic": "book"}, {"story": ["كتاب ذم الغضب والحقد والحسد (٣٢ من ٣٢)، ص٧٥٣", ["اعلم أن المؤذي ممقوت بالطبع، ومن آذاك لم يمكنك أن لا تبغضه غالبا، فإذا تيسرت(١) له نعمة فلا يمكنك أن لا تكرهها له، ولا يزال الشيطان يجرك إلى الحسد له، فإن قوي ذلك فيك حتى بعثك على إظهار الحسد بقول أو فعل بحيث يعرف ذلك من ظاهرك بأفعالك الاختيارية، فأنت حسود عاص بحسدك، وإن كففت ظاهرك بالكلية إلا أنك بباطنك تحب زوال النعمة، فقد سبق الكلام في هذا، وبينا أن من المركوز في الطباع كراهية ارتفاع الجنس على الجنس، وأن ذلك إذا كان في الأمور الدنيوية قريب الحال فيما يختلج في الباطن من الكراهة، فأما في أمور الدين وأحوال الآخرة، فلا مسامحة في ذلك.", "وينبغي للعاقل أن يمقت نفسه إذا وجد منها الحسد على شيء من الدنيا، ويود لو قدر على إزالة ذلك من باطنه ليقابل ما قد وضع في الطبع بتلك المجاهدة.", "فأما تغيير الطبع فلا يمكن إلا أن يكون الإنسان مستغرقا بمحبة الله سبحانه، فلا يلتفت إلى المحسود ولا إلى ما يحسد عليه من الدنيا، وهذا قد يقع لشخص ثم لا يثبت، فيعود الطبع.", "**آخر كتاب ذم الغضب والحقد والحسد.**", "حاشية: (١) في (ظ): (انتشرت)."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "وقال قوم: تجوز المقابلة بما لا كذب فيه؛ مثل أن يقول لمن أساء الأدب عليه: يا جاهل، ونحو ذلك، واستدلوا بما أخبرنا به ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أحمد بن ____ قال: حدثنا عبد الله بن", "o": ["جعفر", "صدقني", "فأخرجت", "ويفسده"], "h": "راجع: ص٧٢٧"}, {"t": "fill", "d": 2, "q": "أما التفريط؛ فبفقد هذه القوة أو ضعفها، وذلك ____، وهو صفة من لا حمية له، قال الشافعي", "o": ["مذموم", "يعوده", "يتردد", "استئصال"], "h": "راجع: ص٧٠٦"}, {"t": "fill", "d": 2, "q": "ولا تعززا ولا تكبرا على المحسود، ولا خوفا من فوات مقصود سوى تمحض الرياسة بدعوى الانفراد، وهذا وراء ما بين آحاد العلماء من طلب الجاه والمنزلة في قلوب ____ للتوصل إلى مقاصد سوى الرياسة", "o": ["الناس", "رحمته", "واعتقاد", "تؤمن"], "h": "راجع: ص٧٤٢"}, {"t": "fill", "d": 2, "q": "أن يحب ما يوافقه ويكره ما يخالفه، والغضب يتبع ذلك، فإنه مهما أخذ منه محبوبه غضب لا محالة، ____ قصد بمكروه غضب لا محالة، إلا أن ما يحبه الإنسان ينقسم إلى ثلاثة أقسام", "o": ["وإذا", "القصد", "وملبسه", "انثلم"], "h": "راجع: ص٧١٠"}, {"t": "fill", "d": 2, "q": "فقد عرفت أنه لا حسد إلا في التوارد على مقصود يضيق عن الوفاء بالكل، ولهذا لا ترى الناس يتحاسدون على النظر إلى زينة السماء لأنها لسعة الأقطار وافية بجميع الأبصار، فعليك إن كنت بصيرا وعلى نفسك مشفقا أن تطلب نعيما لا زحمة فيه ولذة لا مكدر لها، ولا يوجد ذلك في الدنيا إلا في معرفة الله سبحانه ومعرفة صفاته وأفعاله ____ ملكوته ولا ينال ذلك في الآخرة إلا بهذه المعرفة أيضا،", "o": ["وعجائب", "ومحكه", "بيتي", "واصطفائه"], "h": "راجع: ص٧٤٥"}, {"t": "fill", "d": 2, "q": "ولهذا لا ينبغي للسلطان أن يعاقب في حال غضبه؛ لئلا يتعدى الحق انتصارا لنفسه لا لله تعالى، قال عمر بن عبد العزيز ____ أغضبه", "o": ["لرجل", "سنين", "النحول", "يستحث"], "h": "راجع: ص٧٢٨"}]}], "sum": [["الصفحات", "ص٧٠١ - ص٧٥٤"]], "_nq": 36}, {"id": "l8", "title": "كتاب ذم الدنيا", "group": "كتاب ذم الدنيا", "map": {"center": "كتاب\nذم الدنيا", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "كتاب ذم الدنيا - القسم ١ من ٣", "b": [{"pic": ["books", "book"], "cap": "ص٧٥٥ - ص٧٧٤"}, {"story": ["كتاب ذم الدنيا (١ من ١٤)، ص٧٥٥", ["وهو الكتاب السادس من ربع المهلكات", "الحمد لله الذي كشف عيوب الدنيا لأهل النظر والافتقاد، وفضح زائف درهمها عند أرباب الانتقاد، فما يفي فرحها بترحها ولا بغضها بالوداد، إن بدرت حلوا قطعته قبل الحصاد، أووعدت روحا أخلفت الميعاد، تتزين لطلابها فإذا صاروا من أحبابها رمتهم بصبيانها بين الأشهاد، لا يسلم طلوعها من كسوفها، والمنكر داخل في معروفها، والأمن يعز في مخوفها، والنقص في المستزاد، من استراح بها ألم ومن ارتاح إليها ندم ومن طلب مأموله منها عدم ولا والله ما سلم منها إلا الزهاد، هي لمكرمها مهينة؛ لأنها مهينة، والغدر جبلة فيها في أصل الطينة، ﴿ٱعْلَمُوٓا۟ أَنَّمَا ٱلْحَيَوٰةُ ٱلدُّنْيَا لَعِبٌ وَلَهْوٌ وَزِينَةٌ وَتَفَاخُرٌۢ بَيْنَكُمْ وَتَكَاثُرٌ فِى ٱلْأَمْوَٰلِ وَٱلْأَوْلَـٰدِ﴾ [الحديد: ٢٠].", "أحمده على التوفيق للسداد، وأسأله(١) مواهب الهدى والرشاد، وأقر بأنه واحد لا كالآحاد، وأصلي على رسوله محمد المبعوث إلى جميع العباد، وعلى آله وأصحابه صلاة تحظيهم بغايات المراد، وتبقى وتدوم إلى حين قيام الأشهاد وسلم تسليما كثيرا.", "أما بعد؛ فإن القرآن العزيز قد أطلق عيب الدنيا وجاء ذلك في النقل الصحيح، وما زال العقلاء يطلقون ذمها ويحذرون مكرها وغوائلها.", "حاشية: (١) قبلها في الأصل: (وأشكره).", "ولا بد أولا من معرفة حقيقة الدنيا وما هي، وما الحكمة في خلقها مع وجود آفاتها وعيوبها، وما مداخل غرورها وشرورها، ونحن نذكر من ذلك ما يحصل به المقصود إن شاء الله تعالى.", "**بيان**", "**ذم الدنيا**", "الآيات الواردة في عيب الدنيا والتزهيد فيها وضرب الأمثال لها كثيرة، كقوله تعالى: ﴿زُيِّنَ لِلنَّاسِ حُبُّ ٱلشَّهَوَٰتِ﴾ إلى قوله: ﴿ذَٰلِكَ مَتَـٰعُ ٱلْحَيَوٰةِ ٱلدُّنْيَا وَٱللَّهُ عِندَهُۥ حُسْنُ ٱلْمَـَٔابِ قُلْ أَؤُنَبِّئُكُم بِخَيْرٍ مِّن ذَٰلِكُمْ﴾ الآية [آل عمران: ١٤ - ١٥]، وقوله: ﴿وَمَا ٱلْحَيَوٰةُ ٱلدُّنْيَآ إِلَّا مَتَـٰعُ ٱلْغُرُورِ﴾ [آل عمران: ١٨٥]، وقوله: ﴿إِنَّمَا مَثَلُ ٱلْحَيَوٰةِ ٱلدُّنْيَا كَمَآءٍ أَنزَلْنَـٰهُ مِنَ ٱلسَّمَآءِ﴾ [يونس: ٢٤]، وقوله: ﴿ٱعْلَمُوٓا۟ أَنَّمَا ٱلْحَيَوٰةُ ٱلدُّنْيَا لَعِبٌ وَلَهْوٌ وَزِينَةٌ﴾ [الحديد: ٢٠]، وقوله: ﴿وَإِن كُلُّ ذَٰلِكَ لَمَّا مَتَـٰعُ ٱلْحَيَوٰةِ ٱلدُّنْيَا وَٱلْـَٔاخِرَةُ عِندَ رَبِّكَ لِلْمُتَّقِينَ﴾ [الزخرف: ٣٥]، وقوله: ﴿فَأَعْرِضْ عَن مَّن تَوَلَّىٰ عَن ذِكْرِنَا وَلَمْ يُرِدْ إِلَّا ٱلْحَيَوٰةَ ٱلدُّنْيَا ذَٰلِكَ مَبْلَغُهُم مِّنَ ٱلْعِلْمِ﴾ [النجم: ٢٩ - ٣٠]."]], "ic": "book"}, {"story": ["كتاب ذم الدنيا (٢ من ١٤)، ص٧٥٧", ["وأما الأحاديث والآثار؛ فقد أخبرنا هبة الله بن محمد الشيباني قال: أخبرنا الحسن بن علي التميمي قال: أخبرنا أبو بكر بن مالك قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا وكيع قال: حدثنا إسماعيل بن أبي خالد عن قيس عن المستورد قال: قال رسول الله ﷺ: «ما الدنيا في الآخرة إلا كمثل ما يجعل أحدكم إصبعه هذه في اليم، فلينظر بم ترجع». وأشار بالسبابة(١).", "وأخبرنا أبو الفتح الكروخي قال: أخبرنا أبو عامر الأزدي وأبو بكر الغورجي قالا: أخبرنا الجراحي قال: حدثنا المحبوبي قال: حدثنا الترمذي قال: حدثنا قتيبة قال: حدثنا عبد العزيز بن محمد عن العلاء بن عبد الرحمن عن أبيه عن أبي هريرة قال: قال رسول الله ﷺ: «الدنيا سجن المؤمن وجنة الكافر».", "قال قتيبة: وحدثنا عبد الحميد بن سليمان عن أبي حازم عن سهل بن سعد قال: قال رسول الله ﷺ: «لو كانت الدنيا تعدل عند الله جناح بعوضة ما سقى", "حاشية: (١) أخرجه أحمد في المسند (١٨٠٠٨)، ومسلم (٢٨٥٨).", "كافرا منها شربة ماء». هذا حديث حكم بصحته الترمذي، وأما اللذان قبله فانفرد بإخراجهما مسلم(١).", "أخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أبو بكر بن مالك قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا عفان قال: حدثنا حماد ابن زيد(٢) قال: حدثنا مجالد بن سعيد عن قيس بن أبي حازم عن المستورد قال: كنت في ركب مع رسول الله ﷺ إذ مر بسخلة ميتة منبوذة، فقال رسول الله ﷺ: «أترون هذه هانت على أهلها؟» فقالوا: يا رسول الله، من هوانها ألقوها. قال: «فوالذي نفس محمد بيده للدنيا أهون على الله من هذه على أهلها»(٣).", "قال الإمام أحمد: وحدثنا أبو سعيد قال: حدثنا سليمان عن عمرو بن أبي عمرو عن عاصم عن عمر بن قتادة عن محمود بن لبيد أن رسول الله ﷺ قال: «إن الله عز وجل ليحمي عبده المؤمن الدنيا وهو يحبه، كما تحمون مريضكم الطعام والشراب تخافونه عليه»(٤).", "قال الإمام أحمد: وحدثنا أبو معاوية قال: حدثنا الأعمش عن شمر بن عطية عن مغيرة بن سعد بن الأخرم عن أبيه عن عبد الله(٥) قال: قال رسول الله ﷺ: «لا تتخذوا الضيعة فترغبوا في الدنيا»(٦).", "وروى محمد بن المنكدر عن أبيه عن النبي ﷺ أنه قال: «الدنيا ملعونة ملعون ما فيها إلا ما كان لله منها».", "حاشية: (١) في الأصل: (فأخرجهما مسلم).", "حاشية: (٢) تحرف في الأصل إلى: (يزيد).", "حاشية: (٣) أخرجه أحمد (١٨٠١٣) و(١٨٠٢٠).", "حاشية: (٤) أخرجه أحمد (٢٣٦٢٢) و(٢٣٦٢٧) و(٢٣٦٣٢).", "حاشية: (٥) هو عبد الله بن مسعود رضي الله عنه."]], "ic": "book"}, {"story": ["كتاب ذم الدنيا (٣ من ١٤)، ص٧٥٨", ["حاشية: (٦) أخرجه أحمد (٣٥٧٩) و(٤٠٤٨) و(٤٢٣٤)، والضيعة: حرفة الرجل وصناعته ومعاشه وكسبه، والنهي عن اتخاذ الضيعة إنما يراد به التوسع في ذلك والانصراف إليه بالكلية، وإهمال الواجبات الأخرى المطلوبة منه، أما عمله في حرفته أو صناعته أو زراعته ليكفي نفسه وعياله ويفيد الناس ويستفيد، فهو مما حض عليه رسول الله ﷺ.", "وروى أبو موسى عن النبي ﷺ قال: «من أحب آخرته أضر بدنياه، فآثروا ما يبقى على ما يفنى».", "ووصف علي بن أبي طالب الدنيا فقال: دار من صح فيها سقم، ومن أمن فيها ندم، ومن افتقر فيها حزن، ومن استغنى فيها فتن، في حلالها الحساب، وفي حرامها النار.", "وقال ابن مسعود: الدنيا دار من لا دار له، ومال من لا مال له، ولها يجمع من لا عقل له.", "(١-١)أخبرنا أحمد بن محمد المذاري قال: أخبرنا الحسين بن أحمد بن البنا قال: أخبرنا ابن بشران قال: حدثنا ابن صفوان قال: حدثنا أبو بكر القرشي(١-١) قال: حدثنا أبو جعفر محمد بن يزيد الآدمي قال: حدثنا معن بن عيسى قال: حدثنا إبراهيم بن عبد الله بن أبي الأسود عن الحسن أنه كتب إلى عمر بن عبد العزيز: أما بعد، فإن الدنيا دار ظعن ليست بدار إقامة، وإنما أنزل آدم إليها عقوبة، فاحذرها يا أمير المؤمنين، فإن الزاد منها تركها والغنى فيها فقرها، لها في كل حين قتيل، تذل من أعزها، وتفقر من جمعها، هي كالسم يأكله من لا يعرفه وهو حتفه، فكن فيها كالمداوي جراحته يحتمي قليلا مخافة طول البلاء، فاحذر هذه الدار الغرارة الختالة الخداعة، التي قد تزينت بخدعها، وفتنت بغرورها، وختلت بآمالها، وتشوفت لخطابها فأصبحت كالعروس المجلوة، فالعيوب إليها ناظرة، والقلوب عليها والهة، والنفوس لها عاشقة، وهي لأزواجها كلهم قاتلة، فلا الباقي بالماضي معتبر، ولا الآخر بالأول مزدجر، ولا العارف بالله عز وجل حين أخبره عنها مدكر، فعاشق لها قد ظفر منها بحاجته فاغتر وطغى ونسي المعاد، فشغل فيها لبه حتى زلت عنه قدمه، فعظمت ندامته وكثرت حسرته، واجتمعت عليه سكرات الموت وألمه، وحسرات الفوت بغصته، فذهب بكمده ولم يدرك منها ما طلب، ولم يروح نفسه", "حاشية: (١-١) سقط من (ظ)، وورد في حاشيتها ما نصه: (هذا السطر كان قد انطمس بالتصاق جزء المصنف فليحقق من مناقب الحسن)."]], "ic": "book"}, {"story": ["كتاب ذم الدنيا (٤ من ١٤)، ص٧٦٠", ["من التعب، فخرج بغير زاد، وقدم على غير مهاد، فاحذرها يا أمير المؤمنين، وكن أسر ما تكون فيها أحذر ما تكون لها، فإن صاحب الدنيا كلما اطمأن منها إلى سرور أشخصته إلى مكروه، السارة فيها غدا ضارة، وقد وصل الرخاء منها بالبلاء، وجعل البقاء فيها إلى فناء، فسرورها مشوب بالحزن، لا يرجع منها ما ولى فأدبر، ولا يدرى ما هو آت فينتظر، أمانيها كاذبة، وآمالها باطلة، وصفوها كدر، وعيشها نكد، فلو كان الخالق لم يخبر عنها خبرا ولم يضرب لها مثلا لكانت الدنيا قد أيقظت النائم ونبهت الغافل، فكيف وقد جاء منذ الله عز وجل عنها زاجر، وفيها واعظ، فما لها عند الله تعالى قدر ولا وزن، وما نظر إليها من خلقها، ولقد عرضت على نبينا ﷺ بمفاتيحها وخزائنها لا ينقصه ذلك عند الله جناح بعوضة، فأبى أن يقبلها وكره أن يحب ما أبغض خالقه أو يرفع ما وضع مليكه، فزواها عن الصالحين اختيارا، وبسطها لأعدائه اغترارا، فيظن المغرور بها المقتدر عليها أنه أكرم بها ونسي ما صنع الله بمحمد حين شد الحجر على بطنه.", "وقال الحسن: والله ما أحد من الناس يبسط له دنيا فلم يخف أن يكون قد مكر به فيها إلا كان قد نقص عقله وعجز رأيه، وما أمسك الله عن عبد فلم يظن أنه قد خير له فيها إلا كان قد نقص عقله وعجز رأيه.", "ابن آدم، لا تعلق قلبك بالدنيا فتعلقه بشر معلق، قطع حبالها، وغلق أبوابها، حسبك أيها المرء ما بلغك المحل، هيهات هيهات، ذهبت الدنيا بحال بابها وبقيت الأعمال قلائد في الأعناق.", "وكان يقول: خباث، كل عيدانك قد مصصنا فوجدنا مرا.", "وكان يقول: إن قوما أكرموا الدنيا فصلبتهم على الخشب، فأهينوها، فأهنأ ما تكون إذا أهنتموها.", "وقال مالك بن دينار: اتقوا السحارة، فإنها تسحر قلوب العلماء. يعني الدنيا.", "وقال: بقدر ما تحزن للدنيا، فكذلك تخرج هم الآخرة من قلبك، وبقدر ما تحزن للآخرة، فكذلك تخرج هم الدنيا من قلبك.", "وقد روينا أن عيسى عليه السلام قال: لا تتخذوا الدنيا ربا فتتخذكم الدنيا عبيدا، اعبروها ولا تعمروها، واعلموا أن أصل كل خطيئة حب الدنيا، ورب شهوة أورثت أهلها حزنا طويلا. ما سكنت الدنيا في قلب عبد إلا التاط قلبه منها بثلاث: شغل لا ينفك عناؤه وفقر لا يدرك غناؤه، وأمل لا يدرك منتهاه. الدنيا طالبة ومطلوبة، فطالب الآخرة تطلبه الدنيا حتى يستكمل فيها رزقه، وطالب الدنيا تطلبه الآخرة حتى يجيء الموت فيأخذ بعنقه، يا معشر الحواريين، ارضوا بدنيء الدنيا مع سلامة الدين، كما رضي أهل الدنيا بدنيء الدين مع سلامة الدنيا."]], "ic": "book"}, {"story": ["كتاب ذم الدنيا (٥ من ١٤)، ص٧٦١", ["أخبرنا أحمد بن محمد المذاري قال: أخبرنا أبو علي ابن البنا قال: أخبرنا أبو الحسين بن بشران قال: حدثنا ابن صفوان قال: حدثنا عبد الله بن محمد القرشي قال: حدثنا هارون بن عبد الله قال: حدثنا سيار قال: حدثنا جعفر قال: حدثنا مالك بن دينار قال: قال أبو هريرة: الدنيا مزخرفة ما بين السماء والأرض كالشن البالي تنادي ربها منذ خلقها إلى يوم يفنيها: يارب، لم تبغضني؟ يارب لم تبغضني؟ فيقول لها: اسكتي يا لا شيء، اسكتي يالا شيء.", "قال القرشي: وحدثنا محمد بن علي قال: حدثنا أبو إسحاق قال: سمعت الفضيل يقول: تجيء الدنيا يوم القيامة تتبختر في زينتها ونضرتها، فتقول: يارب، اجعلني لأحسن عبادك دارا. فيقول لها: لا أرضاك له، أنت لا شيء، فكوني هباء منثورا، فتكون هباء منثورا.", "**بيان**", "**صفة الدنيا بالأمثلة**", "اعلم أن الدنيا سريعة الفناء، قريبة الانقضاء، تعد بالبقاء ثم تخلف في الوفاء، تنظر إليها فتراها ساكنة مستقرة، وهي سائرة سيرا عنيفا، ومرتحلة ارتحالا سريعا، ولكن الناظر إليها لا يحس بحركتها، إنما يحس عند انقضائها، ومثالها الظل، فإنه متحرك في الحقيقة ساكن في الظاهر، لا تدرك حركته بالبصر الظاهر بل بالبصيرة الباطنة، ولما ذكرت الدنيا عند الحسن البصري أنشد:", "أحلام نوم أو كظل زائل  إن اللبيب بمثلها لا يخدع", "وكان الحسن [بن علي رضي الله عنه](١) يتمثل:", "يا أهل لذات دنيا لا بقاء لها  إن اغترارا بظل زائل حمق", "ونزل أعرابي بقوم فقدموا له طعاما، فأكل ثم قام إلى ظل خيمة فنام، فاقتلعوا الخيمة وأصابته الشمس فانتبه فقام وهو يقول:", "ألا إنما الدنيا كظل نبيته  ولابد يوما أن ظلك زائل", "وقال آخر:", "وإن امرأ دنياه أكبر همه  لمستمسك منها بحبل غرور", "مثال آخر(٢): الدنيا من حيث التغرير بخيالاتها ثم الإفلاس منها بعد إفلاتها تشبه خيالات المنام وأضغاث الأحلام.", "قال يونس بن عبيد: ما شبهت الدنيا إلا كرجل نائم، فرأى في منامه ما يكره وما", "حاشية: (١) في النسخ: (وكان يتمثل) والمثبت من الإحياء والإتحاف.", "حاشية: (٢) تحرفت في الأصل إلى: (وقال).", "يحب، فبينما هو كذلك انتبه. ومثل هذا قولهم: الناس نيام، فإذا ماتوا انتبهوا. والمعنى: أنهم ينتبهون بالموت وليس في أيديهم شيء مما ركنوا إليه وفرحوا به.", "وقيل لبعض الحكماء: أي شيء أشبه بالدنيا؟ فقال: أحلام النائم.", "مثال آخر للدنيا في عداوتها لأهلها وإهلاكها بنيها: اعلم أن طبع الدنيا التلطف في الاستدراج أولا، والتوصل إلى الإهلاك آخرا، فهي كامرأة تتزين للخطاب حتى إذا نكحتهم ذبحتهم."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "قال الإمام أحمد: وحدثنا أبو معاوية قال: حدثنا الأعمش عن شمر بن عطية عن مغيرة بن سعد بن الأخرم عن ____ عن عبد الله قال: قال رسول الله ﷺ: «لا تتخذوا الضيعة فترغبوا في", "o": ["أبيه", "أبيع", "التآلف", "يدفعه"], "h": "راجع: ص٧٥٨"}, {"t": "fill", "d": 2, "q": "وكان بعض السلف يقول لأصحابه: انطلقوا حتى أريكم مثل الدنيا. فيذهب بهم إلى مزبلة، فيقول: ____ إلى ثمارهم ودجاجهم وعسلهم", "o": ["انظروا", "الخير", "وليراقب", "ليقل"], "h": "راجع: ص٧٦٦"}, {"t": "fill", "d": 2, "q": "وأخبرنا أبو الفتح الكروخي قال: أخبرنا أبو عامر الأزدي وأبو بكر الغورجي قالا: أخبرنا الجراحي قال: حدثنا المحبوبي قال: حدثنا الترمذي قال: حدثنا قتيبة قال: حدثنا عبد ____ بن محمد عن العلاء بن عبد", "o": ["العزيز", "وكذلك", "الواثق", "والثلب"], "h": "راجع: ص٧٥٧"}, {"t": "fill", "d": 2, "q": "أبمنازل آبائك في الثرى؟ أم بمضاجع أمهاتك في البلى؟ كم رأيت موروثا، كم عللت بكفيك عليلا؟ كم مرضت بيديك مريضا تبتغي له الشفاء وتستوصف له الأطباء؟ لم تنفعه بشفاعتك، ولم تسعفه ____، مثلت لك الدنيا غداة", "o": ["بطلبك", "أقاربه", "كلاب", "يزني"], "h": "راجع: ص٧٧٣"}, {"t": "fill", "d": 2, "q": "وظن آخرون أن المقصود من العبادات المجاهدة حتى يصل العبد بها إلى معرفة الله، فإذا حصلت ____ فقد وصل، فاستغنى عن التعب، وزعموا أن قد ارتفع", "o": ["المعرفة", "متوكل", "وخوفهم", "فالحياة"], "h": "راجع: ص٧٧٣"}, {"t": "fill", "d": 2, "q": "ومن هؤلاء من بالغ في الرياضة فرأى أن الطبع لا ينقلع، فتوهم أن ما كلفه الشرع محال فوقع في الإلحاد، ووقع لبعضهم أن هذه المجاهدات لا فائدة فيها؛ لأن الله تعالى مستغن عنها فلا تنفعه طاعة ولا تضره معصية، فسلكوا مسلك ____ وطووا بساط الشرع، وظنوا أن ذلك من صفاء توحيدهم حيث اعتقدوا أن الله مستغن عن عبادة عباده", "o": ["الإباحة", "أعدائك", "المهيجة", "جبلته"], "h": "راجع: ص٧٧٣"}]}, {"t": "كتاب ذم الدنيا - القسم ٢ من ٣", "b": [{"story": ["كتاب ذم الدنيا (٦ من ١٤)، ص٧٦٣", ["أخبرنا أحمد بن محمد المذاري قال: أخبرنا ابن بشران قال: أخبرنا ابن صفوان قال: أخبرنا أبو بكر القرشي قال: حدثني أبو علي الطائي قال: حدثنا عبد الرحمن المحاربي عن ليث أن عيسى ابن مريم رأى الدنيا في صورة عجوز هتماء عليها من كل زينة، فقال لها: كم تزوجت؟ فقالت: لا أحصيهم. قال: فكلهم مات عنك أو كلهم طلقك؟ قالت: بل كلهم قتلت. فقال عيسى عليه السلام: بؤسا لأزواجك الباقين كيف(١-١) لا يعتبرون بأزواجك الماضين كيف(١-١) تهلكيهم واحدا واحدا. ولا يكونون منك على حذر.", "مثال آخر في مخالفة باطنها لظاهرها:", "اعلم أن الدنيا مزينة الظواهر قبيحة السرائر، تشبه عجوزا مزينة تخدع الناس بظاهرها، فإذا كشفوا قناعها ووقفوا على باطنها بانت لهم قبائحها، فندموا على اتباعهم لها، وخجلوا من الاغترار بها.", "أخبرنا أحمد بن محمد المذاري قال: أخبرنا الحسن بن أحمد بن البنا، قال: أخبرنا ابن بشران قال: أخبرنا ابن صفوان قال: حدثنا أبو بكر القرشي قال: حدثنا محمد بن علي بن شقيق قال: حدثنا إبراهيم بن الأشعث قال: سمعت الفضيل بن عياض يقول: قال ابن عباس: يؤتى بالدنيا يوم القيامة في صورة عجوز شمطاء زرقاء، أنيابها بادية، مشوه خلقها، فتشرف على الخلائق فيقال: تعرفون هذه؟", "حاشية: (١-١) سقط من (ظ).", "فيقولون: نعوذ بالله من معرفة هذه. فيقال: هذه الدنيا التي تناحرتم عليها، بها تقاطعتم الأرحام، وبها تحاسدتم وتباغضتم واغتررتم. ثم تقذف في جهنم فتنادي: يا رب أين أتباعي وأشياعي. فيقول الله عز وجل: ألحقوا بها أتباعها وأشياعها.", "قال القرشي: وحدثنا إسحاق بن إسماعيل قال: حدثنا روح بن عبادة قال: حدثنا عوف عن أوفى بن دلهم عن أبي العلاء قال: رأيت في النوم عجوزا كبيرة متغضنة الجلد، عليها من كل زينة الدنيا، والناس عكوف عليها متعجبون ينظرون إليها، فجئت فنظرت، فعجبت من نظرهم إليها وإقبالهم عليها، فقلت لها: ويلك من أنت؟ قالت: أما تعرفني؟ قلت: لا، ما أدري ما أنت. قالت: فإني أنا الدنيا. قال: قلت: أعوذ بالله من شرك. قالت: فإن أحببت أن تعاذ من شري فأبغض الدرهم.", "قال القرشي: وحدثنا إبراهيم بن سعيد الجوهري قال: حدثنا سفيان بن عيينة قال: قال لي أبو بكر بن عياش: رأيت الدنيا في النوم عجوزا شمطاء(١) مشوهة حدباء.", "وحدثني غير إبراهيم بن سعيد أن أبا بكر بن عياش قال: رأيت في النوم عجوزا شمطاء مشوهة تصفق بيديها، وخلفها خلق يتبعونها ويصفقون ويرقصون، فلما كانت بحذائي أقبلت علي فقالت: لو ظفرت بك صنعت بك ما صنعت بهؤلاء. قال: ثم بكى أبو بكر وقال: رأيت هذا قبل أن أقدم إلى بغداد."]], "ic": "book"}, {"story": ["كتاب ذم الدنيا (٧ من ١٤)، ص٧٦٤", ["قال القرشي: وحدثنا محمد بن علي قال: حدثنا إبراهيم بن الأشعث قال: سمعت الفضيل قال: بلغني أن رجلا عرج بروحه فإذا بامرأة على قارعة الطريق عليها من كل زينة الحلي والثياب، وإذا لا يمر بها أحد إلا جرحته، وإذا هي أدبرت كانت أحسن شيء رآه الناس، وإذا أقبلت أقبح شيء، عجوزا شمطاء زرقاء عمشاء، فقلت: أعوذ بالله منك. قالت: لا والله، لا يعيذك الله حتى تبغض الدرهم. قال: قلت: من أنت؟ قالت: أما تعرفني؟ قلت: لا. قالت: أنا الدنيا.", "حاشية: (١) ليست في الأصل.", "مثال آخر للدنيا وعبور الناس بها:", "اعلم أن أحوالك ثلاث: حالة لم تكن فيها شيئا، وهي ما قبل أن توجد، وحالة أخرى، وهي من ساعة موتك إلى ما لا نهاية له من البقاء السرمد، فلنفسك وجود بعد خروجها من البدن، إما في الجنة وإما في النار، ثم تعاد إلى بدنك فتجازى بعملك وتسكن إحدى الدارين وهو الخلود الدائم، وبين هاتين الحالتين - أعني ما قبل وجودك وما بعد موتك - حالة متوسطة، وهي أيام حياتك في الدنيا، فانظر إلى مقدار زمانها وانسب إلى الحالتين تعلم أنه أقل من طرفة عين في مقدار عمر الدنيا.", "ومن رأى الدنيا(١) بهذه العين لم يركن إليها ولم يبال كيف تقضت أيامه بها في ضر وضيق أو سعة ورفاهية، ولهذا لم يضع رسول الله ﷺ لبنة على لبنة ولا قصبة على قصبة، وقال: «مالي وللدنيا، إنما مثلي ومثل الدنيا كراكب قال تحت شجرة ثم راح وتركها»، وقال ﷺ: «ما الدنيا في الآخرة إلا كمثل ما يجعل أحدكم إصبعه هذه في اليم، فلينظر بم ترجع».", "وإلى هذا أشار عيسى عليه السلام حين قال: الدنيا قنطرة، فاعبروها ولا تعمروها. وهذا مثل واضح؛ فإن الحياة الدنيا معبر إلى الآخرة، والمهد هو الركن الأول على أول القنطرة، واللحد الركن الثاني على آخرها، ومن الناس من قد قطع نصف القنطرة، ومنهم من قطع ثلثيها، ومنهم من لم يبق له إلا خطوة واحدة وهو غافل عنها، وكيف ما كان فلا بد من العبور، فمن وقف يبني على القنطرة ويزينها بأصناف الزينة وهو يستحث للعبور، فهو في غاية الجهل والحمق.", "مثال آخر للدنيا في لين مأخذها وخشونة مصدرها:", "اعلم أن أوائل الدنيا تبدو هينة لينة، فإذا خاض فيها الخائض واستطابها أهلكته، فمثلها كمثل الحية لين مسها وهي تقتل بسمها، فينبغي أن يكون الإنسان أسر ما يكون فيها أحذر ما يكون لها، فإن صاحبها كلما اطمأن منها إلى سرور أشخصه عنه مكروه.", "حاشية: (١) قبلها في الأصل: (مقدار).", "مثال آخر للدنيا في تعذر الخلاص من تبعاتها بعد الخوض فيها:", "من أوغل في طلب الدنيا وظن السلامة من شرها، كان كمن مشى في الماء وظن أن قدميه لا تبتل.", "مثال آخر: مثل ما بقي من الدنيا وقلته بالإضافة إلى ما سبق كمثل ثوب شق من أوله إلى آخره فبقي متعلقا بخيط في آخره، فيوشك ذلك الخيط أن ينقطع.", "مثال آخر لتأدية علائق الدنيا بعضها إلى بعض حتى تهلك صاحبها:"]], "ic": "book"}, {"story": ["كتاب ذم الدنيا (٨ من ١٤)، ص٧٦٦", ["قال عيسى ابن مريم: مثل طالب الدنيا كمثل شارب ماء البحر، كلما ازداد شربا ازداد عطشا حتى يقتله.", "مثال آخر لمخالفة آخر الدنيا أولها إذ بدايتها تلذ وعاقبتها مرة:", "اعلم أن شهوات الدنيا في القلب لذيذة كشهوات الأطعمة في المعدة، وسيجد العبد عند الموت لشهوات الدنيا في قلبه من الكراهة والنتن والقبح ما يجده للأطعمة اللذيذة إذا انتهت في المعدة غاياتها، وكما أن الأطعمة كلما كانت ألذ طعما وأكثر دسما وأظهر حلاوة كان رجيعها أقذر، فكذلك كل شهوة كانت في النفس ألذ وأقوى فتنة(١)، فالتأذي بها عند الموت أشد، كما أن تفجع الإنسان بمحبوبه إذا فقد يقوى بقدر محبة المحبوب.", "قال ﷺ للضحاك بن سفيان(٢): «ألست تؤتى بطعامك وقد ملح وقزح(٣)، ثم تشرب عليه اللبن والماء؟» قال: بلى. قال: «فإلى ما يصير؟» قال: إلى ما قد علمت. قال: «فإن الله عز وجل ضرب مثل الدنيا بما يصير إليه طعام ابن آدم»(٤).", "وكان بعض السلف يقول لأصحابه: انطلقوا حتى أريكم مثل الدنيا. فيذهب بهم إلى مزبلة، فيقول: انظروا إلى ثمارهم ودجاجهم وعسلهم وسمنهم.", "حاشية: (١) تحرف في الأصل إلى: (فيه).", "حاشية: (٢) كان من عمال النبي ﷺ على الصدقات، وقيل: كان سيافا لرسول الله ﷺ.", "حاشية: (٣) قزح: أي أصلح بالقزح، وهي الأبزار التي توضع في القدر.", "حاشية: (٤) أخرجه أحمد (١٥٧٤٧) والطبراني في الكبير (٨١٣٨).", "مثال آخر للدنيا وأهلها في اشتغالهم بنعيمها عن الآخرة، وما يعقبهم ذلك من الحسرات:"]], "ic": "book"}, {"story": ["كتاب ذم الدنيا (٩ من ١٤)، ص٧٦٧", ["اعلم أن مثل أهل الدنيا في غفلتهم مثل قوم ركبوا سفينة فانتهت بهم إلى جزيرة، فأمرهم الملاح بالخروج لقضاء الحاجة، وحذرهم الإبطاء، وخوفهم مرور السفينة واستعجالها، فتفرقوا في نواحي الجزيرة، فقضى بعضهم حاجته وبادر إلى السفينة، فصادف المكان خاليا، فأخذ أوسع الأماكن وألينها وأوفقها لمراده، وتوقف بعضهم في الجزيرة ينظر إلى أزهارها وأنوارها العجيبة ونغمات طيورها، وحسن أحجارها ومعادنها، ثم تنبه لخطر فوت السفينة، فرجع فلم يصادف إلا مكانا ضيقا فجلس فيه، وأكب بعضهم على تلك الأحجار المستحسنة، والأزهار الفائقة، فحمل منها جملة، فلما جاء لم يجد في السفينة(١-١) إلا مكانا ضيقا، وزاده ما حمله ضيقا، فصار محموله ثقلا عليه ووبالا، ولم يقدر على نبذه، ولم يجد له في السفينة موضعا(١-١)، فحمله على عنقه، فندم على أخذه، ولم ينفعه الندم، ثم ذبلت الأزهار وتغيرت أراييحها وآذاه نتنها، وتولج بعضهم في تلك الغياض ونسي السفينة وأبعد في تنزهه حتى إن الملاح نادى بالناس عند دفع السفينة فلم يبلغه صوته لاشتغاله بملاهيه، فهو تارة يتناول من الثمر، وتارة يشم تلك الأنوار، وتارة يعجب من حسن الأشجار، وهو على ذلك خائف من سبع يخرج عليه، حذر من نكبة تلحقه غير منفك عن شوك يتشبث بثيابه ويدخل في قدمه، وغصن يجرح بدنه، وعوسج يخرق ثيابه ويهتك عورته، أو صوت هائل يفزع منه، فمن هؤلاء من لحق السفينة ولم يبق فيها موضع، فمات على الساحل، ومنهم من شغله لهوه فافترسته السباع، ومنهم من نهشته الحيات، ومنهم من تاه فهام على وجهه حتى هلك.", "فهذا مثل أهل الدنيا بحظوظهم العاجلة ونسيانهم موردهم وعاقبة أمرهم، وما أقبح بالعاقل أن تغره أحجار ونبات يصير هشيما، فهو شاغل له في الدنيا بالخوف عليه والحزن لفقده، ثم يصير عليه عند رحيله وبالا ولا يصحبه حينئذ.", "حاشية: (١-١) سقط من (ظ).", "مثال آخر لاغترار الخلق بالدنيا وضعف إيمانهم بالآخرة:"]], "ic": "book"}, {"story": ["كتاب ذم الدنيا (١٠ من ١٤)، ص٧٦٨", ["أخبرنا أحمد بن محمد المذاري قال: أخبرنا الحسن بن أحمد بن البنا قال: أخبرنا ابن بشران قال: أخبرنا ابن صفوان قال: أخبرنا أبو بكر بن عبيد قال: أخبرنا إسحاق بن إسماعيل قال: أخبرنا روح بن عبادة قال: أخبرنا هشام بن حسان عن الحسن(١) قال: بلغني أن رسول الله ﷺ قال لأصحابه: إنما مثلي ومثلكم ومثل الدنيا كمثل قوم سلكوا مفازة غبراء حتى إذا لم يدروا ما سلكوا منها أكثر أو ما بقي أنفدوا الزاد(٢) وحسروا الظهر(٣) وبقوا بين ظهراني المفازة لا زاد ولا حمولة، فأيقنوا بالهلكة، فبينما هم كذلك إذ خرج عليهم رجل في حلة يقطر رأسه فقالوا: إن هذا قريب عهد بالريف، وما جاءكم هذا إلا من قريب؟ قال: فلما انتهى إليهم قال: يا هؤلاء. قالوا: يا هذا. قال: علام أنتم؟ قالوا: على ما ترى. قال: أرأيتكم إن هديتكم إلى ماء رواء ورياض خضر ما تعملون؟ قالوا: لا نعصيك شيئا. قال: عهودكم ومواثيقكم بالله. قال: فأعطوه عهودهم ومواثيقهم بالله لا يعصونه شيئا، قال: فأوردهم ماء رواء ورياضا خضرا، قال: فمكث فيهم ما شاء الله، ثم قال: يا هؤلاء. قالوا: يا هذا. قال: الرحيل. قالوا: إلى أين؟ قال: إلى ماء ليس كمائكم وإلى رياض ليست كرياضكم. قال: فقال جل القوم، وهم أكثرهم: والله ما وجدنا هذا حتى ظننا أنا لن نجده، وما نصنع بعيش خير من هذا؟ قال: وقالت طائفة منهم، وهم أقلهم: ألم تعطوا هذا الرجل عهودكم ومواثيقكم بالله لا تعصونه شيئا؟ وقد صدقكم في أول حديثه، فوالله ليصدقنكم في آخره.", "قال: فراح فيمن اتبعه وتخلف بقيتهم، فنذر(٤) بهم عدو فأصبحوا من بين أسير وقتيل.", "أخبرنا عبد الأول، قال: أخبرنا الداوودي، قال: أخبرنا ابن أعين، قال: حدثنا الفربري، قال: حدثنا البخاري، قال: حدثنا أبو كريب، قال: حدثنا", "حاشية: (١) أي الحسن البصري.", "حاشية: (٢) أنفدوا الزاد: فني زادهم.", "حاشية: (٣) حسروا الظهر: أي أعروه، وهو كناية عن هلاك ما يركبونه.", "حاشية: (٤) نذر بهم: أغار عليهم.", "أبو أسامة، عن بريد(١)، عن أبي بردة، عن أبي موسى رضي الله عنه، عن النبي ﷺ قال: «إنما مثلي ومثل ما بعثني الله به كمثل رجل أتى قومه فقال: يا قوم، إني رأيت الجيش بعيني، وإني أنا النذير العريان، فالنجاء، فأطاعه طائفة من قومه، فأدلجوا، وانطلقوا على مهلهم، فنجوا، وكذبته طائفة منهم، فأصبحوا مكانهم، فصبحهم الجيش، فأهلكهم واجتاحهم، فذلك مثل من أطاعني واتبع ما جئت به، ومثل من عصاني وكذب ما جئت به من الحق». أخرجاه في الصحيحين.", "مثال آخر لتنعم الناس بالدنيا ثم شدة(٢) تفجعهم على فراقها:"]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "ولننظر في سير الرسول ﷺ وأصحابه، فإنهم ما كان لهم إفراط في تناول الدنيا ولا تفريط في حقوق النفوس، بل كانوا أمة وسطا، بل ينبغي أن يتلمح حظ النفس في المشتهى، فإن كان في حظها حفظها وما يقيمها ويصلحها ____ للخير، فلا ينبغي أن تمنع منه وإن كان حظها مجرد شهوة ليست متعلقة بمصالحها المذكورة، فذاك حظ مذموم، والزهد فيه يكون", "o": ["ويبسطها", "مولود", "تولين", "المعروف"], "h": "راجع: ص٧٧٤"}, {"t": "fill", "d": 2, "q": "وروى محمد بن المنكدر عن ____ عن النبي ﷺ أنه قال", "o": ["أبيه", "تحلل", "والمهد", "فليشرع"], "h": "راجع: ص٧٥٨"}, {"t": "fill", "d": 2, "q": "قال القرشي: وحدثنا محمد بن علي قال: حدثنا إبراهيم بن الأشعث قال: سمعت الفضيل قال: بلغني أن رجلا عرج بروحه فإذا بامرأة على قارعة الطريق عليها من كل ____ الحلي والثياب، وإذا لا يمر بها أحد إلا جرحته،", "o": ["زينة", "ويريد", "بالحزن", "عماك"], "h": "راجع: ص٧٦٤"}, {"t": "fill", "d": 2, "q": "وإلى هذا أشار عيسى عليه السلام حين قال: الدنيا قنطرة، فاعبروها ولا تعمروها. وهذا مثل واضح؛ فإن الحياة الدنيا معبر إلى الآخرة، والمهد هو الركن الأول على أول القنطرة، واللحد الركن ____ على آخرها، ومن", "o": ["الثاني", "وضياء", "والحمقى", "عشرة"], "h": "راجع: ص٧٦٥"}, {"t": "fill", "d": 2, "q": "قال القرشي: وحدثنا إبراهيم بن سعيد الجوهري قال: حدثنا سفيان بن عيينة قال: قال لي أبو بكر بن عياش: رأيت الدنيا في ____ عجوزا شمطاء مشوهة", "o": ["النوم", "الهيئة", "يهلكه", "أمضى"], "h": "راجع: ص٧٦٤"}, {"t": "fill", "d": 2, "q": "اعلم أن الدنيا مزينة الظواهر قبيحة السرائر، تشبه عجوزا مزينة تخدع الناس بظاهرها، فإذا كشفوا قناعها ووقفوا على ____ بانت لهم قبائحها، فندموا على اتباعهم لها، وخجلوا من الاغترار بها", "o": ["باطنها", "بغيرهما", "بايعت", "لعبة"], "h": "راجع: ص٧٦٣"}]}, {"t": "كتاب ذم الدنيا - القسم ٣ من ٣", "b": [{"story": ["كتاب ذم الدنيا (١١ من ١٤)، ص٧٦٩", ["اعلم أن مثل الناس فيما أعطوا من الدنيا مثل رجل هيأ دارا وزينها، ودعا الناس إلى داره واحدا بعد واحد، وكان يقدم إلى الداخل طبقا من ذهب عليه مجمر عود، فيتطيب به ذلك الداخل، ثم ينهض عنه إلى مكانه شاكرا لصاحب الدار، فدخل رجل، فقدمه إليه ليتطيب به، فظن أنه قد وهبه له، فتعلق قلبه بذلك، فلما أخذ منه تفجع وتقلق وتسخط، ولو عرف رسم صاحب الدار لم ينزعج.", "وكذلك من عرف سنة الله في الدنيا، علم أنها دار ضيافة، سبلت على المجتازين لا على المقيمين، ليتزودوا منها، وينتفعوا بما فيها، كما ينتفع المسافرون بالعواري(٣)، ولا يصرفون إليها كل قلوبهم، فتعظم مصائبهم عند فراقها، وهذا المعنى الذي نبهت عليه أم سليم حين مات ابنها؛ أخبرنا هبة الله بن محمد، قال: أخبرنا الحسن بن علي، قال: أخبرنا أحمد بن جعفر، قال: حدثنا عبد الله بن أحمد، قال: حدثني أبي، قال: حدثنا بهز، قال: حدثنا سليمان بن المغيرة، عن ثابت، عن أنس رضي الله عنه قال: مات ابن لأبي طلحة من أم سليم، فقالت لأهلها: لا تحدثوا أبا طلحة بابنه، حتى أكون أنا أحدثه، قال: فجاء فقربت إليه عشاء فأكل وشرب، قال: ثم تصنعت له أحسن ما كانت تصنع قبل", "حاشية: (١) تصحف في الأصل إلى: (يزيد).", "حاشية: (٢) ليست في (ظ).", "حاشية: (٣) العواري: جمع عارية، وهي ما تعطيه غيرك على أن يعيده إليك.", "ذلك، فوقع بها، فلما رأت أنه قد شبع وأصاب منها قالت: يا أبا طلحة، أرأيت لو أن قوما أعاروا عاريتهم أهل بيت، فطلبوا عاريتهم، ألهم أن يمنعوهم؟ قال: لا، قالت: احتسب ابنك.", "**بيان**", "**حقيقة الدنيا وماهيتها والمذموم منها والمحمود**", "قد سمع خلق كثير ذم الدنيا مطلقا، فاعتقدوا أن الإشارة إلى هذه الموجودات التي خلقت للمنافع فأعرضوا عن ما يصلحهم من المطاعم والمشارب، وقد وضع الله سبحانه في الطباع توقان النفس إلى ما يصلحها، فكلما تاقت منعوها ظنا منهم أن هذا هو المراد وجهلا بحقوق النفس، وعلى هذاأكثر المتزهدين، وإنما نقلوا ذلك لقلة العلم بالمراد وسوء الفهم للمقصود، ونحن نصدع بالحق من غير محاباة فنقول:", "اعلم أن الدنيا عبارة عن أعيان موجودة، للإنسان فيها حظ، وهي الأرض وما عليها، فإن الأرض مسكن للآدمي، وما عليها ملبس له ومطعم ومشرب ومنكح، وقد جعلت المعادن فيها كالخزائن فيها ما يحتاج إليه، وخلق النبات لقوته وكسوته ومصالحه، والحيوانات ليأكل من لحمها ويستسخر بعضها، كل ذلك علف لراحلة بدنه السائر إلى الله عز وجل، فإنه لا يبقى إلا بهذه المصالح، كما لا تبقى الناقة في طريق الحج إلا بما يصلحها، فمن تناول منها ما يصلحه على الوجه المأمور به مدح ولم يذم، ومن أخذ منها فوق الحاجة بكف الشره وقع الذم لفعله وأضيف إلى الدنيا تجوزا."]], "ic": "book"}, {"story": ["كتاب ذم الدنيا (١٢ من ١٤)، ص٧٧١", ["وليس للشره في تناول الدنيا وجهة؛ لأنه يخرج عن النفع إلى الأذى ويشغل عن طلب الآخرة، فيفوت المقصود، ويصير بمثابة من أقبل يعلف الناقة ويرد لها الماء ويغير عليها ألوان الثياب، وينسى أن الرفقة قد سارت، فإنه يبقى في البادية فريسة للسباع هو وناقته.", "ولا وجه للتقصير في تناول الحاجة من الدنيا؛ لأن الناقة لا تقوى على السير إلا بتناول ما يصلحها.", "ولما كانت الحاجة إلى المطعم والملبس والمسكن ضرورة افتقر الناس إلى الفلاحة والحياكة والبناء، ثم احتاجت كل صناعة من هذه إلى الآلات كالحدادة والنجارة، ثم احتاج الناس إلى الاجتماع إذ لا يكفل كل شخص منهم بجلب جميع مصالحه، وحصل التناسل وتولدت الخصائم، فافتقروا إلى سائس، ثم قد تخلو بعض البلدان عما يحتاج إليه فألقي في قلوب التجار الحرص فجلبوه، ومن الناس من يعجز عن صناعة لمكان التكاسل، فيحتال في أخذ ما ليس له أو في فتح باب الكدية(١).", "ثم لا تزال أشغال الدنيا تتسلسل إلى أن تشغل القلب عن الآخرة شغلا كليا، فتكاد النفوس تظن لكثرة اهتمامها بمصالحها من المطعم والملبس والمسكن أن المقصود دفع الزمان بذلك فحسب، وقد أنساها انهماكها على اكتسابها أن هذا إنما هو زاد للمسير إلى مقصود آخر، فترى خلقا كثيرا همهم جمع المال فحسب؛ لأنهم رأوه سببا لبلوغ الأغراض فأحبوه لذاته ونسوا ما وضع له، وخلقا همهم ما يأكلون، فهم يعملون طول النهار ليأكلوا، ويأكلون ليعملوا، وخلقا همهم في اجتلاب ما يوجب لهم المدح والثناء والتفاخر، وانهماك هؤلاء كلهم على ما انهمكوا عليه يخرجهم إلى الكبر والحسد والشره وغير ذلك من الأخلاق الذميمة.", "فهذا بيان أن ضرورة العيش جر إلى غيره، فنسي بذلك ما وضع الأصل له، فالذم إذا لا لصورة الدنيا، وقد روينا أن علي بن أبي طالب رضي الله عنه خطب فقال: الدنيا دار صدق لمن صدقها، ودارعافية لمن فهم عنها، ومطلب نجح لمن سالمها، فيها مساجد الله، ومهبط وحيه، ومصلى ملائكته، ومتجر أوليائه، فيها اكتسبوا الرحمة، وربحوا فيها العافية، فمن ذا يذمها وقد آذنت ببينها، ونعت نفسها وأهلها، فمثلت ببلائها البلاء، وشوقت بسرورها إلى السرور تخويفا وتحذيرا وترغيبا، فذمها قوم غداة الندامة، وحمدها آخرون ذكرتهم فذكروا وعظتهم فانتهوا، فأيها الذام للدنيا المغتر بتغريرها متى استذمت إليك؟ بل متى غرتك؟", "حاشية: (١) الكدية: حرفة السائل الملح الذي تكفف الناس، وهي الشحاذة."]], "ic": "book"}, {"story": ["كتاب ذم الدنيا (١٣ من ١٤)، ص٧٧٣", ["أبمنازل آبائك في الثرى؟ أم بمضاجع أمهاتك في البلى؟ كم رأيت موروثا، كم عللت بكفيك عليلا؟ كم مرضت بيديك مريضا تبتغي له الشفاء وتستوصف له الأطباء؟ لم تنفعه بشفاعتك، ولم تسعفه بطلبك، مثلت لك الدنيا غداة مصرعه مصرعك ومضجعه مضجعك. ثم التفت إلى المقابر فقال: يا أهل الغربة وأهل التربة، أما الدور فقد سكنت، وأما الأموال فقد اقتسمت، وأما الأزواج فقد نكحت، فهذا خبر ما عندنا فهاتوا خبر ما عندكم. ثم التفت إلى أصحابه فقال: أما لو أذن لهم لأخبروكم أن خير الزاد التقوى(١).", "ولما تنبه أقوام للإعراض عن الدنيا والزهد فيها حسدهم إبليس فقسمهم طوائف؛ فمنهم طائفة أراهم أن الصواب تعجيل الانتقال عن الدنيا إلى الآخرة، فإن الواصل إليها سعيد كيفما وصل، فقتلوا أنفسهم ليتخلصوا من الدنيا، وعلى هذا جماعة من أهل الهند يتهجمون على النار ويقتلون أنفسهم ظنا منهم أنهم يتخلصون بذلك من محن الدنيا.", "ومنهم طائفة أوهمهم أنه لا بد من رياضة تميت الصفات البشرية وتقلعها بالكلية، فشددوا في المجاهدة على أنفسهم حتى هلك أكثرهم لشدة الرياضة، ومنهم من فسد عقله، ومنهم من مرض.", "ومن هؤلاء من بالغ في الرياضة فرأى أن الطبع لا ينقلع، فتوهم أن ما كلفه الشرع محال فوقع في الإلحاد، ووقع لبعضهم أن هذه المجاهدات لا فائدة فيها؛ لأن الله تعالى مستغن عنها فلا تنفعه طاعة ولا تضره معصية، فسلكوا مسلك الإباحة وطووا بساط الشرع، وظنوا أن ذلك من صفاء توحيدهم حيث اعتقدوا أن الله مستغن عن عبادة عباده.", "وظن آخرون أن المقصود من العبادات المجاهدة حتى يصل العبد بها إلى معرفة الله، فإذا حصلت المعرفة فقد وصل، فاستغنى عن التعب، وزعموا أن قد ارتفع", "حاشية: (١) ذكره ابن أبي الدنيا في (ذم الدنيا) (١٤٧) وابن رجب في جامع العلوم والحكم ٢/ ١٩٤ - ١٩٥، واليعقوبي في تاريخه ٢/ ٢٠٨.", "محلهم في معرفة الله أن يمتهنوا بالتكليف، وإنما التكليف على العوام. وثمة طرق غير هذه من هذا الجنس قد ذكرتها في كتابي المسمى بتلبيس إبليس، وإنما الطريق السليم المحجة الوسطى وهو أن تؤخذ من الدنيا قدر ما تحتاج إليه من الزاد للسلوك وإن كان مشتهى، فإن إعطاء النفس ما تشتهيه مما يصلحها عون لها وقضاء لحقها، فقد كان سفيان الثوري يأكل في أوقات من طيب الطعام، وكان إذا سافر كان في سفرته حمل مشوي وفالوذج(١)، وكان إبراهيم بن أدهم يأكل من الطيبات في بعض الأوقات، ويقول: إذا وجدنا أكلنا أكل الرجال، وإذا فقدنا صبرنا صبر الرجال."]], "ic": "book"}, {"story": ["كتاب ذم الدنيا (١٤ من ١٤)، ص٧٧٤", ["ولننظر في سير الرسول ﷺ وأصحابه، فإنهم ما كان لهم إفراط في تناول الدنيا ولا تفريط في حقوق النفوس، بل كانوا أمة وسطا، بل ينبغي أن يتلمح حظ النفس في المشتهى، فإن كان في حظها حفظها وما يقيمها ويصلحها ويبسطها للخير، فلا ينبغي أن تمنع منه وإن كان حظها مجرد شهوة ليست متعلقة بمصالحها المذكورة، فذاك حظ مذموم، والزهد فيه يكون.", "وينبغي تعويد النفس الزهد في بعض الحظ الأول خصوصا في بداية رياضتها لئلا تتعود الانبساط في الشهوات كما قال عمر وقد أتي بشربة عسل: اعزلوا عني حسابها.", "وفي الجملة ينبغي لك أن تقوم بالقسط في حفظ النفس فلا تمنعها من حظوظها ما تقوى به على التقوى، ولاتطلقها فيما يخاف ضرره من شهواتها، فإن الوادي بين الجبلين.", "**آخر كتاب ذم الدنيا**", "حاشية: (١) الفالوذج: حلواء تعمل من الدقيق والماء والعسل أو من النشاء والماء السكر."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "أخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أبو بكر بن مالك قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا عفان قال: حدثنا حماد ابن زيد قال: حدثنا ____ بن سعيد عن قيس بن أبي حازم", "o": ["مجالد", "يختلفون", "يحيض", "مشاهدا"], "h": "راجع: ص٧٥٨"}, {"t": "fill", "d": 2, "q": "فهذا بيان أن ضرورة العيش جر إلى غيره، فنسي بذلك ما وضع الأصل له، فالذم إذا لا لصورة الدنيا، وقد روينا أن علي بن أبي ____ رضي الله عنه خطب فقال", "o": ["طالب", "فذلك", "عطفيك", "أعطاك"], "h": "راجع: ص٧٧٢"}, {"t": "fill", "d": 2, "q": "اعلم أن الدنيا عبارة عن أعيان موجودة، للإنسان فيها حظ، وهي الأرض وما عليها، فإن الأرض مسكن للآدمي، وما عليها ملبس له ومطعم ومشرب ومنكح، وقد جعلت المعادن فيها كالخزائن فيها ما يحتاج إليه، وخلق النبات لقوته وكسوته ومصالحه، والحيوانات ليأكل من لحمها ويستسخر بعضها، كل ذلك علف لراحلة بدنه السائر إلى الله عز وجل، فإنه لا يبقى إلا بهذه المصالح، كما لا ____ الناقة في طريق الحج إلا بما يصلحها، فمن تناول منها ما يصلحه على الوجه المأمور به مدح ولم يذم، ومن أخذ منها فوق الحاجة بكف الشره وقع الذم لفعله وأضيف إلى الدنيا تجوزا", "o": ["تبقى", "إخفاء", "لوعيده", "وقلتها"], "h": "راجع: ص٧٧١"}, {"t": "fill", "d": 2, "q": "قال قتيبة: وحدثنا عبد الحميد بن سليمان عن أبي حازم عن سهل بن سعد قال: قال رسول الله ﷺ: «لو ____ الدنيا تعدل عند الله جناح بعوضة ما", "o": ["كانت", "وتطويل", "ولدا", "ومداخل"], "h": "راجع: ص٧٥٧"}, {"t": "fill", "d": 2, "q": "أبو أسامة، عن بريد، عن أبي بردة، عن أبي موسى رضي الله عنه، عن ____ ﷺ قال", "o": ["النبي", "وطلبت", "أتمها", "فيكتب"], "h": "راجع: ص٧٦٩"}, {"t": "fill", "d": 2, "q": "وحدثني غير إبراهيم بن سعيد أن أبا بكر بن ____ قال", "o": ["عياش", "القصب", "فندم", "زهدت"], "h": "راجع: ص٧٦٤"}]}], "sum": [["الصفحات", "ص٧٥٥ - ص٧٧٤"]], "_nq": 18}, {"id": "l9", "title": "كتاب ذم البخل وذم حب المال", "group": "كتاب ذم البخل وذم حب المال", "map": {"center": "كتاب\nذم البخل", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "كتاب ذم البخل وذم حب المال - القسم ١ من ٤", "b": [{"pic": ["books", "book"], "cap": "ص٧٧٥ - ص٨١٦"}, {"story": ["كتاب ذم البخل وذم حب المال (١ من ٢٤)، ص٧٧٥", ["الحمد لله الذي ابتلى عباده ببلوى المال لينظر من استقام منهم ممن مال، فبعضهم بالإكثار منه وبعضهم بالإقلال، وبعضهم بأخذه من الحرام وبعضهم من الحلال، ودرج في كسبه له الحرص والقناعة والجود والبخل فاختلف الحال.", "أحمده على بلوغ الآمال، وأشهد أن كل معبود سواه محال، وأصلي على رسوله محمد أشرف آدمي قال وقال(١)، وعلى أصحابه وآله خير آل، صلاة تدوم بدوام الغدو والآصال، وسلم تسليما كثيرا.", "قد بينا في كتاب ذم الدنيا أن الآدمي مفتقر إلى مطعم وملبس ومسكن، وقد جعلت الأموال لنيل تلك الأغراض، فلا غنى بالآدمي عن الأموال، والسلامة من شرها بعيدة؛ لأنها إذا فقدت وقع الفقر الذي كاد يكون كفرا، وإن وجدت خيف منها الطغيان.", "واعلم أن المال بعض جزاء الدنيا، والكلام فيما يتعلق بالدنيا يعم المال إلا أنا أفردنا ذكر غوائل المال وآفاته في هذا الكتاب، إذ للإنسان من فقده صفة الفقر، ومن وجوده صفة الغنى، وهما حالتان يحصل بهما الاختبار والامتحان، ثم للفاقد حالتان: القناعة والحرص، وإحداهما مذمومة والأخرى محمودة، وللحريص حالتان: طمع فيما في أيدي الناس أو تشمر للحرف والصناعات، والطمع شر", "حاشية: (١) ورد في هامش (ظ) ما نصه: (قوله: قال وقال، الأول من القيلولة والثاني من القول).", "الحالتين. وللواجد حالتان: إمساك بحكم البخل والشح، وإنفاق. وللمنفق حالتان: تبذير وإقتار، والمحمود الاقتصاد. وهذه أمور مشتبهة وكشف الغطاء عن غامضها مهم.", "ونحن نشرح ذلك في أربعة عشر فصلا إن شاء الله تعالى، وهي:", "بيان ذم المال، ثم مدحه، ثم تفصيل فوائده وآفاته، ثم ذم الحرص والطمع، ثم علاجهما، ثم فضيلة السخاء، ثم أخبار الأسخياء، ثم ذم البخل، ثم أخبار البخلاء، ثم الإيثار وفضله، ثم حد السخاء والبخل، (١-١)ثم علاج البخل(١-١)، ثم مجموع الوظائف في المال، ثم ذم الغنى ومدح الفقر.", "حاشية: (١-١) سقط من (ظ).", "**بيان**", "**ذم المال**"]], "ic": "book"}, {"story": ["كتاب ذم البخل وذم حب المال (٢ من ٢٤)، ص٧٧٧", ["اعلم أن المال لا يذم لذاته كما قلنا في الدنيا، بل يقع الذم لمعنى من الآدمي يتعلق بالمال، فيتجوز بإطلاق ذم المال، وذلك المعنى إما شدة الحرص على طلبه، أو تناوله من غير حله، أو حبسه عن حقه، أو إخراجه في غير وجهه، أو المفاخرة والمباهاة به، قال الله عز وجل: ﴿إِنَّمَآ أَمْوَٰلُكُمْ وَأَوْلَـٰدُكُمْ فِتْنَةٌ﴾ [الأنفال: ٢٨]، وقال: ﴿لَا تُلْهِكُمْ أَمْوَٰلُكُمْ وَلَآ أَوْلَـٰدُكُمْ عَن ذِكْرِ ٱللَّهِ﴾ [المنافقون: ٩]، وقال: ﴿كَلَّآ إِنَّ ٱلْإِنسَـٰنَ لَيَطْغَىٰٓ أَن رَّءَاهُ ٱسْتَغْنَىٰٓ﴾ [العلق: ٦ - ٧]. وأخبرنا الكروخي قال: أخبرنا أبو عامر الأزدي وأبو بكر الغورجي قالا: أخبرنا الجراحي قال: أخبرنا المحبوبي قال: أخبرنا الترمذي قال: أخبرنا سويد بن نصر قال: أخبرنا عبد الله بن المبارك عن زكريا بن أبي زائدة عن محمد بن عبد الرحمن بن سعد بن زرارة عن ابن كعب ابن مالك الأنصاري عن أبيه قال: قال رسول الله ﷺ: «ماذئبان جائعان أرسلا في غنم بأفسد لها من حرص المرء على المال والشرف لدينه». قال الترمذي: هذا حديث صحيح.", "وفي الصحيحين من حديث أبي ذر قال: أتيت رسول الله ﷺ وهو في ظل الكعبة فقال: «هم الأخسرون ورب الكعبة، هم الأخسرون» قلت: من هم؟ قال: «الأكثرون [أموالا](١) إلا من قال هكذا في عباد الله هكذا وهكذا»(٢).", "وقد كان السلف يخافون فتنة المال فكان عمر بن الخطاب إذا رأى الفتوح يبكي ويقول: ما حبس الله هذا عن نبيه وعن أبي بكر لشر أراده لهما وأعطاهم عمر إرادة الخير له.", "حاشية: (١) ليست في النسخ وأثبتت من الصحيحين فهو في البخاري (٦٦٣٨)، ومسلم (٩٩٠).", "حاشية: (٢) أي: أعطى عن يمينه وشماله وأمامه.", "وكان يقول: سمعت رسول الله ﷺ يقول: «لاتفتح الدنيا على أحد إلا ألقى الله بينهم العداوة والبغضاء إلى يوم القيامة وأنا أشفق من ذلك».", "ولما بعث عمر رضي الله عنه إلى زينب بعطائها قالت: اللهم لا يدركني عطاء عمر بعدها.", "وقال يحيى بن معاذ: الدرهم عقرب، فإن لم تحسن رقيته فلا تأخذه، فإنه إن لدغك قتلك سمه. قيل: ما رقيته؟ قال: أخذه من حله ووضعه في حقه. وقال: مصيبتان لم يسمع الخلائق بمثلهما للعبد في ماله عند موته. قيل: وما هما؟ قال: يؤخذ منه كله، ويسأل عنه كله.", "**بيان**", "**مدح المال والجمع بينه وبين الذم**", "قد بينا أن المال لا يذم لذاته بل ينبغي أن يمدح؛ لأنه سبب للتوصل إلى مصالح الدين والدنيا، وقد سماه الله عز وجل خيرا فقال: ﴿إِن تَرَكَ خَيْرًا﴾ [البقرة: ١٨٠]، وأمر بحفظه(١-١) وأعلم أن قوام الآدمي به(١-١) فقال: ﴿وَلَا تُؤْتُوا۟ ٱلسُّفَهَآءَ أَمْوَٰلَكُمُ ٱلَّتِى جَعَلَ ٱللَّهُ لَكُمْ قِيَـٰمًا﴾ [النساء: ٥] وقال النبي ﷺ: «نعما بالمال الصالح للمرء الصالح»."]], "ic": "book"}, {"story": ["كتاب ذم البخل وذم حب المال (٣ من ٢٤)، ص٧٧٩", ["وقال سعيد بن المسيب: لا خير فيمن لا يريد جمع المال من حله يكف به وجهه عن الناس، ويصل منه رحمه، ويعطي منه حقه. وخلف ابن المسيب مالا.", "وقال أبو إسحاق السبيعي: كانوا يرون السعة عونا على الدين.", "وقال ابن المنكدر: نعم العون على التقوى الغنى.", "وقال سفيان الثوري: المال في زماننا هذا سلاح المؤمن، وخلف سفيان مالا.", "وقال يوسف بن أسباط: ما كان المال منذ كانت الدنيا أنفع منه في هذا الزمان.", "واعلم أن المال لما كان سببا لحفظ البدن، وحراسة البدن سبب لحفظ النفس، وبقاء النفس سبب للمعرفة والعلم والعمل، عرف بهذه الطريق شرف المال، وإنما يقع الذم لما جعل وسيلة إلى المقاصد الفاسدة، والذم للجاعل لا للمجعول، كما قال ﷺ: «تعس عبد الدينار، وتعس عبد الدرهم».", "ولما كانت الطباع تميل إلى فضول المال، ويتجدد من ذلك شر في الأغلب، قال رسول الله ﷺ: «اللهم اجعل رزق آل محمد قوتا». هذا وهو مأمون عليه فتنة المال، فكيف بغيره؟", "حاشية: (١-١) سقط من الأصل.", "**بيان**", "**تفصيل آفات المال وفوائده**", "اعلم أن المال مثل حية فيها سم وترياق، ففوائده ترياقه، وغوائله سمومه، فمن عرف غوائله وفوائده أمكنه أن يحترز من شره ويستدر من خيره.", "أما الفوائد: فهي تنقسم إلى دنيوية ودينية.", "أما الدنيوية: فالخلق يعرفونها، ولذلك تهالكوا في طلبها.", "وأما الدينية: فتنحصر في ثلاثة أنواع:", "النوع الأول: أن ينفقه على نفسه، إما في عبادة أو في الاستعانة على العبادة.", "أما في العبادة فكالاستعانة به على الحج والجهاد، وهما من أمهات القربات، والفقير قد حرمهما للفقر، وأما فيما يقويه على العبادة كالمطعم والملبس والمسكن والمنكح وضرورات المعيشة، فإن هذه الحاجات إذا لم تتيسر كان القلب منصرفا إلى تدبيرها، فلا يتفرغ للدين، وما لا يوصل إلى العبادة إلا به فهو عبادة، فأخذ الكفاية من الدنيا للاستعانة على الدين من الفوائد الدينية، ولا يدخل في هذا التنعم والزيادة على الحاجة فإن ذلك من حظوظ الدنيا فقط.", "النوع الثاني: ما يصرفه إلى الناس، وهو أربعة أقسام: الصدقة والمروءة ووقاية العرض وأجرة الاستخدام.", "أما الصدقة: فقد سبق ذكر فضائلها.", "أما المروءة: فنعني بها صرف المال إلى الأغنياء والأشراف في ضيافة وهدية وإعانة وما يجري مجراه، وهذا من الفوائد الدينية إذ به يكتسب العبد الإخوان والأصدقاء وصفة السخاء، والأخبار في الضيافة والهدايا كثيرة.", "وأما وقاية العرض: فنعني به بذل المال لدفع هجو الشعراء وثلب السفهاء وقطع ألسنتهم ودفع شرهم، وهو مع تنجز فائدته في العاجلة هو من الحظوظ الدينية أيضا، قال النبي ﷺ: «ما وقى به المرء عرضه فهو صدقة». وهذا لأنه يمنع المغتاب عن معصية الغيبة ويحترز مما يثير كلامه من العداوة التي تحمل على الانتقام على مجاوزة حدود الشريعة."]], "ic": "book"}, {"story": ["كتاب ذم البخل وذم حب المال (٤ من ٢٤)، ص٧٨١", ["وأما الاستخدام: فإن الأعمال التي يحتاج إليها الإنسان لتهيئة أسبابه كثيرة، ولو تولاها بنفسه ضاعت أوقاته وتعذر عليه سلوك سبيل الآخرة بالفكر والذكر الذي هو أعلى(١) مقامات السالكين، ومن لا مال له فإنه يفتقر إلى أن يتولى خدمة نفسه بنفسه، وكل ما يتصور أن يقوم به غيرك ويحصل بذلك غرضك فإن تشاغلك به غبن؛ لأن احتياجك إلى التشاغل بما لا يقوم به غيرك من العلم والعمل والفكر والذكر أشد.", "النوع الثالث: ما لا يصرفه إلى إنسان معين، ولكن يحصل به خير عام، كبناء المساجد والقناطر والوقوف المؤبدة.", "فهذه جملة فوائد المال في الدين سوى ما يتعلق بالحظوظ العاجلة من الخلاص من ذل السؤال وحقارة الفقر وكثرة الإخوان والأصدقاء والعز بين الخلق والكرامة في القلوب والوقار.", "أما الآفات: فدينية ودنيوية:", "أما الدينية فثلاث:", "الأولى: أنه يجر إلى المعاصي غالبا؛ لأن الشهوات متقاضية، والعجز حائل، ومن العصمة أن لا يقدر، ومتى يئس الإنسان من المعصية لم تتحرك داعيته إليها، فإذا استشعر القدرة عليها انبعثت داعيته، والمال نوع من القدرة يحرك داعية المعاصي، فإن اقتحم ما يشتهي هلك، وإن صبر لقي شدة من معاناة الصبر مع القدرة، وفتنة السراء أعظم من فتنة الضراء.", "حاشية: (١) تحرفت في الأصل إلى: (أصل أعلى).", "الثانية: أنه يحرك إلى التنعم في المباحات، ومتى تمكن الغني أن يأكل خبز الشعير مع غناه كما كان سليمان بن داود يفعل، فإذا تنعم بالمباحات صارت عادة. وإلفا فلا يصبر عنها، وربما لم يقدر على استدامتها إلا بكسب فيه شبهة فيقتحم(١) الشبهات ويتسلسل الأمر ويرقى إلى آفات من مداهنة ونفاق وغير ذلك ليتيسر له تنعمه، فإن من كثر ماله خالط الناس، ومن خالطهم لم يسلم من نفاق وعداوة وحسد وحقد وغيبة، وكل ذلك يلزم من الحاجة إلى إصلاح المال.", "الثالثة: وهي التي لا ينفك عنها أحد، وهو أنه يلهيه إصلاح ماله عن ذكر الله تعالى، قال عيسى ابن مريم: في المال ثلاث: أن يأخذه من غير حله. فقيل: فإن أخذه من حله؟ قال: وضعه في غير حقه. قيل: فإن وضعه في غير حقه. قيل: فإن وضعه في حقه؟ قال: يشغله إصلاحه عن الله(٢) عز وجل، وهذا هو الداء العضال فإن أصل العبادات ومخها ذكر الله تعالى والتفكر في جلاله وعظمته، وذلك يستدعي قلبا فارغا، وصاحب الضيعة يمسي ويصبح متفكرا في خصومة الفلاح ومحاسبته وخيانته(٣)، وشركائه ومنازعتهم في الحدود والماء، وأعوان السلطان في الخراج، والأجراء على التقصير في العمارة، وصاحب التجارة يكون متفكرا في خيانة شريكه وتقصيره في العمل وتضييعه للمال، (٤-٤)وكذا سائر أصناف المال. وأبعدها عن كثرة الشغل(٤-٤) المال المكنوز تحت الأرض، والفكر متردد في كيفية حفظه وفي الخوف ممن يعثر عليه، وأودية أفكار أهل الدنيا لا نهاية لها، ومن له قوت يومه في سلامة من جميع ذلك."]], "ic": "book"}, {"story": ["كتاب ذم البخل وذم حب المال (٥ من ٢٤)، ص٧٨٢", ["فهذه جمل الآفات الدنيوية سوى ما يقاسيه أرباب الأموال في الدنيا من الخوف والحزن والغم والهم والتعب في دفع الحسد وتجشم المصاعب في حفظ الأموال وكسبها، فإذا ترياق المال أخذ القوت منه وصرف الباقي إلى الخيرات، وما عدا ذلك سموم وآفات.", "حاشية: (١) في (ظ): (فتفتح).", "حاشية: (٢) في (ظ): (عن ذكر الله).", "حاشية: (٣) تصحفت في (ظ) إلى: جنايته.", "حاشية: (٤-٤) سقط من (ظ).", "**بيان**", "**ذم الحرص والطمع ومدح القناعة واليأس مما في أيدي الناس**", "اعلم أن الفقر محمود كما سيأتي بيانه في كتاب الفقر، ولكن ينبغي للفقير أن يكون قانعا منقطع الطمع عن الخلق، غير ملتفت إلى ما في أيدي الناس، ولا حريصا على اكتساب المال كيف كان، ولا يمكنه ذلك إلا بأن يقنع بقدر الضرورة من المطعم والملبس، ويقتصر على أقله قدرا وأخسه نوعا، ويرد أمله إلى يومه، فإن لم يطق فإلى شهره، ومتى طال أمله أو تشوف إلى الكثير، فاته عز القناعة وتدنس بأوساخ الطمع وجره الحرص والطمع إلى مساوئ الأخلاق.", "وقد جبل الآدمي على الحرص والطمع وقلة القناعة، وقد روينا أنه كان فيما يتلى ثم رفع: «لو كان لابن آدم واديان من ذهب لابتغى إليهما ثالثا، ولا يملأ جوف ابن آدم إلا التراب». وفي الصحيحين من حديث أنس بن مالك عن النبي ﷺ أنه قال: «يهرم ابن آدم وتشب منه اثنتان: الحرص والأمل»، وفي الصحيحين من حديث أبي هريرة عن النبي ﷺ أنه قال: «قلب الشيخ شاب على حب اثنتين: طول الحياة وحب المال».", "وقال ابن مسعود رضي الله عنه: لا يدرك حريص مالم يقدر له.", "وقال الشعبي: وجدت البلايا في الدنيا إنما يسوقها إلى أهلها الحرص والشره.", "ولما كانت جبلة الآدمي على هذا أثنى الشرع على القناعة والتعفف، أخبرنا هبة الله بن محمد قال: أخبرنا الحسن بن علي قال: أخبرنا أبو بكر بن مالك قال: أخبرنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا عبد الله بن يزيد قال: حدثنا سعيد بن أبي أيوب قال: حدثني شرحبيل بن شريك عن أبي عبد الرحمن الحبلي", "عن عبد الله بن عمرو بن العاص أن رسول الله ﷺ قال: «قد أفلح من أسلم ورزق كفافا وقنعه الله عز وجل بما آتاه». انفرد بإخراجه مسلم.", "وفي الصحيحين من حديث أبي هريرة عن النبي ﷺ أنه قال: «ليس الغنى عن كثرة العرض، ولكن الغنى غنى النفس».", "وفيهما من حديث حكيم بن حزام عن النبي ﷺ أنه قال: «من يستعفف يعفه الله، ومن يستغن يغنه الله».", "وفي حديث ابن مسعود عن النبي ﷺ أنه قال: «ليس المسكين بالطواف ولا بالذي ترده التمرة والتمرتان، ولا اللقمة ولا اللقمتان، ولكن المسكين المتعفف الذي لا يسأل الناس شيئا، ولا يفطن له فيتصدق عليه».", "وقد روينا أن موسى عليه السلام قال: يا رب، أي عبادك أغنى؟ قال: أقنعهم.", "وقد روينا أن سليمان بن داود عليه السلام قال: قد جربنا العيش كله لينه وشديده، فوجدنا يكفي منه أدناه."]], "ic": "book"}, {"story": ["كتاب ذم البخل وذم حب المال (٦ من ٢٤)، ص٧٨٤", ["وقال عزير: رب، ما علامة من صافيته من خلقك؟ فأوحى الله إليه: أقنعه باليسير، وأدخر له في الآخرة الكثير.", "وفي حديث جابر بن عبد الله عن النبي ﷺ قال: «إن القناعة مال لا ينفد».", "وفي حديث ابن عباس عنه ﷺ قال: «إنما يكفي أحدكم ما قنعت به نفسه».", "وفي حديث أبي هريرة عنه ﷺ أنه قال له: «ارض بما قسم الله لك تكن أغنى الناس».", "وكان أبو ذر جالسا مع الناس(١)، فأتته امرأته فقالت: تجلس بين هؤلاء والله ما في البيت هفة ولا سفة! فقال: يا هذه إن بين أيدينا عقبة كؤودا لا ينجو منها إلا كل مخفف. فرجعت وهي راضية.", "حاشية: (١) في (ظ): (النبي).", "وقال وهب بن منبه في قوله تعالى: ﴿فَلَنُحْيِيَنَّهُۥ حَيَوٰةً طَيِّبَةً﴾ [النحل: ٩٧]. قال: القناعة.", "وكان محمد بن واسع يبل الخبز بالماء ويأكله ويقول: من قنع بهذا لم يحتج إلى أحد.", "وكان الحسن يقول: اللهم إنا نعوذ بك أن نمل معافاتك. قالوا: كيف ذلك يا أبا سعيد؟ فقال: الرجل يكون في بلده في خفض ودعة فتدعوه نفسه إلى أن يطلب الرزق في غيره.", "وقال أبو حازم: ثلاث من كن فيه فقد كمل عقله: من عرف نفسه، وحفظ لسانه، وقنع بما رزقه الله عز وجل.", "وقال بعض الحكماء: أنت أخو العز ما التحفت بالقناعة.", "وأنشدوا في هذا المعنى:", "حتى متى أنا في حل وترحال  وطول سعي وإدبار وإقبال", "ونازح الدار لا أنفك مغتربا  عن الأحبة لا يدرون ما حالي", "بمشرق
