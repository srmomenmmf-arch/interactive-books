<script>

window.MJ = {"levels": [{"id": "l1", "title": "قبل أن نبدأ", "group": "المقدمة", "map": {"center": "منهاج\nالقاصدين", "nodes": [{"t": "الكتاب", "s": []}, {"t": "الأسئلة", "s": []}, {"t": "الخطة", "s": []}]}, "paras": [{"t": "قبل أن نبدأ: كيف تسير الرحلة؟", "b": [{"pic": ["books", "book"], "cap": "منهاج القاصدين، ربع العادات، الربع الثاني من أربعة أرباع"}, {"note": "هذا الملف هو ربع العادات، الربع الثاني من أربعة أرباع من كتاب منهاج القاصدين ومفيد الصادقين لابن الجوزي. الكتاب كله أربعة أرباع، ولكل ربع ملف مستقل."}, {"note": "النص المعروض مكتوب من صور صفحات الكتاب المطبوع (دار التوفيق، تحقيق كامل محمد الخراط)، والحواشي كما وردت. بلا تشكيل إلا في الآيات. الأسئلة مبنية من نص الكتاب نفسه. لا يغني عن أصل الكتاب."}], "q": []}], "sum": [["الكتاب", "منهاج القاصدين ومفيد الصادقين، لابن الجوزي"], ["هذا الملف", "ربع العادات، الربع الثاني من أربعة أرباع"]]}, {"id": "l2", "title": "مقدمة الناشر والمحقق", "group": "المقدمة", "map": {"center": "مقدمة\nالمحقق", "nodes": [{"t": "الناشر", "s": []}, {"t": "المحقق", "s": []}, {"t": "النسخ الخطية", "s": []}]}, "paras": [{"t": "مقدمة الناشر والمحقق", "b": [{"pic": ["books", "book"], "cap": "دار التوفيق، تحقيق كامل محمد الخراط. ربع العادات، الربع الثاني من أربعة أرباع"}, {"story": ["مقدمة التحقيق (١ من ٥)", ["# مقدمة الناشر", "الحمد لله رب العالمين والصلاة والسلام على سيدنا محمد وعلى آله وأصحابه أجمعين. نحمد الله سبحانه وتعالى ونشكره على نعمه التي لا تحصى ونستغفره ونستهديه ونسترشده.", "نقدم بين يدي القراء الكرام والمكتبة العربية والإسلامية هذا الكتاب الجامع النفيس الذي طالما سألت وسأل مثلي كثيرون عن هذا الكتاب الذي لم ير النور إلى وقتنا هذا، مع كثرة طبعات كتاب «إحياء علوم الدين» وكذلك كتاب «مختصر منهاج القاصدين»، وكنت دائم البحث عن مخطوطات هذا الكتاب منذ سنوات عديدة وعزمت على أن أبذل كل الجهد للعمل على إظهار هذا السفر العظيم.", "وبفضل الله عثرت على نسخة خطية كاملة بعد جهد جهيد في مكتبة جور ليلى بتركيا، فأخبرت صديقي الأستاذ كامل الخراط عن المخطوط وطلبت منه تحقيق الكتاب فكانت سعادته كبيرة بظهور هذا الكتاب، وبذل كل الجهد لإعطاء الكتاب حقه، مستفيدا من خبرته الطويلة في هذا المجال فقد أمضى جل عمره في العلم والبحث والتحقيق وكانت له مشاركات كثيرة في مجال التحقيق والبحث نذكر منها على سبيل المثال لا الحصر: «سير أعلام النبلاء»، «مسند الإمام أحمد»، «تفسير الطبري». وقام مشكورا بتحقيق الكتاب فجزاه الله خير الجزاء وبارك له في علمه ووقته.", "وقد رأينا أن يخرج الكتاب محققا مدققا مخرج الأحاديث والآيات مع شرح غريب الكلمات والمصطلحات والتعريف ببعض الأعلام والأماكن دون إسهاب يرهق القارئ أو اختصار يضيع حق الكتاب، فكان أن ظهر الكتاب بهذه الحلة التي تليق به ككتاب نفيس جامع.", "وبكل تواضع تفخر دار التوفيق للنشر والتوزيع بإظهار كتاب منهاج القاصدين للعالم الإسلامي بعد أن بقي لمئات السنين راقدا بين المخطوطات النادرة والنفيسة بانتظار الظهور والطبع ليستفيد منه القاصي والداني على امتداد العالم الإسلامي.", "ونرجو من الله العلي القدير أن يجعل هذا العمل في ميزان حسناتنا وأن يتقبل منا صالح أعمالنا ويغفر لنا ذنوبنا وخطايانا انه على كل شيء قدير.", "والحمد لله رب العالمين والصلاة والسلام رسوله الأمين وعلى آله وأصحابه أجمعين.", "الناشر", "# المقدمة", "الحمد لله نحمده ونستعينه ونستغفره، ونعوذ بالله من شرور أنفسنا ومن سيئات أعمالنا، من يهده الله فلا مضل له، ومن يضلل فلا هادي له، وأشهد أن لا إله إلا الله، وأشهد أن محمدا عبده ورسوله، صلى الله عليه وعلى آله وصحبه وسلم تسليما كثيرا."]], "ic": "book"}, {"story": ["مقدمة التحقيق (٢ من ٥)", ["أما بعد: فكثيرا ما كنت أقرأ - وأنا في بدايات مرحلة الطلب - في كتاب (مختصر منهاج القاصدين)، للعلامة أحمد بن محمد بن قدامة المقدسي (ت ٧٤٢هـ)، حيث كان يشدني إليه كثرة ما فيه من علم جم ووعظ وتذكير تحتاجه النفس بين الفينة والفينة، لكبح جماح شهوتها وضبط عنان سطوتها، وسألت كثيرا أنا وعدد من الأصحاب عن أصل هذا المختصر وهو كتاب (منهاج القاصدين) للعلامة أبي الفرج عبد الرحمن بن علي الجوزي (ت ٥٩٧هـ)، ولكنا لم نظفر به، ولم نقف له على أثر، حيث إنه مازال مخطوطا لم يطبع بعد، وكم كانت سعادتي كبيرة عندما أخبرني صديقي الأستاذ محمد توفيق القوتلي - صاحب دار التوفيق - أنه قد وقف على نسخة خطية للمنهاج في إحدى مكتبات المخطوطات بتركيا، وأنه قام بتصويرها، وطلب مني أن أقوم بتحقيقه لكي يخرج إلى النور، ولا يظل حبيس خزائن مكتبات المخطوطات، ولينتفع بما فيه من علم غزير، فشحذ همتي وشد عزيمتي، وبحثت عن نسخ خطية أخرى له، فوقفت على نسخة خطية في المكتبة الظاهرية بدمشق، أدرجت خطأ تحت اسم (مختصر منهاج القاصدين)، وبعد البحث والتدقيق تبين أنها نسخة للمنهاج، ووقفت على نسخة أخرى في مكتبة جامعة برنستون بأمريكا، منها نسخة مصورة في مكتبة الملك فهد الوطنية بالرياض، عندها عقدت العزم على خوض غمار تحقيق هذا السفر العظيم، مستعينا بالله عز وجل، وطالبا منه التوفيق والسداد.", "**مؤلف الكتاب ونسبته إليه:**", "الكتاب من تأليف العلامة المحدث الواعظ صاحب التصانيف السائرة أبي الفرج عبد الرحمن بن علي بن محمد بن علي بن عبيد الله بن عبد الله القرشي التيمي البكري البغدادي، المتوفى سنة (٥٩٧هـ)، ولشهرته وغنائه عن التعريف لم أذكر له ترجمة خشية الإطالة.", "ومن المؤكد نسبة كتاب (منهاج القاصدين) لابن الجوزي، حيث نسبه له ابن قدامة في مقدمة المختصر، ومعظم المصادر التي ترجمت له ذكرته ضمن مصنفاته، والمصنف نفسه ذكره في مقدمته فقال: «وسميت كتابي هذا: منهاج القاصدين ومفيد الصادقين». وكذلك ذكره باسم آخر وهو يخاطب ولده أبا القاسم قائلا: «وعليك بكتاب منهاج المريدين، فإنه يعلمك السلوك، فاجعله جليسك ومعلمك...»، وذلك في رسالته المسماة: «لفتة الكبد في نصيحة الولد»(١). ويؤكد نسبته له أيضا ذكره الكثير من أسماء مصنفاته الأخرى ضمنه، ككتاب (تلبيس إبليس)، وكتاب (ذم الهوى)، وكتاب (صفة الصفوة) وغيرها.", "**بين الإحياء والمنهاج والمختصر:**"]], "ic": "book"}, {"story": ["مقدمة التحقيق (٣ من ٥)", ["من المعروف أن ابن الجوزي رحمه الله، اختصر كتابه (المنهاج) من كتاب (إحياء علوم الدين) للعلامة حجة الإسلام أبي حامد الغزالي رحمه الله تعالى، ولكنه تصرف في اختصاره تصرفا كبيرا، فهو لم يلتزم بذكر ما أورده الغزالي فحسب، وإنما أضاف وزاد من عنده الكثير، وأوضح ذلك في مقدمته حيث قال: «وسأكتبه لك في كتاب لا يخل بفوائده، ويخلو عن مفاسده، أعتمد فيه من المنقول الأصح والأشهر، ومن المعنى الأثبت والأجود، وأحذف ما يصلح حذفه، وأزيد ما يصلح أن يزاد، ولا أطيل بما لا طائل فيه، شحا عليك وعلى أمثالك أن يتشاغلوا بفاسد، ويحملوا في مفاوز المخاطرة المتاع الكاسد، وربما رأيتني أقصر في بعض الأبواب والفصول، وأحذف كثيرا من الأخبار والآثار، فلا تظنن ذلك مني سهوا بل عمدا؛ لأني لم أترك", "حاشية: (١) طبعت في مطبعة الترقي بدمشق سنة (١٩٥٥م)، تقديم وتعليق الشيخ ناصر الدين الألباني رحمه الله، ومحمود مهدي استانبولي.", "ذلك إلا لآفة في المتروك، فربما كانت الأحاديث لا تثبت، والآثار لا تصح، وربما قلت فائدتها، وربما تكون قد سبقت فاعرف ذلك».", "وقد أورد ابن الجوزي في المنهاج العديد من الأبواب والفصول التي ليست في الإحياء، ففي كتاب أسرار الصلاة ذكر فصولا كثيرة ليست في الإحياء، كفصل في رفع الصوت بالأذان، وإجابة المؤذن بمثل قوله، وذكر ما يقال عند الأذان من الدعاء، والدعاء بين الأذان والإقامة، وفضيلة الخطا إلى المساجد، وفضيلة الصف الأول وغيرها.", "وقد يخالف ابن الجوزي في بعض الأحيان الغزالي فيما أورده، ففي كتاب رياضة النفس وأمراض القلوب في فصل بيان الشواهد على أن الطريق في معالجة أمراض القلوب بترك الشهوات، خالف ابن الجوزي الغزالي فيما ذكره في هذا الفصل من ترك المباحات والمشتهيات، وذكر أمثلة عن النبي صلى الله عليه وسلم أنه كان يحب الحلواء والعسل وذراع الشاة وغير ذلك، وكذلك في كتاب الصبر ذكر فصولا لم يذكرها الغزالي، كذكر آداب الصبر، والصبر على مصائب البدن، كالحمى والصداع والطاعون، والصبر على موت الولد وغير ذلك، وفي باب معاقبة النفس على تقصيرها من كتاب المحاسبة ذكر الغزالي قصصا عن عقوبات كثيرة للنفس فيها جور عليها، فقال ابن الجوزي: «ولا يغتر بما يسمع من أن رجلا من بني إسرائيل وضع يده على فخذ امرأة، فوضعها في النار حتى شلت، وأن آخر حول رجله لينزل إلى امرأة، ثم تفكر فقال: ماذا أردت أن أصنع؟! فلما أراد أن يعيد رجله قال: هيهات! رجل خرجت إلى معصية الله لا ترجع معي. فتركها حتى تقطعت بالمطر والرياح، وأن آخر نظر إلى امرأة فقلع عينه، فهذا كله ربما كان جائزا في شريعتهم، فأما في شرعنا فمحرم، وقد سلك نحوه خلق من أهل ملتنا، حملهم على ذلك الجهل بالعلم، مع كون أكثرهم من أهل الخير، ولكن العلم شيء آخر»."]], "ic": "book"}, {"story": ["مقدمة التحقيق (٤ من ٥)", ["وكثيرا ما يستشهد ابن الجوزي في فصول الكتاب بأحاديث عن روايته عن مشايخه لم يذكرها الغزالي في الإحياء، فيذكر حديثا أو حديثين مما ذكره الغزالي، ويردف ذلك بعشرة أحاديث أو أكثر، وبقصص روايات عن الصالحين توضح المقصود.", "ويمتاز المنهاج أيضا بسلاسة الأسلوب وعذوبة العبارة، فابن الجوزي فارس لا يشق له غبار في ميدان البلاغة والفصاحة، فقد كان يخلب الألباب ويسحر العقول في مجلس وعظه.", "أما ابن قدامة فقد اختصر المنهاج، وحذف في مختصره الكثير من الأبواب والفصول، ولم يكتف باختصار العبارة فقط، فالمقارن بين الكتب الثلاثة يجد أن في الإحياء بعض التطويل الممل، وفي المختصر بعض الحذف المخل، ويبقى المنهاج وسطا بينهما، وهي ميزة له عليهما.", "**وصف النسخ الخطية:**", "١- نسخة محفوظة في مكتبة جورليلي علي باشا باستانبول برقم (٢٩٨)، وهي نسخة كاملة، نسخت عن نسخة المصنف، وقد أثبت ناسخها أرقام أجزاء نسخة المصنف بهامشها، وفي الورقة (٢٠٠) منها ورد بياض بقدر سطر واحد، فقال الناسخ: «هذا السطر كان قد انطمس بالتصاق جزء المصنف فليحقق من مناقب الحسن».", "وورد في عدة صفحات منها ختم وقفية نصها: «هذا مما وقفه الوزير الأعظم علي باشا ابن الحاج محمد آغا عفا الله عنهما سنة ١١٣٠هـ»، وقد نسخت بخط نسخي جميل مجود، نسخها أحمد بن عمر الشهير بحافظ كلام الله القديم سنة (١٠٨٤هـ)، وعدد أوراقها (٣٩٤) ورقة، ومسطرتها (٢٦) سطرا، ورغم تأخر تاريخ نسخها فقد اتخذتها أصلا لكمالها وجودة خطها، ولأنها منسوخة عن أصل المصنف.", "٢- نسخة محفوظة في المكتبة الظاهرية بدمشق، برقم (٢٤) تصوف، وهي تشكل الجزء الأول من الكتاب، وقد نقص من أولها اثنا عشر ورقة، فظن أحدهم أن هذا الكتاب هو المختصر لابن قدامة، فكتب بخط مغاير الورقات الناقصة، نقلها من المختصر وأثبتها في بداية هذه النسخة من المنهاج، فمن هنا جاء اللبس بأن هذا الكتاب هو المختصر وليس المنهاج، وظنه أحد مالكيه - وهو عبد الله باشا - أنه الإحياء حيث كتب على غلافه ما يلي: «الواقع أن هذا هو الجزء الأول من الإحياء... عبد الله باشا»، ولكن أحدهم اهتدى إلى أن الكتاب لابن الجوزي دون", "معرفة اسمه، وذلك من كثرة ذكره لمصنفاته العديدة داخل الكتاب، فكتب على صفحة الغلاف ما يلي: «التحقيق أن هذا الكتاب للعلامة ابن الجوزي كما يظهر من أسماء التآليف فيه».", "وعلى الغلاف وقفية نصها: «جدد وقف هذا الكتاب فقير عفو الله تعالى خليل بركات وقفا صحيحا، وشرطه أن يوضع في مدرسة المرحوم الحاج عبد الله باشا عظم زاده، فمن بدله بعدما سمعه فإنما إثمه على الذين يبدلونه، وذلك في ذي الحجة سنة (١٢٤٣هـ)، غفر الله له ولوالديه، ولمن دعا لهما بالمغفرة وللمسلمين أجمعين إنه غفور رحيم»."]], "ic": "book"}, {"story": ["مقدمة التحقيق (٥ من ٥)", ["وعليه تملك نصه: «الحمد لله على كل حال، ملكه من فضل الله تعالى ولطفه الخفي، الفقير رمضان بن موسى المطيعي الحنفي، غفر الله تعالى له ولوالديه ولجميع المسلمين أجمعين آمين».", "تقع هذه النسخة في (٢١٨) ورقة، ومسطرتها (٢٥) سطرا، ونسخت بخط نسخي جميل، نسخها محمد بن الحسين بن محمد بن الحسين بن الخراساني سنة (٥٩٢هـ)، أي في حياة المصنف رحمه الله، وقد رمزت لها بالحرف (ظ).", "٣- نسخة محفوظة في مكتبة جامعة برنستون في الولايات المتحدة الأمريكية، ضمن مجموعة برقم (٢١٤٦)، منها صورة محفوظة في مكتبة الملك فهد الوطنية بالرياض، وهي ناقصة من أولها وآخرها، تبدأ من كتاب ذم الجاه والرياء، وتنتهي بنهاية كتاب الصبر والشكر، وهي منقولة من أصل المصنف وخطه كما ورد في آخرها، وهي خلو من صفحة الغلاف واسم الناسخ وتاريخ النسخ، وخطها نسخي معتاد، ولكن ناسخها حرف وصحف الكثير من الكلمات، وعدد ورقاتها (١٩٤) ورقة، ومسطرتها (١٩) سطرا، وقد رمزت لها بالحرف (ف).", "**منهج التحقيق:**", "قمت أولا بنسخ الكتاب بكامله عن نسخة الأصل، ثم قمت بمقابلة المنسوخ على الأصل، ثم على الموجود من النسخة (ظ) والنسخة (ف) وأثبت فوارق النسخ المهمة في الحاشية، وقد صببت جل اهتمامي على إخراج نص الكتاب بشكل", "سليم، خال من التصحيف والتحريف، وخاصة في القسم الذي اعتمدت فيه على نسخة الأصل فقط، حيث كانت ترد كلمة مطموسة أو محرفة أو مصحفة، فكنت أعود إلى الإحياء أو إلى المختصر أو إلى المصادر التي نقل عنها المصنف لتكميل النقص وتصحيح الخطأ، ثم قمت بضبط النص وترقيمه وتفصيله، وتخريج الآيات والأحاديث، ثم التعريف ببعض الأعلام والأماكن والفرق باختصار خشية الإطالة، وشرح الكلمات الغريبة والمصطلحات الواردة، وذلك بالرجوع إلى كتب اللغة وكتاب «إتحاف المتقين بشرح إحياء علوم الدين» للزبيدي.", "ولا بد لي من أن أشكر زوجتي (منى محمد زياد خراط) التي ساعدتني في مقابلة النسخ الخطية كلها، وفي استخراج الكثير من النصوص من مصادرها والتأكد من صحتها، وغير ذلك، مما قرب لي الغاية وأدنى لي الهدف في تحقيق هذا الكتاب العظيم، فجزاها الله عني خير الجزاء، ووفقها لكل خير.", "وأسأله تعالى أن يجعل عملي هذا خالصا لوجهه الكريم، وأن يعم بنفعه المسلمين، وأن يجعله في ميزان حسناتي يوم لا ينفع مال ولا بنون إلا من أتى الله بقلب سليم.", "وصلى الله على نبينا محمد، وعلى آله وصحبه وسلم.", "كامل محمد الخراط", "دمشق", "١٧/ محرم ١٤٢٨ هـ", "٤/٢/٢٠٠٧م"]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "سليم، خال من التصحيف والتحريف، وخاصة في القسم الذي اعتمدت فيه على نسخة الأصل فقط، حيث كانت ترد كلمة مطموسة أو محرفة أو مصحفة، فكنت أعود إلى الإحياء أو إلى المختصر أو إلى المصادر التي نقل عنها المصنف لتكميل النقص وتصحيح الخطأ، ثم قمت بضبط النص وترقيمه وتفصيله، وتخريج الآيات والأحاديث، ثم التعريف ببعض الأعلام والأماكن والفرق باختصار خشية الإطالة، وشرح الكلمات الغريبة والمصطلحات الواردة، وذلك بالرجوع إلى كتب اللغة وكتاب «إتحاف المتقين بشرح إحياء علوم الدين» ____", "o": ["للزبيدي", "المئتين", "باعها", "معيبه"], "h": "راجع: ص"}, {"t": "fill", "d": 2, "q": "ومن المؤكد نسبة كتاب (منهاج القاصدين) لابن الجوزي، حيث نسبه له ابن قدامة في مقدمة المختصر، ومعظم المصادر التي ترجمت له ذكرته ضمن مصنفاته، والمصنف نفسه ____ في مقدمته فقال", "o": ["ذكره", "هكذا", "ويسار", "والشرط"], "h": "راجع: ص"}, {"t": "fill", "d": 2, "q": "وقد أورد ابن الجوزي في المنهاج العديد من الأبواب والفصول التي ليست في الإحياء، ففي كتاب أسرار الصلاة ذكر فصولا كثيرة ليست في الإحياء، كفصل في رفع الصوت بالأذان، وإجابة المؤذن بمثل قوله، وذكر ما يقال عند الأذان من الدعاء، ____ بين الأذان والإقامة، وفضيلة الخطا إلى المساجد، وفضيلة الصف الأول وغيرها", "o": ["والدعاء", "بيضاء", "رواية", "الآخر"], "h": "راجع: ص"}, {"t": "fill", "d": 2, "q": "ذلك إلا لآفة في المتروك، فربما كانت الأحاديث لا تثبت، والآثار لا تصح، وربما قلت فائدتها، وربما تكون قد ____ فاعرف ذلك»", "o": ["سبقت", "الفرض", "ودنياه", "الخفي"], "h": "راجع: ص"}, {"t": "fill", "d": 2, "q": "من المعروف أن ابن الجوزي رحمه الله، اختصر كتابه (المنهاج) من كتاب (إحياء علوم الدين) للعلامة حجة الإسلام أبي حامد الغزالي رحمه الله تعالى، ولكنه تصرف في اختصاره تصرفا كبيرا، فهو لم يلتزم بذكر ما أورده الغزالي فحسب، وإنما أضاف وزاد من عنده الكثير، ____ ذلك في مقدمته حيث قال", "o": ["وأوضح", "لقمتين", "خليل", "وعلموا"], "h": "راجع: ص"}, {"t": "fill", "d": 2, "q": "وعلى الغلاف وقفية نصها: «جدد وقف هذا الكتاب فقير عفو الله تعالى خليل بركات وقفا صحيحا، وشرطه أن يوضع في مدرسة المرحوم الحاج عبد الله باشا عظم زاده، فمن ____ بعدما سمعه فإنما إثمه على الذين يبدلونه،", "o": ["بدله", "ويشتري", "ميلين", "فليفعل"], "h": "راجع: ص"}, {"t": "fill", "d": 2, "q": "تقع هذه النسخة في (٢١٨) ورقة، ومسطرتها (٢٥) سطرا، ونسخت بخط نسخي جميل، نسخها محمد بن الحسين بن محمد بن الحسين بن الخراساني سنة (٥٩٢هـ)، أي في حياة المصنف رحمه ____، وقد رمزت لها بالحرف (ظ)", "o": ["الله", "وحكم", "يفيد", "يقعد"], "h": "راجع: ص"}, {"t": "fill", "d": 2, "q": "معرفة اسمه، وذلك من كثرة ذكره لمصنفاته العديدة ____ الكتاب، فكتب على صفحة الغلاف ما يلي", "o": ["داخل", "القبلة", "الورثة", "ويسب"], "h": "راجع: ص"}]}], "sum": [["المحقق", "كامل محمد الخراط"], ["النسخ", "ظ، ف، والأصل"]]}, {"id": "l3", "title": "كتاب آداب الأكل", "group": "كتاب آداب الأكل", "map": {"center": "كتاب\nآداب الأكل", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "كتاب آداب الأكل", "b": [{"pic": ["books", "book"], "cap": "ص٣٢٠ - ص٣٢١"}, {"story": ["كتاب آداب الأكل، ص٣٢١", ["الحمد لله الذي أنشأ الأرض وخلق السماوات، وأنزل القطر وأخرج النبات، وقسم الرزق وقدر الأقوات، بين حلو وحامض ومر وممسك ومسهل مختلفة الحالات، فالأدوية والأغذية تدفع الداء وتحفظ قوى الحيوانات، ثم من وما من فقال: ﴿أُحِلَّ لَكُمُ الطَّيِّبَٰتُ﴾ [المائدة: ٤]، أحمده حمدا يتوالى على مرور الأوقات، وأصلي على رسوله محمد ذي المعجزات الباهرات، وعلى أصحابه وأتباعه إلى يوم الفصل والميقات، صلاة تتضاعف بتعاقب الساعات وأسلم تسليما كثيرا.", "أما بعد: فإنه لا بلوغ إلى خير الآخرة إلا بالعلم والعمل في الدنيا، ولا يمكن المواظبة عليهما إلا بسلامة البدن، ولا تصفو سلامته إلا بتناول الحاجة من الأقوات، وما هو ذريعة إلى الدين، فإنه من الدين، فينبغي أن تظهر أنوار الدين عليه، وأنوار الدين آدابه وسننه، قال عليه الصلاة والسلام: «إن الرجل ليؤجر حتى في اللقمة يرفعها إلى فم امرأته». وإنما يكون ذلك إذا رفعها بالدين، وها نحن نرشد إلى وظائف الدين في الأكل من فرض وسنة وأدب ومروءة وهيئة في أربعة أبواب، وفصل في آخرها.", "الباب الأول: فيما لا بد للآكل من مراعاته وإن انفرد بالأكل.", "الباب الثاني: فيما يزيد من الآداب(١) بسبب الاجتماع على الأكل.", "الباب الثالث: فيما يخص تقديم الطعام إلى الإخوان الزائرين.", "الباب الرابع: فيما يخص الدعوة والضيافة وأسبابها.", "حاشية: (١) في الأصل: «الأدب»."]], "ic": "book"}], "q": []}], "sum": [["الصفحات", "ص٣٢٠ - ص٣٢١"]], "_nq": 0}, {"id": "l4", "title": "الباب الأول فيما لا بد للمنفرد بالأكل منه", "group": "كتاب آداب الأكل", "map": {"center": "الباب\nالأول فيما", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الأول فيما لا بد للمنفرد بالأكل منه", "b": [{"pic": ["books", "book"], "cap": "ص٣٢٢ - ص٣٢٥"}, {"story": ["الباب الأول فيما لا بد للمنفرد بالأكل منه (١ من ٣)، ص٣٢٢", ["**فيما لا بد للمنفرد بالأكل منه**", "وهو ثلاثة أقسام: قسم قبل الأكل، وقسم مع الأكل، وقسم بعد الفراغ منه.", "**القسم الأول:** في الآداب التي تقدم على الأكل، وهي سبعة:", "**الأول:** أن يكون الطعام بعد كونه حلالا في نفسه طيبا في جهة مكسبه، موافقا للسنة والورع ولم يكتسب بسبب مكروه في الشرع، ولا بحكم هوى ومداهنة في دين على ما سيأتي في معنى الطيب المطلق في كتاب الحلال والحرام، وقد أمر الله تعالى بأكل الطيب وهو الحلال، وقدم النهي عن الأكل بالباطل على القتل تفخيما لأمر الحرام، فقال تعالى: ﴿يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَأْكُلُوٓا۟ أَمْوَٰلَكُم بَيْنَكُم بِٱلْبَٰطِلِ إِلَّآ أَن تَكُونَ تِجَٰرَةً عَن تَرَاضٍ مِّنكُمْ وَلَا تَقْتُلُوٓا۟ أَنفُسَكُمْ﴾ [النساء: ٢٩].", "**الثاني:** في غسل اليد قبل الأكل؛ لأنها لا تخلوا عن درن، وقد روي في حديث: «الوضوء قبل الطعام ينفي الفقر، وبعده ينفي اللمم»(١) وفسروه بغسل اليد؛ إلا أنه لا يثبت.", "**الثالث:** أن يوضع الطعام على السفرة الموضوعة على الأرض، فهو أقرب إلى فعل رسول الله ﷺ من رفعه على المائدة، وهو أدنى إلى التواضع، وإن كان الأكل على المائدة ليس بمنهي عنه، قال أنس: ما أكل رسول الله ﷺ على خوان(٢) ولا في سكرجة(٣). قيل: فعلى ماذا كنتم تأكلون؟ قال: على السفر.", "حاشية: (١) اللمم: الجنون.", "حاشية: (٢) الخوان: المائدة ما لم يكن عليها طعام.", "حاشية: (٣) السكرجة: إناء صغير يجعل فيه ما يشتهى ويهضم من الموائد حول الأطعمة.", "**الرابع:** أن يحسن الجلسة على السفرة، فينصب رجله اليمنى، ويجلس على اليسرى.", "**الخامس:** أن ينوي بأكله أن يتقوى به على طاعة الله، ليكون مطيعا بالأكل، ولا يقصد التنعم فقط، علامة صحة هذه النية أخذ البلغة دون الشبع، قال ﷺ: «ما ملأ ابن آدم(١) وعاء شرا من بطن، حسب ابن آدم أكلات يقمن صلبه، فإن كان لا محالة، فثلث لطعامه، وثلث لشرابه، وثلث لنفسه». ومن ضرورة هذه النية أن لا يمد يده إلى الطعام إلا وهو جائع وأن يرفع يديه قبل الشبع، ومن فعل ذلك لم يكد(٢) يحتاج إلى طبيب؛ وسيأتي فائدة قلة الأكل، وكيفية التدريج في التقلل منه في كتاب كسر شرة الطعام من ربع المهلكات إن شاء الله تعالى.", "**السادس:** أن يرضى بالموجود من الرزق، ولا يحتقر اليسير، ولا ينتظر الزيادة والأدم.", "**السابع:** أن يجتهد في تكثير الأيدي على الطعام ولو من أهله وولده، فقد جاء في الحديث: «أحب الطعام إلى الله ما كثرت عليه الأيدي».", "**القسم الثاني في آداب حالة الأكل:**"]], "ic": "book"}, {"story": ["الباب الأول فيما لا بد للمنفرد بالأكل منه (٢ من ٣)، ص٣٢٣", ["وهو أن يبدأ باسم الله في أوله، ويحمد الله في آخره، وقد روينا من حديث جابر بن عبد الله عن النبي ﷺ أنه قال: «إذا دخل الرجل بيته، فذكر الله عند دخوله، وعند طعامه، قال الشيطان: لا مبيت لكم ولا عشاء. وإذا دخل فلم يذكر الله عند دخوله قال الشيطان: أدركتم المبيت. وإن لم يذكر الله عند طعامه قال الشيطان: أدركتم المبيت والعشاء».", "ومن الأدب أن يأكل باليمين ويصغر اللقمة، ويجود مضغها، ولا يمد يده إلى أخرى حتى يبتلع الأولى، وأن لا يذم مأكولا، ففي الصحيحين من حديث أبي هريرة عن النبي ﷺ، أنه ما عاب طعاما قط، كان إذا اشتهى شيئا أكله، وإن كرهه تركه.", "حاشية: (١) في الأصل: «آدمي».", "حاشية: (٢) في (ظ): «يكن».", "ومن الأدب أن يأكل مما يليه، إلا أن يكون الطعام متنوعا، كالفاكهة، وأن لا يأكل من ذروة القصعة، ولا من وسطها فقد روى ابن عباس عن النبي ﷺ، أنه أتي بقصعة من ثريد فقال: «كلوا من حولها، ولا تأكلوا من وسطها، فإن البركة تنزل في وسطها».", "وليأكل بثلاث أصابع، ففي أفراد مسلم من حديث كعب بن مالك أن رسول ﷺ كان يأكل بثلاث أصابع.", "فإذا وقعت لقمة أخذها، ففي أفراد مسلم من حديث جابر عن النبي ﷺ أنه قال: «إذا سقطت لقمة أحدكم فليأخذها، فليمط ما بها وليأكلها، ولا يدعها للشيطان».", "ومن الأدب أن لا ينفخ في الطعام الحار بل يصبر حتى يتهيأ أكله، ولا يجمع بين التمر والنوى في طبق، ولا يجمعه في كفه، بل يضعه من فيه على ظهر كفه ثم يلقيه، وكذا كل ما له عجم وثفل(١)، ولا يشرب الماء في أثناء الطعام، فإنه أجود في باب الطب.", "وأما الشرب: فأدبه أن يتناول الإناء بيمينه، ويسمي وينظر في الإناء قبل أن يشرب، ويمص مصا لا عبا، فقد قال عليه الصلاة والسلام: «مصوا الماء مصا ولا تعبوا عبا، فإن الكباد(٢) من العب».", "ولا يشرب قائما، ففي أفراد مسلم من حديث أبي سعيد أن النبي ﷺ نهى عن الشرب قائما، وقد جاء عنه أنه شرب، فيحتمل أن يكون لعذر أو لبيان الجواز، ويتنفس في شربه ثلاثا، ففي الصحيحين من حديث أنس أن النبي ﷺ كان يتنفس في الإناء ثلاثا، والمعنى: يتنفس في شربه من الإناء، بأن يباعد الإناء عنه ويتنفس، لا أن يكون النفس في الإناء، وأن يحمد الله عند الفراغ، وأن يناول الأيمن فالأيمن.", "حاشية: (١) العجم: النوى، والثفل: ما يبقى من المادة بعد عصرها.", "حاشية: (٢) الكباد: وجع الكبد.", "**القسم الثالث: ما يستحب بعد الطعام:**", "وهو أن يمسك قبل الشبع، ويلعق أصابعه، ففي الصحيحين من حديث ابن عباس عن النبي ﷺ أنه قال: «إذا أكل أحدكم طعاما، فلا يمسح يده حتى يلعقها أو يلعقها».", "وأن يسلت(١) القصعة، ففي أفراد مسلم من حديث جابر قال: أمرنا رسول الله ﷺ أن نسلت القصعة، وقال: «إنكم لا تدرون في أي طعامكم البركة»."]], "ic": "book"}, {"story": ["الباب الأول فيما لا بد للمنفرد بالأكل منه (٣ من ٣)، ص٣٢٥", ["وليحمد الله عزوجل، ففي أفراد البخاري من حديث أبي أمامة قال: كان رسول الله ﷺ إذا فرغ من طعامه، أو رفعت مائدته قال: «الحمد لله كثيرا طيبا مباركا فيه، غير مكفي ولا مودع ولا مستغنى عنه ربنا عز وجل». وفي أفراد مسلم من حديث أنس عن النبي ﷺ أنه قال: «إن الله ليرضى عن العبد أن يأكل الأكلة فيحمده عليها، ويشرب الشربة فيحمده عليها». وإن أفطر عند قوم فليقل: أفطر عندكم الصائمون، وأكل طعامكم الأبرار، وصلت عليكم الملائكة.", "وليغسل يده من الغمر(٢) فقد روى أبو هريرة عن النبي ﷺ أنه قال: «إذا بات أحدكم وفي يده غمر، فأصابه شيء، فلا يلومن إلا نفسه».", "حاشية: (١) سلت القصعة: تتبع ما فيها من الطعام ومسحها.", "حاشية: (٢) الغمر: ما يغمر من رائحة الدسم كل الروائح."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "ومن الأدب أن يأكل باليمين ويصغر اللقمة، ويجود مضغها، ولا يمد يده إلى أخرى حتى يبتلع الأولى، وأن لا يذم مأكولا، ففي الصحيحين من حديث أبي هريرة عن النبي ﷺ، أنه ما عاب طعاما قط، كان إذا اشتهى شيئا أكله، وإن ____ تركه", "o": ["كرهه", "يجالس", "ليتخلص", "فوارق"], "h": "راجع: ص٣٢٣"}, {"t": "fill", "d": 2, "q": "وليحمد الله عزوجل، ففي أفراد البخاري من ____ أبي أمامة قال", "o": ["حديث", "أصاب", "دينه", "وأحذف"], "h": "راجع: ص٣٢٥"}, {"t": "fill", "d": 2, "q": "الخامس: أن ينوي بأكله أن يتقوى به على طاعة الله، ليكون مطيعا بالأكل، ولا يقصد التنعم فقط، علامة صحة هذه النية أخذ البلغة دون ____، قال ﷺ: «ما ملأ ابن آدم وعاء شرا من بطن، حسب ابن آدم أكلات", "o": ["الشبع", "حيوانا", "الجورب", "وتشترط"], "h": "راجع: ص٣٢٣"}, {"t": "fill", "d": 2, "q": "وأن يسلت القصعة، ففي أفراد مسلم من ____ جابر قال", "o": ["حديث", "حمام", "وغنائه", "دابتي"], "h": "راجع: ص٣٢٥"}, {"t": "fill", "d": 2, "q": "وهو أن يمسك قبل الشبع، ويلعق أصابعه، ففي الصحيحين من حديث ابن ____ عن النبي ﷺ أنه قال", "o": ["عباس", "تأذيه", "توالي", "الموحد"], "h": "راجع: ص٣٢٥"}, {"t": "fill", "d": 2, "q": "وليغسل يده من الغمر فقد روى أبو ____ عن النبي ﷺ أنه قال", "o": ["هريرة", "رمضان", "فستره", "العيب"], "h": "راجع: ص٣٢٥"}]}], "sum": [["الصفحات", "ص٣٢٢ - ص٣٢٥"]], "_nq": 6}, {"id": "l5", "title": "الباب الثاني فيما يزيد من الآداب بسبب الاجتماع والمشاركة في الأكل", "group": "كتاب آداب الأكل", "map": {"center": "الباب\nالثاني فيما", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الثاني فيما يزيد من الآداب بسبب الاجتماع والمشاركة في الأكل", "b": [{"pic": ["books", "book"], "cap": "ص٣٢٦ - ص٣٢٧"}, {"story": ["الباب الثاني فيما يزيد من الآداب بسبب الاجتماع والمشاركة في ، ص٣٢٦", ["**فيما يزيد من الآداب بسبب الاجتماع والمشاركة في الأكل**", "وهي سبعة:", "**الأول:** أن لا يبتدئ بالأكل إذا كان معه من يستحق التقديم بكبر سن أو زيادة فضل، إلا أن يكون هو المتبوع.", "**الثاني:** أن لا يسكتوا على الطعام، فإن ذلك من سيرة العجم، بل يتكلمون بالمعروف، ويتحدثون بحكايات الصالحين في الأطعمة وغيرها.", "**الثالث:** أن يقصد كل منهم الإيثار لرفيقه، ولا يزيد في التناول عليه، ويبسطه إذا انقبض.", "**الرابع:** أن لا يحوج رفيقه إلى أن يقول له: كل، بل ينبسط، ولا يتصنع بالانقباض.", "**الخامس:** أن لا يتنخم في الطست إذا كان معه غيره، فإن كان وحده، فلا بأس، ولا يرفع الطست حتى يمتلئ، كتب عمر بن عبد العزيز إلى الأمصار: لا ترفع طست من بين يدي القوم إلا مملوءة، ولا تشبهوا بالعجم، وأن يبتدأ بالمتبوع في تقديمها إليه، وإن تدار يمنة، وأن يكون الخادم قائما، وأن يمج الماء من فيه برفق حتى لا يتنضح على أحد.", "**السادس:** أن لا ينظر إلى أصحابه في حالة الأكل، لئلا يستحيوا، ولا يمسك قبلهم إذا كانوا يحتشمون الأكل بعده، بل يتناول قليلا قليلا إلى أن يفرغوا، فإن امتنع لسبب بين عذره، لئلا يستحيوا.", "**السابع:** أن لا يفعل ما يستقذره غيره، فلا ينفض يده في القصعة، ولا يقدم إليها رأسه عند وضع اللقمة في فيه، وإذا أخرج شيئا من فيه ليرمي به صرف وجهه عن الطعام، وأخذ بيساره، ولا يغمس اللقمة الدسمة في الخل، ولا الخل في الدسم، فقد يكرهه غيره، ولا يغمس بقية اللقمة التي أكل منها في المرقة."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "الثاني: أن لا يسكتوا على الطعام، فإن ذلك من سيرة ____، بل يتكلمون بالمعروف، ويتحدثون بحكايات الصالحين في الأطعمة", "o": ["العجم", "إخبار", "نفعهم", "ضيعتهم"], "h": "راجع: ص٣٢٦"}, {"t": "fill", "d": 2, "q": "الخامس: أن لا يتنخم في الطست إذا كان معه غيره، فإن كان وحده، فلا بأس، ولا يرفع الطست حتى يمتلئ، كتب عمر بن عبد العزيز إلى الأمصار: لا ترفع طست من بين يدي القوم إلا مملوءة، ولا ____ بالعجم، وأن", "o": ["تشبهوا", "أمراض", "هالكون", "اتقينا"], "h": "راجع: ص٣٢٦"}, {"t": "fill", "d": 2, "q": "السابع: أن لا يفعل ما يستقذره غيره، فلا ينفض يده في القصعة، ولا يقدم إليها رأسه عند وضع اللقمة في فيه، وإذا أخرج ____ من فيه ليرمي به صرف وجهه عن الطعام، وأخذ بيساره، ولا يغمس اللقمة الدسمة في", "o": ["شيئا", "عدلك", "خياطا", "محمودة"], "h": "راجع: ص٣٢٧"}, {"t": "fill", "d": 2, "q": "السادس: أن لا ينظر إلى أصحابه في حالة الأكل، لئلا يستحيوا، ولا يمسك قبلهم إذا كانوا يحتشمون الأكل بعده، بل ____ قليلا قليلا إلى أن يفرغوا، فإن امتنع لسبب بين عذره، لئلا", "o": ["يتناول", "الأملاك", "خادمه", "يصليها"], "h": "راجع: ص٣٢٦"}, {"t": "fill", "d": 2, "q": "الأول: أن لا يبتدئ بالأكل إذا كان معه من يستحق التقديم ____ سن أو زيادة فضل، إلا أن يكون هو", "o": ["بكبر", "البقاء", "وقوتها", "يرونه"], "h": "راجع: ص٣٢٦"}]}], "sum": [["الصفحات", "ص٣٢٦ - ص٣٢٧"]], "_nq": 5}, {"id": "l6", "title": "الباب الثالث في آداب تقديم الطعام إلى الإخوان الزائرين", "group": "كتاب آداب الأكل", "map": {"center": "الباب\nالثالث في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الثالث في آداب تقديم الطعام إلى الإخوان الزائرين", "b": [{"pic": ["books", "book"], "cap": "ص٣٢٨ - ص٣٢٩"}, {"story": ["الباب الثالث في آداب تقديم الطعام إلى الإخوان الزائرين (١ من ٢)، ص٣٢٨", ["**في آداب تقديم الطعام إلى الإخوان الزائرين**", "(١-١)فضيلة تقديم الطعام إلى الإخوان(١-١): روي عبد الله بن سلام عن النبي ﷺ أنه قال: «أيها الناس، أفشوا السلام، وصلوا الأرحام، وأطعموا الطعام، وصلوا بالليل والناس نيام، تدخلوا الجنة بسلام».", "وروي عن علي بن أبي طالب رضي الله عنه أنه قال: لأن أجمع إخواني على صاع من الطعام أحب إلي من أن أعتق رقبة.", "وكان سعيد بن العاص يدعو جيرانه وجلساءه كل جمعة، فيصنع لهم الطعام ويكسوهم الثياب، فإذا أرادوا أن يتفرقوا أمر لهم بالجوائز، وبعث إلى عيالهم(٢) بالنفقة الكثيرة.", "وكان خيثمة يصنع الخبيص(٣) والطعام الطيب، فيدعو إبراهيم والأعمش، ويقول: كلوا فما صنعته إلا لكم.", "وكان الحسن إذا دخل عليه إخوانه أتاهم بما يكون عنده، وربما قال لبعضهم: أخرج السلة من تحت السرير. فيخرجها، فإذا فيها رطب، فيقول: إنما ادخرته لكم.", "وقال أبو خلدة: دخلنا على ابن سيرين أنا وابن عون فرحب بنا، وقال: ما أدري كيف أتحفكم؟ كل رجل منكم في بيته خبز ولحم، ولكن سأطعمكم شيئا لا أراه في بيوتكم. فجاء بشهدة فجعل يقطع بالسكين ويلقمنا. وكان أبو جعفر", "حاشية: (١-١) سقط من (ظ).", "حاشية: (٢) في الأصل: «عيالاتهم».", "حاشية: (٣) الخبيص: الحلواء المخبوصة من التمر والسمن.", "محمد بن علي يدعو نفرا من إخوانه كل جمعة فيطعمهم الطعام الطيب ويكسوهم ويجمرهم(١)، ويروحون إلى المسجد من منزله.", "وأما الآداب: فبعضها في الدخول، وبعضها في تقديم الطعام، فأما الدخول فإنه لا ينبغي لأحد إن علم أن قوما يأكلون أن يدخل عليهم، فإن صادفهم من غير قصد فسألوه الأكل نظر، فإن علم أنهم إنما يسألوه حياء منه، فلا يأكل، وإن علم أنهم يحبون أكله معهم، جاز له أن يأكل، ومن دخل دار صديقه فلم يجده وكان واثقا بصداقته عالما أنه إذا أكل من طعامه سر بذلك، جاز له أن يأكل، فقد كان أصحاب الحسن يدخلون منزله فيأكلون ما يجدون بغير إذن فكان الحسن إذا جاء فرآهم كذلك سر، وقال: هكذا كنا.", "وأما آداب تقديم الطعام، فتقديم ما حضر من غير تكلف، ولا يقول له: هل أقدم لك كذا؟ بل يقدمه من غير استئذان، ومن التكلف أن يقدم جميع ما عنده، فيجحف بعياله، فإن لم يرض ما عنده للضيف، وقدر أن يشتري خيرا منه وكان محبا لذلك مؤثرا له، فليس هذا من التكلف، فقد كان إبراهيم بن أدهم يأخذ عليه بالدين ويكرم إخوانه، وربما باع ثيابه وأنفقها عليهم.", "وإن قدر أن يشهيه ويلتمس منه أن يقترح عليه إذا كانت نفسه طيبة بذلك كان أحسن."]], "ic": "book"}, {"story": ["الباب الثالث في آداب تقديم الطعام إلى الإخوان الزائرين (٢ من ٢)، ص٣٢٩", ["ومن آداب الزائر: أن لا يقترح شيئا بعينه فربما شق على المزور، فإن خير بين طعامين اختار أيسرهما، إلا أن يعلم أن مضيفه يسر باقتراحه، ولا يقصر عن تحصيل ذلك، فقد نزل الشافعي على الزعفراني، وكان الزعفراني يكتب كل يوم رقعة بما يطبخ من الألوان ويسلمها إلى الجارية، فأخذ الشافعي الرقعة والحق فيها لونا آخر، فلما علم الزعفراني اشتد فرحه.", "حاشية: (١) يجمرهم: أي يبخرهم بالبخور في المجمرة."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "وأما آداب تقديم الطعام، فتقديم ما حضر من غير تكلف، ولا ____ له", "o": ["يقول", "تخريب", "وصفة", "الجهد"], "h": "راجع: ص٣٢٩"}, {"t": "fill", "d": 2, "q": "وروي عن علي بن أبي طالب رضي ____ عنه أنه قال", "o": ["الله", "ويهيئ", "إيصال", "بأيام"], "h": "راجع: ص٣٢٨"}, {"t": "fill", "d": 2, "q": "ومن آداب الزائر: أن لا يقترح شيئا بعينه فربما شق على المزور، فإن خير بين طعامين اختار أيسرهما، إلا أن يعلم أن مضيفه يسر باقتراحه، ولا ____ عن تحصيل ذلك، فقد نزل الشافعي على الزعفراني، وكان الزعفراني", "o": ["يقصر", "ضيافته", "ويطلب", "يشكل"], "h": "راجع: ص٣٢٩"}, {"t": "fill", "d": 2, "q": "وكان الحسن إذا دخل عليه إخوانه أتاهم بما يكون ____، وربما قال لبعضهم", "o": ["عنده", "هؤلاء", "ديوان", "لسبب"], "h": "راجع: ص٣٢٨"}, {"t": "fill", "d": 2, "q": "محمد بن علي يدعو نفرا من إخوانه كل جمعة فيطعمهم الطعام ____ ويكسوهم ويجمرهم، ويروحون إلى المسجد من منزله", "o": ["الطيب", "واجب", "المعادن", "ونعوذ"], "h": "راجع: ص٣٢٩"}, {"t": "fill", "d": 2, "q": "وأما الآداب: فبعضها في الدخول، وبعضها في تقديم الطعام، فأما الدخول فإنه لا ينبغي لأحد إن علم أن قوما يأكلون أن يدخل عليهم، فإن ____ من غير قصد فسألوه الأكل نظر، فإن علم أنهم إنما يسألوه حياء منه،", "o": ["صادفهم", "مأذونين", "أظنك", "نهيتكم"], "h": "راجع: ص٣٢٩"}]}], "sum": [["الصفحات", "ص٣٢٨ - ص٣٢٩"]], "_nq": 6}, {"id": "l7", "title": "الباب الرابع في آداب الضيافة", "group": "كتاب آداب الأكل", "map": {"center": "الباب\nالرابع في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الرابع في آداب الضيافة", "b": [{"pic": ["books", "book"], "cap": "ص٣٣٠ - ص٣٣٦"}, {"story": ["الباب الرابع في آداب الضيافة (١ من ٤)، ص٣٣٠", ["**في آداب الضيافة**", "ومظان الآداب فيها ستة: الدعوة، ثم الإجابة، ثم الحضور، ثم تقديم الطعام، ثم الأكل، ثم الانصراف.", "ولنقدم على شرحها فضيلة الضيافة: روى البخاري ومسلم في الصحيحين من حديث أبي هريرة عن النبي ﷺ أنه قال: «من كان يؤمن بالله واليوم الآخر، فليكرم ضيفه». وفي حديث جابر عن النبي ﷺ أنه قال: «حج مبرور ليس له جزاء إلا الجنة» قالوا: ما بر الحج؟ قال: «إطعام الطعام وإفشاء السلام».", "والأحاديث في فضل إطعام الطعام كثيرة، وقد كان إبراهيم الخليل عليه السلام إذا أراد أن يأكل خرج ميلا أو ميلين يلتمس من يتغذى معه، وكان يكنى أبا الضيفان حتى أن مشهده إلى الآن لا يخلو من ضيف.", "**وأما الدعوة:** فينبغي للداعي أن يقصد بدعوته الأتقياء دون الفساق، وقد روى أنس عن النبي ﷺ أنه كان إذا أفطر عند أهل بيت(١) قال لهم: «أفطر عندكم الصائمون، وأكل طعامكم الأبرار، وصلت عليكم الملائكة».", "وقال بعض السلف: لا تأكل إلا طعام تقي، ولا يأكل طعامك إلا تقي.", "واعلم أن إطعام التقي إعانة له على التقوى، وإطعام الفاسق تقوية له على الفسق.", "وينبغي أن يقصد الفقراء دون الأغنياء، فقد قال عليه الصلاة والسلام: «شر الطعام طعام الوليمة يدعى إليها الأغنياء ويترك الفقراء».", "حاشية: (١) في الأصل: «بيته».", "وينبغي أن لا يهمل أقاربه في ضيافته، فإن إهمالهم يوجب الإيحاش وقطيعة الرحم، وكذلك يراعي الترتيب في أصدقائه ومعارفه، فإن في تخصيص بعضهم إيحاشا للباقين.", "وينبغي أن لا يقصد بدعوته المباهاة والتفاخر بل استعمال السنة في إطعام الطعام، واستمالة قلوب الإخوان، وإدخال السرور في قلوب المؤمنين.", "وينبغي أن لا يدعو من يعلم أنه يشق عليه الإجابة، وإذا حضر تأذى من الحاضرين بسبب من الأسباب.", "وينبغي أن لا يدعو إلا من يحب إجابته.", "أما الإجابة فينظر في الوليمة، فإن كانت وليمة عرس فالإجابة إليها إذا كان الداعي مسلما واجبة، فإن دعاه في اليوم الثاني استحب له الإجابة، فإن دعاه في اليوم الثالث لم يستحب له الإجابة، وإن كانت وليمة لغير العرس، فهي جائزة، والإجابة إليها غير واجبة، وفي الصحيحين من حديث ابن عمر أن النبي ﷺ قال: «إذا دعي أحدكم إلى الوليمة، فليأتها». وفي أفراد البخاري من حديث أبي هريرة عن النبي ﷺ أنه قال: «لو دعيت إلى كراع(١) أو ذراع لأجبت».", "**وللإجابة خمسة آداب:**"]], "ic": "book"}, {"story": ["الباب الرابع في آداب الضيافة (٢ من ٤)، ص٣٣١", ["**الأول:** أن لا يميز الغني بالإجابة عن الفقير، فذلك هو التكبر المنهي عنه، فقد كان رسول الله ﷺ يجيب دعوة المملوك، ومر الحسن بن علي بقوم من المساكين قد نشروا كسرا على الأرض وهم يأكلون فقالوا: هلم الغداء يا ابن رسول الله. فقال: نعم، إن الله لا يحب المستكبرين. فنزل وقعد يأكل معهم، ثم سلم عليهم، وقال: قد أجبتكم فأجيبوني. فحضروا فأطعمهم وأكل معهم. فأما قول من قال: ما وضعت يدي في قصعة أحد إلا وذلت له(٢) عنقي. وقول بشر:", "حاشية: (١) الكراع من البقر والغنم هو مستدق الساق والجمع أكرع، وقيل: أكارع الدابة قوائمها.", "حاشية: (٢) تحرفت في الأصل إلى: «عنه».", "من أراد أن يعز، فلا يأكل طعام أحد. فإن ذلك يحمل على كون الداعي يمن بفعله، ويقصد المباهاة بطعامه، وقد كان معروف الكرخي يجيب كل أحد، ويقول: إنما أنا ضيف أنزل حيث ينزلني.", "**الثاني:** أن لا يمتنع عن الإجابة لبعد المسافة، كما لا يمتنع لفقر الداعي، وكان معروف يقول: إمش أحد عشر ميلا في معونة أخيك، إمش إثني عشر ميلا زر أخا في الله عز وجل.", "**الثالث:** أن لا يمتنع لكونه صائما، بل يحضر، فإن كان صومه تطوعا وعلم أن إفطاره يسر أخاه المسلم(١)، فليفطر، فإن إدخال السرور على المسلم أفضل من صوم التطوع، وفي أفراد مسلم من حديث جابر بن عبد الله عن النبي ﷺ أنه قال: «إذا دعي أحدكم إلى طعام فليجب، فإن شاء طعم، وإن شاء ترك».", "وفي أفراده من حديث أبي هريرة عن النبي ﷺ أنه قال: «إذا دعي أحدكم فليجب، فإن كان صائما فليصل، وإن كان مفطرا فليطعم».", "**الرابع:** أن يمتنع من الإجابة إن كان الطعام حراما، أو المكان، أو البساط المفروش، أو كان في المكان منكر من فرش أو إناء أو صور، أو مزمار، وكذلك إذا كان الداعي ظالما، أو فاسقا، أو مبتدعا أو مفاخرا بدعوته.", "**الخامس:** أن لا يقصد بالإجابة نفس الأكل، بل ينوي الاقتداء بالسنة وإكرام أخيه المؤمن بزيارته، وأكل طعامه، وينوي صيانة نفسه عن مسيء به الظن، فربما قيل عنه إذا امتنع: هذا متكبر والأعمال بالنيات.", "**وأما الحضور:** فينبغي أن لا يفاجئ بالحضور قبل الاستعداد، ولا يتصدر بل يتواضع في مجلسه، وإن عين له صاحب الدار مكانا لم يتعده، ولا يجلس في مكان يقابل حجرة النساء، ولا يكثر النظر إلى المكان الذي يخرج منه الطعام، فإنه دليل على الشره،", "حاشية: (١) ليست في (ظ).", "**وأما إحضار الطعام فله خمسة آداب:**", "**الأول:** تعجيله، فذلك من إكرام الضيف، ولا يؤخر عن الجماعة لانتظار شخص أو شخصين، إلا أن يكون المتأخر فقيرا، فيراعى قلبه."]], "ic": "book"}, {"story": ["الباب الرابع في آداب الضيافة (٣ من ٤)، ص٣٣٣", ["**الثاني:** ترتيب الأطعمة بتقديم الفاكهة أولا فذلك أصلح في باب الطب؛ لأنها سريعة الاستحالة، فينبغي أن تقع في أسفل المعدة، وقد قال تعالى: ﴿وَفَكِهَةٍۢ مِّمَّا يَتَخَيَّرُونَ وَلَحْمِ طَيْرٍۢ مِّمَّا يَشْتَهُونَ﴾ [الواقعة: ٢٠ ـ ٢١]، ثم أفضل ما يقدم بعد الفاكهة اللحم خصوصا المشوي، فقد قال عز وجل: ﴿جَآءَ بِعِجْلٍۢ حَنِيذٍۢ﴾ [هود: ٦٩]، وفي الصحيحين من حديث أبي هريرة أن رسول الله ﷺ كانت تعجبه الذراع، وروى أبو رافع قال: صنع لرسول الله ﷺ شاة مصلية(١) فأتي بها فقال: «يا أبا رافع ناولني الذراع» فناولته، فقال: «يا أبا رافع ناولني الذراع» فناولته، ثم قال: «يا أبا رافع ناولني الذراع» فقلت: يا رسول الله، وهل للشاة إلا ذراعين؟! قال: «لو سكت لناولتني منها ما دعوت به».", "ثم أفضل الطعام بعد اللحم الثريد، وفي الصحيحين من حديث أنس بن مالك عن النبي ﷺ أنه قال: «فضل عائشة على النساء، كفضل الثريد على سائر الطعام»، ثم الحلواء، فقد كان رسول الله ﷺ(٢-٢) تعجبه الحلواء، وفي الصحيحين من حديث عائشة قالت: كان رسول الله ﷺ(٢-٢) يعجبه العسل والحلواء.", "وتتم هذه الطيبات بشرب الماء البارد، وفي أفراد البخاري من حديث جابر أن رسول الله ﷺ أتى قوما من الأنصار، فاستسقى، وجدول قريب منه، فقال: «إن كان عندكم ماء قد بات في شن وإلا كرعنا».", "وتكملة الأمر صب الماء الفاتر على اليد عند الغسل.", "**الثالث:** تقديم جميع الألوان الحاضرة ليأكل مما يؤثر، ولا ينتظر ما يظن، فربما لم يكن، وقد حكي أن جماعة كانوا في ضيافة رجل، فقدم إليهم ألوانا من", "حاشية: (١) مصلية: أي مشوية.", "حاشية: (٢-٢) سقط من الأصل.", "الرؤوس طبيخا ومشويا، فجعلوا يقصرون وينتظرون مجيء الحملان، فجاء بالطست (١-١)فجعل بعضهم ينظر إلى بعض(١-١)، فقال بعضهم، وكان مزاحا: إن الله عز وجل يقدر أن يخلق رؤوسا بلا أبدان. وباتوا ليلتذ جياعا.", "**الرابع:** أن لا يبادر إلى رفع الألوان، بل يمكنهم من الاستيفاء حتى يرفعوا أيديهم عنها، فلعل بعضهم يؤثر من الذي يرفعه ما لا يؤثر من الذي يأتي به، ومن هذا الفن أن لا يرفع صاحب المائدة يده قبل القوم لئلا يستحيوا.", "**الخامس:** أن يقدم من الطعام قدر الكفاية فإن القليل من الكفاية نقص في المروءة، وينبغي أن يعزل لأهل البيت نصيبهم قبل تقديم الطعام، لئلا تكون أعينهم طامحة إلى رجوع شيء من ذلك، وربما لم يرجع فتضيق صدورهم، وتنطلق في الضيفان ألسنتهم، وأما ما يبقى من الطعام فليس للضيفان أخذه إلا أن يأذن فيه صاحب الطعام.", "**وأما الانصراف، فله ثلاثة آداب:**", "**الأول:** أن يخرج مع الضيف إلى باب الدار، فإنه سنة، وذلك من إكرام الضيف، ومن تمام الإكرام طلاقة الوجه، وطيب الحديث عند الدخول والخروج، وعلى المائدة."]], "ic": "book"}, {"story": ["الباب الرابع في آداب الضيافة (٤ من ٤)، ص٣٣٤", ["**الثاني:** أن ينصرف الضيف طيب النفس، وإن جرى في حقه تقصير، فذلك من حسن الخلق والتواضع، وقد قال عليه الصلاة والسلام: «إن الرجل ليدرك بحسن خلقه درجة الصائم القائم».", "**الثالث:** أن لا يخرج إلا برضى صاحب المنزل وإذنه، ويراعي قلبه في قدر الإقامة، وإذا نزل ضيفا فلا يزيد على ثلاثة أيام، لئلا يتبرم به صاحب المنزل، ويستحب أن يكون عند الإنسان فراش للضيف النازل قال ﷺ: «فراش للرجل، وفراش للمرأة، وفراش للضيف، والرابع للشيطان».", "حاشية: (١-١) سقط من الأصل.", "**فصل**", "**يجمع آدابا ومناهي شرعية وطبية(١)**", "قال أمير المؤمنين علي رضي الله عنه: من أراد البقاء ـ ولا بقاء ـ فليأكل على نقاء، وليشرب على ظمأ، وليقلل من شرب الماء، ويتمدد بعد الغداء، ويتمشى بعد العشاء، ولا يبيتن ليلة حتى يعرض نفسه على الخلاء، ودخول الحمام على البطنة من شر الداء، ودخلة الحمام في الصيف خير من عشرة في الشتاء، ومن ابتدأ غداءه بملح أذهب الله(٢) عنه سبعين نوعا من البلاء، ومن أكل كل يوم عشرين زبيبة حمراء لم ير في جسده ما يكره، واللحم ينبت اللحم، ولحم البقر داء، وألبانها شفاء، وشحمها دواء، والسمك يذيب الجسد، والسواك وقراءة القرآن يذهبان البلغم.", "وقال الحارث بن كلدة: أربعة أشياء تهدم البدن: الغشيان على البطنة، ودخول الحمام على الامتلاء، وأكل القديد، ومجامعة العجوز، ولا تزوجوا من النساء إلا شابة، ولا تأكلوا الفاكهة إلا في أوان نضجها، ولا يتعالجن أحدكم ما احتمل بدنه الداء، وإذا تغدى أحدكم فلينم على إثر غدائه ولو ساعة، وإذا تعشى فليخط أربعين خطوة.", "قال الحكماء: أربعة أشياء تمرض البدن: الأكل الكثير، والجماع الكثير، والنوم الكثير، والدم الكثير. وأربعة تقوي البدن: أكل اللحم، وشم الطيب، وكثرة الغسل من غير جماع، ولبس الكتان. وأربعة توهنه: كثرة الجماع، وكثرة الهم، وكثرة شرب الماء على الريق، وكثرة أكل الحموضة، ومن قل أكله قلت علله. وقد ذكرنا من هذا الفن وغيره الكثير في كتابنا المسمى بـ«لقط المنافع» في علم الطب، فاقتصرنا ها هنا على هذه الكلمات؛ لأنه لكل مقام مقال.", "حاشية: (١) تصحفت في الأصل إلى: «طبية».", "حاشية: (٢) ليست في الأصل."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "الثالث: أن لا يخرج إلا برضى صاحب المنزل وإذنه، ويراعي قلبه في قدر الإقامة، وإذا نزل ضيفا فلا يزيد على ثلاثة أيام، لئلا يتبرم به صاحب المنزل، ويستحب أن يكون عند الإنسان ____ للضيف النازل قال ﷺ:", "o": ["فراش", "ويكافئ", "ألنت", "وراء"], "h": "راجع: ص٣٣٤"}, {"t": "fill", "d": 2, "q": "وأما الحضور: فينبغي أن لا يفاجئ بالحضور قبل الاستعداد، ولا يتصدر بل يتواضع في مجلسه، وإن عين له ____ الدار مكانا لم يتعده، ولا يجلس في مكان يقابل حجرة النساء، ولا يكثر النظر إلى المكان الذي يخرج", "o": ["صاحب", "فطلبوه", "وانبسط", "التفت"], "h": "راجع: ص٣٣٢"}, {"t": "fill", "d": 2, "q": "قال أمير المؤمنين علي رضي الله عنه: من أراد البقاء ـ ولا بقاء ـ فليأكل على نقاء، وليشرب على ظمأ، وليقلل من شرب الماء، ويتمدد بعد الغداء، ويتمشى بعد العشاء، ولا يبيتن ____ حتى يعرض نفسه على الخلاء،", "o": ["ليلة", "ويخيل", "ويخلو", "فسمعها"], "h": "راجع: ص٣٣٥"}, {"t": "fill", "d": 2, "q": "أما الإجابة فينظر في الوليمة، فإن كانت وليمة عرس فالإجابة إليها إذا كان الداعي مسلما واجبة، فإن دعاه في اليوم الثاني استحب له الإجابة، فإن دعاه في اليوم الثالث لم يستحب له الإجابة، وإن كانت وليمة لغير العرس، فهي جائزة، ____ إليها غير واجبة، وفي الصحيحين من حديث ابن عمر أن النبي ﷺ قال", "o": ["والإجابة", "كالفضة", "القرحة", "والحشيش"], "h": "راجع: ص٣٣١"}, {"t": "fill", "d": 2, "q": "الأول: تعجيله، فذلك من إكرام الضيف، ولا يؤخر عن الجماعة ____ شخص أو شخصين، إلا أن يكون المتأخر فقيرا، فيراعى", "o": ["لانتظار", "كالميراث", "بمقتضى", "يصادفها"], "h": "راجع: ص٣٣٣"}, {"t": "fill", "d": 2, "q": "الثالث: أن لا يمتنع لكونه صائما، بل يحضر، فإن كان صومه تطوعا وعلم أن إفطاره يسر أخاه المسلم، فليفطر، فإن ____ السرور على المسلم أفضل من صوم التطوع، وفي أفراد مسلم من حديث جابر بن عبد الله عن", "o": ["إدخال", "اعلفه", "الجناية", "القائل"], "h": "راجع: ص٣٣٢"}]}], "sum": [["الصفحات", "ص٣٣٠ - ص٣٣٦"]], "_nq": 6}, {"id": "l8", "title": "كتاب آداب النكاح", "group": "كتاب آداب النكاح", "map": {"center": "كتاب\nآداب النكاح", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "كتاب آداب النكاح", "b": [{"pic": ["books", "book"], "cap": "ص٣٣٧ - ص٣٣٧"}, {"story": ["كتاب آداب النكاح، ص٣٣٧", ["الحمد لله الذي بنى الأجسام بالحكم الجسام، فأقامت دهرا، وجمع فيها بين الطبائع المختلفة قهرا، فلما قضى بنقضها سلط الشهوة عليها قسرا، ليخرج منها عوضا(١) فيكون لكسرها جبرا، فسبحانه من قادر على ما يشاء طيا ونشرا، وهو الذي خلق من الماء بشرا فجعله نسبا وصهرا.", "أحمده وللمحامد البشرى، وأصلي على رسوله محمد سيد الدنيا والأخرى، وعلى جميع أصحابه وأتباعه ما نسخ يسر عسرا، وأسلم تسليما كثيرا.", "أما بعد؛ فإن النكاح محصن الدين، وموهن كيد الشياطين، وسبب لتكثير النسل الذي يباهي به سيد المرسلين سائر النبيين، ونحن نشرح المهم من أحكامه وآدابه في ثلاثة أبواب.", "الباب الأول: في الترغيب فيه.", "الباب الثاني: في الآداب المرعية في العقد والعاقدين.", "الباب الثالث: في آداب العيش بعد العقد إلى الفراق.", "حاشية: (١) في (ظ): «عوضها»."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "أما بعد؛ فإن النكاح محصن الدين، وموهن كيد الشياطين، وسبب لتكثير النسل الذي يباهي به سيد ____ سائر النبيين، ونحن نشرح المهم من أحكامه وآدابه في ثلاثة أبواب", "o": ["المرسلين", "باستئناف", "الساكن", "الاختصاص"], "h": "راجع: ص٣٣٧"}, {"t": "fill", "d": 2, "q": "الحمد لله الذي بنى الأجسام بالحكم الجسام، فأقامت دهرا، وجمع فيها بين الطبائع المختلفة قهرا، فلما قضى بنقضها سلط الشهوة عليها قسرا، ليخرج منها عوضا فيكون لكسرها ____، فسبحانه من قادر على ما يشاء طيا ونشرا، وهو الذي خلق من الماء بشرا فجعله نسبا وصهرا", "o": ["جبرا", "فقوله", "المصرف", "سيفه"], "h": "راجع: ص٣٣٧"}, {"t": "fill", "d": 2, "q": "أحمده وللمحامد البشرى، وأصلي على رسوله محمد سيد الدنيا والأخرى، وعلى جميع أصحابه وأتباعه ما نسخ يسر ____، وأسلم تسليما كثيرا", "o": ["عسرا", "ووفيا", "كثيروا", "إلهي"], "h": "راجع: ص٣٣٧"}]}], "sum": [["الصفحات", "ص٣٣٧ - ص٣٣٧"]], "_nq": 3}, {"id": "l9", "title": "الباب الأول في الترغيب في النكاح", "group": "كتاب آداب النكاح", "map": {"center": "الباب\nالأول في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الأول في الترغيب في النكاح - القسم ١ من ٢", "b": [{"pic": ["books", "book"], "cap": "ص٣٣٨ - ص٣٤٦"}, {"story": ["الباب الأول في الترغيب في النكاح (١ من ٧)، ص٣٣٨", ["**في الترغيب في النكاح**", "لا يختلف العلماء في أن النكاح مستحب ومندوب إليه كثير الفضائل، وقد ذهب قوم إلى إيجابه، واختلف من رآه سنة هل هو أفضل من نوافل العبادات أم لا؟ فقدمه أكثرهم على نوافل العبادات، لما يتضمن من مصالح الدين والدنيا، وقد ورد في فضله آيات وأخبار؛ أما الآيات، فإن الله تعالى أمر به، فقال: ﴿وَأَنكِحُوا۟ ٱلْأَيَٰمَىٰ مِنكُمْ﴾ [النور: ٣٢]، ومن به فقال: ﴿وَلَقَدْ أَرْسَلْنَا رُسُلًا مِّن قَبْلِكَ وَجَعَلْنَا لَهُمْ أَزْوَٰجًا وَذُرِّيَّةًۭ﴾ [الرعد: ٣٨]، فذكر ذلك في معرض الامتنان.", "وأما الأخبار؛ فأخبرنا هبة الله بن محمد قال: أخبرنا الحسن بن علي قال: أخبرنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا يعلى بن عبيد قال: حدثنا الأعمش بن عمارة عن عبد الرحمن بن يزيد قال: قال عبد الله: كنا مع النبي ﷺ شبابا ليس لنا شيء فقال: «يا معشر الشباب، من استطاع منكم الباءة فليتزوج، فإنه أغض للبصر، وأحصن للفرج، ومن لم يستطع فعليه بالصوم فإن الصوم له وجاء». أخرجاه في الصحيحين، وأصل الباءة: الموضع الذي يأوي إليه الإنسان، ومنه اشتق: مباءة الغنم، وهو المراح الذي تأوي إليه، والباءة هاهنا كناية عن النكاح، والوجاء: رض الأنثيين، والخصاء: نزعهما. أخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أبو بكر بن مالك قال: حدثنا عبد الله بن أحمد قال: حدثني (١-١)أبي قال: حدثنا حسين وعفان قالا: حدثنا خلف بن خليفة قال: حدثني(١-١) حفص بن عمر عن أنس قال: كان رسول الله ﷺ يأمر بالباءة، وينهى عن التبتل نهيا شديدا، ويقول: «تزوجوا الودود الولود، فإني مكاثر بكم(٢) الأنبياء يوم القيامة».", "حاشية: (١-١) سقط من (ظ).", "حاشية: (٢) سقطت من الأصل.", "وفي أفراد البخاري من حديث سعيد بن جبير قال: قال لي ابن عباس: هل تزوجت؟ قلت: لا. قال: تزوج، فإن خير هذه الأمة أكثرها نساء. وفي حديث جابر عن النبي ﷺ أنه قال: «أيما شاب تزوج في حداثة سنه عج شيطانه: يا ويله، عصم مني دينه». وقال طاووس: المرأة شطر دين الرجل، ولا يتم نسك الشاب حتى يتزوج.", "وقال الإمام أحمد رحمه الله: ليس العزوبة من أمر الإسلام في شيء، ولو كان بشر بن الحارث تزوج كان قد تم أمره كله(١)، لو ترك الناس النكاح لم يغز ولم يحج، وقد تزوج النبي ﷺ أربع عشرة، وكان يصبح وما عندهم شيء ويمسي وما عندهم شيء، ومات عن تسع، وكان يختار النكاح ويحث عليه، فمن رغب عن فعل النبي ﷺ فهو على غير الحق، لبكاء الصبي بين يدي أبيه متسخطا يطلب منه خبزا أفضل من كذا وكذا، أين يلحق التعبد العزب."]], "ic": "book"}, {"story": ["الباب الأول في الترغيب في النكاح (٢ من ٧)، ص٣٣٩", ["فأما ما يروى: خيركم بعد المئتين الخفيف الحاذ، الذي لا أهل له ولا ولد، فشيء لا يثبت ولا يصح، ولا يلتفت إلى قول جماعة من المتزهدين قل علمهم فذموا النكاح، وقالوا: من تزوج فقد مال إلى الدنيا. فإن المروذي قال: لما مدح الإمام أحمد النكاح وأثنى عليه قلت له: فإن إبراهيم بن أدهم قال. . . فما قدرت أن أتم الحديث حتى صاح بي وقال ـ ونحن في بنيات الطريق(٢) ـ: انظر عافاك الله ما كان عليه محمد ﷺ وأصحابه.", "**ذكر فوائد النكاح**", "وهي خمس:", "**الفائدة الأولى:** الولد، وهذه الفائدة هي(٣) الأصل فيما وضع له النكاح؛ لأن المقصود بقاء النسل، وخلقت الشهوة باعثة مستحثة كالتلطف بالطير في بث الحب،", "حاشية: (١) تاريخ بغداد ٧/ ٧٣.", "حاشية: (٢) بنيات الطريق: الطرق الصغار التي تتشعب من الجادة.", "حاشية: (٣) في الأصل: «التي هي».", "ولم تكن القدرة قاصرة عن اختراع الأشخاص ابتداء، لكن الحكمة اقتضت ترتيب المسببات على الأسباب مع الغناء عنها إتماما لعجائب الصنعة، وفي التوصل إلى الولد قربة من أربعة أوجه:", "الأول: موافقة محبة الله تعالى بالسعي في ذلك ليبقى جنس الإنسان.", "الثاني: طلب محبة رسول الله ﷺ في تكثير من به مباهاته.", "والثالث: طلب التبرك بدعاء الولد الصالح بعد موت الوالد.", "والرابع: طلب الشفاعة بموت الولد الصغير إذا مات قبله.", "والوجه الأول أقواها عند ذوي البصائر النافذة في عجائب صنع الله تعالى ومجاري حكمته، وبيان ذلك؛ أن السيد إذا سلم إلى عبده البذر وآلات الحرث وهيأ له أرضا مهيأة للحراثة، وكان العبد قادرا على الحراثة، وكل به من يتقاضاه ويحثه، فتكاسل وعطل آلة الحرث، وترك البذر ضائعا حتى فسد، ودفع الموكل به بنوع من الحيل كان مستحقا للمقت والعقاب من سيده، فالله عز وجل خلق الزوجين الذكر والأنثى، وأنشأ النطفة والرحم، وسلط متقاضي الشهوة عليهما، فهذه الأفعال والآلات تنطق بلسان فصيح عن مراد خالقها، وتنادي أرباب الألباب بتعريف ما أعدت له، هذا لو لم يصرح الخالق على لسان رسوله حين قال: «تناكحوا تناسلوا» فكل ممتنع عن النكاح معرض عن الحراثة، مضيع للبذر، معطل ما خلق من الآلة المعدة وجان على مقصود الفطرة والحكمة المفهومة من شواهد الخلقة المكتوبة على هذه الأعضاء بخط إلهي ليس برقم حروف وأصوات(١) يقرؤه كل من له بصيرة ربانية نافذة في إدراك دقائق الحكمة الأزلية، ولذلك عظم الشرع الأمر في قتل الأولاد وفي الوأد؛ لأنه منع لتمام الوجود، فالناكح ساع في إتمام ما أحب الله تمامه، والمعرض معطل ومضيع لما كره الله ضياعه، كيف وقد قطع النسل المتصل من آدم إليه؟! ولأجل محبة الله سبحانه لبقاء النفوس أمر بالإطعام وحث عليه، وعبر عنه بعبارة القرض، فقال: ﴿مَّن ذَا ٱلَّذِى يُقْرِضُ ٱللَّهَ قَرْضًا حَسَنًا﴾ [البقرة: ٢٤٥].", "حاشية: (١) في الأصل: «ولا أصوات»."]], "ic": "book"}, {"story": ["الباب الأول في الترغيب في النكاح (٣ من ٧)، ص٣٤١", ["وأما الوجه الثاني، وهو السعي فيما يحبه رسول الله ﷺ من تكثير النسل، فقد صرح به: «تزوجوا الودود الولود، فإني مكاثر بكم».", "وأما الوجه الثالث: وهو أن يبقى له ولد صالح يدعو له، فقد أخبرنا هبة الله بن محمد قال: أخبرنا الحسن بن علي قال: أخبرنا أحمد بن جعفر قال: أخبرنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا سليمان بن داوود قال: حدثنا إسماعيل قال: أخبرني العلاء عن أبيه عن أبي هريرة أن النبي ﷺ قال: «إذا مات الإنسان انقطع عمله(١) إلا من ثلاث: إلا من صدقة جارية، أو علم ينتفع به، أو ولد صالح يدعو له». انفرد بإخراجه مسلم. ولا التفات إلى قول من يقول: فربما لم يكن الولد صالحا. لأن الغالب صلاح ولد المؤمن، ثم دعاؤه يفيد وإن كان فاسقا، ثم للوالد نيته في أنه قصد إيجاد الصالح.", "الوجه الرابع: أن يموت الولد قبله، فيكون شفيعا له؛ أخبرنا أبو القاسم الكاتب قال: أخبرنا أبو علي التميمي قال: أخبرنا أبو بكر بن مالك قال: أخبرنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا يحيى عن مالك قال: حدثني الزهري عن سعيد بن المسيب عن أبي هريرة عن النبي ﷺ أنه قال: «ما من مسلم يموت له ثلاثة من الولد لم يبلغوا الحنث فتمسه النار إلا تحلة القسم». أخرجاه في الصحيحين، وأخرجا من حديث أبي سعيد الخدري عن النبي ﷺ أنه قال للنساء: «ما منكن امرأة يموت لها ثلاثة من الولد إلا كانوا لها حجابا من النار» فقالت امرأة: أو اثنين، فإنه مات لي اثنان؟ فقال رسول الله ﷺ: «واثنين». وفي أفراد مسلم من حديث أبي حسان قال: توفي ابنان لي، فقلت لأبي هريرة: سمعت من رسول الله ﷺ ومسلم حديثا تحدثناه تطيب أنفسنا عن موتانا؟ قال: «صغارهم دعاميص الجنة، يلقى أحدهم أباه ـ أو قال: أبويه ـ فيأخذ بناحية ثوبه ـ أو قال: يده ـ كما آخذ بصنفة(٢) ثوبك هذا،", "حاشية: (١) في الأصل: «عنه عمله».", "حاشية: (٢) صنفة الثوب: طرفه.", "فلا يفارقه حتى يدخله الله وأباه الجنة». الدعموص: دويبة صغيرة تكون في الماء إذا طال مكثه(١).", "وروى معاوية بن قرة عن أبيه: أن رجلا كان يأتي النبي ﷺ ومعه ابن له فقال له النبي ﷺ: «أتحبه؟» فقال: يا رسول الله، أحبك الله كما أحبه ففقده النبي ﷺ فقال: «ما فعل ابن فلان؟» قالوا: يا رسول الله مات، فقال النبي ﷺ لأبيه: «أما تحب أن لا تأتي بابا من أبواب الجنة إلا وجدته ينتظرك؟» فقال له رجل: يا رسول الله، له خاصة أو لكلنا؟ قال: «بل لكلكم»."]], "ic": "book"}, {"story": ["الباب الأول في الترغيب في النكاح (٤ من ٧)، ص٣٤٢", ["أخبرنا المحمدان؛ ابن عبد الملك وابن ناصر قالا: أخبرنا أحمد بن الحسن بن خيرون قال: أخبرنا أبو علي بن شاذان، قال: أخبرنا عيسى بن محمد الطوماري قال: أخبرنا محمد بن خلف، حدثنا وكيع قال: كان لإبراهيم الحربي ابن له إحدى عشر سنة قد حفظ القرآن، ولقنه من الفقه شيئا كثيرا فمات، فجئت أعزيه، فقال لي: كنت أشتهي موت ابني هذا. فقلت: يا أبا إسحاق، أنت عالم الدنيا تقول مثل هذا في صبي قد أنجب(٢) وحفظ القرآن ولقنته الحديث والفقه؟! فقال: نعم، رأيت في النوم كأن القيامة قد قامت، وكأن صبيانا بأيديهم قلال فيها ماء يستقبلون الناس يسقونهم، وكان يوما حارا شديدا حره؛ فقلت لأحدهم: اسقني من هذا الماء. فنظر إلي وقال لي: لست(٣) أبي. قلت: فأي شيء أنتم؟ فقال: نحن الصبيان الذين متنا في دار الدنيا وخلفنا آباءنا نستقبلهم ونسقيهم الماء. فلهذا تمنيت موته. فقد ظهر بهذه الأوجه الأربعة أن فضل النكاح لأجل كونه سببا للولد.", "**الفائدة الثانية:** التحصن من الشيطان بدفع غوائل الشهوة، فإنها إذا اندفعت غض البصر وحفظ الفرج، وهذا المعنى دون الأول؛ لأن الشهوة موكل متقاض، وليس من يجيب(٤) مولاه رغبة في تحصيل رضاه كمن يجيبه(٥) لطلب الخلاص من", "حاشية: (١) هكذا شرحه المصنف هنا، ودعاميص الجنة: صغارها.", "حاشية: (٢) أنجب: نبه وبان فضله على من كان مثله.", "حاشية: (٣) في (ظ): «أنت».", "حاشية: (٤) في الأصل: «يحب».", "حاشية: (٥) في الأصل: «يحبه».", "الموكل به، إلا أن في وجود هذه الشهوة فائدتين: إحداهما: التنبيه على لذات الجنة؛ لأن التنبيه على الشيء بجنسه، فقد نبهت هذه اللذة المنقطعة على اللذات الباقية، فحركت على(١) العمل بما يوجب الوصول إلى تلك.", "**والثانية:** دفع الماء المحتقن، فإنه إذا اجتمع آذى، وشغل القلب بحركته عن الاهتمام بالمصالح، وغاية ما يجتهد المتقي إذا ترك النكاح أن يغض بصره ويحفظ فرجه، فأما أن يحرس قلبه من الفكر والوساوس في ذلك، فإنه لا يمكنه، وربما عارضه من تصوير الوقاع في أثناء الصلاة ما لو صرح به بين يدي مخلوق لاستحيا، والقلب في حق الخالق كاللسان في حق الخلق، ورأس مال المريد في سلوك طريق الآخرة قلبه، ودوام الصوم لا يقطع مادة الوسوسة في الأغلب، قال مجاهد في قوله تعالى: ﴿وَخُلِقَ ٱلْإِنسَٰنُ ضَعِيفًا﴾ [النساء: ٢٨]: لا يصبر عن النساء، وقال قتادة: ﴿وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِۦ﴾ [البقرة: ٢٨٦] قال: الغلمة(٢). وهذه الشهوة هي أقوى آلة الشيطان على الآدمي، وإلى نحو هذا أشار عليه الصلاة والسلام بما روى البخاري ومسلم في الصحيحين من حديث أبي سعيد عن النبي ﷺ أنه قال للنساء: «ما رأيت من ناقصات عقل ودين أذهب للب الرجل الحازم من إحداكن» وإنما ذلك كان لهيجان الشهوة."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "الآفة الثالثة: أن يكون الأهل والولد شاغلا له عن الله سبحانه، فيقضي ليله ونهاره في التمتع بهن، فلا يتفرغ القلب ____ في الآخرة، والعمل", "o": ["للفكر", "بقولك", "فيصادفه", "وترد"], "h": "راجع: ص٣٤٦"}, {"t": "fill", "d": 2, "q": "الأولى: وهي أقواها: العجز عن طلب الحلال، فإن ذلك يصعب، فربما مد المتزوج يده إلى ما ليس له، وفي الحديث: «ينادى يوم القيامة: أين الذي أكلت عيالاتهم أماناتهم». وقل أن ____ من هذه الآفة إلا من", "o": ["يتخلص", "رفقك", "نادم", "ثوبه"], "h": "راجع: ص٣٤٦"}, {"t": "fill", "d": 2, "q": "وكان الجنيد يقول: أحتاج إلى الجماع كما أحتاج إلى القوت. فالنكاح سبب لدفع الوساوس عن النفس، ولهذا قال عليه الصلاة والسلام فيما ____ بإخراجه مسلم من حديث جابر: «إن المرأة تقبل في صورة شيطان، وتدبر في", "o": ["انفرد", "جليسا", "التصدق", "أزواجكن"], "h": "راجع: ص٣٤٣"}, {"t": "fill", "d": 2, "q": "فهذه مجامع الآفات والفوائد، فالحكم على شخص واحد بأن الأفضل له النكاح أو العزوبة مطلقا قصور عن الإحاطة بمجامع هذه الأمور، بل ينبغي للمريد أن يعرض نفسه على هذه الأحوال، فإن انتفت عنه الآفات واجتمعت له الفوائد بأن كان له مال حلال، وحسن خلق، وجد في الدين لا يشغله النكاح عنه، وهو مع ذلك شاب يحتاج إلى تسكين الشهوة، ومتفرد يحتاج إلى تدبير المنزل، فلا شك أن النكاح له أفضل مع ما فيه من السعي في تحصيل الولد، وإن انتفت الفوائد واجتمعت الآفات، وكان ممن لا يحتاج إلى النكاح، فتركه له أصلح، وإن تقابل الأمران فينبغي أن يغلب ما يزيد به دينه على ما ينقصه، وهذا كله ____ هو في حق من لم يحتج إلى النكاح، وأما إذا احتاج، فإنه يلزمه", "o": ["إنما", "قشور", "وغوائل", "يتطرق"], "h": "راجع: ص٣٤٦"}, {"t": "fill", "d": 2, "q": "وفي أفراد البخاري من ____ سعيد بن جبير قال", "o": ["حديث", "أنشدوا", "بكفرهن", "وصلني"], "h": "راجع: ص٣٣٩"}, {"t": "fill", "d": 2, "q": "الفائدة الأولى: الولد، وهذه الفائدة هي الأصل فيما وضع له النكاح؛ لأن المقصود بقاء النسل، وخلقت الشهوة ____ مستحثة كالتلطف بالطير في بث", "o": ["باعثة", "الوضوء", "الأطعمة", "فلان"], "h": "راجع: ص٣٣٩"}]}, {"t": "الباب الأول في الترغيب في النكاح - القسم ٢ من ٢", "b": [{"story": ["الباب الأول في الترغيب في النكاح (٥ من ٧)، ص٣٤٣", ["وكان الجنيد يقول: أحتاج إلى الجماع كما أحتاج إلى القوت. فالنكاح سبب لدفع الوساوس عن النفس، ولهذا قال عليه الصلاة والسلام فيما انفرد بإخراجه مسلم من حديث جابر: «إن المرأة تقبل في صورة شيطان، وتدبر في صورة شيطان، فإذا رأى أحدكم امرأة فأعجبته، فليأت أهله، فإن ذلك يرد مما في نفسه». ووجه ذلك أن الوساوس إنما تقع في أمور النساء لإخراج الفضلة المحتقنة، ووطء الزوجة يزيل ذلك أو يخففه، وقد كان الصحابة يستكثرون من النكاح لما بينا من طلب الأولاد تارة، وتحصين النفس ودفع الوساوس عن القلب أخرى.", "وينبغي للمريد أن يكون همه حراسة قلبه، فكيف وقعت فهو المقصود.", "حاشية: (١) في (ظ): «إلى».", "حاشية: (٢) الغلمة: الشبق وشدة الشهوة.", "**الفائدة الثالثة:** ترويح النفس وإيناسها بمخالطة الزوجة والنظر إليها، والملاعبة لها، وفي إراحة القلب تقوية له على العبادة، فإن النفس تمل من التعبد وتنفر من الحق؛ لأنه على خلاف طبعها، فإذا روحت بما يلائمها في وقت قويت ونشطت، وفي حديث أنس عن النبي ﷺ أنه قال: «حبب إلي من الدنيا النساء والطيب، وجعلت قرة عيني في الصلاة». وهذه الفائدة لا ينكرها من جرب إتعاب نفسه في الأذكار والأفكار وصنوف الأعمال، وإذا حصلت فيها هذه النية ـ أعني ترويح النفس لتقوى على التعبد ـ صار النكاح فضيلة بها.", "**الفائدة الرابعة:** تفريغ القلب عن تدبير المنزل والتكفل بشغل الطبخ والكنس والفرش، وتنظيف الأواني، وتهيئة أسباب العيش، فإن الإنسان يتعذر عليه أكثر ذلك مع الوحدة، ولو كفل به لضاع أكثر أوقاته، ولم يتفرغ للعلم والعمل، فالمرأة الصالحة عون على الدين بهذه الطريق، إذ اختلال هذه الأسباب شواغل للقلب، وفي الصحيحين من حديث أبي هريرة عن النبي ﷺ أنه قال: «تنكح المرأة لأربع؛ لمالها، ولحسبها، ولجمالها، ولدينها، فاظفر بذات الدين تربت يداك». وفي أفراد مسلم من حديث عبد الله بن عمرو بن العاصي عن النبي ﷺ أنه قال: «إن الدنيا كلها متاع، وخير متاع الدنيا المرأة الصالحة». وفي حديث سعد بن أبي وقاص عن النبي ﷺ أنه قال: «من سعادة ابن آدم ثلاثة، ومن شقوة ابن آدم ثلاثة: من سعادة ابن آدم المرأة الصالحة، والمسكن الصالح، والمركب الصالح، ومن شقوة ابن آدم: المرأة السوء، والمسكن السوء، والمركب السوء». وقال ﷺ: «ليتخذ أحدكم لسانا ذاكرا، وقلبا شاكرا، وزوجة مؤمنة تعينه على آخرته».", "وقال عمر بن الخطاب: ما أعطي عبد بعد الإيمان بالله خيرا من امرأة صالحة.", "وقال محمد بن كعب القرظي في قوله ﴿رَبَّنَآ ءَاتِنَا فِى ٱلدُّنْيَا حَسَنَةًۭ﴾ [البقرة: ٢٠١]: المرأة الصالحة. وقال أبو سليمان الداراني: الزوجة الصالحة ليست من الدنيا، فإنها تفرغك للآخرة. وإنما يكون تفريغها بتدبير المنزل وبقضاء الشهوة جميعا."]], "ic": "book"}, {"story": ["الباب الأول في الترغيب في النكاح (٦ من ٧)، ص٣٤٥", ["**الفائدة الخامسة:** مجاهدة النفس ورياضتها بالرعاية والولاية، والقيام بحقوق الأهل، والصبر على أخلاقهن، واحتمال الأذى منهن، والسعي في إصلاحهن، وإرشادهن إلى طريق الدين، والاجتهاد في كسب الحلال لأجلهن، والقيام بتربية الأولاد، وكل هذه أعمال عظيمة الفضل، فإنها رعاية وولاية، والأهل والأولاد رعية، وفضل الرعاية عظيم، وإنما يحترز منها من يحترز خيفة من القصور عن القيام بحقها، وليس من اشتغل بإصلاح نفسه وغيره كمن اشتغل بإصلاح نفسه فقط، ولا من صبر على الأذى كمن رفه نفسه وأراحها، فمقاساة الأهل والولد بمنزلة الجهاد في سبيل الله عز وجل، وفي الصحيحين من حديث ابن مسعود عن النبي ﷺ أنه قال: «نفقة الرجل على أهله يحتسبها صدقة». وفي أفراد مسلم من حديث أبي هريرة عن النبي ﷺ أنه قال: «دينار أنفقته في سبيل الله عز وجل، ودينار أنفقته في رقبة، ودينار تصدقت به، ودينار أنفقته على أهلك أفضلها الدينار الذي أنفقته على أهلك». وفي أفراده من حديث ثوبان عن النبي ﷺ أنه قال: «أفضل الدنانير دينار ينفقه الرجل على عياله». وفي أفراده من حديث سعد بن أبي وقاص أن النبي ﷺ قال له حين عاده: «إن نفقتك على عيالك صدقة، وإن ما تأكل امرأتك من مالك صدقة». وقال ابن المبارك يوما لإخوانه في الغزو: تعلمون عملا أفضل مما نحن فيه؟ قالوا: ما نعلم ذلك. قال: أنا أعلم رجل متعفف ذو عيال قام من الليل فنظر إلى صبيانه نياما متكشفين فسترهم وغطاهم بثوبه فعمله أفضل مما نحن فيه.", "ثم في الصبر على أخلاق الزوجة والعيال رياضة للنفس، وكسر للغضب، ولا ينتفع بهذه الفائدة إلا أحد رجلين؛ إما رجل قصد المجاهدة والرياضة وتهذيب الأخلاق لكونه في بداية الطريق، فلا يبعد أن يرى هذا طريقا في المجاهدة فيرتاض به، وإما رجل عابد عمله بالجوارح فحسب ليس له سير بالباطن، ولا حركة بالفكر والقلب، فعمله لأهله وأولاده والقيام بتدبيرهم أفضل له من عبادات البدن التي لا يتعدى خيرها، فأما الرجل المهذب الأخلاق الذي له سير بالباطن، فلا ينبغي أن يتزوج لهذا الغرض.", "**ذكر آفات النكاح**", "**الأولى:** وهي أقواها: العجز عن طلب الحلال، فإن ذلك يصعب، فربما مد المتزوج يده إلى ما ليس له، وفي الحديث: «ينادى يوم القيامة: أين الذي أكلت عيالاتهم أماناتهم». وقل أن يتخلص من هذه الآفة(١) إلا من له مال من وجه حلال يفي به وبعياله أو قناعة منه ومنهم."]], "ic": "book"}, {"story": ["الباب الأول في الترغيب في النكاح (٧ من ٧)، ص٣٤٦", ["**الآفة الثانية:** القصور عن القيام بحقوق النساء، والصبر على أخلاقهن وأذاهن، وفي هذا خطر؛ لأن الرجل راع، وهو مسؤول عن رعيته، ولهذا اعتذر بشر وقال: يمنعني من النكاح قوله تعالى: ﴿وَلَهُنَّ مِثْلُ ٱلَّذِى عَلَيْهِنَّ بِٱلْمَعْرُوفِ﴾ [البقرة: ٢٢٨]، فلا يسلم من هذه الآفة إلا حكيم عاقل حسن الأخلاق بصير بعادات النساء، صبور عليهن، حريص على الوفاء بحقوقهن، متغافل عن زللهن.", "**الآفة الثالثة:** أن يكون الأهل والولد شاغلا له عن الله سبحانه، فيقضي ليله ونهاره في التمتع بهن، فلا يتفرغ القلب للفكر في الآخرة، والعمل لها.", "فهذه مجامع الآفات والفوائد، فالحكم على شخص واحد بأن الأفضل له النكاح أو العزوبة مطلقا قصور عن الإحاطة بمجامع هذه الأمور، بل ينبغي للمريد أن يعرض (٢-٢)نفسه على(٢-٢) هذه الأحوال، فإن انتفت عنه الآفات واجتمعت له الفوائد بأن كان له مال(٣) حلال، وحسن خلق، وجد في الدين لا يشغله النكاح عنه، وهو مع ذلك شاب يحتاج إلى تسكين الشهوة، ومتفرد يحتاج إلى تدبير المنزل، فلا شك أن النكاح له أفضل مع ما فيه من السعي في تحصيل الولد، وإن انتفت الفوائد واجتمعت الآفات، وكان ممن لا يحتاج إلى النكاح، فتركه له أصلح، وإن تقابل الأمران فينبغي أن يغلب ما يزيد به دينه على ما ينقصه، وهذا كله إنما هو(٤) في حق من لم يحتج إلى النكاح، وأما إذا احتاج، فإنه يلزمه.", "حاشية: (١) تحرفت في الأصل إلى: «الأمة».", "حاشية: (٢-٢) سقط من الأصل.", "حاشية: (٣) في الأصل: «وجه».", "حاشية: (٤) ليست في الأصل."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "الفائدة الثالثة: ترويح النفس وإيناسها بمخالطة الزوجة والنظر إليها، والملاعبة لها، وفي إراحة القلب تقوية له على العبادة، فإن النفس تمل من التعبد وتنفر من الحق؛ لأنه على خلاف طبعها، ____ روحت بما", "o": ["فإذا", "فحبسها", "أحمق", "خرقوا"], "h": "راجع: ص٣٤٤"}, {"t": "fill", "d": 2, "q": "ولم تكن القدرة قاصرة عن اختراع الأشخاص ابتداء، لكن الحكمة اقتضت ترتيب المسببات على الأسباب مع الغناء عنها إتماما لعجائب ____، وفي التوصل إلى الولد قربة من أربعة أوجه", "o": ["الصنعة", "المنديل", "وفهمت", "القديم"], "h": "راجع: ص٣٤٠"}, {"t": "fill", "d": 2, "q": "الموكل به، إلا أن في وجود هذه الشهوة ____", "o": ["فائدتين", "وأدخل", "والتقتير", "وإدريس"], "h": "راجع: ص٣٤٣"}, {"t": "fill", "d": 2, "q": "فأما ما يروى: خيركم بعد المئتين الخفيف الحاذ، الذي لا أهل له ولا ولد، فشيء لا يثبت ولا يصح، ولا ____ إلى قول جماعة من المتزهدين قل علمهم فذموا النكاح، وقالوا: من تزوج فقد مال إلى الدنيا. فإن المروذي", "o": ["يلتفت", "الخل", "فوارق", "الجانب"], "h": "راجع: ص٣٣٩"}, {"t": "fill", "d": 2, "q": "أخبرنا المحمدان؛ ابن عبد الملك وابن ____ قالا", "o": ["ناصر", "النخعي", "بليلته", "الحبيب"], "h": "راجع: ص٣٤٢"}, {"t": "fill", "d": 2, "q": "الفائدة الخامسة: مجاهدة النفس ورياضتها بالرعاية والولاية، والقيام بحقوق الأهل، والصبر على أخلاقهن، واحتمال الأذى منهن، والسعي في ____، وإرشادهن إلى طريق الدين، والاجتهاد في كسب الحلال لأجلهن،", "o": ["إصلاحهن", "وعفان", "وخصال", "حوائج"], "h": "راجع: ص٣٤٥"}]}], "sum": [["الصفحات", "ص٣٣٨ - ص٣٤٦"]], "_nq": 12}, {"id": "l10", "title": "الباب الثاني فيما يراعى حالة العقد من أحوال المرأة وشروط العقد", "group": "كتاب آداب النكاح", "map": {"center": "الباب\nالثاني فيما", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الثاني فيما يراعى حالة العقد من أحوال المرأة وشروط العقد", "b": [{"pic": ["books", "book"], "cap": "ص٣٤٧ - ص٣٤٩"}, {"story": ["الباب الثاني فيما يراعى حالة العقد من أحوال المرأة وشروط الع (١ من ٢)، ص٣٤٧", ["**فيما يراعى حالة العقد من أحوال المرأة وشروط العقد**", "أما العقد فشروط صحته خمسة: الولي، وإذن المولى عليها، إلا أن الأب يزوج أولاده الصغار وبناته الأبكار البلغ بغير إذنهم، والشهود، والإيجاب والقبول.", "وآدابه: تقديم الخطبة إلى الولي، لا في حال عدة المرأة إن كانت معتدة، ولا في حال سبق(١) من قد سكنوا إلى خطبته، والنظر إلى المرأة قبل النكاح، وإخبار الولي إياها بأمر الزوج، فإن كانت بكرا فسكوتها إذنها، ثم الخطبة قبل النكاح، وأن يكون الصداق معلوما وخفيفا، وإحضار جماعة من أهل الصلاح مع الشاهدين.", "ومن آدابه أن ينوي بالنكاح إقامة السنة، وغض البصر، وطلب الولد إلى غير ذلك من الفوائد التي ذكرناها، ولا يكون قصده مجرد التمتع، وأن يعقد في يوم جمعة بعد العصر، ويستحب أن يقال إذا وقع العقد: بارك الله لك، وبارك عليك، وجمع بينكما في خير وعافية.", "وأما المنكوحة فيعتبر فيها نوعان: أحدهما: الحل، وهو أن تكون خلية من موانع النكاح، مثل أن تكون في نكاح الغير، أو في عدته، أو مرتدة أو محرمة بالرضاع إلى غير ذلك.", "**والثاني:** لطيب المعشر وحصول المقاصد، وهي ثمانية: الدين، والخلق، والحسن، وخفة المهر، والبكارة، والولادة، والنسب، وأن لا تكون قرابة قريبة.", "حاشية: (١) في الأصل: «سبق واحد».", "فأما ＊＊الأول:＊＊ وهو الدين، فهو الأصل، فإنها إذا كانت ضعيفة الدين في صيانة نفسها أزرت بزوجها، وكدرت عيشه، فإن سلك سبيل الغيرة لم يزل في بلاء، وإن سكت كان متهاونا بعرضه ومنسوبا إلى قلة الحمية، وإن كانت فاسدة الدين من وجه آخر مثل استهلاك ماله كان سببا لفقره، وتشتيت همه، وإنما قال النبي ﷺ: «عليك بذات الدين» لأنها تعين على الدين، فإذا لم يكن لها دين أفسدت دين الرجل أو كدرت عليه العيش.", "**الثاني:** حسن الخلق، هو أصل مهم، فإنها إذا كانت بذية اللسان سيئة الخلق كافرة للنعم كان ضررها أكثر من نفعها، ولا سبيل إلى تعرف(١) أخلاقها إلا من خبير بها غير حاسد لها فيقصر، ولا شديد المحبة فيميل.", "**الثالث:** الحسن، وذلك مطلوب، إذ به يحصل التحصن، والدميمة لا تكفي غالبا، ولهذا أمرنا بالنظر إلى المنكوحة، وقد كان أقوام لا ينظرون في الحسن ولا يقصدون التمتع، كما اختار الإمام أحمد رحمه الله امرأة عوراء على أختها، إلا أن هذا ينذر، والطباع على ضده.", "**الرابع:** خفة المهر، قال عمر بن الخطاب: لا تغالوا في مهور النساء. وقد زوج سعيد بن المسيب ابنته على درهمين، وكما تكره المغالاة في المهر من جهة المرأة يكره السؤال عن ما لها من جهة الرجل، قال الثوري: إذا تزوج وقال: أي شيء للمرأة؟ فاعلم أنه لص.", "**الخامس:** البكارة، وفي الصحيحين من حديث جابر أن رسول الله ﷺ سأله: «هل تزوجت؟» فقال: نعم. قال: «ثيبا أو بكرا؟» قال: ثيبا. قال: «فهلا تزوجت بكرا تلاعبها وتلاعبك»."]], "ic": "book"}, {"story": ["الباب الثاني فيما يراعى حالة العقد من أحوال المرأة وشروط الع (٢ من ٢)، ص٣٤٨", ["وفي البكارة فائدتان؛ إحداهما: أن البكر تحب الزوج وتألفه فيوجب ذلك الود، قال عليه الصلاة والسلام: «عليكم بالودود». والطباع مجبولة على الأنس", "حاشية: (١) في (ظ): «التعريف».", "بأول مألوف وآكد الحب غالبا ما يقع(١) مع الحبيب الأول. ＊＊والثانية:＊＊ أنه أكمل لمودته لها؛ لأن الطبع ينفر عن التي مسها غير الزوج، ويثقل عليه تذكره.", "**السادس:** أن تكون ولودا، وذلك يعتبر بحالتها إن كان لها زوج قبل ذلك، أو بأقاربها، أو نسبها الموجب لذلك.", "**السابع:** النسب وهو أن تكون من بيت دين وصلاح؛ لأنها إذا لم يربها أهل الدين لم تحسن تربية أولادها على ذلك الوصف، قال عليه الصلاة والسلام: «إياكم وخضراء الدمن» فقيل: ما خضراء الدمن؟ فقال: «المرأة الحسناء في المنبت السوء». وقال: «تخيروا لنطفكم، فإن العرق نزاع».", "**الثامن:** أن لا تكون من القرابة القريبة، فإن ذلك يقلل الشهوة؛ لأن الشهوة إنما تنبعث بالأمر الغريب الجديد، والقرابة مألوفة، وقلة الشهوة توجب أن يكون الولد ضاويا(٢)، وكما أنه ينبغي للرجل أن ينظر المرأة، ينبغي للولي أن ينظر للمرأة في دين الرجل(٣) وأخلاقه وأحواله؛ لأنها تصير بالنكاح مرقوقة، ومتى زوجها من فاسق أو مبتدع فقد جنى عليها وعلى دين نفسه، إذ تعرض لسخط ربه، قال عليه الصلاة والسلام: «من زوج كريمته من فاسق(٤) فقد قطع رحمها». وقال رجل للحسن: قد خطب ابنتي جماعة، فممن أزوجها؟ قال: ممن يتقي الله، فإنه إن أحبها أكرمها، وإن أبغضها لم يظلمها.", "حاشية: (١) ليست في الأصل.", "حاشية: (٢) ضاويا: هزيلا.", "حاشية: (٣) في (ظ): «حق الزوج».", "حاشية: (٤) بعدها في (ظ): «أو مبتدع»."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "السابع: النسب وهو أن تكون من بيت دين وصلاح؛ لأنها إذا لم يربها أهل الدين لم تحسن تربية ____ على ذلك الوصف، قال عليه الصلاة والسلام: «إياكم وخضراء الدمن» فقيل: ما خضراء الدمن؟ فقال: «المرأة", "o": ["أولادها", "يستعير", "يمينه", "وهيأته"], "h": "راجع: ص٣٤٩"}, {"t": "fill", "d": 2, "q": "الرابع: خفة المهر، قال عمر بن الخطاب: لا تغالوا في مهور النساء. وقد زوج سعيد بن المسيب ابنته على درهمين، وكما تكره المغالاة في المهر من جهة المرأة يكره ____ عن ما لها من جهة الرجل، قال الثوري:", "o": ["السؤال", "خيمة", "يطرح", "السري"], "h": "راجع: ص٣٤٨"}, {"t": "fill", "d": 2, "q": "السادس: أن تكون ولودا، وذلك يعتبر بحالتها إن كان لها زوج قبل ذلك، أو بأقاربها، أو ____ الموجب", "o": ["نسبها", "إقام", "النادرة", "مستلذ"], "h": "راجع: ص٣٤٩"}, {"t": "fill", "d": 2, "q": "بأول مألوف وآكد الحب غالبا ما يقع مع الحبيب ____", "o": ["الأول", "تقتضي", "فمنها", "المصرف"], "h": "راجع: ص٣٤٩"}, {"t": "fill", "d": 2, "q": "الثالث: الحسن، وذلك مطلوب، إذ به يحصل التحصن، والدميمة لا تكفي غالبا، ولهذا أمرنا بالنظر إلى المنكوحة، وقد كان أقوام لا ____ في الحسن ولا يقصدون التمتع، كما اختار الإمام أحمد رحمه الله امرأة", "o": ["ينظرون", "أجزرني", "والمرآة", "مضاربة"], "h": "راجع: ص٣٤٨"}, {"t": "fill", "d": 2, "q": "والثاني: لطيب المعشر وحصول المقاصد، وهي ثمانية: الدين، والخلق، والحسن، وخفة المهر، والبكارة، والولادة، والنسب، وأن لا ____ قرابة", "o": ["تكون", "نفيس", "الريح", "ثقيلة"], "h": "راجع: ص٣٤٧"}]}], "sum": [["الصفحات", "ص٣٤٧ - ص٣٤٩"]], "_nq": 6}, {"id": "l11", "title": "الباب الثالث في آداب المعاشرة وما يجري في دوام النكاح والنظر فيما على الزوج وفيما على الزوجة", "group": "كتاب آداب النكاح", "map": {"center": "الباب\nالثالث في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الثالث في آداب المعاشرة وما يجري في دوام النكاح والنظر فيما على  - القسم ١ من ٢", "b": [{"pic": ["books", "book"], "cap": "ص٣٥٠ - ص٣٦٠"}, {"story": ["الباب الثالث في آداب المعاشرة وما يجري في دوام النكاح والنظر (١ من ٨)، ص٣٥٠", ["**في آداب المعاشرة وما يجري في دوام النكاح والنظر فيما على الزوج وفيما على الزوجة**", "أما الزوج؛ فعليه مراعاة الاعتدال والأدب في اثني عشر أمرا: في الوليمة، والمعاشرة، والدعابة(١)، والسياسة، والغيرة، والنفقة، والتعليم، والقسم، والتأديب بالنشوز، والوقاع، والولادة(٢)، والطلاق.", "**الأدب الأول: الوليمة:** وهي سنة مستحبة، وفي الصحيحين من حديث أنس أن عبد الرحمن بن عوف تزوج امرأة، فقال له رسول الله ﷺ: «أولم ولو بشاة».", "**الثاني:** حسن الخلق معهن، واحتمال الأذى منهن لقصور عقولهن، وفي الصحيحين من حديث أبي هريرة عن النبي ﷺ أنه قال: «استوصوا بالنساء، فإن المرأة خلقت من ضلع، وإن أعوج ما في الضلع أعلاه، فإن ذهبت تقيمه كسرته، وإن تركته لم يزل أعوج، فاستوصوا بالنساء». أخبرنا عبد الوهاب قال: أخبرنا عاصم قال: أخبرنا ابن بشران قال: أخبرنا ابن صفوان قال: حدثنا عبد الله بن محمد قال: حدثنا الحسن بن الصباح قال: حدثنا مكي بن إبراهيم قال: حدثنا موسى بن عبيدة عن عبد الله بن دينار عن ابن عمر عن النبي ﷺ أنه قال: «أيها الناس، إن النساء عوان(٣) عندكم، لا يملكن لأنفسهن نفعا ولا ضرا، أخذتموهن بأمانة الله عز وجل، واستحللتم فروجهن بكلمة الله، لكم عليهن حق، ولهن عليكم حق، فمن حقكم عليهن أن لا يوطئن فرشكم ولا يعصينكم في معروف، فإذا فعلن", "حاشية: (١) تحرفت في (ظ) إلى: «الرعاية».", "حاشية: (٢) سقطت من الأصل.", "حاشية: (٣) عوان: جمع عانية، أي أسيرة.", "ذلك فلهن رزقهن وكسوتهن بالمعروف، فلا تضربوهن، فإن ضربتموهن فاضربوهن ضربا غير مبرح».", "واعلم أنه ليس حسن الخلق مع المرأة كف الأذى عنها بل احتمال الأذى منها، والحلم عند(١) طيشها وغضبها اقتداء برسول الله ﷺ، فقد كان أزواج رسول الله ﷺ يراجعنه، وفي الصحيحين من حديث عمر بن الخطاب قال: تغضبت يوما على امرأتي، فإذا هي تراجعني، فأنكرت أن تراجعني، فقالت: ما تنكر أن أراجعك؟ فو الله إن أزواج رسول الله ﷺ ليراجعنه، وتهجره إحداهن اليوم إلى الليل. فدخلت على حفصة فقلت: أتراجعن رسول الله؟ قالت: نعم. قلت: وتهجره إحداكن اليوم إلى الليل؟ قالت: نعم. قلت: قد خاب من فعل ذلك منكن وخسر."]], "ic": "book"}, {"story": ["الباب الثالث في آداب المعاشرة وما يجري في دوام النكاح والنظر (٢ من ٨)، ص٣٥١", ["أخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا وكيع قال: حدثنا إسرائيل عن أبي إسحاق عن العيزار بن حريث عن النعمان بن بشير قال: جاء أبو بكر يستأذن على النبي ﷺ، فسمع عائشة وهي رافعة صوتها على رسول الله ﷺ، فأذن له فدخل، فقال: يا بنت أم رومان ـ وتناولها ـ أترفعين صوتك على رسول الله؟! قال: فحال النبي ﷺ بينه وبينها. قال: فلما خرج أبو بكر جعل النبي ﷺ يقول لها يترضاها: «ألا ترين أني قد حلت بين الرجل وبينك؟». قال: ثم جاء أبو بكر فاستأذن، فوجدها يضاحكها فأذن له فدخل، فقال أبو بكر: يا رسول الله أشركاني في سلمكما كما أشركتماني في حربكما.", "**الثالث:** أن يداعبها ويمازحها، وقد كان رسول الله ﷺ يداعب نساءه، وقال لجابر: «هلا تزوجت بكرا تلاعبها وتلاعبك». وقد سابق عائشة فسبقته، فعاد فسابقها فسبقها، فضحك وجعل يقول: «هذه بتلك». وفي الصحيحين من حديث عائشة قالت: رأيت رسول الله ﷺ يسترني بردائه وأنا أنظر إلى الحبشة يلعبون في المسجد حتى أكون أنا أسأم فاقعد، فاقدروا قدر الجارية الحديثة السن الحريصة", "حاشية: (١) في الأصل: «عن».", "على اللهو. قالت: وكنت ألعب بالبنات، فكان صواحبي يأتين، فكن إذا رأين رسول الله ﷺ ينقمعن منه، فكان رسول الله ﷺ يسربهن إلي يلعبن معي. وفي حديث عائشة عن النبي ﷺ أنه قال: «خيركم خيركم لأهله، وأنا خيركم لأهله».", "وقال عمر بن الخطاب: ينبغي للرجل أن يكون في أهله مثل الصبي، فإذا التمس ما عنده وجد رجلا.", "**الرابع:** أن لا ينبسط في الدعابة وحسن الخلق إلى أن تسقط هيبته بالكلية عند المرأة، بل يراعي الاعتدال في ذلك، ولينقبض إذا رأى ما ينكره، وإذا رأى ما يخالف الشرع تنمر(١) وامتعض.", "وفي الجملة؛ ينبغي أن يسلك طريق الاقتصاد في المخالفة والموافقة، ويتبع الحق في جميع ذلك، ولا بد من لطف ممزوج بسياسة، وقد روينا عن عمر بن الخطاب أنه عتب على بعض عماله، فكلم امرأة عمر، فقالت له: يا أمير المؤمنين فيم وجدت عليه؟ فقال: يا عدوة الله! وفيم أنت وهذا؟! إنما أنت لعبة يلعب بك ثم تتركين.", "**الخامس:** الاعتدال في الغيرة، وهو أن لا يتغافل عن مبادئ الأمور التي تخشى غوائلها، ولا يبالغ في إساءة الظن وبتجسس البواطن، وقد نهى رسول الله ﷺ أن يطرق الرجل أهله ليلا، وفي حديث ابن عمر قال: نهى رسول الله ﷺ عن طروق النساء، فعجل رجلان فوجدا عند أهلهما ما يكرهان.", "وقال علي رضي الله عنه: لا تكثر الغيرة على أهلك، فترمى بالسوء من أجلك."]], "ic": "book"}, {"story": ["الباب الثالث في آداب المعاشرة وما يجري في دوام النكاح والنظر (٣ من ٨)، ص٣٥٢", ["وأما الغيرة في موضعها فمحمودة، وفي الصحيحين من حديث أبي هريرة عن النبي ﷺ أنه قال: «إن الله يغار، وإن المؤمن يغار». وفيهما من حديث المغيرة بن شعبة عن النبي ﷺ أنه قال: «أتعجبون من غيرة سعد؟ والله لأنا أغير منه، والله أغير مني، ومن أجل غيرة الله حرم الفواحش ما ظهر منها وما بطن». وفيهما من حديث", "حاشية: (١) تنمر: غضب وتغير وجهه.", "ابن مسعود عن النبي ﷺ أنه قال: «لا أحد أغير من الله عز وجل». وقد جاء في الحديث: «من الغيرة ما يحبه الله، وهي الغيرة في الريبة، ومنها ما يبغضه الله، وهي الغيرة في غير الريبة».", "واعلم أن المانع لوجود الغيرة أن لا يدخل على المرأة الرجال، ولا تخرج هي من البيت، وقد روينا أن علي بن أبي طالب قال لفاطمة: ما خير [حال] النساء؟ قالت: لا يرين الرجال ولا يرونهن. قال علي: فذكرت ذلك للنبي ﷺ، فقال: «إنما فاطمة بضعة مني».", "ورأى معاذ بن جبل امرأته تطلع من كوة(١)، فضربها. وقد كان النبي ﷺ يقول: «إذا استأذنت أحدكم امرأته إلى المسجد فلا يمنعها» فلما رأت عائشة ما جرى بعده قالت: لو علم رسول الله ما أحدث النساء بعده لمنعهن الخروج.", "وينبغي للمرأة أن لا تخرج من بيتها مهما أمكن، فإذا خرجت فينبغي أن تغض بصرها عن الرجال، فإن نظرها إليهم جائز ما لم يثر لها شهوة، كنظر الرجل إلى الأمرد، فإن أثار شهوة حرم.", "السادس: الاعتدال في النفقة، والقصد دون الإسراف والتقتير قال الله عز وجل: ﴿وَلَا تَجْعَلْ يَدَكَ مَغْلُولَةً إِلَىٰ عُنُقِكَ وَلَا تَبْسُطْهَا كُلَّ ٱلْبَسْطِ﴾ [الإسراء: ٢٩]، ولا ينبغي للرجل أن يستأثر عن أهله بالطعام الطيب، فإن ذلك مما يوغر الصدر، فإن أبى، فليستر ذلك عنهم، وأهم ما يجب عليه مراعاته في الإنفاق على المرأة أن يطعمها من الحلال.", "**السابع:** أن يتعلم المتزوج من علم الحيض وأحكامه وما يدري به كيف معاشرة الحائض، ويلقنها الاعتقاد الصحيح، ويزيل عن قلبها بدعة إن كانت، ويعلمها أحكام الصلاة، والحيض، والاستحاضة، فيعرفها أنه إذا انقطع دمها قبل المغرب بمقدار ركعة فعليها قضاء الظهر والعصر، وإذا انقطع قبل الصبح بمقدار ركعة فعليها", "حاشية: (١) الكوة: الثقبة في الحائط.", "قضاء المغرب والعشاء(١)، وهذا لا يكاد النساء يراعينه، فإن قام الرجل بتعليمها، فليس لها الخروج لسؤال العلماء، وإن ناب عنها في سؤالهم كفاها، وإن لم يكن ذلك جاز لها الخروج.", "**الثامن:** من كان له نسوة فينبغي أن يعدل بينهن، والعدل في المبيت والعطاء، لا في الحب والوطء، فإن ذلك لا يملك، فإن سافر وأراد استصحاب إحداهن أقرع بينهن، كما كان رسول الله ﷺ يفعل، وقد روى أبو هريرة عن النبي ﷺ أنه قال: «من كانت له امرأتان يميل لإحداهما على الأخرى جاء يوم القيامة يجر أحد شقيه ساقطا أو مائلا»."]], "ic": "book"}, {"story": ["الباب الثالث في آداب المعاشرة وما يجري في دوام النكاح والنظر (٤ من ٨)، ص٣٥٤", ["وإذا وهبت إحداهن ليلتها لصاحبتها ورضي الزوج بذلك ثبت الحق لها، وقد كان رسول الله ﷺ أراد طلاق سودة فوهبت ليلتها لعائشة وسألته أن يقرها على الزوجية لتحشر في زمرة نسائه ففعل، وكان رسول الله ﷺ إذا تاقت نفسه إلى إحدى نسائه فجامعها في غير يومها طاف على سائر نسائه في ذلك ا ليوم.", "**التاسع:** النشوز، وإذا كان النشوز من المرأة فله أن يؤدبها ويحملها على الطاعة قهرا، ولكنه ينبغي أن يتدرج في تأديبها بتقديم الوعظ والتخويف، فإن لم ينجع(٢) ولاها ظهره في المضجع أو انفرد عنها بالفراش وهجرها وهو في البيت من ليلة إلى ثلاث ليال(٣)، فإن لم ينفع ضربها ضربا غير مبرح، وهو أن يؤلمها ولا يدمي لها جسما، ولا يضرب وجهها، فقد قال عليه الصلاة والسلام: «لا تضرب الوجه، ولا تقبح، ولا تهجر إلا في البيت».", "**العاشر:** في آداب الجماع؛ يستحب البداية بالتسمية، والانحراف عن القبلة، وأن يتغطى هو وأهله بثوب، ولا يكونا متجردين، وأن يبتدئ بالملاعبة والضم", "حاشية: (١) وهذا قول مالك والشافعي وأحمد، وقال الثوري وأبو حنيفة: لا يجب عليها إلا الصلاة التي طهرت في وقتها وحدها. انظر «المقنع مع الشرح الكبير والإنصاف» ٣/ ١٨٠.", "حاشية: (٢) نجع الشيء نجوعا: نفع وظهر أثره.", "حاشية: (٣) ليست في (ظ).", "والتقبيل، وفي الصحيحين من حديث ابن عباس عن النبي ﷺ أنه قال: «لو أن أحدكم إذا أتى أهله قال: بسم الله، اللهم جنبنا الشيطان، وجنب الشيطان ما رزقتنا، فإن قدر بينهما في ذلك ولد لم يضره الشيطان أبدا».", "ومن العلماء من استحب الجماع يوم الجمعة لقوله: «من غسل واغتسل». ثم إذا قضى وطره فليتمهل على أهله ليقضي وطرها، فإن إنزالها ربما تأخر، فتتأذى بتهيج شهوة لم تقض.", "والاعتدال أن يأتيها في كل أربع ليال مرة، ولينظر في قدر حاجته وحاجتها إلى التحصين فليفعل بمقتضى ذلك، فإن تحصينها لازم له، ولا يجوز أن يأتيها في الحيض ولا بعد انقطاعه قبل الغسل، ولا في المأتى، وله أن يستمتع بجميع بدن الحائض دون الفرج.", "ومن الأداب أن تأتزر الحائض بإزار من حقويها(١) إلى ما فوق الركبة، ومن أراد أن يجامع مرة ثانية فليغسل فرجه، وفي أفراد مسلم من حديث أبي سعيد الخدري عن النبي ﷺ أنه قال: «إذا غشي أحدكم أهله ثم أراد أن يعود، فليتوضأ وضوءه للصلاة».", "ومن الأدب أن لا يحلق شعره، ولا يقلم أظفاره، ولا يخرج دما وهو جنب."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "والاعتدال أن يأتيها في كل أربع ليال مرة، ولينظر في
