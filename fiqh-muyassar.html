"group": "الكتاب الثاني: الصلاة", "map": {"center": "الباب السادس\nالصلاة", "nodes": [{"t": "في مشروعية سجود السهو وأسبابه", "s": []}, {"t": "متى يجب؟", "s": []}, {"t": "متى يسن؟", "s": []}, {"t": "موضعه وصفته", "s": []}, {"t": "سجود التلاوة", "s": []}]}, "paras": [{"t": "الباب السادس: في سجود السهو والتلاوة والشكر", "b": [{"pic": ["scroll", "book", "open-book"], "cap": "ص89-94"}, {"story": ["المسألة الأولى: في مشروعية سجود السهو وأسبابه", ["والمراد به: السجود المطلوب في آخر الصلاة جبرا للنقص فيها أو زيادة أو شك.", "وسجود السهو مشروع؛ لقوله ﷺ: «إذا نسي أحدكم فليسجد سجدتين»، ولفعله ﷺ، كما سيأتي بيانه.", "وقد أجمع أهل العلم على مشروعية سجود السهو.", "وأسبابه ثلاثة: الزيادة، والنقص، والشك."]], "ic": "scroll"}, {"story": ["المسألة الثانية: متى يجب؟", ["يجب سجود السهو لما يأتي:", "1- إذا زاد فعلا من جنس الصلاة، كأن يزيد ركوعا أو سجودا أو قياما أو قعودا ولو قدر جلسة الاستراحة؛ لحديث ابن مسعود: «صلى بنا الرسول ﷺ خمسا فلما انفتل من الصلاة توشوش القوم بينهم فقال: ما شأنكم؟ قالوا: يا رسول الله هل زيد في الصلاة شيء؟ قال: لا. قالوا: فإنك صليت خمسا. فانفتل، فسجد سجدتين، ثم سلم، ثم قال: إنما أنا بشر مثلكم أنسى كما تنسون، فإذا نسي أحدكم فليسجد سجدتين». فإذا علم بالزيادة وهو في الصلاة وجب عليه الجلوس حال علمه، حتى لو كان في أثناء الركوع؛ لأنه لو استمر في الزيادة مع علمه لزاد في الصلاة شيئا عمدا، وهذا لا يجوز.", "2- أو سلم قبل إتمام صلاته؛ لحديث عمران بن حصين قال: «سلم رسول الله ﷺ في ثلاث ركعات، من العصر، ثم قام فدخل الحجرة، فقام رجل بسيط اليدين، فقال: أقصرت الصلاة؟ فخرج، فصلى الركعة التي كان ترك، ثم سلم، ثم سجد سجدتي السهو، ثم سلم».", "3- أو لحن لحنا؛ يحيل المعنى سهوا؛ لأن عمده يبطل الصلاة، فوجب سجود السهو.", "4- أو ترك واجبا؛ لحديث ابن بحينة قال: «صلى لنا رسول الله ﷺ ركعتين من بعض الصلوات، ثم قام، فلم يجلس، فقام الناس معه، فلما قضى صلاته ونظرنا تسليمه كبر قبل التسليم، فسجد سجدتين وهو جالس، ثم سلم».", "ثبت هذا بالخبر فيمن ترك التشهد الأوسط، فيقاس عليه سائر الواجبات، كترك التسبيح في الركوع والسجود، وقوله بين السجدتين: رب اغفر لي، وتكبيرات الانتقال.", "5- ويجب سجود السهو إذا شك في عدد الركعات فلم يدر كم صلى؟ وذلك أثناء الصلاة؛ لأنه أدى جزءا من صلاته مترددا في كونه منها أو زائدا عليها، فضعفت النية، واحتاجت للجبر بالسجود؛ لعموم حديث أبي هريرة ﷺ أن رسول الله ﷺ قال: «إن أحدكم إذا قام يصلي جاءه الشيطان فلبس عليه، حتى لا يدري كم صلى، فإذا وجد ذلك أحدكم، فليسجد سجدتين وهو جالس». وهو في هذه الحالة بين أمرين: إما أن يكون الشك بدون ترجيح لأحد الاحتمالين، ففي هذه الحالة يؤخذ بالأقل ويبنى عليه، ويسجد للسهو؛ لقوله ﷺ: «إذا شك أحدكم في صلاته، فلم يدر كم صلى ثلاثا أم أربعا، فليطرح الشك وليبن على ما استيقن، ثم يسجد سجدتين قبل أن يسلم».", "أما إذا غلب على ظنه وترجح أحد الاحتمالين، فإنه يعمل به، ويبنى عليه، ويسجد سجدتين للسهو؛ لقوله ﷺ فيمن شك وتردد: «فليتحر الصواب -أي على التحري- ثم ليتم عليه، ثم ليسلم، ثم ليسجد سجدتين بعد أن يسلم»."]], "ic": "scroll"}, {"note": "حاشية (ص90): ويقال بالسين المهملة (توسوس)، والوشوشة: صوت في اختلاط. / أي: انصرف ورجع إلى القبلة. / يعني: ترك التشهد الأول."}, {"story": ["المسألة الثالثة: متى يسن؟", ["يسن سجود السهو إذا أتى بقول مشروع في غير محله سهوا؛ كالقراءة في ركوع أو سجود، والتشهد في القيام، مع الإتيان بالقول المشروع في ذلك موضع، كأن يقرأ في الركوع مع قوله: سبحان ربي العظيم؛ لحديث النبي ﷺ: «إذا نسي أحدكم فليسجد سجدتين»."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: موضعه وصفته", ["1- موضعه:", "لا ريب أن الأحاديث وردت في موضع سجود السهو على قسمين: قسم دل على مشروعيته قبل السلام، والقسم الآخر دل على مشروعيته بعد السلام؛ ولهذا قال بعض المحققين: إن المصلي مخير إن شاء سجد قبل السلام أو بعده؛ لأن الأحاديث وردت بكلا الأمرين، فلو سجد لكل قبل السلام أو بعده جاز. قال الزهري: كان آخر الأمرين السجود قبل السلام.", "2- صفة سجود السهو: سجدتان كسجود الصلاة، يكبر في كل سجدة للسجود وللرفع منه، ثم يسلم. وذهب بعضهم إلى أنه يتشهد إذا سجد للسهو بعد السلام؛ لورود ذلك عن النبي ﷺ في ثلاثة أحاديث حسنة بمجموعها، كما قال الحافظ ابن حجر."]], "ic": "scroll"}, {"story": ["المسألة الخامسة: سجود التلاوة", ["1- مشروعيته وحكمه: وهو مشروع عند تلاوة الآيات التي وردت فيها السجدات واستماعها.", "قال ابن عمر: «كان النبي ﷺ يقرأ علينا السورة فيها السجدة فيسجد ونسجد معه، حتى ما يجد أحدنا مكانا لجبهته»، وهو سنة على الصحيح، وليس بواجب، فقد قرأ زيد بن ثابت على النبي ﷺ «والنجم» فلم يسجد فيها. فدل على عدم الوجوب.", "ويشرع سجود التلاوة في حق القارئ والمستمع، إذا قرأ آية سجدة في الصلاة أو خارجها؛ لفعله ﷺ ذلك عندما كان يقرأ السجدة، ولسجود الصحابة معه كما مر في حديث ابن عمر: «فيسجد ونسجد معه».", "والدليل على مشروعيته في الصلاة: ما رواه البخاري ومسلم عن أبي رافع قال: صليت مع أبي هريرة العتمة، فقرأ: ﴿إذا السماء انشقت﴾ [الانشقاق: 1] فسجد، فقلت: ما هذه؟ قال: سجدت بها خلف أبي القاسم ﷺ، فلا أزال أسجد بها حتى ألقاه.", "فإذا لم يسجد القارئ لا يسجد المستمع؛ لأن المستمع تبع فيها للقارئ، ولحديث زيد بن ثابت المتقدم، فإن زيدا لم يسجد، فلم يسجد النبي ﷺ.", "2- فضلها: عن أبي هريرة ﷺ عن النبي ﷺ أنه قال: «إذا قرأ ابن آدم السجدة فسجد، اعتزل الشيطان يبكي، يقول: يا ويله، أمر ابن آدم بالسجود فسجد فله الجنة، وأمرت بالسجود فأبيت فلي النار».", "3- صفتها وكيفيتها: يسجد سجدة واحدة، ويكبر إذا سجد، ويقول في سجوده: «سبحان ربي الأعلى» كما يقول في سجود الصلاة، ويقول أيضا: «سبحانك اللهم ربنا وبحمدك اللهم اغفر لي»، وإن قال: «سجد وجهي للذي خلقه، وشق سمعه وبصره، بحوله وقوته» فلا بأس.", "4- مواضع سجود التلاوة في القرآن:", "مواضع سجود القرآن الكريم خمسة عشر موضعا، وهي على الترتيب:", "1- آخر سورة الأعراف (آية رقم 206).", "2- سورة الرعد (آية رقم 15).", "3- سورة النحل (آية 49-50).", "4- سورة الإسراء (آية 107-109).", "5- سورة مريم (آية 58).", "6- أول سورة الحج (آية 18).", "7- آخر سورة الحج (آية 77).", "8- سورة الفرقان (آية 73).", "9- سورة النمل (آية 25-26).", "10- سورة السجدة (آية 15).", "11- سورة فصلت (آية 37-38).", "12- آخر سورة النجم (آية 62).", "13- سورة الانشقاق (آية 20-21).", "14- آخر سورة العلق (آية 19).", "والخامسة عشرة: هي سجدة سورة (ص)، وهي سجدة شكر، فعن ابن عباس قال: «ليست (ص) من عزائم السجود، وقد رأيت النبي ﷺ يسجد فيها»."]], "ic": "scroll"}, {"story": ["المسألة السادسة: سجود الشكر", ["يستحب لمن وردت عليه نعمة، أو دفعت عنه نقمة، أو بشر بما يسره، أن يخر ساجدا لله؛ اقتداء بالنبي ﷺ. ولا يشترط فيها استقبال القبلة، ولكن إن استقبلها فهو أفضل.", "وقد كان رسول الله ﷺ يفعله، فعن أبي بكرة: «أن النبي ﷺ كان إذا أتاه أمر يسره -أو يسر به- خر ساجدا، شكرا لله تبارك وتعالى»، وكذا فعله الصحابة رضوان الله عليهم.", "وحكم هذا السجود حكم سجود التلاوة، وكذا صفته وكيفيته."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "المراد بسجود السهو:", "o": ["السجود المطلوب في آخر الصلاة جبرا للنقص فيها أو زيادة أو شك", "السجود في أول الصلاة", "سجود لا يتعلق بالصلاة", "سجود الشكر"], "h": "راجع: ص89 (المسألة الأولى)"}, {"t": "mcq", "d": 1, "q": "أسباب سجود السهو ثلاثة هي:", "o": ["الزيادة، والنقص، والشك", "الزيادة والنوم والنسيان", "الشك والخوف والسفر", "النقص والمرض والسفر"], "h": "راجع: ص89 (المسألة الأولى)"}, {"t": "tf", "d": 1, "q": "أجمع أهل العلم على مشروعية سجود السهو.", "a": true, "h": "راجع: ص89 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "ممن روى حديث أنه صلى بهم خمسا ثم سجد سجدتين:", "o": ["ابن مسعود", "ابن بحينة", "عمران بن حصين", "أبو هريرة"], "h": "راجع: ص89 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "إذا علم بالزيادة وهو في الصلاة:", "o": ["وجب عليه الجلوس حال علمه", "يستمر في الزيادة", "يقطع الصلاة", "يسلم فورا"], "h": "راجع: ص90 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "حديث «أقصرت الصلاة؟» هو حديث:", "o": ["عمران بن حصين", "ابن مسعود", "ابن بحينة", "أبو بكرة"], "h": "راجع: ص90 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "من لحن لحنا يحيل المعنى سهوا:", "o": ["وجب عليه سجود السهو", "لا شيء عليه", "تبطل صلاته", "يعيد الصلاة"], "h": "راجع: ص90 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "الحديث الذي قام فيه النبي ﷺ ولم يجلس للتشهد الأوسط رواه:", "o": ["ابن بحينة", "ابن مسعود", "ابن عمر", "عمران"], "h": "راجع: ص90 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "يقاس على ترك التشهد الأوسط:", "o": ["سائر الواجبات", "الأركان", "السنن", "المباحات"], "h": "راجع: ص90 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "إذا شك ولم يترجح له أحد الاحتمالين:", "o": ["يأخذ بالأقل ويبني عليه ويسجد للسهو", "يأخذ بالأكثر", "يقطع الصلاة", "لا شيء عليه"], "h": "راجع: ص91 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "إذا غلب على ظنه أحد الاحتمالين:", "o": ["يعمل به ويبني عليه ويسجد سجدتين للسهو", "يأخذ بالأقل", "يعيد الصلاة", "لا يسجد"], "h": "راجع: ص91 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "يسن سجود السهو إذا:", "o": ["أتى بقول مشروع في غير محله سهوا", "ترك واجبا", "زاد ركعة", "شك في عدد الركعات"], "h": "راجع: ص91 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "قال الزهري في موضع سجود السهو:", "o": ["كان آخر الأمرين السجود قبل السلام", "كان آخر الأمرين السجود بعد السلام", "لا يسجد", "في أول الصلاة"], "h": "راجع: ص92 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "صفة سجود السهو:", "o": ["سجدتان كسجود الصلاة، يكبر في كل سجدة ثم يسلم", "سجدة واحدة", "ثلاث سجدات", "بلا تكبير"], "h": "راجع: ص92 (المسألة الرابعة)"}, {"t": "mcq", "d": 1, "q": "سجود التلاوة مشروع عند:", "o": ["تلاوة الآيات التي وردت فيها السجدات واستماعها", "كل قراءة", "الأذان", "الإقامة"], "h": "راجع: ص92 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "حكم سجود التلاوة:", "o": ["سنة على الصحيح وليس بواجب", "واجب", "مكروه", "مباح"], "h": "راجع: ص92 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "الدليل على عدم وجوب سجود التلاوة: أن زيد بن ثابت قرأ على النبي ﷺ:", "o": ["والنجم فلم يسجد فيها", "الأعراف", "العلق", "الانشقاق"], "h": "راجع: ص92 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "إذا لم يسجد القارئ:", "o": ["لا يسجد المستمع", "يسجد المستمع", "تبطل الصلاة", "يعيد القارئ"], "h": "راجع: ص93 (المسألة الخامسة)"}, {"t": "mcq", "d": 1, "q": "عدد مواضع سجود التلاوة في القرآن:", "o": ["خمسة عشر موضعا", "أربعة عشر", "عشرة", "اثنا عشر"], "h": "راجع: ص93 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "سجدة سورة (ص) هي:", "o": ["سجدة شكر", "من عزائم السجود", "واجبة", "غير مشروعة"], "h": "راجع: ص94 (المسألة الخامسة)"}, {"t": "mcq", "d": 1, "q": "سجود الشكر يستحب لمن:", "o": ["وردت عليه نعمة أو دفعت عنه نقمة أو بشر بما يسره", "نسي في صلاته", "أراد صلاة الضحى", "زاد ركعة"], "h": "راجع: ص94 (المسألة السادسة)"}, {"t": "mcq", "d": 2, "q": "في سجود الشكر:", "o": ["لا يشترط استقبال القبلة ولكن إن استقبلها فهو أفضل", "يشترط الوضوء والاستقبال", "تشترط الجماعة", "لا يجوز"], "h": "راجع: ص94 (المسألة السادسة)"}, {"t": "mcq", "d": 2, "q": "روى سجود الشكر عن النبي ﷺ:", "o": ["أبو بكرة", "ابن بحينة", "ابن مسعود", "عمران"], "h": "راجع: ص94 (المسألة السادسة)"}]}], "sum": [["في مشروعية سجود السهو وأسبابه", "ص89-94"], ["متى يجب؟", "ص89-94"], ["متى يسن؟", "ص89-94"], ["موضعه وصفته", "ص89-94"]]}, {"id": "l19", "title": "الباب السابع: في صلاة الجماعة", "group": "الكتاب الثاني: الصلاة", "map": {"center": "الباب السابع\nالصلاة", "nodes": [{"t": "فضل صلاة الجماعة وحكمها", "s": []}, {"t": "إذا دخل الرجل المسجد وقد صلى: هل ي", "s": []}, {"t": "أقل ما تنعقد به الجماعة", "s": []}, {"t": "بم تدرك الجماعة؟", "s": []}, {"t": "من يعذر بترك الجماعة", "s": []}]}, "paras": [{"t": "الباب السابع: في صلاة الجماعة", "b": [{"pic": ["scroll", "book", "open-book"], "cap": "ص94-100"}, {"story": ["المسألة الأولى: فضل صلاة الجماعة وحكمها", ["1- فضلها: صلاة الجماعة في المساجد شعيرة عظيمة من شعائر الإسلام.", "واتفق المسلمون على أن أداء الصلوات الخمس في المساجد من أعظم الطاعات، فقد شرع الله لهذه الأمة الاجتماع في أوقات معلومة، منها الصلوات الخمس، وصلاة الجمعة، وصلاة العيدين، وصلاة الكسوف.", "وأعظم الاجتماعات وأهمها الاجتماع بعرفة، الذي يشير إلى وحدة الأمة الإسلامية في عقائدها وعباداتها وشعائر دينها، وشرعت هذه الاجتماعات العظيمة في الإسلام لأجل مصالح المسلمين؛ ففيها التواصل بينهم، وتفقد بعضهم أحوال بعض، وغير ذلك مما يهم الأمة الإسلامية على اختلاف شعوبها وقبائلها، كما قال تعالى: ﴿يا أيها الناس إنا خلقناكم من ذكر وأنثى وجعلناكم شعوبا وقبائل لتعارفوا إن أكرمكم عند الله أتقاكم﴾ [الحجرات: 13].", "وقد حث النبي ﷺ عليها، وبين فضلها وعظيم أجرها، فقال ﷺ: «صلاة الجماعة أفضل من صلاة الفذ -يعني الفرد- بسبع وعشرين درجة». وقال ﷺ: «صلاة الرجل في الجماعة تضعف على صلاته في بيته، وفي سوقه، خمسا وعشرين ضعفا، وذلك أنه: إذا توضأ، فأحسن الوضوء، ثم خرج إلى المسجد، لا يخرجه إلا الصلاة، لم يخط خطوة، إلا رفعت له بها درجة، وحط عنه بها خطيئة، فإذا صلى، لم تزل الملائكة تصلي عليه، ما دام في مصلاه...» الحديث.", "2- حكمها: صلاة الجماعة واجبة في الصلوات الخمس، وقد دل على وجوبها الكتاب والسنة؛ فمن الكتاب: قوله تعالى: ﴿وإذا كنت فيهم فأقمت لهم الصلاة فلتقم طائفة منهم معك﴾ [النساء: 102]. والأمر للوجوب وإذا كان ذلك مع الخوف فمع الأمن أولى.", "ومن السنة: حديث أبي هريرة ﷺ: قال رسول الله ﷺ: «أثقل الصلاة على المنافقين صلاة العشاء، وصلاة الفجر، ولو يعلمون ما فيهما لأتوهما ولو حبوا، ولقد هممت أن آمر بالصلاة فتقام، ثم آمر رجلا فيصلي بالناس، ثم أنطلق معي رجال معهم حزم من حطب إلى قوم لا يشهدون الصلاة فأحرق عليهم بيوتهم بالنار»، فدل الحديث على وجوب صلاة الجماعة، وذلك لأنه ﷺ: أولا: وصف المتخلفين عنها بالنفاق، والمتخلف عن السنة لا يعد منافقا، فدل على أنهم تخلفوا عن واجب. ثانيا: أنه هم بعقوبتهم على التخلف عنها، والعقوبة إنما تكون على ترك واجب، وإنما منعه من تنفيذ العقوبة أنه لا يعاقب بالنار إلا الله عز وجل. وقيل: منعه من ذلك من في البيوت من النساء والذرية الذين لا تجب عليهم صلاة الجماعة.", "ومنها: أن رجلا كفيف البصر ليس له قائد، استأذن النبي ﷺ أن يصلي في بيته فقال: «أتسمع النداء؟». قال: نعم. قال: «أجب لا أجد لك رخصة»، ولقوله ﷺ: «من سمع النداء، فلم يجب، فلا صلاة له إلا من عذر»، ولقول ابن مسعود ﷺ: «لقد رأيتنا وما يتخلف عنها إلا منافق معلوم النفاق».", "وهي واجبة على الرجال دون النساء والصبيان غير البالغين، لقوله ﷺ في حق النساء: «وبيوتهن خير لهن». ولا مانع من حضور النساء الجماعة في المسجد، مع التستر والصيانة وأمن الفتنة، بإذن الزوج. وتجب الجماعة في المسجد على من تلزمه، على الصحيح.", "ومن ترك الجماعة وصلى وحده بلا عذر صحت صلاته، لكنه آثم لترك الواجب."]], "ic": "scroll"}, {"story": ["المسألة الثانية: إذا دخل الرجل المسجد وقد صلى: هل يجب عليه أن يصلي مع الجماعة الصلاة التي قد صلاها أولا؟", ["لا تجب عليه إعادتها مع الجماعة، وإنما يسن له ذلك، والأولى فرض والثانية نافلة؛ لحديث أبي ذر: قال رسول الله ﷺ: «كيف أنت إذا كانت عليك أمراء يؤخرون الصلاة عن وقتها؟ -أو- يميتون الصلاة عن وقتها؟». قلت: فما تأمرني؟ قال: «صل الصلاة لوقتها، فإن أدركتها معهم، فصل، فإنها لك نافلة».", "ولقوله ﷺ للرجلين اللذين اعتزلا صلاة الجماعة في المسجد: «إذا صليتما في رحالكما ثم أتيتما مسجد جماعة فصليا معهم، فإنها لكما نافلة»."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: أقل ما تنعقد به الجماعة", ["أقل الجماعة اثنان بلا خلاف. لقوله ﷺ لمالك بن الحويرث: «إذا حضرت صلاة، فأذنا، ثم أقيما، وليؤمكما أكبركما»."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: بم تدرك الجماعة؟", ["تدرك الجماعة بإدراك ركعة من الصلاة، ومن أدرك الركوع غير شاك أدرك ركعة، واطمأن، ثم تابع. لحديث أبي هريرة: «إذا جئتم إلى الصلاة، ونحن سجود فاسجدوا ولا تعدوها شيئا، ومن أدرك ركعة فقد أدرك الصلاة»."]], "ic": "scroll"}, {"story": ["المسألة الخامسة: من يعذر بترك الجماعة", ["يعذر المسلم بترك الجماعة في الأحوال التالية:", "1- المريض مرضا يلحقه منه مشقة لو ذهب إلى الجماعة، لقوله تعالى: ﴿ليس على الأعمى حرج ولا على الأعرج حرج ولا على المريض حرج﴾ [الفتح: 17]، ولأنه ﷺ لما مرض تخلف عن المسجد، وقال: «مروا أبا بكر فليصل بالناس»، ولقول عبد الله بن مسعود ﷺ: «لقد رأيتنا وما يتخلف عنها إلا منافق قد علم نفاقه، أو مريض». وكذلك الخائف حدوث المرض؛ لأنه في معناه.", "2- المدافع أحد الأخبثين أو من بحضرة طعام محتاج إليه؛ لحديث عائشة مرفوعا: «لا صلاة بحضرة طعام، ولا وهو يدافعه الأخبثان».", "3- من له ضائع يرجوه أو يخاف ضياع ماله أو قوته أو ضررا فيه؛ لحديث ابن عباس مرفوعا: «من سمع النداء فلم يمنعه من اتباعه عذر -قالوا: فما العذر يا رسول الله؟ قال: خوف أو مرض لم تقبل منه الصلاة التي صلى».", "وكذا كل خائف على نفسه أو ماله أو أهله أو ولده، فإنه يعذر بترك الجماعة؛ فإن الخوف عذر.", "4- حصول الأذى بمطر ووحل وثلج وجليد، أو ريح باردة شديدة بليلة مظلمة. لحديث ابن عمر ﷺ قال: «كان رسول الله ﷺ يأمر المؤذن إذا كانت ليلة باردة ذات مطر، يقول: ألا صلوا في الرحال».", "5- حصول المشقة بتطويل الإمام؛ لأن رجلا صلى مع معاذ، ثم انفرد، فصلى وحده لما طول معاذ، فلم ينكر عليه ﷺ حين أخبره.", "6- خوف فوات الرفقة في السفر؛ لما في ذلك من انشغال قلبه إذا انتظر الجماعة، أو دخل فيها، مخافة ضياع وفوات رفقته.", "7- الخوف من موت قريبه وهو غير حاضر معه، كأن يكون قريبه في سياق الموت، وأحب أن يكون معه يلقنه الشهادة ونحو ذلك، فيعذر بترك الجماعة لأجل ذلك.", "8- ملازمة غريم له، ولا شيء معه يقضيه، فله ترك الجماعة لما يلحقه من الأذية بمطالبة الغريم، وملازمته إياه."]], "ic": "scroll"}, {"story": ["المسألة السادسة: إعادة الجماعة في المسجد الواحد", ["إذا تأخر البعض عن حضور جماعة المسجد مع الإمام الراتب، وفاتتهم صلاة، فيصح أن يصلوا جماعة ثانية في المسجد نفسه؛ لعموم قوله ﷺ: «صلاة الرجل مع الرجل أزكى من صلاته وحده...»، ولقوله ﷺ لرجل الذي حضر إلى المسجد بعد انتهاء صلاة الجماعة: «من يتصدق على هذا فيصلي معه؟». فقام أحد القوم، فصلى مع الرجل.", "وكذلك إذا كان المسجد مسجد سوق أو طريق وما أشبه ذلك، فلا بأس بإعادة الجماعة فيه، وبخاصة إذا لم يكن لهذا المسجد إمام راتب، ويتردد عليه أهل السوق والمارة.", "أما إذا كان المسجد فيه جماعتان أو أكثر دائما وعلى نحو مستمر، واتخذ الناس ذلك عادة؛ فإنه لا يجوز؛ إذا لم يعرف ذلك في زمن النبي ﷺ وأصحابه، لما فيه من تفرق الكلمة، والدعوة للكسل والتواني عن حضور الجماعة الأم مع الإمام الراتب، وربما كان ذلك مدعاة لتأخير الصلاة عن أول وقتها."]], "ic": "scroll"}, {"story": ["المسألة السابعة: حكم الصلاة إذا أقيمت الصلاة المكتوبة", ["إذا شرع المؤذن في الإقامة لصلاة الفريضة، فلا يجوز لأحد أن يبتدئ صلاة نافلة، فيشتغل بنافلة يقيمها وحده عن أداء فريضة تقيمها الجماعة؛ وذلك لقوله ﷺ: «إذا أقيمت الصلاة فلا صلاة إلا المكتوبة». ورأى رسول الله ﷺ رجلا يصلي والمؤذن يقيم لصلاة الصبح، فقال له: «أتصلي الصبح أربعا؟!».", "أما إذا شرع المؤذن في الإقامة بعد شروع المتنفل في صلاته، فإنه يتمها خفيفة؛ لإدراك فضيلة تكبيرة الإحرام، والمبادرة إلى الدخول في الفريضة.", "وذهب بعض أهل العلم: إلى أنه إن كان في الركعة الأولى فإنه يقطعها، وإن كان في الركعة الثانية فإنه يتمها خفيفة، ويلحق بالجماعة."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "صلاة الجماعة في المساجد من:", "o": ["شعائر الإسلام العظيمة", "النوافل غير المهمة", "المباحات", "الأمور الخاصة"], "h": "راجع: ص94 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "أعظم الاجتماعات وأهمها:", "o": ["الاجتماع بعرفة", "اجتماع الجمعة", "اجتماع العيد", "اجتماع الكسوف"], "h": "راجع: ص95 (المسألة الأولى)"}, {"t": "mcq", "d": 1, "q": "صلاة الجماعة أفضل من صلاة الفذ بـ:", "o": ["سبع وعشرين درجة", "خمس وعشرين درجة", "عشر درجات", "درجتين"], "h": "راجع: ص95 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "الفذ معناه:", "o": ["الفرد", "الجماعة", "الإمام", "المأموم"], "h": "راجع: ص95 (المسألة الأولى)"}, {"t": "mcq", "d": 1, "q": "حكم صلاة الجماعة في الصلوات الخمس:", "o": ["واجبة", "سنة", "مستحبة", "مباحة"], "h": "راجع: ص95 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "أثقل الصلاة على المنافقين:", "o": ["صلاة العشاء وصلاة الفجر", "الظهر والعصر", "المغرب", "الجمعة"], "h": "راجع: ص95 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "من وجوه الدلالة في حديث التحريق على وجوب الجماعة: أنه ﷺ وصف المتخلفين عنها بـ:", "o": ["النفاق", "الكفر", "الفسق", "الجهل"], "h": "راجع: ص96 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ للرجل الكفيف: «أتسمع النداء؟» قال: نعم. قال:", "o": ["أجب لا أجد لك رخصة", "صل في بيتك", "لك رخصة", "لا حرج عليك"], "h": "راجع: ص96 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "صلاة الجماعة واجبة على:", "o": ["الرجال دون النساء والصبيان غير البالغين", "النساء", "الصبيان", "الجميع"], "h": "راجع: ص96 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "من ترك الجماعة وصلى وحده بلا عذر:", "o": ["صحت صلاته لكنه آثم", "بطلت صلاته", "لا شيء عليه", "يعيد الصلاة"], "h": "راجع: ص96 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "إذا دخل رجل المسجد وقد صلى فوجد جماعة:", "o": ["يسن له أن يصلي معهم، والثانية نافلة", "يجب عليه إعادتها", "لا تجوز له", "يخرج"], "h": "راجع: ص97 (المسألة الثانية)"}, {"t": "mcq", "d": 1, "q": "أقل الجماعة:", "o": ["اثنان", "ثلاثة", "أربعة", "خمسة"], "h": "راجع: ص97 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "تدرك الجماعة بإدراك:", "o": ["ركعة من الصلاة", "التشهد", "التكبيرة", "السلام"], "h": "راجع: ص97 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "من الأعذار في ترك الجماعة:", "o": ["المريض مرضا يلحقه منه مشقة", "الكسل", "النوم", "السفر للنزهة"], "h": "راجع: ص97 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "من الأعذار: المدافع:", "o": ["أحد الأخبثين", "الغضب", "الجوع فقط", "البرد فقط"], "h": "راجع: ص98 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «لا صلاة بحضرة ____».", "o": ["طعام", "شراب", "ماء", "نوم"], "h": "راجع: ص98 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "من الأعذار التي ذكرها الكتاب:", "o": ["المطر والوحل والثلج وريح باردة شديدة بليلة مظلمة", "الحر الخفيف", "كثرة العمل", "بعد المسجد دون مشقة"], "h": "راجع: ص98 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "لحديث ابن عمر كان المؤذن يقول في الليلة الباردة ذات المطر:", "o": ["ألا صلوا في الرحال", "حي على الصلاة", "الصلاة جامعة", "لا تخرجوا"], "h": "راجع: ص98 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "من الأعذار: خوف:", "o": ["فوات الرفقة في السفر", "فوات النوم", "فوات العمل", "فوات الطعام فقط"], "h": "راجع: ص99 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "إذا تأخر بعض الناس عن جماعة المسجد وفاتتهم الصلاة:", "o": ["يصح أن يصلوا جماعة ثانية في المسجد نفسه", "لا يصح", "يصلون فرادى", "تبطل صلاتهم"], "h": "راجع: ص99 (المسألة السادسة)"}, {"t": "mcq", "d": 2, "q": "لا يجوز إعادة الجماعة في المسجد إذا:", "o": ["كان فيه جماعتان أو أكثر دائما واتخذ الناس ذلك عادة", "كان مسجد سوق", "كان بلا إمام راتب", "كان على طريق"], "h": "راجع: ص99 (المسألة السادسة)"}, {"t": "mcq", "d": 2, "q": "إذا شرع المؤذن في الإقامة لصلاة الفريضة:", "o": ["لا يجوز لأحد أن يبتدئ نافلة", "يجوز أن يبتدئ نافلة", "تلزمه ركعتان", "يسبح"], "h": "راجع: ص100 (المسألة السابعة)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ للرجل الذي يصلي والمؤذن يقيم:", "o": ["أتصلي الصبح أربعا؟!", "اخرج", "أتم صلاتك", "صل في بيتك"], "h": "راجع: ص100 (المسألة السابعة)"}, {"t": "mcq", "d": 2, "q": "إذا شرع المؤذن في الإقامة بعد شروع المتنفل في صلاته:", "o": ["يتمها خفيفة", "يقطعها دائما", "يطولها", "يعيدها"], "h": "راجع: ص100 (المسألة السابعة)"}]}], "sum": [["فضل صلاة الجماعة وحكمها", "ص94-100"], ["إذا دخل الرجل المسجد وقد صلى: هل ي", "ص94-100"], ["أقل ما تنعقد به الجماعة", "ص94-100"], ["بم تدرك الجماعة؟", "ص94-100"]]}, {"id": "l20", "title": "الباب الثامن: في الإمامة في الصلاة", "group": "الكتاب الثاني: الصلاة", "map": {"center": "الباب الثامن\nالصلاة", "nodes": [{"t": "المقصود بالإمامة", "s": []}, {"t": "من أحق بالإمامة؟", "s": []}, {"t": "من تحرم إمامته", "s": []}, {"t": "من تكره إمامته", "s": []}, {"t": "موضع الإمام من المأمومين", "s": []}]}, "paras": [{"t": "الباب الثامن: في الإمامة في الصلاة", "b": [{"pic": ["scroll", "book", "open-book"], "cap": "ص100-106"}, {"story": ["المقصود بالإمامة", ["والمقصود بالإمامة: ارتباط صلاة المؤتم بإمامه."]], "ic": "scroll"}, {"story": ["المسألة الأولى: من أحق بالإمامة؟", ["بين الرسول ﷺ الأحق بالإمامة والأولى بها في قوله: «يؤم القوم أقرؤهم لكتاب الله، فإن كانوا في القراءة سواء، فأعلمهم بالسنة، فإن كانوا في السنة سواء، فأقدمهم هجرة، فإن كانوا في الهجرة سواء، فأقدمهم سلما». فأولى الناس وأحقهم بالإمامة يكون على النحو التالي:", "1- أجودهم قراءة، وهو الذي يتقن قراءة القرآن، ويأتي بها على أكمل وجه، العالم بفقه الصلاة، فإذا اجتمع من هو أجود قراءة ومن هو أقل قراءة منه لكنه أفقه، قدم القارئ الأفقه على القارئ غير الفقيه، فالحاجة إلى الفقه في الصلاة وأحكامها أشد من الحاجة إلى إجادة القراءة.", "2- ثم الأفقه الأعلم بالسنة، فإذا اجتمع إمامان متساويان في القراءة، لكن أحدهما أفقه وأعلم بالسنة، قدم الأفقه؛ لقوله ﷺ: «فإن كانوا في القراءة سواء، فأعلمهم بالسنة».", "3- ثم الأقدم والأسبق هجرة من بلاد الكفر إلى بلاد الإسلام، إذا كانوا في القراءة والعلم بالسنة سواء.", "4- ثم الأقدم إسلاما، إذا كانوا في الهجرة سواء.", "5- ثم الأكبر سنا، إذا استويا في الأمور الماضية كلها، قدم الأكبر سنا؛ لقوله ﷺ في الحديث الماضي: «فإن كانوا في الهجرة سواء، فأقدمهم سلما -وفي رواية: سنا». ولقوله ﷺ: «وليؤمكم أكبركم».", "فإذا استويا في جميع ما سبق قرع بينهما، فمن غلب في القرعة قدم.", "وصاحب البيت أحق بالإمامة من ضيفه، لقوله ﷺ: «لا يؤمن الرجل الرجل في أهله ولا في سلطانه». وكذا السلطان أحق بالإمامة من غيره -وهو الإمام الأعظم- لعموم الحديث الماضي قبل قليل، وكذلك إمام المسجد الراتب أولى من غيره -إلا من السلطان- حتى وإن كان غيره أقرأ منه وأعلم؛ لعموم قوله ﷺ: «لا يؤمن الرجل الرجل في أهله ولا في سلطانه»."]], "ic": "scroll"}, {"note": "حاشية (ص100): وسلما: يعني إسلاما."}, {"story": ["المسألة الثانية: من تحرم إمامته", ["تحرم الإمامة في الحالات الآتية:", "1- إمامة المرأة بالرجل، لعموم قوله ﷺ: «لن يفلح قوم ولوا أمرهم امرأة»، ولأن الأصل تأخرها في آخر الصفوف صيانة لها وسترا، فلو قدمت للإمامة لأصبح ذلك مخالفا لهذا الأصل الشرعي.", "2- إمامة المحدث ومن عليه نجاسة وهو يعلم ذلك؛ فإن لم يعلم بذلك المأمومون حتى انقضت الصلاة، فصلاتهم صحيحة.", "3- إمامة الأمي، وهو من لا يحسن الفاتحة، فلا يقرؤها حفظا ولا تلاوة، أو يدغم فيها من الحروف ما لا يدغم، أو يبدل فيها حرفا بحرف، أو يلحن فيها لحنا يحيل المعنى، فهذا لا تصح إمامته إلا بمثله لعجزه عن ركن الصلاة.", "4- إمامة الفاسق المبتدع، لا تصح الصلاة خلفه إذا كان فسقه ظاهرا، ويدعو إلى بدعة مكفرة لقوله تعالى: ﴿أفمن كان مؤمنا كمن كان فاسقا لا يستوون﴾ [السجدة: 18].", "5- العاجز عن الركوع والسجود والقيام والقعود، فلا تصح إمامته لمن هو أقدر منه على هذه الأمور."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: من تكره إمامته", ["وتكره إمامة كل من:", "1- اللحان: وهو كثير اللحن والخطأ في القراءة، وهذا في غير الفاتحة، أما اللحن في الفاتحة بما يحيل المعنى فلا تصح معه الصلاة، كما مضى، وذلك لقول النبي ﷺ: «يؤم القوم أقرؤهم».", "2- من أم قوما وهم له كارهون، أو يكرهه أكثرهم، لقوله ﷺ: «ثلاثة لا ترتفع صلاتهم فوق رءوسهم شبرا: رجل أم قوما وهم له كارهون...». الحديث.", "3- من يخفي بعض الحروف، ولا يفصح، وكذا من يكرر بعض الحروف، كالفأفاء الذي يكرر الفاء، والتمتام الذي يكرر التاء وغيرهما، وذلك من أجل زيادة الحرف في القراءة."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: موضع الإمام من المأمومين", ["السنة تقدم الإمام على المأمومين، فيقفون خلف الإمام إذا كانوا اثنين فأكثر؛ لأنه ﷺ كان إذا قام إلى الصلاة تقدم وقام أصحابه خلفه. ولمسلم وأبي داود: «أن جابرا وجبارا وقفا، أحدهما عن يمينه والآخر عن يساره فأخذ بأيديهما حتى أقامهما خلفه»، ولقول أنس لما صلى بهم النبي ﷺ في البيت: «ثم يؤم رسول الله ﷺ ونقوم خلفه، فيصلي بنا».", "ويقف الرجل الواحد عن يمين الإمام محاذيا له: «لأنه ﷺ أدار ابن عباس وجابرا إلى يمينه لما وقفا عن يساره». ويصح وقوف الإمام وسط المأمومين؛ لأن ابن مسعود صلى بين علقمة والأسود، وقال: «هكذا رأيت رسول الله ﷺ فعل»، لكن يكون ذلك مقيدا بحال الضرورة، ويكون الأفضل: هو الوقوف خلف الإمام. وتكون النساء خلف صفوف الرجال؛ لحديث أنس ﷺ: «صففت أنا واليتيم وراءه، والعجوز من ورائنا»."]], "ic": "scroll"}, {"story": ["المسألة الخامسة: ما يتحمله الإمام عن المأموم", ["يتحمل الإمام عن المأموم القراءة في الصلاة الجهرية؛ لحديث أبي هريرة مرفوعا: «وإذا قرأ فأنصتوا». ولقوله ﷺ: «من كان له إمام فقراءته له قراءة». أما في السرية فإن الإمام لا يتحمل قراءة الفاتحة عن المأموم."]], "ic": "scroll"}, {"note": "حاشية (ص103): وهو جزء من حديث أوله: «إنما جعل الإمام ليؤتم به...»."}, {"story": ["المسألة السادسة: مسابقة الإمام", ["لا يجوز للمأموم مسابقة إمامه، فمن أحرم قبل إمامه لم تنعقد صلاته؛ لأن شرطه أن يأتي بها بعد إمامه وقد فاته. وعلى المأموم أن يشرع في أفعال الصلاة بعد إمامه؛ لحديث: «إنما جعل الإمام ليؤتم به، فإذا كبر فكبروا، وإذا ركع فاركعوا، وإذا قال: سمع الله لمن حمده، فقولوا: ربنا ولك الحمد، وإذا سجد فاسجدوا».", "فإن وافقه فيها أو في السلام كره لمخالفته السنة، ولم تفسد صلاته؛ لأنه اجتمع معه في الركن. وإن سبقه حرم؛ لقوله ﷺ: «لا تسبقوني بالركوع ولا بالسجود ولا بالقيام». والنهي يقتضي التحريم. وعن أبي هريرة مرفوعا: «أما يخشى الذي يرفع رأسه قبل الإمام، أن يحول الله رأسه رأس حمار؟»."]], "ic": "scroll"}, {"story": ["المسألة السابعة: أحكام متفرقة في الإمامة والجماعة", ["ومن الأحكام المتعلقة بالإمامة والجماعة غير ما تقدم:", "1- استحباب قرب أولي الأحلام والنهى من الإمام: فيقدم أولو الفضل والعقل والحلم والأناة خلف الإمام وقريبا منه؛ لقوله ﷺ: «ليلني منكم أولو الأحلام والنهى ثم الذين يلونهم، ثم الذين يلونهم». والحكمة في ذلك: أن يأخذوا عن الإمام، ويفتحوا عليه في القراءة إذا احتاج إلى ذلك، ويستخلف منهم من شاء إذا نابه شيء في الصلاة.", "2- الحرص على الصف الأول: يستحب للمأمومين أن يتقدموا إلى الصف الأول ويحرصوا عليه ويحذروا من التأخر؛ لقوله ﷺ: «تقدموا فائتموا بي، وليأتم بكم من بعدكم، لا يزال قوم يتأخرون حتى يؤخرهم الله». وقوله ﷺ: «لو يعلم الناس ما في النداء والصف الأول، ثم لم يجدوا إلا أن يستهموا عليه لاستهموا».", "أما النساء فيستحب أن يكن في الصفوف المتأخرة؛ لقوله ﷺ: «خير صفوف الرجال أولها وشرها آخرها، وخير صفوف النساء آخرها، وشرها أولها».", "3- تسوية الصفوف والتراص فيها، وسد الفرج، وإتمام الصف الأول فالأول: يستحب للإمام أن يأمر بتسوية الصفوف وسد الفرج قبل الدخول في الصلاة، على فعله ﷺ ذلك، ولقوله: «سووا صفوفكم، فإن تسوية الصفوف من تمام الصلاة». وعن أنس ﷺ قال: أقيمت الصلاة فأقبل علينا رسول الله ﷺ بوجهه فقال: «أقيموا صفوفكم، وتراصوا، فإني أراكم من وراء ظهري». وقال أنس ﷺ: «كان أحدنا يلزق منكبه بمنكب صاحبه، وقدمه بقدمه».", "ويستحب إتمام الصف الأول فالذي يليه، فإذا كان نقص فليكن في آخر الصفوف؛ لقوله ﷺ: «ألا تصفون كما تصف الملائكة عند ربها؟» فقلنا: يا رسول الله، وكيف تصف الملائكة عند ربها؟ قال: «يتمون الصفوف الأول ويتراصون في الصف».", "4- صلاة المنفرد خلف الصف: لا تصح صلاة الرجل وحده منفردا خلف صف؛ لقوله ﷺ: «لا صلاة لمنفرد خلف الصف». ورأى رسول الله ﷺ رجلا يصلي وحده خلف الصف، فأمره أن يعيد الصلاة."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "المقصود بالإمامة:", "o": ["ارتباط صلاة المؤتم بإمامه", "أداء الصلاة وحده", "الأذان", "الإقامة"], "h": "راجع: ص100 (الباب الثامن)"}, {"t": "mcq", "d": 2, "q": "أول من يقدم للإمامة هو:", "o": ["أجودهم قراءة", "أكبرهم سنا", "أقدمهم إسلاما", "صاحب المال"], "h": "راجع: ص100 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "إذا تساووا في القراءة فمن يقدم؟", "o": ["أعلمهم بالسنة", "أكبرهم", "أصغرهم", "أقدمهم هجرة"], "h": "راجع: ص101 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "إذا استووا في جميع ما سبق:", "o": ["يقرع بينهم", "يقدم الأكبر", "يقدم الأصغر", "يترك الأمر"], "h": "راجع: ص101 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "صاحب البيت:", "o": ["أحق بالإمامة من ضيفه", "الضيف أحق منه", "لا فرق", "لا يؤم"], "h": "راجع: ص101 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "تحرم إمامة:", "o": ["المرأة بالرجل", "الرجل بالمرأة", "الأكبر سنا", "الأقرأ"], "h": "راجع: ص101 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "الأمي هو:", "o": ["من لا يحسن الفاتحة", "من لا يقرأ ولا يكتب", "الأعمى", "الصغير"], "h": "راجع: ص102 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "إمامة المحدث وهو يعلم ذلك:", "o": ["تحرم", "تباح", "تسن", "تكره فقط"], "h": "راجع: ص102 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "تكره إمامة اللحان، وهو:", "o": ["كثير اللحن والخطأ في القراءة", "الأعمى", "الأمي", "الصغير"], "h": "راجع: ص102 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "الفأفاء هو الذي:", "o": ["يكرر الفاء", "يكرر التاء", "لا يفصح", "يخفي الحروف"], "h": "راجع: ص103 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "إذا كان المأمومون اثنين فأكثر:", "o": ["يقفون خلف الإمام", "يقفون عن يمينه", "يقفون عن يساره", "يقفون أمامه"], "h": "راجع: ص103 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "الرجل الواحد يقف:", "o": ["عن يمين الإمام محاذيا له", "خلف الإمام", "عن يساره", "أمامه"], "h": "راجع: ص103 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "النساء يكن:", "o": ["خلف صفوف الرجال", "أمامهم", "بجانبهم", "عن يمين الإمام"], "h": "راجع: ص103 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "يتحمل الإمام عن المأموم القراءة في:", "o": ["الصلاة الجهرية", "الصلاة السرية", "كل الصلوات", "لا يتحمل"], "h": "راجع: ص103 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "من أحرم قبل إمامه:", "o": ["لم تنعقد صلاته", "صحت صلاته", "كره له", "لا شيء عليه"], "h": "راجع: ص104 (المسألة السادسة)"}, {"t": "mcq", "d": 2, "q": "من سبق إمامه بالركوع:", "o": ["يحرم عليه", "يكره له", "يباح", "يسن"], "h": "راجع: ص104 (المسألة السادسة)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «أما يخشى الذي يرفع رأسه قبل الإمام، أن يحول الله رأسه ____».", "o": ["رأس حمار", "رأس كلب", "رأس قرد", "رأس خنزير"], "h": "راجع: ص104 (المسألة السادسة)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «ليلني منكم ____».", "o": ["أولو الأحلام والنهى", "الشباب", "الأغنياء", "الصبيان"], "h": "راجع: ص104 (المسألة السابعة)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «خير صفوف الرجال ____».", "o": ["أولها", "آخرها", "أوسطها", "لا فرق"], "h": "راجع: ص105 (المسألة السابعة)"}, {"t": "mcq", "d": 2, "q": "تسوية الصفوف:", "o": ["من تمام الصلاة", "لا علاقة لها بالصلاة", "مكروهة", "مباحة"], "h": "راجع: ص105 (المسألة السابعة)"}, {"t": "mcq", "d": 2, "q": "صلاة المنفرد خلف الصف:", "o": ["لا تصح", "تصح", "تكره فقط", "تباح"], "h": "راجع: ص105 (المسألة السابعة)"}]}], "sum": [["المقصود بالإمامة", "ص100-106"], ["من أحق بالإمامة؟", "ص100-106"], ["من تحرم إمامته", "ص100-106"], ["من تكره إمامته", "ص100-106"]]}, {"id": "l21", "title": "الباب التاسع: صلاة أهل الأعذار", "group": "الكتاب الثاني: الصلاة", "map": {"center": "الباب التاسع\nالصلاة", "nodes": [{"t": "أهل الأعذار", "s": []}, {"t": "أ- كيفية صلاة المريض", "s": []}, {"t": "أولا: قصر الصلاة الرباعية", "s": []}, {"t": "المسائل الثالثة إلى الخامسة", "s": []}, {"t": "الجمع بين الصلاتين", "s": []}]}, "paras": [{"t": "الباب التاسع: صلاة أهل الأعذار", "b": [{"pic": ["scroll", "book", "open-book"], "cap": "ص106-111"}, {"story": ["أهل الأعذار", ["أهل الأعذار: هم المرضى والمسافرون والخائفون الذين لا يتمكنون من أداء الصلاة، على الصفة التي يؤدى بها غير المعذور، فقد خفف الشارع عنهم، فيصلون حسب استطاعتهم. قال الله تعالى: ﴿وما جعل عليكم في الدين من حرج﴾ [الحج: 78]. وقال تعالى: ﴿لا يكلف الله نفسا إلا وسعها﴾ [البقرة: 286]. وقال تعالى: ﴿فاتقوا الله ما استطعتم﴾ [التغابن: 16]. فكلما وجدت المشقة وجد التيسير."]], "ic": "scroll"}, {"story": ["أ- كيفية صلاة المريض", ["والمريض: هو الذي اعتلت صحة بدنه، سواء كان ذلك كليا أو جزئيا.", "ويلزم المريض أن يصلي المكتوبة قائما على أي صفة كان، ولو على هيئة الراكع لمن بظهره مرض لا يستطيع أن يمد ظهره، أو مستندا إلى جدار أو عمود أو على عصا؛ لقوله ﷺ: «إذا أمرتكم بأمر فأتوا منه ما استطعتم». فإن لم يستطع فقاعدا، فإن لم يستطع فعلى جنبه؛ لقوله ﷺ لعمران بن حصين: «صل قائما، فإن لم تستطع فقاعدا، فإن لم تستطع فعلى جنب». فإن عجز عن ذلك كله صلى على حسب حاله لقوله تعالى: ﴿فاتقوا الله ما استطعتم﴾ [التغابن: 16]. ولا تسقط الصلاة عن المريض ما دام عقله ثابتا، حتى لو صلاها بالإيماء؛ لقدرته على ذلك مع النية.", "ويومئ المريض المصلي جالسا في الركوع والسجود برأسه إيماء، ويجعل السجود أخفض من الركوع، فإذا عجز عن الإيماء برأسه أومأ بعينه."]], "ic": "scroll"}, {"story": ["ب- صلاة المسافر: أولا: قصر الصلاة الرباعية", ["وفيه مسائل:", "المسألة الأولى: في حكم القصر:", "لا خلاف بين أهل العلم في مشروعية قصر الصلاة الرباعية للمسافر، ودليل ذلك: القرآن والسنة والإجماع؛ أما القرآن: فقوله تعالى: ﴿وإذا ضربتم في الأرض فليس عليكم جناح أن تقصروا من الصلاة إن خفتم أن يفتنكم الذين كفروا﴾ [النساء: 101]. والقصر جائز في السفر في حال الخوف وغيره، وقد أمن الناس؛ فقد قال النبي ﷺ لما سئل عن القصر وقد أمن الناس: «صدقة تصدق الله بها عليكم، فاقبلوا صدقته»، ولأن النبي ﷺ وخلفاءه داوموا عليه. فعن ابن عمر ﷺ قال: «إني صحبت رسول الله ﷺ في السفر، فلم يزد على ركعتين حتى قبضه الله، وصحبت أبا بكر، فلم يزد على ركعتين حتى قبضه الله...». ثم ذكر عمر وعثمان ﷺ. وروى أحمد عن ابن عمر مرفوعا: «إن الله يحب أن تؤتى رخصه، كما يكره أن تؤتى معصيته».", "وأما الإجماع: فالقصر من الأمور المعلومة من الدين بالضرورة، وقد أجمعت عليه الأمة.", "وعلى هذا: فالمحافظة على هذه السنة والأخذ بهذه الرخصة أولى وأفضل من تركها، بل كره بعض أهل العلم الإتمام في السفر؛ وذلك لشدة مداومة النبي ﷺ وأصحابه على هذه السنة، وأن ذلك كان هديه المستمر الدائم.", "المسألة الثانية: في تحديد الصلاة التي يجوز فيها القصر:", "الصلاة التي يجوز فيها القصر هي الصلاة الرباعية، وهي صلاة الظهر والعصر والعشاء، ولا تقصر صلاة الصبح ولا المغرب إجماعا؛ لفعله ﷺ وأصحابه من بعده، ولقول عبد الله بن عباس ﷺ: «فرض الله الصلاة على لسان نبيكم ﷺ في الحضر أربعا، وفي السفر ركعتين...». فدل على أن الرباعية هي المقصودة."]], "ic": "scroll"}, {"story": ["ب- صلاة المسافر: المسائل الثالثة إلى الخامسة", ["المسألة الثالثة: في حد السفر الذي تقصر فيه الصلاة ونوعه:", "حد السفر الذي تقصر فيه الصلاة ستة عشر فرسخا تقريبا، وهي أربعة برد، وبالأميال ثمانية وأربعون ميلا، وهو ما يقارب ثمانين كيلو مترا. وهي يومان قاصدان في زمن معتدل بسير الأثقال ودبيب الأقدام.", "وسمى النبي ﷺ يوما وليلة سفرا. وكان ابن عباس وابن عمر يقصران ويفطران في أربعة برد، وهي ستة عشر فرسخا.", "وأما نوعه: فهو السفر المباح كالسفر للتجارة والنزهة، والسفر الواجب؛ كالسفر للحج والجهاد، والسفر المسنون المستحب؛ كالسفر للزيارة، والسفر للمرة الثانية في الحج، وعلى هذا فالسفر المحرم لا يجوز فيه القصر، على رأي كثير من العلماء.", "المسألة الرابعة: هل يقصر من نوى الإقامة؟", "من نوى الإقامة يحتاج إلى تفصيل، وبيان ذلك: أنه إن نوى الإقامة المطلقة لم يقصر؛ لانعدام السبب المبيح للقصر في حقه. كذلك إن نوى الإقامة أكثر من أربعة أيام، أو أقام لحاجة وظن أنه لا تنقضي إلا بعد الأربعة؛ «لأن النبي ﷺ أقام بمكة فصلى بها إحدى وعشرين صلاة يقصر فيها، وذلك أنه قدم صبح رابعة، فأقام إلى يوم التروية، فصلى الصبح، ثم خرج». فمن أقام أربعة أيام أو أقل مثل إقامته ﷺ قصر ومن زاد أتم. ذكره الإمام أحمد. قال أنس: «أقمنا بمكة عشرا نقصر الصلاة». ومعناه كما ذكرنا، لأنه حسب خروجه إلى منى وعرفة وما بعده من العشر. ويقصر إن أقام لحاجة بلا نية الإقامة فوق أربعة أيام، ولا يدري: متى تنقضي؛ أو حبس ظلما أو بمطر ولو أقام سنين. قال ابن المنذر: أجمعوا على أن المسافر يقصر ما لم يجمع إقامة.", "المسألة الخامسة: الحالات التي يجب على المسافر فيها إتمام الصلاة:", "هناك صور وحالات تستثنى من جواز القصر في السفر، منها:", "1- إذا ائتم المسافر بمقيم: فيلزمه الإتمام؛ لقوله ﷺ: «إنما جعل الإمام ليؤتم به»، ولقول ابن عباس ﷺ لما سئل عن الإتمام خلف المقيم: «تلك سنة أبي القاسم ﷺ».", "2- إذا ائتم بمن يشك فيه هل هو مسافر أو مقيم: فإذا دخل في الصلاة خلف إمام ولا يدري أهو مسافر أم مقيم -كأن يكون في المطار ونحوه- فإنه يلزمه الإتمام؛ لأن القصر لابد له من نية جازمة، أما مع التردد فإنه يتم.", "3- إذا ذكر صلاة حضر في السفر، كرجل مسافر، وفي أثناء سفره، تذكر أنه صلى الظهر في بلده، بغير وضوء، أو تذكر صلاة فائتة في الحضر، هنا يلزمه أن يصليها تامة؛ لقوله ﷺ: «من نام عن صلاة، أو نسيها، فليصلها إذا ذكرها». يعني: يصليها كما هي؛ ولأن هذه الصلاة لزمته تامة فيجب عليه قضاؤها تامة.", "4- إذا أحرم المسافر بصلاة يلزمه إتمامها ففسدت وأعادها: كأن يصلي المسافر خلف مقيم فيلزمه في هذه الحالة الإتمام، فإذا فسدت عليه هذه الصلاة، ثم أعادها، لزمه إعادتها تامة؛ لأنها إعادة لصلاة واجبة الإتمام.", "5- إذا نوى المسافر الإقامة المطلقة أو الاستيطان: إذا نوى المسافر الإقامة مطلقة في البلد الذي سافر إليه دون أن يقيد ذلك بزمن معين أو عمل معين."]], "ic": "scroll"}, {"story": ["تتمة المسألة الخامسة، ثانيا: الجمع بين الصلاتين", ["وكذلك إذا نوى اتخاذ هذه البلد وطنا له، فإنه يلزمه إتمام الصلاة؛ لأنه قد انقطع حكم السفر في حقه. فإذا قيد السفر بزمن معين ينتهي، أو عمل ينقضي، فإنه مسافر يقصر الصلاة.", "ثانيا: الجمع بين الصلاتين، وفيه مسائل:", "المسألة الأولى: في مشروعية الجمع بين الصلاتين، ومن يباح له ذلك:", "يباح بالسفر الذي تقصر فيه الصلاة الجمع بين الظهر والعصر، والمغرب والعشاء، في وقت إحداهما؛ لحديث معاذ: «أن النبي ﷺ كان في غزوة تبوك إذا ارتحل قبل زيغ الشمس أخر الظهر حتى يجمعها إلى العصر يصليهما جميعا، وإذا ارتحل بعد زيغ الشمس صلى الظهر والعصر جميعا، ثم سار وكان يفعل مثل ذلك في المغرب والعشاء». وسواء أكان سائرا أم نازلا؛ لأنها رخصة من رخص السفر فلم يعتبر فيها وجود السير كسائر رخصه. إلا أن الأفضل للنازل عدم الجمع؛ لأن النبي ﷺ لم يجمع بمنى وقد كان نازلا.", "ويباح الجمع لمقيم مريض يلحقه بتركه مشقة؛ لقول ابن عباس: «جمع رسول الله ﷺ بين الظهر والعصر، والمغرب والعشاء بالمدينة من غير خوف ولا مطر» وفي رواية: «من غير خوف ولا سفر». فلم يبق إلا عذر المرض، ولأنه ﷺ: «أمر المستحاضة بالجمع بين الصلاتين». والاستحاضة نوع من المرض، وقد قيل لابن عباس في الحديث الماضي: لم فعل ذلك؟ قال: «كي لا يحرج أمته». فمتى لحق الإنسان مشقة وحرج بترك الجمع جاز له الجمع، مريضا كان أو معذورا بغير المرض، مقيما كان أو مسافرا. فمن الأعذار التي تبيح الجمع أيضا غير السفر والمرض:", "1- المطر الكثير الغزير الذي يبل الثياب، ويلحق المكلف بسببه مشقة.", "2- الوحل والطين، وذلك إذا كان يشق على الناس بسببه المشي.", "3- الريح الشديدة الباردة التي تخرج عن العادة، وغير ذلك من الأعذار التي يلحق بالمكلف مشقة إذا ترك الجمع معها.", "المسألة الثانية: في حد الجمع المشروع:", "وحد الجمع المشروع هو الجمع بين صلاة الظهر والعصر، والمغرب والعشاء بالنسبة للمسافر ومن في حكمه، وكذا الجمع في الحضر بسبب المطر وما في حكمه، فيجوز بين العشاءين والظهرين؛ لحديث ابن عباس الماضي قبل قليل، وقد فعله أبو بكر وعمر وعثمان رضي الله عنهم، ولأن العلة من الجمع بين العشاءين وجود المشقة، وهي في الظهرين أيضا."]], "ic": "scroll"}, {"note": "حاشية (ص111): العشاءان: المغرب والعشاء، والظهران: الظهر والعصر، وقد أطلق اسم أحدهما على الآخر تغليبا."}], "q": [{"t": "mcq", "d": 2, "q": "إذا نوى المسافر اتخاذ البلد التي نزل فيها وطنا له:", "o": ["يلزمه إتمام الصلاة", "يقصر الصلاة", "يجمع فقط", "يؤخر الصلاة"], "h": "راجع: ص110 (تتمة المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "في غزوة تبوك كان النبي ﷺ إذا ارتحل قبل زيغ الشمس:", "o": ["أخر الظهر حتى يجمعها إلى العصر", "صلى الظهر ركعتين فقط", "ترك الظهر", "صلى العصر قبل الظهر"], "h": "راجع: ص110 (الجمع بين الصلاتين)"}, {"t": "mcq", "d": 2, "q": "الأفضل للنازل في السفر:", "o": ["عدم الجمع", "الجمع دائما", "ترك الصلاة", "تأخير الصلاة"], "h": "راجع: ص110 (الجمع بين الصلاتين)"}, {"t": "mcq", "d": 2, "q": "ما قاله ابن عباس عن سبب جمع النبي ﷺ بالمدينة:", "o": ["كي لا يحرج أمته", "للخوف", "للمطر", "للسفر"], "h": "راجع: ص110 (الجمع بين الصلاتين)"}, {"t": "mcq", "d": 1, "q": "من الأعذار التي تبيح الجمع غير السفر والمرض:", "o": ["المطر الكثير الغزير الذي يبل الثياب", "كثرة العمل", "النوم", "الكسل"], "h": "راجع: ص111 (الأعذار المبيحة للجمع)"}, {"t": "mcq", "d": 2, "q": "يجوز الجمع في الحضر بسبب المطر بين:", "o": ["العشاءين والظهرين", "الفجر والظهر", "العصر والمغرب", "كل الصلوات"], "h": "راجع: ص111 (المسألة الثانية)"}, {"t": "tf", "d": 1, "q": "الاستحاضة نوع من المرض كما ورد في النص.", "a": true, "h": "راجع: ص110 (المسألة الأولى)"}]}], "sum": [["أهل الأعذار", "ص106-111"], ["أ- كيفية صلاة المريض", "ص106-111"], ["أولا: قصر الصلاة الرباعية", "ص106-111"], ["المسائل الثالثة إلى الخامسة", "ص106-111"]]}, {"id": "l22", "title": "الباب العاشر: في صلاة الجمعة", "group": "الكتاب الثاني: الصلاة", "map": {"center": "الباب العاشر\nالصلاة", "nodes": [{"t": "في صلاة الجمعة", "s": []}, {"t": "حكمها ودليل ذلك", "s": []}, {"t": "على من تجب؟", "s": []}, {"t": "وقتها", "s": []}, {"t": "الخطبة", "s": []}]}, "paras": [{"t": "الباب العاشر: في صلاة الجمعة", "b": [{"pic": ["scroll", "book", "open-book"], "cap": "ص111-117"}, {"story": ["الباب العاشر: في صلاة الجمعة", ["وفيه مسائل:"]], "ic": "scroll"}, {"story": ["المسألة الأولى: حكمها ودليل ذلك", ["الجمعة فرض عين على الرجال، لقوله سبحانه: ﴿يا أيها الذين آمنوا إذا نودي للصلاة من يوم الجمعة فاسعوا إلى ذكر الله وذروا البيع﴾ [الجمعة: 9]، ولقوله ﷺ: «رواح الجمعة واجب على كل محتلم».", "وقوله ﷺ: «لينتهين أقوام عن ودعهم الجمعات، أو ليختمن الله على قلوبهم، ثم ليكونن من الغافلين».", "قال النووي رحمه الله: «فيه أن الجمعة فرض عين». وللحديث الآتي بعد قليل، وفيه: «الجمعة حق واجب على كل مسلم...»."]], "ic": "scroll"}, {"story": ["المسألة الثانية: على من تجب؟", ["تجب الجمعة على كل مسلم ذكر حر بالغ عاقل، قادر على إتيانها، مقيم، فلا تجب على: عبد مملوك أو امرأة أو صبي أو مجنون أو مريض أو مسافر؛ لقوله ﷺ: «الجمعة حق واجب على كل مسلم في جماعة إلا أربعة: عبد مملوك، أو امرأة، أو صبي، أو مريض». وأما المسافر فلا تلزمه الجمعة؛ لأن النبي ﷺ لم يكن يصليها في أسفاره، وقد وافق يوم عرفة في حجته جمعة، ومع ذلك صلاها ظهرا وجمع العصر معها. أما المسافر الذي ينزل بلدا تقام فيه الجمعة فإنه يصليها مع المسلمين. وإذا حضرها العبد أو المرأة أو الصبي أو المريض أو المسافر صحت منه، وأجزأته عن صلاة الظهر."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: وقتها", ["وقت الجمعة هو وقت الظهر، من بعد الزوال إلى أن يصير ظل الشيء كطوله؛ لحديث أنس بن مالك ﷺ أن النبي ﷺ كان يصلي الجمعة حين تميل الشمس. وهو المروي عن أصحاب النبي ﷺ من فعلهم. وعلى هذا فمن أدرك ركعة منها قبل خروج وقتها فقد أدركها، وإلا صلاها ظهرا؛ لقوله ﷺ: «من أدرك ركعة من الصلاة، فقد أدرك الصلاة». وقد تقدم."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: الخطبة", ["الخطبة ركن من أركان الجمعة لا تصح إلا بها؛ لمواظبته ﷺ عليها وعدم تركه لها أبدا. وهما خطبتان، يشترط لصحة صلاة الجمعة أن تتقدما على الصلاة."]], "ic": "scroll"}, {"story": ["المسألة الخامسة: في سنن الخطبة", ["ويسن الدعاء للمسلمين بما فيه صلاح دينهم ودنياهم، مع الدعاء لولاة أمور المسلمين بالصلاح والتوفيق؛ لأنه ﷺ «كان إذا خطب يوم الجمعة دعا، وأشار بأصبعه، وأمن الناس»، وأن يتولاهما مع الصلاة واحد، ويرفع صوته بهما حسب الطاقة، وأن يخطب قائما لقوله تعالى: ﴿وتركوك قائما﴾ [الجمعة: 11]. وقال جابر بن سمرة رضي الله عنه: «كان رسول الله ﷺ يخطب قائما ثم يجلس ثم يقوم فيخطب، فمن حدثك أنه يخطب جالسا فقد كذب»، وأن يكون على منبر أو مكان مرتفع؛ لأنه ﷺ «كان يخطب على منبره». وهو مرتفع، ولأن ذلك أبلغ في الإعلام، وأبلغ في الوعظ. وأن يجلس بين الخطبتين قليلا؛ لقول ابن عمر رضي الله عنهما: «كان النبي ﷺ يخطب خطبتين وهو قائم يفصل بينهما بجلوس».", "ويسن قصر الخطبتين، والثانية أقصر من الأولى؛ لحديث عمار مرفوعا: «إن طول صلاة الرجل، وقصر خطبته، مئنة من فقهه، فأطيلوا الصلاة، واقصروا الخطبة». والمئنة: العلامة.", "ويسن أن يسلم الخطيب على المأمومين إذا أقبل عليهم؛ لقول جابر: «كان رسول الله ﷺ إذا صعد المنبر سلم». ويسن أن يجلس على المنبر إلى فراغ المؤذن؛ لقول ابن عمر: «كان النبي ﷺ يجلس إذا صعد المنبر حتى ينفرغ المؤذن ثم يقوم فيخطب». ويسن أن يعتمد الخطيب على عصا ونحوها، ويسن للخطيب أن يقصد تلقاء وجهه لفعله ﷺ ذلك."]], "ic": "scroll"}, {"story": ["المسألة السادسة: ما يحرم فعله في الجمعة", ["يحرم الكلام والإمام يخطب؛ لقوله ﷺ: «من تكلم يوم الجمعة والإمام يخطب، فهو كالحمار يحمل أسفارا...»، ولقوله ﷺ: «إذا قلت لصاحبك أنصت والإمام يخطب فقد لغوت» أي: تكلمت باللغو، وهو الكلام الباطل المردود.", "ويحرم تخطي رقاب الناس أثناء الخطبة؛ لقوله ﷺ لرجل رآه يتخطى الرقاب: «اجلس فقد آذيت»؛ ففيه أذية للمصلين، وإشغال لهم عن سماع الخطبة، أما الإمام فلا بأس بتخطيه الرقاب إلا إذا لم يمكنه الوصول إلى مكانه إلا بذلك. ويكره التفريق بين اثنين لقوله ﷺ: «من اغتسل يوم الجمعة... ثم راح فلم يفرق بين اثنين، فصلى ما كتب له... غفر له ما بينه وبين الجمعة الأخرى»."]], "ic": "scroll"}, {"story": ["المسألة السابعة: بم تدرك الجمعة؟", ["تدرك الجمعة بإدراك ركعة مع الإمام؛ فعن أبي هريرة مرفوعا: «من أدرك من الجمعة ركعة فقد أدرك الصلاة». وإن أدرك أقل من ركعة صلى ظهرا."]], "ic": "scroll"}, {"story": ["المسألة الثامنة: في نافلة الجمعة", ["ليس لصلاة الجمعة سنة قبلها، ولكن من صلى قبلها نافلة مطلقة قبل دخول وقتها فلا بأس به؛ لترغيب النبي ﷺ في ذلك، كما في حديث سلمان الماضي قبل قليل: «من اغتسل يوم الجمعة... ثم راح فلم يفرق بين اثنين، فصلى ما كتب له»، ولفعل الصحابة، ولفضيلة صلاة النافلة. ولا ينكر عليه إذا ترك؛ لأن السنة الراتبة تكون بعد الجمعة بركعتين أو أربع ركعات أو ست ركعات؛ لفعله ﷺ وأمره، فقد «كان يصلي بعد الجمعة ركعتين». وقال ﷺ: «إذا صلى أحدكم الجمعة، فليصل بعدها أربع ركعات». وفي رواية: «من كان منكم مصليا بعد الجمعة فليصل أربعا».", "وأما الست: فلأنه ورد عن ابن عمر رضي الله عنهما «أن النبي ﷺ كان يصلي بعد الجمعة ستا». وكان ابن عمر يفعله.", "فتبين من ذلك أن أقل الراتبة بعد الجمعة ركعتان، وأكثرها ست. ويرى شيخ الإسلام ابن تيمية رحمه الله: أن الراتبة إن صليت في المسجد صليت أربعا، إن صليت في البيت صليت ركعتين، فتكون صلاتها على أحوال متنوعة."]], "ic": "scroll"}, {"story": ["المسألة التاسعة: كيفية صلاة الجمعة", ["صلاة الجمعة ركعتان يجهر فيهما بالقراءة؛ لأنه ﷺ كان يفعل ذلك، وفعله من سنته، وقد أجمع أهل العلم على ذلك. ويسن أن يقرأ في الركعة الأولى سورة الجمعة بعد الفاتحة، وفي الثانية بسورة المنافقون، أو يقرأ في الأولى بسورة الأعلى، وفي الثانية بسورة الغاشية؛ لفعله ﷺ."]], "ic": "scroll"}, {"story": ["المسألة العاشرة: في سنن الجمعة", ["1- يسن التبكير إلى الصلاة للحصول على الأجر الكبير، ففي حديث أبي هريرة أن رسول الله ﷺ قال: «من اغتسل يوم الجمعة غسل الجنابة، ثم راح في الساعة الأولى، فكأنما قرب بدنة. ومن راح في الساعة الثانية، فكأنما قرب بقرة، ومن راح في الساعة الثالثة، فكأنما قرب كبشا أقرن، ومن راح في الساعة الرابعة، فكأنما قرب دجاجة، ومن راح في الساعة الخامسة، فكأنما قرب بيضة. فإذا خرج الإمام، حضرت الملائكة، يستمعون الذكر».", "وقال أيضا: «من غسل يوم الجمعة واغتسل، وبكر وابتكر، كان له بكل خطوة يخطوها أجر سنة صيامها وقيامها».", "2- ويسن الاغتسال في يومها؛ لحديث أبي هريرة الماضي: «من اغتسل يوم الجمعة غسل الجنابة...» وينبغي الحرص عليه وعدم تركه، وبخاصة لأصحاب الروائح الكريهة. ومن العلماء من أوجبه؛ لحديث أبي سعيد الخدري مرفوعا: «غسل الجمعة واجب على كل محتلم». ولعل القول بوجوبه أقوى وأحوط، وأنه لا يسقط إلا لعذر.", "3- ويسن التطيب والتنظف، وإزالة ما ينبغي إزالته من الجسم؛ كتقليم الأظافر وغيره.", "والتنظف أمر زائد على الاغتسال، ويكون ذلك بقطع الروائح الكريهة وأسبابها، كالشعور التي أمر الشارع بإزالتها، والأظافر، ويسن حلق العانة، ونتف الإبط، وتقليم الأظفار، وحف الشارب، مع التطيب، لحديث سلمان مرفوعا: «لا يغتسل رجل يوم الجمعة، ويتطهر ما استطاع من طهر، ويدهن من دهنه، أو يمس من طيب بيته...».", "قال ابن حجر: «من طهر: والمراد بالمبالغة في التنظيف، ويؤخذ من عطفه على الغسل... أن المراد به التنظيف بأخذ الشارب والظفر والعانة».", "4- ويسن له أن يلبس أحسن الثياب؛ لحديث ابن عمر: «أن عمر ابن الخطاب رضي الله عنه، رأى حلة سيراء عند باب المسجد، فقال: يا رسول الله لو اشتريت هذه فلبستها يوم الجمعة وللوفود إذا قدموا عليك». فقد استدل به البخاري رحمه الله على لبس أحسن الثياب للجمعة، فقال: «باب يلبس أحسن ما يجد». قال الحافظ ابن حجر: «ووجه الاستدلال به من جهة تقريره ﷺ لعمر على أصل التجمل للجمعة»، ولقوله ﷺ: «ما على أحدكم لو اشترى ثوبين ليوم الجمعة، سوى ثوبي مهنته». أي: ثوب خدمته وشغله.", "5- ويسن في يومها وليلتها الإكثار من الصلاة على النبي ﷺ؛ لقوله ﷺ: «أكثروا من الصلاة علي يوم الجمعة».", "6- ويسن أن يقرأ في فجرها في الصلاة بسورتي السجدة، والإنسان؛ لمواظبته ﷺ على ذلك. وفي يومها بسورة الكهف لقوله ﷺ: «من قرأ سورة الكهف يوم الجمعة سطع له نور من تحت قدمه إلى عنان السماء يضيء به يوم القيامة، وغفر له ما بين الجمعتين».", "7- ويسن لمن دخل المسجد يوم الجمعة ألا يجلس حتى يصلي ركعتين؛ لأمره ﷺ بذلك، ويجوز فيهما إذا كان الإمام يخطب.", "8- ويسن أن يكثر من الدعاء، ويتحرى ساعة الإجابة؛ لقوله ﷺ: «إن في الجمعة ساعة لا يوافقها عبد مسلم، وهو قائم يصلي، يسأل الله شيئا، إلا أعطاه إياه»."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "حكم صلاة الجمعة على الرجال:", "o": ["فرض عين", "سنة", "مستحبة", "فرض كفاية"], "h": "راجع: ص111 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "ممن لا تجب عليهم الجمعة:", "o": ["العبد المملوك والمرأة والصبي والمريض", "الرجل الحر المقيم", "كل مسلم عاقل بالغ مقيم", "الإمام"], "h": "راجع: ص112 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "وقت الجمعة:", "o": ["وقت الظهر من بعد الزوال", "بعد العصر", "قبل الفجر", "بعد المغرب"], "h": "راجع: ص112 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "الخطبة في الجمعة:", "o": ["ركن لا تصح الجمعة إلا بها", "سنة تركها جائز", "مكروهة", "مباحة"], "h": "راجع: ص112 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "عدد خطبتي الجمعة:", "o": ["خطبتان", "خطبة واحدة", "ثلاث خطب", "أربع خطب"], "h": "راجع: ص112 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "المئنة في حديث عمار معناها:", "o": ["العلامة", "الطول", "القصر", "الدعاء"], "h": "راجع: ص113 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "يسن في الخطبتين:", "o": ["أن تكون الثانية أقصر من الأولى", "أن تكون الثانية أطول", "ترك الجلوس بينهما", "الخطبة جالسا"], "h": "راجع: ص113 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "قال النبي ﷺ لمن قال لصاحبه أنصت والإمام يخطب:", "o": ["فقد لغوت", "فقد أصبت", "فقد أجرت", "فقد صمت"], "h": "راجع: ص113 (المسألة السادسة)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ لرجل رآه يتخطى الرقاب:", "o": ["اجلس فقد آذيت", "تقدم", "صل ركعتين", "أحسنت"], "h": "راجع: ص114 (المسألة السادسة)"}, {"t": "mcq", "d": 2, "q": "تدرك الجمعة بإدراك:", "o": ["ركعة مع الإمام", "التشهد فقط", "الخطبة الثانية فقط", "تكبيرة الإحرام فقط"], "h": "راجع: ص114 (المسألة السابعة)"}, {"t": "mcq", "d": 2, "q": "أقل الراتبة بعد الجمعة:", "o": ["ركعتان", "ركعة", "أربع ركعات", "ست ركعات"], "h": "راجع: ص115 (المسألة الثامنة)"}, {"t": "mcq", "d": 2, "q": "أكثر الراتبة بعد الجمعة كما في النص:", "o": ["ست", "اثنتان", "ثمان", "عشر"], "h": "راجع: ص115 (المسألة الثامنة)"}, {"t": "mcq", "d": 2, "q": "صلاة الجمعة:", "o": ["ركعتان يجهر فيهما بالقراءة", "أربع ركعات سرية", "ركعتان سريتان", "ثلاث ركعات"], "h": "راجع: ص115 (المسألة التاسعة)"}, {"t": "mcq", "d": 2, "q": "يسن في الركعة الأولى من الجمعة بعد الفاتحة:", "o": ["سورة الجمعة", "سورة الكافرون", "سورة الإخلاص", "سورة الناس"], "h": "راجع: ص115 (المسألة التاسعة)"}, {"t": "mcq", "d": 2, "q": "في حديث أبي هريرة من راح في الساعة الأولى فكأنما قرب:", "o": ["بدنة", "بقرة", "كبشا أقرن", "بيضة"], "h": "راجع: ص115 (المسألة العاشرة)"}, {"t": "mcq", "d": 2, "q": "من راح في الساعة الخامسة فكأنما قرب:", "o": ["بيضة", "دجاجة", "بقرة", "بدنة"], "h": "راجع: ص115 (المسألة العاشرة)"}, {"t": "mcq", "d": 2, "q": "يسن أن يقرأ في فجر الجمعة بسورتي:", "o": ["السجدة والإنسان", "الكافرون والإخلاص", "الفلق والناس", "الأعلى والغاشية"], "h": "راجع: ص117 (المسألة العاشرة)"}, {"t": "mcq", "d": 2, "q": "من قرأ سورة الكهف يوم الجمعة:", "o": ["غفر له ما بين الجمعتين", "غفر له سنة", "أعطي بدنة", "كتب له صيام يوم"], "h": "راجع: ص117 (المسألة العاشرة)"}, {"t": "mcq", "d": 2, "q": "لمن دخل المسجد يوم الجمعة والإمام يخطب:", "o": ["ألا يجلس حتى يصلي ركعتين", "يجلس فورا", "ينتظر الخطبة واقفا", "يخرج"], "h": "راجع: ص117 (المسألة العاشرة)"}, {"t": "tf", "d": 1, "q": "الجمعة تصح من المسافر إذا حضرها وتجزئه عن الظهر.", "a": true, "h": "راجع: ص112 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "ليس لصلاة الجمعة سنة قبلها كما ورد في النص.", "a": true, "h": "راجع: ص114 (المسألة الثامنة)"}]}], "sum": [["في صلاة الجمعة", "ص111-117"], ["حكمها ودليل ذلك", "ص111-117"], ["على من تجب؟", "ص111-117"], ["وقتها", "ص111-117"]]}, {"id": "l23", "title": "الباب الحادي عشر: في صلاة الخوف", "group": "الكتاب الثاني: الصلاة", "map": {"center": "الباب الحادي عشر\nالصلاة", "nodes": [{"t": "في صلاة الخوف", "s": []}, {"t": "حكمها، ودليل مشروعيتها، وشروطها", "s": []}, {"t": "كيفية صلاة الخوف", "s": []}]}, "paras": [{"t": "الباب الحادي عشر: في صلاة الخوف", "b": [{"pic": ["scroll", "book", "open-book"], "cap": "ص117-119"}, {"story": ["الباب الحادي عشر: في صلاة الخوف", ["وفيه مسائل:", "هذا هو العذر الثالث من الأعذار التي تختلف بها الصلاة في هيئتها، أو عددها، وقد تقدم الكلام على عذر المرض والسفر."]], "ic": "scroll"}, {"story": ["المسألة الأولى: حكمها، ودليل مشروعيتها، وشروطها", ["1- حكمها:", "صلاة الخوف تشرع في كل قتال مباح، كقتال الكفار والبغاة والمحاربين؛ لقوله تعالى: ﴿إن خفتم أن يفتنكم الذين كفروا﴾ [النساء: 101]. وقيس عليه الباقي، ممن يجوز قتاله.", "وتشرع عند الخوف من هجوم العدو، أو الهرب من عدو إن كان الهرب مباحا. ويدخل في العدو كل عدو - آدميا أو سبعا - مما يخاف الإنسان على نفسه منه، كالصائل الذي يريد أهله أو ماله، والغريم الظالم وغير ذلك.", "2- دليل مشروعيتها:", "والدليل على مشروعيتها: الكتاب والسنة والإجماع؛ أما الكتاب: فقوله تعالى: ﴿وإذا كنت فيهم فأقمت لهم الصلاة فلتقم طائفة منهم معك وليأخذوا أسلحتهم فإذا سجدوا فليكونوا من ورائكم ولتأت طائفة أخرى لم يصلوا فليصلوا معك وليأخذوا حذرهم وأسلحتهم﴾ [النساء: 102]. وصلاها رسول الله ﷺ، وأجمع الصحابة على فعلها.", "3- شروطها:", "وتشرع صلاة الخوف بشرطين:", "الشرط الأول: أن يكون العدو ممن يحل قتاله، كقتال الكفار، والبغاة، والمحاربين، كما سبق.", "والشرط الثاني: أن يخاف هجومه على المسلمين حال الصلاة."]], "ic": "scroll"}, {"story": ["المسألة الثانية: كيفية صلاة الخوف", ["جاءت صلاة الخوف على عدة صفات، ومنها الصفة الواردة عن النبي ﷺ في حديث سهل بن أبي حثمة الأنصاري رضي الله عنه، وهي أشبه بالصفة المذكورة في القرآن الكريم، وفيها احتياط للصلاة، واحتياط للحرب، وفيها نكاية بالعدو.", "وقد فعل - عليه الصلاة والسلام - هذه الصلاة في غزوة ذات الرقاع، وصفتها كما رواها سهل: «أن طائفة صفت مع النبي ﷺ وطائفة وجاه العدو، فصلى بالتي معه ركعة، ثم ثبت قائما، وأتموا لأنفسهم، ثم انصرفوا وصفوا وجاه العدو، وجاءت الطائفة الأخرى، فصلى بهم الركعة التي بقيت من صلاته، ثم ثبت جالسا، وأتموا لأنفسهم، ثم سلم بهم»."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 2, "q": "تشرع صلاة الخوف في:", "o": ["كل قتال مباح", "كل سفر", "كل مرض", "كل سفر محرم"], "h": "راجع: ص118 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "من الأمثلة التي ذكرها الكتاب لمن يحل قتالهم:", "o": ["الكفار والبغاة والمحاربون", "الأطفال", "الضيوف", "الجيران"], "h": "راجع: ص118 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "من أدلة مشروعية صلاة الخوف:", "o": ["الكتاب والسنة والإجماع", "القياس فقط", "العادة", "العرف"], "h": "راجع: ص118 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "عدد شروط صلاة الخوف:", "o": ["شرطان", "شرط واحد", "ثلاثة شروط", "أربعة شروط"], "h": "راجع: ص118 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "الشرط الثاني لصلاة الخوف:", "o": ["أن يخاف هجومه على المسلمين حال الصلاة", "أن يكون السفر طويلا", "أن يكون الوقت ليلا", "أن يكون العدد كبيرا"], "h": "راجع: ص118 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "الصفة التي في الكتاب وردت في حديث:", "o": ["سهل بن أبي حثمة الأنصاري", "أبي هريرة", "عائشة", "ابن عباس"], "h": "راجع: ص118 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "فعل النبي ﷺ هذه الصلاة في غزوة:", "o": ["ذات الرقاع", "بدر", "أحد", "حنين"], "h": "راجع: ص119 (المسألة الثانية)"}, {"t": "tf", "d": 1, "q": "يدخل في العدو الذي تشرع بسببه صلاة الخوف السبع الذي يخاف منه الإنسان على نفسه.", "a": true, "h": "راجع: ص118 (المسألة الأولى)"}]}], "sum": [["في صلاة الخوف", "ص117-119"], ["حكمها، ودليل مشروعيتها، وشروطها", "ص117-119"], ["كيفية صلاة الخوف", "ص117-119"]]}, {"id": "l24", "title": "الباب الثاني عشر: في صلاة العيدين", "group": "الكتاب الثاني: الصلاة", "map": {"center": "الباب الثاني عشر\nالصلاة", "nodes": [{"t": "في صلاة العيدين", "s": []}, {"t": "حكمها، ودليل ذلك", "s": []}, {"t": "شروطها", "s": []}, {"t": "المواضع التي تصلى فيها", "s": []}, {"t": "وقتها", "s": []}]}, "paras": [{"t": "الباب الثاني عشر: في صلاة العيدين", "b": [{"pic": ["scroll", "book", "open-book"], "cap": "ص119-122"}, {"story": ["الباب الثاني عشر: في صلاة العيدين", ["وفيه مسائل:", "والعيدان هما: عيد الأضحى وعيد الفطر، وكلاهما له مناسبة شرعية، فعيد الفطر بمناسبة انتهاء المسلمين من صيام شهر رمضان، والأضحى بمناسبة ختام عشر ذي الحجة، وسمي عيدا؛ لأنه يعود، ويتكرر في وقته."]], "ic": "scroll"}, {"story": ["المسألة الأولى: حكمها، ودليل ذلك", ["صلاة العيد فرض كفاية، إذا قام بها البعض سقط الإثم عن الباقين، وإذا تركت من الكل أثم الجميع؛ لأنها من شعائر الإسلام الظاهرة، ولأنه ﷺ داوم عليها، وكذلك أصحابه من بعده. وقد أمر النبي ﷺ بها حتى النساء، إلا أنه أمر الحيض باعتزال المصلى، وهذا مما يدل على أهميتها، وعظيم فضلها؛ لأنه إذا أمر بها النساء مع أنهن لسن من أهل الاجتماع فالرجال من باب أولى. ومن أهل العلم من يقوي كونها فرض عين."]], "ic": "scroll"}, {"story": ["المسألة الثانية: شروطها", ["ومن أهم شروطها: دخول الوقت، ووجود العدد المعتبر، والاستيطان.", "فلا تجوز قبل وقتها، ولا تجوز في أقل من ثلاثة أشخاص، ولا تجب على مسافر غير المستوطن."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: المواضع التي تصلى فيها", ["يسن أن تصلى في الصحراء خارج البنيان؛ لحديث أبي سعيد: «كان النبي ﷺ يخرج في الفطر والأضحى إلى المصلى»، والقصد من ذلك - والله أعلم - إظهار هذه الشعيرة، وإبرازها. ويجوز صلاتها في المسجد الجامع، من عذر كالمطر والريح الشديدة، ونحو ذلك."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: وقتها", ["ووقتها كصلاة الضحى بعد ارتفاع الشمس قدر رمح إلى وقت الزوال؛ لأنه ﷺ وخلفاءه كانوا يصلونها بعد ارتفاع الشمس، ولأن ما قبل ارتفاع الشمس وقت نهي. ويسن تعجيل الأضحى في أول وقتها، وتأخير الفطر؛ لفعله ﷺ، ولأن الناس في حاجة إلى تعجيل الأضحى لذبح الأضاحي، وهم في حاجة إلى امتداد وقت صلاة الفطر ليتسع لأداء زكاة الفطر."]], "ic": "scroll"}, {"story": ["المسألة الخامسة: صفتها وما يقرأ فيها", ["وصفتها: ركعتان قبل الخطبة؛ لقول عمر: «صلاة الفطر والأضحى ركعتان ركعتان، تمام غير قصر على لسان نبيكم. وقد خاب من افترى».", "يكبر في الأولى بعد تكبيرة الإحرام والاستفتاح، وقبل التعوذ ستا، وفي الثانية قبل القراءة خمسا، غير تكبيرة القيام. لحديث عائشة مرفوعا: «التكبير في الفطر والأضحى في الأولى سبع تكبيرات، وفي الثانية خمس تكبيرات سوى تكبيرتي الركوع». ويرفع يديه مع كل تكبيرة؛ لأن النبي ﷺ «كان يرفع يديه مع التكبير»، ثم يقرأ بعد الاستعاذة جهرا بغير خلاف، ويقرأ الفاتحة، وفي الأولى بسبح اسم ربك الأعلى. وفي الثانية بالغاشية؛ لقول سمرة: «كان ﷺ يقرأ في العيدين ﴿سبح اسم ربك الأعلى﴾ و﴿هل أتاك حديث الغاشية﴾»، وصح عنه ﷺ أنه كان يقرأ في الأولى بـ ﴿ق والقرآن المجيد﴾، وفي الثانية: ﴿اقتربت الساعة وانشق القمر﴾، فيراعى الإتيان بهذا مرة، وهذا مرة، عملا بالسنة، مع مراعاة ظروف المصلين، فيأخذهم بالأرفق."]], "ic": "scroll"}, {"story": ["المسألة السادسة: موضع الخطبة", ["موضع الخطبة في صلاة العيد بعد الصلاة؛ لقول ابن عمر: «كان النبي ﷺ وأبو بكر، وعمر يصلون العيدين قبل الخطبة»."]], "ic": "scroll"}, {"story": ["المسألة السابعة: قضاء العيد", ["لا يسن لمن فاتته صلاة العيد قضاؤها؛ لعدم ورود الدليل عن النبي ﷺ بذلك، ولأنها صلاة ذات اجتماع معين، فلا تشرع إلا على هذا الوجه."]], "ic": "scroll"}, {"story": ["المسألة الثامنة: سننها", ["1- يسن أن تؤدى صلاة العيد في مكان بارز واسع، خارج البلد، يجتمع فيه المسلمون لإظهار هذه الشعيرة، وإذا صليت في المسجد لعذر فلا بأس بذلك.", "2- ويسن تقديم صلاة الأضحى وتأخير صلاة الفطر، كما تقدم بيان ذلك عند الكلام على وقتها.", "3- وأن يأكل قبل الخروج لصلاة الفطر تمرات، وألا يطعم يوم النحر حتى يصلي؛ لفعله ﷺ، فكان لا يخرج يوم الفطر حتى يفطر على تمرات يأكلهن وترا. ولا يطعم يوم النحر حتى يصلي.", "4- ويسن التكبير في الخروج لصلاة العيد بعد صلاة الصبح ماشيا؛ ليتمكن من الدنو من الإمام، وتحصل له فضيلة انتظار الصلاة.", "5- ويسن أن يتجمل المسلم، ويغتسل، ويلبس أحسن الثياب، ويتطيب.", "6- ويسن أن يخطب في صلاة العيد بخطبة جامعة شاملة لجميع أمور الدين، ويحثهم على زكاة الفطر، ويبين لهم ما يخرجون، ويرغبهم في الأضحية، ويبين لهم أحكامها، ويكون للنساء فيها نصيب؛ لأنهن في حاجة لذلك واقتداء بالنبي ﷺ، فقد أتى النساء بعد فراغه من الصلاة والخطبة فوعظهن وذكرهن. ويكون بعد الصلاة كما سبق.", "7- ويسن كثرة الذكر بالتكبير والتهليل لقوله تعالى: ﴿ولتكملوا العدة ولتكبروا الله على ما هداكم ولعلكم تشكرون﴾ [البقرة: 185]، ويجهر به الرجال في البيوت والمساجد والأسواق، ويسر النساء.", "8- مخالفة الطريق، فيذهب إلى العيد من طريق، ويرجع من طريق آخر؛ لحديث جابر: «كان النبي ﷺ إذا كان يوم عيد خالف الطريق». وقيل في الحكمة من ذلك: ليشهد له الطريقان جميعا، وقيل: لإظهار شعيرة الإسلام فيهما، وقيل غير ذلك.", "ولا بأس بتهنئة الناس بعضهم بعضا يوم العيد، بأن يقول لغيره: تقبل الله منا ومنك صالح الأعمال، فكان يفعله أصحاب النبي ﷺ، مع إظهار البشاشة والفرح في وجه من يلقاه."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "العيدان هما:", "o": ["عيد الأضحى وعيد الفطر", "عيد الفطر والجمعة", "عيد الأضحى ويوم عرفة", "الجمعة والأضحى"], "h": "راجع: ص119 (الباب الثاني عشر)"}, {"t": "mcq", "d": 2, "q": "عيد الفطر بمناسبة:", "o": ["انتهاء المسلمين من صيام شهر رمضان", "ختام عشر ذي الحجة", "الحج", "الهجرة"], "h": "راجع: ص119 (الباب الثاني عشر)"}, {"t": "mcq", "d": 2, "q": "حكم صلاة العيد كما في النص:", "o": ["فرض كفاية", "سنة مؤكدة فقط", "مباحة", "مكروهة"], "h": "راجع: ص119 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "أمر النبي ﷺ الحيض في العيد:", "o": ["باعتزال المصلى", "بالصلاة في الصف الأول", "بالبقاء في البيوت", "بالصيام"], "h": "راجع: ص119 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "من أهم شروط صلاة العيد:", "o": ["دخول الوقت ووجود العدد المعتبر والاستيطان", "المطر", "السفر", "الليل"], "h": "راجع: ص119 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "يسن أن تصلى صلاة العيد في:", "o": ["الصحراء خارج البنيان", "داخل البيوت", "الأسواق", "المقابر"], "h": "راجع: ص120 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "وقت صلاة العيد:", "o": ["بعد ارتفاع الشمس قدر رمح إلى الزوال", "قبل الفجر", "بعد العصر", "عند الغروب"], "h": "راجع: ص120 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "يسن في العيد:", "o": ["تعجيل الأضحى وتأخير الفطر", "تعجيل الفطر وتأخير الأضحى", "تأخيرهما معا", "تعجيلهما معا"], "h": "راجع: ص120 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "عدد ركعات صلاة العيد:", "o": ["ركعتان", "أربع", "ثلاث", "ركعة"], "h": "راجع: ص120 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "التكبير في الأولى من العيد مع تكبيرة الإحرام:", "o": ["سبع تكبيرات", "خمس تكبيرات", "ثلاث تكبيرات", "تسع تكبيرات"], "h": "راجع: ص120 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "التكبير في الثان y": ["الباب الثالث عشر: في صلاة الاستسقاء", ["وفيه مسائل:"]], "ic": "scroll"}, {"story": ["المسألة الأولى: تعريفها، وحكمها ودليل ذلك", ["1- تعريفها: الاستسقاء هو طلب السقي من الله تعالى عند حاجة العباد إليه، على صفة مخصوصة؛ وذلك إذا أجدبت الأرض، وقحط المطر؛ لأنه لا يسقي ولا ينزل الغيث إلا الله وحده.", "2- حكمها: حكم صلاة الاستسقاء أنها سنة مؤكدة؛ لقول عبد الله بن زيد: «خرج رسول الله ﷺ يستسقي فتوجه إلى القبلة، يدعو وحول رداءه، وصلى ركعتين، جهر فيهما بالقراءة»."]], "ic": "scroll"}, {"story": ["المسألة الثانية: سببها", ["وسببها القحط، وهو احتباس المطر؛ لأن النبي ﷺ كان يفعلها لذلك."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: وقتها وكيفيتها", ["وقت صلاة الاستسقاء وصفتها كصلاة العيد، لقول ابن عباس: «صلى النبي ﷺ ركعتين كما يصلي في العيدين». فيستحب فعلها في المصلى، كصلاة العيد، وتصلى ركعتين، ويجهر بالقراءة فيها كصلاة العيد، وتكون قبل الخطبة، وكذلك في عدد التكبيرات وما يقرأ فيها. ويجوز الاستسقاء على أي صفة كانت، فيدعو إنسان، ويستسقي في صلاته إذا سجد، ويستسقي الإمام على المنبر في صلاة جمعة، فقد استسقى النبي ﷺ على المنبر يوم الجمعة."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: الخروج إليها", ["إذا أراد الإمام الخروج لها وعظ الناس، وأمرهم بالتوبة، والخروج من مظالم، وترك التباغض والتشاحن؛ لأنه سبب في منع الخير من الله سبحانه، لأن المعاصي سبب القحط، والتقوى سبب البركات.", "قال تعالى: ﴿ولو أن أهل القرى آمنوا واتقوا لفتحنا عليهم بركات من السماء والأرض ولكن كذبوا فأخذناهم بما كانوا يكسبون﴾ [الأعراف: 96]. ويتنظف لها، ولا يتطيب، ولا يلبس الزينة؛ لأنه يوم استكانة وخشوع، ويخرج متواضعا، متخشعا، متذللا، متضرعا؛ لقول ابن عباس: «خرج النبي ﷺ للاستسقاء متذللا، متواضعا، متخشعا، متضرعا»."]], "ic": "scroll"}, {"story": ["المسألة الخامسة: الخطبة فيها", ["يسن أن يخطب الإمام في صلاة الاستسقاء بخطبة واحدة بعد الصلاة، تكون جامعة وشاملة، يأمر فيها بالتوبة، وكثرة الصدقة، والرجوع إلى الله، وترك المعاصي.", "وينبغي أن يكثر في الخطبة من الاستغفار، وقراءة الآيات التي تأمر به، ويكثر من الدعاء بطلب الغيث كقوله تعالى: «اللهم أغثنا»، وقوله: «اللهم اسقنا غيثا مغيثا، مريئا مريعا، عاجلا غير آجل، نافعا غير ضار».", "ومعنى مريئا: سهلا طيبا، ومريعا: مخصبا. وقوله: «اللهم أنت الله لا إله إلا أنت، أنت الغني ونحن الفقراء، أنزل علينا الغيث، واجعل ما أنزلت لنا قوة وبلاغا إلى حين». ونحو ذلك، ويرفع يديه؛ لأن النبي ﷺ كان يفعل ذلك، حتى كان يرى بياض إبطيه؛ ويرفع الناس أيديهم؛ لأن النبي ﷺ لما رفع يديه يستسقي في صلاة الجمعة، رفع الناس أيديهم. ويكثر من الصلاة على النبي ﷺ؛ لأن ذلك من أسباب الإجابة."]], "ic": "scroll"}, {"story": ["المسألة السادسة: السنن التي ينبغي فعلها فيها", ["1- أن يكثر من الدعاء المأثور عن النبي ﷺ في ذلك، ويستقبل القبلة في آخر الدعاء، ويحول رداءه، فيجعل اليمين على الشمال والشمال على اليمين. وكذلك ما شابه الرداء كالعباءة ونحوها. فقد ثبت أن النبي ﷺ حول إلى الناس ظهره، واستقبل القبلة يدعو، ثم حول رداءه. وقيل: الحكمة من تحويل الرداء التفاؤل بتحويل الحال عما هي عليه.", "2- يسن أن يخرج إلى صلاة الاستسقاء جميع المسلمين، حتى النساء والصبيان.", "3- يسن الخروج إليها بخضوع، وخشوع، وتذلل، فقد خرج النبي ﷺ للاستسقاء متذللا، متواضعا، متخشعا، متضرعا.", "4- يسن عند نزول المطر أن يقف في أوله ليصيبه منه ويقول: «اللهم صيبا نافعا». والصيب: المنهمر المتدفق. ويقول: «مطرنا بفضل الله ورحمته».", "5- وإذا كثر المطر، وخيف من الضرر، يسن أن يقول: «اللهم حوالينا ولا علينا، اللهم على الظراب والآكام وبطون الأودية ومنابت الشجر». والظراب: جبال الصغار. والآكام: جمع أكمة، وهي التل، وهو ما اجتمع من الحجارة في مكان واحد."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "الاستسقاء هو:", "o": ["طلب السقي من الله تعالى عند حاجة العباد إليه", "طلب الرزق", "طلب العلم", "طلب الشفاء"], "h": "راجع: ص122 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "يكون الاستسقاء إذا:", "o": ["أجدبت الأرض وقحط المطر", "كثر المطر", "كسفت الشمس", "جاء العيد"], "h": "راجع: ص123 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "حكم صلاة الاستسقاء:", "o": ["سنة مؤكدة", "واجبة", "محرمة", "مباحة"], "h": "راجع: ص123 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "سبب صلاة الاستسقاء:", "o": ["القحط وهو احتباس المطر", "الخوف", "الكسوف", "السفر"], "h": "راجع: ص123 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "صفة صلاة الاستسقاء كصفة صلاة:", "o": ["العيد", "الجمعة", "الكسوف", "الخوف"], "h": "راجع: ص123 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "قال الله تعالى: ﴿ولو أن أهل القرى آمنوا واتقوا لفتحنا عليهم ____ من السماء والأرض﴾", "o": ["بركات", "رحمات", "مطرا", "أنهارا"], "h": "راجع: ص123 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "المعاصي سبب:", "o": ["القحط", "البركات", "المطر", "الخير"], "h": "راجع: ص123 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "عدد خطب الاستسقاء:", "o": ["خطبة واحدة بعد الصلاة", "خطبتان قبل الصلاة", "ثلاث", "لا خطبة"], "h": "راجع: ص124 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "معنى «مريعا» في الدعاء:", "o": ["مخصبا", "سهلا", "نافعا", "عاجلا"], "h": "راجع: ص124 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "من سنن الاستسقاء بعد الدعاء:", "o": ["تحويل الرداء", "خلع النعلين", "الصيام", "الأكل"], "h": "راجع: ص124 (المسألة السادسة)"}, {"t": "mcq", "d": 2, "q": "يقول عند نزول المطر:", "o": ["اللهم صيبا نافعا", "اللهم حوالينا ولا علينا", "اللهم اسقنا", "اللهم اجعله عذابا"], "h": "راجع: ص125 (المسألة السادسة)"}, {"t": "mcq", "d": 2, "q": "عند كثرة المطر وخوف الضرر يقول:", "o": ["اللهم حوالينا ولا علينا", "اللهم صيبا نافعا", "اللهم أغثنا", "اللهم زدنا"], "h": "راجع: ص125 (المسألة السادسة)"}, {"t": "tf", "d": 1, "q": "الصيب معناه المنهمر المتدفق.", "a": true, "h": "راجع: ص125 (المسألة السادسة)"}, {"t": "tf", "d": 2, "q": "ينبغي لمن خرج للاستسقاء أن يتطيب ويلبس الزينة.", "a": false, "h": "راجع: ص124 (المسألة الرابعة)"}]}], "sum": [["في صلاة الاستسقاء", "ص122-125"], ["تعريفها، وحكمها ودليل ذلك", "ص122-125"], ["سببها", "ص122-125"], ["وقتها وكيفيتها", "ص122-125"]]}, {"id": "l26", "title": "الباب الرابع عشر: في صلاة الكسوف", "group": "الكتاب الثاني: الصلاة", "map": {"center": "الباب الرابع عشر\nالصلاة", "nodes": [{"t": "في صلاة الكسوف", "s": []}, {"t": "تعريف الكسوف والحكمة منه", "s": []}, {"t": "حكم صلاة الكسوف ودليلها", "s": []}, {"t": "وقتها", "s": []}, {"t": "كيفيتها وما يقرأ فيها", "s": []}]}, "paras": [{"t": "الباب الرابع عشر: في صلاة الكسوف", "b": [{"pic": ["scroll", "book", "open-book"], "cap": "ص125-127"}, {"story": ["الباب الرابع عشر: في صلاة الكسوف", ["وفيه مسائل:"]], "ic": "scroll"}, {"story": ["المسألة الأولى: تعريف الكسوف والحكمة منه", ["الكسوف: هو انحجاب ضوء أحد النيرين - الشمس والقمر - بسبب غير معتاد، والكسوف والخسوف بمعنى واحد. ويحدث الله - عز وجل - ذلك تخويفا لعباده حتى يرجعوا إليه سبحانه، كما قال ﷺ: «إن الشمس والقمر آيتان من آيات الله، لا يخسفان لموت أحد ولا لحياته، وإنما يخوف الله بهما عباده»."]], "ic": "scroll"}, {"story": ["المسألة الثانية: حكم صلاة الكسوف ودليلها", ["وصلاة الكسوف واجبة على ما صرح به أبو عوانة في صحيحه، وحكي عن أبي حنيفة، وأجراها مالك مجرى الجمعة، وقوى ابن القيم رحمه الله القول بوجوبها، وأيده الشيخ ابن عثيمين؛ وذلك لأن النبي ﷺ أمر بها، وخرج فزعا إليها، وأخبر أنها تخويف للعباد."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: وقتها", ["وقتها من ابتداء الكسوف إلى ذهابه لقوله ﷺ: «إذا رأيتم شيئا من ذلك فصلوا حتى ينجلي»."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: كيفيتها وما يقرأ فيها", ["وكيفيتها: ركعتان. يقرأ في الأولى جهرا -ليلا كانت أو نهارا- الفاتحة، وسورة طويلة، ثم يركع طويلا، ثم يرفع، فيسمع، ويحمد، ولا يسجد. بل يقرأ الفاتحة وسورة طويلة دون الأولى، ثم يركع، ثم يرفع، ثم يسجد سجدتين طويلتين، ثم يصلي الثانية كالأولى، لكن دونها في كل ما يفعل، ثم يتشهد ويسلم.", "لقول جابر: «كسفت الشمس على عهد رسول الله ﷺ في يوم شديد الحر فصلى بأصحابه، فأطال القيام حتى جعلوا يخرون، ثم ركع فأطال، ثم رفع فأطال، ثم ركع فأطال، ثم سجد سجدتين، ثم قام فصنع نحوا من ذلك فكانت أربع ركعات، وأربع سجدات».", "ويسن أن يعظ الإمام الناس بعد صلاة الكسوف ويحذرهم من الغفلة والاغترار بالدنيا ويأمرهم بالإكثار من الدعاء والاستغفار؛ لفعل النبي ﷺ، فقد خطب الناس بعد الصلاة وقال: «إن الشمس والقمر آيتان من آيات الله، لا ينكسفان لموت أحد ولا لحياته، فإذا رأيتم ذلك فادعوا الله وكبروا، وصلوا وتصدقوا».", "فإذا انتهت الصلاة قبل الانجلاء فلا تعاد، بل يذكر الله، ويكثر من دعائه؛ لقوله ﷺ: «فصلوا، وادعوا حتى يكشف ما بكم». فدل على أنه إن سلم من صلاة قبل الانجلاء تشاغل بالدعاء. وإذا تم الانجلاء وهو في الصلاة أتمها خفيفة، ولا يقطعها."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "الكسوف هو:", "o": ["انحجاب ضوء أحد النيرين الشمس والقمر بسبب غير معتاد", "طلوع الشمس", "غروب الشمس", "هطول المطر"], "h": "راجع: ص125 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "يحدث الله الكسوف:", "o": ["تخويفا لعباده", "لموت عظيم", "لحياة أحد", "للزينة"], "h": "راجع: ص125 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: الشمس والقمر آيتان من آيات الله لا يخسفان:", "o": ["لموت أحد ولا لحياته", "للمطر", "للريح", "للسفر"], "h": "راجع: ص125 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "حكم صلاة الكسوف كما في النص:", "o": ["واجبة", "مكروهة", "مباحة", "محرمة"], "h": "راجع: ص126 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "وقت صلاة الكسوف:", "o": ["من ابتداء الكسوف إلى ذهابه", "بعد الظهر فقط", "الليل فقط", "بعد المغرب"], "h": "راجع: ص126 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "عدد ركعات صلاة الكسوف:", "o": ["ركعتان", "أربع", "ثلاث", "ركعة"], "h": "راجع: ص126 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "القراءة في صلاة الكسوف:", "o": ["جهرا ليلا كانت أو نهارا", "سرا", "جهرا ليلا فقط", "بلا قراءة"], "h": "راجع: ص126 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "عدد السجدات في صلاة الكسوف حسب حديث جابر:", "o": ["أربع سجدات", "سجدتان", "ست", "ثمان"], "h": "راجع: ص126 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "بعد صلاة الكسوف يسن للإمام:", "o": ["أن يعظ الناس", "الانصراف دون كلام", "إعادة الصلاة", "الصيام"], "h": "راجع: ص126 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "إذا انتهت الصلاة قبل الانجلاء:", "o": ["فلا تعاد بل يذكر الله ويكثر من الدعاء", "تعاد", "يصلي ركعتين", "يغادر"], "h": "راجع: ص126 (المسألة الرابعة)"}, {"t": "tf", "d": 1, "q": "إذا تم الانجلاء وهو في الصلاة أتمها خفيفة ولا يقطعها.", "a": true, "h": "راجع: ص127 (المسألة الرابعة)"}]}], "sum": [["في صلاة الكسوف", "ص125-127"], ["تعريف الكسوف والحكمة منه", "ص125-127"], ["حكم صلاة الكسوف ودليلها", "ص125-127"], ["وقتها", "ص125-127"]]}, {"id": "l27", "title": "الباب الخامس عشر: في صلاة الجنازة وأحكام الجنائز", "group": "الكتاب الثاني: الصلاة", "map": {"center": "الباب الخامس عشر\nالصلاة", "nodes": [{"t": "في صلاة الجنازة وأحكام الجنائز", "s": []}, {"t": "حكم غسل الميت وكيفيته", "s": []}, {"t": "من يتولى الغسل", "s": []}, {"t": "حكم تكفينه وكيفيته", "s": []}, {"t": "الصلاة على الميت، حكمها ودليل ذلك", "s": []}]}, "paras": [{"t": "الباب الخامس عشر: في صلاة الجنازة وأحكام الجنائز", "b": [{"pic": ["scroll", "book", "open-book"], "cap": "ص127-136"}, {"story": ["الباب الخامس عشر: في صلاة الجنازة وأحكام الجنائز", ["وفيه مسائل:", "الجنائز: جمع جنازة -بفتح الجيم وكسرها- بمعنى واحد. وقيل: بالفتح اسم للميت، وبالكسر اسم لما يحمل عليه.", "وينبغي للإنسان أن يتذكر الموت ونهايته في هذه الدنيا، فيستعد لذلك بالعمل الصالح، والتزود للآخرة، والتوبة من المعاصي، والخروج من المظالم. ويسن عيادة المريض، وتذكيره التوبة والوصية، وإذا احتضر يسن تلقينه (لا إله إلا الله) وتوجيهه للقبلة، فإذا مات سن تغميضه، والإسراع بتجهيزه ودفنه."]], "ic": "scroll"}, {"story": ["المسألة الأولى: حكم غسل الميت وكيفيته", ["1- حكمه: غسل الميت واجب؛ لأمره ﷺ به، كما في قوله ﷺ في المحرم الذي وقصته ناقته: «اغسلوه بماء وسدر». وقوله ﷺ في ابنته زينب رضي الله عنها: «اغسلنها ثلاثا، أو خمسا أو سبعا». وهو فرض كفاية إجماعا.", "2- كيفية الغسل: ينبغي أن يختار لتغسيل الموتى من هو ثقة عدل عارف بأحكام الغسل، ويقدم في التغسيل الوصي، ثم الأقرب فالأقرب، كالأب والجد والابن إذا كانوا عارفين بأحكام الغسل، وإلا قدم غيرهم ممن هو عالم بذلك.", "والرجل يغسله الرجال، والمرأة تغسلها النساء، ولكل واحد من الزوجين تغسيل الآخر، فالرجل يغسل زوجته والمرأة تغسل زوجها. ولكل من الرجال والنساء تغسيل الأطفال دون سن السابعة. ولا يجوز للمسلم رجلا كان أو امرأة تغسيل الكافر، ولا حمل جنازته ولا تكفينه، ولا الصلاة عليه، ولو كان قريبا كالأب والأم.", "ويشترط أن يكون الماء الذي يغسل به الميت طهورا مباحا، وأن يغسل في مكان مستور، ولا ينبغي حضور من لا علاقة له بتغسيل الميت.", "وصفة الغسل: هي أن يضعه على سرير غسله، ثم يستر عورته، ثم يجرده من ثيابه، ويواريه عن العيون في حجرة أو نحوها، ثم يرفع الغاسل رأس الميت إلى قرب جلوسه، ثم يمرر يده على بطنه ويعصره، ثم ينظف الخرجين، وينجي الميت، فيغسل ما على الخرجين من نجاسة، وذلك بلف خرقة على يده، ثم ينوي الغسل، ويسمي، ويوضئه كوضوء الصلاة، إلا في المضمضة والاستنشاق، فيكفي المسح على الفم والأنف، ثم يغسل رأسه ولحيته بماء السدر، أو صابون، أو غير ذلك، ثم يغسل الميامن ثم المياسر، ثم يكمل غسل باقي الجسم. ويستحب أن يلف على يده خرقة حال التغسيل، والواجب غسلة واحدة إذا حصل بها الإنقاء، والمستحب ثلاث غسلات، وإن حصل الإنقاء.", "ويستحب أن يجعل في الغسلة الأخيرة كافورا، ثم ينشف الميت، ويزيل عنه ما يشرع إزالته من الأظافر والشعور، ويضفر شعر المرأة، ويسدل من ورائها.", "وإذا تعذر غسل الميت لعدم وجود الماء، أو كان مقطع الجسم بحرق ونحوه، فإنه ييمم بالتراب، ويستحب لمن غسل ميتا أن يغتسل بعد تغسيله."]], "ic": "scroll"}, {"story": ["المسألة الثانية: من يتولى الغسل", ["الأفضل أن يتولى غسل الميت من هو أعرف بسنة الغسل من الثقات الأمناء العدول، ولا سيما إذا كان من أهله وأقاربه؛ لأن الذين تولوا غسله ﷺ كانوا من أهله كعلي رضي الله عنه وغيره. وأولى الناس بغسله: وصيه الذي أوصى أن يغسله، ثم أبوه ثم جده، ثم الأقرب فالأقرب من عصباته، ثم ذوو أرحامه.", "ويجب أن يتولى غسل الذكر الرجال، والأنثى النساء، ويستثنى من ذلك الزوجان فإنه يجوز لكل واحد منهما غسل الآخر؛ لحديث عائشة رضي الله عنها: «لو كنت استقبلت من أمري ما استدبرت، ما غسل النبي ﷺ غير نسائه».", "وقال النبي ﷺ لعائشة: «لو مت قبلي لغسلتك وكفنتك»، وغسلت أسماء بنت عميس زوجها أبا بكر الصديق رضي الله عنه.", "ولا يغسل شهيد المعركة؛ لأن النبي ﷺ «أمر بقتلى أحد أن يدفنوا في ثيابهم، ولم يغسلوا ولم يصل عليهم». وكذلك لا يكفن، ولا يصلى عليه، بل يدفن بثيابه، كما في الحديث السابق.", "والسقط -وهو الولد يسقط من بطن أمه قبل تمامه-: إذا بلغ أربعة أشهر غسل، وكفن، وصلي عليه؛ لأنه بعد أربعة أشهر يكون إنسانا."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: حكم تكفينه وكيفيته", ["وتكفينه واجب لقوله ﷺ في المحرم الذي وقصته راحلته: «وكفنوه في ثوبين». والواجب ستر جميع البدن، فإن لم يوجد إلا ثوب قصير لا يكفي جميع البدن غطي رأسه، وجعل على رجليه شيء من الإذخر؛ لقول خباب في قصة تكفين مصعب بن عمير رضي الله عنه: «فأمرنا النبي ﷺ أن نغطي رأسه، وأن نجعل على رجليه من الإذخر». ولا يغطى رأس المحرم الذي ذكر؛ لقوله ﷺ: «ولا تخمروا رأسه». ويكون ذلك بثوب لا يصف البشرة ساترا، ويجب أن يكون من ملبوس مثله؛ لأنه لا إجحاف على الميت ولا على ورثته. والسنة تكفين الرجل في ثلاث لفائف بيض من قطن، تبسط على بعضها، ويوضع عليها مستلقيا، ثم يرد طرف العليا من الجانب الأيسر على شقه الأيمن، ثم طرفها الأيمن على الأيسر، ثم الثانية، ثم الثالثة، ثم يجعل الزائد عند رأسه ثم يعقد. فلو كان الزائد أكثر جعل عند قدميه كذلك ويعقد. فإن ذلك أثبت للكفن؛ لقول عائشة رضي الله عنها: «كفن رسول الله ﷺ في ثلاثة أثواب بيض سحولية، جدد يمانية، ليس فيها قميص ولا عمامة؛ أدرج فيها إدراجا». ولقوله ﷺ: «البسوا من ثيابكم البياض فإنها من خير ثيابكم، وكفنوا فيها موتاكم». والأنثى خمسة أثواب من قطن: إزار وخمار وقميص، ولفافتين. والصبي في ثوب واحد، ويباح في ثلاثة، والصغيرة في قميص ولفافتين."]], "ic": "scroll"}, {"note": "حاشية (ص130): سحولية: بضم المهملتين، جمع سحل، وهو الثوب الأبيض النقي ولا يكون إلا من القطن، ويروى بفتح السين أيضا، منسوب إلى (سحول) قرية باليمن."}, {"story": ["المسألة الرابعة: الصلاة على الميت، حكمها ودليل ذلك", ["الصلاة على الميت فرض كفاية، إذا فعلها البعض سقط الإثم عن الباقين.", "ودليلها: قوله ﷺ فيمن مات وعليه دين: «صلوا على صاحبكم». وقوله ﷺ يوم موت النجاشي: «إن أخا لكم قد مات، فقوموا فصلوا عليه»."]], "ic": "scroll"}, {"story": ["المسألة الخامسة: شروط الصلاة على الميت وأركانها وسننها", ["1- شروطها: وشروطها كالآتي: النية، والتكليف، واستقبال القبلة، وستر العورة، واجتناب النجاسة؛ لأنها من الصلوات، وحضور الميت بين يدي المصلي، إن كان بالبلد، وإسلام المصلي والمصلى عليه، وطهارتهما ولو بتراب لعذر.", "2- أركانها: وأركانها كالآتي: القيام من قادر في فرضها؛ لأنها صلاة وجب القيام فيها كالمفروضة. والتكبيرات الأربع. (لأن النبي ﷺ كبر على النجاشي أربعا). وقراءة الفاتحة لعموم حديث: «لا صلاة لمن لم يقرأ بأم القرآن». والصلاة على النبي ﷺ والدعاء للميت؛ لقوله ﷺ: «إذا صليتم على الميت فأخلصوا له الدعاء». والسلام لعموم حديث «وتحليلها التسليم»، والترتيب بين الأركان فلا يقدم ركن على الآخر.", "3- سننها: ومن سننها: رفع اليدين مع كل تكبيرة، والاستعاذة قبل القراءة، وأن يدعو لنفسه وللمسلمين، والإسرار بالقراءة."]], "ic": "scroll"}, {"story": ["المسألة السادسة: وقت الصلاة على الميت وفضلها وكيفيتها", ["1- وقتها: وقت الصلاة على الميت يبدأ بعد تغسيله، وتكفينه، وتجهيزه، إن كان حاضرا، أو بلوغ خبر وفاته إن كان غائبا.", "2- فضلها: قال ﷺ: «من شهد الجنازة حتى يصلى عليها فله قيراط، ومن شهدها حتى تدفن فله قيراطان» قيل: وما القيراطان؟ قال: «مثل الجبلين العظيمين».", "3- كيفيتها: يقوم الإمام والمنفرد عند رأس الرجل، ووسط المرأة، لثبوت ذلك من فعله ﷺ فيما رواه عنه أنس رضي الله عنه، ويتعوذ بعد تكبير، ثم يسمي، ثم يقرأ الفاتحة سرا، ولو كان ذلك بالليل، ثم يكبر ويصلي على النبي ﷺ كما يصلي في التشهد، ثم يكبر، ويدعو للميت بالدعاء الوارد عن النبي ﷺ ومنه قوله ﷺ: «اللهم اغفر لحينا وميتنا، وشاهدنا وغائبنا، وصغيرنا وكبيرنا، وذكرنا وأنثانا، اللهم من أحييته منا فأحيه على الإسلام، ومن توفيته منا فتوفه على الإيمان». «اللهم اغفر له وارحمه وعافه واعف عنه، وأكرم نزله، ووسع مدخله، واغسله بالماء والثلج والبرد، ونقه من الذنوب والخطايا كما ينقى الثوب الأبيض من الدنس، وأبدله دارا خيرا من داره، وأهلا خيرا من أهله، وزوجا خيرا من زوجه، وأدخله الجنة وأعذه من عذاب القبر -أو عذاب النار-».", "وإن كان الميت صغيرا قال: «اللهم اجعله سلفا لوالديه، وفرطا وأجرا»، ثم يكبر، ويقف بعدها قليلا. وإن دعا بما تيسر فحسن كأن يقول: «اللهم لا تحرمنا أجره، ولا تفتنا بعده». ثم يسلم تسليمة واحدة عن يمينه، وإن سلم تسليمتين فلا بأس به. ومن فاته بعض الصلاة دخل مع الإمام، وإذا سلم قضى ما فاته على صفته. ومن فاتته الصلاة قبل الدفن فله أن يصلي على القبر؛ لفعله ﷺ ذلك في قصة المرأة التي كانت تقم المسجد.", "ويصلى على الغائب عن البلد عند العلم بوفاته ولو بشهر أو أكثر. ويصلى على السقط إذا تم له أربعة أشهر فأكثر، وإن كان أقل من ذلك فلا يصلى عليه."]], "ic": "scroll"}, {"story": ["المسألة السابعة: حمل الجنازة والسير بها", ["يسن اتباع الجنازة وتشييعها إلى القبر، لقوله ﷺ: «من شهد الجنازة حتى يصلى عليها فله قيراط، ومن شهدها حتى تدفن فله قيراطان»، قيل: وما القيراطان؟ قال: «مثل الجبلين العظيمين».", "وينبغي للمسلم إذا علم بوفاة أحد من المسلمين أن يخرج لحمل جنازته والصلاة عليه ودفنه؛ لقوله ﷺ: «حق المسلم على المسلم خمس: رد السلام، وعيادة المريض، واتباع الجنائز...». ويتأكد ذلك إذا لم يخرج أحد في جنازته. ولا بأس بحملها في سيارة أو على دابة، ولا
