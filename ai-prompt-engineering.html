        if (p && Array.isArray(p.qs) && p.qs.length && p.qs.every(id => QBYID[id])) { openExam(+key.slice(1), 'fwd', null, p); return true; }
      } else if (LEVELS.some(l => l.id === key)) { openLevel(key, 'fwd', null, p); return true; }
    } catch (e) { /* موضع تالف: نتجاهله */ }
    stopTimer(); closeSheet(); SES = null; S.at = null; delete S.pos[key]; save();
    return false;
  }

  function renderStep(dir) {
    const st = curStep(); let html = '';
    stopTimer();
    if (st.k === 'map') html = stepMap();
    else if (st.k === 'ex') html = stepEx();
    else if (st.k === 'q') html = stepQ();
    else if (st.k === 'sum') html = stepSum();
    else if (st.k === 'done') html = stepDone();
    else if (st.k === 'examintro') html = stepExamIntro();
    SES.slide = swapIn(SES.screen.querySelector('.stage'), 'slide', html, dir);
    const f = SES.screen.querySelector('.prog-f'); const pct = Math.round(SES.idx / (SES.steps.length - (SES.kind === 'exam' ? 0 : 1)) * 100);
    f.style.width = pct + '%'; SES.screen.querySelector('.prog').setAttribute('aria-valuenow', pct);
    SES.screen.querySelector('.hearts').classList.toggle('hide', !(st.k === 'ex' || st.k === 'q'));
    renderHearts(-1);
    if (st.k === 'q') startTimer();
    if (st.k === 'done') { celebrate(SES.slide.querySelector('.done-hero')); const b = SES.slide.querySelector('[data-count]'); setTimeout(() => countUp(b, 0, +b.dataset.count), 1300); }
    /* استكمال Question محفوظ: المحاولات السابقة والوقت المتبقي والقلوب كما كانت */
    const re = SES.re; SES.re = null;
    if (re && st.k === 'q') {
      const c = SES.cur;
      if (c.tries > 0) timerState('miss');
      else if (re.dl) { const left = Math.min(c.q.sec * 1000, re.dl - Date.now()); c.deadline = performance.now() + left; if (left <= 0) timerState('late'); }

  function renderHearts(breakIdx) {

  }

  /* ----- map step ----- */
  /* تنقّل حر بين فقرات المحطة: القراءة مفتوحة دائماً، وأسئلة كل فقرة تُفتح بعد إتمام قراءتها */
  function paraNav(cur) {
    if (!SES || SES.kind !== 'level') return '';

    return '<nav class="pnav" aria-label="فقرات المحطة">' + ps.map((pa, i) => {
      const ok = pa.q.length && pa.q.every(q => S.q[q.id]);

    }).join('') + '</nav>';
  }
  function stepMap() {
    const lv = SES.lv; const hasResume = !!S.pos[lv.id];

      '<h2 class="h-display grad-text">' + esc(lv.title) + '</h2><p class="lede">Station Map: ' + paraWord(lv.paras.length) + '، وبعد كل فقرة أسئلة لا تنتقل قبل أن تجيبها صحيحة. جاوب قبل ما الـ timer يخلص وهتاخد <b>double XP</b>.</p>' + radial(lv.map) + paraNav(-1) + '</div>' +
      '<div class="foot">' + (hasResume
        ? '<button class="btn btn-main" data-act="resume">أكمل من حيث توقفت ' + IC.arrow + '</button><button class="btn btn-link" data-act="next">ابدأ Station من الأول</button>'
        : '<button class="btn btn-main" data-act="next">Start Learning ' + IC.arrow + '</button>') + '</div>';

  /* ----- explanation step ----- */
  function stepEx() {
    const st = curStep(); const p = SES.lv.paras[st.p]; const rv = !!SES.revisit[st.p];

    return '<div class="body ex">' + paraNav(st.p) + '<div class="eyebrow">Paragraph ' + ar(st.p + 1) + ' من ' + ar(SES.lv.paras.length) + (rv ? ' · مراجعة' : '') + '</div>' +
      '<h2 class="stitle">' + md(p.t) + '</h2>' + (rv ? '<div class="revisit">' + mascot('idle') + '<span>اقرأ Paragraph بتمهل، ثم أعد المحاولة؛ ستعود القلوب كاملة وتتغير الأسئلة في ترتيبها.</span></div>' : '') +
      '<div class="blocks">' + p.b.slice(0, SES.reveal).map(block).join('') + '</div>' +

  }
  function revealMore(all) {
    const st = curStep(); const p = SES.lv.paras[st.p]; if (SES.reveal >= p.b.length) return;
    const wrap = SES.slide.querySelector('.blocks'); const body = SES.slide.querySelector('.body');

  /* ----- question step ----- */
  function stepQ() {
    const st = curStep(); const q = getQ(st);
    const c = SES.cur = { q, solved: false, tries: (SES.re && SES.re.tries) || 0, busy: false, val: '' };
    if (q.t === 'mcq' || q.t === 'fill') c.ord = shuffle(q.o.map((_, i) => i));
    if (q.t === 'order') { let pool = shuffle(q.o.map((_, i) => i)); for (let g = 0; g < 6 && pool.every((v, i) => v === i); g++) pool = shuffle(pool); c.pool = pool; c.placed = q.o.map(() => null); c.locked = new Set(); }
    if (q.t === 'match') { c.tOrd = shuffle(q.o.map((_, i) => i)); c.dOrd = shuffle(q.o.map((_, i) => i)); c.sel = { t: null, d: null }; c.matched = 0; }

      '<div class="qtimer" data-z="a" role="timer" aria-label="وقت النجوم المضاعفة"><span class="qt-rw">' + IC.star + '<b>' + (q.base * 2) + '</b><em>×2</em></span><div class="qt-bar"><i></i></div><span class="qt-msg"></span></div>' +
      '<div class="qcard"><div class="qtext">' + qText(q) + '</div>' + (q.fig ? '<figure class="qfig">' + fig(q.fig) + '</figure>' : '') + '<div class="qbody">' + qBody(q, c) + '</div></div><div class="hint-slot" aria-live="assertive"></div></div>' +
      '<div class="foot">' + qFoot(q) + '</div>';
  }
  function qText(q) {

  const PAD = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', 'neg', '.', 'del'];

  function qBody(q, c) {
    if (q.t === 'mcq') return '<div class="opts">' + c.ord.map((oi, k) => '<button class="opt" data-act="pick" data-o="' + oi + '" style="animation-delay:' + (k * .06).toFixed(2) + 's"><span class="k">' + LETTERS[k] + '</span><span class="ot">' + md(q.o[oi]) + '</span></button>').join('') + '</div>';
    if (q.t === 'tf') return '<div class="tf"><button class="opt" data-act="tf" data-v="1">' + IC.check + '<span>صح</span></button><button class="opt" data-act="tf" data-v="0">' + IC.x + '<span>غلط</span></button></div>';
    if (q.t === 'fill') return '<p class="help">' + IC.tap + 'اختار اللي يكمّل الـ blank</p><div class="fchips">' + c.ord.map((oi, k) => '<button class="fchip" data-act="fill" data-o="' + oi + '" style="--i:' + k + '">' + md(q.o[oi]) + '</button>').join('') + '</div>';
    if (q.t === 'order') return '<p class="help">' + IC.order + 'رتّب الـ items بالترتيب الصح، واضغط على خانة عشان ترجّع العنصر</p><ol class="slots">' + q.o.map((_, k) => '<li class="slot" data-act="unslot" data-k="' + k + '"><span class="sn">' + ar(k + 1) + '</span><span class="st"></span></li>').join('') + '</ol><div class="pool">' + c.pool.map(oi => '<button class="pitem" data-act="slot" data-o="' + oi + '">' + md(q.o[oi]) + '</button>').join('') + '</div>';
    if (q.t === 'match') return '<p class="help">' + IC.tap + 'اختار عنصر وبعدين اللي يناسبه من تحت</p><div class="mterms">' + c.tOrd.map(ti => '<button class="mterm" data-act="mt" data-i="' + ti + '"><span class="mk"></span>' + md(q.o[ti][0]) + '</button>').join('') + '</div><div class="mdefs">' + c.dOrd.map(di => '<button class="mdef" data-act="md" data-i="' + di + '"><span class="mk"></span><span>' + md(q.o[di][1]) + '</span></button>').join('') + '</div>';
    if (q.t === 'num') return '<p class="help">' + IC.keys + 'اكتب الـ answer بالـ keypad وبعدين اضغط Check</p><div class="numbox"><span class="nb-l">الإجابة</span><output class="nb-v" aria-live="polite"></output>' + (q.u ? '<span class="nb-u">' + md(q.u) + '</span>' : '') + '</div>';

  /* ----- شريط الوقت: إجابة قبل انتهائه = ضعف النجوم ----- */
  let TM = 0;
  function stopTimer() { if (TM) { cancelAnimationFrame(TM); TM = 0; } }
  function startTimer() {
    const c = SES.cur, slide = SES.slide; stopTimer();
    c.t0 = performance.now(); c.deadline = c.t0 + c.q.sec * 1000;
    const box = slide.querySelector('.qtimer'), bar = box.querySelector('.qt-bar i');
    (function loop() {
      TM = 0;
      if (!SES || SES.cur !== c || c.solved || c.tries > 0 || !slide.isConnected) return;
      const left = c.deadline - performance.now(), k = Math.max(0, left / (c.q.sec * 1000));
      bar.style.width = (k * 100).toFixed(2) + '%';
      const z = k > .5 ? 'a' : k > .22 ? 'b' : 'c'; if (box.dataset.z !== z) box.dataset.z = z;
      if (left <= 0) { timerState('late'); sfx('late'); return; }
      TM = requestAnimationFrame(loop);
    })();
  }
  function timerState(kind) {
    const c = SES.cur, box = SES.slide.querySelector('.qtimer'); if (!box || box.classList.contains(kind)) return;
    stopTimer(); box.classList.remove('late', 'miss'); box.classList.add(kind);
    const rw = box.querySelector('.qt-rw');
    rw.querySelector('b').textContent = kind === 'miss' ? Math.ceil(c.q.base / 2) : c.q.base;
    box.querySelector('.qt-msg').textContent = kind === 'miss' ? 'بعد محاولة خاطئة: نصف النجوم' : 'انتهى وقت المضاعفة، ونجوم الQuestion باقية';
    rw.classList.remove('rwflip'); void rw.offsetWidth; rw.classList.add('rwflip');
  }

  function stageFlash(cls) {
    const st = SES && SES.screen && SES.screen.querySelector('.stage'); if (!st) return;
    st.classList.remove('g-ok', 'g-bad'); void st.offsetWidth; st.classList.add(cls);
  }
  function celebrate(anchor) {
    setTimeout(() => { sfx('win'); burstAt(anchor, 120, 1.4); }, 300);
    if (reduced) return;
    const a = appEl.getBoundingClientRect();
    [[.2, .25, 900], [.8, .3, 1300], [.5, .15, 1700], [.3, .55, 2200], [.7, .5, 2600]].forEach(f => setTimeout(() => { if (appEl.querySelector('.donebody, .cert')) confetti(a.width * f[0], a.height * f[1], 60, 1); }, f[2]));
  }

  function onCorrect(anchor) {
    const c = SES.cur, q = c.q; c.solved = true; stopTimer(); SES.combo++;
    const inTime = c.tries === 0 && performance.now() < c.deadline;
    const award = c.tries > 0 ? Math.ceil(q.base / 2) : inTime ? q.base * 2 : q.base;
    const from = pillVal(); let gain = award;
    if (SES.kind === 'exam') SES.stars += award;
    else { const prev = S.q[q.id] || 0; gain = Math.max(0, award - prev); if (gain) S.q[q.id] = award; SES.stars += gain; }
    if (inTime) SES.doubles++;
    S.best = Math.max(S.best || 0, SES.combo); snap();
    const box = SES.slide.querySelector('.qtimer'); if (box) { box.classList.add('won'); if (c.tries === 0 && !inTime) timerState('late'); }
    sfx(inTime ? 'ok2' : 'ok'); burstAt(anchor, inTime ? 60 : c.tries === 0 ? 36 : 20, inTime ? 1 : .8); stageFlash('g-ok');
    if (gain) flyStars(anchor, gain, from, pillVal());
    SES.slide.querySelector('.hint-slot').innerHTML = q.s ? '<div class="sol"><span class="ni">' + IC.lamp + '</span><div><strong>طريقة الحل (How to)</strong><p>' + md(q.s) + '</p></div></div>' : '';
    const up = SES.kind === 'level' ? checkRank() : 0;
    const note = inTime ? '<span class="x2">×2</span> Double XP!' : c.tries > 0 ? 'نصف النجوم بعد محاولة خاطئة' : 'انتهى وقت المضاعفة';
    const kept = SES.kind === 'level' && gain < award ? '<span>' + (gain ? '(يُضاف لرصيدك ' + gain + ')' : '(رصيدك السابق في هذا الQuestion محفوظ)') + '</span>' : '';
    const foot = SES.slide.querySelector('.foot'); foot.classList.add('okstate');
    foot.innerHTML = '<div class="fb">' + mascot('happy') + '<div><strong>' + pick(PRAISE) + '</strong><small><span class="gain">+' + award + IC.star + '</span><span>' + note + '</span>' + kept + (SES.combo >= 3 ? '<span class="flame">' + IC.flame + ar(SES.combo) + ' متتالية</span>' : '') + '</small></div></div><button class="btn btn-ok" data-act="next"' + (up ? ' disabled data-wait="1"' : '') + '>Continue ' + IC.arrow + '</button>';
    const b = foot.querySelector('.btn');
    if (up) setTimeout(() => showRankUp(up), 1000);
    else { try { b.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
    if (q.s) setTimeout(() => { const bd = SES && SES.slide && SES.slide.querySelector('.body'), so = bd && bd.querySelector('.sol'); if (so) bd.scrollTop = Math.max(0, so.offsetTop - bd.clientHeight + so.offsetHeight + 24); }, 80);
  }
  function onWrong() {
    const c = SES.cur; c.tries++; SES.combo = 0; SES.mistakes++; SES.hearts = Math.max(0, SES.hearts - 1);
    snap();
    timerState('miss');
    sfx('bad'); buzz(90); renderHearts(SES.hearts); stageFlash('g-bad');
    const qc = SES.slide.querySelector('.qcard'); if (qc) { qc.classList.remove('shake'); void qc.offsetWidth; qc.classList.add('shake'); }
    if (SES.hearts <= 0) { c.busy = true; setTimeout(() => { sfx('heart'); heartsOut(); }, 650); return; }
    SES.slide.querySelector('.hint-slot').innerHTML = '<div class="hint">' + mascot('sad') + '<div><strong>مش دي، حاول تاني</strong><p>' + md(c.q.h || 'راجع Paragraph وحاول تاني.') + '</p></div></div>';
  }
  function heartsOut() {
    if (!SES) return;
    if (SES.kind === 'exam') {
      sheet(mascot('sad', 'big') + '<h3>خلصت الـ Lives</h3><p class="msg">راجع المحطات التي تعثرت فيها، ثم Retry Exam؛ ستأتيك أسئلة مختلفة.</p><div class="sh-actions"><button class="btn btn-main" data-act="examretry" data-b="' + SES.bab + '">Retry Exam</button><button class="btn btn-ghost" data-act="home">Back to Part</button></div>', { center: true, cls: 'modal', locked: true });
      return;
    }
    sheet(mascot('sad', 'big') + '<h3>خلصت الـ Lives</h3><p class="msg">عادي، الغلط جزء من التعلّم. ارجع اقرا Paragraph براحة وبعدين جاوب تاني.</p><div class="sh-actions"><button class="btn btn-main" data-act="reread">أعد قراءة الفقرة</button></div>', { center: true, cls: 'modal', locked: true });
  }
  function reread() {
    closeSheet(); const p = curStep().p;
    SES.order[p] = orderQ(SES.lv.paras[p]); SES.revisit[p] = true; SES.hearts = SES.max;
    SES.idx = SES.steps.findIndex(s => s.k === 'ex' && s.p === p);
    renderStep('back');
  }

  /* ----- answer handlers ----- */
  function mcqPick(btn) {
    const c = SES.cur; if (c.solved || c.busy) return; const oi = +btn.dataset.o;
    if (oi === 0) {

      onCorrect(btn);
    } else { btn.classList.add('bad'); btn.disabled = true; btn.querySelector('.k').innerHTML = IC.x; onWrong(); }
  }
  function tfPick(btn) {
    const c = SES.cur; if (c.solved || c.busy) return; const v = btn.dataset.v === '1';
    if (v === c.q.a) { btn.classList.add('ok'); SES.slide.querySelectorAll('.tf .opt').forEach(b => { if (b !== btn) b.classList.add('dim'); }); onCorrect(btn); }
    else { btn.classList.add('bad'); btn.disabled = true; onWrong(); }
  }
  function fillPick(btn) {
    const c = SES.cur; if (c.solved || c.busy) return; const oi = +btn.dataset.o; const blank = SES.slide.querySelector('.qtext .blank') || SES.slide.querySelector('.qtext .ph');
    if (oi === 0) {
      if (blank) { blank.innerHTML = md(c.q.o[0]); blank.classList.add('filled'); } btn.classList.add('ok');
      SES.slide.querySelectorAll('.fchip').forEach(b => { if (b !== btn) b.classList.add('dim'); });
      onCorrect(blank || btn);
    } else {
      btn.classList.add('bad'); btn.disabled = true; if (blank) { blank.classList.remove('flash'); void blank.offsetWidth; blank.classList.add('flash'); } onWrong();
    }
  }
  function orderSlot(btn) {
    const c = SES.cur; if (c.solved || c.busy) return; const oi = +btn.dataset.o;
    const k = c.placed.findIndex(v => v === null); if (k < 0) return;
    c.placed[k] = oi; btn.hidden = true; sfx('tap');
    const slot = SES.slide.querySelectorAll('.slot')[k]; slot.classList.add('full'); slot.querySelector('.st').innerHTML = md(c.q.o[oi]);
    SES.slide.querySelector('[data-act="check"]').disabled = c.placed.some(v => v === null);
  }
  function orderUnslot(slot) {
    const c = SES.cur; if (c.solved || c.busy) return; const k = +slot.dataset.k;
    if (c.locked.has(k) || c.placed[k] === null) return;
    const oi = c.placed[k]; c.placed[k] = null; slot.classList.remove('full'); slot.querySelector('.st').innerHTML = '';
    const it = SES.slide.querySelector('.pitem[data-o="' + oi + '"]'); if (it) it.hidden = false;
    SES.slide.querySelector('[data-act="check"]').disabled = true;
  }
  function orderCheck() {
    const c = SES.cur; if (c.solved || c.busy) return;
    const slots = SES.slide.querySelectorAll('.slot');
    const wrongKs = c.placed.map((v, k) => v === k ? -1 : k).filter(k => k >= 0);
    c.placed.forEach((v, k) => { if (v === k) { c.locked.add(k); slots[k].classList.add('ok'); } });
    if (!wrongKs.length) { onCorrect(SES.slide.querySelector('.slots')); return; }
    wrongKs.forEach(k => slots[k].classList.add('bad'));
    SES.slide.querySelector('[data-act="check"]').disabled = true;
    onWrong(); c.busy = true;
    setTimeout(() => {
      wrongKs.forEach(k => { const oi = c.placed[k]; c.placed[k] = null; slots[k].classList.remove('bad', 'full'); slots[k].querySelector('.st').innerHTML = ''; const it = SES.slide.querySelector('.pitem[data-o="' + oi + '"]'); if (it) it.hidden = false; });
      if (SES.hearts > 0) c.busy = false;
    }, 800);
  }
  function matchPick(btn, side) {
    const c = SES.cur; if (c.solved || c.busy) return; const i = +btn.dataset.i;
    const cls = side === 't' ? '.mterm' : '.mdef';
    SES.slide.querySelectorAll(cls).forEach(b => b.classList.toggle('sel', b === btn && c.sel[side] !== i));
    c.sel[side] = c.sel[side] === i ? null : i; sfx('tap');
    if (c.sel.t === null || c.sel.d === null) return;
    const tb = SES.slide.querySelector('.mterm[data-i="' + c.sel.t + '"]'), db = SES.slide.querySelector('.mdef[data-i="' + c.sel.d + '"]');
    if (c.sel.t === c.sel.d) {
      c.matched++; const lab = ar(c.matched); const mc = MPAL[(c.matched - 1) % MPAL.length];
      [tb, db].forEach(b => { b.classList.remove('sel'); b.style.setProperty('--mc', mc[0]); b.style.setProperty('--mcs', mc[1]); b.classList.add('done'); b.querySelector('.mk').textContent = lab; });
      c.sel = { t: null, d: null };
      if (c.matched === c.q.o.length) onCorrect(db); else { sfx('ok'); burstAt(db, 10, .5); }
    } else {
      [tb, db].forEach(b => { b.classList.remove('sel'); b.classList.add('bad'); });
      c.sel = { t: null, d: null }; onWrong();
      setTimeout(() => [tb, db].forEach(b => b.classList.remove('bad')), 600);
    }
  }
  /* لوحة الأرقام */
  function numKey(k) {
    const c = SES.cur; if (!c || c.q.t !== 'num' || c.solved || c.busy) return; let v = c.val || '';
    if (k === 'del') v = v.slice(0, -1);
    else if (k === 'neg') v = v[0] === '-' ? v.slice(1) : '-' + v;
    else if (k === '.') { if (v.indexOf('.') < 0) v += (v === '' || v === '-') ? '0.' : '.'; }
    else if (v.replace(/[-.]/g, '').length < 9) v = (v === '0' ? '' : v === '-0' ? '-' : v) + k;
    c.val = v; paintNum(); sfx('tap');
  }
  function paintNum() {
    const c = SES.cur, out = SES.slide.querySelector('.nb-v'); if (!out) return;
    out.textContent = (c.val || '').replace('-', '−');
    const chk = SES.slide.querySelector('[data-act="check"]'); if (chk) chk.disabled = !/\d/.test(c.val || '') || /\.$/.test(c.val);
  }
  function numCheck() {
    const c = SES.cur; if (c.solved || c.busy || !/\d/.test(c.val || '')) return;
    const v = parseFloat(c.val), box = SES.slide.querySelector('.numbox');
    if (Math.abs(v - c.q.a) < 1e-9) { box.classList.add('ok'); onCorrect(box); return; }
    box.classList.remove('bad'); void box.offsetWidth; box.classList.add('bad');
    SES.slide.querySelector('[data-act="check"]').disabled = true;
    onWrong();
    setTimeout(() => { if (SES && SES.cur === c && !c.solved) { c.val = ''; box.classList.remove('bad'); paintNum(); } }, 750);
  }

  /* ----- summary & done ----- */
  function stepSum() {
    const lv = SES.lv;
    return '<div class="body"><div class="eyebrow">Station Summary</div><h2 class="stitle">Review Cards</h2><p class="lede">اضغط على كل بطاقة لتقلبها وتتذكر خلاصتها.</p>' +
      '<div class="flips">' + lv.sum.map((s, i) => '<button class="flip" data-act="flip" style="--i:' + i + '"><span class="fi fr"><b>' + md(s[0]) + '</b><small>اضغط للقلب (Flip)</small></span><span class="fi bk">' + md(s[1]) + '</span></button>').join('') + '</div></div>' +
      '<div class="foot"><button class="btn btn-main" data-act="finish">Finish Station ' + IC.arrow + '</button></div>';
  }
  function finishLevel() {
    const lv = SES.lv;
    SES.result = { first: !S.done[lv.id] };
    S.done[lv.id] = 1; S.resume = null; delete S.pos[lv.id]; S.at = null; save();
    SES.idx++; renderStep('fwd');
  }
  function nextOf(lv) { const i = MAIN.indexOf(lv); return i < MAIN.length - 1 ? MAIN[i + 1] : 'exam'; }
  function rankStrip() {
    const st = totalStars(), r = rankOf(st), cur = r ? BADGES[r - 1] : null, nx = BADGES[r], lo = cur ? cur.at : 0;
    const pct = nx ? Math.max(4, Math.min(100, (st - lo) / (nx.at - lo) * 100)) : 100;
    return '<div class="badge-card' + (cur ? '' : ' none') + '" style="' + rankVars(r) + '">' + emblem(cur ? r - 1 : 0, cur ? '' : 'off') + '<div><small>' + (cur ? 'Current Rank' : 'أول وسام عند ' + BADGES[0].at + ' نجمة') + '</small><strong>' + esc(cur ? cur.n : BADGES[0].n) + '</strong>' +
      (nx ? '<small>باقٍ ' + starWord(nx.at - st) + (cur ? ' على «' + esc(nx.n) + '»' : '') + '</small>' : '<small>بلغت القمة!</small>') + '<div class="mini"><i style="width:' + pct.toFixed(1) + '%"></i></div></div></div>';
  }
  function stepDone() {
    const lv = SES.lv, nx = nextOf(lv), got = lvStars(lv), mx = lvMax(lv);
    /* آخر محطة في المسار تقود إلى المسار التالي، لا إلى محطة من مسار آخر مباشرة */
    const bi = babOf(pathOf(lv));
    const nextBtn = babReady(bi) && !bxDone(bi) ? '<button class="btn btn-main" data-act="exam" data-b="' + bi + '">إلى Part Exam ' + IC.arrow + '</button>'
      : nx === 'exam' ? '<button class="btn btn-main" data-act="paths">Back to Parts ' + IC.arrow + '</button>'
      : babOf(pathOf(nx)) !== bi ? '<button class="btn btn-main" data-act="bab" data-b="' + babOf(pathOf(nx)) + '">Next Part ' + IC.arrow + '</button>'
      : pathOf(nx) !== pathOf(lv) ? '<button class="btn btn-main" data-act="path" data-g="' + pathOf(nx) + '">Next Chapter ' + IC.arrow + '</button>'
      : '<button class="btn btn-main" data-act="open" data-id="' + nx.id + '">Next Station ' + IC.arrow + '</button>';
    return '<div class="body donebody"><div class="done-hero"><span class="burst"></span>' + mascot('happy') + '</div>' +
      '<h2 class="h-display grad-text">' + (SES.result.first ? 'Station Complete!' : 'Station Complete!') + '</h2><p class="lede">' + esc(lv.title) + '<br>نجومك فيها ' + nspan(got) + ' من ' + nspan(mx) + '</p>' +
      '<div class="stats"><div><b data-count="' + SES.stars + '">0</b><span>نجوم جديدة</span></div><div><b>' + ar(SES.doubles) + '</b><span>إجابات ×2</span></div><div><b>' + ar(SES.mistakes) + '</b><span>أخطاء</span></div></div>' +
      rankStrip() + (got < mx ? '<p class="note-s">اعمل الـ station تاني في أي وقت وجاوب أسرع عشان تكمّل الـ stars.</p>' : '<p class="note-s">جمعت كل الـ stars بتاعة الـ station دي!</p>') + '</div>' +
      '<div class="foot">' + nextBtn + '<button class="btn btn-ghost" data-act="home">Back to Chapter</button></div>';
  }
  function stepExamIntro() {
    return '<div class="body"><div class="eyebrow">Part Finale ' + ORD[SES.bab] + ': ' + esc(BABS[SES.bab].t) + '</div><h2 class="h-display">Part Exam ' + ORD[SES.bab] + '</h2>' +
      '<div class="blocks"><div class="blk b-list examlist"><ul>' +
      ['**' + SES.total + ' سؤالاً** من فصول هذا Part كلها (' + chWord(BABS[SES.bab].g.length) + ').', 'معك **خمسة قلوب** للامتحان كله.', 'الإجابة الغلط بتكلّفك life وبتحاول تاني لحد ما تصيب.', 'إذا خلصت الـ Lives يبدأ الامتحان من جديد بأسئلة مختلفة.', 'شريط الوقت يعمل هنا أيضاً: الإجابة السريعة **بضعف النجوم**.', 'عند النجاح تحصل على **Certificate الباب**، وتُضاف أفضل نتيجة لك فيه إلى نجومك.']
        .map((x, k) => '<li style="--i:' + k + '">' + md(x) + '</li>').join('') + '</ul></div></div></div>' +
      '<div class="foot"><button class="btn btn-main" data-act="next">Start Exam ' + IC.arrow + '</button></div>';
  }
  function finishExam() {
    const bi = SES.bab;
    S.bxDone[bi] = true; S.bx[bi] = Math.max(S.bx[bi] || 0, SES.stars); delete S.pos['x' + bi]; S.at = null; save();
    const up = checkRank();
    SES = null;
    showCert(bi, 'fwd');
    celebrate(appEl.querySelector('.cert'));
    if (up) setTimeout(() => showRankUp(up), 1600);
  }

  /* ----- navigation ----- */
  function advance() {
    if (SES.kind === 'exam' && SES.idx >= SES.steps.length - 1) { finishExam(); return; }
    SES.idx++;
    /* لا تُنهى المحطة وفي فقراتها أسئلة لم تُجَب: نعود إلى أول فقرة ناقصة */
    if (SES.kind === 'level' && curStep().k === 'sum') {
      const mp = SES.lv.paras.findIndex(pa => pa.q.some(q => !S.q[q.id]));
      if (mp >= 0) { SES.idx = SES.steps.findIndex(x => x.k === 'ex' && x.p === mp); toast('بقيت أسئلة الفقرة ' + ar(mp + 1) + ' لم تُجبها'); }
    }
    const nx = curStep();
    if (nx.k === 'ex') { SES.hearts = SES.max; SES.revisit[nx.p] = false; }
    if (nx.k === 'q' && SES.kind === 'exam' && SES.idx === 1) SES.hearts = SES.max;
    renderStep('fwd');
  }
  function primaryAction() {
    if (!SES || !SES.slide || appEl.querySelector('.sheet-wrap')) return;
    const st = curStep();
    if (st.k === 'map') advance();
    else if (st.k === 'ex') { const p = SES.lv.paras[st.p]; if (SES.reveal < p.b.length) revealMore(false); else advance(); }
  }

  /* ================= ACTIONS ================= */
  const ACT = {
    splash: () => showSplash('back'),
    start: () => { if (S.name) showBigMap('fwd'); else nameSheet(true); },
    namego: () => { readName(); closeSheet(); showBigMap('fwd'); },
    nameskip: () => { closeSheet(); showBigMap('fwd'); },
    settings: () => nameSheet(false),
    namesave: () => { readName(); closeSheet(); toast(S.name ? 'تم Save الاسم: ' + S.name : 'تم مسح الاسم'); if (VIEW === 'cert') showCert(CERTB, 'fwd'); else showHome('fwd'); },
    /* الخروج من محطة يعيد إلى صفحة مسارها؛ وما عدا ذلك يعيد إلى قائمة المسارات */
    home: () => {
      closeSheet(); stopTimer();
      const lv = SES && SES.kind === 'level' && VIEW === 'level' ? SES.lv : null;
      const xb = SES && SES.kind === 'exam' ? SES.bab : -1;
      if (xb >= 0) delete S.pos['x' + xb];
      S.at = null; save(); SES = null;
      if (lv) showPath(pathOf(lv), 'back'); else if (xb >= 0) showBab(xb, 'back'); else { VIEW = 'home'; showHome('back'); }
    },
    paths: () => { closeSheet(); stopTimer(); SES = null; VIEW = 'home'; showHome('back'); },
    path: t => { closeSheet(); stopTimer(); SES = null; sfx('tap'); showPath(+t.dataset.g, 'fwd'); },
    bab: t => { closeSheet(); stopTimer(); SES = null; sfx('tap'); showBab(+t.dataset.b, t.dataset.dir || 'fwd'); },
    bigmap: () => { VIEW = 'map'; showBigMap('fwd'); },
    badges: () => { VIEW = 'badges'; showBadges('fwd'); },
    badge: t => showBadge(+t.dataset.i),
    sound: t => { S.sound = !S.sound; save(); t.innerHTML = S.sound ? IC.sound : IC.mute; t.setAttribute('aria-label', S.sound ? 'Mute' : 'Sound On'); if (S.sound) sfx('ok'); toast(S.sound ? 'تم Sound On' : 'تم Mute'); },
    reset: () => sheet('<div class="sh-h"><strong>إعادة الرحلة من البداية؟</strong></div><p class="msg">ستُمحى النجوم والأوسمة وتقدّمك في المحطات على هذا الجهاز. يبقى اسمك كما هو.</p><div class="sh-actions"><button class="btn btn-bad" data-act="resetyes">نعم، ابدأ من جديد</button><button class="btn btn-ghost" data-act="sheetclose">Cancel</button></div>'),
    resetyes: () => { const snd = S.sound, nm = S.name; S = JSON.parse(JSON.stringify(DEF)); S.sound = snd; S.name = nm; save(); closeSheet(); showSplash('back'); },
    sheetclose: () => { closeSheet(); const b = SES && SES.slide && SES.slide.querySelector('.foot .btn'); if (b) { try { b.focus({ preventScroll: true }); } catch (e) { /* ignore */ } } },
    open: t => {
      const id = t.dataset.id;
      sfx('tap'); openLevel(id, 'fwd', t);
    },
    exam: t => {
      const bi = +t.dataset.b; if (!BABS[bi]) return;
      if (!babReady(bi)) {
        const left = babLeft(bi), gi = pathOf(left[0]);
        sfx('tap');
        sheet('<div class="sh-h"><strong>Part Exam ' + ORD[bi] + ' مغلق</strong></div><p class="msg">يُفتح Part Exam حين تُتمّ محطات فصوله كلها. باقٍ لك ' + textHTML(stWord(left.length)) + ' في هذا الباب.</p>' +
          '<div class="sh-actions"><button class="btn btn-main" data-act="path" data-g="' + gi + '">أكمل «' + esc(PATHS[gi].name) + '» ' + IC.arrow + '</button><button class="btn btn-ghost" data-act="sheetclose">OK</button></div>');
        return;
      }
      if (bxDone(bi)) { sheet('<div class="sh-h"><strong>Part Exam ' + ORD[bi] + '</strong></div><p class="msg">عدّيت امتحان الـ Part ده قبل كده، وأفضل نتيجة لك فيه ' + textHTML(starWord(S.bx[bi] || 0)) + '. ماذا تريد؟</p><div class="sh-actions"><button class="btn btn-main" data-act="cert" data-b="' + bi + '">View Certificate</button><button class="btn btn-ghost" data-act="examretry" data-b="' + bi + '">Retry Exam</button></div>'); return; }
      openExam(bi, 'fwd', t);
    },
    examretry: t => { closeSheet(); openExam(t && t.dataset.b != null ? +t.dataset.b : SES && SES.kind === 'exam' ? SES.bab : 0, 'fwd'); },
    cert: t => showCert(t && t.dataset.b != null ? +t.dataset.b : -1, 'fwd'),
    rnode: t => openNode(t),
    gopara: t => {
      if (!SES || SES.kind !== 'level') return;
      const p = +t.dataset.p, i = SES.steps.findIndex(x => x.k === 'ex' && x.p === p); if (i < 0) return;
      closeSheet(); stopTimer(); sfx('tap');
      SES.idx = i; SES.hearts = SES.max; SES.revisit[p] = false; SES.re = null; renderStep('fwd');
    },
    next: () => advance(),
    resume: () => { if (applyPos(S.pos[SES.lv.id])) enterSaved(); else advance(); },
    reveal: () => revealMore(false),
    revealall: () => revealMore(true),
    pick: t => mcqPick(t),
    tf: t => tfPick(t),
    fill: t => fillPick(t),
    slot: t => orderSlot(t),
    unslot: t => orderUnslot(t),
    check: () => (SES.cur.q.t === 'num' ? numCheck() : orderCheck()),
    key: t => numKey(t.dataset.k),
    mt: t => matchPick(t, 't'),
    md: t => matchPick(t, 'd'),
    reread: () => reread(),
    peek: () => { const p = SES.lv.paras[curStep().p]; sheet('<div class="sh-h"><strong>' + md(p.t) + '</strong><button class="ib" data-act="sheetclose" aria-label="Close">' + IC.x + '</button></div><div class="sh-body still">' + p.b.map(block).join('') + '</div>'); },
    flip: t => { t.classList.toggle('on'); sfx('tap'); },
    finish: () => finishLevel(),
    quit: () => sheet('<div class="sh-h"><strong>' + (SES && SES.kind === 'exam' ? 'الخروج من الامتحان؟' : 'الخروج من المحطة؟') + '</strong></div><p class="msg">' + (SES && SES.kind === 'exam' ? 'لن يُSave تقدمك في الامتحان، وستبدؤه من جديد لاحقاً.' : 'نجومك محفوظة، ومكانك محفوظ؛ ستكمل من نفس النقطة حين تعود.') + '</p><div class="sh-actions"><button class="btn btn-main" data-act="sheetclose">Continue Learning</button><button class="btn btn-ghost" data-act="home">' + (SES && SES.kind === 'exam' ? 'خروج إلى الباب' : 'خروج إلى الفصل') + '</button></div>')
  };

  appEl.addEventListener('click', e => {
    const t = e.target.closest('[data-act]'); if (!t || !appEl.contains(t) || t.disabled) return;
    const fn = ACT[t.dataset.act]; if (fn) { e.preventDefault(); fn(t, e); }
  });
  document.addEventListener('keydown', e => {
    const inField = /INPUT|TEXTAREA/.test((e.target || {}).tagName || '');
    const open = appEl.querySelector('.sheet-wrap');
    if (e.key === 'Escape') { if (open && open.dataset.locked !== '1') ACT.sheetclose(); return; }
    if (inField || open) return;
    if (e.key === 'ArrowLeft') primaryAction();
    const c = SES && SES.cur, st = SES && curStep();
    if (c && st && st.k === 'q' && c.q.t === 'num' && !c.solved) {
      if (/^[0-9]$/.test(e.key)) numKey(e.key);
      else if (e.key === 'Backspace') { e.preventDefault(); numKey('del'); }
      else if (e.key === '-') numKey('neg');
      else if (e.key === '.' || e.key === ',') numKey('.');
      else if (e.key === 'Enter') { e.preventDefault(); numCheck(); }
    }
  });
  let tx = 0, ty = 0;
  host.addEventListener('touchstart', e => { const t = e.touches[0]; tx = t.clientX; ty = t.clientY; }, { passive: true });
  host.addEventListener('touchend', e => {
    const t = e.changedTouches[0]; const dx = t.clientX - tx, dy = t.clientY - ty;
    if (dx > 70 && Math.abs(dy) < 45) primaryAction();
  }, { passive: true });

  window.__MJ = { get S() { return S; }, get SES() { return SES; }, LEVELS, BADGES, emblem, fig, md, totalStars, rankOf, lvMax };

  /* إذا فُتحت الصفحة في أكثر من تبويب: التبويب القديم لا يكتب فوق التقدم الأحدث،
     بل يعيد تحميل نفسه عند الرجوع إليه فيكمل من أحدث موضع محفوظ. */
  const syncTab = () => { if (changedElsewhere()) location.reload(); };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncTab(); });
  window.addEventListener('pageshow', e => { if (e.persisted) syncTab(); });

  if (!restore()) { if (S.intro) { VIEW = 'home'; showHome('fwd'); } else showSplash('fwd'); }
  if (!canStore()) setTimeout(() => toast('تنبيه: المتصفح لا يسمح بالSave، فلن يبقى تقدمك بعد Close الصفحة'), 1200);
})();

</script>
</body>
</html>
