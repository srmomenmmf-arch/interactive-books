اة، ثم ينوي الصلاة بعينها، ويجوز أن يقدم النية على التكبير بزمان يسير بشرط أن لا يفسخها ويفتتح الصلاة بقوله: الله أكبر، ويمد أصابعه، ويضم بعضها إلى بعض، ثم يرفع يديه مع ابتداء التكبير إلى منكبيه وإلى فروع أذنيه، فإذا انقضى التكبير حط يديه وأخذ بكفه الأيمن كوعه الأيسر ويجعلهما تحت سرته، وعن الإمام أحمد: تحت صدره، وعنه أنه مخير في ذلك وينظر إلى موضع سجوده، ثم يستفتح فيقول: سبحانك اللهم ويحمدك وتبارك اسمك وتعالى جدك ولا إله غيرك، ثم يستعيذ فيقول: أعوذ بالله السميع العليم من الشيطان الرجيم، ثم يقرأ: بسم الله الرحمن الرحيم، ولا يجهر بجميع ذلك، ثم يقرأ الفاتحة ويأتي فيها بإحدى عشرة تشديدة، فإذا ترك تشديدة منها أعاد، وإذا قال: ولا الضالين، قال: آمين، يجهر بها الإمام والمأموم فيما يجهر فيه بالقراءة، ثم يقرأ بعد الفاتحة سورة تكون في الصبح من طوال المفصل وفي المغرب من قصاره وفي بقية الصلوات من أوساطه.", "ومن لا يحسن الفاتحة وضاق وقت الصلاة عن تعلمها قرأ بعدها في عدد الحروف فإن لم يحسن إلا آية كررها بقدرها، ومن قرأ بما يخرج عن مصحف عثمان كقراءة ابن مسعود وغيره لم تصح صلاته في إحدى الروايتين، ومن لم يحسن شيئا من القرآن بالعربية لكن قدر أن يترجم عنه بلغة أخرى لم يجزه ذلك، ولزمه أن يقول: سبحان الله والحمد لله ولا إله إلا الله والله أكبر ولا حول ولا قوة إلا بالله، فإن لم يحسن شيئا من الذكر وقف بقدر القراءة، ولا يكره قراءة آخر السور وأوساطها على أصح الروايتين. ثم يرفع يديه ويركع مكبرا حتى يضع يديه على ركبتيه، ويمد ظهره مستويا ويجعل رأسه حيال ظهره غير مرفوع ولا مخفوض،"]], "ic": "book"}, {"story": ["الباب الثاني في كيفية الأعمال الظاهرة من الصلاة (٢ من ٤)، ص١٢٠", ["ويجافي مرفقيه عن جنبيه وقدر الإجزاء أن ينحني حتى يمكنه مس ركبتيه بيديه، ويقول: سبحان ربي العظيم ثلاثا، وهو أدنى الكمال، ثم يرفع رأسه قائلا: سمع الله لمن حمده، ويرفع يديه، فإذا اعتدل قائما قال: ربنا ولك الحمد ملء السماء وملء الأرض وملء ما شئت من شيء بعد. لا يزيد على ذلك، ثم يكبر ويخر ساجدا، فيضع ركبتيه ثم يديه ثم جبهته وأنفه، ويجعل صدور أصابع قدميه على الأرض، والسجود على جميع هذه الأعضاء واجب إلا الأنف فإنه على روايتين. ولا يجب عليه مباشرة المصلى بشيء من الأعضاء إلا الجبهة، فإنها على روايتين، ويستحب له أن يجافي عضديه عن جنبيه وبطنه عن فخذيه، ويضع يديه حذو منكبيه، ويفرق بين ركبتيه، ويقول: سبحان ربي الأعلى. ثلاثا، وهو أدنى الكمال ثم يرفع رأسه مكبرا ويجلس مفترشا؛ وهو أن يفرش رجله اليسرى ويجلس عليها، وينصب اليمنى، ثم يقول: رب اغفر لي. ثلاثا، ثم يسجد السجدة الثانية مكبرا ويقول: سبحان ربي الأعلى. ثلاثا(١)، ثم يرفع رأسه مكبرا، وهل يجلس جلسة الاستراحة؟ على روايتين؛ إحداهما: لا يجلس، بل يقوم على صدور قدميه معتمدا على ركبتيه، والثاني: يجلس على قدميه وأليتيه، وينهض مكبرا معتمدا على ركبتيه، ثم يصلي الركعة الثانية كذلك إلا أنه لا يستفتح ولا يستعيذ، فإن كانت صلاته ركعتين جلس مفترشا، وجعل يده اليمنى على فخذه اليمنى يقبض منها الخنصر والبنصر، ويحلق الإبهام مع الوسطى، ويشير بالسباحة في تشهده مرارا، ويبسط اليد اليسرى(٢) مضمومة الأصابع على الفخذ اليسرى، ويتشهد فيقول: التحيات لله والصلوات الطيبات، السلام عليك أيها النبي ورحمة الله وبركاته، السلام علينا وعلى عباد الله الصالحين، أشهد أن لا إله إلا الله، وأشهد أن محمدا عبده ورسوله.", "ثم يصلي على النبي فيقول: اللهم صل على محمد وعلى آل محمد، كما باركت على آل إبراهيم إنك حميد مجيد. وعن الإمام أحمد رحمه الله أنه يقول:", "حاشية: (١) سقطت من الأصل.", "حاشية: (٢) تحرفت في (ظ) إلى: «اليمنى».", "كما صليت على إبراهيم وعلى آل إبراهيم. وكذلك: كما باركت على إبراهيم وآل إبراهيم.", "ويستحب له أن يستعيذ من أربع، فيقول: أعوذ بالله من عذاب القبر، ومن عذاب النار، ومن فتنة المسيح الدجال، ومن فتنة المحيا والممات."]], "ic": "book"}, {"story": ["الباب الثاني في كيفية الأعمال الظاهرة من الصلاة (٣ من ٤)، ص١٢١", ["ثم يدعو بما ورد في الأخبار؛ فمن ذلك أن يقول: اللهم إني ظلمت نفسي ظلما كثيرا ولا يغفر الذنوب إلا أنت، فاغفر لي مغفرة من عندك، وارحمني إنك أنت الغفور الرحيم، اللهم إني أسألك من الخير كله ما علمت منه وما لم أعلم، وأعوذ بك من الشر كله ما علمت منه وما لم أعلم، اللهم إني أسألك من خير ما سألك عبادك الصالحون، وأعوذ بك من شر ما استعاذ منه عبادك الصالحون، اللهم إني أسألك الجنة وما قرب إليها من قول وعمل، وأعوذ بك من النار وما قرب إليها من قول وعمل، ربنا آتنا في الدنيا حسنة وفي الآخرة حسنة وقنا عذاب النار.", "ثم يسلم تسليمتين ينوي بهما الخروج من الصلاة، وهل نية الخروج واجبة أم لا؟ على وجهين، والتسليمتان واجبتان في إحدى الروايتين، والأخرى: أن الثانية سنة. وقدر الواجب: السلام عليكم ورحمة الله وبركاته، ثم يستقبل المأمومين إن كان إماما بوجهه بعد السلام في الفجر والعصر؛ لأنه لا صلاة بعدهما، ويقول: لا إله إلا الله وحده لا شريك له، له الملك، وله الحمد، يحيي ويميت، وهو حي لا يموت بيده الخير وهو على كل شيء قدير، اللهم اجعل خير أعمارنا آخرها، وخير أعمالنا آخرها، وخير أيامنا يوم لقائك. ويدعو بما يجوز من أمر الدين والدنيا.", "وإن كانت الصلاة رباعية أو مغربا جلس بين الركعتين مفترشا، ولم يزد على التشهد فإن نسي التشهد وقام إلى ثالثة رجع إن لم يكن قد انتصب قائما، وإن انتصب لم يستحب له الرجوع، فإن شرع في القراءة لم يجز له الرجوع، ثم يصلي بقية صلاته مثل الركعة الثانية إلا أنه لا يقرأ شيئا بعد الفاتحة، ويجلس في تشهده الثاني متوركا يفرش رجله اليسرى، وينصب اليمنى، ويخرجهما من تحته إلى جانب يمينه، ويجعل أليتيه على الأرض.", "**ذكر ما تشتمل عليه الصلاة من واجب ومسنون**", "للصلاة شرائط، وأركان، وواجبات، ومسنونات، وهيئات: فشرائطها: ما يجب لها قبلها، وهي ست: دخول الوقت، والطهارة، والستارة، والموضع، واستقبال القبلة، والنية.", "**وأركانها خمسة عشر:**", "القيام، وتكبيرة الإحرام، وقراءة الفاتحة، والركوع، والطمأنينة فيه، والاعتدال، والطمأنينة فيه، والسجود، والطمأنينة فيه، والجلوس بين السجدتين، والطمأنينة فيه، والتشهد الأخير، والجلوس له، والصلاة على النبي صلى الله عليه وسلم، وترتيبها على ما ذكرنا.", "**وواجباتها تسعة:** التكبير غير تكبيرة الإحرام، والتسميع والتحميد في الرفع من الركوع، والتسبيح في الركوع والسجود مرة مرة، وسؤال المغفرة في الجلسة بين السجدتين مرة، والتشهد الأول، والجلوس له، ونية الخروج من الصلاة في سلامه."]], "ic": "book"}, {"story": ["الباب الثاني في كيفية الأعمال الظاهرة من الصلاة (٤ من ٤)، ص١٢٢", ["**ومسنوناتها أربعة عشر:** الاستفتاح، والتعوذ، وقراءة بسم الله الرحمن الرحيم، وقول: آمين، وقراءة السورة بعد الفاتحة، وقول: ملء السماء، بعد التحميد، وما زاد على التسبيحة الواحدة في الركوع والسجود وعلى المرة في سؤال المغفرة، والسجود على الأنف، وجلسة الاستراحة على إحدى الروايتين، والتعوذ، والدعاء بعد الصلاة على النبي صلى الله عليه وسلم في التشهد الأخير، ودعاء القنوت في الوتر، والتسليمة الثانية في رواية.", "**وهيئاتها:** مسنونات أيضا إلا أنها صفات في غيرها، فلذلك سميت: هيئات، وهي خمس وعشرون: رفع اليدين عند الافتتاح والركوع والرفع منه، وإرسالهما بعد الرفع، ووضع اليمين على الشمال، وجعلهما تحت السرة، والنظر إلى موضع السجود، والجهر والإسرار بالقراءة وبآمين، ووضع اليدين على الركبتين في الركوع، ومد الظهر ومجافاة عضديه عن جنبيه فيه، والبداية بوضع الركبة ثم اليد", "في السجود، ومجافاة البطن عن الفخذين والفخذين عن الساقين فيه، والتفريق بين الركبتين، ووضع اليدين حذو المنكبين فيه، والافتراش في الجلوس بين السجدتين والتشهد الأول، والتورك في التشهد الثاني، ووضع اليد اليمنى على الفخذ اليمنى مقبوضة محلقة، والإشارة بالسبابة، ووضع اليسرى على الفخذ مبسوطة.", "ومن أخل بشرط لغير عذر لم تنعقد صلاته، فإن ترك ركنا فلم يذكره حتى سلم بطلت صلاته، سواء تركه عمدا أو سهوا.", "وإن ترك واجبا عمدا بطلت صلاته(١)، وإن تركه سهوا سجد للسهو، وإن ترك سنة أو هيئة لم تبطل صلاته بحال(٢)، وهل يسجد للسهو؟ يخرج على روايتين.", "**فصل**", "واعلم أن مثل الصلاة كالإنسان، فإنه لا يكون إنسانا كاملا إلا بوجود أعضاء ظاهرة، ومعنى باطن وهو الروح، فمن الأعضاء ما يعدم الإنسان إذا عدم، كالقلب والكبد والدماغ، ومنها ما لا يعدم بعدمه، ولكنه يفوت بعض المقاصد، كالعين واليد والرجل، ومنها ما لا يفوت عدمه الحياة ولا مقاصدها، ولكنه يفوت الحسن، كالحاجبين واللحية والأهداب، ومنها ما لا يفوت عدمه أصل الحسن، بل كماله، كتقويس الحاجبين وسواد الشعر، فكذلك الصلاة أركانها تجري مجرى أصول البدن، وهي: القلب والكبد والدماغ، وواجباتها تجري مجرى العين واليد والرجل، وإن كان تعمد ترك الواجبات يبطل، لكنها تنقص عن مرتبة الأركان في أن ترك تلك يبطل كيف كان، ولا تجبر بخلاف هذه. ومسنوناتها تجري مجرى الحاجبين واللحية والأهداب. وهيئاتها تجري مجرى تقويس الحاجبين وسواد الشعر.", "وروح الصلاة النية، والإخلاص، والخشوع، وحضور القلب.", "حاشية: (١) سقطت من الأصل.", "حاشية: (٢) سقطت من (ظ)."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "ثم يدعو بما ورد في ____؛ فمن ذلك أن يقول", "o": ["الأخبار", "الجراحي", "الجوزي", "الآجري"], "h": "راجع: ص١٢١"}, {"t": "fill", "d": 2, "q": "وإن ترك واجبا عمدا بطلت صلاته، وإن تركه سهوا سجد للسهو، وإن ترك سنة أو هيئة لم تبطل صلاته ____، وهل يسجد للسهو", "o": ["بحال", "يتمعر", "مجلس", "عاملا"], "h": "راجع: ص١٢٣"}, {"t": "fill", "d": 2, "q": "ومسنوناتها أربعة عشر: الاستفتاح، والتعوذ، وقراءة بسم الله الرحمن الرحيم، وقول: آمين، وقراءة السورة بعد الفاتحة، وقول: ملء السماء، بعد التحميد، وما زاد على ____ الواحدة في الركوع والسجود وعلى", "o": ["التسبيحة", "الأوامر", "نفقتهم", "بالنظافة"], "h": "راجع: ص١٢٢"}, {"t": "fill", "d": 2, "q": "وواجباتها تسعة: التكبير غير تكبيرة الإحرام، والتسميع والتحميد في الرفع من الركوع، والتسبيح في الركوع والسجود مرة مرة، وسؤال المغفرة في الجلسة بين السجدتين مرة، والتشهد الأول، ____ له، ونية", "o": ["والجلوس", "وليستشعر", "ونسبته", "محجوبا"], "h": "راجع: ص١٢٢"}, {"t": "fill", "d": 2, "q": "إذا قال المؤذن: قد قامت الصلاة قام إلى الصلاة، ثم ينوي الصلاة بعينها، ويجوز أن يقدم النية على التكبير بزمان يسير بشرط أن لا يفسخها ويفتتح الصلاة بقوله: الله أكبر، ____ أصابعه، ويضم بعضها إلى بعض، ثم", "o": ["ويمد", "فليحذر", "يعطيها", "صراط"], "h": "راجع: ص١١٩"}, {"t": "fill", "d": 2, "q": "ويستحب له أن يستعيذ من أربع، فيقول: أعوذ بالله من عذاب القبر، ومن عذاب ____، ومن فتنة المسيح الدجال، ومن فتنة المحيا", "o": ["النار", "بحرارته", "بإنعامي", "واقتصاد"], "h": "راجع: ص١٢١"}]}], "sum": [["الصفحات", "ص١١٩ - ص١٢٣"]], "_nq": 6}, {"id": "l17", "title": "الباب الثالث في الشروط الباطنة من أعمال القلب", "group": "كتاب أسرار الصلاة ومهماتها", "map": {"center": "الباب\nالثالث في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الثالث في الشروط الباطنة من أعمال القلب", "b": [{"pic": ["books", "book"], "cap": "ص١٢٤ - ص١٣٠"}, {"story": ["الباب الثالث في الشروط الباطنة من أعمال القلب (١ من ٥)، ص١٢٤", ["**في الشروط الباطنة من أعمال القلب**", "واعلم أن جميع العبادات ما عدا الصلاة قد لا يقدح فيها عدم حضور القلب؛ لأن الابتلاء بها يحصل مع عدم حضوره، كالحج؛ فإنه أفعال شاقة وإن لم يحضر القلب، والزكاة؛ فإنها إخراج مال محبوب، والصوم؛ فإنه ترك شهوات النفس.", "فأما الصلاة، فإنها تشتمل على أذكار ومناجاة وأفعال، ومع عدم حضور القلب لا يحصل المقصود بالأذكار والمناجاة؛ لأن النطق إذا لم يعرب عما في الضمير كان هذيانا، وكذلك لا يحصل المقصود من الأفعال؛ لأنه إذا كان المقصود من القيام الخدمة، ومن الركوع والسجود الذل والتعظيم، ثم كان القلب غائبا عن ذلك لم يحصل المقصود، كما لو كان بين يدي الإنسان صنم وهو غافل عنه لجاز أن يقال إنه معظم للصنم، فلما لم يقل ذلك دل على أن العمل على القصد بالفعل، ومتى خرج الفعل عن مقصوده بقي صورة لا اعتبار بها، وقد قال الله عز وجل: ﴿لَن يَنَالَ ٱللَّهَ لُحُومُهَا وَلَا دِمَآؤُهَا وَلَٰكِن يَنَالُهُ ٱلتَّقْوَىٰ مِنكُمْ﴾ [الحج: ٣٧].", "والمقصود: أن الواصل إلى الله عز وجل هو الوصف الذي استولى على القلب حتى حمل على امتثال الأوامر المطلوبة.", "فإن قيل: أفتبطل الصلاة مع غيبة القلب؟ قلنا: لا بد من حضور في الدخول في الصلاة ينسحب حكمه على باقيها، فتسامح(١) الشرع في غفلة تطرأ، وأوجب سجود السهو فيما وقعت الغفلة عن الإتيان به، فالحضور حين الدخول كرمق الروح في البدن، وبقدر قوته تنبسط الروح في آخر الصلاة، وبقدر ضعفه تضعف قوى ذلك الحي، وكم قد رأينا من حي لا حراك به.", "حاشية: (١) في (ظ): «فسامح».", "**بيان المعاني الباطنة التي بها تتم حياة الصلاة**", "هذه المعاني تكثر العبارات عنها، ولكن تجمعها ست جمل: حضور القلب، والتفهم، والتعظيم، والهيبة، والرجاء، والحياء.", "فلنذكر تفاصيلها(١)، ثم أسبابها، ثم العلاج في اكتسابها:", "**ذكر التفاصيل**", "الأول: ＊＊حضور القلب:＊＊ ونعني به: أن يفرغ القلب عن غير ما هو ملابس له.", "**والتفهم** لمعنى الكلام أمر وراء حضور القلب، فربما كان القلب حاضرا مع اللفظ غير حاضر مع معنى اللفظ، واشتمال القلب على العلم بمعنى اللفظ هو الذي نريد بالتفهم، وهذا مقام يتفاوت الناس فيه؛ لأنهم لا يشتركون في تفهم معاني التلاوة والأذكار، ومن هذا الوجه كانت الصلاة ناهية عن الفحشاء والمنكر؛ لأنها تفهم أمورا تمنع تلك الأمور من الفواحش.", "وأما ＊＊التعظيم＊＊ فهو أمر وراء حضور القلب والفهم؛ لأن الرجل قد يخاطب عبده بكلام هو حاضر القلب فيه ومتفهم لمعناه، ولا يكون معظما له.", "وأما ＊＊الهيبة＊＊، فأمر زائد على التعظيم، بل هو عبارة عن خوف منشؤه التعظيم، فإن الخوف من العقرب لا يسمى مهابة بل من السلطان المعظم، فالهيبة خوف مصدره الإجلال."]], "ic": "book"}, {"story": ["الباب الثالث في الشروط الباطنة من أعمال القلب (٢ من ٥)، ص١٢٥", ["وأما ＊＊الرجاء＊＊، فلا شك في أنه زائد، فكم من معظم ملكا يهابه لخوف سطوته ولا يرجو بره، والمصلي ينبغي ان يكون راجيا بصلاته الثواب، كما يخاف من تقصيره العقاب.", "وأما ＊＊الحياء＊＊، فإنه زائد على الجملة؛ لأن مستنده استشعار تقصير وتوهم ذنب.", "حاشية: (١) في (ظ): «تفصيلها».", "**بيان أسباب هذه المعاني الستة**", "أما ＊＊حضور القلب＊＊، فسببه الهمة؛ لأن القلب تابع للهمم(١) لا يحضر إلا فيما أهم، ومتى أهمك أمر حضر قلبك شاء أم أبى، فلا علاج لإحضار القلب إلا صرف الهمة إلى الصلاة، ولا تنصرف الهمة إليها ما لم يحصل الإيمان بالآخرة، وإن الصلاة وسيلة إليها، فإذا ضم إلى ذلك احتقار الدنيا زاد حضور القلب. ومتى رأيت قلبك لا يحضر في الصلاة، فاعلم أنه لا سبب لذلك إلا ضعف الإيمان فاجتهد في تقويته.", "وأما ＊＊التفهم＊＊، فسببه صرف الذهن إلى إدراك المعنى، وعلاجه علاج إحضار القلب مع الإقبال على الفكر، والتشمير لدفع الخواطر الشاغلة بقطع موادها، ومتى لم تقطع المواد لم تنصرف الخواطر عنها.", "وأما ＊＊التعظيم＊＊، فهو حالة للقلب تتحصل من شيئين، أحدهما: معرفة جلال الله وعظمته، والثانية: معرفة حقارة النفس وأنها مستعبدة، فيتولد من المعرفتين الاستكانة والخشوع، فيحصل التعظيم.", "وأما ＊＊الهيبة والخوف＊＊، فحالة للنفس تتحصل من المعرفة بقدرة الله وسطوته، وأنه لو أهلك الخلق لم ينقص من ملكه ذرة، مع مطالعة ما قد جرى على الأنبياء والأولياء من المصائب وأنواع البلاء مع القدرة على الدفع عنهم، فكلما زاد العلم بالله زادت الهيبة، وستأتي أسباب ذلك في كتاب الخوف من ربع المنجيات إن شاء الله.", "وأما ＊＊الرجاء＊＊، فسببه معرفة لطف الله وكرمه وإنعامه، وتصديق وعده، فإذا حصلت المعرفة بلطفه واليقين بوعده انبعث الرجاء.", "وأما ＊＊الحياء＊＊، فاستشعار التقصير في العبادة، والعلم بالعجز عن القيام بتعظيم حق الله تعالى، ويقوى ذلك بمعرفة عيوب النفس وآفاتها، وميلها إلى العاجل.", "حاشية: (١) في الأصل «الهمة».", "فهذه أسباب [هذه](١) الصفات، وكل ما طلب تحصيله، فعلاجه إحضار سببه، ففي معرفة السبب معرفة العلاج، وقد ذكرنا عن جماعة استغرقتهم الهيبة في الصلاة حتى فقدوا الإحساس بما يجري عندهم، منهم مسلم بن يسار حين سقطت أسطوانة إلى جانبه وهو لا يعلم، ولا يستنكر مثل هذا، فإن الإنسان قد يدخل على ملك من ملوك الدنيا فتجري بينهما محادثات، ثم يخرج فيسأل: من كان عند الملك؟ أو: أي لون ثوب الملك؟ فلا يدري؛ لاشتغال قلبه عن جليسه وثوبه، فحظ كل مصل من صلاته على بمقدار خوفه وخشوعه وتعظيمه، وذلك بمقدار يقينه ﴿وَلِكُلٍّ دَرَجَٰتٌ مِّمَّا عَمِلُوا۟﴾ [الأنعام: ١٣٢]، وموضع نظر الله سبحانه إنما هو القلوب.", "**بيان الدواء النافع في حضور القلب**"]], "ic": "book"}, {"story": ["الباب الثالث في الشروط الباطنة من أعمال القلب (٣ من ٥)، ص١٢٧", ["اعلم أن المؤمن لا بد أن يكون معظما لله سبحانه، وخائفا له، وراجيا، ومستحييا من تقصيره، وإن كانت هذه الصفات تقوى بقدر قوة اليقين، وليس لانفكاكه عن هذه الصفات في الصلاة سبب إلا تفرق الفكر وتقسم الخاطر وغيبة القلب عن المناجاة، والدواء في إحضار القلب دفع الخواطر، ولا يدفع الشيء إلا بدفع سببه، وسبب توارد الخواطر إما أن يكون أمرا خارجا أو باطنا، فأما الخارج؛ فما يقرع السمع أو يظهر للبصر، فإن ذلك قد يختطف الهم حتى يتبعه ويتصرف فيه ثم ينجر منه الفكر إلى غيره، فيكون النظر سببا للتفكر، ثم يصير بعض تلك الأفكار سببا للبعض ومن قويت رتبته وعلت همته لم يلهه ما يجري على حواسه، لكن الضعيف لا بد أن يتفرق فكره، فعلاجه قطع هذه الأسباب بالقرب من القبلة، والنظر إلى موضع السجود، وأن لا يترك عنده ما يشغل حسه، ويحترز من الصلاة في المواضع المنقوشة.", "وأما الأسباب الباطنة فهي أشد، فإن من تشعبت به الهموم في أودية الدنيا لم ينحصر فكره في فن واحد، ولم يغنه غض البصر؛ لأن ما قد وقع في القلب كاف", "حاشية: (١) زيادة من الإحياء تستقيم بها العبارة.", "في الاشتغال به، وطريق هذا أن يرد النفس قهرا إلى فهم ما يقرأ في الصلاة ويشغلها به عن غيره، ويعينه على ذلك أن يستعد لذلك قبل الدخول في الصلاة بأن يفرغ قلبه عن ما يهمه، ويقضي أشغاله ثم يجدد على نفسه ذكر الآخرة، وخطر القيام بين يدي الله عز وجل، وهول المطلع، فإن لم تسكن الأفكار بذلك، فليعلم أنه إنما يفكر فيما أهمه، وإنما أهمه ما اشتهاه، فليترك تلك الشهوات، وليقطع تلك العلائق(١) فإن النبي صلى الله عليه وسلم لما صلى في أنبجانية(٢) لها علم نزعها وقال: «إنها ألهتني آنفا عن صلاتي»(٣)، فهذا هو الدواء القامع لمادة العلة لا يغني غيره.", "وإنما الأول لتسكين ما يحوم حول حواشي القلب، ومع تمكن العلة لا ينفع إلا الدواء القوي، وهذه العلة إذا قويت جاذبت المصلي وجاذبها إلى أن تنقضي الصلاة في المجاذبة، ومثاله مثال رجل تحت شجرة أراد أن يصفو له فكره، وكانت أصوات العصافير تشوش عليه وهو يطيرها بخشبة في يده، فإذا عاد إلى فكره عادت، فقيل له: هذا سير السواني(٤)، وهو سفر لا ينقطع، فإذا أردت الخلاص فاقلع الشجرة، فكذلك شجرة الشهوة(٥)، إذا اشتعلت وتفرقت أغصانها انجذبت إليها الأفكار انجذاب العصافير إلى الأشجار والذباب إلى الأقذار، فذهب العمر النفيس في دفع ما لا يندفع(٦)، وسبب هذه الشهوات التي توجب هذه الأفكار حب الدنيا، قال معروف الكرخي يصف الصالحين: لو كان في قلوبهم حب الدنيا ما صحت لهم سجدة. قيل لعامر بن عبد قيس: هل تحدثك نفسك بشيء من أمور الدنيا في الصلاة؟ فقال: لأن تختلف الأسنة في أحب إلي من أن أجد هذا.", "حاشية: (١) في الأصل «العوائق»."]], "ic": "book"}, {"story": ["الباب الثالث في الشروط الباطنة من أعمال القلب (٤ من ٥)، ص١٢٨", ["حاشية: (٢) الأنبجانية: كساء غليظ منسوب إلى منبج ـ على غير قياس ـ وهي مدينة من أعمال حلب، وقيل: إلى موضع اسمه أنبجان.", "حاشية: (٣) أخرجه البخاري (٧١٩)، ومسلم (٥٥٦).", "حاشية: (٤) السواني: جمع سانية، وهي البعير يستقى عليه، والسانية: الدولاب الذي يدور بالماء، ويضرب المثل في سير السواني في كل ما لا ثمرة في حركته، وأن آخره كأوله.", "حاشية: (٥) في (ظ): «السهو».", "حاشية: (٦) في الأصل: «ينفع».", "واعلم أن قلع حب الدنيا من القلب أمر صعب، ولشدة مرارة الدواء بقيت العلل مزمنة وصار الداء عضالا، وعلى قدر الاجتهاد في قلع ما يمكن يحصل الصفاء، وزوال ذلك المؤذي بالكلية أمر عزيز، فليقع الاجتهاد في الممكن منه، والله الموفق.", "**بيان تفصيل ما ينبغي أن يحضر في القلب عند كل شيء من الصلاة**", "إذا سمعت نداء المؤذن فمثل نداء القيامة، وشمر للإجابة، وانظر بماذا تجيب وبأي بدن تحضر، وإذا أتيت بالطهارة في مكان الصلاة وهو ظرفك الأبعد، ثم في الثياب وهي غلافك الأقرب، ثم في البدن وهو القشر الأدنى، فلا تغفل عن تطهير(١) لبك، وهو القلب، فإنه محل نظر المعبود وتطهيره بالندم على ما فرط، والعزم على ترك العود، وإذا سترت عورتك، فاعلم أن المراد من ذلك تغطية مقابح بدنك عن أبصار الخلق، فما رأيك في عورات باطنك وفضائح سرك التي لا يطلع عليها إلا ربك، وليس لها عنه ساتر، وإنما يكفرها الندم والحياء والخوف.", "وإذا استقبلت القبلة فقد صرفت وجهك عن الجهات إلى جهة بيت الله، فاعلم أن صرف قلبك إلى الله أوفى من ذلك المطلوب، وكما أنه لا يتوجه الوجه إلى جهة البيت إلا بالانصراف عن غيرها، فكذلك القلب لا ينصرف إلى الله تعالى إلا بالانصراف عن ما سواه، وإذا استقام بدنك في قيامه، فأقم قلبك متواضعا لعظمة ربه وتذكر قيامك لديه في القيامة، فإن لم تعرف كنه جلاله فقم قيام عبد بين يدي ملك من الملوك.", "وإذا نويت الصلاة فاعزم على إجابته في امتثال أوامره، وإذا كبرت فلا يكذبن قلبك لسانك؛ لأنه إذا كان في قلبك شيء أكبر من الله تعالى، فقد كذبت، واحذر أن يكون الهوى عندك أكبر بدليل إيثارك موافقته على طاعة ربك، واحذر من الكذب في قولك: وجهت وجهي فإنه إن كان متوجها إلى هواه فما توجه إلى الله.", "حاشية: (١) في (ظ): «تطهر»."]], "ic": "book"}, {"story": ["الباب الثالث في الشروط الباطنة من أعمال القلب (٥ من ٥)، ص١٣٠", ["فإذا استعذت فاعلم أن الاستعاذة لجأ إلى الله سبحانه، فإذا لم تلجأ إليه ولم تبرأ من حزب الشيطان كان كلامك لغوا وتفهم معنى ما تتلو، وأخطر النعم بقلبك عند قولك: ﴿ٱلْحَمْدُ لِلَّهِ﴾ [الفاتحة: ٢]، ولطفه عند قولك: ﴿ٱلرَّحْمَٰنِ ٱلرَّحِيمِ﴾ [الفاتحة: ٣] وعظمته عند قولك: ﴿مَٰلِكِ يَوْمِ ٱلدِّينِ﴾ [الفاتحة: ٤]، وكذلك في جميع ما تتلو، وقد روينا عن زرارة بن أوفى أنه قرأ في صلاته: ﴿فَإِذَا نُقِرَ فِى ٱلنَّاقُورِ﴾ [المدثر: ٨] فخر ميتا، وما كان ذلك إلا لأنه صور تلك الحال فأثرت عنده التلف.", "واستشعر في ركوعك التواضع، وفي سجودك زيادة الذل؛ لأنك وضعت النفس موضعها، ورددت الفرع إلى أصله بالسجود على التراب الذي خلقت منه.", "وتفهم معنى الأذكار بالذوق(١).", "واعلم أن أداء الصلاة بهذه الشروط الباطنة سبب لجلاء القلب من الصدأ، وحصول الأنوار فيه التي بها تتلمح عظمة المعبود ويطلع على أسراره، وما يعقلها إلا العالمون، فأما من هو قائم بصورة الصلاة دون معانيها، فإنه لا يطلع على شيء من ذلك بل ينكر وجوده، كما أن الجنين لو كان له عقل لأنكر وهو في مكانه وجود مكان متسع ولو كان للطفل تمييز لأنكر ما يخبر به العقلاء من ملكوت السماوات والأرض.", "حاشية: (١) تحرفت في (ظ) إلى: «الذنوب»."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "هذه المعاني تكثر العبارات ____، ولكن تجمعها ست جمل", "o": ["عنها", "صواة", "الأنسب", "لشهوة"], "h": "راجع: ص١٢٥"}, {"t": "fill", "d": 2, "q": "وأما الأسباب الباطنة فهي أشد، فإن من تشعبت به الهموم في أودية الدنيا لم ينحصر فكره في فن واحد، ولم يغنه غض ____؛ لأن ما قد وقع في القلب كاف", "o": ["البصر", "مطموسة", "ووجوبها", "فأربعة"], "h": "راجع: ص١٢٧"}, {"t": "fill", "d": 2, "q": "وأما الهيبة، فأمر زائد على التعظيم، بل هو عبارة عن خوف منشؤه التعظيم، فإن ____ من العقرب لا يسمى مهابة بل من السلطان المعظم، فالهيبة خوف مصدره الإجلال", "o": ["الخوف", "تتضاعف", "تمنعانك", "مشغول"], "h": "راجع: ص١٢٥"}, {"t": "fill", "d": 2, "q": "وأما الرجاء، فلا شك في أنه زائد، فكم من معظم ملكا يهابه لخوف سطوته ولا ____ بره، والمصلي ينبغي ان يكون راجيا بصلاته الثواب، كما يخاف من تقصيره العقاب", "o": ["يرجو", "والأذى", "بعدا", "بوعده"], "h": "راجع: ص١٢٥"}, {"t": "fill", "d": 2, "q": "والتفهم لمعنى الكلام أمر وراء حضور القلب، فربما كان القلب حاضرا مع اللفظ غير حاضر مع معنى اللفظ، واشتمال القلب على العلم بمعنى اللفظ هو الذي نريد بالتفهم، وهذا مقام يتفاوت ____ فيه؛ لأنهم لا يشتركون في تفهم معاني التلاوة والأذكار، ومن هذا الوجه كانت الصلاة ناهية عن الفحشاء والمنكر؛ لأنها تفهم أمورا تمنع تلك الأمور من الفواحش", "o": ["الناس", "وليتلطف", "بالأخص", "كقولهم"], "h": "راجع: ص١٢٥"}, {"t": "fill", "d": 2, "q": "وأما الرجاء، فسببه معرفة لطف الله وكرمه وإنعامه، وتصديق وعده، فإذا حصلت المعرفة بلطفه واليقين بوعده ____ الرجاء", "o": ["انبعث", "القنديل", "الرائحة", "رواية"], "h": "راجع: ص١٢٦"}]}], "sum": [["الصفحات", "ص١٢٤ - ص١٣٠"]], "_nq": 6}, {"id": "l18", "title": "الباب الرابع في الإمامة والقدوة", "group": "كتاب أسرار الصلاة ومهماتها", "map": {"center": "الباب\nالرابع في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الرابع في الإمامة والقدوة", "b": [{"pic": ["books", "book"], "cap": "ص١٣١ - ص١٣١"}, {"story": ["الباب الرابع في الإمامة والقدوة، ص١٣١", ["**في الإمامة والقدوة**", "ينبغي للإمام أن لا يتقدم على قوم يكرهونه، فإن اختلفوا كان النظر إلى الأكثرين إلا أن يكون الأقلون أهل الدين، ولا يتقدم على من هو أفقه منه وأقرأ، وقد فضل أصحابنا الأذان على الإمامة، والذي أراه تفضيل الإمامة؛ لأن الأذان إنما يراد للصلاة، ولأن رسول الله صلى الله عليه وسلم وكبار أصحابه اختاروا الإمامة على الأذان.", "وينبغي للإمام أن يراعي الوقت ليصلي في أوله، ففي الصحيحين من حديث ابن مسعود: سألت رسول الله صلى الله عليه وسلم: أي العمل أحب إلى الله؟ قال: «الصلاة على وقتها»(١). وينبغي أن يؤم مخلصا لا لأجل(٢) أجر، وليحذر من الفسوق، وما يخرج به عن العدالة، ولينظر في طهارته من الأحداث والأنجاس، فإنه أمر لا يعلمه غيره، وينبغي له أن يأمر بتسوية الصفوف وأن يرفع صوته بالتكبير، وأن يخفف، فقد قال النبي صلى الله عليه وسلم: «أيكم ما أم الناس فليتجوز، فإن فيهم الضعيف والكبير وذا الحاجة»(٣).", "حاشية: (١) أخرجه البخاري (٥٩٧٠)، ومسلم (٨٥)(١٣٩).", "حاشية: (٢) في (ظ): «الأخذ».", "حاشية: (٣) أخرجه البخاري (٧٠٣)، ومسلم (٤٦٧) (١٨٥)."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "وينبغي للإمام أن يراعي الوقت ليصلي في أوله، ففي الصحيحين من ____ ابن مسعود", "o": ["حديث", "الإبل", "فرجة", "ينام"], "h": "راجع: ص١٣١"}]}], "sum": [["الصفحات", "ص١٣١ - ص١٣١"]], "_nq": 1}, {"id": "l19", "title": "الباب الخامس في فضل الجمعة ووجوبها وآدابها", "group": "كتاب أسرار الصلاة ومهماتها", "map": {"center": "الباب\nالخامس في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الخامس في فضل الجمعة ووجوبها وآدابها", "b": [{"pic": ["books", "book"], "cap": "ص١٣٢ - ص١٣٩"}, {"story": ["الباب الخامس في فضل الجمعة ووجوبها وآدابها (١ من ٥)، ص١٣٢", ["**في فضل الجمعة ووجوبها وآدابها**", "**فضيلة الجمعة**", "قال الله عز وجل: ﴿إِذَا نُودِىَ لِلصَّلَوٰةِ مِن يَوْمِ ٱلْجُمُعَةِ فَٱسْعَوْا۟ إِلَىٰ ذِكْرِ ٱللَّهِ وَذَرُوا۟ ٱلْبَيْعَ﴾ [الجمعة: ٩] أخبرنا هبة الله بن محمد، قال: أخبرنا الحسن بن علي، قال: أخبرنا أحمد بن جعفر، قال: حدثنا عبد الله بن أحمد، قال: حدثني أبي قال: حدثنا علي بن إسحاق قال: حدثنا عبد الله، قال: حدثنا يونس عن الزهري قال: أخبرني عبد الرحمن الأعرج أنه سمع أبا هريرة يقول: قال رسول الله صلى الله عليه وسلم: «خير يوم طلعت عليه الشمس يوم الجمعة، فيه خلق آدم، وفيه أدخل الجنة، وفيه أخرج منها»(١) انفرد بإخراجه مسلم. وفي بعض ألفاظه: «ولا تقوم الساعة إلا في يوم الجمعة»(٢). وفي رواية أبي لبابة البدري عن النبي صلى الله عليه وسلم أنه قال: «سيد الأيام يوم الجمعة، وأعظمها عنده، وفيه تقوم الساعة، وما من ملك مقرب ولا سماء ولا أرض ولا رياح ولا جبال ولا بحر إلا هن يشفقن من يوم الجمعة»(٣). وفي الصحيحين من حديث أبي هريرة عن النبي صلى الله عليه وسلم أنه قال: «نحن الآخرون السابقون يوم القيامة، بيد أنهم أوتوا الكتاب من قبلنا، وأوتيناه من بعدهم، فهذا يومهم الذي فرض عليهم، فاختلفوا فيه، فهدانا الله له فهم لنا فيه تبع، واليهود غدا والنصارى بعد غد»(٤).", "حاشية: (١) أخرجه مسلم (٨٥٤).", "حاشية: (٢) أخرجه مسلم (٨٥٤)(١٨).", "حاشية: (٣) أخرجه أحمد (١٥٥٤٨)، وابن أبي شيبة ٢/ ١٥٠، وابن ماجه (١٠٨٤)، والطبراني في الكبير (٤٥١١)، والبيهقي في شعب الإيمان (٢٩٧٣).", "حاشية: (٤) أخرجه البخاري (٢٣٨) و(٨٧٦) و(٨٩٦) و(٢٩٥٦) و(٣٤٨٦) و(٦٢٢٤) و(٦٨٨٧) و(٧٠٣٦) و(٧٤٩٥)، ومسلم (٨٥٥).", "**ذكر وجوب الجمعة**", "كل من لزمته المكتوبة لزمه فرض الجمعة إذا كان مستوطنا يسمع النداء، أو بينه وبين الموضع الذي تقام فيه الجمعة فرسخ إلا المرأة والخنثى والعبد على إحدى الروايتين، فلا جمعة عليهم، وهم مخيرون بينها وبين الظهر.", "ومن لزمه فرض الجمعة لم يجز له أن يسافر بعد الزوال ويشترط في انعقاد الجمعة حضور أربعين نفسا ممن تجب عليهم الجمعة، وعن الإمام أحمد حضور خمسين، وعنه حضور ثلاثة، وأن يتقدمها خطبتان من شرط صحتهما حمد الله تعالى، والصلاة على رسوله محمد وقراءة آية فصاعدا، والوصية بتقوى الله، وحضور العدد المشترط في الجمعة، وهل يشترط في انعقاد الجمعة إذن الإمام؟ فيه روايتان.", "وتصح إقامتها في القرى، وفيما قارب البنيان من الصحراء، وفي موضعين من(١) البلد مع الحاجة، فإن لم تكن حاجة فالثانية باطلة، ومن أدرك منها ركعة مع الإمام أتمها جمعة، فإن أدرك أقل من ركعة أتمها ظهرا، والذي ينوي في حال دخوله معه؟ قال الخرقي: ينوي ظهرا، وقال ابن شاقلا: ينوي جمعة ثم يبني عليها ظهرا.", "**بيان آداب الجمعة**", "**وهي عشرة:**"]], "ic": "book"}, {"story": ["الباب الخامس في فضل الجمعة ووجوبها وآدابها (٢ من ٥)، ص١٣٣", ["**الأول:** أن يستعد لها من يوم الخميس، وفي ليلة الجمعة بالتنظف، وغسل الثياب، وإعداد ما يصلح للجمعة.", "**الثاني:** الاغتسال، ففي الصحيحين من حديث أبي هريرة عن النبي صلى الله عليه وسلم أنه قال: «من اغتسل يوم الجمعة غسل الجنابة، ثم راح، فكأنما قرب بدنة»(٢).", "حاشية: (١) في (ظ): «في».", "حاشية: (٢) أخرجه البخاري (٨٨١)، ومسلم (٨٥٠).", "وفي أفراد البخاري من حديث سلمان الفارسي عن النبي صلى الله عليه وسلم أنه قال: «لا يغتسل رجل يوم الجمعة، ويتطهر ما استطاع من طهر، ويدهن من دهنه أو يمس من طيب بيته، ثم يخرج، فلا يفرق بين اثنين، ثم يصلي ما كتب له، ثم ينصت إذا تكلم الإمام، إلا غفر له ما بينه وبين الجمعة الأخرى»(١). وروى الترمذي من حديث أوس بن أوس عن النبي صلى الله عليه وسلم أنه قال: «من اغتسل يوم الجمعة وغسل، وبكر وابتكر، ودنا واستمع، وأنصت كان له بكل خطوة يخطوها أجر سنة، صيامها وقيامها»(٢). قال ابن المبارك: معنى الحديث: غسل رأسه واغتسل. (٣)وقال وكيع(٣): اغتسل هو، وغسل امرأته.", "واعلم أن من اغتسل بعد طلوع الفجر فقد أصاب السنة غير أن الأفضل أن يكون الاغتسال قبيل الرواح، لئلا يعود الوسخ.", "**والثالث:** التزين، وذلك في ثلاثة أشياء:", "أحدها: تنظيف البدن، وذلك بالغسل، وقص الأظفار، والسواك، وغير ذلك مما قد تقدم ذكره.", "والثاني: تطييب الرائحة، فليتطيب بأطيب ما يمكنه.", "والثالث: بالثياب، فليلبس أجود ثيابه، فقد قال عبد الله بن سلام: خطبنا رسول الله صلى الله عليه وسلم في يوم جمعة فقال: «ما على أحدكم لو اشترى ثوبين ليوم جمعته سوى ثوب مهنته».", "**والرابع:** البكور، أخبرنا هبة الله بن محمد قال: أخبرنا الحسن بن علي قال: أخبرنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد، قال: حدثني أبي قال: حدثنا", "حاشية: (١) أخرجه البخاري (٨٨٣).", "حاشية: (٢) أخرجه الترمذي (٤٩٦)، وأحمد (١٦١٧٨)، وابن خزيمة (١٧٦٧)، والنسائي في الكبرى (١٧٠٨)، والدارمي ١/ ٣٦٣، والحاكم ١/ ٢٨٢. وقال الترمذي: حديث أوس حديث حسن.", "(٣.٣) سقط من (ظ).", "يزيد قال: حدثنا ابن أبي ذئب عن الزهري عن أبي عبد الله الأغر عن أبي هريرة عن النبي صلى الله عليه وسلم قال: «إذا كان يوم الجمعة وقفت الملائكة على أبواب المسجد، فيكتبون الأول فالأول، فمثل المهجر إلى الجمعة، كمثل الذي يهدي بدنة، ثم كالذي يهدي بقرة، ثم كالذي يهدي كبشا، ثم كالذي يهدي دجاجة، ثم كالذي يهدي بيضة، فإذا خرج الإمام وقعد على المنبر طووا صحفهم، وجلسوا يستمعون الذكر»(١) أخرجاه في الصحيحين.", "وينبغي للساعي إلى الجامع أن يمشي بسكون وخشوع وينوي الاعتكاف في المسجد إلى وقت خروجه."]], "ic": "book"}, {"story": ["الباب الخامس في فضل الجمعة ووجوبها وآدابها (٣ من ٥)، ص١٣٥", ["**والخامس:** أن لا يتخطى رقاب الناس ولا يفرق بين اثنين، أخبرنا الكروخي قال: أنبأنا أبو عامر الأزدي وأبو بكر الغورجي قالا: أخبرنا الجراحي قال: حدثنا المحبوبي قال: حدثنا الترمذي قال: حدثنا أبو كريب قال: حدثنا رشدين بن سعد عن زبان بن فائد، عن سهل بن معاذ بن أنس الجهني عن أبيه قال: قال رسول الله صلى الله عليه وسلم: «من تخطى رقاب الناس يوم الجمعة اتخذ جسرا إلى جهنم»(٢). وفي حديث الأرقم بن أبي الأرقم عن النبي صلى الله عليه وسلم أنه قال: «إن الذي يتخطى رقاب الناس يوم الجمعة، ويفرق بين الاثنين بعد خروج الإمام، كالجار قصبه(٣) في النار»(٤).", "فإن قال قائل: فإن كان الصف الأول خاليا؟ فالجواب: أن التخطي إليه جائز؛ لأن المتأخرين ضيعوا حظوظهم منه.", "**السادس:** أن لا يمر بين أيدي المصلين، ففي الصحيحين من حديث أبي الجهم عن النبي صلى الله عليه وسلم أنه قال: «لو يعلم المار بين يدي المصلي ماذا عليه لكان أن", "حاشية: (١) أخرجه البخاري (٩٢٩)، ومسلم (٨٥٠).", "حاشية: (٢) أخرجه الترمذي (٥١٣)، وأحمد (١٥٦٠٩)، وابن ماجه (١١٦)، والطبراني في الكبير ٢٠/ (٤١٨)، وأبو يعلى (١٤٩١)، والبغوي في شرح السنة (١٠٨٦).", "حاشية: (٣) قصبه: أمعاءه.", "حاشية: (٤) أخرجه أحمد (١٥٤٤٧)، والطبراني في الكبير (٩٠٨)، والحاكم ٣/ ٥٠٤.", "يقف أربعين خيرا له من أن يمر بين يديه». قال الراوي: لا أدري أقال أربعين يوما، أو أربعين شهرا، أو أربعين سنة(١).", "**السابع:** أن يطلب الصف الأول، وقد ذكرنا فضيلته في باب فضل المسجد إلا أن يخاف أن يرى منكرا أو يسمعه فله حينئذ في التأخر عذر.", "**الثامن:** أن يقطع الصلاة والذكر عند خروج الإمام، ويشتغل بإجابة المؤذن، ثم باستماع الخطبة، فإن كان بعيدا من الإمام لا يسمع جاز له الكلام.", "**التاسع:** أن يراعي في الاقتداء بالإمام في الجمعة ما ذكرنا في غيرها، فإذا سمع قراءة الإمام لم يقرأ إلا الفاتحة في سكتاته. ويصلي بعد الجمعة ركعتين سنة، وإن شاء صلى ست ركعات، وفي الصحيحين من حديث ابن عمر عن النبي صلى الله عليه وسلم أنه (٢)كان يصلي بعد الجمعة ركعتين(٣). وفي أفراد مسلم من حديث أبي هريرة عن النبي صلى الله عليه وسلم أنه قال(٢): «من كان منكم مصليا بعد الجمعة فليصل أربعا»(٤).", "قال الترمذي: وبحديث ابن عمر يقول الشافعي وأحمد، وإلى فعل ابن مسعود يذهب سفيان الثوري وابن المبارك. وقال إسحاق: إن صلى في المسجد صلى أربعا وإن صلى في بيته صلى ركعتين.", "**العاشر:** أن يقيم في المسجد حتى يصلي العصر، فإن أقام إلى المغرب، فهو أفضل، أخبرنا ابن ناصر قال: أخبرنا أبو بكر بن خلف قال: أخبرنا أبو عبد الله الحاكم قال: حدثنا أحمد بن محبوب الرملي قال: حدثنا القاسم بن مهدي قال: حدثنا (٥)أبو مصعب الزهري قال: أخبرنا(٥) عبد العزيز بن أبي حازم عن أبيه عن"]], "ic": "book"}, {"story": ["الباب الخامس في فضل الجمعة ووجوبها وآدابها (٤ من ٥)، ص١٣٦", ["حاشية: (١) أخرجه البخاري (٥١٠)، ومسلم (٥٠٧).", "(٢.٢) سقط من (ظ).", "حاشية: (٣) أخرجه البخاري (٩٣٧)، ومسلم (٨٨٢)(٧١).", "حاشية: (٤) أخرجه مسلم (٨٨١) (٦٩).", "(٥.٥) سقط من (ظ).", "سهل بن سعد قال: قال النبي صلى الله عليه وسلم: «إن لكم في كل جمعة حجة وعمرة، فالحجة التهجير للجمعة، والعمرة انتظار(١) العصر بعد الجمعة»(٢).", "**بيان الآداب والسنن الخارجة عن الترتيب السابق الذي يعم جميع النهار**", "**وهي سبعة أمور:**", "**الأول:** أن يحضر في مجالس العلم بكرة أو بعد الصلاة أو بعد العصر، ولا ينبغي أن يخلي نفسه في جميع النهار من خير وذكر ودعاء حتى توافيه الساعة الشريفة وهو على خير.", "**الثاني:** أن يراقب الساعة الشريفة التي في الجمعة بإحضار القلب وملازمة الذكر، فقد أخبرنا ابن الحصين قال: أخبرنا ابن المذهب، قال: أخبرنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا إسحاق قال: حدثنا مالك عن أبي الزناد عن الأعرج عن أبي هريرة أن رسول الله صلى الله عليه وسلم ذكر يوم الجمعة فقال: «فيه ساعة لا يوافقها عبد مسلم وهو قائم يصلي يسأل الله شيئا إلا أعطاه إياه» وأشار رسول الله صلى الله عليه وسلم بيده يقللها(٣). أخرجاه في الصحيحين، وفي لفظ متفق عليه: «في الجمعة ساعة لا يوافقها مسلم وهو يسأل ربه شيئا إلا آتاه إياه»(٤)، ولم يذكر الصلاة.", "واختلفت الرواية في هذه الساعة؛ ففي أفراد مسلم من حديث أبي موسى عن النبي صلى الله عليه وسلم أنه قال: «هي ما بين أن يجلس الإمام إلى أن تقضى الصلاة»(٥) وروى", "حاشية: (١) سقطت من (ظ).", "حاشية: (٢) أخرجه البيهقي ٣/ ٢٤١، وابن عدي في الكامل ٦/ ٣٨، وأورده الهندي في الكنز (٢١١٧٣).", "حاشية: (٣) أخرجه البخاري (٩٣٥)، ومسلم (٨٥٢).", "حاشية: (٤) أخرجه مسلم (٨٥٢)(١٥).", "حاشية: (٥) أخرجه مسلم (٨٥٣).", "كثير بن عبد الله عن أبيه عن جده أن النبي صلى الله عليه وسلم سئل عنها فقال: «ما بين فراغ الإمام من الخطبة إلى أن تقضى الصلاة»(١) وفي حديث جابر عن النبي صلى الله عليه وسلم أنه ذكر الساعة التي في الجمعة فقال: «التمسوها آخر الساعات بعد العصر»(٢). وفي حديث أنس عنه عليه السلام أنه قال: «التمسوا ما بين صلاة العصر إلى غروب الشمس»، وفي حديث فاطمة بنت رسول الله صلى الله عليه وسلم أنها سألت النبي صلى الله عليه وسلم عنها، فقال: «إذا تدلى نصف عين الشمس للغروب»(٣).", "قال الإمام أبو بكر الأثرم: لا تخلو هذه الأحاديث من وجهين: إما أن يكون بعضها أصح من بعض، وإما أن تكون هذه الساعة تنتقل في الأوقات كانتقال ليلة القدر في ليالي العشر، والصواب التماسها في جميع الأوقات."]], "ic": "book"}, {"story": ["الباب الخامس في فضل الجمعة ووجوبها وآدابها (٥ من ٥)، ص١٣٨", ["**الثالث:** أن يكثر من الصلاة على النبي صلى الله عليه وسلم في هذا اليوم، فقد روي عنه أنه قال: «من صلى علي في يوم الجمعة ثمانين(٤) مرة غفر الله له ذنوب ثمانين سنة»(٥) وإن أحب زاد في الصلاة عليه الدعاء له كقوله: اللهم آت محمدا الوسيلة والفضيلة، وارفعه الدرجة العظيمة والمقام المحمود الذي وعدته، اللهم اجز نبينا محمدا عنا ما هو أهله. وليضف إلى الصلاة عليه الاستغفار، فإنه مستحب في ذلك اليوم.", "**الرابع:** أن يكثر من قراءة القرآن، وليقرأ سورة الكهف خاصة فقد أخبرنا محمد بن ناصر قال: أنبأنا الحسن بن أحمد قال: أخبرنا محمد بن أحمد الحافظ، قال: أخبرنا عبد الله بن أبي جعفر الوراق قال: حدثنا محمد بن جرير الآملي قال:", "حاشية: (١) أخرجه الترمذي (٤٩٠)، وابن ماجه (١١٣٨)، والبغوي في شرح السنة ٤/ ٢١٠.", "حاشية: (٢) أخرجه أبو داود (١٠٤٨)، والنسائي ٣/ ٩٩، والبيهقي ٣/ ٢٥٠، والحاكم ١/ ٢٧٩.", "حاشية: (٣) أخرجه البيهقي في شعب الإيمان (٢٩٧٧).", "حاشية: (٤) سقطت من (ظ).", "حاشية: (٥) أخرجه الخطيب في تاريخه ١٣/ ٤٨٩، وابن الجوزي في العلل المتناهية (٧٩٦). وذكره الألباني في السلسلة الضعيفة (٢١٥) وقال: موضوع.", "حدثنا عمر بن عثمان الزهري قال: حدثنا عبد الرحمن بن هشام بن عبد الله بن عكرمة المخزومي قال: حدثني أبي عن هشام بن عروة عن أبيه عن عائشة قالت: قال رسول الله صلى الله عليه وسلم: «ألا أحدثكم بسورة ملأ عظمها ما بين السماء والأرض، ولكاتبها مثل ذلك من الأجر، ومن قرأها يوم الجمعة غفر له ما بينها وبين الجمعة الأخرى وزيادة ثلاثة أيام، ومن قرأ الخمس الأواخر منها عند نومه بعثه الله أي الليل شاء؟ قالوا: بلى يا رسول الله قال: سورة الكهف»(١).", "ويستحب للإنسان أن يختم القرآن في يوم الجمعة أو ليلتها إن قدر، فإن ختم في الليل ختم في ركعتي المغرب، وإن ختم في النهار ختم في ركعتي الفجر، فإنا قد روينا عن إبراهيم النخعي أنه قال: من ختم القرآن ليلا صلت عليه الملائكة حتى يصبح، ومن ختمه نهارا صلت عليه الملائكة حتى يمسي(٢).", "ويستحب له أن يصلي صلاة التسبيح في يوم الجمعة، وسيأتي ذكرها إن شاء الله تعالى.", "**السادس:** أن يتصدق بما أمكن، ولتكن صدقته خارجا من المسجد؛ لأنه قد جاء الذم لسؤال المساجد، فإذا أعطاهم فيه أعانهم على المكروه.", "**السابع:** أن يجعل يوم الجمعة لأعمال الآخرة، ويكف عن جميع أشغال الدنيا.", "حاشية: (١) أورده السيوطي في الدر المنثور ٤/ ٢٠٩، والمتقي الهندي في الكنز (٢٦٠٢)، ونسبه لابن مردويه.", "حاشية: (٢) أخرجه أبو نعيم في الحلية ٥/ ٢٦، وأورده السيوطي في الحبائك في أخبار الملائك (٦٩٢) من حديث سعد بن أبي وقاص."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "وتصح إقامتها في القرى، وفيما قارب البنيان من الصحراء، وفي موضعين من البلد مع الحاجة، فإن لم تكن حاجة فالثانية باطلة، ومن أدرك ____ ركعة مع الإمام أتمها جمعة، فإن أدرك أقل من ركعة أتمها ظهرا، والذي ينوي في حال دخوله معه", "o": ["منها", "يحول", "أخرى", "التوصل"], "h": "راجع: ص١٣٣"}, {"t": "fill", "d": 2, "q": "وفي أفراد البخاري من حديث سلمان الفارسي عن النبي صلى ____ عليه وسلم أنه قال", "o": ["الله", "فاستقل", "فساق", "يؤخذ"], "h": "راجع: ص١٣٤"}, {"t": "fill", "d": 2, "q": "الثامن: أن يقطع الصلاة والذكر عند خروج الإمام، ويشتغل بإجابة المؤذن، ثم باستماع الخطبة، فإن كان بعيدا من الإمام لا ____ جاز له", "o": ["يسمع", "يحركه", "الجمرة", "يستأذن"], "h": "راجع: ص١٣٦"}, {"t": "fill", "d": 2, "q": "الأول: أن يستعد لها من يوم الخميس، وفي ليلة ____ بالتنظف، وغسل الثياب، وإعداد ما يصلح", "o": ["الجمعة", "يستشهد", "للجريح", "المتوسوس"], "h": "راجع: ص١٣٣"}, {"t": "fill", "d": 2, "q": "قال الترمذي: وبحديث ابن عمر يقول الشافعي وأحمد، وإلى فعل ابن مسعود يذهب سفيان الثوري وابن المبارك. وقال إسحاق: إن صلى في ____ صلى أربعا وإن صلى في بيته صلى", "o": ["المسجد", "اليماني", "يترصد", "ليبيت"], "h": "راجع: ص١٣٦"}, {"t": "fill", "d": 2, "q": "والرابع: البكور، أخبرنا هبة الله بن محمد قال: أخبرنا الحسن بن علي قال: أخبرنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد، قال: ____ أبي قال:", "o": ["حدثني", "مشتبه", "ويبقى", "دنياهم"], "h": "راجع: ص١٣٤"}]}], "sum": [["الصفحات", "ص١٣٢ - ص١٣٩"]], "_nq": 6}, {"id": "l20", "title": "الباب السادس في مسائل متفرقة تعم بها البلوى ويحتاج المريد إلى معرفتها", "group": "كتاب أسرار الصلاة ومهماتها", "map": {"center": "الباب\nالسادس في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب السادس في مسائل متفرقة تعم بها البلوى ويحتاج المريد إلى معرفتها", "b": [{"pic": ["books", "book"], "cap": "ص١٤٠ - ص١٤١"}, {"story": ["الباب السادس في مسائل متفرقة تعم بها البلوى ويحتاج المريد إل (١ من ٢)، ص١٤٠", ["**في مسائل متفرقة تعم بها البلوى ويحتاج المريد إلى معرفتها**", "**مسألة:** الفعل القليل، وإن كان لا يبطل الصلاة، فهو مكروه إلا لحاجة، كدفع المار وقتل العقرب والقملة والحك الذي يحتاج إليه، وإذا تثاءب وضع يده على فيه، وإن عطس حمد الله في نفسه، فإن بزق في صلاته لم تبطل؛ لأنه فعل قليل وما يحصل به من صوت لا يعد كلاما إلا أنه مكروه.", "**مسألة:** اختلف العلماء فيما يدركه المسبوق هل هو أول صلاته أو آخر صلاته؟ والصحيح: أنه آخر صلاته، وما يقضيه أولها، يأتي فيه بالاستفتاح والتعوذ وقراءة السورة.", "**مسألة:** من صلى ثم رأى على ثوبه نجاسة، فالورع قضاء الصلاة، ولو رأى النجاسة في أثناء الصلاة رمى بالثوب، وأتم والورع الاستئناف.", "**مسألة:** الوسوسة في نية الصلاة سببها خبل في العقل أو جهل في الشرع؛ لأن امتثال أمر الله مثل امتثال أمر غيره، وتعظيمه كتعظيم غيره في باب القصد، ومعلوم أن من دخل عليه عالم فقام له، فلو قال: نويت أن أنتصب قائما تعظيما لدخول زيد الفاضل لأجل فضله متصلا بدخوله مقبلا عليه بوجهي، سفه في عقله بل كما يراه ويعلم فضله فتنبعث داعية التعظيم فتقيمه، ويكون معظما إلا أن يقوم(١) لشغل آخر أو في غفلة، فقيام الإنسان إلى الصلاة ليؤدي الفرض لقضاء حق الله تعالى أمر متصور في النفس في حالة واحدة لا يطول زمانه وإنما يطول زمان نظم الألفاظ الدالة عليه إما تلفظا باللسان، وإما تفكرا بالقلب، وفرق بين حضور الشيء في", "حاشية: (١) في الأصل: «يكون».", "النفس وبين تفصيله بالفكر، فمن لم يفهم نية الصلاة على هذا الوجه، فكأنه لم يفهم النية، فالوسوسة محض الجهل، ومن الجهل بهذه الدقيقة يثور الوسواس، فإن الموسوس يكلف نفسه أن يحضر في قلبه الظهرية والأدائية والفرضية في حالة واحدة متصلة بألفاظها، وهو يطالعها، وذلك محال، ولو كلف نفسه ذلك في القيام للعالم على ما ذكرنا لتعذر ذلك عليه، وبهذه المعرفة يندفع الوسواس، وهو أن يعلم أن امتثال أمر الله في النية كامتثال أمر غيره، ثم أزيد عليه في باب السهولة والرخصة حتى أنه يجوز تقديم النية على التكبير بزمن يسير ما لم يفسخها ولم يجر للصحابة من هذه الوساوس شيء، فدل على أن الأمر سهل.", "**مسألة:** لا ينبغي أن يتقدم المأموم على الإمام في الركوع والسجود والرفع منهما وفي سائر الأعمال، ولا ينبغي أن يساوقه(١) بل يتبعه ويقفو أثره، فإن النبي صلى الله عليه وسلم قال: «إنما جعل الإمام ليؤتم به، فإذا ركع فاركعوا»(٢)، فإن ساوقه(٣) عمدا لم تبطل صلاته، وإن تقدم عليه فركع أو سجد قبله، وجب عليه أن يرجع(٤) ليأتي بذلك معه، فإن لم يفعل حتى لحقه الإمام في الركن لم تبطل صلاته على قول القاضي أبي يعلى، وقال غيره من أصحابنا: تبطل، فإن ركع قبله ورفع قبل أن يركع الإمام عامدا فهل تبطل صلاته؟ على وجهين."]], "ic": "book"}, {"story": ["الباب السادس في مسائل متفرقة تعم بها البلوى ويحتاج المريد إل (٢ من ٢)، ص١٤١", ["**مسألة:** من رأى من المصلي إساءة في صلاته، كمسابقة الإمام أو إساءة في الركوع والسجود، فليأمره بالصواب، فإن ذلك من باب الأمر بالمعروف، وفي الصحيحين من حديث أبي هريرة عن النبي صلى الله عليه وسلم أنه قال: «أما يخاف الذي يرفع رأسه قبل الإمام أن يحول الله رأسه رأس حمار»(٥). وفي أفراد البخاري من حديث حذيفة رضي الله عنه أنه رأى رجلا لا يتم ركوعه ولا سجوده، فلما انصرف قال له: منذ كم صليت هذه الصلاة؟ قال: منذ كذا وكذا. قال: ما صليت.", "حاشية: (١) في (ظ): «يسابقه»، والمساوقة: المقارنة.", "حاشية: (٢) أخرجه البخاري (٢٦٥٨)، ومسلم (٤١٢)(٨٢) وأحمد (٢٤٢٥٠).", "حاشية: (٣) في (ظ): «سابقه».", "حاشية: (٤) في الأصل: «يرفع».", "حاشية: (٥) أخرجه البخاري (٦٩١)، ومسلم (٩٦٣)."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "مسألة: الوسوسة في نية الصلاة سببها خبل في العقل أو جهل في الشرع؛ لأن امتثال أمر الله مثل امتثال أمر غيره، وتعظيمه كتعظيم غيره في باب القصد، ومعلوم أن من دخل عليه ____ فقام له، فلو قال: نويت أن", "o": ["عالم", "لكلمات", "وسأله", "يسمي"], "h": "راجع: ص١٤٠"}, {"t": "fill", "d": 2, "q": "مسألة: من رأى من المصلي إساءة في صلاته، كمسابقة الإمام أو إساءة في الركوع والسجود، فليأمره بالصواب، فإن ذلك من باب الأمر بالمعروف، وفي الصحيحين من حديث أبي هريرة عن النبي صلى الله ____ وسلم أنه", "o": ["عليه", "إزاره", "ونعني", "بذنب"], "h": "راجع: ص١٤١"}, {"t": "fill", "d": 2, "q": "مسألة: الفعل القليل، وإن كان لا يبطل الصلاة، فهو مكروه إلا لحاجة، كدفع المار وقتل العقرب والقملة والحك الذي يحتاج إليه، وإذا تثاءب وضع يده على فيه، وإن عطس حمد ____ في نفسه، فإن بزق في صلاته لم", "o": ["الله", "يجري", "خامسا", "بقوم"], "h": "راجع: ص١٤٠"}, {"t": "fill", "d": 2, "q": "مسألة: لا ينبغي أن يتقدم المأموم على الإمام في الركوع والسجود والرفع منهما وفي سائر الأعمال، ولا ينبغي أن ____ بل يتبعه ويقفو أثره، فإن النبي صلى الله عليه وسلم قال: «إنما جعل الإمام ليؤتم", "o": ["يساوقه", "فيحسن", "خيالك", "يسمع"], "h": "راجع: ص١٤١"}, {"t": "fill", "d": 2, "q": "مسألة: من صلى ثم رأى على ثوبه نجاسة، فالورع قضاء الصلاة، ولو رأى النجاسة في ____ الصلاة رمى بالثوب، وأتم والورع", "o": ["أثناء", "دانقا", "فيعرفون", "وددت"], "h": "راجع: ص١٤٠"}]}], "sum": [["الصفحات", "ص١٤٠ - ص١٤١"]], "_nq": 5}, {"id": "l21", "title": "الباب السابع في ذكر النوافل من الصلوات", "group": "كتاب أسرار الصلاة ومهماتها", "map": {"center": "الباب\nالسابع في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب السابع في ذكر النوافل من الصلوات - القسم ١ من ٢", "b": [{"pic": ["books", "book"], "cap": "ص١٤٢ - ص١٥٦"}, {"story": ["الباب السابع في ذكر النوافل من الصلوات (١ من ١١)، ص١٤٢", ["**في ذكر النوافل من الصلوات**", "اعلم أن ما عدا الفرائض من الصلوات ينقسم إلى ثلاثة أقسام: سنن، ومستحبات، وتطوعات.", "ونعني بالسنن: ما نقل عن رسول الله صلى الله عليه وسلم المواظبة عليه، كالرواتب عقيب الفرائض، وصلاة الضحى، والوتر؛ لأن السنة عبارة عن الطريق المسلوكة، ونعني بالمستحبات ما ورد الخبر بفضله، ولم ينقل المواظبة عليه، كالصلاة عند دخول المنزل والخروج منه. ونعني بالتطوعات ما وراء ذلك ما لم يرد به خبر لكن العبد يتطوع بفعله.", "وتسمى هذه الأقسام الثلاثة: نوافل؛ لأن النفل هو الزيادة وهذه زوائد على الفرائض.", "واعلم أن أفضل تطوعات البدن الصلاة، وآكدها ما سن لها الجماعة، كصلاة الكسوف، والاستسقاء، والتراويح، وبعد ذلك السنن الراتبة.", "واعلم أن النوافل باعتبار الإضافة إلى متعلقاتها تنقسم إلى ما يتعلق بأسباب كالخسوف والاستسقاء، وإلى ما يتعلق بأوقات، والمتعلق بالأوقات ينقسم إلى ما يتكرر بتكرر اليوم والليلة أو بتكرر الأسبوع ويتكرر السنة.", "فالجملة ثلاثة أقسام:", "القسم الأول: ما يتكرر بتكرر الأيام والليالي، وهي ثمانية: خمسة هي رواتب الصلوات الخمس، وثلاثة وراءها، وهي: صلاة الضحى، وإحياء ما بين العشاءين، والتهجد.", "الأولى: راتبة الصبح وهي ركعتان، ويدخل وقتهما بطلوع الفجر الثاني،", "والمستحب أن يصليهما في المنزل، وقد روي عن النبي صلى الله عليه وسلم أنه قال: «ركعتا الصبح خير من الدنيا وما فيها»(١)."]], "ic": "book"}, {"story": ["الباب السابع في ذكر النوافل من الصلوات (٢ من ١١)، ص١٤٣", ["الثاني: راتبة الظهر، وهي ركعتان قبل صلاة الظهر، وركعتان بعدها، ويستحب أن يتطوع بأربع قبل الظهر، أخبرنا عبد الرحمن بن محمد قال: أنبأنا أحمد بن علي بن ثابت قال: أنبأنا علي بن أبي علي المعدل قال: أنبأنا علي بن عمر الحربي قال: أخبرنا محمد بن إسحاق بن عبد الرحمن قال: أخبرنا أحمد ابن الأزهر قال: حدثنا علي بن عاصم قال: حدثنا يحيى البكاء قال: حدثني عبد الله بن عمر قال: سمعت عمر بن الخطاب يقول: قال رسول الله صلى الله عليه وسلم: «أربع قبل الظهر بعد الزوال يعدلن بمثلهن من صلاة الليل، وليس من شيء إلا وهو يسبح الله تعالى تلك الساعة»(٢) أخبرنا ابن المذهب قال: أخبرنا ابن الحصين قال: أخبرنا أبو بكر بن جعفر قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا أبو معاوية قال: حدثنا عبيدة يعني ابن معتب عن إبراهيم عن سهم بن منجاب عن قزعة عن القرثع عن أبي أيوب قال: أدمن(٣) رسول الله صلى الله عليه وسلم أربع ركعات عند زوال الشمس. فقلت: يا رسول الله، ما هذه الركعات التي أراك قد أدمنتها؟ قال: «إن أبواب السماء تفتح عند زوال الشمس فلا ترتج(٤) حتى يصلى الظهر، فأحب أن يصعد لي فيها خير». قال: قلت: يا رسول الله تقرأ فيهن كلهن؟ قال: «نعم» فقلت: فيها سلام فاصل؟ قال: «لا»(٥). قال الإمام أحمد رحمه الله: وأخبرنا وكيع، قال: حدثنا شعبة عن إبراهيم بن محمد بن المنتشر عن", "حاشية: (١) أخرجه مسلم (٧٢٥)، والترمذي (٤١٦) من حديث عائشة.", "حاشية: (٢) أخرجه الترمذي (٣١٢٨).", "حاشية: (٣) أدمن: أي: واظب.", "حاشية: (٤) ترتج: تغلق.", "حاشية: (٥) أخرجه الترمذي في الشمائل (٢٨٧)، وأبو داود (١٢٧٠)، وأحمد (٢٣٥٣٢)، وابن ماجه (١١٥٧)، وابن خزيمة (١٢١٤)، والحميدي (٣٨٥)، والطبراني في الكبير (٤٠٣٢)، والبيهقي في السنن ٢/ ٤٨٨.", "أبيه قال: سمعت عائشة تقول: كان رسول الله صلى الله عليه وسلم لا يدع أربعا قبل الظهر، وركعتين قبل الفجر على كل حال(١). انفرد بإخراجه البخاري. وفي أفراد مسلم من حديث أم حبيبة عن النبي صلى الله عليه وسلم أنه قال: «ما من عبد مسلم يصلي لله عز وجل كل يوم اثنتي عشرة ركعة تطوعا غير فريضة إلا بني له بهن بيت في الجنة»(٢). وقد رواه الترمذي مفسرا: أخبرنا به أبو الفتح الكروخي قال: أخبرنا أبو عامر الأزدي وأبو بكر الغورجي قالا: أخبرنا الجراحي قال: حدثنا المحبوبي قال: حدثنا الترمذي قال: حدثنا محمود بن غيلان قال: حدثنا مؤمل قال: حدثنا سفيان الثوري عن أبي إسحاق عن المسيب بن رافع عن عنبسة عن أم حبيبة قالت: قال رسول الله صلى الله عليه وسلم: «من صلى في يوم وليلة اثنتي عشرة ركعة بني له بيت في الجنة؛ أربعا قبل الظهر، وركعتين بعدها، وركعتين بعد المغرب، وركعتين بعد العشاء، وركعتين قبل صلاة الغداة»(٣)."]], "ic": "book"}, {"story": ["الباب السابع في ذكر النوافل من الصلوات (٣ من ١١)، ص١٤٤", ["الثالثة: راتبة العصر، وهي: أربع ركعات قبلها، فقد روي عن النبي صلى الله عليه وسلم أنه قال: «رحم الله عبدا صلى أربعا قبل العصر»(٤).", "الرابعة: راتبة المغرب، وهما ركعتان بعدها، وقد كانوا يتطوعون بركعتين قبل المغرب.", "الخامسة: راتبة العشاء، وهما ركعتان أيضا، ويستحب التطوع بعدها بأربع، فقد أخبرنا ابن ناصر قال: أخبرنا جعفر بن أحمد قال: أخبرنا أحمد بن المذهب قال: أخبرنا القطيعي قال: حدثنا عبد الله بن أحمد قال: حدثني عباد بن يعقوب", "حاشية: (١) أخرجه البخاري (١١٨٢).", "حاشية: (٢) أخرجه مسلم (٧٢٨)(١٠٣)، وأبو داود (١٢٥٠)، وابن ماجه (١١٤١).", "حاشية: (٣) أخرجه الترمذي (٤١٥)، والنسائي ٣/ ٢٦٢.", "حاشية: (٤) أخرجه أبو داود الطيالسي (١٩٣٦)، وأحمد (١٢٧١)، والترمذي (٤٣٠)، وابن خزيمة (١١٩٣)، وابن حبان (٢٤٥٣)، وأحمد (٥٩٨٠)، والبيهقي ٢/ ٤٧٣ من حديث ابن عمر بلفظ: «رحم الله امرءا».", "قال: حدثنا عبد الله بن عبد القدوس عن الأعمش عن مجاهد قال: أربع ركعات بعد عشاء الآخرة يعدلن بمثلهن من ليلة القدر(١).", "السادسة: الوتر، وأقله ركعة، وأفضله إحدى عشرة ركعة، يسلم في كل ركعتين، ويوتر بواحدة، وأدنى الكمال ثلاث ركعات بتسليمتين، يقرأ في الأولى بعد الفاتحة ﴿سَبِّحِ ٱسْمَ رَبِّكَ ٱلْأَعْلَى﴾ وفي الثانية: ﴿قُلْ يَٰٓأَيُّهَا ٱلْكَٰفِرُونَ﴾ وفي الثالثة: ﴿قُلْ هُوَ ٱللَّهُ أَحَدٌ﴾ ثم يقنت فيها بعد الركوع، ويرفع يديه فيقول: اللهم إنا نستعينك ونستهديك، ونستغفرك، ونؤمن بك، ونتوكل عليه، ونثني عليك الخير كله، ونشكرك ولا نكفرك، اللهم إياك نعبد، ولك نصلي ونسجد، وإليك نسعى ونحفد، نرجو رحمتك ونخشى عذابك إن عذابك الجد بالكفار ملحق(٢).", "اللهم اهدني فيمن هديت، وعافني فيمن عافيت، وتولني فيمن توليت، وبارك لي فيما أعطيت، وقني شر ما قضيت، إنك تقضي ولا يقضى عليك، إنه لا يذل من واليت، ولا يعز من عاديت، تباركت ربنا وتعاليت(٣). اللهم إني أعوذ برضاك من سخطك، وبعفوك من عقوبتك، وأعوذ بك منك لا أحصي ثناء عليك أنت كما أثنيت على نفسك(٤).", "وهل يمر يديه على وجهه على روايتين.", "حاشية: (١) أخرجه العقيلي في الضعفاء ٤/ ١٠٢.", "حاشية: (٢) أخرجه البيهقي ٢/ ٢١١ من حديث عمر رضي الله عنه.", "حاشية: (٣) أخرجه الترمذي (٤٦٤)، وأبو داود (١٤٢٥)، وأحمد (١٧١٨)، والبيهقي ٢/ ٩ والنسائي ٣/ ٢٤٨، عن الحسن رضي الله عنه.", "حاشية: (٤) أخرجه ابن أبي شيبة ٢/ ٣٠٦، والطيالسي (١٢٣)، وأبو داود (١٤٢٧)، وأحمد (٧٥١)، والنسائي في الكبرى (٧٧٥٣)، والبيهقي ٣/ ٤٢ من حديث علي رضي الله عنه. وأخرجه مسلم (٤٨٦)، وابن أبي شيبة ١٠/ ١٩١، والنسائي في الكبرى (١٥٨)، وابن ماجه (٣٨٤١) وابن خزيمة (٦٥٥) و(٦٧١)، وأحمد (٢٥٦٥٥)، والبيهقي ١/ ١٢٧، وابن حبان (١٩٣٢)، وأبو داود (٨٧٩) من حديث عائشة رضي الله عنها."]], "ic": "book"}, {"story": ["الباب السابع في ذكر النوافل من الصلوات (٤ من ١١)، ص١٤٦", ["والوتر آكد من جميع السنن الراتبة؛ لأنه مختلف في وجوبه، وقال أبو بكر في «التنبيه»: إنه واجب، وقد أومى إلى ذلك إمامنا أحمد رحمه الله، ووقته من بعد صلاة العشاء إلى طلوع الفجر الثاني.", "السابعة: صلاة الضحى، وقد روينا عن النبي صلى الله عليه وسلم أنه قال: «إن للجنة بابا يقال له: ضحى، إذا كان يوم القيامة قيل للذين كانوا يدومون على صلاة الضحى: هذا بابكم فادخلوه»(١). ووقتها إذا علت الشمس واشتد حرها، والأحاديث تختلف في عددها، فروى جبير بن مطعم أن النبي صلى الله عليه وسلم صلاها ركعتين(٢). وأخبرنا هبة الله بن محمد قال: أخبرنا الحسن بن علي قال: أخبرنا أحمد بن جعفر قال: أخبرنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا يزيد قال: حدثنا همام بن يحيى عن قتادة عن معاذة عن عائشة أن النبي صلى الله عليه وسلم كان يصلي الضحى أربعا ويزيد ما شاء الله(٣). انفرد بإخراجه مسلم، وقد روي عن جابر أن النبي صلى الله عليه وسلم صلاها ست ركعات. وقد أخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا القطيعي قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا محمد بن جعفر قال: حدثنا شعبة عن عمرو بن مرة عن ابن أبي ليلى قال: ما أخبرني أحد أنه رأى النبي صلى الله عليه وسلم يصلي الضحى غير أم هانئ، فإنها حدثت أن النبي صلى الله عليه وسلم دخل بيتها يوم فتح مكة، فاغتسل وصلى ثمان ركعات ما رأته صلى صلاة قط أخف منها، غير أنه كان يتم الركوع والسجود(٤) أخرجاه في الصحيحين. وقال الإمام أحمد رحمه الله: هو أصح حديث في الضحى. وقد روي حديث أبي ذر عن النبي صلى الله عليه وسلم أنه قال: «إن", "حاشية: (١) أخرجه المصنف مع غيره في العلل المتناهية ١/ ٤٧٢ من حديث أبي هريرة وقال: هذه الأحاديث لا يصح منها شيء.", "حاشية: (٢) لم أقف عليه من حديث جبير بن مطعم، والمعروف هو حديث أبي ذر عن مسلم (٧٢٠) أنه صلى الله عليه وسلم قال: «يصبح على كل سلامى من أحدكم صدقة، فكل تسبيحة صدقة، وكل تحميدة صدقة، وكل تهليلة صدقة، وكل تكبيرة صدقة، وأمر بالمعروف صدقة، ونهي عن المنكر صدقة، ويجزئ من ذلك ركعتان يركعهما من الضحى».", "حاشية: (٣) أخرجه مسلم (٧١٩)(٧٩).", "حاشية: (٤) أخرجه البخاري (١١٧٦)، ومسلم (٣٣٦).", "صليت الضحى ركعتين لم تكتب من الغافلين، وإن صليت أربعا كتبت من العابدين، وإن صليت ستا لم يتبعك في ذلك اليوم ذنب، وإن صليت ثمانيا كتبت من القانتين، وإن صليت اثنتي عشرة ركعة بنى الله عز وجل لك بيتا في الجنة»(١).", "وقد روى الترمذي من حديث أنس عن النبي صلى الله عليه وسلم أنه قال: «من صلى الضحى اثنتي عشرة ركعة بنى الله له قصرا في الجنة من ذهب»(٢) قال الترمذي: هذا حديث غريب. قلت: والذي قبله كذلك والاختيار العمل على حديث أم هانئ."]], "ic": "book"}, {"story": ["الباب السابع في ذكر النوافل من الصلوات (٥ من ١١)، ص١٤٧", ["الثامنة: إحياء ما بين العشاءين، فقد قيل في قوله تعالى: ﴿تَتَجَافَىٰ جُنُوبُهُمْ عَنِ ٱلْمَضَاجِعِ﴾ [السجدة: ١٦]: إنه إحياء ما بين العشاءين، وفي حديث أبي بكر الصديق رضي الله عنه قال: سمعت رسول الله صلى الله عليه وسلم يقول: «من صلى المغرب وصلى بعدها أربعا كان كمن حج حجة بعد حجة» قلت: فإن صلى بعدها ستا؟ قال: «يغفر له ذنوب خمسين عاما»(٣). وفي حديث عائشة عن النبي صلى الله عليه وسلم قال: «من صلى بعد المغرب أربعا من غير أن يكلم جليسا بنى الله له قصرين مكللين بالدر والياقوت، فإن صلى ستا من غير أن يكلم جليسا غفر الله له ذنوب أربعين عاما»(٤). وفي حديث أبي هريرة عن النبي صلى الله عليه وسلم أنه قال: «من صلى ست ركعات بعد المغرب لم يتكلم بينهن عدلن بعبادة اثنتي عشرة سنة»(٥). وفي حديث عمار بن ياسر عن النبي صلى الله عليه وسلم: «من صلى بعد المغرب ست ركعات غفرت له ذنوبه وإن كانت مثل زبد البحر»(٦). وفي حديث ثوبان عن النبي صلى الله عليه وسلم قال: «من عكف نفسه ما بين المغرب والعشاء في مسجد جماعة لم يتكلم إلا بصلاة أو قرآن كان حقا على الله تعالى أن", "حاشية: (١) أخرجه البيهقي ٣/ ٤٨، والمنذري في الترغيب والترهيب ١/ ٤٦٦.", "حاشية: (٢) أخرجه الترمذي (٤٧٣).", "حاشية: (٣) أخرجه المصنف في العلل المتناهية ١/ ٤٥٨، وقال: لا يصح.", "حاشية: (٤) أخرجه المصنف أيضا في العلل ١/ ٤٥٨، وقال: لا يصح.", "حاشية: (٥) أخرجه الترمذي (٤٣٥) وقال: حديث غريب لا نعرفه إلا من حديث زيد بن الحباب عن عمر بن أبي خثعم.", "حاشية: (٦) أخرجه الطبراني في الصغير ٢/ ٤٨، وأبو نعيم في أخبار أصبهان ٢/ ٢٢٣ والمصنف في العلل المتناهية ١/ ٤٥٧.", "يبني له قصرين في الجنة، مسيرة كل قصر منهما مئة عام، ويغرس له غراسا لو ضافه أهل الدنيا لوسعهم»(١)."]], "ic": "book"}, {"story": ["الباب السابع في ذكر النوافل من الصلوات (٦ من ١١)، ص١٤٨", ["**القسم الثاني:** ما يتكرر بتكرار السنين وهو صلاة العيدين والتراويح، فأما صلاة العيدين؛ ففرض على الكفاية، وأول وقتها إذا ارتفعت الشمس، وآخره إذا زالت، ويسن تقديم الأضحى وتأخير الفطر، وأن يأكل في الفطر قبل الصلاة، ويمسك في الأضحى حتى يصلي، ويسن التكبير بعد غروب الشمس من ليلة الفطر إلى فراغ الإمام من الخطبة الثانية في إحدى الروايتين، وفي الأخرى: إلى حين خروج الإمام للصلاة، وفي الأضحى يبتدئ به من صلاة الفجر يوم عرفة، وإن كان محرما فمن صلاة الظهر يوم النحر إلى العصر من آخر أيام التشريق، وصفة التكبير: الله أكبر الله أكبر لا إله إلا الله، والله أكبر الله أكبر ولله الحمد. ويكبر عقيب الفرائض دون النوافل، ويستحب أن يباكر المأموم بعد صلاة الصبح إلى صلاة العيد على أحسن هيئة وأكمل زينة إلا أن يكون معتكفا فيخرج في ثياب اعتكافه، ويتأخر الإمام إلى الوقت الذي يصلي بهم فيه، ويستحب إقامتها في الصحراء، ويروح الناس إليها مشاة، ويرجعون في طريق أخرى، ويصلي بهم الإمام ركعتين يكبر في الأولى بعد تكبيرة الإحرام ودعاء الاستفتاح وقبل التعوذ ست تكبيرات، وفي الثانية بعد قيامه من السجود خمس تكبيرات، ويرفع يديه مع كل تكبيرة، ويقول: الله أكبر كبيرا والحمد لله كثيرا وسبحان الله بكرة وأصيلا، وصلوات الله على محمد وآله وسلم تسليما. ويقرأ في الأولى بعد الفاتحة بسبح(٢) وفي الثانية بالغاشية، وتكون القراءة بعد التكبير، وإذا أدركه المأموم في الركوع أحرم وتبعه، ولم يتشاغل بقضاء التكبير، فإن أدركه في التشهد قام إذا سلم الإمام فصلى ركعتين يأتي فيهما بالتكبير، فإن أدركه في الخطبة استحب له أن يجلس فيستمع، فإذا انقضت قضى العيد، وفي صفة القضاء ثلاث روايات:", "إحداها: أن يصلي كما يصلي مع الإمام ركعتين.", "حاشية: (١) أخرجه الزبيدي في إتحاف السادة المتقين ٣/ ٦١٧.", "حاشية: (٢) يعني بسورة الأعلى.", "والثانية: يقضيها أربعا.", "والثالثة: هو مخير بين ركعتين أو أربع.", "والأضحية سنة مؤكدة، وعن الإمام أحمد رحمه الله أنها واجبة مع الغني والمسنون أن يأكل الثلث، ويهدي الثلث، ويتصدق بالثلث، هذا إذا قلنا: إنها سنة، فإن قلنا: إنها واجبة احتمل أن يأكل كما نقول في دم التمتع والقران، واحتمل أن لا يأكل كما لو نذر هديا. ولا يجوز بيع جلودها وجلالها(١) بل يتصدق به، ويكره لمن أراد أن يضحي أن يأخذ من بشرته وشعره وظفره شيئا من حين دخول العشر(٢).", "وأما صلاة التراويح فهي عشرون ركعة، ويسن لها الجماعة، كما اختاره عمر رضي الله عنه، ويؤخر الوتر من له تهجد ويكره التطوع بين التراويح، وأما ما يذكر من صلاة الرغائب، وصلاة نصف شعبان(٣)، وصلوات الأسبوع فلم يثبت من ذلك شيء أصلا، فلذلك أضربنا عنه."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "والوتر آكد من جميع السنن الراتبة؛ لأنه مختلف في ____، وقال أبو بكر في «التنبيه»", "o": ["وجوبه", "باحثا", "صاحبها", "ينبته"], "h": "راجع: ص١٤٦"}, {"t": "fill", "d": 2, "q": "الثالثة: راتبة العصر، وهي: أربع ركعات قبلها، فقد روي عن النبي صلى الله عليه ____ أنه قال: «رحم الله عبدا صلى أربعا قبل", "o": ["وسلم", "فوارق", "فليفطر", "بالفقر"], "h": "راجع: ص١٤٤"}, {"t": "fill", "d": 2, "q": "فإن اشتغل الداخل بفعل فريضة أو قضاء حصل المقصود من التحية؛ لأن ____ أن لا يخلو ابتداء الدخول من صلاة", "o": ["المراد", "لفظة", "المحافل", "والنسيان"], "h": "راجع: ص١٥٢"}, {"t": "fill", "d": 2, "q": "اللهم إنا جئناك شفعاء له فشفعنا فيه، وقه فتنة القبر وعذاب النار، واعف عنه، وأكرم مثواه، وأبدله دارا خيرا له من داره، وجوارا خيرا له من جواره، وافعل لك ولنا ولجميع ____، اللهم لا تحرمنا أجره ولا تفتنا بعده", "o": ["المسلمين", "أمريكا", "مقتاتا", "الحدائق"], "h": "راجع: ص١٥٢"}, {"t": "fill", "d": 2, "q": "ولا يتطوع في الأوقات المنهي عنها بصلاة لا سبب لها، كصلاة التسبيح؛ لأن النهي مؤكد، وهذه الأشياء ضعيفة فلا يصلح صدمه بها، فأما مالها سبب، كصلاة الكسوف والاستسقاء، وركعتي الفجر، وتحية المسجد، وركعتي الطواف، وسجود التلاوة والشكر، والوتر إذا فات، وإذا حضرت الجماعة مع إمام الحي وقد كان صلى، فإنه يفعل ____ ركعتي الفجر وركعتي الطواف، ويعيد الجماعة رواية واحدة، وهل يفعل باقيها أم لا", "o": ["منها", "أرسلت", "وورده", "شأنك"], "h": "راجع: ص١٥٤"}, {"t": "fill", "d": 2, "q": "والثاني: الحذر من السجود لمطلع قرن الشيطان، فإن الشمس تطلع ومعها قرن الشيطان، فإذا ____ فارقها، فإذا استوت قارنها، فإذا زالت فارقها، وإذا تضيفت للغروب", "o": ["ارتفعت", "فزعا", "الإيقاظ", "يخسفان"], "h": "راجع: ص١٥٥"}]}, {"t": "الباب السابع في ذكر النوافل من الصلوات - القسم ٢ من ٢", "b": [{"story": ["الباب السابع في ذكر النوافل من الصلوات (٧ من ١١)، ص١٤٩", ["**القسم الثالث من النوافل:** ما يتعلق بأسباب عارضة ولا يتعلق بالمواقيت وهي ثمانية:", "الأولى: صلاة الكسوف:", "وفي الصحيحين من حديث عائشة عن النبي صلى الله عليه وسلم أنه قال: «إن الشمس والقمر آيتان من آيات الله عز وجل، لا يخسفان لموت أحد ولا لحياته، فإذا رأيتم ذلك، فافزعوا إلى الصلاة»(٤).", "حاشية: (١) يعني: جلودها.", "حاشية: (٢) يعني: عشر ذي الحجة.", "حاشية: (٣) نقل الزبيدي في الإتحاف ٣/ ٧٠٢ عن العز بن عبد السلام أنه قال: لم يكن بيت المقدس قط صلاة الرغائب في رجب، ولا صلاة نصف شعبان، فحدث في سنة (٤٤٨)هـ أن قدم عليهم رجل من نابلس يعرف بابن الحي، وكان حسن التلاوة، فقام فصلى في المسجد الأقصى ليلة النصف من شعبان، فأحرم خلفه رجل ثم انضاف ثالث ورابع فما ختم إلا وهم جماعة كثيرة، ثم جاء في العام القابل فصلى معه خلق كثير، وانتشرت في المسجد الأقصى وبيوت الناس ومنازلهم، ثم استقرت كأنها سنة إلى يومنا هذا.", "حاشية: (٤) أخرجه البخاري (١٠٤٤)، ومسلم (٩٠١)(٣).", "فأما وقت صلاة الكسوف؛ فمن حين الكسوف إلى حين التجلي، وأما موضعها؛ فموضع الجمعة وينادى لها: الصلاة جامعة. وأما صفتها؛ فهي أن يصلي بهم ركعتين يحرم بالأولى ويستفتح ويستعيذ، ويقرأ الفاتحة وسورة البقرة يجهر بالقراءة، ثم يركع فيطيل الركوع، ويسبح بمقدار مائة آية، ثم يرفع فيسمع ويحمد(١)، ثم يقرأ الفاتحة وآل عمران، ثم يركع دون الركوع الأول، ثم يرفع فيسمع ويحمد، ثم يسجد سجدتين فيطيل التسبيح فيهما بقدر الركوع، ثم يقوم إلى الثانية فيفعل مثل ذلك إلا أنه يقرأ بالنساء في القيام الأول وبالمائدة في الثاني، ثم يسجد سجدتين، ويتشهد ويسلم، فيكون في كل ركعة قيامان وقراءتان وركوعان وسجودان.", "وعن الإمام أحمد رحمه الله أنه يفعل في كل ركعة أربع ركوعات على نحو ما ذكرنا وسجدتين فإن تجلى الكسوف وهو في الصلاة خففها.", "والثانية: صلاة الاستسقاء:"]], "ic": "book"}, {"story": ["الباب السابع في ذكر النوافل من الصلوات (٨ من ١١)، ص١٥٠", ["وصفتها في موضعها وأحكامها صفة صلاة العيد. ويستحب له التنظف، ولا يتطيب، وإذا أراد الخروج لذلك وعظ الناس وأمرهم بالتوبة من الذنوب، والخروج من المظالم، والصيام، والصدقة، ثم يخرج متواضعا متخشعا متذللا، ويخرج معه الشيوخ والعجائز والصبيان، فإذا صلى بهم خطب خطبة يفتتحها بالتكبير كما يفعل في خطبة العيد، ويكثر من الصلاة على رسول الله صلى الله عليه وسلم، ويقرأ فيها: ﴿ٱسْتَغْفِرُوا۟ رَبَّكُمْ إِنَّهُۥ كَانَ غَفَّارًا﴾ [نوح: ١٠] الآيات، ويرفع يديه فيدعو بدعاء النبي صلى الله عليه وسلم: «اللهم اسقنا غيثا مغيثا مريئا هنيئا مربعا غدقا مجللا سحا عاما طبقا دائما، اللهم اسقنا الغيث ولا تجعلنا من القانطين، اللهم سقيا رحمة لا سقيا عذاب ولا محق ولا بلاء ولا هدم، ولا غرق، اللهم إن بالعباد والبلاد والخلق من اللأواء والجهد والضنك ما لا شكوى منه إلا إليك، اللهم أنبت لنا الزرع، وأدر لنا الضرع، واسقنا من بركات السماء، وأنبت لنا من بركات الأرض، اللهم ارفع عنا الجهد والجوع والعري، واكشف عنا من البلاء ما لا يكشفه غيرك»(٢).", "حاشية: (١) أي يقول: سمع الله لمن حمده.", "حاشية: (٢) أخرجه بنحوه الطبراني في الأوسط (٧٦١٥)، من حديث أنس بن مالك.", "ويستقبل القبلة في أثناء الخطبة، ويحول رداءه فيجعل ما على عاتقه الأيمن على الأيسر وما على الأيسر على الأيمن، ولا يجعل أعلاه أسفله، ويفعل الناس كذلك، ويتركون ذلك حتى ينزعونه مع ثيابهم، ويدعو سرا في حال استقبال القبلة فيقول: اللهم إنك أمرتنا بدعائك ووعدتنا إجابتك وقد دعوناك كما أمرتنا، فاستجب لنا كما وعدتنا.", "فإن لم يسقوا عادوا ثانيا وثالثا.", "ويستحب أن يقف في أول المطر، ويخرج رحله وثيابه ليصيبها، وإذا سال الوادي اغتسل منه وتوضأ، فإذا زاد المطر بحيث يضر قال: «اللهم حوالينا ولا علينا، اللهم على الضراب ومنابت الشجر»(١). ﴿رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِۦ﴾ [البقرة: ٢٨٦] الآية.", "الثالثة: صلاة الجنازة:", "وهي فرض على الكفاية، وأولى الناس بها وصيه(٢)، ثم السلطان، ثم الأقرب من عصباته. وهل يقدم الزوج على العصبات على روايتين ويقف(٣) حذاء صدر الرجل ووسط المرأة، وينوي، ويكبر أربع تكبيرات يقرأ في الأولى بالفاتحة، ويصلي على النبي صلى الله عليه وسلم في الثانية، ويدعو للميت في الثالثة، فيقول: اللهم اغفر لحيينا وميتنا، وشاهدنا وغائبنا، وصغيرنا وكبيرنا وذكرنا وأنثانا إنك تعلم منقلبنا ومثوانا، وأنت على كل شيء قدير، اللهم من أحييته منا فأحيه على الإسلام والسنة، ومن توفيته منا فتوفه عليهما»(٤)، اللهم إنه عبدك ابن عبدك نزل بك وأنت خير منزول به، اللهم إن كان محسنا فجازه بإحسانه، وإن كان مسيئا فتجاوز عنه،", "حاشية: (١) أخرجه البخاري (١٠١٧)، ومسلم (٨٩٧) من حديث أنس."]], "ic": "book"}, {"story": ["الباب السابع في ذكر النوافل من الصلوات (٩ من ١١)، ص١٥١", ["حاشية: (٢) يعني من وصى به الميت.", "حاشية: (٣) أي الإمام.", "حاشية: (٤) أخرجه أحمد (٨٨٠٩)، والترمذي (١٠٢٤)، وابن ماجه (١٤٩٨)، والحاكم ١/ ٣٥٨ من حديث أبي هريرة.", "اللهم إنا جئناك شفعاء له فشفعنا فيه، وقه فتنة القبر وعذاب النار، واعف عنه، وأكرم مثواه، وأبدله دارا خيرا له من داره، وجوارا خيرا له من جواره، وافعل لك ولنا ولجميع المسلمين، اللهم لا تحرمنا أجره ولا تفتنا بعده.", "ويقول في الرابعة: ربنا آتنا في الدنيا حسنة وفي الآخرة حسنة وقنا عذاب النار. ويسلم واحدة عن يمينه.", "الرابعة: تحية المسجد ركعتين:", "أخبرنا هبة الله بن محمد قال: أخبرنا الحسن بن علي قال: أخبرنا أحمد بن جعفر قال: أخبرنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا عبد الرحمن بن مهدي قال: حدثنا مالك عن عامر بن عبد الله ـ يعني ابن الزبير ـ عن عمرو بن سليم عن أبي قتادة قال: قال رسول الله صلى الله عليه وسلم: «إذا دخل أحدكم المسجد فليركع ركعتين قبل أن يجلس»(١) أخرجاه في الصحيحين، وفي بعض الألفاظ الصحيحة: «فلا يجلس حتى يركع ركعتين»(٢).", "فإن اشتغل الداخل بفعل فريضة أو قضاء حصل المقصود من التحية؛ لأن المراد أن لا يخلو ابتداء الدخول من صلاة.", "الخامسة: ركعتان بعد الوضوء:", "مستحبتان؛ لأن الوضوء قربة مقصودها الصلاة، وقد ذكرنا فضل هاتين الركعتين في كتاب الوضوء(٣)، وإذا صلاها نواها نافلة، ولا يقول: ركعتي الوضوء، كما يقول: تحية المسجد.", "السادسة: ركعتان عند دخول المنزل وعند الخروج منه:", "فقد روى أبو هريرة عن النبي صلى الله عليه وسلم أنه قال: «إذا خرجت من منزلك فصل ركعتين تمنعانك مخرج السوء، وإذا دخلت إلى منزلك فصل ركعتين تمنعانك مدخل", "حاشية: (١) أخرجه البخاري (٤٤٤)، ومسلم (٧١٤)، من حديث أبي قتادة.", "حاشية: (٢) أخرجه البخاري (١١٦٣)، ومسلم (٧١٤)(٧٠).", "حاشية: (٣) تقدم في الصفحة (٩٥).", "السوء»(١). وفي معنى هذا كل أمر تبتدئ به، مما له وقع، ولذلك وردت ركعتان عند الإحرام(٢)، وركعتان عند ابتداء السفر(٣).", "السابعة: صلاة الاستخارة:"]], "ic": "book"}, {"story": ["الباب السابع في ذكر النوافل من الصلوات (١٠ من ١١)، ص١٥٣", ["أخبرنا هبة الله بن محمد قال: أخبرنا الحسن بن علي قال: أخبرنا أحمد بن جعفر قال: أخبرنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا إسحاق بن عيسى قال: حدثنا عبد الرحمن بن أبي الموال المدني قال: حدثنا محمد بن المنكدر عن جابر بن عبد الله قال: كان رسول الله صلى الله عليه وسلم يعلمنا الاستخارة كما يعلمنا السورة من القرآن، يقول: «إذا هم أحدكم بالأمر، فليركع ركعتين من غير الفريضة، ثم ليقل: اللهم إني أستخيرك بعلمك، وأستقدرك بقدرتك، وأسألك من فضلك العظيم، فإنك تقدر ولا أقدر، وتعلم ولا أعلم، وأنت علام الغيوب، اللهم إن كنت تعلم أن هذا الأمر ـ يسميه باسمه ـ خير لي في ديني ومعاشي وعاقبة أمري فاقدره لي ويسره، ثم بارك لي فيه، اللهم وإن كنت تعلمه شرا لي في ديني ومعاشي وعاقبة أمري، فاصرفني عنه واصرفه عني، واقدر لي الخير حيث كان ثم أرضني به» انفرد بإخراجه البخاري(٤).", "**الثامنة: صلاة التسبيح:** أخبرنا ابن الحصين قال: أخبرنا ابن المذهب، إذنا، قال: أخبرنا علي بن عمر الدارقطني قال: أخبرنا عبد الله بن سليم بن الأشعث", "حاشية: (١) أورده السيوطي في اللآلئ المصنوعة ٢/ ٤٥ ونسبه للبيهقي في الشعب والبزار، وذكر الهيثمي في المجمع ٢/ ٢٨٣ ـ ٢٨٤ ونسبه للبزار وقال: رجاله موثقون. وأورده المتقي الهندي في الكنز (٥٤٠).", "حاشية: (٢) عن ابن عباس رضي الله عنهما قال: خرج رسول الله صلى الله عليه وسلم حاجا فلما صلى في مسجده بذي الحليفة ركعتيه أوجب في مجلسه فأهل بالحج حين فرغ من ركعتيه... أخرجه أبو داود (٧٧٠) والحاكم ١/ ٤٥١.", "حاشية: (٣) أخرج ابن أبي شيبة ٢/ ٨١ عن المطعم بن مقدام قال: قال رسول الله صلى الله عليه وسلم: «ما خلف عبد على أهله أفضل من ركعتين يركعهما عندهم حين يريد السفر».", "حاشية: (٤) أخرجه البخاري (١١٦٢) من حديث جابر."]], "ic": "book"}, {"story": ["الباب السابع في ذكر النوافل من الصلوات (١١ من ١١)، ص١٥٤", ["قال: حدثنا عبد الرحمن بن بشر بن الحكم قال: حدثنا موسى بن عبد العزيز قال: حدثنا الحكم بن أبان عن عكرمة عن ابن عباس أن رسول الله صلى الله عليه وسلم قال للعباس: «يا عماه، ألا أعطيك، ألا أعلمك، ألا أجيزك، ألا أفعل عشر خصال إذا أنت فعلت ذلك غفر الله لك ذنبك أوله وآخره، قديمه وحديثه، خطأه وعمده، صغيره وكبيره، سره وعلانيته، عشر خصال: أن تصلي أربع ركعات تقرأ في كل ركعة بفاتحة الكتاب وسورة، فإذا فرغت في أول ركعة وأنت قائم قلت: سبحان الله، والحمد لله، ولا إله إلا الله، والله أكبر خمس عشرة مرة، ثم تركع، فتقولها وأنت راكع عشرا، ثم ترفع رأسك من الركوع، فتقولها عشرا، ثم تهوي ساجدا، فتقولها وأنت ساجد عشرا، ثم ترفع رأسك من السجود، فتقولها عشرا، ثم تسجد فتقولها عشرا، ثم ترفع رأسك فتقولها عشرا، فذلك خمس وسبعون في كل ركعة، تفعل ذلك في أربع ركعات، إن استطعت أن تصليها في كل يوم مرة فافعل، فإن لم تفعل، ففي كل جمعة مرة، فإن لم تفعل ففي كل شهر مرة، فإن لم تفعل ففي كل سنة مرة، فإن لم تفعل ففي عمرك مرة»(١).", "**فصل**", "ولا يتطوع في الأوقات المنهي عنها بصلاة لا سبب لها، كصلاة التسبيح؛ لأن النهي مؤكد، وهذه الأشياء ضعيفة فلا يصلح صدمه بها، فأما مالها سبب، كصلاة الكسوف والاستسقاء، وركعتي الفجر، وتحية المسجد، وركعتي الطواف، وسجود التلاوة والشكر، والوتر إذا فات، وإذا حضرت الجماعة مع إمام الحي وقد كان صلى، فإنه يفعل منها ركعتي الفجر وركعتي الطواف، ويعيد الجماعة رواية واحدة، وهل يفعل باقيها أم لا؟ على روايتين، أصحهما: أنه يفعلها.", "**فصل**", "وللنهي عن الصلاة في الأوقات المنهي عنها ثلاثة أسرار:", "حاشية: (١) أخرجه أبو داود (١٢٩٧)، وابن ماجه (١٣٨٧)، وابن خزيمة (١٢١٦)، والبيهقي ٣/ ٥١، والحاكم ١/ ٣١٨.", "أحدها: ترك التشبه بعبدة الشمس.", "والثاني: الحذر من السجود لمطلع قرن الشيطان، فإن الشمس تطلع ومعها قرن الشيطان، فإذا ارتفعت فارقها، فإذا استوت قارنها، فإذا زالت فارقها، وإذا تضيفت للغروب قارنها.", "والثالث: إن سالكي طريق الآخرة مواظبون على العبادات، والمواظبة على نمط واحد تورث الملل، فإذا وقع المنع زاد النشاط؛ لأن الإنسان حريص على ما منع عنه، فمنع من الصلاة ولم يمنع من نوع آخر من التعبد كالقراءة والتسبيح لينتقل العابد من حال إلى حال، كما جعلت الصلاة متنوعة بين قيام وقعود وركوع وسجود إذ الملل مقارن للشيء الواحد.", "آخر كتاب الصلاة"]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "أبيه قال: سمعت عائشة تقول: كان رسول الله صلى الله عليه وسلم لا يدع أربعا قبل الظهر، وركعتين قبل الفجر على كل حال. ____ بإخراجه البخاري. وفي أفراد مسلم من حديث أم حبيبة عن النبي صلى الله عليه", "o": ["انفرد", "والتأكد", "السفر", "طلاب"], "h": "راجع: ص١٤٤"}, {"t": "fill", "d": 2, "q": "ويقول في الرابعة: ربنا آتنا في الدنيا حسنة وفي الآخرة حسنة وقنا عذاب النار. ____ واحدة عن", "o": ["ويسلم", "وذخرها", "ثمانيا", "مغربا"], "h": "راجع: ص١٥٢"}, {"t": "fill", "d": 2, "q": "واعلم أن النوافل باعتبار الإضافة إلى متعلقاتها تنقسم إلى ما يتعلق بأسباب كالخسوف والاستسقاء، وإلى ما يتعلق بأوقات، والمتعلق بالأوقات ينقسم إلى ما يتكرر بتكرر اليوم والليلة أو بتكرر ____ ويتكرر السنة", "o": ["الأسبوع", "وصفاته", "والنفساء", "فليفهم"], "h": "راجع: ص١٤٢"}, {"t": "fill", "d": 2, "q": "الثامنة: صلاة التسبيح: أخبرنا ابن الحصين قال: أخبرنا ابن المذهب، إذنا، قال: أخبرنا علي بن عمر الدارقطني قال: أخبرنا عبد الله بن ____ بن", "o": ["سليم", "سأله", "تشبهوا", "السبك"], "h": "راجع: ص١٥٣"}, {"t": "fill", "d": 2, "q": "وعن الإمام أحمد رحمه الله أنه يفعل في كل ركعة أربع ركوعات على نحو ما ذكرنا وسجدتين فإن ____ الكسوف وهو في الصلاة خففها", "o": ["تجلى", "اختاره", "أمرتنا", "اشترط"], "h": "راجع: ص١٥٠"}, {"t": "fill", "d": 2, "q": "أخبرنا هبة الله بن محمد قال: أخبرنا الحسن بن علي قال: أخبرنا أحمد بن جعفر قال: أخبرنا عبد الله بن أحمد قال: ____ أبي قال: حدثنا عبد الرحمن بن مهدي قال: حدثنا مالك عن عامر بن عبد الله ـ يعني ابن", "o": ["حدثني", "صفته", "كتفيه", "أسلم"], "h": "راجع: ص١٥٢"}]}], "sum": [["الصفحات", "ص١٤٢ - ص١٥٦"]], "_nq": 12}, {"id": "l22", "title": "كتاب أسرار الزكاة ومهماتها", "group": "كتاب أسرار الزكاة ومهماتها", "map": {"center": "كتاب\nأسرار الزكاة", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "كتاب أسرار الزكاة ومهماتها - القسم ١ من ٣", "b": [{"pic": ["books", "book"], "cap": "ص١٥٧ - ص١٨٠"}, {"story": ["كتاب أسرار الزكاة ومهماتها (١ من ١٦)، ص١٥٧", ["الحمد لله الذي فرض في أموال الأغنياء للفقراء قدر ما يحتاجون، وأمرهم بالصبر عن الفضول إن كانوا يفهمون، وأعلمهم أن الدنيا مجاز والكل يذهبون، ونهى الواجدين عن البخل فيما ألزم إن كانوا يسمعون، وأوعدهم على حبس الحق الواجب وسيعلمون ﴿يَوْمَ يُحْمَىٰ عَلَيْهَا فِي نَارِ جَهَنَّمَ فَتُكْوَىٰ بِهَا جِبَاهُهُمْ وَجُنُوبُهُمْ وَظُهُورُهُمْ هَٰذَا مَا كَنَزْتُمْ لِأَنفُسِكُمْ فَذُوقُوا۟ مَا كُنتُمْ تَكْنِزُونَ﴾ [التوبة: ٣٥].", "أما بعد: فإن الله عز وجل جعل الزكاة أحد مباني الإسلام، وقرنها بالصلاة التي هي أعلى الأعلام، فقال تعالى: ﴿وَأَقِيمُوا۟ ٱلصَّلَوٰةَ وَءَاتُوا۟ ٱلزَّكَوٰةَ﴾ [البقرة: ٤٣] وفي الصحيحين من حديث ابن عمر عن النبي صلى الله عليه وسلم أنه قال: «بني الإسلام على خمس: شهادة أن لا إله إلا الله وأن محمدا رسول الله، وإقام الصلاة، وإيتاء الزكاة، والحج، وصوم رمضان»(١).", "وقد شدد الله عز وجل الوعيد على من لا يخرج الزكاة، فقال تعالى: ﴿وَٱلَّذِينَ يَكْنِزُونَ ٱلذَّهَبَ وَٱلْفِضَّةَ وَلَا يُنفِقُونَهَا فِي سَبِيلِ ٱللَّهِ فَبَشِّرْهُم بِعَذَابٍ أَلِيمٍ﴾ ﴿يَوْمَ يُحْمَىٰ عَلَيْهَا فِي نَارِ جَهَنَّمَ﴾ [التوبة: ٣٤ ـ ٣٥] الآية، وقد أخبرنا هبة الله بن محمد قال: أخبرنا الحسن بن علي التميمي قال: أخبرنا أحمد بن جعفر قال: أخبرنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا محمد بن عبيد قال: حدثنا الأعمش عن المعرور بن سويد عن أبي ذر قال: أتيت رسول الله صلى الله عليه وسلم وهو في ظل", "حاشية: (١) أخرجه البخاري (٨)، ومسلم (١٦)(٢١)."]], "ic": "book"}, {"story": ["كتاب أسرار الزكاة ومهماتها (٢ من ١٦)، ص١٥٨", ["الكعبة فقال: «هم الأخسرون ورب الكعبة، هم الأخسرون ورب الكعبة» قال: فأخذني غم وجعلت أتنفس، قال: قلت: هذا شيء حدث في، فقلت: من هم فداك أبي وأمي؟ قال: «الأكثرون إلا من قال في عباد الله هكذا وهكذا وهكذا، وقليل ما هم، ما من رجل يموت فيترك غنما أو إبلا أو بقرا لم يؤد زكاتها إلا جاءته يوم القيامة أعظم ما تكون وأسمن حتى تطأه بأظلافها وتنطحه بقرونها حتى يقضى بين الناس، ثم يعود أولاها على آخرها»(١) أخرجاه في الصحيحين. وأخبرنا عبد الأول قال: أخبرنا الداودي قال: أخبرنا ابن أعين السرخسي قال: أخبرنا الفربري قال: حدثنا البخاري قال: حدثنا عبد الله بن منير سمع أبا النضر قال: حدثنا عبد الرحمن ـ هو ابن عبد الله ـ بن دينار عن أبيه عن أبي صالح عن أبي هريرة قال: قال رسول الله صلى الله عليه وسلم: «من آتاه الله مالا فلم يؤد زكاته مثل له ماله شجاعا أقرع له زبيبتان يطوقه يوم القيامة ثم يأخذ بلهزمتيه ـ يعني شدقيه ـ يقول: أنا مالك أنا كنزك، ثم تلا هذه الآية: ﴿وَلَا يَحْسَبَنَّ ٱلَّذِينَ يَبْخَلُونَ بِمَآ ءَاتَىٰهُمُ ٱللَّهُ مِن فَضْلِهِۦ هُوَ خَيْرًا لَّهُمۖ بَلْ هُوَ شَرٌّ لَّهُمْۖ سَيُطَوَّقُونَ مَا بَخِلُوا۟ بِهِۦ يَوْمَ ٱلْقِيَٰمَةِ﴾ [آل عمران: ١٨٠] إلى آخرها»(٢). وفي أفراد مسلم من حديث أبي هريرة قال: قال رسول الله صلى الله عليه وسلم: «ما من صاحب ذهب ولا فضة لا يؤدي منها حقها إلا إذا كان يوم القيامة صفحت له صفائح من نار فأحمي عليها في نار جهنم، فيكوى بها جنبه وجبينه وظهره كلما ردت أعيدت في يوم كان مقداره ألف سنة خمسين ألف سنة حتى يقضى بين العباد، فيرى سبيله إما إلى الجنة وإما إلى النار» قيل: يا رسول الله فالإبل؟ قال: «ولا صاحب إبل لا يؤدي منها حقها إلا إذا كان يوم القيامة بطح لها بقاع قرقر أوفر ما كانت لا يفقد منها فصيلا واحدا تطؤه بأخفافها وتعضه بأفواهها، كلما مر عليه أولاها رد عليه أخراها في يوم كان مقداره ألف سنة حتى يقضى بين العباد، فيرى سبيله إما إلى الجنة وإما إلى النار»(٣)، وذكر في البقر مثل ذلك.", "حاشية: (١) أخرجه البخاري (٦٦٣٨)، ومسلم (٩٩٠).", "حاشية: (٢) أخرجه البخاري (١٤٠٣).", "حاشية: (٣) أخرجه مسلم (٩٨٦)(٢٣).", "**فصل**", "ونحن نكشف عن أسرار الزكاة وشروطها ومعانيها، وذلك في أربعة فصول:", "**الفصل الأول:** في أنواع الزكوات وأسباب وجوبها.", "**الفصل الثاني:** في آدابها وشروطها.", "**الفصل الثالث:** في القابض وشروط استحقاقه وآداب قبضه.", "**الفصل الرابع:** في صدقة التطوع وفضلها.", "**الفصل الأول**", "**في أنواع الزكوات وأسباب الوجوب**", "الزكاة واجبة على كل حر مسلم تام الملك، فأما العبد فلا زكاة عليه وإن قلنا: إنه يملك، وكذلك المكاتب وما لم يتم ملك الإنسان عليه، كالدين الذي على المكاتب، فلا زكاة فيه."]], "ic": "book"}, {"story": ["كتاب أسرار الزكاة ومهماتها (٣ من ١٦)، ص١٥٩", ["ولا يشترط في وجوب الزكاة البلوغ ولا العقل؛ لأنها تجب في مال الصبي والمجنون، فالزكوات باعتبار متعلقاتها ستة أنواع: زكاة النعم(١)، والنقدين، والتجارة، والمعدن، والمعشرات، وزكاة الفطر.", "**النوع الأول: زكاة النعم:** وهي الإبل، والبقر، والغنم، فأما الإبل فلا شيء فيها حتى تبلغ خمسا ويحول عليه الحول، فيجب فيها شاة، فلو أخرج بعيرا لم يجزئه، وفي العشر شاتان، وفي خمسة عشر ثلاث شياه، وفي العشرين أربع شياه، ولا يجزي في الغنم المخرجة إلا الجذع من الضأن، والثني من المعز، وهو ماله سنة، وفي خمس وعشرين بنت مخاض وهي التي كمل لها سنة، فإن عدمها قبل منه ابن لبون، وهو ماله سنتان وقد دخل في الثالثة، وفي ست وثلاثين بنت لبون، وفي ست وأربعين حقة وهي ما كمل لها ثلاث سنين ودخلت", "حاشية: (١) تحرفت في الأصل إلى: «الغنم».", "في الرابعة وفي إحدى وستين جذعة وهي ما كمل لها أربع سنين ودخلت في الخامسة، وفي ست وسبعين بنتا لبون، وفي إحدى وتسعين حقتان، ولا شيء في زيادتها حتى تبلغ عشرين ومئة، فإذا زادت استونفت الفريضة، فوجب في كل أربعين بنت لبون، وفي كل خمسين حقة، وأما البقر فلا شيء فيها حتى تبلغ ثلاثين، فيجب فيها تبيع أو تبيعة وهو ما كمل له سنة، وفي الأربعين مسنة، وهي ما كمل لها سنتان إلى ستين فيجب فيها تبيعان، وعلى هذا أبدا في كل ثلاثين تبيع وفي كل أربعين مسنة.", "ولا تجب الزكاة في الظباء، وهل تجب في بقر الوحش على روايتين، وتجب في المتولد بين الوحشي والأهلي. والجواميس جنس من البقر.", "وأما الغنم فلا شيء فيها حتى تبلغ أربعين فيجب فيها شاة، وفي المائة وإحدى وعشرين شاتان، وفي ماتين وواحدة ثلاث شياه إلى أربعمائة، فيكون في كل مئة شاة، وعن الإمام أحمد رحمه الله أنها إذا بلغت ثلثمائة وواحدة ففيها أربع شياه، ثم في كل مائة شاة.", "والفصلان(١) والعجاجيل(٢) والسخال(٣) تتبع الأمهات في الحول إذا كانت الأمهات نصابا، فإن لم تكن نصابا لكن كملت بأولادها في أثناء الحول احتسب حول الجميع من حين الكمال، وعن أحمد أنه يحتسب حول الجميع من حين ملك الأمهات.", "ولا يؤخذ في الصدقة الربى وهي التي تربي ولدها، ولا الماخض، وهي الحامل، ولا ما طرقها الفحل؛ لأن الغالب أنها حامل، ولا الأكولة، وهي السمينة، ولا فحل الغنم المعد للضراب، ولا حزرات(٤) المال، وهي خياره، ولا هرمة، ولا ذات عوار.", "حاشية: (١) الفصلان: جمع فصيل، وهو ولد الناقة إذا فصل عن أمه.", "حاشية: (٢) العجاجيل: جمع عجل، وهو ولد البقرة.", "حاشية: (٣) السخال: جمع سخلة، وهو ولد الشاة ما كان.", "حاشية: (٤) ورد في هامش (ظ) ما نصه: «هو ما تحزره العين لأجل حسنه». وحزرة الماء خياره،"]], "ic": "book"}, {"story": ["كتاب أسرار الزكاة ومهماتها (٤ من ١٦)، ص١٦١", ["وإذا اختلط نفسان أو أكثر من أهل الزكاة في نصاب من الماشية حولا، فحكم زكاتهم كحكم زكاة الواحد، ولا تؤثر الخلطة في غير المواشي من الأثمان والحبوب والثمار في إحدى الروايتين، وفي الأخرى: تؤثر.", "**النوع الثاني: زكاة المعشرات:** فتجب الزكاة في كل زرع يكال ويدخر سواء كان مقتاتا كالحنطة والشعير والأرز والباقلى والشهدانج(١)، أو غير مقتات كبزر الكتان، وبزر الفجل، وحب القثاء والكمون، وسواء كان مما ينبته الآدميون أو مما ينبت بنفسه كبزر قطونا، والأشنان. وكذلك يجب في الثمار التي تكال وتدخر كالتمر والزبيب واللوز والفستق، ولا تجب في الخوخ والمشمش والإجاص والكمثرى والتين، ولا في الخضراوات كالبطيخ والقثاء والباذنجان والبقول.", "واختلفت الرواية في القطن والزيتون والزعفران فإن قلنا: تجب الزكاة في ذلك، فقال القاضي أبو يعلى: يتوجه أن يجعل نصابه ما قيمته قيمة خمسة أوسق من أدنى ما تخرجه الأرض مما يجب فيه الزكاة ويخرج الورس(٢) والعصفر على وجهين قياسا على الزعفران في وجوب الزكاة فيه وفي مقدار نصابه.", "ولا زكاة في جميع ذلك حتى يبلغ بعد تصفية الحبوب وجفاف الثمار خمسة أوسق الوسق ستون صاعا، والصاع خمسة أرطال وثلث بالعراقي فيكون ذلك ألفا وستمائة رطل إلا الأرز والعلس، وهو نوع من الحنطة يدخر في قشره، فإن نصابه عشرة أوسق مع قشره.", "ويجب في العسل العشر سواء أخذه من موضع يملكه أو لا يملكه، ونصابه عشرة أفراق، قال ابن حامد: الفرق ستون رطلا، وقال القاضي أبو يعلى: ستة وثلاثون رطلا.", "حاشية (تتمة): والجمع: حزرات، وفي الحديث: «لا تأخذ من حزرات أنفس الناس شيئا» سميت كذلك لأن صاحبها لم يزل يحزرها في نفسه. اللسان: (حزر).", "حاشية: (١) الشهدانج: حب القنب.", "حاشية: (٢) الورس: نبات كالسمسم، يصبغ به.", "**النوع الثالث: زكاة النقدين:** لا زكاة في الذهب حتى يبلغ عشرين دينارا، فيجب فيه ربع العشر، ولا في الفضة حتى تبلغ مائتي درهم فيجب فيها خمسة دراهم وما زاد على النصاب فيهما فبحسابه، فإن نقص النصاب حبة أو حبتين لم يمنع وجوب الزكاة، وإن نقص دانقا أو دانقين فهل يمنع؟ فيه روايتان، وهل يضم الذهب إلى الفضة في النصاب؟ فيه روايتان، فإن قلنا: يضم، ضم بالأجزاء لا بالقيمة، وقيل: يضم بما يكون أحوط للفقراء من الأجزاء أو القيمة.", "ومن ملك ذهبا مغشوشا أو فضة مغشوشة فلا زكاة حتى يبلغ مقدار الذهب والفضة نصابا، ويخرج عن الصحاح صحاحا من جنسها، فإن أخرج مكسرة أو بهرجة(١) زاد فيما يخرج مقدار ما بينهما من الفضل.", "ولا زكاة في الحلي المباح إذا كان معدا للاستعمال، والمباح للرجال من الفضة الخاتم وقبيعة(٢) السيف، وفي حلية المنطقة روايتان، وعلى قياسها الجوشن(٣)، والخوذة، والخف، والران(٤)، والحمائل(٥)، ومن الذهب ما دعت إليه الضرورة كالأنف وما تربط به الأسنان."]], "ic": "book"}, {"story": ["كتاب أسرار الزكاة ومهماتها (٥ من ١٦)، ص١٦٢", ["والمباح للنساء من الذهب والفضة ما جرت العادة لهن بلبسه كالخلخال والسوار والطوق والتاج، فإن لم يعد ذلك للاستعمال لكن للكراء أو النفقة إن احتيج إليه؛ وجبت فيه الزكاة، وتجب الزكاة في الأواني المتخذة من الذهب والفضة.", "**النوع الرابع: زكاة التجارة:** تجب الزكاة في قيم عروض التجارة، وتؤخذ منها لا من العروض.", "**النوع الخامس: المعدن:** فمن كان من أهل الزكاة، فاستخرج من معدن في أرض مباحة أو مملوكة نصابا من الذهب أو الفضة أو ما يبلغ قيمته نصابا من جميع", "حاشية: (١) بهرجة، أي: ردية باطلة.", "حاشية: (٢) قبيعة السيف: ما يجعل على طرف القبضة.", "حاشية: (٣) الجوشن: الدرع.", "حاشية: (٤) الران: شيء يلبس تحت الخف.", "حاشية: (٥) الحمائل: جمع حمالة، وهي علاقة السيف.", "ما يقع عليه اسم المعدن، كالياقوت والزبرجد والعقيق والصفر والزيبق والكحل والنفط والنورة وما أشبه ذلك، ففيه الزكاة في الحال ربع العشر سواء استخرجه في دفعة أو دفعات بعد أن لا يترك العمل فيها ترك إهمال.", "ولايجب إخراج زكاته إلا بعد السبك والتصفية، ومصرفه مصرف الزكوات.", "وأما ما يصيبه من البحر كاللؤلؤ والمرجان والعنبر والسمك فهل حكمه حكم المعدن؟ فيه روايتان؛ إحداهما: حكمه حكم المعدن، والثانية: لا شيء فيه بحال.", "وأما الركاز، وهو ما وجد من دفن الجاهلية في موات أو مملوك لا يعرف مالكه، فإنه يجب فيه الخمس في الحال، أي نوع كان من المال قل أو كثر، فإن وجده في مكان يعرف مالكه، فإن كان المالك مسلما أو ذميا، فهو لمالك المكان وإن كان المالك حربيا وقدر عليه بنفسه، فهو ركاز، وإن لم يقدر عليه إلا بجماعة من المسلمين، فهو غنيمة.", "ومصرف الركاز مصرف خمس الفيء، وعن الإمام أحمد أن مصرفه مصرف الزكوات؟", "**النوع السادس: صدقة الفطر:** فرضها رسول الله صلى الله عليه وسلم، ففي الصحيحين من حديث ابن عمر أن رسول الله صلى الله عليه وسلم فرض زكاة الفطر من رمضان صاعا من تمر أو صاعا من شعير على كل حر أو عبد ذكر أو أنثى من المسلمين، وأمر بها أن تؤدى قبل خروج الناس إلى الصلاة.", "والواجب في صدقة الفطر صاع قدره خمسة أرطال وثلث بالعراقي يخرج من التمر أو الزبيب أو البر أو الشعير أو دقيقهما أو سويقهما، فأما الأقط فعن الإمام أحمد أنه لا يخرج مع وجود هذه الأصناف، وعنه: يخرج على الإطلاق. فأما ما عدا هذه الأصناف فلا يجزئ إخراجه مع وجودها، ويجوز إخراج صاع من الأجناس المنصوص عليها، والأفضل التمر، ثم الزبيب، ثم البر، ثم الشعير.", "وزكاة الفطر واجبة على كل مسلم فضل عن قوته وقوت عياله يوم العيد وليلته صاع، فإن فضل بعض صاع فهل يلزمه إخراجه؟ على روايتين."]], "ic": "book"}, {"story": ["كتاب أسرار الزكاة ومهماتها (٦ من ١٦)، ص١٦٤", ["ومن لزمته فطرة نفسه لزمته فط
