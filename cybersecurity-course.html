<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cybersecurity Journey</title>
<meta name="description" content="منهج الأمن السيبراني من الصفر: شرح تفصيلي تفاعلي، أسئلة، نجوم وأوسمة">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Aref+Ruqaa:wght@700&family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#FFF9F0; --page:#F4EDE1; --ink:#1E1B3A; --ink-2:#4A4766; --ink-3:#8A86A3; --line:#ECE5D8; --line-2:#DDD5C6; --card:#FFFFFF;
  --blue:#3B82F6; --blue-d:#1D4ED8; --blue-s:#DBEAFE;
  --pink:#0891B2; --pink-d:#0E7490; --pink-s:#CFFAFE;
  --green:#22C55E; --green-d:#15803D; --green-s:#DCFCE7;
  --yellow:#FACC15; --yellow-d:#CA8A04; --yellow-s:#FEF9C3;
  --violet:#0891B2; --violet-d:#0E7490; --violet-s:#E0F2FE;
  --orange:#0EA5E9; --orange-d:#0369A1; --orange-s:#E0F2FE;
  --teal:#14B8A6; --teal-d:#0F766E; --teal-s:#CCFBF1;
  --ok:#16A34A; --ok-d:#166534; --ok-s:#DCFCE7;
  --bad:#EF4444; --bad-d:#B91C1C; --bad-s:#FEE2E2;
  --c:#2563EB; --c2:#0891B2; --cd:#1D4ED8; --cs:#EFF6FF; --hl:#BFDBFE; --on:#FFFFFF;
  --f-display:"Baloo Bhaijaan 2","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-brand:"Aref Ruqaa","Noto Naskh Arabic",serif;
  --f-read:"Noto Naskh Arabic","Traditional Arabic","Times New Roman",serif;
  --f-math:"Baloo Bhaijaan 2","Segoe UI","Noto Sans","Helvetica Neue",Arial,"Noto Sans Math","Segoe UI Symbol","DejaVu Sans",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --star:polygon(50% 0,64.64% 14.64%,85.36% 14.64%,85.36% 35.36%,100% 50%,85.36% 64.64%,85.36% 85.36%,64.64% 85.36%,50% 100%,35.36% 85.36%,14.64% 85.36%,14.64% 64.64%,0 50%,14.64% 35.36%,14.64% 14.64%,35.36% 14.64%);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--f-display);direction:rtl;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--c);outline-offset:2px}
b{color:var(--ink);font-weight:700}

#app{position:relative;height:100%;max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden;isolation:isolate}
@media (min-width:520px){#app{box-shadow:0 0 0 1px var(--line-2),0 30px 80px -20px rgba(80,60,30,.25)}}
#app::before{content:"";position:absolute;inset:-35%;z-index:0;pointer-events:none;
  background:radial-gradient(circle at 22% 18%,rgba(8,145,178,.16),transparent 30%),radial-gradient(circle at 82% 26%,rgba(59,130,246,.17),transparent 32%),radial-gradient(circle at 26% 78%,rgba(14,165,233,.18),transparent 30%),radial-gradient(circle at 78% 82%,rgba(34,197,94,.15),transparent 30%),radial-gradient(circle at 50% 50%,rgba(79,70,229,.10),transparent 36%);
  animation:mesh 38s linear infinite}
@keyframes mesh{to{transform:rotate(360deg)}}
.sky{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sh{position:absolute;opacity:.5;animation:floaty var(--d,18s) ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
.sh.hex{clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.sh.dot{border-radius:50%}
.sh.ring{border-radius:50%;background:none!important;border:4px solid var(--col)}
.sh.sq{border-radius:28%}
.sh.plus{background:none!important}
.sh.plus::before,.sh.plus::after{content:"";position:absolute;background:var(--col);border-radius:4px}
.sh.plus::before{inset:38% 0}
.sh.plus::after{inset:0 38%}
@keyframes floaty{0%{transform:translate(0,0) rotate(0) scale(1)}50%{transform:translate(var(--tx,14px),var(--ty,-22px)) rotate(calc(var(--r,40deg) / 2)) scale(1.08)}100%{transform:translate(calc(var(--tx,14px) * -1),var(--ty2,18px)) rotate(var(--r,40deg)) scale(.94)}}
#host{position:absolute;inset:0;z-index:1}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}

/* ---------- screens & slides ---------- */
.screen,.slide{position:absolute;inset:0;display:flex;flex-direction:column}
.in-fwd{animation:inFwd .5s var(--ease) both}
.in-back{animation:inBack .5s var(--ease) both}
.out-fwd{animation:outFwd .32s ease both;pointer-events:none}
.out-back{animation:outBack .32s ease both;pointer-events:none}
@keyframes inFwd{from{opacity:0;transform:translateX(-44px) scale(.97) rotate(-.6deg)}to{opacity:1;transform:none}}
@keyframes inBack{from{opacity:0;transform:translateX(44px) scale(.97) rotate(.6deg)}to{opacity:1;transform:none}}
@keyframes outFwd{to{opacity:0;transform:translateX(44px) scale(.97)}}
@keyframes outBack{to{opacity:0;transform:translateX(-44px) scale(.97)}}

.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 16px 30px;overscroll-behavior:contain;scroll-behavior:smooth}
.foot{padding:12px 16px 14px;display:grid;gap:8px;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:2px solid var(--line);transition:background .3s,border-color .3s}
.foot.okstate{background:linear-gradient(0deg,#D1FAE5,#ECFDF5);border-top-color:#86EFAC}

.bar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(255,255,255,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:2px solid var(--line)}
.bar-t{flex:1;min-width:0}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--cd);background:var(--cs);border-radius:99px;padding:3px 12px}
.h-display{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1.35;color:var(--cd);margin:8px 0 6px;text-wrap:balance}
.h-display.sm{font-size:22px;margin:0;color:var(--ink)}
.grad-text{background:linear-gradient(90deg,var(--c),var(--c2),var(--c));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gshift 5s linear infinite}
@keyframes gshift{to{background-position:200% center}}
.stitle{font-family:var(--f-display);font-weight:800;font-size:25px;line-height:1.5;color:var(--cd);margin:10px 0 14px;text-wrap:balance}
.lede{font-family:var(--f-read);font-size:17px;line-height:1.95;color:var(--ink-2);margin:0 0 10px}

/* ---------- buttons ---------- */
.btn{position:relative;overflow:hidden;border:0;border-radius:18px;padding:12px 18px;min-height:56px;width:100%;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:19px;transition:transform .12s,box-shadow .12s,filter .2s}
.btn svg{width:22px;height:22px;flex:none}
.btn-main{background:linear-gradient(135deg,var(--c),var(--c2));color:var(--on);box-shadow:0 6px 0 var(--cd),0 14px 26px -10px var(--c)}
.btn-main::after,.btn-ok::after{content:"";position:absolute;top:0;bottom:0;width:38%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:shine 3.4s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
.btn:active:not([disabled]){transform:translateY(4px)}
.btn-main:active:not([disabled]){box-shadow:0 2px 0 var(--cd)}
.btn-ok{background:linear-gradient(135deg,#22C55E,#16A34A);color:#fff;box-shadow:0 6px 0 var(--ok-d)}
.btn-ok:active{box-shadow:0 2px 0 var(--ok-d)}
.btn-bad{background:var(--bad);color:#fff;box-shadow:0 6px 0 var(--bad-d)}
.btn-ghost{background:#fff;color:var(--ink);border:2px solid var(--line-2);box-shadow:0 4px 0 var(--line-2);min-height:52px}
.btn-link{background:none;color:var(--ink-2);min-height:40px;padding:6px;font-weight:600;font-size:16px}
.btn[disabled]{filter:grayscale(1);opacity:.5;cursor:not-allowed;box-shadow:none}
.btn[disabled]::after{display:none}
.ib{width:44px;height:44px;flex:none;border-radius:14px;background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);color:var(--ink-2);display:grid;place-items:center;cursor:pointer;padding:0}
.ib svg{width:20px;height:20px}
.ib:active{transform:translateY(2px);box-shadow:none}

/* ---------- mascot ---------- */
.mascot{display:block;overflow:visible}
.mascot .mbody{transform-origin:60px 100px;transform-box:view-box}
.mascot .eyes{transform-origin:60px 52px;transform-box:view-box;animation:blink 4.2s infinite}
.mascot .shadow{transform-origin:60px 112px;transform-box:view-box}
.m-idle .mbody{animation:mbob 2.6s ease-in-out infinite}
.m-idle .shadow{animation:mshadow 2.6s ease-in-out infinite}
.m-happy .mbody{animation:mjump .9s var(--spring) infinite}
.m-happy .shadow{animation:mshadow2 .9s var(--spring) infinite}
.m-sad .mbody{animation:msad 2.4s ease-in-out infinite}
.m-wave .mbody{animation:mwave 1.8s ease-in-out infinite}
.m-wave .shadow{animation:mshadow 1.8s ease-in-out infinite}
@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
@keyframes mbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes mshadow{0%,100%{transform:scaleX(1);opacity:.25}50%{transform:scaleX(.82);opacity:.15}}
@keyframes mjump{0%,100%{transform:translateY(0) scale(1.04,.96)}35%{transform:translateY(-18px) scale(.96,1.05) rotate(-6deg)}60%{transform:translateY(-12px) rotate(6deg)}}
@keyframes mshadow2{0%,100%{transform:scaleX(1);opacity:.25}35%{transform:scaleX(.6);opacity:.1}}
@keyframes msad{0%,100%{transform:translateY(3px) rotate(-3deg)}50%{transform:translateY(5px) rotate(3deg)}}
@keyframes mwave{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}

/* ---------- 8-point star (3D) ---------- */
.khatam{position:relative;display:grid;place-items:center;border:0;background:none;padding:0}
.khatam::before,.khatam::after{content:"";position:absolute;inset:0;clip-path:var(--star)}
.khatam::before{background:var(--cd);transform:translateY(6px)}
.khatam::after{background:linear-gradient(160deg,var(--c2),var(--c))}
.khatam>*{position:relative;z-index:1}

/* ---------- splash ---------- */
.splash{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 16px;gap:12px}
.hero-m{position:relative;width:190px;height:190px;display:grid;place-items:center;animation:popIn .9s var(--spring) both}
.hero-m .mascot{width:132px;height:132px;position:relative;z-index:2}
.orb{position:absolute;inset:0;border-radius:50%;border:3px dashed rgba(139,92,246,.35);animation:spin 22s linear infinite}
.orb.o2{inset:18px;border:3px dotted rgba(236,72,153,.35);animation-duration:16s;animation-direction:reverse}
.orb i{position:absolute;width:16px;height:16px;border-radius:50%;top:-9px;left:calc(50% - 8px)}
.orb i:nth-child(2){top:auto;bottom:-9px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes popIn{from{opacity:0;transform:scale(.4) rotate(-20deg)}to{opacity:1;transform:none}}
.brand{font-family:var(--f-brand);font-weight:700;font-size:60px;line-height:1.25;margin:0;background:linear-gradient(90deg,#0891B2,#0891B2,#3B82F6,#14B8A6,#0891B2);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gshift 6s linear infinite,rise .8s var(--ease) .15s both;filter:drop-shadow(0 4px 0 rgba(139,92,246,.18))}
.tagline{font-family:var(--f-read);font-size:17px;line-height:1.9;color:var(--ink-2);margin:0;animation:rise .8s var(--ease) .3s both;max-width:34ch}
.feat{list-style:none;padding:0;margin:4px 0 8px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.feat li{font-size:14.5px;font-weight:700;padding:6px 14px;border-radius:99px;animation:popIn .6s var(--spring) both}
.feat li:nth-child(1){background:var(--blue-s);color:var(--blue-d);animation-delay:.45s}
.feat li:nth-child(2){background:var(--pink-s);color:var(--pink-d);animation-delay:.55s}
.feat li:nth-child(3){background:var(--green-s);color:var(--green-d);animation-delay:.65s}
.feat li:nth-child(4){background:var(--orange-s);color:var(--orange-d);animation-delay:.75s}
.splash-cta{width:100%;max-width:340px;display:grid;gap:12px;animation:rise .8s var(--ease) .8s both}
.src{font-size:14px;color:var(--ink-3);margin-top:4px;font-weight:600}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ---------- home ---------- */
.home-bar{flex-wrap:wrap;row-gap:10px}
.home-title{font-family:var(--f-brand);font-weight:700;font-size:32px;line-height:1.3;margin:0;flex:1;--c:#0891B2;--c2:#0891B2}
.stat{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:99px;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;border:2px solid transparent}
.stat svg{width:19px;height:19px}
.stat.xp{background:var(--yellow-s);color:var(--yellow-d);border-color:#FDE68A} .stat.xp svg{fill:var(--yellow)}
.stat.st{background:var(--pink-s);color:var(--pink-d);border-color:#A5F3FC} .stat.st svg{fill:var(--pink)}
.tools{display:flex;gap:8px;width:100%}
.tool{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:14px;background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);color:var(--ink);font-weight:700;font-size:15px;cursor:pointer;padding:0 8px}
.tool:active{transform:translateY(2px);box-shadow:none}
.tool svg{width:20px;height:20px}
.tool:nth-child(1) svg{color:var(--violet)} .tool:nth-child(2) svg{color:var(--orange)} .tool:nth-child(3) svg{color:var(--blue)} .tool:nth-child(4) svg{color:var(--pink)}
.tool.sq{flex:none;width:44px}
.hello{position:relative;display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:22px;padding:12px 14px;box-shadow:0 6px 0 var(--line);margin-bottom:8px;overflow:hidden;animation:rise .6s var(--ease) both}
.hello .mascot{width:70px;height:70px;flex:none}
.hello-t{flex:1;min-width:0}
.hello-t strong{display:block;font-size:18px;font-weight:800;color:var(--ink);line-height:1.4}
.hello-t span{display:block;font-size:14px;color:var(--ink-2);margin:2px 0 8px;font-weight:600}
.track{height:14px;border-radius:99px;background:#F1EBDF;overflow:hidden;position:relative}
.track i{position:absolute;inset-block:0;right:0;border-radius:99px;background:linear-gradient(270deg,#0891B2,#0891B2,#3B82F6,#14B8A6,#22C55E);background-size:300% 100%;transition:width 1s var(--ease);animation:gshift 6s linear infinite}
.track i::after{content:"";position:absolute;inset:3px 6px auto;height:4px;border-radius:9px;background:rgba(255,255,255,.5)}

.path{position:relative;padding:56px 0 40px}
.path svg.pline{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.pline path{fill:none;stroke:#D8CFBF;stroke-width:6;stroke-dasharray:.5 14;stroke-linecap:round}
.pline path.done{stroke-width:7}
.pnode{position:relative;display:flex;flex-direction:column;align-items:center;margin:0 auto 48px;width:176px;transform:translateX(var(--x,0));animation:nodeIn .6s var(--spring) both;animation-delay:calc(var(--i) * .06s)}
@keyframes nodeIn{from{opacity:0;transform:translateX(var(--x,0)) scale(.4)}to{opacity:1;transform:translateX(var(--x,0)) scale(1)}}
.med{width:86px;height:86px;cursor:pointer;transition:transform .12s}
.med:active{transform:translateY(4px)}
.med .mn{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;color:var(--on);text-shadow:0 2px 0 rgba(0,0,0,.12);margin-top:4px}
.med>svg{width:34px;height:34px;color:var(--on)}
.pnode.locked .med{--c:#E7E2D8;--c2:#F2EEE6;--cd:#CFC7B8;--on:#A39B8B}
.pnode.current .med{animation:bob 2.4s ease-in-out infinite}
.rip{position:absolute;inset:-4px;border-radius:50%;border:3px solid var(--c);opacity:0;animation:ripple 2.2s ease-out infinite;z-index:0!important}
.rip.r2{animation-delay:1.1s}
@keyframes ripple{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.5);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.donecheck{position:absolute!important;bottom:-2px;left:-2px;width:28px;height:28px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;border:3px solid #fff;z-index:3!important;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.donecheck svg{width:14px;height:14px}
.med .lock{position:absolute;bottom:0;left:0;width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--line-2);display:grid;place-items:center;color:var(--ink-3);z-index:2}
.med .lock svg{width:14px;height:14px}
.pnode.exam .med{width:100px;height:100px}
.nope{animation:shake .45s!important}
.plabel{margin-top:12px;text-align:center;display:grid;gap:2px}
.plabel .pg{font-size:12.5px;font-weight:700;color:var(--cd)}
.plabel .pt{font-family:var(--f-read);font-weight:700;font-size:15.5px;line-height:1.55;color:var(--ink);text-wrap:balance}
.pnode.locked .plabel .pt{color:var(--ink-3);font-weight:400}
.pnode.locked .plabel .pg{color:var(--ink-3)}
.pstars{display:flex;justify-content:center;gap:2px;margin-top:2px}
.pstars svg{width:18px;height:18px;fill:#E4DDCF}
.pstars svg.on{fill:var(--yellow);filter:drop-shadow(0 1px 0 var(--yellow-d))}
.bubble{position:absolute;top:-46px;z-index:3;background:linear-gradient(135deg,var(--c),var(--c2));color:var(--on);font-weight:800;font-size:14px;padding:4px 14px;border-radius:12px;white-space:nowrap;box-shadow:0 4px 0 var(--cd);animation:bubble 1.6s ease-in-out infinite}
.bubble::after{content:"";position:absolute;bottom:-7px;left:50%;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:var(--cd)}
@keyframes bubble{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.path-end{text-align:center;color:var(--ink-3);font-size:14px;font-weight:600;margin-top:-10px}

/* ---------- lesson bar ---------- */
.lbar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(255,255,255,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:2px solid var(--line)}
.prog{flex:1;height:16px;border-radius:99px;background:#F1EBDF;overflow:hidden;position:relative;min-width:60px}
.prog-f{position:absolute;inset-block:0;right:0;width:0;border-radius:99px;background:linear-gradient(270deg,var(--c),var(--c2));transition:width .7s var(--spring);overflow:hidden}
.prog-f::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.22) 0 8px,transparent 8px 16px);animation:stripes 1s linear infinite}
.prog-f::after{content:"";position:absolute;inset:3px 6px auto 6px;height:4px;border-radius:9px;background:rgba(255,255,255,.55)}
@keyframes stripes{to{background-position:32px 0}}
.lxp{display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 10px;border-radius:99px;background:var(--yellow-s);color:var(--yellow-d);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;flex:none;border:2px solid #FDE68A}
.lxp svg{width:16px;height:16px;fill:var(--yellow)}
.lxp.pop{animation:xpPop .5s var(--spring)}
@keyframes xpPop{40%{transform:scale(1.3)}}
.hearts{display:flex;gap:1px;min-width:0}
.hearts.hide{display:none}
.heart{width:24px;height:24px;display:grid;place-items:center;color:#0EA5E9;transition:opacity .3s}
.heart svg{width:23px;height:23px;fill:currentColor;filter:drop-shadow(0 2px 0 #0369A1)}
.heart.lost{color:#E4DDCF}
.heart.lost svg{filter:none}
.heart.breaking{animation:hbreak .8s var(--ease)}
@keyframes hbreak{0%{transform:scale(1);color:#0EA5E9}30%{transform:scale(1.7) rotate(-15deg);color:#0EA5E9}100%{transform:scale(1);color:#E4DDCF}}
.stage{flex:1;position:relative;overflow:hidden}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;opacity:0}
.stage.g-ok::after{animation:gok .9s ease-out}
.stage.g-bad::after{animation:gbad .7s ease-out}

.b-list li:nth-child(6n+1){--k:var(--blue)} .b-list li:nth-child(6n+2){--k:var(--pink)} .b-list li:nth-child(6n+3){--k:var(--green)} .b-list li:nth-child(6n+4){--k:var(--orange)} .b-list li:nth-child(6n+5){--k:var(--violet)} .b-list li:nth-child(6n+6){--k:var(--teal)}

/* ---------- radial mind map ---------- */

/* ---------- questions ---------- */
.qmeta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}

.fchips{display:flex;flex-wrap:wrap;gap:10px}

.fchip:nth-child(4n+1){--ks:var(--blue-s);--kb:#BFDBFE;--kd:var(--blue-d)} .fchip:nth-child(4n+2){--ks:var(--pink-s);--kb:#A5F3FC;--kd:var(--pink-d)} .fchip:nth-child(4n+3){--ks:var(--orange-s);--kb:#BAE6FD;--kd:var(--orange-d)} .fchip:nth-child(4n+4){--ks:var(--violet-s);--kb:#BAE6FD;--kd:var(--violet-d)}

.help{font-size:14.5px;font-weight:700;color:var(--ink-2);margin:0 0 12px;display:flex;align-items:center;gap:6px}
.help svg{width:18px;height:18px;color:var(--c);flex:none}
.slots{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:9px}
.slot{display:flex;align-items:center;gap:10px;min-height:56px;border:3px dashed var(--line-2);border-radius:16px;padding:8px 12px;cursor:pointer;transition:all .2s;background:rgba(255,255,255,.5)}
.slot .sn{flex:none;width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--c),var(--c2));display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--on)}
.slot .st{font-family:var(--f-read);font-size:17px;font-weight:600;line-height:1.75}
.slot.full{border-style:solid;border-color:var(--hl);background:#fff;animation:pop .35s var(--spring)}
.slot.ok{border-color:var(--green);background:var(--ok-s)}
.slot.ok .sn{background:var(--green);color:#fff}
.slot.bad{border-color:var(--bad);background:var(--bad-s);animation:shake .45s}
.pool{display:grid;gap:9px}
.pitem{text-align:start;border:2px solid var(--line-2);background:#fff;border-radius:16px;padding:11px 14px;font-family:var(--f-read);font-size:17px;font-weight:600;line-height:1.75;cursor:pointer;box-shadow:0 4px 0 var(--line-2);animation:optIn .5s var(--spring) both}
.pitem:active{transform:translateY(3px);box-shadow:none}
.mterms{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px}
.mterm{border:2px solid var(--kb);background:var(--ks);color:var(--kd);border-radius:16px;padding:9px 14px;font-family:var(--f-read);font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 var(--kb);transition:all .2s;animation:pop .5s var(--spring) both}
.mterm:nth-child(5n+1){--ks:var(--blue-s);--kb:#93C5FD;--kd:var(--blue-d)} .mterm:nth-child(5n+2){--ks:var(--pink-s);--kb:#F9A8D4;--kd:var(--pink-d)} .mterm:nth-child(5n+3){--ks:var(--orange-s);--kb:#FDBA74;--kd:var(--orange-d)} .mterm:nth-child(5n+4){--ks:var(--violet-s);--kb:#C4B5FD;--kd:var(--violet-d)} .mterm:nth-child(5n+5){--ks:var(--teal-s);--kb:#5EEAD4;--kd:var(--teal-d)}
.mdefs{display:grid;gap:9px}
.mdef{text-align:start;border:2px solid var(--line-2);background:#fff;border-radius:16px;padding:11px 14px;font-family:var(--f-read);font-size:16.5px;font-weight:600;line-height:1.8;cursor:pointer;transition:all .2s;display:flex;gap:10px;align-items:center;box-shadow:0 4px 0 var(--line-2);animation:optIn .5s var(--spring) both}
.mdef .mk{flex:none;width:26px;height:26px;border-radius:50%;border:3px dashed var(--line-2);display:grid;place-items:center;font-size:13px;font-weight:800}
.mterm.sel,.mdef.sel{transform:translateY(-3px) scale(1.03);box-shadow:0 0 0 4px var(--hl),0 7px 0 var(--kb,var(--line-2))}
.mterm.done,.mdef.done{--kb:var(--mc);--ks:var(--mcs);--kd:var(--ink);border-color:var(--mc);background:var(--mcs);box-shadow:0 4px 0 var(--mc);pointer-events:none;animation:okpop .5s var(--spring)}
.mdef.done .mk,.mterm.done .mk{border:0;background:var(--mc);color:#fff}
.mterm .mk{display:none}
.mterm.done .mk{display:inline-grid;width:22px;height:22px;border-radius:50%;place-items:center;font-size:12px;margin-inline-end:6px;vertical-align:middle}
.mterm.bad,.mdef.bad{border-color:var(--bad);background:var(--bad-s);animation:shake .45s}
.hint-slot:empty{display:none}
.hint-slot{margin-top:16px}
.hint{display:flex;gap:10px;align-items:center;background:#FFF1F2;border:2px solid #BAE6FD;border-radius:20px;padding:10px 14px 10px 12px;animation:hintIn .5s var(--spring);box-shadow:0 5px 0 #BAE6FD}
@keyframes hintIn{from{opacity:0;transform:translateY(20px) scale(.9)}to{opacity:1;transform:none}}
.hint .mascot{width:58px;height:58px;flex:none}
.hint strong{display:block;color:#0369A1;font-size:16px;font-weight:800;margin-bottom:2px}
.hint p{margin:0;font-family:var(--f-read);font-size:16.5px;line-height:1.85;color:var(--ink)}
.hint p b{background:none;color:#9F1239}
.fb{display:flex;align-items:center;gap:12px;animation:hintIn .45s var(--spring)}
.fb .mascot{width:62px;height:62px;flex:none}
.fb strong{display:block;font-size:21px;font-weight:800;color:var(--ok-d);line-height:1.3}
.fb small{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14.5px;font-weight:700;color:var(--ink-2)}
.flame{display:inline-flex;align-items:center;gap:3px;background:linear-gradient(135deg,#0EA5E9,#EF4444);color:#fff;border-radius:99px;padding:1px 9px 1px 7px;font-weight:800;animation:pop .5s var(--spring)}
.flame svg{width:15px;height:15px;fill:#FEF08A;animation:flick .5s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1) rotate(-6deg)}to{transform:scale(1.2) rotate(6deg)}}
.xpfly{position:absolute;z-index:95;font-family:var(--f-display);font-weight:800;font-size:22px;color:#fff;background:linear-gradient(135deg,#FACC15,#0EA5E9);border-radius:99px;padding:2px 12px;pointer-events:none;box-shadow:0 4px 12px rgba(249,115,22,.45)}

/* ---------- summary flips ---------- */
.flips{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.flip{display:grid;border:0;background:none;padding:0;cursor:pointer;perspective:900px;min-height:124px;animation:pop .55s var(--spring) both;animation-delay:calc(var(--i) * .08s)}
.flip .fi{grid-area:1/1;border-radius:20px;padding:12px;display:flex;flex-direction:column;justify-content:center;gap:6px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .65s var(--spring)}
.flip .fr{background:linear-gradient(150deg,var(--k2),var(--k));color:var(--kt,#fff);text-align:center;box-shadow:0 6px 0 var(--kd)}
.flip:nth-child(6n+1){--k:var(--blue);--k2:#60A5FA;--kd:var(--blue-d);--ks:var(--blue-s)}
.flip:nth-child(6n+2){--k:var(--pink);--k2:#F472B6;--kd:var(--pink-d);--ks:var(--pink-s)}
.flip:nth-child(6n+3){--k:#16A34A;--k2:var(--green);--kd:var(--green-d);--ks:var(--green-s)}
.flip:nth-child(6n+4){--k:var(--orange);--k2:#FB923C;--kd:var(--orange-d);--ks:var(--orange-s)}
.flip:nth-child(6n+5){--k:var(--violet);--k2:#A78BFA;--kd:var(--violet-d);--ks:var(--violet-s)}
.flip:nth-child(6n+6){--k:var(--teal-d);--k2:var(--teal);--kd:#115E59;--ks:var(--teal-s)}
.flip .fr b{font-family:var(--f-display);font-size:18.5px;font-weight:800;line-height:1.45;color:inherit}
.flip .fr small{font-size:12.5px;font-weight:700;opacity:.85}
.flip .bk{background:#fff;border:3px solid var(--k);transform:rotateY(180deg);font-family:var(--f-read);font-size:15.5px;font-weight:600;line-height:1.8;text-align:start;box-shadow:0 6px 0 var(--ks)}
.flip.on .fr{transform:rotateY(-180deg)}
.flip.on .bk{transform:rotateY(0)}

/* ---------- done / badges / cert ---------- */
.donebody{text-align:center;display:flex;flex-direction:column;align-items:center}
.done-hero{position:relative;width:200px;height:190px;margin:4px auto 0;display:grid;place-items:center}
.done-hero .burst{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from 0deg,var(--cs) 0 12deg,transparent 12deg 24deg);animation:spin 14s linear infinite,popIn .8s var(--spring) both;mask:radial-gradient(circle,#000 30%,transparent 70%);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%)}
.done-hero .mascot{width:140px;height:140px;position:relative;animation:popIn .8s var(--spring) .1s both}
.dstars{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:0 0 4px}
.dstar svg{width:48px;height:48px;fill:#E7E0D3}
.dstar.on svg{fill:var(--yellow);filter:drop-shadow(0 3px 0 var(--yellow-d)) drop-shadow(0 0 12px rgba(250,204,21,.6))}
.dstar{animation:starIn .7s cubic-bezier(.3,1.8,.5,1) both}
.dstar:nth-child(2) svg{width:60px;height:60px}
@keyframes starIn{from{opacity:0;transform:scale(0) rotate(-180deg) translateY(-60px)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin:14px 0}
.stats div{border-radius:18px;padding:12px 6px;display:grid;gap:2px;animation:pop .5s var(--spring) both}
.stats div:nth-child(1){background:var(--yellow-s);box-shadow:0 5px 0 #FDE68A;animation-delay:1.2s} .stats div:nth-child(1) b{color:var(--yellow-d)}
.stats div:nth-child(2){background:var(--pink-s);box-shadow:0 5px 0 #A5F3FC;animation-delay:1.35s} .stats div:nth-child(2) b{color:var(--pink-d)}
.stats div:nth-child(3){background:var(--violet-s);box-shadow:0 5px 0 #BAE6FD;animation-delay:1.5s} .stats div:nth-child(3) b{color:var(--violet-d)}
.stats b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;background:none}
.stats span{font-size:13.5px;font-weight:700;color:var(--ink-2)}
.badge-card{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;width:100%;background:linear-gradient(135deg,var(--c),var(--c2));border-radius:22px;padding:14px 16px;text-align:start;box-shadow:0 6px 0 var(--cd);animation:rise .7s var(--spring) 1.7s both;color:var(--on)}
.badge-card::after{content:"";position:absolute;top:0;bottom:0;width:30%;left:-40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 2.8s ease-in-out 2s infinite}
.badge-card small{display:block;font-size:13.5px;font-weight:700;opacity:.9}
.badge-card strong{font-size:24px;font-weight:800}
.bmed{width:62px;height:62px;flex:none;--c:#FDE047;--c2:#FACC15;--cd:#CA8A04;animation:spin 6s linear infinite}
.bmed svg{width:26px;height:26px;color:#713F12}
.badge-card .bmed{animation:mwave 2s ease-in-out infinite}
.bmed.off{--c:#E7E2D8;--c2:#F2EEE6;--cd:#CFC7B8;animation:none}
.bmed.off svg{color:#A39B8B}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btile{background:#fff;border:2px solid var(--line);border-radius:22px;padding:16px 10px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;box-shadow:0 6px 0 var(--line);animation:pop .5s var(--spring) both;animation-delay:calc(var(--i) * .06s)}
.btile .bmed{--c:var(--tc);--c2:var(--tc2);--cd:var(--tcd);animation:none;width:66px;height:66px}
.btile .bmed svg{color:var(--ton)}
.btile.got .bmed{animation:mwave 3s ease-in-out infinite}
.btile strong{font-size:16px;font-weight:800;color:var(--ink)}
.btile.off strong{color:var(--ink-3)}
.btile span{font-size:13px;font-weight:600;color:var(--ink-2);line-height:1.5}
.cert-wrap label{display:block;font-size:15px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.inp{width:100%;height:54px;border-radius:16px;border:2px solid var(--line-2);background:#fff;color:var(--ink);padding:0 14px;font-family:var(--f-read);font-size:19px;font-weight:700;margin-bottom:18px;box-shadow:0 4px 0 var(--line-2)}
.inp:focus{border-color:var(--c);outline:none}
.cert{position:relative;border:4px solid transparent;border-radius:24px;padding:32px 22px 24px;text-align:center;background:linear-gradient(170deg,#FFFFFF,#FFF8EC) padding-box,linear-gradient(135deg,#0891B2,#0891B2,#3B82F6,#14B8A6,#FACC15) border-box;box-shadow:0 10px 30px -10px rgba(139,92,246,.4);animation:popIn .8s var(--spring) both}
.cert .cn{position:absolute;width:28px;height:28px;clip-path:var(--star);animation:spin 10s linear infinite}
.cert .cn.a{top:12px;right:12px;background:var(--pink)}.cert .cn.b{top:12px;left:12px;background:var(--blue)}.cert .cn.c{bottom:12px;right:12px;background:var(--green)}.cert .cn.d{bottom:12px;left:12px;background:var(--orange)}
.cert-k{display:inline-block;font-size:14px;font-weight:800;color:var(--violet-d);background:var(--violet-s);border-radius:99px;padding:2px 12px}
.cert h3{font-family:var(--f-brand);font-size:38px;margin:6px 0 8px;line-height:1.3;background:linear-gradient(90deg,#0891B2,#0891B2,#3B82F6);-webkit-background-clip:text;background-clip:text;color:transparent}
.cert-name{font-family:var(--f-brand);font-size:32px;color:var(--ink);border-bottom:3px dotted #C4B5FD;display:inline-block;padding:0 16px 4px;margin-bottom:10px;min-width:60%;line-height:1.5;word-break:break-word}
.cert p{font-family:var(--f-read);font-size:16.5px;line-height:2;color:var(--ink-2);margin:0 0 12px}
.cert-meta{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
.cert-meta span{font-size:13.5px;font-weight:800;border-radius:99px;padding:3px 12px}
.cert-meta span:nth-child(1){background:var(--yellow-s);color:var(--yellow-d)} .cert-meta span:nth-child(2){background:var(--pink-s);color:var(--pink-d)} .cert-meta span:nth-child(3){background:var(--blue-s);color:var(--blue-d)}
.note-s{font-size:14px;font-weight:600;color:var(--ink-3);text-align:center;margin-top:14px}

/* ---------- wipe transition ---------- */
.wipe{position:absolute;inset:0;z-index:80;display:grid;place-items:center;pointer-events:none}
.wipe-in{text-align:center;color:var(--on);animation:wipeTxt .9s var(--spring) .15s both}
.wipe-in .wn{display:block;font-family:var(--f-display);font-weight:800;font-size:92px;line-height:1;text-shadow:0 6px 0 rgba(0,0,0,.12)}
.wipe-in .wt{display:block;font-family:var(--f-display);font-weight:800;font-size:22px;margin-top:8px;padding:0 24px}
@keyframes wipeTxt{from{opacity:0;transform:scale(.5) rotate(-10deg)}to{opacity:1;transform:none}}

/* ---------- sheets, modal, toast ---------- */
.sheet-wrap{position:absolute;inset:0;z-index:70;background:rgba(30,27,58,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-end;animation:fadeIn .2s ease}
.sheet-wrap.center{align-items:center;padding:16px}
.sheet{width:100%;max-height:86%;display:flex;flex-direction:column;background:#fff;border-radius:26px 26px 0 0;padding:20px 16px 16px;animation:sheetUp .45s var(--spring) both}
.sheet.modal{border-radius:26px;text-align:center;animation:popIn .5s var(--spring) both;box-shadow:0 8px 0 var(--line-2)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sh-h strong{font-size:20px;font-weight:800;color:var(--cd)}
.sh-body{overflow-y:auto;display:grid;gap:14px;padding:4px 2px 8px}
.sh-actions{display:grid;gap:10px;margin-top:16px}
.sheet h3{font-size:28px;font-weight:800;color:#E11D48;margin:4px 0}
.sheet p.msg{font-family:var(--f-read);font-size:17.5px;line-height:1.95;color:var(--ink-2);margin:0}
.sheet .mascot.big{width:110px;height:110px;margin:0 auto}
.toast{position:absolute;top:14px;left:50%;z-index:99;transform:translate(-50%,-30px) scale(.9);opacity:0;background:var(--ink);color:#fff;font-weight:700;font-size:15px;padding:10px 18px;border-radius:16px;box-shadow:0 10px 30px rgba(30,27,58,.3);transition:all .35s var(--spring);pointer-events:none;width:max-content;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

@media (max-width:360px){
  .brand{font-size:50px}.h-display{font-size:28px}.stitle{font-size:22px}.qtext{font-size:19.5px}
  .flips{grid-template-columns:1fr}.b-cards.two{grid-template-columns:1fr}
  .rn{font-size:12.5px}.home-title{font-size:27px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .blk b{background-size:100% 100%}
}


/* =====================================================================
   إضافات رحلة الرياضيات: الرموز الرياضية، الأشكال، مؤقت النجوم، الأوسمة
   ===================================================================== */

/* ---------- math & numbers ---------- */
.mx{direction:ltr;unicode-bidi:isolate;display:inline-block;white-space:nowrap;font-family:var(--f-math);font-weight:600;font-size:.95em;line-height:1.25;letter-spacing:.01em}
.mx.long{white-space:normal;max-width:100%;text-align:center;vertical-align:top}
.mx i{font-family:"Cambria Math","STIX Two Text","Times New Roman","Noto Serif","DejaVu Serif",serif;font-style:italic;font-weight:700;font-size:1.1em;padding:0 .03em}
.mx sup{font-size:.68em;line-height:0;vertical-align:.62em;margin-inline-start:.05em}
.mx .ph{display:inline-block;min-width:1.5em;height:1.25em;margin:0 .1em;border:2px dashed var(--c);border-radius:7px;background:var(--cs);vertical-align:-.28em}
.fr .ph{height:1.1em;vertical-align:-.2em;margin:.1em}
.mx .ph.filled{min-width:0;height:auto;border-style:solid;border-color:var(--ok);background:var(--ok-s);color:var(--ok-d);padding:0 .3em;vertical-align:baseline;animation:pop .5s var(--spring)}
.mx .ph.flash{border-color:var(--bad);background:var(--bad-s);animation:shake .4s}
.sym{display:inline-block;width:.84em;height:.84em;vertical-align:-.08em;margin:0 .03em;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.phi{position:relative;display:inline-block;width:.68em;height:.68em;border:.12em solid currentColor;border-radius:50%;vertical-align:-.02em;margin:0 .16em}
.phi::after{content:"";position:absolute;left:50%;top:-.3em;bottom:-.3em;width:.12em;margin-left:-.06em;background:currentColor;border-radius:.1em}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .2em;line-height:1.2;font-size:.9em}
.fr>span{display:block;padding:0 .32em;white-space:nowrap;text-align:center}
.fr>span:first-child{border-bottom:2px solid currentColor;padding-bottom:.05em;min-width:100%}
.fr>span:last-child{padding-top:.05em}
.mx .w{font-family:var(--f-read);font-weight:700;font-size:.92em;direction:rtl;unicode-bidi:isolate}
.n{direction:ltr;unicode-bidi:isolate;font-family:var(--f-math);font-weight:600;font-size:.94em}
.rt{direction:rtl;unicode-bidi:isolate;white-space:nowrap}
.blk b .mx,.blk b .n{font-weight:700}

/* ---------- equation block ---------- */
.b-eq{text-align:center;padding:2px 0}
.b-eq .eqb{display:inline-block;max-width:100%;font-family:var(--f-read);font-weight:700;font-size:20.5px;line-height:2.1;color:var(--cd);padding:6px 18px;border-radius:24px;background:linear-gradient(135deg,var(--cs),#fff);border:2px solid var(--hl);box-shadow:0 5px 0 var(--hl);animation:pop .7s var(--spring) both}
.b-eq .eqb .mx{font-size:1em}
.b-eq .cap{display:block;font-size:14px;font-weight:700;color:var(--ink-3);margin-top:10px}

/* ---------- worked steps (re-uses .ps) ---------- */
.ps.s0{--ps:var(--blue-s);--pb:#93C5FD;--pl:var(--blue);--plt:#fff}
.ps.s1{--ps:var(--violet-s);--pb:#C4B5FD;--pl:var(--violet);--plt:#fff}
.ps.s2{--ps:var(--orange-s);--pb:#FDBA74;--pl:var(--orange);--plt:#fff}
.ps.s3{--ps:var(--pink-s);--pb:#F9A8D4;--pl:var(--pink);--plt:#fff}
.ps p .mx{font-size:1.02em}
.ps p{line-height:2.05}

/* ---------- figures ---------- */
.b-fig{margin:0;background:#fff;border:2px solid var(--line);border-radius:22px;padding:12px 10px;box-shadow:0 6px 0 var(--line);text-align:center}
.b-fig figcaption,.qfig figcaption{font-family:var(--f-read);font-size:15.5px;line-height:1.8;font-weight:600;color:var(--ink-2);margin-top:6px}
.qfig{margin:0 0 16px;background:#fff;border:2px solid var(--cs);border-radius:20px;padding:10px 8px;box-shadow:0 5px 0 var(--cs);text-align:center}
.fg{display:block;width:100%;height:auto;max-width:340px;margin:0 auto;direction:ltr;overflow:visible}
.fg text{font-family:var(--f-math);font-weight:700;font-size:13px;fill:var(--ink)}
.fg .tk{font-size:11.5px;fill:var(--ink-2);font-weight:600}
.fg .arx{font-family:var(--f-display);font-weight:700;font-size:12.5px;fill:var(--ink-2)}
.fg .gr{stroke:#E7E0D3;stroke-width:1}
.fg .ax{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fg .ln{fill:none;stroke:var(--c);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fg .pt{fill:var(--c2);stroke:#fff;stroke-width:2}
.fg .vset{fill-opacity:.13;stroke-width:3}
.fg .vname{font-size:17px;font-weight:800}
.fg .vel{font-size:15px;font-weight:700}
.fg .vel.sm{font-size:12.5px;font-family:var(--f-display)}
.fg .vdot{fill:var(--pink)}
.fg .nl{stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;fill:none}
.fg .hop{fill:none;stroke-width:3;stroke-linecap:round}
.fg .guide{stroke-width:1.5;stroke-dasharray:3 4}
.fg .big{font-size:22px;font-weight:700}
.fg .big i,.fg .it{font-family:"Cambria Math","Times New Roman","DejaVu Serif",serif;font-style:italic}
.ftbl{display:inline-block;max-width:100%;border-radius:16px;border:2px solid var(--cs);overflow:hidden;background:#fff;box-shadow:0 5px 0 var(--cs);vertical-align:top}
.ftbl table{border-collapse:collapse;margin:0 auto}
.ftbl th,.ftbl td{padding:7px 13px;text-align:center;border-bottom:2px solid var(--line);border-inline-start:2px solid var(--line);font-family:var(--f-read);font-size:16.5px;font-weight:700;line-height:1.6}
.ftbl tr>*:first-child{border-inline-start:0}
.ftbl tr:last-child>*{border-bottom:0}
.ftbl th{background:var(--cs);color:var(--cd);font-family:var(--f-display);font-size:14.5px;font-weight:800}
.b-tbl{text-align:center}
.b-tbl .cap{display:block;font-family:var(--f-read);font-size:15.5px;font-weight:600;color:var(--ink-2);margin-top:10px}

/* ---------- question: timer / reward ---------- */
.qtimer{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.qt-rw{flex:none;display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 10px;border-radius:99px;background:linear-gradient(135deg,#FEF08A,#FACC15);color:#713F12;font-weight:800;font-size:16.5px;box-shadow:0 3px 0 #CA8A04;font-variant-numeric:tabular-nums;transition:background .3s,box-shadow .3s,color .3s}
.qt-rw svg{width:17px;height:17px;fill:#B45309;flex:none}
.qt-rw em{font-style:normal;font-size:12.5px;font-weight:800;background:#713F12;color:#FEF9C3;border-radius:99px;padding:0 7px;line-height:1.75;direction:ltr}
.qt-rw.rwflip{animation:xpPop .5s var(--spring)}
.qt-bar{flex:1;height:14px;border-radius:99px;background:#F1EBDF;overflow:hidden;position:relative;min-width:40px}
.qt-bar i{position:absolute;inset-block:0;right:0;width:100%;border-radius:99px;background:linear-gradient(270deg,#22C55E,#14B8A6)}
.qt-bar i::after{content:"";position:absolute;inset:3px 6px auto 6px;height:3px;border-radius:9px;background:rgba(255,255,255,.55)}
.qtimer[data-z="b"] .qt-bar i{background:linear-gradient(270deg,#FACC15,#0EA5E9)}
.qtimer[data-z="c"] .qt-bar i{background:linear-gradient(270deg,#0EA5E9,#EF4444)}
.qtimer[data-z="c"] .qt-rw{animation:tpulse .7s ease-in-out infinite}
@keyframes tpulse{50%{transform:scale(1.07)}}
.qt-msg{display:none;flex:1;font-size:13.5px;font-weight:700;color:var(--ink-3)}
.qtimer.late .qt-bar,.qtimer.miss .qt-bar{display:none}
.qtimer.late .qt-msg,.qtimer.miss .qt-msg{display:block}
.qtimer.late .qt-rw,.qtimer.miss .qt-rw{background:#EEF2F7;color:#475569;box-shadow:0 3px 0 #CBD5E1;animation:none}
.qtimer.late .qt-rw svg,.qtimer.miss .qt-rw svg{fill:#94A3B8}
.qtimer.late .qt-rw em,.qtimer.miss .qt-rw em{display:none}
.qtimer.won .qt-bar i{animation:none}
.qtimer.won[data-z] .qt-rw{animation:none}

/* ---------- numeric keypad question ---------- */
.numbox{display:flex;align-items:center;gap:10px;background:#fff;border:3px dashed var(--c);border-radius:18px;padding:8px 14px;min-height:62px;margin-bottom:6px;transition:all .2s}
.numbox .nb-l{font-size:14px;font-weight:800;color:var(--cd);background:var(--cs);border-radius:99px;padding:2px 12px;flex:none}
.numbox .nb-v{flex:1;direction:ltr;text-align:center;font-family:var(--f-math);font-weight:800;font-size:28px;line-height:1.3;color:var(--ink);min-height:36px;letter-spacing:.03em}
.numbox .nb-v:empty::before{content:"؟";color:var(--ink-3);opacity:.5}
.numbox .nb-u{flex:none;font-family:var(--f-read);font-size:17px;font-weight:700;color:var(--ink-2)}
.numbox.ok{border-style:solid;border-color:var(--green);background:var(--ok-s)}
.numbox.bad{border-color:var(--bad);background:var(--bad-s);animation:shake .45s}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;direction:ltr}
.key{height:46px;border-radius:14px;border:2px solid var(--line-2);background:#fff;box-shadow:0 4px 0 var(--line-2);font-family:var(--f-math);font-weight:800;font-size:22px;color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0;animation:pop .35s var(--spring) both}
.key:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--line-2)}
.key.fn{background:var(--cs);border-color:var(--hl);box-shadow:0 4px 0 var(--hl);color:var(--cd)}
.key.go{grid-column:span 2;border:0;background:linear-gradient(135deg,var(--c),var(--c2));color:var(--on);box-shadow:0 4px 0 var(--cd);font-family:var(--f-display);font-size:18px}
.key.go[disabled]{filter:grayscale(1);opacity:.5;cursor:not-allowed;box-shadow:none}
.key svg{width:22px;height:22px}

/* ---------- solution card ---------- */
.sol{display:flex;gap:10px;align-items:flex-start;background:#F0FDF4;border:2px solid #BBF7D0;border-radius:20px;padding:10px 12px;box-shadow:0 5px 0 #BBF7D0;animation:hintIn .5s var(--spring)}
.sol .ni{flex:none;width:32px;height:32px;border-radius:10px;background:var(--green);color:#fff;display:grid;place-items:center;margin-top:2px}
.sol .ni svg{width:18px;height:18px}
.sol strong{display:block;color:var(--green-d);font-size:15.5px;font-weight:800}
.sol p{margin:0;font-family:var(--f-read);font-size:16.5px;line-height:2;color:var(--ink)}
.fb small .x2{display:inline-block;background:linear-gradient(135deg,#FACC15,#0EA5E9);color:#fff;border-radius:99px;padding:0 9px;font-weight:800;direction:ltr;animation:pop .5s var(--spring)}
.fb small .gain{display:inline-flex;align-items:center;gap:3px;color:var(--yellow-d);font-weight:800;font-size:16px}
.fb small .gain svg{width:16px;height:16px;fill:var(--yellow)}

/* ---------- emblems & rank ---------- */
.emb{display:block;overflow:visible}
.emb.off{filter:grayscale(1) contrast(.7) brightness(1.25);opacity:.5}
.rank{position:relative;display:flex;align-items:center;gap:10px;width:100%;border-radius:22px;padding:8px 12px 8px 14px;overflow:hidden;color:#fff;background:linear-gradient(135deg,var(--r2),var(--r3));box-shadow:0 5px 0 var(--r3),0 14px 24px -14px var(--r2);animation:rise .6s var(--ease) both}
.rank::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 0%,rgba(255,255,255,.32),transparent 46%),radial-gradient(circle at 100% 120%,rgba(255,255,255,.18),transparent 46%);pointer-events:none}
.rank::after{content:"";position:absolute;top:0;bottom:0;width:26%;left:-40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 4.2s ease-in-out 1s infinite;pointer-events:none}
.rank.none{background:linear-gradient(135deg,#94A3B8,#64748B);box-shadow:0 5px 0 #475569}
.rk-em{position:relative;flex:none;width:76px;height:76px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center;z-index:1}
.rk-em .emb{width:76px;height:76px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18));animation:bob 3s ease-in-out infinite}
.rk-em .halo{position:absolute;inset:-8px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.24) 0 10deg,transparent 10deg 20deg);animation:spin 16s linear infinite;-webkit-mask:radial-gradient(circle,#000 35%,transparent 70%);mask:radial-gradient(circle,#000 35%,transparent 70%)}
.rk-t{position:relative;flex:1;min-width:0;z-index:1;display:grid;gap:1px}
.rk-hi{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:700;opacity:.96;white-space:nowrap}
.rk-hello{min-width:0;overflow:hidden;text-overflow:ellipsis}
.rk-hi b{color:inherit;font-weight:800}
.rk-name{font-family:var(--f-brand);font-weight:700;font-size:25px;line-height:1.3;text-shadow:0 2px 0 rgba(0,0,0,.16);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-lv{flex:none;font-size:12px;font-weight:800;background:rgba(255,255,255,.24);border-radius:99px;padding:0 9px;direction:ltr;font-variant-numeric:tabular-nums}
.rk-bar{height:9px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden;position:relative;margin-top:3px}
.rk-bar i{position:absolute;inset-block:0;right:0;border-radius:99px;background:#fff;transition:width 1s var(--ease)}
.rk-sub{font-size:12.5px;font-weight:700;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.hello.slim{padding:9px 12px;box-shadow:0 5px 0 var(--line)}
.hello.slim .mascot{width:52px;height:52px}
.hello.slim .hello-t strong{font-size:16px}
.hello.slim .hello-t span{margin:1px 0 6px;font-size:13px}
.hello.slim .track{height:11px}

/* station stars pill on the path */
.ppill{display:inline-flex;align-items:center;gap:4px;justify-self:center;margin-top:3px;font-size:12.5px;font-weight:800;color:var(--yellow-d);background:var(--yellow-s);border:2px solid #FDE68A;border-radius:99px;padding:0 9px;font-variant-numeric:tabular-nums;direction:ltr}
.ppill svg{width:13px;height:13px;fill:var(--yellow)}
.ppill.full{background:linear-gradient(135deg,#FEF08A,#FACC15);border-color:#EAB308;color:#713F12}
.path-end .btn-link{display:inline-flex;width:auto;margin-top:6px;font-size:14px;color:var(--ink-3);gap:6px}
.path-end .btn-link svg{width:16px;height:16px}

/* rank-up modal */
.sheet.rankup{overflow:visible;padding:26px 18px 18px;background:linear-gradient(180deg,#FFFDF5,#fff)}
.ru-hero{position:relative;width:190px;height:190px;margin:0 auto 4px;display:grid;place-items:center}
.ru-hero .burst{position:absolute;inset:-14px;border-radius:50%;background:repeating-conic-gradient(from 0deg,var(--r1) 0 9deg,transparent 9deg 18deg);opacity:.6;animation:spin 12s linear infinite,popIn .8s var(--spring) both;-webkit-mask:radial-gradient(circle,#000 28%,transparent 70%);mask:radial-gradient(circle,#000 28%,transparent 70%)}
.ru-hero .emb{position:relative;width:160px;height:160px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.14));animation:ruPop 1s cubic-bezier(.3,1.7,.5,1) both}
@keyframes ruPop{0%{opacity:0;transform:scale(.1) rotate(-200deg)}70%{opacity:1;transform:scale(1.12) rotate(8deg)}100%{transform:none}}
.ru-k{display:inline-block;align-self:center;font-size:14px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--r2),var(--r3));border-radius:99px;padding:3px 14px;animation:pop .5s var(--spring) .5s both}
.sheet.rankup h3{font-family:var(--f-brand);font-size:36px;line-height:1.35;margin:6px 0 2px;color:var(--r3);animation:rise .6s var(--ease) .6s both}
.sheet.rankup p.msg{animation:rise .6s var(--ease) .75s both}
.sheet.rankup .sh-actions{animation:rise .6s var(--ease) .9s both}

/* badges ladder */
.btile{position:relative;cursor:pointer;font:inherit}
.btile .emb{width:84px;height:84px}
.btile.got .emb{animation:mwave 3.4s ease-in-out infinite;animation-delay:calc(var(--i) * .2s)}
.btile .bn{font-size:11.5px;font-weight:800;color:var(--ink-3);position:absolute;top:8px;right:11px;font-variant-numeric:tabular-nums}
.btile .bat{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;font-weight:800;color:var(--yellow-d);background:var(--yellow-s);border-radius:99px;padding:1px 10px;direction:ltr}
.btile .bat svg{width:14px;height:14px;fill:var(--yellow)}
.btile.off .bat{color:var(--ink-3);background:#F1EBDF}
.btile.off .bat svg{fill:#CFC7B8}
.btile.cur{border-color:var(--r2);box-shadow:0 6px 0 var(--r2),0 0 0 4px var(--r1)}
.btile .now{position:absolute;top:-11px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--r2),var(--r3));border-radius:99px;padding:1px 11px}
.bsum{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:22px;padding:12px 14px;box-shadow:0 6px 0 var(--line);margin-bottom:16px}
.bsum .emb,.bsum .mascot{width:64px;height:64px;flex:none}
.bsum strong{display:block;font-size:18px;font-weight:800;line-height:1.4}
.bsum span{display:block;font-size:14px;font-weight:600;color:var(--ink-2)}

.rules{margin-top:18px}
.rules.still li{animation:none}
.rules b{background:none}
/* settings / name */
.set label{display:block;text-align:start;font-size:15px;font-weight:800;color:var(--ink-2);margin:6px 0 6px}
.set .inp{margin-bottom:6px;text-align:center;font-family:var(--f-display);font-size:22px}
.set .cnt16{display:block;text-align:end;font-size:13px;font-weight:700;color:var(--ink-3);margin-bottom:10px;font-variant-numeric:tabular-nums;direction:ltr}
.set .mascot.big{width:92px;height:92px}

/* done screen rank strip */
.donebody>*{flex-shrink:0}
.badge-card .emb{width:68px;height:68px;flex:none;animation:mwave 2.4s ease-in-out infinite}
.badge-card{background:linear-gradient(135deg,var(--r2),var(--r3));box-shadow:0 6px 0 var(--r3);color:#fff}
.badge-card.none{background:linear-gradient(135deg,#94A3B8,#64748B);box-shadow:0 6px 0 #475569}
.badge-card strong{font-family:var(--f-brand);font-size:25px;line-height:1.35}
.badge-card .mini{height:9px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden;position:relative;margin-top:6px}
.badge-card .mini i{position:absolute;inset-block:0;right:0;border-radius:99px;background:#fff}
.badge-card>div{flex:1;min-width:0}
.cert-badge{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 12px}
.cert-badge .emb{width:58px;height:58px}
.cert-badge strong{font-family:var(--f-brand);font-size:23px;color:var(--ink)}
.cert .btn-link{width:auto;display:inline-flex;margin:0 auto 6px;font-size:14px}
.splash-rank{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:99px;padding:5px 16px 5px 8px;box-shadow:0 4px 0 var(--line);animation:rise .8s var(--ease) .45s both;font-weight:800;font-size:15.5px}
.splash-rank .emb{width:40px;height:40px}
.examlist li .mx{font-size:1em}

@media (max-width:360px){
  .rk-name{font-size:22px}.rk-em,.rk-em .emb{width:66px;height:66px}
  .key{height:42px;font-size:20px}.numbox .nb-v{font-size:25px}
  .b-eq .eqb{font-size:18.5px;padding:6px 12px}
}


/* =====================================================================
   إضافات «ما لا يسع أطفال المسلمين جهله»: الآيات، الأحاديث، بطاقات السؤال والجواب
   (بنفس ألوان المحطة ونفس لغة التصميم)
   ===================================================================== */
:root{--f-quran:"Amiri Quran","Noto Naskh Arabic","Traditional Arabic",serif}
.brand.long{font-size:46px;line-height:1.4}
.home-title.long{font-size:23px;line-height:1.5}
.cert h3.long{font-size:30px;line-height:1.5}
.saw{font-family:var(--f-read);font-weight:400}
.hq{font-weight:700;color:var(--cd)}
.src{font-family:var(--f-display);font-size:.76em;font-weight:700;color:var(--ink-3)}
.qr{font-family:var(--f-quran);font-weight:400;font-size:1.12em;line-height:2.3}
.qr .qr{font-size:1em}
.ayah{font-family:var(--f-quran);font-weight:400;font-size:1.1em;line-height:2.3;color:var(--ink)}
.ayah .orn{color:var(--c);font-size:1.05em}
.an{display:inline-grid;place-items:center;min-width:1.8em;height:1.8em;margin:0 2px;padding:0 .2em;border-radius:50%;border:2px solid var(--c);color:var(--cd);background:#fff;font-family:var(--f-display);font-size:.55em;font-weight:800;line-height:1;vertical-align:.32em}
.vref{font-family:var(--f-display);font-size:.72em;font-weight:700;color:var(--ink-3);white-space:nowrap}
.surah{display:block;margin:4px 0;text-align:center;background:linear-gradient(135deg,var(--cs),#fff);border:2px solid var(--hl);border-radius:22px;box-shadow:0 5px 0 var(--hl);padding:12px 12px 14px}
.surah .sn{display:inline-block;font-family:var(--f-display);font-weight:800;font-size:14px;line-height:1.7;color:var(--on);background:linear-gradient(135deg,var(--c),var(--c2));border-radius:99px;padding:1px 16px}
.surah .bsm{display:block;font-family:var(--f-quran);font-size:1.12em;line-height:2.1;color:var(--cd);margin-top:6px}
.surah .sb{display:block;font-family:var(--f-quran);font-weight:400;font-size:1.16em;line-height:2.45;color:var(--ink);text-align:justify;text-align-last:center}
.vblk{margin:6px 0 8px}
.b-qa .t{align-items:flex-start}
.b-qa .t::before{margin-top:.45em}
.b-qa .t>span{min-width:0}
.b-qa .qg{display:inline-block;font-size:12.5px;font-weight:800;color:var(--on);background:linear-gradient(135deg,var(--c),var(--c2));border-radius:99px;padding:0 10px;margin-inline-end:6px;vertical-align:2px;line-height:1.8}
.b-qa .d p{margin:0 0 4px}
.b-qa .d>:last-child{margin-bottom:0}
.b-qa .qh{font-family:var(--f-display);font-weight:800;font-size:15.5px;line-height:1.6;color:var(--cd);margin:10px 0 2px}
.b-qa ul,.b-qa ol{list-style:none;margin:2px 0 6px;padding:0;display:grid;gap:0}
.b-qa li{position:relative;padding:4px 32px 4px 0;border-bottom:2px dashed var(--line);font-size:17.5px;line-height:1.95}
.b-qa li:last-child{border-bottom:0}
.b-qa ul li::before{content:"";position:absolute;right:3px;top:13px;width:16px;height:16px;clip-path:var(--star);background:var(--k,var(--c))}
.b-qa ol li::before{content:attr(data-n);position:absolute;right:0;top:9px;min-width:24px;height:24px;padding:0 3px;border-radius:8px;background:var(--k,var(--c));color:#fff;font-family:var(--f-display);font-size:13.5px;font-weight:800;display:grid;place-items:center;line-height:1}
.b-qa li:nth-child(6n+1){--k:var(--blue)} .b-qa li:nth-child(6n+2){--k:var(--pink)} .b-qa li:nth-child(6n+3){--k:var(--green)} .b-qa li:nth-child(6n+4){--k:var(--orange)} .b-qa li:nth-child(6n+5){--k:var(--violet)} .b-qa li:nth-child(6n+6){--k:var(--teal)}
.slot .st .qr,.pitem .qr{font-size:1.08em;line-height:2.1}
@media (max-width:360px){.brand.long{font-size:38px}.home-title.long{font-size:20px}.b-qa li{font-size:16.5px}}

/* بلا قلم تحديد: الكلمات المهمة ملوّنة بلون المحطة */
.blk b,.still .blk b{background:none!important;animation:none!important;color:var(--cd);font-weight:800;padding:0}
.b-def .t b{color:inherit}
.flip .bk b,.flip .bk .hq{color:inherit}
/* صورة الدرس: ثلاث صور تعبيرية على بلاطات ناعمة */
.b-pic{text-align:center;background:linear-gradient(165deg,var(--cs),#fff 78%);border:2px solid var(--cs);border-radius:24px;padding:16px 14px 14px}
.b-pic .pics{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin-bottom:10px}
.b-pic .pi{width:66px;height:66px;flex:none;display:grid;place-items:center;background:#fff;border-radius:22px;box-shadow:0 6px 0 var(--hl);animation:picin .5s var(--ease) both,picbob 3.4s ease-in-out infinite;animation-delay:calc(var(--i) * .09s),calc(.6s + var(--i) * .5s)}
.b-pic .pi:nth-child(2){width:88px;height:88px;border-radius:28px}
.b-pic .pi svg{width:64%;height:64%;display:block}
.b-pic p{margin:0;font-family:var(--f-read);font-size:18.5px;line-height:1.95;color:var(--ink)}
@keyframes picin{from{opacity:0;transform:translateY(14px) scale(.7)}to{opacity:1;transform:none}}
@keyframes picbob{0%,100%{translate:0 0}50%{translate:0 -5px}}
.b-qa.has-ic .t::before{display:none}
.b-qa .qi{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:12px;background:var(--cs);margin-top:1px}
.b-qa .qi svg{width:24px;height:24px;display:block}
@media (prefers-reduced-motion:reduce){.b-pic .pi{animation:none}}
@media (max-width:360px){.b-pic .pi{width:56px;height:56px}.b-pic .pi:nth-child(2){width:74px;height:74px}.b-pic p{font-size:17px}}

  /* شكل ڤن */
  function vItems(items, cx0, cy0, cols, dx, dy) {
    const n = (items || []).length; if (!n) return '';

    return items.map((it, i) => {
      const r = Math.floor(i / cols), c = i % cols, inRow = r === rows - 1 ? n - r * cols : cols;
      const x = cx0 + (c - (inRow - 1) / 2) * dx, y = cy0 + (r - (rows - 1) / 2) * dy, s = String(it);
      if (isAr(s)) return stext(x, y + 4, s, 'vel sm');

  /* خط الأعداد */
  function figNline(f) {
    const n = f.max - f.min, W = 320, L = 20, R = 20, st = (W - L - R) / n, hops = f.hops || [];
    const rows = f.flat ? Math.min(1, hops.length) : hops.length;
    const top = rows ? 20 + 24 * rows : 14, y0 = top + 8, H = y0 + 34;
    const X = v => L + (v - f.min) * st;
    let g = svgOpen(W, H, 'خط الأعداد');
    g += '<path class="nl" d="M6 ' + y0 + 'H' + (W - 6) + 'M12 ' + (y0 - 5) + 'l-7 5 7 5M' + (W - 12) + ' ' + (y0 - 5) + 'l7 5 -7 5"/>';
    for (let v = f.min; v <= f.max; v++) {
      const on = (f.mark || []).indexOf(v) >= 0;
      g += '<line class="nl" x1="' + f1(X(v)) + '" y1="' + (y0 - 6) + '" x2="' + f1(X(v)) + '" y2="' + (y0 + 6) + '"/>';
      if (on) g += '<circle cx="' + f1(X(v)) + '" cy="' + (y0 + 20) + '" r="11" fill="#FEF08A" stroke="#EAB308" stroke-width="2"/>';
      g += stext(X(v), y0 + 24.5, v, 'tk', n > 12 ? ' style="font-size:10px"' : (on ? ' style="fill:#713F12;font-weight:800"' : ''));
    }
    hops.forEach((h, i) => {
      const y = y0 - 16 - (f.flat ? 0 : (hops.length - 1 - i) * 24), col = FCOL[[1, 0, 2, 3][i % 4]], a = X(h[0]), b = X(h[1]), d = b > a ? -1 : 1;

      g += '<path class="hop" stroke="' + col + '" d="M' + f1(a) + ' ' + y + 'H' + f1(b) + 'm' + (7 * d) + ' -5l' + (-7 * d) + ' 5 ' + (7 * d) + ' 5"/>';
      if (h[2]) g += stext((a + b) / 2, y - 6, h[2], '', ' fill="' + col + '" style="font-size:12.5px"');

    return g + '</svg>';

  /* نموذج الأجزاء المتساوية (للتقسيم التناسبي) */

  /* المقياس الخطي للخريطة */

  /* بطاقات العد +1 و −1 */

  };
  let EID = 0;
  const ngon = (cx0, cy0, R, n, rot) => Array.from({ length: n }, (_, k) => { const a = (rot + k * 360 / n) * Math.PI / 180; return f1(cx0 + R * Math.cos(a)) + ',' + f1(cy0 + R * Math.sin(a)); }).join(' ');
  function laurel() {
    let s = '';

        s += '<ellipse cx="' + f1(px) + '" cy="' + f1(py) + '" rx="8" ry="3.7" transform="rotate(' + f1(rot) + ' ' + f1(px) + ' ' + f1(py) + ')"/>';

    let cyD = 58, rD = 31, gs = 1.95;

      case 'burst': s += two((dy, fill) => '<polygon points="' + starPts(60, 58 + dy, 55, 45, 12) + '" fill="' + fill + '"/>'); rD = 34; break;
      case 'wings': {

    return s + '</svg>';
  }

  /* بطاقة الوسام: ثابتة أعلى الواجهة */
  function rankCard() {
    const st = totalStars(), r = rankOf(st), cur = r ? BADGES[r - 1] : null, nx = BADGES[r], lo = cur ? cur.at : 0;
    const pct = nx ? Math.max(4, Math.min(100, (st - lo) / (nx.at - lo) * 100)) : 100;

      '<div class="rk-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.round(pct) + '"><i style="width:' + pct.toFixed(1) + '%"></i></div>' +
      '<span class="rk-sub">' + (nx ? 'باقٍ ' + starWord(nx.at - st) + ' على «' + esc(nx.n) + '»' : 'بلغت القمة! أحسنت') + '</span></div></div>';
  }

  /* عُقد الطريق المتعرج بأسلوبه الأصلي نفسه؛ تُستخدم لقائمة المسارات ولمحطات كل مسار */
  function roadRows(nodes) {
    const W = appEl.clientWidth || 360;
    const amp = Math.max(28, Math.min(80, (W - 32) / 2 - 92));
    return nodes.map((nd, i) => {
      const x = Math.round(Math.sin(i * 0.95) * amp), id = nd.id, state = nd.state;
      return '<div class="pnode ' + state + (nd.extra || '') + '" data-x="' + x + '" data-col="' + th(id)[0] + '" style="' + tv(id) + ';--x:' + x + 'px;--i:' + i + '">' +
        (nd.bubble ? '<span class="bubble">' + nd.bubble + '</span>' : '') +
        '<button class="med khatam" ' + nd.attrs + ' aria-label="' + esc(nd.label) + '">' +
        (state === 'current' ? '<span class="rip"></span><span class="rip r2"></span>' : '') + nd.num +
        (state === 'done' ? '<span class="donecheck">' + IC.check + '</span>' : '') + (state === 'locked' ? '<span class="lock">' + IC.lock + '</span>' : '') + '</button>' +
        '<div class="plabel">' + (nd.label.indexOf(nd.group) === 0 ? '' : '<span class="pg">' + esc(nd.group) + '</span>') + '<span class="pt">' + esc(nd.label) + '</span>' + (nd.pill || '') + '</div></div>';
    }).join('');
  }
  const starPill = (got, mx) => '<span class="ppill' + (got >= mx ? ' full' : '') + '">' + IC.star + got + ' / ' + mx + '</span>';
  function roadWatch(el, after) {
    requestAnimationFrame(() => requestAnimationFrame(after));
    const pathEl = el.querySelector('.path');
    if (window.ResizeObserver && pathEl) { let lastH = 0; const ro = new ResizeObserver(() => { if (!el.isConnected) { ro.disconnect(); return; } if (pathEl.offsetHeight !== lastH) { lastH = pathEl.offsetHeight; drawPath(el, false); } }); ro.observe(pathEl); }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (el.isConnected) drawPath(el, false); });
  }

  /* الصفحة الرئيسية: طريق المسارات، وكل مسار يفتح محطاته هو فقط */

        bubble: state === 'current' ? (dn === n ? 'Part Exam' : started ? 'أكمل' : 'ابدأ هنا') : '', pill: state === 'done' || got ? starPill(got, mx) : '' };

    const el = mount('<header class="bar home-bar"><h1 class="home-title grad-text long">Cybersecurity Journey</h1>' +

      '<button class="tool sq" data-act="sound" aria-label="' + (S.sound ? 'Mute' : 'Sound On') + '">' + (S.sound ? IC.sound : IC.mute) + '</button><button class="tool sq" data-act="settings" aria-label="Settings">' + IC.gear + '</button></div></header>' +
      '<div class="body home-body"><div class="hello slim">' + mascot(doneN ? 'wave' : 'idle') + '<div class="hello-t"><strong>' + (doneN === 0 ? 'لنبدأ الرحلة معاً!' : doneN === MAIN.length ? (allBxDone() ? 'أتممت الرحلة كلها، ما شاء الله!' : 'بقيت امتحانات الأبواب!') : 'رائع! أنجزت ' + ar(doneN) + ' من ' + ar(MAIN.length) + (MAIN.length > 10 ? ' محطة' : ' محطات')) + '</strong><span>' + (doneN === MAIN.length ? 'أعد أي محطة لتحسّن نجومك فيها' : 'اختر باباً لتفتح فصوله، ثم ادخل Chapter الذي تريده') + '</span><div class="track"><i style="width:' + Math.max(4, doneN / MAIN.length * 100) + '%"></i></div></div></div>' +

  /* صفحة المسار: الطريق نفسه، وعليه محطات هذا المسار وحده */

    /* المسار قصير: لا نحرّك الصفحة إلا إذا كانت Station الحالية أسفل الشاشة */
    roadWatch(el, () => {
      drawPath(el, false);
      const cur = el.querySelector('.pnode.current'), body = el.querySelector('.body'), pathEl = el.querySelector('.path');
      if (cur && body && pathEl) { const bot = pathEl.offsetTop - body.offsetTop + cur.offsetTop + cur.offsetHeight; if (bot > body.clientHeight - 12) body.scrollTop = bot - body.clientHeight + 24; }
    });
  }
  function drawPath(el, scroll) {
    const path = el.querySelector('.path'); if (!path) return;
    const svg = path.querySelector('.pline');
    const pts = Array.from(path.querySelectorAll('.pnode')).map(nd => {
      const m = nd.querySelector('.med'); const cxp = nd.offsetLeft + nd.offsetWidth / 2 + (+nd.dataset.x || 0);
      return { x: cxp, top: nd.offsetTop + m.offsetTop + 6, bot: nd.offsetTop + nd.offsetHeight + 4, done: nd.classList.contains('done'), col: nd.dataset.col };
    });
    svg.setAttribute('viewBox', '0 0 ' + path.offsetWidth + ' ' + path.offsetHeight);
    let segs = '';
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i], y1 = a.bot, y2 = b.top, my = (y1 + y2) / 2;
      segs += '<path class="' + (a.done && b.done ? 'done' : '') + '"' + (a.done ? ' style="stroke:' + b.col + '"' : '') + ' d="M' + a.x.toFixed(1) + ' ' + y1.toFixed(1) + ' C' + a.x.toFixed(1) + ' ' + my.toFixed(1) + ' ' + b.x.toFixed(1) + ' ' + my.toFixed(1) + ' ' + b.x.toFixed(1) + ' ' + y2.toFixed(1) + '"/>';
    }
    svg.innerHTML = segs;
    const cur = path.querySelector('.pnode.current'); const body = el.querySelector('.body');

  }

  function shell() {
