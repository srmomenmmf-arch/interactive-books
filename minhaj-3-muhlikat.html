يره في رئاسة فهل كان يغضب لذلك غضبه لنفسه إن كان غضبه للإسلام؟ هيهات؟ بل ربما فرح بذلك، فتبين أن غضبه كان لنفسه، وأنه حاسد لأقرانه.", "وإذا خطر له خاطر الرياء قال: إنما غرضي من إظهار العلم والعمل اقتداء الخلق بي ليهتدوا إلى الدين. ولو كان هذا قصده(١) لفرح باقتداء الناس بغيره، كما يفرح باقتدائهم به، ولو كان غرضه صلاح الخلق لفرح بصلاحهم على يد من كان، كمن له عبيد مرضى يريد معالجتهم، فإنه لا يفرق بين أن يحصل شفاؤهم على يده أو على يد طبيب آخر، وربما قال: لو هدوا على يدي كان الأجر لي، فأنا أفرح بثواب الله تعالى لا بقول الخلق. والله يطلع من ضميره أنه لو أخبره نبي بأن ثوابه في إخفاء العلم أكثر من ثوابه في الإظهار، ثم حبس مع ذلك في سجن وسلسل لاحتال في هدم السجن وحل السلاسل حتى يرجع إلى موضعه الذي به تظهر رياسته من تدريس أو وعظ أو غيره."]], "ic": "book"}, {"story": ["كتاب ذم الغرور (٨ من ٢٩)، ص٩٥٢", ["وكذلك يدخل على السلطان ويتودد إليه ويثني عليه ويتواضع له، وإذا خطر له أن التواضع للظلمة حرام قال: إنما غرضي أن أشفع في مسلم وأدفع الضرر عنه. والله يعلم من باطنه أنه لو ظهر لبعض أقرانه قبول عند ذلك السلطان، فصار يشفع في كل مسلم حتى دفع الضرر عن جميع المسلمين ثقل ذلك عليه، ولو قدر أن يقبح حاله عند السلطان بالطعن فيه والكذب عليه لفعل.", "وقد ينتهي غرور بعضهم إلى أن يأخذ من أموالهم، وإذا خطر له أنه حرام قال: هذا مال لا مالك له، وهو لمصالح المسلمين وأنت إمام من أئمتهم، فيجوز لك أن تأخذه قدر حاجتك. فيغتر بهذا التلبيس في ثلاثة أشياء:", "**أحدها**: أنه مال لا مالك له، فإنه قد يعرف من أخذ منه، فإن كان مات فورثته أحياء، وغاية الأمر وقوع الاختلاط في الأموال، ومعلوم أن من غصب مئة دينار", "حاشية: (١) في (ف): (قصده بالمدح).", "من عشرة أنفس وخلطها، فإنه مال حرام ولا يقال: لا مالك له. ويجب أن يقسمه بين العشرة، ويرد إلى كل واحد عشرة، وإن كان مال كل واحد منهم قد اختلط بمال الآخر.", "**والثاني**: في قوله: إنه في مصالح المسلمين وبك قوام الدين. (١-١)وربما كان لاستحلاله مثل هذا من الدجالين في الدين(١-١)؛ لأن إمام الدين هو العامل بعلمه، وقد ضرب عيسى ابن مريم لعالم السوء مثلا فقال: هو كصخرة وقفت في فم الوادي، فلا هي تشرب الماء ولا تتركه يخلص إلى الزرع(٢).", "وأصناف غرور العلماء في هذا العصر خارجة عن الحصر، وفيما ذكرنا تنبيه على ذلك.", "وفرقة أخرى أحكموا العلم وطهروا الجوارح، وزينوها بالطاعات، واجتنبوا ظاهر المعاصي، وتفقدوا أخلاق النفس وصفات القلب من الرياء والحسد والكبر والحقد، فقلعوا منابتها من القلوب، ولكن بقيت في زوايا القلب من خفايا مكايد الشيطان وخبايا خداع النفس دقائق غامضة، فلم يفطنوا لها وأهملوها، ومثالهم كمثل من أراد تنقية الزرع من الحشيش فنقاه وفتش على كل ما رآه فقلعه، إلا أنه لم يفتش عن مالم يخرج رأسه بعد من تحت الأرض ظنا منه أن الكل قد برز، فنبتت تلك الخفيات، فأفسدت الزرع من حيث لا يدري، فكذلك من لم يتفقد الدقائق، فتراه يسهر ليله وينصب نهاره في جمع العلوم وتزيينها وتحسين ألفاظها، يرى أن باعثه على ذلك الحرص على إظهار دين الله ونشر شريعته، وربما كان الباعث طلب الذكر وانتشار الصيت وانطلاق الألسن في الثناء عليه والتلذذ بحسن الإصغاء إلى إيراده والتمتع بتحريك الرؤوس عن سماع كلامه، والفرح بكثرة الأصحاب والمستفيدين، والسرور بالتفرد بهذه الخاصية من بين أقرانه، والتمكن بذلك من إطلاق اللسان له في الطعن على المقبلين على الدنيا، لا لأجل التفجع لمصيبة", "حاشية: (١-١) سقط من (ف).", "حاشية: (٢) لم يذكر المصنف الأمر الثالث، ولعله في قوله: أنت إمام من أئمتهم. . ."]], "ic": "book"}, {"story": ["كتاب ذم الغرور (٩ من ٢٩)، ص٩٥٤", ["الدين، ولكن عن إدلال بالتميز واعتداد بالتخصص، ولعل حياة هذا المغرور بانتظام أمره وإمارته وتوفير توقيره، فلو تغيرت عليه القلوب تكدر قلبه وضاعت أوراده، وربما احتاج إلى استعمال الكذب في تغطية عيوبه، وربما قدم بعض جلسائه وخدمته؛ لأنه أنجع لمراده وأشد إصغاء إليه، ولا يتفقد من نفسه تصحيح النية، وعساه لو وعد بالثواب في إيثار الخمول في إخفاء العلم لم يرغب فيه لفقده لذة القبول وعز الرياسة، وربما صنف ظانا أنه يجمع العلم لينتفع به، ونيته استطارة اسمه بحسن التصنيف، فلو ادعى مدع تصنيفه، ومحي عنه اسمه، ونسبه إلى نفسه ثقل عليه ذلك مع علمه بأن ثواب الاستفادة من التصنيف إنما يرجع إلى المصنف والله العالم بأنه المصنف لا من الادعاء، ولعله في تصنيفه لا يخلو من الثناء على نفسه إما صريحا بالدعاوى الطويلة العريضة، وإما ضمنا بالطعن في غيره ليستبان من طعنه في غيره أنه أفضل ممن طعن فيه وأعظم منه علما، ولعله يحكي من الكلام المزيف ما يريد تزييفه فينسبه إلى قائله، وما يستحسنه لا ينسبه ليظن أنه من كلامه فينقله بعينه، كالسارق، أو يغيره كالذي يسرق قميصا فيتخذه قباء حتى لا يعرف أنه مسروق، ولعله يفرح بزيادة أتباعه على أتباع من غيره أحق منه بذلك، وإن انقطع من أصحابه أحد إلى غيره ثقل عليه ومال بوجهه عنه، مع علمه أن الفائدة تحصل من الموضعين، وربما كان المكان الذي انتقل إليه أصلح للدين، وربما اغتيب نظيره بين يديه فوافق إظهارا للغضب للدين لا للنفس، فإن أثني عليه كره الثناء.", "فهذا وأمثاله من خفايا العيوب لا يفطن له إلا الأكياس ولا يتنزه عنه إلا الأقوياء، ولا مطمع فيه لأمثالنا من الضعفاء، إلا أن أقل الدرجات أن يعرف الإنسان عيوب نفسه ويحرص على صلاحها، ومن سرته حسنته وساءته سيئته فهو مرجو الحال، وأمره أقرب من المغرور المزكي نفسه الظان أنه من خيار الخلق.", "فهذا غرور الذين حصلوا العلوم المهمة، ولكنهم قصروا في العمل بالعلم.", "ولنذكر الآن غرور الذين قنعوا من العلوم بما لا يهمهم وتركوا المهم، وهم بذلك مغترون؛ إما لاستغنائهم عن أصل ذلك العلم، وإما لاقتصارهم عليه:", "فمنهم فرقة اقتصروا على علم الفتاوى في الحكومات والخصومات، وتفاصيل المعاملات الدنيوية الجارية بين الخلق لصلاح المعايش وخصصوا اسم الفقه بها وسموه: الفقه وعلم المذهب، وربما ضيعوا مع ذلك الأعمال الظاهرة والباطنة، فلم يتفقدوا الجوارح ولم يحرسوا اللسان عن الغيبة، ولا البطن عن الحرام، ولا القدم عن المشي إلى مالا يجوز، ولا القلوب عن الكبر والرياء والحسد وجميع المهلكات، فهؤلاء مغرورون من وجهين:", "**أحدهما**: من حيث العمل.", "**والآخر**: من حيث العلم."]], "ic": "book"}, {"story": ["كتاب ذم الغرور (١٠ من ٢٩)، ص٩٥٥", ["أما العمل: فقد ذكرنا وجه الغرور فيه، وأن من مثالهم مثال المريض إذا تعلم نسخة الدواء واشتغل بتكراره وتعليمه، لا بل مثالهم مثال من به علة البرسام(١) وهو مشرف على الهلاك، فاشتغل بتعلم دواء الاستحاضة وجعل يكرر ذلك ليلا ونهارا، مع علمه بأنه رجل لا يحيض ولا يستحاض، ولكنه يقول: ربما تقع علة الاستحاضة لامرأة وتسألني عن ذلك. وذلك غاية الغرور، فكذلك المتفقه الذي قد تسلط عليه حب الدنيا واتباع الشهوات والحسد والكبر والرياء وجميع المهلكات الباطنة، وربما يختطفه الموت قبل التوبة والتلافي فيهلك، فترك ذلك كله واشتغل بعلم السلم والإدارة والظهار واللعان والديات والحيض، وربما لم يحتج إلى شيء من ذلك لنفسه قط، وإذا احتاج غيره كان في المفتين كثرة فيشتغل بذلك ويحرص عليه لما فيه من الجاه والمال والرياسة، وقد دهاه الشيطان وما يشعر، إذ يظن المغرور بنفسه أنه مشغول بفرض دينه وليس يدري أن الاشتغال بفرض الكفاية قبل الفراغ من فرض العين معصية، هذا لو كانت نيته صحيحة كما قال، وكان قد قصد بالفقه وجه الله تعالى، فإنه وإن قصد وجه الله فهو باشتغاله به معرض عن فرض عينه في جوارحه وقلبه، فهذا غروره من حيث العمل.", "حاشية: (١) البرسام: هو التهاب في الغشاء المحيط بالرئة، ويسمى أيضا: ذات الجنب."]], "ic": "book"}, {"story": ["كتاب ذم الغرور (١١ من ٢٩)، ص٩٥٦", ["وأما غروره من حيث العلم: فحيث اقتصر على علم (١-١)الفتاوى، فظن أنه كل علم الدين، وربما طعن على(١-١) المحدثين وقال: إنهم نقلة وحملة أسفار لا يفقهون، وترك أيضا علم تهذيب الأخلاق، وترك الفقه عن الله بإدراك جلاله وعظمته، وهو العلم الذي يورث الخوف والهيبة والخشوع، ويحمل على التقوى، فتراه آمنا من الله مغترا به متكلا على أنه لابد أن يرحمه، لأنه قوام دينه، ولو لم يشتغل بالفتاوى لتعطل علم الحلال والحرام، فقد ترك العلوم التي هي أهم وهو غافل مغرور، وسبب غروره ما سمع في تعظيم الفقه، ولم يدر أن الفقه هو الفقه عن الله ومعرفة صفاته المخوفة والمرجوة ليستشعر القلب الخوف ويلازم التقوى، فقد قال تعالى: ﴿فَلَوْلَا نَفَرَ مِن كُلِّ فِرْقَةٍ مِّنْهُمْ طَآئِفَةٌ لِّيَتَفَقَّهُوا۟ فِى ٱلدِّينِ وَلِيُنذِرُوا۟ قَوْمَهُمْ إِذَا رَجَعُوٓا۟ إِلَيْهِمْ لَعَلَّهُمْ يَحْذَرُونَ﴾ [التوبة: ١٢٢]، والذي يحصل به الإنذار غير هذا العلم، فإن مقصود هذا العلم حفظ الأموال بشروط المعاملات، وحفظ الأبدان بالأموال، ودفع القتل والجراحات، والمال في طريق الله آلة، والبدن مركب، وإنما العلم المهم معرفة سلوك الطريق وقطع عقاب القلب التي هي الصفات المذمومة، فهي الحجاب بين العبد وبين الله، وإذا مات متلوثا بتلك الصفات كان محجوبا عن الله، فمثاله في الاقتصار على علم الفقه مثال من اقتصر من سلوك طريق الحج على علم خرز الراوية(٢) والخف، ولا شك في أنه لا بد من ذلك، ولكن ليس من الحج في شيء.", "ومن هؤلاء من اقتصر من علم الفقه على الخلافيات(٣)، ولم يهمه إلا تعلم طريق المجادلة والإلزام وإفحام الخصوم ودفع الحق لأجل الغلبة والمباهاة، فهو طول النهار والليل في التفتيش عن مناقضات أرباب المذاهب والتفنن لعيوب الأقران، وهؤلاء هم سباع الإنس، طبعهم الإيذاء، وهمهم السفه، ولا يقصدون من العلم إلا ما يلزمهم في مباهاة الأقران ويحتقرون مالا يحتاجون إليه في", "حاشية: (١-١) سقط من (ف).", "حاشية: (٢) الراوية: آلة من الجلد يستقى بها الماء، وخرزها: خياطتها.", "حاشية: (٣) في (ف): (الحذاقيات)."]], "ic": "book"}, {"story": ["كتاب ذم الغرور (١٢ من ٢٩)، ص٩٥٧", ["المباهاة، كعلم القلب، وعلم سلوك الطريق إلى الله سبحانه بمحو الصفات المذمومة وتبديلها بالمحمودة، ويسمون ذلك: التزويق وكلام الوعاظ، وإنما التحقيق عندهم معرفة تفاصيل العريدة التي تجري بين المتصارعين في الجدل، وهؤلاء قد جمعوا ما جمعه الذين قبلهم في علم الفتاوى، لكن زادوا إذ اشتغلوا بما ليس من فروض الكفايات أيضا بل جميع دقائق الجدل في الفقه بدعة لم يعرفها السلف، وأما أدلة الأحكام فيشتمل عليها علم المذهب، ، وهو كتاب الله وسنة رسوله وفهم معانيهما، وأما حيل الجدل من الكسر والقلب وفساد الوضع والتركيب والتعدية فإنما أبدعت لإظهار الغلبة والإفحام، وإقامة سوق الجدل به، فغرور هؤلاء أشد من غرور من قبلهم.", "وفرقة أخرى اشتغلوا بعلم الكلام والمجادلة في الأهواء والرد على المخالفين وتتبع مناقضاتهم، واستكثروا من معرفة المقالات المختلفة، واشتغلوا بتعلم الطرق في مناظرة أولئك وإفحامهم، وافترقوا في ذلك فرقا كثيرة، واعتقدوا أنه لا يكون لعبد عمل إلا بإيمان، ولا يصح الإيمان إلا بأن يتعلم جدلهم وما سموه أدلة عقائدهم، فظنوا أنه لا أحد أعرف بالله وبصفاته منهم، ثم هم فرقتان: ضالة ومحقة؛ فالضالة هي التي تدعو إلى غير السنة، والمحقة هي التي تدعو إلى السنة، والغرور شامل لجميعهم.", "أما الضالة: فلغفلتها عن ضلالتها وظنها بنفسها النجاة، وهم فرق كثيرة يكفر بعضهم بعضا، وإنما أتيت من حيث أنها لم تتهم رأيها ولم تحكم أولا شروط الأدلة ومنهاجها، فرأى أحدهم الشبهة دليلا والدليل شبهة.", "وأما الفرقة المحقة فاغترارها من حيث أنها ظنت أن الجدل أهم الأمور وأفضل القربات في دين الله، وزعمت أنه لا يتم لأحد دينه مالم يبحث، وأن من صدق الله ورسوله من غير تحرير دليل فليس بمؤمن أو بكامل الإيمان، فلهذا الظن الفاسد قطعت أعمارها في تعلم الجدل والبحث عن المقالات وهذيانات المبتدعة ومناقضاتهم، وأهملوا أنفسهم وقلوبهم حتى خفيت عنهم خطاياهم، وأحدهم يظن أن اشتغاله بالجدل أقرب له إلى الله تعالى، وهو لمكان التلذذ بالغلبة والرياسة وعز", "الانتماء إلى الذب عن دين الله قد عميت بصيرته، فلم يلتفت إلى القرن الأول وأن النبي ﷺ شهد لهم بأنهم خير الخلق، وأنهم قد أدركوا كثيرا من البدع والهوى فما جعلوا أعمارهم ودينهم غرضا للخصومات والمجادلات، ولا اشتغلوا بذلك عن تفقد قلوبهم وجوارحهم، بل لم يتكلموا فيه إلا لضرورة ردوا بها الضال، فإن رأوه مصرا على بدعة هجروه من غير مماراة ولا جدل، وقد روى أبو أمامة عن النبي ﷺ أنه قال: «ما ضل قوم قط بعد هدى إلا أوتوا الجدل»."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "وفرقة أخرى استغرقوا أوقاتهم في سماع الحديث وجمع رواياته وأسانيده الغريبة والعالية، فهم أحدهم أن يدور في البلاد ____ الشيوخ ليقول", "o": ["ويرى", "صفاتهم", "الدرجة", "نهاية"], "h": "راجع: ص٩٥٩"}, {"t": "fill", "d": 2, "q": "فمنهم فرقة اقتصروا على علم الفتاوى في الحكومات والخصومات، وتفاصيل المعاملات الدنيوية الجارية بين الخلق لصلاح ____ وخصصوا اسم الفقه بها وسموه", "o": ["المعايش", "والأعمش", "تتظاهر", "كفافا"], "h": "راجع: ص٩٥٥"}, {"t": "fill", "d": 2, "q": "وفرق المغترين كثيرة، وأحوالهم مختلفة، فمنهم من يرى المنكر معروفا، كمن يزخرف المساجد من المال الحرام، ومنهم من لا يميز بين ما يسعى فيه لنفسه وبين ما يسعى فيه لله سبحانه، كالواعظ الذي غرضه القبول والجاه، ومنهم من يترك الفرض ويشتغل بالنافلة، كمن يتعبد ويترك الكسب للعيال، ومنهم من يشتغل بالقشر عن اللب، كمن هو مقصور في ____ على تصحيح مخارج الحروف دون فهم ما يتلوه", "o": ["الصلاة", "حامد", "التصدق", "وعلاجه"], "h": "راجع: ص٩٤٤"}, {"t": "fill", "d": 2, "q": "ولنذكر الآن غرور الذين قنعوا من العلوم بما لا يهمهم وتركوا المهم، وهم بذلك مغترون؛ إما لاستغنائهم عن أصل ذلك العلم، ____ لاقتصارهم عليه", "o": ["وإما", "قائم", "الأجر", "نمام"], "h": "راجع: ص٩٥٤"}, {"t": "fill", "d": 2, "q": "وفرقة أخرى جاوزت حد هؤلاء وأحسنت الأعمال، وطلبت الحلال، واشتغلت بتفقد القلب، وصار أحدهم يدعي المقامات من الزهد والتوكل والرضا والحب من غير وقوف على حقيقة هذه المقامات وشروطها وعلاماتها وآفاتها، فمنهم من يدعي الوجد والحب لله تعالى، ويزعم أنه واله بالله، ولعله قد يخيل له في الله خيالات هي كفر أو بدعة، فيدعي حب الله قبل معرفته، ثم إنه لا يخلو عن مقارفة ما يكره الله وعن إيثار هوى ____ على أمر الله، وعن ترك بعض الأمور حياء من الخلق، ولو خلا لما تركه حياء من الله، ولا يدري أن كل ذلك يناقض الحب", "o": ["نفسه", "القبض", "أخرج", "فتندلق"], "h": "راجع: ص٩٦٨"}, {"t": "fill", "d": 2, "q": "وفرقة أخرى علموا أن هذه الأخلاق الباطنة مذمومة، إلا أنهم لعجبهم بأنفسهم يظنون أنهم منفكون عنها وأنهم أرفع عند الله من أن يبتليهم بذلك، وإنما يبتلى به العوام دون من بلغ مبلغهم من العلم، فإذا ظهر عليهم ____ الكبر والرئاسة وطلب العلو قال أحدهم", "o": ["مخايل", "يحصل", "شزرا", "وأخذته"], "h": "راجع: ص٩٥١"}]}, {"t": "كتاب ذم الغرور - القسم ٣ من ٥", "b": [{"story": ["كتاب ذم الغرور (١٣ من ٢٩)، ص٩٥٨", ["وفرقة أخرى اشتغلوا بالوعظ، وأعلاهم رتبة من يتكلم في أخلاق النفس وصفات القلب من الخوف والرجاء والصبر والشكر والتوكل والزهد والتقوى والإخلاص واليقين(١)، وهم مغرورون يظنون بأنفسهم أنهم إذا تكلموا بهذه الصفات وهم منفكون عنها عند الله لا عن قدر يسير لا ينفك عنه عوام المسلمين أنهم من أهلها، فيظنون أنهم ما تبحروا في علم المحبة إلا وهم محبون لله، وما قدروا على تحقيق دقائق الإخلاص إلا وهم مخلصون، وما وقفوا على خفايا عيوب النفس إلا وهم منزهون عنها، ولولا أنهم سالكون ما شرحوا السلوك، فأحدهم يرى أنه خائف وهو آمن، وأنه راج وهو مغتر، وأنه مخلص وهو مرائي، بل يصف الإخلاص بلا إخلاص في وصفه، ويصف الرياء وهو يرائي بذكره ليعتقد فيه أنه لولا أنه مخلص لما اهتدى إلى دقائق الرياء، ويصف الزهد لشدة حرصه على الدنيا، فهو يدعو إلى الله وهو هارب منه، ويخوف به وهو له آمن، ويذكر به وهو له ناس، ويذم الصفات المذمومة وهو بها موصوف، ويزعم أن غرضه إصلاح الخلق ولو ظهر من أقرانه من يقبل الناس عليه ويصلحوا على يديه لمات غما وحسدا، ولو أثنى أحد من المترددين إليه على بعض أقرانه لكان أبغض الناس إليه، فهؤلاء أعظم الناس غرة، وأبعدهم عن التنبه؛ لأن المرغب في الأخلاق المحمودة والمنفر عن المذمومة هو العلم بفوائدها وغوائلها، وهذا قد علم ذلك ولم ينفعه، وشغله حب دعاء الناس إلى العلم عن العمل به فبماذا(٢) يعالج؟ وإنما يمكن أن يدل على طريق", "حاشية: (١) سقطت من الأصل.", "حاشية: (٢) في (ف): (فلماذا).", "الامتحان والتجربة، وهو أن يقال له: أنت تدعي الخوف، فعن ماذا منعك؟ وتدعي الزهد فماذا تركت؟ وتدعي الأنس فمتى طابت لك الخلوة؟ ومتى استوحشت من مشاهدة الخلق؟. كيف وأنت تستوحش وحدك وتفرح إذا أحدق المريدون بك؟ فالأكياس يطالبون أنفسهم بالتحقيق ولا يقنعون منها بالتزويق، والمغترون يحسنون الظن بها، وإنما يقع الغرور لهؤلاء؛ لأنهم يصادفون في قلوبهم شيئا ضعيفا من أول هذه المعاني؛ وهي حب الله، والخوف منه، والرضا بفعله، ثم قدروا مع ذلك على وصف المنازل العالية، فظنوا أنهم ما رزقوا ذلك إلا لاتصافهم به، وذهب عنهم أن وصف الشيء غير الاتصاف به، فمثلهم كمثل مريض فصيح يحسن أن يصف المرض والصحة دون غيره من المرضى، فهو مشاركهم في المرض، وإن انفرد عنهم بالوصف، فهذا غرور الوعاظ الذين لا عيب في كلامهم، بل منهاج وعظهم منهاج وعظ الحسن وأمثاله."]], "ic": "book"}, {"story": ["كتاب ذم الغرور (١٤ من ٢٩)، ص٩٥٩", ["وفرقة أخرى منهم عدلوا عن المنهاج الواجب في الوعظ، وهم عامة وعاظ هذا الزمان إلا النادر، فاشتغلوا بالطامات والشطح وتلفيق كلام خارج عن قانون الشرع والعقل طلبا للإغراب، ومنهم طائفة يستشهدون بأشعار الوصال والفراق، وغرضهم أن يكثر في مجالسهم الصياح والتواجد ولو على أغراض فاسدة، فهؤلاء شياطين الإنس ضلوا وأضلوا، إلا أن الأولين إن لم يصلحوا أنفسهم فقد أصلحوا غيرهم وصححوا كلامهم، وهؤلاء يصدون عن سبيل الله ويحثون الناس على الاغترار بالله بما يزعمون أنه رجاء، فيزيد كلامهم العصاة جراءة على المعاصي ورغبة في الدنيا، لاسيما إذا كان الواعظ متزينا بزينة الدنيا، فإن حاله تشهد بحرصه عليها، ولا يخفى وجه كونه مغرورا.", "وفرقة أخرى منهم قنعوا بحفظ كلام الزهاد ومواعظهم من غير معرفة لمعانيها، وهم يظنون أنهم بحفظ ما يوردونه قد نالوا الغرض من غير أن يحفظوا نفوسهم من الذنوب، فهؤلاء أظهر غرورا ممن قبلهم.", "وفرقة أخرى استغرقوا أوقاتهم في سماع الحديث وجمع رواياته وأسانيده الغريبة والعالية، فهم أحدهم أن يدور في البلاد ويرى الشيوخ ليقول: أنا أروي عن فلان، وقد لقيت فلانا، ولي من الإسناد ما ليس لغيري. وغرورهم من وجوه:", "منها: أنهم يقتصرون على لفظ ما نقلوا ولا يفهمون معناه.", "ومنها: أنهم لا يعملون بما فهموا منه.", "ومنها: أنهم اشتغلوا بذلك عن فروضهم المتعينة من تطهير الأخلاق.", "ومنها: تحريفهم في تناول الحديث، فربما نام أحدهم في المجلس ثم كتب سماعه، أو قرأ على شيخ لا يدري ما يقرأ عليه، أو رأى كتابا فيه اسمه ولم يذكر أنه قد سمع من ذلك الشيخ، وقد جازف كثير من المحدثين في هذه الأشياء."]], "ic": "book"}, {"story": ["كتاب ذم الغرور (١٥ من ٢٩)، ص٩٦٠", ["وفرقة أخرى اشتغلوا بعلم النحو واللغة والشعر، وزعموا أنهم من علماء الأمة، وأن اشتغالهم بهذا سبب الغفران لهم إذ قوام الدين بالكتاب والسنة، وعلم اللغة والنحو يوضحهما، فأفنى هؤلاء أعمارهم في دقائق تلك العلوم، ومثالهم مثال من أفنى جميع العمر في تعلم الخط وتصحيح الحروف وتحسينها، ويزعم أن العلوم لا يمكن حفظها إلا بالكتابة، ولو عقل لعلم أنه يكفيه أن يتعلم أصل الخط بحيث يمكنه أن يقرأ، والباقي زيادة على الكفاية، وكذلك الأديب لو عقل لعرف أن لغة العرب كلغة الترك والمضيع عمره في معرفة لغة العرب كالمضيع عمره في معرفة لغة الترك، وإنما فارقتها لغة العرب لأجل ورود الشريعة بها، فيكفي من اللغة علم الغريبين؛ غريب القرآن والحديث، ومن النحو ما يقوم اللسان، فأما التعمق فيه إلى درجات لا تتناهى، فذلك يشغل عن ما هو أجود منه وألزم، ومثال المتعمق في ذلك كمثال من ضيع عمره في تصحيح مخارج الحروف في القرآن مقتصرا على ذلك، وذلك غرور؛ لأن المقصود من الحروف المعاني، وإنما الحروف ظروف وأدوات، ومن احتاج إلى شرب السكنجبين(١) لإزالة الصفراء فضيع وقته في تحسين القدح الذي يشرب فيه، فهو مغرور.", "والسعيد من أخذ من هذا حاجته المهمة، وتجاوز إلى العمل ثم عبر إلى لبابه، فطالب قلبه بحقيقة العمل، وحمل نفسه على ذلك، واجتهد في تصحيح الأعمال وتصفيتها من الشوائب، فهذا هو المقصود المخدوم من جميع", "حاشية: (١) السكنجبين: دواء مركب من الخل والعسل.", "علوم الشرع وسائر العلوم خدم له ووسائل إليه ومنازل توصل إلى ما هو المقصود، غير أن هذه العلوم لما كانت متعلقة بعلوم الشرع اغتر بها أربابها.", "وفرقة أخرى عظم غرورهم في فن الفقه فظنوا أن حكم العبد بينه وبين الله يتبع حكمه في مجلس القضاء، فوضعوا الحيل في دفع الحقوق، وذلك غرور، فإن الإنسان إذا ألجأ زوجته إلى أن تبرئه من حقها لم يبرأ فيما بينه وبين الله، وكذلك لو طلب رجل من رجل في ملأ من الناس فخاف مذمة الخلق فأعطى لم يكن العطاء طيبا، وكذلك من يعطى اتقاء لشره فهو حرام عليه، ومن هذا هبة الرجل مال الزكاة في آخر الحول من زوجته واتهابه مالها لإسقاط الزكاة، فإنه لا يسلم بذلك في القيامة، ومن ذلك إباحة الله مال المصالح للعلماء، والمغرورون منهم يرون أن كل مالا تتم رعونتهم إلا به حاجة، وذلك محض الغرور، بل كل ما تناوله العبد للاستعانة به على العبادة فهو حاجة، وما عدا ذلك فضول وشهوة، فهذه أمثلة تعرف أجناس الغرور.", "**الصنف الثاني: أرباب التعبد والعمل، والمغرورون منهم فرق**:"]], "ic": "book"}, {"story": ["كتاب ذم الغرور (١٦ من ٢٩)، ص٩٦١", ["ففرقة أهملوا الفرائض واشتغلوا بالفضائل والنوافل، وربما تعمقوا في الفضائل حتى خرجوا إلى السرف كالمتوسوس في الوضوء ولا يرضى بالماء المحكوم بطهارته شرعا، بل يقدر له الاحتمالات البعيدة في التنجيس، ولا يقدر ذلك في مطعمه، فلو انقلب هذا الاحتياط من الماء إلى المطعم كان أشبه بسير السلف، فإن عمر قد توضأ من جرة نصرانية مع ظهور احتمال النجاسة، وكان مع هذا يدع أبوابا من الحلال خوفا من الوقوع في الحرام.", "ثم فيهم من يخرج إلى الإسراف في صب الماء وقد يطول به الأمر حتى تضيع الصلاة منه ويخرج وقتها، فإن لم يخرج وقتها فقد غر بما فاته من فضيلة أول الوقت، ثم هو مغرور لإسرافه في الماء، ثم غروره بتضييع العمر الذي هو أعز الأشياء فيما له مندوحة عنه، فالشيطان لا يصد العباد إلا بما يخيل إليهم أنه عبادة.", "وفرقة غلبت عليها الوسوسة في نية الصلاة حتى ربما فاتتهم ركعة مع الإمام، وقد يغيرون صيغة التكبير لشدة الاحتياط، ثم يغفلون في باقي الصلاة ظنا أن تصحيح الابتداء كاف، وهذا غرور.", "وفرقة أخرى تغلب عليها الوسوسة في إخراج حروف الفاتحة وسائر الأذكار من مخارجها، فلا يزال أحدهم يحتاط في التشديدات والفرق بين الضاد والظاء فوق الحاجة، وتصحيح مخارج الحروف في جميع صلاته لا يهمه غيره، ولا يتفكر فيما سواه، ذاهلا عن معنى القرآن والاتعاظ به، وصرف الفهم إلى أسراره، وهذا من أقبح أنواع الغرور، فإنه لم يكلف الخلق في تلاوتهم القرآن من تحقيق مخارج الحروف إلا ما جرت به عادتهم في الكلام، ومثال هؤلاء مثال من حمل رسالة إلى سلطان، فأخذ يؤدي الرسالة بالتأني في مخارج الحروف وتكرارها، وهو غافل عن مقصود الرسالة ومراعاة حرمة المجلس، فما أجراه بالطرد والتأديب."]], "ic": "book"}, {"story": ["كتاب ذم الغرور (١٧ من ٢٩)، ص٩٦٢", ["وفرقة أخرى اغتروا بقراءة القرآن فهم يهذونه هذا(١)، وربما ختموا في اليوم مرتين ولسان أحدهم يجري به وقلبه يتردد في أودية الأماني، إذ ليس بمتفكر في معانيه لينزجر بزواجره ويتحفظ بمواعظه ويقف عند أوامره ونواهيه، ويعتبر بمواضع(٢) الاعتبار فيه إلى غير ذلك مما ذكرناه في كتاب تلاوة القرآن من مقاصد التلاوة، فهو مغرور يظن أن المقصود من إنزال القرآن التلاوة فقط، ومثال هذا مثال عبد كتب إليه مالكه كتابا يأمره فيه وينهاه، فلم يصرف عنايته إلى فهمه والعمل به، لكنه اقتصر على حفظه وتكريره ظانا أن ذلك هو المراد منه مع استمراره على خلاف ما أمره به مولاه، فهذا مستحق للعقوبة، ومتى ظن أن ذلك هو المراد منه فهو مغرور، وإنما تراد تلاوته ليحفظ ولا ينسى، ثم المراد من اللفظ معناه، ثم المراد من المعنى العمل به والانتفاع بمعانيه، وقد يكون له صوت طيب فهو يقرأ ويلتذ بقراءته ويغتر باستلذاذه، ويظن أن ذلك لذة مناجاة، وإنما هو لذة بصوته، ولو ردد تلك الألحان بشعر وكلام لا لتذ به ذلك الالتذاذ، فهو مغرور إذ لم يتفقد قلبه فيعرف هل التذاذه بالنظم أو بالصوت أو بالمعاني؟", "حاشية: (١) يهذونه هذا: يسرعون بقراءته.", "حاشية: (٢) في الأصل: (بواعظ).", "وفرقة أخرى منهم اغتروا بالصوم فأكثروا منه وهم لا يحفظون ألسنتهم عن الغيبة والفضول، ولا خواطرهم من الرياء، ولا بطونهم من الحرام عند الإفطار، فيهملون الفرض ويحفظون النفل، وذلك غاية الغرور(١).", "وفرقة أخرى اغتروا بالحج، فيخرجون من غير خروج عن المظالم وقضاء الديون واسترضاء الوالدين وطلب الزاد الحلال، وقد يفعلون ذلك بعد سقوط حج الفرض، ويضيعون في الطريق الصلاة والفرائض، ويعجزون عن طهارة الثوب والبدن، ويتعرضون لمكس(٢) الظلمة حتى يؤخذ منهم، ولا يحترزون من الرفث والخصام، وربما جمع بعضهم الحرام وأنفقه على الرفقاء في الطريق يطلب به السمعة والرياء، فيعصي الله عز وجل في كسبه وفي إنفاقه، ثم يحضر البيت بقلب ملوث برذائل الأخلاق وذميم الصفات، لم يطهر قبل الحضور، وهو مع ذلك يظن أنه على خير، وهو مغرور.", "وفرقة أخرى أخذوا في الأمر بالمعروف والنهي عن المنكر، ونسوا أنفسهم فإذا أمروا عنفوا وطلبوا التعزز والرياسة، وقد يجمع أحدهم الناس للإقدام على الإنكار، فمن تأخر ذمه، ومنهم من يؤذن(٣) ويظن أن ذلك لله، ولو أذن(٤) غيره عند غيبته قامت عليه القيامة، وقال: قد زاحمني في مرتبتي. ومنهم من يؤم في مسجد، فلو تقدم أعلم منه وأورع ثقل عليه."]], "ic": "book"}, {"story": ["كتاب ذم الغرور (١٨ من ٢٩)، ص٩٦٣", ["وفرقة أخرى جاوروا بمكة والمدينة واغتروا بذلك، ولم يراقبوا قلوبهم، وهي متعلقة ببلادهم ملتفتة إلى قول الناس: فلان مجاور بمكة، ومنهم من يقول: جاورت بمكة كذا وكذا سنة. ثم إنه يجاور ويطمع في أوساخ الناس، ثم يجمعه ويشح به فيجتمع له الطلب والشح وجملة من المهلكات أوجبتها المجاورة، فهو مغرور.", "حاشية: (١) في النسخ: (غاية أخرى)، والمثبت من الإحياء.", "حاشية: (٢) هو ما يفرضه الصادون عن الطريق على كل حاج للسماح له بالمرور.", "حاشية: (٣) تصحفت في الأصل: (يؤذب).", "حاشية: (٤) تصحفت في الأصل إلى (أدب).", "وما من عمل إلا وفيه آفات فمن لم يعرفها ساكنها فغر، ومن أراد تعرفها فلينظر في كتابنا هذا، فلينظر إلى مداخل الغرور في الصلاة من كتاب الصلاة وفي الحج والزكاة والتلاوة وجميع القربات من الكتب المرتبة في هذا الكتاب، وإنما الغرض الآن الإشارة إلى مجامع ما سبق في الكتب.", "وفرقة أخرى زهدت في المال وقنعت بالدون من اللباس والطعام، ومن المسكن بالمساجد، وظنت أنها أدركت رتبة الزهاد وهم مع هذا شديدو الرغبة في الرياسة والجاه، فقد تركوا أهون الأمرين وباؤوا بأعظم المهلكين، فإن شر طلب الرياسة أعظم من شر المال، فهؤلاء مغرورون إذ ظنوا أنهم من الزهاد، ولم يفهموا الدنيا، ولم يدروا أن منتهى لذاتها الرياسة، وأن الراغب فيها لا بد أن يكون حسودا ومنافقا ومتكبرا ومرائيا ومتصفا بخبائث الأخلاق، وقد يترك الرياسة ويؤثر العزلة وهو مغرور أيضا من جهة أنه يتطاول بذلك على الأغنياء ويحتقرهم، ويرجو لنفسه أكثر مما يرجو لهم، ويعجب بعمله، ويتصف بجملة من خبائث القلوب، ولا يدري.", "وربما يعطى المال فلا يأخذه خيفة أن يقال: بطل زهده، رغبة في حمد الناس، وهو ألذ أبواب الدنيا، وربما لا يخلو عن تقديم الأغنياء على الفقراء ومن الميل إلى المريدين والنفور عن المائلين إلى غيره من الزهاد، وكل ذلك غرور وخدعة من الشيطان.", "وفي العباد من يشدد على نفسه في أعمال الجوارح فربما صلى في اليوم والليلة ألف ركعة، وختم القرآن، وهو مع ذلك لا يخطر له مراعاة القلب وتفقده وتطهيره من الرياء والكبر والعجب وسائر المهلكات ولا يدري أن ذلك مهلك، وإن علم، فلا يظن بنفسه ذلك، وإن ظن بنفسه ذلك توهم أنه مغفور له لأجل عمله الظاهر، وأنه غير مؤاخذ بأحوال القلب، وإن توهم ذلك ظن أن العبادات الظاهرة ترجح بها الحسنات وهيهات! فذرة من ذي تقوى، وخلق واحد من أخلاق الأكياس أفضل من أمثال الجبال عملا بالجوارح، ثم لا يخلو من الرياء وحب الثناء، فإذا قيل له: أنت من أوتاد الأرض، فرح وزاد غروره وظن أن تزكية", "الناس له دليل على كونه مرضيا عند الله تعالى، ولا يدري أن ذلك لجهل الناس بخبائث باطنه."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "فإن قيل: فإن سلم من العجب بنفسه إذ علم أن ذلك من الله لا منه، وأنه لم يقدر على دفع الشيطان إلا بتوفيق الله تعالى، فهل بقي ____", "o": ["عليه", "وشؤم", "لمكس", "تكررت"], "h": "راجع: ص٩٧٧"}, {"t": "fill", "d": 2, "q": "ذلك أو يكفيه ذلك لم يثقل عليه إن كان غرضه هدايتهم، ومتى تمكن الشيطان منه في هذا الباب دعاه إلى جميع ____ القلوب وفواحش الجوارح فأهلكه", "o": ["كبائر", "الأشعري", "لغيرهم", "شراب"], "h": "راجع: ص٩٧٧"}, {"t": "fill", "d": 2, "q": "والسعيد من أخذ من هذا حاجته المهمة، وتجاوز إلى العمل ثم عبر إلى لبابه، فطالب قلبه بحقيقة العمل، وحمل نفسه على ذلك، واجتهد في ____ الأعمال وتصفيتها من الشوائب، فهذا هو المقصود المخدوم من جميع", "o": ["تصحيح", "لفلان", "أفنى", "المذنب"], "h": "راجع: ص٩٦٠"}, {"t": "fill", "d": 2, "q": "وقولهم: إن الله كريم. كلام صحيح، ولكن الشياطين تخدعهم به، وقد كشف ذلك قول الرسول ﷺ: «____ من أتبع نفسه هواها وتمنى على", "o": ["والعاجز", "وللنفس", "الطاعات", "فاحتاج"], "h": "راجع: ص٩٤٧"}, {"t": "fill", "d": 2, "q": "والمعاصي المتعلقات بالبدن والقلب، إلا أن حب الرياسة والجاه وقهر ____ غطى عليه، فظن أنه مشغول بمهم دينه", "o": ["الأقران", "بألسنتها", "السورة", "لإيثاره"], "h": "راجع: ص٩٦٦"}, {"t": "fill", "d": 2, "q": "منهم من غرته الدنيا، فقال: النقد خير من النسيئة، والدنيا نقد والآخرة نسيئة، ومنهم من قال: لذات الدنيا متيقنة، ولذات الآخرة ____ فيها، واليقين خير من", "o": ["مشكوك", "الذنوب", "لعبهم", "سبيله"], "h": "راجع: ص٩٤٥"}]}, {"t": "كتاب ذم الغرور - القسم ٤ من ٥", "b": [{"story": ["كتاب ذم الغرور (١٩ من ٢٩)، ص٩٦٥", ["وفرقة أخرى حرصت على النوافل ولم يعظم اعتدادها بالفرائض، فترى أحدهم يفرح بصلاة الضحى وصلاة الليل وأمثال هذه النوافل، ولا يجد للفريضة لذة، ولا يشتد حرصه على المبادرة بها في أول الوقت وينسى قوله عليه الصلاة والسلام فيما يرويه عن ربه عز وجل: «ما تقرب المتقربون إلي بمثل أداء ما افترضت عليهم».", "واعلم أنه قد يتعين على الإنسان فرضان، أحدهما يفوت والآخر لا يفوت، أو فضلان أحدهما يضيق وقته والآخر يتسع وقته، فإن لم يحفظ الترتيب في ذلك كان مغرورا، ونظائر ذلك أكثر من أن تحصى، فإن المعصية ظاهرة والطاعة ظاهرة، وإنما الغامض تقديم بعض الطاعات على بعض، كتقديم الفرائض كلها على النوافل، وتقديم فروض الأعيان على فروض الكفايات، وتقديم فرض كفاية لا قائم به على ما قام به غيره، وتقديم الأهم من فروض الأعيان على ما دونه، وتقديم ما يفوت على مالا يفوت، وهذا كما يجب أن يقدم حاجة الوالدة على حاجة الوالد، لأن رسول الله ﷺ سئل: من أبر؟ قال: «أمك» قال: ثم من؟ قال: «قال: «أمك». قال: ثم من؟ قال: «أمك». قال: ثم من؟ قال: «أباك، ثم الأقرب فالأقرب». فينبغي أن يبدأ في الصلة بالأقرب، فإن استويا فبالأحوج، فإن استويا فالأتقى والأورع، وكذلك من لا يفي ماله بنفقة الوالدين والحج، بل ينبغي أن يقدم حقهما على الحج، وهذا من تقديم فرض أهم على فرض هو دونه، وكذلك إذا كان بين اثنين وعد ودخل وقت الجمعة فالجمعة تفوت، والاشتغال بالوفاء بالوعد معصية وإن كان طاعة في نفسه، وكذلك تصيب ثوبه النجاسة فيغلظ القول على أبويه وأهله بسببه، فالنجاسة محذورة وإيذاؤهما محذور، والحذر من الأذى لهما أهم من الحذر من النجاسة، والأمثلة في تقابل المحذورات والطاعات لا تنحصر، ومن ترك الترتيب في جميع ذلك فهو مغرور، وهذا غرور في غاية الغموض؛ لأن المغرور فيه في طاعة إلا أنه لا يفطن لضرورة الطاعة معصية حيث ترك بها طاعة واجبة هي أهم منها، ومن جملة ذلك: اشتغال الإنسان بالمذهب والخلاف وقد بقي عليه شغل من الطاعات", "والمعاصي المتعلقات بالبدن والقلب، إلا أن حب الرياسة والجاه وقهر الأقران غطى عليه، فظن أنه مشغول بمهم دينه.", "**الصنف الثالث: المتصوفة، والمغترون منهم فرق**:"]], "ic": "book"}, {"story": ["كتاب ذم الغرور (٢٠ من ٢٩)، ص٩٦٦", ["ففرقة هم متصوفة أهل هذا الزمان إلا من عصمه الله تعالى اغتروا بالزي والنطق والهيئة، فشابهوا الصادقين من الصوفية في زيهم وهيئتهم وألفاظهم وآدابهم وطهارتهم وخشوعهم وتنفس الصعداء وخفض الصوت إلى غير ذلك من الشمائل والهيئات، فلما تشبهوا بهم في ذلك ظنوا أنهم صوفية، ولم يتعبوا أنفسهم قط في المجاهدة والرياضة وتطهير الباطن والظاهر من الآثام الجلية والخفية، وكل ذلك من أوائل منازل التصوف، ثم هم يتكالبون على الحرام والشبهات وأموال السلاطين، ويتنافسون في الرغيف والحبة ويمزق بعضهم أعراض بعض إذا اختلفوا في غرض، وهؤلاء غرورهم ظاهر، ومثالهم مثال عجوز سمعت أن الشجعان والأبطال من المقاتلين تثبت أسماؤهم في الديوان ويقطع كل واحد منهم قطرا من أقطار المملكة، فتاقت نفسها إلى ذلك فلبست درعا ووضعت على رأسها مغفرا(١) وتعلمت من رجز الأبطال أبياتا وتعودت إيراد تلك الأبيات بنغماتهم حتى تيسرت عليها، وتعلمت كيفية تبخترهم في الميدان، وكيف تحريكهم الأيدي، وتلقفت جميع شمائلهم في الزي والمنطق والحركات والسكنات، ثم توجهت إلى المعسكر لتثبت اسمها في ديوان الشجعان، فلما حضرت ديوان العرض أمر بأن تجرد عن المغفر والدرع، وينظر ما تحته ويمتحن بالمبارزة لبعض الشجعان ليعرف قدر شجاعتها، فلما جردت فإذا هي عجوز ضعيفة زمنة(٢) لا تطيق حمل الدرع والمغفر، فقيل لها: أجئت تستهزئين بالملك وأهل حضرته بهذا التلبيس؟ خذوها فألقوها بين يدي الفيل. فألقيت إلى الفيل. فهكذا يكون حال المدعين للتصوف في القيامة إذا كشف عنهم الغطاء وعرضوا على الحاكم الأكبر الذي ينظر إلى القلب لا إلى الزي والمرقعات.", "حاشية: (١) المغفر: زرد ينسج من الدروع على قدر الرأس يلبس تحت القلنسوة.", "حاشية: (٢) زمنة: أي مريضة مرضا دائما وهو مرض الهرم وتقدم العمر."]], "ic": "book"}, {"story": ["كتاب ذم الغرور (٢١ من ٢٩)، ص٩٦٧", ["وفرقة أخرى زادت على هؤلاء في الغرور إذ شق عليها الاقتداء بهم في بذاذة(١) الثياب والرضا بالدون، وأرادت أن تتظاهر بالتصوف ولم تجد بدا من التزيي بزيهم، فتركوا الخز والإبريسم، وطلبوا المرقعات النفيسة والفوط الرفيعة السجادات المصبوغة، ولبسوا من الثياب ما هو أرفع قيمة من الخز والإبريسم، وظن أحدهم مع ذلك أنه متصوف بمجرد لون الثوب وكونه مرقعا، ونسي أنهم إنما لونوا الثياب لتحمل الوسخ فيطول زمان الغسل، وإنما لبسوا المرقعات؛ لأن ثيابهم تخرقت فرقعوها، فأما تقطيع الفوط الرفيعة قطعة قطعة وخياطة المرقعات منها فمن أين يشبه ما اعتاده؟ فهؤلاء أظهر حماقة من جميع المغترين، فإنهم يتنعمون بنفيس الثياب ولذيذ الأطعمة، ويطلبون رغد العيش ويأكلون أموال السلاطين، ولا يجتنبون المعاصي الظاهرة فضلا عن الباطنة، وهم مع ذلك يظنون بأنفسهم الخير، وشر هؤلاء يتعدى إلى الخلق؛ لأن المقتدي بهم هالك، ومن لا يقتدي بهم تفسد عقيدته في المتصوفة كافة، فيقع في الصادقين، وذلك بشؤم المتشبهين بهم.", "وفرقة أخرى ادعت علم المعرفة ومشاهدة الحق ومجاوزة المقامات والأحوال، والوصول إلى القرب، ولا يعرفون من تلك الأمور إلا الأسامي، فأحدهم يرددها ويظن أن ذلك أعلى من علم الأولين والآخرين، فهو ينظر إلى الفقهاء والمحدثين وأصناف العلماء بعين الإزراء فضلا عن العوام، حتى إن الفلاح ليترك فلاحته والحائك يترك حياكته ويلازمهم أياما معدودة، ويتلقف منهم تلك الكلمات المزيفة، فيرددها كأنه يتكلم عن الوحي، ويحتقر في ذلك جميع العلماء والعباد ويقول في العلماء: إنهم محجوبون عن الله بالعلم، وفي العباد: إنهم أجراء متعبون. ويدعي لنفسه أنه الواصل إلى الحق وأنه من المقربين وهو عند الله من الفجار المنافقين، وعند أرباب القلوب من الحمقى الجاهلين، لم يحكم علما قط، ولم يهذب خلقا، ولم يراقب قلبا سوى اتباع الهوى(٢) وحفظ الهذيان.", "حاشية: (١) بذاذة الثياب: رثاثتها وسوء حالها.", "حاشية: (٢) سقط من (ف)."]], "ic": "book"}, {"story": ["كتاب ذم الغرور (٢٢ من ٢٩)، ص٩٦٨", ["وفرقة منهم وقعت في الإباحة وطووا بساط الشرع ورفضوا الأحكام وسووا بين الحلال والحرام، فبعضهم يقول: إن الله مستغن عن عملي فلم أتعب نفسي؟ وبعضهم يقول: قد كلف الناس تطهير القلوب عن الشهوات وحب الدنيا، وذلك لا يمكن، وإنما يغتر بذلك التكليف من لم يجرب، ونحن فقد جربنا وعلمنا أن ذلك محال. ولا يعلم الأحمق أن الناس لم يكلفوا قلع الشهوة والغضب من أصلهما، بل تأديبهما حتى ينقاد كل واحد منهما لحكم العقل والشرع، وبعضهم يقول: الأعمال بالجوارح لا قدر لها وإنما النظر إلى القلوب، وقلوبنا والهة بحب الله وواصلة إلى معرفة الله، وإنما نخوض في الدنيا بأبداننا وقلوبنا عاكفة في الحضرة الربانية، فنحن مع الشهوات بالظاهر لا بالقلوب. ويزعمون أنهم قد ترفعوا عن رتبة العوام واستغنوا عن تهذيب النفس بالأعمال البدنية، وأن الشهوات لا تصدهم عن طريق الله لقوتهم فيها، ويرفعون درجة أنفسهم عن درجة الأنبياء؛ لأن الأنبياء كانوا يبكون على خطيئة واحدة سنين.", "وأصناف غرور أهل الإباحة من المتشبهين بالصوفية لا تحصى، وكل ذلك بناء على أغاليط ووساوس خدعهم الشيطان بها لاشتغالهم بالمجاهدة قبل إحكام العلم ومن غير اقتداء بشيخ متقن في الدين والعلم صالح للاقتداء به، وإحصاء أصنافهم يطول.", "وفرقة أخرى جاوزت حد هؤلاء وأحسنت الأعمال، وطلبت الحلال، واشتغلت بتفقد القلب، وصار أحدهم يدعي المقامات من الزهد والتوكل والرضا والحب من غير وقوف على حقيقة هذه المقامات وشروطها وعلاماتها وآفاتها، فمنهم من يدعي الوجد والحب لله تعالى، ويزعم أنه واله بالله، ولعله قد يخيل له في الله خيالات هي كفر أو بدعة، فيدعي حب الله قبل معرفته، ثم إنه لا يخلو عن مقارفة ما يكره الله وعن إيثار هوى نفسه على أمر الله، وعن ترك بعض الأمور حياء من الخلق، ولو خلا لما تركه حياء من الله، ولا يدري أن كل ذلك يناقض الحب.", "وبعضهم ربما يميل إلى القناعة والتوكل، فيخوض البوادي من غير زاد ليصحح دعوى معنى التوكل، وليس يدري أن ذلك بدعة لم تنقل عن الصحابة والسلف", "الصالح، وقد كانوا أعرف بالتوكل منه، فما فهموا أن التوكل المخاطرة بالروح وترك الزاد، بل كانوا يأخذون الزاد وهم متوكلون على الله لا على الزاد، وهذا ربما يترك الزاد وهو متوكل على سبب من الأسباب واثق به.", "وقد ذكرنا مداخل الآفات في ربع المنجيات(١)، فلا نعيده.", "وفرقة أخرى ضيقت على أنفسها في أمر القوت حتى طلبت منه الحلال الخالص وأهملوا تفقد القلب والجوارح في غير هذه الخصلة الواحدة، ومنهم من أهمل الحلال في مطعمه وملبسه ومكسبه، وأخذ يتعمق في غير ذلك، وليس يدري المسكين أن الله لم يرض من عبده بطلب الحلال فقط، ولا يرضى بجميع الأعمال دون طلب الحلال، بل لا يرضيه إلا تفقد جميع الطاعات والمعاصي، فمن ظن أن بعض هذه الأمور يكفيه وينجيه فهو مغرور."]], "ic": "book"}, {"story": ["كتاب ذم الغرور (٢٣ من ٢٩)، ص٩٦٩", ["وفرقة منهم ادعوا حسن الخلق والتواضع والسماحة، فتصدوا لخدمة الصوفية، فجمعوا قوما وتكلفوا بخدمتهم، واتخذوا ذلك شبكة للرياسة وجمع المال، وإنما غرضهم التكبر وهم يظهرون الخدمة والتواضع، وغرضهم الارتفاق وهم يظهرون أن غرضهم الإرفاق، وغرضهم الاستتباع وهم يظهرون أن غرضهم الخدمة والتبعية، ثم إنهم يجمعون من الحرام أو الشبهات وينفقون عليهم لتكثر أتباعهم وينتشر بالخدمة اسمهم، وبعضهم يأخذ أموال السلاطين وينفق عليهم، وبعضهم يأخذها لينفق في طريق الحج على الصوفية ويزعم أن غرضه البر والإرفاق، وباعث جميعهم الرياء والسمعة، وآية ذلك إهمالهم لجميع أوامر الله تعالى ظاهرا وباطنا، ورضاهم بأخذ الحرام والإنفاق منه، ومثال من ينفق الحرام في طريق الحج لإرادة الخير كمن يعمر مساجد الله ويطليها بالعذرة(٢) ويزعم أن قصده العمارة.", "وفرقة أخرى اشتغلوا بالمجاهدة وتهذيب الأخلاق وتطهير النفوس من عيوبها، وصاروا يتعمقون فيها، فاتخذوا البحث عن عيوب النفس واستنباط دقائق الكلام", "حاشية: (١) تحرفت في الأصل إلى: (المهلكات).", "حاشية: (٢) العذرة: الغائط.", "في آفاتها، فيقولون: في النفس عيب، والغفلة من كونها عيبا عيب، والالتفات إلى كونه عيبا عيب، ويشغفون فيه بكلمات مسلسلة تضييع الأوقات في تلفيقها، ومن جعل طول عمره في التفتيش عن العيوب وتحرير علم علاجها كان كمن اشتغل بالتفتيش عن عوائق الحج ولم يسلك طريق الحج، فذلك لا يعنيه.", "وفرقة أخرى جاوزوا هذه الرتبة، وابتدأوا سلوك الطريق وافتتح لهم باب المعرفة، فلما استنشقوا مبادئ ريح المعرفة تعجبوا منها وفرحوا بها وأعجبتهم غرائبها، فتقيدت قلوبهم بالالتفات إليها والتفكر فيها وفي كيفية انفتاح بابها عليهم وانسداده عن غيرهم، وكل ذلك غرور، لأن عجائب طريق الله ليس لها نهاية، فلو وقف مع كل أعجوبة وتقيد بها قصرت خطاه وحرم الوصول إلى المقصد، وكان مثاله مثال من قصد ملكا فرأى على بابه روضة فيها أزهار لم يكن رأى قبل ذلك مثلها، فوقف ينظر إليها حتى فاته الوقت الذي يمكن فيه لقاء الملك.", "وفرقة أخرى جاوزوا هؤلاء ولم يلتفتوا إلى ما يفيض عليهم من الأنوار في الطريق وإلى ما يتيسر لهم من العطايا الجزيلة، ولم يعرجوا على الفرح بها والالتفات إليها جادين في السير حتى قاربوا فوصلوا إلى حد القربة إلى الله، فظنوا أنهم وصلوا إلى الله فوقفوا وغلطوا، ورب ناظر إلى نور هو حجاب يظنه المقصود، ولهذا لما نظر النصارى إلى إشراق نور الله قد تلألأ على المسيح غلطوا فيه، كمن رأى كوكبا في مرآة أو في ماء فظن أن الكوكب في المرآة أو في الماء، فمد يده إليه ليأخذه وهو مغرور.", "**الصنف الرابع: أرباب الأموال: والمغترون منهم فرق**:"]], "ic": "book"}, {"story": ["كتاب ذم الغرور (٢٤ من ٢٩)، ص٩٧٠", ["ففرقة منهم يحرصون على بناء المساجد والمدارس(١) والرباطات والقناطر وما يظهر للناس، ويكتبون أسماءهم بالآجر عليها ليتخلد ذكرهم ويبقى بعد الموت أثرهم، وهم يظنون أنهم قد استحقوا المغفرة بذلك وقد اغتروا فيه من وجهين:", "حاشية: (١) في (ف): (المدائن).", "أحدهما: أنهم يبنونها من أموال كسبوها من الظلم والرشا والجهات المحظورة، فهم قد تعرضوا لسخط الله في كسبها، وتعرضوا لسخطه في إنفاقها، وكان الواجب عليهم الامتناع عن كسبها، فإذا عصوا الله تعالى بكسبها كان الواجب عليهم التوبة وردها إلى ملاكها إما بأعيانها إن كانت باقية، وإلا فرد بدلها، فإن عجزوا عن الملاك، ردوها إلى الورثة، فإن لم يبق للمظلوم وارث فالواجب صرفها إلى أهم المصالح، وربما كان الأهم التفرقة على المساكين وهم لا يفعلون ذلك خيفة من أن يظهر ذلك للناس، فيبنون الأبنية بالآجر وغرضهم الرياء واجتلاب الثناء، وحرصهم على بقائها لبقاء أسمائهم بها لا لبقاء الخير.", "والوجه الثاني: أنهم يظنون بأنفسهم الإخلاص وقصد الخير في الإنفاق على الأبنية، ولو كلف واحد منهم أن ينفق دينارا ولا يكتب اسمه على الموضع الذي أنفق عليه لشق عليه، ولم تسمح به نفسه، فالله مطلع عليه كتب اسمه أو لم يكتب، فلولا أنه يريد به وجه الناس لا وجه الله ما فعل ذلك.", "وفرقة أخرى ربما اكتسبت المال من الحلال وأنفقت على المساجد، وهي أيضا مغرورة من وجهين:", "أحدهما: الرياء وطلب الثناء، فإنه ربما يكون في بلده أو في جواره فقراء فصرف المال إليهم أهم من الصرف إلى المساجد وزينتها، وإنما يخف عليه الصرف إلى المساجد ليظهر ذلك على الناس.", "والثاني: أنه يصرف ذلك إلى زخرفة المسجد وتزيينه بالنقوش التي هي منهي عنها وشاغلة أبصار المصلين وقلوبهم، والمقصود من الصلاة الخشوع وحضور القلب، وذلك يفسد قلوب المصلين ويحبط ثوابهم، ووبال ذلك كله يرجع إليه، وهو مع ذلك يغتر به ويرى أنه من الخيرات، ويعتد بذلك وسيلة إلى الله تعالى، وهو بذلك قد تعرض لسخط الله تعالى وهو يظن أنه مطيع لله وممتثل لأمره، وقد كدر قلوب الناس مما زخرف من المسجد وربما شوقهم به إلى زخارف الدنيا فيشتهون مثل ذلك في بيوتهم ويشتغلون بطلبه، ووبال ذلك كله عليه، إذ المسجد", "إنما جعل للتواضع وحضور القلب، قال مالك بن دينار: أتى رجل مسجدا فوقف على الباب، فقال: مثلي يدخل بيت الله؟ فكتب في مكانه صديقا، فبهذا ينبغي أن تعظم المساجد، وهو أن يرى تلويث المسجد بنفسه جناية، لا أن يرى تلويث المسجد بالحرام أو بزخرفة الدنيا منة على الله تعالى، فغرور هذا من حيث إنه رأى المنكر معروفا واتكل عليه."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "والثاني: أنه يصرف ذلك إلى زخرفة المسجد وتزيينه بالنقوش التي هي منهي عنها وشاغلة أبصار المصلين وقلوبهم، والمقصود من الصلاة الخشوع وحضور القلب، وذلك يفسد قلوب المصلين ويحبط ثوابهم، ووبال ذلك كله ____", "o": ["يرجع", "رئاسة", "يشمت", "وأئمة"], "h": "راجع: ص٩٧١"}, {"t": "fill", "d": 2, "q": "أو من يحتاجون إليه في المستقبل لخدمة، أو من لهم فيه على الجملة غرض، أو يسلمون ذلك إلى بعض الأكابر ليفرقه لينالوا بذلك عنده منزلة، فيقوم لحاجاتهم، وكل ذلك مفسد للنية وصاحبه مغرور؛ لأنه يطلب بعبادة الله عز وجل عوضا من غيره، وغرور أرباب ____ كثير وإنما نبهنا بما ذكرنا على جنسه", "o": ["الأموال", "والسادة", "المحاكاة", "فتستدل"], "h": "راجع: ص٩٧٣"}, {"t": "fill", "d": 2, "q": "أما العمل: فقد ذكرنا وجه الغرور فيه، وأن من مثالهم مثال المريض إذا تعلم نسخة الدواء واشتغل بتكراره وتعليمه، لا بل مثالهم مثال من به علة البرسام وهو مشرف على الهلاك، ____ بتعلم دواء الاستحاضة", "o": ["فاشتغل", "الهاشمي", "والغرض", "فشغفت"], "h": "راجع: ص٩٥٥"}, {"t": "fill", "d": 2, "q": "وأما الفرقة المحقة فاغترارها من حيث أنها ظنت أن الجدل أهم الأمور وأفضل القربات في دين الله، وزعمت أنه لا يتم لأحد دينه مالم يبحث، وأن من صدق الله ورسوله من غير تحرير دليل فليس بمؤمن أو بكامل الإيمان، فلهذا الظن الفاسد قطعت أعمارها في تعلم الجدل والبحث عن المقالات وهذيانات المبتدعة ومناقضاتهم، وأهملوا أنفسهم وقلوبهم حتى خفيت عنهم خطاياهم، وأحدهم يظن أن اشتغاله بالجدل أقرب له إلى الله تعالى، وهو لمكان التلذذ ____ والرياسة وعز", "o": ["بالغلبة", "الغبن", "كالمرآة", "يأخذون"], "h": "راجع: ص٩٥٧"}, {"t": "fill", "d": 2, "q": "الاستعانة على سلوك طريق الآخرة، واندفع عنه كل غرور منشؤه تجاذب الأغراض والنزوع إلى الدنيا لصحة نيته، ومتى كانت الدنيا أحب إليه من الآخرة وهوى نفسه أثر عنده من رضا الله لم يمكنه الخلاص من الغرور، فإذا غلب حب الله على قلبه لمعرفته به وبنفسه احتاج إلى المعنى الثالث وهو العلم؛ ونعني به العلم بكيفية سلوك الطريق إلى الله وآفاتها والعلم بما يقربه منه وما يبعده عنه، وجميع ذلك في كتابنا هذا فيعرف من ربع العبادات شروطها فيراعيها، وآفاتها فيتقيها، ومن ربع العادات أسرار المعايش وما هو مضطر إليه فيأخذه بأدب الشرع، وما هو مستغن عنه فيعرض عنه، ومن ربع المهلكات علم جميع العقبات المانعة في طريق الله تعالى، فإن المانع عن الله الصفات المذمومة في الخلق، فيعلم المذموم ويعلم طريق علاجه، ويعرف من ربع المنجيات الصفات المحمودة التي لا بد أن توضع خلقا من المذمومة بعد محوها، فإذا أحاط بجميع ذلك ____ الحذر من الأنواع التي أشرنا إليها من الغرور، وأصل ذلك كله أن يغلب حب الله على القلب ويسقط حب الدنيا منه حتى تقوى به الإرادة وتصح به النية ولا يحصل ذلك إلا بالمعرفة التي ذكرناها", "o": ["أمكنه", "أمله", "فصولح", "يعلموا"], "h": "راجع: ص٩٧٥"}, {"t": "fill", "d": 2, "q": "ثم العجب من مغرور يطلب عز الدين بالثياب الرفيعة والخيول الفارهة، وربما طلبه بلبس الحرير، وربما أطلق لسانه في أقرانه حسدا، وزعم أنه إنما تكلم غضبا للحق، وينكشف هذا ____ لو طعن في غيره من أهل العلم أو زوحم غيره في رئاسة فهل كان يغضب لذلك غضبه لنفسه إن كان غضبه للإسلام", "o": ["بأنه", "ويكفيه", "وبقي", "ومطعم"], "h": "راجع: ص٩٥٢"}]}, {"t": "كتاب ذم الغرور - القسم ٥ من ٥", "b": [{"story": ["كتاب ذم الغرور (٢٥ من ٢٩)، ص٩٧٢", ["وفرقة أخرى ينفقون الأموال في الصدقات وعلى الفقراء ويطلبون به المحافل الجامعة ومن الفقراء من عادته الشكر والإفشاء للمعروف، ويكرهون التصدق في السر، ويرون إخفاء الفقير لما أخذ منهم جناية عليهم وكفرانا، وربما يحرصون على إنفاق المال في الحج فيحجون مرة بعد أخرى، وربما تركوا جيرانهم جياعا، وقد قال رجل لبشر الحافي: قد عزمت على الحج. فقال: كم أعددت للنفقة؟ قال: ألفي درهم. قال: فأي شيء تبغي بحجك؟ قال: رضا الله عز وجل. قال: إن أصبت رضا الله في إنفاقها وأنت في منزلك أتفعل؟ قال: نعم. قال: اقض دين مدين، ورم شعث فقير، وأخي عائلة معيل، وفرح يتيما، وإن قوي قلبك أن تعطيها واحدا فافعل، فإن إدخالك السرور على المسلم وإغاثة اللهفان أفضل من مئة حجة. قال: سفري أقوى في قلبي. فقال: إذا جمع المال من الشبهات اقتضت النفس أن تقضي به وطرا، والله لا يقبل إلا عمل المتقين(١).", "وفرقة أخرى من أرباب الأموال يحفظون الأموال ويمسكونها بخلا، ثم يشتغلون بالعبادات البدنية التي لا يحتاج فيها إلى نفقة، كصيام النهار وقيام الليل وختم القرآن، وهم مغرورون؛ لأن البخل المهلك قد استولى على قلوبهم، فهم محتاجون إلى قمعه بإخراج المال، فقد اشتغلوا بطلب فضائل هم مستغنون عنها، ومثالهم مثال من دخل في ثوبه حية فاشتغل بطبخ السكنجبين ليسكن به الصفراء.", "وفرقة أخرى غلبهم البخل، فلا تسمح نفوسهم إلا بأداء الزكاة فقط، ثم إنهم يخرجون من المال الرديء ويطلبون من الفقراء من يخدمهم ويتردد في حاجاتهم،", "حاشية: (١) تحرفت في (ف) إلى: (النفس).", "أو من يحتاجون إليه في المستقبل لخدمة، أو من لهم فيه على الجملة غرض، أو يسلمون ذلك إلى بعض الأكابر ليفرقه لينالوا بذلك عنده منزلة، فيقوم لحاجاتهم، وكل ذلك مفسد للنية وصاحبه مغرور؛ لأنه يطلب بعبادة الله عز وجل عوضا من غيره، وغرور أرباب الأموال كثير وإنما نبهنا بما ذكرنا على جنسه."]], "ic": "book"}, {"story": ["كتاب ذم الغرور (٢٦ من ٢٩)، ص٩٧٣", ["وفرقة أخرى من عوام الخلق وأرباب الأموال والفقراء اغتروا بحضور مجالس الذكر وجعلوه عادة(١) واعتقدوا أن ذلك يكفيهم، ويظنون أن لهم بنفس السماع أجرا دون العمل والاتعاظ، وهؤلاء مغرورون؛ لأن مجلس الذكر إنما فضل لكونه مرغبا في الخير، وكل ما يراد لغيره إذا لم يوصل إلى ذلك الخير فلا وقع له، وربما اغتروا بما يسمعون من الواعظ(٢) من فضيلة حضور المجلس وفضل البكاء، وإنما فضل العمل به، وفضل البكاء لأنه سبب للندم الذي هو توبة، فإذا لم يحصل المقصود بذلك لم ينفع وجوده، وربما سمع أحدهم التخويف فلا يزيد على قوله: يا سلام سلم، أو: أعوذ بالله، ويظن أنه قد أتى بالمقصود، وهذا غرور، وإنما مثاله مثال مريض(٣-٣) يحضر عند الأطباء فيسمع ما يجري، والجائع الذي(٣-٣) يحضر عند من يصف له الأطعمة اللذيذة ثم ينصرف وذلك لا يغني عنه، فكذلك سماع وصف الطاعات دون العمل بها، فكل وعظ لم يغير منك صفة تتغير بها أفعالك فهو حجة عليك، فإذا رأيته وسيلة لك كنت مغرورا.", "فإن قيل: فما ذكرته من مداخل الغرور أمر لا يكاد أحد يتخلص منه، فهذا يوجب اليأس.", "فالجواب: أن من فترت همته عن شيء أظهر اليأس منه، واستعظم الأمر واستوعر الطريق، ومن صح منه الهوى أرشد إلى الحيل واستنبط بدقيق(٤) النظر خفايا الطرق في الوصول إلى الغرض، حتى إن الإنسان إذا أراد أن يستنزل الطير", "حاشية: (١) في (ف): (عبادة).", "حاشية: (٢) في (ف): (الوعظ).", "حاشية: (٣-٣) سقط من الأصل.", "حاشية: (٤) في الأصل: (بطريق).", "المحلق في جو السماء مع بعده منه استنزله، أو يخرج الحوت من قرار البحر، أو يستخرج الذهب من تحت الجبال، أو يقتنص(١) الوحوش من البراري، أو يستسخر الفيلة، أو يأخذ الترياق من أجواف الأفاعي فعل، وقد استخرجوا وهم على الأرض معرفة مقادير الكواكب، كل ذلك لأن أمور الدنيا أهمتهم، فلو أهمهم أمر الآخرة لنالوه؛ لأن مداره على معنى واحد، وهو تقويم القلب، وقد فعل ذلك السلف الصالح ومن تبعهم بإحسان، ولا يعجز إلا من لم تصدق نيته.", "فإن قيل: فبم(٢) ينجو من الغرور؟", "فالجواب: بثلاثة أشياء: بالعقل والعلم والمعرفة.", "أما العقل؛ فنعني به الفطرة الغريزية والنور الأصلي الذي به يدرك الإنسان حقائق الأشياء، فالفطنة والكيس فطرة، والحمق والبلادة فطرة، والبليد لا يقدر على التحفظ من الغرور، وصفاء العقل وذكاء الفهم لا بد منه في أصل الفطرة، وإذا لم يكن في الفطرة لم يمكن اكتسابه، وإنما إذا حصل أمكنت تقويته بالممارسة، فأساس السعادات كلها العقل، وقد سبق بيان فضله في كتاب العلم."]], "ic": "book"}, {"story": ["كتاب ذم الغرور (٢٧ من ٢٩)، ص٩٧٤", ["وأما المعرفة، فنعني بها أن يعرف نفسه وربه ودنياه وآخرته، فأما معرفة(٣) نفسه، فبالعبودية، ومعرفة ربه فبالإلهية، وفي كتاب المحبة وكتاب شرح عجائب القلب وكتاب التفكر وكتاب الشكر إشارات إلى وصف النفس، وإلى وصف جلال الله سبحانه، وأما معرفة الدنيا والآخرة فيستعين عليها بما ذكرناه في كتاب ذم الدنيا وكتاب ذكر الموت، فإذا حصلت له هذه المعارف ثار من قلبه بمعرفة الله حب الله، وبمعرفة الآخرة شدة الرغبة فيها، وبمعرفة الدنيا الرغبة عنها، فيصير أهم أموره إليه ما يوصله إلى الله وينفعه في الآخرة، وإذا غلبت هذه الإرادة على قلبه صحت نيته في الأمور كلها، فإن أكل مثلا أو اشتغل بقضاء حاجة كان قصده من ذلك", "حاشية: (١) في (ف): (يستقبض).", "حاشية: (٢) في (ف): (فمتى).", "حاشية: (٣) ليست في (ف).", "الاستعانة على سلوك طريق الآخرة، واندفع عنه كل غرور منشؤه تجاذب الأغراض والنزوع إلى الدنيا لصحة نيته، ومتى كانت الدنيا أحب إليه من الآخرة وهوى نفسه أثر عنده من رضا الله لم يمكنه الخلاص من الغرور، فإذا غلب حب الله على قلبه لمعرفته به وبنفسه احتاج إلى المعنى الثالث وهو العلم؛ ونعني به العلم بكيفية سلوك الطريق إلى الله وآفاتها والعلم بما يقربه منه وما يبعده عنه، وجميع ذلك في كتابنا هذا فيعرف من ربع العبادات شروطها فيراعيها، وآفاتها فيتقيها، ومن ربع العادات أسرار المعايش وما هو مضطر إليه فيأخذه بأدب الشرع، وما هو مستغن عنه فيعرض عنه، ومن ربع المهلكات علم جميع العقبات المانعة في طريق الله تعالى، فإن المانع عن الله الصفات المذمومة في الخلق، فيعلم المذموم ويعلم طريق علاجه، ويعرف من ربع المنجيات الصفات المحمودة التي لا بد أن توضع خلقا من المذمومة بعد محوها، فإذا أحاط بجميع ذلك أمكنه الحذر من الأنواع التي أشرنا إليها من الغرور، وأصل ذلك كله أن يغلب حب الله على القلب ويسقط حب الدنيا منه حتى تقوى به الإرادة وتصح به النية ولا يحصل ذلك إلا بالمعرفة التي ذكرناها.", "فإن قيل: فإذا فعل جميع ذلك فما الذي تخاف عليه؟", "فالجواب: أخاف عليه أن يخدعه الشيطان إلى أن يدعوه إلى نصح الخلق ونشر العلم ودعاء الناس إلى ما عرفه، فإن المريد المخلص إذا فرغ من تهذيب نفسه وأخلاقه وراقب(١) القلب حتى صفاه من جميع الأكدار، واستوى على الصراط المستقيم وصغرت الدنيا في عينه فتركها، وانقطع طمعه من الخلق فلم يلتفت إليهم، لم يبق له إلا هم واحد وهو الحق سبحانه والتلذذ بذكره ومناجاته والشوق إلى لقائه، وقد عجز الشيطان عن إغوائه من جهة الدنيا وشهواتها فأتاه من جهة الدين ودعاه إلى الشفقة على الخلق والنصح لهم، إذ قد رآهم حياري سكارى مرضى من غير طبيب، وهو يعلم دواءهم، فمثله كمثل رجل كان به داء عظيم لا", "حاشية: (١) في الأصل: (وراقب الله القلب). وهو خطأ ظاهر."]], "ic": "book"}, {"story": ["كتاب ذم الغرور (٢٨ من ٢٩)، ص٩٧٦", ["يطاق ألمه، فيسهر له ليلة ويقلق نهاره، فوجد دواء سهلا بغير ثمن ولا مرارة فاستعمله فبرأ ثم نظر إلى خلق كثير بهم ذلك المرض فرحمهم، فلم يجد مندوحة من مداواتهم، فكذلك هذا المخلص لما اهتدى ورأى الخلق مرضى انبعثت من نفسه رحمة للخلق وحرضه الشيطان على ذلك رجاء أن يجد مجالا للفتنة، فيدعوه إلى طلب الرياسة دعاء أخفى من دبيب النمل لا يشعر به المريد، ثم يدعوه ذلك إلى التصنع والتزين للخلق في حركاته وألفاظه، فيقبل الناس عليه، فيعظمونه ويجلونه ويوقرونه، وصاروا له كالعبيد، فتتحرك حينئذ النفس بما التذت به من ذلك، فيجد الشيطان فرصة فيستعمله في كل ما يحفظ عليه تلك اللذة.", "وأمارة حركة النفس وإيثار الطبع والركون إلى الهوى أنه لو رد عليه خطؤه في محفل غضب، فلو أنكر على نفسه الغضب لخيل إليه الشيطان أن هذا الغضب لله؛ لأن متى لم يحسن اعتقاد المريدين فيك انقطعوا عن الطريق، فوقع في الغرور، وربما أخرجه ذلك إلى الوقوع فيمن رد عليه فيقع في الغيبة المحظورة بعد تركه للحلال المتسع، وفي الكبر بعد تركه للخطرات الردية وأخذ في التصنع، فلو ضحك لجزعت نفسه من اطلاع الناس عليه في تلك الحال لئلا يسقط قبوله، وربما أتبع ذلك باستغفار وتنفس الصعداء(١) وربما زاد في الطاعات لأجلهم، يخيل إليه الشيطان: إنك إنما تفعل ذلك لئلا يفتروا عن الخير، وإنما هو جزع من النفس خوفا من فوت الرياسة، وآية ذلك أنه لو اطلع الناس على مثل ذلك من أقرانه لم يجزع بل ربما أحب ذلك، ولو ظهر من أقرانه من مالت القلوب إلى قبوله وزاد أثر كلامه على كلامه شق ذلك عليه، ولولا أن النفس قد استلذت الرياسة لكان يغتنم ذلك، لأن مثله كمثل رجل يرى جماعة من إخوانه قد وقعوا في بئر وتغطى رأس البئر بحجر كبير يمنعهم من الصعود، فرق لهم فجاء ليرفع الحجر فشق عليه فجاء من أعانه على ذلك، فإنه يعظم بذلك فرحه إذ غرضه خلاص إخوانه من البئر، فكذلك الناصح إذا كان غرضه خلاص إخوانه المسلمين، فإذا ظهر من يعينه على", "حاشية: (١) سقطت من النسخ وأثبتت من الإحياء.", "ذلك أو يكفيه ذلك لم يثقل عليه إن كان غرضه هدايتهم، ومتى تمكن الشيطان منه في هذا الباب دعاه إلى جميع كبائر القلوب وفواحش الجوارح فأهلكه.", "فإن قيل: فمتى يصح له أن يشتغل بنصح الخلق؟", "فالجواب: إذا لم يكن له قصد سوى هدايتهم، وكان يود لو وجد من يعينه، أو لو اهتدوا بأنفسهم وانقطع بالكلية طمعه عن ثنائهم وأموالهم، واستوى عنده حمدهم وذمهم، ولم يتزين لهم كما لا يتزين راعي البهم لها(١) إذ هو مقصوده رعايتها ودفع الذئب عنها دون نظر الماشية إليه، فمتى لم يكن كذلك لم يؤمن عليه أن يصلح ويفسد، فيكون كالشمعة تضيء لغيرها وتحرق نفسها.", "فإن قيل: فلو ترك الوعاظ الوعظ إلا عند نيل هذه المنزلة خلت الدنيا من الوعظ وخربت القلوب؟."]], "ic": "book"}, {"story": ["كتاب ذم الغرور (٢٩ من ٢٩)، ص٩٧٧", ["فالجواب: ولولا حب الدنيا خربت وبطلت المعايش، ومع هذا فهو خطر وله آفات، ما تزال ألسنة الوعاظ منطلقة حبا للرياسة، فانظر لنفسك، فإن الله تعالى قد يصلح خلقا بشخص ليس بصالح، وإنه ليؤيد الدين بالرجل الفاجر.", "فإن قيل: فإن فهم المريد هذه المكيدة فاشتغل بنفسه عن الخلق أو نصحهم وراعى شرط الإخلاص، فهل بقي عليه خوف؟", "فالجواب: إنه قد بقي عليه أعظم الخوف، وهو أن يوسوس له الشيطان فيقول: قد أعجزتني بذكائك، ولولا محلك عند الله ما قواك على قهري وفطنك لجميع مداخل غروري. فإن صدقه في ذلك عجب بنفسه في فراره من الغرور، فيكون إعجابه بنفسه غاية الغرور، وهو المهلك الأكبر، وقد روينا أن إبليس يقول: من ظن أنه يخلص بعلمه مني فجهله وقع في حبالي.", "فإن قيل: فإن سلم من العجب بنفسه إذ علم أن ذلك من الله لا منه، وأنه لم يقدر على دفع الشيطان إلا بتوفيق الله تعالى، فهل بقي عليه خوف؟", "حاشية: (١) البهم: الصغار من الضأن.", "فالجواب: إنا نخاف عليه الأمن من مكر الله، فإنه ربما ظن أنه قد أهل لشيء فسكن إلى تلك العطية، ولم يخف من التغيير بل سبيله أن يكون مشاهدا لجملة ذلك من فضل الله، ثم يكون خائفا أن يكون قد شذت عنه صفة من صفات كماله من حب الدنيا أو رياء الناس أو التفات إلى عز، ثم يخاف أن يسلب حاله في كل طرفة عين، ثم يراقب خطر الخاتمة فإنه لا أمن من ذلك إلا بعد مجاوزة الصراط، ولذلك قيل: والمخلصون على خطر. وقال الإمام أحمد بن حنبل رحمه الله للشيطان حين قال له عند الموت: فتني(١): لا بعد.", "فقد بان بما ذكرناه أن المغرور هالك، وأن المخلص الهارب من الغرور على خطر، ولذلك لا ينبغي أن يفارق الخوف قلوب الأولياء أبدا، وقد أوسعنا الكلام في الغرور وأبوابه في كتابنا المسمى بتلبيس إبليس، فلنقتصر ها هنا على هذا المقدار، ونحن نسأل الله عز وجل السلامة من الغرور وحسن الخاتمة، إنه قريب مجيب.", "**تم كتاب الغرور وبه تم ربع المهلكات.**", "حاشية: (١) فتني: أي نجوت مني ولم أستطع إغواءك."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "أحدهما: أنهم يبنونها من أموال كسبوها من الظلم والرشا والجهات المحظورة، فهم قد تعرضوا لسخط الله في كسبها، وتعرضوا لسخطه في إنفاقها، وكان الواجب عليهم ____ عن كسبها، فإذا عصوا الله تعالى بكسبها كان", "o": ["الامتناع", "لطغيانه", "الفرائض", "فاحتمل"], "h": "راجع: ص٩٧١"}, {"t": "fill", "d": 2, "q": "ففرقة منهم يحرصون على بناء المساجد والمدارس والرباطات والقناطر وما يظهر للناس، ويكتبون أسماءهم بالآجر عليها ليتخلد ذكرهم ويبقى بعد الموت أثرهم، وهم يظنون أنهم قد استحقوا المغفرة بذلك وقد اغتروا فيه من ____", "o": ["وجهين", "وهذا", "يتمدح", "وأحببت"], "h": "راجع: ص٩٧٠"}, {"t": "fill", "d": 2, "q": "فأما قولهم: النقد خير من النسيئة. فهو محل التلبيس، وذلك أنه إذا كان النقد مثل النسيئة، فالنقد خير، وإن كان أقل منه، فالنسيئة خير، ولذلك ____", "o": ["يبذل", "يعتقد", "الجعد", "بذنب"], "h": "راجع: ص٩٤٥"}, {"t": "fill", "d": 2, "q": "أحدها: أنه مال لا مالك له، فإنه قد يعرف من أخذ منه، فإن كان مات فورثته أحياء، ____ الأمر وقوع الاختلاط في الأموال، ومعلوم أن من غصب مئة", "o": ["وغاية", "التلظي", "حزنا", "بعضا"], "h": "راجع: ص٩٥٢"}, {"t": "fill", "d": 2, "q": "وفرقة أخرى ينفقون الأموال في الصدقات وعلى الفقراء ويطلبون به المحافل الجام   const stWord = n => n === 1 ? 'محطة واحدة' : n === 2 ? 'محطتان' : (n >= 3 && n <= 10 ? n + ' محطات' : n + ' محطة');
  const allMainDone = () => MAIN.every(l => S.done[l.id]);
  /* امتحان كل باب: يُفتح حين تُتمّ محطات فصول الباب كلها */
  const babReady = bi => babLv(BABS[bi]).every(l => S.done[l.id]);
  const babLeft = bi => babLv(BABS[bi]).filter(l => !S.done[l.id]);
  const bxDone = bi => !!(S.bxDone && S.bxDone[bi]);
  const allBxDone = () => BABS.every((b, bi) => bxDone(bi));
  const bxSum = () => Object.keys(S.bx || {}).reduce((a, k) => a + (S.bx[k] || 0), 0);
  /* كل المحطات والامتحان النهائي مفتوحة من البداية؛ يدخل الطالب أي محطة بأي ترتيب.
     المحطة المميَّزة في المسار: آخر محطة بدأها ولم يُنهِها، وإلا فأول محطة لم تُجتز، ثم الامتحان. */
  function focusId() {
    const r = S.resume && LEVELS.find(l => l.id === S.resume.id);
    if (r && !S.done[r.id]) return r.id;
    for (let bi = 0; bi < BABS.length; bi++) {
      const n = babLv(BABS[bi]).find(l => !S.done[l.id]);
      if (n) return n.id;
      if (!bxDone(bi)) return 'x' + bi;
    }
    return '';
  }
  const lvMax = lv => lv.paras.reduce((a, p) => a + p.q.reduce((x, q) => x + q.base * 2, 0), 0);
  const lvStars = lv => lv.paras.reduce((a, p) => a + p.q.reduce((x, q) => x + (S.q[q.id] || 0), 0), 0);
  const totalStars = () => Object.keys(S.q).reduce((a, k) => a + (S.q[k] || 0), 0) + Object.keys(S.bx || {}).reduce((a, k) => a + (S.bx[k] || 0), 0);

  /* ================= FIGURES (SVG) ================= */
  const FCOL = ['#3B82F6', '#0F766E', '#22C55E', '#14B8A6', '#0F766E', '#14B8A6'];
  const FSOFT = ['#DBEAFE', '#CCFBF1', '#DCFCE7', '#F0FDFA', '#F0FDFA', '#CCFBF1'];
  const f1 = v => (+v).toFixed(1);
  const neg = v => String(v).replace('-', '−');
  const isAr = s => /[؀-ۿ]/.test(String(s));
  const stext = (x, y, s, cls, extra) => '<text x="' + f1(x) + '" y="' + f1(y) + '" text-anchor="middle"' + (cls ? ' class="' + cls + '"' : '') + (extra || '') + '>' + esc(neg(s)) + '</text>';
  const svgOpen = (w, h, label) => '<svg class="fg" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + esc(label || 'شكل توضيحي') + '">';

  /* التمثيل البياني */
  function figGraph(f) {
    const W = 300, H = 240, L = 44, R = 22, T = 20, B = 46, pw = W - L - R, ph = H - T - B;
    const X = v => L + v / f.xmax * pw, Y = v => T + ph - v / f.ymax * ph;
    let g = svgOpen(W, H, 'تمثيل بياني');
    for (let v = 0; v <= f.xmax + 1e-9; v += f.xs) g += '<line class="gr" x1="' + f1(X(v)) + '" y1="' + T + '" x2="' + f1(X(v)) + '" y2="' + (T + ph) + '"/>' + (v ? stext(X(v), T + ph + 15, v, 'tk') : '');
    for (let v = 0; v <= f.ymax + 1e-9; v += f.ys) g += '<line class="gr" x1="' + L + '" y1="' + f1(Y(v)) + '" x2="' + (L + pw) + '" y2="' + f1(Y(v)) + '"/>' + '<text class="tk" text-anchor="end" x="' + (L - 7) + '" y="' + f1(Y(v) + 4) + '">' + v + '</text>';
    g += '<path class="ax" d="M' + L + ' ' + (T - 10) + 'V' + (T + ph) + 'H' + (L + pw + 12) + '"/><path class="ax" d="M' + (L - 4) + ' ' + (T - 5) + 'l4 -6 4 6M' + (L + pw + 7) + ' ' + (T + ph - 4) + 'l6 4 -6 4"/>';
    g += '<text class="it" x="' + (L + pw + 14) + '" y="' + (T + ph + 16) + '" text-anchor="middle" style="font-size:15px">x</text><text class="it" x="' + (L - 12) + '" y="' + (T - 8) + '" text-anchor="middle" style="font-size:15px">y</text>';
    if (f.seg) g += '<line class="ln" x1="' + f1(X(f.seg[0][0])) + '" y1="' + f1(Y(f.seg[0][1])) + '" x2="' + f1(X(f.seg[1][0])) + '" y2="' + f1(Y(f.seg[1][1])) + '"/>';
    if (f.poly) g += '<polyline class="ln" points="' + f.pts.map(p => f1(X(p[0])) + ',' + f1(Y(p[1]))).join(' ') + '"/>';
    (f.pts || []).forEach(p => { g += '<circle class="pt" cx="' + f1(X(p[0])) + '" cy="' + f1(Y(p[1])) + '" r="5"/>'; });
    if (f.xl) g += stext(L + pw / 2, H - 6, f.xl, 'arx');
    if (f.yl) g += '<text class="arx" text-anchor="middle" transform="translate(11 ' + f1(T + ph / 2) + ') rotate(-90)">' + esc(f.yl) + '</text>';
    return g + '</svg>';
  }

  /* شكل ڤن */
  function vItems(items, cx0, cy0, cols, dx, dy) {
    const n = (items || []).length; if (!n) return '';
    cols = Math.min(cols || (n > 3 ? 2 : 1), n); const rows = Math.ceil(n / cols);
    return items.map((it, i) => {
      const r = Math.floor(i / cols), c = i % cols, inRow = r === rows - 1 ? n - r * cols : cols;
      const x = cx0 + (c - (inRow - 1) / 2) * dx, y = cy0 + (r - (rows - 1) / 2) * dy, s = String(it);
      if (isAr(s)) return stext(x, y + 4, s, 'vel sm');
      return '<circle class="vdot" cx="' + f1(x - 5 - s.length * 4.2) + '" cy="' + f1(y) + '" r="2.4"/>' + stext(x + 3, y + 5, s, 'vel');
    }).join('');
  }
  function figVenn(f) {
    const nm = f.names || ['A', 'B', 'C'], c = FCOL;
    const set = (shape, i) => shape.replace('/>', ' class="vset" fill="' + c[i] + '" stroke="' + c[i] + '"/>');
    const name = (x, y, i) => '<text class="vname" x="' + x + '" y="' + y + '" text-anchor="middle" fill="' + c[i] + '">' + esc(nm[i]) + '</text>';
    let g = '';
    if (f.form === '1') {
      g = svgOpen(320, 170, 'شكل ڤن') + set('<ellipse cx="160" cy="92" rx="118" ry="64"/>', 0) + name(40, 26, 0) + vItems(f.A, 160, 92, Math.min(4, (f.A || []).length), 46, 34);
    } else if (f.form === 'dis') {
      g = svgOpen(320, 190, 'شكل ڤن') + set('<circle cx="84" cy="106" r="68"/>', 0) + set('<circle cx="236" cy="106" r="68"/>', 1) + name(84, 26, 0) + name(236, 26, 1) + vItems(f.A, 84, 106, 2, 46, 34) + vItems(f.B, 236, 106, 2, 46, 34);
    } else if (f.form === 'sub') {
      g = svgOpen(320, 200, 'شكل ڤن') + set('<ellipse cx="160" cy="108" rx="140" ry="82"/>', 0) + set('<circle cx="210" cy="112" r="56"/>', 1) + name(34, 30, 0) + name(210, 50, 1) + vItems(f.A, 86, 108, 2, 44, 34) + vItems(f.B, 210, 118, 2, 42, 32);
    } else if (f.form === '3') {
      const id = 'vc' + (++EID);
      g = svgOpen(320, 250, 'شكل ڤن') + set('<circle cx="118" cy="98" r="72"/>', 0) + set('<circle cx="202" cy="98" r="72"/>', 1) + set('<circle cx="160" cy="166" r="72"/>', 2) +
        name(52, 26, 0) + name(268, 26, 1) + name(252, 232, 2) +
        vItems(f.A, 84, 78, 1, 30, 26) + vItems(f.B, 236, 78, 1, 30, 26) + vItems(f.C, 160, 208, 3, 34, 26) +
        vItems(f.AB, 160, 66, 1, 30, 24) + vItems(f.AC, 110, 146, 1, 30, 24) + vItems(f.BC, 210, 146, 1, 30, 24) + vItems(f.ABC, 160, 122, 1, 30, 24);
      void id;
    } else {
      const id = 'vc' + (++EID);
      g = svgOpen(320, 190, 'شكل ڤن') + '<defs><clipPath id="' + id + '"><circle cx="118" cy="106" r="74"/></clipPath></defs>';
      if (f.shade === 'u') g += '<circle cx="118" cy="106" r="74" fill="#99F6E4"/><circle cx="202" cy="106" r="74" fill="#99F6E4"/>';
      if (f.shade === 'i') g += '<circle cx="202" cy="106" r="74" fill="#5EEAD4" clip-path="url(#' + id + ')"/>';
      g += set('<circle cx="118" cy="106" r="74"/>', 0) + set('<circle cx="202" cy="106" r="74"/>', 1) + name(70, 26, 0) + name(250, 26, 1) +
        vItems(f.A, 78, 106, 1, 40, 30) + vItems(f.AB, 160, 106, 1, 40, 30) + vItems(f.B, 242, 106, 1, 40, 30);
    }

  }

  /* خط الأعداد */
  function figNline(f) {
    const n = f.max - f.min, W = 320, L = 20, R = 20, st = (W - L - R) / n, hops = f.hops || [];
    const rows = f.flat ? Math.min(1, hops.length) : hops.length;
    const top = rows ? 20 + 24 * rows : 14, y0 = top + 8, H = y0 + 34;
    const X = v => L + (v - f.min) * st;
    let g = svgOpen(W, H, 'خط الأعداد');
    g += '<path class="nl" d="M6 ' + y0 + 'H' + (W - 6) + 'M12 ' + (y0 - 5) + 'l-7 5 7 5M' + (W - 12) + ' ' + (y0 - 5) + 'l7 5 -7 5"/>';
    for (let v = f.min; v <= f.max; v++) {
      const on = (f.mark || []).indexOf(v) >= 0;
      g += '<line class="nl" x1="' + f1(X(v)) + '" y1="' + (y0 - 6) + '" x2="' + f1(X(v)) + '" y2="' + (y0 + 6) + '"/>';
      if (on) g += '<circle cx="' + f1(X(v)) + '" cy="' + (y0 + 20) + '" r="11" fill="#FEF08A" stroke="#EAB308" stroke-width="2"/>';
      g += stext(X(v), y0 + 24.5, v, 'tk', n > 12 ? ' style="font-size:10px"' : (on ? ' style="fill:#713F12;font-weight:800"' : ''));
    }
    hops.forEach((h, i) => {
      const y = y0 - 16 - (f.flat ? 0 : (hops.length - 1 - i) * 24), col = FCOL[[1, 0, 2, 3][i % 4]], a = X(h[0]), b = X(h[1]), d = b > a ? -1 : 1;
      g += '<line class="guide" stroke="' + col + '" x1="' + f1(a) + '" y1="' + y + '" x2="' + f1(a) + '" y2="' + (y0 - 7) + '"/><line class="guide" stroke="' + col + '" x1="' + f1(b) + '" y1="' + y + '" x2="' + f1(b) + '" y2="' + (y0 - 7) + '"/>';
      g += '<path class="hop" stroke="' + col + '" d="M' + f1(a) + ' ' + y + 'H' + f1(b) + 'm' + (7 * d) + ' -5l' + (-7 * d) + ' 5 ' + (7 * d) + ' 5"/>';
      if (h[2]) g += stext((a + b) / 2, y - 6, h[2], '', ' fill="' + col + '" style="font-size:12.5px"');
    });
    return g + '</svg>';
  }

  /* نموذج الأجزاء المتساوية (للتقسيم التناسبي) */
  function figTape(f) {
    const tot = f.parts.reduce((a, p) => a + p[0], 0), W = 320, bw = Math.min(54, 296 / tot), x0 = (W - bw * tot) / 2;
    let g = svgOpen(W, 96, 'نموذج الأجزاء'), x = x0;
    f.parts.forEach((p, i) => {
      const xs = x;
      for (let k = 0; k < p[0]; k++) { g += '<rect x="' + f1(x + 1.5) + '" y="10" width="' + f1(bw - 3) + '" height="40" rx="9" fill="' + FSOFT[i % 6] + '" stroke="' + FCOL[i % 6] + '" stroke-width="2.5"/>' + (f.each ? stext(x + bw / 2, 35, f.each, '', ' style="font-size:' + (String(f.each).length > 5 ? 9.5 : 12.5) + 'px"') : ''); x += bw; }
      g += '<path d="M' + f1(xs + 4) + ' 58v5H' + f1(x - 4) + 'v-5" fill="none" stroke="' + FCOL[i % 6] + '" stroke-width="2" stroke-linecap="round"/>' + stext((xs + x) / 2, 82, p[1], 'arx', ' fill="' + FCOL[i % 6] + '"');
    });
    return g + '</svg>';
  }

  /* المقياس الخطي للخريطة */
  function figSbar(f) {
    const n = f.vals.length - 1, W = 320, L = 34, st = 232 / n;
    let g = svgOpen(W, 62, 'مقياس رسم خطي');
    for (let i = 0; i < n; i++) g += '<rect x="' + f1(L + i * st) + '" y="34" width="' + f1(st) + '" height="9" fill="' + (i % 2 ? '#fff' : '#1E1B3A') + '" stroke="#1E1B3A" stroke-width="1.6"/>';
    f.vals.forEach((v, i) => { g += stext(L + i * st, 26, v, 'tk', ' style="font-size:12.5px"'); });
    g += stext(L + n * st + 26, 26, f.unit, 'arx');
    return g + stext(L + st / 2, 58, '1 سم', 'arx', ' style="font-size:11px"') + '</svg>';
  }

  /* بطاقات العد +1 و −1 */
  function figChips(f) {
    const cols = Math.max(f.pos, f.neg), W = 320, cw = Math.min(40, 300 / cols), x0 = (W - cw * cols) / 2, pairs = Math.min(f.pos, f.neg);

    for (let i = 0; i < cols; i++) {
      const x = x0 + i * cw;
      if (i < pairs) g += '<rect x="' + f1(x + .5) + '" y="5" width="' + f1(cw - 1) + '" height="80" rx="12" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="4 4"/>' + stext(x + cw / 2, 104, '0', 'tk');

  }

  /* مستطيل بأبعاده (نموذج/مخطط) */
  function figRect(f) {
    const k = f.ratio || 1.3, h = 92, w = Math.min(230, h * k), x = (320 - w) / 2 + 12, y = 16;

  /* الضرب التبادلي: طرفان × وسطان */
  function figCross(f) {

  function figTbl(f) {

  /* عُقد الطريق المتعرج بأسلوبه الأصلي نفسه؛ تُستخدم لقائمة المسارات ولمحطات كل مسار */
  function roadRows(nodes) {
    const W = appEl.clientWidth || 360;
    const amp = Math.max(28, Math.min(80, (W - 32) / 2 - 92));
    return nodes.map((nd, i) => {
      const x = Math.round(Math.sin(i * 0.95) * amp), id = nd.id, state = nd.state;
      return '<div class="pnode ' + state + (nd.extra || '') + '" data-x="' + x + '" data-col="' + th(id)[0] + '" style="' + tv(id) + ';--x:' + x + 'px;--i:' + i + '">' +
        (nd.bubble ? '<span class="bubble">' + nd.bubble + '</span>' : '') +
        '<button class="med khatam" ' + nd.attrs + ' aria-label="' + esc(nd.label) + '">' +
        (state === 'current' ? '<span class="rip"></span><span class="rip r2"></span>' : '') + nd.num +
        (state === 'done' ? '<span class="donecheck">' + IC.check + '</span>' : '') + (state === 'locked' ? '<span class="lock">' + IC.lock + '</span>' : '') + '</button>' +
        '<div class="plabel">' + (nd.label.indexOf(nd.group) === 0 ? '' : '<span class="pg">' + esc(nd.group) + '</span>') + '<span class="pt">' + esc(nd.label) + '</span>' + (nd.pill || '') + '</div></div>';

  }
  const starPill = (got, mx) => '<span class="ppill' + (got >= mx ? ' full' : '') + '">' + IC.star + got + ' / ' + mx + '</span>';
  function roadWatch(el, after) {
    requestAnimationFrame(() => requestAnimationFrame(after));
    const pathEl = el.querySelector('.path');
    if (window.ResizeObserver && pathEl) { let lastH = 0; const ro = new ResizeObserver(() => { if (!el.isConnected) { ro.disconnect(); return; } if (pathEl.offsetHeight !== lastH) { lastH = pathEl.offsetHeight; drawPath(el, false); } }); ro.observe(pathEl); }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (el.isConnected) drawPath(el, false); });
  }

      drawPath(el, false);
      const cur = el.querySelector('.pnode.current'), body = el.querySelector('.body'), pathEl = el.querySelector('.path');
      if (cur && body && pathEl) { const bot = pathEl.offsetTop - body.offsetTop + cur.offsetTop + cur.offsetHeight; if (bot > body.clientHeight - 12) body.scrollTop = bot - body.clientHeight + 24; }
    });
  }
  function drawPath(el, scroll) {
    const path = el.querySelector('.path'); if (!path) return;
    const svg = path.querySelector('.pline');
    const pts = Array.from(path.querySelectorAll('.pnode')).map(nd => {
      const m = nd.querySelector('.med'); const cxp = nd.offsetLeft + nd.offsetWidth / 2 + (+nd.dataset.x || 0);
      return { x: cxp, top: nd.offsetTop + m.offsetTop + 6, bot: nd.offsetTop + nd.offsetHeight + 4, done: nd.classList.contains('done'), col: nd.dataset.col };
    });
    svg.setAttribute('viewBox', '0 0 ' + path.offsetWidth + ' ' + path.offsetHeight);
    let segs = '';
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i], y1 = a.bot, y2 = b.top, my = (y1 + y2) / 2;
      segs += '<path class="' + (a.done && b.done ? 'done' : '') + '"' + (a.done ? ' style="stroke:' + b.col + '"' : '') + ' d="M' + a.x.toFixed(1) + ' ' + y1.toFixed(1) + ' C' + a.x.toFixed(1) + ' ' + my.toFixed(1) + ' ' + b.x.toFixed(1) + ' ' + my.toFixed(1) + ' ' + b.x.toFixed(1) + ' ' + y2.toFixed(1) + '"/>';
    }
    svg.innerHTML = segs;

  }
  function readName() { const inp = appEl.querySelector('#set-name'); if (inp) { S.name = cleanName(inp.value); save(); } }

  let CERTB = -1;
  function showCert(bi, dir) {
    setTheme('def');
    const B = bi >= 0 ? BABS[bi] : null; CERTB = B ? bi : -1;
    const date = new Date().toLocaleDateString('ar-EG-u-nu-latn', { year: 'numeric', month: 'long', day: 'numeric' });
    const r = rankOf(totalStars());
