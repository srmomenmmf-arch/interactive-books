قلب المشحون بالهوى والشهوة، والحسد والحقد، والكبر والعجب، وكلها كلاب نابحة؟ لا بل القلب المشحون بهذه الأشياء قلب في الصورة، وكلب في المعنى.", "فإن قيل: إنما أزيل رذائل الأخلاق بالعلم، فكيف أرفعها قبل العلم؟", "فالجواب: إن الرفع لهذه الرذائل هو العلم بأمر الله، فإذا ارتفعت حصل العلم بالله، فوجب معرفته.", "الوظيفة الثانية: تقليل العلائق الشاغلة، ومتى توزعت الفكرة قصرت عن إدراك الحقائق، فتكون كجدول تفرق ماؤه، فانشفت الأرض بعضه، واختطف الهواء", "حاشية: (١) في (ظ): «عشر جمل».", "حاشية: (٢) حديث صحيح: أخرجه البخاري (٣٢٢٥)، ومسلم (٢١٠٦)، وغيرهما من حديث أبي طلحة، وتمامه: «ولا صورة»، وفي الباب عن علي وأبي أيوب وأبي أمامة وأبي رافع وابن عمر وابن عباس وابن عمرو وأسامة وبريدة وعائشة وميمونة رضي الله عنهم.", "بعضه، فلا يبقى منه ما يبلغ المزدرع(١)، فإن بقي لم يف بالسقي.", "وقد كان السلف يؤثرون العلم على كل شيء، فروي عن الإمام أحمد ابن حنبل رحمه الله، أنه لم يتزوج إلا بعد الأربعين(٢).", "وأهديت إلى أبي بكر ابن الأنباري(٣) جارية، فلما دخلت عليه تفكر في استخراج مسألة، فعزبت(٤) عن خاطره، فقال: أخرجوها إلى النخاس(٥). فقالت: هل لي من ذنب؟ قال: لا، إلا أن قلبي اشتغل بك، وما قدر مثلك أن يمنعني من علمي(٦).", "وقد أنشدوا:", "ما للمعيل وللمعالي إنما  يسعى إليهن الفريد الواحد", "كالشمس تجتاب السماء وحيدة  وأبو بنات النعش(٧) فيها قاعد", "الوظيفة الثالثة: أن يلقي زمامه إلى المعلم، إلقاء المريض زمام أمره إلى الطبيب، فيتواضع له، ويبالغ في خدمته، وقد كان ابن عباس رضي الله عنهما يأخذ بركاب زيد بن ثابت رضي الله عنه، ويقول: هكذا أمرنا أن نفعل بالعلماء(٨).", "حاشية: (١) المزدرع: هو موضع الزرع، والشيء المزروع «القاموس واللسان»: (زرع).", "حاشية: (٢) «مناقب الإمام أحمد» للمصنف: ٤٠٢.", "حاشية: (٣) هو محمد بن القاسم بن بشار ابن الأنباري، أبو بكر المقرئ النحوي اللغوي، توفي سنة ٣٢٨هـ، صنف «الوقف والابتدا» و«المشكل». ينظر «سير أعلام النبلاء» ١٥/٢٧٤.", "حاشية: (٤) عزبت: غابت وذهبت. «اللسان»: (عزب)."]], "ic": "book"}, {"story": ["الباب الخامس في آداب المتعلم والمعلم (٢ من ٨)، ص٥٦", ["حاشية: (٥) النخاس: بائع الجواري والعبيد. «اللسان»: (نخس).", "حاشية: (٦) «تاريخ بغداد» ٣/١٨٤ ـ ١٨٥.", "حاشية: (٧) بنات نعش: مجموعتا كواكب، كبرى وصغرى، كل منها سبعة كواكب، أربعة منها نعش، وثلاث بنات، والواحد: ابن نعش. قيل: شبهت بحملة النعش في تربيعها. «اللسان»: (نعش).", "حاشية: (٨) أخرجه ابن سعد في الطبقات ٢/٣٦٠، والفسوي في المعرفة والتاريخ ١/٤٨٤، والطبري في الكبير ٥/٤٧٤٦، والحاكم في المستدرك ٣/٤٢٣ و٤٢٨، والخطيب في الجامع لأخلاق الراوي (٣١٠)، وابن عبد البر في جامع بيان العلم ١/١٢٨، وصححه ابن حجر في الإصابة ٢/٥٩٤، والهيثمي في المجمع ٩/٣٤٥.", "ومتى تكبر المتعلم أن يستفيد من غير مرموق بالتقدم، فهو جاهل؛ لأن «الحكمة ضالة المؤمن، أينما وجدها أخذها»(١).", "ثم يحضر(٢) قلبه، ويجمع همه وفهمه، لتستوي أجزاء القلب في تناول العلم استواء الأرض الدمثة في نيل المطر، وليدع رأيه لرأي معلمه، فإن خطأ المعلم أنفع للمتعلم من صواب نفسه.", "وقد نبه الله تعالى المتعلمين بقصة موسى والخضر بقوله: ﴿قَالَ فَإِنِ ٱتَّبَعْتَنِى فَلَا تَسْـَٔلْنِى عَن شَىْءٍ حَتَّىٰٓ أُحْدِثَ لَكَ مِنْهُ ذِكْرًا﴾ [الكهف: ٧٠].", "فإن قلت: كيف يمنع عن السؤال وبالسؤال ينال العلم؟", "فالجواب: أنه يستأذن في السؤال، ثم يسأل، وقد قال أمير المؤمنين علي رضي الله عنه: إن من حق العالم عليك أن تسلم على القوم عامة وتخصه بالتحية، وأن تجلس أمامه، ولا تشيرن عنده بيدك، ولا تغمزن بعينك، ولا تكثر عليه السؤال، ولا تعنته(٣) في الجواب، ولا تلج عليه إذا كسل، ولا تراجعه إذا امتنع، ولا تأخذ بثوبه إذا نهض، ولا تفش له سرا، ولا تغتابن عنده أحدا، ولا تطلبن عثرته، وإن زل قبلت معذرته، ولا تقولن له: سمعت فلانا يقول كذا، ولا أن فلانا يقول خلافك، ولا تصفن عنده عالما، ولا تعرض(٤) من طول صحبته، ولا ترفع نفسك عن خدمته، فإذا عرضت له حاجة سبقت القوم إليها، كأنما هو بمنزلة النخلة تنتظر متى يسقط عليك(٥) منها شيء(٦).", "حاشية: (١) أخرجه الترمذي (٢٦٨٧)، وابن ماجه (٤١٦٩)، والقضاعي في مسند الشهاب (٥٢) من حديث أبي هريرة، وإسناده ضعيف جدا، وأخرجه القضاعي أيضا (١٤٦) عن زيد بن أسلم مرسلا.", "حاشية: (٢) في الأصل: «يخطر».", "حاشية: (٣) أي: ولا تشدد عليه فيه وتلزمه بما يصعب عليه.", "حاشية: (٤) أي: لا تضجر.", "حاشية: (٥) في (ظ): «عليه».", "حاشية: (٦) أخرجه الخطيب في «الجامع لأخلاق الراوي» (٣٥٠)، و«الفقيه والمتفقه» ٢/٩٩، وابن عبد البر في «جامع بيان العلم» ١/١٢٩."]], "ic": "book"}, {"story": ["الباب الخامس في آداب المتعلم والمعلم (٣ من ٨)، ص٥٨", ["الوظيفة الرابعة: أن يحترز الخائض في العلم في مبدأ الأمر عن الإصغاء إلى اختلاف الناس، سواء كان ما خاض فيه من علوم الدنيا أو علوم الآخرة، فإن ذلك يحير عقله، ويفتر ذهنه، ويؤيسه من الإدراك المقصود، بل ينبغي أن يستأنس بطريقة شيخه، ثم يصغي بعد ذلك إلى المذاهب والشبه(١)، فإن لم يكن شيخه مشتغلا(٢) برأي واحد، وإنما عادته نقل المذاهب وما قيل فيها، فليحترز منه، فإن إضلال هذا أكثر من إرشاده.", "الوظيفة الخامسة: أن لا يدع فنا من العلوم المحمودة إلا وينظر فيه نظرا يطلع به على مقصده وغايته، ثم إن ساعده العمر طلب التبحر فيه، وإلا اشتغل بالأهم منه، فإن العلوم على درجاتها، إما سالكة بالعبد إلى الله سبحانه، أو معينة على السلوك نوعا من الإعانة.", "الوظيفة السادسة: أن يأخذ من كل شيء أحسنه؛ لأن العمر لا يتسع لجميع العلوم، ثم يصرف جمام(٣) قوته إلى أشرف العلوم، وهو العلم المتعلق بالآخرة، الذي به يكتسب اليقين الذي حصله أبو بكر رضي الله عنه، حتى شهد له الرسول صلى الله عليه وسلم، فقال: «ولكن بشيء وقر في صدره»(٤).", "الوظيفة السابعة: أن يعرف السبب الذي به يدرك شرف العلوم، وأشرف العلوم(٥) العلم بالله وملائكته وكتبه ورسله، والعلم بالطريق الموصل إلى هذه العلوم.", "حاشية: (١) في (ظ): «والسنة».", "حاشية: (٢) في الأصل: «مستقلا».", "حاشية: (٣) جمام قوته، أي: كل قوته وتمامها.", "حاشية: (٤) قال العراقي في «تخريج أحاديث الإحياء» (٨٥): لا أصل لهذا مرفوعا، وإنما يعرف من قول بكر بن عبد الله المزني: وذكره ملا علي القاري في «الأسرار المرفوعة» ص ٤٥٤، وابن القيم في «المنار المنيف» (٢٤٦) وقال: ومما وضعه جهلة المنتسبين إلى السنة في فضل الصديق. . . فساق أحاديث منها: «ما سبقكم أبو بكر بكثرة صوم ولا صلاة، وإنما سبقكم بشيء وقر في صدره». وهذا من كلام أبي بكر بن عياش.", "وذكره الحكيم الترمذي في «نوادر الأصول»: ٢٦١ و٣٤٥، من كلام بكر بن عبد الله المزني.", "حاشية: (٥) في الأصل: «العلم».", "الوظيفة الثامنة: أن يكون قصد المتعلم في الحال تحلية باطنه وتجميله بالفضيلة، وفي المآل القرب من الله سبحانه، والترقي إلى مجاورة المقربين، ولا يقصد به الرياسة والمال، ومباهاة الأقران، ومتى صح قصده هذا لم يطلب إلا علم الآخرة، فعلم الآخرة بالنسبة إلى غيره من العلوم، كقصد المجاهد وجه الله سبحانه، فهذا له المغنم(١) في الدنيا، والأجر في الآخرة، ولا شك في آن للردء(٢) في الجهاد ثوابا، ولساقي الغزاة الماء أجرا، ولحافظ الدواب، إلا أن الأعلى هو الصادق في جهاده."]], "ic": "book"}, {"story": ["الباب الخامس في آداب المتعلم والمعلم (٤ من ٨)، ص٥٩", ["الوظيفة التاسعة: أن يعلم نسبة العلوم إلى المقصد، ليؤثر الرفيع القريب على البعيد، والمهم على غيره، فإن علم الفقه كإعداد الزاد والراحلة، وتطهير الباطن عن الكدر كسلوك البوادي وقطع العقاب(٣)، والعلم بالله وصفاته وأفعاله يجري مجرى نفس الحج وأركانه، ولكل قوم مرتبة، فليس من أخبر فصدق كمن شاهد وتحقق.", "واعلم أن الساعي إلى الله عز وجل لينال قربه هو القلب دون البدن، ولسنا نعني بالقلب اللحم المحس، بل هو سر من أسرار الله تعالى، لا يدركه الحس، ولطيفة من لطائفه، تارة يعبر عنها بالروح، وتارة بالنفس المطمئنة.", "وقد عبر الشرع عنه بالقلب؛ لأنه المطية الأولى، فذلك السر، وبواسطته صار جميع البدن مطية وآلة لتلك اللطيفة، فهو كالناقة للبدن في طريق الحج.", "فالمتجرد لعلم الفقه إذا لم يجاهد نفسه ولم يصلح قلبه، كالمتجرد لشراء الناقة وعلفها، وشراء المزادة وخرزها(٤)، ولم يسلك بادية الحج.", "حاشية: (١) في الأصل: «النعيم».", "حاشية: (٢) الردء: المعين والناصر، والقوي الذي يعتمد عليه، وفلان ردء لفلان، أي: ينصره ويشد ظهره. «القاموس واللسان»: (ردء).", "حاشية: (٣) العقاب: جمع عقبة، وهي: طريق في الجبل وعر، أو هي: جبل طويل، يعرض للطريق، وهو صعب شديد «لسان العرب»: (عقب).", "حاشية: (٤) الخرز: خياطة الجلد بعضه على بعض (لسان العرب): (خرز).", "والمستغرق عمره في مجادلات الفقه، كالمحكم للخيوط التي بها تخرز المزادة، ونسبة هذين إلى السالك لطريق إصلاح القلب كنسبتهم إلى سالكي طريق الحج ومباشري أركانه.", "**بيان وظائف المرشد المعلم**", "اعلم أن للإنسان في علمه أربعة أحوال، كما له في اقتناء الأموال.", "إذ لصاحب المال حالة استفادة، فيكون مكتسبا، وحالة ادخار لما اكتسبه، فيكون به غنيا عن السؤال، وحالة إنفاق على نفسه فيكون به منتفعا، وحالة بذل لغيره، فيكون به سخيا متفضلا، وهو أشرف أحواله، فكذلك العلم يقتنى كالمال(١)، فله حالة طلب واكتساب، وحالة تحصيل تغني عن السؤال، وحالة استبصار، وهو التفكر في المحصل والتمتع به، وحالة تبصير وهو أشرف الأحوال.", "فمن علم وعمل وعلم فهو الذي يدعى عظيما في ملكوت السماء؛ لأنه يكون كالشمس(٢-٢) المضيئة في نفسها(٢-٢) المضيئة لغيرها، وكالمسك الطيب في نفسه المطيب لغيره.", "فأما الذي يعلم ولا يعمل فكالكتاب، يفيد غيره وهو خال من العلم، والمسن الذي يشحذ غيره ولا يقطع، والإبرة تكسو غيرها وهي عارية، وذبالة(٣) المصباح تضيء لغيرها وهي تحترق.", "وإذا أقبل العالم على التعليم فقد تقلد أمرا عظيما، فليحفظ آدابه ووظائفه، وأمهاتها ثمانية:", "الوظيفة الأولى: الشفقة على المتعلمين، وأن يجريهم مجرى بنيه، فإن النبي صلى الله عليه وسلم", "حاشية: (١) في (ظ): «بالمال».", "حاشية: (٢-٢) سقط من الأصل.", "حاشية: (٣) الذبالة هي: الفتيلة، وجمعها: ذبال. «اللسان»: (ذبل)."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "وقد عبر الشرع عنه بالقلب؛ لأنه المطية الأولى، فذلك السر، وبواسطته صار جميع البدن مطية وآلة لتلك اللطيفة، فهو كالناقة للبدن في طريق ____", "o": ["الحج", "لهدي", "مشكل", "سخرت"], "h": "راجع: ص٥٩"}, {"t": "fill", "d": 2, "q": "ولا ضيق في سعادات الآخرة، فلذلك لا يكون بين أبناء الآخرة ____", "o": ["تنازع", "إياه", "الإعراض", "تبتدئ"], "h": "راجع: ص٦١"}, {"t": "fill", "d": 2, "q": "مثال هذا: أنك إذا رأيت العامي يعتقد المنقولات في الصفات، ويقول: لا أشبه ولا أتأول، فلا يغير عليه حاله، فإنه لو ذكر له تأويل ____ الظواهر انحل عنه قيد العوام، ولم يتيسر تقييده بقيد الخواص،", "o": ["لبعض", "ونصابه", "بعبد", "ومداد"], "h": "راجع: ص٦٤"}, {"t": "fill", "d": 2, "q": "ويروى عن علي رضي الله عنه أنه قال: قصم ظهري رجلان: عالم متهتك، وجاهل متنسك، فالجاهل يغر الناس ____، والعالم ينفرهم", "o": ["بتنسكه", "نافع", "فرأيته", "المفسر"], "h": "راجع: ص٦٥"}, {"t": "fill", "d": 2, "q": "الوظيفة الثالثة: أن يلقي زمامه إلى المعلم، إلقاء المريض زمام أمره إلى الطبيب، فيتواضع له، ويبالغ في خدمته، وقد كان ابن عباس رضي الله عنهما يأخذ بركاب زيد بن ثابت رضي الله عنه، ويقول: ____ أمرنا أن", "o": ["هكذا", "اليسرى", "بدمشق", "لنومه"], "h": "راجع: ص٥٦"}, {"t": "fill", "d": 2, "q": "وجاء رجل إلى الإمام أحمد رحمه الله بدواء ____ كان به، فأخذه ثم رده عليه، فقيل له", "o": ["لجرب", "والشكل", "اتفاقا", "عقدت"], "h": "راجع: ص٦٢"}]}, {"t": "الباب الخامس في آداب المتعلم والمعلم - القسم ٢ من ٢", "b": [{"story": ["الباب الخامس في آداب المتعلم والمعلم (٥ من ٨)، ص٦١", ["قال: «إنما أنا لكم كالوالد»(١). فإن قصده إنقاذهم من نار الآخرة، وهو أهم من(٢-٢) إنقاذ الأبوين ولدهما من نار الدنيا(٢-٢)، ولذلك صار حق المعلم أعظم من حق الوالدين، فإن الوالد سبب الوجود الحاضر، والحياة الفانية، والمعلم هو المفيد للحياة الأخروية الدائمة، وكما أن حق أبناء الرجل الواحد أن يتحابوا ويتعاونوا، فحق تلامذة الرجل الواحد التحاب.", "ولا يصح ذلك إلا أن يكون مقصودهم الآخرة، فأما إن كان مقصودهم الدنيا، فإنه يوقع بينهم التحاسد والتباغض.", "واعلم أن أبناء الآخرة مسافرون إلى الله سبحانه وتعالى، وسالكون إليه الطريق، والسنون والشهور منازل الطريق، والترافق في الطريق للمسافرين، إلى الأمصار سبب التواد والتحاب، فكيف السفر إلى الفردوس الأعلى، والترافق في طريقه؟!", "ولا ضيق في سعادات الآخرة، فلذلك لا يكون بين أبناء الآخرة تنازع. ولا سعة في سعادات الدنيا، فلذلك لا ينفك عن ضيق التزاحم.", "والعادلون إلى طلب الرئاسة بالعلوم خارجون عن موجب قوله تعالى: ﴿إِنَّمَا ٱلْمُؤْمِنُونَ إِخْوَةٌ﴾ [الحجرات: ١٠] داخلون في مقتضى قوله تعالى: ﴿ٱلْأَخِلَّآءُ يَوْمَئِذٍۭ بَعْضُهُمْ لِبَعْضٍ عَدُوٌّ﴾ [الزخرف: ٦٧].", "الوظيفة الثانية: أن يقتدي بصاحب الشرع صلى الله عليه وسلم، فلا يطلب على إفاضة العلم أجرا، ولا يقصد به جزاء ولا شكرا، بل يعلم لوجه الله سبحانه، والتقرب إليه، ولا يرى لنفسه منة على المتعلمين، بل يرى الفضل لهم، إذ هيأوا قلوبهم للتقرب على المتعلمين، بل يرى الفضل لهم، إذ هيأوا قلوبهم للتقرب إلى الله سبحانه", "حاشية: (١) أخرجه الشافعي في «المسند» (٦٤): بترتيب السندي، وأحمد (٧٣٦٨) و(٧٤٠٩)، وأبو داود (٨)، والنسائي ١/٣٨، وابن ماجه (٣١٣)، وابن خزيمة (٨٠)، وابن حبان (١٤٣١)، من حديث أبي هريرة رضي الله عنه.", "حاشية: (٢-٢) سقط من الأصل.", "بزراعة العلم فيها، فهم كالذي يعير الأرض لمن يزرع فيها، فإن انتفاع صاحب الزرع أكثر من انتفاع صاحب الأرض، فكذلك ثواب المعلم أكثر من ثواب المتعلم، ولولا المتعلم ما نال المعلم أجر التعليم.", "ولا ينبغي أن يطلب المعلم الأجر إلا من الله سبحانه، وقد كان معلمو السلف يمتنعون عن قبول هدية المتعلم.", "قال جرير بن عبد الحميد: مر بنا حمزة الزيات، فاستسقى ماء، فلما أردت أن أناوله قال: أنت هو؟ قلت: نعم. قال: أليس تحضرنا في القراءة؟ قلت: نعم. قال: رده. وأبى أن يشرب(١).", "وقال مت(٢) البلخي: أهديت لسفيان الثوري رحمه الله ثوبا، فرده علي، فقلت: يا أبا عبد الله، لست أنا ممن يسمع الحديث حتى ترد علي. فقال: قد علمت، ولكن أخوك يسمع مني الحديث، فأخاف أن يلين قلبي لأخيك أكثر مما يلين لغيره."]], "ic": "book"}, {"story": ["الباب الخامس في آداب المتعلم والمعلم (٦ من ٨)، ص٦٢", ["وقال الحسن بن الربيع: كنت عند عبد الله بن إدريس، فلما قمت قال: سل عن سعر الأشنان(٣). فلما مشيت ردني وقال: لا تسأل عنه، فإنك تكتب مني الحديث، وأنا أكره أن أسأل من يسمع مني الحديث حاجة.", "وجاء رجل إلى الإمام أحمد رحمه الله بدواء لجرب كان به، فأخذه ثم رده عليه، فقيل له: لم رددته؟ فقال: أنتم تسمعون مني(٤).", "الوظيفة الثالثة: أن لا يدخر من نصح المتعلم شيئا، مثل أن يمنعه من التشاغل", "حاشية: (١) «معرفة القراء الكبار» ١/١١٦.", "حاشية: (٢) هو عبد الله بن محمد بن سورة البلخي، ولقبه: مت، وهو اسم أعجمي، «نزهة الألباب» (٢٤٨٨)، ولم أجد من ترجمه، وجاء في هامش (ظ): «البلخي مت بالتاء المعجمة بنقطتين، كذا هو بخط الشيخ المصنف» اهـ. قلت: يدل هذا على أن نسخة (ظ) نسخت عن نسخة الإمام ابن الجوزي المصنف رحمه الله تعالى.", "حاشية: (٣) الأشنان: دواء تغسل به الأيدي والثياب، نافع للجرب والحكة وله منافع أخرى. «اللسان» (أشن).", "حاشية: (٤) «مناقب الإمام أحمد» للمصنف: ٣٥٥.", "بعلم خفي قبل الفراغ من الجلي، ويمنعه من التصدي لرتبة قبل استحقاقها، وينبهه على أن المطلوب من العلوم القرب من الله تعالى دون الرياسة والمباهاة، ويقدم تقبيح ذلك في نفسه، وذلك يبين له بما يطلبه المتعلم من العلم، مثل علوم الجدل والكلام، فإن رآه يتعلم التفسير والحديث والمواعظ وعلم أن قصده بذلك الدنيا لم يمنعه من التعلم، ولكنه يدرج له النصيحة وينبهه عليها؛ لأن فيما يتعلمه صادا عن ذلك القصد الفاسد.", "وقد روي سفيان الثوري يوما حزينا، فقيل له: ما لك؟ فقال: صرنا متجرا لأبناء الدنيا، يلزمنا أحدهم، فإذا تعلم جعل عاملا(١) أو قاضيا.", "الوظيفة الرابعة: وهي من دقائق التعليم، أن يزجر المتعلم عن سوء الأخلاق، بطريق التعريض مهما أمكن، لا على وجه التوبيخ، فإن التصريح يهتك حجاب الهيبة، ويورث الجرأة على الهجوم بالخلاف، والتعريض يحرك الذهن إلى استنباط معاني ذلك.", "الوظيفة الخامسة: أن المتكفل ببعض العلوم، لا ينبغي أن يقبح في نفس المتعلم العلوم التي وراء علمه، كمعلم اللغة، كمعلم الفقه، فإنه لا يجوز أن يقبح علم الفقه، ومعلم الفقه لا يجوز أن يقبح التشاغل بالحديث، بل ينبغي أن يوسع على المتعلم طريق التعلم(٢) من غيره(٣) ما لا يعرفه، وإن كان هو كافلا بكثير من العلوم، درج المتعلم من رتبة إلى رتبة.", "الوظيفة السادسة: أن ينظر في فهم المتعلم ومقدار عقله، فلا يلقي إليه ما لا يدركه فهمه، ولا يحيط به عقله، فقد روي عن النبي صلى الله عليه وسلم أنه قال: «أمرنا أن نكلم الناس على قدر عقولهم»(٤).", "حاشية: (١) أي: واليا.", "حاشية: (٢) في (ظ): «التعليم».", "حاشية: (٣) في (ظ): «غير».", "حاشية: (٤) حديث ضعيف، وانظر «كشف الخفاء» (٥٩٢)، و«تخريج أحاديث الإحياء»: (٣٣٠٢). وقد"]], "ic": "book"}, {"story": ["الباب الخامس في آداب المتعلم والمعلم (٧ من ٨)، ص٦٤", ["وقال علي رضي الله عنه: إن ها هنا علما جما ـ وأشار إلى صدره ـ لو أصبت له حملة(١).", "وهذا صحيح، فإنه لا يجوز لعالم، في جوهره فهم شيء، أن يلقيه إلى من يعجز عن حمله. وقد نبه على هذا قوله تعالى: ﴿وَلَا تُؤْتُوا۟ ٱلسُّفَهَآءَ أَمْوَٰلَكُمُ ٱلَّتِى جَعَلَ ٱللَّهُ لَكُمْ قِيَٰمًا﴾ [النساء: ٥].", "وقال الشافعي رحمه الله تعالى:", "أأنثر دررا بين سارحة النعم  أأنظم منثورا لراعية الغنم", "ومن منح الجهال علما أضاعه  ومن منع المستوجبين فقد ظلم(٢)", "الوظيفة السابعة: أن المتعلم القاصر ينبغي أن يلقى إليه الجلي اللائق به، ولا يذكر له أن وراء هذا تدقيقا، وأنه مستور عنك؛ لأن هذا يفتر رغبته في الجلي، ويخيل إليه البخل بذلك عنه؛ لأنه يظن من نفسه أنه يدرك الخفي.", "مثال هذا: أنك(٣) إذا رأيت العامي يعتقد المنقولات في الصفات، ويقول: لا أشبه ولا أتأول، فلا يغير عليه حاله، فإنه لو ذكر له تأويل لبعض الظواهر انحل عنه قيد العوام، ولم يتيسر تقييده بقيد الخواص، فيتأذى.", "ولا ينبغي أن يخاض بالعوام في حقائق العلوم الدقيقة، بل تملأ قلوبهم من الرغبة والرهبة بذكر الجنة والنار، ولا يحرك عليهم شبهة؛ لأنه ربما تعلقت الشبهة بقلوبهم وعسر حلها فهلكوا.", "حاشية (تتمة): صح عن علي رضي الله عنه من كلامه: حدثوا الناس بما يعرفون، أتحبون أن يكذب الله ورسوله. أخرجه البخاري (١٢٧)، ومن كلام ابن مسعود: ما أنت محدثا قوما حديثا لا تبلغه عقولهم إلا كان لبعضهم فتنة، أخرجه مسلم في (مقدمة صحيحه): (باب: ٣).", "حاشية: (١) تقدم في الصفحة: ١٨.", "حاشية: (٢) أوردهما البيهقي في «مناقب الشافعي» ٢/٧٢، وأبو نعيم في «حلية الأولياء» ٩/١٥٣، والسبكي في «طبقات الشافعية» ١/٢٩٤.", "حاشية: (٣) ليست في الأصل.", "وفي الجملة لا ينبغي أن يفتح لهم باب البحث، فإنه يخبط عليهم العقائد، ويبطل عليهم المعايش.", "الوظيفة الثامنة: أن يكون المعلم عاملا بعلمه، لا يكذب قوله بفعله(١)، لأن العلم يدرك بالبصائر، والعمل بالأبصار، وأرباب الأبصار أكثر، فإذا خالف العمل العلم منع الرشد، وكل من تناول شيئا وقال للناس: لا تتناولوه فإنه سم مهلك، سخر الناس به، واتهموه، وزاد حرصهم على ما منع منه، فيقولون: لولا أنه أطيب الأشياء وألذها ما كان يستأثر به، قال الله عز وجل: ﴿أَتَأْمُرُونَ ٱلنَّاسَ بِٱلْبِرِّ وَتَنسَوْنَ أَنفُسَكُمْ﴾ [البقرة: ٤٤].", "ويروى عن علي رضي الله عنه أنه قال: قصم ظهري رجلان: عالم متهتك، وجاهل متنسك، فالجاهل يغر الناس بتنسكه، والعالم ينفرهم بتهتكه.", "وقال الشاعر:", "لا تنه عن خلق وتأتي مثله  عار عليك إذا فعلت عظيم(٢)", "حاشية: (١) في الأصل: «فعله»."]], "ic": "book"}, {"story": ["الباب الخامس في آداب المتعلم والمعلم (٨ من ٨)، ص٦٥", ["حاشية: (٢) البيت لأبي الأسود الدؤلي على الأرجح، وهو في «ديوانه»: ٤٠٤، و«خزانة الأدب» ٣/٦١٨، و«شرح الشذور»: ٣١٠، وينسب البيت أيضا للأخطل، والسابق البربري، والطرماح كما في «خزانة الأدب»، وينسب للمتوكل الليثي كما في «العقد الفريد» ٢/٣١١، ولحسان بن ثابت كما في «شرح أبيات سيبويه» ٢/١٨٨."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "فمن علم وعمل وعلم فهو الذي يدعى عظيما في ملكوت السماء؛ لأنه يكون كالشمس المضيئة في نفسها المضيئة ____، وكالمسك الطيب في نفسه المطيب لغيره", "o": ["لغيرها", "نائم", "الجوشن", "تشهده"], "h": "راجع: ص٦٠"}, {"t": "fill", "d": 2, "q": "الوظيفة السادسة: أن يأخذ من كل شيء أحسنه؛ لأن العمر لا يتسع لجميع العلوم، ثم يصرف جمام قوته إلى أشرف العلوم، وهو العلم ____ بالآخرة، الذي به يكتسب اليقين الذي حصله أبو بكر رضي الله عنه، حتى", "o": ["المتعلق", "والنفساء", "مرافقتك", "محبوسا"], "h": "راجع: ص٥٨"}, {"t": "fill", "d": 2, "q": "ثم يحضر قلبه، ويجمع همه وفهمه، لتستوي أجزاء القلب في تناول العلم استواء الأرض الدمثة في نيل المطر، وليدع رأيه لرأي معلمه، فإن خطأ المعلم أنفع للمتعلم من ____ نفسه", "o": ["صواب", "رهان", "كفضل", "الشذور"], "h": "راجع: ص٥٧"}, {"t": "fill", "d": 2, "q": "فالجواب: أنه يستأذن في السؤال، ثم يسأل، وقد قال أمير المؤمنين علي رضي الله عنه: إن من حق العالم عليك أن تسلم على ____ عامة وتخصه بالتحية، وأن تجلس أمامه، ولا تشيرن عنده بيدك، ولا تغمزن بعينك، ولا", "o": ["القوم", "جئتنا", "لليالي", "كالنفقة"], "h": "راجع: ص٥٧"}, {"t": "fill", "d": 2, "q": "فأما الذي يعلم ولا يعمل فكالكتاب، يفيد غيره وهو خال من العلم، والمسن الذي يشحذ غيره ولا يقطع، والإبرة تكسو غيرها وهي عارية، وذبالة المصباح ____ لغيرها وهي تحترق", "o": ["تضيء", "فليأخذ", "جاذب", "المعضل"], "h": "راجع: ص٦٠"}, {"t": "fill", "d": 2, "q": "ولا يصح ذلك إلا أن يكون مقصودهم الآخرة، فأما إن كان مقصودهم الدنيا، فإنه يوقع ____ التحاسد والتباغض", "o": ["بينهم", "يسرد", "خلدون", "استجد"], "h": "راجع: ص٦١"}]}], "sum": [["الصفحات", "ص٥٥ - ص٦٥"]], "_nq": 12}, {"id": "l10", "title": "الباب السادس آفات العلم وبيان علامات علماء الآخرة وعلماء السوء", "group": "كتاب العلم", "map": {"center": "الباب\nالسادس آفات", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب السادس آفات العلم وبيان علامات علماء الآخرة وعلماء السوء - القسم ١ من ٢", "b": [{"pic": ["books", "book"], "cap": "ص٦٦ - ص٧٤"}, {"story": ["الباب السادس آفات العلم وبيان علامات علماء الآخرة وعلماء الس (١ من ٧)، ص٦٦", ["**آفات العلم وبيان علامات علماء الآخرة وعلماء السوء**", "علماء السوء هم الذين قصدهم من العلم التنعم بالدنيا، والتوصل إلى المنزلة عند أهلها، وقد ضرب الله تعالى للعالم إذا لم يعمل بعلمه مثلا فقال: ﴿فَمَثَلُهُۥ كَمَثَلِ ٱلْكَلْبِ﴾ [الأعراف: ١٧٦] وقد قال صلى الله عليه وسلم: «من تعلم العلم ليباهي به العلماء أو يماري به السفهاء أو يصرف به وجوه الناس، فهو في النار»(١)، وقال صلى الله عليه وسلم: «لا تعلموا العلم لتباهوا به العلماء، ولا لتماروا به السفهاء، ولا لتخيروا(٢) به المجالس، فمن فعل ذلك فالنار النار»(٣).", "أخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا شريح بن النعمان قال: حدثنا فليح عن عبد الله بن عبد الرحمن أبي طوالة عن سعيد بن يسار عن أبي هريرة قال: قال رسول الله صلى الله عليه وسلم: «من تعلم علما مما يبتغى به وجه الله عز وجل، لا يتعلمه إلا ليصيب به عرضا من الدنيا، لم يجد عرف الجنة يوم القيامة»(٤) يعني: ريحها.", "قال أحمد: وحدثنا وكيع قال: حدثنا حماد بن سلمة عن علي بن زيد عن أنس بن مالك قال: قال رسول الله صلى الله عليه وسلم: «مررت ليلة أسري بي على قوم تقرض", "حاشية: (١) أخرجه الترمذي (٢٦٥)، وقال: هذا حديث غريب، وصححه الألباني في صحيح الجامع الصغير بنحوه.", "حاشية: (٢) تصحفت في (ظ) إلى: «التخيروا».", "حاشية: (٣) أخرجه ابن ماجه (٢٥٤)، والحاكم ١/٨٦، وابن حبان في صحيحه (٧٧) من حديث جابر.", "حاشية: (٤) أخرجه أبو داود (٣٥١٧)، وابن ماجه (٢٥٢)، والحاكم ١/٨٥ وقال: حديث صحيح سنده، ثقات رواته، على شرط الشيخين. ووافقه الذهبي.", "شفاههم بمقاريض من نار، قلت: من هؤلاء؟ قالوا: خطباء من أمتك أهل الدنيا، كانوا يأمرون الناس بالبر وينسون أنفسهم وهم يتلون الكتاب، أفلا يعقلون»(١)."]], "ic": "book"}, {"story": ["الباب السادس آفات العلم وبيان علامات علماء الآخرة وعلماء الس (٢ من ٧)، ص٦٧", ["أخبرنا عبد الأول بن عيسى قال: أنبأنا الداودي قال: أنبأنا ابن أعين السرخسي قال: أنبأنا الفربري قال: أنبأنا البخاري قال: أنبأنا علي بن عبد الله قال: حدثنا سفيان قال: حدثنا الأعمش عن أبي وائل عن أسامة قال: سمعت رسول الله صلى الله عليه وسلم يقول: «يجاء بالرجل يوم القيامة، فيلقى في النار، فتندلق أقتابه، فيدور كما يدور الحمار برحاه، فتجتمع أهل النار عليه، فيقولون: أي فلان، ما شأنك؟ أليس كنت تأمرنا بالمعروف وتنهانا عن المنكر؟ قال: كنت آمركم بالمعروف ولا آتيه، وأنهاكم عن المنكر وآتيه» أخرجاه في الصحيحين(٢). وفي أفراد مسلم من حديث أبي هريرة عن النبي صلى الله عليه وسلم أنه قال: «إن أول الناس يقضى فيه يوم القيامة ثلاثة: . . . رجل تعلم العلم، وعلمه، وقرأ القرآن، فأتي به فعرفه نعمه فعرفها، فقال: ما عملت فيها؟ قال: تعلمت فيك العلم وعلمته، وقرأت القرآن. فقال: كذبت، ولكنك تعلمت ليقال: هو عالم، فقد قيل، وقرأت القرآن ليقال: هو قارئ، فقد قيل. ثم أمر به فسحب على وجهه حتى ألقي في النار»(٣) وذكر باقي الحديث، وسيأتي في كتاب الرياء إن شاء الله تعالى", "وقال عيسى ابن مريم عليه السلام: يا معشر العلماء، إلى متى تصفون الطريق للمدلجين وأنتم مقيمون مع المتحيرين، مثلكم مثل الدفلى(٤) يعجب وروده من نظر إليه ويقتل طعمه من أكله، كلامكم يبرئ الداء، وأعمالكم داء لا يقبل الدواء، الحكمة تخرج من أفواهكم وليس بينها وبين آذانكم إلا أربع أصابع ثم لا تعيها قلوبكم، معشر العلماء، كيف يكون من أهل العلم من يطلب الكلام ليخبر به،", "حاشية: (١) أخرجه أحمد ٣/١٢٠، (١٢٢١١).", "حاشية: (٢) أخرجه البخاري (٣٢٦٧)، ومسلم (٢٩٨٩).", "حاشية: (٣) أخرجه مسلم (١٩٠٥).", "حاشية: (٤) الدفلى: نبت مر قتال، زهره كالورد الأحمر، وحمله كالخروب. القاموس المحيط: (دفل).", "ولا يطلبه ليعمل به، العلم فوق رؤوسكم، والعمل تحت أقدامكم، فلا أحرار كرام، ولا عبيد أتقياء.", "وقال بعض السلف: أشد الناس ندامة عند الموت؛ عالم مفرط.", "وكتب حكيم إلى حكيم: إنك قد أوتيت علما فلا تدنس علمك بظلمة الذنوب، فتبقى في الظلمة يوم يسعى أهل العلم بنور علمهم.", "وقال سفيان بن عيينة: العلم يضرك إن لم ينفعك. وهذا صحيح، فإنه يزيد في الحجة على صاحبه، فالعالم الذي لا يعمل به أشد عذابا من الجاهل.", "واعلم أن المأخوذ على العالم أن يقوم بالأوامر والنواهي، وليس عليه أن يكون زاهدا ولا معرضا عن المباحات، إلا أنه ينبغي له أن يتقلل من الدنيا مهما استطاع، فإن دليل الفعل آكد من دليل القول؛ لأن من ذم الدنيا واستوعب مباحها لم تفهم العامة عنه ما ذم، على أنه إذا تحقق علمه قنع باليسير من الدنيا ودخل في جملة الزهاد عملا بالفضائل ومزاحمة على المناقب، إلا أنه ليس كل جسم يقبل التقلل، ولا يطيق خشونة العيش."]], "ic": "book"}, {"story": ["الباب السادس آفات العلم وبيان علامات علماء الآخرة وعلماء الس (٣ من ٧)، ص٦٨", ["ومن الغلط إنكار الجهال على العالم إذا رفق بنفسه في مطعمه وملبسه خصوصا عند كبر السن، فقد كان الحسن البصري كثيرا ما يأكل اللحم، فيقال له، فيقول: نعم لا صحناه(١) فرقد، ولا رغيفي مالك. ولبس يوما ثوبا جيدا فجعل فرقد يلمسه ويتعجب، وكان على فرقد كساء فقال له الحسن: أما بلغك أن أكثر أهل النار أصحاب الأكسية. يشير إلى الرهبان.", "وكان سفيان الثوري حسن المطعم، وقال: إن الدابة إذا لم تحسن إليها في علفها لم تعمل.", "وقد كان الإمام أحمد بن حنبل يصبر من خشونة العيش على أمر عظيم، فالطباع تتفاوت، فإياك أن تنكر على العالم مباحا استعمله، كما أنكر حاتم الأصم", "حاشية: (١) الصحناة: إدام يتخذ من السمك الصغار مثو مصلح للمعدة. القاموس المحيط: (صحن).", "على محمد بن مقاتل قاضي الري توسعه في المباحات، وقد ذكرت حكايته معه في «تلبيس إبليس» وبينت أن طلب العامي من الفقيه أن يكون معرضا عن المباحات جهل من العامي، وظن أن المباح مذموم، وهذا فساد تلمح، فإن الله تعالى لا يبيح ما يذم فاعله. إلا أنا قد بينا أن الأولى بالعالم رفض كل ما يستغنى عنه من المباحات لئلا يستكثر منها من لم يعرف كيفية استعمال العالم لها؛ لأن العالم كالطبيب وإذا خلط لم يقبل قوله، وإن كان تخليطه بعلم. على أن الاستكثار من المباحات يوجب الأنس بها ولا تكاد تنال إلا بشبهات.", "فقد بان لك بما ذكرنا غلط من يذم المباحات مطلقا من العوام وجهال الزهاد، وكل ذلك لقلة العلم حتى أن خلقا من المترهدين دفنوا كتب العلم، وقالوا: المقصود العمل. وقد بينا فيما تقدم أن العلم أفضل الأعمال؛ لأنه يحصل بالقلب بخلاف الأعمال التي تحصل بالبدن، ونشره مع صحة النية أفضل من كل نافلة، وقد حصل لهم في دفن الكتب محن منها: إطفاء مصباح الطريق، وهو العلم، فإنه نور السالك. ومنها: إفساد المال، وذلك حرام. ومنها: محو الشرع، فإن العلماء تعبوا في جمع الأحاديث وتصنيفها، فمن دفنها فقد محاها وضاد المقصود من قوله صلى الله عليه وسلم: «بلغوا عني»(١) وقوله: «نضر الله امرأ سمع مقالتي فوعاها، فأداها كما سمعها»(٢).", "وفيهم من احتج بأني اشتهي أن أحدث، فأنا أمنع نفسي شهوتها. وهذه حيلة من إبليس ليمنع نشر العلم، فإن فرح النفس بالإمارة لا يمكن دفعه، والإمارة فضيلة، وكذلك الإمامة، وكذلك الالتذاذ بالجماع الذي يطلب منه الولد، فميل النفس إلى هذه الأشياء معين على تحصيلها ولا يمكن محو أثره من النفس، فمن تخايل له أنه يمكن أن يجامع ولا يلتذ، أو يحدث ولا يفرح بالرئاسة، فقد تخايل", "حاشية: (١) أخرجه البخاري (٣٤٦١)، وأحمد (٦٤٨٦)، والترمذي (٢٦٦٩)، وعبد الرزاق (١٠١٥٧) و(١٩٢١٠)، وابن أبي شيبة ٨/٧٦٠ من حديث عمرو بن العاص."]], "ic": "book"}, {"story": ["الباب السادس آفات العلم وبيان علامات علماء الآخرة وعلماء الس (٤ من ٧)، ص٦٩", ["حاشية: (٢) أخرجه أحمد (١٦٧٣٨)، والدارمي ١/٧٤ ـ ٧٥، وابن ماجه (٢٣١)، والطبراني في الكبير (١٥٤١)، والحاكم ١/٨٧، وقال محقق المسند: صحيح لغيره.", "له الممتنع، وليس في وجود ذلك ما يؤذي الدين، إنما ينبغي أن تقع المجاهدة لقصد الرئاسة بالكبر والعجب، فأما أن يترك العلم، فلا.", "فاعتمد على هذا، وانظر إلى أئمة الدين من الصحابة والتابعين وفقهاء الأمصار هل فيهم من امتنع من نشر العلم لهذا الخاطر؟ وقد كان مالك بن أنس يتوضأ ويتطيب ويستند ويتمكن ويقول: حدثنا فلان. ولا يلتفت إلى ما يروى عن بشر الحافي أنه قال: حدثنا، باب من أبواب الدنيا. وأنه دفن كتبه، فإنه لو وافقه الأئمة في زمانه على هذا درس العلم.", "ولا ينكر أن للنفس في نشر العلم دفينة، ولكن ينبغي أن تجاهد وتترك أسبابها وقد حصلت السلامة. فإن قلت: فقد روي عن سفيان أنه دفن كتبه. فاعلم أن سفيان كان يحدث عن قوم ضعفاء فيدلسهم، فندم على ذلك واختلط حديثه، فدفن الكل، فهذا سبب يجيز ما منعنا منه.", "**فصل**", "ومن صفات علماء الآخرة أن يعلموا أن الدنيا حقيرة، وأن الآخرة شريفة، وأنهما كالضرتين، فيؤثرون الآخرة، فلا تخالف أفعالهم أقوالهم، ويكون ميلهم إلى العلم النافع في الآخرة، ويجتنبون العلوم التي يقل نفعها إيثارا لما يعظم نفعه، كما روي عن شقيق البلخي أنه قال لحاتم: قد صحبتني مدة فماذا تعلمت؟ قال: ثمان مسائل:", "أما الأولى: فإني نظرت إلى الخلق، فإذا كل شخص له محبوب، فإذا وصل إلى القبر فارقه محبوبه، فجعلت محبوبي حسناتي لتكون في القبر معي.", "وأما الثانية: فإني نظرت في قوله تعالى: ﴿وَنَهَى ٱلنَّفْسَ عَنِ ٱلْهَوَىٰ﴾ [النازعات: ٤٠] فأجهدتها في دفع الهوى حتى استقرت على طاعة الله سبحانه.", "وأما الثالثة: فإني رأيت أن كلا من معه شيء له قيمة عنده يحفظه، ثم نظرت في قوله تعالى: ﴿مَا عِندَكُمْ يَنفَدُ وَمَا عِندَ ٱللَّهِ بَاقٍ﴾ [النحل: ٩٦]. فكلما وقع معي شيء له قيمة وجهته إليه ليبقى لي عنده.", "وأما الرابعة: فإني رأيت الناس يرجعون إلى المال والحسب والشرف وليست بشيء، فنظرت في قوله تعالى: ﴿إِنَّ أَكْرَمَكُمْ عِندَ ٱللَّهِ أَتْقَىٰكُمْ﴾ [الحجرات: ١٣] فعملت في التقوى لأكون عنده كريما.", "وأما الخامسة: فإني رأيت الناس يتحاسدون، ونظرت في قوله تعالى: ﴿نَحْنُ قَسَمْنَا بَيْنَهُم مَّعِيشَتَهُمْ﴾ [الزخرف: ٣٢] فتركت الحسد.", "والسادسة: أني رأيتهم يتعادون، فتركت عداوتهم واتخذت الشيطان وحده عدوا.", "والسابعة: أني رأيتهم يذلون في طلب الرزق، ونظرت في قوله تعالى: ﴿وَمَا مِن دَآبَّةٍ فِى ٱلْأَرْضِ إِلَّا عَلَى ٱللَّهِ رِزْقُهَا﴾ [هود: ٦] فاشتغلت بما له علي، وتركت مالي عنده.", "والثامنة: أني رأيتهم متوكلين على تجاراتهم وصنايعهم وصحة أبدانهم، فتوكلت على الله."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "ولا ينكر أن للنفس في نشر العلم دفينة، ولكن ينبغي أن تجاهد وتترك أسبابها وقد ____ السلامة", "o": ["حصلت", "عشرا", "رأسك", "فقالت"], "h": "راجع: ص٧٠"}, {"t": "fill", "d": 2, "q": "وكتب حكيم إلى حكيم: إنك قد أوتيت علما فلا تدنس علمك بظلمة الذنوب، فتبقى في الظلمة يوم ____ أهل العلم بنور", "o": ["يسعى", "للنوم", "منشؤه", "مضرة"], "h": "راجع: ص٦٨"}, {"t": "fill", "d": 2, "q": "بالبرهان الذي لا يشك فيه، ولا يتصور التشكيك فيه، مثل وجود القديم، فإن العامة تثبت قديما على وجه الاعتقاد، ولا تعرف البرهان على ذلك، ____ يعرفون ذلك يقينا؛ لأنهم يقولون", "o": ["والعلماء", "والقنابر", "الفروع", "أكابره"], "h": "راجع: ص٧٣"}, {"t": "fill", "d": 2, "q": "أخبرنا عبد الأول بن عيسى قال: أنبأنا الداودي قال: أنبأنا ابن أعين السرخسي قال: أنبأنا الفربري قال: أنبأنا البخاري قال: أنبأنا علي بن عبد ____ قال: حدثنا سفيان قال: حدثنا الأعمش عن أبي وائل عن أسامة", "o": ["الله", "المئزر", "فعلى", "أخبره"], "h": "راجع: ص٦٧"}, {"t": "fill", "d": 2, "q": "شفاههم بمقاريض من نار، قلت: من هؤلاء؟ قالوا: خطباء من أمتك أهل الدنيا، كانوا يأمرون ____ بالبر وينسون أنفسهم وهم يتلون الكتاب، أفلا", "o": ["الناس", "بخطأي", "القديم", "عبودية"], "h": "راجع: ص٦٧"}, {"t": "fill", "d": 2, "q": "ومن صفات علماء الآخرة: البحث عن أسرار الأعمال الشرعية، والملاحظة لحكمها؛ لأن المقتصر على صور المنقولات ____، والباحث عن العلل عالم، فإن عجز عن الاطلاع على العلة كفاه التسليم", "o": ["وعاء", "نسيه", "الفصد", "مليككم"], "h": "راجع: ص٧٤"}]}, {"t": "الباب السادس آفات العلم وبيان علامات علماء الآخرة وعلماء السوء - القسم ٢ من ٢", "b": [{"story": ["الباب السادس آفات العلم وبيان علامات علماء الآخرة وعلماء الس (٥ من ٧)، ص٧١", ["ومن صفات علماء الآخرة: أن يكونوا منقبضين عن السلاطين، محترزين من مخالطتهم، فإن الدنيا حلوة خضرة، وزمامها بأيدي السلاطين، والمخالط لهم بعيد السلامة من وجوه؛ منها: أنه يجب عليه الإنكار، وقد يقدر عليه فلا يفعله، فيصير مداهنا، وربما حسن أحوالهم القبيحة طمعا في أموالهم الكدرة، وأقل الأحوال أن يرى نعيمهم فيزدري نعمة الله عليه، وقد قال عليه الصلاة والسلام: «من أتى السلطان افتتن»(١). وقال: «سيكون بعدي أمراء عليكم تعرفون منهم وتنكرون، فمن أنكر فقد برئ، ومن كره فقد سلم، ولكن من رضي وتابع»(٢).", "حاشية: (١) أخرجه أحمد (٨٨٣٦)، والبزار (١٦١٨)، والبيهقي في السنن ١٠١/١٠، وفي الشعب (٩٤٠٣)، وابن حبان في المجروحين ٢٣٣/١، وابن عدي في الكامل ٣١٢/١، من حديث أبي هريرة، وهو ضعيف.", "حاشية: (٢) أخرجه مسلم (١٨٥٤)(٦٤)، وأبو داود (٤٧٦٠)، والترمذي (٢٢٦٥)، وأحمد (٢٦٥٢٨)، وابن أبي شيبة ٧١/١٥، وأبو يعلى (٦٩٨٠)، والطبراني في الكبير ٧٦١/٢٣ و٧٦٢، والبيهقي في السنن ٣٦٧/٣، عن أم سلمة رضي الله عنها.", "قال حذيفة: إياكم ومواقف الفتن، قيل: وما هي؟ قال: أبواب الأمراء، يدخل أحدكم على الأمير فيصدقه بالكذب ويقول ما ليس فيه.", "وقال سعيد بن المسيب: إذا رأيتم العالم يغشى الأمراء فإنه لص، فاحترزوا منه.", "وما أحسن قول بعض السلف: إنك لا تصيب من دنياهم شيئا إلا أصابوا من دينك أفضل منه.", "ومن صفات علماء الآخرة أن لا يتسرعوا إلى الفتوى(١-١) وأن لا يفتوا(١-١) إلا بما يتيقنون صحته من غير تردد، وقد كان السلف يتدافعون الفتاوى حتى يرجع إلى الأول. قال عبد الرحمن بن أبي ليلى: أدركت في هذا المسجد(٢) مئة(٣) وعشرين من أصحاب رسول الله صلى الله عليه وسلم ما منهم أحد يسأل عن حديث أو فتوى إلا ود أن أخاه كفاه ذلك.", "وكتب سلمان إلى أبي الدرداء: بلغني أنك قد أقعدت طبيبا، فاحذر أن تقتل مسلما.", "وكان ابن عمر رضي الله عنه إذا سئل يقول: سلوا سعيد بن المسيب. وكان مالك كثيرا ما يقول: لا أدري. وكان النخعي إذا سئل عن مسألة بكى، وقال: لم تجدوا غيري.", "ثم قد آل الأمر إلى إقدام أقوام ـ يدعون العلم اليوم ـ على الجواب في مسائل لو عرضت لعمر بن الخطاب لجمع لها أهل بدر واستشارهم.", "ومن صفات علماء الآخرة: أن يكون جل اهتمامهم بمداواة الباطن والدلالة على طريق الآخرة، وأن يكثر اهتمامهم بتقوية اليقين، واليقين عرفان حاصل", "حاشية: (١-١) سقط من (ظ).", "حاشية: (٢) يعني المسجد النبوي في المدينة المنورة.", "حاشية: (٣) تحرفت في (ظ) إلى: «متين»."]], "ic": "book"}, {"story": ["الباب السادس آفات العلم وبيان علامات علماء الآخرة وعلماء الس (٦ من ٧)، ص٧٣", ["بالبرهان الذي لا يشك فيه، ولا يتصور التشكيك فيه، مثل وجود القديم، فإن العامة تثبت قديما على وجه الاعتقاد، ولا تعرف البرهان على ذلك، والعلماء يعرفون ذلك يقينا؛ لأنهم يقولون: قد ثبت حدوث(١) المحدثات، ولا يجوز حدوثها بلا سبب، فثبت وجود القديم ضرورة، فصار علمهم بذلك يقينا، ومن ثمرات اليقين أن يرى الموقن جميع الأسباب من المسبب، وأن الأسباب مسخرة لا حكم لها، بل هي كاليد والقلم في حق من يوقع له بنعمة. وأن ينصب الجزاء الموعود به بين يديه كأنه يراه، وأن الله يراه في كل حال، فيوجب هذا صدق المراقبة، وحسن الأدب، وحراسة الخواطر، فيكون كالجالس بين يدي ملك معظم، وهذا المقام يورث الحياء والخوف والخضوع والذل، وكل خلة من هذه تورث أنواعا من الطاعات.", "ومن صفات علماء الآخرة: أن يكونوا أرباب حزن وانكسار وصمت، فتظهر عليهم الخشية، فيعرفون بسيماهم بخلاف علماء الدنيا الذين ليس عندهم ما يكف عن قهقهة وتشدق وبطر، وقد روي عن علي رضي الله عنه أنه قال في خطبة له: ذمتي رهينة وأنا زعيم، لا يهيج على التقوى زرع قوم، ولا يظما على الهدى سنخ أصل، وإن أجهل الناس من لا يعرف قدره، وإن أبغض الخلق إلى الله تعالى رجل قمش(٢) علما حتى إذا ارتوى من ماء آجن وأكثر من غير طائل، جلس للناس مفتيا لتخليص ما التبس على غيره، وإن نزلت به إحدى المهمات هيأ حشو الرأي من رأيه، فهو من قطع الشبهات في مثل غزل العنكبوت لا يدري أخطأ أم أصاب، ركاب جهالات، خباط عشوات، لا يعتذر مما لا يعلم فيسلم، ولا يعض على العلم بضرس قاطع فيغنم، تبكي منه الدماء وتستحل بقضائه الفروج الحرام.", "ومن صفات علماء الآخرة: أن يكون أكثر بحثهم في علم الأعمال عن ما يفسدها، ويكدر القلوب، ويهيج الوساوس، فإن صور الأعمال قريبة، وإنما التعب", "حاشية: (١) في (ظ): «حدث».", "حاشية: (٢) قمش علما: أي جمعه من هنا وهناك.", "في تصفيتها، وأصل الدين التوقي من الشر، ولا يصح أن يتوقى حتى يعرف، كما قال حذيفة: كان الناس يسألون رسول الله صلى الله عليه وسلم عن الخير، وأنا أسأله عن الشر مخافة أن أقع فيه.", "فالعناية بمقامات القلب وأحواله هو دأب علماء الآخرة؛ لأن القلب هو الساعي إلى قرب الله عز وجل، وقد صار هذا العلم مهجورا غريبا حتى لو عرض به عالم قيل: هذا كلام الوعاظ. وسبب أكثر نفور الخلق منه أنه مباين لطباعهم شاق على أسماعهم؛ لأنه يأمر بمخالفة الهوى.", "ومن صفات علماء الآخرة: البحث عن أسرار الأعمال الشرعية، والملاحظة لحكمها؛ لأن المقتصر على صور المنقولات وعاء، والباحث(١) عن العلل عالم، فإن عجز عن الاطلاع على العلة كفاه التسليم للشرع."]], "ic": "book"}, {"story": ["الباب السادس آفات العلم وبيان علامات علماء الآخرة وعلماء الس (٧ من ٧)، ص٧٤", ["ومن صفاتهم: اتباع الصحابة وخيار التابعين، وتوقي كل محدث، وقد قال حذيفة: إن معروفكم اليوم منكر زمان قد مضى، وإن منكركم اليوم معروف زمان ما أتى. وهذا قول صحيح، فإن من محاسن المعروف في زماننا زخرفة المساجد والمصاحف، وقراءة الألحان، والتشاغل بدقائق الجدل، والتقشف في النظافة، وتقدير الأسباب البعيدة في نجاسة الثياب مع التساهل في حل الأطعمة وتحريمها إلى غير ذلك من البدع.", "حاشية: (١) تحرفت في الأصل إلى: «الباعث»."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "ومن صفات علماء الآخرة: أن يكونوا أرباب حزن وانكسار وصمت، فتظهر عليهم الخشية، فيعرفون بسيماهم بخلاف علماء الدنيا الذين ليس عندهم ما يكف عن قهقهة ____ وبطر، وقد روي عن علي رضي الله عنه أنه قال في خطبة", "o": ["وتشدق", "الفقير", "جنوبهم", "فليتطيب"], "h": "راجع: ص٧٣"}, {"t": "fill", "d": 2, "q": "قال حذيفة: إياكم ومواقف الفتن، قيل: وما هي؟ قال: أبواب الأمراء، يدخل أحدكم على الأمير ____ بالكذب ويقول ما ليس", "o": ["فيصدقه", "الصبي", "والبادية", "أكبر"], "h": "راجع: ص٧٢"}, {"t": "fill", "d": 2, "q": "على محمد بن مقاتل قاضي الري توسعه في المباحات، وقد ذكرت حكايته معه في «تلبيس إبليس» وبينت أن طلب العامي من الفقيه أن يكون معرضا عن المباحات جهل من العامي، وظن أن المباح مذموم، ____ فساد تلمح، فإن الله تعالى لا يبيح ما يذم فاعله", "o": ["وهذا", "ناداهم", "ليأتي", "النفوس"], "h": "راجع: ص٦٩"}, {"t": "fill", "d": 2, "q": "ومن صفات علماء الآخرة أن لا يتسرعوا إلى الفتوى وأن لا يفتوا إلا بما يتيقنون ____ من غير تردد، وقد كان السلف يتدافعون الفتاوى حتى يرجع إلى الأول", "o": ["صحته", "واشرح", "السدس", "طلعته"], "h": "راجع: ص٧٢"}, {"t": "fill", "d": 2, "q": "وقال سفيان بن عيينة: العلم يضرك إن لم ينفعك. وهذا صحيح، فإنه يزيد في الحجة على صاحبه، فالعالم الذي لا يعمل به أشد ____ من", "o": ["عذابا", "المتعبد", "ويقول", "أوراقها"], "h": "راجع: ص٦٨"}, {"t": "fill", "d": 2, "q": "ومن صفات علماء الآخرة: أن يكون أكثر بحثهم في علم الأعمال عن ما يفسدها، ويكدر ____، ويهيج الوساوس، فإن صور الأعمال قريبة، وإنما", "o": ["القلوب", "الهزيلة", "ويعينه", "سمعك"], "h": "راجع: ص٧٣"}]}], "sum": [["الصفحات", "ص٦٦ - ص٧٤"]], "_nq": 12}, {"id": "l11", "title": "الباب السابع في العقل وشرفه وحقيقته وأقسامه", "group": "كتاب العلم", "map": {"center": "الباب\nالسابع في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب السابع في العقل وشرفه وحقيقته وأقسامه", "b": [{"pic": ["books", "book"], "cap": "ص٧٥ - ص٨٠"}, {"story": ["الباب السابع في العقل وشرفه وحقيقته وأقسامه (١ من ٤)، ص٧٥", ["**في العقل وشرفه وحقيقته وأقسامه**", "**بيان شرف العقل من جهة النقل**", "أخبرنا علي بن محمد بن أبي عمر قال: أخبرنا علي بن الحسين بن أيوب قال: أخبرنا عبد الغفار بن محمد المؤدب قال: حدثنا أبو عبد الله محمد بن أحمد بن مخلد الجوهري، قال: حدثنا الحارث بن محمد بن أبي أسامة قال: حدثنا داود بن المحبر قال: حدثنا عباد بن كثير عن ابن جريج عن عطاء عن ابن عباس أنه دخل على عائشة رضي الله عنها، فقال: يا أم المؤمنين أرأيت الرجل يقل قيامه و يكثر رقاده، وآخر يكثر قيامه ويقل رقاده أيهما أحب إليك؟ قالت: سألت رسول الله صلى الله عليه وسلم كما سألتني فقال: «أحسنهما عقلا» فقلت: يا رسول الله، إنما أسألك عن عبادتهما. فقال: «يا عائشة إنهما لا يسألان عن عبادتهما إنما يسألان عن عقولهما، فمن كان أعقل كان أفضل في الدنيا والآخرة»(١).", "أخبرنا ابن ناصر قال: أخبرنا الحسن بن أحمد قال: أخبرنا أبو الحسن أحمد بن علي قال: أخبرنا عبد الباقي قال: حدثنا بشر بن موسى قال: حدثنا منصور بن صقير قال: حدثنا موسى بن أعين عن عبيد الله بن عمر عن نافع عن ابن عمر قال: قال رسول الله صلى الله عليه وسلم: «إن الرجل يكون من أهل الصيام، وأهل الصلاة، وأهل الحج، وأهل الجهاد فما يجزى يوم القيامة إلا بقدر عقله»(٢).", "حاشية: (١) موضوع، أورده ابن عراق في تنزيه الشريعة المرفوعة عن الأحاديث الشنيعة الموضوعة ١/١٧٦، والمصنف في الموضوعات ١/١٧٦، والشوكاني في الفوائد المجموعة ٤٧٧، وقال الدارقطني: كتاب العقل وضعه أربعة أولهم ميسرة.", "حاشية: (٢) أورده ابن عراق في تنزيه الشريعة ١/٢٠٣، وقال: رواه الخطيب في تاريخه ٧٩/١٣ من حديث ابن عمر، ولا يصح. وأخرجه المصنف في الموضوعات ١/١٧٢، والذهبي في", "أخبرنا محمد بن أبي منصور قال: أخبرنا المبارك بن عبد الجبار قال: أخبرنا أحمد بن عبد الله الأنماطي قال: أخبرنا أحمد بن الحسين المروزي قال: أخبرنا أحمد بن الحارث قال: حدثنا جدي محمد بن عبد الكريم قال: حدثنا الهيثم بن عدي قال: حدثنا الأعمش عن عمرو بن مرة عن عبد الرحمن بن سابط عن ابن عباس قال: «لما خلق الله العقل قال له: أدبر فأدبر، ثم قال له: أقبل فأقبل، فقال: وعزتي ما خلقت خلقا قط أحسن منك، فبك أعطي، وبك آخذ، وبك أعاقب»(١).", "وقال وهب بن منبه: إني وجدت في بعض ما أنزل الله على أنبيائه: إن الشيطان لم يكابد شيئا أشد عليه من مؤمن عاقل، وأنه يكابد مئة جاهل فيستجرهم حتى يركب رقابهم، فينقادون له حيث شاء، ويكابد المؤمن العاقل فيصعب عليه حتى ينال منه حاجته."]], "ic": "book"}, {"story": ["الباب السابع في العقل وشرفه وحقيقته وأقسامه (٢ من ٤)، ص٧٦", ["وقال معاذ بن جبل: لو أن العاقل أمسى وأصبح وله ذنوب بعدد الرمل، كان وشيكا بالسلامة والنجاة والتخلص منها، ولو أن الجاهل أمسى وأصبح وله من الحسنات وأعمال البر عدد الرمل، لكان وشيكا أن لا يسلم له منها مثقال ذرة، قيل: وكيف ذلك؟ قال: لأن العاقل إذا زل تدارك ذلك بالتوبة والعقل الذي قسم له، والجاهل إنما هو بمنزلة الذي يبني فيهدم فيأتيه من جهله ما يفسد صالح عمله.", "وقال الحسن: لا يتم دين الرجل حتى يتم عقله، وما أودع الله امرأ عقلا إلا استنقذه به يوما ما.", "حاشية (تتمة): ميزان الاعتدال (٨٧٨)، والشوكاني في الفوائد المجموعة: ٤٧٥، وابن أبي الدنيا في كتاب العقل: ١٢، وابن حبان في المجروحين ٣/٤٠، وقال ابن معين: هذا الحديث باطل.", "حاشية: (١) أخرجه ابن عدي في الكامل ٢/٣٩٠ و٦/١٤، وأورده ابن عراق في تنزيه الشريعة ١/٢٠٣، والشوكاني في الفوائد المجموعة: ٤٧٧، والمصنف في الموضوعات ١/٧٤، والهيثمي في مجمع الزوائد ٨/٢٨، والزبيدي في الإتحاف ١/٤٥٥.", "**بيان شرف العقل من جهة المعنى**", "بيان شرف العقل أمر ظاهر؛ لأن العقل منبع العلم ومطلعه وأساسه، والعلم يجري منه مجرى الثمرة من الشجرة، والنور من الشمس، وكيف لا يشرف ما هو وسيلة السعادة في الدنيا والآخرة، وكيف يشك في ذلك والبهائم تحترم العاقل لشعورها بفضله واحتياله، ولذلك ترى الأتراك والأكراد وأجلاف الخلق مع قرب رتبتهم من البهائم يوقرون المشايخ بالطبع، وقد تبين آثار العقل على وجه العاقل فيصير له بذلك سمت وسيما، ولهذا أذعن كثير من المعاندين لرسول الله صلى الله عليه وسلم بنفس رؤيته، وقال عبد الله بن سلام: لما رأيته علمت أن وجهه ليس بوجه كذاب.", "**بيان حقيقة العقل وأقسامه**", "اختلف الناس في حده وحقيقته، وذهل الأكثرون عن كون هذا الاسم ينطلق بالاشتراك على أربعة معان، كما يطلق اسم العين مثلا على معان عدة وما يجري هذا المجرى، فلا ينبغي أن يطلب لجميع أقسامه حد واحد بل يفرد كل قسم بالكشف عنه.", "فالأول: الوصف الذي به يفارق الإنسان البهائم، وهو الذي به استعد لقبول العلوم النظرية وتدبير(١) الصناعات الخفية الفكرية، وهو الذي أراده الحارث المحاسبي حين قال في حد العقل: إنه غريزة يتهيأ بها درك العلوم النظرية، وكأنه نور يقذف في القلب، به يستعد لإدراك الأشياء.", "والثاني: ما وضع في الطباع من العلم بجواز الجائزات واستحالة المستحيلات، كالعلم بأن الاثنين أكثر من الواحد، وأن الشخص الواحد لا يكون في مكانين، وهذا الذي عناه بعضهم بقوله في حد العقل: إنه بعض العلوم الضرورية، وهو صحيح في نفسه؛ لأن هذه العلوم موجودة، وتسميتها عقلا ظاهر، وإنما الفاسد أن تنكر تلك الغريزة، ويقال: لا موجود إلا هذه العلوم.", "حاشية: (١) سقطت من (ظ).", "والثالث: علوم تستفاد من التجارب تسمى عقلا."]], "ic": "book"}, {"story": ["الباب السابع في العقل وشرفه وحقيقته وأقسامه (٣ من ٤)، ص٧٨", ["والرابع: أن تنتهي قوة الغريزة إلى أن يعرف عواقب الأمور ويقمع الشهوة الداعية إلى اللذة العاجلة ويقهرها، وإذا حصلت هذه القوة سمي صاحبها عاقلا من حيث أن إقدامه وإحجامه بحسب ما يقتضيه النظر في العواقب لا بحكم الشهوة العاجلة، وهذا من خصائص الإنسان التي بها يتميز عن سائر الحيوانات.", "فالأول هو الأصل، والثاني الفرع الأقرب إليه، والثالث فرع الأول والثاني، إذ بقوة الغريزة والعلوم الضرورية تستفاد علوم التجارب، والرابع هو الثمرة الأخيرة والغاية القصوى.", "والأول هو المراد بقوله صلى الله عليه وسلم: «ما خلق الله خلقا أكرم عليه من العقل»(١). والأخير هو المراد بقوله: «إذا تقرب الناس بأبواب البر، فتقرب أنت بعقلك»(٢).", "وهذه العلوم كأنها مضمنة في تلك الغريزة بالفطرة، ولكنها تظهر إلى الوجود إذا جرى سبب يخرجها إلى الوجود، كالدهن في اللوز وماء الورد في الورد، ولذلك قال الله تعالى: ﴿وَإِذْ أَخَذَ رَبُّكَ مِنۢ بَنِىٓ ءَادَمَ مِن ظُهُورِهِمْ ذُرِّيَّتَهُمْ وَأَشْهَدَهُمْ عَلَىٰٓ أَنفُسِهِمْ أَلَسْتُ بِرَبِّكُمْ ۖ قَالُوا۟ بَلَىٰ﴾ [الأعراف: ١٧٢] والمراد به: إقرار نفوسهم لا إقرار ألسنتهم، فإنهم انقسموا في إقرار الألسنة لما وجدت، ولذلك قال: ﴿فِطْرَتَ ٱللَّهِ ٱلَّتِى فَطَرَ ٱلنَّاسَ عَلَيْهَا﴾ [الروم: ٣٠] أي: إن كل آدمي فطر على الإيمان بالله ومعرفة الأشياء على ما هي عليه ثم من الناس من أعرض فنسي، وهم الكفار، ومنهم من أجال خاطره فذكر، فكان كمن حمل شهادة فنسيها ثم تذكرها، ولهذا قال تعالى: ﴿لَعَلَّكُمْ تَذَكَّرُونَ﴾ [الأنعام: ١٥٢] و﴿وَلِيَذَّكَّرَ أُو۟لُوا۟ ٱلْأَلْبَٰبِ﴾ [إبراهيم: ٥٢] وهذا تذكر", "حاشية: (١) أورده العراقي في المغني عن حمل الأسفار ١/٨٥ و٣/١٦، وقال: رواه الحكيم الترمذي في النوادر بإسناد ضعيف من رواية الحسن البصري. وذكره الزبيدي في الإتحاف ١/٤٦١ و٧/١٠. والفتني في تذكرة الموضوعات: ٢٩.", "حاشية: (٢) أورده الذهبي في ميزان الاعتدال (٦٢٥) في ترجمة أحمد بن المفضل الكوفي، وقال: قال الأزدي: منكر الحديث. وذكره الزبيدي في الإتحاف ١/٤٧٥.", "صورة كانت في النفس مضمنة بالفطرة ومن لم تكن بصيرته الباطنة ثاقبة لم يعلق به من الدين إلا قشوره وأمثلته دون لبابه وحقائقه.", "**بيان تفاوت الناس في العقل**"]], "ic": "book"}, {"story": ["الباب السابع في العقل وشرفه وحقيقته وأقسامه (٤ من ٤)، ص٧٩", ["التفاوت يتطرق إلى ثلاثة أقسام من الأربعة المتقدمة، ولا يتطرق إلى القسم الثاني، وهو العلم الضروري بجواز الجائزات واستحالة المستحيلات، فأما القسم الرابع؛ وهو استيلاء القوة على قمع الشهوات، فلا يخفى تفاوت الناس فيه، وهذا التفاوت قد يكون لتفاوت الشهوة، وقد يكون لتفاوت العلم المعرف لغائلة تلك الشهوة، ولهذا يقدر الطبيب على الاحتماء عن بعض الأطعمة المضرة ولا يقدر من يساويه في العقل إذا لم يكن طبيبا، وكذلك يقدر العالم من ترك المعاصي على ما لا يقدر العامي، وقد يكون التفاوت في غريزة العقل، فإنها إذا قويت كان قمعها للشهوة أشد، وهذه الغريزة كنور يشرق على النفس، وتكون مبادئ إشراقه عند سن التمييز، ثم لا يزال ينمى ويزداد نموا خفي التدريج إلى أن يتكامل بقرب الأربعين سنة، كما أن أوائل الصبح تخفى، ثم تتدرج إلى الوضوح إلى أن يكمل قرص الشمس، وكيف ننكر تفاوت الغريزة ولولاه ما اختلف الناس في فهم العلوم، ولما انقسموا إلى بليد لا يفهم بالتفهيم، وإلى زكي يفهم بأدنى رمز وإشارة، وإلى كامل تنبعث من نفسه حقائق الأمور دون التعليم ﴿يَكَادُ زَيْتُهَا يُضِىٓءُ وَلَوْ لَمْ تَمْسَسْهُ نَارٌ﴾ [النور: ٣٥] وذلك مثل الأنبياء صلوات الله عليهم، إذ تتضح لهم في باطنهم أمور غامضة من غير تعلم وسماع، ويعبر عن ذلك بالإلهام، وفي مثل هذا(١-١) «قال صلى الله عليه وسلم(١-١): «إن روح القدس نفث في روعي»(٢).", "حاشية: (١-١) سقط من الأصل.", "حاشية: (٢) أخرجه القضاعي في مسند الشهاب (١١٥١)، والبغوي في شرح السنة ١٤/٣٠٤، وابن عبد البر في التمهيد ١٤/٤٠٦ من حديث ابن مسعود."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "وقال وهب بن منبه: إني وجدت في بعض ما أنزل الله على أنبيائه: إن الشيطان لم يكابد شيئا أشد عليه من مؤمن عاقل، وأنه يكابد مئة جاهل فيستجرهم حتى يركب رقابهم، فينقادون له حيث شاء، ويكابد المؤمن ____", "o": ["العاقل", "ورغم", "فحسبه", "المقدار"], "h": "راجع: ص٧٦"}, {"t": "fill", "d": 2, "q": "والثاني: ما وضع في الطباع من العلم بجواز الجائزات واستحالة المستحيلات، كالعلم بأن الاثنين أكثر من الواحد، وأن الشخص الواحد لا يكون في مكانين، وهذا الذي عناه بعضهم بقوله في حد العقل: إنه بعض ____", "o": ["العلوم", "الإفادة", "العقاب", "لخضاب"], "h": "راجع: ص٧٧"}, {"t": "fill", "d": 2, "q": "والأول هو المراد بقوله صلى الله ____ وسلم", "o": ["عليه", "مملكته", "مسجدا", "تركع"], "h": "راجع: ص٧٨"}, {"t": "fill", "d": 2, "q": "فالأول هو الأصل، والثاني الفرع الأقرب إليه، والثالث فرع الأول والثاني، إذ بقوة الغريزة والعلوم الضرورية تستفاد علوم التجارب، والرابع هو الثمرة ____ والغاية القصوى", "o": ["الأخيرة", "المجرى", "نفاقه", "الحاجات"], "h": "راجع: ص٧٨"}, {"t": "fill", "d": 2, "q": "بيان شرف العقل أمر ظاهر؛ لأن العقل منبع العلم ومطلعه وأساسه، والعلم يجري منه مجرى الثمرة من الشجرة، والنور من الشمس، وكيف لا يشرف ما هو وسيلة السعادة في الدنيا والآخرة، وكيف يشك في ذلك والبهائم تحترم العاقل لشعورها بفضله واحتياله، ولذلك ترى الأتراك ____ وأجلاف الخلق مع قرب رتبتهم من البهائم يوقرون المشايخ بالطبع، وقد تبين آثار العقل على وجه العاقل فيصير له بذلك سمت وسيما، ولهذا أذعن كثير من المعاندين لرسول الله صلى الله عليه وسلم بنفس رؤيته، وقال عبد الله بن سلام", "o": ["والأكراد", "والبقر", "معذرته", "تصدقوا"], "h": "راجع: ص٧٧"}, {"t": "fill", "d": 2, "q": "صورة كانت في النفس مضمنة بالفطرة ومن لم تكن بصيرته الباطنة ثاقبة لم يعلق به من ____ إلا قشوره وأمثلته دون لبابه وحقائقه", "o": ["الدين", "الأيمن", "سبعة", "يشكر"], "h": "راجع: ص٧٩"}]}], "sum": [["الصفحات", "ص٧٥ - ص٨٠"]], "_nq": 6}, {"id": "l12", "title": "كتاب قواعد العقائد", "group": "كتاب قواعد العقائد", "map": {"center": "كتاب\nقواعد العقائد", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "كتاب قواعد العقائد", "b": [{"pic": ["books", "book"], "cap": "ص٨١ - ص٨٤"}, {"story": ["كتاب قواعد العقائد (١ من ٣)، ص٨١", ["وفيه أربعة فصول:", "**الفصل الأول**", "**في ترجمة عقيدة أهل السنة**", "الحمد لله الذي وفق أهل السنة لحسن الاعتقاد، وسلك بهم منهج الهدى والرشاد، وحفظهم من شك في العقائد وترداد، فعرفوه قديما بلا بداية، مستمر الوجود بلا نهاية، لا يشبه المصنوعات بحال، ولا يدرك عرفانه بحسن ولا خيال، فلا بالتشبيه قالوا، ولا إلى التعطيل مالوا، ولا عن حكم المنقول والمعقول زالوا.", "أحمده حمد من ينزهه عن شبه، وأوحده توحيدا خاليا عن شبه، وأصلي على خاتم أنبيائه وأكرم أصفيائه، وعلى أصحابه وأتباعه وأزواجه وأشياعه وأسلم.", "أما اعتقاد أهل السنة، فهو: أن الله سبحانه موجود، واحد لا شريك له، فرد لا مثل له، صمد لا ضد له، متفرد لا ند له، قديم لا أول له، أزلي لا بداية له، مستمر الوجود لا آخر له، وأنه ليس بجسم، ولا يماثل الأجسام لا في التقدير و لا في قبول الانقسام، وأنه ليس بجوهر، ولا تحله الجواهر، ولا بعرض، ولا تحله الأعراض، ولا يماثل موجودا، ولا يماثله موجود، وليس كمثله شيء، وأنه مستو على العرش على الوجه الذي قاله وبالمعنى الذي أراده، استواء منزها عن المماسة والحلول، لا يحمله العرش، بل العرش وحملته محمولون بلطيف قدرته ومقهورون في قبضته، وأنه لا يحل في شيء، ولا يحل فيه شيء، ولا تحله الحوادث، ولا تعتريه العوارض، ولا يتغير، وأنه مرئي يراه المؤمنون في الجنة، وهو حي قادر", "لا يعتريه عجز، ولا تأخذه سنة ولا نوم، وأنه عالم بجميع المعلومات، لا يعزب عنه مثقال ذرة(١) في الأرض ولا في السماء(١)، يعلم السر وأخفى، ويطلع على هواجس(٢) الضمائر وحركات الخواطر، وخفيات السرائر بعلم قديم لم يزل موصوفا به، وأنه مريد للكائنات، مدبر للحادثات، فلا يجري أمر إلا بقضائه وقدره وحكمه ومشيئته، وأنه سميع بصير لا يعزب عن سمعه مسموع وإن خفي، ولا يغيب عن رؤيته مرئي وإن دق، وأنه متكلم بكلام قديم وكلامه مسموع لقوله: ﴿حَتَّىٰ يَسْمَعَ كَلَٰمَ ٱللَّهِ﴾ [التوبة: ٦]. وأنه خلق الخلق وأعمالهم، وقدر أرزاقهم وآجالهم، وأنه يثيب عباده على الطاعات بحكم الوعد والكرم، لا بحكم الاستحقاق واللزوم، إذ لا يجب عليه فعل، ولا يتصور منه ظلم، وأنه بعث النبي محمدا صلى الله عليه وسلم إلى الخلق كافة، فنسخ بشرعه الشرائع إلا ما قرره، وفضله على سائر الأنبياء، فيجب على العبد امتثال ما أمر به وتصديقه فيما وعد به بعد الموت من سؤال منكر ونكير، وعذاب القبر، والميزان، والحساب، والصراط، والحوض، والشفاعة، وأن يعتقد فضل أبي بكر ثم عمر ثم عثمان ثم علي رضي الله عنهم، وأن يحسن الظن بجميع الصحابة، ويثني عليهم، فهذا معتقد أهل السنة(٣).", "**الفصل الثاني**", "**في وجه التدريج إلى الإرشاد وترتيب درجات الاعتقاد**"]], "ic": "book"}, {"story": ["كتاب قواعد العقائد (٢ من ٣)، ص٨٢", ["ينبغي أن يحفظ الصبي ما ذكرناه في المعتقد في أول نشوئه، فإذا ترعرع فهمه اعتقده، ثم أيقن به وصدقه، ولا تزال أدلة القرآن وحججه تزيد هذا الاعتقاد عنده رسوخا، كما ينمي(٤) البذر بالسقي والتربية، وينبغي أن يصان سمعه عن الجدل", "حاشية: (١-١) سقط من (ط).", "حاشية: (٢) هجس الشيء في صدره يهجس: خطر بباله، أو هو أن يحدث نفسه في صدره مثل الوسواس. القاموس المحيط: (هجس).", "حاشية: (٣) ورد في هامش (ظ) ما نصه: «هذا مذهب السلف الصالح وما صح عن الرسول صلى الله عليه وسلم، وما لا يصح يترك ولا يعتقد».", "حاشية: (٤) في (ظ): «يثمر».", "والكلام غاية الحراسة، فإن ما يفسده الجدل أكثر مما يصلحه، خصوصا للقلب الضعيف، فإن اشتغل الصبي بكسب الدنيا، ولم يقبل على سلوك طريق المعاملة فقد يسلم في الآخرة بما اعتقد؛ لأن الشرع لم يكلف أجلاف العرب أكثر من التصديق الجزم بالظواهر، ولم يكلفهم البحث والتفتيش ونظم الأدلة، وإن سلك طريق الآخرة وساعده التوفيق على استعمال الرياضة والمجاهدة انفتحت له أبواب من الهدى تنكشف له حقائق هذه العقيدة بنور إلهي يقذف في قلبه بسبب المجاهدة، لقوله تعالى: ﴿وَٱلَّذِينَ جَٰهَدُوا۟ فِينَا لَنَهْدِيَنَّهُمْ سُبُلَنَا﴾ [العنكبوت: ٦٩] ومتى كان ممن له بحث ونظر، فسمع كلام أهل البدع، وعلقت بقلبه شبهة(١)، فينبغي أن يحذر ر في ترتيبها المحكم علم قطعا أنها لا تستغني عن موجد أوجدها وصانع دبرها، فإن الحادث لا يستغني في حدوثه عن سبب يحدثه، والعالم حادث، فلا يستغني عن محدث، ولو كان الخالق حادثا لافتقر إلى محدث، فدل على أنه قديم، ولا يجوز أن ينعدم؛ لأن طريان العدم يحتاج إلى سبب كطريان الوجود، وما ثبت قدمه استحال عدمه، وليس بجوهر؛ لأن كل جوهر مختص بحيزه، فهو ساكن فيه أو متحرك عنه، والحركة والسكون حادثان وما لا يخلو عن الحوادث حادث، وليس بجسم؛ لأن الجسم مؤلف، وإذا بطل كونه جوهرا بطل كونه جسما، وليس بعرض؛ لأن العرض ما يحل في الجسم، وقد كان قبل الأجسام، فكيف ____", "o": ["يحلها", "الملح", "والصوم", "الهيئة"], "h": "راجع: ص٨٣"}, {"t": "fill", "d": 2, "q": "بصفاته فليتلق منه، وذلك يكفي المبتدئ، وفي كتابنا المسمى بمنهاج الوصول ما يشفي في الأدلة من حيث المعنى في هذا وفي غيره مما ذكرناه متعلقا بالأصول، فلم نر ____ ها هنا بذلك", "o": ["التطويل", "زبيدة", "يخاطبه", "وأثبت"], "h": "راجع: ص٨٤"}, {"t": "fill", "d": 2, "q": "أحمده حمد من ينزهه عن شبه، وأوحده توحيدا خاليا عن شبه، وأصلي على خاتم أنبيائه ____ أصفيائه، وعلى أصحابه وأتباعه وأزواجه وأشياعه وأسلم", "o": ["وأكرم", "سبعين", "ويخجل", "والحدث"], "h": "راجع: ص٨١"}, {"t": "fill", "d": 2, "q": "الحمد لله الذي وفق أهل السنة لحسن الاعتقاد، وسلك بهم منهج الهدى والرشاد، وحفظهم من شك في العقائد وترداد، فعرفوه قديما بلا بداية، مستمر الوجود بلا نهاية، لا يشبه المصنوعات ____، ولا يدرك عرفانه بحسن ولا خيال، فلا بالتشبيه قالوا، ولا إلى التعطيل مالوا، ولا عن حكم المنقول والمعقول زالوا", "o": ["بحال", "يذكر", "أقصى", "وضعت"], "h": "راجع: ص٨١"}]}], "sum": [["الصفحات", "ص٨١ - ص٨٤"]], "_nq": 6}, {"id": "l13", "title": "كتاب أسرار الطهارة ومهماتها", "group": "كتاب أسرار الطهارة ومهماتها", "map": {"center": "كتاب\nأسرار الطهارة", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "كتاب أسرار الطهارة ومهماتها - القسم ١ من ٣", "b": [{"pic": ["books", "book"], "cap": "ص٨٥ - ص١٠٦"}, {"story": ["كتاب أسرار الطهارة ومهماتها (١ من ١٤)، ص٨٥", ["الحمد لله الذي بنى الأبدان على الأدران وأمر بالنظافة، وخلق الماء ذا رقة وقوة ولطافة، وأكثر من إيجاده لعموم الحاجة إليه رحمة ورأفة.", "أحمده حمد من يعرف نعمه وألطافه، وأقر له بالتوحيد إقرارا سليما من آفة، وأصلي على رسوله محمد الذي ملأ بدعوته الكون وأكنافه، والعالم وأطرافه، وشافة الضلال بالمحو فاستأصل منه الشآفة(١)، وعلى أصحابه أهل الفهم والعلم والظرافة، صلاة تؤمن روعة المصلي عليهم يوم المخافة، وسلم تسليما كثيرا.", "أما بعد: فقد أمر الله عز وجل بالطهارة، ومدح عليها، فقال عز وجل: ﴿فِيهِ رِجَالٌ يُحِبُّونَ أَن يَتَطَهَّرُوا۟ ۚ وَٱللَّهُ يُحِبُّ ٱلْمُطَّهِّرِينَ﴾ [التوبة: ١٠٨]، وقال تعالى: ﴿مَا يُرِيدُ ٱللَّهُ لِيَجْعَلَ عَلَيْكُم مِّنْ حَرَجٍ وَلَٰكِن يُرِيدُ لِيُطَهِّرَكُمْ﴾ [المائدة: ٦] وفي أفراد مسلم من حديث أبي مالك الأشعري عن النبي صلى الله عليه وسلم أنه قال: «الطهور شطر الإيمان»(٢).", "واعلم أن الطهارة لها أربع مراتب:", "الأولى: تطهير الظاهر من الأحداث والأنجاس والفضلات.", "والثانية: تطهير الجوارح من الذنوب والآثام.", "حاشية: (١) الشآفة: الأصل، يقال: استأصل الله شأفته، أي: أزاله من أصله. القاموس المحيط: (شأف).", "حاشية: (٢) أخرجه مسلم (٢٢٣)، والترمذي (٣٥١٢).", "والثالثة: تطهير القلب من الأخلاق المذمومة والرذائل الممقوتة.", "والرابعة: تطهير السر عن ما سوى الله عز وجل، فهذا هو الغاية القصوى، فمن قويت بصيرته سمت(١) إلى هذا المطلوب، ومن عميت بصيرته لم يفهم من مراتب الطهارة إلا المرتبة الأولى، فتراه يضيع أكثر زمانه الشريف في المبالغة في الاستنجاء وغسل الثياب ظنا منه بحكم الوسوسة وقلة العلم أن الطهارة المطلوبة هي هذه فقط، وجهلا بسير المتقدمين واستغراقهم جميع الزمان في تطهير القلوب وتساهلهم في أمر الظاهر حتى إن عمر بن الخطاب رضي الله عنه توضأ من جرة نصرانية(٢)، وكانوا لا يكادون يغسلون أيديهم من الزهم(٣)، ويصلون على الأرض، ويمشون حفاة، ويقتصرون في الاستنجاء على الحجارة.", "ثم قد انتهى الأمر إلى قوم يسمون الرعونة نظافة، ويقولون: هي من الدين، فأكثر زمانهم يمضي في تزيين الظواهر، وبواطنهم خراب محشوة بخبائث الكبر والعجب والجهل والرياء والنفاق، فلو رأو مقتصرا في الاستنجاء على الحجر أو حافيا يمشي على الأرض، أو مصليا على بواري(٤) المسجد من غير سجادة مفروشة، أو ماشيا على الفرش من غير غلاف للقدم، أو متوضئا من آنية عجوز أقاموا في ذلك القيامة، وشددوا الإنكار، وقبوه بالقذر، واستنكفوا من مؤاكلته، فسموا البذاذة(٥) التي هي من الإيمان قذارة، والرعونة نظافة، فانظر كيف كان المنكر معروفا والمعروف منكرا.", "فإن قال قائل: فما تقول فيما قد أحدثوه من هذه الأشياء أتدخل في المنكر أو في المباح؟"]], "ic": "book"}, {"story": ["كتاب أسرار الطهارة ومهماتها (٢ من ١٤)، ص٨٦", ["حاشية: (١) سمت: قصد. القاموس المحيط: (سمت).", "حاشية: (٢) أخرجه الدارقطني في باب الوضوء بماء أهل الكتاب من كتاب الطهارة، سنن الدارقطني: ٣٦/١.", "حاشية: (٣) الزهم: الرائحة التي تصيب اليد من الدسم. النهاية في غريب الحديث ٢/٣٢٣.", "حاشية: (٤) البواري، جمع بارية، وهي: الحصير المنسوج. القاموس المحيط: (بور).", "حاشية: (٥) البذاذة: رثاثة الهيئة والتواضع في اللباس.", "فالجواب: إننا ننظر في كل شيء قد أحدثوه وفي المقصود به، فإن كان فعله مباحا، وهو غير موجب لإسراف، والمقصود به زيادة النظافة لم ينكر، وإن كان موجبا للإسراف؛ مثل استعمال الماء الكثير ثم اعتقد أن ذلك أصل الدين، فهذا منكر، وربما رأى العامي عالما يشدد في الشيء فيظنه واجبا، وإن قصد به تزيين الظاهر لرؤية الخلق كان أفظع وأقبح، أخبرنا محمد بن أبي القاسم قال: أخبرنا حمد بن أحمد قال: أخبرنا أحمد بن عبد الله الحافظ قال: حدثنا أبو حامد بن محمد بن عبد الوهاب قال: حدثنا محمد بن إسحاق النيسابوري قال: حدثنا محمد بن الصباح قال: حدثنا حاتم ـ يعني بن إسماعيل ـ قال: حدثني جعفر عن أبيه أن علي بن الحسين قال: يا بني، لو اتخذت [لي](١) ثوبا للغائط، رأيت الذباب يقع على الشيء ثم يقع علي، ثم انتبه فقال: ما كان لرسول الله صلى الله عليه وسلم ولا لأصحابه إلا ثوب(٢).", "**فصل**", "وينبغي للعالم بشرف الزمان أن لا يتفقه إلا في الأفضل، فإذا رأيت عالما لا يلبس الثوب المقصور حتى يغسله مخافة أن يكون القصار قصر في الغسل، فهذا تدقيق لم يكن في الصحابة، فقد كانوا يصلون في ثياب الكفار إذا غنموها، ولا ينظرون في الاحتمالات الدقيقة في هذا الفن شحا على الزمان وإنفاقا له في الأفضل من النظر في دقائق المعاملات.", "**فصل**", "وإذ قد بينا مراتب الطهارة فنحن نتكلم في نظافة الظاهر فحسب ـ فأما باقي المراتب، فستأتي في ربع المنجيات وربع المهلكات إن شاء الله تعالى ـ فنقول:", "طهارة الظاهر ثلاثة أقسام:", "أحدها: طهارة عن النجس.", "والثاني: طهارة عن الحدث.", "حاشية: (١) ليست في النسخ، وهي من مصدر التخريج.", "حاشية: (٢) أخرجه أبو نعيم في الحلية ٣/١٣٣.", "والثالث: طهارة عن فضلات البدن، كتقليم الأظفار والاستحداد، ونحو ذلك.", "فأما القسم الأول: فإن غسل الأنجاس يجب سبعا عندنا، ولا يعفى عن يسير نجاسة إلا أن تكون دما أو قيحا أو أثر استنجاء، واختلفت الرواية في ريق البغل والحمار وسباع البهائم وجوارح الطير وعرقهن، وبول الخفاش، والنبيذ، والمذي والمني، إذا قلنا: إنه نجس، فروي عن أحمد أنه لا يعفى عن يسير ذلك، وروي عنه أنه كالدم، وجميع الدماء نجسة إلا الكبد والطحال ودم السمك، وفي دم البق والبراغيث روايتان، ولترجع في معرفة الأنجاس إلى كتب الفقه، فإن هذا الكتاب إنما هو للآداب، ويندر ذكر الفقه فيه.", "وأما القسم الثاني: هو طهارة الأحداث ففيه فصول:"]], "ic": "book"}, {"story": ["كتاب أسرار الطهارة ومهماتها (٣ من ١٤)، ص٨٨", ["**الفصل الأول**", "**فيه آداب قضاء الحاجة**", "ينبغي لمن أراد ذلك أن يبعد عن أعين الناظرين، وأن يستتر بشيء إن وجده، وإن كان معه شيء فيه ذكر الله تعالى أزاله، ويقدم رجله اليسرى في الدخول واليمنى في الخروج، ويقول عند دخوله: بسم الله أعوذ بالله من الخبث والخبائث، ومن الرجس النجس الشيطان الرجيم. ولا يكشف عورته قبل الوصول إلى موضع الجلوس، ويرتاد موضعا رخوا لبوله لئلا يعود رشاشه عليه، ولا يستقبل الشمس ولا القمر ولا القبلة إذا كان في الفضاء، ولا يستدبرها، فإن كان بين البنيان، فعلى روايتين، ويعتمد في جلوسه على رجله اليسرى وينصب اليمنى، ولا يبول في شق ولا سرب(١)، ولا تحت شجرة مثمرة، ولا في ظل، ولا قارعة الطريق، ولا يتكلم، فإن عطس حمد الله بقلبه، وإذا انقطع البول مسح بيده اليسرى من أصل ذكره إلى رأسه، ثم ينتره ثلاثا، ولا يطيل المقام وأما ما قد ألفه المتوسوسون من القيام والمشي والتنحنح الكثير ورفع رجل وحط أخرى، فإن ذلك يضعف المثانة", "حاشية: (١) السرب: بيت يتخذه الوحش والدبيب في الأرض. اللسان: (سرب).", "ويستجلب درور البول، وليس من الشريعة في شيء، وليرش المتوسوس على فرجه الماء ليدفع وسوسته إن عرضت.", "وإن أراد الاستنجاء تحول عن موضعه، والاستنجاء واجب لكل ما يخرج من السبيلين إلا الريح، والأفضل أن يبدأ بالقبل، ويستجمر بالحجر ثم يتبعه الماء، وإن أراد الاقتصار على أحدهما فالماء أفضل، فإن عدل عن الماء إلى الحجر أجزأه، ولا يجزئ أقل من ثلاث مسحات، وإن حصل النقاء بدونها، فإن لم تزل العين بالثلاث زاد حتى ينقى، فإن حصل النقاء بالحجر بالرابع أضاف إليه خامسا؛ لأنه يستحب الإيتار، وإنما يجوز الاستجمار إذا لم ينتشر الخارج إلى(١) المخرج إلا بقدر ما جرت به العادة، فإن انتشر إلى الصفحتين ومعظم الحشفة لم يجزه غير الماء.", "وصفة ما يجوز الاستجمار به أن يكون جامدا طاهرا منقيا غير مطعوم، لا حرمة له، غير متصل لحيوان، فيدخل في هذا الحجر وما قام مقامه من الخشب والخزف والخرق والتراب، ويخرج منه المأكولات والروث والرمة وإن كانا طاهرين؛ لأنهما من طعام الجن، وما فيه ذكر الله تعالى من الكاغد(٢) وغيره.", "فأما صفة الاستجمار فعلى أي وجه حصل الإنقاء جاز، غير أن المستحب عند أكثر أصحابنا أن يمر حجرا من مقدم صفحته اليمنى إلى مؤخرها، ثم يديره على اليسرى حتى يرجع به إلى الموضع الذي بدأ منه، ثم يمر الثاني من مقدم صفحته اليسرى كذلك ثم يمر الثالث على المسربة(٣) والصفحتين، وذهب الشريف أبو جعفر(٤) إلى أنه يعم بكل حجر جميع المحل؛ لأنه إذا لم يعم كان تلفيقا لا تكرارا،", "حاشية: (١) في (ظ): «عن».", "حاشية: (٢) الكاغد: القرطاس، وهي الصحيفة يكتب فيها.", "حاشية: (٣) المسربة: مجرى الغائط ومخرجه سميت بذلك لانسراب الخارج منها. الإتحاف للزبيدي ٢/٥٤٦."]], "ic": "book"}, {"story": ["كتاب أسرار الطهارة ومهماتها (٤ من ١٤)، ص٨٩", ["حاشية: (٤) هو عبد الخالق بن عيسى بن أحمد بن محمد العباسي الهاشمي البغدادي، إمام الحنابلة في عصره، صنف «رؤوس المسائل» و«شرح المذهب» و«أدب الفقه»، توفي سنة (٤٧٠هـ). طبقات الحنابلة ٢/٢٣٧.", "وهذا اختيار ابن عقيل، ولا يستجمر بيمينه ولا يستعين بها في ذلك، ولا يكره أن يستعين بها في استعمال الماء للحاجة إلى ذلك.", "وقد تأملت في استعمال الماء صناعة ما رأيتها في الكتب؛ وذلك أن حركة الكف في ذلك الدبر عند غسله ربما أصابت باطن جلد الأنثيين، وربما لم تأت الغسلة الثانية والثالثة على ما أصابته فيبقى نجسا، فمن الاحتراز البداية بالقبل، فإذا فرغ منه مد جلدة الأنثيين فجعلها بين الفخذ والبطن، فحينئذ ينكشف الدبر ويكفي فيه قليل الماء وتؤمن المخاطرة، فإذا فرغ ذلك يده بالحائط أو بالأرض ليزيل أثر الرائحة، فإذا خرج قال: «غفرانك»(١)، «الحمد لله الذي أذهب عني الأذى وعافاني»(٢).", "**الفصل الثاني**", "**في ذكر الوضوء**", "من المستحب لمن أحدث أن يتطهر ليستديم الطهارة، أخبرنا ابن الحصين قال: أنبأنا ابن المذهب قال: أنبأنا أحمد بن جعفر قال: أنبأنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا يزيد بن الحباب قال: حدثني حسين بن واقد قال: أخبرني عبد الله بن بريدة قال: سمعت أبي يقول: أصبح رسول الله صلى الله عليه وسلم فدعى بلالا، فقال: «يا بلال بم سبقتني إلى الجنة؟ ما دخلت الجنة قط إلا سمعت خشخشتك(٣) بين يدي» قال: ما أحدثت إلا توضأت وصليت ركعتين، فقال رسول الله صلى الله عليه وسلم: «بهذا»(٤).", "وينبغي لمن أراد الوضوء أن يستقي الماء لنفسه، فقد روينا من حديث عمر بن", "حاشية: (١) أخرجه الترمذي (٧) من حديث عائشة", "حاشية: (٢) أخرجه ابن ماجه (٣٠١) من حديث أنس.", "حاشية: (٣) هي حركة لها صوت كصوت السلاح.", "حاشية: (٤) أخرجه أحمد (٢٢٩٩٦)، والترمذي (٣٦٨٩)، وابن أبي شيبة ١٢/١٥٠، وابن حبان (٧٠٨٦)، و(٧٠٨٧)، والطبراني في الكبير (١٠١٢)، وأبي عاصم في السنة (١٢٦٩).", "الخطاب أنه قال: رأيت رسول الله صلى الله عليه وسلم يستقي ماء لوضوئه، فبادرت أستقي له فقال: «مه يا عمر إني لا أريد أن يعينني على صلاتي أحد»(١).", "وينبغي للمتوضئ تقديم السواك، وينوي بذلك تطهير فمه للذكر، أخبرنا عبد الأول قال: أنبأنا الداودي قال: أنبأنا ابن أعين السرخسي قال: أخبرنا الفربري قال: حدثنا البخاري قال: حدثنا عبد الله بن يوسف قال: أنبأنا مالك عن أبي الزناد عن الأعرج عن أبي هريرة أن رسول الله صلى الله عليه وسلم قال: «لولا أن أشق على أمتي ـ أو على الناس ـ لأمرتهم بالسواك عند كل صلاة». وأخرجه مسلم أيضا(٢). وأخرجا من حديث حذيفة قال: كان رسول الله صلى الله عليه وسلم إذا قام من الليل يشوص فاه بالسواك(٣). قال أبو عبيد: الشوص والموص: الغسل. وقال ابن الأعرابي الشوص: الدلك والموص: الغسل."]], "ic": "book"}, {"story": ["كتاب أسرار الطهارة ومهماتها (٥ من ١٤)، ص٩١", ["وفي حديث أبي بكر رضي الله عنه عن النبي صلى الله عليه وسلم أنه قال: «السواك مطهرة للفم، مرضاة للرب عز وجل»(٤) وفي حديث ابن عباس عن النبي صلى الله عليه وسلم أنه قال: «أمرت بالسواك حتى ظنت ـ أوحسبت(٥) ـ أنه سينزل علي فيه قرآن»(٦).", "ويستحب السواك عند كل وضوء، وعند كل صلاة، وعند تغير النكهة بالنوم أو طول الأزم(٧) أو أكل ما تكره رائحته.", "ويكون السواك عرضا بعود أراك أو زيتون أو عرجون، ويكون يابسا قد ندي بالماء، ويكره أن يستاك بما يتفتت في الفم أو يجرحه، فإن استاك بإصبعه أو بخرقة لم يصب ال
