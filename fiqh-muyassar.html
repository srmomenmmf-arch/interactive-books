 من شعبان، إذا كان في السماء ما يمنع رؤية الهلال، فإن كانت السماء صحوا فلا شك. ودليل تحريمه: حديث عمار رضي الله عنه قال: «من صام اليوم الذي يشك فيه فقد عصى أبا القاسم». ولقوله ﷺ: «لا يتقدمن أحدكم رمضان بصوم يوم أو يومين، إلا أن يكون رجل كان يصوم صومه، فليصم ذلك اليوم». والمعنى: أن لا يتقدم أحد رمضان بصوم يوم يعد منه بقصد الاحتياط، فإن صومه مرتبط بالرؤية، فلا حاجة إلى التكلف، أما من كان له ورد يصومه فلا شيء عليه؛ لأن ذلك ليس من استقبال رمضان. ويستثنى من ذلك أيضا: القضاء والنذر لوجوبهما.", "5- يحرم صوم يومي العيدين، لحديث أبي سعيد الخدري رضي الله عنه: «نهى النبي ﷺ عن صوم يوم الفطر والنحر»، ولحديث عمر بن الخطاب رضي الله عنه قال: «هذان يومان نهى رسول الله ﷺ عن صيامهما: يوم فطركم من صيامكم، واليوم الآخر تأكلون فيه من نسككم».", "6- يكره صوم أيام التشريق، وهي ثلاثة أيام بعد يوم النحر: الحادي عشر، والثاني عشر، والثالث عشر؛ لقوله ﷺ عنها: «أيام أكل، وشرب، وذكر لله عز وجل». ولقوله ﷺ: «يوم عرفة، ويوم النحر، وأيام التشريق عيدنا أهل الإسلام، وهي أيام أكل وشرب». ورخص في صيامها للمتمتع والقارن إذا لم يجدا ثمن الهدي؛ لحديث عائشة وابن عمر رضي الله عنهما قالا: «لم يرخص في أيام التشريق أن يصمن، إلا لمن لم يجد الهدي»."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 2, "q": "من أفطر يوما من رمضان بغير عذر:", "o": ["يتوب ويقضي", "يقضي فقط", "لا شيء عليه", "يكفر بالشاة"], "h": "راجع: ص173 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "من أخر القضاء إلى رمضان الثاني بغير عذر:", "o": ["عليه مع القضاء إطعام مسكين عن كل يوم", "لا شيء عليه", "يسقط القضاء", "يصوم شهرين"], "h": "راجع: ص174 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "قضاء رمضان:", "o": ["لا يشترط فيه التتابع", "يشترط فيه التتابع", "لا يصح متفرقا", "لا يصح متتابعا"], "h": "راجع: ص174 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "من صام رمضان وأتبعه ستا من شوال:", "o": ["كان كصيام الدهر", "كان كصيام شهر", "غفر له", "له عمرة"], "h": "راجع: ص174 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "صيام يوم عرفة يكفر:", "o": ["السنة التي قبله والسنة التي بعده", "سنة واحدة", "شهرا", "ذنوب الشهر"], "h": "راجع: ص175 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "الأيام البيض هي:", "o": ["الثالث عشر والرابع عشر والخامس عشر", "الأول والثاني والثالث", "العاشر والحادي عشر", "الأخيرة"], "h": "راجع: ص175 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "أفضل الصيام بعد رمضان:", "o": ["شهر الله المحرم", "شهر رجب", "شعبان", "شوال"], "h": "راجع: ص176 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "يحرم صوم:", "o": ["يومي العيدين", "الاثنين", "عرفة", "عاشوراء"], "h": "راجع: ص178 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "أيام التشريق هي:", "o": ["الحادي عشر والثاني عشر والثالث عشر", "الأول والثاني", "التاسع والعاشر", "العاشر فقط"], "h": "راجع: ص178 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "يكره إفراد يوم الجمعة بالصيام.", "a": true, "h": "راجع: ص176 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "يحرم صيام يوم الشك.", "a": true, "h": "راجع: ص177 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "يستحب للحاج صيام يوم عرفة.", "a": false, "h": "راجع: ص175 (المسألة الثانية)"}]}], "sum": [["قضاء الصيام", "ص173-178"], ["الصيام المستحب", "ص173-178"], ["ما يكره ويحرم من الصيام", "ص173-178"]]}, {"id": "l38", "title": "الباب الخامس: في الاعتكاف", "group": "الكتاب الرابع: الصيام", "map": {"center": "الباب الخامس\nالصيام", "nodes": [{"t": "تعريف الاعتكاف وحكمه", "s": []}, {"t": "شروط الاعتكاف", "s": []}, {"t": "زمان الاعتكاف ومستحباته وما يباح ل", "s": []}, {"t": "مبطلات الاعتكاف", "s": []}]}, "paras": [{"t": "الباب الخامس: في الاعتكاف", "b": [{"pic": ["crescent-moon", "book", "scroll"], "cap": "ص178-182"}, {"story": ["المسألة الأولى: تعريف الاعتكاف وحكمه", ["وفيه مسائل:", "1- تعريفه: الاعتكاف في اللغة: لزوم الشيء، وحبس النفس عليه.", "وفي الشرع: لزوم المسلم المميز مسجدا لطاعة الله عز وجل.", "2- حكمه: وهو سنة وقربة؛ لقوله عز وجل: ﴿أن طهرا بيتي للطائفين والعاكفين والركع السجود﴾ [البقرة: 125]. وهذه الآية دليل على مشروعيته حتى في الأمم السابقة. وقوله تعالى: ﴿ولا تباشروهن وأنتم عاكفون في المساجد﴾ [البقرة: 187].", "وعن عائشة رضي الله عنها: «أن النبي ﷺ كان يعتكف العشر الأواخر من رمضان حتى توفاه الله».", "وأجمع المسلمون على مشروعيته، وأنه سنة، لا يجب على المرء إلا أن يوجبه على نفسه كأن ينذره.", "فثبتت سنية الاعتكاف ومشروعيته بالكتاب، والسنة، والإجماع."]], "ic": "scroll"}, {"story": ["المسألة الثانية: شروط الاعتكاف", ["الاعتكاف عبادة لها شروط لا تصح إلا بها، وهي:", "1- أن يكون المعتكف مسلما مميزا عاقلا: فلا يصح الاعتكاف من الكافر، ولا المجنون، ولا الصبي غير المميز؛ أما البلوغ والذكورية فلا يشترطان، فيصح الاعتكاف من غير البالغ إذا كان مميزا، وكذلك من الأنثى.", "2- النية: لقوله ﷺ: «إنما الأعمال بالنيات». فينوي المعتكف لزوم معتكفه؛ قربة وتعبدا لله عز وجل.", "3- أن يكون الاعتكاف في مسجد: لقوله تعالى: ﴿وأنتم عاكفون في المساجد﴾ [البقرة: 187]. ولفعله ﷺ حيث كان يعتكف في المسجد، ولم ينقل عنه أنه اعتكف في غيره.", "4- أن يكون المسجد الذي يعتكف فيه تقام فيه صلاة الجماعة: وذلك إذا كانت مدة الاعتكاف تتخللها صلاة مفروضة، وكان المعتكف ممن تجب عليه الجماعة؛ لأن الاعتكاف في مسجد لا تقام فيه صلاة الجماعة وهي واجبة عليه، يقتضي ترك الجماعة، أو تكرار خروج المعتكف كل وقت، وهذا ينافي المقصود من الاعتكاف. أما المرأة فيصح اعتكافها في كل مسجد سواء أقيمت فيه الجماعة أم لا. هذا إذا لم يترتب على اعتكافها فتنة، فإن ترتب على ذلك فتنة منعت. والأفضل أن يكون المسجد الذي يعتكف فيه تقام فيه الجمعة، لكن ذلك ليس شرطا للاعتكاف.", "5- الطهارة من الحدث الأكبر: فلا يصح اعتكاف الجنب، ولا الحائض، ولا النفساء؛ لعدم جواز مكث هؤلاء في المسجد.", "أما الصيام فليس بشرط في الاعتكاف؛ لما روي عن ابن عمر رضي الله عنهما أن عمر قال: يا رسول الله إني نذرت في الجاهلية أن أعتكف ليلة في المسجد الحرام، فقال: «أوف بنذرك». فلو كان الصوم شرطا لما صح اعتكافه في الليل، لأنه لا صيام فيه. ولأنهما عبادتان منفصلتان، فلا يشترط لإحداهما وجود الأخرى."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: زمان الاعتكاف ومستحباته وما يباح للمعتكف", ["1- زمن الاعتكاف ووقته: المكث في المسجد مقدارا من الزمن هو ركن الاعتكاف، فلو لم يقع المكث في المسجد لم ينعقد الاعتكاف، وفي أقل مدة الاعتكاف خلاف بين أهل العلم. والصحيح -إن شاء الله- أن وقت الاعتكاف ليس لأقله حد، فيصح الاعتكاف مقدارا من الزمن، وإن قل، إلا أن الأفضل ألا يقل الاعتكاف عن يوم أو ليلة؛ لأنه لم ينقل عن النبي ﷺ ولا عن أحد من أصحابه الاعتكاف فيما دون ذلك.", "وأفضل أوقات الاعتكاف العشر الأواخر من رمضان؛ لحديث عائشة رضي الله عنها السابق: «أن النبي ﷺ كان يعتكف العشر الأواخر من رمضان حتى توفاه الله». فإن اعتكف في غير هذا الوقت، جاز ذلك لكنه خلاف الأولى والأفضل.", "ومن نوى اعتكاف العشر الأواخر من رمضان صلى الفجر من صبيحة اليوم الحادي والعشرين في المسجد الذي ينوي الاعتكاف فيه، ثم يدخل في اعتكافه، وينتهي بغروب شمس آخر يوم من رمضان.", "2- مستحباته: والاعتكاف عبادة يخلو فيها العبد بخالقه، ويقطع العلائق عما سواه، فيستحب للمعتكف أن يتفرغ للعبادة، فيكثر من الصلاة، والذكر، والدعاء، وقراءة القرآن، والتوبة، والاستغفار، ونحو ذلك من الطاعات التي تقربه إلى الله تعالى.", "3- ما يباح للمعتكف: ويباح للمعتكف الخروج من المسجد لما لا بد منه؛ كالخروج للأكل والشرب، إذا لم يكن له من يحضرهما، والخروج لقضاء الحاجة، والوضوء من الحدث، والاغتسال من الجنابة.", "ويباح له التحدث إلى الناس فيما يفيد، والسؤال عن أحوالهم، أما التحدث فيما لا يفيد، وفيما لا ضرورة فيه، فإنه ينافي مقصود الاعتكاف وما شرع من أجله. ويباح له أن يزوره بعض أهله وأقاربه، وأن يتحدث إليه ساعة من زمان، والخروج من معتكفه لتوديعهم؛ لحديث صفية رضي الله عنها قالت: «كان رسول الله ﷺ معتكفا فأتيت ليلا، فحدثته ثم قمت فانقلبت، فقام معي ليقلبني...» الحديث. ومعنى ليقلبني: يردني إلى بيتي.", "وللمعتكف أن يأكل، ويشرب، وينام في المسجد، مع المحافظة على نظافة المسجد، وصيانته."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: مبطلات الاعتكاف", ["يبطل الاعتكاف بما يلي:", "1- الخروج من المسجد لغير حاجة عمدا، وإن قل وقت الخروج؛ لحديث عائشة رضي الله عنها: «وكان لا يدخل البيت إلا لحاجة إذا كان معتكفا»، ولأن الخروج يفوت المكث في المعتكف، وهو ركن الاعتكاف.", "2- الجماع، ولو كان ذلك ليلا، أو كان الجماع خارج المسجد؛ لقوله تعالى: ﴿ولا تباشروهن وأنتم عاكفون في المساجد﴾ [البقرة: 187]. وفي حكمه الإنزال بشهوة بدون جماع كالاستمناء، ومباشرة الزوجة في غير الفرج.", "3- ذهاب العقل، فيفسد الاعتكاف بالجنون والسكر؛ لخروج المجنون والسكران عن كونهما من أهل العبادة.", "4- الحيض والنفاس؛ لعدم جواز مكث الحائض والنفساء في المسجد.", "5- الردة؛ لمنافاتها العبادة، ولقوله تعالى: ﴿لئن أشركت ليحبطن عملك﴾ [الزمر: 65]."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "الاعتكاف في اللغة:", "o": ["لزوم الشيء وحبس النفس عليه", "السفر", "القيام", "الذكر"], "h": "راجع: ص178 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "حكم الاعتكاف:", "o": ["سنة", "واجب", "مكروه", "حرام"], "h": "راجع: ص178 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "يشترط في المعتكف:", "o": ["أن يكون مسلما مميزا عاقلا", "أن يكون بالغا ذكرا", "أن يكون صائما", "أن يكون غنيا"], "h": "راجع: ص179 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "الاعتكاف يكون في:", "o": ["مسجد", "البيت", "السوق", "أي مكان"], "h": "راجع: ص179 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "الصيام في الاعتكاف:", "o": ["ليس بشرط", "شرط", "واجب", "محرم"], "h": "راجع: ص180 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "أفضل أوقات الاعتكاف:", "o": ["العشر الأواخر من رمضان", "شعبان", "محرم", "ذو الحجة"], "h": "راجع: ص180 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "يباح للمعتكف الخروج من المسجد:", "o": ["لما لا بد منه كقضاء الحاجة", "للتجارة", "للنزهة", "لزيارة الأصدقاء"], "h": "راجع: ص181 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "من مبطلات الاعتكاف:", "o": ["الجماع", "الأكل", "النوم", "القراءة"], "h": "راجع: ص182 (المسألة الرابعة)"}, {"t": "tf", "d": 2, "q": "لا يصح اعتكاف الجنب والحائض والنفساء.", "a": true, "h": "راجع: ص180 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "يبطل الاعتكاف بالخروج من المسجد لغير حاجة عمدا.", "a": true, "h": "راجع: ص181 (المسألة الرابعة)"}, {"t": "tf", "d": 2, "q": "يبطل الاعتكاف بالردة.", "a": true, "h": "راجع: ص182 (المسألة الرابعة)"}]}], "sum": [["تعريف الاعتكاف وحكمه", "ص178-182"], ["شروط الاعتكاف", "ص178-182"], ["زمان الاعتكاف ومستحباته وما يباح ل", "ص178-182"], ["مبطلات الاعتكاف", "ص178-182"]]}, {"id": "l39", "title": "الباب الأول: في مقدمات الحج", "group": "الكتاب الخامس: الحج", "map": {"center": "الباب الأول\nالحج", "nodes": [{"t": "في تعريف الحج", "s": []}, {"t": "حكم الحج وفضله", "s": []}, {"t": "هل يجب الحج في العمر أكثر من مرة؟", "s": []}, {"t": "شروط الحج", "s": []}, {"t": "حكم العمرة وأدلة ذلك", "s": []}]}, "paras": [{"t": "الباب الأول: في مقدمات الحج", "b": [{"pic": ["kaaba", "book", "scroll"], "cap": "ص183-187"}, {"story": ["المسألة الأولى: في تعريف الحج", ["الحج في اللغة: القصد.", "وفي الشرع: التعبد لله بأداء المناسك في مكان مخصوص في وقت مخصوص، على ما جاء في سنة رسول الله ﷺ."]], "ic": "scroll"}, {"story": ["المسألة الثانية: حكم الحج وفضله", ["1- حكم الحج: الحج أحد أركان الإسلام وفروضه العظام، لقوله تعالى: ﴿ولله على الناس حج البيت من استطاع إليه سبيلا ومن كفر فإن الله غني عن العالمين﴾ [آل عمران: 97]. ولقوله تعالى: ﴿وأتموا الحج والعمرة لله﴾ [البقرة: 196]. ولحديث ابن عمر مرفوعا: «بني الإسلام على خمس...»، وذكر منها الحج.", "وقد أجمعت الأمة على وجوب الحج على المستطيع مرة واحدة في العمر.", "2- فضله: ورد في فضل الحج أحاديث كثيرة، منها:", "حديث أبي هريرة مرفوعا: «العمرة إلى العمرة كفارة لما بينهما، والحج المبرور ليس له جزاء إلا الجنة». وقال ﷺ: «من حج لله فلم يرفث، ولم يفسق، رجع كيوم ولدته أمه». إلى غير ذلك من الأحاديث."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: هل يجب الحج في العمر أكثر من مرة؟", ["لا يجب الحج في العمر إلا مرة واحدة وما زاد على ذلك فهو تطوع؛ لحديث أبي هريرة أن النبي ﷺ قال: «أيها الناس قد فرض الله عليكم الحج، فحجوا»، فقال رجل: أكل عام يا رسول الله؟ فقال: «لو قلت: نعم لوجبت، ولما استطعتم». ولأن النبي ﷺ لم يحج بعد هجرته إلى المدينة إلا حجة واحدة. وقد أجمع العلماء على أن الحج لا يجب على المستطيع إلا مرة واحدة.", "وعليه أن يبادر بأدائه إذا تحققت شروطه، ويأثم بتأخيره لغير عذر؛ لقوله ﷺ: «تعجلوا إلى الحج، فإن أحدكم لا يدري ما يعرض له». وقد روي مرفوعا وموقوفا من طرق يقوي بعضها بعضا: «من استطاع الحج فلم يحج، فليمت إن شاء يهوديا، وإن شاء نصرانيا»."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: شروط الحج", ["يشترط لوجوب الحج خمسة شروط:", "1- الإسلام: فلا يجب الحج على الكافر ولا يصح منه؛ لأن الإسلام شرط لصحة العبادة.", "2- العقل: فلا يجب الحج على المجنون ولا يصح منه في حال جنونه؛ لأن العقل شرط للتكليف، والمجنون ليس من أهل التكليف، ومرفوع عنه القلم، حتى يفيق، كما في حديث علي رضي الله عنه أن رسول الله ﷺ قال: «رفع القلم عن ثلاثة: عن النائم حتى يستيقظ، وعن الصبي حتى يبلغ، وعن المجنون حتى يفيق».", "3- البلوغ: فلا يجب الحج على الصبي؛ لأنه ليس من أهل التكليف ومرفوع عنه القلم حتى يبلغ للحديث الماضي: «رفع القلم عن ثلاثة...». لكن لو حج حجه صحيح، وينوي له وليه إذا لم يكن مميزا، ولا يكفيه عن حجة الإسلام، بلا خلاف بين أهل العلم؛ لما رواه ابن عباس رضي الله عنهما أن امرأة رفعت صبيا فقالت: يا رسول الله ألهذا حج؟ قال: «نعم، ولك أجر». ولقوله ﷺ: «أيما صبي حج ثم بلغ فعليه حجة أخرى، وأيما عبد حج ثم عتق فعليه حجة أخرى».", "4- الحرية: فلا يجب الحج على العبد؛ لأنه مملوك لا يملك شيئا، لكن لو حج صح حجه بإذن سيده. وقد أجمع أهل العلم على أن المملوك إذا حج في حال رقه، ثم أعتق، فعليه حجة الإسلام، إذا وجد إلى ذلك سبيلا، ولا يجزئ عنه ما حج في حال رقه؛ لقوله ﷺ في الحديث الماضي ذكره: «وأيما عبد حج ثم عتق فعليه حجة أخرى».", "5- الاستطاعة: لقوله تعالى: ﴿ولله على الناس حج البيت من استطاع إليه سبيلا﴾ [آل عمران: 97]. فغير المستطيع ماليا، بأن كان لا يملك زادا يكفيه ويكفي من يعوله، أو كان لا يملك راحلة توصله إلى مكة وترده. أو بدنيا بأن كان شيخا كبيرا، أو مريضا لا يتمكن من الركوب وتحمل مشاق السفر، أو كان الطريق إلى الحج غير آمن، كأن يكون به قطاع طرق، أو وباء، أو غير ذلك مما يخاف الحاج معه على نفسه وماله، فإنه لا يجب عليه الحج حتى يستطيع، وقد قال تعالى: ﴿لا يكلف الله نفسا إلا وسعها﴾ [البقرة: 286] والاستطاعة من الوسع الذي ذكره الله.", "ومن الاستطاعة في حج المرأة: وجود المحرم الذي يرافقها في سفر الحج؛ لأنه لا يجوز لها السفر للحج ولا لغيره بدون محرم؛ لقوله ﷺ: «لا يحل لامرأة تؤمن بالله واليوم الآخر، أن تسافر سفرا يكون ثلاثة أيام فصاعدا، إلا ومعها أبوها، أو ابنها، أو زوجها، أو أخوها، أو ذو محرم منها». ولقوله ﷺ للرجل الذي قال: إن امرأتي خرجت حاجة، وإني اكتتبت في غزوة كذا، قال: «انطلق فحج مع امرأتك». فإذا حجت بدون محرم فحجها صحيح، وتكون آثمة."]], "ic": "scroll"}, {"story": ["المسألة الخامسة: حكم العمرة وأدلة ذلك", ["تجب العمرة على المستطيع مرة واحدة في العمر؛ لقوله تعالى: ﴿وأتموا الحج والعمرة لله﴾ [البقرة: 196]، ولقول النبي ﷺ لعائشة لما سألته: هل على النساء جهاد؟ قال: «نعم عليهن جهاد، لا قتال فيه: الحج والعمرة»، ولأبي رزين لما سأله أن أباه لا يستطيع الحج، ولا العمرة، ولا الظعن. قال: «حج عن أبيك واعتمر».", "وأركانها ثلاثة: الإحرام، والطواف، والسعي."]], "ic": "scroll"}, {"story": ["المسألة السادسة: مواقيت الحج والعمرة", ["الميقات لغة: هو الحد. وشرعا: هو موضع العبادة أو زمنها، فتنقسم المواقيت إلى: زمانية ومكانية.", "أما المواقيت الزمانية للحج والعمرة:", "فالعمرة يجوز أداؤها في جميع أوقات السنة.", "وأما الحج فله أشهر معلومات لا يصح شيء من أعمال الحج إلا فيها؛ لقوله تعالى: ﴿الحج أشهر معلومات﴾ [البقرة: 197]، وهي شوال، وذو القعدة، وذو الحجة.", "وأما المواقيت المكانية للحج والعمرة: فهي الحدود التي لا يجوز للحاج والمعتمر أن يتجاوزها إلا بإحرام. وقد بينها رسول الله ﷺ في حديث ابن عباس قال: «وقت رسول الله ﷺ لأهل المدينة ذا الحليفة ولأهل الشام الجحفة ولأهل نجد قرن المنازل ولأهل اليمن يلملم هن لهن ولمن أتى عليهن من غير أهلهن ممن أراد الحج والعمرة ومن كان دون ذلك فمن حيث أنشأ، حتى أهل مكة من مكة».", "فمن تعدى هذه المواقيت بدون إحرام وجب عليه الرجوع إليها إن أمكن، وإن لم يتمكن من الرجوع فعليه فدية، وهي شاة يذبحها في مكة، ويوزعها على مساكين الحرم.", "أما من كانت منازلهم دون المواقيت، فإنهم يحرمون من أماكنهم؛ لقوله ﷺ في الحديث السابق: «ومن كان دون ذلك، فمن حيث أنشأ»."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "الحج في اللغة:", "o": ["القصد", "السفر", "الزيارة", "الطواف"], "h": "راجع: ص183 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "الحج واجب في العمر:", "o": ["مرة واحدة", "كل عام", "مرتين", "ثلاث مرات"], "h": "راجع: ص183 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "الحج لا يجب على:", "o": ["الصبي", "البالغ العاقل المستطيع", "الحر المستطيع", "المسلم المستطيع"], "h": "راجع: ص184 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "من حج وهو عبد ثم أعتق:", "o": ["عليه حجة الإسلام", "لا شيء عليه", "يكفيه ما حج", "يسقط عنه الحج"], "h": "راجع: ص185 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "من الاستطاعة في حج المرأة:", "o": ["وجود المحرم", "إذن القاضي", "وجود صديقة", "السن"], "h": "راجع: ص185 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "أركان العمرة:", "o": ["الإحرام والطواف والسعي", "الإحرام والوقوف بعرفة", "الطواف فقط", "السعي والرمي"], "h": "راجع: ص186 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "أشهر الحج هي:", "o": ["شوال وذو القعدة وذو الحجة", "رمضان وشوال", "محرم وصفر", "رجب وشعبان"], "h": "راجع: ص186 (المسألة السادسة)"}, {"t": "mcq", "d": 2, "q": "ميقات أهل المدينة:", "o": ["ذو الحليفة", "الجحفة", "قرن المنازل", "يلملم"], "h": "راجع: ص186 (المسألة السادسة)"}, {"t": "mcq", "d": 2, "q": "ميقات أهل اليمن:", "o": ["يلملم", "الجحفة", "ذو الحليفة", "قرن المنازل"], "h": "راجع: ص186 (المسألة السادسة)"}, {"t": "tf", "d": 2, "q": "العمرة يجوز أداؤها في جميع أوقات السنة.", "a": true, "h": "راجع: ص186 (المسألة السادسة)"}, {"t": "tf", "d": 2, "q": "يجب على الصبي الحج.", "a": false, "h": "راجع: ص184 (المسألة الرابعة)"}]}], "sum": [["في تعريف الحج", "ص183-187"], ["حكم الحج وفضله", "ص183-187"], ["هل يجب الحج في العمر أكثر من مرة؟", "ص183-187"], ["شروط الحج", "ص183-187"]]}, {"id": "l40", "title": "الباب الثاني: في أركان الحج وواجباته", "group": "الكتاب الخامس: الحج", "map": {"center": "الباب الثاني\nالحج", "nodes": [{"t": "في أركان الحج", "s": []}, {"t": "واجبات الحج", "s": []}]}, "paras": [{"t": "الباب الثاني: في أركان الحج وواجباته", "b": [{"pic": ["kaaba", "book", "scroll"], "cap": "ص187-189"}, {"story": ["المسألة الأولى: في أركان الحج", ["أركان الحج أربعة، هي:", "1- الإحرام: وهو نية الحج وقصده؛ لأن الحج عبادة محضة فلا يصح بغير نية بإجماع المسلمين، والأصل في ذلك قول النبي ﷺ: «إنما الأعمال بالنيات»، والنية محلها القلب، لكن الأفضل في الحج النطق بها، معينا النسك الذي ينواه، لثبوت ذلك من فعله ﷺ.", "2- الوقوف بعرفة: وهو ركن بالإجماع، ودليله قوله ﷺ: «الحج عرفة»، ووقت الوقوف: من بعد الزوال يوم عرفة، إلى طلوع فجر يوم النحر.", "3- طواف الزيارة: ويسمى طواف الإفاضة؛ لأنه يكون بعد الإفاضة من عرفة، ويسمى طواف الفرض، وهو ركن بالإجماع؛ لقوله تعالى: ﴿ثم ليقضوا تفثهم وليوفوا نذورهم وليطوفوا بالبيت العتيق﴾ [الحج: 29].", "4- السعي بين الصفا والمروة: وهو ركن؛ لحديث عائشة رضي الله عنها قالت: ما أتم الله حج امرئ، ولا عمرته لم يطف بين الصفا والمروة، ولقوله ﷺ: «اسعوا، فإن الله كتب عليكم السعي».", "وهذه الأركان لا يتم الحج إلا بها، فمن ترك ركنا منها لم يتم حجه، حتى يأتي به."]], "ic": "scroll"}, {"story": ["المسألة الثانية: واجبات الحج", ["1- الإحرام من الميقات المعتبر له شرعا.", "2- الوقوف بعرفة إلى الليل لمن أتاها نهارا؛ لأن النبي ﷺ وقف إلى الغروب - كما سيأتي في صفة حجته-، وقال: «خذوا عني مناسككم».", "3- المبيت بمزدلفة ليلة النحر إلى منتصف الليل، إن وافاها قبله لفعله ﷺ ذلك.", "4- المبيت بمنى ليالي أيام التشريق.", "5- رمي الجمرات مرتبا.", "6- الحلق أو التقصير؛ لقوله تعالى: ﴿محلقين رءوسكم ومقصرين﴾ [الفتح: 27]، ولفعله ﷺ، وأمره بذلك.", "7- طواف الوداع لغير الحائض والنفساء؛ لحديث ابن عباس رضي الله عنهما: «أمر الناس أن يكون آخر عهدهم بالبيت، إلا أنه خفف عن المرأة الحائض».", "فمن ترك واجبا من هذه الواجبات عامدا أو ناسيا جبره بدم وصح حجه، لما ثبت عن ابن عباس أنه قال: «من نسي من نسكه شيئا أو تركه فليرق دما».", "وما سوى ما ذكر من الأعمال فهو سنة. ومن أهم هذه السنن:", "1- الاغتسال للإحرام والتطيب ولبس ثوبين أبيضين.", "2- تقليم الأظافر وأخذ شعر العانة والإبط وقص الشارب وما يلزم أخذه.", "3- طواف القدوم للمفرد والقارن.", "4- الرمل في الثلاثة الأشواط الأولى من طواف القدوم.", "5- الاضطباع في طواف القدوم، وهو: أن يجعل وسط الرداء تحت عاتقه الأيمن، وطرفيه على عاتقه الأيسر.", "6- المبيت بمنى ليلة عرفة.", "7- التلبية من حين الإحرام إلى رمي جمرة العقبة.", "8- الجمع بين المغرب والعشاء بمزدلفة تقديما.", "9- الوقوف بمزدلفة عند المشعر الحرام من الفجر إلى الشروق إن تيسر، وإلا فمزدلفة كلها موقف."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 2, "q": "عدد أركان الحج:", "o": ["أربعة", "ثلاثة", "خمسة", "ستة"], "h": "راجع: ص187 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "الإحرام هو:", "o": ["نية الحج وقصده", "لبس الثياب", "الطواف", "الوقوف"], "h": "راجع: ص187 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "قال النبي ﷺ:", "o": ["الحج عرفة", "الحج مزدلفة", "الحج منى", "الحج مكة"], "h": "راجع: ص187 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "طواف الزيارة يسمى أيضا:", "o": ["طواف الإفاضة", "طواف الوداع", "طواف القدوم", "السعي"], "h": "راجع: ص187 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "من ترك واجبا من واجبات الحج:", "o": ["جبره بدم وصح حجه", "بطل حجه", "لا شيء عليه", "يعيد الحج"], "h": "راجع: ص188 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "يسقط طواف الوداع عن:", "o": ["الحائض والنفساء", "المريض", "المسافر", "الشيخ"], "h": "راجع: ص188 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "السعي بين الصفا والمروة ركن من أركان الحج.", "a": true, "h": "راجع: ص188 (المسألة الأولى)"}, {"t": "tf", "d": 2, "q": "المبيت بمنى ليالي أيام التشريق من واجبات الحج.", "a": true, "h": "راجع: ص188 (المسألة الثانية)"}]}], "sum": [["في أركان الحج", "ص187-189"], ["واجبات الحج", "ص187-189"]]}, {"id": "l41", "title": "الباب الثالث: في المحظورات والفدية والهدي", "group": "الكتاب الخامس: الحج", "map": {"center": "الباب الثالث\nالحج", "nodes": [{"t": "في محظورات الإحرام", "s": []}, {"t": "فدية المحظورات", "s": []}, {"t": "في الهدي وأحكامه", "s": []}]}, "paras": [{"t": "الباب الثالث: في المحظورات والفدية والهدي", "b": [{"pic": ["kaaba", "book", "scroll"], "cap": "ص189-194"}, {"story": ["المسألة الأولى: في محظورات الإحرام", ["وهي ما يمتنع على المحرم فعله شرعا، وهي تسعة:", "1- لبس المخيط، وهو المفصل على قدر البدن أو العضو من السراويل والثياب وغيرهما، إلا لمن لم يجد إزارا فيجوز له لبس السراويل. وهذا المحظور خاص بالرجال، أما المرأة فتلبس ما شاءت من الثياب إلا النقاب والقفازين، كما سيأتي.", "2- استعمال الطيب في بدنه أو ثيابه، وكذلك تعمد شمه، ويجوز له شم ما له رائحة طيبة من نبات الأرض، وله الاكتحال بما لا طيب فيه.", "3- إزالة الشعر والظفر، ذكرا كان أو أنثى، ويجوز له غسل رأسه برفق، وإن انكسر ظفره جاز له رميه.", "4- تغطية رأس الرجل بملاصق له، وله الاستظلال بالخيمة ونحوها كشجرة.", "ويجوز للمحرمة أن تستظل بالشمسية عند الحاجة، والمرأة ممنوعة من تغطية وجهها بما عمل على قدره كالنقاب والبرقع، ويجب عليها تغطية وجهها بالخمار عند وجود الرجال الأجانب، وممنوعة من لبس القفازين، وتلبس ما شاءت من الثياب مما يناسبها. فمن تطيب، أو غطى رأسه، أو لبس مخيطا، جاهلا أو ناسيا أو مكرها، فلا شيء عليه؛ لقوله ﷺ: «عفي لأمتي الخطأ والنسيان وما استكرهوا عليه».", "فمتى علم الجاهل، أو ذكر الناسي، أو زال الإكراه، فعليه منع استدامة هذا المحظور.", "5- عقد النكاح له ولغيره.", "6- الوطء في الفرج، وهو مفسد للحج قبل التحلل الأول، ولو بعد الوقوف بعرفة.", "7- المباشرة فيما دون الفرج، ولا تفسد النسك، وكذا القبلة واللمس والنظر بشهوة.", "8- قتل صيد البر واصطياده، ويجوز له قتل الفواسق التي أمر النبي ﷺ بقتلها في الحل والحرم، للمحرم وغيره، وهي: الغراب والفأرة والعقرب والحدأة والحية، والكلب العقور. ولا يجوز له الإعانة على قتل صيد البر، لا بالإشارة ولا بغيرها، ولا يجوز أكل ما صيد من أجله.", "9- لا يجوز للمحرم ولا لغيره قطع شجر الحرم أو نباته الرطب غير المؤذي، ويجوز قطع الأوصال المؤذية في الطريق، ويستثنى من شجر الحرم الإذخر، وما أنبته الآدميون بالإجماع."]], "ic": "scroll"}, {"story": ["المسألة الثانية: فدية المحظورات", ["- بالنسبة لحلق الشعر، وتقليم الأظافر، ولبس المخيط، والطيب، وتغطية الرأس، والإمناء بنظرة، والمباشرة بغير إنزال المني: الفدية فيها على التخيير بين أصناف ثلاثة:", "1- صيام ثلاثة أيام.", "2- أو إطعام ستة مساكين.", "3- أو ذبح شاة.", "لقوله ﷺ لكعب بن عجرة حين آذاه هوام رأسه: «احلق رأسك وصم ثلاثة أيام أو أطعم ستة مساكين أو انسك شاة». وقيست عليه بقية الأفعال؛ لأنها محرمة بالإحرام، ولا تفسد الحج.", "- وأما بالنسبة لقتل الصيد: فيخير قاتل الصيد بين ذبح المثل من النعم، أو تقويم المثل بمحل التلف، ويشتري بقيمته طعاما يجزئ في الفطرة، فيطعم كل مسكين مدا بر، أو نصف صاع من غيره، كتمر أو شعير، أو يصوم عن إطعام كل مسكين يوما؛ لقوله تعالى: ﴿ومن قتله منكم متعمدا فجزاء مثل ما قتل من النعم يحكم به ذوا عدل منكم هديا بالغ الكعبة أو كفارة طعام مساكين أو عدل ذلك صياما﴾ [المائدة: 95].", "- وأما بالنسبة للوطء في الحج قبل التحلل الأول، وإنزال المني بمباشرة، أو استمناء، أو تقبيل، أو لمس بشهوة، أو تكرار نظر: فإنه يفسد الحج، حتى وإن كان المجامع ساهيا أو جاهلا أو مكرها. ويجب في ذلك بدنة، وقضاء الحج، والتوبة.", "وأما بعد التحلل الأول، فإنه لا يفسد الحج، ويجب في ذلك شاة.", "- وأما بالنسبة لعقد النكاح: فلا يجب في ذلك فدية، وإنما يكون العقد فاسدا.", "- وأما بالنسبة لقطع شجر الحرم ونباته الذي لم يزرعه الآدمي: فتضمن الشجرة الصغيرة عرفا بشاة وما فوقها ببقرة، ويضمن النبات والورق بقيمته؛ لأنه متقوم.", "هذا إذا كان مرتكب المحظور متعمدا، أما الجاهل والناسي فلا شيء عليهما."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: في الهدي وأحكامه", ["الهدي: ما يهدى إلى البيت الحرام من بهيمة الأنعام -الإبل والبقر والغنم- تقربا إلى الله تعالى.", "أنواع الهدي:", "1- هدي التمتع والقران: وهو واجب على من لم يكن حاضر المسجد الحرام، وهو دم نسك لا جبران؛ لقوله تعالى: ﴿فمن تمتع بالعمرة إلى الحج فما استيسر من الهدي﴾ [البقرة: 196].", "فإن عدم الهدي أو ثمنه صام ثلاثة أيام في الحج، ويجوز صيامها في أيام التشريق، وسبعة إذا رجع إلى أهله؛ لقوله تعالى: ﴿فمن لم يجد فصيام ثلاثة أيام في الحج وسبعة إذا رجعتم﴾ [البقرة: 196] ويستحب للحاج أن يأكل من هدي التمتع والقران لقوله تعالى: ﴿فكلوا منها وأطعموا القانع والمعتر﴾ [الحج: 36].", "2- هدي الجبران: وهو الفدية الواجبة لترك واجب، أو ارتكاب محظور من محظورات الإحرام، أو بسبب الإحصار عند وجود سببه؛ لقوله تعالى: ﴿فإن أحصرتم فما استيسر من الهدي﴾ [البقرة: 196]، ولقول ابن عباس: «من نسي من نسكه شيئا أو تركه فليرق دما».", "وهذا النوع لا يجوز الأكل منه، بل يتصدق به على فقراء الحرم.", "3- هدي التطوع: وهو مستحب لكل حاج ولكل معتمر؛ اقتداء بالنبي ﷺ فقد أهدى مائة بدنة في حجة الوداع.", "ويستحب الأكل منه؛ لأن النبي ﷺ أمر من كل جزور ببضعة، فطبخت، وأكل منها، وشرب من مرقها. والبضعة: القطعة من اللحم.", "ويجوز لغير المحرم أن يبعث هديا إلى مكة لتذبح بها؛ تقربا إلى الله تعالى، ولا يحرم عليه شيء مما يحرم على المحرم.", "4- هدي النذر: وهو ما ينذره الحاج تقربا إلى الله عند البيت الحرام، ويجب الوفاء بهذا النذر؛ لقوله تعالى: ﴿ثم ليقضوا تفثهم وليوفوا نذورهم﴾ [الحج: 29]. ولا يجوز الأكل من هذا الهدي.", "وقت ذبح الهدي:", "هدي التمتع والقران: يبدأ وقته من بعد صلاة العيد يوم النحر، إلى آخر أيام التشريق.", "أما ذبح فدية الأذى واللبس فحين فعله، وكذلك الفدية الواجبة لترك واجب. وأما دم الإحصار فعند وجود سببه، وهو شاة أو سبع بدنة أو سبع بقرة، لقوله تعالى: ﴿فإن أحصرتم فما استيسر من الهدي﴾ [البقرة: 196].", "مكان الذبح:", "هدي التمتع والقران: السنة أن يذبحه بمنى، وإن ذبحه في أي جزء من أجزاء الحرم جاز.", "وكذلك فدية ترك الواجب وفعل المحظور فلا تذبح إلا في الحرم، عدا هدي الإحصار، فيذبحه في موضعه. أما الصيام فيجزئه في كل مكان.", "والمستحب أن يصوم ثلاثة أيام في الحج وسبعة إذا رجع إلى أهله؛ لقوله تعالى: ﴿فإذا أمنتم فمن تمتع بالعمرة إلى الحج فما استيسر من الهدي فمن لم يجد فصيام ثلاثة أيام في الحج وسبعة إذا رجعتم تلك عشرة كاملة﴾ [البقرة: 196].", "ويستحب أن يذبح الحاج بنفسه، وإن أناب غيره فلا بأس بذلك، ويستحب أن يقول عند الذبح: بسم الله، اللهم هذا منك ولك.", "أما شروط الهدي: فهي شروط الأضحية نفسها:", "1- أن يكون من بهيمة الأنعام (الإبل والبقر والغنم).", "2- أن يكون خاليا من العيوب التي تمنع الإجزاء، كالمرض والعور والعرج والهزال.", "3- أن تتوافر فيه السن المشروعة: فالإبل خمس سنوات، والبقر سنتان، والمعز سنة، والضأن ستة أشهر."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 2, "q": "المحظور الخاص بالرجال:", "o": ["لبس المخيط", "تغطية الوجه", "لبس القفازين", "الاكتحال"], "h": "راجع: ص189 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "الوطء في الفرج قبل التحلل الأول:", "o": ["مفسد للحج", "لا يفسد الحج", "مباح", "مكروه"], "h": "راجع: ص190 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "من الفواسق التي يجوز قتلها للمحرم:", "o": ["الغراب والفأرة والعقرب والحدأة والحية والكلب العقور", "الغزال", "الأرنب", "الحمام"], "h": "راجع: ص190 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "فدية الأذى على التخيير بين:", "o": ["صيام ثلاثة أيام أو إطعام ستة مساكين أو ذبح شاة", "صيام شهر", "ذبح بقرة فقط", "الصدقة بدينار"], "h": "راجع: ص191 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "من وطئ في الحج قبل التحلل الأول وجب عليه:", "o": ["بدنة وقضاء الحج والتوبة", "شاة فقط", "لا شيء", "صيام يوم"], "h": "راجع: ص191 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "الهدي الذي يجوز الأكل منه:", "o": ["هدي التمتع والقران", "هدي الجبران", "هدي النذر", "فدية الأذى"], "h": "راجع: ص192 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "من عدم هدي التمتع صام:", "o": ["ثلاثة أيام في الحج وسبعة إذا رجع إلى أهله", "عشرة أيام متتالية", "شهرا", "يوما"], "h": "راجع: ص192 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "وقت ذبح هدي التمتع والقران يبدأ:", "o": ["من بعد صلاة العيد يوم النحر", "من أول ذي الحجة", "من عرفة", "من الإحرام"], "h": "راجع: ص193 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "سن الإبل في الهدي والأضحية:", "o": ["خمس سنوات", "سنتان", "سنة", "ستة أشهر"], "h": "راجع: ص194 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "عقد النكاح من محظورات الإحرام.", "a": true, "h": "راجع: ص190 (المسألة الأولى)"}, {"t": "tf", "d": 2, "q": "يجوز الأكل من هدي الجبران.", "a": false, "h": "راجع: ص192 (المسألة الثالثة)"}]}], "sum": [["في محظورات الإحرام", "ص189-194"], ["فدية المحظورات", "ص189-194"], ["في الهدي وأحكامه", "ص189-194"]]}, {"id": "l42", "title": "الباب الرابع: في صفة الحج والعمرة", "group": "الكتاب الخامس: الحج", "map": {"center": "الباب الرابع\nالحج", "nodes": [{"t": "صفة الحج والعمرة", "s": []}, {"t": "تتمة صفة الحج والعمرة", "s": []}]}, "paras": [{"t": "الباب الرابع: في صفة الحج والعمرة", "b": [{"pic": ["kaaba", "book", "scroll"], "cap": "ص194-197"}, {"story": ["صفة الحج والعمرة", ["الأصل عند أهل العلم في صفة الحج حديث جابر المشهور.", "وقد تتبعنا الروايات الصحيحة الثابتة عن النبي ﷺ فتلخص لنا من مجموعها الصفة التالية:", "إذا وصل مريد النسك إلى الميقات فإنه يستحب له أن يغتسل، ويأخذ ما يحتاج إلى أخذه من شعر، يحل أخذه، كشعر الإبط والعانة والشارب، ويقلم أظافره، ويتجرد الرجل من المخيط، ويتطيب في بدنه قبل نية الدخول في النسك، ويلبس الرجل إزارا ورداء نظيفين أبيضين. وتحرم المرأة فيما شاءت من ثياب.", "ويغطي الرجل كتفيه بردائه، ويهل بنسكه الذي يريد. والأفضل أن يكون إهلاله إذا استوى على دابته، وإن كان المحرم يخاف من عائق يمنعه من إتمام نسكه كمرض أو قطع طريق أو نحو ذلك فإنه يشترط أن محلي حيث حبستني.", "ويستحب أن يكون عند إهلاله مستقبلا القبلة، ويقول: اللهم هذه حجة لا رياء فيها ولا سمعة، ويشرع في التلبية: لبيك اللهم لبيك، لبيك لا شريك لك لبيك، إن الحمد والنعمة لك والملك لا شريك لك. وكان الصحابة يزيدون: لبيك ذا المعارج، لبيك ذا الفواضل.", "ويسن أن يرفع صوته بالتلبية، فإذا وصل مكة استحب له أن يغتسل، فإذا أراد أن يطوف اضطبع الرجل بأن يكشف عن كتفه الأيمن، ويغطي كتفه الأيسر بردائه. ويشترط أن يكون حال الطواف متوضئا. ويستحب أن يستلم الحجر الأسود ويقبله، فإن لم يمكنه ذلك استلمه بيده، وقبل يده، فإن لم يمكنه ذلك يشير إليه بيده، ولا يقبلها، ويفعل ذلك عند كل شوط، ويبدأ كل شوط بالتكبير، وإن ابتدأ الطواف بسم الله والله أكبر فحسن. وإذا أتى الركن اليماني استلمه ولم يقبله، فإن لم يمكنه استلامه فإنه لا يشير إليه، ولا يكبر، ويقول بين الركنين -وهما: الركن اليماني والحجر الأسود-: ربنا آتنا في الدنيا حسنة وفي الآخرة حسنة وقنا عذاب النار.", "ويدعو في بقية الطواف بما شاء، ويستحب أن يرمل في الأشواط الثلاثة الأولى -والرمل فوق المشي ودون العدو- ويمشي في الأربعة، فإذا أتم سبعة أشواط غطى كتفيه بردائه، ثم نفذ إلى مقام إبراهيم فقرأ: ﴿واتخذوا من مقام إبراهيم مصلى﴾ [البقرة: 125] ويصلي ركعتين خلف المقام يقرأ في الأولى بسورة (الكافرون) وفي الثانية بسورة (الإخلاص) فإن لم يتمكن من الصلاة خلف المقام لزحام ونحوه، صلى في أي مكان من المسجد، وهذا الطواف هو طواف القدوم للمفرد، وطواف العمرة للمتمتع والقارن.", "ثم يشرع له أن يشرب من زمزم، ويصب على رأسه، ثم يرجع إلى الحجر الأسود فيستلمه إن تيسر، ثم يخرج إلى الصفا، ويقرأ قول الله عز وجل: ﴿إن الصفا والمروة من شعائر الله﴾ [البقرة: 158] ثم يرقى الصفا حتى يرى البيت، ويستقبل القبلة، ويرفع يديه، ويقول: الله أكبر ثلاثا، لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، لا إله إلا الله وحده، أنجز وعده، ونصر عبده، وهزم الأحزاب وحده، يفعل ذلك ثلاث مرات ويدعو بينها طويلا، ثم ينزل ماشيا إلى المروة، ويسعى بين الميلين الأخضرين سعيا شديدا، وذلك للرجال دون النساء، ثم يمشي حتى يرقى المروة، فيصنع عليها مثل ما صنع على الصفا.", "وهذا شوط، وهكذا حتى يتم السعي سبعة أشواط. وهذا سعي الحج للمفرد والقارن، ولا يتحللان بعده، بل يبقيان بإحرامهما. وهو سعي العمرة للمتمتع."]], "ic": "scroll"}, {"story": ["تتمة صفة الحج والعمرة", ["ويتحلل المتمتع من عمرته بتقصير شعره ثم يلبس ملابسه، حتى إذا كان يوم التروية -وهو يوم الثامن من ذي الحجة- أحرم المتمتع بالحج من مكانه، وكذا غيره من المحلين من مكة وقربها. ويستحب أن يفعل ما فعله عند الميقات من الاغتسال والطيب والتنظف. ويتوجه جميع الحجاج إلى منى ملبين، ويصلون في منى الظهر والعصر والمغرب والعشاء والفجر بقصر الرباعية من غير جمع، ثم في صبيحة اليوم التاسع يسير الحاج إلى عرفة. فإن تيسر أن ينزل بنمرة إلى الزوال فحسن. وإذا زالت الشمس خطب الإمام أو نائبه خطبة قصيرة، ثم يصلي الظهر والعصر قصرا وجمعا في وقت الظهر، ثم يدخل عرفة.", "ويجب على الحاج أن يتيقن أنه في داخل حدود عرفة، ويستقبل القبلة، ويرفع يديه يدعو ويلبي، ويحمد الله، ويجتهد في التضرع والذكر والدعاء في ذلك اليوم العظيم. وأفضل ما يقال في ذلك اليوم: لا إله إلا الله وحده لا شريك له، له الملك، وله الحمد، وهو على كل شيء قدير، ويكون في ذلك اليوم مفطرا؛ لأنه أقوى له على العبادة، ولا يزال واقفا متضرعا متذللا، إلى أن تغرب الشمس، فإذا غربت أفاض من عرفة بسكينة، ويسير ملبيا حتى يأتي مزدلفة فيصلي بها المغرب والعشاء جمعا ويقصر العشاء، ورخص للضعفة أن يخرجوا من مزدلفة بليل، ويبقى القوي في مزدلفة حتى يصلي الفجر، ثم يستقبل القبلة ويحمد الله ويكبره ويهلله حتى يسفر جدا، ثم يدفع من مزدلفة قبل طلوع الشمس، وعليه السكينة، ملبيا، ويلتقط سبع حصيات من الطريق، حتى إذا أتى جمرة العقبة ورماها بسبع حصيات يكبر مع كل حصاة ويقطع التلبية، ثم ينحر هديه، ويستحب أن يأكل منه، ثم يحلق رأسه، ثم يطوف طواف الإفاضة، ويسعى سعي الحج إن كان متمتعا، أو كان مفردا أو قارنا ولم يسع مع طواف القدوم.", "والسنة ترتيب هذه الأعمال: الرمي، فالذبح، فالحلق، أو التقصير، فإن قدم واحدا منها على آخر فلا حرج، وإذا فعل اثنين من ثلاثة أعمال -رمي جمرة العقبة، والحلق أو التقصير، والطواف مع السعي، إن كان عليه سعي- تحلل التحلل الأول وحل له كل شيء حرم عليه بالإحرام إلا النساء. فإذا فعل الثلاثة تحلل التحلل الأكبر فيحل له كل شيء حتى النساء، ويبيت بمنى ليلة الحادي عشر والثاني عشر وجوبا، ويرمي الجمرات الثلاث يوم الحادي عشر بادئا بالصغرى ثم الوسطى ثم الكبرى وكذلك في اليوم الثاني عشر، ويبدأ وقت الرمي من الزوال إلى طلوع الفجر، وإذا رمى الجمرة الصغرى سن له أن يتقدم قليلا عن يمينه، ويقوم مستقبلا القبلة رافعا يديه يدعو. وإذا رمى الجمرة الوسطى سن له أن يتقدم، ويأخذ ذات الشمال ويستقبل القبلة، ويقوم طويلا يدعو رافعا يديه، ولا يقف بعد جمرة العقبة، فإن أراد أن يتعجل فإنه يجب عليه أن يخرج من منى يوم الثاني عشر قبل غروب الشمس، فإن غربت عليه الشمس في منى مختارا، وجب عليه مبيت ليلة الثالث عشر.", "ثم إذا أراد أن يخرج من مكة وجب عليه أن يطوف طواف الوداع، ويجعل آخر عهده بالبيت الطواف، ويسقط هذا الطواف عن الحائض والنفساء."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 2, "q": "الأصل عند أهل العلم في صفة الحج:", "o": ["حديث جابر المشهور", "حديث عمر", "حديث أنس", "حديث ابن عباس"], "h": "راجع: ص194 (صفة الحج والعمرة)"}, {"t": "mcq", "d": 2, "q": "الاضطباع في الطواف هو:", "o": ["أن يكشف عن كتفه الأيمن ويغطي كتفه الأيسر بردائه", "أن يغطي الكتفين", "أن يكشف الكتفين", "أن يمشي مسرعا"], "h": "راجع: ص195 (صفة الحج والعمرة)"}, {"t": "mcq", "d": 2, "q": "الرمل يكون في:", "o": ["الأشواط الثلاثة الأولى", "الأشواط السبعة", "الأربعة الأخيرة", "السعي"], "h": "راجع: ص195 (صفة الحج والعمرة)"}, {"t": "mcq", "d": 2, "q": "يصلي ركعتين بعد الطواف:", "o": ["خلف مقام إبراهيم", "في عرفة", "في منى", "في المروة"], "h": "راجع: ص195 (صفة الحج والعمرة)"}, {"t": "mcq", "d": 2, "q": "يوم التروية هو:", "o": ["الثامن من ذي الحجة", "التاسع", "العاشر", "الحادي عشر"], "h": "راجع: ص196 (تتمة صفة الحج والعمرة)"}, {"t": "mcq", "d": 2, "q": "يصلي الحاج بمزدلفة:", "o": ["المغرب والعشاء جمعا", "الظهر والعصر", "الفجر فقط", "العصر"], "h": "راجع: ص196 (تتمة صفة الحج والعمرة)"}, {"t": "mcq", "d": 2, "q": "ترتيب الأعمال يوم النحر:", "o": ["الرمي، فالذبح، فالحلق أو التقصير", "الذبح، فالرمي", "الحلق، فالرمي", "الطواف، فالرمي"], "h": "راجع: ص197 (تتمة صفة الحج والعمرة)"}, {"t": "mcq", "d": 2, "q": "إذا أراد الحاج أن يتعجل فإنه يخرج من منى:", "o": ["يوم الثاني عشر قبل غروب الشمس", "يوم الحادي عشر", "بعد غروب الشمس", "يوم عرفة"], "h": "راجع: ص197 (تتمة صفة الحج والعمرة)"}, {"t": "tf", "d": 2, "q": "يسقط طواف الوداع عن الحائض والنفساء.", "a": true, "h": "راجع: ص197 (تتمة صفة الحج والعمرة)"}, {"t": "tf", "d": 2, "q": "يكون الحاج يوم عرفة مفطرا.", "a": true, "h": "راجع: ص196 (تتمة صفة الحج والعمرة)"}]}], "sum": [["صفة الحج والعمرة", "ص194-197"], ["تتمة صفة الحج والعمرة", "ص194-197"]]}, {"id": "l43", "title": "الباب الخامس: في الأماكن التي تشرع زيارتها في المدينة", "group": "الكتاب الخامس: الحج", "map": {"center": "الباب الخامس\nالحج", "nodes": [{"t": "زيارة مسجد النبي ﷺ", "s": []}, {"t": "زيارة قبره ﷺ", "s": []}, {"t": "الأماكن الأخرى التي تشرع زيارتها ف", "s": []}]}, "paras": [{"t": "الباب الخامس: في الأماكن التي تشرع زيارتها في المدينة", "b": [{"pic": ["kaaba", "book", "scroll"], "cap": "ص197-201"}, {"story": ["المسألة الأولى: زيارة مسجد النبي ﷺ", ["تسن زيارة مسجد النبي ﷺ وشد الرحل إليه في أي وقت من أيام السنة، سواء أكان ذلك قبل الحج أم بعده، وليس لها وقت خاص، ولا دخل لها في الحج، وليست من شروطه ولا من واجباته، لكن ينبغي لمن قدم إلى الحج أن يزور مسجده ﷺ قبل أداء فريضة الحج أو بعدها، وبخاصة من يشق عليه السفر إلى هذه الأماكن.", "فلو مر الحجاج بالمسجد النبوي وصلوا فيه، لكان أرفق بهم وأعظم لأجرهم وجمعوا بين الحسنيين: أداء فريضة الحج، وزيارة المسجد النبوي للصلاة فيه، مع العلم -كما سبق- بأن هذه الزيارة ليست من مكملات الحج، ولا دخل لها فيه، فالحج كامل وتام بدون هذه الزيارة، ولا ارتباط بينها وبين الحج البتة.", "والأدلة على مشروعية شد الرحال إلى مسجده ﷺ والصلاة فيه كثيرة منها:", "1- قوله ﷺ: «لا تشد الرحال إلا إلى ثلاثة مساجد: المسجد الحرام، ومسجد الرسول ﷺ ومسجد الأقصى».", "2- وقوله ﷺ: «صلاة في مسجدي هذا خير من ألف صلاة فيما سواه، إلا المسجد الحرام».", "فهذه النصوص تدل على مشروعية زيارة مسجد النبي ﷺ للصلاة فيه لفضلها ومضاعفة أجرها، وتدل أيضا على أنه يحرم شد الرحال لغير هذه المساجد الثلاثة لقصد العبادة، فلا تشرع الزيارة والسفر لأي مكان في أنحاء المعمورة، إلا إلى هذه المساجد الثلاثة. وقصد المدينة للصلاة في مسجد النبي ﷺ مشروع في حق الرجال والنساء؛ لما تقدم من عموم الأدلة السابقة.", "أما كيفية الزيارة: فإذا وصل المسافر إلى المسجد استحب له أن يقدم رجله اليمنى حال دخوله المسجد، ويقول الدعاء المشروع عند دخول أي مسجد: بسم الله والصلاة والسلام على رسول الله، اللهم افتح لي أبواب رحمتك.", "وليس لمسجده ﷺ ذكر مخصوص، ثم بعد ذلك يصلي ركعتين في أي مكان من المسجد، وإن صلاها في الروضة فهو أفضل؛ لقوله ﷺ: «ما بين بيتي ومنبري روضة من رياض الجنة».", "ومن زار مسجده ﷺ ينبغي له أن يحافظ على أداء الصلوات الخمس فيه، وأن يكثر فيه من الذكر والدعاء وصلاة النافلة في الروضة الشريفة؛ احتسابا للأجر والثواب الجزيل، أما صلاة الفريضة فالأولى للزائر وغيره أن يتقدم إليها، ويحرص على الصفوف الأول المرغب فيها ما استطاع؛ لأنها مقدمة على الروضة."]], "ic": "scroll"}, {"story": ["المسألة الثانية: زيارة قبره ﷺ", ["إذا زار المسلم المسجد النبوي استحب له زيارة قبره ﷺ وقبري صاحبيه أبي بكر وعمر رضي الله عنهما؛ لأنها تابعة لزيارة مسجده ﷺ، وليست هي أصل القصد.", "وهذه هي الزيارة المشروعة، ولا يشرع شد الرحل إليها، بل شد الرحل لزيارة قبور الأنبياء والصالحين والأماكن الأخرى غير المساجد الثلاثة -المسجد الحرام، والمسجد النبوي، والمسجد الأقصى- انعقد الإجماع على تحريمه، ومن فعله فهو عاص بنيته، آثم بقصده؛ لمخالفته لمفهوم الحديث الوارد في شد الرحال إلى المساجد الثلاثة.", "أما كيفية الزيارة: فعلى الزائر أن يقف تجاه قبر النبي ﷺ بأدب وخفض صوت، ثم يسلم عليه قائلا: «السلام عليك يا رسول الله ورحمة الله وبركاته»؛ لقوله ﷺ: «ما من أحد يسلم علي إلا رد الله علي روحي حتى أرد عليه السلام».", "وإن قال الزائر: السلام عليك يا خيرة الله من خلقه، أشهد أنك قد بلغت الرسالة، وأديت الأمانة، ونصحت الأمة، وجاهدت في الله حق جهاده، اللهم آته الوسيلة والفضيلة، وابعثه المقام المحمود الذي وعدته، اللهم اجزه عن أمته خير الجزاء، فلا بأس. ثم بعد ذلك يسلم على أبي بكر وعمر رضي الله عنهما، ويدعو لهما، ويترحم عليهما؛ لما أثر عن ابن عمر رضي الله عنهما أنه كان إذا سلم على الرسول ﷺ وصاحبيه، لا يزيد على قوله: «السلام عليك يا رسول الله، السلام عليك يا أبا بكر، السلام عليك يا أبتاه» ثم ينصرف.", "ويحرم على الزائر وغيره التمسح بالحجرة أو تقبيلها أو الطواف بها، أو استقبالها حال الدعاء، أو سؤال الرسول ﷺ قضاء الحاجات، وتفريج الكربات، وشفاء المرض ونحو ذلك؛ لأن ذلك كله لله، ولا يطلب إلا منه.", "وليست زيارة قبر النبي ﷺ وقبري صاحبيه واجبة، ولا شرطا في الحج كما يظن بعض الجهال من العامة، بل هي مستحبة في حق من زار مسجد النبي ﷺ ولا ارتباط بينها وبين الحج بتاتا، وما ورد في هذا الباب من الأحاديث التي يحتج بها من يقول بمشروعية شد الرحل إلى قبر النبي ﷺ، وأنها من مكملات الحج فهي أحاديث ساقطة، لا أصل لها، إما ضعيفة أو موضوعة، كحديث: «من حج ولم يزرني فقد جفاني»، وحديث: «من زار قبري وجبت له شفاعتي»، وغيرهما كثير، وكلها لم يثبت منها حديث واحد عن النبي ﷺ، بل جزم بعض أهل العلم بأنها كلها موضوعة مكذوبة."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: الأماكن الأخرى التي تشرع زيارتها في المدينة النبوية", ["يستحب لزائر المدينة -رجلا كان أو امرأة- أن يخرج متطهرا إلى مسجد قباء ويصلي فيه؛ لفعله ﷺ حيث كان يزور مسجد قباء راكبا وماشيا ويصلي فيه ركعتين.", "وقوله ﷺ: «من تطهر في بيته ثم أتى مسجد قباء، فصلى فيه صلاة، كان له كأجر عمرة».", "ويسن للرجال فقط زيارة قبور البقيع وقبور الشهداء في أحد كقبر حمزة رضي الله عنه وغيره، ويسلم عليهم، ويدعو لهم؛ لفعله ﷺ إذ كان يزورهم ويدعو لهم، ولعموم قوله ﷺ: «زوروا القبور فإنها تذكر الموت».", "وكان النبي ﷺ يعلم أصحابه إذا زاروا القبور أن يقولوا: «السلام عليكم أهل الديار من المؤمنين والمسلمين، وإنا، إن شاء الله للاحقون، أسأل الله لنا ولكم العافية».", "هذه هي الأماكن التي تشرع زيارتها في المدينة.", "أما الأماكن الأخرى التي يظن بعض العامة أن زيارتها مشروعة: كمبرك الناقة، ومسجد الجمعة، وبئر الخاتم، وبئر عثمان، والمساجد السبعة، ومسجد القبلتين، فهذه لا أصل لها، ولم يثبت عن النبي ﷺ أنه زار هذه الأماكن أو أمر بزيارتها، ولم يرد عن أحد من السلف الصالح أنه زارها. وليس لأي مسجد في المدينة فضل خاص، إلا مسجد الرسول ﷺ ومسجد قباء. وقد قال ﷺ: «من عمل عملا ليس عليه أمرنا فهو رد».", "فينبغي للمسلم إذا زار المدينة أن يتقيد بالأماكن التي تشرع زيارتها، ويجتنب الأماكن التي لا تشرع زيارتها."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 2, "q": "زيارة مسجد النبي ﷺ تسن:", "o": ["في أي وقت من أيام السنة", "في أشهر الحج فقط", "بعد الحج فقط", "قبل الحج فقط"], "h": "راجع: ص197 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "المساجد الثلاثة التي تشد إليها الرحال:", "o": ["المسجد الحرام ومسجد الرسول ﷺ ومسجد الأقصى", "المسجد الحرام وقباء والأقصى", "مسجد النبي وقباء والقبلتين", "الأقصى وقباء والقبلتين"], "h": "راجع: ص198 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "زيارة قبر النبي ﷺ في الحج:", "o": ["ليست واجبة ولا شرطا", "واجبة", "شرط", "ركن"], "h": "راجع: ص200 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "الذي يحرم على الزائر عند الحجرة:", "o": ["التمسح بالحجرة أو تقبيلها أو الطواف بها", "السلام على النبي", "الوقوف بأدب", "الدعاء لهما"], "h": "راجع: ص200 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "الصلاة في مسجد قباء بعد التطهر:", "o": ["كأجر عمرة", "كأجر حجة", "كأجر صدقة", "كأجر جهاد"], "h": "راجع: ص200 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "زيارة قبور البقيع وأحد:", "o": ["تسن للرجال فقط", "تسن للنساء", "واجبة", "محرمة"], "h": "راجع: ص200 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "زيارة مسجد النبي ﷺ ليست شرطا في صحة الحج.", "a": true, "h": "راجع: ص198 (المسألة الأولى)"}, {"t": "tf", "d": 2, "q": "زيارة مسجد القبلتين مما ثبتت مشروعيته عن النبي ﷺ.", "a": false, "h": "راجع: ص201 (المسألة الثالثة)"}]}], "sum": [["زيارة مسجد النبي ﷺ", "ص197-201"], ["زيارة قبره ﷺ", "ص197-201"], ["الأماكن الأخرى التي تشرع زيارتها ف", "ص197-201"]]}, {"id": "l44", "title": "الباب السادس: في الأضحية", "group": "الكتاب الخامس: الحج", "map": {"center": "الباب السادس\nالحج", "nodes": [{"t": "في تعريف الأضحية وحكمها وأدلة مشرو", "s": []}, {"t": "ما تجوز الأضحية به", "s": []}, {"t": "الشروط المعتبرة في الأضاحي", "s": []}, {"t": "وقت ذبح الأضحية", "s": []}, {"t": "ما يصنع بالأضحية، وما يلزم المضحي ", "s": []}]}, "paras": [{"t": "الباب السادس: في الأضحية", "b": [{"pic": ["book", "scroll"], "cap": "ص201-205"}, {"story": ["المسألة الأولى: في تعريف الأضحية وحكمها وأدلة مشروعيتها وشروطها", ["1- تعريف الأضحية:", "الأضحية لغة: هي ذبح الأضحية وقت الضحى.", "وشرعا: هي ما يذبح من الإبل أو البقر أو الغنم أو المعز تقربا إلى الله تعالى يوم العيد.", "2- حكمها وأدلة مشروعيتها:", "الأضحية سنة مؤكدة؛ لقوله تعالى: ﴿فصل لربك وانحر﴾ [الكوثر: 2].", "ولحديث أنس رضي الله عنه: «أن النبي ﷺ ضحى بكبشين أملحين أقرنين ذبحهما بيده، وسمى وكبر، ووضع رجله على صفاحهما».", "الأملح: ما فيه سواد وبياض، والأقرن: ما له قرن.", "3- شروط مشروعية الأضحية:", "تسن الأضحية في حق من وجدت فيه الشروط الآتية:", "1- الإسلام: فلا يخاطب بها غير المسلم.", "2- البلوغ والعقل: فمن لم يكن بالغا عاقلا فلا يكلف بها.", "3- الاستطاعة: وتتحقق بأن يملك قيمة الأضحية زائدة عن نفقته ونفقة من تلزمه نفقته، خلال يوم العيد وأيام التشريق."]], "ic": "scroll"}, {"story": ["المسألة الثانية: ما تجوز الأضحية به", ["لا تصح الأضحية إلا أن تكون من:", "1- الإبل. 2- البقر. 3- الغنم ومنه الماعز.", "لقوله تعالى: ﴿ولكل أمة جعلنا منسكا ليذكروا اسم الله على ما رزقهم من بهيمة الأنعام﴾ [الحج: 34]، والأنعام لا تخرج عن هذه الأصناف الثلاثة. ولأنه لم ينقل عن النبي ﷺ ولا عن أحد من الصحابة التضحية بغيرها.", "وتجزئ الشاة في الأضحية عن الواحد وأهل بيته؛ ففي حديث أبي أيوب رضي الله عنه: «كان الرجل في عهد رسول الله ﷺ يضحي بالشاة عنه وعن أهل بيته، فيأكلون ويطعمون».", "ويجوز التضحية بالبعير والبقرة الواحدة عن سبعة؛ لحديث جابر رضي الله عنه قال: «نحرنا مع رسول الله ﷺ عام الحديبية البدنة عن سبعة، والبقرة عن سبعة»."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: الشروط المعتبرة في الأضاحي", ["1- السن:", "أ) الإبل: ويشترط أن يكون قد أكمل خمس سنين.", "ب) البقر: ويشترط أن يكون قد أكمل سنتين.", "ج) المعز: ويشترط أن يكون قد أكمل سنة.", "لحديث جابر رضي الله عنه أن رسول الله ﷺ قال: «لا تذبحوا إلا مسنة، إلا أن يعسر عليكم، فتذبحوا جذعة من الضأن». والمسنة من الإبل ما لها خمس سنين، ومن البقر ما لها سنتان، ومن المعز ما له سنة، وتسمى المسنة بالثنية.", "د) الضأن: ويشترط فيه الجذع، وهو ما أكمل سنة، وقيل: ستة أشهر؛ لحديث عقبة بن عامر رضي الله عنه قال: قلت يا رسول الله: أصابني جذع. قال: «ضح به»، ولحديث عقبة بن عامر أيضا: «ضحينا مع رسول الله ﷺ بجذع من الضأن».", "2- السلامة:", "يشترط في الإبل والبقر والغنم أن تكون سالمة من العيوب التي من شأنها أن تسبب نقصانا في اللحم، فلا تجزئ العجفاء، والعرجاء، والعوراء، والمريضة؛ لحديث البراء بن عازب رضي الله عنه عن النبي ﷺ قال: «أربع لا تجزئ في الأضاحي: العوراء البين عورها، والمريضة البين مرضها، والعرجاء البين عرجها، والعجفاء التي لا تنقي». والعجفاء: الهزيلة، ومعنى (لا تنقي): أي لا مخ لها لهزالها.", "ويقاس على العيوب الأربعة ما في معناها: كالهتماء التي ذهبت ثناياها، والعضباء التي ذهب أكثر أذنها أو قرنها، ونحو ذلك من العيوب."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: وقت ذبح الأضحية", ["يبتدئ وقتها من بعد صلاة العيد لمن صلاها، ومن بعد طلوع شمس يوم عيد الأضحى بمقدار ما يتسع لركعتين وخطبتين لمن لم يصلها؛ لحديث البراء بن عازب رضي الله عنه قال: قال رسول الله ﷺ: «من صلى صلاتنا، ونسك نسكنا، فقد أصاب النسك، ومن ذبح قبل أن يصلي فليعد مكانها أخرى». ويستمر وقتها إلى غروب آخر أيام التشريق؛ لحديث جبير بن مطعم رضي الله عنه عن النبي ﷺ قال: «كل أيام التشريق ذبح».", "والأفضل ذبحها بعد الفراغ من صلاة العيد؛ لحديث البراء بن عازب رضي الله عنه أن النبي ﷺ قال: «أول ما نبدأ في يومنا هذا أن نصلي، ثم نرجع فننحر، فمن فعل ذلك فقد أصاب سنتنا، ومن ذبح قبل ذلك فإنما هو لحم قدمه لأهله، ليس من النسك في شيء»."]], "ic": "scroll"}, {"story": ["المسألة الخامسة: ما يصنع بالأضحية، وما يلزم المضحي إذا دخلت العشر", ["1- ما يصنع بالأضحية:", "يسن للمضحي أن يأكل من أضحيته، ويهدي للأقارب والجيران والأصدقاء، ويتصدق على الفقراء؛ لقوله تعالى: ﴿فكلوا منها وأطعموا البائس الفقير﴾ [الحج: 28].", "ويستحب أن يجعلها أثلاثا: ثلث لأهل بيته، وثلث يطعمه فقراء جيرانه، ويهدي الثلث، لحديث ابن عباس رضي الله عنهما في صفة أضحية النبي ﷺ قال: «ويطعم أهل بيته الثلث، ويطعم فقراء جيرانه الثلث، ويتصدق على السؤال بالثلث».", "ويجوز ادخار لحوم الأضاحي بعد ثلاثة أيام؛ لحديث بريدة رضي الله عنه أن النبي ﷺ قال: «كنت نهيتكم عن ادخار لحوم الأضاحي فوق ثلاث، فأمسكوا ما بدا لكم».", "2- ما يلزم مريد التضحية إذا دخلت عشر ذي الحجة:", "إذا دخلت عشر ذي الحجة، حرم على من أراد أن يضحي أن يأخذ من شعره، أو أظفاره شيئا، حتى يضحي؛ لحديث أم سلمة رضي الله عنها مرفوعا: «إذا دخل العشر وعنده أضحية يريد أن يضحي، فلا يأخذن شعرا، ولا يقلمن ظفرا». وفي رواية: «فلا يمس من شعره وبشره شيئا»."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "حكم الأضحية:", "o": ["سنة مؤكدة", "واجبة", "مباحة", "مكروهة"], "h": "راجع: ص202 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "الأضحية لا تصح إلا من:", "o": ["الإبل والبقر والغنم ومنه الماعز", "الإبل والبقر فقط", "الغنم فقط", "الدجاج والغنم"], "h": "راجع: ص202 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "البعير الواحد والبقرة الواحدة تجزئ عن:", "o": ["سبعة", "واحد", "عشرة", "ثلاثة"], "h": "راجع: ص202 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "السن المشترط في الإبل:", "o": ["خمس سنين", "سنة", "سنتان", "ثلاث سنين"], "h": "راجع: ص203 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "السن المشترط في البقر:", "o": ["سنتان", "سنة", "خمس سنين", "ست سنين"], "h": "راجع: ص203 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "من العيوب التي لا تجزئ في الأضاحي:", "o": ["العوراء البين عورها", "السمينة", "ذات القرنين", "البيضاء"], "h": "راجع: ص203 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "يبتدئ وقت ذبح الأضحية:", "o": ["من بعد صلاة العيد", "من الفجر", "من الزوال", "من ليلة العيد"], "h": "راجع: ص204 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "يستمر وقت الأضحية إلى:", "o": ["غروب آخر أيام التشريق", "غروب يوم العيد", "ظهر يوم العيد", "نهاية ذي الحجة"], "h": "راجع: ص204 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "يستحب أن يجعل الأضحية:", "o": ["أثلاثا", "أنصافا", "كلها صدقة فقط", "كلها لنفسه"], "h": "راجع: ص204 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "إذا دخلت عشر ذي الحجة وأراد أحد أن يضحي:", "o": ["حرم عليه أن يأخذ من شعره وأظفاره حتى يضحي", "جاز له أخذ الشعر", "وجب عليه الصوم", "حرم عليه الأكل"], "h": "راجع: ص205 (المسألة الخامسة)"}, {"t": "tf", "d": 1, "q": "الأضحية لغة: هي ذبح الأضحية وقت الضحى.", "a": true, "h": "راجع: ص201 (المسألة الأولى)"}, {"t": "tf", "d": 2, "q": "يجوز ادخار لحوم الأضاحي بعد ثلاثة أيام.", "a": true, "h": "راجع: ص205 (المسألة الخامسة)"}]}], "sum": [["في تعريف الأضحية وحكمها وأدلة مشرو", "ص201-205"], ["ما تجوز الأضحية به", "ص201-205"], ["الشروط المعتبرة في الأضاحي", "ص201-205"], ["وقت ذبح الأضحية", "ص201-205"]]}, {"id": "l45", "title": "الباب السابع: في العقيقة", "group": "الكتاب الخامس: الحج", "map": {"center": "الباب السابع\nالحج", "nodes": [{"t": "تعريف العقيقة وحكمها ووقتها", "s": []}, {"t": "مقدار ما يذبح في العقيقة", "s": []}, {"t": "تسمية المولود، وحلق رأسه، وتحنيكه،", "s": []}]}, "paras": [{"t": "الباب السابع: في العقيقة", "b": [{"pic": ["book", "scroll"], "cap": "ص205-208"}, {"story": ["المسألة الأولى: تعريف العقيقة وحكمها ووقتها", ["1- تعريف العقيقة:", "العقيقة لغة: مشتقة من العق وهو القطع، وهي تطلق في الأصل على الشعر الذي يكون على رأس المولود حين الولادة.", "وشرعا: ما يذبح للمولود يوم سابعه عند حلق شعره.", "وهي من حق الولد على والديه.", "2- حكم العقيقة:", "العقيقة سنة مؤكدة؛ لحديث سلمان بن عامر الضبي رضي الله عنه قال: سمعت رسول الله ﷺ يقول: «مع الغلام عقيقته فأهريقوا عنه دما، وأميطوا عنه الأذى»، ولحديث سمرة رضي الله عنه أن النبي ﷺ قال: «كل غلام رهينة بعقيقته، تذبح عنه يوم سابعه ويسمى ويحلق رأسه»، ولحديث عبد الله بن عمرو بن العاص رضي الله عنهما أن النبي ﷺ قال: «من ولد له ولد فأحب أن ينسك عنه فلينسك عنه». ومعنى ينسك: يذبح.", "3- وقت العقيقة:", "يدخل وقت جواز ذبح العقيقة بانفصال جميع المولود من بطن أمه، ويستمر وقت الاستحباب إلى البلوغ، إلا أنه يسن أن يعق عنه يوم السابع من ولادته؛ لحديث سمرة رضي الله عنه قال: قال رسول الله ﷺ: «الغلام مرتهن بعقيقته تذبح عنه يوم السابع، ويسمى، ويحلق رأسه»."]], "ic": "scroll"}, {"story": ["المسألة الثانية: مقدار ما يذبح في العقيقة", ["يسن أن يذبح عن الغلام شاتان وعن الجارية شاة؛ لحديث أم كرز الكعبية رضي الله عنها قالت: سمعت رسول الله ﷺ يقول: «عن الغلام شاتان متكافئتان، وعن الجارية شاة»."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: تسمية المولود، وحلق رأسه، وتحنيكه، والأذان في أذنه", ["1- تسمية المولود:", "يسن تسمية المولود في اليوم السابع من ولادته؛ لحديث سمرة رضي الله عنه أن النبي ﷺ قال: «كل غلام رهينة بعقيقته، تذبح عنه يوم سابعه ويسمى ويحلق رأسه».", "ويسن أن يختار له من الأسماء ما كان حسنا؛ فقد غير النبي ﷺ الأسماء القبيحة، وأمر بذلك.", "وأحسنها: عبد الله وعبد الرحمن؛ لحديث ابن عمر رضي الله عنهما قال: قال رسول الله ﷺ: «إن أحب أسمائكم إلى الله عبد الله وعبد الرحمن».", "2- حلق رأس المولود:", "ويسن حلق رأسه -ذكرا كان أو أنثى- يوم سابعه بعد ذبح العقيقة، ويتصدق بزنة شعره فضة؛ لحديث علي رضي الله عنه قال: عق رسول الله ﷺ عن الحسن بشاة، وقال: «يا فاطمة احلقي رأسه، وتصدقي بزنة شعره فضة».", "3- تحنيك المولود:", "ويسن تحنيك المولود بتمر سواء أكان ذكرا أم أنثى.", "والتحنيك: هو مضغ التمر وذلك حنك المولود به حتى ينزل شيء منه إلى جوفه؛ لحديث أبي موسى رضي الله عنه قال: ولد لي غلام، فأتيت به النبي ﷺ فسماه إبراهيم وحنكه بتمر، وحديث عائشة رضي الله عنها أن رسول الله ﷺ كان يؤتى بالصبيان ويحنكهم.", "4- الأذان في أذن المولود:", "يسن الأذان في أذن المولود حين ولادته، وقيل: يؤذن في أذنه اليمنى، وتقام الصلاة في أذنه اليسرى؛ لحديث أبي رافع رضي الله عنه قال: «رأيت رسول الله ﷺ أذن في أذن الحسن بن علي حين ولدته فاطمة، بالصلاة»."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "العقيقة لغة مشتقة من:", "o": ["العق وهو القطع", "الذبح", "الأكل", "الشكر"], "h": "راجع: ص205 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "العقيقة شرعا:", "o": ["ما يذبح للمولود يوم سابعه عند حلق شعره", "ما يذبح في العيد", "ما يذبح في الحج", "ما يذبح عند الزواج"], "h": "راجع: ص205 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "حكم العقيقة:", "o": ["سنة مؤكدة", "واجبة", "محرمة", "مباحة"], "h": "راجع: ص205 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "يسن أن يعق عن المولود يوم:", "o": ["السابع من ولادته", "الأول", "الثلاثين", "الأربعين"], "h": "راجع: ص206 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "يسن أن يذبح عن الغلام:", "o": ["شاتان", "شاة", "ثلاث شياه", "بقرة"], "h": "راجع: ص206 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "يسن أن يذبح عن الجارية:", "o": ["شاة", "شاتان", "بعير", "بقرة"], "h": "راجع: ص206 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "من أحب الأسماء إلى الله:", "o": ["عبد الله وعبد الرحمن", "أحمد ومحمود", "علي وحسن", "يوسف وإبراهيم"], "h": "راجع: ص207 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "يتصدق عند حلق رأس المولود بـ:", "o": ["زنة شعره فضة", "زنة شعره ذهبا", "شاة", "تمر"], "h": "راجع: ص207 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "التحنيك:", "o": ["مضغ التمر وحنك المولود به", "حلق الرأس", "تسمية المولود", "الأذان في أذنه"], "h": "راجع: ص207 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "يسن تحنيك المولود سواء أكان ذكرا أم أنثى.", "a": true, "h": "راجع: ص207 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "يدخل وقت جواز ذبح العقيقة بانفصال جميع المولود من بطن أمه.", "a": true, "h": "راجع: ص206 (المسألة الأولى)"}]}], "sum": [["تعريف العقيقة وحكمها ووقتها", "ص205-208"], ["مقدار ما يذبح في العقيقة", "ص205-208"], ["تسمية المولود، وحلق رأسه، وتحنيكه،", "ص205-208"]]}, {"id": "l46", "title": "الباب الأول: تعريف الجهاد وفضله وحكمه وشروطه ومسقطاته", "group": "الكتاب السادس: الجهاد", "map": {"center": "الباب الأول\nالجهاد", "nodes": [{"t": "تعريفه، وفضله، والحكمة منه، وحكمه،", "s": []}, {"t": "شروط الجهاد", "s": []}, {"t": "مسقطات الجهاد", "s": []}]}, "paras": [{"t": "الباب الأول: تعريف الجهاد وفضله وحكمه وشروطه ومسقطاته", "b": [{"pic": ["scroll", "book"], "cap": "ص209-213"}, {"story": ["المسألة الأولى: تعريفه، وفضله، والحكمة منه، وحكمه، ومتى يتعين؟", ["أ- تعريفه:", "الجهاد لغة: بذل الجهد والطاقة والوسع.", "وفي الاصطلاح: بذل الجهد والوسع في قتال الأعداء من الكفار ومدافعتهم.", "ب- فضله والحكمة منه:", "الجهاد ذروة سنام الإسلام، كما سماه النبي ﷺ، أي: أعلاه، وسمي بذلك؛ لأنه يعلو به الإسلام ويرتفع ويظهر، وقد فضل الله المجاهدين في سبيله بأموالهم وأنفسهم، ووعدهم الجنة، كما سيأتي في آية سورة النساء بعد قليل، والآيات والأحاديث في فضل الجهاد والمجاهدين كثيرة.", "أما الحكمة من مشروعية الجهاد: فقد شرعه الله سبحانه لأهداف سامية وغايات نبيلة، من ذلك:", "1- شرع الجهاد لتخليص الناس من عبادة الأوثان والطواغيت وإخراجهم إلى عبادة الله وحده لا شريك له، قال تعالى: ﴿وقاتلوهم حتى لا تكون فتنة ويكون الدين كله لله﴾ [الأنفال: 39].", "2- كما شرع لإزالة الظلم وإعادة الحقوق إلى أهلها، قال تعالى: ﴿أذن للذين يقاتلون بأنهم ظلموا وإن الله على نصرهم لقدير﴾ [الحج: 39].", "3- كما شرع الجهاد لإذلال الكفار، وإرغام أنوفهم، والانتقام منهم، قال سبحانه: ﴿قاتلوهم يعذبهم الله بأيديكم ويخزهم وينصركم عليهم ويشف صدور قوم مؤمنين﴾ [التوبة: 14].", "ج- حكمه ودليل ذلك:", "الجهاد بمعناه الخاص -وهو جهاد الكفار- فرض كفاية، إذا قام به من يكفي سقط الإثم عن الباقين وصار في حقهم سنة؛ لقوله تعالى: ﴿لا يستوي القاعدون من المؤمنين غير أولي الضرر والمجاهدون في سبيل الله بأموالهم وأنفسهم فضل الله المجاهدين بأموالهم وأنفسهم على القاعدين درجة وكلا وعد الله الحسنى وفضل الله المجاهدين على القاعدين أجرا عظيما﴾ [النساء: 95]. فقد دلت هذه الآية على أن الجهاد فرض كفاية، لا فرض عين؛ لأن الله فاضل بين المجاهدين والقاعدين عن الجهاد بدون عذر، وكلا وعد الحسنى وهي الجنة. ولو كان الجهاد فرض عين لاستحق القاعدون الوعيد لا الوعد.", "ولقوله تعالى: ﴿وما كان المؤمنون لينفروا كافة فلولا نفر من كل فرقة منهم طائفة ليتفقهوا في الدين﴾ [التوبة: 122]. وهذا مشروط بما إذا كان للمسلمين قوة وقدرة على قتال أعدائهم، فإن لم يكن لديهم قوة ولا قدرة سقط عنهم كسائر الواجبات، وأصبح قتالهم لعدوهم -والحالة هذه- إلقاء بأنفسهم إلى التهلكة.", "د- متى يتعين؟", "لكن هناك حالات يتعين فيها الجهاد فيصير فرض عين على المسلم وهي:", "الحالة الأولى: إذا هاجم الأعداء بلاد المسلمين، ونزلوا بها، أو حصروها، تعين قتالهم، ودفع ضررهم، على جميع أفراد المسلمين.", "الحالة الثانية: إذا حضر القتال، وذلك إذا التقى الزحفان، وتقابل الصفان، تعين الجهاد، وحرم على من حضر القتال الانصراف، والتولي من أمام العدو؛ لقوله تعالى: ﴿يا أيها الذين آمنوا إذا لقيتم الذين كفروا زحفا فلا تولوهم الأدبار﴾ [الأنفال: 15]، ولعده ﷺ التولي يوم الزحف من الكبائر الموبقات.", "ولكن يستثنى من التولي المتوعد عليه حالتان: الأولى: إذا كان المتولي متحرفا لقتال، أي: يذهب لكي يأتي بقوة أكثر. والثانية: أن يكون متحيزا إلى فئة من المسلمين تقوية ونصرة لها.", "الحالة الثالثة: إذا عينهم الإمام واستنفرهم للجهاد؛ لقوله تعالى: ﴿يا أيها الذين آمنوا ما لكم إذا قيل لكم انفروا في سبيل الله اثاقلتم إلى الأرض أرضيتم بالحياة الدنيا من الآخرة فما متاع الحياة الدنيا في الآخرة إلا قليل * إلا تنفروا يعذبكم عذابا أليما﴾ [التوبة: 38، 39]، وقوله ﷺ: «وإذا استنفرتم فانفروا».", "الحالة الرابعة: إذا احتيج إليه، فإنه يتعين عليه الجهاد."]], "ic": "scroll"}, {"story": ["المسألة الثانية: شروط الجهاد", ["يشترط لوجوب الجهاد سبعة شروط، وهي: الإسلام، والبلوغ، والعقل، والذكورية، والحرية، والاستطاعة المالية والبدنية، والسلامة من الأمراض والأضرار.", "- فلا يجب الجهاد على الكافر؛ لأنه عبادة والعبادة لا تجب عليه، ولا تصح منه، ولأنه لا يتوافر فيه الإخلاص والأمانة والطاعة، فلا يؤذن له بالخروج مع جيش المسلمين؛ لقوله ﷺ للرجل المشرك الذي تبعه في بدر: «تؤمن بالله ورسوله؟» قال: لا، قال: «فارجع، فلن أستعين بمشرك».", "- وكذلك لا يجب على الصبي غير البالغ؛ لأنه غير مكلف، ولحديث ابن عمر رضي الله عنه: «أنه عرض نفسه على رسول الله ﷺ يوم أحد، وهو ابن أربع عشرة سنة، فلم يجزه في المقاتلة».", "- وكذلك المجنون لا يجب عليه الجهاد؛ لأنه مرفوع عنه القلم، وليس من أهل التكليف.", "- ولا يجب على العبد؛ لأنه مملوك لسيده، ولا المرأة؛ لحديث عائشة رضي الله عنها قالت: يا رسول الله هل على النساء جهاد؟ فقال: «جهاد لا قتال فيه: الحج والعمرة». وفي لفظ: نرى الجهاد أفضل العمل، أفلا نجاهد؟ فقال: «لكن أفضل الجهاد حج مبرور».", "- وغير المستطيع، وهو الذي لا يستطيع حمل السلاح لضعف أو كبر، وكذلك الفقير الذي لا يجد ما ينفق في طريقه فاضلا عن نفقة عياله لا يجب عليهم الجهاد؛ لقوله تعالى: ﴿ولا على الذين لا يجدون ما ينفقون حرج﴾ [التوبة: 91].", "وكذلك من به ضرر أو مرض أو غير ذلك من الأعذار لا يجب عليه الجهاد؛ لأن العجز ينفي الوجوب، ولقوله تعالى: ﴿ليس على الأعمى حرج ولا على الأعرج حرج ولا على المريض حرج﴾ [الفتح: 17]. وقوله تعالى: ﴿ليس على الضعفاء ولا على المرضى ولا على الذين لا يجدون ما ينفقون حرج إذا نصحوا لله ورسوله﴾ [التوبة: 91]."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: مسقطات الجهاد", ["هناك أعذار تسقط عن صاحبها الجهاد إذا كان فرض عين أو فرض كفاية وهي:", "1-2- الجنون والصبا: لقوله ﷺ: «رفع القلم عن ثلاثة: عن المجنون حتى يفيق، وعن النائم حتى يستيقظ، وعن الصبي حتى يحتلم».", "3- الأنوثة: فلا يجب الجهاد على الأنثى. وقد سبق ذكره.", "4- الرق: لما روى أبو هريرة قال: قال رسول الله ﷺ: «للعبد المملوك الصالح أجران، والذي نفسي بيده لولا الجهاد في سبيل الله، والحج وبر أمي، لأحببت أن أموت وأنا مملوك».", "5-6- الضعف البدني، والعجز المالي، والمرض، وعدم سلامة بعض الأعضاء: كالعمى والعرج الشديد، وقد سبق ذكرها.", "7- عدم إذن الأبوين أو أحدهما؛ لحديث ابن عمرو رضي الله عنه قال: جاء رجل إلى النبي ﷺ فاستأذنه في الجهاد، فقال: «أحي والداك؟» قال: نعم، قال: «ففيهما فجاهد»، فبر الوالدين فرض عين، والجهاد فرض كفاية في هذه الحالة، فيقدم فرض العين. فإذا تعين الجهاد فليس لهما منعه، ولا إذن لهما.", "8- الدين الذي لا يجد له وفاء إذا لم يأذن صاحبه، وكان الجهاد تطوعا، لقوله ﷺ: «القتل في سبيل الله يكفر كل شيء، إلا الدين»، فإذا تعين الجهاد فلا إذن لغريمه.", "9- العالم الذي لا يوجد غيره في البلد؛ لأنه لو قتل لافتقر الناس إليه؛ إذ لا يمكن لأحد أن يحل محله، فإذا كان لا يوجد من هو أفقه منه يسقط عنه الخروج للجهاد نظرا لحاجة المسلمين له."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "الجهاد لغة:", "o": ["بذل الجهد والطاقة والوسع", "القتال", "الصبر", "الحج"], "h": "راجع: ص209 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "سمى النبي ﷺ الجهاد:", "o": ["ذروة سنام الإسلام", "عماد الدين", "أفضل الأعمال", "ركن الإسلام"], "h": "راجع: ص209 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "حكم الجهاد بمعناه الخاص:", "o": ["فرض كفاية", "فرض عين على كل مسلم", "سنة", "مباح"], "h": "راجع: ص210 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "من الحالات التي يتعين فيها الجهاد:", "o": ["إذا هاجم الأعداء بلاد المسلمين", "إذا سافر الإمام", "إذا حل شهر رمضان", "إذا انتهى الحج"], "h": "راجع: ص210 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "من الحالات التي يتعين فيها الجهاد:", "o": ["إذا التقى الزحفان وتقابل الصفان", "إذا غاب الإمام", "إذا مرض القائد", "إذا انتهت الحرب"], "h": "راجع: ص210 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "التولي يوم الزحف:", "o": ["من الكبائر الموبقات", "مباح", "مكروه", "سنة"], "h": "راجع: ص211 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "عدد شروط وجوب الجهاد:", "o": ["سبعة", "ثلاثة", "خمسة", "عشرة"], "h": "راجع: ص211 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "قال النبي ﷺ للرجل المشرك الذي تبعه في بدر:", "o": ["فارجع، فلن أستعين بمشرك", "تقدم", "قاتل معنا", "أسلم ثم قاتل"], "h": "راجع: ص211 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ لمن استأذنه في الجهاد وله والدان حيان:", "o": ["ففيهما فجاهد", "اذهب إلى الجهاد", "أقم في المدينة", "جاهد بمالك"], "h": "راجع: ص213 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ عن جهاد النساء:", "o": ["جهاد لا قتال فيه: الحج والعمرة", "جهادهن القتال", "لا جهاد عليهن مطلقا", "جهادهن الصدقة"], "h": "راجع: ص212 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "الجهاد على العبد المملوك واجب.", "a": false, "h": "راجع: ص212 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "الدين الذي لا يجد له وفاء من مسقطات الجهاد إذا لم يأذن صاحبه وكان الجهاد تطوعا.", "a": true, "h": "راجع: ص213 (المسألة الثالثة)"}]}], "sum": [["تعريفه، وفضله، والحكمة منه، وحكمه،", "ص209-213"], ["شروط الجهاد", "ص209-213"], ["مسقطات الجهاد", "ص209-213"]]}, {"id": "l47", "title": "الباب الثاني: في الأسرى والغنائم", "group": "الكتاب السادس: الجهاد", "map": {"center": "الباب الثاني\nالجهاد", "nodes": [{"t": "حكم أسرى الكفار", "s": []}, {"t": "تقسيم الغنيمة بين الغانمين", "s": []}, {"t": "مصرف الفيء", "s": []}]}, "paras": [{"t": "الباب الثاني: في الأسرى والغنائم", "b": [{"pic": ["scroll", "book"], "cap": "ص214-217"}, {"story": ["المسألة الأولى: حكم أسرى الكفار", ["ذهب أكثر أهل العلم -وهو الصحيح-: أن أسرى الكفار من الرجال أمرهم إلى الإمام، فيخير فيهم بما فيه مصلحة الإسلام والمسلمين بين: القتل، والاسترقاق، والمن بغير عوض، والفداء إما بمال أو منفعة أو أسير مسلم، أما النساء والصبيان فإنهم يسترقون بمجرد السبي، ويصيرون كجملة المال يضمون إلى الغنيمة، ولا يخير فيهم الإمام، ولا يجوز قتلهم؛ لنهيه ﷺ عن ذلك.", "- والدليل على القتل: قوله تعالى: ﴿فاقتلوا المشركين حيث وجدتموهم﴾ [التوبة: 5]. وقوله تعالى: ﴿ما كان لنبي أن يكون له أسرى حتى يثخن في الأرض﴾ [الأنفال: 67]. فأخبر سبحانه أن قتل المشركين يوم بدر كان أولى من أسرهم وفدائهم.", "ولحديث أنس بن مالك رضي الله عنه أن رسول الله ﷺ دخل عام الفتح وعلى رأسه المغفر، فلما نزعه جاء رجل فقال: إن ابن خطل متعلق بأستار الكعبة فقال «اقتلوه»، وقتل ﷺ رجال بني قريظة.", "- والدليل على الاسترقاق: حديث أبي سعيد الخدري رضي الله عنه في قصة بني قريظة لما نزلوا على حكم سعد بن معاذ، فحكم أن تقتل المقاتلة، وتسبى الذرية.", "- والدليل على المن والفداء: قوله تعالى: ﴿فإذا لقيتم الذين كفروا فضرب الرقاب حتى إذا أثخنتموهم فشدوا الوثاق فإما منا بعد وإما فداء حتى تضع الحرب أوزارها﴾ [محمد: 4]. وينبغي للإمام أن يفعل الأصلح من هذه الخصال؛ لأن تصرفه لغيره، فلزم أن يكون تخييره للمصلحة."]], "ic": "scroll"}, {"story": ["المسألة الثانية: تقسيم الغنيمة بين الغانمين", ["الغنيمة: اسم لما يؤخذ من أموال الكفرة قهرا بقتال، على وجه يكون فيه إعلاء كلمة الله تعالى، وتسمى أيضا: الأنفال -جمع نفل- لأنها زيادة في أموال المسلمين.", "والأصل في مشروعيتها قوله تعالى: ﴿فكلوا مما غنمتم حلالا طيبا واتقوا الله إن الله غفور رحيم﴾ [الأنفال: 69] وقد أحل الله الغنائم لأمة محمد ﷺ دون الأمم السابقة، قال ﷺ: «وأحلت لي الغنائم، ولم تحل لأحد قبلي».", "وتشمل الغنائم: الأموال المنقولة، والأسرى، والأرض.", "وذهب جمهور العلماء إلى أن الغنيمة تقسم على خمسة أسهم:", "السهم الأول: سهم الإمام، وهو خمس الغنيمة يخرجه الإمام أو نائبه.", "ويقسم هذا الخمس على ما بين الله في قوله: ﴿واعلموا أنما غنمتم من شيء فأن لله خمسه وللرسول ولذي القربى واليتامى والمساكين وابن السبيل﴾ [الأنفال: 41]", "فيقسم هذا الخمس خمسة أقسام:", "1- الله ورسوله: ويكون هذا القسم فيما يدخل في بيت المال وينفق في مصالح المسلمين؛ لقوله ﷺ: «والذي نفسي بيده، مالي مما أفاء الله إلا الخمس، والخمس مردود عليكم». فجعله ﷺ لجميع المسلمين.", "2- ذوي القربى: وهم قرابة الرسول ﷺ وهم: بنو هاشم وبنو المطلب، ويقسم هذا الخمس بينهم حسب الحاجة.", "3- اليتامى: وهو من مات أبوه قبل أن يبلغ، ذكرا كان أم أنثى، ويعم ذلك الغني منهم والفقير.", "4- المساكين: ويدخل فيهم الفقراء هنا.", "5- ابن السبيل: وهو المسافر الذي انقطعت به السبيل، فيعطى ما يبلغه إلى مقصده.", "وأما باقي السهام الأربعة -أربعة أخماس- فتكون لكل من شهد الوقعة: من الرجال البالغين، الأحرار، العقلاء، ممن استعد للقتال سواء باشر القتال أو لم يباشر، قويا كان أو ضعيفا؛ لقول عمر رضي الله عنه: «الغنيمة لمن شهد الوقعة».", "وكيفية التقسيم: أن يعطى الراجل -الذي يقاتل على رجليه- سهما واحدا، ويعطى الفارس -الذي يقاتل على فرسه- ثلاثة أسهم، سهم له وسهمان لفرسه؛ لحديث ابن عمر رضي الله عنهما: أن رسول الله ﷺ قسم في النفل: للفرس سهمين، وللراجل سهما، ولأن النبي ﷺ فعل ذلك في خيبر «جعل للراجل سهما واحدا، وللفارس ثلاثة أسهم»، وذلك لأن غناء الفارس ونفعه أكثر من غناء الراجل.", "وأما النساء والعبيد والصبيان إذا حضروا الوقعة، فالصحيح أنه يرضخ لهم ولا يقسم لهم؛ لقول ابن عباس رضي الله عنهما لمن سأله: إنك كتبت تسألني عن المرأة والعبد يحضران المغنم، هل يقسم لهما شيء؟ وإنه ليس لهما شيء إلا أن يحذيا. وفي لفظ: وأما المملوك فكان يحذى.", {"note": "حاشية (ص216): الرضخ: إعطاء الشيء ليس بالكثير. ويحذيا: يعني يعطيا."}, "وإذا كانت الغنيمة أرضا خير الإمام بين قسمتها بين الغانمين، ووقفها لمصالح المسلمين ويضرب عليها خراجا مستمرا يؤخذ ممن هي بيده، سواء أكان مسلما أم ذميا، فيؤخذ منه ذلك في كل عام، وهذا التخيير يكون تخيير مصلحة."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: مصرف الفيء", ["الفيء: ما أخذ من أموال أهل الحرب بحق من غير قتال، كالأموال التي يهرب الكفار ويتركونها فزعا عند علمهم بقدوم المسلمين.", {"note": "حاشية (ص217): الإيجاف: الإسراع، أي: لم يعدوا في تحصيله خيلا ولا إبلا، وإنما حصل بغير قتال."}, "أما مصرفه: فهو في مصالح المسلمين بحسب ما يراه الإمام كرزق القضاة، والمؤذنين، والأئمة، والفقهاء، والمعلمين وغير ذلك من مصالح المسلمين؛ لما ثبت عن عمر رضي الله عنه قال: كانت أموال بني النضير مما أفاء الله على رسوله ﷺ مما لم يوجف المسلمون عليه بخيل ولا ركاب، فكانت لرسول الله ﷺ خاصة، وكان ينفق على أهله نفقة سنته، ثم يجعل ما بقي في الكراع والسلاح عدة في سبيل الله عز وجل.", {"note": "حاشية (ص217): الكراع: الخيل."}, "ولهذا ذكر الله تعالى كل فئات المسلمين في معرض بيان مصارف الفيء فقال سبحانه وتعالى: ﴿ما أفاء الله على رسوله من أهل القرى فلله وللرسول ولذي القربى واليتامى والمساكين وابن السبيل كي لا يكون دولة بين الأغنياء منكم﴾ [الحشر: 7]، فيأخذ منه الإمام من غير تقدير، ويعطي القرابة باجتهاد، ويصرف الباقي في مصالح المسلمين."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 2, "q": "أسرى الكفار من الرجال أمرهم إلى:", "o": ["الإمام", "كل مجاهد", "القاضي", "أولياء الشهداء"], "h": "راجع: ص214 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "من الخصال التي يخير فيها الإمام في أسرى الرجال:", "o": ["القتل والاسترقاق والمن والفداء", "القتل فقط", "الفداء فقط", "الإطلاق فقط"], "h": "راجع: ص214 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "النساء والصبيان من الأسرى:", "o": ["يسترقون بمجرد السبي ولا يجوز قتلهم", "يقتلون", "يخير فيهم الإمام", "يطلقون"], "h": "راجع: ص214 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "الغنيمة تقسم عند جمهور العلماء على:", "o": ["خمسة أسهم", "ثلاثة أسهم", "أربعة أسهم", "عشرة أسهم"], "h": "راجع: ص215 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "الذي يعطى الفارس من سهام الغنيمة:", "o": ["ثلاثة أسهم", "سهم واحد", "سهمان", "أربعة أسهم"], "h": "راجع: ص216 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "الذي يعطى الراجل من سهام الغنيمة:", "o": ["سهما واحدا", "ثلاثة أسهم", "سهمين", "لا شيء"], "h": "راجع: ص216 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "النساء والعبيد والصبيان إذا حضروا الوقعة:", "o": ["يرضخ لهم ولا يقسم لهم", "يقسم لهم كالرجال", "لا يعطون شيئا", "يعطون الخمس"], "h": "راجع: ص216 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "الفيء هو:", "o": ["ما أخذ من أموال أهل الحرب بحق من غير قتال", "ما أخذ بقتال", "ما أخذ من المسلمين", "ما أهدي للإمام"], "h": "راجع: ص217 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "مصرف الفيء:", "o": ["في مصالح المسلمين بحسب ما يراه الإمام", "للغانمين فقط", "للإمام وحده", "للفقراء فقط"], "h": "راجع: ص217 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "الغنيمة هي ما يؤخذ من أموال الكفرة قهرا بقتال.", "a": true, "h": "راجع: ص215 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "أحل الله الغنائم لأمة محمد ﷺ دون الأمم السابقة.", "a": true, "h": "راجع: ص215 (المسألة الثانية)"}]}], "sum": [["حكم أسرى الكفار", "ص214-217"], ["تقسيم الغنيمة بين الغانمين", "ص214-217"], ["مصرف الفيء", "ص214-217"]]}, {"id": "l48", "title": "الباب الثالث: في الهدنة والذمة والأمان", "group": "الكتاب السادس: الجهاد", "map": {"center": "الباب الثالث\nالجهاد", "nodes": [{"t": "عقد الهدنة مع الكفار", "s": []}, {"t": "عقد الذمة، ودفع الجزية", "s": []}, {"t": "عقد الأمان", "s": []}]}, "paras": [{"t": "الباب الثالث: في الهدنة والذمة والأمان", "b": [{"pic": ["scroll", "book"], "cap": "ص217-220"}, {"story": ["المسألة الأولى: عقد الهدنة مع الكفار", ["1- تعريفها: الهدنة لغة: السكون. وشرعا: عقد الإمام أو نائبه لأهل الحرب على ترك القتال مدة معلومة بقدر الحاجة وإن طالت، وتسمى: مهادنة، ومودعة، ومعاهدة.", "2- مشروعيتها ودليل ذلك: يجوز لإمام المسلمين عقد الهدنة مع الكفار على ترك القتال مدة معلومة بقدر الحاجة، إذا كان في عقدها مصلحة للمسلمين. كضعفهم أو عدم استعدادهم، أو غير ذلك من المصالح، كطمع في إسلام الكفار ونحوه، لقوله تعالى: ﴿وإن جنحوا للسلم فاجنح لها﴾ [الأنفال: 61]. وقد عقد النبي ﷺ الهدنة مع الكفار في صلح الحديبية عشر سنين، وصالح اليهود في المدينة.", "3- لزوم الهدنة:", "- تكون الهدنة التي عقدها الإمام أو نائبه لازمة، لا يجوز نقضها ولا إبطالها، ما استقاموا لنا، ولم يخونوا، ولم نخش منهم خيانة؛ لقوله تعالى: ﴿فما استقاموا لكم فاستقيموا لهم﴾ [التوبة: 7] وقوله تعالى: ﴿يا أيها الذين آمنوا أوفوا بالعقود﴾ [المائدة: 1]", "- فإن نقضوا العهد: بقتال، أو مظاهرة عدونا علينا، أو قتل مسلم، أو أخذ مال، انتقض العهد الذي بيننا وبينهم وجاز قتالهم؛ لقوله تعالى: ﴿وإن نكثوا أيمانهم من بعد عهدهم وطعنوا في دينكم فقاتلوا أئمة الكفر إنهم لا أيمان لهم لعلهم ينتهون﴾ [التوبة: 12].", "- وإن خيف منهم نقض العهد بأمارة تدل على ذلك، جاز أن ننبذ إليهم عهدهم ولا يلزم البقاء على عهدهم، قال تعالى: ﴿وإما تخافن من قوم خيانة فانبذ إليهم على سواء﴾ [الأنفال: 58]. أي: أعلمهم بنقض عهدهم، حتى تكون أنت وهم سواء في العلم، ولا يجوز قتالهم قبل إعلامهم بنقض العهد."]], "ic": "scroll"}, {"story": ["المسألة الثانية: عقد الذمة، ودفع الجزية", ["1- تعريفه: الذمة لغة: العهد، وهو الأمان والضمان.", "وعقد الذمة اصطلاحا: هو إقرار بعض الكفار على كفرهم، بشرط بذل الجزية، والتزام أحكام الملة التي حكمت بها الشريعة الإسلامية عليهم.", "2- مشروعيته: الأصل في مشروعية عقد الذمة قوله تعالى: ﴿قاتلوا الذين لا يؤمنون بالله ولا باليوم الآخر ولا يحرمون ما حرم الله ورسوله ولا يدينون دين الحق من الذين أوتوا الكتاب حتى يعطوا الجزية عن يد وهم صاغرون﴾ [التوبة: 29] وقوله ﷺ في حديث بريدة: «ثم ادعهم إلى الإسلام، فإن أجابوك، فاقبل منهم، وكف عنهم... فإن هم أبوا فاسألهم الجزية».", "3- من تؤخذ منه الجزية؟ تؤخذ الجزية من الرجال، المكلفين، الأحرار، الأغنياء القادرين على الأداء، فلا تؤخذ من العبد؛ لأنه لا يملك فكان بمنزلة الفقير، ولا تؤخذ من المرأة والصبي والمجنون؛ لأنهم ليسوا من أهل القتال، ولا تؤخذ من المريض المزمن، والشيخ الكبير؛ لأن دماءهم محقونة، فأشبهوا النساء.", "4- موجب عقد الذمة: يوجب هذا العقد مع الكفار: حرمة قتالهم، والحفاظ على أموالهم، وصيانة أعراضهم، وكفالة حريتهم، وعدم إيذائهم، ومعاقبة من قصدهم بأذى، لقوله ﷺ: «وإذا لقيت عدوك من المشركين، فادعهم إلى ثلاث خصال -أو خلال- فأيتهن ما أجابوك فاقبل منهم، وكف عنهم»."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: عقد الأمان", ["1- تعريفه:", "الأمان لغة: ضد الخوف.", "واصطلاحا: هو عبارة عن تأمين الكافر على ماله ودمه مدة محدودة.", "2- مشروعيته وأدلة ذلك:", "الأصل في مشروعية عقد الأمان قوله تعالى: ﴿وإن أحد من المشركين استجارك فأجره حتى يسمع كلام الله ثم أبلغه مأمنه﴾ [التوبة: 6].", "3- ممن يصح وشروطه: يصح عقد الأمان من كل أحد من المسلمين، بشرط أن يكون:", "- عاقلا بالغا: فلا يصح من المجنون والطفل.", "- مختارا: فلا يصح من المكره، ولا السكران، ولا المغمى عليه.", "فيصح من المرأة لقوله ﷺ: «قد أجرنا من أجرت يا أم هانئ». ويصح من العبد؛ لقوله ﷺ: «ذمة المسلمين واحدة، يسعى بها أدناهم».", "ويكون الأمان عاما: من الإمام لجميع المشركين، أو من الأمير لأهل بلده، وخاصا: من آحاد الرعية المسلمين لواحد من الأعداء. والأمان العام من تصرفات إمام المسلمين؛ لأن ولايته عامة، وليس لأحد أن يفعل ذلك إلا بموافقته.", "ويقع الأمان بكل ما يدل عليه من قول مثل: (أنت آمن)، أو: (أجرتك)، أو (لا بأس عليك)، أو إشارة مفهمة.", "والمستأمن: هو الذي يطلب الأمان ليسمع كلام الله ويعرف شرائع الإسلام، فتلزم إجابته للآية السابقة، ثم يرد إلى مأمنه.", "4- حكم الأمان وما يلزم به: يلزم الوفاء بعقد الأمان، فيحرم قتل المستأمن أو أسره أو استرقاقه، وكذا الالتزام بسائر الأمور المتفق عليها في عقد الأمان.", "ويجوز نبذ الأمان إلى الأعداء، إن خيف شرهم وخيانتهم."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "الهدنة لغة:", "o": ["السكون", "القتال", "الأمان", "العهد"], "h": "راجع: ص217 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "الهدنة شرعا:", "o": ["عقد الإمام أو نائبه لأهل الحرب على ترك القتال مدة معلومة بقدر الحاجة", "عقد الأمان للفرد", "فرض الجزية", "تقسيم الغنيمة"], "h": "راجع: ص217 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "عقد النبي ﷺ الهدنة مع الكفار في صلح الحديبية مدة:", "o": ["عشر سنين", "سنة", "ثلاث سنين", "شهر"], "h": "راجع: ص218 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "إذا نقض الكفار العهد:", "o": ["انتقض العهد وجاز قتالهم", "يبقى العهد", "يجب دفع الجزية", "يرد إلى مأمنه"], "h": "راجع: ص218 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "الذمة لغة:", "o": ["العهد، وهو الأمان والضمان", "القتال", "الأسر", "الفيء"], "h": "راجع: ص218 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "لا تؤخذ الجزية من:", "o": ["العبد والمرأة والصبي والمجنون", "الرجل الحر الغني", "الرجال المكلفين", "الأغنياء القادرين"], "h": "راجع: ص219 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "الأمان لغة:", "o": ["ضد الخوف", "العهد", "القتال", "الذمة"], "h": "راجع: ص219 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "عقد الأمان يصح من:", "o": ["العاقل البالغ المختار", "المجنون", "الطفل", "المكره"], "h": "راجع: ص219 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "المستأمن هو الذي:", "o": ["يطلب الأمان ليسمع كلام الله ويعرف شرائع الإسلام", "يقاتل المسلمين", "يدفع الجزية", "يسكن بلاد المسلمين دائما"], "h": "راجع: ص220 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "قال ﷺ: «ذمة المسلمين واحدة، يسعى بها أدناهم».", "a": true, "h": "راجع: ص220 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "يصح عقد الأمان من المرأة.", "a": true, "h": "راجع: ص220 (المسألة الثالثة)"}]}], "sum": [["عقد الهدنة مع الكفار", "ص217-220"], ["عقد الذمة، ودفع الجزية", "ص217-220"], ["عقد الأمان", "ص217-220"]]}, {"id": "l49", "title": "الباب الأول: في البيوع", "group": "الكتاب السابع: المعاملات", "map": {"center": "الباب الأول\nالمعاملات", "nodes": [{"t": "تعريف البيع وحكمه", "s": []}, {"t": "أركان البيع", "s": []}, {"t": "الإشهاد على البيع", "s": []}, {"t": "الخيار في البيع", "s": []}, {"t": "شروط البيع", "s": []}]}, "paras": [{"t": "الباب الأول: في البيوع", "b": [{"pic": ["scroll", "book"], "cap": "ص221-230"}, {"story": ["المسألة الأولى: تعريف البيع وحكمه", ["أ- تعريفه:", "البيع في اللغة: أخذ شيء، وإعطاء شيء.", "وفي الشرع: مبادلة مال بمال ولو في الذمة، أو منفعة مباحة على التأبيد، غير ربا وقرض.", "ب- حكمه:", "البيع جائز؛ لقوله تعالى: ﴿وأحل الله البيع﴾ [البقرة: 275].", "ولما روى ابن عمر رضي الله عنهما، أن رسول الله ﷺ قال: «إذا تبايع الرجلان، فكل واحد منهما بالخيار ما لم يتفرقا، وكانا جميعا».", "وأجمع المسلمون على جواز البيع في الجملة.", "وحاجة الناس داعية إلى وجوده؛ لأن الإنسان يحتاج إلى ما في يد غيره، وتتعلق به مصلحته، ولا وسيلة له إلى الوصول إليه وتحصيله بطريق صحيح، إلا بالبيع، فاقتضت الحكمة جوازه، ومشروعيته؛ للوصول إلى الغرض المطلوب."]], "ic": "scroll"}, {"story": ["المسألة الثانية: أركان البيع", ["أركانه ثلاثة: عاقد، ومعقود عليه، وصيغة.", "فالعاقد يشمل البائع والمشتري، والمعقود عليه المبيع، والصيغة هي الإيجاب والقبول.", "والإيجاب: اللفظ الصادر من البائع، كأن يقول: بعت.", "والقبول: اللفظ الصادر من المشتري، كأن يقول: اشتريت.", "وهذه هي الصيغة القولية.", "أما الصيغة الفعلية فهي المعاطاة، وهي الأخذ والإعطاء، كأن يدفع المشتري ثمن السلعة إلى البائع، فيعطيه إياها بدون قول."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: الإشهاد على البيع", ["الإشهاد على البيع مستحب وليس بواجب؛ لقوله تعالى: ﴿وأشهدوا إذا تبايعتم﴾ [البقرة: 282]، فأمر الله تعالى بالإشهاد عند البيع، غير أن الأمر للاستحباب، بدليل قوله تعالى: ﴿فإن أمن بعضكم بعضا فليؤد الذي اؤتمن أمانته﴾ [البقرة: 283]، فدل على أن الأمر إنما هو أمر إرشاد؛ للتوثيق والمصلحة.", "وعن عمارة بن خزيمة، أن عمه حدثه -وهو من أصحاب النبي ﷺ- أنه عليه الصلاة والسلام ابتاع فرسا من أعرابي، واستتبعه ليقبض ثمن فرسه، فأسرع النبي ﷺ، وأبطأ الأعرابي، وطفق الرجال يتعرضون للأعرابي فيسومونه بالفرس، وهم لا يشعرون أن النبي ﷺ ابتاعه. ومعنى «يسومونه»: يطلبون شراءه منه.", "ووجه الدلالة: أن النبي ﷺ اشترى الفرس من الأعرابي، ولم يكن بينهما بينة، ولو كانت واجبة في البيع لم يشتر النبي ﷺ إلا بعد الإشهاد.", "وكان الصحابة ﷺ يتبايعون في عصره ﷺ في الأسواق، ولم ينقل عنه أنه أمرهم بالإشهاد، ولا نقل عنهم فعله.", "ولأن الشراء والبيع من الأمور التي تكثر بين الناس في الأسواق في حياتهم اليومية، فلو أشهدوا على كل شيء، لأدى إلى الحرج والمشقة.", "لكن إن كان المعقود عليه من الصفقات الكبيرة المؤجلة الثمن، مما يحتاج إلى توثيق، فينبغي كتابة ذلك، والإشهاد عليه؛ للرجوع إلى الوثيقة إذا وقع خلاف بين الطرفين."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: الخيار في البيع", ["الخيار: أن يكون لكل من البائع والمشتري الحق في إمضاء عقد البيع، أو فسخه.", "فالأصل في عقد البيع أن يكون لازما، متى انعقد مستوفيا أركانه وشروطه، ولا يحق لأي من المتعاقدين الرجوع عنه.", "إلا أن الدين الإسلامي دين السماحة واليسر، يراعي المصالح والظروف لجميع أفراده. ومن ذلك أن المسلم إذا اشترى سلعة أو باعها لسبب ما، ثم ندم على ذلك، فقد أباح له الشرع الخيار حتى يفكر في أمره، وينظر في مصلحته، فيقدم على البيع أو يتراجع عنه، على ما يراه مناسبا له.", "أقسام الخيار:", "للخيار أقسام، أهمها:", "أولا: خيار المجلس: وهو المكان الذي يجري فيه التبايع، فيكون لكل واحد من العاقدين الخيار ما دام في مجلس العقد ولم يتفرقا منه؛ لحديث ابن عمر، أن النبي ﷺ قال: «البيعان بالخيار ما لم يتفرقا».", "ثانيا: خيار الشرط: وهو أن يشترط المتعاقدان، أو أحدهما الخيار إلى مدة معلومة، لإمضاء العقد أو فسخه، فإذا انتهت المدة المحددة بينهما من بداية العقد، ولم يفسخ صار لازما.", "مثاله: أن يشتري رجل من آخر سيارة، ويقول المشتري: لي الخيار مدة شهر كامل، فإن تراجع عن الشراء خلال الشهر فله ذلك، وإلا لزمه شراء السيارة بمجرد انتهاء الشهر.", "ثالثا: خيار العيب: وهو الذي يثبت للمشتري إذا وجد عيبا في السلعة، لم يخبره به البائع، أو لم يعلم البائع به، وتنقص بسبب هذا العيب قيمة السلعة، ويرجع في معرفة ذلك إلى أهل الخبرة من التجار المعتبرين، فما عدوه عيبا ثبت به الخيار، وإلا فلا.", "ويثبت هذا الخيار للمشتري، فإن شاء أمضى البيع، وأخذ عوض العيب، وهو الفرق بين قيمة السلعة صحيحة وقيمتها وهي معيبة، وإن شاء رد السلعة، واسترد الثمن الذي دفعه إلى البائع.", "رابعا: خيار التدليس: وهو: أن يدلس البائع على المشتري ما يزيد به الثمن، وهذا الفعل محرم؛ لقوله ﷺ: «من غشنا فليس منا».", "مثاله: أن يكون عنده سيارة، فيها عيوب كثيرة في داخلها، فيعمد إلى إظهارها بلون جميل، ويجعل مظهرها الخارجي براقا حتى يخدع المشتري بأنها سليمة فيشتريها. ففي هذه الحالة يكون للمشتري الحق في رد السلعة على البائع واسترجاع الثمن."]], "ic": "scroll"}, {"story": ["المسألة الخامسة: شروط البيع", ["يشترط لصحة البيع الشروط الآتية:", "أولا: التراضي بين البائع والمشتري. قال تعالى: ﴿يا أيها الذين آمنوا لا تأكلوا أموالكم بينكم بالباطل إلا أن تكون تجارة عن تراض منكم﴾ [النساء: 29].", "وعن أبي سعيد الخدري رضي الله عنه أن النبي ﷺ قال: «إنما البيع عن تراض».", "فلا يصح البيع إذا أكره أحدهما بغير حق، فإن كان الإكراه بحق، كأن يكره الحاكم شخصا على بيع شيء لسداد دينه، صح.", "ثانيا: كون العاقد جائز التصرف، بأن يكون بالغا عاقلا حرا رشيدا.", "ثالثا: أن يكون البائع مالكا للمبيع، أو قائما مقام مالكه، كالوكيل والوصي والولي والناظر. فلا يصح أن يبيع شخص شيئا لا يملكه؛ لقوله ﷺ لحكيم بن حزام رضي الله عنه: «لا تبع ما ليس عندك».", "رابعا: أن يكون المباع مما يباح الانتفاع به من غير حاجة، كالمأ
