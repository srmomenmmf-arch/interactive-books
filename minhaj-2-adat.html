خص خاصته، وعلى أصحابه وأتباعه على ملته، وأسلم تسليما كثيرا.", "أما بعد، فإن الناس اختلفوا في العزلة والمخالطة أيتهما أفضل مع أن كل واحدة منهما لا تنفك عن فوائد وغوائل، فأكثر الزهاد اختاروا العزلة، وكشف الغطاء عن الحق في ذلك مهم ويحصل ذلك برسم بابين:", "الباب الأول: في نقل المذاهب والحجج فيها.", "الباب الثاني: في كشف الغطاء عن الحق بحصر الفوائد والغوائل.", "حاشية: (١) في الأصل: «الخضرته»."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "أما بعد، فإن الناس اختلفوا في العزلة والمخالطة أيتهما أفضل مع أن كل واحدة منهما لا تنفك عن فوائد وغوائل، فأكثر الزهاد اختاروا العزلة، وكشف الغطاء عن الحق في ذلك مهم ____ ذلك برسم بابين", "o": ["ويحصل", "السطر", "جرير", "بعبارة"], "h": "راجع: ص٤٥٩"}, {"t": "fill", "d": 2, "q": "أحمده على سبوغ نعمته وأفضلها بلوغ معرفته، وأصلي على رسوله محمد أخص خاصته، ____ أصحابه وأتباعه على ملته، وأسلم تسليما كثيرا", "o": ["وعلى", "لعمري", "وأسأل", "فغاب"], "h": "راجع: ص٤٥٩"}, {"t": "fill", "d": 2, "q": "الحمد لله الذي آنس العارف له بخلوته، وشغله بلذة مناجاته عن خليقته، فاعتزل عن زخرف الهوى وزهرته، ففتح له في الوحدة بستان فكرته، فهو يميس بحضرته في خضرته، فيرى ____ بين الفردوس والمزبلة ببصر بصيرته", "o": ["الفرق", "فشكوا", "ترضى", "والمجرة"], "h": "راجع: ص٤٥٩"}]}], "sum": [["الصفحات", "ص٤٥٩ - ص٤٥٩"]], "_nq": 3}, {"id": "l30", "title": "الباب الأول في نقل المذاهب والحجج فيها", "group": "كتاب العزلة", "map": {"center": "الباب\nالأول في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الأول في نقل المذاهب والحجج فيها", "b": [{"pic": ["books", "book"], "cap": "ص٤٦٠ - ص٤٦٣"}, {"story": ["الباب الأول في نقل المذاهب والحجج فيها (١ من ٣)، ص٤٦٠", ["**في نقل المذاهب والحجج فيها**", "**أما المذاهب:** فقد ذهب إلى اختيار العزلة وتفضيلها على المخالطة سفيان الثوري، وإبراهيم بن أدهم، وداود الطائي، والفضيل، وسليمان الخواص، ويوسف بن أسباط، وحذيفة المرعشي، وبشر الحافي في آخرين.", "واستحب قوم المخالطة واستكثار المعارف والإخوان تعاونا على البر، وإلى هذا مال سعيد بن المسيب، وشريح، والشعبي، وابن أبي ليلى، وهشام بن عروة وابن شبرمة، وشريك بن عبد الله، وابن عيينة، وابن المبارك في آخرين.", "والمأثور عن العلماء من الكلمات ينقسم إلى كلمات مطلقة تدل على الميل إلى أحد الرأيين، وإلى كلمات مقرونة بما يشير إلى علة الميل، فلنذكر من مطلقات الكلمات لنبين المذاهب فيها، ونؤخر ما هو مقرون بذكر العلة فنورده عند التعرض لذكر الغوائل والفوائد.", "أخبرنا عبد الأول قال: أخبرنا الداوودي قال: حدثنا ابن أعين السرخسي قال: حدثنا الفربري قال: حدثنا البخاري قال: حدثنا أبو اليمان قال: حدثنا شعيب عن الزهري عن عطاء بن يزيد عن أبي سعيد قال: قيل: يا رسول الله، أي الناس خير؟ قال: «رجل يجاهد بنفسه وماله، ورجل في شعب من الشعاب يعبد ربه ويدع الناس من شره». أخرجاه في الصحيحين.", "وفي حديث عقبة بن عامر قال: قلت: يا رسول الله، ما النجاة؟ قال: «املك عليك لسانك، وليسعك بيتك، وابك على خطيئتك».", "وقال عمر بن الخطاب: خذوا بحظكم من العزلة.", "وقال سعد بن أبي وقاص: والله لوددت أن بيني وبين الناس بابا من حديد لا يكلمني أحد ولا أكلمه حتى ألحق بالله سبحانه.", "وقال ابن مسعود لأصحابه: كونوا ينابيع العلم، مصابيح الليل، أحلاس(١) البيوت، جدد القلوب، خلقان(٢) الثياب، تعرفون في أهل السماء، وتخفون على أهل الأرض.", "وكان أبو الجهيم الحارث بن الصمة لا يجالس الأنصار، فإذا ذكرت له الوحدة قال: الناس شر من الوحدة.", "وقال حذيفة: والله لوددت أن لي إنسانا يكون في مالي، ثم أغلق علي بابا فلا يدخل علي أحد حتى ألحق بالله عز وجل.", "وقال أبو الدرداء: نعم صومعة المرء المسلم بيته، يكف لسانه وفرجه وبصره، وإياكم ومجالس الأسواق(٣)، فإنها تلهي وتلغي.", "وقال سعيد بن المسيب: عليك بالعزلة فإنها عبادة.", "وقال مكحول إن كان الفضل في الجماعة، فإن السلامة في العزلة.", "وقال داود الطائي: فر من الناس كما تفر من الأسد.", "وقال سفيان الثوري: ما شيء خير للإنسان من جحر يدخل فيه.", "وقال أبو مهلهل: أخذ بيدي سفيان الثوري، فأخرجني إلى الجبان(٤)، فاعتزلنا ناحية فبكا، ثم قال: يا أبا مهلهل، إن استطعت أن لا تخالط في زمانك هذا أحدا فافعل، وليكن همك(٥) مرمة(٦) جهازك.", "وقال عبد الله بن مرزوق: استشرت سفيان الثوري: أين أنزل؟ فقال: بمر الظهران، حيث لا يعرفك إنسان.", "حاشية: (١) أحلاس: جمع حلس، وهو الكساء الذي يلي ظهر البعير، والمقصود: ملازمو البيوت.", "حاشية: (٢) يقال: خلق الثوب، أي: بلي."]], "ic": "book"}, {"story": ["الباب الأول في نقل المذاهب والحجج فيها (٢ من ٣)، ص٤٦١", ["حاشية: (٣) في (ظ): «الأشراف»، وكتبت بالهامش إلى جانبها: «الأسواق».", "حاشية: (٤) الجبان والجبانة: المقبرة.", "حاشية: (٥) سقطت من الأصل.", "حاشية: (٦) مرمة: من الترميم، أي: الإصلاح، يعني إصلاح جهازه للآخرة.", "وقال له رجل: أوصني. فقال: هذا زمان السكوت، ولزوم البيوت.", "وجاء رجل إلى الفضيل فجلس إليه، فقال له: ما أجلسك إلي؟ فقال: رأيتك وحدك. فقال: أما إنك لو لم تجلس إلي لكان خيرا لي ولك، فاختر إما أن أقوم عنك، وإما أن تقوم عني. فقال: بل أنا أقوم، فأوصني. فقال: اخف مكانك، واحفظ لسانك.", "وجاء رجل إلى شعيب بن حرب، فقال: ما جاء بك؟ قال: جئت أؤنسك. قال: جئت تؤنسني وأنا أعالج الوحدة منذ أربعين سنة؟!", "وقال مالك بن أنس: كان الناس الذين مضوا يحبون العزلة والانفراد من الناس.", "فهذه أقاويل المائلين إلى العزلة.", "**ذكر حجج المائلين إلى المخالطة ووجه ضعفها:**", "احتجوا بقوله تعالى: ﴿وَلَا تَكُونُوا۟ كَٱلَّذِينَ تَفَرَّقُوا۟ وَٱخْتَلَفُوا۟﴾ [آل عمران: ١٠٥] وبقوله تعالى: ﴿فَأَلَّفَ بَيْنَ قُلُوبِكُمْ﴾ [آل عمران: ١٠٣] فامتن عليهم بالسبب المؤلف، وهذا ضعيف؛ لأن المراد تفرق الآراء والمذاهب في أصول الشريعة، والمراد بالألفة نزع الغل من الصدور، واحتجوا بقوله عليه الصلاة والسلام: «المؤمن إلف مألوف، ولا خير في من لا يألف ولا يؤلف». وهذا ضعيف؛ لأن الإشارة به إلى سوء الخلق الذي يمنع المؤالفة.", "واحتجوا بقوله عليه الصلاة والسلام: «من فارق الجماعة فمات فميتة جاهلية». وهذا ضعيف؛ لأن المراد الاجتماع على إمام تعقد له البيعة.", "واحتجوا بقوله: «لا هجرة فوق ثلاث». قالوا: والعزلة هجرة بالكلية. وهذا ضعيف؛ لأن المراد به قطع الكلام والسلام والمخالطة المعتادة.", "واحتجوا بما روى معاذ بن جبل عن النبي ﷺ أنه قال: «إن الشيطان ذئب الإنسان، كذئب الغنم، يأخذ الشاة القاصية والناحية، فإياكم والشعاب، وعليكم", "بالجماعة والعامة والمسجد، وهذا إنما يراد به المفارقة للجماعة على الإطلاق، والانقطاع عن المساجد، فأما من قام بالواجبات والسنن ثم اعتزل، فلا وجه لذمه».", "**ذكر حجج المائلين إلى تفضيل العزلة:**"]], "ic": "book"}, {"story": ["الباب الأول في نقل المذاهب والحجج فيها (٣ من ٣)، ص٤٦٣", ["احتجوا بقوله تعالى حكاية عن إبراهيم عليه السلام: ﴿وَأَعْتَزِلُكُمْ وَمَا تَدْعُونَ مِن دُونِ ٱللَّهِ وَأَدْعُوا۟ رَبِّى﴾ إلى قوله: ﴿فَلَمَّا ٱعْتَزَلَهُمْ وَمَا يَعْبُدُونَ مِن دُونِ ٱللَّهِ وَهَبْنَا لَهُۥٓ إِسْحَٰقَ وَيَعْقُوبَ﴾ [مريم: ٤٨ـ٤٩]، فأشار إلى أن ذلك بركة العزلة، وهذا ليس بشيء؛ لأن مخالطة الكفار ليس فيها فائدة سوى دعوتهم إلى الدين، وذلك المقدار واجب على الرسل، وإنما الكلام في مخالطة المسلمين وما فيها من البركة، فإن رسول الله ﷺ أراد أن يشرب من سقاية مكة، قيل له: ألا نأتيك بشراب أنظف من هذا؟ فقال: «لا، اسقوني من هذا الماء الذي يشرب منه الناس وإنما ألتمس بركة أيدي المسلمين» فشرب منه.", "واحتجوا بقصة أهل الكهف في قوله: ﴿وَإِذِ ٱعْتَزَلْتُمُوهُمْ﴾ [الكهف: ١٦] ولا حجة في هذا؛ لأنه اعتزال للكفار.", "واحتجوا بما تقدم من حديث أبي سعيد وعقبة بن عامر، وهما محمولان على من تكون سلامته في العزلة، فإن رسول الله ﷺ لم يأمر جميع أصحابه وقد قال عليه الصلاة والسلام: «المؤمن الذي يخالط الناس ويصبر على أذاهم، خير من الذي لا يخالطهم ولا يصبر على أذاهم».", "فإذا قد ظهر أن الأدلة لا شفاء فيها من الجانبين، فلا بد فيها من كشف الغطاء بالتصريح بفوائد العزلة وغوائلها، ومقايسة بعضها ببعض ليتبين الحق فيها إن شاء الله."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "وفي حديث عقبة بن عامر قال: قلت: يا رسول الله، ما ____؟ قال: «املك عليك لسانك، وليسعك بيتك، وابك على", "o": ["النجاة", "النيل", "الأمثال", "ذهبت"], "h": "راجع: ص٤٦٠"}, {"t": "fill", "d": 2, "q": "وقال أبو مهلهل: أخذ بيدي سفيان الثوري، فأخرجني إلى الجبان، فاعتزلنا ناحية فبكا، ثم قال: يا أبا مهلهل، إن ____ أن لا تخالط في زمانك هذا أحدا فافعل، وليكن همك مرمة", "o": ["استطعت", "مفارقته", "يمتنع", "فتنقسم"], "h": "راجع: ص٤٦١"}, {"t": "fill", "d": 2, "q": "والمأثور عن العلماء من الكلمات ينقسم إلى كلمات مطلقة تدل على الميل إلى أحد الرأيين، وإلى كلمات مقرونة بما يشير إلى علة الميل، فلنذكر من مطلقات الكلمات لنبين المذاهب فيها، ونؤخر ما هو مقرون ____ العلة فنورده عند التعرض لذكر الغوائل والفوائد", "o": ["بذكر", "فيعطيه", "خفية", "العرب"], "h": "راجع: ص٤٦٠"}, {"t": "fill", "d": 2, "q": "واحتجوا بقوله: «لا هجرة فوق ثلاث». قالوا: والعزلة هجرة بالكلية. ____ ضعيف؛ لأن المراد به قطع الكلام والسلام والمخالطة", "o": ["وهذا", "لعبد", "عياش", "لخلق"], "h": "راجع: ص٤٦٢"}, {"t": "fill", "d": 2, "q": "وقال ابن مسعود لأصحابه: كونوا ينابيع العلم، مصابيح الليل، أحلاس البيوت، جدد القلوب، خلقان الثياب، ____ في أهل السماء، وتخفون على أهل", "o": ["تعرفون", "فدرها", "للضيفان", "ويسلمها"], "h": "راجع: ص٤٦١"}, {"t": "fill", "d": 2, "q": "بالجماعة والعامة والمسجد، وهذا إنما يراد به المفارقة للجماعة على الإطلاق، والانقطاع عن ____، فأما من قام بالواجبات والسنن ثم اعتزل، فلا وجه لذمه»", "o": ["المساجد", "بذنوبه", "الحسد", "والخامسة"], "h": "راجع: ص٤٦٣"}]}], "sum": [["الصفحات", "ص٤٦٠ - ص٤٦٣"]], "_nq": 6}, {"id": "l31", "title": "الباب الثاني في ذكر فوائد العزلة وغوائلها وكشف الحق في تفضيلها", "group": "كتاب العزلة", "map": {"center": "الباب\nالثاني في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الثاني في ذكر فوائد العزلة وغوائلها وكشف الحق في تفضيلها - القسم ١ من ٢", "b": [{"pic": ["books", "book"], "cap": "ص٤٦٤ - ص٤٨٠"}, {"story": ["الباب الثاني في ذكر فوائد العزلة وغوائلها وكشف الحق في تفضيل (١ من ١٢)، ص٤٦٤", ["**في ذكر فوائد العزلة وغوائلها وكشف الحق في تفضيلها**", "اعلم أن اختلاف الناس في هذا يضاهي(١) اختلافهم في فضيلة النكاح والعزوبة، وقد ذكرنا أن ذلك يختلف بالأحوال والأشخاص بحسب ما بيناه من آفات النكاح وفوائده، فكذلك القول فيما نحن فيه.", "فلنذكر أولا ＊＊فوائد العزلة:＊＊ وهي تنقسم إلى فوائد دينية ودنيوية.", "والدينية تنقسم إلى ما يمكن من تحصيل الطاعات في الخلوة بالمواظبة على العبادة والفكر، وتربية العلم وإلى ما يخلص من ارتكاب المناهي التي يتعرض الإنسان لها بالمخالطة، كالزنا، والغيبة، والسكوت عن الأمر بالمعروف والنهي عن المنكر، ومسارقة الطبع من الأخلاق الرديئة من جلساء السوء.", "وأما الدنيوية؛ فتنقسم إلى تمكن من التحصيل بالخلوة، كتمكن المحترف في خلوته، وإلى تخلص من محذورات يتعرض لها بالمخالطة، كالنظر إلى زهرة الدنيا، وإقبال الخلق عليها، وطمعه في الناس، وطمع الناس فيه، والتأذي بسوء خلق الجليس أو سوء ظنه، أو نميمته، أو حسده، فهذه مجامع فوائد العزلة، فلنحصرها في ست فوائد:", "**الفائدة الأولى:** الفراغ للعبادة، والفكر، والاستيناس بمناجاة الله سبحانه عن محادثة الخلق، والاشتغال باستكشاف أسرار الله عز وجل في أمر الدنيا والآخرة، وملكوت السموات والأرض، فإن ذلك يستدعي فراغا، ولا فراغ مع المخالطة، فالعزلة وسيلة إلى ذلك، خصوصا في البداية، وقد كان النبي ﷺ ينفرد في جبل", "حاشية: (١) تحرفت في (ظ) إلى: «أيضا هو».", "حراء، فلما قوي نور النبوة لم يحجبه الخلق عن الله تعالى، فكان ببدنه مع الخلق، وبقلبه مع الله سبحانه، وقد أخبرنا باستغراق همه بالله حين قال: «لو كنت متخذا خليلا لاتخذت أبا بكر خليلا، ولكن صاحبكم خليل الله». ولن يتسع للجمع بين مخالطة الخلق ظاهرا والإقبال على الله سرا إلا قوة النبوة، فلا ينبغي أن يغتر كل ضعيف بنفسه فيطمع في ذلك، ولا يبعد أن تنتهي درجة بعض الأولياء إلى نحو ذلك.", "فقد قال الجنيد: أنا أكلم الله منذ ثلاثين سنة، والناس يظنون أني أكلمهم. وهذا إنما يتيسر للمستغرق بحب الله تعالى استغراقا لا يبقى لغيره فيه متسع، ومثل هذا لا ينكر، فإن العشق للمخلوقين قد يفرط فيستغرق العاشق، فلا يدري ما الناس فيه وهو مخالطهم، فأمر الآخرة أعظم، إلا أن هذا ينذر، فالعزلة أولى بالمريد.", "وقد قيل لبعض الحكماء: إلى أي شيء أفضى بهم الزهد والخلوة؟ فقال: إلى الأنس بالله.", "وقيل لغزوان: لو جالست إخوانك؟ فقال: إني أصبت راحة قلبي في مجالسة من عنده حاجتي."]], "ic": "book"}, {"story": ["الباب الثاني في ذكر فوائد العزلة وغوائلها وكشف الحق في تفضيل (٢ من ١٢)، ص٤٦٥", ["وقيل للحسن: إن هاهنا رجلا لم نره قط إلا جالسا وحده خلف سارية. فقال: إذا رأيتموه فأخبروني، فأخبروه، فأتاه فقال: يا عبد الله، ما يمنعك من مجالسة الناس؟ فقال: ما أشغلني عن الناس. قال: فما يمنعك أن تأتي هذا الرجل الذي يقال له: الحسن، فتجلس إليه؟ فقال: ما أشغلني عن الحسن وعن الناس. قال: فما الذي شغلك رحمك الله؟ قال: أني أمسي وأصبح بين ذنب ونعمة، فرأيت أن أشغل نفسي بالاستغفار للذنب، والشكر لله على النعمة. فقال له الحسن: أنت يا عبد الله عندي أفقه من الحسن، الزم ما أنت عليه.", "وقال أويس: ما كنت أرى أن أحدا يعرف ربه فيأنس بغيره.", "وقال بعض الحكماء: إنما يستوحش الإنسان من الخلوة لخلو ذاته عن الفضيلة، فيطرد عن نفسه الاستيحاش بملاقاة الناس، فإذا كانت ذاته فاضلة طلب", "الوحدة ليستعين بها على الفكرة، ويستخرج العلم والحكمة، واعلم أن من تيسر له بدوام الذكر الأنس بالله، أو بدوام الفكر تحقيق معرفة الله، فالتجرد لذلك أفضل من كل ما يتعلق بالمخالطة، فإن غاية المعاملة أن ترقى إلى المعرفة والمحبة، ولا معرفة إلا بدوام الفكر، ولا محبة إلا بالأنس الحاصل(١) بدوام الذكر، وفراغ القلب شرط لكل واحد منهما، ولا فراغ مع المخالطة.", "**الفائدة الثانية:** التخلص بالعزلة من المعاصي التي يتعرض الإنسان لها غالبا بالمخالطة ويسلم منها في العزلة، وهي أربعة: الغيبة، والرياء، والسكوت عن الأمر بالمعروف والنهي عن المنكر، ومسارقة الطبع من الأخلاق الرديئة والأعمال الخبيثة التي يوجبها الحرص على الدنيا.", "أما الغيبة، فإذا عرفت(٢) في كتاب آفات اللسان من ربع المهلكات وجوهها عرفت أن التحرز منها مع المخالطة عظيم لا ينجو منها إلا الصديقون، فإن عادة الناس التمضمض بالأعراض والتفكه بها، فإن خالطتهم ووافقت أثمت وتعرضت لسخط الله، وإن سكت كنت شريكا، والمستمع أحد المغتابين، وإن أنكرت أبغضوك وتركوا ذلك المغتاب واغتابوك، فازدادوا غيبة إلى الغيبة، وربما خرجوا إلى الشتم.", "وأما الأمر بالمعروف والنهي عن المنكر فهو من أصول الدين، وهو واجب على ما سيأتي بيانه في آخر هذا الربع إن شاء الله تعالى.", "ومن خالط الناس لم يخل من مشاهدة المنكرات، فإن سكت عصى الله عز وجل، وإن أنكر تعرض لأنواع من الضرر، وفي العزلة سلامة من هذا.", "وأما الرياء، فهو الداء العضال الذي يعسر الاحتراز منه، وأقل ما في مخالطة الناس إظهار التشوق إليهم، ولا يخلو ذلك من كذب إما في الأصل وإما في الزيادة، وقد كان السلف يحترزون في جواب قول القائل: كيف أصبحت؟ وكيف", "حاشية: (١) تحرفت في (ظ) إلى: «الخالص».", "حاشية: (٢) في (ظ): «نظرت».", "أمسيت؟ وكان أويس(١) إذا قيل له: كيف أصبحت؟ قال: كيف يصبح رجل إذا أمسى لا يدري هل يصبح، وإذا أصبح لا يدري هل يمسي؟"]], "ic": "book"}, {"story": ["الباب الثاني في ذكر فوائد العزلة وغوائلها وكشف الحق في تفضيل (٣ من ١٢)، ص٤٦٧", ["وكان الربيع بن خثيم إذا قيل له: كيف أصبحت؟ قال: أصبحنا ضعفاء مذنبين، نأكل أرزاقنا، وننتظر آجالنا.", "وقيل لحامد اللفاف: كيف أصبحت؟ فقال: أصبحت أشتهي عافية يوم إلى الليل. فقيل له: ألست في عافية؟ فقال: عافية يوم أن لا أعصي فيه.", "وقيل لبعض الحكماء: كيف أصبحت؟ فقال: أصبحت لا أرضى حياتي لموتي، ولا نفسي لربي.", "وقيل لرجل وهو في الموت: ما حالك؟ فقال: ما حال من يريد سفرا بعيدا بلا زاد، ويدخل قبرا موحشا بلا مؤنس، وينطلق إلى ملك عادل بلا حجة.", "واعلم أنه إذا كان سؤال السائل لأخيه: كيف أصبحت؟ لا يبعثه شفقة عليه ومحبة لصلاح حاله كان تكلفا ورياء، وربما سأله وفي القلب ضغن وحقد يؤثر أن يعلم فساد حاله، وفي العزلة الخلاص من هذا؛ لأنه من لقي الخلق ولم يخالقهم بأخلاقهم مقتوه واستثقلوه واغتابوه، فيذهب دينهم فيه، ويذهب دينه ودنياه في الانتقام منهم.", "وأما مسارقة الطبع لما يشاهده من أخلاق الناس وأعمالهم، فهو داء دفين قلما ينتبه له العقلاء، فضلا عن الغافلين، فقل أن يجالس الإنسان فاسقا مدة مع كونه منكرا عليه في باطنه إلا ولو قاس نفسه إلى ما قبل مجالسته وجد فرقا في النفور عن الفساد واستثقاله؛ لأن الفساد يصير بكثرة المشاهدة هينا على الطبع، ويسقط وقعه واستعظامه، وإنما الوازع عنه شدة وقعه في القلب، فإذا صار مستصغرا بطول المشاهدة أوشك أن تنحل القوة الوازعة ويذعن الطبع للميل إليه، أو لما دونه، ومهما طالت مشاهدة الإنسان للكبائر من غيره احتقر الصغائر من نفسه، ولذلك", "حاشية: (١) يعني أويس بن عامر القرني.", "تؤثر مجالسة الأغنياء ازدراء الفقير بنعمة الله عليه، وتؤثر مجالسة الفقراء استعظام النعم، فكذلك النظر إلى المطيعين والعصاة يؤثر(١) في الطبع.", "ومن لاحظ أحوال السلف في الزهد والتعبد احتقر نفسه، واستصغر عبادته، فيكون ذلك داعية إلى الاجتهاد، ومن نظر إلى الأحوال الغالبة على أهل الزمان وإعراضهم عن الله، وإقبالهم على الدنيا، واعتيادهم المعاصي استعظم أمر نفسه بأدنى رغبة في الخير يصادفها في قلبه، ويكفي في تغيير الطبع مجرد سماع الخير والشر فضلا عن مشاهدته، وبهذه الدقيقة يعرف سر قول القائل: عند ذكر الصالحين تتنزل الرحمة. وليس المراد ذكر أعيانهم، بل عندما يجلبه ذكرهم من انبعاث الرغبة من القلب وحركة الحرص على الاقتداء بهم، والاستنكاف عن ما هو ملابس له من القصور والتقصير، ومبتدأ الرحمة فعل الخير، ومبتدأ فعل الخير الرغبة، ومبتدأ الرغبة ذكر أحوال الصالحين، فهذا معنى نزول الرحمة."]], "ic": "book"}, {"story": ["الباب الثاني في ذكر فوائد العزلة وغوائلها وكشف الحق في تفضيل (٤ من ١٢)، ص٤٦٨", ["ويفهم من فحوى هذا الكلام أن عند ذكر الفاسقين تتنزل اللعنة؛ لأن كثرة ذكرهم تهون على الطبع أمر المعاصي، واللعنة هي البعد، ومبتدأ البعد من الله تعالى المعاصي والإعراض عن الله بالإقبال على الحظوظ العاجلة والشهوات الحاضرة لا على المشروع، ومبتدأ المعاصي سقوط ثقلها وفاحشها عن القلب، ومبتدأ سقوط ذلك وقوع الأنس بها بكثرة السماع، وإذا كان هذا ذكر حال الصالحين والفاسقين، فما ظنك بمشاهدتهم ومجالستهم؟ وقد ذكر ذلك رسول الله ﷺ: أخبرنا عبد الأول قال: أخبرنا الداوودي قال: أخبرنا ابن أعين قال: أخبرنا الفربري قال: حدثنا البخاري قال: حدثنا محمد بن العلاء قال: حدثنا أبو أسامة عن بريد، عن أبي بردة، عن أبي موسى عن النبي ﷺ قال: «مثل الجليس الصالح وجليس السوء، كحامل المسك ونافخ الكير، فحامل المسك إما أن يحذيك وإما أن تبتاع منه، وإما أن تجد منه ريحا طيبة، ونافخ الكير إما أن يحرق ثيابك، وإما أن تجد ريحا خبيثة». أخرجاه في الصحيحين.", "حاشية: (١) سقطت من (ظ).", "ولهذا المعنى الذي ذكرناه أقول: من عرف من عالم زلة حرم عليه حكايتها لعلتين: إحداهما: أن ذكرها غيبة. والثانية: وهي أعظمها، أن حكايتها تهون على المستمعين أمر تلك الزلة، ويسقط من قلوبهم استعظامهم الإقدام عليها، فيكون ذلك سببا لتهوين تلك المعصية؛ لأنهم يقولون: إذا جرى هذا للعلماء، فكيف نحن؟! وكم من شخص يحرص على جمع الدنيا، وينهالك على حب الرياسة، ويستشهد بقول الله إخبارا عن سليمان: ﴿وَهَبْ لِى مُلْكًا لَّا يَنۢبَغِى لِأَحَدٍۢ مِّنۢ بَعْدِىٓ﴾ [ص: ٣٥] ويقدر أنه أراد الهوى والرياسة، وربما احتج بقتال علي ومعاوية(١)، وظن أن ذلك كان لطلب الرياسة لا لطلب الحق، وهذا الاعتقاد الخطأ يهون عليه أمر الرياسة ولوازمها من المعاصي، والطبع اللئيم يميل إلى اتباع الهفوات والإعراض عن الحسنات بل إلى تقدير الهفوة فيما لا هفوة فيه بالتنزيل على مقتضى الشهوة ليتعلل به، وهذه من دقائق مكايد الشيطان، فأهل اليقظة يتنبهون لمحاسن الأشياء، كما قال الله تعالى: ﴿فَيَتَّبِعُونَ أَحْسَنَهُۥٓ﴾ [الزمر: ١٨]، وأهل الغفلة يتناولون شر ما يسمعون، ويحملون المسموع على شر ما يفهمون، كما روي عن النبي ﷺ أنه قال: «مثل الذي يستمع الحكمة ثم لا يعمل إلا بشر ما يسمع، كمثل رجل أتى راعيا فقال له: يا راعي أجزرني(٢) شاة من غنمك. فقال: اذهب فخذ خير شاة فيها، فذهب فأخذ بأذن كلب الغنم». فكل من ينقل هفوات الأئمة، فهذا مثله."]], "ic": "book"}, {"story": ["الباب الثاني في ذكر فوائد العزلة وغوائلها وكشف الحق في تفضيل (٥ من ١٢)، ص٤٦٩", ["ومما يدل على سقوط وقع الشيء عن القلب بسبب تكرره ومشاهدته أن أكثر الناس إذا رأوا مسلما قد أفطر في رمضان استفظعوا ذلك حتى يكاد يفضي إلى اعتقادهم فيه الكفر، وقد يشاهدون من يؤخر الصلوات عن أوقاتها فلا ينفرون عنه نفورهم عن تأخير الصوم، مع أن ترك صلاة واحدة يخرج إلى الكفر، ولا سبب لذلك إلا أن الصلاة تتكرر، والتساهل فيها يكثر، فيسقط وقعها بالمشاهدة عن القلب، وكذلك لو لبس الفقيه ثوبا من حرير أو خاتما من ذهب، أو شرب من إناء", "حاشية: (١) يعني بذلك ما جرى من وقعة صفين سنة ٣٧ للهجرة، ينظر: تاريخ الطبري ٥/ ٥ وما بعدها، والبداية والنهاية ١٠/ ٥٠٢ وما بعدها.", "حاشية: (٢) يقال: أجزرت للقوم، أي: أعطيتهم شاة يذبحونها. ولا يقال إلا في الغنم خاصة.", "من فضة لاستبعدته النفوس واشتد إنكاره، وقد يشاهد ذلك الفقيه يغتاب الناس، فلا يستعظم ذلك، والغيبة أشد من لبس الحرير، ولكن كثرة سماعها ومشاهدة المغتابين أسقط عن القلوب وقعها، وهون على النفوس أمرها، فتفطن لهذه الدقائق واحذر مجالسة الناس، فإنك لا تكاد ترى منهم إلا ما يزيد في حرصك على الدنيا، وغفلتك عن الآخرة، ويهون عليك المعصية، ويضعف رغبتك في الطاعة، فإن وجدت جليسا يذكر الله شخصه وسيرته فلا تفارقه، فإنه غنيمة المؤمن.", "**الفائدة الثالثة:** الخلاص من الفتن والخصومات، وصيانة الدين عن الخوض فيها والتعرض لأخطارها، وقلما تخلو البلاد من العصبية والخصومات، والمعتزل عنهم سليم(١). وقد روى عبد الله بن عمرو أن النبي ﷺ ذكر الفتن ووصفها وقال: «إذا رأيت الناس قد مرجت عهودهم، وخفت أماناتهم، وكانوا هكذا، وشبك بين أصابعه» فقلت: ما تأمرني؟ فقال: «الزم بيتك، واملك عليك لسانك، وخذ ما تعرف، ودع ما تنكر، وعليك بأمر الخاصة، ودع عنك أمر العامة». وفي أفراد البخاري من حديث أبي سعيد عن النبي ﷺ أنه قال: «يوشك أن يكون خير مال المسلم غنم يتبع بها شعف(٢) الجبال ومواقع القطر، يفر بدينه من الفتن» وفي أفراد مسلم من حديث أبي بكرة عن النبي ﷺ أنه قال: «ستكون فتنة القاعد خير من الماشي فيها، والماشي فيها خير من الساعي إليها، ألا فإذا نزلت أو وقعت، فمن كان له إبل فليلحق بإبله، ومن كان له غنم فليلحق بغنمه، ومن كانت له أرض فليلحق بأرضه». فقال رجل: يا رسول الله، أرأيت من لم تكن له إبل ولا غنم ولا أرض؟ قال: «يعمد إلى سيفه فيدق على حده بحجر، ثم لينج إن استطاع النجا، اللهم هل بلغت» فقال رجل: يا رسول الله، أرأيت إن أكرهت حتى ينطلق بي إلى أحد الصفين أو إحدى الفئتين فضربني رجل بسيفه أو يجيء سهم فيقتلني؟ فقال: «يبوء بإثمه وإثمك فيكون من أصحاب النار». فإذن الحذر من الخصومات ومثار الفتن إحدى فوائد العزلة.", "حاشية: (١) في (ظ): «مسلم».", "حاشية: (٢) شعف الجبال: رؤوس الجبال."]], "ic": "book"}, {"story": ["الباب الثاني في ذكر فوائد العزلة وغوائلها وكشف الحق في تفضيل (٦ من ١٢)، ص٤٧١", ["**الفائدة الرابعة:** التخلص من شر الناس فإنهم يؤذونك مرة بالغيبة، ومرة بالنميمة، ومرة بسوء الظن؛ مرة بالتهمة، ومرة بالأطماع الكاذبة، وقد يرون منك أعمالا وأقوالا لا يفهمون المقصود منها، فإذا لاحت لهم فرصة قالوا فيك.", "ومن خالط الناس لم ينفك عن حاسد وعدو يسيء الظن به، وينصب المكيدة عليه.", "وأنواع الشر التي يلقاها الإنسان إنما هي من معارفه، وفي العزلة خلاص من جميع ذلك، كما قال ابن الرومي:", "عدوك من صديقك مستفاد  فلا تستكثرن من الصحاب", "فإن الداء أكثر ما تراه  يكون من الطعام أو الشراب", "وقد قال عمر رضي الله عنه: في العزلة(١) راحة من خلطاء السوء.", "وقال أبو الدرداء: كان الناس ورقا لا شوك فيه، فصاروا شوكا لا ورق فيه.", "وقال بعضهم: كان الناس دواء يتداوى به، فصاروا داء لا دواء لهم.", "وقال سفيان بن عيينة: أوصاني الثوري فقال: أقل من معرفة الناس.", "وقال إبراهيم بن أدهم: لا تتعرف إلى من لا يعرفك، وأنكر من تعرفه.", "وقال رجل لأخيه: أصحبك إلى الحج؟ فقال: دعنا نعيش في ستر الله، فإنا نخاف أن يرى بعضنا ببعض ما نتماقت عليه. وهذه فائدة أخرى في العزلة، وهو بقاء الستر على الدين والمروءة وسائر العورات.", "قال الشاعر:", "من حمد الناس ولم يبلهم  ثم بلاهم ذم من يحمد", "وصار بالوحدة مستأنسا  بوحشة الأقرب والأبعد", "حاشية: (١) في الأصل: «الوحدة».", "وقال آخر:", "اخفض الصوت إن نطقت بليل  والتفت بالنهار قبل الكلام", "**الفائدة الخامسة:** أن ينقطع طمع الناس عنك، وطمعك عنهم، أما انقطاع طمعهم؛ فإن رضاهم غاية لا تدرك، فالمنقطع عنهم قاطع لطمعهم في حضور ولائمهم وإملاكاتهم وغير ذلك، وقد قيل: من عم الناس بالحرمان رضوا عنه كلهم.", "وأما انقطاع طمعك عنهم، فإن من نظر إلى زهرة الدنيا تحرك حرصه فانبعث بقوة الحرص طمعه، ولا يرى إلا الخيبة في أكثر المطامع، فيتأذى، وإذا اعتزل لم ير فلم يطمع ولم يشته، قال الله عز وجل: ﴿لَا تَمُدَّنَّ عَيْنَيْكَ إِلَىٰ مَا مَتَّعْنَا بِهِۦٓ أَزْوَاجًا مِّنْهُمْ﴾ [الحجر: ٨٨]، وقال ﷺ: «انظروا إلى من هو دونكم، ولا تنظروا إلى من هو فوقكم، فإنه أجدر أن لا تزدروا نعمة الله عليكم».", "وقال عون بن عبد الله: كنت أجالس الأغنياء، فلا أزال مغموما كلما رأيت ثوبا أحسن من ثوبي، ودابة أفره من دابتي، فجالست الفقراء فاسترحت.", "واعلم أن من رأى زينة الدنيا تحرك طبعه لتحصيل مثلها، فإن فعل خسر، وإن جاهد نفسه تجرع مرارة الصبر، كيف وقد قيل لسيد الكل: ﴿لَا تَمُدَّنَّ عَيْنَيْكَ إِلَىٰ مَا مَتَّعْنَا بِهِۦٓ أَزْوَاجًا مِّنْهُمْ﴾ [الحجر: ٨٨].", "**الفائدة السادسة:** الخلاص من مشاهدة الثقلاء والحمقى ومقاساة أخلاقهم، قال جالينوس: النظر إلى الثقلاء حمى الروح.", "قال الشافعي: ما جالست ثقيلا إلا وجدت الجانب الذي يليه من بدني كأنه أثقل علي من الجانب الآخر."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "العزلة، وليمنع الناس عن أن يكثروا غشيانه وزيارته، ليصفو وقته، وليكف عن السؤال عن أخبارهم وعن الإصغاء إلى أراجيف البلد، وما الناس مشغولون به، فإن جميع ذلك ينغرس في القلب حتى ينبعث في أثناء الصلاة، فوقوع الأخبار في السمع كوقوع البذر في الأرض، لا بد أن ينبت ____ العروق والأغصان", "o": ["وتتفرع", "مخرفة", "أربعين", "ابنتي"], "h": "راجع: ص٤٨٠"}, {"t": "fill", "d": 2, "q": "قال الشافعي: ما جالست ثقيلا إلا وجدت الجانب الذي يليه من بدني كأنه ____ علي من الجانب", "o": ["أثقل", "مضحك", "تجارته", "يكفر"], "h": "راجع: ص٤٧٢"}, {"t": "fill", "d": 2, "q": "وكان الربيع بن خثيم إذا قيل له: كيف ____؟ قال: أصبحنا ضعفاء مذنبين، نأكل أرزاقنا، وننتظر", "o": ["أصبحت", "وخوف", "انبعاث", "وتشييع"], "h": "راجع: ص٤٦٧"}, {"t": "fill", "d": 2, "q": "طريق الآخرة، وفيها شهوات إن لم تكسر جمحت براكبها في الطريق، فمن اشتغل طول عمره بالرياضة كان كمن اشتغل طول عمر الدابة برياضتها ولم يركبها، فلا يستفيد منها إلا الخلاص من عضها ورفسها ____، وهي لعمري فائدة، لكن ليست معظم المقصود، كما قيل لراهب", "o": ["ورمحها", "فرجا", "المفسرون", "الشغافي"], "h": "راجع: ص٤٧٦"}, {"t": "fill", "d": 2, "q": "واعلم أن الإنسان إذا تأذى بالثقلاء لم يلبث أن يغتابهم، فإن آذوه بالقدح فيه كافأهم فانجر ____ إلى فساد الدين، والعزلة سلامة من ذلك", "o": ["الأمر", "الحواجب", "والآخر", "يتحدثون"], "h": "راجع: ص٤٧٢"}, {"t": "fill", "d": 2, "q": "تؤثر مجالسة الأغنياء ازدراء الفقير بنعمة الله عليه، وتؤثر مجالسة الفقراء استعظام النعم، فكذلك النظر إلى ____ والعصاة يؤثر في الطبع", "o": ["المطيعين", "تنتقلوا", "المصلي", "والمغرب"], "h": "راجع: ص٤٦٨"}]}, {"t": "الباب الثاني في ذكر فوائد العزلة وغوائلها وكشف الحق في تفضيلها - القسم ٢ من ٢", "b": [{"story": ["الباب الثاني في ذكر فوائد العزلة وغوائلها وكشف الحق في تفضيل (٧ من ١٢)، ص٤٧٢", ["واعلم أن الإنسان إذا تأذى بالثقلاء لم يلبث أن يغتابهم، فإن آذوه بالقدح فيه كافأهم فانجر الأمر إلى فساد الدين، والعزلة سلامة من ذلك.", "**آفات العزلة [وفوائد المخالطة](١)**", "اعلم أن من المقاصد الدينية والدنياوية ما يستفاد من الاستعانة بالغير، ولا يحصل ذلك إلا بالمخالطة فكل ما يستفاد من المخالطة يفوت بالعزلة، وفواته من آفات العزلة.", "ومن فوائد المخالطة: التعليم، والتعلم، والنفع والانتفاع، والتأديب، والتأدب والاستئناس، والإيناس، ونيل الثواب، وإنالته في القيام بالحقوق، واعتياد التواضع، واستفادة التجارب من مشاهدة الأحوال والاعتبار بها، فهذه سبع فوائد، فلنفصلها:", "**الفائدة الأولى:** التعليم والتعلم؛ وقد ذكرنا فضلهما في كتاب العلم، وهما أعظم العبادات في الدنيا، ولا يتصور ذلك إلا بالمخالطة، إلا أن العلوم كثيرة وعن بعضها مندوحة، فالمحتاج إلى التعلم لما هو فرض عليه عاص بالعزلة، فإن تعلم الفرض ورأى أنه لا يتأتى منه الخوض في العلوم، ورأى الاشتغال بالعبادة، فليعتزل، وإن كان يقدر على التبريز في علوم الشرع فالعزلة في حقه قبل التعلم غاية الخسران، ولهذا قال الربيع بن خثيم: تفقه ثم اعتزل.", "ومن اعتزل قبل التعلم فغايته أن يستغرق الأوقات بأوراد يعملها بيديه لا ينفك فيها من الغرور الذي يخيب سعيه ويبطل عمله من حيث لا يشعر، ولا ينفك في اعتقاده في الله سبحانه وصفاته عن توهمات يأنس بها وخواطر فاسدة تعتريه، فيكون في أكثر أحواله ضحكة للشيطان وهو يرى نفسه من العباد.", "فالعلم أصل الدين ولا خير في عزلة العوام والجهال، فمثال النفس مثال مريض يفتقر إلى طبيب متلطف يعالجه، فالمريض الجاهل إذا خلا بنفسه عن طبيب قبل أن يتعلم الطب تضاعف لا محالة ضرره.", "حاشية: (١) زيادة ليست في النسخ.", "ولا تليق العزلة إلا بالعلم، وسئل بعض العلماء: ما تقول في عزلة الجاهل؟ فقال: خبال ووبال. فقيل له: والعالم؟ فقال: ما لك ولها؟ معها حذاؤها وسقاؤها ترد الماء وترعى الشجر حتى يلقاها ربها(١).", "وأما التعليم: ففيه ثواب عظيم إذا صحت نية المعلم، ومتى كان القصد (٢-٢)إقامة الجاه والاستكثار من الأتباع فهو هلاك الدين، وقد سبق بيان هذا في كتاب العلم.", "والغالب في هذا الزمان سوء(٢-٢) القصد من المتعلمين، فلا تكاد ترى طالبا لكلام مزخرف، يستمال به العوام في معرض الوعظ أو لجدال معقد يتوصل به إلى إفحام الأقران، ويستعمل في معرض المباهاة.", "وأقرب علم مرغوب فيه المذهب، ولا يكاد يطلب غالبا إلا للتوصل إلى التقدم على الأمثال، وتولي الولايات، وهؤلاء كلهم يقتضي الدين والحزم الاعتزال عنهم."]], "ic": "book"}, {"story": ["الباب الثاني في ذكر فوائد العزلة وغوائلها وكشف الحق في تفضيل (٨ من ١٢)، ص٤٧٤", ["فإن صودف طالب لله، ومتقرب بالعلم إليه لم يجز الاعتزال عنه، ولم يحل كتمان العلم منه، ولا ينبغي أن يغتر بقول من قال: تعلمنا العلم لغير الله، فأبى أن يكون إلا لله. فإنه أشار بهذا إلى علم(٣) القرآن والحديث ومعرفة سير الأنبياء والصحابة، وذلك يتضمن التخويف والتحذير، وهو سبب لإثارة الخوف من الله سبحانه، فإن لم يؤثر في الحال أثر في المآل.", "فأما الكلام وعلم الخلاف فإنه لا يرد الراغب في الدنيا إلى الله، بل لا يزال صاحبه متماديا في حرصه إلى آخر عمره، فلا ينبغي للإنسان أن يخادع نفسه، فإن المقصر العالم بتقصيره أسعد حالا من الجاهل المغرور أو المتجاهل المغبون،", "حاشية: (١) شبه هنا عزلة العالم الذي قد حصل من أدوات العلم ما يغنيه، بترك ضالة الإبل حيث أمر النبي ﷺ بتركها وعدم التعرض لها، فمعها حذاؤها وسقاؤها وترد المرعى فلا يخشى عليها شيء، حتى يجدها صاحبها، بخلاف ضالة الغنم.", "حاشية: (٢-٢) سقط من الأصل.", "حاشية: (٣) في (ظ): «علوم».", "وبعيد(١) أن يحرص عالم على التعليم إلا وغرضه القبول والجاه، وحظه تلذذ النفس بما يورده، والإدلال على الجهال والتكبر عليهم، فآفة العلم الخيلاء، ولهذا يصير كالخادم لأصحابه، يسعى في أغراضهم ليتبعوه، وربما قام لهم بالرزق، أو طلب لهم من السلطان، ويخيل إليه أنه بذلك ينشر الشريعة، ولو تفكر لعلم أن أكثر فساد الزمان وجود أمثال هؤلاء المتعلمين، الذين يتناولون ما يجدون من حلال أو حرام.", "**الفائدة الثانية:** النفع والانتفاع", "أما الانتفاع بالناس، فبالكسب والمعاملة، وذلك لا يتأتى إلا بالمخالطة، والمحتاج إليه مضطر إلى ترك العزلة، فيقع في جهاد من المخالطة إن طلب موافقة الشرع فيه، كما ذكرنا في كتاب الكسب، وإن كان معه ما يقنعه فالعزلة أفضل له، إلا أن يقصد التصدق بكسبه، فذلك أفضل من العزلة، إلا أن تكون العزلة مفيدة له معرفة الله تعالى والأنس به لا عن أوهام وخيالات فاسدة.", "وأما النفع؛ فهو أن ينفع الناس إما بماله أو ببدنه، فيقوم بحاجاتهم على سبيل الحسبة، ففي النهوض بقضاء حوائج المسلمين ثواب، وذلك لا ينأتى(٢) إلا بالمخالطة، ومن قدر عليه مع القيام بحدود الشرع فهو أفضل له من العزلة إن كان لا يشتغل في عزلته إلا بنوافل الصلوات والأعمال البدنية، وإن كان ممن انفتح له طريق العمل بالقلب بدوام ذكر أو فكر، فذلك الذي لا يعدل به غيره البتة.", "**الفائدة الثالثة:** التأديب والتأدب، ونعني به الارتياض بمقاساة الناس، والمجاهدة في تحمل أذاهم، كسرا للنفس، وقهرا للشهوات، وهي من الفوائد التي تستفاد بالمخالطة، وهي أفضل من العزلة في حق من لم تتهذب بعد أخلاقه.", "وينبغي أن يفهم أن الرياضة لا تراد لنفسها، كما لا يراد من رياضة الدابة عين رياضتها، بل المراد منها أن تتخذ مركبا تقطع به المراحل. والبدن مطية تسلك بها"]], "ic": "book"}, {"story": ["الباب الثاني في ذكر فوائد العزلة وغوائلها وكشف الحق في تفضيل (٩ من ١٢)، ص٤٧٥", ["حاشية: (١) في الأصل: «بتعذر».", "حاشية: (٢) في الأصل: «ينال».", "طريق الآخرة، وفيها شهوات إن لم تكسر جمحت براكبها في الطريق، فمن اشتغل طول عمره بالرياضة كان كمن اشتغل طول عمر الدابة برياضتها ولم يركبها، فلا يستفيد منها إلا الخلاص من عضها ورفسها ورمحها، وهي لعمري فائدة، لكن ليست معظم المقصود، كما قيل لراهب: يا راهب. فقال: لست براهب، وإنما أنا كلب عقور، حبست نفسي حتى لا أعقر الناس. وهذا حسن بالإضافة إلى من يعقر، ولكن لا ينبغي أن يقتصر عليه، فينبغي أن يبتدئ بالمخالطة ثم يختم بالعزلة.", "**وأما التأديب:** فإنما نعني به أن يروض غيره، وهو حال شيخ المتزهدين، فإنه لا يقدر على تهذيبهم إلا بمخالطتهم، فحاله حال المعلم، وحكمه حكمه، ويتطرق إليه من دقائق الآفات والرياء ما يتطرق إلى نشر العلم.", "**الفائدة الرابعة:** الاستئناس والإيناس، وقد يكون مستحبا كالاستئناس بأهل التقوى، وقد يقصد به ترويح القلوب من كرب الوحدة، فينبغي أن يكون الاستئناس في بعض الأوقات(١) لمن لا يفسد بقيتها، وليحرص أن يكون حديثه عند الاستئناس في أمور الدين، وفي الجملة ينبغي أن ينتقي الجليس، ويتفقد حال القلب في المؤانسة.", "**الفائدة الخامسة:** في نيل الثواب وإنالته؛ أما النيل فبحضور الجنائز، وعيادة المرضى، وحضور العيدين والإملاكات والدعوات، ففيها ثواب من جهة إدخال السرور على المؤمن.", "أما إنالته؛ فهو أن يفتح بابه للناس ليعزوه، أو يهنئوه، أو يعودوه، فإنهم ينالون بذلك ثوابا، وكذلك إن كان من العلماء فأذن لهم في زيارته، ولكن ينبغي أن يزن ثواب هذه المخالطات بآفاتها، فيرجح العزلة أو المخالطة وقد كان أكثر السلف يؤثرون العزلة عليها.", "**الفائدة السادسة:** التواضع؛ ولا يقدر عليه في الوحدة، وقد يكون الكبر سببا", "حاشية: (١) في (ظ): «الساعات».", "في اختيار(١) العزلة، فكم من معتزل في بيته باعثه التكبر، ومانعه من المحافل التقصير في إكرامه وتقديمه، وربما ترفع عن مخالطتهم لارتفاع محله عند نفسه، أو ليبقي طراوة ذكره بين الناس، وقد يعتزل خيفة ظهور مقابحه لو خالط، فلا يعتقد فيه الزهد والاشتغال بالعبادة، فيتخذ من البيت سترا لمقابحه إبقاء على اعتقاد الناس فيه الزهد والتعبد.", "وعلامة من هذه صفته أنه يحب أن يزار ولا يحب أن يزور، ويفرح بتقرب السلاطين والعوام إليه، واجتماعهم على بابه وتقبيلهم يده، ولو كان الاشتغال بنفسه هو الذي يبغض إليه المخالطة لأبغض زيارة الناس له، كما قال حاتم الأصم لأمير زاره، فقال له: ألك حاجة؟ قال: أن لا أراك ولا تراني.", "والعزلة بهذا السبب جهل من وجهين:"]], "ic": "book"}, {"story": ["الباب الثاني في ذكر فوائد العزلة وغوائلها وكشف الحق في تفضيل (١٠ من ١٢)، ص٤٧٧", ["أحدهما: أن التواضع والمخالطة لا يغض من منصب من هو كبير بعلمه أو دينه، فقد كان النبي ﷺ يمشي في السوق، ويجيب دعوة المملوك، ويسعى في حاجة الأمة، ويشتري الشيء فيحمله بنفسه، وكان أبو بكر الصديق رضي الله عنه يحلب لبعض الفقراء غنمهم، ويحمل الثياب إلى السوق ليتجر بها، وكان عمر رضي الله عنه يعس(٢) المدينة بنفسه، ويمشي في حوائجه. وكان عثمان رضي الله عنه يقيل في المسجد، ويجالس الناس كأحدهم. وكان علي رضي الله عنه يستقي بأجرة ويحمل الحاجة إلى أهله، ويقول:", "لا ينقص الكامل من كماله  ما جر من نفع إلى عياله", "وكان أبو هريرة يحمل حزمة(٣) الحطب على ظهره وهو أمير المدينة من قبل مروان، ويقول: طرقوا لأميركم، وكان الحسن بن علي يجلس مع المساكين، وهذا الأمر كان عاما في القوم شاملا لهم.", "حاشية: (١) ليست في الأصل.", "حاشية: (٢) يعس: يطوف بالليل يكشف عن أهل الريبة.", "حاشية: (٣) في (ظ): «جرزة».", "وتحت هذا دقيقة، وهي: أن الناقص يتم نقصه بكبره، والكامل لا يحتاج إلى تتمة؛ لأن فخره بنفسه، فتراه إذا دخل مجلسا جلس في أدناه؛ لأنه لا يرى العلو بالمكان بل بالمكانة ولهذا قال العلماء: من تكبر في ولايته، فالولاية أكبر منه، ومن تواضع فيها، فهو أكبر منها.", "**الوجه الثاني:** أن الذي يشغل نفسه بطلب رضا الناس عنه، وتحسين اعتقادهم فيه مغرور(١)؛ لأنه لو عرف حق المعرفة علم أنهم لن يغنوا عنه من الله شيئا، وأن الضر والنفع بيد الله، قالت عائشة: من أرضى الناس بسخط الله عاد حامده من الناس ذاما. وقالت امرأة عابدة: إذا كان هو يقسم الثناء فلمن تتصنع؟", "فإذن من حبس نفسه في البيت ليحسن اعتقاد الناس فيه وأقوالهم، فهو في عذاب في الدنيا، ولعذاب الآخرة أكبر لو كانوا يعلمون.", "فهذه غوائل خفية في اختيار العزلة ينبغي أن تتقى، فإنها مهلكات في صور منجيات.", "**الفائدة السابعة:** التجارب، فإنها تستفاد من مخالطة الخلق، ومجاري أحوالهم، والعقل الغريزي ليس كافيا في تفهم(٢) مصالح الدين والدنيا، وإنما تفيده التجربة والممارسة، ولا خير في عزلة من لم تحنكه التجارب، فإذا اعتزل الصبي بقي غمرا(٣) جاهلا، بل ينبغي أن يشتغل بالتعلم ويحصل له في مدة التعلم ما يحتاج إليه من التجارب فيكفيه ذلك، ويحصل بقية التجارب بسماع الأحوال، فلا يحتاج إلى المخالطة، ومن أهم التجارب أن يجرب نفسه وأخلاقه وصفات باطنه، وذلك لا يقدر عليه في الخلوة، فإنه إذا خلا الحقود والحسود وذو الشر لم يترشح منه خبثه، وهذه الصفات مهلكات يجب إماطتها وقهرها، ولا يكفي تسكينها بالتباعد عما يحركها، والمخالطة تحركها فيعلم مقدارها.", "حاشية: (١) في (ظ): «ليس له معرفة».", "حاشية: (٢) في الأصل: «تفهيم».", "حاشية: (٣) الغمر: الذي لم يجرب الأمور."]], "ic": "book"}, {"story": ["الباب الثاني في ذكر فوائد العزلة وغوائلها وكشف الحق في تفضيل (١١ من ١٢)، ص٤٧٩", ["أخبرنا محمد بن عبد الباقي، قال: أخبرنا حمد بن أحمد قال: أخبرنا أبو نعيم الحافظ، قال: أخبرنا جعفر بن محمد الخلدي قال: حدثني الجنيد قال: سمعت السري يقول: خفيت علي علة ثلاثين سنة؛ وذلك أنا كنا جماعة نبكر إلى الجمعة، ولنا أماكن قد عرفت بنا لا نكاد نخلوا عنها، فمات رجل من جيراننا يوم جمعة، فشيعت جنازته، فأصبحت عن وقتي ثم جئت فلما أن قربت من المسجد قالت لي نفسي: الآن يرونك وقد أصبحت وتخلفت عن وقتك، فشق ذلك علي، فقلت لنفسي: أراك مرائية منذ ثلاثين سنة وأنا لا أدري! فتركت ذلك المكان الذي كنت آتيه، وجعلت أصلي في أماكن مختلفة لئلا يعرف مكاني. وقد حكى بعضهم عن سري أنه قال: فأعدت صلاة ثلاثين سنة.", "فإذا عرفت فوائد العزلة وغوائلها تحققت أن الحكم عليها مطلقا بالتفضيل نفيا أو إثباتا خطأ، بل ينبغي أن ينظر إلى الشخص وحاله، وإلى الباعث على مخالطته، وإلى الفائت بسبب مخالطته من الفوائد، ويقاس الفائت بالحاصل، فعند ذلك يتبين الحق ويتضح الأفضل، وقد قال الشافعي: الانقباض عن الناس مكسبة للعداوة، والانبساط إليهم مجلبة لقرناء السوء، فكن بين المنقبض والمنبسط.", "كذلك يجب الاعتدال في المخالطة والعزلة، ويختلف ذلك بالأحوال. وبملاحظة الفوائد والآفات(١) يبين الأفضل، فهذا هو الحق الصراح، وكل ما ذكر سوى هذا فهو قاصر، وإنما هو إخبار كل واحد عن حالة خاصة هو فيها، فلا يجوز أن يحكم بها على غيره المخالف له في الحال.", "فإن قيل: فما آداب العزلة؟", "قلنا: ينبغي للمعتزل أن ينوي بعزلته كف شر نفسه عن الناس أولا، ثم طلب السلامة من شر الأشرار ثانيا، ثم الخلاص من آفة القصور عن القيام بحقوق المسلمين ثالثا، ثم تجريد الهمة لعبادة الله رابعا، فهذه آداب نيته.", "ثم ليكن في خلوته مواظبا على العلم والعمل والذكر والفكر ليجتني ثمرة", "حاشية: (١) تحرف في (ظ) إلى: «وربما خطر الفوائد والأوقات».", "العزلة، وليمنع الناس عن أن يكثروا غشيانه وزيارته، ليصفو وقته، وليكف عن السؤال عن أخبارهم وعن الإصغاء إلى أراجيف البلد، وما الناس مشغولون به، فإن جميع ذلك ينغرس في القلب حتى ينبعث في أثناء الصلاة، فوقوع الأخبار في السمع كوقوع البذر في الأرض، لا بد أن ينبت وتتفرع العروق والأغصان.", "وأحد مهمات المعتزل قطع الوساوس الصارفة عن ذكر الله تعالى، والأخبار ينابيع الوساوس وأصولها، وليقنع باليسير من المعيشة وإلا اضطره التوسع إلى مخالطة الناس، وليكن صبورا على ما يلقاه من أذى الناس، ولا يصغي إلى الثناء عليه بالعزلة ولا القدح فيه بترك الخلطة، فإن ذلك يؤثر في القلب، فيقف عن السير."]], "ic": "book"}, {"story": ["الباب الثاني في ذكر فوائد العزلة وغوائلها وكشف الحق في تفضيل (١٢ من ١٢)، ص٤٨٠", ["والسير في طريق الآخرة إما بالورد والذكر مع حضور القلب، أو بالفكر في عظمة الله وملكه، أو بالتأمل لدقائق الأعمال ومفسدات القلب(١)، وطلب الخلاص منها، وكل ذلك يفتقر إلى الفراغ، فلا يحتمل ما يكدر القلب ويشغله، وليكن له جليس صالح يستريح إليه ساعة عن كد المواظبة ففي ذلك عون على بقية الساعات.", "ولا يتم له الصبر في العزلة إلا بقطع الطمع عن الدنيا، ولا ينقطع طمعه إلا بقصر الأمل، فيقدر أنه إذا أصبح لا يمسي، وإذا أمسى لا يصبح، فيسهل عليه صبر يوم، وليكن كثير الذكر للموت ووحدة القبر متى ضاق قلبه من الوحدة، وليتحقق أن من لم يحصل في قلبه من ذكر الله ومعرفته ما يأنس به لم يطق وحشة الوحدة بعد الموت، وأن من أنس بذكر الله ومعرفته لم يزل الموت أنسه؛ لأن الموت لا يهدم محل الأنس والمعرفة، كما قال تعالى في حق الشهداء: ﴿بَلْ أَحْيَآءٌ عِندَ رَبِّهِمْ يُرْزَقُونَ﴾ [آل عمران: ١٦٩]، وكل متجرد لله في جهاد نفسه، فهو شهيد، كما قال [بعض الصحابة](٢) رجعنا من الجهاد الأصغر إلى الجهاد الأكبر.", "**آخر كتاب العزلة**", "حاشية: (١) في (ظ): «القلوب».", "حاشية: (٢) زيادة يستقيم بها السياق."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "فإن صودف طالب لله، ومتقرب بالعلم إليه لم يجز الاعتزال عنه، ولم يحل كتمان العلم منه، ولا ينبغي أن ____ بقول من قال", "o": ["يغتر", "وقلدك", "يلقيه", "عيال"], "h": "راجع: ص٤٧٤"}, {"t": "fill", "d": 2, "q": "وأما الأمر بالمعروف والنهي عن المنكر فهو من أصول الدين، وهو واجب على ما سيأتي ____ في آخر هذا الربع إن شاء الله تعالى", "o": ["بيانه", "لقتلتك", "وليغسل", "بمخرجه"], "h": "راجع: ص٤٦٦"}, {"t": "fill", "d": 2, "q": "ومن فوائد المخالطة: التعليم، والتعلم، والنفع والانتفاع، والتأديب، والتأدب والاستئناس، والإيناس، ونيل الثواب، وإنالته في ____ بالحقوق، واعتياد التواضع، واستفادة التجارب من مشاهدة الأحوال والاعتبار", "o": ["القيام", "ابتداء", "أحبك", "ورفسها"], "h": "راجع: ص٤٧٣"}, {"t": "fill", "d": 2, "q": "وبعيد أن يحرص عالم على التعليم إلا وغرضه القبول والجاه، وحظه تلذذ النفس بما يورده، والإدلال على الجهال والتكبر عليهم، فآفة العلم الخيلاء، ولهذا يصير كالخادم لأصحابه، يسعى في أغراضهم ليتبعوه، وربما قام لهم بالرزق، أو طلب لهم من السلطان، ويخيل إليه أنه بذلك ينشر الشريعة، ولو تفكر لعلم أن أكثر فساد الزمان ____ أمثال هؤلاء المتعلمين، الذين يتناولون ما يجدون من حلال أو حرام", "o": ["وجود", "فتتأذى", "وحسم", "خلدة"], "h": "راجع: ص٤٧٥"}, {"t": "fill", "d": 2, "q": "اعلم أن من المقاصد الدينية والدنياوية ما يستفاد من الاستعانة بالغير، ولا يحصل ذلك إلا ____ فكل ما يستفاد من المخالطة يفوت بالعزلة، وفواته من آفات العزلة", "o": ["بالمخالطة", "العاقدين", "فيدلونهم", "والإشفاق"], "h": "راجع: ص٤٧٣"}, {"t": "fill", "d": 2, "q": "فقد قال الجنيد: أنا أكلم الله منذ ثلاثين سنة، والناس يظنون أني أكلمهم. وهذا إنما يتيسر للمستغرق بحب الله تعالى استغراقا لا يبقى لغيره فيه ____، ومثل هذا لا ينكر، فإن العشق للمخلوقين قد يفرط فيستغرق", "o": ["متسع", "وانهوا", "زوجه", "يمتحن"], "h": "راجع: ص٤٦٥"}]}], "sum": [["الصفحات", "ص٤٦٤ - ص٤٨٠"]], "_nq": 12}, {"id": "l32", "title": "كتاب آداب السفر", "group": "كتاب آداب السفر", "map": {"center": "كتاب\nآداب السفر", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "كتاب آداب السفر", "b": [{"pic": ["books", "book"], "cap": "ص٤٨١ - ص٤٨٢"}, {"story": ["كتاب آداب السفر، ص٤٨١", ["الحمد لله الذي هيأ قلوب أوليائه لقبول العبر، فتلقفتها في الحضر والسفر، وتأثرت بما شاهدت منها أحسن الأثر، وفهمت المراد بها وخيرت الخبر، وصلوات الله على نبيه محمد سيد البشر، وعلى أصحابه الميامين الغرر، المقتفين آثاره في الأخلاق والسير، وسلم تسليما كثيرا.", "أما بعد؛ فإن السفر وسيلة إلى الخلاص من مهروب عنه، أو الوصول إلى مرغوب فيه، والسفر سفران: سفر بظاهر البدن عن الوطن إلى البر، وسفر بسير القلب عن أسفل السافلين إلى ملكوت السماوات.", "وأشرف السفرين السفر الباطن، فإن الواقف على الحالة التي نشأ عليها عقيب الولادة الجامد على ما تلقنه بالتقليد من الآباء لازم درجة القصور، وقانع برتبة النقص، ومستبدل بمتسع عرضه السماوات والأرض ظلمة السجن وضيق الحبس.", "قال أبو الطيب:", "ولم أر في عيوب الناس شيئا  كنقص القادرين على التمام", "إلا أن هذا السفر لما كان مقتحمه في خطب خطير لغموض السبيل وفقد الخفير، اندرست مسالكه، وانقطع فيه الرفاق، فمن يسر له هذا السفر لم يزل متنزها في الجنة وهو ساكن ببدنه في الوطن، وغنائم هذا السفر دائمة غير ممنوعة، وثمراته متزايدة غير مقطوعة، إلا أن يغير المسافر في سيره، فإن الله لا يغير ما بقوم حتى يغيروا ما بأنفسهم.", "فأما سفر البدن؛ فقد يكون في طلب العلم والدين والكفاية.", "وله آداب وشروط من قام بها كان من عمال الآخرة، ومن أهملها كان من عمال الدنيا، ونحن نذكر آدابه وشروطه في بابين إن شاء الله تعالى.", "(١-١)الباب الأول: في الآداب من أول النهوض إلى آخر الرجوع.", "الباب الثاني: فيما لا بد للمسافر من تعلمه من رخص السفر وأدلة القبلة والأوقات.(١-١)", "حاشية: (١-١) ليس في الأصل."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "إلا أن هذا السفر لما كان مقتحمه في خطب خطير لغموض السبيل وفقد الخفير، اندرست مسالكه، وانقطع فيه الرفاق، فمن يسر له هذا السفر لم يزل متنزها في الجنة وهو ساكن ببدنه في الوطن، وغنائم هذا السفر دائمة غير ممنوعة، ____ متزايدة غير مقطوعة، إلا أن يغير المسافر في سيره، فإن الله لا يغير ما بقوم حتى يغيروا ما بأنفسهم", "o": ["وثمراته", "موصيك", "إفساد", "أقوام"], "h": "راجع: ص٤٨١"}, {"t": "fill", "d": 2, "q": "أما بعد؛ فإن السفر وسيلة إلى الخلاص من مهروب عنه، أو الوصول إلى مرغوب فيه، ____ سفران", "o": ["والسفر", "الخبري", "أثمانها", "فمتى"], "h": "راجع: ص٤٨١"}, {"t": "fill", "d": 2, "q": "الحمد لله الذي هيأ قلوب أوليائه لقبول العبر، فتلقفتها في الحضر والسفر، وتأثرت بما شاهدت منها أحسن الأثر، وفهمت المراد بها وخيرت الخبر، وصلوات الله على نبيه محمد سيد البشر، وعلى أصحابه الميامين الغرر، المقتفين آثاره في الأخلاق والسير، ____ تسليما كثيرا", "o": ["وسلم", "ارتكاب", "بالبول", "يتكبر"], "h": "راجع: ص٤٨١"}, {"t": "fill", "d": 2, "q": "وأشرف السفرين السفر الباطن، فإن الواقف على الحالة التي نشأ عليها عقيب الولادة الجامد على ما تلقنه بالتقليد من الآباء لازم درجة القصور، ____ برتبة النقص، ومستبدل بمتسع عرضه السماوات والأرض ظلمة السجن وضيق الحبس", "o": ["وقانع", "كلهم", "الحشرات", "خرجوا"], "h": "راجع: ص٤٨١"}, {"t": "fill", "d": 2, "q": "وله آداب وشروط من قام بها كان من عمال الآخرة، ومن أهملها كان من عمال الدنيا، ونحن ____ آدابه وشروطه في بابين إن شاء الله تعالى", "o": ["نذكر", "جناها", "وتنفير", "والحسن"], "h": "راجع: ص٤٨٢"}]}], "sum": [["الصفحات", "ص٤٨١ - ص٤٨٢"]], "_nq": 5}, {"id": "l33", "title": "الباب الأول في الآداب من أول النهوض إلى آخر الرجوع", "group": "كتاب آداب السفر", "map": {"center": "الباب\nالأول في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الأول في الآداب من أول النهوض إلى آخر الرجوع", "b": [{"pic": ["books", "book"], "cap": "ص٤٨٣ - ص٤٩٠"}, {"story": ["الباب الأول في الآداب من أول النهوض إلى آخر الرجوع (١ من ٥)، ص٤٨٣", ["**في الآداب من أول النهوض إلى آخر الرجوع**", "وفيه فصلان:", "**الفصل الأول**", "**في فوائد السفر وفضله ونيته**", "اعلم أن للسفر فوائد وآفات، فالفوائد الباعثة على السفر لا تخلو من هرب أو طلب، فإن المسافر إما أن يكون له مزعج عن مقامه، ولولاه لما كان له مقصد يسافر إليه، وإما أن يكون له مقصد ومطلب.", "والمهروب عنه: إما أمر له نكاية في الأمور الدنياوية، كالطاعون والوباء إذا ظهر ببلد، أو خوف سببه فتنة وخصومة، أو غلاء سعر، وهو إما عام كما ذكرنا، أو خاص كمن يقصد تأذيه في بلده فيهرب منها.", "وإما أمر له نكاية في الدين، كمن ابتلي في بلده بجاه ومال واتساع أسباب تصده عن التجرد لله تعالى، فيؤثر الغربة والخمول(١)، ويجتنب السمعة والجاه، وكمن يدعى إلى بدعة قهرا، أو إلى ولاية عمل لا تحل مباشرته، فيطلب الفرار منه.", "وأما المطلوب، فهو إما دنياوي، كالمال والجاه، أو ديني، والديني، إما علم أو عمل، والعلم إما من العلوم الدينية، وإما علم بأخلاق المسافر وصفاته على سبيل التجربة، وإما علم بآيات الأرض وعجائبها، كسفر ذي القرنين.", "والعمل: إما عبادة، كالحج والعمرة والجهاد، وإما زيارة، كقصد المدينة وبيت", "حاشية: (١) تحرفت في الأصل إلى: «المحمول».", "المقدس والثغور، فإن الرباط بها قربة، وقد يقصد بها الأولياء والعلماء، وقد خرج من هذه القسمة أقسام:", "**القسم الأول:** السفر في طلب العلم، وهو إما واجب وإما نفل، وذلك بحسب كون العلم واجبا أو نفلا، وذلك العلم إما علم بأمور دينية، أو بأخلاقه في نفسه، أو بآيات الله في أرضه، وقد قال الرسول ﷺ: «من خرج من بيته في طلب العلم، فهو في سبيل الله حتى يرجع، ومن سلك طريقا يلتمس فيه علما سهل الله له طريقا إلى الجنة».", "وكان سعيد بن المسيب يسافر الأيام في طلب الحديث الواحد.", "وقال الشعبي: لو سافر رجل من أقصى الشام إلى أقصى اليمن في كلمة تدله على هدى ما كان سفره ضائعا. وقد رحل جابر بن عبد الله من المدينة إلى مصر، فسار شهرا في حديث بلغه.", "وقل مذكور بالعلم محصل من زمان الصحابة إلى زماننا إلا وقد حصل العلم بالسفر وسافر لأجله.", "وأما علمه بنفسه وأخلاقه، فذلك أيضا فهم، فإن طريق الآخرة لا يمكن سلوكها إلا بتحسين الخلق وتهذيبه، ومن لا يطلع على أسرار(١) باطنه وخبائث صفاته لا يقدر على تطهير القلب منها، وإنما سمي السفر سفرا؛ لأنه يسفر عن الأخلاق.", "وبالجملة؛ فالنفس في الوطن لا تظهر خبائث أخلاقها لاستئناسها بما يوافق طبعها من المألوفات المعهودة، وامتحنت بمشاق الغربة انكشفت غوائلها، ووقع الوقوف على عيوبها، فيمكن الاشتغال بعلاجها.", "وقد ذكرنا في كتاب العزلة فوائد المخالطة مع زيادة أشغال واحتمال مشاق.", "وأما آيات الله في أرضه، ففي مشاهدتها فوائد للمستبصر، ففيها قطع متجاورات، وفيها الجبال والبراري والبحار، وأنواع الحيوان والنبات، وما من"]], "ic": "book"}, {"story": ["الباب الأول في الآداب من أول النهوض إلى آخر الرجوع (٢ من ٥)، ص٤٨٤", ["حاشية: (١) في الأصل: «بأسرار».", "شيء إلا وهو شاهد لله تعالى بالوحدانية، ومسبح له بلسان ذلق(١) لا يدركه إلا من ألقى السمع وهو شهيد، وأما الجاحدون والغافلون والمغترون بلامع السراب من زهرة الدنيا، فإنهم لا يبصرون ولا يسمعون؛ لأنهم عن السمع معزولون وعن آيات ربهم محجوبون ﴿يَعْلَمُونَ ظَٰهِرًا مِّنَ ٱلْحَيَوٰةِ ٱلدُّنْيَا وَهُمْ عَنِ ٱلْـَٔاخِرَةِ هُمْ غَٰفِلُونَ﴾ [الروم: ٧] وما يريد بذلك السمع الظاهر وإنما المراد السمع الباطن، وبه يدرك نطق لسان الحال، كقول القائل حكاية لكلام الوتد والحائط: قال الجدار للوتد: لم تشقني؟ فقال: سل من يدقني فلم يتركني، ورائي الحجر الذي ورائي.", "وما من ذرة في السماوات والأرض إلا ولها أنواع شهادات لله سبحانه بالوحدانية هي توحيدها، وأنواع شهادات لصانعها بالتقديس هي تسبيحها، ولكن لا يفقهون تسبيحها؛ لأنهم لم يسافروا من مضيق سمع الظاهر إلى فضاء سمع الباطن، ومن ركاكة لسان المقال إلى فصاحة لسان الحال، ومن يسافر ليستقرئ هذه الشهادات من الأسطر المكتوبة بالخطوط الإلهية على صفحات الجمادات، لم يطل سفره بالبدن، بل يستقر في موضع ويفرغ قلبه للتمتع بسماع نغمات التسبيحات من آحاد الذرات، فماله وللتردد في الفلوات وله غنية في ملكوت السماوات والشمس والقمر والنجوم مسخرات، وهي إلى أبصار ذوي البصائر مسافرات في الشهر والسنة مرات، بل هي دائبة في الحركة على توالي الأوقات، فمن الغرائب أن يدأب في الطواف بآحاد المساجد من أمرت الكعبة أن تطوف به، ومن الغرائب أن يطوف في أكناف الأرض من تطوف به أقطار السماء، ثم ما دام المسافر مفتقرا إلى أن يبصر عالم الملك والشهادة بالبصر الظاهر فهو بعد في المنزل الأول من منازل السائرين إلى الله تعالى والمسافرين إلى حضرته، وكأنه معتكف على باب الوطن لم يفض بالسير إلى متسع الفضاء، ولا سبب لطول المقام في هذا المنزل إلا الجبن أو القصور، فرب سالك آخذ التوفيق بيده فأرشده إلى سواء السبيل، والأكثرون من ركاب هذه الطريق هالكون في التيه، فإن الذي يملك، ولا يتصدى لطلب الملك العاجز الجبان لعظم الخطر وطول التعب:", "حاشية: (١) ذلق: فصيح.", "وإذا كانت النفوس كبارا  تعبت في مرادها الأجسام", "وما أودع الله العز والملك في الدين والدنيا إلا في متن الخطر، فهذا حكم السفر الظاهر إذا أريد به السفر الباطن لمطالعة آيات الأرض، فلنرجع إلى الغرض الذي كنا نقصده، ولنبين:"]], "ic": "book"}, {"story": ["الباب الأول في الآداب من أول النهوض إلى آخر الرجوع (٣ من ٥)، ص٤٨٦", ["**القسم الثاني:** وهو أن يسافر لأجل العبادة، إما لجهاد أو حج، وقد ذكرنا فضل ذلك وآدابه وأعماله الظاهرة والباطنة في كتاب أسرار الحج، ويدخل في جملته زيارة قبور الأنبياء والأولياء(١) والصالحين، وزيارة الأحياء أولى من زيارة الأموات للتخلق بأخلاقهم، والنظر إليهم سوى ما ينتظر من الفوائد العلمية المستفادة من أنفاسهم وأفعالهم، وأما البقاع فلا معنى لزيارتها سوى المساجد الثلاثة، والثغور للرباط بها، وقد ذكرنا فضائل الحرمين في كتاب الحج، وبيت المقدس له فضل أيضا.", "**القسم الثالث:** أن يكون السفر للهرب من سبب مشوش للدين، وذلك أيضا حسن، فالفرار مما لا يطاق من سنن المرسلين، ومما يجب الهرب منه الولاية والجاه وكثرة العلائق، والأسباب إذا كانت تكدر فراغ القلب، والدين لا يتم إلا بقلب فارغ عن غير الله عز وجل، فإن لم يتم فراغه، فيقدر فراغه يتصور أن يشتغل بالدين، ولا يتصور فراغ القلب في الدنيا عن مهمات الدنيا والحاجات الضرورية، ولكن يتصور تخفيفها وتقليلها، وقد نجى المخفون وهلك المثقلون، والمخف هو الذي ليست الدنيا أكبر همه، وذلك لا يتيسر في الوطن لمن اتسع جاهه وكثرت علائقه فلا يتم مقصوده إلا بالغربة والخمول وقطع العلائق التي له عنها بد حتى يروض نفسه مدة، ثم ربما يمده الله تعالى بمعونته، فينعم عليه بما يقوي به نفسه ويطمئن به قلبه، فيستوي عنده الحضر والسفر ويتقارب عنده وجود الأسباب والعلائق وعلمها، فلا يصده شيء منها عما هو بصدده من ذكر الله تعالى، وذلك مما يعز وجوده جدا، بل الغالب على القلوب الضعف والقصور عن", "حاشية: (١) ليست في (ظ).", "الاتساع للخلق والخالق، وإنما يسعد بهذه القوة الأنبياء والأولياء، والوصول إليها بالكسب شديد، وإن كان للاجتهاد والكسب فيه مدخل أيضا.", "ومثال تفاوت القوة الباطنة فيه تفاوت القوة الظاهرة في الأعضاء، فرب رجل قوي ذي مرة سوي شديد الأعصاب محكم البنية يستقل بحمل ما وزنه ألف رطل مثلا، فلو أراد الضعيف المريض أن ينال رتبته بممارسة الحمل والتدريج فيه قليلا قليلا لم يقدر عليه، ولكن الممارسة والجهد يزيد في قوته زيادة ما، وإن كان ذلك لا يبلغه درجته فلا ينبغي أن يترك الجهد عند اليأس عن الرتبة العليا، فإن ذلك غاية الجهل وقد كان من عادة السلف مفارقة الوطن خيفة من الفتن، قال سفيان الثوري: هذا زمان ينتقل فيه الرجل من بلد إلى بلد كلما عرف في موضع تحول إلى غيره.", "**القسم الرابع:** السفر هربا مما يقدح في البدن، كالطاعون، أو في المال، كغلاء السعر وما يجري مجراه، فأما الهرب من الطاعون فمستثنى لورود النهي عنه، ففي الصحيحين من حديث عبد الرحمن بن عوف عن النبي ﷺ أنه قال: «إذا سمعتم به يعني الطاعون بأرض فلا تقدموا عليه، فإذا وقع بأرض وأنتم بها، فلا تخرجوا فرارا منه»."]], "ic": "book"}, {"story": ["الباب الأول في الآداب من أول النهوض إلى آخر الرجوع (٤ من ٥)، ص٤٨٧", ["وفيهما من حديث أسامة بن زيد عن النبي ﷺ أنه قال: «إذا سمعتم بالطاعون بأرض فلا تدخلوها، وإذا وقع بأرض وأنتم بها فلا تخرجوا منها». وفي أفراد البخاري من حديث عائشة أنها سألت نبي الله ﷺ عن الطاعون فأخبرها «إنه كان عذابا يبعثه الله عز وجل على من يشاء فجعله الله عز وجل رحمة للمؤمنين، فليس من عبد يقع الطاعون فيمكث في بلده صابرا محتسبا يعلم أنه لم يصبه إلا ما كتب الله عز وجل له، إلا كان له مثل أجر الشهيد». وفي الصحيحين من حديث أنس بن مالك عن النبي ﷺ أنه قال: «الطاعون شهادة لكل مسلم».", "وأما الخروج لغلاء السعر فحسن، قال أبو نعيم: رأيت سفيان الثوري وقد علق قلته بيده ووضع جرابه على ظهره فقلت: إلى أين يا أبا عبد الله؟ فقال: قد بلغني عن قرية فيها رخص أريد أن أقيم بها. فقيل: وتفعل هذا يا أبا عبد الله؟ فقال:", "نعم، إذا بلغك أن قرية فيها رخص فأقم بها فإنه أسلم لدينك، وأقل لهمك. وهذا هرب من غلاء السعر.", "فهذه أقسام الأسفار، وقد خرج منها أن السفر ينقسم إلى مذموم ومحمود ومباح، والمذموم ينقسم إلى حرام، كإباق العبد وسفر العاق، وإلى مكروه، كالخروج من بلد الطاعون، والمحمود ينقسم إلى واجب كالحج وطلب العلم الذي هو فريضة على كل مسلم، وإلى مندوب كزيارة العلماء.", "وينبغي أن تكون النية في السفر طلب الآخرة إلا أن ذلك ظاهر في الواجب والمندوب، ومحال في المكروه والمحظور، وأما المباح فمتى كان قصده بطلب المال التعفف عن السؤال ورعاية ستر المروءة على الأهل والعيال، والتصدق بما فضل من مبلغ الحاجة صار هذا المباح بهذه النية من أعمال الآخرة، ولو خرج إلى الحج وباعثه الرياء والسمعة خرج عن كونه من أعمال الآخرة، والأعمال بالنيات.", "وأما النظر في أن السفر أفضل أو الإقامة؟ فهو يضاهي النظر في أن الأفضل هو العزلة، أو المخالطة، وقد ذكرنا منهاجه في كتاب العزلة، فليفهم هذا منه، فإن السفر نوع مخالطة مع زيادة تعب ومشقة تفرق الهم وتشتت القلب في حق الأكثرين فتارة يخاف المسافر على نفسه وماله، وتارة ينزعج لمفارقة ما ألفه واعتاده في إقامته، وإن لم يكن معه مال لم يخل من الطمع والاستشراف إلى الخلق، والأفضل ما هو الأعون على الدين، ونهاية ثمرة الدين في الدنيا تحصيل معرفة الله تعالى والأنس بذكره، وكلاهما يحصل بدوام الفكر، والسفر معين على التعلم في الابتداء، والإقامة هي المعينة على العمل بالمتعلم في الانتهاء."]], "ic": "book"}, {"story": ["الباب الأول في الآداب من أول النهوض إلى آخر الرجوع (٥ من ٥)، ص٤٨٨", ["وأما السياحة في الأرض لا لمقصود ولا إلى مكان معروف فأمر منهي عنه، فقد روينا من حديث طاووس أن النبي ﷺ قال: «لا رهبانية ولا تبتل ولا سياحة في الإسلام». وقال الإمام أحمد بن حنبل: ما السياحة من الإسلام في شيء، ولا من فعل النبيين ولا الصالحين. وقد أخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أبو بكر بن جعفر قال: أخبرنا عبد الله بن أحمد قال: حدثني أبي قال:", "حدثنا أيوب بن النجار عن طيب بن محمد بن عطاء بن أبي رباح عن أبي هريرة قال: لعن رسول الله ﷺ راكب الفلاة وحده.", "وقد ذكرنا أن السفر يشتت القلب، فلا ينبغي للمريد أن يسافر إلا في طلب علم أو مشاهدة شيخ يقتدى به في سيرته، وكلما قوي عند المريد الفكر أو حب العمل والجد كان السكون به أولى، فهذا القول في أقسام السفر ونية المسافر.", "**الفصل الثاني**", "**في آداب المسافر من أول نهوضه إلى آخر رجوعه**", "وهي خمسة عشر أدبا:", "**الأول:** أن يبدأ برد المظالم، وقضاء الديون، وإعداد النفقة لمن يلزمه نفقته، ورد الودائع، وقد ذكرنا هذا مع تمامه في كتاب الحج.", "**الثاني:** أن يختار رفيقا.", "**الثالث:** أن يودع الأهل والأصدقاء، وكل هذا مشروح في كتاب الحج.", "**الرابع:** أن يصلي صلاة الاستخارة، وقد سبقت في كتاب الصلاة.", "**الخامس:** البكور.", "**السادس:** أن يكون سفره يوم الخميس.", "**السابع:** الخروج من منزله.", "**الثامن:** إذا حصل على باب الدار.", "**التاسع:** في الركوب.", "**العاشر:** أن يكون أكثر سيره بالليل.", "**الحادي عشر:** أن لا يمشي منفردا.", "**الثاني عشر:** ما يقول إذا علا نشزا أو هبط واديا.", "**الثالث عشر:** في النزول وما يقول في المنزل.", "**الرابع عشر:** أن يستصحب معه ما يصلحه كالسواك والمشط والمكحلة والمرآة(١).", "**الخامس عشر:** في آداب الرجوع من السفر، وكل هذه الأشياء مشروحة في كتاب الحج فلم نر إعادتها، فلتطالع من هناك.", "وأما الآداب الباطنة، فجملتها: أن لا يسافر إلا إذا كان دينه يزيد بالسفر، ومتى وجد قلبه متغيرا إلى نقصان فليقف، وليعلم أن سفره معلول، ولينو في دخول كل بلدة أن يرى شيوخها، وأن يستفيد من علومهم وآدابهم ليعمل بذلك، لا ليقول: لقيت. فإذا قصد الشيخ أقام على بابه حتى يخرج، ويستأذنه في السؤال قبل أن يسأل، فإن زار أخا له لم يقم عنده أكثر من ثلاثة أيام، فإنه حد الضيافة، وليكن سفر المريد من وطن هواه ليعز(٢) في غربته.", "حاشية: (١) ليست في (ظ).", "حاشية: (٢) في الأصل «ليفر»."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "الخامس عشر: في آداب الرجوع من السفر، وكل هذه الأشياء مشروحة في كتاب الحج فلم نر ____، فلتطالع من", "o": ["إعادتها", "الاحتساب", "تصويره", "والصديد"], "h": "راجع: ص٤٩٠"}, {"t": "fill", "d": 2, "q": "القسم الرابع: السفر هربا مما يقدح في البدن، كالطاعون، أو في المال، كغلاء السعر وما يجري مجراه، فأما الهرب من الطاعون فمستثنى لورود النهي عنه، ففي ____ من حديث عبد الرحمن بن عوف عن النبي ﷺ أنه", "o": ["الصحيحين", "بالبنات", "تدخلوا", "والإجارة"], "h": "راجع: ص٤٨٧"}, {"t": "fill", "d": 2, "q": "وأما الآداب الباطنة، فجملتها: أن لا يسافر إلا إذا كان دينه يزيد بالسفر، ومتى وجد قلبه متغيرا إلى نقصان فليقف، وليعلم أن سفره ____، ولينو في دخول كل بلدة أن يرى شيوخها، وأن يستفيد من علومهم وآدابهم", "o": ["معلول", "ضعفاء", "الموصلي", "يبيعه"], "h": "راجع: ص٤٩٠"}, {"t": "fill", "d": 2, "q": "وأما آيات الله في أرضه، ففي مشاهدتها فوائد للمستبصر، ففيها قطع متجاورات، وفيها الجبال ____ والبحار، وأنواع الحيوان والنبات، وما من", "o": ["والبراري", "المعلم", "يستجاب", "للاقتداء"], "h": "راجع: ص٤٨٤"}, {"t": "fill", "d": 2, "q": "القسم الثاني: وهو أن يسافر لأجل العبادة، إما لجهاد أو حج، وقد ذكرنا فضل ذلك وآدابه وأعماله الظاهرة والباطنة في كتاب أسرار الحج، ويدخل في جملته زيارة قبور ____ والأولياء والصالحين، وزيارة", "o": ["الأنبياء", "مشتركا", "المطيعي", "الأوقاف"], "h": "راجع: ص٤٨٦"}, {"t": "fill", "d": 2, "q": "وبالجملة؛ فالنفس في الوطن لا تظهر خبائث أخلاقها لاستئناسها بما يوافق طبعها من المألوفات المعهودة، وامتحنت بمشاق الغربة انكشفت غوائلها، ووقع الوقوف على عيوبها، فيمكن ____ بعلاجها", "o": ["الاشتغال", "انفراد", "وزيارة", "وإقبال"], "h": "راجع: ص٤٨٤"}]}], "sum": [["الصفحات", "ص٤٨٣ - ص٤٩٠"]], "_nq": 6}, {"id": "l34", "title": "الباب الثاني فيما لا بد للمسافر من تعلمه من رخص السفر وأدلة القبلة والأوقات", "group": "كتاب آداب السفر", "map": {"center": "الباب\nالثاني فيما", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الثاني فيما لا بد للمسافر من تعلمه من رخص السفر وأدلة القبلة وال", "b": [{"pic": ["books", "book"], "cap": "ص٤٩١ - ص٤٩٧"}, {"story": ["الباب الثاني فيما لا بد للمسافر من تعلمه من رخص السفر وأدلة  (١ من ٥)، ص٤٩١", ["**فيما لا بد للمسافر من تعلمه من رخص السفر وأدلة القبلة والأوقات**", "ينبغي للمسافر أن يتزود للدنيا والآخرة، فأما زاد الدنيا فالمطعم والمشرب وما يحتاج إليه، وما ينبغي أن يقول: أخرج متوكلا، فلا أحمل معي زادا. فإن حمل الزاد لا يناقض التوكل، وقد قال تعالى: ﴿وَتَزَوَّدُوا۟﴾ [البقرة: ١٩٧] وقد تزود موسى في لقاء الخضر، وتزود رسول الله ﷺ في خروجه إلى المدينة، وإنما نبغ قوم لم يفهموا فظنوا أن التوكل قطع الأسباب وهو جهل منهم بالعلم وأوضاع الحكمة، ولو كان التوكل ترك الأسباب لبطل على زعمهم تحمل الرشا واللدو لينزع الماء من البئر، فإذا لم يقدح حمل ذلك في التوكل مع كونه آلة في التوصل إلى الماء، فكذلك حمل عين الماء والمطعم.", "وأما زاد الآخرة فهو العلم الذي يحتاج إليه في طهارته وصلاته وعباداته، فإن السفر تارة يخفف عنه أشياء، فيحتاج إلى معرفة القدر الذي يخففه السفر، كالقصر والجمع والفطر، وتارة يشدد عليه أمورا كانت خفيفة عليه في الحضر، كالعلم بالقبلة وأوقات الصلاة، فإنه قد كان يكتفي في الحضر بأذان المؤذنين ومحاريب المساجد، فإذا ما يفتقر إلى تعلمه ينقسم إلى قسمين:", "**القسم الأول:** العلم برخص السفر، والسفر يفيد في الطهارة رخصتين تتعلق بمسح الخف والتيمم، وفي صلاة الفرض رخصتين تتعلق بالقصر والجمع، وفي النفل رخصتين الصلاة على الراحلة والصلاة ماشيا، وفي الصوم رخصة واحدة، وهي الفطر، هذه سبع رخص.", "**الرخصة الأولى:** المسح على الخفين، وفي أفراد مسلم من حديث علي رضي الله عنه أنه سئل عن المسح على الخفين، فقال: جعل رسول الله ﷺ ثلاثة", "أيام ولياليهن للمسافر، ويوما وليلة للمقيم. وفي حديث صفوان بن عسال قال: كنا نكون مع رسول الله ﷺ يعني في السفر فيأمرنا أنه لا ننزع خفافنا ثلاثة أيام إلا من جنابة، ولكن من غائط وبول ونوم.", "ويجوز المسح على الخفين والجرموقين(١) والجوربين ومن شرط جواز المسح أن يلبس الجميع بعد كمال الطهارة، وعن الإمام أحمد: لا يشترط ذلك. ولا يجوز المسح إلا على ما يستر محل الفرض من الرجلين ويثبت بنفسه سواء كان جلودا أو لبودا أو خشبا أو زجاجا، فإن كان فيه خرق يبدو منه بعض القدم، أو كان المقطوع واسعا بحيث يرى منه الكعبان، وكان الجورب خفيفا يصف القدم أو واسعا يسقط من الرجل لم يجز المسح، فإن لبس مع الجوربين نعلين فثبتا بهما جاز المسح عليهما، فمتى خلع النعلين بطل وضوءه.", "والسنة أن يمسح أعلى الخف دون أسفله وعقبه، فيضع يده على موضع الأصابع ثم يجرها إلى ساقه، وابتداء مدة المسح من حين الحدث بعد اللبس في أصح الروايتين، وفي الأخرى: من حين المسح بعد الحدث. وإذا ظهر من قدمه وانقضت مدة المسح استأنف الوضوء في إحدى الروايتين، وفي الأخرى يجزئه غسل قدميه."]], "ic": "book"}, {"story": ["الباب الثاني فيما لا بد للمسافر من تعلمه من رخص السفر وأدلة  (٢ من ٥)، ص٤٩٢", ["ومن مسح وهو مقيم ثم سافر، أو مسح وهو مسافر ثم أقام أتم مسح مقيم، وعن الإمام أحمد فيمن مسح وهو مقيم ثم سافر أنه يتم مسح مسافر، فإن شك هل ابتدأ المسح في الحضر أو في السفر؟ احتاط فبنى على مسح حاضر، ومن ابتدأ المسح في السفر أتم مسح مسافر، وإن كان قد وجد منه الحدث في الحضر.", "ويستحب لمن أراد لبس خفيه أن ينفضهما حذرا من آفة تكون فيهما كشوكة أو عقرب.", "**الرخصة الثانية:** التيمم، وهو بدل عن الماء عند العذر، وقد يفقد الماء وقد يكون موجودا لكنه يحول بينهما سبع أو عدو، أو يحتاج إلى شربه، فإن احتاج إليه", "حاشية: (١) الجرموق: ما يلبس فوق الخف لشدة البرد.", "لطبخ مرقة أو لحم، أو بل فتيت(١) لم يجز له التيمم؛ لأنه يمكنه أن يجتزئ بالفتيت اليابس ويترك تناول المرقة، فإن وهب له الماء وجب عليه القبول، وإن وهب له ثمنه لم يجب عليه أن يقبل لما فيه من المنة، وإن بيع بثمن المثل لزمه الشراء.", "وإذا عدم الماء وجب عليه الطلب بتفتيش الرحل، وطلب البقايا في الأواني، والتردد حول المنزل.", "وإذا نسي الماء في موضع لولا النسيان لاستعمله وصلى بالتيمم أعاد، فإن رجا وجود الماء أخر التيمم إلى آخر الوقت.", "وقد ذكرنا كيفية التيمم في كتاب الطهارة.", "وإذا وجد ما يكفيه لبعض بدنه لزمه استعماله وتيمم للباقي إن كان جنبا، وإن كان محدثا فهل يلزمه استعماله؟ فيه وجهان، وإذا تيمم صلى صلاة الوقت وقضى فوائت وجمع بين الصلاتين، ويتنفل إلى أن يخرج الوقت، فإذا خرج استأنف التيمم للصلاة الأخرى في إحدى الروايتين، وفي الأخرى يصلي به حتى يحدث، وإذا (٢-٢)خاف زيادة المرض أو تباطؤ البرء باستعمال الماء جاز له التيمم، وإذا(٢-٢) خاف من شدة البرد تيمم وصلى ولا إعادة عليه إن كان مسافرا، وإن كان حاضرا؟ فعلى روايتين.", "ومن لم يجد ماء ولا ترابا صلى، وهل يلزمه الإعادة؟ على روايتين.", "**الرخصة الثالثة:** في الصلاة المفروضة القصر، ومتى سافر سفرا يبلغ مرحلتين كل مرحلة ثمانية فراسخ، وكل فرسخ ثلاثة أميال، وكل ميل أربعة آلاف خطوة، وكان ذلك في غير معصية مثل أن يخرج عاقا لوالديه، أو هاربا من مالكه، أو من غريمه مع يساره، أو إلى قطع طريق، أو سعي في فساد، فله أن يقصر الرباعية فيصليها ركعتين إذا فارق بيوت قريته، أو خيام قومه، فأما إذا خرج لا إلى مقصود كالسائح، فلا يجوز له الترخص(٣).", "حاشية: (١) الفتيت: الخبز اليابس يفت ويكسر ويبلل بالمرق ليؤكل.", "حاشية: (٢-٢) سقط من (ظ).", "حاشية: (٣) تحرفت في الأصل إلى: «الرخص».", "والقصر أفضل من الإتمام، وإذا نوى الإقامة أكثر من أربعة أيام أتم، وعن الإمام أحمد: إن نوى اثنين وعشرين صلاة أتم، وإن نوى دونها قصر، وإن أقام لقضاء حاجة ولم ينو الإقامة قصر أبدا، وكذلك إذا حبسه سلطان أو عدو وهو في السفر."]], "ic": "book"}, {"story": ["الباب الثاني فيما لا بد للمسافر من تعلمه من رخص السفر وأدلة  (٣ من ٥)، ص٤٩٤", ["وإذا أحرم في الحضر ثم سافر، أو أحرم في السفر ثم أقام أو ائتم بمقيم أو بمن يشك وهو مقيم أو مسافر، أو لم ينو القصر لزمه أن يتم.", "وإذا نسي صلاة سفر فذكرها في الحضر، أو صلاة حضر فذكرها في السفر، أو سافر بعد دخول الوقت لم يجز له القصر.", "**الرخصة الرابعة:** الجمع بين الظهر والعصر في وقتيهما، وبين المغرب والعشاء في وقتيهما، وذلك جائز في السفر الطويل دون القصير، وهو مخير بين تأخير الأولى إلى وقت الثانية، وبين تقديم الثانية إلى وقت الأولى، والمستحب التأخير، فإن جمع في وقت الأولى افتقر إلى ثلاثة شروط: أن يقدم الأولى، وأن ينوي الجمع عند الإحرام بالأولى في أحد الوجهين، وفي الآخر: يجوز أن ينوي بعد الفراغ من الأولى، وأن لا يفرق بينهما إلا بقدر الإقامة أو الوضوء، فإن صلى بينهما سنة الصلاة بطل الجمع في إحدى الروايتين، وفي الأخرى: لا يبطل.", "وإذا أراد الجمع في وقت الثانية كفاه نية الجمع في وقت الأولى إلا أن يبقى منه قدر ما يصليها، والترتيب، وهل يشترط أن لا يفرق على وجهين أصحهما أنه لا يشترط، وقال أبو بكر ـ من أصحابنا ـ: لا يفتقر الجمع والقصر إلى أن ينويهما، ولا ينبغي أن تهمل النوافل في السفر؛ لأن ثوابها أكثر من ربح السفر.", "وعذر المطر مجوز للجمع كعذر السفر، وترك الجمعة أيضا من رخص السفر، ولو نوى الإقامة بعد أن صلى العصر فأدرك وقت العصر في الحضر، فعليه أداء العصر وما مضى إنما كان مجزئا بشرط أن يبقى العذر إلى خروج وقت العصر.", "(١-١)＊＊الرخصة الخامسة:＊＊ التنفل على الراحلة(١-١)، ولا يجب عليه في التنفل في السفر", "حاشية: (١-١) سقط من الأصل.", "استقبال القبلة، بل يصلي حيث توجه فإن أمكنه افتتاح الصلاة إلى القبلة لزمه ذلك، وأتم الصلاة على حسب حاله، وسواء كان راكبا أو ماشيا.", "**الرخصة السادسة:** التنفل للماشي، وهو جائز في السفر، ويومئ بالركوع والسجود، ولا يعقد للتشهد؛ لأن ذلك يبطل فائدة الرخصة، وحكمه حكم الراكب، لكن ينبغي أن يحرم بالصلاة مستقبلا للقبلة؛ لأن انحرافه في لحظة لا عسر فيه بخلاف الراكب، وكل هارب من عدو أو سيل أو سبع، فله أن يصلي الفريضة راكبا وماشيا على ما يمكن.", "**الرخصة السابعة:** الفطر، وله أن يفطر إلا إذا أصبح مقيما ثم سافر، فإنه لا يجوز له إفطار ذلك اليوم، وعن الإمام أحمد رواية أخرى: يجوز له الإفطار، فإن قدم المسافر في أثناء النهار وهو مفطر لزمه القضاء رواية واحدة، وهل يجب عليه أن يمسك بقية يومه؟ فيه روايتان."]], "ic": "book"}, {"story": ["الباب الثاني فيما لا بد للمسافر من تعلمه من رخص السفر وأدلة  (٤ من ٥)، ص٤٩٥", ["والفطر والقصر في حق المسافر أفضل من الصوم والإتمام، فإن قيل: هل يجب على المسافر علم هذه الرخص قبل السفر؟ فالجواب: أنه إذا لم يعزم على الترخص لم يلزمه إلا علم التيمم وحده، فإن فقد الماء ليس إليه إلا أن يسافر على شاطئ نهر يوثق ببقاء مائه، أو يكون معه عالم يقدر على استفتائه عند الحاجة فله أن يؤخر إلى وقت الحاجة.", "فإن قيل: كيف قلتم: يجب عليه علم التيمم، والصلاة التي يتيمم لها ما وجبت بعد؟", "قلنا: كما يجب تعلم المناسك قبل الإحرام.", "**القسم الثاني:** ما يتجدد من الوظيفة بسبب السفر، وهو علم القبلة والأوقات وذلك أيضا واجب في الحضر ولكنه يلغى في ذلك بمحراب متفق عليه وبمؤذن يراعي الوقت، فأما المسافر فلا بد له (١-١)من العلم(١-١) بأدلة القبلة والمواقيت.", "حاشية: (١-١) سقط من الأصل.", "ويستدل على القبلة بالنجوم والشمس والرياح والمياه والجبال والمجرة، فأما النجوم، فأثبتها الجدي، وهو نجم خفي يعرف مكانه بالفرقدين؛ لأنهما دونه، وحوله بنات نعش(١)، فإذا جعله المصلي حذاء ظهر أذنه اليمنى على علوها كان متوجها إلى باب البيت(٢).", "وأما الشمس، فإنها تطلع أبدا من يسرة المصلي محاذية لحرف كتفه اليسرى، وتغرب حذاء حرف كتفه اليمنى.", "وأما الرياح، فالجنوب تهب مستقبلة لبطن كتف المصلي الأيسر مارة مما يلي وجهه إلى يمينه، والشمال مقابلتها تهب من يمينه مارة إلى مهب الجنوب، والدبور مستقبلة شطر وجه المصلي الأيمن، والصبا مقابلتها تهب من ظهر المصلي.", "وأما المياه، فإنها تجري من يمين المصلي إلى يسرته على انحراف قليل كدجلة والفرات ولا اعتبار بالأنهار المحدثة ولا بنهر بخراسان وآخر بالشام يسمى كل واحد منها المقلوب(٣)؛ لأنه يجري ماؤه من يسرة المصلي إلى يمينه.", "والجبال: فأوجهها جميعا مستقبلة البيت(٤).", "وأما المجرة، وتسمى سرج السماء تكون أول الليل ممتدة على كتف المصلي اليسرى إلى القبلة ثم تلتوي رأسها حتى يصير في آخر الليل على كتفه اليمنى.", "وإذا اشتبهت عليه القبلة صلى بالاجتهاد، فإذا حضرت صلاة أخرى اجتهد أيضا، فإن خالف اجتهاده الأول لم يعد الصلاة الأولى؛ لأن الاجتهاد لا ينقض بالاجتهاد.", "حاشية: (١) بنات نعش: سبعة كواكب تشاهد جهة القطب الشمالي شبهت بحملة النعش.", "حاشية: (٢) يتحدث المصنف رحمه الله في هذا الموقع وما بعده عن المصلي الموجود في بلاد الشام وما والاها، أما لمن في بلاد اليمن ومصر والمغرب والمشرق فإن ذلك يختلف كل بحسب موقعه.", "حاشية: (٣) النهر الذي يقصده هو نهر العاصي الذي يجري قرب مدينة حماة السورية، ويصب في البحر قرب أنطاكية، وسمي بالعاصي لأن الأنهار القريبة تترجه من الشمال إلى الجنوب، وهو بعكسها. معجم البلدان ٤/ ٦٧.", "حاشية: (٤) فيما ذكره المصنف هنا نظر، فالواقع والمشاهدة يخالفان ذلك."]], "ic": "book"}, {"story": ["الباب الثاني فيما لا بد للمسافر من تعلمه من رخص السفر وأدلة  (٥ من ٥)، ص٤٩٧", ["وأما معرفة أوقات الصلوات الخمس فلا بد منها، ووقت الظهر يدخل بالزوال، وكل شخص يقع له في ابتداء النهار ظل مستطيل في جانب المغرب، ثم لا يزال ينقص إلى وقت الزوال، ثم يأخذ في الزيادة في جهة المشرق، ولا يزال يزيد إلى الغروب، فليقم المسافر في موضع أو لينصب عودا مستقيما وليعلم على رأس الظل، ولينظر، فإن رآه في النقصان فما دخل بعد وقت الصلاة، فإذا أخذ في الزيادة فقد زالت الشمس وهو أول وقت الظهر، وآخره إذا صار ظل كل شيء مثليه، وعن الإمام أحمد: أن آخره ما لم تصفر الشمس، ثم يخرج وقت الاختيار ويبقى وقت الجواز إلى الغروب، وأول وقت المغرب إذا غابت الشمس، وآخره إذا غاب الشفق الأحمر، فحينئذ تجب العشاء وآخر وقتها ثلث الليل، وعن الإمام أحمد: نصفه، والأفضل تأخيرها إلى آخر وقتها، ثم يذهب وقت الاختيار ويبقى وقت الجواز إلى طلوع الفجر الثاني، فإذا طلع فهو وقت صلاة الفجر.", "ومن أدرك من الصلاة ركعة قبل أن يخرج الوقت فقد أدركها، ولا يجوز له أن يصلي حتى يتيقن دخول الوقت أو يغلب على ظنه.", "**آخر كتاب السفر**"]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "القسم الأول: العلم برخص السفر، والسفر يفيد في الطهارة رخصتين تتعلق بمسح الخف والتيمم، وفي صلاة ____ رخصتين تتعلق بالقصر والجمع، وفي النفل رخصتين الصلاة على الراحلة والصلاة ماشيا، وفي الصوم رخصة", "o": ["الفرض", "يغلبهم", "يستثار", "اشتبهت"], "h": "راجع: ص٤٩١"}, {"t": "fill", "d": 2, "q": "لطبخ مرقة أو لحم، أو بل فتيت لم يجز له التيمم؛ لأنه يمكنه أن يجتزئ بالفتيت اليابس ويترك تناول المرقة، فإن وهب له الماء وجب عليه القبول، وإن وهب له ثمنه لم يجب عليه أن يقبل لما فيه من المنة، وإن بيع ____ المثل لزمه الشراء", "o": ["بثمن", "الشركة", "ورجل", "وقسما"], "h": "راجع: ص٤٩٣"}, {"t": "fill", "d": 2, "q": "ومن مسح وهو مقيم ثم سافر، أو مسح وهو مسافر ثم أقام أتم مسح مقيم، وعن الإمام أحمد فيمن مسح وهو مقيم ثم سافر أنه يتم مسح مسافر، فإن شك هل ____ المسح في الحضر أو في السفر", "o": ["ابتدأ", "فيستوي", "فكانت", "قيامه"], "h": "راجع: ص٤٩٢"}, {"t": "fill", "d": 2, "q": "وإذا نسي صلاة سفر فذكرها في الحضر، أو صلاة حضر فذكرها في السفر، أو سافر بعد دخول الوقت لم يجز له ____", "o": ["القصر", "ينهه", "ويجهلون", "المعاصي"], "h": "راجع: ص٤٩٤"}, {"t": "fill", "d": 2, "q": "وإذا أراد الجمع في وقت الثانية كفاه نية الجمع في وقت الأولى إلا أن يبقى منه قدر ما يصليها، والترتيب، وهل يشترط أن لا يفرق على وجهين أصحهما أنه لا يشترط، ____ أبو بكر ـ من أصحابنا ـ", "o": ["وقال", "عالما", "متدين", "صافحني"], "h": "راجع: ص٤٩٤"}, {"t": "fill", "d": 2, "q": "ومن أدرك من الصلاة ركعة قبل أن يخرج الوقت فقد أدركها، ولا ____ له أن يصلي حتى يتيقن دخول الوقت أو يغلب على ظنه", "o": ["يجوز", "شريكي", "لذيذ", "الخطبة"], "h": "راجع: ص٤٩٧"}]}], "sum": [["الصفحات", "ص٤٩١ - ص٤٩٧"]], "_nq": 6}, {"id": "l35", "title": "كتاب السماع والوجد", "group": "كتاب السماع والوجد", "map": {"center": "كتاب\nالسماع والوجد", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "كتاب السماع والوجد", "b": [{"pic": ["books", "book"], "cap": "ص٤٩٩ - ص٥٠١"}, {"story": ["كتاب السماع والوجد (١ من ٢)، ص٤٩٩", ["الحمد لله الذي خص أولياءه بحقيقة معرفته(١)، وأوقد في قلوبهم نيران محبته، وشوقهم إلى لقائه ورؤيته، على أنهم يرونه في كل وقت في صنعته، فيسمعون خطابه من كل مخلوق بعبارة عبرته، أحمده والحمد من منته، وأصلي على رسوله محمد وصحابته وتابعيهم بإحسان على سنته، وسلم تسليما كثيرا.", "واعلم أن السماع الذي نعني به الغناء من أكبر ما تطرق به إبليس إلى فساد القلوب، وغر به خلقا لا يحصى من العلماء والزهاد فضلا عن العوام حتى ادعوا حضور القلوب(٢) مع الله عند سماع الأغاني المطربة، وظنوا أن ما أوجب السماع من طرب القلوب وانزعاجها وجد يتعلق بالآخرة حتى ربما خفي على النفس حال النفس، وإذا أردت أن تعرف الحق، فانظر في السرب الأول هل فعل رسول الله ﷺ شيئا من ذلك وأصحابه؟ ثم انظر إلى أقوال التابعين وتابعيهم وفقهاء الأمة كمالك وأبي حنيفة والشافعي وأحمد وكل القوم ذموا الغناء حتى قال مالك: إذا اشترى جارية فوجدها مغنية كان له ردها، وسئل عن الغناء فقال: إنما يفعله عندنا الفساق، وسئل الإمام أحمد عن رجل مات وخلف ولدا وجارية مغنية، واحتاج الصبي إلى بيعها فقال: تباع على أنها ساذجة لا مغنية، فقيل له: إنها تساوي ثلاثين ألفا، وإذا بيعت ساذجة ربما سويت عشرين دينارا. فقال: لا تباع إلا على أنها ساذجة. وقد أطبق الفقهاء على الزجر عن الغناء، ومن المتأخرين أبو الطيب الطبري من كبار أصحاب الشافعي صنف فيه كتابا سمعناه عنه، وبالغ في النهي", "حاشية: (١) في الأصل: «معرفته».", "حاشية: (٢) في الأصل: «القلب».", "عنه، وإنما تعلق بإباحته قوم مفتونون وقالوا: قد أجازه قوم من السلف، وقد سمع أحمد بن حنبل قول قوال فقال: لا بأس بهذا. وينبغي للعاقل أن ينظر فيما أفتى بجوازه (١-١)من أفتى(١-١) فليس سوى الأشعار الزهدية وما يشبهها من غير ضرب بقضيب أو آلة تطرب، ولا ضم تصفيق إلى ذلك ولا رقص، وعلى هذا يحمل حديث عائشة قالت: دخل علي أبو بكر وعندي جاريتان من جواري الأنصار تغنيان بما تقاولت به الأنصار يوم بعاث(٢) فقال أبو بكر: أبمزمور الشيطان في بيت رسول الله! فقال رسول الله ﷺ: «دعهما يا أبا بكر، إن لكل قوم عيدا وهذا عيدنا». ومعلوم أن ما تقاولت به الأنصار لا يطرب ولو لحن، وسئل الإمام أحمد عن القصائد الرقاق التي يقولونها، فقال: مثل أي شيء؟ فقيل له:", "إذا ما قال لي ربي  ما استحييت تعصيني", "فقال: أعد علي. فهذا كان غناء القوم وما يشبهه، والفقيه كالطبيب ينبغي أن يزن الزمان والشخص ثم يصف، ولهذا قالت عائشة: لو علم رسول الله ﷺ ما أحدث النساء بعده لمنعهن المسجد.", "وغير خاف أنه لم يكن للأوائل ما أحدثه الأواخر من الدف بالصنج والشبابة والشعر الرقيق الذي يقولون فيه إذا غنوا:", "ذهبي اللون  عَنِ ٱلْمُنكَرِ وَيُقِيمُونَ ٱلصَّلَوٰةَ﴾ [التوبة: ٧١]، فنعت المؤمنين بأنهم يأمرون بالمعروف والذي هجر الأمر بالمعروف خارج عن هؤلاء المؤمنين المنعوتين في هذه الآية وقال تعالى: ﴿لُعِنَ ٱلَّذِينَ كَفَرُوا۟ مِنۢ بَنِىٓ إِسْرَٰٓءِيلَ عَلَىٰ لِسَانِ دَاوُۥدَ وَعِيسَى ٱبْنِ مَرْيَمَ ۚ ذَٰلِكَ بِمَا عَصَوا۟ وَّكَانُوا۟ يَعْتَدُونَ كَانُوا۟ لَا يَتَنَاهَوْنَ عَن مُّنكَرٍ فَعَلُوهُ﴾ [المائدة: ٧٨-٧٩] وقال: ﴿فَلَوْلَا كَانَ مِنَ ٱلْقُرُونِ مِن قَبْلِكُمْ أُو۟لُوا۟ بَقِيَّةٍ يَنْهَوْنَ عَنِ ٱلْفَسَادِ﴾ الآية [هود: ١١٦] وقال: ﴿كُونُوا۟ قَوَّٰمِينَ بِٱلْقِسْطِ شُهَدَآءَ لِلَّهِ وَلَوْ عَلَىٰٓ أَنفُسِكُمْ﴾ [النساء: ١٣٥] والآيات في هذا كثيرة.", "وأما الأخبار: ذكر الأخذ على يد الظالم والفاجر: أخبرنا هبة الله بن محمد بن"]], "ic": "book"}, {"story": ["الباب الأول في وجوب الأمر بالمعروف والنهي عن المنكر وفضيلته  (٢ من ٤)، ص٥٠٦", ["الحصين قال: أخبرنا الحسن بن علي التميمي قال: أخبرنا أبو بكر أحمد بن جعفر قال: حدثنا عبد الله بن أحمد بن حنبل قال: حدثني أبي قال: حدثنا يحيى بن سعيد عن زكريا قال: حدثنا عامر قال: سمعت النعمان بن بشير يخطب ـ وأومأ بإصبعيه إلى أذنيه ـ سمعت رسول الله ﷺ يقول: «مثل القائم على حدود الله، والواقع فيها، والمدهن فيها مثل قوم ركبوا سفينة فأصاب بعضهم أسفلها وأوعرها وشرها وأصاب بعضهم أعلاها، فكان الذي في أسفلها إذا استقوا الماء مروا على من فوقهم فآذوهم، فقالوا: لو خرقنا في نصيبنا خرقا فاستسقينا منه ولم نؤذ من فوقنا. فإن تركوهم وأمرهم هلكوا جميعا، وإن أخذوا على أيديهم نجوا جميعا». انفرد بإخراجه البخاري.", "**ذكر مراتب الإنكار:** أنبأنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا ابن مالك قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا أبو معاوية قال: حدثنا الأعمش عن إسماعيل بن رجاء عن أبيه عن أبي سعيد الخدري قال: أخرج مروان المنبر في يوم عيد ولم يك يخرج به، وبدأ بالخطبة قبل الصلاة، ولم يك يبدأ بها، فقام رجل فقال: يا مروان، خالفت السنة، أخرجت المنبر في يوم عيد ولم تك تخرج به في يوم عيد، وبدأت بالخطبة قبل الصلاة ولم تك تبدأ بها. قال: فقال أبو سعيد الخدري: من هذا؟ فقالوا: فلان بن فلان. قال: فقال أبو سعيد: أما هذا فقد قضى ما عليه، سمعت رسول الله ﷺ يقول: «من رأى منكم منكرا فإن استطاع أن يغيره فليفعل». وقال مرة: «فليغيره، فإن لم يستطع بيده فبلسانه، فإن لم يستطع بلسانه فبقلبه، وذاك أضعف الإيمان». انفرد بإخراجه مسلم.", "وسئل حذيفة عن ميت الأحياء فقال: الذي لا ينكر المنكر بيده ولا بلسانه ولا بقلبه.", "**ذكر الإنكار على من يخاف:** أخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أبو بكر بن مالك قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا ابن نمير قال: حدثنا الأعمش عن عمرو بن مرة عن أبي البختري عن"]], "ic": "book"}, {"story": ["الباب الأول في وجوب الأمر بالمعروف والنهي عن المنكر وفضيلته  (٣ من ٤)، ص٥٠٧", ["أبي سعيد الخدري قال: قال رسول الله ﷺ: «لا يحقرن أحدكم نفسه أن يرى أمرا لله عز وجل فيه مقال ثم لا يقوله، فيقول الله عز وجل: ما منعك أن تقول فيه؟ فيقول: رب خشيت الناس. فيقول: فأنا أحق أن تخشى». قال الإمام أحمد: وحدثنا ابن أبي عدي عن سليمان عن أبي نضرة عن أبي سعيد قال: قال رسول الله ﷺ: «لا يمنعن أحدكم هيبة الناس أن يقول في حق إذا رآه أو سمعه»، قال: وقال أبو سعيد: وددت أني لم أسمعه. وهذا الحديث ينبه على أنه لا يجوز لأحد أن يتعرض لرؤية منكر لا يطيق إزالته كالدخول إلى دار ظالم أو النظر إلى منكرات يوم العيد ونحو ذلك، وروى أبو داود في سننه من حديث أبي سعيد عن النبي ﷺ أنه سئل: ما أفضل الجهاد؟ فقال: «كلمة عدل عند سلطان جائر». أخبرنا يحيى بن علي قال: أخبرنا أبو بكر الخياط قال: حدثنا أبو علي بن حكمان الفقيه قال: حدثنا أبو بكر النقاش قال: حدثنا أبو نعيم الاستراباذي، قال: حدثنا الربيع بن سليمان قال: سمعت الشافعي يقول: أشد الأعمال ثلاثة: الجود من قلة، والورع في خلوة، وكلمة الحق عند من يرجى ويخاف.", "**الجد في الأمر بالمعروف وترك المحاباة:** أخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أبو بكر بن مالك قال: حدثنا عبد الله بن أحمد قال حدثني أبي قال: حدثنا عبد الرحمن بن محمد المحاربي قال: حدثنا أبي الزبير عن عبد الله بن عمرو: قال رسول الله ﷺ: «إذا رأيت أمتي تهاب الظالم أن تقول له: أنت ظالم، فقد تودع منهم». وفي حديث ابن مسعود عن النبي ﷺ قال: «إن من كان قبلكم كان إذا عمل العامل فيهم بالخطيئة نهاه الناهي تعذيرا، وإذا كان الغد جالسه وواكله وشاربه، كأنه لم يره على الخطيئة بالأمس، فلما رأى الله ذلك منهم ضرب بقلوب بعضهم على بعض، ثم لعنهم
