حله في حقه، فإن الإثم في الأخذ من غير حقه، ____ في غير حقه", "o": ["والوضع", "العمامة", "تعزز", "أسيره"], "h": "راجع: ص٨١١"}, {"t": "fill", "d": 2, "q": "سمع إخواننا أهل الأموال بما فعلنا، ففعلوا ____", "o": ["مثله", "والسنة", "عقدت", "تغتر"], "h": "راجع: ص٨١٤"}, {"t": "fill", "d": 2, "q": "وجاء أعرابي إلى طلحة فسأله، وتقرب ____ برحم، فقال", "o": ["إليه", "النقور", "البلدي", "والحلس"], "h": "راجع: ص٧٩٣"}, {"t": "fill", "d": 2, "q": "أخبرنا أبو منصور القزاز، قال: حدثنا أبو بكر بن ثابت، قال: أخبرنا الحسن ابن محمد النصيبي، قال: أخبرنا إسماعيل بن سعيد المعدل، قال: أخبرنا ابن دريد، قال: أخبرنا أبو معاذ المؤدب، قال: أخبرنا أبو ____", "o": ["عثمان", "مشغولا", "فقتلها", "قولهم"], "h": "راجع: ص٧٩٥"}]}, {"t": "كتاب ذم البخل وذم حب المال - القسم ٢ من ٤", "b": [{"story": ["كتاب ذم البخل وذم حب المال (٧ من ٢٤)، ص٧٨٦", ["حاشية: (١) في (ظ): (ما كتب الله له).", "حاشية: (٢) في (ظ): (العز).", "حاشية: (٣) أخرجه أحمد (٢٣٤٩٨) من حديث أبي أيوب الأنصاري قال: جاء رجل إلى النبي ﷺ، فقال: عظني وأوجز. فقال: (إذا قمت في صلاتك فصل صلاة مودع، ولا تكلم بكلام تعتذر منه غدا، وأجمع الإياس مما في يد الناس).", "حاشية: (٤-٤) وردت في النسخ مضربة: (وأن المراد إياس من شيء استغنى عنه) والمثبت من الإحياء.", "حاشية: (٥) تحرفت في (ظ) إلى: (وثاثق).", "حاشية: (٦) في (ظ): (يعني).", "**بيان**", "**علاج الحرص والطمع والدواء الذي تكتسب به صفة القناعة**", "اعلم أن هذا الدواء مركب من ثلاثة أركان: الصبر، والعلم، والعمل، ومجموع ذلك خمسة أمور:", "**الأول**: وهو العمل: الاقتصاد في المعيشة والرفق في الإنفاق، فمن أراد عز القناعة فينبغي أن يسد عن نفسه أبواب الخرج ما أمكنه، ويرد نفسه إلى مالا بد له منه، فمن كثر خرجه واتسع إنفاقه لم تمكنه القناعة بل إن كان وحده فينبغي أن يقنع بثوب واحد خشن ويقنع بأي طعام كان، ويقلل من الإدام ما أمكنه، ويوطن نفسه عليه، وإن كان له عيال فيرد كل واحد إلى هذا القدر، فإن هذا القدر يتيسر بأدنى جهد، ويمكن معه الإجمال في الطلب.", "والاقتصاد في المعيشة هو الأصل في القناعة، ونعني به الرفق في الإنفاق وترك الخرق فيه، قال ﷺ: «إن الله يحب الرفق في الأمر كله» وقال: «ما عال من اقتصد». وقال: «ثلاث منجيات: خشية الله في السر والعلانية، والقصد في الغنى والفقر، والعدل في الرضا والغضب» وفي الحديث: «التدبير نصف العيش».", "ورأى رجل أبا الدرداء يلتقط حبا من الأرض ويقول: إن من فقهك رفقك في معيشتك.", "**والثاني**: أنه إذا تيسر له في الحال ما يكفيه، فلا ينبغي أن يكون شديد الاضطراب لأجل المستقبل، ويعينه على ذلك قصر الأمل واليقين بأن رزقه المقدر له لابد أن يأتيه وإن لم يحرص، وأن شدة الحرص ليس هو السبب لوصول الرزق، وليعلم أن الشيطان يعده الفقر ويأمره بالفحشاء، فيخوفه أن يمرض أو يعجز أو", "يحتاج ويحثه على شدة الحرص واحتمال الذل(١)، ثم يضحك به إذ يستعجل الذل والحرص لأجل متوهم في ثاني الأمر، وقد قال الشاعر:", "ومن ينفق الأيام(٢) في جمع ماله  مخافة فقر فالذي فعل الفقر", "وقد روى ابن مسعود عن النبي ﷺ أنه قال: «إن الروح الأمين نفث في روعي أنه ليس من نفس تموت حتى تستوفي رزقها، فاتقوا الله وأجملوا في الطلب، ولا يحملنكم استبطاء الرزق أن تطلبوه بمعاصي الله عز وجل، فإنه لا يدرك ما عند الله عز وجل إلا بطاعته».", "وروى أبو سعيد عن النبي ﷺ أنه قال: «لو فر أحدكم من رزقه لأدركه كما يدركه الموت».", "وقال عمر بن الخطاب: ما من امرئ إلا وله أثر هو واطئه، ورزق هو آكله، وأجل هو بالغه، وحتف هو قاتله، حتى لو أن رجلا هرب من رزقه لاتبعه حتى يدركه كما أن الموت مدرك من هرب منه."]], "ic": "book"}, {"story": ["كتاب ذم البخل وذم حب المال (٨ من ٢٤)، ص٧٨٨", ["وقال أبو حازم: وجدت الدنيا شيئين: فشيء هو لي، فلن أعجله قبل أجله ولو طلبته بقوة السماوات والأرض، وشيء هو لغيري، فذلك لم أنله فيما مضى ولا أرجوه فيما بقي، يمنع الذي لي من غيري كما يمنع الذي لغيري مني، ففي أي هذين أفني عمري؟ ووجدت ما أعطيت من الدنيا شيئين: فشيء يأتي أجله قبل أجلي فأغلب عليه، وشيء يأتي أجلي قبل أجله، فأموت وأخلفه لمن بعدي، ففي أي هذين أعصي ربي؟", "واعلم أنه لا ينفك الإنسان عن الحرص إلا بحسن ثقته بتدبير الله تعالى في تقدير أرزاق العباد، وأن ذلك يصل لا محالة، مع الإجمال في الطلب، بل ينبغي أن يعلم أن رزق العبد من حيث لا يحتسب أكثر، فإذا انسد عليه باب كان ينتظر", "حاشية: (١) في الأصل: (أذى الذل).", "حاشية: (٢) في الأصل: (الأيام الساعات) هكذا. والبيت له رواية أخرى: (ومن ينفق الساعات).", "الرزق منه فلا ينبغي أن يضطرب قلبه، فقد قال عليه الصلاة والسلام: «أبى الله أن يرزق عبده المؤمن إلا من حيث لا يحتسب».", "فهذا دواء من جهة المعرفة لا بد منه لدفع تخويف الشيطان وإنذاره بالفقر.", "**الثالث**: أن يعرف ما في القناعة من عز الاستغناء، وما في الطمع والحرص من الذل، فإذا تحقق عنده ذلك انبعثت رغبته إلى القناعة، لأنه لا يخلو في الحرص من تعب وفي الطمع من ذل، وليس في القناعة إلا ألم الصبر عن الشهوات والفضول، وهذا ألم لا يطلع عليه أحد، وفيه ثواب الآخرة(١)، وذلك المتقدم يضاف إليه نظر الناس، وفيه الوبال والمأثم، ثم إنه يفوته عز النفس والقدرة على متابعة الحق، فإن من كثر طمعه وحرصه كثرت حاجته إلى الناس فلا يمكنه أن يدعوهم إلى الحق، فيحتاج إلى أن يداهن، ومن لم يؤثر عز النفس على شهوة البطن فهو ركيك العقل ناقص الإيمان، قال ﷺ: «عز المؤمن استغناؤه عن الناس». ففي القناعة الحرية والعز، ولذلك قيل: استغن عمن شئت فأنت نظيره، واحتج إلى من شئت فأنت أسيره، وأحسن إلى من شئت فأنت أميره.", "**الرابع**: أن يكثر تفكره في تنعم اليهود والنصارى وأراذل الناس والحمقى منهم ومن لا دين له ولا عقل، ثم ينظر إلى أحوال الأنبياء والأولياء والصالحين، ويسمع أحاديثهم ويطالع أحوالهم، ويخير عقله بين أن يكون على مشابهة أراذل الخلق، أو على الاقتداء بمن هو أعز أصناف الخلق عند الله حتى يهون بذلك الصبر على القليل والقناعة باليسير، فإنه إن تنعم بالمطعم فالبهيمة أكثر منه أكلا، وإن تنعم بالوطء فالعصفور أكثر سفادا منه، وإن قنع بالقليل لم يساهمه(٢) في رتبته إلا الأنبياء والأولياء.", "**الخامس**: أن يفهم ما في جمع المال من الخطر، كما ذكرناه في آفات المال وما فيه من خوف السرقة والنهب والضياع، وما في خلو اليد من الأمن والفراغ", "حاشية: (١) في النسخ: (الأجر)، والمثبت من الإحياء.", "حاشية: (٢) في الأصل: (يشابهه)، ويساهمه، أي: يشاركه."]], "ic": "book"}, {"story": ["كتاب ذم البخل وذم حب المال (٩ من ٢٤)، ص٧٩٠", ["وثواب الفقر، ويتمم ذلك بأن ينظر أبدا إلى من هو دونه في الدنيا لا إلى من هو فوقه، فإن الشيطان أبدا يصرف نظر الآدمي إلى من فوقه في الدنيا ودونه في الدين، وقد أخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا عبد الرزاق قال: حدثنا معمر عن همام بن منبه قال: حدثنا أبو هريرة قال: قال رسول الله ﷺ: «إذا نظر أحدكم إلى من فضل الله عليه في المال والخلق فلينظر إلى من هو أسفل منه ممن فضل الله عليه». أخرجاه في الصحيحين. وفي لفظ: «انظروا إلى من هو أسفل منكم ولا تنظروا إلى من هو فوقكم، فإنه أجدر أن لا تزدروا نعمة الله عليكم».", "واعلم أنه من حقق العمل بهذه الأشياء قدر على اكتساب خلق القناعة، وعماد الأمر الصبر وقصر الأمل، وأن يعلم أن غاية صبره في الدنيا أيام قلائل لتمتع دائم، فيكون كالمريض الذي يصبر على مرارة الدواء لما يرجوه من الشفاء.", "**بيان**", "**فضيلة السخاء**", "ينبغي لمن فقد المال أن يستعمل القناعة والصبر، ولمن وجده أن يستعمل السخاء والإيثار واصطناع المعروف، فإن السخاء من أخلاق الأنبياء، وهو أصل من أصول النجاة، وفي الصحيحين من حديث أبي هريرة عن النبي ﷺ أنه قال: «ما من يوم يصبح(١) العباد فيه إلا ملكان ينزلان، فيقول أحدهما: اللهم أعط منفقا خلفا. ويقول الآخر: اللهم أعط ممسكا تلفا».", "وقد روى جابر عن النبي ﷺ أنه قال: «قال جبريل: قال الله عز وجل: إن هذا دين - وفي لفظ: الإسلام دين - ارتضيته لنفسي، ولن يصلحه إلا السخاء وحسن الخلق، فأكرموه بهما ماصحبتموه».", "وروى جابر أيضا عن النبي ﷺ أنه قيل له: أي الإيمان خير؟ قال: «الصبر والسماحة».", "وفي حديث ابن عباس عن النبي ﷺ، أنه قال: «تجافوا عن ذنب السخي، فإن الله آخذ بيده كلما عثر».", "وروت عائشة عن النبي ﷺ أنه قال: «الجنة دار الأسخياء».", "وما جبل ولي لله عز وجل إلا على السخاء، والسخي قريب من الله بعيد عن النار قريب من الجنة، والبخيل بعيد من الله بعيد من الجنة بعيد من الناس قريب من النار، والجاهل السخي أحب إلى الله من العابد البخيل، وروى أبو هريرة عن النبي ﷺ أنه قال: «السخاء شجرة في الجنة، فمن كان سخيا أخذ بغصن منها فلم يتركه", "حاشية: (١) في (ظ): (أصبح).", "ذلك الغصن حتى يدخله الجنة، والشح شجرة في النار، فمن كان شحيحا أخذ بغصن منها، فلم يتركه ذلك الغصن حتى يدخله النار».", "وروى أنس عن النبي ﷺ أنه قال: «إن بدلاء أمتي لم يدخلوا الجنة بصلاة ولا بصيام، ولكن دخلوها بسخاء الأنفس وسلامة الصدور والنصح للمسلمين»."]], "ic": "book"}, {"story": ["كتاب ذم البخل وذم حب المال (١٠ من ٢٤)، ص٧٩٢", ["وروى أبو سعيد عن النبي ﷺ أنه قال: «إن أحب عباد الله عز وجل إلى الله من حبب إليه المعروف وحبب إليه فعاله، وفعل المعروف يقي مصارع السوء، وإن الله عز وجل جعل للمعروف وجوها من خلقه، حبب إليهم المعروف، وحبب إليهم فعاله، ووجه طلاب المعروف إليهم، ويسر عليهم إعطاءه، كما يسر(١) الغيث إلى البلدة الجدبة، فيحييها ويحيي بها أهلها».", "وروى ابن عباس، عن النبي ﷺ أنه قال: «عليكم باصطناع المعروف، فإنه يمنع مصارع السوء».", "وروى عنه حذيفة أنه قال: «كل معروف صدقة».", "وروى عنه ابن عمر رضي الله عنهما أنه قال: «إن لله عز وجل قوما يختصهم بالنعم لمنافع العباد، ويقرها فيهم ما بذلوها، فإذا منعوها نزعها منهم فحولها إلى غيرهم».", "وقال ابن السماك: عجبت ممن يشتري المماليك بماله كيف لا يشتري الأحرار بمعروفه(٢)(٣).", "**حكايات عن الأسخياء**", "قد صح عن رسول الله ﷺ أنه كان أجود بالخير من الريح المرسلة(٤)، وأنه ما", "حاشية: (١) في (ظ): (يتيسر).", "حاشية: (٢) في (ظ): (به).", "حاشية: (٣) هنا نهاية نسخة الظاهرية المرموز لها بالحرف (ظ).", "حاشية: (٤) البخاري (٦)، ومسلم (٢٣٠٨).", "سئل شيئا قط فقال: لا(١). وأن رجلا سأله فأعطاه غنما بين جبلين، فأتى الرجل قومه فقال: أسلموا، فإن محمدا يعطي عطاء من لا يخشى الفاقة(٢).", "وقال موسى بن طلحة: كان لعثمان على طلحة(٣) خمسون ألف درهم، فخرج يوما عثمان إلى المسجد، فقال له طلحة: قد تهيأ مالك فاقبضه. فقال [عثمان]: هو لك يا أبا محمد معونة على مروءتك.", "وقال طلحة يوما: عندي مال قد غمني. فقسمه، وكان أربع مئة ألف(٤).", "وجاء أعرابي إلى طلحة فسأله، وتقرب إليه برحم، فقال: إن هذه لرحم ما سألني بها أحد قبلك. فأعطاه ثلاث مئة ألف(٥).", "وقال عروة(٦): رأيت عائشة تقسم سبعين ألفا، وهي ترقع درعها(٧). وروت أم ذرة(٨)، أنه بعث إلى عائشة بمال في غرارتين(٩)، ثمانين ومئة ألف درهم، فدعت بطبق، فجعلت تقسمه بين الناس، فلما أمست قالت لجاريتها: يا جارية، هلمي فطوري. فجاءتها بخبز وزيت، فقالت لها أم ذرة: ما استطعت فيما قسمت اليوم أن تشتري لنا بدرهم لحما نفطر عليه؟ فقالت: لو ذكرتني لفعلت.", "حاشية: (١) البخاري (٦٠٣٤)، ومسلم (٢٣١١).", "حاشية: (٢) أخرجه مسلم (٢٣١٢).", "حاشية: (٣) يعني طلحة بن عبيد الله القرشي أبا محمد التيمي، أحد العشرة المبشرين بالجنة. سير أعلام النبلاء ١/ ٢٣.", "حاشية: (٤) أخرجه الفسوي في المعرفة والتاريخ ١/ ٤٥٨، والطبراني في الكبير (٩٥) وأبو نعيم في الحلية ١/ ٨٨.", "حاشية: (٥) حلية الأولياء ١/ ٨٨، وسير أعلام النبلاء ١١/ ٣١.", "حاشية: (٦) هو عروة بن الزبير بن العوام الأسدي أبو عبد الله، من كبار التابعين، توفي سنة ٩٤هـ. السير ٤/ ٤٢١.", "حاشية: (٧) درع المرأة: قميصها.", "حاشية: (٨) هي أم ذرة المدنية، مولاة عائشة رضي الله عنها."]], "ic": "book"}, {"story": ["كتاب ذم البخل وذم حب المال (١١ من ٢٤)، ص٧٩٣", ["حاشية: (٩) الغرارة: وعاء يستعمل للتبن وغيره، والجمع غرائر.", "واشترى عبد الله بن عامر من خالد بن عقبة داره التي في السوق بتسعين ألف درهم، فلما كان الليل، سمع بكاء أهل خالد، فقال لأهله: ما لهؤلاء؟ قالوا: يبكون على دارهم(١). قال: يا غلام، ايتهم فأعلمهم أن المال والدار لهم جميعا.", "ورأى عبيد الله بن أبي بكرة على أبي الأسود الدؤلي جبة رثة، فقال: أما تمل هذه الجبة؟ فقال: رب مملول لا يستطاع فراقه. فبعث إليه مئة ثوب.", "وبعث رجل(٢) إلى عبيد الله: إنه قد وصف لي لبن البقر، فابعث إلي بقرة أشرب من لبنها. فبعث إليه سبع مئة بقرة ورعايتها، وقال: القرية التي كانت ترعى فيها لك.", "ودخل علي بن الحسين على محمد بن أسامة بن زيد في مرضه، فجعل يبكي، فقال: ما شأنك؟ قال: علي دين. قال: كم هو؟ قال: خمسة عشر ألف دينار. أو: بضعة عشر ألف دينار. قال: فهي علي(٣).", "وقال عبد الله بن سلمة: سأل رجل في مسجدنا، وللمسجد بابان، فقام رجل منا فقال: من خرج من هذا الباب فعليه خمس مئة درهم، ومن خرج من هذا الباب فعليه ثلاث مئة درهم. فازدحم الناس على باب الخمس مئة درهم.", "أنبأنا يحيى بن الحسن(٤) بن البناء، قال: أخبرنا أبو الحسين(٥) محمد بن أحمد [ابن] الآبنوسي، قال: أخبرنا الدارقطني، قال: أخبرنا أبو بكر ابن الأنباري قال: حدثنا أبي قال: حدثنا أبو عكرمة الضبي، قال: حدثنا سليمان بن أبي شيخ، قال: حدثنا الواقدي، قال: أضقت(٦) مرة، وأنا مع يحيى بن خالد البرمكي،", "حاشية: (١) تحرفت في الأصل إلى: (دراهم).", "حاشية: (٢) هو المهلب بن أبي صفرة كما في سير أعلام النبلاء ٤/ ١٣٨.", "حاشية: (٣) حلية الأولياء ٣/ ١٤١.", "حاشية: (٤) تحرف في الأصل إلى: (الحسين).", "حاشية: (٥) تحرف في الأصل إلى: (الحسن)", "حاشية: (٦) في الأصل: (ضقت). وأضاق الرجل: ذهب ماله وأصابته ضائقة."]], "ic": "book"}, {"story": ["كتاب ذم البخل وذم حب المال (١٢ من ٢٤)، ص٧٩٥", ["وحضر عيد، وجاءتني جارية، فقالت: قد حضر العيد، وليس عندنا من آلته شيء. فمضيت إلى صديق لي من التجار، فعرفته حاجتي إلى القرض، فأخرج كيسا مختوما، فيه ألف ومئتا درهم، فأخذته، وانصرفت إلى منزلي، فما استقررت فيه حتى جاءني صديق لي هاشمي، فشكا إلي تأخر غلته، وحاجته إلى القرض، فدخلت إلى زوجتي وأخبرتها، فقالت: على أي شيء عزمت؟ قلت: على أن أقاسمه الكيس. فقالت: ما صنعت شيئا، أتيت رجلا سوقة(١)، فأعطاك ألفا ومئتي درهم، وجاءك رجل، وله من رسول الله ﷺ رحم ماسة، تعطيه نصف ما أعطاك السوقة؟ ما هذا شيئا، أعطه الكيس كله. فأخرجت الكيس، فدفعته إليه، ومضى صديقي التاجر إلى الهاشمي، وكان له صديقا، فسأله القرض، فأخرج الهاشمي إليه الكيس، فلما رأى خاتمه عرفه، وانصرف إلي فخبرني بالأمر، وجاءني رسول يحيى ابن خالد، فركبت إليه، فأخبرته بخبر الكيس، فقال: يا غلام، هات تلك الدنانير، فجاءه بعشرة آلاف دينار، فقال: خذ ألفي دينار لك، وألفين لصديقك التاجر، وألفين للهاشمي، وأربعة آلاف لزوجتك، فإنها أكرمكم(٢).", "أخبرنا أبو منصور القزاز، قال: حدثنا أبو بكر بن ثابت، قال: أخبرنا الحسن ابن محمد النصيبي، قال: أخبرنا إسماعيل بن سعيد المعدل، قال: أخبرنا ابن دريد، قال: أخبرنا أبو معاذ المؤدب، قال: أخبرنا أبو عثمان المازني، قال: حدثني صاحب شرطة معن(٣)، قال: بينما أنا على رأس معن، إذا هو براكب يوضع(٤)، فقال لحاجبه: لا تحجبه. فجاء حتى مثل بين يديه، فقال:", "أصلحك الله قل ما بيدي  فما أطيق العيال إذ كثروا", "ألح دهر رمى بكلكله  فأرسلوني إليك وانتظروا", "حاشية: (١) السوقة: الرعية وعامة الناس.", "حاشية: (٢) تاريخ بغداد ١٩/٣ - ٢٠.", "حاشية: (٣) هو معن بن زائدة بن مطر، من الأسخياء المشهورين، كان واليا على اليمن ثم سجستان ثم البصرة، قتله الخوارج سنة ١٥٢هـ. السير ٧/ ٩٧.", "حاشية: (٤) أوضع الراكب الدابة: حملها على السير السريع.", "فقال معن - وأخذته أريحية(١): لا جرم - والله - لأعجلن أوبتك. ثم قال: يا غلام، ناقتي الفلانية، وألف دينار. فدفعها إليه وهو لا يعرفه.", "وبلغنا عن معن، أن شاعرا أقام ببابه مدة، فلم يتهيأ له لقاؤه، فقال لبعض خدمه: إذا دخل الأمير البستان فعرفني. فلما دخل أعلمه، فكتب الشاعر بيتا على خشبة، وألقاها في الماء الذي يدخل بستان معن، فلما بصر معن، بالخشبة أخذها، فإذا عليها مكتوب:", "أيا جود معن ناج معنا بحاجتي  فمالي إلى معن سواك شفيع"]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "قد بينا في كتاب ذم الدنيا أن الآدمي مفتقر إل ا، ودعا بالرجل، فطلب، فلم يوجد، فقال معن: حق علي أن أعطيه حتى لا يبقى في بيت مالي درهم ولا دينار.", "ومرض قيس بن سعد بن عبادة، فاستبطأ إخوانه، فقيل له: إنهم يستحيون مما لك عليهم من الدين. فقال: أخزى الله مالا يمنع الإخوان من الزيارة. ثم أمر مناديا فنادى: من كان عليه لقيس حق فهو منه في حل. قال: فكسرت درجته بالعشي لكثرة من عاده.", "وقام رجل إلى سعيد بن العاص فسأله: فأمر له بمئة ألف درهم فبكى، فقال سعيد: ما يبكيك؟ قال: أبكي على الأرض أن تأكل مثلك. فأمر له بمئة ألف أخرى.", "حاشية: (١) أخذته أريحية: أي خفة وهشة، وارتاح للندى والكرم.", "حاشية: (٢) بدر: جمع بدرة، وهي كيس فيه ألف أو عشرة آلاف درهم أو سبعة آلاف دينار.", "**بيان**", "**ذم البخل**", "قال الله عز وجل: ﴿وَلَا يَحْسَبَنَّ ٱلَّذِينَ يَبْخَلُونَ بِمَآ ءَاتَىٰهُمُ ٱللَّهُ مِن فَضْلِهِۦ هُوَ خَيْرًا لَّهُم بَلْ هُوَ شَرٌّ لَّهُمْ سَيُطَوَّقُونَ مَا بَخِلُوا۟ بِهِۦ يَوْمَ ٱلْقِيَـٰمَةِ﴾ [آل عمران: ١٨٠] وقال: ﴿ٱلَّذِينَ يَبْخَلُونَ وَيَأْمُرُونَ ٱلنَّاسَ بِٱلْبُخْلِ﴾ [النساء: ٣٧].", "وروى أبو سعيد، عن النبي ﷺ أنه قال: «خصلتان لا تجتمعان في مؤمن؛ البخل، وسوء الخلق»(١) و[قال ﷺ](٢): «إن أحدكم ليسألني المسألة، فأعطيها إياه، فيخرج متأبطها، وما هي إلا نار». فقال عمر: يا رسول الله فلم تعطيهم؟ قال: «إنهم يأبون إلا أن يسألوني، ويأبى الله لي البخل»(٣). وقال ﷺ: «لا يجتمع الشح والإيمان في قلب عبد أبدا»(٤).", "وفي أفراد مسلم من حديث جابر عن النبي ﷺ أنه قال: «اتقوا الشح، فإن الشح أهلك من كان قبلكم، حملهم على أن سفكوا دماءهم، واستحلوا محارمهم»(٥).", "حاشية: (١) حديث حسن، أخرجه الطيالسي (٢٢٠٨) وعبد بن حميد في المنتخب (٩٩٦)، والبخاري في الأدب المفرد (٢٨٢)، والترمذي (١٩٦٢)، وأبو يعلى (١٣٢٨)، والخرائطي في مساوئ الأخلاق (٩) و(٣٦٩)، وأبو نعيم في الحلية ٢/ ٢٥٨ و٣٨٨، والقضاعي في مسند الشهاب (٣١٩)، والبيهقي في الشعب (٨٠١٨) و(١٠٨٣٠)، والخطيب في البخلاء (٤٠)، والطبري في تهذيب الآثار (١٦٥) مسند عمر.", "حاشية: (٢) ما بين معقوفين ليس في الأصل، ولا بد منه، فهما حديثان لا حديث واحد.", "حاشية: (٣) أخرجه أحمد (١٢٧) و(٢٣٤)، ومسلم (١٠٥٦) (١٢٧) من حديث عمر رضي الله عنه، وأخرجه أحمد (١١٠٠٤) و(١١١٢٣) و(١١١٢٤)، والبزار (٩٢٤) في الكشف، وأبو يعلى (١٣٢٧) من حديث أبي سعيد الخدري رضي الله عنه."]], "ic": "book"}, {"story": ["كتاب ذم البخل وذم حب المال (١٤ من ٢٤)، ص٧٩٧", ["حاشية: (٤) أخرجه أحمد (٧٤٨٠) و(٨٤٧٩)، والطيالسي (٢٤٦١)، وسعيد بن منصور (٢٤٠١) و(٢٤٠٢)، وابن أبي شيبة ٥/ ٣٣٤، و٩/ ٩٧، وهناد في الزهد (٤٧٦)، والبخاري في الأدب المفرد (٢٨١) وفي التاريخ الكبير ٤/ ٣٠٧، من حديث أبي هريرة.", "حاشية: (٥) أخرجه مسلم (٢٥٧٨).", "وفي أفراد مسلم من حديث زيد بن أرقم، عن النبي ﷺ أنه كان يقول: «اللهم إني أعوذ بك من الجبن والبخل»(١).", "أنبأنا أحمد بن أحمد(٢) المتوكلي، قال: أخبرنا أحمد بن علي بن ثابت، قال: أخبرنا ابن بشران، قال: حدثنا ابن صفوان، قال: حدثنا أبو بكر القرشي، قال: حدثنا سلمة بن شبيب، قال: حدثنا مروان بن محمد، عن ابن لهيعة، عن عمرو بن شعيب عن أبيه عن جده قال: قال رسول الله ﷺ: «نجى أول هذه الأمة اليقين والزهد، ويهلك آخر هذه الأمة البخل والأمل»(٣).", "وروى جابر بن عبد الله عن النبي ﷺ أنه قال لبني سلمة: «يا بني سلمة، من سيدكم؟» قالوا: جد بن قيس، على أنا نبخله. قال: «وأي داء أدوأ من البخل؟! بل سيدكم الأبيض عمرو بن الجموح»(٤).", "وفي رواية أخرى: «بل سيدكم بشر بن البراء بن معرور»(٥) وهي أصح من ذكر عمرو بن الجموح، وغلط بعض الرواة فقال: البراء بن معرور(٦). والبراء مات قبل هجرة رسول الله ﷺ إلى المدينة.", "حاشية: (١) أخرجه مسلم (٢٧٢٢).", "حاشية: (٢) في الأصل: (محمد)، والتصويب من السير ١٩/ ٤٩٨.", "حاشية: (٣) أخرجه ابن أبي الدنيا في اليقين (٣)، والطبراني في الأوسط (٧٦٤٦)، والبيهقي في شعب الإيمان (١٠٨٤٤) و(١٠٨٤٥).", "حاشية: (٤) أخرجه الطبراني في الأوسط (٨٩٠٨)، وأبو الشيخ في الأمثال (٩١)، (٩٢)، (٩٣) والبخاري في الأدب المفرد (٢٩٦)، والبزار (٢٧٠٥) كشف الأستار، وأبو نعيم في الحلية ٧/ ٣١٧، والقضاعي في مسند الشهاب (٢٨٦) و(٢٨٧) والبيهقي في الشعب (١٠٨٥٧) و(١٠٨٥٩) و(١٠٨٦٠).", "حاشية: (٥) أخرجه الطبراني في الكبير ٢/ (١٢٠٣)، وابن عدي في الكامل ٤/ ٤٥٩، والحاكم ٣/ ٢١٩ و٤/ ١٦٣، وأبو نعيم في تاريخ أصبهان ٢/ ٢٥١، والبيهقي في الشعب (١٠٨٥٦).", "حاشية: (٦) أخرجه أبو الشيخ في الأمثال (٩٤) عن أبي هريرة. وأخرجه البيهقي في الشعب (١٠٨٥٨) عن عبد الرحمن بن كعب بن مالك مرسلا.", "قال أبو محمد الرامهرمزي(١): إنما يشبه البخل بالداء لأنه يفسد الخلق، ويدفع عن السؤدد، ويكسب سوء الثناء والمذمة، كما أن الداء يضعف الجسم، ويبطل الشهوة، ويغير اللون، ثم إن البخيل إذا أنفق ألم كما يألم صاحب الداء. وقد قال الحكماء: الكريم حر لأنه يملك ماله، والبخيل لا يستحق اسم الحرية، لأن ماله يملكه.", "وقد روينا عن النبي ﷺ أنه قال: «لا يدخل الجنة بخيل»(٢).", "وقال ﷺ: «ثلاث مهلكات: شح مطاع، وهوى متبع، وإعجاب المرء بنفسه»(٣)."]], "ic": "book"}, {"story": ["كتاب ذم البخل وذم حب المال (١٥ من ٢٤)، ص٧٩٩", ["قال الخطابي: الشح أبلغ في المنع من البخل، وإنما الشح بمنزلة الجنس، والبخل بمنزلة النوع، فالبخل في أفراد الأمور، والشح عام، وهو كالوصف اللازم للإنسان من قبل الطبع والجبلة.", "وقال بعضهم: البخل أن يضن بماله، والشح أن يبخل بماله ومعروفه.", "وروى أبو الدرداء، عن النبي ﷺ أنه قال: «ما طلعت شمس قط إلا بعث الله بجنبتيها(٤) ملكين يناديان، يسمعان الخلائق كلها غير الثقلين: اللهم عجل لمنفق خلفا، وأعط ممسكا تلفا»(٥).", "حاشية: (١) هو أبو محمد الحسن بن عبد الرحمن الفارسي، الحافظ المحدث، صنف كتاب (المحدث الفاصل بين الراوي والواعي) و(النوادر) و(أدب الناطق) وغيرها. توفي نحو سنة ٣٦٠هـ. بمدينة رامهرمز من بلاد فارس. السير ١٦/ ٧٣.", "حاشية: (٢) أخرجه أحمد (١٣) و(٣٢)، والترمذي (١٩٦٣) والمروزي في مسند أبي بكر (٩٨)، وأبو يعلى (٩٥)، والخرائطي في مساوئ الأخلاق (٣٥٥) و(٣٥٦) و(٧١٩) و(٧٢٠)، والبيهقي في الشعب (١٠٨٦٢) والخطيب في البخلاء (٥٠) و(٥١) من حديث أبي بكر رضي الله عنه.", "حاشية: (٣) أخرجه الخرائطي في مساوئ الأخلاق (٣٦٢)، والطبراني في الأوسط (٥٤٤٨) وأبو نعيم في الحلية ٢/ ٣٤٣، والقضاعي في مسند الشهاب (٣٢٥) - (٣٢٧) والبيهقي في الشعب (٧٤٥) وابن عبد البر في جامع بيان العلم ١/ ١٤٣، من حديث أنس بن مالك رضي الله عنه.", "حاشية: (٤) في الأصل: (بجنبتها) والمثبت من مصادر التخريج.", "حاشية: (٥) أخرجه أحمد (٢١٧٢١)، والطيالسي (٩٧٩)، وابن حبان (٦٨٦)، و(٣٣٢٩)، والحاكم ٢/ ٤٤٥، وأبو نعيم في الحلية ٢/ ٢٣٣ والقضاعي في مسند الشهاب (٨١٠)، والبيهقي في الشعب (٣٤١٢) و(١٠٣٧٣)، والبغوي في شرح السنة (٤٠٤٥).", "وروت عائشة عن النبي ﷺ أنه قال: «السخي الجهول أحب إلى الله عز وجل من العابد البخيل»(١).", "وفي حديث ابن عباس عن النبي ﷺ أنه قال: «إن الله عز وجل غرس جنة عدن بيده وزخرفها وقال: وعزتي وجلالي لا يجاورني فيك بخيل»(٢).", "وقال سلمان الفارسي: إذا مات السخي قالت الأرض والحفظة(٣): رب تجاوز عن عبدك بسخائه في الدنيا. وإذا مات البخيل قالت: اللهم احجب هذا العبد عن الجنة، كما حجب عبادك عما جعلت في يديه من الدنيا(٤).", "وقالت أم البنين أخت عمر بن عبد العزيز: أف للبخل، لوكان قميصا ما لبسته، أو طريقا ما سلكته(٥).", "وقال أبو حنيفة: لا أرى أن أعدل بخيلا؛ لأن البخل يحمله على الاستقصاء، فيأخذ فوق حقه خيفة أن يغبن.", "وقال ابن المعتز: أبخل الناس بماله أجودهم بعرضه.", "وقال بعض الحكماء: من كان بخيلا ورث ماله عدوه.", "ووصف أعرابي رجلا فقال: لقد صغر في عيني لعظم الدنيا في عينه، وذم أعرابي قوما فقال: يصومون عن المعروف ويفطرون على الفواحش.", "**حكايات عن البخلاء**"]], "ic": "book"}, {"story": ["كتاب ذم البخل وذم حب المال (١٦ من ٢٤)، ص٨٠٠", ["روى أبو صالح عن ابن عباس قال: كان الحباحب رجلا من العرب، وكان بخيلا، فكان لا يوقد نارا إلا بليل؛ كراهية أن يراها راء فينتفع بضوئها، فإذا احتاج إلى إيقادها أوقدها، فإذا بصر بمستضيء بها أطفأها.", "حاشية: (١) أخرجه ابن عدي في الكامل ٤/ ١١٩، والخطيب في البخلاء (٣٨).", "حاشية: (٢) أخرجه الطبراني في الكبير ١٢/ (١٢٧٢٣)، والأوسط (٥٥١٤).", "حاشية: (٣) الحفظة: الملائكة الموكلون بالعباد يحصون أعمالهم.", "حاشية: (٤) أخرجه الخطيب في البخلاء (٥٨) بإسناد ساقط.", "حاشية: (٥) أخرجه الخطيب في البخلاء (٩٢).", "أنبأنا أحمد بن محمد الهاشمي، قال: أخبرنا أحمد بن علي بن ثابت، قال: أخبرنا أبو الحسن محمد بن أحمد بن عبد الله التميمي في كتابه إلي، قال: أخبرنا أبو جعفر أحمد بن علي بن عبيد الله الخزاز، قال: حدثنا أبو بكر عبد الله بن بحر بن طيفور، قال: حدثنا عمر بن محمد بن عبد الحكم، قال: حدثنا ناجية بن عبد الله البصري، قال: كان عندنا بالبصرة رجل موسر، وكان بخيلا، فدعاه بعض جيرانه، فوضع بين يديه طباهجة(١) ببيض، فأكل فأكثر، وجعل يشرب الماء، فانتفخ بطنه، ونزل به الكرب والموت، فجعل يتلوى، فلما أجهده الأمر، وخاف الموت على نفسه، بعث إلى جار له متطبب(٢)، فدخل عليه، فقال: ما حالك؟ قال: أكلت طباهجة ببيض، وشربت ماء كثيرا، وقد نزل بي الموت. قال: فلا بأس عليك، قم فتقيأ ما أكلت، وقد شفيت. فقال: هاه! أتقيأ طباهجة ببيض؟! أموت، ولا أتقيأ طباهجة ببيض أبدا(٣).", "أنبأنا أحمد بن أحمد، قال: حدثنا أبو بكر الخطيب، قال: قرأت على الجوهري، عن أبي عبيد الله(٤) المرزباني، قال: أخبرني يوسف بن يحيى بن علي ابن المنجم، قال: حدثني ابن مهرويه، عن أبيه، قال: حدثنا علي بن محمد النوفلي، قال: سمعت أبي يقول: كان مروان بن أبي حفصة لا يأكل اللحم حتى يقرم(٥) إليه، فإذا قرم أرسل غلامه، فاشترى له رأسا، فأكله، فقيل له: نراك لا تأكل إلا الرءوس في الصيف والشتاء، فلم تختار ذلك؟ فقال: نعم، الرأس أعرف سعره، فأمن خيانة الغلام، ولا يستطيع أن يغبنني فيه، وليس بلحم فيطبخه، فيقدر أن يأكل منه، إن مس عينا أو أذنا أو خدا وقفت على ذلك، وآكل منه ألوانا، آكل", "حاشية: (١) الطباهجة: اللحم المشرح.", "حاشية: (٢) أي يتعاطى علم الطب.", "حاشية: (٣) البخلاء للخطيب البغدادي (٩٣).", "حاشية: (٤) في الأصل: (عبد الله) والتصويب من السير ١٦/ ٤٤٧.", "حاشية: (٥) يقرم: أي تشتد شهوته لأكل اللحم.", "منه عينيه لونا، وأذنيه لونا، وغلصمته(١) لونا، ودماغه لونا، وأكفى مؤنة طبخه، فقد اجتمعت لي فيه مرافق(٢)."]], "ic": "book"}, {"story": ["كتاب ذم البخل وذم حب المال (١٧ من ٢٤)، ص٨٠٢", ["قال المرزباني: وأخبرني أحمد بن عيسى الكرجي، قال: حدثنا أبو العيناء محمد بن القاسم، قال: كان مروان بن أبي حفصة من أبخل الناس، خرج يريد المهدي، فقالت له امرأة من أهله: مالي عليك إن رجعت بالجائزة؟ قال: إن أعطيت مئة ألف درهم أعطيتك ألف درهم. فأعطي ستين ألف درهم، فأعطاها أربعة دوانيق(٣).", "أنبأنا أحمد قال: حدثنا أبو بكر، قال: أخبرنا الحسن بن علي العطار، قال: أخبرنا أبو الحسن محمد بن جعفر التميمي، قال: حدثنا أبو القاسم السكوني، قال: حدثني الحسين بن محمد، قال: حدثني يوسف بن تميم، قال: حدثنا بعض شباب أهل البصرة، أن رجلا موسرا كثير المال كان ينظر في دقائق الأشياء، فاشترى حوائج له، ودعي حمالا، فقال: بكم تحمل هذه الحوائج؟ قال: بحبة(٤). قال: أحسن(٥). قال: أقل من حبة؟ لا أدري ما أقول. قال: نشتري بالحبة جزرا، فنجلس جميعا فنأكله(٦).", "أنبأنا محمد بن أبي طاهر، قال: حدثنا القاضي أبو القاسم التنوخي، قال: أخبرني أبي، أن أبا عبد الله محمد بن أحمد العسكري حدثه، قال: كنت أكتب لأبي أحمد ابن فادويه الأهوازي - وكان من أبخل من رأيت - على شيء من المأكولات، وكان يحبسني عنده للأكل، فأجلس معه على الطعام، ولا آكل كثير شيء، فاحتبسني يوما وعنده جماعة، فأكلوا، وجريت على عادتي في التقفير، وكان", "حاشية: (١) الغلصمة: اللحم بين الرأس والعنق.", "حاشية: (٢) البخلاء للخطيب (١١٧).", "حاشية: (٣) الدوانيق: جمع دانق، وهو سدس الدرهم. والقصة في البخلاء للخطيب (١١٩).", "حاشية: (٤) الحبة: سدس ثمن الدرهم، أي جزء من ثمانية وأربعين جزءا من الدرهم.", "حاشية: (٥) أي: يريد عرضا أحسن من هذا.", "حاشية: (٦) البخلاء للخطيب (١٣٣).", "قد قدم في بعض الطعام أرزا، وجديا مشويا، ولونين من أطرافه، وسقطية، فلما فرغنا من ذلك أقبل غلامه، وعلى يده طيفورية فيها الجدي، فأقبل هو علينا، فقال: أما أنا فقد شبعت، ولم يبق في فضل، فما تقولون أنتم؟ فقلت أنا: أما أنا فقد شبعت. فقالت الجماعة كقولي. فقال: فيجعل الجدي لغد، ونأكله مبردا. فقلت: هذا هو الصواب. فقال: ما أظنكم إلا وفيكم فضلة للأكل، وإنما قلتم أنكم قد شبعتم مساعدة لي. فقلت: لا والله يا سيدي، ما في فضل. فقال للذي يليني: ما تقول؟ فقال: ما في فضل. فقال: لو كنت شبعان لحلفت كما حلف أبو عبد الله. فحلف الرجل أنه شبعان، (١-١)فقال للآخر الذي بجانبه، فحلف، فلم يزل يستقري واحدا واحدا، ويحلف أنه شبعان(١-١)، ومن لم يحلف قال له: لو كنت شبعان لحلفت. فيحلف الرجل، فلما استوثق من جماعتنا بالأيمان، وثلج صدره(٢) أنه لا حيلة لأحد منا في الأكل، قال: أما أنا فقد تتبعت نفسي أكل شحم كلاه حارا. فقلنا له: كل، هنأك الله. فقال: يا غلام، ضع الطيفورية فتركت بين يديه، فأكل أكثر الجدي وحده، وأمر برفع باقيه وحفظه(٣)."]], "ic": "book"}, {"story": ["كتاب ذم البخل وذم حب المال (١٨ من ٢٤)، ص٨٠٣", ["حاشية: (١-١) ليس في الأصل، واستدرك من كتاب البخلاء للخطيب البغدادي.", "حاشية: (٢) في الأصل: (ثلج في صدره)، والمثبت من البخلاء، وثلج صدره: أي اطمأن.", "حاشية: (٣) البخلاء للخطيب (٢٢٧).", "**بيان**", "**الإيثار وفضله**", "اعلم أن السخاء والبخل درجات، فأرفع درجات السخاء هو الإيثار، وهو أن تجود بالمال مع الحاجة إليه، وإنما السخاء بذل ما لا يحتاج إليه لمحتاج أو غير محتاج، والبذل مع الحاجة أشد، وكما أن السخاء قد ينتهي إلى أن يسخو الإنسان على غيره مع الاحتياج، فالبخل قد ينتهي إلى أن يبخل على نفسه مع الحاجة، فكم من بخيل يمسك المال، ويمرض فلا يتداوى، ويشتهي الشهوة فلا يمنعه منها إلا البخل بالثمن، فكم بين من بخل على نفسه مع الحاجة وبين من يؤثر على نفسه، فالأخلاق عطايا يضعها الله تعالى حيث يشاء، وليس بعد الإيثار درجة في السخاء، وقد أثنى الله عز وجل على أصحاب رسول الله ﷺ بالإيثار فقال: ﴿وَيُؤْثِرُونَ عَلَىٰٓ أَنفُسِهِمْ وَلَوْ كَانَ بِهِمْ خَصَاصَةٌ﴾ [الحشر: ٩].", "أخبرنا عبد الأول بن عيسى، قال: حدثنا الداودي، قال: أخبرنا ابن أعين، قال: حدثنا الفربري قال: حدثنا البخاري، قال: حدثنا مسدد، قال: حدثنا عبد الله ابن داود، عن فضيل بن غزوان، عن أبي حازم، عن أبي هريرة رضي الله عنه، أن رجلا أتى النبي ﷺ، فبعث إلى نسائه، فقلن: ما عندنا(١) إلا الماء، فقال رسول الله ﷺ: «من يضم - أو يضيف - هذا؟» فقال رجل من الأنصار: أنا. فانطلق به إلى امرأته، فقال: أكرمي ضيف رسول الله ﷺ. فقالت: ما عندنا إلا قوت الصبيان(٢). فقال: هيئي طعامك، وأصبحي سراجك، ونومي صبيانك إذا أرادوا عشاء. فهيأت طعامها، وأصبحت(٣) سراجها، ونومت صبيانها، ثم قامت كأنها", "حاشية: (١) هكذا في الأصل، وفي البخاري: (ما معنا).", "حاشية: (٢) في البخاري: (صبياني).", "حاشية: (٣) في الأصل: (أصلحت) والمثبت من البخاري، وأصبحت: أوقدت وأشعلت.", "تصلح سراجها، فأطفأته، فجعلا يريانه أنهما يأكلان، فباتا طاويين. فلما أصبح غدا إلى رسول الله ﷺ، فقال: «ضحك الله الليلة - أو: عجب - من فعالكما». فأنزل الله تعالى: ﴿وَيُؤْثِرُونَ عَلَىٰٓ أَنفُسِهِمْ وَلَوْ كَانَ بِهِمْ خَصَاصَةٌ وَمَن يُوقَ شُحَّ نَفْسِهِۦ فَأُو۟لَـٰٓئِكَ هُمُ ٱلْمُفْلِحُونَ﴾ [الحشر: ٩]. أخرجاه في الصحيحين(١)."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "وفي حديث ابن عباس عن النبي ﷺ أنه قال: «إن الله عز وجل غرس جنة عدن بيده وزخرفها وقال: ____ وجلالي لا يجاورني فيك", "o": ["وعزتي", "المغتاب", "المخطوط", "ثالثهما"], "h": "راجع: ص٨٠٠"}, {"t": "fill", "d": 2, "q": "منه عينيه لونا، وأذنيه لونا، وغلصمته لونا، ودماغه لونا، وأكفى مؤنة طبخه، فقد اجتمعت لي فيه ____", "o": ["مرافق", "وبقي", "جامعه", "تفصيل"], "h": "راجع: ص٨٠٢"}, {"t": "fill", "d": 2, "q": "الخامس: أن يفهم ما في جمع المال من الخطر، كما ذكرناه في آفات المال وما فيه من خوف السرقة والنهب والضياع، وما في خلو اليد من ____", "o": ["الأمن", "مدته", "مديدة", "واستدل"], "h": "راجع: ص٧٨٩"}, {"t": "fill", "d": 2, "q": "والاقتصاد في المعيشة هو الأصل في القناعة، ونعني به ____ في الإنفاق وترك الخرق فيه، قال ﷺ", "o": ["الرفق", "نقضت", "لتقرأن", "يوشك"], "h": "راجع: ص٧٨٧"}, {"t": "fill", "d": 2, "q": "وأما الاستخدام: فإن الأعمال التي يحتاج إليها الإنسان لتهيئة أسبابه كثيرة، ولو تولاها بنفسه ضاعت أوقاته وتعذر ____ سلوك سبيل الآخرة بالفكر والذكر الذي هو أعلى مقامات السالكين، ومن لا مال له فإنه", "o": ["عليه", "يستطع", "بشرى", "اقترض"], "h": "راجع: ص٧٨١"}, {"t": "fill", "d": 2, "q": "وهذا المذكور كله لا يحيط بحقيقة البخل والجود، ____ نقول", "o": ["لكنا", "وتدفع", "فيترك", "شرعا"], "h": "راجع: ص٨٠٧"}]}, {"t": "كتاب ذم البخل وذم حب المال - القسم ٤ من ٤", "b": [{"story": ["كتاب ذم البخل وذم حب المال (١٩ من ٢٤)، ص٨٠٥", ["أخبرنا عبد الأول ومحمد بن ناصر، قالا: أخبرنا أبو الحسين بن عبد الجبار، قال: أخبرنا أبو محمد الجوهري، قال: أخبرنا أبو عمر بن حيوية، قال: حدثنا أبو بكر ابن الأنباري، قال: حدثني أحمد بن عبيد، عن ابن الأعرابي، قال: استشهد باليرموك عكرمة بن أبي جهل، وسهيل بن عمرو، والحارث بن هشام رضي الله عنهم، وجماعة من بني المغيرة، فأتوا بماء وهم صرعى، فتدافعوه حتى ماتوا، ولم يذوقوه، أتي عكرمة بالماء، فنظر إلى سهيل بن عمرو ينظر إليه، فقال: ابدؤوا بهذا. فنظر سهيل إلى الحارث بن هشام ينظر إليه، فقال: ابدؤوا بهذا، فماتوا كلهم قبل أن يشربوا، فمر بهم خالد بن الوليد، فقال: بنفسي أنتم.", "وأهدي إلى رجل من الصحابة رأس شاة، فقال: إن أخي أحوج إليه مني. فبعث به إليه، فبعث به ذلك إلى آخر، حتى تداولته سبعة أبيات، فرجع إلى الأول.", "وخرج عبد الله بن جعفر إلى ضيعة له، فنزل على نخل لقوم، وفيها غلام أسود يعمل فيها، إذ أتى الغلام بقوته، ودخل الحائط كلب، فدنا من الغلام، فرمى إليه الغلام قرصا فأكله، ثم رمى إليه الثاني والثالث فأكله، وعبد الله ينظر، فقال: يا غلام، كم قوتك كل يوم؟ قال(٢): ما رأيت. قال: فلم آثرت به هذا الكلب؟ قال: ما هي بأرض كلاب، إنه جاء من مسافة بعيدة جائعا، فكرهت رده. فقال: وما أنت صانع؟ قال: أطوي(٣) يومي هذا. فقال عبد الله بن جعفر: ألام على السخاء؟! وهذا أسخى مني. فاشترى الغلام والحائط وما فيه من الآلات، وأعتق الغلام، ووهبه له.", "حاشية: (١) أخرجه البخاري (٣٧٩٨)، ومسلم (٢٠٥٤).", "حاشية: (٢) سقطت من الأصل.", "حاشية: (٣) أطوي: أي أظل خالي البطن جائعا بلا طعام.", "واجتمع جماعة من الفقراء في موضع لهم، وبين أيديهم أرغفة معدودة لا تكفيهم، فكسروا الرغفان، وأطفؤوا السراج، وجلسوا للأكل، فلما رفع الطعام إذا هو بحاله، ولم يأكل أحد منهم شيئا إيثارا لأصحابه.", "**بيان**", "**حد السخاء والبخل وحقيقتهما**", "قد ذهب قوم إلى أن حد البخل منع الواجب، وأن من أدى ما يجب عليه فليس ببخيل. وهذا غير كاف، فإن من يسلم إلى عياله القدر الذي يفرضه الحاكم، ثم يضايقهم في زيادة اللقمة والتمرة، فإنه معدود من البخلاء.", "وقال قوم: البخيل الذي يستصعب العطاء. وهذا أيضا قاصر، فإنه إن أريد أنه يستصعب كل عطية، فكم من بخيل لا يستصعب العطية القليلة كالحبة، ويستصعب ما فوقها. ومتى أريد بهذا أنه يستصعب بعض العطايا، فما من جواد إلا وقد يستصعب بذل المال العظيم، وهذا لا يوجب الحكم بالبخل.", "وكذلك تكلموا في الجود، فقال قوم: هو عطاء بلا من. وقيل: عطاء من غير مسألة. وقيل: هو الفرح بالعطاء، والسرور بالسائل. وقيل: من أعطى بعض ماله فهو سخي، ومن أعطى الأكثر فهو جواد، ومن آثر بالبلغة(١) فهو مؤثر، ومن لم يبذل شيئا فهو بخيل."]], "ic": "book"}, {"story": ["كتاب ذم البخل وذم حب المال (٢٠ من ٢٤)، ص٨٠٧", ["وهذا المذكور كله لا يحيط بحقيقة البخل والجود، لكنا نقول: المال إنما خلق لحكمة ومقصود، وهو صلاحه لحاجات الخلق، ويمكن إمساكه عن الصرف إلى ما خلق الصرف إليه، ويمكن بذله بالصرف إلى ما لا يحسن الصرف إليه، ويمكن التصرف فيه بالعدل، وهو أن يحفظ حيث يجب الحفظ، ويبذل حيث يجب البذل.", "والجود وسط بين الإسراف والإقتار، وبين البسط والقبض، والبراءة من البخل تحصل بفعل الواجب في الشرع، واللازم بطريق المروءة؛ فهو ترك المضايقة والاستقصاء في المحقرات، فإن ذلك يستقبح، واستقباحه يختلف باختلاف", "حاشية: (١) البلغة: ما يتبلغ به من العيش، أي ما يكفي للعيش دون زيادة.", "الأحوال والأشخاص، فقد يستقبح من الغني من المضايقة مالا يستقبح من الفقير، ويستقبح من الرجل من المضايقة لأهله وأقاربه وجيرانه ما لا يستقبح مع الأجانب.", "فالبخيل هو الذي يمنع ما لا ينبغي أن يمنع، إما بحكم الشرع أو بحكم المروءة، وذلك لا يمكن التنصيص على مقداره، فمن قام بواجب الشرع ولازم المروءة فقد تبرأ من البخل، لكنه لا يتصف بصفة الجود والسخاء ما لم يبذل زيادة على ذلك، فإذا بذل ما لم يوجبه الشرع، ولا تتوجه الملامة في العادة على منعه فهو جواد، إلا أن للجود درجات، وبعض الناس أجود من بعض، واصطناع المعروف وراء ما توجبه العادة، والمروءة جود، ولكن بشرط أن تكون على طيب نفس، ولا تكون على طمع في مكافأة أو شكر، فإن الطامع في الشكر والثناء بياع لا جواد؛ لأنه يشتري المدح بماله. وإنما الجود بذل بلا عوض، ولا يتصور ذلك إلا من الله سبحانه. وأما الآدمي فاسم الجود عليه مجاز؛ لأنه لا يبذل الشيء إلا لغرض، ولكن إذا لم يكن غرضه إلا ثواب الآخرة، واكتساب فضيلة الجود، أو تطهير النفس عن مرذول البخل، سمي جوادا، ومتى كان الباعث على الجود الخوف من لوم الناس، أو هجائهم، أو توقع نفع من المنعم عليه، لم يكن جوادا؛ لأنه متعوض(١).", "حاشية: (١) أي: يطلب عوضا مقابل ما يقدمه.", "**بيان**", "**علاج البخل**", "اعلم أن سبب البخل حب المال، ولحب المال سببان: أحدهما: حب الشهوات التي لا وصول إليها إلا بالمال، مع طول الأمل، فإن الإنسان لو علم أنه يموت بعد يوم لم يبخل بماله؛ لأن قدر ما يحتاج إليه في يوم قريب، وإن كان قصير الأمل ولكن له أولادا فإن الولد يقوم مقام طول الأمل؛ لأنه يقدر بقاءهم كبقاء نفسه، فيمسك لأجلهم، ولذلك قال ﷺ: «الولد مبخلة مجبنة مجهلة»(١)، فإذا انضاف إلى ذلك خوف الفقر، وقلة الثقة بمجيء الرزق، قوي البخل لا محالة."]], "ic": "book"}, {"story": ["كتاب ذم البخل وذم حب المال (٢١ من ٢٤)، ص٨٠٩", ["السبب الثاني: أن يحب عين المال، فمن الناس من معه ما يكفيه لبقية عمره، إذا اقتصر على ما جرت عادته بنفقته، وتفضل آلاف، وهو شيخ ولا ولد له، ثم لا تسمح نفسه بإخراج الزكاة، ولا بالتداوي عند المرض، بل هو عاشق لعين المال، يلتذ بوجوده في يده، وبقدرته عليه، فيكنزه تحت الأرض، ويعلم أنه يضيع إذا مات، أو يأخذه أعداؤه، ثم لا تسمح نفسه مع هذا بأن يأكل أو يتصدق منه، وهذا مرض مزمن عسير، لا يرجى علاجه. ومثال صاحبه مثال رجل عشق شخصا، فأحب رسوله، ثم نسي محبوبه، واشتغل بالرسول، فإن الدنانير رسول مبلغ إلى الحاجات، فصارت محبوبة لذلك، لأن الموصل إلى اللذيذ لذيذ، ثم قد ينسى الحاجات ويحب الدنانير لذاتها، وهو غاية الضلال.", "حاشية: (١) أخرجه أحمد (١٧٥٦٢)، وابن أبي شيبة ١٢/ ٩٧، وابن ماجه (٣٦٦٦) والطبراني في الكبير ٣/ (٢٥٨٧) و٢٢/ (٧٠٣)، والحاكم في المستدرك ٣/ ١٦٤، والقضاعي في مسند الشهاب (٢٥) و(٢٦)، والبيهقي في السنن ١٠/ ٢٠٢، وفي الأسماء والصفات ٢/ ٢٠٧، عن يعلى بن مرة العامري.", "واعلم أن علاج كل علة بمضادة سببها، فيعالج حب الشهوات بالقناعة والصبر، وطول الأمل بكثرة ذكر الموت، والتفكر في ذهاب القرناء، وضياع المال بعد جامعه، ويعالج التفات القلب إلى الولد بأن الذي خلقه خلق معه رزقه، وكم من ولد لم يرث من أبيه مالا هو أحسن ممن ورث حالا، فليحذر أن يترك لولده الخير، ويقدم هو على الله بشر، فإن ولده إن كان صالحا فالله يتولاه، وإن كان فاسقا فإنه يستعين به على المعاصي، وليردد على سمعه ما ذكرنا في ذم البخل، ومدح السخاء، وليتأمل أحوال البخلاء، ونفرة الطبع عنهم، واستقباح حالهم، حتى أن البخيل يستقبح البخل من غيره، وليتفكر في مقاصد المال، ولينظر لماذا خلق.", "ولا تزول صفة البخل إلا بالبذل تكلفا، كما لا يزول العشق إلا بمفارقة المعشوق، فإذا صبر سلا.", "فإذن علاج البخل بعلم وعمل، فالعلم يرجع إلى معرفة آفة البخل، وفائدة الجود، والعمل يرجع إلى البذل على سبيل التكلف، إلا أنه قد يقوى البخل بحيث يعمى ويصم، فيمنع تحقق المعرفة بآفته، فلا تتحرك الرغبة، ولا يتيسر العمل، فتبقى العلة مزمنة، كالمرض الذي يمنع معرفة الدواء وإمكان استعماله، فإنه لا حيلة فيه إلا الصبر إلى الموت.", "واعلم أنه إذا كثرت المحبوبات في الدنيا كثرت المصائب بفقدها، فمن عرف آفة المال لم يأنس به، ولم يأخذ منه إلا قدر حاجته، ومن أمسك مالا لحاجته فليس ببخيل.", "**بيان**", "**مجموع الوظائف التي على العبد في ماله**", "قد ذكرنا فيما تقدم أن مثل المال كمثل حية فيها ترياق وسم، فالراقي يستخرج درياقها(١)، والجاهل إذا تناولها قتله سمها. ولا يسلم من سم المال إلا بالمحافظة على خمس وظائف:"]], "ic": "book"}, {"story": ["كتاب ذم البخل وذم حب المال (٢٢ من ٢٤)، ص٨١١", ["**الأولى**: أن يعرف مقصود المال، ولماذا خلق ولم احتيج إليه؟ فلا يحفظ إلا مقدار الحاجة، ولا يعطيه من همته فوق ما يستحقه.", "**الثانية**: أن يراعي جهة دخل المال فيجتنب الحرام المحض، وما الغالب عليه الحرام، كأموال الظلمة، ويجتنب الجهات المكروهة القادحة في المروءة، كالهدايا التي فيها شوائب الرشوة، والسؤال الذي فيه الذل وهتك المروءة.", "**الثالثة**: في المقدار الذي يكتسبه، فلا يستكثر منه ولا يستقل، بل بمقدار الحاجة، والحاجة مسكن ومطعم وملبس، ولكل واحد ثلاث درجات: أدنى، وأوسط، وأعلا.", "ومتى مال إلى القناعة قارب النجاة، ومتى جاوز ذلك وقع في هاوية لا نهاية لعمقها، وقد ذكرنا تفصيل هذه الدرجات في كتاب الزهد.", "**الرابعة**: أن يراعي جهة الخرج، ويقتصد في الإنفاق، غير مبذر ولا مقتر، فيضع ما اكتسبه من حله في حقه، فإن الإثم في الأخذ من غير حقه، والوضع في غير حقه سواء.", "**الخامسة**: أن يصلح نيته في الأخذ والترك والإنفاق والإمساك، فيأخذ ما يأخذ", "حاشية: (١) الدرياق: هو الترياق، وهو دواء نافع من لدغ الهوام السبعية.", "ليستعين به على العبادة، ويترك ما يترك زهدا فيه واحتقارا له، وإذا فعل ذلك لم يضره وجود المال.", "فاجتهد أن تكون حركاتك وسكناتك لله تعالى مقصورة على عبادة، أو ما يعين على العبادة، فإن أبعد الحركات عن العبادة الأكل وقضاء الحاجة، وهما معينان على الحاجة، فإذا قصدت بهما الاستعانة على العبادة صارتا عبادة في حقك، فمن حسن قصده في جمع المال لم يضره، وهذه كانت حالة الصحابة في كثرة أموالهم، فإذا أراد الجاهل أن يتشبه بهم في جمع المال، كان كالصبي إذا تشبه بالراقي في تناول الحية.", "**بيان**", "**خطر الغنى وسلامة الفقر**", "اعلم أن أقواما فضلوا الغنى، وأقواما فضلوا الفقر، ونحن نصدع بالتحقيق من غير تطويل بذكر ما قالوا؛ إذ هو قليل الجدوى، فإن قوما احتجوا لتفضيل الفقر بأحاديث لا يثبت أكثرها، والثبات منها له وجوه، وذكروا غوائل الغنى وآفاته، فخوفوا منه، ولا ينكر أن فيه مخاطرة.", "والصواب أن يقال: طريق الفقر في الغالب طريق السلامة، ومثل صاحبه كمثل مريض قد حبس بمرضه عن أغراضه، فهو يثاب على مرضه، ويجزى على حسن صبره.", "وأما الغنى فيقيد بسلامة الغني في كسبه وجمعه وفضله ومنعه، فخطره عظيم، فإذا سلم كسبه، وحسن قصده في جمعه، وإخراجه في وجهه، فذلك أفضل من الفقر؛ لأن نفع ذلك يتعدى، فيكون الفقير كالمتعبد المنقطع إلى زواياه، والغني المنفق في الخير كالمفتي والمجاهد."]], "ic": "book"}, {"story": ["كتاب ذم البخل وذم حب المال (٢٣ من ٢٤)، ص٨١٣", ["وفي حديث أبي هريرة رضي الله عنه، أن فقراء المهاجرين أتوا رسول الله ﷺ فقالوا: ذهب أهل الدثور بالدرجات العلى والنعيم المقيم. فقال: «ما ذاك؟» قالوا: «(١-١)يصلون كما نصلي، ويصومون كما نصوم، ويتصدقون ولا نتصدق(١-١)، ويعتقون ولا نعتق». فقال رسول الله ﷺ: «أفلا أعلمكم شيئا تدركون به من سبقكم، وتسبقون به من بعدكم، ولا يكون أحد أفضل منكم إلا من صنع مثل ما صنعتم؟» قالوا: بلى يا رسول الله. قال: «تسبحون وتكبرون وتحمدون، دبر كل صلاة ثلاثا وثلاثين». قال أبو صالح(٢): فرجع فقراء المهاجرين إلى رسول الله ﷺ، فقالوا:", "حاشية: (١-١) ليس في الأصل.", "حاشية: (٢) هو أبو صالح السمان، ذكوان بن عبد الله الزيات المدني، روى عن جمع من الصحابة، وهو من أوثق الناس وأثبتهم في أبي هريرة، توفي سنة ١٠١هـ. السير ٥/ ٣٦.", "سمع إخواننا أهل الأموال بما فعلنا، ففعلوا مثله. فقال رسول الله ﷺ: «ذلك فضل الله يؤتيه من يشاء»(١).", "وقد كسبت الصحابة وجمعت وخلفت الأموال، وقد سبق بيان وجوه المدح للمال والذم له، وأن ذلك يتعلق بفعل العبد في المال لا بعين المال؛ لأن المال آلة. ولسبب إخراج المال قال ﷺ: «ما نفعني مال كمال أبي بكر»(٢).", "أخبرنا محمد بن أبي منصور، قال: حدثنا جعفر بن أحمد، قال: حدثنا الحسن ابن علي التميمي، قال: حدثنا أبو بكر بن جعفر، قال: حدثنا عبد الله بن أحمد، قال: حدثني أبي، قال: حدثنا أبو المغيرة، قال: حدثنا صفوان، عن يزيد بن ميسرة، قال: كان رجل ممن مضى جمع مالا وولدا فأوعى، ثم أقبل على نفسه وهو في أهله قد جمع، فقال: انعمي لسنين. فأتاه ملك الموت، فقرع الباب، فخرجوا إليه وهو متمثل بمسكين، فقال لهم: ادعوا لي صاحب الدار. فقالوا: يخرج سيدنا إلى مثلك؟! ثم مكث قليلا، ثم عاد فقرع باب الدار، وصنع مثل ذلك، وقال: أخبروه أني ملك الموت. فلما سمع سيدهم قعد فزعا، وقال: ألينوا له بالكلام. قالوا: ما تريد غير سيدنا بارك الله فيك؟ قال: لا. فدخل عليه، فقال له: قم فأوص بما كنت موصيا، فإني قابض نفسك قبل أن أخرج. قال: فصاح أهله وبكوا، ثم قال: افتحوا الصناديق والتوابيت، وافتحوا أوعية المال. ففتحوها جميعا، فأقبل على المال يلعنه ويسبه، ويقول: لعنت من مال، أنت الذي أنسيتني ربي تبارك وتعالى، وأغفلتني عن العمل لآخرتي، حتى بلغني أجلي. فتكلم المال، فقال: لا تسبني، ألم تكن وضيعا في أعين الناس فرفعتك؟ ألم تر عليك من أثري، وكنت تحضر سدد(٣) الملوك والسادة، فتنكح، ويخطب عباد الله الصالحون فلا ينكحون؟", "حاشية: (١) أخرجه البخاري (٨٤٣)، ومسلم (٥٩٥)."]], "ic": "book"}, {"story": ["كتاب ذم البخل وذم حب المال (٢٤ من ٢٤)، ص٨١٤", ["حاشية: (٢) أخرجه أحمد (٧٤٤٦) و(٨٧٩٠)، وابن أبي شيبة ٦/١٢ - ٧٠، والترمذي (٣٦٦١)، والنسائي في الكبرى (٨٠٥٦)، وابن ماجه (٩٤)، وابن أبي عاصم في السنة (١٢٢٩)، والطحاوي في شرح معاني الآثار ٤/ ١٥٨، وفي شرح مشكل الآثار (١٥٩٩)، وابن حبان (٦٨٥٨) من حديث أبي هريرة.", "حاشية: (٣) السدد: جمع سدة، وهي باب الدار، والفناء والساحة تكون بين يدي باب الدار.", "ألم تكن تنفقني في سبيل الجبت(١) فلا أتعاصى؟ ولو أنفقتني في سبيل الله لم أتعاص عليك، فأنت ألوم مني، إنما خلقت أنا وأنتم يا بني آدم من تراب، فمنطلق ببر، ومنطلق بإثم. فهكذا يقول المال فاحذروا.", "حاشية: (١) الجبت: الصنم والكاهن والسحر والساحر، وكل ما عبد من دون الله تعالى."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "أنبأنا أحمد بن أحمد، قال: حدثنا أبو بكر الخطيب، قال: قرأت على الجوهري، عن أبي عبيد الله المرزباني، قال: أخبرني يوسف بن ____ بن علي ابن المنجم، قال: حدثني ابن مهرويه، عن أبيه، قال: حدثنا علي بن", "o": ["يحيى", "صحيحة", "حسناتي", "اعتقاد"], "h": "راجع: ص٨٠١"}, {"t": "fill", "d": 2, "q": "واعلم أن المال بعض جزاء الدنيا، والكلام فيما يتعلق بالدنيا يعم المال إلا أنا أفردنا ذكر غوائل المال وآفاته في هذا الكتاب، إذ للإنسان من فقده صفة ____، ومن وجوده صفة الغنى، وهما حالتان يحصل بهما الاختبار والامتحان، ثم للفاقد حالتان", "o": ["الفقر", "ماثلا", "مخلفا", "أكثر"], "h": "راجع: ص٧٧٥"}, {"t": "fill", "d": 2, "q": "وروى أبو الدرداء، عن النبي ﷺ أنه قال: «ما طلعت شمس قط إلا بعث الله بجنبتيها ملكين يناديان، يسمعان الخلائق ____ غير الثقلين: اللهم عجل لمنفق خلفا، وأعط ممسكا", "o": ["كلها", "أفلح", "أخرجها", "فرجاؤه"], "h": "راجع: ص٧٩٩"}, {"t": "fill", "d": 2, "q": "وكان أبو ذر جالسا مع ____، فأتته امرأته فقالت", "o": ["الناس", "مزدجر", "تقرر", "أظنكم"], "h": "راجع: ص٧٨٤"}, {"t": "fill", "d": 2, "q": "وقد روينا أن سليمان بن داود عليه ____ قال", "o": ["السلام", "العرق", "يعجب", "المشية"], "h": "راجع: ص٧٨٤"}, {"t": "fill", "d": 2, "q": "وروى أنس عن النبي ﷺ أنه قال: «إن بدلاء أمتي لم يدخلوا الجنة بصلاة ولا بصيام، ولكن دخلوها بسخاء الأنفس وسلامة ____ والنصح", "o": ["الصدور", "يقوي", "أجود", "النصيبي"], "h": "راجع: ص٧٩٢"}]}], "sum": [["الصفحات", "ص٧٧٥ - ص٨١٦"]], "_nq": 24}, {"id": "l10", "title": "كتاب ذم الجاه والرياء", "group": "كتاب ذم الجاه والرياء", "map": {"center": "كتاب\nذم الجاه", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "كتاب ذم الجاه والرياء - القسم ١ من ٧", "b": [{"pic": ["books", "book"], "cap": "ص٨١٧ - ص٨٨٨"}, {"story": ["كتاب ذم الجاه والرياء (١ من ٤١)، ص٨١٧", ["الحمد لله المطلع على سرائر القلوب، المتجاوز عن كبائر الذنوب، العالم بكوامن(٢) الغيوب، البصير ببواطن العيوب، لا يعزب عنه ما يعرض في السر وينوب، ولا خالص القصود من الطلب المشوب، كل عمل لا يراد به وجهه يضمحل ويذوب، وكل طاعة تزين فيها لخلقه إثم وحوب(٣).", "أحمده حمد معترف بأنه مربوب، وأصلي على رسوله محمد أشرف مولود وخير منسوب، وعلى أصحابه وأتباعه ما اختلف الشمال والجنوب، وأسلم تسليما كثيرا.", "أما بعد، فقد روي عن النبي ﷺ أنه قال: «إن أخوف ما أخاف على أمتي الرياء والشهوة الخفية»(٤).", "حاشية: (١) من هنا تبدأ نسخة مكتبة برنستون والمصورة من مكتبة الملك فهد الوطنية بالرياض، والمرموز لها بالحرف (ف).", "حاشية: (٢) هكذا في (ف)، وفي الأصل: (بخفايا).", "حاشية: (٣) الحوب: الإثم والبلاء والهلاك.", "حاشية: (٤) أخرجه أبو نعيم في الحلية ٧/ ١٢٢، وفي تاريخ أصبهان ٢/ ٦٦، والبيهقي في الشعب (٦٨٢٤) و(٦٨٢٥) وفي الزهد (٣١٦)، وبحشل في تاريخ واسط: ٢٢٠، وابن عدي في الكامل ٥/ ٣٥٦ - ٣٥٧ من حديث عبد الله بن زيد بن عاصم. وأخرجه أحمد (١٧٢٠)، وابن ماجه (٤٢٠٥) والطبراني في الكبير ٧/ (٧١٤٤) و(٧١٤٥)، وفي مسند الشاميين (٢٢٣٦)، والحاكم ٤/ ٣٣٠، وأبو نعيم في الحلية ١/ ٢٦٨، والبيهقي في الشعب (٦٨٣٠) من حديث شداد بن أوس.", "والرياء من الشهوة الخفية، وهذه الشهوة الخفية يعجز عن الوقوف على غوائلها كبار العلماء، فضلا عن عامة العباد والأتقياء، وهي من أواخر غوائل النفس وبواطن مكايدها.", "وإنما يبتلى بها العلماء والعباد المشمرون عن ساق الجد لسلوك سبيل الآخرة، فإنهم لما قهروا نفوسهم وجاهدوها، وفطموها عن الشهوات، وصانوها عن الشبهات، وحملوها بالقهر على أصناف العبادات، لم تطمع في المعاصي الظاهرة الواقعة على الجوارح، واستراحت إلى التظاهر بالعلم والعمل، ووجدت مخلصا من شدة المجاهدة في لذة القبول عند الخلق، ونظرهم إليهم بعين الوقار والتعظيم، فتوصلوا إلى اطلاع الخلق، ولم يقتنعوا باطلاع الخالق، وفرحوا بحمد الناس، ولم يقنعوا بحمد الله وحده، وعلموا أن الناس إذا عرفوا منهم ترك الشهوات، وتحمل العبادات، بالغوا في مدحهم واحترامهم، وتبركوا بمشاهدتهم ولقائهم ودعائهم، وسامحوهم في المعاملات، وتواضعوا لهم، فأصابت النفس في ذلك لذة هي أعظم اللذات، وشهوة هي أغلب الشهوات، فاحتقرت فيه ترك المعاصي والهفوات، واستلانت خشونة المواظبة على الطاعات. فأحدهم يرى أنه مخلص لله، وقد أبطن بهذه الشهوة التزين للعباد، والتصنع للخلق، والفرح بما نال من المنزلة، فحبطت بذلك أجور طاعاته، وأثبت في ديوان المنافقين، وهذه مكيدة للنفس لا يسلم منها إلا الصديقون، ومهواة لا يرقى منها إلا المقربون، ولذلك قيل: آخر ما يخرج من رؤوس الصديقين حب الرياسة."]], "ic": "book"}, {"story": ["كتاب ذم الجاه والرياء (٢ من ٤١)، ص٨١٨", ["وإذا كان الرياء هو الداء الدفين، الذي هو أعظم شبكة للشياطين، وجب شرح القول في سببه وحقيقته، ودرجاته وأقسامه، وطرق(١) معالجته، والحذر منه.", "ويتضح الغرض منه في ترتيب هذا الكتاب على شطرين:", "الشطر الأول: في حب الجاه والشهرة، وفيه: بيان ذم الشهرة، وبيان فضيلة", "حاشية: (١) في الأصل: (طريق).", "الخمول، وبيان ذم الجاه، وبيان معنى الجاه وحقيقته، وبيان السبب في كونه محبوبا أشد من حب المال، وبيان أن الجاه كمال وهمي، وليس بكمال حقيقي، وبيان ما يحمد من حب الجاه وما يذم، وبيان السبب في حب المدح والثناء، وكراهة الذم، وبيان العلاج في حب الجاه، وبيان علاج حب المدح، وبيان علاج كراهة الذم، وبيان اختلاف أحوال الناس في الذم والمدح، فهي اثنا عشر فصلا، منها تنشأ معاني الرياء، فلا بد من تقديمها.", "**بيان**", "**ذم الشهرة وانتشار(١) الصيت**", "اعلم أن أصل الجاه هو انتشار الصيت والاشتهار، وذلك خطر عظيم، تبعد سلامة صاحبه، والسلامة في الخمول، إلا أن تكون الشهرة من الله تعالى للشخص بمعنى ما قصده الشخص، كما شهر الإمام أحمد ابن حنبل رحمه الله حين نصر القرآن(٢)، وقد كان ابن سيرين إذا دخل السوق كبر الناس، وقد قال أبو حبيب البدوي لسفيان الثوري: أنت سفيان الذي يقال؟ قال: نعم، تسأل الله بركة ما يقال.", "أخبرنا الكروخي، قال: أخبرنا أبو عامر الأزدي وأبو بكر الغورجي، قالا: أنبأنا الجراحي، قال: حدثنا المحبوبي، قال: حدثنا الترمذي، قال: حدثنا يوسف ابن سلمان، قال: حدثنا حاتم بن إسماعيل، عن محمد بن عجلان، عن القعقاع، عن أبي صالح، عن أبي هريرة رضي الله عنه، عن النبي ﷺ قال: «إن لكل شيء شرة(٣)، ولكل شرة فترة، فإن كان صاحبها سدد وقارب فارجوه، وإن أشير إليه بالأصابع فلا تعدوه»(٤).", "حاشية: (١) في الأصل: (إيثار).", "حاشية: (٢) وذلك في المحنة التي جرت عليه حينما زين جماعة من المعتزلة للمأمون القول بخلق القرآن، فامتحن بذلك جماعة من العلماء، فأجاب بعضهم إيثارا للسلامة، وثبت البعض، ومنهم الإمام أحمد رحمه الله تعالى حيث توالت عليه المحنة زمن المأمون ثم المعتصم ثم الواثق وضرب وحبس وعذب وبقي ثابتا على الحق صابرا محتسبا حتى أنهى المتوكل هذه المحنة. انظر مناقب الإمام أحمد للمصنف ٤٣٠ وما بعدها، ومحنة الإمام أحمد للمقدسي.", "حاشية: (٣) الشرة: الحرص والرغبة والنشاط.", "حاشية: (٤) أخرجه الترمذي (٢٤٥٣)، والطحاوي في شرح مشكل الآثار (١٢٤٢)، وابن حبان (٣٤٩).", "قال الترمذي: هذا حديث حسن صحيح، غريب من هذا الوجه.", "وقد روى أنس بن مالك، عن النبي ﷺ أنه قال: «امرؤ من الشر - إلا من عصمه الله - أن يشير الناس إليه بالأصابع في دينه ودنياه»(١)."]], "ic": "book"}, {"story": ["كتاب ذم الجاه والرياء (٣ من ٤١)، ص٨٢١", ["وقد ذكر الحسن البصري رحمه الله لهذا الحديث تأويلا حسنا، فإنه لما رواه قالوا له: فإن الناس إذا رأوك أشاروا إليك بالأصابع. فقال: إنه لم يعن هذا، إنما عنى به المبتدع في دينه والفاسق في دنياه.", "واعلم أن أهل الخير لم يقصدوا الشهرة، ولم يتعرضوا بها ولا بأسبابها، فإذا وقعت من قبل الله تعالى فروا منها، وقطعوا أسبابها.", "وقد روينا عن ابن مسعود رضي الله عنه أنه خرج من منزله فتبعه ناس، فالتفت إليهم، فقال: على ما تتبعونني؟! فوالله لو علمتم ما أغلق عليه بابي ما اتبعني منكم رجلان. وفي لفظ آخر أنه قال: ارجعوا، فإنه ذلة للتابع، وفتنة للمتبوع.", "وخرج الحسن البصري يوما فاتبعه قوم، فقال: هل لكم من حاجة؟! وما عسى أن يبقي هذا من قلب المؤمن؟! وقال: إن خفق النعال خلف أعقاب الرجال قلما تلبث عليه قلوب الحمقى.", "وقيل لعلقمة(٢): ألا تدخل المسجد فنجتمع إليك ونسأل. فقال: إني أكره أن يوطأ عقبي ويقال: هذا علقمة، هذا علقمة(٣).", "وخرج أيوب(٤) في سفر فشيعه ناس كثير، فقال: لولا أني أعلم أن الله تعالى يعلم من قلبي أني لهذا كاره لخشيت المقت من الله تعالى. وقال معمر: عاتبت أيوب على طول قميصه، فقال: إن الشهرة فيما مضى كانت في طوله، وهي اليوم في تشميره. وقال أيوب: والله ما صدق الله عبد إلا سره أن لا يعلم مكانه.", "حاشية: (١) أخرجه البيهقي في الشعب (٦٩٧٧).", "حاشية: (٢) هو علقمة بن قيس النخعي الكوفي، أبو شبل، ولد في حياة النبي ﷺ ولم يره، وروى عن الخلفاء الأربعة وجمع من الصحابة توفي بعد سنة ٦٠هـ. السير ٤/ ٥٣.", "حاشية: (٣) الحلية ٢/ ١٠٠، والسير ٤/ ٥٩.", "حاشية: (٤) يعني أيوب السختياني.", "وكان أبو العالية إذا جلس إليه أكثر من أربعة قام(١). وكان خالد بن معدان إذا عظمت حلقته قام، فانصرف كراهية الشهرة.", "وصحب رجل ابن محيريز في سفر، فلما أراد فراقه قال: أوصني. قال: إن استطعت أن تعرف ولا تعرف، وتمشي ولا يمشى إليك، وتسأل ولا تسأل فافعل(٢).", "وقال الثوري: ما رأيت الزهد في شيء أقل منه في الرياسة، ترى الرجل يزهد في المطعم والمشرب والمال، فإذا نوزع الرياسة حامى عليها وعادى.", "وقال رجل لبشر بن الحارث(٣): أوصني. قال: أخمل ذكرك، وطيب مطعمك. وقال: لا يجد حلاوة الآخرة رجل يحب أن يعرفه الناس(٤).", "حاشية: (١) الحلية ٢/ ٢١٨.", "حاشية: (٢) الحلية ٥/ ١٤١.", "حاشية: (٣) في (ف): (لبشر الحافي) وكلاهما صحيح فهو بشر بن الحارث الزاهد المعروف ببشر الحافي، توفي سنة ٢٢٧هـ. وللمصنف رحمه الله كتاب في مناقبه. السير ١٠/ ٤٦٩.", "حاشية: (٤) حلية الأولياء ٨/ ٣٤٣.", "**بيان**", "**فضيلة الخمول**"]], "ic": "book"}, {"story": ["كتاب ذم الجاه والرياء (٤ من ٤١)، ص٨٢٣", ["أخبرنا هبة الله بن محمد، قال: أخبرنا الحسن بن علي، قال: أخبرنا أحمد بن جعفر، قال: حدثنا عبد الله بن أحمد، قال: حدثني أبي، قال: حدثنا عبد الكبير ابن عبد المجيد، قال: حدثنا بكير بن مسمار، عن عامر بن سعد، أن أخاه عمر(١) انطلق إلى سعيد(٢) وهو في غنم له خارجا من المدينة، فلما رآه سعد قال: أعوذ بالله من شر هذا الراكب. فلما أتاه قال: يا أبة، أرضيت أن تكون أعرابيا في غنمك، والناس يتنازعون في الملك بالمدينة؟ فضرب سعد صدر عمر، وقال: اسكت، إني سمعت رسول الله ﷺ يقول: «إن الله عز وجل يحب العبد التقي الغني الخفي». انفرد بإخراجه مسلم(٣).", "وفي أفراده من حديث أبي هريرة عن النبي ﷺ أنه قال: «رب أشعث أغبر(٤) مدفوع بالأبواب لو أقسم على الله لأبره»(٥).", "وفي أفراد البخاري من حديث أبي هريرة عن النبي ﷺ أنه قال: «طوبى لعبد آخذ بعنان فرسه في سبيل الله، أشعث رأسه، مغبرة قدماه، إن كان في الحراسة كان في الحراسة، وإن كان في الساقة(٦) كان في الساقة، إن استأذن لم يؤذن له، وإن شفع لم يشفع»(٧).", "حاشية: (١) ليس في (ف).", "حاشية: (٢) يعني سعد بن أبي وقاص رضي الله عنه.", "حاشية: (٣) صحيح مسلم (٢٩٦٥)، وهو في المسند (١٤٤١).", "حاشية: (٤) كلمة أغبر ليست عند مسلم.", "حاشية: (٥) أخرجه مسلم (٢٦٢٢) و(٢٨٥٤).", "حاشية: (٦) ساقة الجيش: مؤخره.", "حاشية: (٧) صحيح البخاري (٢٨٨٧).", "أخبرنا ابن الحصين، قال: أخبرنا ابن المذهب، قال: أخبرنا أبو بكر بن مالك، قال: حدثنا عبد الله بن أحمد، قال: حدثني أبي، قال: حدثنا وكيع، قال: حدثنا علي بن صالح، عن أبي(١) المهلب، عن عبيد(٢) الله بن زحر، عن علي بن يزيد، عن القاسم، عن أبي أمامة، قال: قال رسول الله ﷺ: «إن أغبط أوليائي عندي مؤمن خفيف الحاذ(٣)، ذو حظ من صلاة، أحسن عبادة ربه، وكان في الناس غامضا، لا يشار إليه بالأصابع، فعجلت منيته، وقل تراثه، وقلت بواكيه»(٤).", "وروينا أن عمر دخل المسجد، فإذا بمعاذ بن جبل يبكي عند قبر(٥) رسول الله ﷺ، فقال له: ما يبكيك؟ فقال: سمعت رسول الله ﷺ يقول: «إن اليسير من الرياء شرك، وإن الله يحب الأتقياء الأخفياء، الذين إن غابوا لم يفتقدوا، وإن حضروا لم يعرفوا»(٦).", "وقال علي رضي الله عنه: طوبى لكل عبد نومة(٧)، عرف الناس، ولم يعرفه الناس، أولئك مصابيح الهدى، يكشف الله عنهم كل فتنة مظلمة(٨).", "وكان ابن مسعود يوصي أصحابه فيقول: كونوا ينابيع العلم، مصابيح الهدى أحلاس(٩) البيوت، سرج الليل، جدد القلوب، خلقان الثياب، تعرفون في السماء، وتخفون على أهل الأرض(١٠).", "حاشية: (١) تحرفت في (ف) إلى: (ابن).", "حاشية: (٢) تحرف في (ف) إلى: (عبد).", "حاشية: (٣) خفيف الحاذ: أي قليل المال والعيال."]], "ic": "book"}, {"story": ["كتاب ذم الجاه والرياء (٥ من ٤١)، ص٨٢٤", ["حاشية: (٤) أخرجه أحمد (٢٢١٦٧)، والترمذي (٢٣٤٧)، والطبراني في الكبير ٨/ (٧٨٢٩) والحاكم ٤/ ١٢٣، وأبو نعيم في الحلية ١/ ٢٥، والبيهقي في الشعب (٦٨١٤).", "حاشية: (٥) في (ف): (منبر).", "حاشية: (٦) أخرجه الطحاوي في شرح مشكل الآثار (١٧٩٨)، والطبراني في الكبير (٢٠/ ٣٢١) والحاكم ٤/ ٣٢٨، وتمام في الفوائد (١٦٧٣)، وأبو نعيم في الحلية ١/ ٥، والقضاعي في مسند الشهاب (١٠٧١)، والبيهقي في الشعب (٦٨١٢) وابن ماجه (٣٩٨٩) عن عبد الله بن عمر.", "حاشية: (٧) النومة، كهمزة: خامل الذكر، الغامض في الناس.", "حاشية: (٨) التواضع لابن أبي الدنيا (١٠).", "حاشية: (٩) يقال: هو حلس بيته؛ إذا لم يبرح مكانه، والحلس ما يبسط في البيت تحت حر الثياب.", "حاشية: (١٠) التواضع والخمول (١١).", "وقال الحسن البصري: إن كان الرجل ليكون فقيها جالسا مع القوم، فيرى بعض الناس أنه به عيا(١)، وما به من عي، إلا كراهة أن يشتهر. وقال الثوري: وجدت قلبي يصلح بمكة والمدينة، مع قوم غرباء، أصحاب بتوت(٢) وعباء(٣).", "واعلم أنه إنما فضل الخمول؛ لأنه سليم من انتشار الصيت الموجب للجاه والمنزلة في القلوب، وإذا وقعت المنزلة للإنسان في القلوب أحبها وسعى في ترتيبها، وسلامته من ذلك بعيدة.", "فإن قال قائل: فلا شهرة أكثر من شهرة الأنبياء وأئمة العلماء. فقد سلف جواب هذا، وهوأن المذموم طلب الإنسان للشهرة، وأما وجودها من جهة الله سبحانه وتعالى من غير طلب الإنسان، فليس بمذموم، غير أن في وجودها فتنة على الضعفاء، فمثل الضعيف كالغريق القليل الصنعة في السباحة، فإن الأولى له أن لا يتعلق به أحد من (٤-٤)الغرقى(٤-٤)، لئلا يغرق ويغرقهم، فأما السابح النحرير(٥)، فإن تعلق الغرقى به تسبب لخلاصهم.", "حاشية: (١) العي: العجز عن إحكام الأمر أو الكلام.", "حاشية: (٢) في النسخ: (بيوت)، والمثبت من حلية الأولياء، والبتوت: جمع بت، وهو الطيلسان، كساء من وبر وصوف يوضع على الرأس والأكتاف.", "حاشية: (٣) حلية الأولياء ٦/ ٧.", "حاشية: (٤-٤) ليست في الأصل.", "حاشية: (٥) النحرير: الحاذق الماهر المتقن الفطن.", "**بيان**", "**ذم الجاه**", "اعلم أن الجاه محبوب للنفس، إلا أنه إذا غلب حبه عليها فسعت في تحصيله لم تسلم من إثم.", "وقد روى كعب بن مالك رضي الله عنه عن النبي ﷺ أنه قال: «ماذئبان جائعان أرسلا في غنم بأفسد لها من حرص المرء على المال والشرف لدينه»(١). (٢-٢)رواه أحمد والترمذي وقال: حسن صحيح(٢-٢).", "حاشية: (١) أخرجه أحمد (١٥٧٨٤) و(١٥٧٩٤)، وابن أبي شيبة ٣/ ٢٤١، والترمذي (٢٣٧٦)، والنسائي في الكبرى (١١٧٩٦)، وابن حبان (٣٢٢٨).", "حاشية: (٢-٢) ليس في الأصل.", "**بيان**", "**معنى الجاه وحقيقته**"]], "ic": "book"}, {"story": ["كتاب ذم الجاه والرياء (٦ من ٤١)، ص٨٢٧", ["اعلم أن الجاه والمال هما ركنا الدنيا، ومعنى المال ملك الأعيان المنتفع بها، ومعنى الجاه ملك القلوب المطلوب تعظيمها وطاعتها، وكما أن الغنى هو الذي يملك الدراهم والدنانير؛ ليتوصل بهما إلى الأغراض والشهوات، فكذلك ذو الجاه، هو الذي يملك قلوب الناس، ويقدر على التصرف فيها، ليستعمل بواسطتها أربابها في أغراضه ومآربه.", "وكما أنه يكتسب الأموال بالصناعات، فكذلك تكتسب قلوب الخلق بأنواع المعاملات، ولا تسخر القلوب إلا بالاعتقاد، فكل من اعتقد في شخص وصفا من أوصاف الكمال انقاد له، بحسب قوة اعتقاده فيه، ولا يشترط أن يكون ذلك الوصف كمالا في نفسه، بل قد يكون كمالا في ظن المعتقد.", "وكما أن محب المال يطلب أن يملك العبيد، وطالب الجاه يطلب أن يسترق الأحرار ويستعبدهم بتملك قلوبهم، وهذا التملك أقوى من تملك المرقوق(١)؛ لأن ذلك مملوك قهرا، وهؤلاء مملوكون طوعا، مع فرحهم بالعبودية، فالذي يطلبه هذا فوق ما يطلبه مالك الرق بدرجات.", "فإذن معنى الجاه: قيام المنزلة في قلوب الناس، وهو اعتقاد القلوب نعتا من نعوت الكمال في هذا الشخص، إما بعلم، أو عبادة، أو نسب، أو حسن خلق، أو قوة في بدن، أو حسن صورة، أو غير ذلك مما يعتقده الناس كمالا، فيقدر ما يعتقدون له من ذلك تذعن قلوبهم لطاعته، ومن ثمرات ذلك مدحهم وإطراؤهم وخدمتهم وتوقيرهم.", "حاشية: (١) المرقوق: هو الرقيق، وهو العبد والمملوك.", "**بيان**", "**سبب كون الجاه محبوبا بالطبع حتى لا يخلو عنه قلب إلا بعد شدة المجاهدة**", "اعلم أن السبب الذي يقتضي كون الذهب والفضة وسائر أنواع المال محبوبا، هو بعينه يقتضي كون الجاه محبوبا، بل يقتضي أن يكون أحب من المال، كما يقتضي أن يكون الذهب أحب من الفضة. وذلك أنك تعلم أن الدراهم والدنانير لا غرض في أعيانها، لأنها والحصى سواء، لكنها تحب لأنها وسيلة إلى المحاب، فكذلك الجاه.", "وقد بينا أن معنى الجاه ملك القلوب، وكما أن ملك الذهب والفضة يفيد قدرة يتوصل الإنسان بها إلى جميع أغراضه، فكذلك ملك قلوب الأحرار، والقدرة على استسخارها، يفيد قدرة على التوصل إلى جميع الأغراض، فالاشتراك في السبب اقتضى الاشتراك في المحبة، وترجيح الجاه على المال اقتضى أن يكون الجاه أحب من المال.", "ولملك القلوب ترجيح على ملك المال من ثلاثة أوجه:", "الأول: أن التوصل بالجاه إلى المال أيسر من التوصل بالمال إلى الجاه، فالعالم أو الزاهد الذي قد تقرر له جاه في القلوب، إذا قصد اكتساب المال تيسر له، فإن أموال أرباب القلوب مسخرة للقلوب، ومبذولة لمن اعتقد فيه الكمال. وأما الرجل الخسيس، الذي لا يتصف بصفة كمال، إذا وجد كنزا، ولم يكن له جاه يحفظ ماله، وأراد أن يتوصل بالمال إلى الجاه، لم يتيسر له."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "وأما أهل الدنيا فيراؤون بإظهار السمن، وصفاء اللون، واعتدال القامة، وحسن ____، ونظافة البدن", "o": ["الوجه", "ليأنس", "وتقيم", "أقبح"], "h": "راجع: ص٨٤٨"}, {"t": "fill", "d": 2, "q": "ومنبع كل ذنب؛ لأن حلاوة حب الجاه والمنزلة ونعيم الدنيا هي التي تسلب القلب، وتحول بينه وبين التفكر في العاقبة، والاستضاءة بأنوار ____", "o": ["العلم", "تزدروا", "وطاعته", "الحقيقي"], "h": "راجع: ص٨٧٥"}, {"t": "fill", "d": 2, "q": "فمن أحضر في قلبه الآخرة ونعيمها المؤبد، احتقر ما يتعلق بالخلق أيام الحياة، مع ما فيه من الكدر والتنغيص، واجتمع همه، وانصرف إلى الله سبحانه قلبه، وتخلص من مذلة الرياء ومقاساة قلوب الخلق، وانعطف من إخلاصه أنوار على قلبه، ينشرح بها صدره، وينفتح له من لطائف المكاشفات ما يزيد به أنسه بالله عز وجل، ووحشته من الخلق، واحتقاره للدنيا، واستعظامه للآخرة، ____ محل الخلق من قلبه، وانحلت عنه داعية الرياء، وتذلل له منهج الإخلاص", "o": ["وسقط", "الشربة", "أورد", "الأذى"], "h": "راجع: ص٨٧٢"}, {"t": "fill", "d": 2, "q": "والمراؤون بالزي على طبقات، فمنهم من يطلب المنزلة عند أهل الصلاح بإظهار التزهد، فيلبس الثياب المخرقة الغليظة، الوسخة القصيرة، ليرائي بغلظها وقصرها، ووسخها وتخرقها، ولو كلف أن يلبس ____ وسطا نظيفا، مما كان السلف يلبسونه، لكان عنده بمنزلة الذبح، لخوفه أن يقول الناس", "o": ["ثوبا", "تزدروا", "قسمان", "بابا"], "h": "راجع: ص٨٤٨"}, {"t": "fill", "d": 2, "q": "وقال علي رضي الله عنه: طوبى لكل عبد نومة، عرف الناس، ولم ____ الناس، أولئك مصابيح الهدى، يكشف الله عنهم كل فتنة", "o": ["يعرفه", "والنهي", "ثبتت", "أقواهما"], "h": "راجع: ص٨٢٤"}]}, {"t": "كتاب ذم الجاه والرياء - القسم ٢ من ٧", "b": [{"story": ["كتاب ذم الجاه والرياء (٧ من ٤١)، ص٨٢٨", ["فإذن الجاه آلة ووسيلة إلى المال، فمن ملك الجاه فقد ملك المال، ومن ملك المال لم يملك الجاه، فلذلك صار الجاه أحب.", "والثاني: أن المال معرض للتوى(١)، بأن يسرق ويغصب، ويطمع فيه الظلمة، ويحتاج إلى الحفظة، والقلوب إذا ملكت لم تتعرض لهذه الآفات، فهي خزائن عتيدة، لا يقدر عليها السراق.", "الثالث: أن ملك القلوب يسري وينمو ويتزايد من غير تعب في تحصيل ذلك، فإن القلوب إذا أذعنت لشخص، واعتقدت كماله، أفصحت الألسن بوصف ما تعتقده للغير، فيقع بذلك اقتناص خلق آخرين، بخلاف المال، فإن استنماءه لا يكون إلا بعد تعب، والجاه أبدا ينمي بنفسه.", "فإن قال قائل: معلوم أن من أحب من المال أو من الجاه ما ينال به أغراضه فمعذور، فما وجه محبة الإنسان استكثار الأموال، حتى لو كان له واديان من ذهب لابتغى إليهما ثالثا. وما وجه محبته لانتشار صيته إلى أقاصي البلاد التي يعلم أنه لا يطؤها، ولا يجيء أصحابها إليه فينفعوه بحال؟", "فالجواب: أن هذه المحبة لها سببان؛ أحدهما جلي، والآخر خفي، والخفي أقوى السببين؛ لأنه يكون من طبيعة مستكنة في الطبع، لا يقف عليها إلا الغواصون من العلماء.", "فأما السبب الأول: فهو دفع ألم الخوف، فإن الشفيق(٢) بسوء الظن مولع، والإنسان وإن كان مكفيا(٣) في الحال، إلا أنه طويل الأمل، فيخطر بباله، أن المال الذي فيه كفايته ربما تلف، فاحتاج إلى غيره، فيهيج الخوف عند ذلك الخاطر، فلا يدفعه إلا الأمن الحاصل بوجود مال آخر يفزع إليه إن اجتيح(٤) هذا، ومتى قدر هجوم الحاجات، وتطرق الآفات إلى الأموال وقع الخوف، ولا موقف لهذا الخوف عند مقدار مخصوص من المال، ومثل هذه العلة تطرد في حبه للجاه في", "حاشية: (١) التوى: الهلاك.", "حاشية: (٢) الشفيق: الخائف.", "حاشية: (٣) في الأصل: (مكتفيا).", "حاشية: (٤) اجتيح: استؤصل وأهلك.", "قلوب الأباعد، لأنه يقدر وجود سبب يزعجه عن وطنه، أو يزعج أولئك إليه، فيحتاج إلى الاستعانة بهم، ومتى كان ذلك ممكنا كان للنفس فرح والتذاذ بقيام الجاه في قلوب أولئك، لما في ذلك من الأمن عن هذا الخوف."]], "ic": "book"}, {"story": ["كتاب ذم الجاه والرياء (٨ من ٤١)، ص٨٣٠", ["وأما السبب الثاني: فاعلم أن للنفس ميلا إلى صفات بهيمية، كالأكل والجماع، وإلى صفات سبعية، كالقتل والضرب والإيذاء، وإلى صفات شيطانية، كالمكر والخداع، وإلى صفات ربوبية، كالعز والعلو والكبر، والإنسان لما فيه من الأمر الرباني يحب الربوبية بالطبع. ومعنى الربوبية: التوحد بالكمال، والتفرد بالوجود(١) على سبيل الاستقلال، إذ المشاركة في الوجود نقص لا محالة، بدليل أن كمال الشمس في وجودها وحدها، فلو كان معها شمس أخرى كان ذلك نقصا في حقها، إذ لا تكون منفردة بكمال معنى الشمسية. والمنفرد بالوجود هو الله تعالى، إذ ليس معه موجود سواه، فإن ما سواه أثر من آثار قدرته، لا قوام له بذاته، بل هو قائم به، فلم يكن موجودا معه؛ لأن المعية توجب المساواة في الرتبة، والمساواة في الرتبة نقصان في الكمال، إذ الكامل من لا نظير له في رتبته، فإشراق نور الشمس (٢-٢)في الآفاق(٢-٢) ليس نقصانا في الشمس، بل هو من جملة كمالها، وإنما نقصان الشمس بوجود شمس أخرى تساويها في الرتبة، مع الاستغناء عنها، فكذلك وجود كل ما في العالم يرجع إلى إشراق أنوار القدرة، فيكون تابعا، ولا يكون معا.", "فإذن معنى الربوبية: التفرد بالوجود، وهو الكمال، وكل إنسان يحب بطبعه أن يكون منفردا بالكمال، فإذا عجزت النفس عن درك منتهى الكمال لم تسقط شهوتها للكمال، فهي محبة له، وملتذة به لذاته، لا لمعنى آخر وراء الكمال.", "وإن أكمل الكمال أن يكون وجود غيرك منك، فإن لم يكن منك فأن تكون مستوليا عليه، فصار الاستيلاء على الكل محبوبا بالطبع؛ لأنه نوع كمال، ولهذا", "حاشية: (١) سقطت من (ف).", "حاشية: (٢-٢) ليس في (ف).", "يحب الإنسان الاستيلاء على السماوات والأفلاك، وعجائب البحار، وكل صناعة بالعلم، والإحاطة بأسرارها؛ لأن العالم بالشيء كالمستولي عليه، وقد يحب أن يعلم من العلوم مالا يتوصل به إلى أغراضه، لما في ذلك من الاستيلاء على المعلومات.", "فأما ما يتصور له الاستيلاء على ذاته كالأموال والعبيد، فإنه يحب الاستيلاء على صورها، ولذلك أحب الاستيلاء على القلوب بإقامته الجاه عندها، فمهما بقي معلوم أو مقدور فشوق الإنسان لا يسكن لما يطلبه من الكمال.", "**بيان**", "**الكمال الحقيقي والكمال الوهمي الذي لا حقيقة له**", "اعلم أن الكمال الحقيقي العلم والحرية، أما العلم فمعرفة الله سبحانه وتعالى، وأما الحرية فالخلاص من أسر الشهوات تشبها(١) بالملائكة، الذين لا تستفزهم شهوة، ولا يستهويهم غضب.", "وللعبد طريق إلى اكتساب كمال العلم وكمال الحرية، وذلك لا ينعدم بالموت، بل يبقى عنده كمالا ووسيلة إلى القرب إلى الله تعالى، فأما قدرته على أعيان الأموال واستسخار القلوب بالجاه، فهي منقطعة بالموت."]], "ic": "book"}, {"story": ["كتاب ذم الجاه والرياء (٩ من ٤١)، ص٨٣٢", ["فانظر إلى الجاهلين الذين طلبوا كمال القدرة بالمال والجاه، فذلك الكمال لا يسلم، وإن سلم فلا بقاء له، وأعرضوا عن كمال العلم والحرية الباقيين، وهؤلاء هم الذين اشتروا الحياة(٢) الدنيا بالآخرة.", "فقد بان بما ذكرنا أن كمال القدرة بالمال والجاه كمال ظني، لا أصل له، وأن من قصر الوقت على طلب ذلك فهو جاهل، إلا أن يحصل قدر البلغة منهما إلى الكمال الحقيقي.", "حاشية: (١) في (ف): (شبها).", "حاشية: (٢) سقطت من الأصل.", "**بيان**", "**ما يحمد من حب الجاه ويذم**", "معلوم أنه لا بد من مال لضرورة المطعم والملبس، فكذلك لا بد من جاه لضرورة المعيشة مع الخلق؛ لأن الإنسان لا يخلو من الحاجة إلى سلطان يحرسه، ورفيق يعينه، وخادم يخدمه، فحبه أن يكون له محل في قلب سلطانه، ليحثه ذلك على دفع الشر عنه، وفي قلب رفيقه ليحسن مرافقته، وفي قلب خادمه ليحسن خدمته ليس بمذموم؛ لأن الجاه وسيلة إلى الأغراض كالمال، إلا أن التحقيق في هذا يفضي إلى أن(١) لا يكون المال والجاه محبوبين لأعيانهما، بل كما يحب الإنسان أن يكون في داره بيت ماء لضرورة قضاء الحاجة، وقد يحبهما لأعيانهما، كما قدمنا ذكره في الفصل المتقدم، كما يحب شخص زوجته لا لنفس قضاء الشهوة منها.", "ومتى طلب قيام جاهه في القلوب لأجل صفة هو متصف بها كان ذلك مباحا، كقول يوسف عليه السلام: ﴿ٱجْعَلْنِى عَلَىٰ خَزَآئِنِ ٱلْأَرْضِ إِنِّى حَفِيظٌ عَلِيمٌ﴾ [يوسف: ٥٥]. أو قصد إخفاء عيب من عيوبه، لئلا تزول منزلته فهو مباح أيضا.", "فأما إذا طلب المنزلة باعتقادهم فيه صفة ليست فيه، كالعلم والورع والنسب، فذلك محظور، وكذلك لو حسن الصلاة بين أيديهم، ليعتقدوا فيه الخشوع، فإنه مراء بذلك، وكما أنه لا يجوز تملك المال بتلبيس، فلا يجوز تملك القلوب بتزوير.", "حاشية: (١) في (ف): (يقتضي أن).", "**بيان**", "**السبب في حب المدح والثناء، وارتياح النفس به، وميل الطباع إليه وبغضها للذم ونفورها منه**", "اعلم أن لحب المدح والتذاذ القلب به أربعة أسباب:", "**السبب(١) الأول**: وهو الأقوى - شعور النفس بالكمال، فإنا قد بينا أن الكمال محبوب، وكل محبوب فإدراكه لذيذ، فإذا شعرت النفس بكمالها ارتاحت وتلذذت.", "والمدح يشعر نفس الممدوح بكمالها، فإن الوصف الذي به مدح لا يخلو: إما أن يكون جليا ظاهرا، (٢-٢)أو يكون مشكوكا فيه، فإن كان جليا ظاهرا(٢-٢) كانت اللذة فيه أقل، ولكنه لا يخلو عن لذة، كثنائه عليه بأنه طويل القامة، أبيض اللون، فإن هذا نوع كمال، ولكن النفس تغفل عنه، فيخلو عن لذته، فإذا أشعرت به لم يخل حدوث الشعور من حدوث لذة."]], "ic": "book"}, {"story": ["كتاب ذم الجاه والرياء (١٠ من ٤١)، ص٨٣٤", ["فإن كان ذلك الوصف مما يتطرق إليه الشك فاللذة فيه أعظم، كالثناء عليه بكمال العلم، وكمال الورع، أو بالحسن المطلق، فإن الإنسان ربما يكون شاكا في كمال حسنه، وكمال علمه، وكمال ورعه، ويكون مشتاقا إلى زوال هذا الشك، بأن يصير مستيقنا، فإذا ذكر ذلك غيره أورثه ذلك طمأنينة وثقة باستشعار ذلك الجمال، فتعظم لذته.", "وإنما تعظم اللذة إذا صدر الثناء من بصير بهذه الصفات، خبير بها، لا يحرف في القول، وذلك كفرح التلميذ بثناء أستاذه عليه بالذكاء وغزارة الفضل، وإن صدر ممن يحرف في الكلام، أو لا يكون بصيرا بذلك الوصف، ضعفت اللذة، وبهذه", "حاشية: (١) ليست في (ف).", "حاشية: (٢-٢) سقط من الأصل.", "العلة يبغض الذم ويكرهه؛ لأنه يشعر الإنسان بنقصان نفسه، والنقصان ضد الكمال(١) المحبوب، فهو ممقوت، والشعور به مؤلم، ويعظم الألم إذا صدر الذم من بصير موثوق به كما ذكرنا في المدح.", "**السبب الثاني**: أن المدح يدل على أن قلب المادح مملوك للممدوح، وأنه معتقد فيه، وملك القلوب محبوب، والشعور بحصوله لذيذ، وبهذه العلة تعظم اللذة إذا صدر الثناء ممن تسع قدرته، وينتفع باقتناص قلبه، كالملوك والأكابر، وتضعف إذا كان المثني لا يؤبه له، ولا يقدر على شيء؛ لأن القدرة على قلب هذا قدرة على أمر حقير، فلا يدل المدح إلا على قدرة قاصرة، وبهذه العلة أيضا يكره الذم، ويتألم به القلب، وإذا كان من الأكابر كانت نكايته أعظم؛ لأن الفائت منه أعظم.", "**السبب الثالث**: أن ثناء المثني ومدح المادح سبب لاصطياد قلب كل من يسمعه، لا سيما إذا كان ذلك ممن يلتفت إلى قوله، ويعتد بثنائه، وهذا يختص بثناء يقع بين الملأ، وكلما كان الجمع أكثر(٢) والمثني أجدر بأن يلتفت إلى قوله كان المدح ألذ، والذم على النفس أشد.", "**السبب الرابع**: أن المدح يدل على جشمة الممدوح، واضطرار المادح إلى إطلاق اللسان بالثناء عليه، إما عن طوع، وإما عن قهر، فإن الجشمة أيضا لذيذة، لما فيها من القهر والقدرة، وهذه اللذة تحصل وإن كان المادح لا يعتقد في الباطن ما قدح به، ولكن كونه مضطرا إلى ذكره نوع قهر واستيلاء عليه، فلا جرم(٣) تكون لذته بقدر تمنع المادح وقوته، فتكون لذة ثناء القوي الممتنع عن التواضع بالثناء أشد.", "فهذه الأسباب الأربعة قد تجتمع في مدح واحد، فيعظم بها الالتذاذ، وقد تفترق، فتنقص(٤) اللذة بها.", "حاشية: (١) ليست في النسخ، واستدركت من الإحياء.", "حاشية: (٢) ليست في الأصل.", "حاشية: (٣) لا جرم: لابد، أو حقا، أو لا محالة، ثم كثر استعمالها حتى تحولت إلى معنى القسم.", "حاشية: (٤) سقطت من النسخ، واستدركت من الإحياء."]], "ic": "book"}, {"story": ["كتاب ذم الجاه والرياء (١١ من ٤١)، ص٨٣٦", ["وأما العلة الأولى: وهي استشعار الكمال، فتندفع بأن يعلم الممدوح أن المادح غير صادق في مدحه، كما إذا مدح بأنه عالم بكذا، أو سخي، وهو يعلم من نفسه ضد ذلك، فتزول اللذة التي سببها استشعار الكمال، وتبقى لذة الاستيلاء على قلبه وعلى لسانه، وبقية اللذات.", "فإن كان يعلم أن المادح ليس يعتقد ما يقوله بطلت اللذة الثانية، وهي استيلاؤه على قلبه، وبقيت لذة الاستيلاء بالحشمة على اضطرار لسانه إلى النطق بالثناء، فإن لم يكن ذلك عن خوف، بل كان بطريق اللعب بطلت اللذات كلها، لفوات الأسباب الثلاثة.", "فها ما يكشف الغطاء عن علة التذاذ النفس بالمدح، وتألمها بالذم، وإنما ذكرناه لتعرف طريق العلاج لحب الجاه، وحب المحمدة، وخوف المذمة، فإن ما لا يعرف سببه لا يمكن معالجته، إذ العلاج عبارة عن حل أسباب المرض.", "**بيان**", "**علاج حب الجاه**", "اعلم أن من غلب على قلبه حب الجاه، صار مقصور الهم على مراعاة الخلق، مشغوفا بالتودد إليهم، والمراءاة لهم، ولا يزال في أقواله وأفعاله ملتفتا إلى ما يعظم منزلته عندهم، وذلك بذر النفاق، وأصل الفساد؛ لأن كل من طلب المنزلة في قلوب الناس، اضطر إلى أن ينافقهم، بإظهار ما هو خال عنه، ويجر ذلك إلى المراءاة بالعبادات، واقتحام المحظورات، للتوصل إلى اقتناص القلوب، ولذلك شبه رسول الله ﷺ حب المال والشرف، وإفسادهما للدين بذئبين ضاريين(١)، فحب الجاه إذا من المهلكات، يجب علاجه، وعلاجه مركب من علم وعمل.", "أما العلم: فهو أن يعلم السبب الذي لأجله أحب الجاه، وهو كمال القدرة على إخلاص الناس وعلى قلوبهم، وقد بينا أن ذلك إن صفى وسلم فآخره الموت، وسيهلك عن قريب ذو الجاه ومن ذل له، فلا ينبغي أن يترك بهذا الدين الذي هو الحياة الأبدية.", "ومن فهم الكمال الحقيقي والكمال الوهمي، كما سبق، صغر الجاه في عينه، إلا أن ذلك إنما يصغر في عين من ينظر إلى الآخرة كأنه يشاهدها، كما كتب الحسن إلى عمر بن عبد العزيز: أما بعد، فكأنك بآخر من كتب عليه الموت قد مات، فانظر كيف مد نظره نحو المستقبل فكتب إليه عمر في جوابه: أما بعد فكأنك بالدنيا لم تكن، وبالآخرة لم تزل. فهؤلاء كان التفاتهم إلى العاقبة للمتقين، فاحتقروا المال والجاه، وأبصار أكثر الناس ضعيفة، مقصورة على العاجلة، لا يمتد نورها إلى مشاهدة العواقب، كما قال الله تعالى: ﴿بَلْ تُؤْثِرُونَ ٱلْحَيَوٰةَ ٱلدُّنْيَا وَٱلْـَٔاخِرَةُ خَيْرٌ وَأَبْقَىٰٓ﴾ [الأعلى: ١٦ - ١٧].", "حاشية: (١) كما تقدم في الحديث قريبا في الصفحة ٨٢٦."]], "ic": "book"}, {"story": ["كتاب ذم الجاه والرياء (١٢ من ٤١)، ص٨٣٨", ["ومن هذا حده، فينبغي أن يعالج قلبه من حب الجاه، بالعلم بالآفات العاجلة، وهو أن يتفكر في الأخطار، التي يستهدف لها أرباب الجاه في الدنيا، فإن كل ذي جاه محسود، ومقصود بالإيذاء، وخائف على الدوام على جاهه، ومحترز من أن تتغير منزلته في القلوب، والقلوب أشد تغيرا من القدر في غليانها، وهي مرددة بين الإقبال والإعراض، فكل ما يبنى على قلوب الخلق، يضاهي ما يبنى على أمواج البحر، فإنه لا ثبات له، والاشتغال بمراعاة القلوب، وحفظ الجاه، ودفع كيد الحساد، ومنع أذى الأعداء، كل ذلك غموم عاجلة، ومكدرة لذة الجاه، فلا يفي مرجو الدنيا(١) بمخوفها، فضلا عما يفوت في الآخرة، فبهذا ينبغي أن تعالج البصيرة الضعيفة. وأما من نفذت بصيرته، وقوي إيمانه، فإنه لا يلتفت إلى الدنيا، فهذا هو العلاج من حيث العلم.", "وأما من حيث العمل: فإسقاط الجاه من قلوب الخلق بأفعال توجب ذلك، كما روينا أن بعض الملوك قصد زيارة رجل زاهد، فلما قرب منه استدعى الزاهد طعاما وبقلا ولبنا، وأخذ يأكل بشره، ويعظم اللقمة، فلما نظر إليه الملك سقط من عينيه. وأن إبراهيم النخعي لما أريد للقضاء لبس قميصا أحمر وقعد في السوق.", "واعلم أن انقطاع الزاهد عن الناس يوجب له جاها عندهم، فإذا خاف من ذلك الفتنة فليخالطهم على وجه السلامة، وليمش في الأسواق، وليشتر حاجته ويحملها، وليقطع طمعه من دنياهم، وقد تم مراده، وقد كان بشر الحافي يجلس إلى عطار، وما كانوا يراعون نواميس المتزهدين اليوم.", "حاشية: (١) في (ف): (الآخرة).", "**بيان**", "**وجه العلاج لحب المدح وكراهة الذم**", "اعلم أن أكثر الناس إنما هلكوا بخوف مذمة الناس(١)، وحب مدحهم، فصارت حركاتهم كلها موقوفة على ما يوافق رضا الناس، رجاء للمدح، وخوفا من الذم، وذلك من المهلكات، فوجب معالجته، وطريق ذلك ملاحظة الأسباب التي لأجلها يحب المدح ويكره الذم:", "أما السبب الأول: فهو استشعار الكمال بسبب قول المادح، فطريقك فيه أن ترجع إلى عقلك، وتنظر: هل أنت متصف بما وصفك به؟ فإن كنت متصفا بتلك الصفة، فانظر: هل هي صفة لا يصلح أن يفرح بها كالجاه والمال؟ فإنه كالفرح بنبات الأرض، الذي يصير عن قليل هشيما، وهذا يكون من قلة العقل، بل العاقل يقول:", "أشد الغم عندي في سرور  تيقن عنه صاحبه انتقالا(٢)", "فلا ينبغي للعاقل أن يفرح بعرض الدنيا، فإن فرح فلا ينبغي أن يفرح بمدح المادح بها.", "وإن كانت الصفة مما يفرح بها كالعلم والورع، فينبغي أن يحذر من الخاتمة، فإن في الخوف منها شغلا عن الفرح، والدنيا دار غموم، لا دار سرور، ثم إن كنت تفرح بها على رجاء حسن الخاتمة، فينبغي أن يكون فرحك بفضل الله عليك بالعلم والتقوى، لا بمدح المادح، فإن اللذة في استشعار الكمال، والكمال موجود من فضل الله لا من المدح، والمدح تابع له، فلم تفرح بالمدح والمدح لا يزيدك فضلا؟"]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "فالجواب: إن من أحب ذلك ليعرف به حب الله له فهذا محمود؛ لأنه إذا أحبه ____ إلى عباده، ومن أحب ذلك على طاعة بعينها فقد طلب العوض", "o": ["حببه", "مشوهة", "أبيات", "ألقى"], "h": "راجع: ص٨٨٠"}, {"t": "fill", "d": 2, "q": "عليه، وأعطاه من أصناف المال كله، ____ به، فعرفه نعمه فعرفها، فقال", "o": ["فأتي", "الحروف", "بالذم", "فيحسن"], "h": "راجع: ص٨٤٥"}, {"t": "fill", "d": 2, "q": "اعلم أن الجاه والمال هما ركنا الدنيا، ومعنى المال ملك الأعيان المنتفع بها، ومعنى الجاه ملك القلوب المطلوب تعظيمها وطاعتها، وكما أن الغنى هو الذي يملك الدراهم والدنانير؛ ____ بهما إلى الأغراض والشهوات، فكذلك ذو الجاه، هو الذي يملك قلوب الناس، ويقدر على التصرف فيها، ليستعمل بواسطتها أربابها في أغراضه ومآربه", "o": ["ليتوصل", "فتبسم", "الموافق", "بالجابية"], "h": "راجع: ص٨٢٧"}, {"t": "fill", "d": 2, "q": "القسم الثاني: الرياء بالزي والهيئة؛ أما الهيئة فتشعث شعر الرأس، وحلق الشارب، والإطراق في حالة المشي، وإبقاء أثر السجود على الوجه، وغلظ الثياب، ولبس الصوف، وتشميرها كثيرا، وتقصير ____، وترك", "o": ["الأكمام", "وتفقده", "الحمصة", "المؤبد"], "h": "راجع: ص٨٤٨"}, {"t": "fill", "d": 2, "q": "اعلم أن بعض أبواب الرياء أشد وأغلظ من بعض، واختلافه باختلاف أركانه ____ الدرجات فيه، وأركانه ثلاثة", "o": ["وتفاوت", "التخمة", "المعرفة", "أيتها"], "h": "راجع: ص٨٥٥"}, {"t": "fill", "d": 2, "q": "السبب الرابع: أن المدح يدل على جشمة الممدوح، واضطرار المادح إلى إطلاق اللسان بالثناء عليه، إما عن طوع، وإما عن قهر، فإن الجشمة أيضا لذيذة، لما فيها من القهر ____، وهذه اللذة تحصل وإن كان", "o": ["والقدرة", "مترددا", "الواقعة", "قميصها"], "h": "راجع: ص٨٣٥"}]}, {"t": "كتاب ذم الجاه والرياء - القسم ٣ من ٧", "b": [{"story": ["كتاب ذم الجاه والرياء (١٣ من ٤١)، ص٨٣٩", ["حاشية: (١) في الأصل: (الخلق).", "حاشية: (٢) البيت للمتنبي، وهو في ديوانه ٣/ ٣٤١.", "وإن كنت خاليا عن الصفة التي مدحت بها ففرحك بالمدح غاية الجنون، ومثلك مثال من قيل له: ما أطيب ريح عذرتك(١) ففرح بذلك(٢).", "فإذا إن صدق المادح، فليكن فرحك بصفتك التي هي من فضل الله عليك، وإن كذب فينبغي أن يغمك ذلك.", "وأما السبب الثاني: وهو دلالة المدح على تسخير قلب المادح، وكونه سببا لتسخير قلب آخر، فهذا يرجع إلى حب الجاه والمنزلة في القلوب، وقد سبق ذكر معالجته، وذلك بقطع الطمع وطلب المنزلة عند الله، وبأن تعلم أن طلبك المنزلة في قلوب الناس يسقط منزلتك عند الله، فكيف تفرح؟", "وأما السبب الثالث: وهو الحشمة التي اضطرت المادح إلى المدح، فهو يرجع إلى قدرة عارضة لا ثبات لها، ولا تستحق الفرح، بل ينبغي أن يغمك مدح المادح وتكرهه؛ لأن آفة المدح على الممدوح عظيمة، كما ذكرنا في كتاب آفات اللسان، وكان السلف ينفرون من المدح، ويغضبون على المادح.", "حاشية: (١) العذرة: الغائط.", "حاشية: (٢) ليست في (ف).", "**بيان**", "**علاج كراهية الذم**", "قد سبق أن العلة في كراهية الذم، هي ضد العلة في حب المدح، فعلاجه يفهم من ذلك، والقول الوجيز فيه، أن من ذمك لا يخلو من (١-١)ثلاثة أحوال(١-١):", "١ ـ أن يكون قد صدق فيما قال، وقصد النصح والشفقة، فينبغي أن تتقلد منته، ولا تغضب، فإن من أهدى(٢) إليك عيوبك فقد حذرك المهالك، ثم اشتغل بإزالة ما ذمك به.", "٢ ـ وإن كان قصده العيب فقد جنى هو على دينه، وانتفعت أنت بقوله؛ لأنه قد عرفك ما لم تعرف، وأذكرك من خطاياك(٣) ما نسيت.", "٣ ـ وإن افترى عليك ما أنت منه بريء، فينبغي أن تفكر في ثلاثة أشياء:", "أحدها: أنك إن خلوت من ذلك العيب، فما تخلو من أمثاله، وما ستر الله من عيوبك أكثر، فاشكر الله إذ لم يطلعه على عيوبك، ودفعه عنك بذكر ما أنت بريء منه.", "والثاني: أن ذلك كفارات لذنوبك.", "والثالث: أنه جنى على دينه، وتعرض لغضب الله، فينبغي أن تسأل الله العفو عنه، لئلا تكون عونا للشيطان عليه.", "وقد روينا أن رجلا شج رأس إبراهيم بن أدهم، فدعى له بالمغفرة، وقال: صرت مأجورا بسببه، فلا أجعله معاقبا بسببي.", "حاشية: (١-١) ليست في النسخ، و استدركت من الإحياء.", "حاشية: (٢) تحرفت في (ف) إلى: (اهتدى).", "حاشية: (٣) في الأصل: (خطأك).", "**بيان اختلاف أحوال الناس في الذم والمدح**", "عموم الناس على حب المدح وكراهة الذم، إلا أن أرباب الرياضة نظروا في العواقب، فقدموا مصالح دينهم على أغراض نفوسهم، فصاروا يكرهون المدح، لما يخافون من عاقبته، ويؤثرون الذم لتنبههم به على عيوبهم، وهذه كراهة إيمان، وإيثار إيمان، والطبع عن ذلك بمعزل، وربما صعدت الرياضة بصاحبه(١) إلى أن يوافق الطبع على ما ليس من عادته، كما قال بعضهم: دافعت الشهوات، حتى صارت شهوتي المدافعة.", "حاشية: (١) أي: بصاحب الطبع."]], "ic": "book"}, {"story": ["كتاب ذم الجاه والرياء (١٤ من ٤١)، ص٨٤٣", ["**الشطر الثاني من الكتاب**", "**في طلب الجاه والمنزلة بالعبادات وهو الرياء**", "وفيه: بيان ذم الرياء، وبيان حقيقة الرياء، وما يراءى به، وبيان درجات الرياء، وبيان الرياء الخفي، وبيان ما يحبط العمل من الرياء وما لا يحبط، وبيان دواء الرياء وعلاجه، وبيان الرخصة في إظهار الطاعات، (١-١)وبيان الرخصة في كتمان الذنوب، وبيان ترك الطاعات(١-١) خوفا من الرياء والآفات، وبيان ما يصح من نشاط العبد للعبادة بسبب رؤية الخلق، وبيان ما يجب على المريد أن يلزمه قلبه قبل الطاعة وبعدها، وهي عشرة فصول.", "حاشية: (١-١) سقط من (ف).", "**بيان**", "**ذم الرياء**", "اعلم أن الرياء حرام، والمرائي عند الله ممقوت، وقد شهد بذلك الآيات والأخبار.", "فمن الآيات: قوله تعالى: ﴿فَوَيْلٌ لِّلْمُصَلِّينَ ٱلَّذِينَ هُمْ عَن صَلَاتِهِمْ سَاهُونَ ٱلَّذِينَ هُمْ يُرَآءُونَ﴾ [الماعون: ٣-٦]. وقوله: ﴿فَمَن كَانَ يَرْجُوا۟ لِقَآءَ رَبِّهِۦ فَلْيَعْمَلْ عَمَلًا صَٰلِحًا وَلَا يُشْرِكْ بِعِبَادَةِ رَبِّهِۦٓ أَحَدًۢا﴾ [الكهف: ١١٠].", "ومن الأخبار: ما أخبرنا به ابن الحصين، قال: أخبرنا ابن المذهب، قال: أخبرنا أحمد بن جعفر، قال: حدثنا عبد الله بن أحمد، قال: حدثني أبي، قال: حدثنا حجاج، عن ابن جريج، قال: حدثني يونس بن يوسف، عن سليمان بن يسار، قال: تفرج الناس عن أبي هريرة، فقال له ناتل(١) الشامي: أيها الشيخ، حدثنا حديثا سمعته من رسول الله ﷺ، (٢-٢)فقال: سمعت رسول الله ﷺ يقول(٢-٢): «إن أول الناس يقضى فيه يوم القيامة ثلاثة: رجل استشهد، فأتي به، فعرفه نعمه، فعرفها، فقال: فما عملت فيها؟ قال: قاتلت فيك حتى قتلت. قال: كذبت، ولكنك قاتلت ليقال: هو جريء، فقد قيل. ثم أمر به فسحب على وجهه حتى ألقي في النار. ورجل تعلم العلم وعلمه، وقرأ القرآن، فأتي به، فعرفه نعمه، فعرفها، فقال: ما عملت فيها؟ قال: تعلمت فيك العلم وعلمته، وقرأت فيك القرآن. فقال: كذبت، ولكنك تعلمت ليقال: هو عالم، فقد قيل، وقرأت القرآن ليقال: هو قارئ، فقد قيل. ثم أمر به فسحب على وجهه حتى ألقي في النار. ورجل وسع الله", "حاشية: (١) تصحف في النسخ إلى (نايل)، وهو ناتل بن زيد بن قيس الشامي. تهذيب الكمال ٢٩/ ٢٥٠.", "حاشية: (٢-٢) سقط من (ف).", "عليه، وأعطاه من أصناف المال كله، فأتي به، فعرفه نعمه فعرفها، فقال: ما عملت فيها؟ فقال: ما تركت من سبيل تحب أن ينفق فيها إلا أنفقت فيها لك. قال: كذبت، ولكنك فعلت ليقال: هو جواد، فقد قيل. ثم أمر به فسحب على وجهه حتى ألقي في النار»(١). انفرد بإخراجه مسلم.", "وفي أفراده من حديث أبي هريرة أيضا، عن النبي ﷺ، يرويه عن ربه عز وجل، أنه قال: «أنا خير الشركاء، فمن عمل عملا فأشرك فيه غيري، فأنا بريء منه، وهو للذي أشرك»(٢)."]], "ic": "book"}, {"story": ["كتاب ذم الجاه والرياء (١٥ من ٤١)، ص٨٤٥", ["أخبرنا هبة الله بن محمد، قال: أخبرنا الحسن بن علي التميمي، قال: أخبرنا أبو بكر بن مالك، قال: حدثنا عبد الله بن أحمد، قال: حدثني أبي، قال: حدثنا يونس، قال: حدثنا ليث، عن يزيد ـ يعني ابن الهاد(٣) ـ عن عمرو، عن محمود بن لبيد، أن رسول الله ﷺ قال: إن أخوف ما أخاف عليكم الشرك الأصغر. قالوا: وما الشرك الأصغر؟ قال: «الرياء، يقول الله عز وجل لهم يوم القيامة إذا جزي الناس بأعمالهم: اذهبوا إلى الذين كنتم تراؤون في الدنيا، فانظروا هل تجدون عندهم جزاء»(٤).", "وقال أبو العالية: قال لي أصحاب رسول الله ﷺ: لا تعمل لغير الله، فيكلك الله إلى من عملت له.", "وقال الربيع بن خثيم: كل ما لم يرد به وجه الله عز وجل يضمحل فيذهب.", "وقال سفيان بن عيينة: من تزين للناس بشيء يعلم الله منه غيره شانه الله.", "حاشية: (١) أخرجه أحمد (٨٢٧٧)، ومسلم (١٩٠٥)، والنسائي في الكبرى (٤٣٣٠) و(١١٤٩٥).", "حاشية: (٢) أخرجه أحمد (٧٩٩٩) بهذا اللفظ، ومسلم (٢٩٨٥)، وابن خزيمة (٩٣٨)، وابن حبان (٣٩٥)، والطيالسي (٢٥٥٩)، وابن ماجه (٤٢٠٢)، والبيهقي في الشعب (٦٨١٦).", "حاشية: (٣) تحرف في (ف) إلى: (العاد).", "حاشية: (٤) أخرجه أحمد (٢٣٦٣٠) و(٢٣٦٣١) و(٢٣٦٣٦)، والبغوي في شرح السنة (٤١٣٥) وابن أبي شيبة ٢/ ٤٨١، وابن خزيمة (٩٣٧).", "وقال بشر الحافي: لأن أطلب الدنيا بمزمار أحب إلي من أن أطلبها بالدين.", "أخبرنا أبو منصور القزاز، قال: أخبرنا أبو بكر أحمد بن علي، قال: حدثني علي بن أبي علي المعدل، قال: حدثنا أبو بكر ابن أبي موسى القاضي، وأبو إسحاق الطبري، وغيرهما، قالوا: سمعنا أبا جعفر عبد الله بن إسماعيل بن بريه يقول: رأيت أبا بكر الأدمي القارئ في النوم بعد موته يمد يده، فقلت له: ما فعل الله بك؟ فقال: وقفني بين يديه، وقاسيت شدائد وأمورا صعبة. فقلت له: فتلك الليالي والمواقف والقرآن؟ فقال: ما كان شيء أضر علي منها؛ لأنها كانت للدنيا. فقلت له: فإلى أي شيء انتهى أمرك(١)؟ قال: قال لي تعالى: آليت على نفسي أن لا أعذب أبناء الثمانين.", "حاشية: (١) سقطت من (ف).", "**بيان**", "**حقيقة الرياء وما يراءى به**", "اعلم أن الرياء مشتق من الرؤية، والسمعة مشتقة من السماع، فالمرائي يري الناس ما يطلب به الحظوة عندهم.", "ويجمع ذلك خمسة أقسام، هي مجامع ما يتزين به العبد للناس: البدن، والزي، والقول، والعمل، والأتباع والأشياء الخارجة.", "وأهل الدنيا يراؤون بهذه الخمس، إلا أن طلب الجاه وقصد الرياء بأعمال ليست من جملة الطاعات أهون من الرياء بالطاعات."]], "ic": "book"}, {"story": ["كتاب ذم الجاه والرياء (١٦ من ٤١)، ص٨٤٧", ["**القسم الأول**: الرياء في الدين من جهة البدن، بإظهار النحول والصفار(١)، ليريهم بذلك شدة الاجتهاد، وغلبة خوف الآخرة، وليدل بالنحول على قلة الأكل، وبالصفار على سهر الليل، وكثرة الاجتهاد، وكذلك يرائي بشعث الشعر، ليدل به على استغراق الهم بالدين، وعدم التفرغ لتسريح الشعر، فهذه الأسباب إذا ظهرت استدل الناس بها على هذه الأمور، فارتاحت النفس لمعرفتهم، فالنفس تدعو إلى إظهارها لتنال تلك الراحة.", "ويقرب من هذا خفض الصوت، وإغارة العينين، وذبول الشفتين، ليستدل بذلك على أنه مواظب على الصوم، وأن توقير الشرع هو الذي خفض من صوته، وشدة الجوع هي التي وهنت قواه، ولهذا قال عيسى عليه السلام: إذا صام أحدكم فليدهن رأسه ويرجل شعره(٢) وذلك لما يخاف على الصائم من آفات الرياء، فهذه مراءاة أهل الدين بالبدن.", "حاشية: (١) تحرف في (ف) إلى: (الصفات).", "حاشية: (٢) الزهد لأحمد ص: ٧٤.", "وأما أهل الدنيا فيراؤون بإظهار السمن، وصفاء اللون، واعتدال القامة، وحسن الوجه، ونظافة البدن.", "**القسم الثاني**: الرياء بالزي والهيئة؛
