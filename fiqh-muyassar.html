م والليلة.. الحديث»، وحديث أنس ﷺ في قصة الرجل من أهل بادية، وقوله للنبي ﷺ: وزعم رسولك أن علينا خمس صلوات في يومنا وليلتنا. قال ﷺ: «صدق».. الحديث."]], "ic": "book"}, {"story": ["المسألة الثانية: على من تجب؟", ["تجب على المسلم البالغ العاقل، غير الحائض والنفساء، ويؤمر بها الصبي إذا بلغ سبع سنين، ويضرب عليها لعشر؛ لحديث: «رفع القلم عن ثلاثة»، فذكر منها: «وعن الصبي حتى يحتلم»، ولقوله ﷺ: «مروا أولادكم بالصلاة لسبع، واضربوهم عليها لعشر، وفرقوا بينهم في المضاجع»."]], "ic": "scroll"}, {"note": "حاشية (ص72): المقصود بالحائض: التي بلغت سن التكليف."}, {"story": ["المسألة الثالثة: في شروطها", ["وشروطها تسعة:", "1- الإسلام: فلا تصح من كافر؛ لبطلان عمله.", "2- العقل: فلا تصح من مجنون؛ لعدم تكليفه.", "3- البلوغ: فلا تجب على الصبي حتى يبلغ، ولكن يؤمر بها لسبع، ويضرب عليها لعشر؛ لحديث: «مروا أولادكم بالصلاة لسبع...» الحديث.", "4- الطهارة من الحدثين مع القدرة: لقوله ﷺ في حديث ابن عمر: «لا يقبل الله صلاة بغير طهور».", "5- دخول الوقت للصلاة الموقتة: لقوله تعالى: ﴿إن الصلاة كانت على المؤمنين كتابا موقوتا﴾ [النساء: 103]، ولحديث جبريل حين أم النبي ﷺ بالصلوات الخمس، ثم قال: «ما بين هذين الوقتين وقت». فلا تصح الصلاة قبل دخول وقتها، ولا بعد خروجه، إلا لعذر.", "6- ستر العورة مع القدرة بشيء لا يصف البشرة: لقوله تعالى: ﴿يا بني آدم خذوا زينتكم عند كل مسجد﴾ [الأعراف: 31]. وقوله ﷺ: «لا يقبل الله صلاة حائض إلا بخمار». وعورة الرجل البالغ ما بين السرة والركبة لقوله ﷺ لجابر: «إذا صليت في ثوب واحد، فإن كان واسعا فالتحف به، وإن كان ضيقا فاتزر به». والأولى والأفضل أن لا يجعل على عاتقه شيئا من الثياب؛ لأن النبي ﷺ نهى الرجل أن يصلي في الثوب ليس على عاتقه منه شيء. والمرأة كلها عورة إلا وجهها وكفيها، إلا إذا صلت أمام الأجانب -أي في غير المحارم- فإنها تغطى كل شيء؛ لقوله ﷺ: «المرأة عورة»، وقوله ﷺ: «لا يقبل الله صلاة حائض إلا بخمار».", "7- اجتناب النجاسة في بدنه وثوبه وبقعته -أي مكان صلاته- مع القدرة: لقوله تعالى: ﴿وثيابك فطهر﴾ [المدثر: 4]. وقوله ﷺ: «تنزهوا من البول فإن عامة عذاب القبر منه»، ولقوله ﷺ لأسماء في دم الحيض يصيب الثوب: «تحته، ثم تقرصه بالماء، ثم تنضحه، ثم تصلي فيه»، لقوله ﷺ لأصحابه وقد بال الأعرابي في المسجد: «أريقوا على بوله سجلا من ماء».", "8- استقبال القبلة، مع القدرة: لقوله تعالى: ﴿فول وجهك شطر المسجد الحرام﴾ [البقرة: 144]، ولحديث: «إذا قمت إلى الصلاة، فأسبغ الوضوء، ثم استقبل القبلة».", "9- النية: ولا تسقط بحال؛ لحديث عمر: «إنما الأعمال بالنيات». ومحلها القلب، وحقيقتها العزم على الشيء. ولا يشرع التلفظ بها؛ لأن النبي ﷺ لم يتلفظ بها، ولم يرد أن أحدا من أصحابه فعل ذلك."]], "ic": "scroll"}, {"note": "حاشية (ص71): الشروط: وهي التي يتوقف عليها صحة الصلاة. حاشية (ص72): الحدثين: الأكبر والأصغر."}, {"story": ["المسألة الرابعة: في أركانها", ["الأركان: هي ما تتكون منها العبادات، ولا تصح العبادة إلا بها. والفرق بينها وبين الشروط: أن الشرط يتقدم على العبادة، ويستمر معها، وأما الأركان: فهي التي تشتمل عليها العبادة من أقوال وأفعال.", "وأركانها أربعة عشر ركنا، لا تسقط عمدا، ولا سهوا، ولا جهلا. وبيانها كما يلي:", "1- القيام في الفرض على القادر منتصبا: لقوله تعالى: ﴿وقوموا لله قانتين﴾ [البقرة: 238]، ولقوله ﷺ لعمران بن حصين: «صل قائما، فإن لم تستطع فقاعدا، فإن لم تستطع فعلى جنب». فإن ترك القيام في الفريضة لعذر، كمرض وخوف وغير ذلك، فإنه يعذر بذلك، ويصلي حسب حاله قاعدا أو على جنب.", "أما صلاة النافلة: فإن القيام فيها سنة وليس ركنا، لكن صلاة القائم فيها أفضل من صلاة القاعد؛ لقوله ﷺ: «صلاة القاعد على النصف من صلاة القائم».", "2- تكبيرة الإحرام في أولها: وهي قول (الله أكبر) لا يجزئه غيرها؛ لقوله ﷺ للمسيء صلاته: «إذا قمت إلى الصلاة فكبر»، وقوله ﷺ: «تحريمها التكبير، وتحليلها التسليم»، فلا تنعقد الصلاة بدون التكبير.", "3- قراءة الفاتحة مرتبة في كل ركعة: لقوله ﷺ: «لا صلاة لمن لم يقرأ بفاتحة الكتاب». ويستثنى من ذلك المسبوق: إذا أدرك الإمام راكعا، أو أدرك ما لم يتمكن معه من قراءة الفاتحة، وكذا المأموم في الجهرية، يستثنى من قراءتها، لكن لو قرأها في سكتات الإمام فإن ذلك أولى؛ أخذا بالأحوط.", "4- الركوع في كل ركعة: لقوله تعالى: ﴿يا أيها الذين آمنوا اركعوا واسجدوا﴾ [الحج: 77]. ولقوله ﷺ للمسيء صلاته: «ثم اركع حتى تطمئن راكعا».", "5، 6- الرفع من الركوع والاعتدال منه قائما: لقوله ﷺ في حديث المسيء: «واركع حتى تطمئن راكعا، ثم ارفع حتى تعتدل قائما».", "7- السجود: لقوله تعالى: ﴿واسجدوا﴾ [الحج: 77]، ولقوله ﷺ في حديث المسيء: «ثم اسجد حتى تطمئن ساجدا». ويكون السجود في كل ركعة مرتين على الأعضاء السبعة المذكورة في حديث ابن عباس. وفيه: «أمرت أن أسجد على سبعة أعظم: الجبهة -وأشار بيده على أنفه- واليدين والركبتين، وأطراف القدمين».", "8، 9- الرفع من السجود والجلوس بين السجدتين: لقوله للمسيء: «ثم ارفع حتى تطمئن جالسا».", "10- الطمأنينة في جميع الأركان: وهي السكون، وتكون بقدر القول الواجب في كل ركن؛ لأمره ﷺ المسيء بها في صلاته في جميع الأركان، ولأمره له بإعادة الصلاة لتركه الطمأنينة فيها.", "11- التشهد الأخير: لقول ابن مسعود ﷺ: «كنا نقول قبل أن يفرض التشهد: السلام على الله من عباده». فقال النبي ﷺ: «لا تقولوا السلام على الله، ولكن قولوا: التحيات لله». فدل قوله ﷺ: «قبل أن يفرض» على أنه فرض.", "12- الجلوس للتشهد الأخير: لأنه ﷺ فعله، وداوم عليه، وقال: «صلوا كما رأيتموني أصلي».", "13- التسليم: لقوله ﷺ: «وتحليلها التسليم»، فيقول عن يمينه: السلام عليكم ورحمة الله، وعن يساره: السلام عليكم ورحمة الله.", "14- ترتيب الأركان على ما تقدم بيانه: لأن النبي ﷺ فعلها مرتبة، وقال: صلوا كما رأيتموني أصلي، وعلمها المسيء في صلاته بقوله: «ثم» التي تدل على الترتيب."]], "ic": "scroll"}, {"story": ["المسألة الخامسة: في واجباتها", ["وواجباتها ثمانية، تبطل الصلاة بتركها عمدا، وتسقط سهوا وجهلا، ويجب سهو عنها سجود السهو. والفرق بينها وبين الأركان: أن من نسي ركنا لم تصح صلاته إلا بالإتيان به، أما من نسي واجبا أجزأ عنه سجود السهو، فالأركان أوكد من الواجبات. وبيانها على النحو الآتي:", "1- جميع التكبيرات غير تكبيرة الإحرام: وهو ما يسمى بتكبير الانتقال. لقول ابن مسعود: «رأيت النبي ﷺ يكبر في كل رفع وخفض، وقيام وقعود»، فقد واظب النبي ﷺ عليه إلى أن مات، وقد قال ﷺ: «صلوا كما رأيتموني أصلي».", "2- قول: «سمع الله لمن حمده» للإمام والمنفرد، لحديث أبي هريرة: «كان رسول الله ﷺ يكبر حين يقوم، إلى الصلاة، ثم يكبر حين يركع، ثم يقول: سمع الله لمن حمده، حين يرفع صلبه من الركعة، ثم يقول وهو قائم: ربنا لك الحمد».", "3- قول: «ربنا لك الحمد» للمأموم فقط، أما الإمام والمنفرد فيسن لهما الجمع بينهما؛ لحديث أبي هريرة المتقدم، ولحديث أبي موسى وفيه: «وإذا قال: سمع الله لمن حمده، فقولوا: ربنا لك الحمد».", "4- قول: «سبحان ربي العظيم» مرة في الركوع.", "5- قول: «سبحان ربي الأعلى» مرة في السجود. لقول حذيفة في حديثه: «كان -يعني النبي ﷺ- يقول في ركوعه: سبحان ربي العظيم. وفي سجوده: سبحان ربي الأعلى». ويسن الزيادة في التسبيح في السجود والركوع إلى ثلاث.", "6- قول: «رب اغفر لي» بين السجدتين: لحديث حذيفة: أن النبي ﷺ كان يقول بين السجدتين: «رب اغفر لي. رب اغفر لي».", "7- التشهد الأول على غير من قام إمامه سهوا، فإنه لا يجب عليه لوجوب متابعته؛ لأن النبي ﷺ لما نسي التشهد الأول لم يعد إليه، وجبره بسجود السهو. والتشهد الأول هو: «التحيات لله والصلوات والطيبات، السلام عليك أيها النبي ورحمة الله وبركاته، السلام علينا وعلى عباد الله الصالحين، أشهد أن لا إله إلا الله وأشهد أن محمدا عبده ورسوله».", "8- الجلوس له -أي للتشهد الأول- لحديث ابن مسعود مرفوعا: «إذا قعدتم في كل ركعتين، فقولوا: التحيات لله». ولحديث رفاعة بن رافع: «فإذا جلست في وسط الصلاة فاطمئن، وافترش فخذك اليسرى ثم تشهد»."]], "ic": "scroll"}, {"story": ["المسألة السادسة: في سننها", ["وهي نوعان: سنن أفعال وسنن أقوال.", "أما سنن الأفعال: فكرفع اليدين مع تكبيرة الإحرام وعند الركوع وعند الرفع منه وحطهما عقب ذلك؛ لأن مالك بن الحويرث كان إذا صلى كبر، ورفع يديه، وإذا أراد أن يركع رفع يديه، وإذا رفع رأسه من الركوع رفع يديه.", "وحدث أن رسول الله ﷺ صنع ذلك. ووضع اليمين على الشمال وجعلهما على صدره حال قيامه، ونظره في موضع سجوده، وتفرقته بين قدميه قائما، وقبض ركبتيه بيديه مفرجتي الأصابع في ركوعه، ومد ظهره فيه، وجعل رأسه حياله.", "وأما سنن الأقوال: فكدعاء الاستفتاح، والبسملة، والتعوذ، وقول: آمين، والزيادة على قراءة الفاتحة، والزيادة على تسبيح الركوع والسجود، والدعاء بعد التشهد قبل السلام."]], "ic": "scroll"}, {"story": ["المسألة السابعة: مبطلاتها", ["يبطل الصلاة أمور نجملها فيما يأتي:", "1- يبطل الصلاة ما يبطل الطهارة: لأن الطهارة شرط لصحتها، فإذا بطلت الطهارة بطلت الصلاة.", "2- الضحك بصوت: وهو القهقهة، فإنه يبطلها بالإجماع؛ لأنه كالكلام، بل أشد، ولما في ذلك من الاستخفاف والتلاعب المنافي لمقصود الصلاة. أما التبسم بلا قهقهة فإنه لا يبطلها، كما نقله ابن المنذر وغيره.", "3- الكلام عمدا لغير مصلحة الصلاة: فعن زيد بن أرقم ﷺ قال: كنا نتكلم في الصلاة يكلم الرجل صاحبه وهو إلى جنبه في الصلاة حتى نزلت: ﴿وقوموا لله قانتين﴾ [البقرة: 238]. فأمرنا بالسكوت، ونهينا عن الكلام. فإن تكلم جاهلا أو ناسيا، لا تبطل صلاته.", "4- مرور المرأة البالغة، أو الحمار، أو الكلب الأسود بين يدي المصلي دون موضع سجوده: لقوله ﷺ: «إذا قام أحدكم يصلي، فإنه يستره إذا كان بين يديه مثل آخرة الرحل، فإذا لم يكن بين يديه مثل آخرة الرحل، فإنه يقطع صلاته الحمار، والمرأة، والكلب الأسود». والرحل: هو ما يركب عليه الإبل، وهو كالسرج للفرس، ومؤخرة الرحل مقدارها ذراع، فيكون هذا المقدار هو المجزئ في السترة.", "5- كشف العورة عمدا: لما تقدم في الشروط.", "6- استدبار القبلة: لأن استقبالها شرط لصحة الصلاة.", "7- اتصال النجاسة بالمصلي، مع العلم بها، وتذكرها إذا لم يزلها في الحال.", "8- ترك ركن من أركانها أو شرط من شروطها عمدا بدون عذر.", "9- العمل الكثير من غير جنسها لغير ضرورة، كالأكل والشرب عمدا.", "10- الاستناد لغير عذر: لأن القيام شرط لصحتها.", "11- تعمد زيادة ركن فعلي كالزيادة في الركوع والسجود؛ لأنه يخل بهيئتها، فتبطل إجماعا.", "12- تعمد تقديم بعض الأركان على بعض: لأن ترتيبها ركن، كما تقدم.", "13- تعمد السلام قبل إتمامها.", "14- تعمد إحالة المعنى في القراءة، أي قراءة الفاتحة؛ لأنها ركن.", "15- فسخ النية بالتردد بالفسخ، وبالعزم عليه؛ لأن استدامة النية شرط."]], "ic": "scroll"}, {"story": ["المسألة الثامنة: ما يكره في الصلاة", ["يكره في الصلاة الأمور التالية:", "1- الاقتصار على الفاتحة في الركعتين الأوليين، لمخالفة ذلك لسنة النبي ﷺ وهديه في الصلاة.", "2- تكرار الفاتحة: لمخالفة ذلك -أيضا- لسنة النبي ﷺ، لكن إن كررها لحاجة، كأن يكون فاته الخشوع وحضور القلب عند قراءتها، فأراد تكرارها ليحضر قلبه، فلا بأس بذلك، لكن بشرط ألا يجره ذلك إلى الوسواس.", "3- يكره الالتفات اليسير في الصلاة بلا حاجة: لقوله ﷺ حين سئل عن الالتفات في الصلاة؟ فقال: «هو اختلاس يختلسه الشيطان من صلاة العبد». والاختلاس: السرقة والنهب.", "أما إذا كان الالتفات لحاجة فلا بأس به، كمن احتاج إلى أن يتفل عن يساره في الصلاة ثلاثا إذا أصابه الوسواس، فهذا التفات لحاجة، أمر به النبي ﷺ، وكمن خافت على صبيها الضياع، فصارت تلتفت في الصلاة؛ ملاحظة له.", "هذا كله في الالتفات اليسير، أما إذا التفت الشخص بكليته أو استدبر القبلة، فإنه تبطل صلاته، إذا كان ذلك بغير عذر من شدة خوف ونحوه.", "4- تغميض العينين في الصلاة: لأن ذلك يشبه فعل المجوس عند عباداتهم النيران. وقيل: يشبه فعل اليهود أيضا، وقد نهينا عن التشبه بالكفار.", "5- افتراش الذراعين في السجود: لقوله ﷺ: «اعتدلوا في السجود، ولا يبسط أحدكم ذراعيه انبساط الكلب». فينبغي للمصلي أن يجافي بين ذراعيه، ويرفعهما عن الأرض، ولا يتشبه بالحيوان.", "6- كثرة العبث في الصلاة: لما فيه من انشغال القلب المنافي للخشوع المطلوب في الصلاة.", "7- التخصر: لحديث أبي هريرة ﷺ: «نهي أن يصلي الرجل مختصرا». والتخصر والاختصار في الصلاة: وضع الرجل يده على الخصر والخاصرة، وهي وسط الإنسان المستدق فوق الوركين. وقد عللت عائشة رضي الله تعالى عنها الكراهة: بأن اليهود تفعله.", "8- السدل وتغطية الفم في الصلاة: لحديث أبي هريرة ﷺ قال: «نهى رسول الله ﷺ عن السدل في الصلاة وأن يغطي الرجل فاه». والسدل: أن يطرح المصلي الثوب على كتفيه، ولا يرد طرفيه على الكتفين. وقيل: إرسال الثوب حتى يصيب الأرض، فيكون بمعنى الإسبال.", "9- مسابقة الإمام: لقوله ﷺ: «أما يخشى أحدكم إذا رفع رأسه قبل الإمام أن يجعل الله رأسه رأس حمار، أو يجعل صورته صورة حمار».", "10- تشبيك الأصابع: لنهيه ﷺ من توضأ وأتى المسجد يريد الصلاة عن فعل ذلك، فكراهته في الصلاة من باب أولى. والتشبيك بين الأصابع: إدخال بعضها في بعض. أما التشبيك خارج الصلاة فلا كراهة فيه، ولو كان في المسجد، ولكن لفعله ﷺ إياه في قصة ذي اليدين.", "11- كف الشعر والثوب: لحديث ابن عباس ﷺ قال: «أمر النبي ﷺ أن يسجد على سبعة أعظم، ولا يكف ثوبه ولا شعره». والكف: قد يكون بمعنى الجمع، أي: لا يجمعهما ويضمهما، وقد يكون بمعنى المنع، أي: لا يمنعهما من الاسترسال حال السجود. وكله من العبث المنافي للخشوع في الصلاة.", "12- الصلاة بحضرة الطعام، أو وهو يدافع الأخبثين: لقوله ﷺ: «لا صلاة بحضرة الطعام، ولا وهو يدافعه الأخبثان». أما كراهة الصلاة بحضرة الطعام: فذلك مشروط بتوقان نفسه إليه ورغبته فيه، مع قدرته على تناوله، وكونه حاضرا بين يديه. فلو كان الطعام حاضرا، لكنه صائم، أو شبعان لا يشتهيه، أو لا يستطيع تناوله لشدة حرارته، ففي ذلك كله لا يكره له الصلاة بحضرته. وأما الأخبثان: فهما البول والغائط. وقد نهي عن ذلك كله؛ لما فيه من انشغال قلب مصلي، وتشتت فكره، مما ينافي الخشوع في الصلاة. وقد يتضرر بحبس بول وغائط ومدافعتهما.", "13- رفع البصر إلى السماء: لقوله ﷺ: «لينتهين أقوام يرفعون أبصارهم إلى السماء في الصلاة، أو لتخطفن أبصارهم»."]], "ic": "scroll"}, {"note": "حاشية (ص79): الكراهة في اصطلاح الفقهاء: هو النهي عن الشيء من غير إلزام بالترك. وحكم المكروه: أنه يثاب تاركه امتثالا، ولا يعاقب فاعله، ويجوز فعله عند الحاجة من غير اضطرار."}, {"story": ["المسألة التاسعة: حكم تارك الصلاة", ["من ترك الصلاة جاحدا لوجوبها، فهو كافر مرتد، لأنه مكذب لله ورسوله وإجماع المسلمين.", "أما من تركها تهاونا وكسلا: فالصحيح أنه كافر إذا كان تاركا لها دائما وبالكلية، لقوله تعالى عن المشركين: ﴿فإن تابوا وأقاموا الصلاة وآتوا الزكاة فإخوانكم في الدين﴾ [التوبة: 11]. فدل على أنهم إن لم يحققوا شرط إقامة الصلاة فليسوا بمسلمين، ولا إخوة لنا في الدين. ولقوله ﷺ: «العهد الذي بيننا وبينهم الصلاة، فمن تركها فقد كفر». وقوله ﷺ: «إن بين الرجل وبين الشرك والكفر ترك الصلاة».", "أما من كان يصلي أحيانا ويترك أحيانا، أو يصلي فرضا أو فرضين، فالظاهر أنه لا يكفر؛ لأنه لم يتركها بالكلية، كما هو نص الحديث: «ترك الصلاة» فهذا ترك (صلاة) لا (الصلاة). والأصل بقاء الإسلام، فلا نخرجه منه إلا بيقين، فما ثبت بيقين لا يرتفع إلا بيقين."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "عدد الصلوات المكتوبة:", "o": ["خمس", "ست", "سبع", "ثلاث"], "h": "راجع: ص71 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "الصبي يؤمر بالصلاة إذا بلغ:", "o": ["سبع سنين", "خمس سنين", "عشر سنين", "ثلاث سنين"], "h": "راجع: ص71 (المسألة الثانية)"}, {"t": "mcq", "d": 1, "q": "كم شروط الصلاة كما في الكتاب؟", "o": ["تسعة", "سبعة", "أربعة عشر", "ثمانية"], "h": "راجع: ص71 (المسألة الثالثة)"}, {"t": "order", "d": 2, "q": "رتب أول أربعة شروط للصلاة كما وردت:", "o": ["الإسلام", "العقل", "البلوغ", "الطهارة من الحدثين"], "h": "راجع: ص71-72 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «لا يقبل الله صلاة ____ إلا بخمار».", "o": ["حائض", "صبي", "مسافر", "مريض"], "h": "راجع: ص72 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "عورة الرجل البالغ في الصلاة:", "o": ["ما بين السرة والركبة", "ما بين الصدر والركبة", "الفخذان فقط", "السوأتان فقط"], ي أحيانا ويترك أحيانا:", "o": ["الظاهر أنه لا يكفر", "كافر", "مرتد", "يستتاب"], "h": "راجع: ص82 (المسألة التاسعة)"}]}], "sum": [["في عدد الصلوات المكتوبة", "ص71-82"], ["على من تجب؟", "ص71-82"], ["في شروطها", "ص71-82"], ["في أركانها", "ص71-82"]]}, {"id": "l17", "title": "الباب الخامس: في صلاة التطوع", "group": "الكتاب الثاني: الصلاة", "map": {"center": "الباب الخامس\nالصلاة", "nodes": [{"t": "المراد بالتطوع", "s": []}, {"t": "فضلها، والحكمة من مشروعيتها", "s": []}, {"t": "في أقسامها", "s": []}, {"t": "ما تسن له الجماعة من صلاة التطوع", "s": []}, {"t": "في عدد الرواتب", "s": []}]}, "paras": [{"t": "الباب الخامس: في صلاة التطوع", "b": [{"pic": ["scroll", "book", "open-book"], "cap": "ص82-89"}, {"story": ["المراد بالتطوع", ["والمراد بالتطوع: كل طاعة ليست بواجبة."]], "ic": "scroll"}, {"story": ["المسألة الأولى: فضلها، والحكمة من مشروعيتها", ["1- فضلها: التطوع بالصلاة من أفضل القربات بعد الجهاد في سبيل الله وطلب العلم؛ لمداومة النبي ﷺ على التقرب إلى ربه بنوافل الصلوات، ولحديث أبي هريرة ﷺ: قال: قال رسول الله ﷺ: «إن الله تعالى قال: من عادى لي وليا فقد آذنته بالحرب، وما تقرب إلي عبدي بشيء أحب إلي مما افترضت عليه، وما يزال عبدي يتقرب إلي بالنوافل حتى أحبه...» الحديث.", "2- الحكمة من مشروعيتها: وقد شرع سبحانه التطوع رحمة بعباده، فجعل لكل فرض تطوعا من جنسه، ليزداد المؤمن إيمانا ورفعة في الدرجات بفعل هذا التطوع، ولتكمل الفرائض، وتجبر يوم القيامة بهذا التطوع؛ فإن الفرائض يعتريها النقص، كما في حديث أبي هريرة ﷺ قال: قال النبي ﷺ: «إن أول ما يحاسب به العبد المسلم يوم القيامة، الصلاة، فإن أتمها، وإلا قيل: انظروا هل له من تطوع؟ فإن كان له تطوع أكملت الفريضة من تطوعه، ثم يفعل بسائر الأعمال المفروضة مثل ذلك»."]], "ic": "scroll"}, {"story": ["المسألة الثانية: في أقسامها", ["صلاة التطوع على نوعين:", "النوع الأول: صلوات مؤقتة بأوقات معينة، وتسمى بالنوافل المقيدة، وهذه منها ما هو تابع للفرائض، كالسنن الرواتب، ومنها ما ليس تابعا كصلاة الوتر، والضحى والكسوف.", "النوع الثاني: صلوات غير مؤقتة بأوقات معينة، وتسمى بالنوافل المطلقة.", "والنوع الأول أنواع متعددة بعضها آكد من بعض، وآكد أنواعه الكسوف، ثم وتر، ثم صلاة الاستسقاء، ثم صلاة التراويح، وأما النوع الثاني فيشرع في الليل كله، وفي النهار -ما عدا أوقات النهي- وصلاة الليل أفضل من صلاة النهار."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: ما تسن له الجماعة من صلاة التطوع", ["تسن صلاة الجماعة: للتراويح، والاستسقاء، والكسوف."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: في عدد الرواتب", ["والرواتب: جمع راتبة، وهي الدائمة المستمرة، وهي التابعة للفرائض.", "وفائدة هذه الرواتب أنها تجبر الخلل والنقص الذي يقع في الفرائض، كما مضى بيانه.", "وعدد الرواتب عشر ركعات، وهي المذكورة في حديث ابن عمر: «حفظت عن رسول الله ﷺ ركعتين قبل الظهر، وركعتين بعد الظهر، وركعتين بعد الجمعة، وركعتين بعد المغرب، وركعتين بعد العشاء، وركعتين قبل الغداة، كانت ساعة لا أدخل على النبي ﷺ فيها، فحدثتني حفصة أنه كان إذا طلع الفجر، وأذن المؤذن، صلى ركعتين».", "ويتأكد للمسلم أن يحافظ على ثنتي عشرة ركعة؛ لقول النبي ﷺ: «ما من عبد مسلم يصلي لله تعالى في كل يوم ثنتي عشرة ركعة، إلا بنى الله له بيتا» -أو: «إلا بني له بيت- في الجنة».", "وهي العشر المذكورة سابقا، إلا أنه يكون قبل الظهر أربع ركعات، فقد زاد الترمذي في رواية حديث أم حبيبة الماضي: «أربعا قبل الظهر وركعتين بعدها، وركعتين بعد المغرب، وركعتين بعد العشاء، وركعتين قبل صلاة الفجر»، ولما ثبت في الصحيح من حديث عائشة ﷺ قالت: «كان النبي ﷺ لا يدع أربعا قبل الظهر».", "وآكد هذه الرواتب: ركعتا الفجر -وهما سنة الفجر القبلية- لقوله ﷺ: «ركعتا الفجر خير من الدنيا وما فيها». ولقول عائشة ﷺ عن هاتين الركعتين: «ولم يكن يدعهما أبدا»."]], "ic": "scroll"}, {"story": ["المسألة الخامسة: حكم الوتر وفضله ووقته", ["حكمه: سنة مؤكدة، حث عليه الرسول ﷺ ورغب فيه، فقال: «إن الله وتر يحب الوتر». وقال ﷺ: «يا أهل القرآن، أوتروا، فإن الله وتر، يحب الوتر».", "ووقته: ما بين صلاة العشاء وصلاة الفجر بإجماع العلماء؛ لفعله ﷺ، ولقوله: «إن الله أمدكم بصلاة هي خير لكم من حمر النعم: صلاة الوتر، ما بين صلاة العشاء إلى طلوع الفجر».", "فإذا طلع الفجر فلا وتر؛ لقوله ﷺ: «صلاة الليل مثنى مثنى، فإذا خشي أحدكم الصبح صلى ركعة واحدة توتر له ما قد صلى». فهذا دليل على خروج وقت الوتر بطلوع الفجر.", "قال الحافظ ابن حجر: «وأصرح منه -يعني في الدلالة- ما رواه أبو داود والنسائي، وصححه أبو عوانة وغيره... أن ابن عمر كان يقول: من صلى من الليل فليجعل آخر صلاته وترا؛ فإن رسول الله ﷺ كان يأمر بذلك، فإذا كان الفجر فقد ذهب كل صلاة الليل، والوتر».", "وصلاة الوتر آخر الليل أفضل منه في أوله، لكن يستحب تعجيله أول الليل لمن ظن أنه لا يقوم آخر الليل، وتأخيره لمن ظن أنه يقوم آخر الليل؛ لما رواه جابر ﷺ أن رسول الله ﷺ قال: «من خاف أن لا يقوم من آخر الليل فليوتر أوله، ومن طمع أن يقوم آخر الليل فليوتر آخر الليل، فإن صلاة آخر الليل مشهودة، وذلك أفضل»."]], "ic": "scroll"}, {"story": ["المسألة السادسة: صفة الوتر وعدد ركعاته", ["الوتر أقله ركعة واحدة؛ لحديث ابن عمر وابن عباس، مرفوعا: «الوتر ركعة من آخر الليل». ولحديث ابن عمر الماضي، قريبا: «صلى ركعة واحدة، توتر له ما قد صلى».", "ويجوز الوتر بثلاث ركعات؛ لحديث عائشة ﷺ: أن النبي ﷺ كان «يصلي أربعا، فلا تسأل عن حسنهن وطولهن، ثم يصلي أربعا، فلا تسأل عن حسنهن وطولهن، ثم يصلي ثلاثا».", "وتجوز هذه الثلاث بسلامين؛ لأن عبد الله بن عمر ﷺ: «كان يسلم من ركعتين حتى يأمر ببعض حاجته». وتجوز سردا بتشهد واحد وسلام واحد؛ لحديث عائشة ﷺ: «كان النبي ﷺ يوتر بثلاث لا يقعد إلا في آخرهن». ولا تصلى بتشهدين وسلام واحد؛ حتى لا تشبه صلاة المغرب، وقد نهى ﷺ عن ذلك.", "ويجوز الوتر بسبع ركعات وبخمس، لا يجلس إلا في آخرها؛ لحديث عائشة ﷺ: «كان رسول الله ﷺ يصلي من الليل ثلاث عشرة ركعة، يوتر من ذلك بخمس، لا يجلس في شيء إلا في آخرها». ولحديث أم سلمة ﷺ: «كان رسول الله ﷺ يوتر بسبع أو بخمس، لا يفصل بينهن بتسليم ولا كلام»."]], "ic": "scroll"}, {"story": ["المسألة السابعة: الأوقات المنهي عن النافلة فيها", ["هناك أوقات نهي عن صلاة التطوع فيها إلا ما استثني، وهي أوقات خمسة:", "الأول: من بعد صلاة الصبح حتى تطلع الشمس. لقوله ﷺ: «لا صلاة بعد صلاة الفجر حتى تطلع الشمس».", "الثاني: من طلوع الشمس حتى ترتفع قدر رمح في رأي العين، وهو قدر متر تقريبا، ويقدر بالوقت بحوالي ربع الساعة أو ثلثها. فإذا ارتفعت الشمس بعد طلوعها قدر رمح فقد انتهى وقت النهي؛ لقوله ﷺ لعمرو بن عبسة: «صل صلاة الصبح، ثم أقصر عن الصلاة حتى تطلع الشمس حتى ترتفع...» ولحديث عقبة بن عامر الآتي.", "والثالث: عند قيام الشمس حتى تزول إلى جهة الغرب ويدخل وقت الظهر؛ لحديث عقبة بن عامر: «ثلاث ساعات كان النبي ﷺ ينهانا أن نصلي فيهن، وأن نقبر فيهن موتانا: «حين تطلع الشمس بازغة حتى ترتفع، وحين يقوم قائم الظهيرة حتى تزول، وحين تضيف للغروب حتى تغرب». ومعنى تضيف للغروب: تميل للغروب.", "والرابع: من صلاة العصر إلى غروب الشمس؛ لقوله ﷺ: «لا صلاة بعد الفجر حتى تطلع الشمس، ولا صلاة بعد صلاة العصر حتى تغيب الشمس».", "والوقت الخامس: إذا شرعت في الغروب حتى تغيب كما تقدم في الحديث؛ فتكون هذه الأوقات الخمسة محصورة في ثلاثة أوقات وهي: من بعد صلاة الفجر حتى ترتفع الشمس قدر رمح، وحين يقوم قائم الظهيرة حتى تزول الشمس، ومن بعد صلاة العصر حتى يتم غروب الشمس.", "أما حكمة النهي عن الصلاة في هذه الأوقات: فقد بين النبي ﷺ أن الكفار يعبدون الشمس عند طلوعها وعند غروبها، فتكون صلاة المسلم في تلك الأوقات فيها مشابهة لهم؛ ففي حديث عمرو بن عبسة: «فإنها -أي الشمس- تطلع حين تطلع بين قرني شيطان، وحينئذ يسجد لها الكفار... فإنها تغرب حين تغرب بين قرني شيطان، وحينئذ يسجد لها الكفار».", "هذا عن وقت طلوع الشمس ووقت غروبها، وأما عن وقت ارتفاعها وقيام قائم الظهيرة، فقد بين ﷺ علة النهي في الحديث السابق نفسه فقال: «فإن حينئذ تسجر جهنم».", "فلا تجوز صلاة التطوع في هذه الأوقات إلا ما ورد الدليل باستثنائه؛ كركعتي الطواف، لقوله ﷺ: «يا بني عبد مناف لا تمنعوا أحدا طاف بهذا البيت وصلى فيه، أية ساعة شاء من ليل أو نهار». وكذا قضاء سنة الفجر بعد صلاة الفجر، وقضاء سنة الظهر بعد العصر، ولا سيما إذا جمع الظهر مع العصر، وكذلك فعل ذوات الأسباب من الصلوات؛ كصلاة الجنازة، وتحية المسجد، وصلاة الكسوف، وكذلك قضاء الفرائض الفائتة في هذه الأوقات؛ لعموم قوله ﷺ: «من نام عن صلاة أو نسيها فليصلها إذا ذكرها»، ولأن الفرائض دين واجب الأداء، فتؤدى متى ذكرها الإنسان."]], "ic": "scroll"}, {"note": "حاشية (ص87): يعني: منتهى ارتفاعها، لأن الشمس ترتفع في الأفق، فإذا انتهت بدأت بالانخفاض."}], "q": [{"t": "mcq", "d": 1, "q": "المراد بالتطوع:", "o": ["كل طاعة ليست بواجبة", "كل عبادة واجبة", "الصلاة المفروضة", "الصدقة فقط"], "h": "راجع: ص82 (الباب الخامس)"}, {"t": "mcq", "d": 2, "q": "التطوع بالصلاة من أفضل القربات بعد:", "o": ["الجهاد في سبيل الله وطلب العلم", "الحج", "الصيام", "الزكاة"], "h": "راجع: ص83 (المسألة الأولى)"}, {"t":
