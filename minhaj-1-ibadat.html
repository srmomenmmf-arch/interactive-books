ا حديدا", "o": ["جافيا", "فتمرات", "امتنع", "فيدعيه"], "h": "راجع: ص٢٤٧"}, {"t": "fill", "d": 2, "q": "وقال ابن مسعود: ينبغي لحامل القرآن أن يعرف بليله إذا الناس نائمون، وبنهاره إذا الناس مفطرون، وبحزنه إذا الناس يفرحون، وببكائه إذا الناس يضحكون، ____ إذا الناس يخلطون، وبخشوعه إذا الناس", "o": ["وبصمته", "الأشنان", "بمثلي", "العجائب"], "h": "راجع: ص٢٤٧"}, {"t": "fill", "d": 2, "q": "قال أحمد: وحدثنا أبو نعيم قال: حدثنا حسين بن المهاجر قال: حدثني عبد الله بن بريدة عن أبيه عن النبي صلى الله عليه ____ أنه قال: «إن القرآن ليلقى صاحبه يوم القيامة حين ينشق عنه قبره، كالرجل الشاحب،", "o": ["وسلم", "تعمد", "الحمام", "بديل"], "h": "راجع: ص٢٤٦"}]}], "sum": [["الصفحات", "ص٢٤٥ - ص٢٤٨"]], "_nq": 6}, {"id": "l31", "title": "الباب الثاني في ظاهر آداب التلاوة", "group": "كتاب آداب تلاوة القرآن", "map": {"center": "الباب\nالثاني في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الثاني في ظاهر آداب التلاوة", "b": [{"pic": ["books", "book"], "cap": "ص٢٤٩ - ص٢٥٣"}, {"story": ["الباب الثاني في ظاهر آداب التلاوة (١ من ٣)، ص٢٤٩", ["**في ظاهر آداب التلاوة**", "وهي عشرة:", "**الأول في حال القارئ:** وهو أن يكون على وضوء، مستعملا للأدب، مطرقا غير متربع ولا متكئ ولا جالس على هيئة التكبر، وأفضل الأحوال أن يقرأ في الصلاة قائما، وأن يكون في المسجد.", "**الثاني: في مقدار القراءة:** وقد اختلفت عادات السلف في ذلك، فمنهم من كان يختم كل يوم وليلة ختمة، ومنهم من كان يختم ختمتين، ومنهم ثلاث ختمات، وهؤلاء الذين غلبت عليهم مبادرة العمر وانتهابه، ومنهم من كان يختم كل أسبوع اشتغالا بنشر العلم وتعليمه، أو بنوع من التعبد غير القراءة، أو بفن من اكتساب الدنيا، ومنهم من كان يختم كل شهر اشتغالا بالتدبر، وأولى الأمور ما لا يمنع الإنسان من أشغاله المهمة، ولا يؤذيه في بدنه، ولا يفوته معه الترتيل والفهم، وهذا يختلف باختلاف الناس في السرعة والتوقف، وقلة الأشغال وكثرتها، وإطاقة البدن وضعفه، ومن وجد خلسة في وقت فاغتنم كثرة الثواب في كثرة التلاوة فقد أحسن، فقد كان عثمان بن عفان رضي الله عنه يقرأ القرآن في ركعة يوتر بها، وكان الشافعي يختم في رمضان ستين ختمة.", "فأما الدوام فليكن على مقدار الإمكان الذي أشرنا إليه، وأعدله أن يختم في كل ثلاثة أيام، وقد قال عليه الصلاة والسلام: «لم يفقه من قرأ القرآن في أقل من ثلاث».", "وقد استحب بعض العلماء أن يختم الإنسان في الأسبوع ختمتين؛ ختمة بالليل، وختمة بالنهار، وأن يجعل ختمة النهار في بكرة الاثنين في ركعتي الفجر أو", "بعدهما، وختمة الليل يوم الجمعة في ركعتي المغرب أو بعدهما، ليستقبل بالختمة أول النهار وأول الليل، أخبرنا إسماعيل بن أحمد قال: أخبرنا ابن النقور قال: أخبرنا ابن حبابة قال: حدثنا البغوي قال: حدثنا هدبة قال: حدثنا حماد بن سلمة عن أبي مكين عن طلحة بن مصرف قال: من ختم القرآن في أي ساعة من النهار كانت، صلت عليه الملائكة حتى يسمي، وأي ساعة من الليل كانت صلت عليه الملائكة(١) حتى يصبح. وقد روينا هذا عن طلحة بن مصرف عن الحكم بن صفوان أنه قال: وقد روينا في آداب الجمعة عن إبراهيم النخعي مثل هذا.", "وقال عبد الرحمن بن الأسود: من قرأ القرآن فختمه نهارا غفر له ذلك اليوم، ومن ختمه ليلا غفر له تلك الليلة.", "وقال مجاهد: تنزل الرحمة عند ختم القرآن.", "وقال ابن مسعود: من ختم القرآن فله دعوة مستجابة.", "وكان أنس بن مالك إذا ختم القرآن جمع أهله ودعا.", "وقال محمد بن جحادة: من ختم القرآن صلى عليه كل ملك.", "**الثالث: في وجه القسمة:** فمن أراد ختمة في يومين قرأ النصف كل يوم، أو في ثلاثة قرأ الثلث، أو في أربعة قرأ الربع، كذلك إلى السبع لتتساوى الأيام في مقدار التلاوة، ولا ينقص في يوم ويزيد في يوم."]], "ic": "book"}, {"story": ["الباب الثاني في ظاهر آداب التلاوة (٢ من ٣)، ص٢٥٠", ["**الرابع: في الكتابة للمصحف:** يستحب كتابة المصحف وتبيينه، ولا يكره النقط والشكل لكنه يكون بغير لون المداد؛ لأن ذلك يمنع التالي من اللحن، فأما من كره هذا وقال: جردوا القرآن. فإنهم خافوا من فتح هذا الباب إحداث زيادات، والآن فقد استقر الأمر فلا وجه للكراهة.", "حاشية: (١) ليست في الأصل.", "**الخامس: الترتيل:** وله مقصودان:", "أحدهما: أنه أقرب إلى الاحترام والتعظيم.", "والثاني: أن المقصود من القراءة التفكر، والترتيل معين عليه، ولذلك نعتت أم سلمة قراءة رسول الله صلى الله عليه وسلم، فإذا هي تنعت قراءة مفسرة حرفا حرفا. وقال ابن عباس: لأن أقرأ البقرة وآل عمران أرتلهما وأتدبرهما أحب إلي من أن أقرأ القرآن كله هذا.", "**السادس: القراءة بتحزين وبكاء:** وفي الصحيحين من حديث أبي هريرة عن النبي صلى الله عليه وسلم أنه قال: «ما أذن(١) الله لشيء ما أذن لنبي يتغنى بالقرآن». وفي لفظ أخرجه البخاري: «ليس منا من لم يتغن بالقرآن».", "وقال الشافعي: يتحزن به: يترنم به، يقرؤه حدرا(٢) وتحزينا، وليس من أنه يستغني به.", "وقال ابن الأعرابي(٣): كانت العرب تتغنى بالركباني إذا ركبت الإبل، وإذا جلست في الأفنية، وعلى أكثر أحوالها، فلما نزل القرآن أحب رسول الله صلى الله عليه وسلم أن يكون القرآن هجيراهم(٤) مكان التغني بالركباني(٥).", "واعلم أن القراءة بالتحزين تحرك داعية البكاء، فمن أحضر مع ذلك قلبه لفهم الوعد والوعيد، وتفكر في تقصيره في الأوامر والزواجر حزن وبكى، فإن لم يجد ذلك، فليبك على عدمه.", "**السابع: أن يتعوذ قبل القراءة:** فيقول: أعوذ بالله من الشيطان الرجيم.", "حاشية: (١) قوله: «ما أذن» أي: ما استمع.", "حاشية: (٢) حدر القراءة: أسرع فيها. وقول الشافعي أخرجه البيهقي في المناقب ١/ ٢٨٠.", "حاشية: (٣) هو أحمد بن زياد أبو سعيد المحدث نزيل مكة وشيخ الحرم، توفي سنة ٣٤٠ هـ. سير أعلام النبلاء ١٥/ ٤٠٧.", "حاشية: (٤) هجيراهم: دأبهم وعادتهم.", "حاشية: (٥) أورده الخطابي في معالم السنن ١/ ٢٩١، والقرطبي في التفسير ١/ ١٣.", "**الثامن: أن يراعي حق الآيات:** فإذا مر بآية سجدة سجد، وكذلك إذا قصد السماع من غيره سجد إذا كان على وضوء، ولكن بشرط أن يسجد التالي، وإذا مر بآية دعاء وسؤال سأل، أو بآية عقاب تعوذ."]], "ic": "book"}, {"story": ["الباب الثاني في ظاهر آداب التلاوة (٣ من ٣)، ص٢٥٢", ["**التاسع: إسرار القراءة في غير الصلاة:** فأما حكمها في الصلاة فمعروف، فقد جاء في الحديث: «فضل قراءة السر على قراءة العلانية كفضل صدقة السر على صدقة العلانية». وفي لفظ: «الجاهر بالقرآن كالجاهر بالصدقة، والمسر به كالمسر بالصدقة». وقد جاء في الحديث: «إن عمل السر يفضل على عمل العلانية سبعين ضعفا». إلا أنه ينبغي أن يسمع نفسه، فإن ذلك لا ينافي الإسرار، ولا بأس بالجهر في بعض الأوقات لمقصود صحيح إما ليجود الحفظ، فإن الإعلان أقوى له، أو ليصرف عن نفسه الكسل أو النوم، أو لتنتبه بذلك النفس، أو ليوقظ الوسنان، كما قال عمر(١)، إن صحت له هذه النية، ومن كان عنده مصحف فينبغي أن يقرأ فيه في كل يوم ولو آيات يسيرة لئلا يكون مهجورا.", "**العاشر: تحسين القراءة:**", "ففي الصحيحين من حديث أبي هريرة عن النبي صلى الله عليه وسلم أنه قال: «ما أذن الله لشيء ما أذن لنبي حسن الصوت بالقرآن يجهر به».", "قال ابن أبي مليكة: إذا لم يكن حسن الصوت حسنه ما استطاع. وقد استمع رسول الله صلى الله عليه وسلم قراءة أبي موسى وقال: «لقد أوتي هذا من مزامير آل داود».", "ورأى الهيثم الفارسي(٢) رسول الله صلى الله عليه وسلم في منامه، فقال له: أنت الهيثم الذي تزين القرآن بصوتك؟ فقال: نعم. فقال: جزاك الله خيرا(٣).", "حاشية: (١) أي: عندما سأله النبي صلى الله عليه وسلم: «لم تجهر بقراءتك؟» فقال: أفزع الشيطان، وأوقظ الوسنان. يعني النائم. والحديث أخرجه أحمد (٨٦٥) من حديث علي، وأخرجه البيهقي في شعب الإيمان (٢٦١٢) والطبري في التفسير ١٥/ ١٨٦ عن محمد بن سيرين.", "حاشية: (٢) في الأصل: «القاري».", "حاشية: (٣) أورده ابن عطية في المحرر الوجيز ١٢/ ٢١٤، والقرطبي في التفسير ١٤/ ٣٢٠.", "وهذا التزيين إنما هو تعاطي التجويد والتحزين، فأما القراءة بالألحان فقد كرهها السلف ولو رأوا ما قد أحدثوا فيها اليوم لقربوها إلى التحريم(١).", "حاشية: (١) ذكر العلامة ابن حجر في فتح الباري ٩/ ٧٢ الاختلاف في القراءة بالألحان، ثم قال: «والذي يتحصل من الأدلة أن حسن الصوت بالقرآن مطلوب، فإن لم يكن حسنا فليحسنه ما استطاع، ومن جملة تحسينه أن يراعى فيه قوانين النغم، فإن حسن الصوت يزداد حسنا بذلك، وإن خرج عنها أثر ذلك في حسنه، وغير الحسن ربما انجبر بمراعاتها ما لم يخرج عن شرط الأداء المعتبر عند أهل القراءات، فإن خرج عنها لم يفد تحسين الصوت بقبح الأداء، ولعل هذا مستند من كره القراءة بالأنغام؛ لأن الغالب على من راعى الأنغام أن لا يراعي الأداء، فإن وجد من يراعيهما معا، فلا شك في أنه أرجح من غيره، لأنه يأتي بالمطلوب من تحسين الصوت ويجتنب الممنوع من حرمة الأداء»."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "بعدهما، وختمة الليل يوم الجمعة في ركعتي المغرب أو بعدهما، ليستقبل ____ أول النهار وأول الليل، أخبرنا إسماعيل بن أحمد قال", "o": ["بالختمة", "المتحدة", "أرتضي", "حامدون"], "h": "راجع: ص٢٥٠"}, {"t": "fill", "d": 2, "q": "فأما الدوام فليكن على مقدار الإمكان الذي أشرنا إليه، وأعدله أن يختم في كل ثلاثة أيام، وقد قال ____ الصلاة والسلام", "o": ["عليه", "طعام", "فوقوفه", "والرفق"], "h": "راجع: ص٢٤٩"}, {"t": "fill", "d": 2, "q": "قال ابن أبي مليكة: إذا لم يكن حسن الصوت حسنه ما استطاع. وقد استمع رسول الله صلى الله عليه وسلم ____ أبي موسى وقال: «لقد أوتي هذا من مزامير آل", "o": ["قراءة", "يطلب", "عطاء", "يحير"], "h": "راجع: ص٢٥٢"}, {"t": "fill", "d": 2, "q": "واعلم أن القراءة بالتحزين تحرك داعية البكاء، فمن أحضر مع ذلك قلبه لفهم الوعد والوعيد، وتفكر في تقصيره في ____ والزواجر حزن وبكى، فإن لم يجد ذلك، فليبك على عدمه", "o": ["الأوامر", "فرحتان", "المفرطين", "سمعنا"], "h": "راجع: ص٢٥١"}, {"t": "fill", "d": 2, "q": "وهذا التزيين إنما هو تعاطي التجويد والتحزين، فأما القراءة بالألحان فقد كرهها السلف ولو رأوا ما قد ____ فيها اليوم لقربوها إلى التحريم", "o": ["أحدثوا", "الشآفة", "اكتروا", "كتبا"], "h": "راجع: ص٢٥٣"}, {"t": "fill", "d": 2, "q": "وقال عبد الرحمن بن الأسود: من قرأ القرآن فختمه نهارا غفر له ذلك اليوم، ومن ختمه ____ غفر له تلك", "o": ["ليلا", "والصبي", "ونعشتك", "تقولن"], "h": "راجع: ص٢٥٠"}]}], "sum": [["الصفحات", "ص٢٤٩ - ص٢٥٣"]], "_nq": 6}, {"id": "l32", "title": "الباب الثالث في أعمال الباطن في التلاوة", "group": "كتاب آداب تلاوة القرآن", "map": {"center": "الباب\nالثالث في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الثالث في أعمال الباطن في التلاوة", "b": [{"pic": ["books", "book"], "cap": "ص٢٥٤ - ص٢٥٨"}, {"story": ["الباب الثالث في أعمال الباطن في التلاوة (١ من ٤)، ص٢٥٤", ["**في أعمال الباطن في التلاوة**", "وهي عشرة:", "فهم أصل الكلام، ثم التعظيم، ثم حضور القلب، ثم التدبر، ثم التفهم، ثم التخلي من موانع الفهم، ثم التخصص، ثم التأثر، ثم الترقي، ثم التبري.", "**الأول:** فهم عظمة الكلام وعلوه، فلينظر كيف لطف الله سبحانه بخلقه في إيصال معاني كلامه إلى أفهامهم.", "**الثاني:** التعظيم للمتكلم، وأن يعلم التالي أن ما يقرؤه ليس من كلام البشر وكما أن ظاهر الجلد والورق محروس عن بشرة اللامس إلا إذا كان متطهرا، فباطن معناه أيضا محجوب عن باطن القلب إلا إذا كان متطهرا عن كل رجس، مستنيرا بنور التعظيم والتوقير، وكما لا يصلح لمسه لكل يد لا يصلح لنيل معانيه كل قلب، ولهذا التعظيم كان عكرمة بن أبي جهل إذا نشر المصحف قال: كلام ربي، كلام ربي. فتعظيم الكلام بتعظيم المتكلم، ولن يحضر التالي عظمة المتكلم ما لم يتفكر في صفاته وأفعاله، فإذا نظر إلى المخلوقات فرآها في قبضة قدرته بانت له العظمة.", "**الثالث:** حضور القلب، وترك حديث النفس، فقد قيل لبعضهم: إذا قرأت القرآن تحدث نفسك بشيء؟ فقال: أو شيء أحب إلي من القرآن أحدث به نفسي؟! وهذا إنما ينشأ من التعظيم والأنس، وفي القرآن ما يستأنس به القلب، فكيف يطلب الأنس بالفكر في غيره.", "**الرابع:** التدبر، وهو وراء حضور القلب، والمقصود من القراءة التدبر، قال علي رضي الله عنه: لا خير في عبادة لا فقه فيها، ولا قراءة لا تدبر فيها. وإذا لم", "يمكن التدبر إلا بترديد الآية فليرددها، وقد روى أبو ذر عن النبي صلى الله عليه وسلم أنه قام ليلة بآية يرددها: ﴿إِن تُعَذِّبْهُمْ فَإِنَّهُمْ عِبَادُكَ﴾ الآية [المائدة: ١١٨]، وقام تميم الداري بآية: ﴿أَمْ حَسِبَ ٱلَّذِينَ ٱجْتَرَحُوا۟(١) ٱلسَّيِّـَٔاتِ﴾ [الجاثية: ٢١]، وكذلك قام بها الربيع بن خثيم ليلة.", "وقال أبو سليمان الداراني: إني لأتلو الآية فأقيم فيها أربع ليال وخمس ليال، ولولا أني أقطع الفكر فيها ما جاوزتها إلى غيرها.", "وقد بقي بعض السلف سنين كثيرة في ختمة فما أتمها."]], "ic": "book"}, {"story": ["الباب الثالث في أعمال الباطن في التلاوة (٢ من ٤)، ص٢٥٥", ["**الخامس:** التفهم، وهو أن يستوضح من كل آية ما يليق بها، مثل أن تأتي صفات الله عز وجل في قوله: ﴿لَيْسَ كَمِثْلِهِۦ شَىْءٌ ۖ وَهُوَ ٱلسَّمِيعُ ٱلْبَصِيرُ﴾ [الشورى: ١١]، أو ذكر أفعاله في قوله تعالى: ﴿خَلَقَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ﴾ [الشورى: ٢٩] فليفهم التالي عظمته وليتلمح قدرته، ومن لا يراه في كل ما يراه فكأنه ما عرفه، وإذا تلا: ﴿أَفَرَءَيْتُم مَّا تُمْنُونَ﴾ [الواقعة: ٥٨] تفكر في نطفة متشابهة الأجزاء كيف تنقسم إلى لحم وعروق وعظم وعصب، وإلى تشكل أعضائها بأشكال مختلفة من رأس ويد ورجل، ثم إلى ما ظهر فيها من الصفات الشريفة، كالسمع والبصر والعقل، وإلى الصفات المذمومة كالغضب والشهوة والجهل، فتأمل هذه العجائب تترقى بها إلى معرفة الصفة التي صدرت عنها فترى الصائع في الصنعة.", "وإذا تلا أحوال المكذبين فليستشعر الخوف من السطوة إن غفل عن امتثال الأمر، ومتى لم يفهم ما يتلو فكأنه ما تلا.", "**السادس:** التخلي من موانع الفهم، وموانع الفهم حجب أربعة:", "أولها: أن يخيل الشيطان إلى التالي أنه ما حقق تلاوة الحرف ولا أخرجه من مخرجه، فيكرره التالي، فينصرف الهم إلى ذلك عن فهم المعنى.", "وثانيها: أن يكون التالي مقلدا في مذهبه، فيتوهم عند قراءة الآية ما يعتقده", "حاشية: (١) في (ظ): «يعملون» وهو خطأ.", "بتقليده مثل أن يتلو: ﴿ثُمَّ ٱسْتَوَىٰ عَلَى ٱلْعَرْشِ﴾ [الأعراف: ٥٤]، وهو يعتقد أن الاستواء القعود(١)، فلو خطر له ما يوجب التقديس عن ما يليق بالخلق رده الشيطان، وقال: ليس هذا معتقدك. فوقوفه على ذلك مانع له من الفهم.", "وثالثها: أن يكون مصرا على ذنب، أو متصفا بكبر، أو مبتلى في الجملة بهوى مطاع، فإن ذلك سبب ظلمة القلب وصدئه، فهو كالخبث(٢) على المرآة يمنع أن يتجلى فيه الحق، فالقلب مثل المرآة، والشهوات مثل الصدأ، ومعاني القرآن مثل الصور التي تتراءى في المرآة، والرياضة للقلب بإماطة(٣) الشهوات مثل صقل الجلاء(٤) للمرآة.", "ورابعها: أن يكون قد سمع في الآية تفسيرا فجمد عليه، ولم يعلم أن فهم الآية لا ينافي تفسير لفظها.", "**السابع:** التخصص، وهو أن يعلم أنه المقصود بكل خطاب في القرآن، وبكل وعد ووعيد، وأن القصص لم يرد بها السمر بل العبر، فليتنبه لذلك، فحينئذ يتلو تلاوة عبد قد كاتبه سيده بمقصود ليتأمل الكتاب ويعلم بمقتضاه.", "**الثامن:** التأثر، وهو أن يتأثر قلبه بمؤثرات مختلفة على حسب اختلاف(٥) الآيات من حزن وخوف ورجاء وغير ذلك، ومتى تمت معرفته كانت الخشية أغلب على قلبه، لأن التضييق غالب على آيات القرآن ولا تكاد ترى ذكر المغفرة والرحمة إلا مقرونا بشرط كقوله تعالى: ﴿وَإِنِّى لَغَفَّارٌ لِّمَن تَابَ وَءَامَنَ وَعَمِلَ صَٰلِحًا ثُمَّ ٱهْتَدَىٰ﴾ [طه: ٨٢]، ﴿إِنَّ رَحْمَتَ ٱللَّهِ قَرِيبٌ مِّنَ ٱلْمُحْسِنِينَ﴾ [الأعراف: ٥٦]، ومن فهم ذلك"]], "ic": "book"}, {"story": ["الباب الثالث في أعمال الباطن في التلاوة (٣ من ٤)، ص٢٥٦", ["حاشية: (١) قال العلامة ابن أبي العز الدمشقي في شرح العقيدة الطحاوية ٣٧٢ ـ ٣٧٣: قال الإمام مالك رحمه الله لما سئل عن قوله تعالى: ﴿ثُمَّ ٱسْتَوَىٰ عَلَى ٱلْعَرْشِ﴾ كيف استوى فقال: الاستواء معلوم، والكيف مجهول.", "حاشية: (٢) في النسخ: «كالجرب»، والمثبت من الإحياء، فهو الأنسب للمعنى.", "حاشية: (٣) في (ظ): «في مواطن».", "حاشية: (٤) الجلاء: هو الذي يجلو المرآة ويصقلها ويزيل صدأها.", "حاشية: (٥) سقطت من (ظ).", "فجدير به الخشية والحزن، وقال الحسن: والله ما أصبح اليوم عبد يتلو هذا القرآن يؤمن به إلا كثر حزنه، وقل فرحه، وكثر بكاؤه، وقل ضحكه. وقال وهيب بن الورد: نظرنا في هذه الأحاديث والمواعظ فلم نجد شيئا أرد للقلوب ولا أشد استجلابا للحزن من قراءة القرآن وتفهمه وتدبره.", "فتأثر العبد بالتلاوة أن يتضائل عند تلاوة ما يخوف، وأن يفرح عند ذكر ما يفرح، ومن هذا قول النبي صلى الله عليه وسلم لابن مسعود: «اقرأ علي» فقرأ عليه من أول سورة النساء، فلما بلغ: ﴿فَكَيْفَ إِذَا جِئْنَا مِن كُلِّ أُمَّةٍۭ بِشَهِيدٍ وَجِئْنَا بِكَ عَلَىٰ هَٰٓؤُلَآءِ شَهِيدًا﴾ [النساء: ٤١]، بكى وقال: «حسبك». وهذا لأن مشاهدة تلك الحال استغرقت قلبه.", "وقد كان من الخائفين من يغشى عليه عند آيات الوعيد، ومنهم من يموت، ومن تلا: ﴿رَّبَّنَا عَلَيْكَ تَوَكَّلْنَا وَإِلَيْكَ أَنَبْنَا﴾ [الممتحنة: ٤] ولم يكن متوكلا ولا منيبا كان حاكيا، ولم يكن حظه من التلاوة إلا حركة لسانه، وكان داخلا في معنى قوله: ﴿وَمِنْهُمْ أُمِّيُّونَ لَا يَعْلَمُونَ ٱلْكِتَٰبَ إِلَّآ أَمَانِىَّ﴾ [البقرة: ٧٨] وفي قوله: ﴿وَكَأَيِّن مِّنْ ءَايَةٍ فِى ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ يَمُرُّونَ عَلَيْهَا وَهُمْ عَنْهَا مُعْرِضُونَ﴾ [يوسف: ١٠٥]، ومثال العاصي إذا قرأ القرآن وكرره مثال من كرر كتاب الملك في كل يوم مرات، وقد كتب إليه يأمره بعمارة مملكته، وهو مشغول بتخريبها ومقتصر على دراسة كتابه، فلو ترك الدراسة مع المخالفة كان أبعد من الاستهزاء واستحقاق المقت.", "**التاسع:** الترقي، وهو أن يترقى إلى أن يسمع الكلام من الله تعالى لا من نفسه، ودرجات القراءة(١) ثلاث:", "أدناها: أن يقدر العبد أنه بين يدي الله تعالى يقرأ عليه والله تعالى مستمع منه، فيكون حاله حينئذ التملق والتضرع والابتهال.", "الثانية: أن يقدر كأن ربه يخاطبه ويناجيه، فمقامه حينئذ الحياء والتعظيم والإصغاء والفهم.", "الثالثة: أن يرى في الكلام المتكلم، فيصير مستغرقا بمشاهدته.", "حاشية: (١) تحرفت في (ظ) إلى: «القرآن»."]], "ic": "book"}, {"story": ["الباب الثالث في أعمال الباطن في التلاوة (٤ من ٤)، ص٢٥٨", ["**العاشر:** التبري، وهو أن يتبرأ من حوله وقوته والالتفات إلى نفسه بعين الرضا والتزكية، فإذا تلا آيات الوعد والمدح للصالحين لم يشهد نفسه عند ذلك بل يشهد الموقنين ويتشوق إلى أن يلحقه الله تعالى بهم، وإذا تلا آيات المقت وذم العصاة شهد نفسه هناك وقدر أنه المخاطب، ومن رأى نفسه بصورة التقصير كان ذلك سبب قربه، ومن غلب عليه الرجاء انكشف له ما يرجو. قال بعض السلف: صليت ركعة الوتر فرفعت لي روضة خضراء، فما زلت أنظر إليها حتى أصبحت. وكذلك إذا غلب الخوف. قال أبو سليمان: وصفت لأختي قنطرة من قناطر جهنم، فمكثت في صيحة يوما وليلة. قيل له: ما الذي أوجب صياحها؟ قال: مثلت نفسها عليها."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "ورابعها: أن يكون قد سمع في الآية تفسيرا فجمد عليه، ولم يعلم أن فهم الآية لا ____ تفسير", "o": ["ينافي", "العاجل", "إنسانا", "القائمة"], "h": "راجع: ص٢٥٦"}, {"t": "fill", "d": 2, "q": "الأول: فهم عظمة الكلام وعلوه، فلينظر كيف لطف الله سبحانه ____ في إيصال معاني كلامه إلى", "o": ["بخلقه", "يدرك", "واجبا", "مشهور"], "h": "راجع: ص٢٥٤"}, {"t": "fill", "d": 2, "q": "أولها: أن يخيل الشيطان إلى التالي أنه ما حقق تلاوة الحرف ولا أخرجه من مخرجه، فيكرره التالي، ____ الهم إلى ذلك عن فهم", "o": ["فينصرف", "الكروخي", "فيها", "والعامل"], "h": "راجع: ص٢٥٥"}, {"t": "fill", "d": 2, "q": "الثاني: التعظيم للمتكلم، وأن يعلم التالي أن ما يقرؤه ليس من كلام البشر وكما أن ظاهر الجلد والورق محروس عن ____ اللامس إلا إذا كان متطهرا، فباطن معناه أيضا محجوب عن باطن القلب إلا إذا كان متطهرا", "o": ["بشرة", "فمكثت", "ورغم", "شعبية"], "h": "راجع: ص٢٥٤"}, {"t": "fill", "d": 2, "q": "السابع: التخصص، وهو أن يعلم أنه المقصود بكل خطاب في القرآن، وبكل وعد ووعيد، وأن القصص لم يرد بها السمر بل العبر، فليتنبه لذلك، فحينئذ يتلو تلاوة عبد قد كاتبه سيده بمقصود ____ الكتاب ويعلم", "o": ["ليتأمل", "وحبيب", "يكرهها", "المدبر"], "h": "راجع: ص٢٥٦"}, {"t": "fill", "d": 2, "q": "العاشر: التبري، وهو أن يتبرأ من حوله وقوته والالتفات إلى نفسه بعين الرضا والتزكية، فإذا تلا آيات الوعد والمدح للصالحين لم يشهد نفسه عند ذلك بل يشهد الموقنين ويتشوق إلى أن ____ الله تعالى بهم،", "o": ["يلحقه", "القنب", "المضاجع", "السمع"], "h": "راجع: ص٢٥٨"}]}], "sum": [["الصفحات", "ص٢٥٤ - ص٢٥٨"]], "_nq": 6}, {"id": "l33", "title": "الباب الرابع في فهم القرآن وتفسيره بالرأي", "group": "كتاب آداب تلاوة القرآن", "map": {"center": "الباب\nالرابع في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الرابع في فهم القرآن وتفسيره بالرأي", "b": [{"pic": ["books", "book"], "cap": "ص٢٥٩ - ص٢٦٠"}, {"story": ["الباب الرابع في فهم القرآن وتفسيره بالرأي، ص٢٥٩", ["**في فهم القرآن وتفسيره بالرأي**", "أما تفسير الألفاظ فمسلم إلى أهل اللغة، وإنما يذم الكلام فيه بالرأي إذا لم يستند الرأي إلى أصل صحيح، فأما ما يفهم من الآيات فلا يناقض تفسير الألفاظ، وإنما يدرك كل شخص منه بقدر قوة فهمه وصفاء قلبه.", "آخر كتاب آداب التلاوة."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "أما تفسير الألفاظ فمسلم إلى أهل اللغة، وإنما يذم الكلام فيه بالرأي إذا لم يستند الرأي إلى أصل صحيح، فأما ما يفهم من الآيات فلا ____ تفسير الألفاظ، وإنما يدرك كل شخص منه بقدر قوة فهمه وصفاء قلبه", "o": ["يناقض", "تقلد", "منبه", "توجب"], "h": "راجع: ص٢٥٩"}]}], "sum": [["الصفحات", "ص٢٥٩ - ص٢٦٠"]], "_nq": 1}, {"id": "l34", "title": "كتاب الأذكار والدعوات", "group": "كتاب الأذكار والدعوات", "map": {"center": "كتاب\nالأذكار والدعوات", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "كتاب الأذكار والدعوات", "b": [{"pic": ["books", "book"], "cap": "ص٢٦١ - ص٢٦١"}, {"story": ["كتاب الأذكار والدعوات، ص٢٦١", ["الحمد لله مبلغ المؤملين له غاية مطلوبهم، ومجيب دعاء المضطرين بكشف كروبهم، وذاكر الذاكرين بإصلاح قلوبهم، الذين يذكرون الله قياما وقعودا وعلى جنوبهم، أحمده على إنعام أعطاني ضاقت بشكره أغطاني، وما أحقني بشكر ما أولاني وأولاني، وكيف لا والفضل الرباني ربان على أنه قد أطمع في كرمه القاصي والداني، فقال: ﴿وَإِذَا سَأَلَكَ عِبَادِى عَنِّى فَإِنِّى قَرِيبٌ ۖ أُجِيبُ دَعْوَةَ ٱلدَّاعِ إِذَا دَعَانِ﴾ [البقرة: ١٨٦]. وأصلي على رسوله محمد صاحب السبع المثاني، وعلى جميع أصحابه وأتباعه إلى يوم إعادة المباني، وأسلم(١) تسليما كثيرا.", "أما بعد، فإنه ليس بعد تلاوة القرآن عبادة تؤدى باللسان أفضل من ذكر الله تعالى ورفع الحوائج بالأدعية الخالصة إليه، ولا بد من شرح فضيلة الذكر على الجملة ثم على التفصيل في أعيان الأذكار، وشرح فضيلة الدعاء وشروطه وآدابه، ونقل المأثور من الدعوات الجامعة لمقاصد الدين والدنيا، والدعوات الخاصة لسؤال المغفرة، وغير ذلك، ويتحرر المقصود من ذلك بذكر أربعة أبواب:", "الباب الأول: في فضيلة الذكر وفائدته جملة وتفصيلا.", "الباب الثاني: في فضيلة الدعاء، والاستغفار، والصلاة على رسول الله صلى الله عليه وسلم.", "الباب الثالث: في أدعية مأثورة عن النبي صلى الله عليه وسلم وأصحابه ومن بعدهم.", "الباب الرابع: في الأدعية المأثورة عند حدوث الحوادث.", "حاشية: (١) في (ظ): «وسلم»."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "أما بعد، فإنه ليس بعد تلاوة القرآن عبادة تؤدى باللسان أفضل من ذكر الله تعالى ورفع الحوائج بالأدعية الخالصة إليه، ولا بد من شرح فضيلة الذكر على الجملة ثم على التفصيل في أعيان الأذكار، وشرح فضيلة الدعاء وشروطه وآدابه، ونقل المأثور من الدعوات الجامعة لمقاصد الدين والدنيا، والدعوات الخاصة لسؤال المغفرة، وغير ذلك، ويتحرر المقصود من ذلك بذكر ____ أبواب", "o": ["أربعة", "آخره", "اللحن", "افتقرت"], "h": "راجع: ص٢٦١"}]}], "sum": [["الصفحات", "ص٢٦١ - ص٢٦١"]], "_nq": 1}, {"id": "l35", "title": "الباب الأول في فضيلة الذكر على الجملة والتفصيل من الآيات والأخبار", "group": "كتاب الأذكار والدعوات", "map": {"center": "الباب\nالأول في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الأول في فضيلة الذكر على الجملة والتفصيل من الآيات والأخبار - القسم ١ من ٢", "b": [{"pic": ["books", "book"], "cap": "ص٢٦٢ - ص٢٧٠"}, {"story": ["الباب الأول في فضيلة الذكر على الجملة والتفصيل من الآيات وال (١ من ٧)، ص٢٦٢", ["**في فضيلة الذكر على الجملة والتفصيل من الآيات والأخبار(١)**", "قد دل على فضيلة الذكر في الجملة من الآيات قوله تعالى: ﴿فَٱذْكُرُونِىٓ أَذْكُرْكُمْ﴾ [البقرة: ١٥٢]. قال ثابت البناني: إني لأعلم متى يذكرني ربي. ففزعوا وقالوا: كيف تعلم ذلك؟! قال: إذا ذكرته ذكرني، وقال تعالى: ﴿وَلَذِكْرُ ٱللَّهِ أَكْبَرُ﴾ [العنكبوت: ٤٥]، أي أن ذكر ربكم لكم(٢) أكبر من ذكركم إياه. وقد أمر بالذكر فقال: ﴿ٱذْكُرُوا۟ ٱللَّهَ ذِكْرًا كَثِيرًا﴾ [الأحزاب: ٤١]، وقال: ﴿فَٱذْكُرُوا۟ ٱللَّهَ كَذِكْرِكُمْ ءَابَآءَكُمْ أَوْ أَشَدَّ ذِكْرًا﴾ [البقرة: ٢٠٠]، وقال: ﴿وَٱذْكُر رَّبَّكَ فِى نَفْسِكَ تَضَرُّعًا وَخِيفَةً﴾ [الأعراف: ٢٠٥]، ومدح الذاكرين فقال: ﴿ٱلَّذِينَ يَذْكُرُونَ ٱللَّهَ قِيَٰمًا وَقُعُودًا﴾ [آل عمران: ١٩١]، وقال: ﴿وَٱلذَّٰكِرِينَ ٱللَّهَ كَثِيرًا وَٱلذَّٰكِرَٰتِ﴾ [الأحزاب: ٣٥].", "وأما الأخبار؛ ففي الصحيحين من حديث أبي هريرة عن النبي صلى الله عليه وسلم أنه قال: «أنا عند ظن عبدي بي، وأنا معه حين يذكرني، فإن ذكرني في نفسه ذكرته في نفسي، وإن ذكرني في ملأ ذكرته في ملأ هم خير منهم، وإن اقترب إلي شبرا تقربت إليه ذراعا، وإن تقرب إلي ذراعا اقتربت إليه باعا، وإن أتاني يمشي أتيته هرولة»، وفي الصحيحين من حديث أبي هريرة أيضا عن النبي صلى الله عليه وسلم أنه قال: «سبعة يظلهم الله في ظله يوم لا ظل إلا ظله ـ فذكر منهم ـ رجلا ذكر الله خاليا ففاضت عيناه». وفي أفراد البخاري من حديث أبي موسى عن النبي صلى الله عليه وسلم أنه قال: «مثل الذي يذكر ربه والذي لا يذكر ربه، مثل الحي والميت». وفي أفراد مسلم من حديث أبي هريرة", "حاشية: (١) ليست في الأصل.", "حاشية: (٢) في الأصل: «أن ذكره لكم».", "قال: كان رسول الله صلى الله عليه وسلم يسير في طريق مكة، فمر على جبل يقال له: جمدان(١)، فقال: «سيروا هذا جمدان، سبق المفردون» قالوا: وما المفردون يا رسول الله؟ قال: «الذاكرون الله كثيرا والذاكرات». وفي حديث عبد الله بن بسر(٢) أن رجلا قال: يا رسول الله، إن شرائع الإسلام قد كثرت علي، فمرني بأمر أتشبث به. فقال: «لا يزال لسانك رطبا بذكر الله عز وجل». وفي حديث أنس عن النبي صلى الله عليه وسلم قال: «يقول الله عز وجل: أخرجوا من النار من ذكرني يوما أو خافني في مقام». وفي حديث أبي الدرداء عن النبي صلى الله عليه وسلم أنه قال: «إن الله عز وجل يقول: أنا مع عبدي ما ذكرني وتحركت بي شفتاه». قال أبو الدرداء: وقال رسول الله صلى الله عليه وسلم: «ألا أنبئكم بخير أعمالكم، وأزكاها عند مليككم، وأرفعها في درجاتكم، وخير من إعطاء الذهب والورق، وأن تلقوا عدوكم فتضربون أعناقهم ويضربون أعناقكم؟» قالوا: وما ذاك يا رسول الله؟ قال: «ذكر الله تعالى».", "**فضيلة مجالس الذكر**"]], "ic": "book"}, {"story": ["الباب الأول في فضيلة الذكر على الجملة والتفصيل من الآيات وال (٢ من ٧)، ص٢٦٣", ["أخبرنا عبد الأول قال: أخبرنا الداودي قال: أخبرنا ابن أعين قال: حدثنا الفربري قال: حدثنا البخاري قال: حدثنا قتيبة قال: حدثنا جرير عن الأعمش عن أبي صالح عن أبي هريرة قال: قال رسول الله صلى الله عليه وسلم: «إن لله ملائكة يطوفون في الطرق، يلتمسون أهل الذكر، فإذا وجدوا قوما يذكرون الله تنادوا: هلموا إلى حاجتكم. قال: فيحفونهم بأجنحتهم إلى السماء الدنيا. قال: فيسألهم ربهم، وهو أعلم منهم: ما يقول عبادي؟ قالوا: يسبحونك ويكبرونك ويحمدونك ويمجدونك قال: فيقول: هل رأوني؟ قال: فيقولون: لا والله ما رأوك. قال: فيقول: فكيف لو رأوني؟ قال: فيقولون: لو رأوك كانوا أشد لك عبادة، وأشد لك تمجيدا، وأكثر لك تسبيحا. قال: فيقول: ما يسألون؟ قال: يسألونك الجنة. قال: يقول: هل رأوها؟ قال: يقولون: لا والله ما رأوها. قال: يقول: فكيف لو رأوها؟", "حاشية: (١) جمدان: جبل في طريق مكة يبعد عنها شمالها نحو مئة كيلو مترا للمتجه إلى المدينة.", "حاشية: (٢) تحرفت في (ظ) إلى: «بشران».", "قال: يقولون: لو أنهم رأوها كانوا أشد عليها حرصا، وأشد لها طلبا، وأعظم فيها رغبة. قال: فمم يتعوذون؟ قال: يقولون: من النار. قال: يقول: وهل رأوها؟ قال: يقولون: لا والله ما رأوها. قال: فيقول: فكيف لو رأوها؟ قال: يقولون: لو رأوها كانوا أشد منه فرارا، وأشد لها مخافة. قال: فيقول: فأشهدكم أني قد غفرت لهم. قال: يقول ملك من الملائكة: فيهم فلان ليس منهم إنما جاء لحاجة.ن قال: هم الجلساء لا يشقى جليسهم». أخرجاه في الصحيحين.", "أخبرنا هبة الله بن محمد قال: أخبرنا الحسن بن علي التميمي قال: حدثنا أبو بكر بن مالك قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا محمد بن جعفر قال: حدثنا شعبة قال: سمعت أبا إسحاق يحدث عن الأغر أبي(١) مسلم أنه قال: أشهد على أبي هريرة وأبي سعيد أنهما شهدا على النبي صلى الله عليه وسلم أنه قال: «لا يقعد قوم يذكرون الله إلا حفتهم الملائكة، وغشيتهم الرحمة، وتنزلت عليهم السكينة، وذكرهم الله فيمن عنده»."]], "ic": "book"}, {"story": ["الباب الأول في فضيلة الذكر على الجملة والتفصيل من الآيات وال (٣ من ٧)، ص٢٦٤", ["قال أحمد(٢): وحدثني علي بن بحر قال: حدثني مرحوم بن عبد العزيز قال: حدثني أبو نعامة السعدي عن أبي عثمان النهدي عن أبي سعيد الخدري قال: خرج معاوية على حلقة في المسجد، فقال: ما أجلسكم؟ قالوا: جلسنا نذكر الله عز وجل. قال: الله ما أجلسكم إلا ذاك؟ قالوا: الله ما أجلسنا إلا ذاك. قال: أما إني لم أستحلفكم تهمة لكم، وإن رسول الله صلى الله عليه وسلم خرج على حلقة من أصحابه فقال: ما أجلسكم؟ قالوا: جلسنا نذكر الله عز وجل، ونحمده على ما هدانا للإسلام، ومن علينا بك. قال: الله ما أجلسكم إلا ذاك؟ قالوا: الله ما أجلسنا إلا ذاك. قال: أما إني لم أستحلفكم تهمة لكم، فإنه أتاني جبريل فأخبرني أن الله عز وجل يباهي بكم الملائكة». انفرد بإخراج هذا والذي قبله مسلم.", "قال أحمد: وحدثنا محمد بن بكرة قال: حدثنا ميمون المرئي قال: حدثنا", "حاشية: (١) تصحفت في الأصل إلى: «الأعرابي».", "حاشية: (٢) ليست في الأصل.", "ميمون بن سياه عن أنس بن مالك عن رسول الله صلى الله عليه وسلم قال: «ما من قوم اجتمعوا يذكرون الله عز وجل، لا يريدون بذلك إلا وجهه، إلا ناداهم مناد من السماء: أن قوموا مغفورا لكم، قد بدلت سيئاتكم حسنات». قال أحمد: وحدثنا عبد الصمد قال: حدثنا محمد يعني ابن ثابت قال: حدثني أبي عن أنس أن رسول الله صلى الله عليه وسلم قال: «إذا مررتم برياض الجنة فارتعوا» قالوا: وما رياض الجنة؟ قال: «حلق الذكر».", "وقال الحسن: قال داود عليه السلام: إلهي، إذا مررت على ملإ يذكرونك فجاوزتهم، فاكسر الرجل التي تليهم.", "**ذم المجلس الخالي عن الذكر**", "أخبرنا ابن الحصين قال: أنا ابن المذهب قال: أنا أبو بكر بن مالك قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا روح قال: حدثنا حماد عن سهيل عن أبي صالح عن أبيه عن أبي هريرة عن النبي صلى الله عليه وسلم قال: «ما جلس قوم مجلسا فتفرقوا على غير ذكر الله عز وجل، إلا تفرقوا عن مثل جيفة حمار، وكان ذلك المجلس عليهم حسرة يوم القيامة».", "أخبرنا محمد بن ناصر قال: أخبرنا جدي أبو حكيم الخبري قال: أخبرنا أبو عبد الله الحسين بن أحمد القادسي قال: أخبرنا أبو بكر المفيد قال: أخبرنا أحمد بن عبد الرحمن السقطي قال: حدثنا يزيد بن هارون قال: أخبرنا شعبة عن الأعمش عن أبي صالح عن أبي سعيد الخدري عن النبي صلى الله عليه وسلم قال: «لا يجلس قوم مجلسا لا يذكرون الله عز وجل ولا يصلون فيه على النبي صلى الله عليه وسلم، إلا كان عليهم حسرة، وإن دخلوا الجنة لما يرون من الثواب».", "**فضيلة التهليل**", "أخبرنا هبة الله بن محمد قال: أخبرنا أبو علي التميمي قال: أخبرنا أبو بكر بن جعفر قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا إسحاق ابن"]], "ic": "book"}, {"story": ["الباب الأول في فضيلة الذكر على الجملة والتفصيل من الآيات وال (٤ من ٧)، ص٢٦٦", ["عيسى قال: أخبرني مالك عن سمي عن أبي صالح عن أبي هريرة قال: قال رسول الله صلى الله عليه وسلم: «من قال: لا إله إلا الله، وحده لا شريك له، له الملك وله الحمد، وهو على كل شيء قدير في يوم(١) مئة مرة كانت له عدل عشر رقاب، وكتبت له مئة حسنة، ومحيت عنه مئة سيئة، وكانت له حرزا من الشيطان يومه ذلك حتى يمسي، ولم يأت أحد بأفضل مما جاء به إلا أحد عمل أكثر من ذلك». أخرجاه في الصحيحين. وأخرجا من حديث أبي أيوب الأنصاري عن النبي صلى الله عليه وسلم أنه قال: «من قال: لا إله إلا الله ـ فذكر الكلمات ـ في يوم عشر مرار، كان كمن أعتق أربع رقاب من ولد إسماعيل». وفي حديث معاذ عن النبي صلى الله عليه وسلم أنه قال: «من شهد أن لا إله إلا الله مخلصا دخل الجنة».", "وقال نوف: أجد في التوراة أن السموات السبع والأرضين السبع وما فيهن لو كن طبقا من حديد وقال عبد: لا إله إلا الله. لخرقتهن حتى يصل إلى الله عز وجل.", "وقد سبق في ذكر الوضوء أنه: «من توضأ ثم قال: أشهد أن لا إله إلا الله، وأن محمدا عبده ورسوله، فتحت له أبواب الجنة الثمانية».", "**فضيلة التسبيح والتحميد وبقية الأذكار**", "أخبرنا هبة الله بن محمد قال: أخبرنا الحسن بن علي قال: أخبرنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد بن حنبل قال: حدثني أبي قال: حدثنا محمد بن فضيل عن عمارة عن أبي زرعة عن أبي هريرة قال: قال رسول الله صلى الله عليه وسلم: «كلمتان خفيفتان على اللسان، ثقيلتان في الميزان، حبيبتان إلى الرحمن: سبحان الله وبحمده سبحان الله العظيم». أخرجاه في الصحيحين، وفيهما من طريق آخر عن أبي هريرة عن النبي صلى الله عليه وسلم أنه قال: «من قال في يومه مئة مرة: سبحان الله وبحمده، حطت خطاياه، وإن كانت مثل زبد البحر».", "حاشية: (١) سقط من (ظ).", "وفي أفراد مسلم من حديث أبي ذر قال: قال لي رسول الله صلى الله عليه وسلم: «ألا أخبرك بأحب الكلام إلى الله عز وجل؟ سبحان الله وبحمده». وفي لفظ آخر من ألفاظ الصحيح قال: سئل رسول الله صلى الله عليه وسلم: أي الكلام أفضل؟ فقال: «ما اصطفى الله(١) لملائكته أو لعباده: سبحان الله وبحمده»."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "وفي أفراد مسلم من حديث أبي ذر قال: قال لي رسول الله صلى الله عليه وسلم: «ألا أخبرك بأحب الكلام إلى الله عز وجل؟ سبحان الله وبحمده». وفي لفظ آخر من ألفاظ ____ قال: سئل رسول الله صلى الله عليه وسلم:", "o": ["الصحيح", "آمنت", "التحية", "الجادة"], "h": "راجع: ص٢٦٧"}, {"t": "fill", "d": 2, "q": "قال أحمد: وحدثني علي بن بحر قال: حدثني مرحوم بن عبد العزيز قال: حدثني أبو نعامة السعدي عن أبي عثمان النهدي عن أبي سعيد الخدري قال: خرج معاوية بي قال: كنا جلوسا مع رسول الله صلى الله عليه وسلم فقال: «أيعجز أحدكم أن يكسب كل يوم ألف حسنة؟ فسأله سائل من جلساته: يا نبي الله، كيف يكسب أحدنا ألف حسنة؟ قال: «يسبح مئة تسبيحة فيكتب له ألف حسنة، أو يحط عنه ألف خطيئة». انفرد بإخراجه وبإخراج الذي قبله مسلم، وكذا في صحيحه: «أو يحط»، وقد رواه شعبة وأبو عوانة ويحيى بن سعيد القطان كلهم عن موسى فقالوا: «ويحط» بغير ألف.", "أخبرنا عبد الأول قال: أخبرنا الداودي قال: أخبرنا ابن أعين قال: حدثنا الفربري قال: حدثنا البخاري قال: حدثنا عبد الله بن مسلمة عن مالك عن نعيم بن عبد الله المجمر عن علي بن يحيى الزرقي عن أبيه عن رفاعة بن رافع الزرقي قال:", "حاشية: (١) ليست في (ظ).", "حاشية: (٢) ليست في الأصل.", "كنا نصلي يوما وراء رسول الله صلى الله عليه وسلم، فلما رفع رسول الله رأسه من الركعة وقال: «سمع الله لمن حمده»، قال رجل وراءه: ربنا ولك الحمد حمدا كثيرا طيبا مباركا فيه. فلما انصرف رسول الله صلى الله عليه وسلم قال: «من المتكلم آنفا؟» قال: أنا يا رسول الله. قال رسول الله صلى الله عليه وسلم: «لقد رأيت بضعة وثلاثين ملكا يبتدرونها أيهم يكتبها أولا» انفرد بإخراجه البخاري.", "وفي حديث أنس بن مالك قال: كنت مع رسول الله صلى الله عليه وسلم جالسا في الحلقة إذ جاء رجل فسلم، فلما جلس قال: الحمد لله حمدا كثيرا طيبا مباركا فيه كما يحب ربنا أن يحمد وينبغي له. فقال له(١) النبي صلى الله عليه وسلم: «والذي نفسي بيده لقد ابتدرها عشرة أملاك كلهم حريص على أن يكتبها، فما دروا كيف يكتبونها حتى رفعوها إلى ذي العزة عز وجل، فقال: اكتبوها كما قال عبدي»."]], "ic": "book"}, {"story": ["الباب الأول في فضيلة الذكر على الجملة والتفصيل من الآيات وال (٦ من ٧)، ص٢٦٨", ["وفي أفراد مسلم من حديث ابن عمر قال: بينما نحن نصلي مع رسول الله صلى الله عليه وسلم إذ قال رجل في القوم: الله أكبر كبيرا، والحمد لله كثيرا، وسبحان الله بكرة وأصيلا. فقال رسول الله صلى الله عليه وسلم: «من ا لقائل كذا وكذا؟» قال رجل من القوم: أنا يا رسول الله، قال: «عجبت لها فتحت لها أ بواب السماء».", "وفي أفراده من حديث أبي مالك الأشعري عن النبي صلى الله عليه وسلم أنه قال: «الحمد لله تملأ الميزان، سبحان الله والحمد لله تملآن أو تملأ ما بين السموات والأرض». وفي أفراده من حديث سمرة بن جندب عن النبي صلى الله عليه وسلم أنه قال: «أحب الكلام إلى الله تعالى: سبحان الله، والحمد لله، ولا إله إلا الله، والله أكبر، لا يضرك بأيهن بدأت» وفي أفراده من حديث أبي هريرة عن النبي صلى الله عليه وسلم أنه قال: «لأن أقول: سبحان الله، والحمد لله، ولا إله إلا الله، والله أكبر، أحب إلي مما طلعت عليه الشمس». وفي أفراده من حديث أبي ذر عن النبي صلى الله عليه وسلم أنه قال: «بكل تسبيحة صدقة، وبكل تكبيرة صدقة، وبكل تحميدة صدقة، وبكل تهليلة صدقة».", "وفي حديث عبد الله بن عمرو عن النبي صلى الله عليه وسلم أنه قال: «ما على الأرض رجل", "حاشية: (١) ليست في الأصل.", "يقول: لا إله إلا الله، والله أكبر، وسبحان الله، والحمد لله، ولا حول ولا قوة إلا بالله، إلا كفرت عنه ذنوبه ولو كانت أكثر من زبد البحر».", "وفي الصحيحين من حديث أبي موسى أن النبي صلى الله عليه وسلم قال له(١): «ألا أعلمك كلمة من كنوز الجنة: لا حول ولا قوة إلا بالله».", "**تسبيحات سليمان التيمي(٢)**", "أخبرنا إسماعيل بن أحمد السمرقندي قال: أخبرنا محمد بن هبة الله الطبري قال: أخبرنا ابن بشران قال: أخبرنا ابن صفوان قال: حدثنا أبو بكر عبد الله بن محمد القرشي قال: حدثني الفضيل بن عبد الوهاب قال: حدثني أبو عمر الخطابي عن المعتمر بن سليمان قال: كان أبي يحدث بخمسة أحاديث ثم يقول: أمهلوا، سبحان الله، والحمد لله، ولا إله إلا الله، والله أكبر، ولا حول ولا قوة إلا بالله، عدد ما خلق، وزنة ما خلق، وعدد ما هو خالق، وزنة ما هو خالق(٣-٣)ملء ما خلق وملء ما هو خالق(٣-٣)، وملء سماواته، وملء أرضه، ومثل ذلك، وأضعاف ذلك، وعدد خلقه، وزنة عرشه، ومنتهى رحمته، ومداد كلماته، ومبلغ رضاه، وحتى يرضى، وإذا رضي، وعدد ما ذكره به خلقه في جميع ما مضى، وعدد ما هم ذاكروه فيما بقي في كل سنة وشهر وجمعة ويوم وليلة وساعة من الساعات، ونسيم ونفسي، من أبد إلى أبد، أبد الدنيا وأبد الآخرة، وأكثر(٤) من ذلك، لا ينقطع أوله ولا ينفد آخره."]], "ic": "book"}, {"story": ["الباب الأول في فضيلة الذكر على الجملة والتفصيل من الآيات وال (٧ من ٧)، ص٢٦٩", ["قال محمد بن الحسين: وحدثني بعض البصريين أن يونس بن عبيد رأى رجلا ـ كان قد أصيب ببلاد الروم ـ فيما يرى النائم، فقال: ما أفضل ما رأيت ثم من الأعمال؟ قال: رأيت تسبيحات أبي المعتمر من الله بمكان.", "حاشية: (١) ليست في الأصل.", "حاشية: (٢) هو سليمان بن طرخا : 2, "q": "وأما الأخبار؛ ففي الصحيحين من حديث أبي هريرة عن النبي صلى ____ عليه وسلم أنه قال", "o": ["الله", "فضلات", "تطؤه", "ويكسى"], "h": "راجع: ص٢٦٢"}]}], "sum": [["الصفحات", "ص٢٦٢ - ص٢٧٠"]], "_nq": 12}, {"id": "l36", "title": "الباب الثاني في فضيلة الدعاء وآدابه وفي فضل بعض الأدعية المأثورة", "group": "كتاب الأذكار والدعوات", "map": {"center": "الباب\nالثاني في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الثاني في فضيلة الدعاء وآدابه وفي فضل بعض الأدعية المأثورة", "b": [{"pic": ["books", "book"], "cap": "ص٢٧١ - ص٢٧٧"}, {"story": ["الباب الثاني في فضيلة الدعاء وآدابه وفي فضل بعض الأدعية المأ (١ من ٥)، ص٢٧١", ["**في فضيلة الدعاء وآدابه وفي فضل بعض الأدعية المأثورة**", "**فضيلة الدعاء:** قال الله عز وجل: ﴿وَإِذَا سَأَلَكَ عِبَادِى عَنِّى فَإِنِّى قَرِيبٌ ۖ أُجِيبُ دَعْوَةَ ٱلدَّاعِ إِذَا دَعَانِ﴾ [البقرة: ١٨٦]، وقال: ﴿ٱدْعُوا۟ رَبَّكُمْ تَضَرُّعًا وَخُفْيَةً﴾ [الأعراف: ٥٥]، وقال: ﴿وَقَالَ رَبُّكُمُ ٱدْعُونِىٓ أَسْتَجِبْ لَكُمْ ۚ إِنَّ ٱلَّذِينَ يَسْتَكْبِرُونَ عَنْ عِبَادَتِى سَيَدْخُلُونَ جَهَنَّمَ دَاخِرِينَ﴾ [غافر: ٦٠].", "وقد روى ابن مسعود عن النبي صلى الله عليه وسلم أنه قال: «سلوا الله من فضله، فإن الله يحب أن يسأل».", "وروى أبو هريرة عن النبي صلى الله عليه وسلم أنه قال: «ليس شيء أكرم على الله من الدعاء، وأشرف العبادة الدعاء، ومن لا يسأل الله عز وجل يغضب عليه».", "**آداب الدعاء:** وهي أربعة عشر:", "**الأول:** أن يتوخى لدعائه الأوقات الشريفة، كيوم عرفة من السنة، ورمضان من الشهور، والجمعة من الأسبوع، والسحر من الليل، وقد روي في يوم الأربعاء بين الصلاتين فضيلة؛ فأخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا أبو عامر قال: حدثنا كثير بن زيد(١) قال: حدثني عبد الله بن عبد الرحمن بن كعب بن مالك قال: حدثني جابر أن النبي صلى الله عليه وسلم دعا في مسجد الفتح يوم الاثنين ويوم الثلاثاء ويوم الأربعاء، فاستجيب له يوم الأربعاء بين الصلاتين، فعرف البشر في وجهه،", "حاشية: (١) تحرف في الأصل إلى: «يزيد».", "قال جابر: فلم ينزل بي (١-١)أمر مهم(١-١) غائظ(٢) إلا توخيت تلك الساعة، فأدعو فيها فأعرف الإجابة.", "**الثاني:** أن يترصد الأحوال الشريفة مثل ما بين الأذان والإقامة، وقد روى أنس عن النبي صلى الله عليه وسلم أنه قال: «الدعاء لا يرد بين الأذان والإقامة». ومن الأوقات الشريفة عقيب الصلوات، وعند نزول الغيث، وعند القتال في سبيل الله عز وجل، وعند ختم القرآن، وفي السجود، وعند الإفطار، وعند حضور القلب ووجله؛ قال شهر بن حوشب: قالت أم الدرداء: إنما الوجل في قلب ابن آدم كاحتراق السعفة، أما تجد لها قشعريرة؟ قلت: بلى. قالت: فادع إذا وجدت ذلك، فإن الدعاء يستجاب عند ذلك.", "وعلى الحقيقة فإن شرف الأوقات يرجع إلى شرف الحالات أيضا، فإن وقت السحر وقت صفاء القلب وفراغه، وحالة السجود حالة الذل.", "**الثالث:** أن يدعو مستقبل القبلة، ويرفع يديه. ففي حديث جابر أن النبي صلى الله عليه وسلم أتى الموقف، واستقبل القبلة، ولم يزل يدعو.", "وفي حديث سلمان عن النبي صلى الله عليه وسلم أنه قال: «إن ربكم حي كريم يستحيي من عبده إذا رفع يديه إليه أن يردهما صفرا»."]], "ic": "book"}, {"story": ["الباب الثاني في فضيلة الدعاء وآدابه وفي فضل بعض الأدعية المأ (٢ من ٥)، ص٢٧٢", ["ثم ينبغي أن يمسح بهما وجهه في آخر الدعاء، وقد جاء في حديث عمر عن النبي صلى الله عليه وسلم أنه كان إذا مد يديه في الدعاء، لم يردهما حتى يمسح بهما وجهه.", "**الرابع:** خفض الصوت: ففي الصحيحين من حديث أبي موسى قال: كنا مع رسول الله صلى الله عليه وسلم في غزاة، فجعلنا لا نصعد شرفا ولا نهبط واديا إلا رفعنا أصواتنا بالتكبير(٣)، قال: فدنا منا رسول الله صلى الله عليه وسلم فقال: «أيها الناس أربعوا على أنفسكم، فإنكم ما تدعون أصم ولا غائبا، إنما تدعون سميعا بصيرا، إن الذي تدعون أقرب إلى أحدكم من عنق راحلته».", "حاشية: (١-١) سقط من (ظ).", "حاشية: (٢) في المسند: «غليظ».", "حاشية: (٣) ليست في (ظ).", "**الخامس:** أن يبدأ بذكر الله عز وجل قبل الدعاء، قالت أم سليم: يا رسول الله، علمني كلمات أدعو بهن، قال: «تسبحين الله عشرا وتحمدينه عشرا، وتكبرينه عشرا، ثم تسألي حاجتك، فإنه يقول: قد فعلت قد فعلت».", "**السادس:** أن يصلي على رسول الله صلى الله عليه وسلم قبل دعائه، فقد روى الترمذي من حديث ابن مسعود قال: كنت أصلي، فلما جلست بدأت بالثناء على الله تعالى، ثم الصلاة على رسول الله صلى الله عليه وسلم، ثم دعوت لنفسي، فقال رسول الله صلى الله عليه وسلم: «سل تعطه، سل تعطه».", "وروى الترمذي بإسناده عن عمر بن الخطاب قال: الدعاء موقوف بين السماء والأرض، لا يصعد منه شيء حتى تصلي على نبيك صلى الله عليه وسلم.", "(١-١)وقال أبو سليمان الداراني: من أراد أن يسأل الله حاجته، فليبدأ بالصلاة على النبي صلى الله عليه وسلم، ثم يسأل حاجته(١-١)، ثم يختم بالصلاة على النبي صلى الله عليه وسلم فإن الله تعالى يقبل الصلاتين، وهو أكرم من أن يدع ما بينهما.", "**السابع:** أن لا يتكلف السجع في الدعاء، فإن التكلف لا يناسب حال المتضرع، ففي أفراد البخاري من حديث عكرمة عن ابن عباس أنه قال له: انظر السجع من الدعاء فاجتنبه، فإني عهدت رسول الله صلى الله عليه وسلم وأصحابه لا يفعلون ذلك، (٢-٢)فإن قيل: فقد جاءت أدعية مسجوعة كقوله: «أعوذ بك من علم لا ينفع، ومن عين لا تدمع». فالجواب: أن ذلك وقع غير متكلف، والمذموم التكلف(٢-٢).", "**الثامن:** أن لا يتجاوز الداعي الدعوات المأثورة، إلا أن يكون عالما بالصواب فيما يسأله، لئلا يسأل مالا تقتضيه مصلحته، فما كل أحد يحسن أن يدعو.", "**التاسع:** التضرع والخشوع والرهبة، فقد قال تعالى: ﴿وَيَدْعُونَنَا رَغَبًا وَرَهَبًا﴾ [الأنبياء: ٩٠]، وقال: ﴿ٱدْعُوا۟ رَبَّكُمْ تَضَرُّعًا وَخُفْيَةً﴾ [الأعراف: ٥٥]، وقال: ﴿فَلَوْلَآ إِذْ جَآءَهُم بَأْسُنَا تَضَرَّعُوا۟﴾ [الأنعام: ٤٣].", "حاشية: (١-١) سقط من (ظ).", "حاشية: (٢-٢) سقط من (ظ)."]], "ic": "book"}, {"story": ["الباب الثاني في فضيلة الدعاء وآدابه وفي فضل بعض الأدعية المأ (٣ من ٥)، ص٢٧٤", ["**العاشر:** أن يجزم الدعاء، ففي الصحيحين من حديث أنس عن النبي صلى الله عليه وسلم أنه قال: «إذا دعا أحدكم فليعزم الدعاء، ولا يقل: إن شئت فأعطني، فإن الله عز وجل لا مستكره له».", "**الحادي عشر:** أن يوقن بالإجابة، ففي حديث أبي هريرة عن النبي صلى الله عليه وسلم أنه قال: «ادعوا الله وأنتم موقنون بالإجابة، واعلموا أن الله لا يقبل دعاء من قلب غافل لاه».", "**الثاني عشر:** أن يلح في الدعاء، فقد روت عائشة عن النبي صلى الله عليه وسلم: «إن الله يحب الملحفين(١) في الدعاء».", "**الثالث عشر:** أن ينتظر الإجابة، ففي الصحيحين من حديث أبي هريرة عن النبي صلى الله عليه وسلم أنه قال: «يستجاب لأحدكم ما لم يعجل، يقول: دعوت فلم يستجب لي».", "**الرابع عشر:** وهو الأدب الباطن، وهو الأصل في الإجابة، والتوبة، ورد المظالم، ففي أفراد مسلم من حديث أبي هريرة عنه صلى الله عليه وسلم أنه ذكر «الرجل يطيل السفر أشعث أغبر، ثم يمد يده إلى السماء: يا رب يا رب، مطعمه حرام، ومشربه حرام، وملبسه حرام، وغذي بالحرام، فأنى يستجاب لذلك».", "وقال مالك بن دينار: أصاب بني إسرائيل بلاء، فخرجوا مخرجا، فأوحى الله إلى نبيهم، أن أخبرهم: تخرجون إلى الصعيد بأبدان نجسة، وترفعون إلي أكفا قد سفكتم بها الدماء، وملأتم بها بيوتكم من الحرام، الآن حين اشتد غضبي عليكم فلن تزدادوا إلا بعدا.", "**فضيلة الصلاة على رسول الله صلى الله عليه وسلم**", "قال الله تعالى: ﴿إِنَّ ٱللَّهَ وَمَلَٰٓئِكَتَهُۥ يُصَلُّونَ عَلَى ٱلنَّبِىِّ ۚ يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ صَلُّوا۟ عَلَيْهِ وَسَلِّمُوا۟ تَسْلِيمًا﴾ [الأحزاب: ٥٦].", "حاشية: (١) الملحفين: الملحين، يقال: ألحف في المسألة، إذا ألح بها.", "وأخبرنا هبة الله بن محمد قال: أخبرنا الحسن بن علي قال: أخبرنا أحمد بن جعفر قال: أخبرنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا سليمان بن داود قال: أخبرنا إسماعيل قال: أخبرني العلاء عن أبيه عن أبي هريرة قال: قال رسول الله صلى الله عليه وسلم: «من صلى علي واحدة يصلي الله عز وجل عليه عشرا». انفرد بإخراجه مسلم.", "وفي حديث أنس بن مالك عن النبي صلى الله عليه وسلم أنه قال: «من صلى علي واحدة صلى الله عليه عشر صلوات، وحط عنه عشر خطيئات»."]], "ic": "book"}, {"story": ["الباب الثاني في فضيلة الدعاء وآدابه وفي فضل بعض الأدعية المأ (٤ من ٥)، ص٢٧٥", ["أخبرنا الكروخي قال: أخبرنا أبو عامر الأزدي وأبو بكر الغورجي قالا: أخبرنا الجراحي قال: حدثنا المحبوبي قال: حدثنا الترمذي قال: حدثنا محمد بن بشار قال: حدثنا محمد بن خالد بن عثمة قال: حدثني موسى بن يعقوب الزمعي قال: حدثني عبد الله بن كيسان أن عبد الله بن شداد أخبره عن عبد الله بن مسعود أن رسول الله صلى الله عليه وسلم قال: «أولى الناس بي يوم القيامة أكثرهم علي صلاة». وفي حديث ابن مسعود عن النبي صلى الله عليه وسلم أنه قال: «إن لله عز وجل ملائكة سياحين يبلغوني من أمتي السلام».", "**فضيلة الاستغفار**", "قال الله عز وجل: ﴿وَٱلَّذِينَ إِذَا فَعَلُوا۟ فَٰحِشَةً أَوْ ظَلَمُوٓا۟ أَنفُسَهُمْ ذَكَرُوا۟ ٱللَّهَ فَٱسْتَغْفَرُوا۟ لِذُنُوبِهِمْ﴾ [آل عمران: ١٣٥]. قال ابن مسعود رضي الله عنه: في كتاب الله عز وجل آيتان ما أذنب عبد فقرأهما، واستغفر الله إلا غفر له، هذه الآية قوله: ﴿وَمَن يَعْمَلْ سُوٓءًا أَوْ يَظْلِمْ نَفْسَهُۥ﴾ الآية [النساء: ١١٠]، وقد قال عز وجل: ﴿وَٱلْمُسْتَغْفِرِينَ بِٱلْأَسْحَارِ﴾ [آل عمران: ١٧]، وقال: ﴿فَسَبِّحْ بِحَمْدِ رَبِّكَ وَٱسْتَغْفِرْهُ﴾ [النصر: ٣].", "وفي الصحيحين من حديث أبي هريرة عن النبي صلى الله عليه وسلم: «أن رجلا أذنب ذنبا، فقال: إني أذنبت ذنبا فاغفره لي. فقال تعالى: عبدي عمل ذنبا، فعلم أن له ربا يغفر الذنب ويأخذ به، قد غفرت لعبدي. ثم عمل ذنبا آخر، فقال: رب إني عملت ذنبا، فاغفره. فقال عز وجل: علم عبدي أن له ربا يغفر الذنب ويأخذ به، قد", "غفرت لعبدي. ثم عمل ذنبا آخر، فقال: رب إني عملت ذنبا فاغفره. فقال عز وجل: علم عبدي أن له ربا يغفر الذنب ويأخذ به، قد غفرت لعبدي. ثم عمل ذنبا آخر فقال: رب إني عملت ذنبا، فاغفره لي. فقال عز وجل: علم عبدي أن له ربا يغفر الذنب ويأخذ به، أشهدكم أني قد غفرت لعبدي، فليعمل ما شاء»."]], "ic": "book"}, {"story": ["الباب الثاني في فضيلة الدعاء وآدابه وفي فضل بعض الأدعية المأ (٥ من ٥)، ص٢٧٦", ["أخبرنا هبة الله بن محمد قال: أخبرنا الحسن بن علي قال: أخبرنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا محمد بن أبي عدي قال: حدثنا حسين ـ يعني المعلم ـ عن عبد(١) الله بن بريدة عن بشير بن كعب عن شداد بن أوس قال: قال رسول الله صلى الله عليه وسلم: «سيد الاستغفار: اللهم أنت ربي لا إله إلا أنت، خلقتني وأنا عبدك، وأنا على عهدك ووعدك ما استطعت، أعوذ بك من شر ما صنعت، أبوء لك بنعمتك علي، وأبوء لك بذنبي فاغفر لي، فإنه لا يغفر الذنوب إلا أنت. من قالها بعد ما يصبح موقنا بها، فمات من يومه كان من أهل الجنة، ومن قالها بعدما يمسي موقنا بها، فمات من ليلته كان من أهل الجنة». قال الإمام أحمد: وحدثنا يونس قال: حدثنا حماد ـ يعني ابن زيد ـ قال: حدثنا ثابت قال: حدثنا أبو بردة عن الأغر المزني قال: قال رسول الله صلى الله عليه وسلم: «إنه ليغان(٢) على قلبي، وإني لأستغفر الله عز وجل في اليوم مئة مرة».", "قال أحمد: وحدثنا عبد الرزاق قال: أخبرنا معمر عن جعفر الجزري عن يزيد بن الأصم عن أبي هريرة قال: قال رسول الله صلى الله عليه وسلم: «والذي نفسي بيده، لو لم تذنبوا لذهب الله عز وجل بكم، ولجاء بقوم يذنبون، فيستغفرون الله، فيغفر لهم» انفرد بهذا الحديث وبالحديث الذي قبله مسلم، وانفرد بالأول البخاري.", "وفي حديث علي رضي الله عنه عن النبي صلى الله عليه وسلم أنه قال: «يعجب الرب من عبده إذا قال: رب اغفر لي، ويقول: علم عبدي أنه لا يغفر الذنوب غيري».", "حاشية: (١) تحرف في (ظ) إلى: «عبيد».", "حاشية: (٢) ورد هنا في هامش (ظ) ما نصه: «غين على قلبه غبنا: تغشته الشهوة، أو غطي عليه وألبس، أو غشي عليه».", "وفي حديث أبي سعيد الخدري عن النبي صلى الله عليه وسلم قال: «قال إبليس لربه عز وجل: بعزتك وجلالك لا أبرح أغوي بني آدم ما دامت الأرواح فيهم. فقال له ربه عز وجل: فبعزتي وجلالي لا أبرح أغفر لهم ما استغفروني».", "وقال لقمان لابنه: يا بني، عود لسانك: اللهم اغفر لي، فإن لله ساعات لا يرد فيهن سائلا."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "وفي حديث أبي سعيد الخدري عن النبي صلى الله عليه ____ قال", "o": ["وسلم", "مثمرة", "ويعين", "صياما"], "h": "راجع: ص٢٧٧"}, {"t": "fill", "d": 2, "q": "الأول: أن يتوخى لدعائه الأوقات الشريفة، كيوم عرفة من السنة، ورمضان من الشهور، والجمعة من الأسبوع، ____ من الليل، وقد روي في يوم الأربعاء بين الصلاتين فضيلة؛ فأخبرنا ابن الحصين قال: أخبرنا ابن", "o": ["والسحر", "الممل", "ونشكره", "الحادث"], "h": "راجع: ص٢٧١"}, {"t": "fill", "d": 2, "q": "الثاني عشر: أن يلح في الدعاء، فقد روت عائشة عن ____ صلى الله عليه وسلم: «إن الله يحب الملحفين في", "o": ["النبي", "وجرير", "فثبت", "المجردة"], "h": "راجع: ص٢٧٤"}, {"t": "fill", "d": 2, "q": "الرابع: خفض الصوت: ففي الصحيحين من حديث أبي موسى قال: كنا مع رسول الله صلى الله عليه وسلم في غزاة، فجعلنا لا نصعد شرفا ولا نهبط ____ إلا رفعنا أصواتنا بالتكبير، قال: فدنا منا رسول الله صلى", "o": ["واديا", "بيته", "ويفصل", "ملكين"], "h": "راجع: ص٢٧٢"}, {"t": "fill", "d": 2, "q": "السابع: أن لا يتكلف السجع في الدعاء، فإن التكلف لا يناسب حال المتضرع، ففي أفراد البخاري من حديث عكرمة عن ابن ____ أنه قال له: انظر السجع من الدعاء فاجتنبه، فإني عهدت رسول الله صلى الله عليه وسلم", "o": ["عباس", "وجلالك", "سمرة", "بكتابك"], "h": "راجع: ص٢٧٣"}, {"t": "fill", "d": 2, "q": "وعلى الحقيقة فإن شرف الأوقات يرجع إلى شرف الحالات أيضا، فإن وقت السحر وقت صفاء القلب وفراغه، وحالة السجود حالة ____", "o": ["الذل", "أعاقب", "أرطاة", "المرأة"], "h": "راجع: ص٢٧٢"}]}], "sum": [["الصفحات", "ص٢٧١ - ص٢٧٧"]], "_nq": 6}, {"id": "l37", "title": "الباب الثالث فيه أدعية مأثورة عن رسول الله صلى الله عليه وسلم", "group": "كتاب الأذكار والدعوات", "map": {"center": "الباب\nالثالث فيه", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الثالث فيه أدعية مأثورة عن رسول الله صلى الله عليه وسلم", "b": [{"pic": ["books", "book"], "cap": "ص٢٧٨ - ص٢٨١"}, {"story": ["الباب الثالث فيه أدعية مأثورة عن رسول الله صلى الله عليه وسل (١ من ٣)، ص٢٧٨", ["**فيه أدعية مأثورة عن رسول الله صلى الله عليه وسلم**", "أخبرنا أبو القاسم الكاتب قال: أخبرنا أبو علي التميمي قال: أخبرنا أبو بكر بن مالك قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا ابن نمير عن هشام عن أبيه عن عائشة أن رسول الله صلى الله عليه وسلم كان يدعو بهؤلاء الدعوات: «اللهم إني أعوذ بك من فتنة النار، وعذاب النار، وفتنة القبر، وعذاب القبر، ومن شر فتنة الغنى، ومن فتنة الفقر، وأعوذ بك من فتنة المسيح الدجال، اللهم اغسل خطاياي بماء الثلج والبرد، ونق قلبي من الخطايا كما نقيت الثوب الأبيض من الدنس، وباعد بيني وبين خطاياي كما باعدت بين المشرق والمغرب، اللهم إني أعوذ بك من الكسل والهرم والمأثم والمغرم». أخرجاه في الصحيحين.", "وأخرجا من حديث أبي موسى عن النبي صلى الله عليه وسلم أنه كان يدعو بهذا الدعاء: «اللهم اغفر لي خطئي وجهلي، وإسرافي في أمري، وما أنت أعلم به مني، اللهم اغفر لي جدي وهزلي، وخطئي وعمدي، وكل ذلك عندي، اللهم اغفر لي ما قدمت، وما أخرت، وما أسررت وما أعلنت، وما أنت أعلم به مني، أنت المقدم، وأنت المؤخر، وأنت على كل شيء قدير». وأخرجا من حديث أبي هريرة عن النبي صلى الله عليه وسلم أنه قال: «تعوذوا بالله من جهد البلاء، ودرك الشقاء، وسوء القضاء، وشماتة الأعداء».", "وأخرجا من حديث أنس قال: كان أكثر دعاء النبي صلى الله عليه وسلم قال: «اللهم آتنا في الدنيا حسنة، وفي الآخرة حسنة، وقنا عذاب النار».", "وفي أفراد مسلم من حديث زيد بن أرقم عن النبي صلى الله عليه وسلم أنه كان يقول: «اللهم إني أعوذ بك من العجز والكسل، والجبن والبخل، والهرم وعذاب القبر، اللهم آت نفسي تقواها، وزكها أنت خير من زكاها، أنت وليها ومولاها، اللهم إني أعوذ", "بك من علم لا ينفع، ومن قلب لا يخشع، ومن نفس لا تشبع، ومن دعوة لا يستجاب لها».", "وفي أفراده من حديث علي رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «قل اللهم إني أسألك الهدى والسداد، واذكر بالهدى هدايتك الطريق، وبالسداد سداد السهم».", "وفي أفراده من حديث أبي هريرة أن رسول الله صلى الله عليه وسلم كان يقول: «اللهم أصلح لي ديني الذي هو عصمة أمري، وأصلح لي دنياي التي فيها معاشي، وأصلح لي آخرتي التي فيها معادي، واجعل الحياة زيادة لي في كل خير، واجعل الموت راحة لي من كل شر».", "وفي أفراده من حديث عائشة أنه كان يقول في دعائه: «اللهم إني أعوذ بك من شر ما عملت وما لم أعمل».", "وأنها سمعته يقول: «اللهم إني أعوذ برضاك من سخطك، وبمعافاتك من عقوبتك، وأعوذ بك منك، لا أحصي ثناء عليك أنت كما أثنيت على نفسك»."]], "ic": "book"}, {"story": ["الباب الثالث فيه أدعية مأثورة عن رسول الله صلى الله عليه وسل (٢ من ٣)، ص٢٧٩", ["أخبرنا الكروخي قال: أخبرنا أبو عامر الأزدي وأبو بكر الغورجي قالا: أخبرنا الجراحي قال: حدثنا المحبوبي قال: حدثنا الترمذي قال: حدثنا محمود بن غيلان قال: حدثنا أبو داود الحفري عن سفيان الثوري عن عمرو بن مرة عن عبد الله بن الحارث عن طليق بن قيس عن ابن عباس قال: كان النبي صلى الله عليه وسلم يدعو يقول: «رب أعني ولا تعن علي، وانصرني ولا تنصر علي، وامكر لي ولا تمكر علي، واهدني ويسر الهدى لي، وانصرني على من بغى علي، رب اجعلني لك شكارا، لك ذكارا، لك رهابا، لك مطواعا، لك مخبتا، إليك أواها منيبا، رب تقبل توبتي، واغسل حوبتي، وأجب دعوتي، وثبت حجتي، وسدد لساني، واهد قلبي، واسلل سخيمة قلبي» قال الترمذي: هذا حديث حسن صحيح.", "أخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا روح قال: حدثنا الأوزاعي عن حسان بن عطية عن شداد بن أوس عن النبي صلى الله عليه وسلم أنه قال: «إذا كنز", "الناس الذهب والفضة، فاكنزوا هؤلاء الكلمات: اللهم إني أسألك الثبات في الأمر، والعزيمة على الرشد، وأسألك شكر نعمتك، وأسألك حسن عبادتك، وأسألك قلبا سليما ولسانا صادقا، وأسألك من خير ما تعلم، وأعوذ بك من شر ما تعلم، وأستغفرك لما تعلم، إنك أنت علام الغيوب».", "قال أحمد: وحدثنا عفان قال: حدثنا حماد قال: أخبرنا جبير بن حبيب عن أم كلثوم بنت أبي بكر عن عائشة أن رسول الله صلى الله عليه وسلم علمها هذا الدعاء: «اللهم إني أسألك من الخير كله عاجله وآجله ما علمت منه وما لم أعلم، وأعوذ بك من الشر كله عاجله وآجله ما علمت منه وما لم أعلم، اللهم إني أسألك من خير ما سألك عبدك ونبيك، وأعوذ بك من شر ما عاذ منه عبدك ونبيك، اللهم إني أسألك الجنة وما قرب إليها من قول أو عمل، وأعوذ بك من النار وما قرب إليها من قول أو عمل، وأسألك أن تجعل كل قضاء تقضيه لي خيرا».", "قال أحمد: وحدثنا يحيى بن سعيد عن مالك بن(١) مغول قال: حدثنا عبد الله بن بريدة عن أبيه قال: سمع النبي صلى الله عليه وسلم رجلا يقول: اللهم إني أسألك بأني أشهد أنك الله الذي لا إله إلا أنت، الأحد الصمد، الذي لم يلد ولم يولد، ولم يكن له كفوا أحد. فقال: «قد سأل باسم الله الأعظم، الذي إذا سئل به أعطى، وإذا دعي به أجاب»."]], "ic": "book"}, {"story": ["الباب الثالث فيه أدعية مأثورة عن رسول الله صلى الله عليه وسل (٣ من ٣)، ص٢٨٠", ["أخبرنا محمد بن ناصر قال: أخبرنا نصر بن أحمد قال: حدثنا ابن رزقويه قال: حدثنا عبد الله بن جعفر بن درستويه قال: حدثنا قاسم بن المغيرة قال: حدثنا عبد الصمد بن النعمان قال: حدثنا ياسين الزيات عن العلاء بن المسيب عن أبي داود عن البراء عن النبي صلى الله عليه وسلم قال: «إذا أراد الله بعبد خيرا علمه هؤلاء الكلمات، ثم لم ينسهن: اللهم إني ضعيف فقو في رضاك ضعفي، وخذ إلى الخير بناصيتي، واجعل الإسلام منتهى رضاي، اللهم إني ضعيف فقوني، وإني ذليل فأعزني، وإني فقير فأغنني».", "حاشية: (١) تحرفت في الأصل إلى: «عن».", "أخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أحمد بن جعفر قال: حدثني أبي قال حدثنا وكيع قال: حدثني عكرمة ابن عمار عن إسحاق بن عبد الله بن أبي طلحة عن أنس بن مالك قال: جاءت أم سليم إلى النبي صلى الله عليه وسلم فقالت: يا رسول الله، علمني كلمات أدعو بهن. قال: «تسبحين الله عشرا، وتحمدينه عشرا، وتكبرينه عشرا، ثم تسألي حاجتك، فإنه يقول: قد فعلت قد فعلت»."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "أخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا روح قال: حدثنا الأوزاعي عن ____ بن عطية عن شداد بن أوس عن النبي صلى الله عليه", "o": ["حسان", "وتفهم", "وردت", "العظم"], "h": "راجع: ص٢٧٩"}, {"t": "fill", "d": 2, "q": "وفي أفراده من حديث علي رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «قل اللهم إني أسألك الهدى والسداد، واذكر بالهدى هدايتك ____، وبالسداد سداد", "o": ["الطريق", "بسعد", "صعبت", "أقدر"], "h": "راجع: ص٢٧٩"}, {"t": "fill", "d": 2, "q": "الناس الذهب والفضة، ____ هؤلاء الكلمات", "o": ["فاكنزوا", "الورقة", "الصعداء", "لتمييز"], "h": "راجع: ص٢٨٠"}, {"t": "fill", "d": 2, "q": "أخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أحمد بن جعفر قال: حدثني أبي قال حدثنا وكيع قال: حدثني عكرمة ابن عمار عن إسحاق بن عبد الله بن أبي طلحة عن أنس بن ____ قال: جاءت أم سليم إلى النبي", "o": ["مالك", "الرأي", "وخرجت", "فيصومه"], "h": "راجع: ص٢٨١"}, {"t": "fill", "d": 2, "q": "أخبرنا الكروخي قال: أخبرنا أبو عامر الأزدي وأبو بكر الغورجي قالا: أخبرنا الجراحي قال: حدثنا المحبوبي قال: حدثنا الترمذي قال: حدثنا محمود بن غيلان قال: حدثنا أبو داود الحفري عن ____ الثوري عن عمرو بن", "o": ["سفيان", "وجعل", "لأجزاء", "محاسن"], "h": "راجع: ص٢٧٩"}, {"t": "fill", "d": 2, "q": "وفي أفراده من حديث عائشة أنه كان ____ في دعائه", "o": ["يقول", "وتصديق", "وعلمته", "وطلبه"], "h": "راجع: ص٢٧٩"}]}], "sum": [["الصفحات", "ص٢٧٨ - ص٢٨١"]], "_nq": 6}, {"id": "l38", "title": "الباب الرابع في الأدعية المأثورة عند الحوادث", "group": "كتاب الأذكار والدعوات", "map": {"center": "الباب\nالرابع في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الرابع في الأدعية المأثورة عند الحوادث - القسم ١ من ٢", "b": [{"pic": ["books", "book"], "cap": "ص٢٨٢ - ص٢٩٢"}, {"story": ["الباب الرابع في الأدعية المأثورة عند الحوادث (١ من ٧)، ص٢٨٢", ["**في الأدعية المأثورة عند الحوادث**", "قد سبق ذكر الدعاء عند الأذان، وبين الأذان والإقامة، وما يقال عقيب الوضوء.", "**فإذا خرجت إلى المسجد،** فقل: اللهم إني أسألك بحق السائلين عليك وبممشاي هذا إليك فإني لم أخرج أشرا ولا بطرا ولا رياء ولا سمعة، خرجت اتقاء سخطك وابتغاء مرضاتك، أسألك أن تجيرني من النار، وأن تغفر لي ذنوبي، إنه لا يغفر الذنوب إلا أنت.", "**فإذا دخلت المسجد،** فقد روى مسلم في صحيحه أن النبي صلى الله عليه وسلم قال: «إذا دخل أحدكم المسجد فليقل: اللهم افتح لي أبواب رحمتك، وإذا خرج فليقل: اللهم إني أسألك من فضلك».", "**فإذا فرغت من الصلاة،** ففي الصحيحين من حديث المغيرة عن النبي صلى الله عليه وسلم أنه كان يقول في دبر كل صلاة: «لا إله إلا الله، وحده لا شريك له، له الملك وله الحمد، وهو على كل شيء قدير، اللهم لا مانع لما أعطيت، ولا معطي لما منعت، ولا ينفع ذا الجد منك الجد».", "وفي أفراد مسلم من حديث ابن الزبير عن النبي صلى الله عليه وسلم أنه كان يقول إذا سلم في دبر كل صلاة(١): «لا إله إلا الله، وحده لا شريك له، له الملك، وله الحمد، وهو على كل شيء قدير، لا حول ولا قوة إلا بالله، لا نعبد إلا إياه، أهل النعمة والفضل والثناء الحسن، لا إله إلا الله، مخلصين له الدين ولو كره الكافرون».", "وفي أفراده من حديث ثوبان قال: كان رسول الله صلى الله عليه وسلم إذا أراد أن ينصرف من", "حاشية: (١) في الأصل: «دبر الصلاة».", "صلاته استغفر ثلاث مرات، ثم قال: «أنت السلام، ومنك السلام، تباركت يا ذا الجلال والإكرام».", "وفي أفراده من حديث أبي هريرة قال: قال رسول الله صلى الله عليه وسلم: «من سبح الله عز وجل دبر كل صلاة ثلاثا وثلاثين، وحمد ثلاثا وثلاثين، وكبر ثلاثا وثلاثين، وقال تمام المئة: لا إله إلا الله، وحده لا شريك له، له الملك، وله الحمد، وهو على كل شيء قدير. غفرت له خطاياه، وإن كانت مثل زبد البحر».", "وفي أفراده من حديث كعب بن عجرة عن رسول الله صلى الله عليه وسلم أنه قال: «معقبات(١) لا يخيب قائلهن أو فاعلهن دبر كل صلاة مكتوبة؛ ثلاثا وثلاثين تسبيحة، وثلاثا وثلاثين تحميدة، وأربعا وثلاثين تكبيرة».", "**فإذا قمت من مجلس،** فقل ما روى أبو هريرة عن النبي صلى الله عليه وسلم أنه قال: «من جلس في مجلس فكثر فيه لغطه، فقال قبل أن يقوم من مجلسه ذلك: سبحانك اللهم وبحمدك، أشهد أن لا إله إلا أنت، أستغفرك وأتوب إليك. إلا غفر له ما كان في مجلسه ذلك». رواه الترمذي وصححه.", "**فإذا دخلت السوق،** ففي حديث بريدة عن النبي صلى الله عليه وسلم أنه كان إذا دخل السوق قال: «اللهم إني أسألك خير هذا السوق وخير ما فيها، وأعوذ بك من شرها وشر ما فيها، اللهم إني أعوذ بك أن أصيب فيها يمينا فاجرة، أو صفقة خاسرة»."]], "ic": "book"}, {"story": ["الباب الرابع في الأدعية المأثورة عند الحوادث (٢ من ٧)، ص٢٨٣", ["وفي حديث عمر بن الخطاب عن النبي صلى الله عليه وسلم أنه قال: «من دخل السوق، فقال: لا إله إلا الله وحده لا شريك له، له الملك وله الحمد، يحيي ويميت، وهو حي لا يموت، بيده الخير، وهو على كل شيء قدير، كتب الله(٢) له ألف ألف حسنة، ومحا عنه ألف ألف سيئة، ورفع له ألف ألف درجة».", "**فإذا لبست ثوبا جديدا،** فقد أخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أبو بكر بن جعفر قال: أخبرنا عبد الله بن أحمد قال: حدثني أبي", "حاشية: (١) معقبات: أي تسبيحات تفعل أعقاب الصلوات، أو لأنها تفعل مرة عقيب أخرى.", "حاشية: (٢) ليست في (ظ).", "قال: حدثنا خلف بن الوليد قال: حدثنا ابن المبارك عن سعيد الجريري عن أبي نضرة عن أبي سعيد قال: كان رسول الله صلى الله عليه وسلم إذا استجد ثوبا ـ سماه باسمه قميص أو عمامة ـ يلبسه ثم يقول: «اللهم لك الحمد أنت كسوتنيه، أسألك من خيره وخير ما صنع له، وأعوذ بك من شره وشر ما صنع له».", "قال أحمد: وحدثنا يزيد بن هارون قال: حدثنا أصبغ عن أبي العلاء الشامي قال: لبس أبو أمامة ثوبا جديدا، فلما بلغ ترقوته قال: الحمد لله الذي كساني ما أواري به عورتي، وأتجمل به في حياتي، ثم قال: سمعت عمر بن الخطاب رضي الله عنه يقول: قال رسول الله صلى الله عليه وسلم: «فمن استجد ثوبا فلبسه، فقال حين يبلغ ترقوته: الحمد لله الذي كساني ما أواري به عورتي وأتجمل به في حياتي، ثم عمد إلى الثوب الذي أخلق ـ أو قال: ألقى ـ فتصدق به، كان في ذمة الله، وفي جوار الله، وفي كنف الله حيا وميتا، حيا وميتا، حيا وميتا».", "**وإذا رأيت الهلال،** فكبر ثلاثا، وقل: اللهم أهله علينا بالأمن والإيمان، والسلامة والإسلام، ربي وربك الله.", "**وإذا هبت الريح،** ففي الصحيحين من حديث عائشة قالت: كان رسول الله صلى الله عليه وسلم إذا عصفت الريح قال: «اللهم إني أسألك خيرها، وخير ما فيها، وخير ما أرسلت به، وأعوذ بك من شرها، وشر ما فيها، وشر ما أرسلت به».", "**وإذا سمعت صوت الرعد،** فقد أخبرنا هبة الله بن محمد قال: أخبرنا الحسن بن علي قال: أخبرنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا عفان قال: حدثنا عبد الواحد بن زياد قال: حدثنا الحجاج قال: حدثني أبو مطر عن سالم عن أبيه قال: كان رسول الله صلى الله عليه وسلم إذا سمع الرعد والصواعق قال: «اللهم لا تقتلنا بغضبك، ولا تهلكنا بعذابك، وعافنا قبل ذلك».", "**فإذا غضبت،** فقل: أعوذ بالله من الشيطان الرجيم، وفي الصحيحين من حديث سليمان بن صرد قال: كنت جالسا مع النبي صلى الله عليه وسلم ورجلان يستبان، وأحدهما قد احمر وجهه وانتفخت أوداجه، فقال النبي صلى الله عليه وسلم: «إني لأعلم كلمة لو قالها لذهب", "عنه ما يجد، لو قال: أعوذ بالله من الشيطان الرجيم، ذهب ما يجد»."]], "ic": "book"}, {"story": ["الباب الرابع في الأدعية المأثورة عند الحوادث (٣ من ٧)، ص٢٨٥", ["**فإذا سمعت أذان المغرب،** فقل: اللهم إني أسألك عند استقبال ليلك، وإدبار نهارك، وحضور صلواتك، وأصوات دعائك أن تغفر لي.", "**فإذا أصابك كرب أو هم،** ففي الصحيحين من حديث ابن عباس أن رسول الله صلى الله عليه وسلم كان يدعو عند الكرب: «لا إله إلا الله العظيم الحليم(١)، لا إله إلا الله رب العرش العظيم، لا إله إلا الله رب السماوات ورب الأرض ورب العرش الكريم». وفي حديث علي رضي الله عنه قال: علمني رسول الله صلى الله عليه وسلم إذا نزل بي كرب أن أقول: «لا إله إلا الله الحليم الكريم، سبحان الله، وتبارك الله رب العرش العظيم، والحمد لله رب العالمين».", "أخبرنا هبة الله بن محمد قال: أخبرنا أبو علي التميمي قال: أخبرنا أبو بكر بن مالك قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا يزيد قال: أخبرنا فضيل بن مرزوق قال: حدثنا أبو سلمة الجهني عن القاسم بن عبد الرحمن عن أبيه عن عبد الله قال: قال رسول الله صلى الله عليه وسلم: «ما أصاب أحدا قط هم ولا حزن، فقال: اللهم إني عبدك وابن عبدك وابن أمتك، ناصيتي بيدك، ماض في حكمك، عدل في قضاؤك، أسألك بكل اسم هو لك، سميت به نفسك أو علمته أحدا من خلقك، أو أنزلته في كتابك، أو استأثرت به في علم الغيب عندك، أن تجعل القرآن ربيع قلبي ونور صدري، وجلاء حزني، وذهاب همي. إلا أذهب الله عز وجل همه وحزنه وأبدله مكانه فرحا» قال: فقيل: يا رسول الله ألا نتعلمها؟ فقال: «بلى ينبغي لمن سمعها أن يتعلمها». وقال ابن مسعود: ما كرب نبي إلا استغاث بالتسبيح.", "**وإذا وجدت وجعا في جسدك أو في جسد غيرك،** فاسترق برقية رسول الله صلى الله عليه وسلم، ففي الصحيحين من حديث عائشة أن رسول الله صلى الله عليه وسلم كان يعوذ بعض أهله يمسح بيده اليمنى ويقول: «اللهم رب الناس أذهب البأس، اشف وأنت الشافي لا شفاء إلا شفاؤك، شفاء لا يغادر سقما».", "حاشية: (١) في (ظ): «الحكيم».", "وفي لفظ متفق عليه قال: كان إذا اشتكى
