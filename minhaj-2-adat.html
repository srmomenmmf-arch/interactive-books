لوا إنا نصيب سبايا فنحب الأثمان، فكيف ترى في العزل؟ فقال: «وإنكم لتفعلون ذلك؟ لا عليكم أن لا تفعلوا، فإنها ليست نسمة كتب الله أن تخرج إلا وهي خارجة». وهذه الكراهة كراهة فوت فضيلة، كما يقال: يكره للقاعد في المسجد أن لا يشتغل بالقرآن، وليست بكراهة تحريم ولا تنزيه؛ لأن الذي يعزل كأنه لم يطأ؛ لأن الولد لا يخلق من ماء الرجل وحده، بخلاف ما لو وطئ واختلط الماءان، فإن ذلك", "حاشية: (١) الحقو: الخصر.", "مستعد لقبول الحياة، فإفساده جناية، فإن صار مضغة وعلقة كانت الجناية أفحش، فإن نفخ فيه الروح زادت الجناية تفاحشا، فوجود الماءين كوجود الإيجاب والقبول في العقود، فمن أوجب ثم رجع قبل القبول لم يقل: إنه قد جنى على العقد بالفسخ، وإنما يجني إذا انضم القبول إلى الإيجاب، وللذي يعزل ثلاثة مقاصد؛ إحداها: حفظ ماله في الجواري لئلا يكون الولد سببا للخروج عن كمال الملك. والثاني: استبقاء جمال المرأة وسمنها لدوام التمتع. والثالث: الاحتراز من الحاجة إلى فضل كسب، وكل ذلك مباح.", "**الحادي عشر:** في آداب الولادة وهي ستة:", "**الأول:** أن لا يكثر فرحه بالذكر وحزنه بالأنثى، فإنه لا يدري في أيهما الخيرة، وفي الصحيحين من حديث عائشة عن النبي ﷺ أنه قال: «من ابتلي من البنات بشيء، فأحسن إليهن كن سترا له من النار». وفي حديث جابر عن النبي ﷺ أنه قال: «من كن له ثلاث بنات يؤويهن ويرحمهن ويكفلهن، وجبت له الجنة البتة» قيل: يا رسول الله، فإن كانتا اثنتين؟ قال: وإن كانتا اثنتين. قال: فرأى بعض القوم أن لو قالوا له: واحدة. لقال: واحدة.", "**الأدب الثاني:** أن يؤذن في أذن المولود فقد روى أبو رافع أن النبي ﷺ أذن في أذن الحسن بن علي(١) لما ولدته فاطمة.", "**الأدب الثالث:** أن يسميه باسم حسن، وفي أفراد مسلم من حديث ابن عمر عن النبي ﷺ أنه قال: «إن أحب أسمائكم إلى الله عز وجل؛ عبد الله وعبد الرحمن». ومن كان له اسم مكروه استحب له تبديله، فقد غير النبي ﷺ أسماء جماعة، وفي أفراد مسلم من حديث ابن عمر أن النبي ﷺ غير اسم عاصية، فقال: «أنت جميلة». وقد كره من الأسماء أفلح، ونافع، ويسار، ورباح، وبركة؛ لأنه يقال: أهو ثم؟ فيقال: لا.", "**الأدب الرابع:** العقيقة عن الذكر بشاتين وعن الأنثى بشاة، وفي أفراد البخاري", "حاشية: (١) بعدها في (ظ): «للصلاة»."]], "ic": "book"}, {"story": ["الباب الثالث في آداب المعاشرة وما يجري في دوام النكاح والنظر (٦ من ٨)، ص٣٥٧", ["من حديث سلمان بن عامر أن النبي ﷺ قال: «مع الغلام عقيقته، فأهريقوا عنه الدم، وأميطوا عنه الأذى». قال ابن سيرين: إن لم تكن إماطة الأذى حلق الرأس، فلا أدري ما هو. وروى سمرة عن النبي ﷺ أنه قال: «الغلام مرتهن بعقيقته، تذبح عنه يوم السابع، ويسمى ويحلق رأسه». قال الترمذي: هذا حديث صحيح والعمل عليه عند أهل العلم يستحبون أن تذبح عن الغلام العقيقة يوم السابع، فإن لم يتهيأ فيوم الرابع عشر، فإن لم يتهيأ، فيوم أحد وعشرين، ولا يجزئ في العقيقة إلا ما يجزئ في الأضحية.", "**الأدب الخامس:** أن يحنكه بتمرة أو حلاوة، فإن رسول الله ﷺ حنك عبد الله بن الزبير بتمرة.", "**الأدب السادس:** الختان، وفي حديث جابر بن عبد الله أن رسول الله ﷺ ختن الحسن والحسين يوم السابع وعق عنهما.", "**الثاني عشر:** في الطلاق، وهو أبغض المباحات إلى الله عز وجل، فيكره للرجل أن يفجأ به المرأة من غير ذنب، ولا يجوز للمرأة أن تلجئه إلى طلاقها، فإذا أراد الطلاق، فليراع أربعة أشياء:", "**الأول:** أن يطلقها في طهر لم يجامعها فيه، لئلا تطول عليها العدة.", "**والثاني:** أن يقتصر على طلقة واحدة ليستفيد بها الرجعة إن ندم.", "**والثالث:** أن يتلطف الأمر في الطلاق بإعطائها ما تمتع به ليجبر الفاجع، فقد روي عن الحسن بن علي أنه طلق امرأة وبعث إليها عشرة آلاف درهم، فقالت: متاع قليل من حبيب مفارق.", "**الرابع:** أن لا يفشي سرها، وفي أفراد مسلم من حديث أبي سعيد عن النبي ﷺ أنه قال: «إن من شر الناس عند الله منزلة يوم القيامة الرجل يفضي إلى امرأته وتفضي إليه، ثم ينشر سرها». وروي عن بعض الصالحين أنه أراد طلاق امرأته، فقيل له: ما الذي يريبك منها؟ فقال: العاقل لا يهتك ستر امرأته. فلما طلقها قيل: لم طلقتها؟ فقال: ما لي ولامرأة غيري؟ فها كله في بيان ما على الزوج.", "**القسم الثاني من هذا الباب:**"]], "ic": "book"}, {"story": ["الباب الثالث في آداب المعاشرة وما يجري في دوام النكاح والنظر (٧ من ٨)، ص٣٥٨", ["النظر في حقوق الزوج عليها، والقول الشافي فيه أن النكاح فيه نوع رق، فعليها طاعة الرقيق في كل ما يطلبه منها إذا لم يكن معصية، أخبرنا إسماعيل بن أحمد وعبد الوهاب بن المبارك ويحيى بن علي المدير، قالوا: أخبرنا أبو محمد الصريفيني، قال: حدثنا أبو حفص الكتاني قال: حدثنا الحسن بن علي العدوي قال: حدثنا طالوت قال: حدثنا فضال قال: سمعت أبا أمامة يقول: سمعت رسول الله ﷺ يقول: «لو جاز لأحد أن يسجد لأحد من دون الله عز وجل، لأمرت المرأة أن تسجد لزوجها لعظم حقه عليها». أخبرنا عبد الوهاب قال: أخبرنا عاصم بن الحسن قال: أخبرنا أبو الحسين بن بشران قال: أخبرنا ابن صفوان قال: حدثنا أبو بكر القرشي قال: حدثنا أبو خيثمة قال: حدثنا محمد بن عبد الرحمن الطفاوي عن ليث عن عطاء عن ابن عباس قال: سألت امرأة رسول الله ﷺ، فقالت: ما حق الرجل على المرأة؟ قال: «لا تمنعه نفسها وإن كانت على رأس قتب(١)» قالت: وما حق الرجل على امرأته؟ قال: «لا تصوم يوما تطوعا إلا بإذنه، فإن فعلت أثمت، ولم يتقبل منها». قالت: وما حق الرجل على امرأته؟ قال: «لا تعطي شيئا من بيتها إلا بإذنه، فإن فعلت كان له أجره وعليها الوزر». قالت: وما حق الرجل على امرأته؟ قال: «لا تخرج من بيتها إلا بإذنه، فإن فعلت لعنتها ملائكة الرحمة وملائكة الغضب حتى تتوب وترجع» قالت: لا جرم والله لا يملك علي أمري رجل أبدا.", "وفي حديث أنس بن مالك عن النبي ﷺ أنه قال: «لو صلح لبشر أن يسجد لبشر لأمرت المرأة أن تسجد لزوجها من عظم حقه عليها، والذي نفسي بيده، لو كان من قدمه إلى مفرق رأسه قرحة تبجس(٢) بالقيح والصديد ثم استقبلته فلحسته ما أدت حقه». وقالت عائشة: يا معشر النساء، لو تعلمن بحق أزواجكن عليكن لجعلت المرأة منكن تمسح الغبار عن قدمي زوجها بحر وجهها. وقالت بنت", "حاشية: (١) القتب: الرحل الصغير على قدر سنام الجمل.", "حاشية: (٢) القرحة: البثرة، وتبجس: تفجر وتسيل.", "سعيد بن المسيب: ما كنا نكلم أزواجنا إلا كما تكلموا أمراءكم. وفي الصحيحين من حديث ابن عباس عن النبي ﷺ أنه قال: «رأيت أكثر أهل النار النساء» قالوا: بم يا رسول الله؟ قال: «بكفرهن» قيل: أيكفرن بالله؟ قال: «يكفرن العشير، ويكفرن الإحسان، لو أحسنت إلى إحداهن الدهر كله ثم رأت منك شيئا، قالت: ما رأيت منك خيرا قط».", "واعلم أن حقوق الزوج على المرأة كثيرة، وأهمها أمران؛ إحداهما: الستر والصيانة، والثاني القناعة، وعلى هذا كان النساء في السلف، كان الرجل إذا خرج من منزله يقول له أهله: إياك وكسب الحرام فإنا نصبر على الجوع ولا نصبر على النار.", "ومن الواجبات عليها أن لا تفرط في ماله بل تحفظه، فإن أطعمت عن رضاه كان لها مثل أجره، وإن أطعمت بغير رضاه كان له الأجر، وعليها الوزر."]], "ic": "book"}, {"story": ["الباب الثالث في آداب المعاشرة وما يجري في دوام النكاح والنظر (٨ من ٨)، ص٣٥٩", ["وينبغي لوالديها تأديبها قبل نقلها إلى الزوج لتعرف آداب العشرة، كما روي عن أسماء بن خارجة أنه قال لابنته عند تزويجها: إنك تخرجين من العش الذي فيه درجت، إلى منزل لم تعرفيه، وقرين لم تألفيه، فكوني له أمة يكن لك عبدا، واحفظي أنفه وسمعه وعينه، فلا يشم منك إلا طيبا، ولا يسمع إلا حسنا، ولا ينظر إلا جميلا.", "وينبغي للمرأة أن تكون قاعدة في بيتها، لازمة لمغزلها، قليلة الكلام لجيرانها، لا يكثر اطلاعها، كثيرة الانقباض في حالة غيبة زوجها، تحفظه غائبا وحاضرا، وتطلب مسرته في جميع الأحوال، ولا تخونه في نفسها ولا في ماله، محترزة أن يسمع غريب صوتها أو يعرف شخصها، همها(١) صلاح شأنها وتدبير بيتها قائمة بخدمة الدار في كل ما أمكنها، فقد قال علي رضي الله عنه: قلت لأمي فاطمة بنت أسد: اكفي فاطمة بنت رسول الله ﷺ خدمة الخارج تكفيك خدمة الداخل؛ الطحن", "حاشية: (١) في الأصل: «همتها».", "والعجن. وكانت أسماء بنت أبي بكر رضي الله عنهما تعلف فرس الزبير وتدق النوى لناضحه(١)، وتنقل النوى على رأسها من ثلثي فرسخ.", "ولتكن المرأة مقدمة لحق زوجها على حق نفسها وحق جميع أقاربها، لا تتفاخر عليه بجمالها ولا تزدريه إن كان قبيحا، ولتكن مستعدة بالنظافة لاستمتاعه بها، غير ممتنعة منه متى أرادها، ففي الصحيحين من حديث أبي هريرة عن النبي ﷺ أنه قال: «إذا دعى الرجل امرأته إلى فراشه فأبت، فبات وهو ساخط عليها لعنتها الملائكة حتى تصبح». وفي لفظ متفق عليه: «والذي نفسي بيده ما من رجل يدعو امرأته إلى فراشها فتأبى عليه إلا كان الذي في السماء ساخطا عليها حتى يرضى عنها». وفي حديث معاذ بن جبل عن النبي ﷺ أنه قال: «لا تؤذي امرأة زوجها في الدنيا إلى قالت زوجته من الحور العين: لا تؤذيه قاتلك الله، فإنما هو عندك دخيل يوشك أن يفارقك إلينا».", "**آخر كتاب النكاح**", "حاشية: (١) الناضح: الدابة يستقى عليها."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "واعلم أن حقوق الزوج على ____ كثيرة، وأهمها أمران؛ إحداهما", "o": ["المرأة", "رباح", "ارتفع", "عاقبه"], "h": "راجع: ص٣٥٩"}, {"t": "fill", "d": 2, "q": "الأدب الثاني: أن يؤذن في أذن المولود فقد روى أبو رافع أن ____ ﷺ أذن في أذن الحسن بن علي لما ولدته", "o": ["النبي", "أذنيه", "الأحباب", "تخيروا"], "h": "راجع: ص٣٥٦"}, {"t": "fill", "d": 2, "q": "الأدب السادس: الختان، وفي حديث جابر بن عبد الله أن رسول الله ﷺ ختن ____ والحسين يوم السابع وعق", "o": ["الحسن", "يمتنعوا", "نزلت", "لولا"], "h": "راجع: ص٣٥٧"}, {"t": "fill", "d": 2, "q": "التاسع: النشوز، وإذا كان النشوز من المرأة فله أن يؤدبها ويحملها على الطاعة قهرا، ولكنه ينبغي أن يتدرج في تأديبها بتقديم الوعظ والتخويف، فإن لم ينجع ____ ظهره في المضجع أو انفرد عنها بالفراش", "o": ["ولاها", "والله", "آلاف", "والتكبر"], "h": "راجع: ص٣٥٤"}, {"t": "fill", "d": 2, "q": "وينبغي لوالديها تأديبها قبل نقلها إلى الزوج لتعرف آداب العشرة، كما روي عن أسماء بن خارجة أنه قال ____ عند تزويجها", "o": ["لابنته", "والخالق", "الخوافي", "واللؤلؤ"], "h": "راجع: ص٣٥٩"}, {"t": "fill", "d": 2, "q": "أما الزوج؛ فعليه مراعاة الاعتدال ____ في اثني عشر أمرا", "o": ["والأدب", "مادة", "بجنبه", "فيجتمع"], "h": "راجع: ص٣٥٠"}]}], "sum": [["الصفحات", "ص٣٥٠ - ص٣٦٠"]], "_nq": 12}, {"id": "l12", "title": "كتاب آداب الكسب والمعاش", "group": "كتاب آداب الكسب والمعاش", "map": {"center": "كتاب\nآداب الكسب", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "كتاب آداب الكسب والمعاش", "b": [{"pic": ["books", "book"], "cap": "ص٣٦١ - ص٣٦١"}, {"story": ["كتاب آداب الكسب والمعاش، ص٣٦١", ["الحمد لله الذي جل عن مثل وشبيه وتحاشى، وعلا عن ضد وند كلا وحاشى، جعل(١) الأرض لخلقه مهادا وقرارا وفراشا، ونور النهار ثم أغطش الليل إغطاشا، فسكنوا في الظلام وانتعشوا في الضياء(٢) انتعاشا ﴿وَجَعَلْنَا ٱلَّيْلَ لِبَاسًا وَجَعَلْنَا ٱلنَّهَارَ مَعَاشًا﴾ [النبأ: ١٠-١١].", "أحمده حمد نفوس رواها وقد كانت عطاشا، وأصلي على رسوله الذي صغر كل فضل عند فضله وتلاشى، وعلى أصحابه وأتباعه الذين انكمشوا في إيضاح الدين انكماشا، وأسلم تسليما كثيرا.", "أما بعد؛ فإن الله عز وجل بلطيف حكمته جعل الدنيا دار تسبب واكتساب، تارة للمعاش وتارة للمعاد، ونحن نورد آداب التجارات والصناعات، وضروب الأكساب وأسبابها، ونشرحها في خمسة أبواب إن شاء الله تعالى.", "الباب الأول: في فضل الكسب والحث عليه.", "والباب الثاني: في علم صحيح البيع والشراء والمعاملات.", "والباب الثالث: في بيان العدل في المعاملة.", "الباب الرابع: في بيان الإحسان فيها.", "والباب الخامس: في شفقة التاجر على دينه.", "حاشية: (١) في (ظ): «خلق».", "حاشية: (٢) في الأصل: «النهار»."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "أحمده حمد نفوس رواها وقد كانت عطاشا، وأصلي على رسوله الذي صغر كل فضل عند ____ وتلاشى، وعلى أصحابه وأتباعه الذين انكمشوا في إيضاح الدين انكماشا، وأسلم تسليما كثيرا", "o": ["فضله", "يعمهم", "وذراع", "قلادة"], "h": "راجع: ص٣٦١"}, {"t": "fill", "d": 2, "q": "أما بعد؛ فإن الله عز وجل بلطيف حكمته جعل الدنيا دار تسبب واكتساب، تارة للمعاش وتارة للمعاد، ونحن نورد آداب ____ والصناعات، وضروب الأكساب وأسبابها، ونشرحها في خمسة أبواب إن شاء الله تعالى", "o": ["التجارات", "الوحدة", "مفاسده", "لرفيقه"], "h": "راجع: ص٣٦١"}]}], "sum": [["الصفحات", "ص٣٦١ - ص٣٦١"]], "_nq": 2}, {"id": "l13", "title": "الباب الأول في فضل الكسب والحث عليه", "group": "كتاب آداب الكسب والمعاش", "map": {"center": "الباب\nالأول في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الأول في فضل الكسب والحث عليه", "b": [{"pic": ["books", "book"], "cap": "ص٣٦٢ - ص٣٦٤"}, {"story": ["الباب الأول في فضل الكسب والحث عليه (١ من ٢)، ص٣٦٢", ["**في فضل الكسب والحث عليه**", "أما من القرآن؛ فقوله تعالى: ﴿وَجَعَلْنَا ٱلنَّهَارَ مَعَاشًا﴾ [النبأ: ١١]، فذكره في معرض الامتنان، وقال تعالى: ﴿وَجَعَلْنَا لَكُمْ فِيهَا مَعَٰيِشَ قَلِيلًا مَّا تَشْكُرُونَ﴾ [الأعراف: ١٠]، فجعلها نعمة وطلب الشكر عليها، وقال تعالى: ﴿لَيْسَ عَلَيْكُمْ جُنَاحٌ أَن تَبْتَغُوا۟ فَضْلًا مِّن رَّبِّكُمْ﴾ [البقرة: ١٩٨]، وقال تعالى: ﴿وَءَاخَرُونَ يَضْرِبُونَ فِى ٱلْأَرْضِ يَبْتَغُونَ مِن فَضْلِ ٱللَّهِ﴾ [المزمل: ٢٠]، وقال: ﴿فَٱنتَشِرُوا۟ فِى ٱلْأَرْضِ وَٱبْتَغُوا۟ مِن فَضْلِ ٱللَّهِ﴾ [الجمعة: ١٠].", "وأما الأحاديث؛ فأخبرنا عبد الوهاب الحافظ قال: أخبرنا المبارك بن عبد الجبار قال: أخبرنا محمد بن علي بن الفتح قال: أخبرنا أبو طاهر محمد بن عبد الرحمن المخلص قال: أخبرنا عبيد الله بن عبد الرحمن السكري قال: حدثنا أبو بكر القرشي قال: حدثنا محمد بن بكار قال: حدثنا زافر بن سليمان عن ليث عن مجاهد عن ابن عباس قال: قال رسول الله ﷺ: «طلب الحلال جهاد، وإن الله ليحب العبد المحترف». أخبرنا عبد الأول بن عيسى قال: أخبرنا الداودي، قال: أخبرنا ابن أعين قال: أخبرنا الفربري، قال: حدثنا البخاري، قال: حدثنا إبراهيم بن موسى قال: أخبرنا عيسى بن يونس عن ثور عن خالد بن معدان عن المقدام عن النبي ﷺ أنه قال: «ما أكل أحد طعاما قط خيرا من أن يأكل من عمل يده، وإن نبي الله داود كان يأكل من عمل يديه». انفرد بإخراجه البخاري. وفي أفراده من حديث أبي هريرة عن النبي ﷺ: «إن داود النبي عليه السلام كان لا يأكل إلا من عمل يده». وفي أفراد مسلم من حديث أبي هريرة عن النبي ﷺ قال: «كان زكريا نجارا». وقال ابن عباس: كان آدم حراثا، ونوح نجارا، وإدريس خياطا، وإبراهيم ولوط زراعين، وصالح تاجرا، وداود زرادا، وموسى وشعيب ومحمد", "صلى الله عليهم رعاة. وفي حديث رافع بن خديج قيل: يا رسول الله، أي الكسب أطيب؟ قال: «عمل الرجل بيده، وكل بيع مبرور».", "وأما الآثار؛ فقد قال لقمان الحكيم لابنه: يا بني، استغن بالكسب الحلال، فإنه ما افتقر أحد قط إلا أصابه ثلاث خصال: رقة في دينه، وضعف في عقله، وذهاب مروءته، وأعظم من هذه الثلاث استخفاف الناس به.", "وقال عمر بن الخطاب: لأن أموت بين شعبتي رحلي أطلب كفاف وجهي أحب إلي من أن أموت غازيا في سبيل الله.", "وقال أيوب: قال لي أبو قلابة: الزم السوق، فإن الغنى من العافية.", "وقيل لإبراهيم بن أدهم وهو في البحر: أما ترى هذه الشدة؟ فقال: إنما الشدة الحاجة إلى الناس."]], "ic": "book"}, {"story": ["الباب الأول في فضل الكسب والحث عليه (٢ من ٢)، ص٣٦٣", ["وقيل لأحمد بن حنبل: ما تقول في رجل جلس في بيته أو مسجده، وقال: لا أعمل شيئا حتى يأتيني رزقي. فقال أحمد: هذا رجل جهل العلم، أما سمع قول النبي ﷺ: «إن الله جعل رزقي تحت ظل رمحي» وقوله حين ذكر الطير فقال: «تغدو خماصا وتروح بطانا». وكان أصحاب رسول الله ﷺ يتجرون في البر والبحر، ويعملون في نخلهم والقدوة بهم.", "وقال أبو سليمان الداراني: ليس العبادة عندنا أن تصف قدميك وغيرك يقوت(١) لك، ولكن ابدأ برغيفك فأحرزهما ثم تعبد.", "واعلم أن المال ممدوح لا مذموم، وقد أمر الإنسان بإصلاحه، ونهي عن التفريط فيه فقال تعالى: ﴿وَلَا تُؤْتُوا۟ ٱلسُّفَهَآءَ أَمْوَٰلَكُمُ ٱلَّتِى جَعَلَ ٱللَّهُ لَكُمْ قِيَٰمًا﴾ [النساء: ٥] ولوجوده وقع الاستقراض، فقيل ﴿مَّن ذَا ٱلَّذِى يُقْرِضُ ٱللَّهَ قَرْضًا حَسَنًا﴾ [البقرة: ٢٤٥] وبإخراجه في الخير فضل المنفق وضوعف له الأجر، وقد قال عليه الصلاة والسلام: «نعما بالمال الصالح للمرء الصالح». وقد كانت الصحابة تكسب المال", "حاشية: (١) في الأصل: «يفت» وسقطت من (ظ) والمثبت من الإحياء.", "وتخلفه، فخلف طلحة ثلاث مئة بهار، وكل بهار ثلاثة قناطير، والبهار الحمل. وكان مال الزبير خمسين ألف ألف ومئتي ألف، وخلف ابن مسعود تسعين ألفا، وكان سعيد بن المسيب يقول: لا خير فيمن لا يطلب المال يقضي به دينه، ويصون به عرضه، فإن مات تركه ميراثا لمن بعده. وخلف ابن المسيب نحو أربع مئة دينار، وخلف سفيان الثوري مئتين، وكان يقول: المال في هذا الزمان سلاح.", "فإن قيل: فقد قال أبو الدرداء: زاولت التجارة والعبادة فلم يجتمعا، فاخترت العبادة.", "فالجواب، أنا لا نقول: إن التجارة تراد لذاتها بل للاستغناء عن الناس، وإغناء العائلة، وإفاضة الفضل على الإخوان وأهل الدين، فقد كان ابن المبارك يقول: لولا خمسة ما تجرت. ولا شك أن الاشتغال بها يمنع من كثير من التعبد إلا أنه إذا صحت النية فيها وصفى الكسب وحسن القصد كان ذلك أفضل من كثير من التعبد، فأما إن كان المقصود نفس المال وجمعه والتفاخر به، أو أخذه من غير وجهه، فذلك كله مذموم، ومتى كان للعالم والقاضي رزق يكفهما من الأموال المرصدة للمصالح كان إقبالهما على ما ينفع المسلمين أفضل من التشاغل بالكسب، ولهذا أشار الصحابة على أبي بكر حين ولي الخلافة بترك التجارة، وفرضوا له كفايته في بيت المال، فإن لم يجدا ما يصلحهما وجداه من بيت المال من الزكاة والصدقة أخذا إيثارا لنفع المسلمين على التشاغل بالكسب، فإن لم يقدرا على ذلك إلا بالسؤال فالكسب خير، وليكن العقد الذي به الاكتساب جامعا لأمور أربعة: الصحة والعدل والإحسان والشفقة على الدين، ونحن نعقد في كل واحد بابا ونبتدئ بذكر أسباب الصحة في الباب الثاني إن شاء الله تعالى."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "وقال أبو سليمان الداراني: ليس العبادة عندنا أن تصف قدميك وغيرك يقوت لك، ولكن ابدأ ____ فأحرزهما ثم", "o": ["برغيفك", "يتبع", "فيحمله", "والتوالف"], "h": "راجع: ص٣٦٣"}, {"t": "fill", "d": 2, "q": "فالجواب، أنا لا نقول: إن التجارة تراد لذاتها بل للاستغناء عن الناس، وإغناء العائلة، وإفاضة الفضل على الإخوان ____ الدين، فقد كان ابن المبارك يقول: لولا خمسة ما تجرت. ولا شك أن الاشتغال بها يمنع من", "o": ["وأهل", "وغضبها", "بجميع", "أسفلها"], "h": "راجع: ص٣٦٤"}, {"t": "fill", "d": 2, "q": "صلى الله عليهم رعاة. وفي حديث رافع بن خديج قيل: يا رسول الله، أي ____ أطيب؟ قال: «عمل الرجل بيده، وكل بيع", "o": ["الكسب", "ينفق", "الورثة", "فقال"], "h": "راجع: ص٣٦٣"}, {"t": "fill", "d": 2, "q": "وقال عمر بن الخطاب: لأن أموت بين شعبتي رحلي أطلب ____ وجهي أحب إلي من أن أموت غازيا في سبيل", "o": ["كفاف", "أذله", "خرجت", "تدفن"], "h": "راجع: ص٣٦٣"}, {"t": "fill", "d": 2, "q": "وتخلفه، فخلف طلحة ثلاث مئة بهار، وكل بهار ثلاثة قناطير، ____ الحمل", "o": ["والبهار", "والنسيئة", "وقطعها", "فالأظهر"], "h": "راجع: ص٣٦٤"}, {"t": "fill", "d": 2, "q": "وأما الآثار؛ فقد قال لقمان الحكيم لابنه: يا بني، استغن بالكسب الحلال، فإنه ما افتقر أحد قط إلا أصابه ثلاث خصال: رقة في دينه، وضعف في عقله، وذهاب مروءته، وأعظم من هذه ____ استخفاف الناس", "o": ["الثلاث", "وأبكيته", "نأتيك", "أرزاقنا"], "h": "راجع: ص٣٦٣"}]}], "sum": [["الصفحات", "ص٣٦٢ - ص٣٦٤"]], "_nq": 6}, {"id": "l14", "title": "الباب الثاني في علم الكسب بطريق البيع والربا والسلم والإجارة والقراض والشركة وبيان شروط الشرع في صحة التصرفات…", "group": "كتاب آداب الكسب والمعاش", "map": {"center": "الباب\nالثاني في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الثاني في علم الكسب بطريق البيع والربا والسلم والإجارة والقراض و", "b": [{"pic": ["books", "book"], "cap": "ص٣٦٥ - ص٣٧٢"}, {"story": ["الباب الثاني في علم الكسب بطريق البيع والربا والسلم والإجارة (١ من ٦)، ص٣٦٥", ["**في علم الكسب بطريق البيع والربا والسلم والإجارة والقراض والشركة وبيان شروط الشرع في صحة التصرفات التي هي مدار الكسب في الشرع**", "اعلم أن تحصيل علم هذا الباب واجب على كل مكتسب؛ لأن طلب العلم الذي يحتاج إليه فريضة على كل مسلم، والمكتسب محتاج إلى علم الكسب، فإذا حصل علم هذا الباب وقف على مفسدات المعاملة فاتقاها، وما شذ عنه من الفروع المشكلة وقف على سبب إشكالها، فيتوقف فيها إلى أن يسأل، فإنه إذا لم يعلم أسباب الفساد بعلم جملي لم يدر متى يجب عليه التوقف والسؤال، ولو قال: لا أقدم العلم ولكني أصبر حتى تقع لي الواقعة، فعندها أتعلم وأستفتي. قيل له: وبم تعلم وقوع الواقعة إذا لم تعلم جمل مفسدات العقود، فإنك تستمر في التصرفات تظنها صحيحة مباحة، فلا بد من هذا القدر من علم التجارة ليتميز المباح من المحظور، ولهذا كان عمر يقول: لا يتجر في سوقنا إلا من تفقه، وإلا أكل الربا شاء أم أبى. وعلم العقود كثير ولكن لا تنفك المكاسب عن هذه العقود الستة التي ذكرناها، وهي البيع، والربا، والسلم، والإجارة، والقراض، والشركة فلنشرح شروطها.", "**العقد الأول: البيع:** وله ثلاثة أركان: العاقد، والمعقود عليه، واللفظ.", "أما ＊＊العاقد:＊＊ فينبغي للتاجر أن لا يعامل المجنون لأنه غير مكلف فبيعه لا يصح ولا يعامل العبد إلا أن يعلم أنه مأذون له، ويكفيه انتشار ذلك في البلد فيعول على الاستفاضة، وكذلك الصبي لا يعامل إلا أن يكون قد أذن له الأب أو الوصي،", "فيصير بمنزلة العبد المأذون له، وهذا مذهبنا، وبه قال أبو حنيفة، إلا أن عنده أنه يصير مأذونا له في جميع الأشياء كالعبد. وقال الشافعي: لا تصح عقود الصبي.", "وأما معاملة الأعمى فعندنا يصح بيعه وشراؤه، وعند الشافعي لا يصح، فالورع أن لا يعامل إلا أن يوكل وكيلا بصيرا، وأما الكافر فيجوز معاملته لكن لا يباع منه المصحف ولا العبد المسلم ولا السلاح إن كان من أهل الحرب، فإن فعل فهي معاملات مردودة وهو عاص بذلك، وأما اللصوص والظلمة ومن أكثر ماله حرام، فلا ينبغي أن يعامل إلا في شيء تعرف عينه أنها حلال.", "**الركن الثاني: في المعقود عليه:** وهو المال المقصود نقله من أحد العاقدين إلى الآخر ثمنا كان أو مثمنا، فيعتبر فيه ستة شروط:", "**الأول:** أن لا يكون نجسا في عينه، فلا يصح بيع كلب ولا خنزير، فأما البغل والحمار فيجوز بيعهما سواء قلنا: إنهما طاهران أو نجسان.", "**الثاني:** أن يكون منتفعا فيه، فلا يجوز بيع الحشرات، وسباع البهائم التي لا تصلح للاصطياد، واختلفت الرواية في بيع الفيل والفهد والسنور والبازي والصقر والشاهين، ولا يجوز بيع العود والمزمار والصور المصنوعة من الطين إذا كانت صور حيوان.", "**الثالث:** أن يكون المتصرف فيه مملوكا للعاقد أو مأذونا له في التصرف فيه(١) من جهة المالك."]], "ic": "book"}, {"story": ["الباب الثاني في علم الكسب بطريق البيع والربا والسلم والإجارة (٢ من ٦)، ص٣٦٦", ["**الرابع:** أن يكون المعقود عليه مقدورا على تسليمه حسا وشرعا، أما الحس فالطير في الهواء والعبد الآبق(٢) والجمل الشارد، فهذه الأشياء لا يقدر على تسليمها حسا، وأما الشرع فالمرهون، وبيع الأم دون الولد الصغير، أو الولد دون الأم، فهذه ممنوعة التسليم شرعا.", "حاشية: (١) ليست في الأصل.", "حاشية: (٢) الآبق: الهارب من سيده.", "**الخامس:** أن يكون المبيع معلوم العين إما بالرؤية، فيقول: بعتك هذا الثوب بهذا الدينار. أو بالصفة، مثل أن يقول: بعتك عبدي التركي ومن صفته كذا وكذا.", "**السادس:** أن يكون المبيع مقبوضا إن كان قد استفاد ملكه بمعاوضة، فقد نهى رسول الله ﷺ عن بيع ما لم يقبض.", "**الركن الثالث: لفظ العقد:** وهو الإيجاب والقبول، فإن تقدم القبول على الإيجاب لم يصح البيع في إحدى الروايتين، وفي الأخرى يصح، سواء كان بلفظ الماضي بأن يقول: ابتعت منك هذا الثوب بدرهم. فيقول البائع: بعتك. أو بلفظ الطلب بأن يقول: بعني ثوبك بدرهم. فيقول: بعتك. فإن تبايعا بالمعاطاة نحو أن يقول: أعطني بهذا الدينار خبزا. فيعطيه ما يرضى أو يقول: خذ هذا الثوب بدينار. فيأخذه، فظاهر كلام الإمام أحمد رحمه الله صحة البيع، وقال القاضي أبو يعلى: يصح ذلك في الأشياء اليسيرة دون الكثيرة، وهذا أصلح الأقوال، أعني أن تكون المعاطاة بيعا في الأشياء المحتقرة دون الأشياء النفيسة لجريان العادات بذلك، إلا أن ذا الورع ينبغي أن لا يترك الإيجاب والقبول ليخرج عن شبهة الخلاف.", "**العقد الثاني: عقد الربا:** وقد شدد الله عز وجل الأمر في الربا، فيجب الاحتراز على المتعاملين بالنقدين من الفضل والنسيئة، فأما ربا الفضل، فيحرم بعلة كونه مكيل جنس أو موزون جنس، فمتى باع مكيلا بجنسه حرم فيه التفاضل، سواء كان مأكولا كالحنطة والتمر، أو غير مأكول كالنورة(١) والأشنان(٢) وكذلك إن باع موزونا بجنسه كالفضة بالفضة والحديد بالحديد، هذا في إحدى الروايات عن الإمام أحمد، والرواية الثانية: يحرم التفاضل بعلة كونه مطعوم جنس وفي غير الطعام بعلة الثمنية، فيختص ذلك بالذهب والفضة. والثالثة: يحرم التفاضل في غير الذهب والفضة بعلة كونه مطعوما مكيلا أو مطعوما موزونا في جنس، ولا يحرم", "حاشية: (١) النورة: أخلاط من أملاح الكالسيوم والباريوم تستعمل لإزالة الشعر. المعجم الوسيط: (نور).", "حاشية: (٢) الأشنان: شجر ينبت في الأرض الرملية يستعمل هو أو رماده في غسل الثياب والأيدي.", "التفاضل في مطعوم لا يكال ولا يوزن كالرمان والبطيخ، ولا في مكيل أو موزون لا يؤكل، كالحديد والأشنان، ومتى اختلف الجنسان جاز التفاضل على جميع الروايات."]], "ic": "book"}, {"story": ["الباب الثاني في علم الكسب بطريق البيع والربا والسلم والإجارة (٣ من ٦)، ص٣٦٨", ["وأما ربا النسيئة؛ فكل شيأين علة ربا الفضل فيهما واحدة، لا يجوز بيع أحدهما بالآخر نساء، ولا يجوز بيع جنس فيه الربا بعضه ببعض، ومع أحدهما من غير جنسهما كمد عجوة ودرهم بمدي عجوة، فعلى هذا لا يجوز أن يشتري قلادة فيها خرز(١) وذهب بذهب، ولا ثوبا منسوجا بذهب يحصل منه ذهب مقصود عند عرضه على النار بذهب، ولا أن يشتري الخبز بحنطة، ولا السيرج(٢) بسمسم ولا الزبد باللبن.", "**العقد الثالث: السلم:** وهو نوع من البيع ينعقد بكل لفظ ينعقد به البيع، وينعقد بلفظ السلم والسلف، ويصح في كل مال يضبط بالصفة كالثمار والحبوب والثياب والدقيق والخبز والقطن والإبريسم(٣) والكتان والكاغد(٤) والحيوان والرقيق واللحوم والرؤوس والجلود والأطراف والحديد والرصاص والنحاس والصفر والأحجار والأخشاب والأدوية والطيب والمائعات من الخل والدهن واللبن وغير ذلك، ولا يصح إلا بخمسة شرائط:", "**أحدها:** أن يذكر كل وصف يختلف الثمن لأجله عند أهل الخبرة، فإذا أسلم في طعام ذكر الجنس فقال: حنطة. والنوع، فقال: بغدادية واسطية. واللون: حمراء صفراء، والقدر: كبار الحب أو صغار الحب، وحديث أو عتيق، وجيد أو رديء، وخالية من الغش.", "**والشرط الثاني:** أن يذكر المقدار، فيشترط في المكيل كيلا معلوما، وفي", "حاشية: (١) تحرفت في الأصل إلى: «حرير».", "حاشية: (٢) السيرج: زيت السمسم.", "حاشية: (٣) الإبريسم: أحسن الحرير.", "حاشية: (٤) الكاغد: القرطاس الذي يكتب فيه.", "الموزون وزنا معلوما، وكذلك في المذروع(١) والمعدود، فإن أسلم فيما يكال بالوزن لم يصح، وكذلك يخرج إذا أسلم فيما يوزن كيلا وفيما يذرع وزنا، فأما المعدود المختلف، كالبيض والجوز والرمان والسفرجل والبطيخ والقثاء والباذنجان وما أشبه ذلك، فيصح السلم فيه في إحدى الروايتين، وهل يسلم فيه عددا أو وزنا على روايتين.", "**والشرط الثالث:** أن يشترط أجلا معلوما له وقع في الثمن، كالشهر والشهرين فصاعدا، فإن أسلم حالا أو شرط ساعة أو يوما لم يصح، إلا أن يسلم في خبز أو لحم يأخذ منه كل يوم أرطالا معلومة، فإنه يصح.", "**والشرط الرابع:** أن يشترط محلا يكون المسلم فيه عام الوجود، فإن أسلم في العنب وجعل محله شهر شباط لم يصح.", "**والشرط الخامس:** أن يقبض رأس المال المسلم في مجلس العقد، ويكون معلوم الصفة والمقدار، كالمسلم سواء، فإن تفرقا قبل القبض بطل السلم، فإن أقبضه بعضه في المجلس ثم تفرقا بطل العقد في الجميع في إحدى الروايتين، والأخرى يبطل فيما لم يقبض، ولا يصح السلم فيما لا يضبط بالصفة، كالجواهر من الدر والياقوت واللؤلؤ."]], "ic": "book"}, {"story": ["الباب الثاني في علم الكسب بطريق البيع والربا والسلم والإجارة (٤ من ٦)، ص٣٦٩", ["**العقد الرابع: الإجارة:** وهي عقد على المنافع لازم من الطرفين، لا يصح إلا من جائز التصرف في المال، وهي على ضربين: متعلقة بالذمة، كالاستئجار لتحصيل بناء أو خياطة أو حمل شيء من مكان إلى مكان، ومتعلقة بالعين كاستئجار الدار للسكنى، والدابة للركوب، والإنسان للخدمة، فإن تلفت العين انفسخت الإجارة فيما بقي من المدة، فإن كانت دارا فانهدمت، أو أرضا للزرع فانقطع ماؤها انفسخت الإجارة فيما بقي في أحد الوجهين، وفي الآخر يثبت للمستأجر خيار الفسخ.", "ولا تصح الإجارة إلا على مدة معلومة القدر إما بالزمان كسكنى شهر، وخدمة", "حاشية: (١) المذروع: أي الذي يقاس بالذراع.", "سنة، أو بالعمل كالإجارة على بناء دار أو خياطة قميص أو الركوب إلى موضع معين.", "**العقد الخامس: القراض:** وهو المضاربة، وهو أن يدفع الإنسان ماله إلى آخر يتجر به، والربح بينهما يستحقه رب المال بماله والمضارب بعمله، ومبناها على الأمانة والوكالة لأنه بدفع المال إلى المضارب ائتمنه، وبإذنه أن يشتري ويبيع وكله، فإذا ظهر الربح صار شريكه فيه؛ لأنه يستحق منه جزءا.", "ولا تصح المضاربة إلا بالدنانير والدراهم في إحدى الروايتين، وفي الأخرى: تصح بالعروض على أن تقوم حال العقد.", "ولا تصح إلا على جزء معلوم من الربح لكل واحد منهما، فإن شرطا ما لا يعود بجهالة الربح، فذلك على ضربين صحيح وفاسد، فالصحيح أن يضاربه على أن لا يتجر إلا في البز أو البز(١) أو على أن لا يبيع ويشتري إلا ببغداد، والفاسد أن يشترط على المضارب ضمان المال أو سهما من الوضيعة.", "**العقد السادس: الشركة:** وهي على ضربين؛ شركة أملاك، وشركة عقود، فشركة الأملاك تحصل بفعلهما في ملك معين مثل أن يشتريا أو يوهب لهما فيقبلا، وبغير فعلهما مثل أن يرثا، فكل واحد منهما في نصيب شريكه كالأجنبي، لا يجوز له التصرف فيه إلا بإذنه، فإن تصرف ببيع أو هبة أو رهن نفذ في حصته.", "وأما شركة العقود، فلا تصح إلا من جائزي التصرف، وهي على خمسة أضرب: شركة عنان، وشركة وجوه، وشركة أبدان، وشركة مفاوضة، وشركة مضاربة.", "فأما شركة العنان، فتعتمد على المال والوكالة، فتنعقد على مالهما وعمل كل واحد منهما في المالين بحكم الملك في حصته، ويحكم الوكالة في حصة شريكه، ولا تصح إلا في جنس الأثمان في إحدى الروايتين، وسواء اتفق المالان في", "حاشية: (١) البز: نوع من الثياب."]], "ic": "book"}, {"story": ["الباب الثاني في علم الكسب بطريق البيع والربا والسلم والإجارة (٥ من ٦)، ص٣٧١", ["الجنس والصفة(١-١) أو اختلفا فأخرج أحدهما دراهم والآخر دنانير، أو أحدهما قراضة(١-١) والآخر صحاحا، وفي الرواية الأخرى: تصح في العروض أيضا، ويجعل رأس المال قيمتها وقت العقد، وتصح وإن لم يخلطا المالين، وما يشتريه كل واحد منهما بماله بعد عقد الشركة فهو له ولشريكه، وكذلك إن تلف أحد المالين فهو من ضمانهما، والربح فيها على ما شرطاه. والوضيعة على قدر المال، فإن شرط التساوي في الوضيعة مع التفاضل في المال، فالشرط باطل، والعقد صحيح.", "ويجوز لكل واحد من شريكي العنان أن يبيع ويشتري، ويقبض ويقبض، ويطالب بالدين ويخاصم فيه، ويحيل ويحتال، ويرد بالعيب، ويفعل كل ما هو من مصالح تجارتهما بمطلق الشركة، ولا يجوز لأحدهما أن يكاتب ولا يعتق على مال ولا يزوج الرقيق ولا يهبه ولا يقرض ولا يحابي ولا يضارب بمال الشركة إلا أن يأذن شريكه. وهل يجوز أن يودع أو يسافر بالمال أو يبيع نساء أو يبضع أو يوكل فيما يتولى مثله بنفسه أو يرهن أو يرتهن، أو يقابل، على وجهين.", "فإن قيل: ما معنى هذه التسمية أعني شركة العنان؟ فالجواب: أنه قد ذكر فيها أهل اللغة قولين؛ أحدهما: أنه من عن لفلان كذا أي عرض له كأن ذلك الشيء عن(٢) لهما، أي: عرض، فاشتركا فيه. والثاني: أنه من عنان الدابة إذا استويا في الشيء فكان لكل واحد منهما أن يعن، أي: يمنع صاحبه من التصرف، وذلك إذا أراد فسخ الشركة.", "**وأما شركة الوجوه:** وهي أن يشتركا في ربح ما يشتريان في ذمتهما بجاههما وثقة التجار بهما من غير أن يكون لهما رأس مال، فهي شركة صحيحة مبنية على أن يكون كل واحد منهما وكيلا لصاحبه فيما يشتريه ويبيعه، كفيلا عنه بالثمن، ولا فرق بين أن يعينا المشتري أو يقول كل واحد منهما: ما اشتريت من شيء فهو بيننا. فكيف شرطا وقوع المشتري بينهما جاز، فإذا باعا ووفيا ما عليهما قسما الربح على ما شرطاه من مساواة أو تفضيل. والوضيعة على قدر ملكيهما في", "حاشية: (١-١) سقط من (ظ).", "حاشية: (٢) في الأصل: «عرض».", "المشترى في أحد الوجهين، وفي الآخر: أن الربح والوضيعة على قدر ملكيهما في المشترى وهما في جميع التصرفات بمنزلة شريكي العنان.", "**وأما شركة الأبدان:** وهي أن يشتركا فيما يكسبان بأبدانهما، فهي شركة صحيحة مبنية على أن كل ما يتقبله كل واحد منهما من الأعمال يصير في ضمانه وضمان شريكه، يطالب به كل واحد منهما، ويلزمه عمله، وهي جائزة مع اتفاق الصنائع، فأما مع اختلافها، فيحتمل وجهين أصحهما أنه لا تصح.", "وتصح الشركة في الاحتشاش والاحتطاب والاصطياد، والثمار المأخوذة من الجبال، وفي التلصص على دار الحرب وسائر المباحات."]], "ic": "book"}, {"story": ["الباب الثاني في علم الكسب بطريق البيع والربا والسلم والإجارة (٦ من ٦)، ص٣٧٢", ["**وأما شركة المفاوضة:** فهي على ضربين: أحدهما: أن يفوض كل واحد منهما إلى صاحبه الشراء والبيع والتوكيل والابتياع في الذمة، والمسافرة بالمال والمضاربة به، وضمان ما يرى من الأعمال، فهذه شركة صحيحة، والربح فيها على ما شرطاه، والوضيعة على قدر المال.", "والضرب الثاني: أن يدخلا في الشركة المذكورة ما يلزم كل واحد منهما من غصب، أو بيع فاسد، أو ضمان مال، أو أرش جناية، وأن يكون بينهما ما يجدان من لقطة أو ركاز، وما يحصل لهما بالميراث، فهذه شركة باطلة، ولكل واحد منهما ربح ماله وأجرة عمله، وما يجده أو يرثه، ويختص بضمان ما غصبه أو جناه أو ضمنه عن الغير.", "**وأما شركة المضاربة:** فهي أن يدفع الإنسان ماله إلى آخر يتجر به والربح بينهما يستحقه رب المال بماله والمضارب بعمله، ومبناها على الأمانة والوكالة، وقد ذكرنا هذا في القراض، فإن القراض هو المضاربة، وكلما جاز لأحد الشريكين فعله بمطلق عقد الشركة جاز للمضارب فعله بمطلق المضاربة، وما ليس للشريك فعله إلا بإذن شريكه فليس للمضارب فعله إلا بإذن رب المال، وليس للمضارب أن يضارب لرجل آخر إذا كان في ذلك ضرر على الأول، فإن فعل وربح رده في شركة الأول، فإن مات المضارب ولم تعرف المضاربة بعينها، فإنها تصير دينا عليه."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "وأما شركة المفاوضة: فهي على ضربين: أحدهما: أن يفوض كل واحد منهما إلى صاحبه الشراء والبيع والتوكيل والابتياع في الذمة، والمسافرة بالمال والمضاربة به، وضمان ما يرى من الأعمال، ____ شركة صحيحة،", "o": ["فهذه", "تقليل", "زماننا", "الشبهة"], "h": "راجع: ص٣٧٢"}, {"t": "fill", "d": 2, "q": "ولا تصح المضاربة إلا بالدنانير ____ في إحدى الروايتين، وفي الأخرى", "o": ["والدراهم", "اليمان", "القديد", "الماضي"], "h": "راجع: ص٣٧٠"}, {"t": "fill", "d": 2, "q": "فإن قيل: ما معنى هذه التسمية أعني شركة العنان؟ فالجواب: أنه قد ذكر فيها أهل اللغة قولين؛ أحدهما: أنه من عن لفلان كذا أي عرض له كأن ذلك الشيء عن ____، أي: عرض، فاشتركا فيه. والثاني: أنه من عنان", "o": ["لهما", "بالباب", "ولدا", "ويكسر"], "h": "راجع: ص٣٧١"}, {"t": "fill", "d": 2, "q": "والضرب الثاني: أن يدخلا في الشركة المذكورة ما يلزم كل واحد منهما من غصب، أو بيع فاسد، أو ضمان مال، أو أرش جناية، وأن يكون بينهما ما يجدان من لقطة أو ____، وما يحصل لهما بالميراث، فهذه شركة باطلة،", "o": ["ركاز", "قربك", "مكلمك", "المؤذى"], "h": "راجع: ص٣٧٢"}, {"t": "fill", "d": 2, "q": "وأما شركة المضاربة: فهي أن يدفع الإنسان ماله إلى آخر يتجر به والربح بينهما يستحقه رب ____ بماله والمضارب بعمله، ومبناها على الأمانة والوكالة، وقد ذكرنا هذا في القراض، فإن القراض هو المضاربة،", "o": ["المال", "طيشها", "صموتا", "يكفى"], "h": "راجع: ص٣٧٢"}, {"t": "fill", "d": 2, "q": "التفاضل في مطعوم لا يكال ولا يوزن كالرمان والبطيخ، ولا في مكيل أو موزون لا يؤكل، كالحديد ____، ومتى اختلف الجنسان جاز التفاضل على جميع الروايات", "o": ["والأشنان", "إغطاشا", "والضلوع", "بكفرهن"], "h": "راجع: ص٣٦٨"}]}], "sum": [["الصفحات", "ص٣٦٥ - ص٣٧٢"]], "_nq": 6}, {"id": "l15", "title": "الباب الثالث في بيان العدل واجتناب الظلم في المعاملة", "group": "كتاب آداب الكسب والمعاش", "map": {"center": "الباب\nالثالث في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الثالث في بيان العدل واجتناب الظلم في المعاملة", "b": [{"pic": ["books", "book"], "cap": "ص٣٧٣ - ص٣٧٥"}, {"story": ["الباب الثالث في بيان العدل واجتناب الظلم في المعاملة (١ من ٢)، ص٣٧٣", ["**في بيان العدل واجتناب الظلم في المعاملة**", "اعلم أن المعاملة قد تجري على وجه يحكم المفتي(١) بصحتها وانعقادها، لكنها تشتمل على ظلم يتعرض به المعامل لسخط الله عز وجل، إذ ليس كل نهي يقتضي فساد العقد، وهذا الظلم نعني به ما يستضر به الغير، وهو منقسم إلى ما يعم ضرره، وإلى ما يخص المعامل.", "**القسم الأول:** فيما يعم ضرره، وهو أنواع:", "**الأول: الاحتكار:** وهو منهي عنه لما فيه من غلاء السعر، وتضييق الأقوات على الناس، وصفته أن يستكثر من ابتياع الغلات في الغلاء، ويتربص بها زيادة الأسعار، ولا يبيع شيئا منها، فأما إذا دخلت له غلة من ضيعته فحبسها يتربص بها الأسعار، فليس محتكرا، وكذلك إذا اشترى في حال الاتساع والرخص على صفة لا يضيق على الناس، فإنه لا يكون محتكرا، وإن لم يكن غلاء لكنه ابتاعه على وجه يضيق على الناس بابتياعه، وهو أن تدخل قافلة فيبادر رجل له مال فيشتري ذلك يضيق على الناس، فإنه يدخل تحت النهي، ويكون محتكرا، وإذا ثبت أنه ممنوع من الاحتكار، فهل هو نهي تحريم أم تنزيه؟ يحتمل وجهين، وإنما يكون هذا الحكم إذا كان ذلك في بلد بالناس فيه ضيق وقحط، كالحرمين والثغور، فأما إذا كان من البلاد الواسعة الكثيرة الخير والجلب، كبغداد والبصرة، فلا، ثم إنما يكون الاحتكار في الأقوات خاصة دون غيرها من التمر والعسل ونحو ذلك، وفي الجملة تكره التجارة في القوت؛ لأنه قوام الآدمي، وكان بعض السلف يقول في أموال الدقاقين(٢): أموال جمعت من عموم المسلمين.", "حاشية: (١) تحرفت في (ظ) إلى: «المستفتي».", "حاشية: (٢) الدقاق: من يدق الأبازير للناس يطحنها لهم.", "**النوع الثاني:** ترويج الزائف من الدراهم في أثناء النقد، وهو الذي لا ذهب فيه أصلا أو لا فضة فيه أصلا، فإنه يستضر به المعامل إن لم يعرف، وإن عرف فسيروجه على غيره، ولا يزال يتردد في الأيدي ويعم الضرر به، وللمبهرج(١) الأول نصيب من آثام الكل، فينبغي للتاجر تعلم النقد لكي لا يسلم إلى مسلم زائفا وهو لا يدري، ولو علما جميعا به فإن البائع يأخذه ليروجه على غيره خصوصا إذا علم أنه يستحل ترويجه، وفي ذلك إعانة له على الشر.", "**القسم الثاني:** ما يخص ضرره المعامل:", "وينبغي أن يحب لأخيه ما يحب لنفسه، فمن ذلك أن لا يثني على السلعة بما ليس فيها، وأن لا يكتم من عيوبها وخفايا صفاتها شيئا، وقد روينا عن يونس بن عبيد أنه كان خزازا(٢)، وأن غلامه أخرج لطالب حزمة فقال الغلام: صلى الله عليك يا رسول الله(٣)، فقال يونس: ردها، ولم يبع. وقد قال النبي ﷺ: «من غشنا فليس منا». وقال جرير: بايعت رسول الله ﷺ على النصح لكل مسلم. وأخرج مجمع شاة يبيعها فقال: أظن في لبنها ملوحة.", "وقال الحسن بن صالح في جارية باعها: إنها تنخمت عندنا مرة دما."]], "ic": "book"}, {"story": ["الباب الثالث في بيان العدل واجتناب الظلم في المعاملة (٢ من ٢)، ص٣٧٤", ["ومن اعتقد أن كتمان هذه الأشياء يزيد في رزقه فقد جهل، وفي الصحيحين من حديث حكيم بن حزام عن النبي ﷺ أنه قال: «البيعان بالخيار ما لم يتفرقا، فإن صدقا وبينا رزقا بركة بيعهما، وإن كذبا وكتما محقت بركة بيعها».", "فأما اليمين الفاجرة في تنفيق السلعة، ففي أفراد مسلم من حديث أبي قتادة عن النبي ﷺ أنه قال: «إياكم وكثرة الحلف في البيع، فإنه ينفق ثم يمحق». وفي أفراده من حديث أبي ذر عن النبي ﷺ أنه قال: «ثلاثة لا يكلمهم الله، ولا ينظر إليهم يوم", "حاشية: (١) المبهرج: المزلف.", "حاشية: (٢) الخزاز: بائع الخز، وهو نوع من الثياب.", "حاشية: (٣) في الإحياء أن الغلام قال: اللهم ارزقنا الجنة، فرد يونس البيع لأنه خشي أن يكون غلامه قد مدح السلعة.", "القيامة، ولا يزكيهم، ولهم عذاب أليم.» فذكر منهم: «المنفق سلعته بالحلف الكاذب».", "واعلم أنه لا يصح النصح(١) إلا لمؤمن يعلم أن الخيانة لا تزيد في المال والصدقة لا تنقصه، وأن ربح الآخرة خير من ربح الدنيا، وأن الأرباح لا تقاوم العقاب في العاقبة، فلا ينبغي أن يستبدل الذي هو أدنى بالذي هو خير، فالخير كله في سلامة الدين.", "واعلم أن الغش حرام في البيوع وفي الصناعات أيضا، وقد سئل الإمام أحمد عن رفو(٢) الثوب حتى لا يبين فقال: لا يجوز لمن يبيعه أن يخفيه، وإنما يحل للرفاء أن يعمله لمن لا يريده للبيع أو لمن يظهر ذلك إذا باعه.", "وينبغي للتاجر أن يحقق الوزن، ولا يتخلص من هذا حتى يرجح إذا أعطى، وينقص إذا أخذ، ومتى خلط العلاف بالطعام ترابا ثم كاله، فهو مطفف، أو القصاب عظما لم تجر العادة بمثله.", "وقد نهي عن النجش وهو الزيادة في ثمن السلعة ليغر وهو لا يريدها، ونهي عن التصرية(٣).", "حاشية: (١) في النسخ: «التصحيح»، والمثبت من الإحياء.", "حاشية: (٢) رفا ثوبه: رقعه.", "حاشية: (٣) التصرية: ربط أخلاف البقرة ليجتمع الحليب فيها فيظن الشاري أنها تحلب أكثر من غيرها."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "اعلم أن المعاملة قد تجري على وجه يحكم المفتي بصحتها وانعقادها، لكنها تشتمل على ظلم يتعرض به المعامل لسخط الله عز وجل، إذ ليس كل نهي يقتضي فساد العقد، وهذا ____ نعني به ما يستضر به الغير، وهو منقسم إلى ما يعم ضرره، وإلى ما يخص المعامل", "o": ["الظلم", "خليلك", "رعاية", "المنافع"], "h": "راجع: ص٣٧٣"}, {"t": "fill", "d": 2, "q": "وينبغي للتاجر أن يحقق الوزن، ولا يتخلص من هذا حتى يرجح إذا أعطى، وينقص إذا أخذ، ومتى خلط العلاف ____ ترابا ثم كاله، فهو مطفف، أو القصاب عظما لم تجر العادة بمثله", "o": ["بالطعام", "يتذاكرون", "أمكنها", "بإراقتها"], "h": "راجع: ص٣٧٥"}, {"t": "fill", "d": 2, "q": "النوع الثاني: ترويج الزائف من الدراهم في أثناء النقد، وهو الذي لا ذهب فيه أصلا أو لا فضة فيه أصلا، فإنه يستضر به المعامل إن لم يعرف، وإن عرف فسيروجه على غيره، ولا يزال ____ في الأيدي ويعم الضرر", "o": ["يتردد", "موضعه", "ووزن", "يطالب"], "h": "راجع: ص٣٧٤"}, {"t": "fill", "d": 2, "q": "وينبغي أن يحب لأخيه ما يحب لنفسه، فمن ذلك أن لا يثني على السلعة بما ليس فيها، وأن لا يكتم من عيوبها وخفايا صفاتها شيئا، وقد روينا عن يونس بن عبيد أنه كان خزازا، وأن غلامه أخرج لطالب ____ فقال الغلام", "o": ["حزمة", "فشمته", "المسمى", "يتيقن"], "h": "راجع: ص٣٧٤"}, {"t": "fill", "d": 2, "q": "فأما اليمين الفاجرة في تنفيق السلعة، ففي أفراد مسلم من ____ أبي قتادة عن النبي ﷺ أنه قال", "o": ["حديث", "صحبة", "نتماقت", "الصيف"], "h": "راجع: ص٣٧٤"}, {"t": "fill", "d": 2, "q": "واعلم أن الغش حرام في البيوع وفي الصناعات أيضا، وقد سئل ____ أحمد عن رفو الثوب حتى لا يبين فقال", "o": ["الإمام", "فوقهم", "للأخ", "ذوات"], "h": "راجع: ص٣٧٥"}]}], "sum": [["الصفحات", "ص٣٧٣ - ص٣٧٥"]], "_nq": 6}, {"id": "l16", "title": "الباب الرابع في الإحسان في المعاملة", "group": "كتاب آداب الكسب والمعاش", "map": {"center": "الباب\nالرابع في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الرابع في الإحسان في المعاملة", "b": [{"pic": ["books", "book"], "cap": "ص٣٧٦ - ص٣٧٩"}, {"story": ["الباب الرابع في الإحسان في المعاملة (١ من ٣)، ص٣٧٦", ["**في الإحسان في المعاملة**", "قد أمر الله سبحانه بالعدل والإحسان، فالعدل سبب للنجاة فقط، وهو يجري من التجارة مجرى رأس المال، والإحسان سبب للفوز ونيل السعادة، وهو يجري من التجارة مجرى الربح، ولا يعد من العقلاء من قنع في معاملات الدنيا برأس ماله، فكذا في معاملات الآخرة، فلا ينبغي للمتدين أن يقتصر على العدل واجتناب الظلم، ويدع أبواب الإحسان فقد قال تعالى: ﴿وَأَحْسِن كَمَآ أَحْسَنَ ٱللَّهُ إِلَيْكَ﴾ [القصص: ٧٧]، والإحسان تفضل غير واجب؛ لأن الواجب يدخل في باب العدل، وتنال رتبة الإحسان بواحد من ستة أشياء:", "**الأول:** في المغابنة، فينبغي أن لا يغبن صاحبه بما لا يتغابن في العادة بمثله، فأما أصل المغابنة فمأذون فيه؛ لأن البيع للربح، ولا يمكن ذلك إلا بغبن ما، ولكن يراعى فيه التقريب، فإن بذل المشتري زيادة على الربح المعتاد إما لشدة رغبته أو لقوة حاجته في الحال، فينبغي أن يمتنع البائع من قبول ذلك، فذلك من الإحسان، فأما إذا كان أحدهما لا يخبر سعر المبيع فغبنه(١) بما لا يتغابن الناس بمثله في العادة، فله الخيار عندنا، ومن أصحابنا من حده بالثلث، أخبرنا المحمدان ابن ناصر وابن عبد الباقي، قالا: أخبرنا حمد بن أحمد قال: أخبرنا أبو نعيم أحمد بن عبد الله قال: أخبرنا أبو محمد بن حبان قال: حدثنا محمد بن أحمد بن معدان قال: حدثنا ابن وارة قال: حدثنا الأصمعي قال: حدثنا مؤمل بن إسماعيل قال: جاء رجل من أهل الشام إلى سوق الخزازين، فقال: مطرف(٢) بأربع مئة. فقال يونس بن عبيد: عندنا بمئتين. فنادى مناد بالصلاة، فانطلق يونس", "حاشية: (١) تحرفت في الأصل إلى: «فعنه».", "حاشية: (٢) المطرف: رداء أو ثوب من خز مربع ذو أعلام.", "إلى بني قشير ليصلي بهم، فجاء وقد باع ابن أخيه المطرف من الشامي بأربع مئة فقال يونس: ما هذه الدراهم؟ فقال: ذاك المطرف بعناه من هذا الرجل. فقال يونس: يا عبد الله، هذا المطرف الذي عرضت عليك بمئتي درهم، فإن شئت فخذه وخذ مئتين، وإن شئت فدعه. فقال: من أنت؟ قال: رجل من المسلمين. فقال: بل أسألك بالله من أنت وما اسمك؟ قال: يونس بن عبيد. قال: فوالله إنا لنكون في بحر العدو فإذا اشتد الأمر علينا، قلنا: اللهم رب يونس فرج عنا، أو شبيه هذا. فقال يونس: سبحان الله، سبحان الله.", "وقد قال علي رضي الله عنه: يا معشر التجار، لا تردوا قليل الربح فتحرموا كثيره.", "**الثاني:** احتمال الغبن إذا اشترى شيئا من فقير، فأما إذا اشتراه من غني فلا، فإنه قد قيل: المغبون لا محمود ولا مأجور."]], "ic": "book"}, {"story": ["الباب الرابع في الإحسان في المعاملة (٢ من ٣)، ص٣٧٧", ["**الثالث:** في استيفاء الثمن والديون، والإحسان في ذلك تارة بالمسامحة، وتارة بحط البعض، وتارة بالإنظار، وتارة بالتساهل في جودة النقد، وفي الصحيحين من حديث أبي هريرة عن النبي ﷺ أنه قال: «كان رجل يداين الناس فيقول لفتاه: إذا أتيت معسرا فتجاوز عنه لعل الله عز وجل يتجاوز عنا. فلقي الله فتجاوز عنه». وفيهما من حديث حذيفة عن النبي ﷺ أنه قال: «إن رجلا ممن كان قبلكم أتاه ملك ليقبض نفسه، فقال له: هل عملت من خير؟ فقال: ما أعلم شيئا(١) قيل له: انظر. فقال: ما أعلم شيئا غير أني كنت أبايع الناس وأجازفهم(٢) فأنظر المعسر وأتجاوز عن الموسر. فأدخله الله الجنة». وفي أفراد البخاري من حديث جابر عن النبي ﷺ أنه قال: «رحم الله رجلا سمحا إذا اشترى وإذا اقتضى». وفي أفراد مسلم من حديث أبي قتادة عن النبي ﷺ، أنه قال: «من سره أن ينجيه الله من كرب يوم القيامة فلينفس عن معسر أو يضع عنه». وفي حديث أبي اليسر كعب بن عجرة(٣) عن النبي ﷺ أنه", "حاشية: (١) ليست في الأصل.", "حاشية: (٢) جازف: باع الشيء لا يعلم كيله أو وزنه.", "حاشية: (٣) تحرفت في الأصل إلى: «عمرو».", "قال: «من أنظر معسرا، أو وضع عنه أظله الله تعالى في ظله يوم لا ظل إلا ظله». وفي حديث أبي أمامة عن النبي ﷺ أنه قال: «دخلت الجنة، فرأيت على بابها الصدقة بعشر، والقرض بثمانية عشر، فسألت جبريل عن ذلك، فقال: لأن الصدقة تقع في يد الغني والفقير، والقرض لا يقع إلا في يد محتاج إليه»."]], "ic": "book"}, {"story": ["الباب الرابع في الإحسان في المعاملة (٣ من ٣)، ص٣٧٨", ["**الرابع:** في توفية الدين، ومن الإحسان فيه حسن القضاء، وذلك بأن يمشي إلى صاحب الحق، ولا يكلفه التقاضي، وإن قدر أداه قبل محله، ثم يجوده مما يقضيه به، ثم يشكره، فإن كلمه عند حلول الأجل بكلام خشن احتمله، وفي الصحيحين من حديث أبي هريرة أن رجلا تقاضى رسول الله ﷺ بعيرا فقالوا: ما نجد إلا أفضل من سنه فقال: «أعطوه» فقال: أوفيتني أوفى الله لك. فقال: «خيار الناس أحسنهم قضاء». وفي بعض ألفاظ هذا الحديث الصحاح: كان لرجل على رسول الله ﷺ حق، فأغلظ له، فهم به أصحاب رسول الله ﷺ فقال رسول الله ﷺ: «دعوه، فإن لصاحب الحق مقالا». وقد أخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أبو بكر بن مالك قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا وكيع قال: حدثنا إبراهيم بن إسماعيل بن عبد الله بن أبي ربيعة المخزومي عن أبيه عن جده أن النبي ﷺ استسلف منه حين غزا حنينا ثلاثين أو أربعين ألفا، فلما انصرف قضاها إياه، ثم قال: «بارك الله لك في أهلك ومالك إنما جزاء السلف الوفاء والحمد». وفي أفراد البخاري من حديث أبي هريرة عن النبي ﷺ أنه قال: «من أخذ أموال الناس يريد أداءها أداها الله عنه، ومن أخذها يريد إتلافها أتلفه الله» وكانت عائشة تدان، فقيل لها: ما لك وللدين؟ فقالت: سمعت رسول الله ﷺ يقول: «ما من عبد كانت له نية في أداء دينه إلا كان له من الله عز وجل عون» فأنا ألتمس ذلك العون.", "**الخامس:** أن يقيل من يستقيله، فإنه لا يستقيله إلا متضرر بالبيع، فلا ينبغي أن يرضى لنفسه أن يكون سبب(١) استضرار أخيه، فقد روى أبو داود في سننه من", "حاشية: (١) سقطت من الأصل.", "حديث أبي هريرة عن النبي ﷺ أنه قال: «من أقال مسلما أقال الله عثرته».", "**السادس:** أن ينسئ(١) الفقراء ويعزم أن لا يطالبهم إن لم تظهر لهم ميسرة.", "وفي الجملة التجارة محك الرجال وبها يبين دين الرجل وورعه، شهد شاهد عند عمر بن الخطاب فقال: ائتني بمن يعرفك. فأتاه برجل فأثنى عليه خيرا، فقال له عمر: أنت جاره الأدنى الذي يعرف مدخله ومخرجه؟ قال: لا. قال: كنت رفيقه في السفر الذي يستدل به على مكارم الأخلاق؟ قال: لا. قال: فعاملته بالدينار والدرهم الذي يستبين بهما ورع الرجل؟ قال: لا. قال: أظنك رأيته قائما في المسجد يهمهم بالقرآن يخفض رأسه طورا ويرفعه. قال: نعم. قال: اذهب فلست تعرفه. وقال للرجل: اذهب فائتني بمن يعرفك.", "حاشية: (١) أي: يمهلهم ويؤخرهم."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "الثاني: احتمال الغبن إذا اشترى شيئا من فقير، فأما إذا اشتراه من غني فلا، ____ قد قيل: المغبون لا محمود ولا", "o": ["فإنه", "بقوم", "يلعنكم", "لداود"], "h": "راجع: ص٣٧٧"}, {"t": "fill", "d": 2, "q": "الرابع: في توفية الدين، ومن الإحسان فيه حسن القضاء، وذلك بأن يمشي إلى صاحب الحق، ولا يكلفه التقاضي، وإن قدر أداه قبل محله، ثم يجوده مما ____ به، ثم يشكره، فإن كلمه عند حلول الأجل بكلام خشن", "o": ["يقضيه", "الكفار", "وزاد", "يزيد"], "h": "راجع: ص٣٧٨"}, {"t": "fill", "d": 2, "q": "قال: «من أنظر معسرا، أو وضع عنه أظله الله تعالى في ظله يوم لا ظل إلا ظله». وفي حديث أبي أمامة عن النبي ﷺ أنه قال: «دخلت الجنة، فرأيت على بابها الصدقة بعشر، والقرض ____ عشر، فسألت جبريل عن ذلك،", "o": ["بثمانية", "يهمهم", "يستدعي", "ضربها"], "h": "راجع: ص٣٧٨"}, {"t": "fill", "d": 2, "q": "إلى بني قشير ليصلي بهم، فجاء وقد باع ابن ____ المطرف من الشامي بأربع مئة فقال الصياغة والنقش وتشييد البنيان بالجص وجميع ما يزخرف به، فإنه مكروه.", "ومن المعاصي عمل الملاهي، وخياطة الخياط القباء الديباج للرجل، ويكره أن يكون جزارا؛ لأنه يوجب قساوة القلب، أو حجاما، أو كناسا لما فيه من مباشرة النجاسة، وفي معناه الدباغ، وقد استحب السلف التجارة خصوصا في البز", "والخياطة والقصارة وعمل الخفاف وحذو النعال وعمل الحديد والمغازل والصيد والوراقة، قال عبد الوهاب الوراق: قال لي الإمام أحمد بن حنبل رحمه الله: ما صناعتك؟ قلت: الوراقة. قال: كسب طيب، لا تكتب إلا مواصفة واستتن الحواشي وظهور الأجزاء.", "ولا يجوز أخذ الأجرة على تعليم القرآن والعبادات وفروض الكفايات، كغسل الموتى.", "**الثالث:** أن لا تمنعه سوق الدنيا عن سوق الآخرة، وسوق الآخرة المساجد، فينبغي أن يجعل أول النهار إلى وقت دخول السوق لآخرته، فيواظب على الأوراد وقد كان صالحوا السلف من التجار يجعلون أول النهار وآخره للآخرة، ووسطه للتجارة، وإذا سمع الأذان للظهر والعصر، فينبغي له أن يترك المعاش اشتغالا بأداء الفرض."]], "ic": "book"}, {"story": ["الباب الخامس في شفقة التاجر على دينه فيما يخصه ويعم آخرته (٢ من ٢)، ص٣٨١", ["**الرابع:** أن يلازم ذكر الله تعالى في السوق، ويشتغل بالتسبيح والتهليل، وقد ذكرنا في كتاب الذكر ما يقال في السوق من الأذكار، قال أبو جعفر الفرغاني: كنا عند الجنيد فجرى ذكر ناس يجلسون في المسجد(١) ويعيبون من يدخل السوق، فقال: كم ممن هو في السوق حكمه أن يدخل المسجد ويأخذ بأذن بعض من فيه فيخرجه ويجلس مكانه، إني لأعرف رجلا يدخل السوق ورده كل يوم ثلاث مئة ركعة وثلاثون ألف تسبيحة، قال: فسبق إلى وهمي أنه يعني نفسه.", "**الخامس:** أن لا يكون شديد الحرص على السوق والتجارة، وذلك بأن يكون أول داخل وآخر خارج، وبأن يركب البحر في التجارة، قال عبد الله بن عمرو بن العاص: لا تكن أول داخل إلى السوق ولا آخر خارج منها، فإن بها باض الشيطان وفرخ. وتمام هذا الاحتراز أن يراقب حصول كفايته ثم ينصرف، فقد كان حماد بن سلمة إذا حصل له قدر ما يكفيه قام، وقد كان فيهم من يعمل في الأسبوع يومين أو يوما على مقدار الحاجة.", "حاشية: (١) في الأصل: «المجلس».", "**السادس:** أن لا يقتصر على اجتناب الحرام بل يتوقى مواقع الشبهة ومواضع الريب، ولا يقف مع الفتاوي بل يستفتي قلبه فيجتنب ما يحز في القلب، فإن الإثم حزاز(١) القلوب.", "وينبغ الله عز وجل: ﴿كُلُوا۟ مِنَ ٱلطَّيِّبَـٰتِ وَٱعْمَلُوا۟ صَـٰلِحًا﴾ [المؤمنون: ٥١]، الطيبات: الحلال، فأمر به قبل العمل، وقال: ﴿وَلَا تَأْكُلُوٓا۟ أَمْوَٰلَكُم بَيْنَكُم بِٱلْبَـٰطِلِ﴾ [البقرة: ١٨٨]، وقال الله عز وجل: ﴿إِنَّ ٱلَّذِينَ يَأْكُلُونَ أَمْوَٰلَ ٱلْيَتَـٰمَىٰ ظُلْمًا﴾ [النساء: ١٠]، وقال: ﴿وَذَرُوا۟ مَا بَقِىَ مِنَ ٱلرِّبَوٰٓا۟ إِن كُنتُم مُّؤْمِنِينَ فَإِن لَّمْ تَفْعَلُوا۟ فَأْذَنُوا۟ بِحَرْبٍ مِّنَ ٱللَّهِ وَرَسُولِهِۦ﴾ [البقرة: ٢٧٨-٢٧٩] ثم قال: ﴿وَمَنْ عَادَ فَأُو۟لَـٰٓئِكَ أَصْحَـٰبُ ٱلنَّارِ﴾ [البقرة: ٢٧٥] وقد أخبرنا هبة الله بن محمد قال: أخبرنا الحسن بن علي قال: أخبرنا أبو بكر بن مالك قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا أبو النضر قال: حدثنا الفضيل بن مرزوق عن عدي بن ثابت عن أبي حازم عن أبي هريرة قال: قال رسول الله ﷺ: «أيها الناس، إن الله طيب لا يقبل إلا طيبا وإن الله عز وجل أمر المؤمنين بما أمر به المرسلين، فقال: ﴿يَـٰٓأَيُّهَا ٱلرُّسُلُ كُلُوا۟ مِنَ ٱلطَّيِّبَـٰتِ وَٱعْمَلُوا۟ صَـٰلِحًا﴾ [المؤمنون: ٥١]، وقال: ﴿يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ كُلُوا۟ مِن طَيِّبَـٰتِ مَا رَزَقْنَـٰكُمْ﴾ [البقرة: ١٧٢]، ثم ذكر الرجل يطيل السفر أشعث أغبر يمد يده إلى السماء يا رب يا رب، ومطعمه حرام ومشربه حرام وملبسه حرام وغذي بالحرام، فأنى يستجاب لذلك؟» انفرد بإخراجه مسلم. وبالإسناد حدثنا الإمام أحمد بن حنبل قال: حدثنا محمد بن عبيد قال: حدثنا أبان بن إسحاق عن الصباح بن محمد بن مرة الهمداني عن ابن مسعود ﷺ: قال رسول الله ﷺ: «لا يكتسب عبد مالا من حرام فينفق منه فيبارك له فيه، ولا يتصدق به فيقبل منه، ولا يتركه خلف ظهره إلا كان زاده إلى النار، إن الله عز وجل لا يمحو السيئ بالسيئ، ولكنه يمحو السيئ بالحسن، إن الخبيث لا يمحو الخبيث». وقد صح عن", "رسول الله ﷺ أنه لعن آكل الربا وموكله، وروي أن سعدا سأل رسول الله ﷺ أن تستجاب دعوته، فقال له: «أطب طعمتك، تستجب دعوتك».", "وقد كان السلف ينظرون في الحلال ويدققون، فأكل أبو بكر الصديق رضي الله عنه شيئا من شبهة ثم قاء، وقال إبراهيم بن أدهم: ما أدرك من أدرك إلا من كان يعقل ما يدخل جوفه. وقال بعض السلف: المعدة حوض البدن(١)، فإذا ترك فيها الحلال تحركت الأعضاء بالطاعة، وإذا ترك فيها الحرام تحركت الأعضاء بالمعصية."]], "ic": "book"}, {"story": ["الباب الأول في فضيلة طلب الحلال وذم الحرام ودرجات الحلال وال (٢ من ٥)، ص٣٨٦", ["**أصناف الحلال ومداخله:** اعلم أن المال إنما يحرم لمعنى في عينه، أو لخلل في جهة اكتسابه، فأما الحرام لعينه، فكالخمر، وتفصيل هذا أن الأعيان المأكولة على وجه الأرض لا تعدوا ثلاثة أقسام: إما أن تكون من المعادن، كالملح والطين، أو من النبات أو من الحيوان، فأما المعادن فهي أجزاء من الأرض، فلا يحرم أكل ما يخرج منها إلا من حيث يضر بالأكل، وبعضها يجري مجرى السم، وأما النبات فلا يحرم منه إلا ما يزيل العقل كالمسكر، أو الحياة كالسموم، أو الصحة كالأدوية في غير وقتها، وكان مجموع هذا يرجع إلى الضرر إلا في حق المسكر، فإن الذي لا يسكر منها حرام أيضا مع قلته لعينه وصفته، وهي الشدة، فأما السم فإنه إذا خرج عن كونه مضرا لقلته أو لعجنه بغيره لم يحرم، وأما الحيوانات فتنقسم إلى ما يؤكل وإلى ما لا يؤكل، وتفصيل ذلك في كتاب الأطعمة، وإنما يحل ما يحل منها إذا ذبح ذبحا شرعيا يراعى فيه شروط الذابح والآلة والمذبوح، وذلك مذكور في كتاب الصيد والذبائح، وما لم يذبح ذبحا شرعيا أو مات، فهو حرام، إلا أنه قد أحلت لنا ميتتان: السمك والجراد.", "**القسم الثاني:** ما يحرم لخلل في جهة إثبات اليد عليه، فنقول: أخذ المال إما أن يكون باختيار المتملك أو بغير اختياره، فالذي بغير اختياره، كالإرث، والذي باختياره إما أن يكون من مالك كنيل المعادن، أو من غير مالك، فإما أن يؤخذ قهرا أو تراضيا، فالمأخوذ قهرا إما أن يكون لسقوط عصمة المالك، كالغنائم أو لاستحقاق الآخذ كزكوات الممتنعين والنفقات الواجبة عليهم، والمأخوذ تراضيا", "حاشية: (١) تحرفت في الأصل إلى: «السلف».", "إما أن يؤخذ بعوض، كالمبيع والصداق والأجرة، أو بغير عوض، كالوصية والهبة، فيحصل من هذا السياق ستة أقسام:", "**الأول:** ما لا يؤخذ من مالك، كالمعادن وإحياء الموات والاصطياد والاحتطاب والاحتشاش، فهذا حلال بشرط أن لا يكون المأخوذ مختصا بذي حرمة من الآدميين، فإذا انفك عن الاختصاص ملكه آخذه.", "**الثاني:** المأخوذ قهرا ممن لا حرمة له، وهو الفيء والغنيمة وسائر أموال الكفار المحاربين، وذلك حلال للمسلمين إذا أخرجوا منه الخمس، وقسموه بين المستحقين بالعدل، ولم يأخذوا من كافر له حرمة وأمان وعهد.", "**الثالث:** ما يؤخذ قهرا باستحقاق عند امتناع من وجب(١) عليه، وذلك حلال إذا تم سبب الاستحقاق، وتم وصف المستحق، واقتصر على القدر المستحق، واستوفاه من يملك الاستيفاء من سلطان أو قاض أو مستحق.", "**الرابع:** ما يؤخذ تراضيا بمعاوضة، وذلك حلال إذا روعي شرط العوضين، وشرط العاقدين، وشرط اللفظين، أعني: الإيجاب والقبول، وكان مما يجوز فيه التعاطي.", "**الخامس:** ما يؤخذ بالرضا من غير عوض، كالهبة، وذلك حلال إذا روعي شرط المعقود عليه، وشرط العقد، وشرط العاقدين، ولم يؤد إلى ضرر بوارث وغيره."]], "ic": "book"}, {"story": ["الباب الأول في فضيلة طلب الحلال وذم الحرام ودرجات الحلال وال (٣ من ٥)، ص٣٨٧", ["**السادس:** ما يحصل بغير اختيار، كالميراث وهو حلال إذا كان الموروث قد اكتسب من وجه حلال، ثم كان ذلك بعد قضاء الدين، وتنفيذ الوصايا، وتعديل القسمة بين الورثة، وإخراج الحج والكفارة، فهذه مجامع مداخل الحلال أومأنا إليها(٢).", "حاشية: (١) سقطت من النسخ، واستدركت من الإحياء.", "حاشية: (٢) ورد هنا في هامش (ظ) ما نصه: «آخر الجزء الخامس من أجزاء الشيخ المصنف».", "**درجات الحلال والحرام**", "اعلم أن الحلال كله طيب، ولكن بعضه أطيب من بعض، والحرام كله خبيث، ولكن بعضه أخبث من بعض، كما أن الطبيب يحكم على كل حلو بالحرارة، ولكنه يقول: هذا حار في الدرجة الأولى، وهذا حار في الثانية وهذا في الثالثة، وهذا في الرابعة. فلنجعل هذا مثالا لما نذكره من هذا الفن فنقول: الورع عن الحرام على أربع درجات:", "**الأولى:** ورع العدول، وهو الذي يحصل الفسق باقتحامه، وتسقط العدالة به، ويثبت اسم العصيان بسببه، ويتعرض لنار جهنم من أجله، وهو الورع عن كل ما تحرمه فتاوى الفقهاء.", "**الثانية:** ورع الصالحين، وهو الامتناع عما يتطرق إليه احتمال التحريم ولكن المفتي يرخص في التناول(١) بناء على الظاهر، وهو من الشبهة في الجملة الثالثة ما لا تحرمه الفتوى ولا شبهة في حله، ولكن يخاف منه أن يؤدي إلى محرم، وهو ترك ما لا بأس به مخافة ما به بأس.", "**الرابعة:** ما لا بأس به أصلا، ولا يخاف أن يؤدي إلى بأس، ولكنه يتناول لغير الله على(٢) غير نية التقوي به على طاعة الله، أو يتطرق إلى بعض أسبابه المسهلة له كراهة أو معصية، فالامتناع منه ورع الصديقين.", "فهذه درجات الحلال جملة إلى أن نفصلها بالأمثلة والشواهد.", "وأما الحرام الذي ذكرناه في الدرجة الأولى، وهو الذي يشترط التورع عنه في العدالة واطراح سمة الفسق، فهو أيضا على درجات في الخبث؛ فالمأخوذ بعقد فاسد حرام، ولكن ليس في درجة المغصوب على سبيل القهر، بل المغصوب أغلظ، إذ فيه ترك طريق الشرع في الاكتساب، وإيذاء الغير، وليس في العقود", "حاشية: (١) في (ظ): «التأول».", "حاشية: (٢) سقطت من الأصل."]], "ic": "book"}, {"story": ["الباب الأول في فضيلة طلب الحلال وذم الحرام ودرجات الحلال وال (٤ من ٥)، ص٣٨٩", ["الفاسدة إلا ترك طريق التعبد فقط، ثم ترك طريق التعبد في هذا أهون من تركه بالربا، وهذا التفاوت يدرك بتشديد الشرع ووعيده وتأكيده في بعض المناهي على ما سيأتي في كتاب التوبة عند ذكر الفرق بين الصغيرة والكبيرة، بل المأخوذ ظلما من فقير أو صالح أو يتيم أخبث وأغلظ من المأخوذ من قوي أو غني أو فاسق؛ لأن درجات الإيذاء تختلف باختلاف درجات المؤذى، فهذه دقائق في تفاصيل الخبائث لا ينبغي أن يذهل عنها، ولولا اختلاف درجات العصاة لما اختلفت دركات النار، وإذا عرفت مثارات التغليظ فلا حاجة إلى حصره في ثلاث درجات أو أربع، فإن ذلك جار مجرى التحكم والتشهي، وهو طلب حصر فيما لا حاصل له، ويدلك على اختلاف درجات الحرام في الخبث ما سيأتي في تعارض المحذورات وترجيح بعضها على بعض، مثل ما نقول فيما إذا اضطر إلى أكل ميتة، أو أكل طعام الغير، أو أكل صيد الحرم، فإنا نقدم بعض هذه على بعض.", "**أمثلة الدرجات الأربع في الورع وشواهدها:**", "**أما الدرجة الأولى:** وهي درجة العدول، فكل ما تقتضي الفتوى تحريمه، ولا يحتاج إلى أمثلة وشواهد.", "**وأما الدرجة الثانية:** فأمثلتها كل شبهة لا يجب اجتنابها، لكن يستحب، كما يأتي في كتاب الشبهات، ومن هذا قوله عليه الصلاة والسلام: «دع ما يريبك إلى ما لا يريبك».", "**وأما الدرجة الثالثة:** وهو ورع المتقين، كما روينا عن عمر بن الخطاب أنه قدم عليه مسك فقال: وددت لو أن امرأة جيدة الوزن تزن لي حتى أقسمه بين المسلمين. فقالت امرأته عاتكة: أنا جيدة الوزن فهلم أزن لك. قال: لا إني أخشى أن تأخذيه هكذا ـ وأدخل أصابعه في صدغيه ـ وتمسحين عنقك فأصيب فضلا عن المسلمين. وكان عمر يدفع في أوقات إلى امرأته طيبا من طيب المسلمين، فتبيعه، فجعلت تبيع عطارة فتكسر بأسنانها وتزن لها، فعلق بإصبعها منه شيء، فمسحت به خمارها، فجاء عمر فقال: ما هذه الريح؟ فأخبرته، فانتزع", "خمارها فصب عليه الماء فغسله وإنما فعل هذا زجرا لها لئلا تعود إلى مثل ذلك، وإلا ففعله لا يفيد المسلمين، ووزن بين يدي عمر بن عبد العزيز مسك للمسلمين، فأخذ بأنفه وقال: هل ينتفع إلا بريحه. ومات رجل من السلف فأطفأت امرأته السراج وقالت: صار لنا في هذا الزيت شريك.", "**وأما الدرجة الرابعة:** فمثاله ما روي عن يحيى النيسابوري أنه شرب دواء، فقالت امرأته: لو مشيت في الدار قليلا حتى يعمل الدواء. فقال: هذه مشية لا أعرفها، وأنا أحاسب نفسي منذ ثلاثين سنة. فهذا رجل لم تحضره نية في هذه المشية تتعلق بالدين فلم يقدم عليها. وعن سري السقطي أنه قال: انتهيت إلى عشب في مستنقع، فقلت: إن كنت أكلت حلالا فاليوم. فهتف بي هاتف: يا سري، النفقة التي أوصلتك إلى ههنا من أين؟ وعن ذي النون المصري أنه كان محبوسا، فبعثت له امرأة صالحة شيئا، فلم يأكل، وقال: جاءني على طبق حرام. يعني يد السجان."]], "ic": "book"}, {"story": ["الباب الأول في فضيلة طلب الحلال وذم الحرام ودرجات الحلال وال (٥ من ٥)، ص٣٩٠", ["ومن هذا التورع عن كسب حلال اكتسبه خياط يخيط في المسجد، وأطفأ بعضهم سراجا أسرجها غلامه من قوم يكره مالهم، وكره آخرون أن يستضيئوا بمشعل ظالم.", "فهذه دقائق الورع عند سالكي طريق الآخرة، والتحقيق فيه أن الورع له أول؛ وهو الامتناع مما تحرمه الفتوى، وهو ورع العدول، وله غاية هي ورع الصديقين، وهي الامتناع من كل ما ليس لله مما أخذ بشهوة أو توصل إليه بمكروه، وبينهما درجات في الاحتياط، فكلما كان الإنسان أشد تشديدا كان أسرع جوازا على الصراط وأخف ظهرا، وتتفاوت المنازل في الآخرة(١-١) بحيث تتفاوت هذه الدرجات في الورع كما تتفاوت دركات النار في حق الظلمة بحسب(١-١) تفاوت درجات الحرام في الخبث، فإن شئت فزد في الاحتياط، وإن شئت فترخص، فلنفسك تحتاط، وعليها ترخص.", "حاشية: (١-١) سقط من (ظ)."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "وأما الدرجة الثالثة: وهو ورع المتقين، كما روينا عن عمر بن الخطاب أنه قدم عليه مسك فقال: وددت لو أن امرأة جيدة الوزن تزن لي حتى ____ بين المسلمين. فقالت امرأته عاتكة: أنا جيدة الوزن فهلم أزن لك.", "o": ["أقسمه", "خدرها", "آخرون", "يصون"], "h": "راجع: ص٣٨٩"}, {"t": "fill", "d": 2, "q": "أصناف الحلال ومداخله: اعلم أن المال إنما يحرم لمعنى في عينه، أو لخلل في جهة اكتسابه، فأما الحرام لعينه، فكالخمر، وتفصيل هذا أن الأعيان المأكولة على وجه الأرض لا تعدوا ____ أقسام: إما أن تكون من", "o": ["ثلاثة", " ا يتطرق إليه تحريما أو كراهة، مثاله الماء الذي يأخذه الإنسان من المطر قبل أن يقع على ملك أحد، ويكون هو واقفا عند أخذه وجمعه من الهواء في ملك نفسه، أو في أرض مباحة.", "والحرام المحض ما فيه صفة محرمة، كالشدة في الخمر، والنجاسة في البول، أو حصل بسبب منهي عنه قطعا كالمحصل بالظلم والربا، فهذان طرفان ظاهران، ويلتحق ما تحقق أمره ولكن احتمل تغيره ولم يكن لذلك الاحتمال سبب يدل عليه، فإن صيد البر والبحر حلال، إلا أنه من صاد ظبية أو سمكة، فإنه يحتمل أن يكون قد ملكها صياد ثم أفلتت منه، وهذا الاحتمال لا يتطرق إلى ماء المطر المختطف من الهواء، فمساكنة ذلك الاحتمال في الصيد ورع الموسوسين؛ لأنه وهم مجرد لا دلالة عليه، فلو أنه دل عليه دليل مثل أن يجد في الظبية جرحا يحتمل أن يكون كيا لا يقدر عليه إلا بعد الضبط، ويحتمل أن يكون جراحة فهذا موضع الورع، وأما إذا انتفت الدلالة من كل وجه، فالاحتمال المعدوم دلالته كالاحتمال المعدوم في نفسه، ومن هذا الجنس من يستعير دارا فيغيب عنه المعير فيخرج منها، ويقول: لعله قد مات وصار الحق للوارث. فهذا وسواس إذ لم يدل على موته سبب قاطع", "أو مشكك، إذ الشبهة المحذورة ما تنشأ من الشك، والشك عبارة عن اعتقادين متقابلين نشآ عن سببين، فما لا سبب له لا يثبت عقده في النفس حتى يساوي العقد المقابل له فيصير شكا، ومن كان في يده طعام لموروثه الذي لا وارث له سواه فغاب عنه، فقال: يحتمل أنه قد مات وقد انتقل الملك إلي. فأكله، كان على إقدامه على هذا حراما محضا؛ لأنه احتمال لا مستند له، فلا ينبغي أن يعد هذا النمط من أقسام الشبهات، وإنما الشبهة ما تعارض فيه اعتقادان صدرا عن سببين مقتضيين للاعتقادين.", "ومثارات الشبهة كثيرة، والمهم منها اثنان:", "**المثار الأول:** الشك في السبب المحلل والمحرم، وذلك لا يخلو إما أن يكون متعادلا، أو يغلب أحد الاحتمالين، فإن تعادل الاحتمال كان الحكم لما عرف قبله فيستصحب ولا يترك بالشك، وإن غلب أحد الاحتمالين عليه فصدر عن دلالة معتبرة كان الحكم للغالب، ولا يتبين هذا إلا بمثال وشواهد، فلنقسمه إلى أقسام أربعة:"]], "ic": "book"}, {"story": ["الباب الثاني في مراتب الشبهات ومثاراتها وتمييزها عن الحلال و (٢ من ٥)، ص٣٩٢", ["**القسم الأول:** أن لا يكون الحل معلوما من قبل ثم يقع الشك في المحلل، فهذه شبهة يجب اجتنابها، ويحرم الإقدام عليها، مثاله أن يرمي صيدا فيجرحه ويقع في الماء، فيصادفه ميتا، ولا يدري هل مات بالغرق أو بالجرح؟ فهذا حرام؛ لأن الأصل التحريم، إلا إذا مات بطريق معين، وقد وقع الشك في الطريق المعين، فلا يترك اليقين بالشك، كما نقول في الأحداث، والأنجاس، وعدد الركعات وغير ذلك.", "**القسم الثاني:** أن يعرف الحل ويشك في المحرم، فالأصل الحل، وله الحكم كما لو طار طائر فقال رجل: إن كان هذا غرابا فامرأته طالق، وقال آخر: إن لم يكن غرابا فامرأته طالق، ثم التبس أمر الطائر، فإنا لا نقضي بالتحريم في واحدة منهما، إنما الورع اجتنابهما وتطليقهما.", "**القسم الثالث:** أن يكون الأصل التحريم، ولكن طرأ ما أوجب التحليل بظن غالب، فهو مشكوك فيه، والغالب حله، مثاله أن يرمي إلى صيد فيغيب عنه، ثم", "يدركه ميتا وليس عليه أثر سوى سهمه، فهذا يحتمل أن يكون مات بسهمه أو بسبب آخر، فإن ظهر عليه أثر صدمة أو جراحة أخرى التحق بالقسم الأول، وإن لم يظهر، فالظاهر الحل؛ لأن الاحتمال إذا لم يستند إلى دلالة التحق بالوسوسة، فإنه لو جرح رجل رجلا فغاب، فوجد ميتا وجب القصاص على جارحه، وإن كان يحتمل أنه ثار به خلط فمات لا من الجراحة، ولكن لا يلتفت إلى هذا الاحتمال.", "**القسم الرابع:** أن يكون الحل معلوما، ولكن يغلب على الظن (١-١)طريان محرم بسبب معتبر في غلبة الظن(١-١) شرعا، فيرفع الاستصحاب ويقضي بالتحريم؛ لأن الاستصحاب يضعف مع غلبة الظن، مثاله: أن يؤدي اجتهاده إلى نجاسة أحد الإنائين بالاعتماد على علامة معينة توجب غلبة الظن، فيوجب تحريم شربه، كما أوجب منع الوضوء به.", "**المثار الثاني:** للشبهة شك منشؤه الاختلاط، وذلك بأن يختلط الحلال والحرام ويشتبه الأمر فلا يتميز، والخلط لا يخلو إما أن يقع بعدد لا يحصر من الجانبين، أو من أحدهما أو بعدد محصور، فإن اختلط بمحصور، فلا يخلو إما أن يكون اختلاط امتزاج بخبيث لا يتميز بالإشارة، كاختلاط المائعات، أو يكون اختلاط استبهام مع تمييز الأعيان، كاختلاط الأعبد والدور والأفراس، والذي يختلط بالاستبهام، فلا يخلو إما أن يكون مما يقصد عينه، كالعروض، ولا يقصد كالنقود، فيخرج من هذا القسم سبعة أقسام:"]], "ic": "book"}, {"story": ["الباب الثاني في مراتب الشبهات ومثاراتها وتمييزها عن الحلال و (٣ من ٥)، ص٣٩٣", ["**الأول:** أن تشتبه العين بعدد محصور، كما لو اختلطت الميتة بذكية أو بعشر ذكيات، أو اختلطت الرضيعة بعشر نسوة، أو يتزوج أحد الأختين وتلتبس، فهذه شبهة يجب اجتنابها بالإجماع؛ لأنه لا مجال للاجتهاد والعلامات في هذا، فإذا اختلط بعدد محصور صارت الجملة كالشيء الواحد، وتقابل فيه يقين التحليل والتحريم، ولا فرق في هذا بين أن يثبت حل فينظر اختلاطه بمحرم، كما لو وقع الطلاق على إحدى زوجتيه في مسألة الطائر التي قد تقدمت، أو يختلط قبل", "حاشية: (١-١) سقط من الأصل.", "الاستحلال، كما لو اختلطت رضيعة بأجنبية، فأراد استحلال واحدة، وهذا قد يشكل في طريان التحريم، كطلاق إحدى الزوجتين لما سبق من الاستصحاب، وقد نبهنا على الجواب، وهو أن يقين التحريم قابل يقين الحل فضعف الاستصحاب، وجانب الحظر أغلب في نظر الشرع، فلذلك يرجح، وهذا إذا اختلط حلال محصور بحرام محصور، فإن اختلط حلال محصور بحرام غير محصور، فلا يخفى(١) أن الاجتناب أولى.", "**القسم الثاني:** حرام محصور بحرام غير محصور، كما لو اختلطت رضيعته أو عشر رضائع بنسوة بلد كبير، فلا يلزم بهذا اجتناب نكاح أهل البلد، بل له أن ينكح من شاء منهن، وهذا لا يجوز أن يعلل بكثرة الحلال؛ لأنه يلزم عليه أن يجوز النكاح إذا اختلطت واحدة حرام بتسع حلال، ولا قائل به، بل العلة الغلبة والحاجة جميعا، إذ كل من ضاع له رضيع أو قريب أو محرم بمصاهرة أو سبب من الأسباب لا يمكن أن يسد عليه باب النكاح، وكذلك من علم أن من مال الدنيا خالطه حرام قطعا، فإنه لا يلزمه ترك الشراء والأكل؛ لأن في ذلك حرجا، وما في الدين من حرج، وقد علم رسول الله ﷺ وأصحابه أن في الناس من يربي في الدراهم، وما تركوا الدراهم بالكلية، وإن مجنا(٢) سرق في زمانه وما تركوا شراء مجن، فاجتناب هذا من ورع الوسوسة(٣).", "**القسم الثالث:** أن يختلط حرام لا يحصر بحلال لا يحصر، كحكم الأموال في زماننا هذا، فلا يحرم بهذا الاختلاط تناول شيء بعينه، إلا أن يقترن بتلك العين علامة تدل على أنه من الحرام، فإن لم يكن في العين علامة، فتركه ورع، ومن العلامات أن يأخذه من يد سلطان ظالم؛ ويدل على ما قلنا الأثر والقياس؛ أما الأثر فقد علم في زمان رسول الله ﷺ والخلفاء بعده أن أثمان الخمور ودراهم الربا وغلول الغنيمة اختلطت بالأموال، وقد أدركت الصحابة نهب المدينة وتصرف", "حاشية: (١) سقطت من الأصل.", "حاشية: (٢) المجن: الترس.", "حاشية: (٣) في (ظ): «الموسوسين».", "الظلمة، ولم يمتنعوا من الشراء من السوق، وأما القياس؛ فإنه لو فتح هذا الباب لانسد باب جميع(١) التصرفات؛ لأن الفسق يغلب على الناس، وإنما الترك لما يمكن ورع.", "فإن قيل: كان الحرام في الزمن الأول قليلا فما تقول الآن والحرام أكثر؟."]], "ic": "book"}, {"story": ["الباب الثاني في مراتب الشبهات ومثاراتها وتمييزها عن الحلال و (٤ من ٥)، ص٣٩٥", ["فالجواب: إن أردت بقولك: الحرام أكثر. كثرة الظلمة والربا والمعاملات الفاسدة، فليس ذلك بالأكثر؛ لأن الظلمة إذا أضيفوا إلى الناس كانوا قليلا، والمعاملات الفاسدة إذا أضيفت إلى الصحيحة كانت قليلة، وهذا كما يقال: قد شاع شرب الخمر. ومعلوم أن من لا يشربها أكثر.", "فإن قيل: فأين الدينار الذي لم يتقلب في الحرام إلى أن وصل إلى يد المتقي؟ وأين الشاة التي سلمت أصولها من غصب؟", "قلنا: لا نظر إلى هذا؛ لأن الأصل في الأموال قبولها للتصرفات وجواز التراضي عليها، ومن أين يقدر على تعيين دينار يقطع بتقلبه في الحرام أو شاة، ثم إن الغالب أن من غصب شاة أكلها ولم يستولدها، ومن غصب بذرا تناوله ولم يزرعه، ثم يقدر أن الغالب الحرام؟! فالأصل في الأموال الحل وإذا تعارض أصل وغالب ولا أمارة على الغالب حكم بالأصل، كما قلنا في طين الشوارع وجر النصرانية، ثم يقدر أن لهذا المال مالكا، ولكن لا سبيل إلى معرفة مالكه، فصار مرصدا لمصالح المسلمين، وجاز التصرف فيه كسائر الأموال الضائعة(٢-٢)وجواز التراضي عليها(٢-٢)، ونحن نقول: تجوز الصلاة في الشوارع إذا لم تر نجاسة، وإن طين الشوارع طاهر، والوضوء من أواني المشركين جائز، فقد توضأ عمر من جر نصرانية مع أن مشربهم الخمر ومطعمهم الخنزير ولا يحترزون من نجاسة، وكانت الصحابة تلبس الفراء المدبوغة والثياب المصبوغة، ومن تأمل أحوال الدباغين والصباغين علم غلبة النجاسة عليهم، وكانوا يمشون حفاة ويصلون على", "حاشية: (١) سقطت من (ظ).", "حاشية: (٢-٢) سقط من (ظ).", "الأرض(١)، فدل على أنهم لم يحترزوا إلا من نجاسة مشاهدة أو أن يكون عليها علامة، فأما الظن الذي يستثار من رد الوهم إلى مجاري الأحوال، فلم يعتبروه.", "فإن قيل: فقد كانوا يتوسعون في أمور الطهارة ويحترزون في شبهات الحرام، فقد بان الفرق."]], "ic": "book"}, {"story": ["الباب الثاني في مراتب الشبهات ومثاراتها وتمييزها عن الحلال و (٥ من ٥)، ص٣٩٦", ["قلنا: إن أردت أنهم كانوا يصلون مع النجاسة فباطل، وإن أردت أنهم احترزوا من كل نجاسة وجب اجتنابها فصحيح، فأما تورعهم عن الشبه فكان بطريق الكف للنفس عما ليس به بأس مخافة ما به بأس، والنفس تميل إلى الأموال كيف كانت بخلاف الأنجاس، وقد كانوا يمتنعون مما يشغل قلوبهم من الحلال، ثم لو أن الحرام ملأ الدنيا كلها وعلم يقينا أنه ما بقي فيها حلال أصلا، لكنا نأمر باستئناف تمهيد شروط الشرع، واستئناف قواعده، فإن الرسول ﷺ لما بعث كانت العرب تكتسب من الغارة، وأهل الكتاب يتعاملون بغير شرعهم، فلم يتعرض لما سلف، بل خصص أرباب الأيدي بالأموال، ومهد الشرع، ومعلوم أن ما ثبت تحريمه في شرع لا ينقلب حلالا، فهذا حكم الفتوى أنه لو عم الحرام وهو استئناف قواعد الشرع من غير أن يأمر بالتقلل، والذي يليق بالورع الاقتصار على قدر الحاجة مع الاكتساب بطرق الشرع من أصحاب الأيدي، ولا نريد بالاقتصار الاقتناع بالحشيش والصيد، فإن ذلك يؤدي إلى تلف الأبدان، بل نريد الاقتصار على مصالحها.", "وقد يقع اشتباه في الأدلة، ويقع الاشتباه بتعارض شهادة فاسقين، وقد يوصي بمال للفقهاء فالكامل في الفقه يدخل فيه، والمبتدئ لا يدخل وبينهما درجات يقع الاشتباه فيها، وكذلك إذا أوصى للصوفية، والورع في الجملة اجتناب ما يشكل، والإثم حزاز القلوب، إلا أن الاعتبار بقلب العالم الموقن(٢)، لا بقلب الجاهل الموسوس.", "حاشية: (١) سقطت من (ظ).", "حاشية: (٢) في الأصل: «الموفق»."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "قلنا: إن أردت أنهم كانوا يصلون مع النجاسة فباطل، وإن أردت أنهم احترزوا من كل نجاسة وجب اجتنابها فصحيح، ____ تورعهم عن الشبه فكان بطريق الكف للنفس عما ليس به بأس مخافة ما به بأس، والنفس تميل إلى", "o": ["فأما", "ويشرب", "يذهبان", "يونس"], "h": "راجع: ص٣٩٦"}, {"t": "fill", "d": 2, "q": "الأرض، فدل على أنهم لم يحترزوا إلا من نجاسة مشاهدة أو أن يكون عليها علامة، فأما الظن الذي يستثار من رد ____ إلى مجاري الأحوال، فلم يعتبروه", "o": ["الوهم", "وحده", "والقليل", "لصديقهم"], "h": "راجع: ص٣٩٦"}, {"t": "fill", "d": 2, "q": "القسم الثالث: أن يختلط حرام لا يحصر بحلال لا يحصر، كحكم الأموال في زماننا هذا، فلا يحرم بهذا الاختلاط تناول شيء بعينه، إلا أن ____ بتلك العين علامة تدل على أنه من الحرام، فإن لم يكن في العين", "o": ["يقترن", "كمالك", "كعادة", "الكتف"], "h": "راجع: ص٣٩٤"}, {"t": "fill", "d": 2, "q": "وقد يقع اشتباه في الأدلة، ويقع الاشتباه بتعارض شهادة فاسقين، وقد يوصي مشكوك؛ لأن الشك عبارة عن اعتقادين متقابلين لهما سببان متقابلان، فيدل هذا على الشيء وكونه مسلما دلالتان كافيتان في الهجوم على معاملته، فليس لك أن تقول: الفساد والظلم غالب على الناس؛ لأن هذه وسوسة وسوء ظن بهذا المسلم، وهو يستحق بإسلامه أن لا تسيء الظن به فإن أسأت الظن به لأنك رأيت فسادا من غيره، فقد جنيت عليه، فإن سألته تأذى بسؤالك، فإن سألت عنه هتكت ستره، فالإثم في إيذاء مسلم أكثر من الإثم بأكل شبهة، وقد كانت الصحابة تغزوا وتنزل القرى ولا يتحرزون من الأسواق مع كون الحرام فاشيا في زمانهم وما نقل عنهم سؤال إلا عن ريبة، ومن زاد عليهم في الورع فهو مبتدع، إذ لا يبلغ أحد مد أحدهم ولا نصيفه، ولو أنفق ما في الأرض جميعا، وقد أكل رسول الله ﷺ من لحم تصدق به على بريرة، وقال: «هو لها صدقة ولنا هدية» وكان المتصدق عليها مجهولا عنده.", "**الحالة الثانية:** أن يكون مشكوكا فيه بسبب دلالة أورثت ريبة، مثل أن يكون على خلقة الأتراك وأهل البوادي المعروفين بالظلم وقطع الطريق، وأن يكون طويل الشارب، وأن يكون شعره قزعا، كعادة أهل الفساد، أو أن يكون عليه قباء وقلنسوة ونحو ذلك من زي أهل الظلم، أو أن يشاهد منه الإقدام على ما لا يحل، فهذا يجوز معاملته؛ لأن اليد تدل على الملك، وهذه الدلالات ضعاف إلا أن الترك من الورع.", "**الحالة الثالثة:** أن تكون الحال معلومة بنوع خبرة وممارسة بحيث يوجب ذلك ظنا في حل المال وتحريمه، مثل أن يعرف صلاح الرجل وديانته وعدالته في الظاهر، ثم يجوز أن يكون الباطن بخلافه، فههنا لا يجب السؤال ولا يجوز كما قلنا في المجهول بل هذا أولى، فأما إذا علم بالخبرة أنه مغن أو مرب وجب السؤال."]], "ic": "book"}, {"story": ["الباب الثالث في البحث والسؤال والهجوم والإهمال ومظانهما (٢ من ٢)، ص٣٩٨", ["**المثار الثاني:** ما يستند الشك فيه إلى سبب في المال لا في حال المالك، وذلك بأن يختلط الحرام بالحلال، كما إذا طرح في سوق أحمال من طعام مغصوب، فاشتراها أهل السوق، فإنه لا يجب على من يشتري في تلك البلدة والسوق أن يسأل عما يشتريه إلا أن يظهر أن أكثر ما في أيديهم حرام، فعند ذلك يجب السؤال، فإن لم يكن الأكثر كان التفتيش ورعا غير واجب؛ لأن حكم السوق الكبير حكم بلد، ويدل على هذا أن الصحابة رضي الله عنهم لم يمتنعوا من الشراء في الأسواق وقد علموا أن فيها دراهم الربا والغلول، وكانوا يأخذون الغنائم من ال
