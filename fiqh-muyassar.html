ولى)"}, {"t": "mcq", "d": 2, "q": "ما أقل عدد الشهود في الزنى؟", "o": ["أربعة رجال", "رجلان", "رجل وامرأتان", "ثلاثة رجال"], "h": "راجع: ص422 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "من تقبل شهادته دون غيره؟", "o": ["العدل المسلم البالغ العاقل", "الصبي الصغير", "المجنون", "السكران"], "h": "راجع: ص419 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "لا تقبل شهادة الزور وهي من الكبائر.", "a": true, "h": "راجع: ص421 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "لا تقبل شهادة الأب لابنه.", "a": true, "h": "راجع: ص421 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "يجوز للشاهد أخذ الأجرة على أداء الشهادة.", "a": false, "h": "راجع: ص422 (المسألة الثالثة)"}]}], "sum": [["في تعريفها، وحكمها، وأدلتها", "ص418-423"], ["شروط الشاهد الذي تقبل شهادته", "ص418-423"], ["الأحكام المتعلقة بالشهادة", "ص418-423"]]}], "bigmap": {"center": "الفقه\nالميسر", "nodes": [{"t": "الكتاب الأول: الطهارة", "s": ["التمهيد", "في أحكام الطهارة والمي", "في الآنية", "في قضاء الحاجة وآدابها"], "g": [0], "lv": "11 أبواب"}, {"t": "الكتاب الثاني: الصلاة", "s": ["في تعريف الصلاة وفضلها", "الأذان والإقامة", "في مواقيت الصلاة", "في شروط الصلاة، وأركان"], "g": [1], "lv": "15 أبواب"}, {"t": "الكتاب الثالث: الزكاة", "s": ["في مقدمات الزكاة", "في زكاة الذهب والفضة", "في زكاة الخارج من الأر", "في زكاة بهيمة الأنعام"], "g": [2], "lv": "6 أبواب"}, {"t": "الكتاب الرابع: الصيام", "s": ["في مقدمات الصيام", "في الأعذار المبيحة للف", "مستحبات الصيام ومكروها", "في القضاء، والصيام الم"], "g": [3], "lv": "5 أبواب"}, {"t": "الكتاب الخامس: الحج", "s": ["في مقدمات الحج", "في أركان الحج وواجباته", "في المحظورات والفدية و", "في صفة الحج والعمرة"], "g": [4], "lv": "7 أبواب"}, {"t": "الكتاب السادس: الجهاد", "s": ["تعريف الجهاد وفضله وحك", "في الأسرى والغنائم", "في الهدنة والذمة والأم"], "g": [5], "lv": "3 أبواب"}, {"t": "الكتاب السابع: المعاملات", "s": ["في البيوع", "في الربا", "في القرض", "في الرهن"], "g": [6], "lv": "23 أبواب"}, {"t": "الكتاب الثامن: المواريث والوصايا والعتق", "s": ["تصرفات المريض", "الوصية", "في العتق، والك   const bxSum = () => Object.keys(S.bx || {}).reduce((a, k) => a + (S.bx[k] || 0), 0);
  /* كل المحطات والامتحان النهائي مفتوحة من البداية؛ يدخل الطالب أي محطة بأي ترتيب.
     المحطة المميَّزة في المسار: آخر محطة بدأها ولم يُنهِها، وإلا فأول محطة لم تُجتز، ثم الامتحان. */
  function focusId() {
    const r = S.resume && LEVELS.find(l => l.id === S.resume.id);
    if (r && !S.done[r.id]) return r.id;
    for (let bi = 0; bi < BABS.length; bi++) {
      const n = babLv(BABS[bi]).find(l => !S.done[l.id]);
      if (n) return n.id;
      if (!bxDone(bi)) return 'x' + bi;
    }
    return '';
  }
  const lvMax = lv => lv.paras.reduce((a, p) => a + p.q.reduce((x, q) => x + q.base * 2, 0), 0);
  const lvStars = lv => lv.paras.reduce((a, p) => a + p.q.reduce((x, q) => x + (S.q[q.id] || 0), 0), 0);
  const totalStars = () => Object.keys(S.q).reduce((a, k) => a + (S.q[k] || 0), 0) + Object.keys(S.bx || {}).reduce((a, k) => a + (S.bx[k] || 0), 0);

  /* ================= FIGURES (SVG) ================= */
  const FCOL = ['#3B82F6', '#0F766E', '#22C55E', '#14B8A6', '#0F766E', '#14B8A6'];
  const FSOFT = ['#DBEAFE', '#CCFBF1', '#DCFCE7', '#F0FDFA', '#F0FDFA', '#CCFBF1'];
  const f1 = v => (+v).toFixed(1);
  const neg = v => String(v).replace('-', '−');
  const isAr = s => /[؀-ۿ]/.test(String(s));
  const stext = (x, y, s, cls, extra) => '<text x="' + f1(x) + '" y="' + f1(y) + '" text-anchor="middle"' + (cls ? ' class="' + cls + '"' : '') + (extra || '') + '>' + esc(neg(s)) + '</text>';
  const svgOpen = (w, h, label) => '<svg class="fg" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + esc(label || 'شكل توضيحي') + '">';

  /* التمثيل البياني */
  function figGraph(f) {
    const W = 300, H = 240, L = 44, R = 22, T = 20, B = 46, pw = W - L - R, ph = H - T - B;
    const X = v => L + v / f.xmax * pw, Y = v => T + ph - v / f.ymax * ph;
    let g = svgOpen(W, H, 'تمثيل بياني');
    for (let v = 0; v <= f.xmax + 1e-9; v += f.xs) g += '<line class="gr" x1="' + f1(X(v)) + '" y1="' + T + '" x2="' + f1(X(v)) + '" y2="' + (T + ph) + '"/>' + (v ? stext(X(v), T + ph + 15, v, 'tk') : '');
    for (let v = 0; v <= f.ymax + 1e-9; v += f.ys) g += '<line class="gr" x1="' + L + '" y1="' + f1(Y(v)) + '" x2="' + (L + pw) + '" y2="' + f1(Y(v)) + '"/>' + '<text class="tk" text-anchor="end" x="' + (L - 7) + '" y="' + f1(Y(v) + 4) + '">' + v + '</text>';
    g += '<path class="ax" d="M' + L + ' ' + (T - 10) + 'V' + (T + ph) + 'H' + (L + pw + 12) + '"/><path class="ax" d="M' + (L - 4) + ' ' + (T - 5) + 'l4 -6 4 6M' + (L + pw + 7) + ' ' + (T + ph - 4) + 'l6 4 -6 4"/>';
    g += '<text class="it" x="' + (L + pw + 14) + '" y="' + (T + ph + 16) + '" text-anchor="middle" style="font-size:15px">x</text><text class="it" x="' + (L - 12) + '" y="' + (T - 8) + '" text-anchor="middle" style="font-size:15px">y</text>';
    if (f.seg) g += '<line class="ln" x1="' + f1(X(f.seg[0][0])) + '" y1="' + f1(Y(f.seg[0][1])) + '" x2="' + f1(X(f.seg[1][0])) + '" y2="' + f1(Y(f.seg[1][1])) + '"/>';
    if (f.poly) g += '<polyline class="ln" points="' + f.pts.map(p => f1(X(p[0])) + ',' + f1(Y(p[1]))).join(' ') + '"/>';
    (f.pts || []).forEach(p => { g += '<circle class="pt" cx="' + f1(X(p[0])) + '" cy="' + f1(Y(p[1])) + '" r="5"/>'; });
    if (f.xl) g += stext(L + pw / 2, H - 6, f.xl, 'arx');
    if (f.yl) g += '<text class="arx" text-anchor="middle" transform="translate(11 ' + f1(T + ph / 2) + ') rotate(-90)">' + esc(f.yl) + '</text>';
    return g + '</svg>';
  }

  /* شكل ڤن */
  function vItems(items, cx0, cy0, cols, dx, dy) {
    const n = (items || []).length; if (!n) return '';
    cols = Math.min(cols || (n > 3 ? 2 : 1), n); const rows = Math.ceil(n / cols);
    return items.map((it, i) => {
      const r = Math.floor(i / cols), c = i % cols, inRow = r === rows - 1 ? n - r * cols : cols;
      const x = cx0 + (c - (inRow - 1) / 2) * dx, y = cy0 + (r - (rows - 1) / 2) * dy, s = String(it);
      if (isAr(s)) return stext(x, y + 4, s, 'vel sm');
      return '<circle class="vdot" cx="' + f1(x - 5 - s.length * 4.2) + '" cy="' + f1(y) + '" r="2.4"/>' + stext(x + 3, y + 5, s, 'vel');
    }).join('');
  }
  function figVenn(f) {
    const nm = f.names || ['A', 'B', 'C'], c = FCOL;
    const set = (shape, i) => shape.replace('/>', ' class="vset" fill="' + c[i] + '" stroke="' + c[i] + '"/>');
    const name = (x, y, i) => '<text class="vname" x="' + x + '" y="' + y + '" text-anchor="middle" fill="' + c[i] + '">' + esc(nm[i]) + '</text>';
    let g = '';
    if (f.form === '1') {
      g = svgOpen(320, 170, 'شكل ڤن') + set('<ellipse cx="160" cy="92" rx="118" ry="64"/>', 0) + name(40, 26, 0) + vItems(f.A, 160, 92, Math.min(4, (f.A || []).length), 46, 34);
    } else if (f.form === 'dis') {
      g = svgOpen(320, 190, 'شكل ڤن') + set('<circle cx="84" cy="106" r="68"/>', 0) + set('<circle cx="236" cy="106" r="68"/>', 1) + name(84, 26, 0) + name(236, 26, 1) + vItems(f.A, 84, 106, 2, 46, 34) + vItems(f.B, 236, 106, 2, 46, 34);
    } else if (f.form === 'sub') {
      g = svgOpen(320, 200, 'شكل ڤن') + set('<ellipse cx="160" cy="108" rx="140" ry="82"/>', 0) + set('<circle cx="210" cy="112" r="56"/>', 1) + name(34, 30, 0) + name(210, 50, 1) + vItems(f.A, 86, 108, 2, 44, 34) + vItems(f.B, 210, 118, 2, 42, 32);
    } else if (f.form === '3') {
      const id = 'vc' + (++EID);
      g = svgOpen(320, 250, 'شكل ڤن') + set('<circle cx="118" cy="98" r="72"/>', 0) + set('<circle cx="202" cy="98" r="72"/>', 1) + set('<circle cx="160" cy="166" r="72"/>', 2) +
        name(52, 26, 0) + name(268, 26, 1) + name(252, 232, 2) +
        vItems(f.A, 84, 78, 1, 30, 26) + vItems(f.B, 236, 78, 1, 30, 26) + vItems(f.C, 160, 208, 3, 34, 26) +
        vItems(f.AB, 160, 66, 1, 30, 24) + vItems(f.AC, 110, 146, 1, 30, 24) + vItems(f.BC, 210, 146, 1, 30, 24) + vItems(f.ABC, 160, 122, 1, 30, 24);
      void id;
    } else {
      const id = 'vc' + (++EID);
      g = svgOpen(320, 190, 'شكل ڤن') + '<defs><clipPath id="' + id + '"><circle cx="118" cy="106" r="74"/></clipPath></defs>';
      if (f.shade === 'u') g += '<circle cx="118" cy="106" r="74" fill="#99F6E4"/><circle cx="202" cy="106" r="74" fill="#99F6E4"/>';
      if (f.shade === 'i') g += '<circle cx="202" cy="106" r="74" fill="#5EEAD4" clip-path="url(#' + id + ')"/>';
      g += set('<circle cx="118" cy="106" r="74"/>', 0) + set('<circle cx="202" cy="106" r="74"/>', 1) + name(70, 26, 0) + name(250, 26, 1) +
        vItems(f.A, 78, 106, 1, 40, 30) + vItems(f.AB, 160, 106, 1, 40, 30) + vItems(f.B, 242, 106, 1, 40, 30);
    }
    return g + '</svg>';
  }

  /* خط الأعداد */
  function figNline(f) {
    const n = f.max - f.min, W = 320, L = 20, R = 20, st = (W - L - R) / n, hops = f.hops || [];
    const rows = f.flat ? Math.min(1, hops.length) : hops.length;
    const top = rows ? 20 + 24 * rows : 14, y0 = top + 8, H = y0 + 34;
    const X = v => L + (v - f.min) * st;
    let g = svgOpen(W, H, 'خط الأعداد');
    g += '<path class="nl" d="M6 ' + y0 + 'H' + (W - 6) + 'M12 ' + (y0 - 5) + 'l-7 5 7 5M' + (W - 12) + ' ' + (y0 - 5) + 'l7 5 -7 5"/>';
    for (let v = f.min; v <= f.max; v++) {
      const on = (f.mark || []).indexOf(v) >= 0;
      g += '<line class="nl" x1="' + f1(X(v)) + '" y1="' + (y0 - 6) + '" x2="' + f1(X(v)) + '" y2="' + (y0 + 6) + '"/>';
      if (on) g += '<circle cx="' + f1(X(v)) + '" cy="' + (y0 + 20) + '" r="11" fill="#FEF08A" stroke="#EAB308" stroke-width="2"/>';
      g += stext(X(v), y0 + 24.5, v, 'tk', n > 12 ? ' style="font-size:10px"' : (on ? ' style="fill:#713F12;font-weight:800"' : ''));
    }
    hops.forEach((h, i) => {
      const y = y0 - 16 - (f.flat ? 0 : (hops.length - 1 - i) * 24), col = FCOL[[1, 0, 2, 3][i % 4]], a = X(h[0]), b = X(h[1]), d = b > a ? -1 : 1;
      g += '<line class="guide" stroke="' + col + '" x1="' + f1(a) + '" y1="' + y + '" x2="' + f1(a) + '" y2="' + (y0 - 7) + '"/><line class="guide" stroke="' + col + '" x1="' + f1(b) + '" y1="' + y + '" x2="' + f1(b) + '" y2="' + (y0 - 7) + '"/>';
      g += '<path class="hop" stroke="' + col + '" d="M' + f1(a) + ' ' + y + 'H' + f1(b) + 'm' + (7 * d) + ' -5l' + (-7 * d) + ' 5 ' + (7 * d) + ' 5"/>';
      if (h[2]) g += stext((a + b) / 2, y - 6, h[2], '', ' fill="' + col + '" style="font-size:12.5px"');
    });
    return g + '</svg>';
  }

  /* نموذج الأجزاء المتساوية (للتقسيم التناسبي) */
  function figTape(f) {
    const tot = f.parts.reduce((a, p) => a + p[0], 0), W = 320, bw = Math.min(54, 296 / tot), x0 = (W - bw * tot) / 2;
    let g = svgOpen(W, 96, 'نموذج الأجزاء'), x = x0;
    f.parts.forEach((p, i) => {
      const xs = x;
      for (let k = 0; k < p[0]; k++) { g += '<rect x="' + f1(x + 1.5) + '" y="10" width="' + f1(bw - 3) + '" height="40" rx="9" fill="' + FSOFT[i % 6] + '" stroke="' + FCOL[i % 6] + '" stroke-width="2.5"/>' + (f.each ? stext(x + bw / 2, 35, f.each, '', ' style="font-size:' + (String(f.each).length > 5 ? 9.5 : 12.5) + 'px"') : ''); x += bw; }
      g += '<path d="M' + f1(xs + 4) + ' 58v5H' + f1(x - 4) + 'v-5" fill="none" stroke="' + FCOL[i % 6] + '" stroke-width="2" stroke-linecap="round"/>' + stext((xs + x) / 2, 82, p[1], 'arx', ' fill="' + FCOL[i % 6] + '"');
    });
    return g + '</svg>';
  }

  /* المقياس الخطي للخريطة */
  function figSbar(f) {
    const n = f.vals.length - 1, W = 320, L = 34, st = 232 / n;
    let g = svgOpen(W, 62, 'مقياس رسم خطي');
    for (let i = 0; i < n; i++) g += '<rect x="' + f1(L + i * st) + '" y="34" width="' + f1(st) + '" height="9" fill="' + (i % 2 ? '#fff' : '#1E1B3A') + '" stroke="#1E1B3A" stroke-width="1.6"/>';
    f.vals.forEach((v, i) => { g += stext(L + i * st, 26, v, 'tk', ' style="font-size:12.5px"'); });
    g += stext(L + n * st + 26, 26, f.unit, 'arx');
    return g + stext(L + st / 2, 58, '1 سم', 'arx', ' style="font-size:11px"') + '</svg>';
  }

  /* بطاقات العد +1 و −1 */
  function figChips(f) {
    const cols = Math.max(f.pos, f.neg), W = 320, cw = Math.min(40, 300 / cols), x0 = (W - cw * cols) / 2, pairs = Math.min(f.pos, f.neg);
    let g = svgOpen(W, 112, 'بطاقات العد');
    const card = (x, y, t, a, b, c) => '<rect x="' + f1(x + 3) + '" y="' + y + '" width="' + f1(cw - 6) + '" height="28" rx="8" fill="' + a + '" stroke="' + b + '" stroke-width="2"/>' + stext(x + cw / 2, y + 19, t, '', ' fill="' + c + '" style="font-size:13px"');
    for (let i = 0; i < cols; i++) {
      const x = x0 + i * cw;
      if (i < pairs) g += '<rect x="' + f1(x + .5) + '" y="5" width="' + f1(cw - 1) + '" height="80" rx="12" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="4 4"/>' + stext(x + cw / 2, 104, '0', 'tk');
      if (i < f.pos) g += card(x, 12, '+1', '#FEF08A', '#EAB308', '#713F12');
      if (i < f.neg) g += card(x, 50, '−1', '#99F6E4', '#14B8A6', '#881337');
    }
    return g + '</svg>';
  }

  /* مستطيل بأبعاده (نموذج/مخطط) */
  function figRect(f) {
    const k = f.ratio || 1.3, h = 92, w = Math.min(230, h * k), x = (320 - w) / 2 + 12, y = 16;
    return svgOpen(320, 150, 'مخطط') + '<rect x="' + f1(x) + '" y="' + y + '" width="' + f1(w) + '" height="' + h + '" rx="6" fill="' + FSOFT[0] + '" stroke="' + FCOL[0] + '" stroke-width="3"/>' +
      (f.label ? stext(x + w / 2, y + h / 2 + 5, f.label, 'arx', ' style="font-size:14px"') : '') +
      '<path d="M' + f1(x) + ' ' + (y + h + 12) + 'H' + f1(x + w) + 'm-6 -4l6 4 -6 4M' + f1(x + 6) + ' ' + (y + h + 8) + 'l-6 4 6 4" fill="none" stroke="#8A86A3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>' + stext(x + w / 2, y + h + 31, f.w, 'arx', ' style="font-size:13.5px;fill:#1E1B3A"') +
      '<path d="M' + f1(x - 12) + ' ' + y + 'V' + (y + h) + 'm-4 -6l4 6 4 -6M' + f1(x - 16) + ' ' + (y + 6) + 'l4 -6 4 6" fill="none" stroke="#8A86A3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<text class="arx" text-anchor="middle" transform="translate(' + f1(x - 24) + ' ' + (y + h / 2) + ') rotate(-90)" style="font-size:13.5px;fill:#1E1B3A">' + esc(f.h) + '</text></svg>';
  }

  /* الضرب التبادلي: طرفان × وسطان */
  function figCross(f) {
    const t = (x, y, s, col) => '<text class="big' + (/^[a-z]$/.test(s) ? ' it' : '') + '" x="' + x + '" y="' + y + '" text-anchor="middle" fill="' + col + '">' + esc(s) + '</text>';
    return svgOpen(320, 132, 'الضرب التبادلي') +
      '<ellipse cx="160" cy="64" rx="86" ry="21" transform="rotate(27 160 64)" fill="#CCFBF1" stroke="#0F766E" stroke-width="2.5" opacity=".9"/>' +
      '<ellipse cx="160" cy="64" rx="86" ry="21" transform="rotate(-27 160 64)" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2.5" opacity=".75"/>' +
      t(98, 40, f.a, '#115E59') + t(98, 102, f.b, '#1D4ED8') + t(222, 40, f.c, '#1D4ED8') + t(222, 102, f.d, '#115E59') +
      '<path d="M74 64H122M198 64H246" stroke="#1E1B3A" stroke-width="2.6" stroke-linecap="round"/>' + t(160, 72, '=', '#1E1B3A') + '</svg>';
  }

  function figTbl(f) {
    return '<div class="ftbl"><table>' + (f.h ? '<tr>' + f.h.map(x => '<th scope="col">' + md(x) + '</th>').join('') + '</tr>' : '') +
      f.r.map(r => '<tr>' + r.map((x, j) => (f.rh && j === 0 ? '<th scope="row">' : '<td>') + md(x) + (f.rh && j === 0 ? '</th>' : '</td>')).join('') + '</tr>').join('') + '</table></div>';
  }
  function fig(f) {
    switch (f.k) {
      case 'graph': return figGraph(f);
      case 'venn': return figVenn(f);
      case 'nline': return figNline(f);
      case 'tape': return figTape(f);
      case 'sbar': return figSbar(f);
      case 'chips': return figChips(f);
      case 'rect': return figRect(f);
      case 'cross': return figCross(f);
      case 'tbl': return figTbl(f);
    }
    return '';
  }

  const NONE_T = ['#E2E8F0', '#94A3B8', '#64748B'];

    if (b.cmp) { const c = b.cmp; return '<div class="blk b-cmp"><div class="tw"><table><thead><tr>' + c.h.map(x => '<th scope="col">' + md(x) + '</th>').join('') + '</tr></thead><tbody>' + c.r.map((r, k) => '<tr style="--i:' + k + '">' + r.map((x, j) => j === 0 ? '<th scope="row">' + md(x) + '</th>' : '<td>' + md(x) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div></div>'; }
    if (b.cards) { const two = b.cards.length % 2 === 0 && b.cards.every(c => plain(c.t + (c.r || '')).length < 64); return '<div class="blk b-cards' + (two ? ' two' : '') + '">' + b.cards.map((c, k) => '<div class="card" style="--i:' + k + '"><h4>' + md(c.h) + (c.tag ? '<span class="tag">' + esc(c.tag) + '</span>' : '') + '</h4><p>' + md(c.t) + '</p>' + (c.r ? '<p class="r">' + md(c.r) + '</p>' : '') + '</div>').join('') + '</div>'; }
    if (b.tree) { const ctr = { n: 0 }; return '<div class="blk b-tree"><ul>' + tree(b.tree, 0, ctr) + '</ul></div>'; }
    return '';
  }
  function tree(n, depth, ctr) {
    const i = ctr.n++;
    return '<li><span class="tn' + (depth === 0 ? ' root' : '') + '" style="--i:' + i + '">' + md(n.t) + '</span>' + (n.k ? '<ul>' + n.k.map(c => tree(c, depth + 1, ctr)).join('') + '</ul>' : '') + '</li>';
  }

  /* بطاقة الوسام: ثابتة أعلى الواجهة */
  function rankCard() {
    const st = totalStars(), r = rankOf(st), cur = r ? BADGES[r - 1] : null, nx = BADGES[r], lo = cur ? cur.at : 0;
    const pct = nx ? Math.max(4, Math.min(100, (st - lo) / (nx.at - lo) * 100)) : 100;
    return '<div class="rank' + (cur ? '' : ' none') + '" style="' + rankVars(r) + '"><button class="rk-em" data-act="badges" aria-label="أوسمتي"><span class="halo"></span>' + emblem(cur ? r - 1 : 0, cur ? '' : 'off') + '</button>' +
      '<div class="rk-t"><span class="rk-hi"><span class="rk-hello">' + hi() + '</span><span class="rk-lv">' + r + ' / ' + BADGES.length + '</span></span><strong class="rk-name">' + (cur ? esc(cur.n) : 'في انتظار أول وسام') + '</strong>' +
      '<div class="rk-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.round(pct) + '"><i style="width:' + pct.toFixed(1) + '%"></i></div>' +
      '<span class="rk-sub">' + (nx ? 'باقٍ ' + starWord(nx.at - st) + ' على «' + esc(nx.n) + '»' : 'بلغت القمة! أحسنت') + '</span></div></div>';
  }

  /* عُقد الطريق المتعرج بأسلوبه الأصلي نفسه؛ تُستخدم لقائمة المسارات ولمحطات كل مسار */
  function roadRows(nodes) {
    const W = appEl.clientWidth || 360;
    const amp = Math.max(28, Math.min(80, (W - 32) / 2 - 92));
    return nodes.map((nd, i) => {
      const x = Math.round(Math.sin(i * 0.95) * amp), id = nd.id, state = nd.state;
      return '<div class="pnode ' + state + (nd.extra || '') + '" data-x="' + x + '" data-col="' + th(id)[0] + '" style="' + tv(id) + ';--x:' + x + 'px;--i:' + i + '">' +
        (nd.bubble ? '<span class="bubble">' + nd.bubble + '</span>' : '') +
        '<button class="med khatam" ' + nd.attrs + ' aria-label="' + esc(nd.label) + '">' +
        (state === 'current' ? '<span class="rip"></span><span class="rip r2"></span>' : '') + nd.num +
        (state === 'done' ? '<span class="donecheck">' + IC.check + '</span>' : '') + (state === 'locked' ? '<span class="lock">' + IC.lock + '</span>' : '') + '</button>' +
        '<div class="plabel">' + (nd.label.indexOf(nd.group) === 0 ? '' : '<span class="pg">' + esc(nd.group) + '</span>') + '<span class="pt">' + esc(nd.label) + '</span>' + (nd.pill || '') + '</div></div>';
    }).join('');
  }
  const starPill = (got, mx) => '<span class="ppill' + (got >= mx ? ' full' : '') + '">' + IC.star + got + ' / ' + mx + '</span>';
  function roadWatch(el, after) {
    requestAnimationFrame(() => requestAnimationFrame(after));
    const pathEl = el.querySelector('.path');
    if (window.ResizeObserver && pathEl) { let lastH = 0; const ro = new ResizeObserver(() => { if (!el.isConnected) { ro.disconnect(); return; } if (pathEl.offsetHeight !== lastH) { lastH = pathEl.offsetHeight; drawPath(el, false); } }); ro.observe(pathEl); }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (el.isConnected) drawPath(el, false); });
  }

  /* الصفحة الرئيسية: طريق المسارات، وكل مسار يفتح محطاته هو فقط */
  function showHome(dir) {
    setTheme('def');
    const doneN = MAIN.filter(l => S.done[l.id]).length;
    const focus = focusId(), fl = LEVELS.find(l => l.id === focus), fp = fl ? pathOf(fl) : -1;
    const fb = fp >= 0 ? babOf(fp) : /^x\d+$/.test(focus) ? +focus.slice(1) : -1;
    const nodes = BABS.map((b, bi) => {
      const lvs = babLv(b), n = lvs.length, dn = lvs.filter(l => S.done[l.id]).length;
      const got = lvs.reduce((x, l) => x + lvStars(l), 0), mx = lvs.reduce((x, l) => x + lvMax(l), 0);
      const state = dn === n && bxDone(bi) ? 'done' : bi === fb ? 'current' : 'open';
      const started = dn > 0 || got > 0 || lvs.some(l => S.pos[l.id]);
      return { id: lvs[0].id, state, attrs: 'data-act="bab" data-b="' + bi + '"', num: '<span class="mn">' + ar(bi + 1) + '</span>', group: 'الباب ' + ORD[bi] + ' · ' + chWord(b.g.length), label: b.t,
        bubble: state === 'current' ? (dn === n ? 'امتحان الباب' : started ? 'أكمل' : 'ابدأ هنا') : '', pill: state === 'done' || got ? starPill(got, mx) : '' };
    });
    const el = mount('<header class="bar home-bar"><h1 class="home-title grad-text long">الفقه الميسر</h1>' +
      '<span class="stat xp" title="نجومي">' + IC.star + '<span class="cnt">' + ar(totalStars()) + '</span></span>' +
      rankCard() + '<div class="tools"><button class="tool" data-act="bigmap">' + IC.map + 'الخريطة</button><button class="tool" data-act="badges">' + IC.medal + 'أوسمتي</button>' +
      '<button class="tool sq" data-act="sound" aria-label="' + (S.sound ? 'كتم الصوت' : 'تشغيل الصوت') + '">' + (S.sound ? IC.sound : IC.mute) + '</button><button class="tool sq" data-act="settings" aria-label="الإعدادات">' + IC.gear + '</button></div></header>' +
      '<div class="body home-body"><div class="hello slim">' + mascot(doneN ? 'wave' : 'idle') + '<div class="hello-t"><strong>' + (doneN === 0 ? 'لنبدأ الرحلة معاً!' : doneN === MAIN.length ? (allBxDone() ? 'أتممت الرحلة كلها، ما شاء الله!' : 'بقيت امتحانات الأبواب!') : 'رائع! أنجزت ' + ar(doneN) + ' من ' + ar(MAIN.length) + (MAIN.length > 10 ? ' محطة' : ' محطات')) + '</strong><span>' + (doneN === MAIN.length ? 'أعد أي محطة لتحسّن نجومك فيها' : 'اختر باباً لتفتح فصوله، ثم ادخل الفصل الذي تريده') + '</span><div class="track"><i style="width:' + Math.max(4, doneN / MAIN.length * 100) + '%"></i></div></div></div>' +
      '<div class="path"><svg class="pline" aria-hidden="true"></svg>' + roadRows(nodes) + '</div><p class="path-end">كل الأبواب مفتوحة لك؛ ادخل أي باب تريده بأي ترتيب، وفي آخر كل باب امتحانه.<br>' + (allBxDone() ? '<button class="btn btn-link" data-act="cert" data-b="-1">' + IC.medal + 'شهادة إتمام الكتاب</button><br>' : '') + '<button class="btn btn-link" data-act="reset">' + IC.reset + 'إعادة الرحلة من البداية</button></p></div>', dir);
    roadWatch(el, () => drawPath(el, true));
  }

  /* صفحة الباب: فصوله على الطريق، وكل فصل يفتح محطاته */
  function showBab(bi, dir) {
    const b = BABS[bi]; if (!b) { VIEW = 'home'; showHome(dir); return; }
    const fl = LEVELS.find(l => l.id === focusId()), fp = fl ? pathOf(fl) : -1;
    setTheme(PATHS[b.g[0]].lv[0].id); VIEW = 'bab';
    const nodes = b.g.map(gi => pathNode(gi, fp, 'الفصل ' + ar(gi + 1) + ' · ' + stWord(PATHS[gi].lv.length)));
    const lvs = babLv(b), dn = lvs.filter(l => S.done[l.id]).length;
    const ready = babReady(bi), xd = bxDone(bi), xs = xd ? 'done' : ready ? 'current' : 'locked';
    nodes.push({ id: 'exam', state: xs, extra: ' exam', attrs: 'data-act="exam" data-b="' + bi + '"', num: IC.crown, group: 'ختام الباب', label: 'امتحان الباب ' + ORD[bi],
      bubble: xs === 'current' ? 'جاهز؟' : '', pill: xd ? '<span class="ppill full">' + IC.star + ar(S.bx[bi] || 0) + '</span>' : xs === 'locked' ? '<span class="ppill">يُفتح بعد ' + stWord(lvs.length - dn) + '</span>' : '' });
    const el = mount('<header class="bar"><button class="ib" data-act="paths" aria-label="رجوع إلى الأبواب">' + IC.back + '</button><div class="bar-t"><div class="eyebrow">الباب ' + ORD[bi] + ' من ' + ar(BABS.length) + '</div><h2 class="h-display sm">' + esc(b.t) + '</h2></div></header>' +
      '<div class="body home-body">' +
      '<div class="path"><svg class="pline" aria-hidden="true"></svg>' + roadRows(nodes) + '</div>' +
      '<p class="path-end">' + (xd ? 'أتممت هذا الباب واجتزت امتحانه، أحسنت!' : ready ? 'أتممت فصول الباب كلها؛ امتحان الباب مفتوح لك الآن.' : 'فصول الباب مفتوحة لك بأي ترتيب، وامتحان الباب يُفتح حين تُتمّ محطاتها كلها.') + '<br><button class="btn btn-link" data-act="paths">' + IC.back + 'العودة إلى الأبواب</button></p></div>', dir);
    roadWatch(el, () => drawPath(el, false));
  }

  /* صفحة المسار: الطريق نفسه، وعليه محطات هذا المسار وحده */
  function showPath(gi, dir) {
    const p = PATHS[gi]; if (!p) { VIEW = 'home'; showHome(dir); return; }
    setTheme(p.lv[0].id); VIEW = 'path';
    const focus = focusId(), first = p.lv.find(l => !S.done[l.id]);
    const curId = p.lv.some(l => l.id === focus) ? focus : first ? first.id : '';
    const nodes = p.lv.map(l => {
      const id = l.id, state = S.done[id] ? 'done' : id === curId ? 'current' : 'open';
      const got = lvStars(l), mx = lvMax(l);
      return { id, state, attrs: 'data-act="open" data-id="' + id + '"', num: '<span class="mn">' + ar(levelNum(l)) + '</span>', group: l.group, label: l.title,
        bubble: state === 'current' ? (S.pos[id] ? 'أكمل' : 'ابدأ هنا') : '', pill: state === 'done' || got ? starPill(got, mx) : '' };
    });
    const el = mount('<header class="bar"><button class="ib" data-act="bab" data-b="' + babOf(gi) + '" data-dir="back" aria-label="رجوع إلى الباب">' + IC.back + '</button><div class="bar-t"><div class="eyebrow">الباب ' + ORD[babOf(gi)] + ' · الفصل ' + ar(gi + 1) + ' من ' + ar(PATHS.length) + '</div><h2 class="h-display sm">' + esc(p.name) + '</h2></div></header>' +
      '<div class="body home-body"><div class="path"><svg class="pline" aria-hidden="true"></svg>' + roadRows(nodes) + '</div>' +
      '<p class="path-end">' + stWord(p.lv.length) + ' في هذا الفصل، وكلها مفتوحة لك.<br><button class="btn btn-link" data-act="bab" data-b="' + babOf(gi) + '" data-dir="back">' + IC.back + 'العودة إلى الباب</button></p></div>', dir);
    /* المسار قصير: لا نحرّك الصفحة إلا إذا كانت المحطة الحالية أسفل الشاشة */
    roadWatch(el, () => {
      drawPath(el, false);
      const cur = el.querySelector('.pnode.current'), body = el.querySelector('.body'), pathEl = el.querySelector('.path');
      if (cur && body && pathEl) { const bot = pathEl.offsetTop - body.offsetTop + cur.offsetTop + cur.offsetHeight; if (bot > body.clientHeight - 12) body.scrollTop = bot - body.clientHeight + 24; }
    });
  }
  function drawPath(el, scroll) {
    const path = el.querySelector('.path'); if (!path) return;
    const svg = path.querySelector('.pline');
    const pts = Array.from(path.querySelectorAll('.pnode')).map(nd => {
      const m = nd.querySelector('.med'); const cxp = nd.offsetLeft + nd.offsetWidth / 2 + (+nd.dataset.x || 0);
      return { x: cxp, top: nd.offsetTop + m.offsetTop + 6, bot: nd.offsetTop + nd.offsetHeight + 4, done: nd.classList.contains('done'), col: nd.dataset.col };
    });
    svg.setAttribute('viewBox', '0 0 ' + path.offsetWidth + ' ' + path.offsetHeight);
    let segs = '';
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i], y1 = a.bot, y2 = b.top, my = (y1 + y2) / 2;
      segs += '<path class="' + (a.done && b.done ? 'done' : '') + '"' + (a.done ? ' style="stroke:' + b.col + '"' : '') + ' d="M' + a.x.toFixed(1) + ' ' + y1.toFixed(1) + ' C' + a.x.toFixed(1) + ' ' + my.toFixed(1) + ' ' + b.x.toFixed(1) + ' ' + my.toFixed(1) + ' ' + b.x.toFixed(1) + ' ' + y2.toFixed(1) + '"/>';
    }
    svg.innerHTML = segs;
    const cur = path.querySelector('.pnode.current'); const body = el.querySelector('.body');
    if (scroll && cur && body && (S.resume || MAIN.some(l => S.done[l.id]))) { const br = body.getBoundingClientRect(), cr = cur.getBoundingClientRect(); body.scrollTop = Math.max(0, body.scrollTop + (cr.top - br.top) - body.clientHeight / 2 + cr.height / 2); }
  }

  function readName() { const inp = appEl.querySelector('#set-name'); if (inp) { S.name = cleanName(inp.value); save(); } }

  let CERTB = -1;
  function showCert(bi, dir) {
    setTheme('def');
    const B = bi >= 0 ? BABS[bi] : null; CERTB = B ? bi : -1;
    const date = new Date().toLocaleDateString('ar-EG-u-nu-latn', { year: 'numeric', month: 'long', day: 'numeric' });
    const r = rankOf(totalStars());
    const body = B
      ? 'أتمّ فصول الباب ' + ORD[bi] + ' من كتاب «الفقه الميسر»: ' + B.g.map(gi => '«' + esc(PATHS[gi].name) + '»').join('، ') + '، واجتاز امتحان الباب.'
      : 'أتمّ ما نُشر من كتاب «الفقه الميسر»، واجتاز امتحانات أبوابه كلها.';

      '<div class="body cert-wrap"><div class="cert"><span class="cn a"></span><span class="cn b"></span><span class="cn c"></span><span class="cn d"></span><div class="cert-k">' + (B ? 'شهادة إتمام الباب ' + ORD[bi] : 'شهادة إتمام') + '</div><h3 class="long">' + (B ? esc(B.t) : 'الفقه الميسر') + '</h3>' +
      '<div class="cert-name" id="cert-out">' + esc(S.name || 'اسم الطالب') + '</div><br><button class="btn btn-link" data-act="settings">' + (S.name ? 'تعديل الاسم' : 'اكتب اسمك') + '</button>' +
      '<p>' + body + '</p>' +
      (r ? '<div class="cert-badge">' + emblem(r - 1) + '<strong>' + esc(BADGES[r - 1].n) + '</strong></div>' : '') +
      '<div class="cert-meta"><span>النجوم: ' + ar(totalStars()) + '</span><span>' + (B ? 'نجوم امتحان الباب: ' + ar(S.bx[bi] || 0) : 'نجوم الامتحانات: ' + ar(bxSum())) + '</span><span>' + esc(date) + '</span></div></div>' +
      '<p class="note-s">خذ لقطة شاشة للشهادة لتحتفظ بها.<br>المادة العلمية من كتاب «الفقه الميسر»</p></div>' +
      '<div class="foot">' + (B && allBxDone() ? '<button class="btn btn-main" data-act="cert" data-b="-1">شهادة إتمام الكتاب ' + IC.arrow + '</button>' : '') +
      (B ? '<button class="btn ' + (allBxDone() ? 'btn-ghost' : 'btn-main') + '" data-act="bab" data-b="' + bi + '" data-dir="back">العودة إلى الباب</button>' : '<button class="btn btn-main" data-act="paths">العودة إلى الأبواب</button>') + '</div>', dir);
    VIEW = 'cert';

  let VIEW = '';

  /* ================= LESSON SESSION ================= */
  let SES = null;
  function shell() {
    return '<header class="lbar"><button class="ib" data-act="quit" aria-label="خروج">' + IC.x + '</button><div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div class="prog-f"></div></div><span class="lxp" title="' + (SES && SES.kind === 'exam' ? 'نجوم الامتحان' : 'نجومي') + '">' + IC.star + '<span>' + ar(pillVal()) + '</span></span><div class="hearts" aria-live="polite"></div></header><div class="stage"></div>';
  }
  const pillVal = () => SES && SES.kind === 'exam' ? SES.stars : totalStars();
  /* ترتيب أسئلة الفقرة: تتدرج تصاعدياً، مع خلط ما تساوى منها */
  const orderQ = p => shuffle(p.q.map((_, i) => i)).sort((a, b) => p.q[a].d - p.q[b].d);
  function openLevel(id, dir, fromEl, saved) {
    const lv = LEVELS.find(l => l.id === id);
    const label = '<span class="wn">' + ar(levelNum(lv)) + '</span><span class="wt">' + esc(lv.title) + '</span>';
    if (fromEl) { wipe(fromEl, id, label, () => openLevel(id, dir)); return; }
    setTheme(id);
    const steps = [{ k: 'map' }];
    lv.paras.forEach((p, pi) => { steps.push({ k: 'ex', p: pi }); p.q.forEach((_, n) => steps.push({ k: 'q', p: pi, n })); });
    steps.push({ k: 'sum' }, { k: 'done' });
    SES = { kind: 'level', lv, steps, idx: 0, hearts: HEARTS, max: HEARTS, mistakes: 0, stars: 0, doubles: 0, combo: 0, order: {}, revisit: {}, reveal: 0 };
    lv.paras.forEach((p, pi) => { SES.order[pi] = orderQ(p); });
    const back = !!saved && applyPos(saved);
    SES.screen = mount(shell(), dir); VIEW = 'level';
    if (back) enterSaved(); else renderStep('fwd');
  }
  function openExam(bi, dir, fromEl, saved) {
    const B = BABS[bi]; if (!B) return;
    if (fromEl) { wipe(fromEl, 'exam', '<span class="wn">' + IC.crown.replace('<svg', '<svg style="width:90px;height:90px"') + '</span><span class="wt">امتحان الباب ' + ORD[bi] + '</span>', () => openExam(bi, dir)); return; }
    setTheme('exam');
    /* عند الرجوع إلى امتحان محفوظ تُستعاد الأسئلة نفسها بترتيبها */
    let qs = saved && Array.isArray(saved.qs) && saved.qs.length && saved.qs.every(id => QBYID[id]) ? saved.qs.map(id => QBYID[id]) : null;
    if (!qs) {
      saved = null;
      /* من كل فصل في الباب: سؤال من الأسئلة الأصعب، والبقية موزّعة على محطاته بالتناوب */
      const picks = [], per = Math.max(3, Math.ceil(16 / B.g.length));
      B.g.forEach(gi => {
        const lo = [], hi2 = [], got = [], byLv = {};
        PATHS[gi].lv.forEach(l => { const li = MAIN.indexOf(l); l.paras.forEach(p => p.q.forEach(q => (q.d <= 2 ? lo : hi2).push({ q, li }))); });
        if (hi2.length) got.push(pick(hi2));
        shuffle(lo).forEach(x => (byLv[x.li] = byLv[x.li] || []).push(x));
        const ks = shuffle(Object.keys(byLv)); let k = 0;
        while (got.length < per && ks.some(x => byLv[x].length)) { const a = byLv[ks[k++ % ks.length]]; if (a.length) got.push(a.pop()); }
        got.forEach(x => picks.push(x));
      });
      qs = shuffle(picks);
    }
    const steps = [{ k: 'examintro' }].concat(qs.map((x, n) => ({ k: 'q', q: x.q, n, from: x.li })));
    SES = { kind: 'exam', bab: bi, steps, idx: 0, hearts: EXAM_HEARTS, max: EXAM_HEARTS, mistakes: 0, stars: 0, doubles: 0, combo: 0, total: qs.length };
    const back = !!saved && applyPos(saved);
    SES.screen = mount(shell(), dir); VIEW = 'exam';
    if (back) enterSaved(); else renderStep('fwd');
  }
  const curStep = () => SES.steps[SES.idx];
  function getQ(st) { return SES.kind === 'exam' ? st.q : SES.lv.paras[st.p].q[SES.order[st.p][st.n]]; }

  /* ---------- حفظ مكان الطالب بدقة ----------
     S.pos[id]  آخر موضع داخل كل محطة (وداخل الامتحان بالمفتاح exam): الخطوة والقلوب وترتيب الأسئلة
     S.at       الجلسة المفتوحة الآن؛ عند فتح الصفحة من جديد تُفتح عليها مباشرة
     يُحفظ الموضع مع كل خطوة وكل إجابة، فلا يضيع شيء إذا أُغلق المتصفح فجأة. */
  const sesKey = () => SES.kind === 'exam' ? 'x' + SES.bab : SES.lv.id;
  function snap() {
    if (!SES || !SES.steps) return;
    const st = curStep(), key = sesKey();
    if (st.k === 'done') { delete S.pos[key]; S.at = null; save(); return; }
    S.at = key;
    if (st.k === 'map') { save(); return; }
    const o = { idx: SES.idx, hearts: SES.hearts, mistakes: SES.mistakes, stars: SES.stars, doubles: SES.doubles, combo: SES.combo };
    if (SES.kind === 'exam') o.qs = SES.steps.filter(x => x.k === 'q').map(x => x.q.id);
    else { o.order = SES.order; o.revisit = SES.revisit; S.resume = { id: key, p: st.p || 0 }; }
    if (st.k === 'ex') o.reveal = SES.reveal;
    const c = SES.cur;
    if (st.k === 'q' && c && c.q === getQ(st)) {
      o.tries = c.tries; o.solved = !!c.solved;
      /* وقت المضاعفة يُحفظ كساعة حائط، فيستمر العدّ والصفحة مغلقة كما يستمر وهي في الخلفية */
      if (c.deadline) o.dl = Math.round(Date.now() + c.deadline - performance.now());
    }
    S.pos[key] = o; save();
  }
  /* يضع الجلسة الحالية على موضع محفوظ بعد التحقق من سلامته */
  function applyPos(p) {
    const num = v => typeof v === 'number' && isFinite(v);
    if (!p || !num(p.idx) || p.idx < 0 || p.idx >= SES.steps.length) return false;
    const k = SES.steps[p.idx | 0].k; if (k === 'map' || k === 'done') return false;
    SES.idx = p.idx | 0;
    SES.hearts = num(p.hearts) ? Math.max(0, Math.min(SES.max, p.hearts | 0)) : SES.max;
    ['mistakes', 'stars', 'doubles', 'combo'].forEach(f => { SES[f] = num(p[f]) ? Math.max(0, p[f] | 0) : 0; });
    if (SES.kind === 'level') SES.lv.paras.forEach((pa, pi) => {
      const o = p.order && p.order[pi];
      if (Array.isArray(o) && o.length === pa.q.length && o.slice().sort((a, b) => a - b).every((v, i) => v === i)) SES.order[pi] = o.slice();
      SES.revisit[pi] = !!(p.revisit && p.revisit[pi]);
    });
    SES.re = { tries: num(p.tries) ? Math.max(0, p.tries | 0) : 0, solved: !!p.solved, dl: num(p.dl) ? p.dl : 0, reveal: num(p.reveal) ? p.reveal | 0 : 0 };
    return true;
  }
  /* سؤال أُجيب قبل الإغلاق: نجومه محفوظة، فننتقل إلى ما بعده ولا نعيده */
  function enterSaved() {
    if (curStep().k === 'q' && SES.re && SES.re.solved) { SES.re = null; advance(); return; }
    renderStep('fwd');
  }
  /* عند فتح الصفحة: الرجوع إلى الجلسة التي كانت مفتوحة */
  function restore() {
    const key = S.at; if (!key) return false;
    const p = S.pos[key] || null;
    try {
      if (/^x\d+$/.test(key) && BABS[+key.slice(1)]) {
        if (p && Array.isArray(p.qs) && p.qs.length && p.qs.every(id => QBYID[id])) { openExam(+key.slice(1), 'fwd', null, p); return true; }
      } else if (LEVELS.some(l => l.id === key)) { openLevel(key, 'fwd', null, p); return true; }
    } catch (e) { /* موضع تالف: نتجاهله */ }
    stopTimer(); closeSheet(); SES = null; S.at = null; delete S.pos[key]; save();
    return false;
  }

  function renderStep(dir) {
    const st = curStep(); let html = '';
    stopTimer();
    if (st.k === 'map') html = stepMap();
    else if (st.k === 'ex') html = stepEx();
    else if (st.k === 'q') html = stepQ();
    else if (st.k === 'sum') html = stepSum();
    else if (st.k === 'done') html = stepDone();
    else if (st.k === 'examintro') html = stepExamIntro();
    SES.slide = swapIn(SES.screen.querySelector('.stage'), 'slide', html, dir);
    const f = SES.screen.querySelector('.prog-f'); const pct = Math.round(SES.idx / (SES.steps.length - (SES.kind === 'exam' ? 0 : 1)) * 100);
    f.style.width = pct + '%'; SES.screen.querySelector('.prog').setAttribute('aria-valuenow', pct);
    SES.screen.querySelector('.hearts').classList.toggle('hide', !(st.k === 'ex' || st.k === 'q'));
    renderHearts(-1);
    if (st.k === 'q') startTimer();
    if (st.k === 'done') { celebrate(SES.slide.querySelector('.done-hero')); const b = SES.slide.querySelector('[data-count]'); setTimeout(() => countUp(b, 0, +b.dataset.count), 1300); }
    /* استكمال سؤال محفوظ: المحاولات السابقة والوقت المتبقي والقلوب كما كانت */
    const re = SES.re; SES.re = null;
    if (re && st.k === 'q') {
      const c = SES.cur;
      if (c.tries > 0) timerState('miss');
      else if (re.dl) { const left = Math.min(c.q.sec * 1000, re.dl - Date.now()); c.deadline = performance.now() + left; if (left <= 0) timerState('late'); }
      if (SES.hearts <= 0) { c.busy = true; heartsOut(); }
    }
    snap();
  }
  function renderHearts(breakIdx) {
    const el = SES.screen.querySelector('.hearts'); if (!el) return;
    el.setAttribute('aria-label', 'القلوب: ' + ar(SES.hearts) + ' من ' + ar(SES.max));
    el.innerHTML = Array.from({ length: SES.max }, (_, i) => '<span class="heart' + (i < SES.hearts ? '' : ' lost') + (i === breakIdx ? ' breaking' : '') + '">' + IC.heart + '</span>').join('');
  }

  /* ----- map step ----- */
  /* تنقّل حر بين فقرات المحطة: القراءة مفتوحة دائماً، وأسئلة كل فقرة تُفتح بعد إتمام قراءتها */
  function paraNav(cur) {
    if (!SES || SES.kind !== 'level') return '';
    const ps = SES.lv.paras; if (ps.length < 2) return '';
    return '<nav class="pnav" aria-label="فقرات المحطة">' + ps.map((pa, i) => {
      const ok = pa.q.length && pa.q.every(q => S.q[q.id]);
      return '<button type="button" class="pn' + (i === cur ? ' on' : '') + (ok ? ' ok' : '') + '" data-act="gopara" data-p="' + i + '" aria-label="الفقرة ' + (i + 1) + '"' + (i === cur ? ' aria-current="true"' : '') + '>' + ar(i + 1) + '</button>';
    }).join('') + '</nav>';
  }
  function stepMap() {
    const lv = SES.lv; const hasResume = !!S.pos[lv.id];
    return '<div class="body"><div class="eyebrow">المحطة ' + ar(levelNum(lv)) + ' · ' + esc(lv.group) + '</div>' +
      '<h2 class="h-display grad-text">' + esc(lv.title) + '</h2><p class="lede">خريطة المحطة: ' + paraWord(lv.paras.length) + '، وبعد كل فقرة أسئلة لا تنتقل قبل أن تجيبها صحيحة. أجب قبل أن ينتهي شريط الوقت تنل <b>ضعف النجوم</b>.</p>' + radial(lv.map) + paraNav(-1) + '</div>' +
      '<div class="foot">' + (hasResume
        ? '<button class="btn btn-main" data-act="resume">أكمل من حيث توقفت ' + IC.arrow + '</button><button class="btn btn-link" data-act="next">ابدأ المحطة من الأول</button>'
        : '<button class="btn btn-main" data-act="next">ابدأ الشرح ' + IC.arrow + '</button>') + '</div>';
  }

  /* ----- explanation step ----- */
  function stepEx() {
    const st = curStep(); const p = SES.lv.paras[st.p]; const rv = !!SES.revisit[st.p];
    SES.reveal = rv ? p.b.length : Math.max(1, Math.min(p.b.length, (SES.re && SES.re.reveal) || 1));
    return '<div class="body ex">' + paraNav(st.p) + '<div class="eyebrow">الفقرة ' + ar(st.p + 1) + ' من ' + ar(SES.lv.paras.length) + (rv ? ' · مراجعة' : '') + '</div>' +
      '<h2 class="stitle">' + md(p.t) + '</h2>' + (rv ? '<div class="revisit">' + mascot('idle') + '<span>اقرأ الفقرة بتمهل، ثم أعد المحاولة؛ ستعود القلوب كاملة وتتغير الأسئلة في ترتيبها.</span></div>' : '') +
      '<div class="blocks">' + p.b.slice(0, SES.reveal).map(block).join('') + '</div>' +

  function exFoot(p) {

      : '<button class="btn btn-main" data-act="reveal">التالي ' + IC.arrow + '</button><button class="btn btn-link" data-act="revealall">اعرض الفقرة كاملة</button>';
  }
  function revealMore(all) {
    const st = curStep(); const p = SES.lv.paras[st.p]; if (SES.reveal >= p.b.length) return;
    const wrap = SES.slide.querySelector('.blocks'); const body = SES.slide.querySelector('.body');
    const upto = all ? p.b.length : SES.reveal + 1; let firstNew = null;
    for (let i = SES.reveal; i < upto; i++) { wrap.insertAdjacentHTML('beforeend', block(p.b[i])); if (!firstNew) firstNew = wrap.lastElementChild; }
    SES.reveal = upto; snap();
    SES.slide.querySelectorAll('.dots i').forEach((d, i) => d.classList.toggle('on', i < SES.reveal));

    sfx('reveal');
    if (firstNew) setTimeout(() => { body.scrollTop = Math.max(0, firstNew.offsetTop - 16); }, 40);
  }

  /* ----- question step ----- */
  function stepQ() {
    const st = curStep(); const q = getQ(st);
    const c = SES.cur = { q, solved: false, tries: (SES.re && SES.re.tries) || 0, busy: false, val: '' };
    if (q.t === 'mcq' || q.t === 'fill') c.ord = shuffle(q.o.map((_, i) => i));
    if (q.t === 'order') { let pool = shuffle(q.o.map((_, i) => i)); for (let g = 0; g < 6 && pool.every((v, i) => v === i); g++) pool = shuffle(pool); c.pool = pool; c.placed = q.o.map(() => null); c.locked = new Set(); }
    if (q.t === 'match') { c.tOrd = shuffle(q.o.map((_, i) => i)); c.dOrd = shuffle(q.o.map((_, i) => i)); c.sel = { t: null, d: null }; c.matched = 0; }

      '<div class="qcard"><div class="qtext">' + qText(q) + '</div>' + (q.fig ? '<figure class="qfig">' + fig(q.fig) + '</figure>' : '') + '<div class="qbody">' + qBody(q, c) + '</div></div><div class="hint-slot" aria-live="assertive"></div></div>' +

  function qText(q) {

  const PAD = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', 'neg', '.', 'del'];
  const padHTML = () => '<div class="pad">' + PAD.map((k, i) => '<button class="key' + (/\d/.test(k) ? '' : ' fn') + '" data-act="key" data-k="' + k + '" style="animation-delay:' + (i * .02).toFixed(2) + 's" aria-label="' + ({ del: 'حذف', neg: 'سالب', '.': 'علامة عشرية' }[k] || k) + '">' + ({ del: IC.del, neg: '−' }[k] || k) + '</button>').join('') + '<button class="key go" data-act="check" disabled>تحقق</button></div>';
  function qBody(q, c) {
    if (q.t === 'mcq') return '<div class="opts">' + c.ord.map((oi, k) => '<button class="opt" data-act="pick" data-o="' + oi + '" style="animation-delay:' + (k * .06).toFixed(2) + 's"><span class="k">' + LETTERS[k] + '</span><span class="ot">' + md(q.o[oi]) + '</span></button>').join('') + '</div>';
    if (q.t === 'tf') return '<div class="tf"><button class="opt" data-act="tf" data-v="1">' + IC.check + '<span>صح</span></button><button class="opt" data-act="tf" data-v="0">' + IC.x + '<span>خطأ</span></button></div>';

  }
  function primaryAction() {
    if (!SES || !SES.slide || appEl.querySelector('.sheet-wrap')) return;
    const st = curStep();
    if (st.k === 'map') advance();
    else if (st.k === 'ex') { const p = SES.lv.paras[st.p]; if (SES.reveal < p.b.length) revealMore(false); else advance(); }
  }

  /* ================= ACTIONS ================= */
  const ACT = {
    splash: () => showSplash('back'),
    start: () => { if (S.name) showBigMap('fwd'); else nameSheet(true); },
    namego: () => { readName(); closeSheet(); showBigMap('fwd'); },
    nameskip: () => { closeSheet(); showBigMap('fwd'); },
    settings: () => nameSheet(false),
    namesave: () => { readName(); closeSheet(); toast(S.name ? 'تم حفظ الاسم: ' + S.name : 'تم مسح الاسم'); if (VIEW === 'cert') showCert(CERTB, 'fwd'); else showHome('fwd'); },
    /* الخروج من محطة يعيد إلى صفحة مسارها؛ وما عدا ذلك يعيد إلى قائمة المسارات */
    home: () => {
      closeSheet(); stopTimer();
      const lv = SES && SES.kind === 'level' && VIEW === 'level' ? SES.lv : null;
      const xb = SES && SES.kind === 'exam' ? SES.bab : -1;
      if (xb >= 0) delete S.pos['x' + xb];
      S.at = null; save(); SES = null;
      if (lv) showPath(pathOf(lv), 'back'); else if (xb >= 0) showBab(xb, 'back'); else { VIEW = 'home'; showHome('back'); }
    },
    paths: () => { closeSheet(); stopTimer(); SES = null; VIEW = 'home'; showHome('back'); },
    path: t => { closeSheet(); stopTimer(); SES = null; sfx('tap'); showPath(+t.dataset.g, 'fwd'); },
    bab: t => { closeSheet(); stopTimer(); SES = null; sfx('tap'); showBab(+t.dataset.b, t.dataset.dir || 'fwd'); },
    bigmap: () => { VIEW = 'map'; showBigMap('fwd'); },
    badges: () => { VIEW = 'badges'; showBadges('fwd'); },
    badge: t => showBadge(+t.dataset.i),
    sound: t => { S.sound = !S.sound; save(); t.innerHTML = S.sound ? IC.sound : IC.mute; t.setAttribute('aria-label', S.sound ? 'كتم الصوت' : 'تشغيل الصوت'); if (S.sound) sfx('ok'); toast(S.sound ? 'تم تشغيل الصوت' : 'تم كتم الصوت'); },
    reset: () => sheet('<div class="sh-h"><strong>إعادة الرحلة من البداية؟</strong></div><p class="msg">ستُمحى النجوم والأوسمة وتقدّمك في المحطات على هذا الجهاز. يبقى اسمك كما هو.</p><div class="sh-actions"><button class="btn btn-bad" data-act="resetyes">نعم، ابدأ من جديد</button><button class="btn btn-ghost" data-act="sheetclose">إلغاء</button></div>'),
    resetyes: () => { const snd = S.sound, nm = S.name; S = JSON.parse(JSON.stringify(DEF)); S.sound = snd; S.name = nm; save(); closeSheet(); showSplash('back'); },
    sheetclose: () => { closeSheet(); const b = SES && SES.slide && SES.slide.querySelector('.foot .btn'); if (b) { try { b.focus({ preventScroll: true }); } catch (e) { /* ignore */ } } },
    open: t => {
      const id = t.dataset.id;
      sfx('tap'); openLevel(id, 'fwd', t);
    },
    exam: t => {
      const bi = +t.dataset.b; if (!BABS[bi]) return;
      if (!babReady(bi)) {
        const left = babLeft(bi), gi = pathOf(left[0]);
        sfx('tap');
        sheet('<div class="sh-h"><strong>امتحان الباب ' + ORD[bi] + ' مغلق</strong></div><p class="msg">يُفتح امتحان الباب حين تُتمّ محطات فصوله كلها. باقٍ لك ' + textHTML(stWord(left.length)) + ' في هذا الباب.</p>' +
          '<div class="sh-actions"><button class="btn btn-main" data-act="path" data-g="' + gi + '">أكمل «' + esc(PATHS[gi].name) + '» ' + IC.arrow + '</button><button class="btn btn-ghost" data-act="sheetclose">حسناً</button></div>');
        return;
      }
      if (bxDone(bi)) { sheet('<div class="sh-h"><strong>امتحان الباب ' + ORD[bi] + '</strong></div><p class="msg">اجتزت امتحان هذا الباب من قبل، وأفضل نتيجة لك فيه ' + textHTML(starWord(S.bx[bi] || 0)) + '. ماذا تريد؟</p><div class="sh-actions"><button class="btn btn-main" data-act="cert" data-b="' + bi + '">عرض الشهادة</button><button class="btn btn-ghost" data-act="examretry" data-b="' + bi + '">إعادة الامتحان</button></div>'); return; }
      openExam(bi, 'fwd', t);
    },
    examretry: t => { closeSheet(); openExam(t && t.dataset.b != null ? +t.dataset.b : SES && SES.kind === 'exam' ? SES.bab : 0, 'fwd'); },
    cert: t => showCert(t && t.dataset.b != null ? +t.dataset.b : -1, 'fwd'),
    rnode: t => openNode(t),
    gopara: t => {
      if (!SES || SES.kind !== 'level') return;
      const p = +t.dataset.p, i = SES.steps.findIndex(x => x.k === 'ex' && x.p === p); if (i < 0) return;
      closeSheet(); stopTimer(); sfx('tap');
      SES.idx = i; SES.hearts = SES.max; SES.revisit[p] = false; SES.re = null; renderStep('fwd');
    },
    next: () => advance(),
    resume: () => { if (applyPos(S.pos[SES.lv.id])) enterSaved(); else advance(); },
    reveal: () => revealMore(false),
    revealall: () => revealMore(true),
    pick: t => mcqPick(t),
    tf: t => tfPick(t),
    fill: t => fillPick(t),
    slot: t => orderSlot(t),
    unslot: t => orderUnslot(t),
    check: () => (SES.cur.q.t === 'num' ? numCheck() : orderCheck()),
    key: t => numKey(t.dataset.k),
    mt: t => matchPick(t, 't'),
    md: t => matchPick(t, 'd'),
    reread: () => reread(),
    peek: () => { const p = SES.lv.paras[curStep().p]; sheet('<div class="sh-h"><strong>' + md(p.t) + '</strong><button class="ib" data-act="sheetclose" aria-label="إغلاق">' + IC.x + '</button></div><div class="sh-body still">' + p.b.map(block).join('') + '</div>'); },
    flip: t => { t.classList.toggle('on'); sfx('tap'); },
    finish: () => finishLevel(),
    quit: () => sheet('<div class="sh-h"><strong>' + (SES && SES.kind === 'exam' ? 'الخروج من الامتحان؟' : 'الخروج من المحطة؟') + '</strong></div><p class="msg">' + (SES && SES.kind === 'exam' ? 'لن يُحفظ تقدمك في الامتحان، وستبدؤه من جديد لاحقاً.' : 'نجومك محفوظة، ومكانك محفوظ؛ ستكمل من نفس النقطة حين تعود.') + '</p><div class="sh-actions"><button class="btn btn-main" data-act="sheetclose">متابعة الدراسة</button><button class="btn btn-ghost" data-act="home">' + (SES && SES.kind === 'exam' ? 'خروج إلى الباب' : 'خروج إلى الفصل') + '</button></div>')
  };

  appEl.addEventListener('click', e => {
    const t = e.target.closest('[data-act]'); if (!t || !appEl.contains(t) || t.disabled) return;
    const fn = ACT[t.dataset.act]; if (fn) { e.preventDefault(); fn(t, e); }
  });
  document.addEventListener('keydown', e => {
    const inField = /INPUT|TEXTAREA/.test((e.target || {}).tagName || '');
    const open = appEl.querySelector('.sheet-wrap');
    if (e.key === 'Escape') { if (open && open.dataset.locked !== '1') ACT.sheetclose(); return; }
    if (inField || open) return;
    if (e.key === 'ArrowLeft') primaryAction();
    const c = SES && SES.cur, st = SES && curStep();
    if (c && st && st.k === 'q' && c.q.t === 'num' && !c.solved) {
      if (/^[0-9]$/.test(e.key)) numKey(e.key);
      else if (e.key === 'Backspace') { e.preventDefault(); numKey('del'); }
      else if (e.key === '-') numKey('neg');
      else if (e.key === '.' || e.key === ',') numKey('.');
      else if (e.key === 'Enter') { e.preventDefault(); numCheck(); }
    }
  });
  let tx = 0, ty = 0;
  host.addEventListener('touchstart', e => { const t = e.touches[0]; tx = t.clientX; ty = t.clientY; }, { passive: true });
  host.addEventListener('touchend', e => {
    const t = e.changedTouches[0]; const dx = t.clientX - tx, dy = t.clientY - ty;
    if (dx > 70 && Math.abs(dy) < 45) primaryAction();
  }, { passive: true });

  window.__MJ = { get S() { return S; }, get SES() { return SES; }, LEVELS, BADGES, emblem, fig, md, totalStars, rankOf, lvMax };

  /* إذا فُتحت الصفحة في أكثر من تبويب: التبويب القديم لا يكتب فوق التقدم الأحدث،
     بل يعيد تحميل نفسه عند الرجوع إليه فيكمل من أحدث موضع محفوظ. */
  const syncTab = () => { if (changedElsewhere()) location.reload(); };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncTab(); });
  window.addEventListener('pageshow', e => { if (e.persisted) syncTab(); });

  if (!restore()) { if (S.intro) { VIEW = 'home'; showHome('fwd'); } else showSplash('fwd'); }
  if (!canStore()) setTimeout(() => toast('تنبيه: المتصفح لا يسمح بالحفظ، فلن يبقى تقدمك بعد إغلاق الصفحة'), 1200);
})();

</script>
</body>
</html>
