عشرين درهما في الجبران(٢) مع(٣) الشاتين، فهذا يدل على أن الزكاة لم تترك خالية عن", "حاشية: (١-١) سقط من الأصل.", "حاشية: (٢) الجبران يكون على من وجبت عليه في زكاة إبله سن معينة ولم يجدها أخرج سنا أصغر منها ودفع معها شاتان أو عشرين درهما، وهذا الفضل يسمى جبرانا. الموسوعة الفقهية ١٥/ ١٠٢ ـ ١٠٣، والمقنع مع الشرح الكبير والإنصاف ٦/ ٤١٤ ـ ٤١٥.", "حاشية: (٣) تحرفت في الأصل إلى: «بيع».", "التعبدات(١) غير أن الأذهان الضعيفة تقصر عن درك(٢) المركبات.", "**الرابع:** أن لا ينقل الصدقة من بلد إلى بلد آخر تقصر بينهما الصلاة، وذلك لأن أعين المساكين في كل بلدة ممتدة إلى أموالها، فإن فعل، فهل يجزيه؟ على روايتين، أصحهما: الإجزاء.", "**الخامس:** استيعاب الأصناف، لقوله تعالى: ﴿إِنَّمَا ٱلصَّدَقَٰتُ لِلْفُقَرَآءِ وَٱلْمَسَٰكِينِ﴾ [التوبة: ٦٠] وذلك يقتضي التشريك في التمليك، فإن اقتصر على صنف واحد لم يجزه، وهذا اختيار أبي بكر عبد العزيز، وأكثر أصحابنا على أن ذلك مستحب، وأنه يجوز الاقتصار على صنف واحد(٣)، ومتى قلنا: له أن يقتصر على صنف واحد. جاز أن يدفعها إلى مسكين واحد، وإذا قلنا: لا يقتصر، فلا يجزيه من كل صنف أقل من ثلاثة، إلا العامل فإن ما يأخذه أجرة، فجاز أن يكون واحدا.", "**بيان دقائق الآداب الباطنة في الزكاة**", "اعلم أن على مريد طريق الآخرة في زكاته ثمانية وظائف:", "**الأولى:** أن يفهم المراد من الزكاة، وهو ثلاثة أشياء:", "أحدها: ابتلاء مدعي محبة الله بإخراج محبوبه.", "والثاني: التنزه عن صفة البخل المهلك.", "والثالث: شكر نعمة المال.", "**الثانية:** البدار بالإخراج خوفا من عائق، وتعجيلا لإيصال السرور إلى الفقير مع ما في ضمن التأخير من إثم.", "**الثالثة:** الإسرار، فإنه أبعد من الرياء والسمعة، وإذا كان المقصود بإخراج المال دفع محبوب النفس فحب الجاه أشد استيلاء على النفس من حب المال،", "حاشية: (١) في الأصل: «التعبد»."]], "ic": "book"}, {"story": ["كتاب أسرار الزكاة ومهماتها (٨ من ١٦)، ص١٦٦", ["حاشية: (٢) في الأصل: «إدراك».", "حاشية: (٣) ورد في هامش (ط) ما نصه: «الجزء الثاني من أجزاء الشيخ المصنف».", "فلا فائدة في مخالفة داعي البخل وإجابة داعي الرياء، ثم في الإظهار إذلال للفقير وهتك لستر عفافه وصيانته، وربما قال قائل: إذا أخفيت الزكاة اتهمت في الإخراج! فالجواب: أن الآخذين تختلف أحوالهم؛ فمنهم من لا يبالي إذا أعطي بين الجماعة، ومنهم من ينقبض عن ذلك لعلو همته، فيكفي في اشتهار إخراجك إظهار ما تعطي لمن لا يستنكف عن الإظهار، فلا ينبغي التعلل لطلب الرياسة بالإعطاء بهذه العلة، فالناقد بصير، فإن قال قائل: استحياء الفقير من أخذ الزكاة نوع كبر فلا يلتفت إليه. فالجواب: إن الشرع لا ينكر على ذي المروءة عفافه وتصونه، ولهذا قال الله تعالى: ﴿وَإِن تُخْفُوهَا وَتُؤْتُوهَا ٱلْفُقَرَآءَ فَهُوَ خَيْرٌ لَّكُمْ﴾ [البقرة: ٢٧١]. وقال بشر الحافي: تعطون بالليل وتتحدثون بالنهار!", "**الرابعة:** أن يظهر الإخراج إما حيث يعلم أن في الإظهار ترغيبا للناس في الاقتداء ثم يحرس قلبه عن الرياء، أو لأن السائل إنما سأل في ملأ من الناس، فهذا قد هتك بالسؤال ستر نفسه، فلا وجه لتغطية حاله.", "**والخامسة:** أن لا يفسد صدقته بالمن والأذى، والمن على الفقير أن يقول له: قد أحسنت إليك ونعشتك(١). وأما الأذى، فمثل أن يقول له: أنت أبدا فقير! وقد بليت بك! وأراحني الله منك!", "واعلم أن منبع المن أن الإنسان يرى نفسه محسنا إلى الفقير ومنعما عليه، ولو حقق النظر لرأى الفقير محسنا إليه بقبول حق الله الذي هو طهرة له ولو كان على الإنسان دين لإنسان فأحال به عبده الذي هو متكفل برزقه، فاعتقد مؤدي الدين أن القابض تحت منته كان سفيها؛ لأن المحسن إليه هو المتكفل برزقه لا مؤدي الدين، ومن عرف ما ذكرنا في فهم وجوب الزكاة لم ير نفسه محسنا إلا إلى نفسه إما ببذل ماله لحب الله، أو لتطهير نفسه عن رذيلة، أو لشكر نعمة المال، فلا يبقى بينه وبين الفقير معاملة، ولا يكون لطلبه شكره أو مكافأته وجه.", "فأما منبع الأذى فأمران:", "حاشية: (١) يقال: نعش فلان فلانا، أي: جبره بعد فقر.", "أحدهما: كراهيته رفع اليد عن المال، وشدة ذلك على النفس، وذلك يضيق الخلق.", "والثاني: رؤيته أنه خير من الفقير، وأن الفقير بسبب حاجته أنزل رتبة منه، وكلا الأمرين منشؤه الجهل، أما كراهة تسليم المال فهو حمق لوجهين: أحدهما أن المنعم بالمال قد طلب منه شيئا يسيرا، فلا وجه للبخل عليه، والثاني: أن المضاعفة واقعة بالمبذول، فالتوقف في البذل مع تيقن كثرة الربح حمق، وأما احتقار الفقير فجهل إذ الفضل ليس بالمال ولا النقص بعدمه.", "**السادسة:** أن يستصغر العطية، فإن المستعظم للفعل معجب به والعجب مفسد، وقد قيل: لا يتم المعروف إلا بثلاث: تصغيره وتعجيله وستره. ووجه استصغار العطية من أمرين:"]], "ic": "book"}, {"story": ["كتاب أسرار الزكاة ومهماتها (٩ من ١٦)، ص١٦٨", ["أحدهما: أن يرى قلة المفروض في كثير المال.", "والثاني: أن يستحيي لإعطاء أخيه ما لا بد منه، ويخجل كيف لا يعطيه ما يتبرع به.", "**السابعة:** أن ينتقي من ماله أحله وأجوده وأحبه إليه.", "أما الحل، فإن الله طيب لا يقبل إلا طيبا، وقد قال عليه الصلاة والسلام: «لا يقبل الله صدقة من غلول»(١).", "وأما الأجود: فقد قال عز وجل: ﴿وَلَا تَيَمَّمُوا۟ ٱلْخَبِيثَ مِنْهُ تُنفِقُونَ﴾ [البقرة: ٢٦٧] وينبغي أن يلاحظ في هذا أمرين:", "أحدهما: حق الله سبحانه بالتعظيم له، فإنه أحق من اختير له، ولو أنه قدم إلى ضيفه طعاما رديا لأوغر صدره، وقد قال تعالى: ﴿وَيَجْعَلُونَ لِلَّهِ مَا يَكْرَهُونَ﴾ [النحل: ٦٢].", "حاشية: (١) أخرجه مسلم (٢٢٤)، والترمذي (١)، وابن ماجه (٢٧٢)، وأحمد (٥٢٠٥) وأبو يعلى (٥٦١٤)، وابن أبي شيبة ١/ ٤ ـ ٥ من حديث ابن عمر.", "والثاني: حق نفسه، فإن الذي يقدمه هو الذي يلقاه في القيامة، فينبغي أن يختار الأجود من ماله لنفسه.", "وأما أحبه إليه؛ فقد قال تعالى: ﴿لَن تَنَالُوا۟ ٱلْبِرَّ حَتَّىٰ تُنفِقُوا۟ مِمَّا تُحِبُّونَ﴾ [آل عمران: ٩٢]، أخبرنا عبد الأول، قال: أخبرنا الداودي قال: أخبرنا ابن أعين قال: أخبرنا الفربري قال: أخبرنا البخاري قال: حدثنا عبد الله بن مسلمة عن مالك عن إسحاق بن عبد الله بن أبي طلحة أنه سمع أنس بن مالك يقول: كان أبو طلحة أكثر أنصاري بالمدينة مالا من نخل، وكان أحب أمواله إليه بيرحاء، وكانت مستقبلة المسجد، وكان النبي صلى الله عليه وسلم يدخلها ويشرب من ماء فيها طيب، قال أنس: فلما نزلت: ﴿لَن تَنَالُوا۟ ٱلْبِرَّ حَتَّىٰ تُنفِقُوا۟ مِمَّا تُحِبُّونَ﴾ قام أبو طلحة فقال: يا رسول الله صلى الله عليه وسلم: إن الله يقول: ﴿لَن تَنَالُوا۟ ٱلْبِرَّ حَتَّىٰ تُنفِقُوا۟ مِمَّا تُحِبُّونَ﴾ وإن أحب الأموال إلي بيرحاء، وإنها صدقة لله أرجو برها وذخرها عند الله، فضعها حيث أراك الله. فقال: «بخ ذاك مال رابح أو رايح» شك ابن مسلمة «وقد سمعت ما قلت وإني أرى لك أن تجعلها في الأقربين» قال أبو طلحة: أفعل ذلك يا رسول الله، فقسمها أبو طلحة في أقاربه وبني عمه. أخرجاه في الصحيحين(١).", "وفي أفراد مسلم من حديث عمر بن الخطاب أنه أتى النبي صلى الله عليه وسلم فقال: يا رسول الله أصبت أرضا لم أصب مالا أحب إلي ولا أنفس عندي منها، فقال: «إن شئت تصدقت بها» فتصدق بها عمر(٢).", "قال نافع: وكان ابن عمر إذا اشتد عجبه بشيء من ماله قربه لربه عز وجل، وكان رقيقه قد عرفوا ذلك منه فربما شمر أحدهم فيلزم المسجد، فإذا رآه ابن عمر على تلك الحال الحسنة أعتقه، فيقول له أصحابه: يا أبا عبد الرحمن، والله ما بهم إلا أن يخدعوك، فيقول ابن عمر: فمن خدعنا بالله انخدعنا له. قال نافع: ولقد رأيتنا ذات عشية وراح ابن عمر على نجيب(٣) له قد أخذه بمال، فلما أعجبه سيره"]], "ic": "book"}, {"story": ["كتاب أسرار الزكاة ومهماتها (١٠ من ١٦)، ص١٦٩", ["حاشية: (١) أخرجه البخاري (١٤٦١)، ومسلم (٩٩٨).", "حاشية: (٢) أخرجه مسلم (١٦٣٢).", "حاشية: (٣) النجيب: الكريم من الإبل.", "أناخه مكانه ثم نزل عنه فقال: يا نافع انزعوا زمامه ورحله وحللوه وأشعروه(١) وأدخلوه في البدن(٢).", "وروى سعيد بن أبي هلال أن ابن عمر نزل الجحفة(٣) وهو شاك(٤) فقال: إني لأشتهي حيتانا. فالتمسوا له فلم يجدوا إلا حوتا، فأخذته امرأته فصنعته ثم قربته إليه، فأتى مسكين، فقال ابن عمر: خذه، فقال أهله: سبحان الله! قد عنيتنا، ومعنا زاد نعطيه. فقال: إن عبد الله يحبه.", "وروى نسير أن سائلا وقف بباب الربيع بن خثيم، فقال: أطعموه سكرا. فقالوا: نطعمه خبزا أنفع له، فقال: ويحكم أطعموه سكرا، فإن الربيع يحب السكر.", "**الثامنة:** أن يطلب لصدقته من تزكوا به الصدقة، وهم خصوص من عموم الأصناف الثمانية ولهم صفات ست:", "**الأولى:** التقوى، فليخص بصدقته المتقين، فإنه يرد بها همهم إلى الله تعالى إذا شتتتها الحاجة.", "وقد كان عامر بن عبد الله بن الزبير يتحين العباد وهم سجود؛ أبا حازم وصفوان بن سليم وسليمان بن سحيم وأشباههم، فيأتيهم بالصرة فيها الدنانير والدراهم فيضعها عند نعالهم بحيث يحسون بها ولا يشعرون بمكانه، فقيل له: ما يمنعك أن توجه بها إليهم؟ فيقول: أكره أن يتمعر وجه أحدهم إذا نظر إلى رسولي أو لقيني.", "وبعث ابن المنكدر شيئا إلى صفوان بن سليم ثم قال لبنيه: ما ظنكم بمن فرغ صفوان للعبادة؟", "حاشية: (١) أشعروه: أعلموه لكي يعرف أنه من الهدي.", "حاشية: (٢) البدن: جمع بدنة، وهي ما يهدى للحرم من الإبل والبقر.", "حاشية: (٣) الجحفة: قرية على بعد اثنين وثمانين ميلا من مكة، وهي ميقات أهل الشام.", "حاشية: (٤) أي: مريض.", "**الصفة الثانية:** العلم، فإن في إعطاء العالم إعانة على العلم، وبالعلم ينتشر الدين وذلك تقوية للشريعة.", "**الثالثة:** أن يكون ممن يرى الإنعام من الله وحده ولا يلتفت إلى الأسباب إلا بقدر ما ندب إليه من شكرها، فأما الذي عادته المدح لأجل الإعطاء، فإنه سيندم حين المنع.", "**الرابعة:** أن يكون صائنا لفقره ساترا لحاجته كاتما للشكوى، إما لكونه من المعاملين بالفقر، أو لأنه ممن كان يألف المروءة فذهبت نعمته وبقي عليه أثر التجمل، كما قال تعالى: ﴿يَحْسَبُهُمُ ٱلْجَاهِلُ أَغْنِيَآءَ مِنَ ٱلتَّعَفُّفِ﴾ [البقرة: ٢٧٣]. ومثل هؤلاء لا يحصلون في شبكة طالب إلا بعد البحث عنهم، وسؤال أهل كل محلة عمن هذه صفته.", "**الخامسة:** أن يكون ذا عائلة أو محبوسا بمرض أو دين فهذا(١) من المحصرين، والتصدق عليه إطلاق لحصره."]], "ic": "book"}, {"story": ["كتاب أسرار الزكاة ومهماتها (١١ من ١٦)، ص١٧١", ["**السادسة:** أن يكون من الأقارب وذوي الأرحام الذين لا تلزمه نفقتهم، فيكون التصدق عليه صدقة وصلة، وهو أولى من جميع البعداء، وإن كانت خلالهم أزكى، فقد روى سلمان بن عامر عن النبي صلى الله عليه وسلم أنه قال: «الصدقة على ذي الرحم اثنتان: صدقة وصلة»(٢).", "وروى أبو أيوب الأنصاري عن النبي صلى الله عليه وسلم أنه قال: «إن أفضل الصدقة الصدقة على ذي الرحم الكاشح»(٣).", "وكل من جمع من هذه الخلال خلتين أو أكثر كان إعطاؤه أفضل على قدر ما جمع.", "حاشية: (١) تحرفت في الأصل إلى: «قهرا».", "حاشية: (٢) أخرجه الترمذي (٦٥٨)، والنسائي ٥/ ٩٢.", "حاشية: (٣) أخرجه أحمد (٢٣٥٣٠)، والطبراني في الكبير (٤٠١٥)، والأوسط (٣٣٠٣)، وأبو نعيم في أخبار أصبهان ٢/ ١٢ ـ ١٣ من حديث أبي أيوب الأنصاري. والكاشح: القاطع المعرض.", "**الفصل الثالث**", "**في القابض وأسباب استحقاقه ووظائف قبضه**", "اعلم أنه لا يستحق الزكاة إلا حر مسلم ليس بهاشمي وفي المطلبي روايتان.", "ويكون في المستحق صفة من أوصاف الأصناف الثمانية المذكورتين في القرآن.", "**الصنف الأول:** الفقراء، وهم الذين يقدرون على ما يقع موقعا من كفياتهم، وهم أشد حاجة من المساكين، فيدفع إليهم ما يسد حاجتهم(١).", "**الصنف الثاني:** المساكين، وهم الذين يقدرون على معظم كفايتهم فيدفع إليهم ما تتم به الكفاية، ولا يخرج المسكين عن المسكنة دار يسكنها وأثاثها مما يحتاج إليه وثوب يستره على قدر حاله، وكتب العلم التي يحتاج إليها، فإن حكمها حكم الأثاث المحتاج إليه.", "**الصنف الثالث:** العاملون عليها، وهم السعاة الذين يجمعونها، ومن شرط الساعي أن يكون بالغا عاقلا أمينا، ويجوز أن يكون غنيا أو عبدا أو من ذوي القربى؛ لأن ما يأخذه أجرة معلومة يقاطعه(٢) الإمام عليها، وهل يجوز أن يكون كافرا؟ فيه روايتان عن أحمد.", "**الصنف الرابع:** المؤلفة قلوبهم، وهم السادة المطاعون في عشائرهم، وهم ضربان: كفار ومسلمون؛ فأما الكفار، فضربان: من يرجى إسلامه، ومن يخاف شره، فيجوز أن يتألفهم بمال الزكاة إن كان في ذلك مصلحة للإسلام في أشهر الروايتين، ونقل حنبل أن حكمهم انقطع.", "وأما مؤلفة المسلمين، فعلى ضروب: منهم من له شرف يرجى بإعطائه إسلام نظيره، ومنهم من يشك في حسن إسلامه، ويرجى بإعطائه تقوية إيمانه ومناصحته في الجهاد، ومنهم قوم في أطراف بلاد الإسلام إن أعطوا دفعوا عن المسلمين،", "حاشية: (١) في (ظ): «خلتهم».", "حاشية: (٢) قاطع فلان فلانا على كذا وكذا من الأجر والعمل، أي: ولاه إياه بأجرة معينة.", "ومنهم قوم إذا أعطوا جبوا الزكوات ممن لا يعطيها إلا أن يخاف، وكل هؤلاء يجوز الدفع إليهم من الزكاة.", "**الصنف الخامس:** الرقاب، وفيهم روايتان عن الإمام أحمد رحمه الله:"]], "ic": "book"}, {"story": ["كتاب أسرار الزكاة ومهماتها (١٢ من ١٦)، ص١٧٣", ["إحداهما: أنهم المكاتبون فقط إذا لم يكن معهم ما يؤدون دفع إليهم بقدر ما يؤدون، والرواية الأخرى: أن الرقاب جميع الرقيق من المكاتبين وغيرهم، فيجوز أن يشتري من زكاته رقبته فيعتقها إذا كانت ممن لا يعتق عليه بالرحم، ويجوز أن يفتك(١) بزكاته أسيرا مسلما في يد المشركين.", "**الصنف السادس:** الغارمون، وهم صنفان: صنف غرم لإصلاح ذات البين، فيدفع إليه وإن كان غنيا، وصنف غرم لمصلحة نفسه في مباح، فيعطى مع العجز عن قضاء الدين، فإن غرم في معصية لم يعط إلا أن يتوب.", "**الصنف السابع:** الغزاة الذين لا حق لهم في الديوان، فيدفع إليهم ما يكفيهم لغزوهم وإن كانوا أغنياء، فإن لم يغزوا استرجع ذلك منهم.", "**الصنف الثامن:** ابن السبيل، وهو المسافر المنقطع به دون المنشئ للسفر من بلده، فيعطى بقدر ما يوصله إلى بلاده ولا يزاد على ذلك، فإن كان سفره في معصية لم يدفع إليه.", "**بيان وظائف القابض**", "وهي أربع:", "**الوظيفة الأولى:** أن يفهم أن الله تعالى إنما أوجب صرف الزكاة إليه ليكفيه مهمه ويجعل همومه هما واحدا في طلب رضى الله سبحانه، فإنه لما بث النعم على الأغنياء وحماء فضولها ثم ساق إليه قدر حاجته أنعم عليه بالسلامة من مخاطرة الأغنياء، فينبغي أن يعرف نعمته فيما زواه عنه، وفيما فرض له، فليستعن بذلك على تقوى الله عز وجل.", "حاشية: (١) في الأصل: «يفك».", "**الوظيفة الثانية:** أن يشكر المعطي ويدعو له ويثني عليه، وليكن ذلك بمقدار شكر السبب، فقد قال عليه الصلاة والسلام: «من لم يشكر الناس لم يشكر الله»(١). وقال: «من أسدى إليكم معروفا فكافئوه، فإن لم تستطيعوا، فادعوا له حتى تعلموا أنكم قد كافأتموه»(٢).", "ومن تمام الشكر أن لا يحتقر العطاء وإن قل ولا يذمه، ويغطي ما فيه من عيب فكما أن وظيفة المعطي الاستصغار فوظيفة المعطى الاستعظام، وكل ذلك لا يناقض رؤية النعمة من الله عز وجل، فإن من لا يرى الواسطة واسطة فهو جاهل، وإنما المنكر أن يرى الواسطة أصلا. وقد قال النبي صلى الله عليه وسلم: «ما نفعني مال كمال أبي بكر»(٣). وقال: «إن أمن الناس علي في صحبته وماله أبو بكر»(٤). وقال: «ما لأحد عندنا يد إلا وقد كافيناه ما خلا أبي بكر، فإن له عندنا يدا يكافيه الله بها يوم القيامة»(٥).", "**الوظيفة الثالثة:** أن ينظر فيما يعطاه، فإن لم يكن من حل لم يأخذه أصلا؛ لأن إخراج مال الغير ليس بزكاة، وإن كان من شبهة تورع عنه إلا أن يضيق عليه الأمر، فإنه إذا أخرج الزكاة من أكثر كسبه من الحرام ولم يعرف لما أخرجه مالك معين كانت الفتوى أن يتصدق به، فيجوز لهذا الفقير أن يأخذ قدر حاجته عند ضيق الأمر عليه وعجزه عن كمال الصافي فيه."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "ولا يؤخذ في الصدقة الربى وهي التي تربي ولدها، ولا الماخض، وهي الحامل، ولا ما طرقها الفحل؛ لأن الغالب أنها حامل، ولا الأكولة، وهي السمينة، ولا فحل الغنم المعد ____، ولا حزرات المال، وهي خياره، ولا هرمة، ولا ذات عوار", "o": ["للضراب", "غضون", "وقوف", "المواريث"], "h": "راجع: ص١٦٠"}, {"t": "fill", "d": 2, "q": "ومن ملك ذهبا مغشوشا أو فضة مغشوشة فلا زكاة حتى يبلغ مقدار الذهب والفضة نصابا، ويخرج عن الصحاح ____ من جنسها، فإن أخرج مكسرة أو بهرجة زاد فيما يخرج مقدار ما بينهما من الفضل", "o": ["صحاحا", "صيامك", "الرعاع", "عديدة"], "h": "راجع: ص١٦٢"}, {"t": "fill", "d": 2, "q": "السادسة: أن يكون من الأقارب وذوي الأرحام الذين لا تلزمه نفقتهم، فيكون التصدق عليه صدقة وصلة، وهو أولى من ____ البعداء، وإن كانت خلالهم أزكى، فقد روى سلمان بن عامر عن النبي صلى الله عليه وسلم أنه", "o": ["جميع", "ههنا", "النهج", "وارثه"], "h": "راجع: ص١٧١"}, {"t": "fill", "d": 2, "q": "الوظيفة الثالثة: أن ينظر فيما يعطاه، فإن لم يكن من حل لم يأخذه أصلا؛ لأن إخراج مال الغير ليس بزكاة، وإن كان من شبهة تورع عنه إلا أن يضيق عليه الأمر، فإنه إذا أخرج ____ من أكثر كسبه من الحرام", "o": ["الزكاة", "الحصين", "وسماع", "محفوظ"], "h": "راجع: ص١٧٤"}, {"t": "fill", "d": 2, "q": "الصنف السابع: الغزاة الذين لا حق لهم في الديوان، فيدفع إليهم ما ____ لغزوهم وإن كانوا أغنياء، فإن لم يغزوا استرجع ذلك", "o": ["يكفيهم", "بعدك", "والشك", "فعشرة"], "h": "راجع: ص١٧٣"}, {"t": "fill", "d": 2, "q": "وأما الغنم فلا شيء فيها حتى تبلغ أربعين فيجب فيها شاة، وفي المائة وإحدى وعشرين شاتان، وفي ماتين وواحدة ثلاث شياه إلى أربعمائة، فيكون في كل مئة شاة، وعن الإمام أحمد ____ الله أنها إذا بلغت ثلثمائة وواحدة ففيها أربع شياه، ثم في كل مائة شاة", "o": ["رحمه", "سالمة", "يؤثره", "اختلف"], "h": "راجع: ص١٦٠"}]}, {"t": "كتاب أسرار الزكاة ومهماتها - القسم ٣ من ٣", "b": [{"story": ["كتاب أسرار الزكاة ومهماتها (١٣ من ١٦)، ص١٧٤", ["حاشية: (١) أخرجه أبو داود (٤٨١١)، والترمذي (١٩٥٤)، وأحمد (٧٥٠٤)، وابن حبان (٣٤٠٧)، والطيالسي (٢٤٩١)، والبخاري في الأدب المفرد (٢١٨) من حديث أبي هريرة.", "حاشية: (٢) أخرجه أبو داود (٥١٠٩)، والنسائي في الكبرى (٢٣٤٨)، وأحمد (٥٣٦٥)، والطيالسي (١٨٩٥)، والبيهقي في السنن ٤/ ١٩٩، والحاكم ١/ ٤١٢، وأبو نعيم في الحلية ٩/ ٥٦ من حديث ابن عمر.", "حاشية: (٣) أخرجه الترمذي (٣٧١٤)، وابن أبي عاصم في السنة ٢/ ٥٧٧، وابن الجوزي في العلل المتناهية ١/ ٢٥٣، والعقيلي في الضعفاء ٤/ ٢١٠ من حديث أبي هريرة.", "حاشية: (٤) أخرجه البخاري (٤٦٦) و(٣٦٥٤)، ومسلم (٢٣٨٢)، وأحمد ٣/ ١٨، وابن أبي شيبة ٦/ ١٢، وابن حبان (٦٥٩٤)، وابن سعد ٢/ ٢٢٧، وابن أبي عاصم في السنة (١٢٢٧).", "حاشية: (٥) هو قطعة من الحديث ما قبل السابق.", "**الوظيفة الرابعة:** أن يتوقى مواقع الريبة والاشتباه في مقدار ما يأخذ، فلا يأخذ إلا إذا تحقق أنه موصوف بصفة الاستحقاق، فيأخذ القدر المباح له، فإن كان يأخذ لأجل الغرم لم يزد على مقدار الدين، أو لأجل الغزو لم يزد على مقدار ما يحتاج إليه، فإن أخذ بالمسكنة، فلينظر إلى أثاث بيته وثيابه وكتبه هل فيها ما يستغنى عنه وكل ذلك موكول إلى اجتهاده وقدر حاجته وحاجة عياله، والورع ترك ما يريب.", "وقد اختلف العلماء في الغنى المانع من أخذ الزكاة؛ فقال قوم: خمسون درهما أو قيمتها من الذهب. وقال آخرون: هو أن يملك عشرين دينارا.", "والصحيح: أن الغني المانع من أخذ الزكاة أن تكون له كفاية على الدوام إما من تجارة أو صناعة أو أجرة عقار أو غير ذلك، فإن كان له بعض الكفاية أخذ ما يتممه به، وإن لم يكن له أصلا أخذ ما يكفيه، وليكن ما يأخذه بقدر ما يكفي سنة، وأن لا يزيد على ذلك، وإنما اعتبرنا السنة؛ لأنها إذا ذهبت جاء وقت الأخذ، فإذا أخذ لأكثر من سنة ضيق على الفقراء.", "**الفصل الرابع**", "**في صدقة التطوع وفضلها وآداب أخذها وإعطائها**", "**بيان فضيلة الصدقة من الأخبار والآثار والحث على الصدقة**", "روى البخاري ومسلم في صحيحيهما من حديث حارثة بن وهب الخزاعي، قال: سمعت رسول الله صلى الله عليه وسلم يقول: «تصدقوا فيوشك الرجل يمشي بصدقته، فيقول الذي أعطيها له: لو جئتنا بها بالأمس قبلتها، وأما الآن فلا حاجة لي بها، فلا يجد من يقبلها»(١)، وفي أفراد البخاري من حديث ابن مسعود قال: قال رسول الله صلى الله عليه وسلم: «أيكم مال وارثه أحب إليه من ماله؟» قالوا: يا رسول الله ما منا أحد إلا ماله أحب إليه، قال: «فإن ماله ما قدم، ومال وارثه ما أخر»(٢). وفي أفراد مسلم من حديث", "حاشية: (١) أخرجه البخاري (١٤١١)، و(١٤٢٤) و(٧١٢٠)، ومسلم (١٠١١).", "حاشية: (٢) أخرجه البخاري (٦٤٤٢)."]], "ic": "book"}, {"story": ["كتاب أسرار الزكاة ومهماتها (١٤ من ١٦)، ص١٧٦", ["أبي سعيد الخدري قال: بينا نحن في سفر مع النبي صلى الله عليه وسلم إذ جاء رجل على راحلة له، فجعل يصرف بصره يمينا وشمالا، فقال رسول الله صلى الله عليه وسلم: «من كان معه فضل ظهر، فليعد به على من لا ظهر له، ومن كان له فضل زاد فليعد به على من لا زاد له» قال: فذكر من أصناف المال حتى رأينا أنه لا حق لأحد منا في فضل(١).", "**فضيلة الصدقة**", "أنبأنا هبة الله بن محمد قال: أخبرنا الحسن بن علي التميمي قال: أخبرنا أحمد بن جعفر القطيعي قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا أبو النضر وحسن بن موسى قالا: حدثنا ورقاء عن عبد الله بن دينار عن سعيد بن يسار عن أبي هريرة قال: قال رسول الله صلى الله عليه وسلم: «من تصدق بعدل تمرة من كسب طيب، ولا يصعد إلى الله إلا طيب، فإن الله يقبلها بيمينه، ثم يربيها لصاحبها كما يربي أحدكم فلوه حتى تكون مثل الجبل»(٢) أخرجاه في الصحيحين. وفيهما من حديث عدي بن حاتم عن النبي صلى الله عليه وسلم أنه قال: «من استطاع منكم أن يتقي النار ولو بشق تمرة فليفعل»(٣). وفي أفراد مسلم من حديث أبي مسعود الأنصاري قال: جاء رجل بناقة مخطومة(٤) فقال: هذه في سبيل الله. فقال رسول الله صلى الله عليه وسلم: «لك بها يوم القيامة سبعمائة ناقة كلها مخطومة»(٥).", "أخبرنا يحيى بن علي قال: أخبرنا أبو جعفر ابن المسلمة قال: أخبرنا أبو الحسين ابن أخي ميمي قال: حدثنا البغوي قال: حدثنا عقبة بن مكرم قال: حدثنا عبد الله بن عيسى الخزاز عن يونس بن عبيد عن الحسن عن أنس قال: قال رسول الله صلى الله عليه وسلم: «إن الصدقة لتطفئ غضب الرب، وتدفع ميتة السوء»(٦).", "حاشية: (١) أخرجه مسلم (١٧٢٨).", "حاشية: (٢) أخرجه البخاري (١٤١٠) و(٧٤٣٠) ومسلم (١٠١٤)، والفلو: المهر، والأنثى فلوة.", "حاشية: (٣) أخرجه البخاري (١٤١٧)، ومسلم (١٠١٦).", "حاشية: (٤) مخطومة: أي عليها خطامها، والخطام: الزمام.", "حاشية: (٥) أخرجه مسلم (١٨٩٢).", "حاشية: (٦) أخرجه الترمذي (٦٦٤).", "أخبرنا سعيد بن أحمد قال: أخبرنا أبو القاسم بن البسري قال: حدثنا المخلص قال: حدثنا ابن صاعد قال: حدثنا محمد بن زنبور قال: حدثنا الحارث بن عمير عن حميد عن أنس عن النبي صلى الله عليه وسلم: «تصدقوا، فإن الصدقة فكاككم من النار»(١).", "أخبرنا محمد بن عبيد الله قال: أخبرنا عبد الله بن علي الدقاق قال: أخبرنا ابن بشران قال: أخبرنا إسماعيل الصفار قال: أخبرنا سعدان(٢) قال: حدثنا أبو معاوية قال: حدثنا الأعمش عن ابن بريدة عن أبيه قال: قال رسول الله صلى الله عليه وسلم: «ما يخرج أحد شيئا من الصدقة حتى يفك عنها لحيي سبعين شيطانا»(٣)."]], "ic": "book"}, {"story": ["كتاب أسرار الزكاة ومهماتها (١٥ من ١٦)، ص١٧٧", ["وقال مغيث بن سمي: تعبد راهب في صومعته ستين سنة، ثم نزل يوما ومعه رغيف فعرضت له امرأة فتكشفت له فوقع عليها، فأدركه الموت على تلك الحال، وجاء سائل فأعطاه الرغيف ومات، فجيء بعمل ستين سنة فوضع في كفة وجيء بخطيئته فوضعت في كفة فرجحت بعمله حتى جيء بالرغيف فوضع مع عمله فرجح بخطيئته(٤).", "وقال مالك بن دينار: أخذ السبع صبيا فتصدقت أمه برغيف، فرمي به السبع فنوديت: لقمة بلقمة(٥).", "وقال بشر بن الحارث الحافي: الصدقة أفضل من الحج والعمرة والجهاد.", "حاشية: (١) أخرجه الطبراني في الأوسط ٨/ ٩٠، والمنذري في الترغيب والترهيب ٢/ ١٢، وأورده العجلوني في كشف الخفاء ١/ ٣٦٣، والهيثمي في مجمع الزوائد ٣/ ١٠٦.", "حاشية: (٢) هو سعدان بن نصر البزار.", "حاشية: (٣) أخرجه أبو عبيد القاسم بن سلام في الأموال (٩٠٤)، وابن زنجويه في الأموال (٣٣١)، وابن خزيمة (٢٤٥٧)، وأحمد (٢٢٩٦٢)، والطبراني في الأوسط (١٠٣٨)، والحاكم ١/ ٤١٧، والبيهقي في السنن ٤/ ١٨٧، وفي الشعب (٣٤٧٤)، واللحيان: العظمان اللذان فيهما الأسنان من كل ذي لحي.", "حاشية: (٤) أخرجه ابن حبان في صحيحه (٣٧٨)، وأورده السيوطي في الجامع الكبير: ٤٧٣، والهندي في الكنز (١٦١٧٣).", "حاشية: (٥) أخرجه بنحوه أحمد في الزهد: ١٢٣.", "**التصدق بما حضر**", "روت أم بجيد(١) أنها قالت: يا رسول الله، إن المسكين ليقوم على بابي فما أجد له شيئا أعطيه إياه، فقال: «إن لم تجدي له شيئا تعطيه إياه إلا ظلفا محرقا، فادفعيه إليه في يده»(٢).", "وقد تصدقت عائشة رضي الله عنها بعنبة وقالت: إن فيها ذرا كثيرا(٣).", "وفي أفراد مسلم من حديث أبي هريرة عن النبي صلى الله عليه وسلم أنه قال: «ما نقصت صدقة من مال»(٤).", "**بيان أن الباقي ما أخرج لله تعالى**", "روت عائشة رضي الله عنها أنهم ذبحوا شاة، فقال النبي صلى الله عليه وسلم: «ما بقي منها؟» فقالت: ما بقي إلا كتفها، فقال: «بقي كلها غير كتفها»(٥).", "وفي أفراد مسلم من حديث أبي هريرة عن النبي صلى الله عليه وسلم أنه قال: «يقول العبد: مالي مالي، وإنما له ما أكل فأفنى، أو لبس فأبلى، أو أعطى فاقتنى، ما سوى ذلك فهو ذاهب وتاركه للناس»(٦).", "**ذكر أفضل أوقات الصدقة**", "أخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أحمد بن جعفر", "حاشية: (١) هي أم بجيد الأنصارية الحارثية، واسمها حواء، وهي مشهورة بكنيتها.", "حاشية: (٢) أخرجه أحمد (٢٧١٥٠)، والطيالسي (١٦٥٩)، وابن أبي عاصم في الآحاد والمثاني (٣٣٨٦)، والطبراني في الكبير ٢٤/ (٥٦٠)، وابن عبد البر في التمهيد ٤/ ٢٩٩، وابن سعد ٨/ ٤٥٩، وأبو داود (١٦٦٧)، والترمذي (٦٦٥)، وابن خزيمة (٢٤٧٣)، وابن حبان (٣٣٧٣)، والحاكم ١/ ٤١٧، والبيهقي ٤/ ١٧٧.", "حاشية: (٣) أخرجه مالك في الموطأ (٢١٠٦)، وأبو عبيد في الأموال (٩١٠).", "حاشية: (٤) أخرجه مسلم (٢٥٨٨).", "حاشية: (٥) أخرجه الترمذي (٢٤٧٢)."]], "ic": "book"}, {"story": ["كتاب أسرار الزكاة ومهماتها (١٦ من ١٦)، ص١٧٨", ["حاشية: (٦) أخرجه مسلم (٢٩٥٩).", "قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا جرير بن عبد الحميد عن عمارة بن القعقاع عن أبي زرعة عن أبي هريرة قال: سئل رسول الله صلى الله عليه وسلم: أي الصدقة أفضل؟ قال: «أن تصدق وأنت صحيح شحيح، تأمل البقاء وتخاف الفقر، ولا تمهل حتى إذا بلغت الحلقوم قلت: لفلان كذا ولفلان كذا ألا وقد كان لفلان»(١) أخرجاه في الصحيحين.", "**فصل**", "فأما الكلام في إخفاء الصدقة وإظهارها، فقد سبق في ذكر الآداب الباطنة في الزكاة(٢)، وقد اختلفوا أيما أفضل للفقير: أن يأخذ من الزكاة أو من الصدقة؟ فقال قوم: من الصدقة، وعللوا بأن الأخذ من الزكاة مزاحمة للمساكين وتضييق عليهم، وربما لم تكمل صفة الاستحقاق في حق الآخذ، والأمر في الصدقة أوسع. وقال قوم: بل من الزكاة، وعللوا بأنه إعانة على أداء الواجب، ولأنها لا منة فيها للمخلوقين، ولأنها أخذ بالحاجة، والإنسان يعلم حاجة نفسه، فأما الصدقة، فإنها أخذ بالدين؛ لأن الغالب في حق المتصدق أنه إنما يعطي من يعتقد فيه خيرا، ولأن موافقة المساكين أدخل في الذل والمسكنة، وأبعد من الكبر.", "والصواب أن يقال: إن الأحوال تختلف باختلاف أحوال الشخص وما يحضره من النية، فإن كان في ريب من اتصافه بصفة الاستحقاق كان ترك الزكاة في حقه أولى، وإن علم أنه مستحق قطعا فهو مخير بين الزكاة والصدقة، فإن كان المتصدق لا يخرج ذلك المال إلا أن يأخذه هذا الفقير، فليأخذه لتصرف الزكاة إلى مستحقيها ويكثر الخير، وإن كان المال معرضا للصدقة ولم يكن في أخذ ا لزكاة تضييق على المساكين، فهو مخير، والأمر فيهما متقارب، وأخذ الزكاة أشد في كره النفس وإذلالها في أغلب الأحوال.", "**آخر كتاب الزكاة.**", "حاشية: (١) أخرجه البخاري (١٤١٩)، ومسلم (١٠٣٢)(٩٣).", "حاشية: (٢) في الصفحة (١٦٦) وما بعدها."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "قال نافع: وكان ابن عمر إذا اشتد عجبه بشيء من ماله قربه لربه عز وجل، وكان رقيقه قد عرفوا ذلك منه فربما شمر أحدهم فيلزم المسجد، ____ رآه ابن عمر على تلك الحال الحسنة أعتقه، فيقول له أصحابه: يا أبا عبد", "o": ["فإذا", "تجارة", "لوقته", "يعقوب"], "h": "راجع: ص١٦٩"}, {"t": "fill", "d": 2, "q": "والأفضل إخراج الفطرة قبل صلاة العيد، ويجوز إخراجها قبل ذلك بيومين، فإن أخرها عن يوم العيد أثم، ____ عليه القضاء", "o": ["ووجب", "ونسيم", "عصبه", "يشرب"], "h": "راجع: ص١٦٤"}, {"t": "fill", "d": 2, "q": "إحداهما: أنهم المكاتبون فقط إذا لم يكن معهم ما يؤدون دفع إليهم بقدر ما يؤدون، والرواية الأخرى: أن الرقاب جميع الرقيق من المكاتبين وغيرهم، ____ أن يشتري من زكاته رقبته فيعتقها إذا كانت ممن لا يعتق", "o": ["فيجوز", "القرى", "وليوتر", "علامات"], "h": "راجع: ص١٧٣"}, {"t": "fill", "d": 2, "q": "وفي أفراد مسلم من حديث أبي هريرة عن النبي صلى الله عليه ____ أنه قال", "o": ["وسلم", "جابر", "الطبعة", "يهجس"], "h": "راجع: ص١٧٨"}, {"t": "fill", "d": 2, "q": "الصنف الثاني: المساكين، وهم الذين يقدرون على معظم كفايتهم فيدفع إليهم ما تتم به الكفاية، ولا يخرج المسكين عن المسكنة دار يسكنها وأثاثها مما يحتاج إليه وثوب يستره على قدر حاله، ____ العلم التي", "o": ["وكتب", "بأوريا", "وأمرا", "فهذان"], "h": "راجع: ص١٧٢"}, {"t": "fill", "d": 2, "q": "ولا زكاة في الحلي المباح إذا كان معدا للاستعمال، والمباح للرجال من الفضة الخاتم وقبيعة السيف، وفي حلية المنطقة روايتان، وعلى ____ الجوشن، والخوذة، والخف، والران، والحمائل، ومن الذهب ما دعت إليه الضرورة كالأنف وما تربط به الأسنان", "o": ["قياسها", "الطفاوية", "المطلع", "فضيل"], "h": "راجع: ص١٦٢"}]}], "sum": [["الصفحات", "ص١٥٧ - ص١٨٠"]], "_nq": 18}, {"id": "l23", "title": "كتاب أسرار الصوم ومهماته", "group": "كتاب أسرار الصوم ومهماته", "map": {"center": "كتاب\nأسرار الصوم", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "كتاب أسرار الصوم ومهماته - القسم ١ من ٢", "b": [{"pic": ["books", "book"], "cap": "ص١٨١ - ص١٩٦"}, {"story": ["كتاب أسرار الصوم ومهماته (١ من ١٠)، ص١٨١", ["الحمد لله الذي فتح للمؤمنين باب القرب إلى الجنة، فجعل الصلاة لهم صلة والصوم جنة، وأعاد بالرياضة النفس الأمارة مطمئنة، فقويت بالمنة عليهم في المجاهدة المنة، وأبعد الكافرين فسلط عليهم الجنة، فمنعوهم الهدى فقالوا: قلوبنا في أكنة.", "أحمده على التوفيق لسنن السنة، وأصلي على رسوله محمد أشرف راكب جاذب الأعنة، وعلى آله وأصحابه أولي الفهوم المرجحنة، وأسلم تسليما كثيرا.", "أما بعد، فإن للصوم خصيصة ليست لغيره، وهو إضافته إلى الله عز وجل من بين العبادات حين قال: «الصوم لي»(١)، والمقصود من هذا الكتاب ينحصر في أربعة فصول:", "**الفصل الأول:** في بيان فضل الصوم، والثاني في الواجبات والسنن الظاهرة، واللوازم بإفساده، والثالث: في أسرار الصوم وشروطه الباطنة، والرابع في التطوع بالصيام وترتيب الأوراد فيه.", "**الفصل الأول**", "**في بيان فضل الصوم**", "أخبرنا هبة الله بن محمد قال: أخبرنا الحسن بن علي التميمي قال: أخبرنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد بن حنبل قال: حدثني أبي قال:", "حاشية: (١) سيأتي بتمامه في الصفحة التالية.", "حدثنا وكيع قال: حدثنا الأعمش عن أبي صالح عن أبي هريرة قال: قال رسول الله صلى الله عليه وسلم: «كل عمل ابن آدم يضاعف الحسنة بعشر أمثالها إلى سبعمائة ضعف إلى ما شاء الله، يقول الله عز وجل: إلا الصوم فإنه لي وأنا أجزي به يدع طعامه وشهوته من أجلي، وللصائم فرحتان: فرحة عند فطره وفرحة عند لقاء ربه، ولخلوف فيه أطيب عند الله من ريح المسك، الصوم جنة الصوم جنة»(١).", "قال الإمام أحمد: وحدثنا أحمد بن عبد الملك قال: حدثنا حماد بن زيد عن أبي حازم عن سهل بن سعد عن النبي صلى الله عليه وسلم أنه قال: «إن للجنة بابا يقال له: الريان، يقال يوم القيامة: أين الصائمون هلموا إلى الريان، فإذا دخل آخرهم أغلق ذلك الباب» وفي لفظ: «فلم يدخل منه أحد غيرهم»(٢).", "قال أحمد: وحدثنا يعقوب قال: حدثني أبي عن صالح عن ابن شهاب: حدثني نافع ابن أبي أنس أن أباه حدثه أنه سمع أبا هريرة يقول: قال رسول الله صلى الله عليه وسلم: «إذا دخل رمضان فتحت أبواب الرحمة، وغلقت أبواب جهنم، وسلسلت الشياطين»(٣) وفي لفظ: «فتحت أبواب الجنة»(٤) وفي لفظ: «أبواب السماء»(٥). هذه الأحاديث الثلاثة متفق عليها.", "وفي حديث أبي أمامة قال: قلت: يا رسول الله، مرني بعمل آخذه عنك ينفعني الله به. قال: «عليك بالصوم فإنه لا مثل له» قال: فكان أبو أمامة وامرأته وخادمه لا يلقون إلا صياما وإذا رأوا نارا أو دخانا بالنهار في منزلهم عرفوا أنهم اعتراهم ضيف(٦).", "أخبرنا عبد الوهاب الأنماطي قال: حدثنا حمد بن أحمد الحداد قال: حدثنا", "حاشية: (١) أخرجه البخاري (١٩٠٤)، ومسلم (١١٥١)(١٦٤).", "حاشية: (٢) أخرجه البخاري (١٨٦٩)، ومسلم (١١٥٢).", "حاشية: (٣) أخرجه البخاري (٣٢٧٧)، ومسلم (١٠٧٩)(٢)."]], "ic": "book"}, {"story": ["كتاب أسرار الصوم ومهماته (٢ من ١٠)، ص١٨٢", ["حاشية: (٤) هو عند مسلم (١٠٧٩)(١).", "حاشية: (٥) هو عند البخاري (١٨٩٩).", "حاشية: (٦) أخرجه أحمد (٢٢١٤٠)، والطبراني في الكبير (٧٤٦٥)، وأبو نعيم في الحلية ٥/ ١٧٥.", "أحمد بن عبد الله الأصبهاني قال: حدثنا حبيب بن الحسن قال: حدثنا عمر بن حفص السدوسي قال: حدثنا عاصم بن علي قال: حدثنا مهدي بن ميمون عن واصل مولى أبي عيينة عن لقيط عن أبي بردة عن أبي موسى قال: خرجنا غازين في البحر فبينما نحن والريح لنا طيبة والشراع لنا مرفوع سمعنا مناديا ينادي: يا أهل السفينة قفوا أخبركم. حتى والى بين سبعة أصوات، قال أبو موسى: فقمت على صدر السفينة فقلت: من أنت؟ ومن أين أنت؟ أو ماترى أين نحن وهل نستطيع وقوفا؟! قال: فأجابني الصوت: ألا أخبركم بقضاء قضاه الله على نفسه؟ قال: قلت: بلى أخبرنا. قال: فإن الله قضى على نفسه أنه من عطش نفسه لله في يوم حار كان حقا على الله أن يرويه يوم القيامة. قال: فكان أبو موسى يتوخى ذلك اليوم الحار الشديد الحر الذي يكاد ينسلخ فيه الإنسان فيصومه(١).", "واعلم أن من أعظم فضائل الصوم إضافته إلى الله سبحانه حين قال: «الصوم لي» وكفى بهذه الإضافة شرفا، فإن البيت إنما شرف بإضافته إليه في قوله تعالى: ﴿وَطَهِّرْ بَيْتِيَ﴾ [الحج: ٢٦] وإنما فضله لمعنيين: أحدهما: أنه سر وعمل بالباطن لا يراه الخلق ولا يدخله الرياء. والثاني: أنه قهر لعدو الله لأن وسيلة العدو الشهوات، وإنما تقوى الشهوات بالأكل والشرب، وما دامت أرض الشهوات مخصبة فالشياطين يترددون إلى ذلك المرعى.", "**الفصل الثاني**", "**في الواجبات واللوازم بالإفطار والسنن الظاهرة**", "أما الواجبات الظاهرة، فستة(٢):", "**الأول:** مراقبة أول شهر رمضان، وذلك لرؤية الهلال، ويحصل ذلك بقول عدل واحد، ولا يقبل في سائر الشهور إلا عدلان، فإن حال دونه مطلعه غيم أو قتر ففيه ثلاث روايات عن الإمام أحمد رحمه الله؛ إحداهن: يجب صومه بنية رمضان.", "حاشية: (١) أخرجه أبو نعيم في الحلية ١/ ٢٦٠.", "حاشية: (٢) بعدها في الأصل: «أشياء».", "والثانية: لا يجب صومه، والثالثة: الناس تبع للإمام، فإن صام صاموا، فإن رآه أهل بلد لزم جميع البلاد الصوم.", "**الثاني:** النية، وهي واجبة في الليل لكل يوم من رمضان، وعن الإمام أحمد: تجزئ نية واحدة لجميع الشهر.", "**الثالث:** الإمساك عن إيصال شيء إلى الجوف، فمن أكل أو شرب أو استعط(١)، أو اكتحل بما يصل إلى جوفه أو قطر في أذنه فوصل إلى دماغه، أو داوى المأمومة(٢) والجائفة(٣) بما يصل إلى جوفه، أو احتقن أو حجم أو احتجم، أو استقاء أو استمنى ذاكرا للصوم عالما بالتحريم بطل صومه، وعليه أن يمسك بقية يومه ويقضي. وإن فعل ذلك ناسيا أو مكرها أو جاهلا التحريم لم يبطل صومه."]], "ic": "book"}, {"story": ["كتاب أسرار الصوم ومهماته (٣ من ١٠)، ص١٨٤", ["فأما ما يصل بغير قصد مثل الغبار والذباب، فإنه لا يضر، وكذلك إذا وصل إلى جوفه ماء المضمضة والاستنشاق بغير اختياره، إلا أن يكون قد زاد على الثلاث فيهما أو بالغ(٤) في الاستنشاق، فإنه يفطر في أحد الوجهين.", "**الرابع:** الإمساك عن الجماع فإنه يفسد صوم الرجل والمرأة، سواء كانا ذاكرين أو ناسيين، مختارين أو مكرهين.", "فأما الكفارة؛ فإنها تلزم الرجل مع زوال العذر، وهل يلزمه الإكراه أو النسيان؟ على روايتين.", "وأما المرأة فلا تلزمها الكفارة مع العذر، وهل تلزمها مع المطاوعة؟ على روايتين.", "وقد نقل ابن القاسم عن الإمام أحمد أنه قال: كل أمر غلب عليه الصائم،", "حاشية: (١) استعط: وضع دواء في أنفه.", "حاشية: (٢) المأمومة: الطعنة تصل أم الرأس وهي الدماغ.", "حاشية: (٣) الجائفة: الطعنة التي تصل إلى الجوف.", "حاشية: (٤) تحرفت في الأصل إلى: «تابع».", "فليس عليه قضاء ولا غيره، وهذا يدل على إسقاط القضاء والكفارة مع الإكراه والنسيان.", "فإن طلع الفجر وهو مجامع فاستدام فعليه القضاء والكفارة، وإن نزع ففيه وجهان: أحدهما عليه القضاء والكفارة. والثاني: لا قضاء ولا كفارة.", "فإن باشر في الصوم دون الفرج، أو قبل أو لمس أو كرر النظر فأمنى، فعليه القضاء، وفي الكفارة روايتان، وإن لمس فأمذى؛ فالقضاء وحده.", "والكفارة: عتق رقبة مؤمنة(١-١) سليمة عن العيوب(١-١)، فإن لم يجد، فصيام شهرين متتابعين، فإن لم يستطع أطعم ستين مسكينا، فإن لم يجد سقطت عنه.", "وعن الإمام أحمد أن الكفارة على التخيير بين العتق والصيام والإطعام.", "**الخامس:** الإمساك عن الاستمناء بجماع أو بغير جماع، فإن فكر فأنزل هل يفسد صومه؟ فيه وجهان.", "**السادس:** الإمساك عن إخراج القيء، وقد ذكرنا أنه إذا استقاء ذاكرا للصوم عالما بالتحريم بطل صومه، فأما إذا غلبه القيء فإنه لا يفطر، وهل يفسد صومه إذا ابتلع النخامة؟ فيه روايتان. فإن جمع ريقه في فمه ثم ابتلعه، فهل يفطر؟ فيه وجهان.", "**ذكر اللوازم بالإفطار**", "وهي أربعة: القضاء، والكفارة، والفدية، وإمساك بقية النهار تشبها(٢) بالصائمين.", "أما القضاء؛ فوجوبه عام(٣) على كل مسلم مكلف ترك الصوم بعذر أو غير عذر.", "حاشية: (١-١) سقط من (ظ).", "حاشية: (٢) في الأصل: «تشبيها».", "حاشية: (٣) ليست في الأصل.", "فأما الكفارة فتجب بالجماع، وهل تجب بغيره؟ قد سبق ذكره هذا.", "وأما الفدية فتجب على الحامل والمرضع إذا أفطرتا خوفا على ولديهما مع القضاء.", "وهي: إطعام مسكين ومقدارها مد من بر عن كل يوم أو نصف صاع من تمر أو شعير.", "فأما العاجز عن الصوم للكبر أو للمرض الذي لا يرجى برؤه، فإنه يطعم عن كل يوم مسكينا، ولا يجب عليه الصوم."]], "ic": "book"}, {"story": ["كتاب أسرار الصوم ومهماته (٤ من ١٠)، ص١٨٦", ["وأما إمساك بقية النهار تشبها بالصائمين فيجب على من عصى بالفطر، فإن أسلم الكافر، أو بلغ الصبي، أو أفاق المجنون في أثناء النهار لزمهم الإمساك والقضاء في إحدى الروايتين، وفي الأخرى لا يلزمهم. فإن طهرت الحائض والنفساء، وقدم المسافر، وقامت البينة برؤية الهلال في أثناء النهار لزمهم القضاء رواية واحدة، وفي وجوب الإمساك روايتان.", "**ذكر السنن**", "وهن تسع إحداهن: التسحر، ففي الصحيحين من حديث أنس عن النبي صلى الله عليه وسلم أنه قال: «تسحروا فإن في السحور بركة»(١). وفي حديث أبي سعيد الخدري عن النبي صلى الله عليه وسلم أنه قال: «السحور أكله بركة، فلا تدعوه ولو أن يجرع أحدكم جرعة من ماء، فإن الله عز وجل وملائكته يصلون على المتسحرين»(٢).", "**الثانية:** تأخير السحور، ففي الصحيحين من حديث زيد بن ثابت قال: تسحرنا مع رسول الله صلى الله عليه وسلم ثم قمنا إلى الصلاة. قيل له: كم كان قدر ما بينهما؟ قال: قدر خمسين آية(٣).", "حاشية: (١) أخرجه البخاري (١٩٢٣)، ومسلم (١٠٩٥).", "حاشية: (٢) أخرجه أحمد (١١٠٨٦) و(١١٣٩٦).", "حاشية: (٣) أخرجه البخاري (٥٧٥)، ومسلم (١٠٩٧).", "**الثالثة:** تعجيل الفطر، ففي الصحيحين من حديث سهل بن سعد عن النبي صلى الله عليه وسلم أنه قال: «لا يزال الناس بخير ما عجلوا الفطر»(١) وأخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أبو بكر بن مالك قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا الوليد ـ يعني ابن مسلم ـ قال: حدثنا الأوزاعي، قال: حدثني قرة عن الزهري عن أبي سلمة عن أبي هريرة عن النبي صلى الله عليه وسلم قال: «يقول الله عز وجل: إن أحب عبادي إلي أعجلهم فطرا»(٢).", "**الرابعة:** الإفطار على التمر، أخبرنا هبة الله بن محمد قال: أخبرنا أبو علي التميمي، قال: أخبرنا أبو بكر بن مالك قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا أبو معاوية قال: حدثنا عاصم عن حفصة عن الرباب عن سلمان بن عامر الضبي قال: قال رسول الله صلى الله عليه وسلم: «إذا أفطر أحدكم فليفطر على تمر، فإن لم يجد، فليفطر على ماء، فإنه له طهور»(٣). وفي حديث أنس قال: كان رسول الله صلى الله عليه وسلم يفطر على رطبات، فإن لم يكن رطبات فتمرات، فإن لم تكن تمرات حسى حسوات من ماء(٤). وقال وهب بن منبه: إذا صام الإنسان زاغ بصره، فإذا أفطر على حلاوة عاد بصره.", "**الخامسة:** ترك السواك بعد الزوال، فإنه مكروه في إحدى الروايتين عن الإمام أحمد.", "**السادسة:** الجود في رمضان، وفعل المعروف، وكثرة الصدقة اقتداء برسول الله صلى الله عليه وسلم، فإن في الصحيحين من حديث ابن عباس قال: كان رسول الله صلى الله عليه وسلم أجود بالخير من الريح المرسلة، وكان أجود ما يكون في رمضان(٥). ويظهر في", "حاشية: (١) أخرجه البخاري (١٩٥٧)."]], "ic": "book"}, {"story": ["كتاب أسرار الصوم ومهماته (٥ من ١٠)، ص١٨٧", ["حاشية: (٢) أخرجه أحمد (٧٢٤١)، والترمذي (٧٠٠)، وابن حبان (٣٥٠٧) و(٣٥٢٨)، والبغوي (١٧٣٣).", "حاشية: (٣) أخرجه أحمد (١٦٢٢٥) و(١٦٢٢٦)، والنسائي في الكبرى (٣٣٢٤) و(٣٣٢٥)، وأبو داود (٢٣٥٥)، والترمذي (٦٥٨) و(٦٨٥) وابن ماجه (١٦٩٩).", "حاشية: (٤) أخرجه أبو داود (٢٣٥٦)، والترمذي (٦٩٦).", "حاشية: (٥) أخرجه البخاري (٦) و(١٩٠٢)، ومسلم (٢٣٠٨).", "هذا من المعنى أن الرسول صلى الله عليه وسلم وافق ربه عز وجل في الكرم، فإن آثاره تظهر في رمضان أكثر من غيره لكثرة العتق وعموم الغفران.", "**السابعة:** دراسة القرآن، ففي الصحيحين من حديث ابن عباس قال: كان جبريل يأتي رسول الله صلى الله عليه وسلم في رمضان فيدارسه القرآن(١).", "وقد كان الشافعي رحمه الله يختم القرآن كل يوم ختمة، فإذا جاء رمضان ختم ستين ختمة(٢).", "**الثامنة:** الاعتكاف، لا سيما في العشر الأواخر، ففي الصحيحين من حديث عائشة قالت: كان رسول الله صلى الله عليه وسلم يعتكف العشر الأواخر من رمضان حتى توفاه الله عز وجل(٣).", "ولا يصح اعتكاف الرجل إلا في مسجد تقام فيه الجماعة، ويصح من النساء في جميع المساجد. ويصح اعتكاف بعض يوم، ويستحب للمعتكف أن يتشاغل بما يقربه إلى الله عز وجل، وإذا صح قصده في قراءة القرآن وتدريس العلم كان ذلك مستحبا.", "**التاسعة:** زيادة الاجتهاد في العشر الأواخر، ففي الصحيحين من حديث عائشة قالت: كان رسول الله صلى الله عليه وسلم في العشر الأواخر من رمضان يحيي الليل، ويوقظ أهله، ويشد المئزر(٤). وفي لفظ أخرجه مسلم قالت: كان رسول الله يجتهد في العشر ما لا يجتهد في غيره(٥).", "وقد ذكر العلماء في معنى شد المئزر وجهين: أحدهما: الإعراض عن النساء، والثاني: الجد والتشمير في العمل. وقالوا: وكان سبب اجتهاده عليه الصلاة", "حاشية: (١) هو الحديث السابق.", "حاشية: (٢) أخرجه البيهقي في مناقب الشافعي ٢/ ١٥٩.", "حاشية: (٣) أخرجه البخاري (٢٠٢٦)، ومسلم (١١٧٢).", "حاشية: (٤) أخرجه البخاري (٢٠٢٤)، ومسلم (١١٧٤).", "حاشية: (٥) أخرجه مسلم (١١٧٥).", "والسلام في هذا العشر طلب ليلة القدر، والأولى طلبها في ليالي الوتر، وأخصها ليلة سبع وعشرين، ففي أفراد مسلم من حديث ابن عمر عن النبي صلى الله عليه وسلم أنه قال: «من كان متحريا فليتحرها ليلة سبع وعشرين»(١). وقد كان أبي بن كعب يحلف أنها ليلة سبع وعشرين(٢). وقد قال أبو قلابة: ليلة القدر تنتقل في العشر الأواخر، فعلى هذا ينبغي لطالبها أن لا يفتر في ليالي العشر خصوصا في الأفراد منها. وفي الصحيحين من حديث أبي هريرة عن النبي صلى الله عليه وسلم أنه قال: «من قام ليلة القدر إيمانا واحتسابا غفر له ما تقدم من ذنبه»(٣). وقالت عائشة: قلت: يا رسول الله، إن وافقت ليلة القدر فيم أدعو؟ قال: «قولي: اللهم إنك عفو تحب العفو فاعف عني»(٤).", "**الفصل الثالث**"]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "الثامنة: الاعتكاف، لا سيما في العشر الأواخر، ففي الصحيحين من حديث عائشة قالت: كان رسول الله صلى الله عليه وسلم يعتكف العشر الأواخر من رمضان حتى ____ الله عز", "o": ["توفاه", "وثلاثا", "مرتفعا", "للعشاء"], "h": "راجع: ص١٨٨"}, {"t": "fill", "d": 2, "q": "السابعة: دراسة القرآن، ففي الصحيحين من حديث ابن عباس قال: كان جبريل يأتي ____ الله صلى الله عليه وسلم في رمضان فيدارسه", "o": ["رسول", "كأنها", "وتجارة", "يتخذ"], "h": "راجع: ص١٨٨"}, {"t": "fill", "d": 2, "q": "وأما الأشهر الحرم، فهي رجب، وذو القعدة، وذو الحجة، والمحرم، وقد كان جماعة من السلف يصو ي صائم»(١). وقد تأول العلماء قوله: «فليقل: إني صائم» تأويلين: أحدهما: أن يقول ذلك بلسانه، والثاني: أن يقول ذلك في نفسه، فكأنه يقول: كيف أجيب وأنا صائم؟", "وفي أفراد البخاري من حديث أبي هريرة عن النبي صلى الله عليه وسلم أنه قال: «من لم يدع قول الزور والعمل به والجهل، فليس لله حاجة في أن يدع طعامه وشرابه»(٢).", "أخبرنا محمد بن أبي طاهر قال: أخبرنا الجوهري قال: أخبرنا علي بن محمد بن كيسان قال: حدثنا يوسف القاضي قال: حدثنا أبو الربيع قال: حدثنا إسماعيل بن جعفر قال: حدثنا عمرو بن أبي عمرو، عن أبي سعيد المقبري عن أبي هريرة أن النبي صلى الله عليه وسلم قال: «رب صائم حظه من صيامه الجوع والعطش، ورب قائم حظه من قيامه السهر»(٣).", "**والثاني:** أن لا يمتلئ من الطعام في الليل بل يأكل بمقدار، فإنه «ما ملأ ابن آدم وعاء شرا من بطن»(٤)، ومتى شبع في أول الليل لم ينتفع بنفسه في باقيه، وإذا شبع وقت السحر لم ينتفع بنفسه إلى قريب من الظهر؛ لأن ذلك يورثه الكسل والفتور، ثم يفوت المقصود من الصيام؛ لأن المراد من الصائم أن يذوق طعم الجوع ويكون تاركا لما يشتهى، فإن الآدمي فوق رتبة البهائم لمكان قوته على كسر شهوته، ودون رتبة الملائكة لاستيلاء الشهوات عليه، فإن غلبته شهواته كانت", "حاشية: (١) أخرجه البخاري (١٨٩٤)، ومسلم (١١٥١).", "حاشية: (٢) أخرجه البخاري (١٩٠٣) و(٦٠٥٧).", "حاشية: (٣) أخرجه أحمد (٨٨٥٦)، والدارمي (٢٧٢٠)، وابن ماجه (١٦٩٠)، وابن خزيمة (١٩٩٧)، والبيهقي في السنن ٤/ ٢٧٠، وأبو يعلى (٦٥٥١)، والحاكم ١/ ٤٣١."]], "ic": "book"}, {"story": ["كتاب أسرار الصوم ومهماته (٧ من ١٠)، ص١٩٠", ["حاشية: (٤) أخرجه أحمد (١٧١٨٦)، والترمذي (٢٣٨٠)، وابن ماجه (٣٣٤٩)، وابن حبان (٥٢٣٦)، والبيهقي في الشعب (٥٦٤٩)، والنسائي في الكبرى (٦٧٦٩) من حديث المقدام بن معدي كرب.", "البهائم أعذر إذ لا قوة لها ترد، وله قوة، وإن غلبها علا على الملائكة، إذ لا صاد لهم وله صواة.", "وأما الأمر الباطن؛ فاضطراب القلب عند الإفطار بين الخوف على صومه هل قبل، وبين رجائه أن يقبل.", "**الفصل الرابع**", "**في التطوع بالصيام وترتيب الأوراد فيه**", "اعلم أن استحباب الصوم يتأكد في الأيام الفاضلة، وفواضل الأيام بعضها يوجد في كل سنة، وبعضها في كل شهر، وبعضها في كل أسبوع.", "فأما ما يوجد في السنة بعد أيام رمضان، فمنه أيام، ومنه أشهر، فأما الأيام، فستة أيام من شوال، ويوم عرفة، ويوم عاشوراء، والعشر الأول من ذي الحجة، والعشر الأول من المحرم.", "فأما الستة من شوال فقد روى مسلم في أفراده من حديث أبي أيوب عن النبي صلى الله عليه وسلم أنه قال: «من صام رمضان وأتبعه ستا من شوال كان كصيام الدهر»(١).", "وأما يوم عرفة، فقد روى مسلم في أفراده من حديث أبي قتادة عن النبي صلى الله عليه وسلم أنه سئل عن صوم يوم عرفة، فقال: «كفارة سنتين»(٢)، وفي لفظ: «يكفر السنة الماضية والباقية»(٣).", "وأما يوم عاشوراء، ففي أفراده من حديث أبي قتادة أيضا أن النبي صلى الله عليه وسلم سئل عن صوم عاشوراء، فقال: «كفارة سنة»(٤) وفي لفظ: «يكفر السنة الماضية»(٥).", "حاشية: (١) أخرجه مسلم (١١٦٤).", "حاشية: (٢) أخرجه مسلم (١١٦٢) (١٩٦).", "حاشية: (٣) أخرجه مسلم (١١٦٢) (١٩٧).", "حاشية: (٤) هو جزء من الحديث قبل السابق.", "حاشية: (٥) تقدم في التعليق رقم (٣).", "وأما العشر الأول من ذي الحجة، ففي أفراد البخاري من حديث ابن عباس عن النبي صلى الله عليه وسلم أنه قال: «ما من أيام العمل الصالح فيها أحب إلى الله عز وجل من هذه الأيام» يعني أيام العشر، قالوا: يا رسول الله، ولا الجهاد في سبيل الله؟ قال: «ولا الجهاد في سبيل الله، إلا رجلا خرج بنفسه وماله، ثم لم يرجع من ذلك بشيء»(١). أخبرنا إسماعيل بن أحمد قال: حدثنا محمد بن علي بن أبي عثمان قال: حدثنا ابن رزقويه قال: حدثنا حمزة بن محمد قال: حدثنا أبو بكر القرشي قال: حدثنا محمد بن رفيع القيسي قال: حدثنا مسعود بن واصل قال: حدثنا النهاس بن قهم عن قتادة عن سعيد بن المسيب عن أبي هريرة ذكر أن النبي صلى الله عليه وسلم قال: «ما من أيام الدنيا أيام أحب إلى الله عز وجل أن يتعبد له فيها من أيام العشر، يعدل صيام كل يوم منها بصيام سنة، وقيام كل ليلة منها كقيام ليلة القدر»(٢).", "وأما العشر الأول من المحرم، فقد قال أبو عثمان النهدي: كانوا يفضلون ثلاث عشرات: العشر الأول من ذي الحجة، والعشر الأول من المحرم، والعشر الأخير من رمضان."]], "ic": "book"}, {"story": ["كتاب أسرار الصوم ومهماته (٨ من ١٠)، ص١٩٢", ["وأما الشهور، والأشهر الحرم، فشعبان، فأما شعبان ففي الصحيحين من حديث عائشة قالت: ما كان رسول الله صلى الله عليه وسلم يصوم من شهر من السنة أكثر من صيامه من شعبان كان يصومه كله(٣).", "وأما الأشهر الحرم، فهي رجب، وذو القعدة، وذو الحجة، والمحرم، وقد كان جماعة من السلف يصومونها لمكان تعظيمها، منهم الحسن البصري.", "فأما رجب فمن صامه لأنه شهر حرام فحسن، غير أنه يكره له أن يصومه كله إلا أن يصله بشعبان ورمضان، وقد رويت في صومه أحاديث ليس فيها ما يثبت.", "حاشية: (١) ليس هو من أفراد البخاري كما ذكر المصنف، وإنما أخرجه أحمد (١٩٦٨)، والترمذي (٧٥٧)، وابن ماجه (١٧٢٧)، وابن حبان (٣٢٤)، وأبو داود (٢٤٣٨).", "حاشية: (٢) أخرجه ابن ماجه (١٧٢٨)، والخطيب البغدادي في تاريخه ١١/ ٢٠٨.", "حاشية: (٣) أخرجه البخاري (١٩٧٠)، ومسلم (١١٥٦) (١٧٦).", "وأما ذو القعدة فليس فيه إلا أنه شهر محرم وكفى بذلك فضيلة.", "وأما ذو الحجة، فقد جمع مع كونه حراما أنه شهر الحج، وقد ذكرنا فضائل عشرة.", "وأما المحرم، ففي أفراد مسلم من حديث أبي هريرة عن النبي صلى الله عليه وسلم أنه قال: «أفضل الصيام بعد رمضان شهر الله المحرم»(١). وفي لفظ: «الذي تدعونه المحرم»(٢).", "وأما ما يتكرر في الشهور؛ فأول الأشهر وأوسطها وآخرها، فمن صام أول يوم من الشهر، وأوسط يوم منه، وآخره فقد أحسن، غير أن الأفضل أن يصوم الثلاثة في أيام البيض(٣)، وفي الصحيحين من حديث أبي هريرة قال: أوصاني خليلي بثلاث: صيام ثلاثة أيام من كل شهر، وركعتي الضحى، وأن أوتر قبل أن أنام(٤). وفي أفراد مسلم من حديث أبي قتادة عن النبي صلى الله عليه وسلم أنه قال: «ثلاث من كل شهر، ورمضان إلى رمضان هذا صيام الدهر كله»(٥). وفي أفراده من حديث عائشة أنها سئلت: أكان رسول الله صلى الله عليه وسلم يصوم من كل شهر ثلاثة أيام؟ قالت: نعم. قيل لها: من أي أيام الشهر كان يصوم؟ قالت: لم يكن يبالي من أي أيام الشهر يصوم(٦). إلا أنه قد روى أبو ذر عن النبي صلى الله عليه وسلم أنه قال له: «إذا صمت ثلاثة أيام من الشهر، فصم ثلاث عشرة وأربع عشرة وخمس عشرة»(٧).", "وأما المتكرر في كل أسبوع؛ فيوم الإثنين والخميس، وفي أفراد مسلم من", "حاشية: (١) أخرجه مسلم (١١٦٣).", "حاشية: (٢) هذا اللفظ عند ابن ماجه (١٧٤٢).", "حاشية: (٣) الأيام البيض هي ثلاث عشرة وأربع عشرة وخمس عشرة من الشهر، وسميت بالبيض لبياض ليلها كله بالقمر.", "حاشية: (٤) أخرجه البخاري (١٩٨١)، ومسلم (٧٢١).", "حاشية: (٥) أخرجه مسلم (١١٦٢)(١٩٦).", "حاشية: (٦) أخرجه مسلم (١١٦٠).", "حاشية: (٧) أخرجه أحمد (٢١٤٣٧)، والترمذي (٧٦١)، والنسائي ٤/ ٢٢٣.", "حديث أبي قتادة عن النبي صلى الله عليه وسلم أنه سئل عن صوم يوم الاثنين، فقال: فيه ولدت، وفيه أنزل علي(١)."]], "ic": "book"}, {"story": ["كتاب أسرار الصوم ومهماته (٩ من ١٠)، ص١٩٤", ["وفي أفراده أيضا من حديث أبي هريرة عن النبي صلى الله عليه وسلم أنه قال: «إن أبواب الجنة تفتح يوم الاثنين والخميس»(٢). وفي حديث أسامة بن زيد قال: كان رسول الله صلى الله عليه وسلم يصوم الأيام يسرد حتى نقول: لا يفطر، ويفطر الأيام حتى لا يكاد يصوم، إلا يومين من الجمعة إن كانا في صيامه ولا صامهما، فقلت: يا رسول الله، إنك تصوم لا تكاد تفطر، وتفطر حتى لا تكاد تصوم إلا يومين إن دخلا في صيامك(٣) وإلا صمتهما! قال: «أي يومين؟» قلت: «ذانك يوم الإثنين ويوم الخميس قال: «ذانك يومان تعرض فيهما الأعمال على رب العالمين، فأحب أن يعرض عملي وأنا صائم»(٤).", "وهذه الأيام الفاضلة التي ذكرناها يستحب صيامها، وفعل ما يمكن من الطاعات فيها ليتضاعف ببركتها الأجر.", "وأما صوم بعض الأيام وإفطار بعضها، ففي أفراد مسلم من حديث أبي قتادة أن عمر بن الخطاب سأل رسول الله صلى الله عليه وسلم فقال: كيف بمن يصوم يومين ويفطر يوما؟ قال: «ويطيق ذلك أحد»؟ قال: كيف بمن يصوم يوما ويفطر يومين؟ قال(٥): «وددت أني أطيق ذلك» قال: فكيف بمن يصوم يوما ويفطر يوما؟ قال: «ذلك صوم داود عليه السلام»(٦) وفي الصحيحين من حديث عبد الله بن عمرو عن النبي صلى الله عليه وسلم أنه قال: «أحب الصيام إلى الله عز وجل صيام داود، كان يصوم يوما ويفطر يوما»(٧).", "حاشية: (١) أخرجه مسلم (١١٦٢)(١٩٧).", "حاشية: (٢) أخرجه مسلم (٢٥٦٥).", "حاشية: (٣) في الأصل: «صومك».", "حاشية: (٤) أخرجه أحمد (٢١٧٥٣)، وعبد الرزاق (٧٩١٧)، وابن أبي شيبة ٣/ ١٠٣ والنسائي ٤/ ٢٠١، والبيهقي في الشعب (٣٨٢١)، والضياء في المختارة (١٣١٩) و(١٣٢٠).", "حاشية: (٥) سقط من (ظ).", "حاشية: (٦) أخرجه مسلم (١١٦٢).", "حاشية: (٧) أخرجه البخاري (١٩٧٦)، ومسلم (١١٥٩)(١٨٩).", "وفي لفظ متفق عليه: «لا صوم فوق صوم داود»(١).", "واعلم أن صوم وإفطار يوم يجمع ثلاثة معان: الأول(٢): أن النفس تعطى يوم الفطر حظها ويستوفى منها يوم الصوم تعبدها، وذلك جمع ما بين مالها وما عليها، وهو العدل.", "والثاني: أن يوم الأكل شكر، ويوم الصوم صبر، والإيمان نصفان شكر وصبر، وقد قال عليه الصلاة والسلام: «أجوع يوما وأشبع يوما، فإذا جعت تضرعت إلى ربي، وإذا شبعت حمدته(٣)»(٤).", "والثالث: أنه أشق على النفس في المجاهدة؛ لأنها كلما أنست بحالة نقلت عنها."]], "ic": "book"}, {"story": ["كتاب أسرار الصوم ومهماته (١٠ من ١٠)، ص١٩٥", ["فأما صوم الدهر؛ ففي أفراد مسلم من حديث أبي قتادة أن عمر سأل رسول الله صلى الله عليه وسلم فقال: كيف بمن يصوم الدهر كله؟ فقال: «لا صام ولا أفطر، أو لم يصم ولم يفطر»(٥). وهذا محمول على من سرد الصوم في الأيام المنهي عن صيامها، فأما إذا أفطر يومي العيدين وأيام منى، فلا بأس بذلك، فقد أخبرنا محمد بن أبي طاهر قال: أخبرنا الجوهري قال: أخبرنا إبراهيم بن أحمد الخرقي قال: أخبرنا الفريابي قال: حدثنا إسحاق بن راهويه قال: حدثنا وكيع قال: حدثنا سفيان عن عبيد الله عن نافع عن ابن عمر قال: ما مات عمر حتى سرد الصوم(٦).", "حاشية: (١) أخرجه البخاري (١٩٨٠)، ومسلم (١١٥٩)(١٩١).", "حاشية: (٢) في الأصل: «أحدها».", "حاشية: (٣) سقط من (ظ).", "حاشية: (٤) أخرجه أحمد (٢٢١٩٠)، والترمذي بإثر الحديث (٢٣٤٧)، والبيهقي في الشعب (١٤٦٧)، والطبراني في الكبير (٧٨٣٥)، وأبو نعيم في الدلائل (٥٤٠) وأبو نعيم في الحلية ٨/ ١٣٣ من حديث أبي أمامة.", "حاشية: (٥) تقدم تخريجه في الصحفة السابقة.", "حاشية: (٦) أورده المصنف في مناقب عمر: ١٦٩، وابن كثير في البداية والنهاية ١٠/ ١٨٥، وعبد الحي اللكنوي في إقامة الحجة: ٦١.", "قال الفريابي: وحدثنا قتيبة قال: حدثنا حماد بن زيد عن هشام بن عروة أن أباه كان يسرد الصوم. وكانت عائشة تسرد(١)، وقد روى أنس بن مالك قال: سرد أبو طلحة الصوم بعد رسول الله صلى الله عليه وسلم أربعين عاما(٢).", "واعلم أن من رزق فطنة(٣) علم مقصود الصوم فحمل نفسه قدر ما لا يعجزه عما هو أفضل منه، فقد كان ابن مسعود قليل الصوم، وكان يقول: إذا صمت ضعفت عن الصلاة، وأنا أختار الصلاة على الصوم.", "وكان آخر إذا صام ضعف عن تلاوة القرآن، فيكثر الفطر ليقدر على التلاوة، وكل إنسان أعلم بحاله وما يصلح.", "ومما يكره من الصيام إفراد يوم الجمعة بالصوم، ويوم السبت، ويكره الوصال.", "ولا يجوز لمن عليه صيام فرض أن يتطوع بالصوم في إحدى الروايتين عن الإمام أحمد.", "**آخر كتاب الصوم**", "حاشية: (١) طبقات ابن سعد ٨/ ٧٥.", "حاشية: (٢) أخرجه الطبراني في الكبير (٤٩٨١)، وابن عساكر في تاريخه ١٩/ ٤٢٠.", "حاشية: (٣) في (ط): «فضيلة»."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "الفصل الأ و أدنى، وعلى آله وأصحابه الذين كانوا حرزا للدين وحصنا، وأسلم تسليما كثيرا.", "أما بعد؛ فإن الله سبحانه جعل الحج من بين أركان الإسلام ومبانيه عبادة العمر، وأنزل على رسوله وقد حج ووقف بعرفة: ﴿ٱلْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ﴾ [المائدة: ٣]، وروى أبو أمامة عن النبي صلى الله عليه وسلم أنه قال: «من لم يحبسه مرض، أو حاجة ظاهرة، أو سلطان جائر، ولم يحج فليمت إن شاء يهوديا أو نصرانيا»(٢).", "وإذ قد عرف قدر هذه العبادة، فنحن نذكر أركانها وسننها وآدابها وأسرارها، وجملة ذلك ينكشف بتوفيق الله سبحانه في ثلاثة أبواب:", "الباب الأول: في فضائلها، وفضائل مكة والبيت، وجملة أركانها وشرائط وجوبها.", "الباب الثاني: في أعمالها الظاهرة على الترتيب من مبدأ السفر إلى الرجوع.", "الباب الثالث: في آدابها الدقيقة، وأسرارها الخفية، وأعمالها الباطنة.", "حاشية: (١) في (ظ): «بالأمر».", "حاشية: (٢) طبقات ابن سعد ٨/ ٧٥."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "وإذ قد عرف قدر هذه العبادة، فنحن نذكر أركانها وسننها وآدابها وأسرارها، ____ ذلك ينكشف بتوفيق الله سبحانه في ثلاثة أبواب", "o": ["وجملة", "المشايخ", "خلال", "نوعان"], "h": "راجع: ص١٩٧"}]}], "sum": [["الصفحات", "ص١٩٧ - ص١٩٧"]], "_nq": 1}, {"id": "l25", "title": "الباب الأول", "group": "كتاب أسرار الحج ومهماته", "map": {"center": "الباب\nالأول", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الأول - القسم ١ من ٢", "b": [{"pic": ["books", "book"], "cap": "ص١٩٨ - ص٢١٢"}, {"story": ["الباب الأول (١ من ١٠)، ص١٩٨", ["وفيه فصلان:", "**الفصل الأول**", "**في فضائل الحج وفضيلة البيت ومكة والمدينة وشد الرحال إلى المشاهد**", "**فضيلة الحج:** قال عز وجل: ﴿وَأَذِّن فِي ٱلنَّاسِ بِٱلْحَجِّ يَأْتُوكَ رِجَالًا وَعَلَىٰ كُلِّ ضَامِرٍ يَأْتِينَ مِن كُلِّ فَجٍّ عَمِيقٍ ٢٧ لِّيَشْهَدُوا۟ مَنَٰفِعَ لَهُمْ﴾ [الحج: ٢٧ ـ ٢٨]. قال مجاهد: هي منافع الدنيا والآخرة(١). وقال ابن مسعود والحسن في قوله تعالى: ﴿لَأَقْعُدَنَّ لَهُمْ صِرَٰطَكَ ٱلْمُسْتَقِيمَ﴾ [الأعراف: ١٦]: إنه طريق مكة يمنعهم من الحج(٢).", "أخبرنا هبة الله بن محمد قال: أخبرنا الحسن بن علي التميمي قال: حدثنا أبو بكر بن مالك قال: حدثنا عبد الله بن أحمد، قال: حدثني أبي قال: حدثنا سفيان قال: حدثني سمي عن أبي صالح عن أبي هريرة، قال: قال رسول الله صلى الله عليه وسلم: «الحج المبرور ليس له جزاء إلا الجنة، والعمرتان ـ أو العمرة إلى العمرة ـ تكفر ما بينهما»(٣). أخبرنا محمد بن محمد الوراق، قال: أخبرنا أبو بكر بن سياووش قال: أخبرنا أبو حامد الإسفراييني، قال: حدثنا إبراهيم بن عبداك، قال: حدثنا الحسن بن سفيان قال: حدثنا العباس بن الوليد النرسي قال: حدثنا سفيان بن عيينة عن منصور بن المعتمر عن أبي حازم عن أبي هريرة قال: قال رسول الله صلى الله عليه وسلم: «من حج هذا البيت، فلم يرفث ولم يفسق، فرجع كان كما ولدته أمه»(٤). أخبرنا أبو", "حاشية: (١) تفسير الطبري ١٦/ ٥٢١، وزاد المسير للمصنف ٥/ ٤٢٥.", "حاشية: (٢) زاد المسير ٣/ ١٧٦.", "حاشية: (٣) أخرجه البخاري (١٧٧٣)، ومسلم (١٣٤٩).", "حاشية: (٤) أخرجه البخاري (١٥٢١) و(١٨١٩) و(١٨٢٠)، ومسلم (١٣٥٠).", "سعد الزوزني قال: أخبرنا محمد بن الحسين القاضي، قال: أخبرنا عثمان بن عمرو بن المنتاب، قال: حدثنا ابن صاعد، قال: حدثنا الحسين بن الحسن، قال: حدثنا الهيثم بن جميل قال: حدثنا إبراهيم بن سعد عن الزهري عن سعيد بن المسيب عن أبي هريرة قال: سئل رسول الله صلى الله عليه وسلم: أي الأعمال أفضل؟ قال: «إيمان بالله عز وجل» ثم قيل: ماذا؟ قال: «ثم الجهاد في سبيل الله عز وجل» قيل: ثم ماذا؟ قال: «ثم الحج المبرور»(١). هذه الأحاديث الثلاثة مخرجة في الصحيحين."]], "ic": "book"}, {"story": ["الباب الأول (٢ من ١٠)، ص١٩٩", ["وقد روى ابن مسعود عن النبي صلى الله عليه وسلم أنه قال: «تابعوا بين الحج والعمرة فإنهما ينفيان الفقر والذنوب، كما ينفي الكير خبث الحديد والفضة، وما لحج مبرور جزاء إلا الجنة»(٢). وروى ابن عباس عن النبي صلى الله عليه وسلم أنه قال: «دعوة الحاج لا ترد حتى يرجع»(٣). وروى علي رضي الله عنه عن النبي صلى الله عليه وسلم أنه قال: «من أراد دنيا وآخرة، فليؤم هذا البيت، ما أتاه عبد يسأل الله دنيا إلا أعطاه منها، ولا آخرة إلا ذخر له منها»(٤). وروى جابر عن النبي صلى الله عليه وسلم أنه قال: «من جاء هذا البيت حاجا، فطاف به أسبوعا(٥) ثم أتى مقام إبراهيم، فصلى عنده ركعتين، ثم أتى زمزم فشرب من مائها، أخرجه الله تعالى من ذنوبه كيوم ولدته أمه»(٦). وروى بريدة عن النبي صلى الله عليه وسلم أنه قال: «النفقة في الحج تضاعف كالنفقة في سبيل الله عز وجل الدرهم بسبع مئة ار الملائك (٦٧٦).", "حاشية: (٤) أخرجه الطبري في التفسير ١٦/ ٥١٨، وابن أبي شيبة ٤/ ٩٨، والأزرقي في أخبار مكة ١/ ٣٤.", "حاشية: (٥) زاد المسير ٥/ ٤٢٤.", "حاشية: (٦) الحشفة: صخرة رخوة حولها سهل من الأرض. التاج (حشف)، ويروى بالخاء بدل الحاء، وبالخاء والعين بدل الحاء والفاء. النهاية ٢/ ٣٤ ـ ٣٥.", "**فضل الحجر الأسود**", "أخبرنا الكرخي قال: أخبرني الغورجي قال: أخبرنا الجراحي قال: حدثنا المحبوبي قال: حدثنا الترمذي قال: حدثنا قتيبة قال: حدثنا جرير عن عطاء بن السائب عن سعيد بن جبير عن ابن عباس قال: قال رسول الله صلى الله عليه وسلم: «نزل الحجر الأسود من الجنة وهو أشد بياضا من اللبن، فسودته خطايا بني آدم»(١) وروى ابن عباس عن النبي صلى الله عليه وسلم أنه قال: «ليبعثن هذا الحجر يوم القيامة له عينان يبصر بهما، ولسان ينطق به يشهد على من استلمه بحق»(٢).", "**ذكر الركن اليماني**", "أخبرنا عبد الرحمن بن محمد قال: أخبرنا أحمد بن علي بن ثابت قال: أخبرنا أبو القاسم بن أبي عثمان قال: حدثنا محمد بن إسماعيل الوراق قال: حدثنا عمرو بن إسحاق قال: حدثنا سهل بن شاذويه قال: حدثنا عمر بن محمد بن الحسين قال: حدثنا أبي قال: حدثنا عيسى بن موسى عن محمد بن الفضل بن عطية، عن كزز(٣) بن وبرة عن طاوس، عن ابن عباس، عن النبي صلى الله عليه وسلم قال: «على الركن اليماني ملك موكل به منذ خلق الله السماوات والأرض، فإذا مررتم به فقولوا: ربنا آتنا في الدنيا حسنة وفي الآخرة حسنة، وقنا عذاب النار، فإنه يقول: آمين آمين»(٤). وفي حديث أبي هريرة عن النبي صلى الله عليه وسلم أنه قال: «الركن اليماني وكل الله به سبعين ملكا، فمن قال: أسألك العفو والعافية، ربنا آتنا في الدنيا حسنة، وفي الآخرة حسنة وقنا عذاب النار. قالوا: آمين»(٥).", "حاشية: (١) أخرجه الترمذي (٨٧٧)، وابن خزيمة (٢٧٣٣)، والفاكهي في أخبار مكة (٦).", "حاشية: (٢) أخرجه أحمد (٢٦٤٣) و(٢٧٩٦)، والبيهقي ٥/ ٧٥، والدارمي (١٨٣٩)، والطبراني في الكبير (١٢٤٧٩).", "حاشية: (٣) في الأصل: «كريز».", "حاشية: (٤) أخرجه ابن أبي شيبة ١٠/ ٣٦٨، والفاكهي في أخبار مكة (٢٤) و(١٥٤).", "حاشية: (٥) أخرجه ابن ماجه (٢٩٥٧)، والبيهقي ٥/ ١٢٨، والفاكهي في أخبار مكة (١٥٢).", "**فضائل الطواف**"]], "ic": "book"}, {"story": ["الباب الأول (٤ من ١٠)، ص٢٠٢", ["أخبرنا عبد الله بن محمد الحاكم ويحيى بن علي بن
