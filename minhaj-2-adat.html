      '<linearGradient id="' + id + 'r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + b.c[0] + '"/><stop offset=".5" stop-color="' + b.c[1] + '"/><stop offset="1" stop-color="' + b.c[2] + '"/></linearGradient>' +
      '<linearGradient id="' + id + 'd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + b.d[0] + '"/><stop offset="1" stop-color="' + b.d[1] + '"/></linearGradient></defs>';
    let cyD = 58, rD = 31, gs = 1.95;
    const two = fn => fn(4, b.c[2]) + fn(0, R);   /* حافة ثلاثية الأبعاد ثم الوجه */
    if (b.rays) { s += '<g fill="' + b.c[1] + '" opacity=".85">'; for (let k = 0; k < 16; k++) s += '<path d="M60 0 64 24h-8z" transform="rotate(' + (k * 22.5 + 11.25) + ' 60 60)"/>'; s += '</g>'; }
    if (b.laurel) s += '<g fill="' + (b.rays ? '#16A34A' : b.c[2]) + '">' + laurel() + '</g>';
    if (b.ribbon) s += '<path d="M38 2h18l10 34H48z" fill="#EF4444"/><path d="M82 2H64L54 36h18z" fill="#3B82F6"/>';
    switch (b.plate) {
      case 'coin': {
        const r = b.laurel ? 38 : b.ribbon ? 39 : 47, cy = b.ribbon ? 70 : b.laurel ? 58 : 58;
        cyD = cy; rD = b.laurel ? 30 : b.ribbon ? 29 : 34; gs = b.laurel ? 2.1 : b.ribbon ? 1.55 : 1.95;
        s += two((dy, fill) => '<circle cx="60" cy="' + (cy + dy) + '" r="' + r + '" fill="' + fill + '"/>'); break;
      }
      case 'star5': rD = 0;
        s += two((dy, fill) => '<path d="' + STAR5 + '" transform="translate(60 ' + (57 + dy) + ') scale(5.4) translate(-12 -12.2)" fill="' + fill + '" stroke="' + fill + '" stroke-width="1.2" stroke-linejoin="round"/>'); break;
      case 'star8': s += two((dy, fill) => '<polygon points="' + starPts(60, 58 + dy, 54, 41.5) + '" fill="' + fill + '"/>'); rD = 31; break;
      case 'hex': s += two((dy, fill) => '<polygon points="' + ngon(60, 58 + dy, 50, 6, -90) + '" fill="' + fill + '" stroke="' + fill + '" stroke-width="6" stroke-linejoin="round"/>'); rD = 33; break;
      case 'shield': s += two((dy, fill) => '<path transform="translate(0 ' + dy + ')" d="M60 5 105 19v36c0 27-19 46-45 57C34 101 15 82 15 55V19z" fill="' + fill + '"/>'); cyD = 54; rD = 31; break;
      case 'burst': s += two((dy, fill) => '<polygon points="' + starPts(60, 58 + dy, 55, 45, 12) + '" fill="' + fill + '"/>'); rD = 34; break;
      case 'wings': {
        const w = 'M38 50C27 36 13 31 1 34c3 5 7 8 12 10-5 0-9 2-11 5 4 3 9 4 14 3-4 2-6 5-7 9 5 1 10 0 14-3-2 3-3 6-2 9 8-1 14-6 18-13z';
        s += two((dy, fill) => '<path d="' + w + '" fill="' + fill + '" transform="translate(0 ' + dy + ')"/><path d="' + w + '" fill="' + fill + '" transform="translate(120 ' + dy + ') scale(-1 1)"/>');
        s += two((dy, fill) => '<circle cx="60" cy="' + (56 + dy) + '" r="32" fill="' + fill + '"/>'); cyD = 56; rD = 24; gs = 1.5; break;
      }
      case 'grand': s += two((dy, fill) => '<polygon points="' + starPts(60, 60 + dy, 42, 35, 16) + '" fill="' + fill + '"/>'); cyD = 60; rD = 29; gs = 2.2; break;
    }
    if (rD) s += '<circle cx="60" cy="' + cyD + '" r="' + rD + '" fill="' + D + '" stroke="rgba(255,255,255,.65)" stroke-width="2"/>' +
      '<path d="M' + f1(60 - rD * .8) + ' ' + f1(cyD - rD * .28) + 'a' + f1(rD * .86) + ' ' + f1(rD * .86) + ' 0 0 1 ' + f1(rD * 1.05) + ' ' + f1(-rD * .5) + '" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="3" stroke-linecap="round"/>';
    if (b.plate === 'star5') s += '<path d="' + STAR5 + '" transform="translate(60 59) scale(2.3) translate(-12 -12.2)" fill="' + b.d[0] + '" opacity=".5"/><path d="M33 40c7-7 15-11 25-12" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="4" stroke-linecap="round"/>';
    else s += '<g transform="translate(60 ' + (cyD - (b.pips ? 4 : 0)) + ') scale(' + gs + ') translate(-12 -12)" fill="' + b.gc + '">' + GLYPH[b.g] + '</g>';
    if (b.pips) { const y = cyD + rD - 8; for (let k = 0; k < b.pips; k++) s += '<path d="' + STAR5 + '" transform="translate(' + f1(60 + (k - (b.pips - 1) / 2) * 13) + ' ' + y + ') scale(.52) translate(-12 -12)" fill="' + (b.gc === '#FFFFFF' ? '#FDE047' : '#FFFFFF') + '"/>'; }
    return s + '</svg>';
  }

  /* ---------- radial mind map ---------- */
  let CURMAP = null;
  function radial(map) {
    CURMAP = map;
    const n = map.nodes.length, C = 200, R = 138;
    if (n > 6) {
      const gn = map.nodes.map((nd, i) => { const k = PAL[i % 6]; return '<button class="rn rg" data-act="rnode" data-i="' + i + '" style="--k:' + k[0] + ';--kd:' + k[1] + ';--ks:' + k[2] + '"><span class="rn-i">' + ar(i + 1) + '</span><span class="rg-t">' + esc(nd.t) + '</span></button>'; }).join('');
      return '<div class="rgrid-c"><div class="rg-center">' + md(map.center).replace(/<br>/g, ' ') + '</div></div><div class="rgrid">' + gn + '</div><div class="rdetail" aria-live="polite"><div class="rd-empty">' + IC.tap + 'اضغط على أي فرع لتفتحه</div></div>';
    }
    const pts = map.nodes.map((nd, i) => { const a = (-90 + i * 360 / n) * Math.PI / 180; return { x: C + R * Math.cos(a), y: C + R * Math.sin(a) }; });
    const lines = pts.map((p, i) => '<line class="rl" x1="200" y1="200" x2="' + p.x.toFixed(1) + '" y2="' + p.y.toFixed(1) + '" stroke="' + PAL[i % 6][0] + '" pathLength="1" style="animation-delay:' + (.3 + i * .12).toFixed(2) + 's"/>').join('');
    const nodes = map.nodes.map((nd, i) => { const k = PAL[i % 6]; return '<button class="rn" data-act="rnode" data-i="' + i + '" style="--k:' + k[0] + ';--kd:' + k[1] + ';--ks:' + k[2] + ';left:' + (pts[i].x / 4).toFixed(2) + '%;top:' + (pts[i].y / 4).toFixed(2) + '%;animation-delay:' + (.5 + i * .12).toFixed(2) + 's"><span class="rn-i">' + ar(i + 1) + '</span>' + esc(nd.t) + '</button>'; }).join('');
    const odots = (r, cls, cols) => '<g class="odots ' + cls + '">' + cols.map((c, j) => { const a = (j * 360 / cols.length) * Math.PI / 180; return '<circle cx="' + (200 + r * Math.cos(a)).toFixed(1) + '" cy="' + (200 + r * Math.sin(a)).toFixed(1) + '" r="6" fill="' + c + '"/>'; }).join('') + '</g>';
    return '<div class="rmap"><svg viewBox="0 0 400 400" aria-hidden="true"><circle class="orbit" cx="200" cy="200" r="' + R + '"/><circle class="orbit o2" cx="200" cy="200" r="92"/>' + odots(R, '', ['#0F766E', '#FACC15', '#3B82F6']) + odots(92, 'o2', ['#22C55E', '#0F766E']) + lines + '</svg><div class="rc"><div class="rcin khatam"><span>' + md(map.center) + '</span></div></div>' + nodes + '</div>' +
      '<div class="rdetail" aria-live="polite"><div class="rd-empty">' + IC.tap + 'اضغط على أي فرع لتفتحه</div></div>';
  }
  function openNode(btn) {

      root.querySelector('.rdetail').innerHTML = '<div class="rd-h"><span class="rd-t">الباب ' + ORD[i] + ': ' + esc(nd.t) + '</span><span class="rd-lv">' + esc(nd.lv) + '</span></div><div class="rd-ch">' +
        nd.g.map((gi, k) => { const p = PATHS[gi], n = p.lv.length, dn = p.lv.filter(l => S.done[l.id]).length;

  /* ---------- explanation blocks ---------- */
  const ICN = MJ.icons || {};
  const icon = n => ICN[n] ? '<svg viewBox="0 0 32 32" aria-hidden="true">' + ICN[n] + '</svg>' : '';
  const firstLetter = s => { const t = plain(s).replace(/^(ال|أبو |أبي |أم |ابن )/, ''); return esc(t.charAt(0)); };
  function block(b) {
    if (b.pic) return '<div class="blk b-pic"><div class="pics">' + b.pic.map((n, k) => '<span class="pi" style="--i:' + k + '">' + icon(n) + '</span>').join('') + '</div>' + (b.cap ? '<p>' + md(b.cap) + '</p>' : '') + '</div>';

    if (b.tl) return '<div class="blk b-tl">' + (b.title ? '<div class="lt">' + md(b.title) + '</div>' : '') + '<ol>' + b.tl.map((x, k) => '<li style="--i:' + k + '"><span class="tw">' + md(x[0]) + '</span><span class="tx">' + md(x[1]) + '</span></li>').join('') + '</ol></div>';

    if (b.vs !== undefined) return '<div class="blk b-verse">' + (b.cap ? '<div class="vc">' + md(b.cap) + '</div>' : '') + '<div class="vt">' + verseHTML(b.vs) + '</div></div>';
    if (b.stats) return '<div class="blk b-stats">' + (b.title ? '<div class="lt">' + md(b.title) + '</div>' : '') + '<div class="sg">' + b.stats.map((x, k) => '<div class="sc" style="--i:' + k + '"><b>' + md(x[0]) + '</b><span>' + md(x[1]) + '</span></div>').join('') + '</div></div>';
    if (b.lesson) return '<div class="blk b-lesson"><span class="li">' + icon('light-bulb') + '</span><div><div class="lb">عبرة وفائدة</div><div class="lx">' + md(b.lesson) + '</div></div></div>';
    if (b.p) return '<p class="blk b-p">' + md(b.p) + '</p>';
    if (b.def) return '<div class="blk b-def"><div class="t"><span>' + md(b.def[0]) + '</span></div><div class="d">' + md(b.def[1]) + '</div></div>';
    if (b.list) { const tg = b.num ? 'ol' : 'ul'; return '<div class="blk b-list">' + (b.title ? '<div class="lt">' + md(b.title) + '</div>' : '') + '<' + tg + '>' + b.list.map((x, k) => '<li style="--i:' + k + '">' + md(x) + '</li>').join('') + '</' + tg + '></div>'; }
    if (b.chips) return '<div class="blk b-chips">' + (b.title ? '<div class="lt">' + md(b.title) + '</div>' : '') + '<div class="chips">' + b.chips.map((x, k) => '<span class="chip" style="--i:' + k + '">' + md(x) + '</span>').join('') + '</div></div>';
    if (b.note) return '<div class="blk b-note' + (b.warn ? ' warn' : '') + '"><span class="ni">' + (b.warn ? IC.warn : IC.lamp) + '</span><div>' + md(b.note) + '</div></div>';
    if (b.eq) return '<div class="blk b-eq"><span class="eqb">' + md(b.eq) + '</span>' + (b.cap ? '<span class="cap">' + md(b.cap) + '</span>' : '') + '</div>';
    if (b.steps) return '<div class="blk b-proof">' + (b.title ? '<div class="ptl">' + md(b.title) + '</div>' : '') + '<div class="ps-list">' + b.steps.map((s, k) => {
      const last = k === b.steps.length - 1 && b.steps.length > 1 && !b.open;
      return '<div class="ps ' + (last ? 'res' : 's' + (k % 4)) + '" style="--i:' + k + '"><span class="lab">' + md(s[0]) + '</span><p>' + md(s[1]) + '</p></div>';
    }).join('') + '</div></div>';
    if (b.fig) return '<figure class="blk b-fig">' + fig(b.fig) + (b.cap ? '<figcaption>' + md(b.cap) + '</figcaption>' : '') + '</figure>';
    if (b.tbl) return '<div class="blk b-tbl">' + figTbl(b.tbl) + (b.cap ? '<span class="cap">' + md(b.cap) + '</span>' : '') + '</div>';
    if (b.cmp) { const c = b.cmp; return '<div class="blk b-cmp"><div class="tw"><table><thead><tr>' + c.h.map(x => '<th scope="col">' + md(x) + '</th>').join('') + '</tr></thead><tbody>' + c.r.map((r, k) => '<tr style="--i:' + k + '">' + r.map((x, j) => j === 0 ? '<th scope="row">' + md(x) + '</th>' : '<td>' + md(x) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div></div>'; }
    if (b.cards) { const two = b.cards.length % 2 === 0 && b.cards.every(c => plain(c.t + (c.r || '')).length < 64); return '<div class="blk b-cards' + (two ? ' two' : '') + '">' + b.cards.map((c, k) => '<div class="card" style="--i:' + k + '"><h4>' + md(c.h) + (c.tag ? '<span class="tag">' + esc(c.tag) + '</span>' : '') + '</h4><p>' + md(c.t) + '</p>' + (c.r ? '<p class="r">' + md(c.r) + '</p>' : '') + '</div>').join('') + '</div>'; }
    if (b.tree) { const ctr = { n: 0 }; return '<div class="blk b-tree"><ul>' + tree(b.tree, 0, ctr) + '</ul></div>'; }
    return '';
  }

  /* بطاقة الوسام: ثابتة أعلى الواجهة */

    const pct = nx ? Math.max(4, Math.min(100, (st - lo) / (nx.at - lo) * 100)) : 100;

  /* عُقد الطريق المتعرج بأسلوبه الأصلي نفسه؛ تُستخدم لقائمة المسارات ولمحطات كل مسار */
  function roadRows(nodes) {
    const W = appEl.clientWidth || 360;
    const amp = Math.max(28, Math.min(80, (W - 32) / 2 - 92));
    return nodes.map((nd, i) => {
      const x = Math.round(Math.sin(i * 0.95) * amp), id = nd.id, state = nd.state;

  function drawPath(el, scroll) {

  const orderQ = p => shuffle(p.q.map((_, i) => i)).sort((a, b) => p.q[a].d - p.q[b].d);
  function openLevel(id, dir, fromEl, saved) {
    const lv = LEVELS.find(l => l.id === id);
    const label = '<span class="wn">' + ar(levelNum(lv)) + '</span><span class="wt">' + esc(lv.title) + '</span>';
    if (fromEl) { wipe(fromEl, id, label, () => openLevel(id, dir)); return; }
    setTheme(id);
    const steps = [{ k: 'map' }];
    lv.paras.forEach((p, pi) => { steps.push({ k: 'ex', p: pi }); p.q.forEach((_, n) => steps.push({ k: 'q', p: pi, n })); });
    steps.push({ k: 'sum' }, { k: 'done' });

    lv.paras.forEach((p, pi) => { SES.order[pi] = orderQ(p); });

  function openExam(bi, dir, fromEl, saved) {
    const B = BABS[bi]; if (!B) return;
    if (fromEl) { wipe(fromEl, 'exam', '<span class="wn">' + IC.crown.replace('<svg', '<svg style="width:90px;height:90px"') + '</span><span class="wt">امتحان الباب ' + ORD[bi] + '</span>', () => openExam(bi, dir)); return; }
    setTheme('exam');
    /* عند الرجوع إلى امتحان محفوظ تُستعاد الأسئلة نفسها بترتيبها */
    let qs = saved && Array.isArray(saved.qs) && saved.qs.length && saved.qs.every(id => QBYID[id]) ? saved.qs.map(id => QBYID[id]) : null;
    if (!qs) {
      saved = null;
      /* من كل فصل في الباب: سؤال من الأسئلة الأصعب، والبقية موزّعة على محطاته بالتناوب */
      const picks = [], per = Math.max(3, Math.ceil(16 / B.g.length));
      B.g.forEach(gi => {
        const lo = [], hi2 = [], got = [], byLv = {};
        PATHS[gi].lv.forEach(l => { const li = MAIN.indexOf(l); l.paras.forEach(p => p.q.forEach(q => (q.d <= 2 ? lo : hi2).push({ q, li }))); });
        if (hi2.length) got.push(pick(hi2));

        const ks = shuffle(Object.keys(byLv)); let k = 0;
        while (got.length < per && ks.some(x => byLv[x].length)) { const a = byLv[ks[k++ % ks.length]]; if (a.length) got.push(a.pop()); }
        got.forEach(x => picks.push(x));

    }
    const steps = [{ k: 'examintro' }].concat(qs.map((x, n) => ({ k: 'q', q: x.q, n, from: x.li })));
    SES = { kind: 'exam', bab: bi, steps, idx: 0, hearts: EXAM_HEARTS, max: EXAM_HEARTS, mistakes: 0, stars: 0, doubles: 0, combo: 0, total: qs.length };
    const back = !!saved && applyPos(saved);
    SES.screen = mount(shell(), dir); VIEW = 'exam';
    if (back) enterSaved(); else renderStep('fwd');
  }
  const curStep = () => SES.steps[SES.idx];
  function getQ(st) { return SES.kind === 'exam' ? st.q : SES.lv.paras[st.p].q[SES.order[st.p][st.n]]; }

  /* ---------- حفظ مكان الطالب بدقة ----------
     S.pos[id]  آخر موضع داخل كل محطة (وداخل الامتحان بالمفتاح exam): الخطوة والقلوب وترتيب الأسئلة
     S.at       الجلسة المفتوحة الآن؛ عند فتح الصفحة من جديد تُفتح عليها مباشرة

  const sesKey = () => SES.kind === 'exam' ? 'x' + SES.bab : SES.lv.id;
  function snap() {
    if (!SES || !SES.steps) return;
    const st = curStep(), key = sesKey();
    if (st.k === 'done') { delete S.pos[key]; S.at = null; save(); return; }
    S.at = key;
    if (st.k === 'map') { save(); return; }
    const o = { idx: SES.idx, hearts: SES.hearts, mistakes: SES.mistakes, stars: SES.stars, doubles: SES.doubles, combo: SES.combo };
    if (SES.kind === 'exam') o.qs = SES.steps.filter(x => x.k === 'q').map(x => x.q.id);
    else { o.order = SES.order; o.revisit = SES.revisit; S.resume = { id: key, p: st.p || 0 }; }
    if (st.k === 'ex') o.reveal = SES.reveal;
    const c = SES.cur;
    if (st.k === 'q' && c && c.q === getQ(st)) {

  /* يضع الجلسة الحالية على موضع محفوظ بعد التحقق من سلامته */
  function applyPos(p) {

    const k = SES.steps[p.idx | 0].k; if (k === 'map' || k === 'done') return false;
    SES.idx = p.idx | 0;
    SES.hearts = num(p.hearts) ? Math.max(0, Math.min(SES.max, p.hearts | 0)) : SES.max;
    ['mistakes', 'stars', 'doubles', 'combo'].forEach(f => { SES[f] = num(p[f]) ? Math.max(0, p[f] | 0) : 0; });
    if (SES.kind === 'level') SES.lv.paras.forEach((pa, pi) => {
      const o = p.order && p.order[pi];

  /* عند فتح الصفحة: الرجوع إلى الجلسة التي كانت مفتوحة */

    } catch (e) { /* موضع تالف: نتجاهله */ }
    stopTimer(); closeSheet(); SES = null; S.at = null; delete S.pos[key]; save();
    return false;
  }

  function renderStep(dir) {

    /* استكمال سؤال محفوظ: المحاولات السابقة والوقت المتبقي والقلوب كما كانت */

  /* ----- map step ----- */
  /* تنقّل حر بين فقرات المحطة: القراءة مفتوحة دائماً، وأسئلة كل فقرة تُفتح بعد إتمام قراءتها */

  /* ----- explanation step ----- */

  /* ----- question step ----- */
  function stepQ() {

  /* ----- شريط الوقت: إجابة قبل انتهائه = ضعف النجوم ----- */
  let TM = 0;
  function stopTimer() { if (TM) { cancelAnimationFrame(TM); TM = 0; } }
  function startTimer() {

    const box = slide.querySelector('.qtimer'), bar = box.querySelector('.qt-bar i');
    (function loop() {
      TM = 0;
      if (!SES || SES.cur !== c || c.solved || c.tries > 0 || !slide.isConnected) return;
      const left = c.deadline - performance.now(), k = Math.max(0, left / (c.q.sec * 1000));

      const z = k > .5 ? 'a' : k > .22 ? 'b' : 'c'; if (box.dataset.z !== z) box.dataset.z = z;

  function timerState(kind) {

    stopTimer(); box.classList.remove('late', 'miss'); box.classList.add(kind);
    const rw = box.querySelector('.qt-rw');
    rw.querySelector('b').textContent = kind === 'miss' ? Math.ceil(c.q.base / 2) : c.q.base;
    box.querySelector('.qt-msg').textContent = kind === 'miss' ? 'بعد محاولة خاطئة: نصف النجوم' : 'انتهى وقت المضاعفة، ونجوم السؤال باقية';
    rw.classList.remove('rwflip'); void rw.offsetWidth; rw.classList.add('rwflip');
  }

  function stageFlash(cls) {

    st.classList.remove('g-ok', 'g-bad'); void st.offsetWidth; st.classList.add(cls);
  }
  function celebrate(anchor) {
    setTimeout(() => { sfx('win'); burstAt(anchor, 120, 1.4); }, 300);
    if (reduced) return;
    const a = appEl.getBoundingClientRect();
    [[.2, .25, 900], [.8, .3, 1300], [.5, .15, 1700], [.3, .55, 2200], [.7, .5, 2600]].forEach(f => setTimeout(() => { if (appEl.querySelector('.donebody, .cert')) confetti(a.width * f[0], a.height * f[1], 60, 1); }, f[2]));
  }

  function onCorrect(anchor) {
    const c = SES.cur, q = c.q; c.solved = true; stopTimer(); SES.combo++;
    const inTime = c.tries === 0 && performance.now() < c.deadline;
    const award = c.tries > 0 ? Math.ceil(q.base / 2) : inTime ? q.base * 2 : q.base;
    const from = pillVal(); let gain = award;
    if (SES.kind === 'exam') SES.stars += award;
    else { const prev = S.q[q.id] || 0; gain = Math.max(0, award - prev); if (gain) S.q[q.id] = award; SES.stars += gain; }
    if (inTime) SES.doubles++;
    S.best = Math.max(S.best || 0, SES.combo); snap();
    const box = SES.slide.querySelector('.qtimer'); if (box) { box.classList.add('won'); if (c.tries === 0 && !inTime) timerState('late'); }
    sfx(inTime ? 'ok2' : 'ok'); burstAt(anchor, inTime ? 60 : c.tries === 0 ? 36 : 20, inTime ? 1 : .8); stageFlash('g-ok');
    if (gain) flyStars(anchor, gain, from, pillVal());
    SES.slide.querySelector('.hint-slot').innerHTML = q.s ? '<div class="sol"><span class="ni">' + IC.lamp + '</span><div><strong>طريقة الحل</strong><p>' + md(q.s) + '</p></div></div>' : '';
    const up = SES.kind === 'level' ? checkRank() : 0;
    const note = inTime ? '<span class="x2">×2</span> نجوم مضاعفة!' : c.tries > 0 ? 'نصف النجوم بعد محاولة خاطئة' : 'انتهى وقت المضاعفة';
    const kept = SES.kind === 'level' && gain < award ? '<span>' + (gain ? '(يُضاف لرصيدك ' + gain + ')' : '(رصيدك السابق في هذا السؤال محفوظ)') + '</span>' : '';
    const foot = SES.slide.querySelector('.foot'); foot.classList.add('okstate');
    foot.innerHTML = '<div class="fb">' + mascot('happy') + '<div><strong>' + pick(PRAISE) + '</strong><small><span class="gain">+' + award + IC.star + '</span><span>' + note + '</span>' + kept + (SES.combo >= 3 ? '<span class="flame">' + IC.flame + ar(SES.combo) + ' متتالية</span>' : '') + '</small></div></div><button class="btn btn-ok" data-act="next"' + (up ? ' disabled data-wait="1"' : '') + '>متابعة ' + IC.arrow + '</button>';
    const b = foot.querySelector('.btn');
    if (up) setTimeout(() => showRankUp(up), 1000);
    else { try { b.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
    if (q.s) setTimeout(() => { const bd = SES && SES.slide && SES.slide.querySelector('.body'), so = bd && bd.querySelector('.sol'); if (so) bd.scrollTop = Math.max(0, so.offsetTop - bd.clientHeight + so.offsetHeight + 24); }, 80);
  }
  function onWrong() {
    const c = SES.cur; c.tries++; SES.combo = 0; SES.mistakes++; SES.hearts = Math.max(0, SES.hearts - 1);
    snap();
    timerState('miss');

  document.addEventListener('keydown', e => {
    const inField = /INPUT|TEXTAREA/.test((e.target || {}).tagName || '');
    const open = appEl.querySelector('.sheet-wrap');
    if (e.key === 'Escape') { if (open && open.dataset.locked !== '1') ACT.sheetclose(); return; }
    if (inField || open) return;
    if (e.key === 'ArrowLeft') primaryAction();
    const c = SES && SES.cur, st = SES && curStep();
    if (c && st && st.k === 'q' && c.q.t === 'num' && !c.solved) {
      if (/^[0-9]$/.test(e.key)) numKey(e.key);
      else if (e.key === 'Backspace') { e.preventDefault(); numKey('del'); }
      else if (e.key === '-') numKey('neg');
      else if (e.key === '.' || e.key === ',') numKey('.');
      else if (e.key === 'Enter') { e.preventDefault(); numCheck(); }
    }
  });
  let tx = 0, ty = 0;
  host.addEventListener('touchstart', e => { const t = e.touches[0]; tx = t.clientX; ty = t.clientY; }, { passive: true });
  host.addEventListener('touchend', e => {
    const t = e.changedTouches[0]; const dx = t.clientX - tx, dy = t.clientY - ty;
    if (dx > 70 && Math.abs(dy) < 45) primaryAction();
  }, { passive: true });

  window.__MJ = { get S() { return S; }, get SES() { return SES; }, LEVELS, BADGES, emblem, fig, md, totalStars, rankOf, lvMax };

  /* إذا فُتحت الصفحة في أكثر من تبويب: التبويب القديم لا يكتب فوق التقدم الأحدث،
     بل يعيد تحميل نفسه عند الرجوع إليه فيكمل من أحدث موضع محفوظ. */
  const syncTab = () => { if (changedElsewhere()) location.reload(); };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncTab(); });
  window.addEventListener('pageshow', e => { if (e.persisted) syncTab(); });

  if (!restore()) { if (S.intro) { VIEW = 'home'; showHome('fwd'); } else showSplash('fwd'); }
  if (!canStore()) setTimeout(() => toast('تنبيه: المتصفح لا يسمح بالحفظ، فلن يبقى تقدمك بعد إغلاق الصفحة'), 1200);
})();

</script>
