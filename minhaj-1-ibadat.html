, "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "مقدمة المؤلف", "b": [{"pic": ["books", "book"], "cap": "ص٥ - ص١٢"}, {"story": ["مقدمة المؤلف (١ من ٤)، ص٥", ["بسم الله الرحمن الرحيم", "وما توفيقي إلا بالله عليه توكلت وإليه أنيب", "الحمد لله منبه الراقدين في غفلاتهم بمزعجات الإيقاظ، ومنزه التائبين من هفواتهم بملاطفات الوعاظ، ومحدث العارفين في خلواتهم لا بالكلمات والألفاظ، ومحذر الزاهدين شوب(١) شهواتهم حتى قذفوا على الظلماء يسير اللماظ(٢)، وغضوا عن غض المستهى أبصار المنى، واستوقفوا من اللحاظ(٣)، وقاموا إلى محاربة الهوى قيام الليث العبوس الحرب(٤) المغتاظ، وحفظوا ما استحفظوا فحفظوا، وإنما الحفظ للحفاظ.", "أحمده حمدا كثيرا فائت العدد، دائم الإلظاظ(٥)، وأصلي وأسلم على نبيه محمد، الذي أعجز الفصحاء بما جاء به، فنبي قس(٦) يوم عكاظ(٧)، وعلى", "حاشية: (١) الشوب: الخلط، والشوبة: الخديعة. القاموس (شوب).", "حاشية: (٢) اللماظ: جمع لمظة، وهي النكتة من البياض.", "حاشية: (٣) اللحاظ: مؤخر العين، والجمع لحظ.", "حاشية: (٤) يقال: رجل حربب، أي: شديد الحرب شجاع.", "حاشية: (٥) الإلظاظ: لزوم الشيء والمثابرة عليه، والفعل: ألظ، أي: لازم ودام، وفي الحديث: «ألظوا بياذا الجلال والإكرام».", "حاشية: (٦) هو قس بن ساعدة الإيادي، خطيب العرب وحكيمهم، معمر من أهل الفترة. أدركه رسول الله صلى الله عليه وسلم قبل البعثة. توفي نحو سنة ١٠ قبل البعثة. الإصابة ١/٥، والأعلام ٥/١٩٦.", "حاشية: (٧) عكاظ: سوق بين نخلة والطائف، كانت تقوم هلال ذي القعدة، وتستمر عشرين يوما، تجتمع فيها قبائل العرب، فيتعاكظون، أي: يتفاخرون ويتناشدون ما أحدثوا من الشعر. اللسان (عكظ).", "آله(١) وأصحابه أهل اليقين والتقى والاستيقاظ، وعلى أزواجه المبرآت من قول كل جعظري(٢) جواظ(٣)، صلاة أتقي بها يوم البعث حر لظى وشواظ(٤) نار وقودها الناس والحجارة عليها ملائكة غلاظ.", "أما بعد:", "فإني رأيتك أيها المريد الصادق، الحازم العازم، قد وطنت نفسك على التخلي عن فضول الدنيا الشاغلة، وصممت على الانقطاع إلى الآخرة، علما منك أن مخالطة الخلق توجب التخليط، وإهمال المحاسبة للنفس أصل التفريط، وأن العمر إن لم يستدرك أدركه(٥) الفوت، وأن مراحل الأنفاس تسرع بالراكب إلى منزل الموت.", "فنظرت، أي أنيس من الكتب تستصحبه في خلوتك؟ وتستنطقه في حال صمتك؟ فإذا أنت تؤثر كتاب «إحياء علوم الدين»(٦)، وتعلم انفراده عن جنسه، ونفاسته في نفسه، فأخبرتك أن العلم مستند العمل، والمستند ينبغي أن يكون وثيقا.", "وفي كتاب (الإحياء) آفات لا يعلمها إلا العلماء، وأقلها الأحاديث الباطلة الموضوعة، والموقوفة، وقد جعلها مرفوعة(٧)، وإنما نقلها كما افتراها(٨)، لا أنه افتراها. فلا ينبغي التعبد بحديث موضوع، ولا اغترار بلفظ مصنوع.", "حاشية: (١) سقطت من الأصل، واستدركت من المختصر.", "حاشية: (٢) الجعظري: الفظ الغليظ، المتكبر الجافي عن الموعظة، البطر الكفور. اللسان (جعظ)."]], "ic": "book"}, {"story": ["مقدمة المؤلف (٢ من ٤)، ص٦", ["حاشية: (٣) الجواظ: الضخم الغليظ، المتكبر المختال، الكثير الكلام والجلبة في الشر، الفاجر الشرير الضجر البطر. اللسان (جوظ).", "حاشية: (٤) الشواظ: لهب لا دخان فيه. اللسان (شوظ).", "حاشية: (٥) في الأصل: «أدرك»، والمثبت من «المختصر».", "حاشية: (٦) هو تأليف العلامة حجة الإسلام، أبي حامد محمد بن محمد الغزالي الطوسي، وكتابه (الإحياء) أصل هذا الكتاب الذي بين أيدينا، كما هو مبين في المقدمة.", "حاشية: (٧) الحديث الموقوف هو: ما روي عن الصحابة رضي الله عنهم من أقوالهم أو أفعالهم، والحديث المرفوع هو: ما أضيف إلى رسول الله صلى الله عليه وسلم. (إرشاد طلاب الحقائق) ص٧٥.", "حاشية: (٨) اقتراها: أي نقلها قراءة كما رويت.", "وكيف أرتضي لك أن تصلي صلوات الأيام ولياليها، التي حكاها عن الرسول صلى الله عليه وسلم وسطرها، وليس فيها كلمة قالها رسول الله صلى الله عليه وسلم ولا ذكرها؟", "وكيف أوثر أن يطرق سمعك من كلام المتصوفة، الذي جمعه، وندب إلى العمل به ما لا حاصل له، ولا عند الشريعة منه خبر؟ وكأنه شريعة ابتداها القوم، مثل الكلام في الفناء والبقاء، والأمر بشدة الجوع، والتقلل الخارج عن المعهود، والخروج إلى السياحة لا في حاجة، ودخول الفلاة بغير زاد، إلى غير ذلك مما قد كشفت عن عواره(١) في كتابي المسمى بـ«تلبيس إبليس»(٢).", "فقلت لي: قد أوحشتني من هذا الكتاب(٣) بعد أنسي. فقلت: إنما أردت لك ما أردت لنفسي، وسأكتبه لك في كتاب لا يخل بفوائده، ويخلو عن مفاسده، أعتمد فيه من المنقول الأصح والأشهر، ومن المعنى الأثبت والأجود، وأحذف ما يصلح حذفه، وأزيد ما يصلح أن يزاد، ولا أطيل بما لا طائل فيه، شحا عليك وعلى أمثالك، أن يتشاغلوا بفاسد، ويحملوا في مفاوز(٤) المخاطرة المتاع الكاسد، وقد جاء في الأخبار الصحيحة: «الدين النصيحة»(٥).", "**فصل [في المحذوف من كتاب الإحياء]**", "وربما رأيتني أقصر في بعض الأبواب والفصول، وأحذف كثيرا من الأخبار", "حاشية: (١) العوار: بضم العين وفتحها: العيب. القاموس واللسان: (عور).", "حاشية: (٢) كتاب (تلبيس إبليس) لابن الجوزي، طبعاته كثيرة، منها نشر المكتب الثقافي، وأخرى نشر المكتب الإسلامي. ينظر «مؤلفات ابن الجوزي»: ص١١٢.", "حاشية: (٣) يعني: كتاب «إحياء علوم الدين».", "حاشية: (٤) المفاوز: جمع مفازة، وهي: المنجاة والمهلكة، والفلاة لا ماء بها، وهي من الأضداد، القاموس واللسان: (فوز).", "حاشية: (٥) أخرجه مسلم (٥٥) (٩٦)، وأبو داود (٤٩٤٤)، والنسائي في المجتبى ٧/١٥٦ـ٧ وأحمد (١٦٩٤٠)، وعلقه البخاري في صحيحه كما في الفتح ١/١٣٧. من حديث تميم الداري رضي الله عنه.", "والآثار، فلا تظنن ذلك مني سهوا، بل عمدا، لأني لم أترك ذلك إلا لآفة في المتروك، فربما كانت الأحاديث لا تثبت، والآثار لا تصح، وربما قلت فائدتها، وربما تكون قد سبقت، فاعرف ذلك."]], "ic": "book"}, {"story": ["مقدمة المؤلف (٣ من ٤)، ص٨", ["**فصل [في تصنيف كتاب بأغلاط الإحياء]**", "ولما خفت أن تتوق(١) إلى ذلك الكتاب لمكان ألفك له، أفردت في كتاب(٢) ذكر عيوبه، وأوردت هنالك بعض زلاته، لتعلم علة نهيي، وتكتفي عن ثمده(٣) بنهيه(٤) وإنما لم أذكر أغلاطه ها هنا لئلا يتكدر قلب قد شرعنا في تصفيته، أو يتأذى بالتخليط سقيم قد رأينا أول عافيته.", "**فصل [في ذكر السبب الباعث على حذف أكثر الأسانيد]**", "وقد كنت أوثر أن لا أذكر منقولا إلا بإسناده، غير أني رأيت الإطالة سببا للملل، فحذفت أكثر الأسانيد، ولم أر حذف الكل، لأن الإسناد أقوى للأسناد.", "**فصل [في بيان أهمية العلم لإصلاح النفس والتحذير من أهل الأهواء]**", "وإذ قد صح عزمك على العزلة لاستيفاء حق الحق من النفس، والأخذ على يدها، فليكن وكيلك عليها العلم، وكن باحثا عن دقائق هواها لعلك تسلم، واحذر", "حاشية: (١) تاق إليه توقا، أي: اشتاق. القاموس واللسان (تاق).", "حاشية: (٢) يريد المصنف كتابه: «إعلام الأحياء بأغلاط الإحياء»، ذكره حاجي خليفة في «كشف الظنون» ١/٢٤، وإسماعيل البغدادي في «هدية العارفين» ٥/٥٢١، وابن رجب في «الذيل على طبقات الحنابلة» ١/٤١٦ـ٤٢١، وانظر «مؤلفات ابن الجوزي» ص٩٤.", "حاشية: (٣) الثمد: الماء القليل، لا مادة له. القاموس واللسان: (ثمد).", "حاشية: (٤) النهي: بكسر النون وفتحها: الغدير. القاموس واللسان: (نهى).", "سبيل أحد رجلين: عالم عرف الجدال في الفقه، فاقتنع برئاسته، أو نال القضاء فسعى في حفظ منزلته، أو زخرف المواعظ فضيق أعين شبكته. أو زاهد ينقلب برأيه الفاسد في جهالته، ويتقرب بتقبيل يده واعتاد بركته، ويعمل بهواه دون شرع الله وسنته، فهذان عادلان عن(١) منهج الصواب، مقتنعان بقشور الأعمال عن خالص اللباب، خادعان للمبتدئين بلامع السراب، وطريقهما بمعزل عن سنن(٢) السلف الصالح، الذي هو جادة الاستقامة، ولقم(٣) السلامة، وسأدرج لك في هذا الكتاب ـ إن شاء الله ـ من أخبارهم(٤)، ما يدلك على آثارهم.", "وكتابنا هذا يحتاج إليه المنتهي، كما يفتقر إليه المبتدي، لأن فيه أسرار العبادات، والتحذير(٥) من آفات المعاملات، وقد أتيتك به على ترتيب كتاب الإحياء، لعلمي بإيثارك ذلك الترتيب، وما توفيقي إلا بالله عليه توكلت وإليه أنيب.", "(٦)وسميت كتابي هذا: «منهاج القاصدين ومفيد الصادقين»، وأسأل الله سبحانه وتعالى أن ينفعنا به، ومن قرأه، أو سمعه، أو نظر فيه، وأن يجعله خالصا لوجهه الكريم، وأن يختم لنا بخير، ويوفقنا لما يرضيه من القول والعمل والنية، وأن يسامحنا في تقصيرنا وتفريطنا، ولا يكلنا إلى أنفسنا طرفة عين، ولا إلى أحد من خلقه، فإنه حسبنا ونعم الوكيل(٦).", "حاشية: (١) في الأصل: «على»، والمثبت من المختصر.", "حاشية: (٢) السنن: المنهج والطريقة. القاموس واللسان: (سنن).", "حاشية: (٣) اللقم: معظم الطريق ووسطه ومتنه. القاموس واللسان: (لقم)."]], "ic": "book"}, {"story": ["مقدمة المؤلف (٤ من ٤)، ص٩", ["حاشية: (٤) في الأصل: «آثارهم»، والمثبت من المختصر.", "حاشية: (٥) في الأصل: «يحذر»، والمثبت من المختصر.", "حاشية: (٦) سقط من الأصل، وأثبت من المختصر.", "**باب بيان وضع الكتاب**", "هذا الكتاب مقسوم أربعة أرباع:", "الأول: ربع العبادات، والثاني: ربع العادات، والثالث: ربع المهلكات، والرابع: ربع المنجيات.", "فأما ربع العبادات، فيشتمل على عشرة كتب:", "١ـ كتاب العلم. ٢ـ كتاب قواعد العقائد. ٣ـ كتاب أسرار الطهارة. ٤ـ كتاب أسرار الصلاة. ٥ـ كتاب أسرار الزكاة. ٦ـ كتاب أسرار الصوم. ٧ـ كتاب أسرار الحج. ٨ـ كتاب تلاوة القرآن. ٩ـ كتاب الأذكار والدعوات. ١٠ـ كتاب الأوراد في الأوقات.", "وأما ربع العادات، فيشتمل على عشرة كتب:", "١ـ كتاب آداب ال  "d": 2, "q": "وقد كنت أوثر أن لا أذكر منقولا إلا بإسناده، غير أني رأيت الإطالة سببا للملل، فحذفت ____ الأسانيد، ولم أر حذف الكل، لأن الإسناد أقوى للأسناد", "o": ["أكثر", "ثوابا", "وأخرت", "تخرج"], "h": "راجع: ص٨"}, {"t": "fill", "d": 2, "q": "آله وأصحابه أهل اليقين والتقى والاستيقاظ، وعلى أزواجه المبرآت من قول كل جعظري جواظ، صلاة أتقي بها يوم ____ حر لظى وشواظ نار وقودها الناس والحجارة عليها ملائكة غلاظ", "o": ["البعث", "للبدن", "بصير", "أشياخهم"], "h": "راجع: ص٦"}]}], "sum": [["الصفحات", "ص٥ - ص١٢"]], "_nq": 6}, {"id": "l5", "title": "الباب الأول في فضيلة العلم والتعلم والتعليم فضيلة العلم:", "group": "كتاب العلم", "map": {"center": "الباب\nالأول في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الأول في فضيلة العلم والتعلم والتعليم فضيلة العلم: - القسم ١ من ٣", "b": [{"pic": ["books", "book"], "cap": "ص١٤ - ص٣٢"}, {"story": ["الباب الأول في فضيلة العلم والتعلم والتعليم فضيلة العلم: (١ من ١٣)، ص١٥", ["وفيه سبعة أبواب:", "**فضيلة العلم:**", "أما فضل العلم، فقد دل عليه القرآن والسنة والمعقول.", "أما القرآن، فقوله تعالى: ﴿شَهِدَ اللَّهُ أَنَّهُ لَا إِلَٰهَ إِلَّا هُوَ وَالْمَلَائِكَةُ وَأُولُو الْعِلْمِ﴾ [آل عمران: ١٨]. فبدأ بنفسه، ثم ثنى بملائكته، ثم ثلث بأهل العلم، وناهيك(١) بهذا شرفا. وقال تعالى: ﴿يَرْفَعِ اللَّهُ الَّذِينَ آمَنُوا مِنكُمْ وَالَّذِينَ أُوتُوا الْعِلْمَ دَرَجَاتٍ﴾ [المجادلة: ١١].", "قال ابن عباس رضي الله عنهما: «للعلماء درجات فوق المؤمنين بسبعمئة درجة، ما بين الدرجتين مسيرة خمسمئة عام»(٢). وقال تعالى: ﴿هَلْ يَسْتَوِي الَّذِينَ يَعْلَمُونَ وَالَّذِينَ لَا يَعْلَمُونَ﴾ [الزمر: ٩]، وقال سبحانه: ﴿إِنَّمَا يَخْشَى اللَّهَ مِنْ عِبَادِهِ الْعُلَمَاءُ﴾ [فاطر: ٢٨]، وقال عز وجل: ﴿وَمَا يَعْقِلُهَا إِلَّا الْعَالِمُونَ﴾ [العنكبوت: ٤٣].", "حاشية: (١) ناهيك: أي حسبك ويكفيك.", "حاشية: (٢) أخرجه ابن عبد البر في «جامع بيان العلم وفضله» ١/٢٢، من حديث ابن عباس مرفوعا بلفظ: «فضل المؤمن العالم على المؤمن العابد سبعون درجة». وإسناده ضعيف.", "وأما السنة: فأخبرنا هبة الله بن محمد ابن الحصين، قال: أخبرنا الحسن بن علي ابن المذهب، قال: أخبرنا أحمد بن جعفر، قال: حدثنا عبد الله بن أحمد ابن حنبل، قال: حدثني أبي، قال: حدثنا كثير بن هشام، قال: حدثنا جعفر، قال حدثنا يزيد بن الأصم، قال: سمعت معاوية بن أبي سفيان رضي الله عنه روى عن النبي صلى الله عليه وسلم أنه قال: «من يرد الله به خيرا يفقهه في الدين» أخرجاه في الصحيحين(١).", "أخبرنا ابن الحصين، قال: أخبرنا ابن المذهب، قال: أخبرنا أحمد بن جعفر، قال: حدثنا عبد الله بن أحمد ابن حنبل، قال: حدثني أبي، قال: حدثنا هيثم بن خارجة، قال: حدثنا رشدين بن سعد، عن عبد الله بن الوليد، عن أبي حفص، حدثه أنه سمع أنس بن مالك رضي الله عنه يقول: قال رسول الله صلى الله عليه وسلم: «إن مثل العلماء في الأرض كمثل النجوم في السماء، يهتدى بها في ظلمات البر والبحر، فإذا انطمست النجوم أوشك أن تضل الهداة»(٢). أبو حفص اسمه: عمر بن مهاجر الأنصاري(٣).", "أخبرنا عبد الملك بن أبي القاسم الكروخي، قال: حدثنا أبو بكر الغورجي وأبو عامر الأزدي، قالا: أخبرنا الجراحي، قال: أخبرنا المحبوبي، قال: حدثنا الترمذي، قال: حدثنا محمد بن عبد الأعلى، قال: حدثنا سلمة بن رجاء، قال: حدثنا الوليد بن جميل، قال: حدثنا القاسم أبو عبد الرحمن، عن أبي أمامة رضي الله عنه، قال: ذكر لرسول الله صلى الله عليه وسلم رجلان، أحدهما عابد، والآخر عالم، فقال رسول الله صلى الله عليه وسلم: «فضل العالم على العابد كفضلي على أدناكم»(٤).", "حاشية: (١) أخرجه البخاري (٧١)، (٣١١٦)، (٧٣١٢)، ومسلم (١٠٣٧)."]], "ic": "book"}, {"story": ["الباب الأول في فضيلة العلم والتعلم والتعليم فضيلة العلم: (٢ من ١٣)، ص١٦", ["حاشية: (٢) إسناده ضعيف جدا، أخرجه أحمد في المسند في الأمثال (٥١)، والخطيب في الفقيه والمتفقه ٢/٧٠.", "حاشية: (٣) ذكره ابن أبي حاتم في «الجرح والتعديل» مرتين: الترجمة (٧٣٩) و(١٦٤٢) ولم يذكر فيه شيئا. وقال الهيثمي في «مجمع الزوائد» ١/١٢١: مجهول.", "حاشية: (٤) أخرجه الترمذي (٢٦٨٥)، والطبراني في الكبير (٧٩١١) وابن عبد البر في «جامع بيان العلم»، والخطيب البغدادي في تاريخه ٨/١٠٧.", "وقد روى النعمان بن بشير رضي الله عنهما، عن النبي صلى الله عليه وسلم، أنه قال: «يوزن مداد(١) العلماء مع دم الشهداء، فيرجح مداد العلماء على دم الشهداء»(٢).", "وروى أبو الدرداء رضي الله عنه عن النبي صلى الله عليه وسلم، أنه قال: «فضل العالم على العابد، كفضل القمر ليلة البدر على سائر الكواكب، وإن العلماء ورثة الأنبياء، وإن الأنبياء لم يورثوا دينارا ولا درهما، إنما(٣) ورثوا العلم، فمن أخذه أخذ بحظ وافر»(٤).", "وروى أبو بكر الصديق رضي الله عنه، عن النبي صلى الله عليه وسلم أنه قال: «من تعلم بابا من العلم فعمل به، أو علمه جاهلا يعمل به، كان خيرا له من أن لو كانت الدنيا ما بين المشرق والمغرب له ذهبة حمراء، فأنفقها في سبيل الله عز وجل»(٥).", "**ذكر الآثار في فضل العلم**", "أخبرنا عبد الله بن علي المقرئ، قال: أخبرنا حمزة بن محمد الزبيري، قال: أخبرنا عبد الرحمن بن عبيد الله، أبو القاسم الحرفي، قال: حدثنا حبيب بن الحسن بن داود القزاز، قال: حدثنا موسى بن إسحاق الأنصاري، قال: حدثنا ضرار بن صرد، قال: حدثنا عاصم بن حميد، عن أبي حمزة الثمالي، عن", "حاشية: (١) المداد: الجبر.", "حاشية: (٢) أخرجه ابن الجوزي في «العلل المتناهية» (٨٥) وقال: لا يصح، ويروى عن ابن عمر، وابن عمرو، وعمران بن حصين، وأنس، وأبي الدرداء، ولا يخلو إسناد واحد منهم من كذاب أو وضاع أو متروك. وذكره الذهبي في «ميزان الاعتدال» ٣/١٧ وقال: متنه موضوع، وتبعه ابن حجر في «لسان الميزان» ٥/١٢٥ ونقل عن شيخه في ٥/٢٢٦ قوله: إنه كذب. ويروى عن الحسن البصري من كلامه كما في «المقاصد الحسنة» (١٠٠٥).", "حاشية: (٣) سقطت من الأصل.", "حاشية: (٤) أخرجه أبو داود (٣٦٤١) و(٣٦٤٢)، والترمذي (٢٦٨٢)، وابن ماجه (٢٣٩) وأحمد (٢١٧١٥)، وابن عبد البر في «جامع بيان العلم» ١/٣٧.", "حاشية: (٥) لم أجده بلفظه، لكن أخرج ابن ماجه (٢١٩) من حديث أبي ذر مرفوعا بلفظ: «ولأن تغدو فتعلم بابا من العلم، عمل به أو لم يعمل، خير من أن تصلي ألف ركعة». وإسناده ضعيف. وأخرج الخطيب في (الفقيه والمتفقه) ١/١٦ نحوه موقوفا على أبي هريرة بإسناد حسن، وآخر من كلام الحسن البصري بإسناد صحيح.", "عبد الرحمن بن جندب، عن كميل بن زياد النخعي، قال: أخذ علي بن أبي طالب رضي الله عنه بيدي، فأخرجني إلى ناحية الجبان(١)، فلما أصحرنا(٢) جلس، ثم تنفس الصعداء(٣)، ثم قال:"]], "ic": "book"}, {"story": ["الباب الأول في فضيلة العلم والتعلم والتعليم فضيلة العلم: (٣ من ١٣)، ص١٨", ["يا كميل بن زياد، القلوب أوعية، فخيرها أوعاها، فاحفظ عني ما أقول لك:", "الناس ثلاثة: عالم رباني، ومتعلم على سبيل نجاة، وهمج(٤) رعاع(٥) أتباع كل ناعق، يميلون مع كل ريح، لم يستضيئوا بنور العلم، ولم يلجؤوا إلى ركن وثيق.", "العلم خير من المال، العلم يحرسك، وأنت تحرس المال، المال تنقصه النفقة، والعلم يزكو على الإنفاق(٦)، وصنيعة المال تزول بزواله، ومحبة العالم دين يدان به، تكسبه الطاعة في حياته، وجميل الأحدوثة بعد موته، والعلم حاكم، والمال محكوم عليه.", "مات خزان المال وهم أحياء، والعلماء باقون ما بقي الدهر، أعيانهم مفقودة، وأمثالهم في القلوب موجودة، هاه. إن هاهنا ـ وأشار بيده إلى صدره ـ علما، لو أصبت له حملة، بلى أصبته لقنا غير مأمون عليه، يستعمل آلة الدين للدنيا، يستظهر بنعم الله على عباده، وبحججه على كتابه، أو منقادا لأهل الحق، لا بصيرة له في أحنائه(٧)، ينقدح الشك في قلبه بأول عارض من شبهة، لا ذا ولا ذاك،", "حاشية: (١) الجبان والجبانة: المقبرة والصحراء. القاموس: (جبن).", "حاشية: (٢) كذا في «تهذيب الكمال» و«حلية الأولياء»، وفي الأصل: (أصحر). يقال: أصحر القوم، إذا برزوا في الصحراء. القاموس واللسان: (صحر).", "حاشية: (٣) ليست في الأصل، بل زيدت من العقد الفريد ونهج البلاغة ص٥٩٤، يقال: تنفس الصعداء: إذا تنفس تنفسا طويلا أو بتوجع. القاموس واللسان: (صعد).", "حاشية: (٤) الهمج: الحمقى والهمل الذين لا نظام لهم ولا مروءة ولا عقل، وأراذل الناس. اللسان: (همج).", "حاشية: (٥) الرعاع: الأحداث الأوغاد من الناس وسقاطهم وسفلتهم. اللسان: (رعع)", "حاشية: (٦) في الأصل: «والعلم»، والمثبت من «الإحياء» و«النهج البلاغة».", "حاشية: (٧) أحنائه: جوانبه وأطرافه، مفردها: حنو. اللسان: (حنو).", "فمنهومهم باللذات، سلس القياد للشهوات، أو مغرى بجمع الأموال والادخار، (١-١)ليسا من رعاة الدين في شيء(١-١)، أقرب شبها بهما الأنعام السائمة، كذلك يموت العلم بموت حامليه.", "اللهم بلى! لا تخلو الأرض من قائم لله بحجة، (٢-٢)إما ظاهرا مشهورا، أو خائفا مغمورا(٢-٢)، لئلا تبطل حجج الله وبيناته، وكم ذا... وأين أولئك؟", "أولئك والله(٣) الأقلون عددا، الأعظمون عند الله قدرا، بهم يحفظ الله تعالى حججه، حتى يؤدوها إلى نظرائهم، ويزرعوها في قلوب أشباههم، هجم بهم العلم على حقيقة الأمر، (٤-٤)وباشروا روح اليقين(٤-٤)، فاستلانوا ما استوعر منه المترفون، وأنسوا بما استوحش منه الجاهلون، صحبوا الدنيا بأبدان أرواحها معلقة بالمحل الأعلى.", "يا كميل، أولئك خلفاء الله في أرضه، والدعاة إلى دينه، هاه هاه، شوقا إلى رؤيتهم، وأستغفر الله لي ولك، إذا شئت فقم(٥)."]], "ic": "book"}, {"story": ["الباب الأول في فضيلة العلم والتعلم والتعليم فضيلة العلم: (٤ من ١٣)، ص١٩", ["وقال علي رضي الله عنه: إن العالم أعظم أجرا من الصائم القائم، الغازي في سبيل الله، وإذا مات العالم انثلمت في الإسلام ثلمة(٦)، لا يسدها شيء إلى يوم القيامة(٧).", "حاشية: (١-١) سقط من الأصل، واستدرك من «الحلية» و«العقد الفريد» و«تهذيب الكمال».", "حاشية: (٢-٢) سقط من الأصل، واستدرك من «الحلية» و«العقد الفريد».", "حاشية: (٣) ليست في الأصل.", "حاشية: (٤-٤) سقط من الأصل، واستدرك من «الحلية» و«العقد الفريد».", "حاشية: (٥) إسناده تالف، كميل بن زياد من المفرطين في علي رضي الله عنه يروي عنه المعضل??? ويضع فيه الموضوعات، والأثر في «حلية الأولياء» ١/٧٩، و«تهذيب الكمال» ٦/٧٦، ١٧٧، و«تذكرة الحفاظ» ١/١١، و«العقد الفريد» ٢/٢١١، و«تاريخ بغداد» ٦/٣٧٩، و«الفقيه والمتفقه» ١/٥٠، و«التدوين» للقزويني ٣/٢٠٨.", "حاشية: (٦) الثلمة: الفرجة والكسر في الحائط والبناء وغيره «اللسان»: (ثلم).", "حاشية: (٧) أخرجه الخطيب في الجامع لأخلاق الراوي (٣٥٠) بتمامه، بإسناد ضعيف معضل، يرويه محمد بن سلام الجمحي المولود سنة ١٥٠هـ، عن علي رضي الله عنه المتوفى", "وأخبرنا محمد بن عبد الباقي البزاز، قال: أخبرنا أبو محمد الجوهري، قال: أخبرنا علي بن محمد ابن لؤلؤ، قال: أخبرنا حمزة بن محمد الكاتب، قال: حدثنا نعيم بن حماد، قال: أخبرنا خارجة بن مصعب، عن داود بن أبي هند، عن الشعبي، عن ابن عباس رضي الله عنهما قال: والله لعالم واحد أشد على الشيطان من ألف عابد(١). وقد روي مرفوعا، ولا يصح رفعه(٢).", "وقال ابن عباس رضي الله عنهما: تذاكر العلم بعض ليلة أحب إلي من إحيائها(٣).", "وقال مجاهد في قوله تعالى: ﴿وَأُولِي الْأَمْرِ مِنكُمْ﴾ [النساء: ٥٩] قال: أولو العلم. وفي رواية عنه: هم الفقهاء والعلماء(٤).", "وكذلك روى أبو زرعة عن الإمام أحمد ـ رحمه الله ـ في قوله تعالى: ﴿وَأُولِي", "حاشية (تتمة): سنة ٤٠هـ، وابن سلام لا يكتب حديثه (ميزان الاعتدال) ٣/٥٦٧ـ٥٦٨. ويروى مرفوعا، ولا يصح. وأخرجه أحمد في «الزهد» ص٣٢١، والدارمي (٣٣٣)، عن الحسن البصري قال: كانوا يقولون: إذا مات العالم... فذكره، ولم يسم الذين كانوا يقولون. لكن أخرجه البيهقي في «شعب الإيمان» (١٧١٩) عن الحسن البصري قال: قال ابن مسعود... فذكره موقوفا. ولا يعرف للحسن ا  فإنه لم يفضل بقوته، فإن الجمل أقوى منه، ولا بشجاعته، فإن الأسد أشجع منه، ولا بكثرة أكله، فإن بطن البعير أوسع من بطنه، ولا بكثرة سفاده(١)، فإن العصفور أقوى على السفاد منه، وإنما خصيصته التي بها فضل: العلم، وبتلك العلة أسجد الله عز وجل الملائكة لآدم، ومن أعجب فضائل العلم أنه يفرح من نسب إليه وإن لم يكن من أهله، ويحزن من سلب عنه وإن كان جاهلا.", "**الشواهد العقلية**", "إذا أردت أن تعلم فضيلة الشيء، فافهم ما الفضيلة، فإنك لو أردت أن تعلم هل زيد فقيه أم لا؟ لم تقدر على ذلك حتى تعرف ما الفقه.", "والفضيلة مأخوذة من الفضل، وهو الزيادة، فإذا اشترك شيئان في أمر، وزاد أحدهما في ذلك الأمر، قيل: له فضيلة، غير أن تلك الزيادة إنما تكون فيما هو كمال ذلك الشيء، كما يقال: الفرس أفضل من الحمار. بمعنى: أنه يشاركه في قوة الحمل، ويزيد عليه في الكر والفر، وحسن الصورة، ولو زاد بعض الناس بزيادة أصبع، كانت تلك الزيادة نقصا في المعنى؛ لأنها ليست من الكمال في شيء، فإذا عرفت أن العلم فضيلة؛ لأنه زيادة تتمم المعنى، وعلى مقدار التزيد منه تزيد الفضيلة.", "واعلم أن الشيء النفيس المرغوب فيه ينقسم إلى ما يطلب لغيره، كالدراهم، وإلى ما يطلب لذاته، كالسعادة في الآخرة، وإلى ما يطلب لذاته ولغيره، كسلامة البدن، فإنها تطلب لنفسها من حيث إنها سلامة من الألم، ومطلوبة لغيرها من جهة التوصل بها إلى المآرب.", "فإذا نظرت إلى العلم رأيته مطلوبا لذاته، ووسيلة إلى تحصيل المنافع في الدنيا والآخرة، وذريعة إلى القرب من الله عز وجل، فلا يتوصل إليه إلا به، وإذا كان العلم سببا لذلك دل على أنه أفضل الأشياء.", "حاشية: (١) السفاد: نزو الذكر على الأنثى، وهو الجماع.", "ومن وجه آخر؛ وهو أنك إذا أردت أن تعرف فضل الشيء، فانظر في ثمرته، ومعلوم أن ثمرة العلم في الدنيا العز والوقار، ونفوذ الحكم على الملوك، ونيل الاحترام من الخلق، حتى إن أغبياء الترك، وأجلاف العرب، يعظمون أشياخهم، لاختصاصهم بمزيد علم مستفاد من التجربة؛ بل البهيمة بطبعها توقر الإنسان، لشعورها بتميزه بكمال مجاوز لدرجتها.", "وأما ثمرته في الآخرة، فالقرب من الله عز وجل، ونيل السعادة التامة الأبدية، ويوضح ما ذكرنا؛ أن مقاصد الخلق مجموعة في الدين والدنيا، ولا ينتظم الدين إلا بانتظام الدنيا؛ لأنها مزرعة الآخرة، ولا ينتظم أمر الدنيا إلا بصناعة الآدميين، وصناعاتهم على ثلاثة أقسام: أحدها: أصول لا قوام(١) للعالم بدونها، وهي أربعة: ١ـ الزراعة، وهي للمطعم، ٢ـ والحياكة، للملبس، ٣ـ والبناء، للسكنى، ٤ـ والسياسة، للتأليف والاجتماع، والتعاون على أسباب المعاش."]], "ic": "book"}, {"story": ["الباب الأول في فضيلة العلم والتعلم والتعليم فضيلة العلم: (٧ من ١٣)، ص٢٣", ["والقسم الثاني: ما هو كالخادم لهذه الأصول، كالحدادة، فإنها تخدم الزراعة، والغزل والحلج(٢)، فإنه كالخادم للحياكة.", "والقسم الثالث: ما هو متمم للأصول ومزين لها، كالطحن والخبز للزراعة، والقصارة(٣) والخياطة للحياكة، وذلك بالإضافة إلى قوام أمر العالم الأرضي، مثل أجزاء الشخص بالإضافة إليه، فإنها على ثلاثة أضرب:", "١ـ أما الأصول: فكالقلب والكبد والدماغ.", "٢ـ وأما الخادم لها: فكالعروق والمعدة والأعصاب ونحوها.", "٣ـ وأما المكمل والمزين: فكالأظفار والأصابع والحاجبين.", "حاشية: (١) القوام: بكسر القاف: نظام الأمر، وعماده وملاكه. اللسان: (قوم).", "حاشية: (٢) الحلج: ويقال: حلج القطن يحلجه ويحلجه حلجا بالمحلاج: ندفه. تاج العروس: (حلج).", "حاشية: (٣) القصارة، بكسر القاف: تبييض الثياب بالمقصرة وهي: خشبة تدق بها الثياب، والعامل فيها: قصار ومقصر، والفعل: قصر يقصر. اللسان وتاج العروس: (قصر).", "وأشرف هذه الصناعات أصولها، وأشرف أصولها السياسة؛ لأنها سبب لإصلاح الأمور واستقامتها، ولذلك تستدعي الصناعات الأخر كمال القائم بها ما لا تستدعي سائر الصناعات، ولذلك يستخدم السائس(١) سائر الصناع، فقد بان فضل السائس على غيره لمزية التصرف، وشرف الصناعة يعرف إما بالآلة التي يتوصل بها إلى تحصيلها، كفضل العلوم العقلية على اللغوية، من جهة أن الحكمة تدرك بالعقل، واللغة بالسمع، والعقل أشرف من السمع، وإما بالنظر إلى عموم النفع، كفضل الزراعة على الصياغة، وإما بملاحظة المحل الذي فيه التصرف، كفضل الصياغة على الدباغة، لأن محل أحدهما الذهب، ومحل الآخر جلد الميتة، وهذه الأمور قد اجتمعت في العلم.", "أما الآلة، فإن العلم يدرك بصفاء الذكاء، وكمال العقل، وجودة الفهم.", "وأما عموم النفع، فإن نفع العلم أعم، وثمرته سعادة الآخرة، وأما المحل، فإن أشرف الموجودات على ظهر الأرض جنس الإنس، وأشرف جزء من الإنسان قلبه، والمعلم مشتغل بتطهيره وتكميله، فهو كالخليفة عن الله تعالى في تثقيف عبده، وإصلاحه لخدمته، وهو بذلك متعبد لله عز وجل، وكيف لا، وهو واسطة بين الرب والعبد؟!!", "**فصل [الاشتغال بالعلم خير من الاشتغال بالنافلة]**", "وقد يقع لبعض من يقل فهمه أن العمل أفضل من العلم، ويشير بذلك إلى النفل بالصلاة والصوم، ويحتج بأن المراد من العلم العمل، وهذا غلط؛ لأن العلم يحصل بسعي القلب، وإنضاء(٢) راحلة الفكر، فكيف لا يكون أفضل من أعمال", "حاشية: (١) السائس: من يقوم على الشيء بما يصلحه، أو الوالي يسوس رعيته، أو القائم على شؤون الدواب وتذليلها. القاموس واللسان: (سوس).", "حاشية: (٢) يقال: نضا الرجل السيف، إذا سله من غمده. اللسان: (نضو).", "الجوارح الظاهرة، وهو عمل أشرف الجوارح الباطنة؟! فالتعلم والتعليم أفضل من كل نافلة. قال مطرف بن عبد الله: فضل العلم خير من فضل العبادة(١)."]], "ic": "book"}, {"story": ["الباب الأول في فضيلة العلم والتعلم والتعليم فضيلة العلم: (٨ من ١٣)، ص٢٥", ["قلت: وكم من عابد قل علمه، فحركه الشيطان إلى التخاشع وإقامة الناموس(٢)، فربما توقع إجابة دعائه عاجلا، لمكان ما يعتقده من الجاه له عند الله، فإذا لم ير لذلك أثرا تأفف في باطنه تأفف الأجير الذي لم يوف أجرته، وكل هذه الآفات سببها قلة العلم.", "ولقد حسن إبليس لأقوام كثيرين دفن كتب العلم ليمشوا في الظلامة؛ لأن العلم نور.", "فإياك إياك والإعراض عن العلم، أو أن تؤثر عليه التعبد بغيره.", "**فضيلة التعلم**", "أما الآيات: فقد قال الله تعالى: ﴿فَلَوْلَا نَفَرَ مِن كُلِّ فِرْقَةٍ مِّنْهُمْ طَائِفَةٌ لِّيَتَفَقَّهُوا فِي الدِّينِ﴾ [التوبة: ١٢٢]. وقال: ﴿فَاسْأَلُوا أَهْلَ الذِّكْرِ إِن كُنتُمْ لَا تَعْلَمُونَ﴾ [النحل: ٤٣ والأنبياء: ٧].", "وأما الأخبار: فقد أخبرنا ابن الحصين، قال: أخبرنا ابن المذهب، قال: أخبرنا أحمد بن جعفر، قال: أخبرنا عبد الله بن أحمد، قال: حدثني أبي، قال: أخبرني يونس، قال: أخبرنا حماد ـ يعني ابن سلمة ـ، عن عاصم، عن زر، عن صفوان بن عسال، أن النبي صلى الله عليه وسلم قال: «إن الملائكة لتضع أجنحتها لطالب العلم رضى بما يطلب»(٣).", "حاشية: (١) أخرجه ابن سعد في «الطبقات» ٧/١٤٢، وأبو خيثمة في «العلم»: (١٣) والفسوي في «المعرفة والتاريخ» ٢/٨٢ـ٨٣، والبيهقي في «شعب الإيمان»: (١٧٠٦)، وابن عبد البر في «جامع بيان العلم» ١/٢٣ـ٢٤ بإسناد صحيح من قول مطرف.", "حاشية: (٢) الناموس: بيت الراهب. تاج العروس: (نمس).", "حاشية: (٣) أخرجه أحمد (١٨٠٨٩) و(١٨٠٩٥) و(١٨١٠٠) والطيالسي (١١٦٥)، والترمذي (٣٥٣٥) و(٣٥٣٦)، والنسائي ١/٩٨، وابن ماجه (٢٢٦) وابن حبان (١٣١٩) و(١٣٢١)", "وقد ذكر أبو سليمان الخطابي(١) في معنى وضع الملائكة أجنحتها ثلاثة أقوال:", "أحدها: أنه بسط الأجنحة.", "والثاني: أنه بمعنى التواضع من الملائكة تعظيما للطالب.", "والثالث: أن يراد به النزول عند مجالس العلم، وترك الطيران، كقوله صلى الله عليه وسلم: «ما من قوم يذكرون الله إلا حفت بهم الملائكة»(٢).", "وقد روي عن النبي صلى الله عليه وسلم أنه قال: «من خرج في طلب العلم، فهو في سبيل الله حتى يرجع»(٣).", "وقال صلى الله عليه وسلم: «من سلك طريقا يبتغي فيه علما سهل الله له به طريقا إلى الجنة»(٤).", "وقال صلى الله عليه وسلم: «من جاءه الموت وهو يطلب العلم ليحيي به الإسلام، فبينه وبين الأنبياء في الجنة درجة واحدة»(٥).", "حاشية (تتمة): و(١٣٢٥)، والطبراني في الكبير ٨/(٧٣٥٢) و(٧٣٥٣) و(٧٣٥٩) و(٧٣٦٠) وابن عبد البر في «جامع بيان العلم» ١/٣٢ـ٣٣، وأبو خيثمة في «العلم»: (٥).", "حاشية: (١) في كتابه «معالم السنن» ٥/٢٤٣ـ٢٤٤.", "حاشية: (٢) أخرجه مسلم (٢٧٠٠)، والترمذي (٣٣٧٨)، وابن ماجه (٣٧٩١) وأحمد (٧٤٢٧) من حديث أبي هريرة.", "حاشية: (٣) أخرجه الترمذي (٢٦٤٧)، والطبراني في «الصغير»: (٣٨٠) من حديث أنس."]], "ic": "book"}, {"story": ["الباب الأول في فضيلة العلم والتعلم والتعليم فضيلة العلم: (٩ من ١٣)، ص٢٦", ["حاشية: (٤) حديث صحيح، أخرجه أحمد (٧٤٢٧)، ومسلم (٢٦٩٩)، وأبو داود (٣٦٤٣)، والترمذي (٢٦٤٦) و(٢٩٤٥)، وابن ماجه (٢٢٥) من حديث أبي هريرة. وتقدم تخريجه ص١٤ من حديث أبي الدرداء.", "حاشية: (٥) حديث ضعيف، أخرجه الطبراني في (الأوسط): (٩٤٥٠)، والخطيب في «الفقيه والمتفقه» ٢/٨٥، وتاريخ بغداد: ٣/٧٨: وابن عبد البر في جامع بيان العلم: ١/٩٥، بإسناد تالف عن ابن عباس. وأخرجه ابن النجار في الذيل على تاريخ بغداد ١٨/١٣٦ عن أنس، قال العراقي: وإسناده ضعيف (إتحاف السادة المتقين) ١/١٠١.", "وأخرجه ابن عبد البر في جامع بيان العلم ١/٤٦، عن الحسن مرسلا. وفيه اختلاف كبير في وصله وإرساله.", "وأما الآثار: فقد قال ابن عباس رضي الله عنهما: ذللت طالبا، فعززت مطلوبا.", "وقال أبو الدرداء: لأن أتعلم مسألة أحب إلي من قيام ليلة(١). وقال أيضا: العالم والمتعلم شريكان في الخير، وسائر الناس همج لا خير فيهم(٢). وقال أيضا: كن عالما أو متعلما أو مستمعا أو محبا، ولا تكن الخامس فتهلك(٣).", "وقال لقمان لابنه: جالس العلماء، وزاحمهم بركبتيك، فإن الله يحيي القلوب بنور الحكمة، كما يحيي الأرض بوابل السماء(٤).", "وقال سفيان الثوري: ليس بعد الفرائض عمل أفضل من طلب العلم(٥).", "حاشية: (١) أخرجه الخطيب في (الفقيه والمتفقه) ١/١٦ و١٧، بإسنادين فيهما انقطاع.", "حاشية: (٢) أخرجه ابن المبارك في (الزهد) (٥٤٣)، وابن أبي شيبة في (المصنف): (٦١٧٢) و(٦١٧٣)، والفسوي في (المعرفة والتاريخ) ٣/٣٩٨، وأبو نعيم في (الحلية) ١/٢١٢ـ٢١٣، وابن عبد البر في (جامع بيان العلم) ١/٢٧ و٢٨، بإسنادين فيهما انقطاع موقوفا على أبي الدرداء، وروي مرفوعا عن أبي الدرداء وأبي سعيد وابن مسعود وأبي أمامة وابن عباس رضي الله عنهم، ولا يخلو إسناد واحد من مقال، وانظر (إرواء الغليل) (٤١٤).", "حاشية: (٣) أخرجه الفسوي في (المعرفة والتاريخ) ٣/٣٩٨، وابن عبد البر في (جامع بيان العلم) ١/٢٨ـ٢٩، عن أبي الدرداء موقوفا بإسناد منقطع.", "وأخرجه ابن عبد البر ١/٢٩ عن ابن مسعود موقوفا بأسانيد مجموعها حسن.", "وأخرجه أيضا في ١/٣٠ عن أبي بكرة مرفوعا بإسناد ضعيف.", "وقوله: (ولا تكن الخامس) أي: لا تكن مبتدعا، أو لا تكن مبغضا لعلم وأهله.", "حاشية: (٤) أخرجه الطبراني في (الكبير) ٨/(٧٨١٠)، عن أبي أمامة الباهلي، مرفوعا بإسناد ضعيف جدا. وأخرجه ابن المبارك في (الزهد) (١٣٨٧) عن عبد الوهاب بن بخت المكي، وابن عبد البر في (جامع بيان العلم) ١/١٠٦، عن سليمان بن طرخان التيمي، وعن سليمان بن حبيب المحاربي، فرقهما، قالوا: قال لقمان لابنه: .... فذكروه، والثلاثة تابعيون، لم يذكروا ممن سمعوه، ورجال ابن المبارك، ورجال أحد إسنادي ابن عبد البر ثقات.", "حاشية: (٥) أخرجه البيهقي في (مناقب الشافعي) ٢/١٣٨، بإسناد صحيح من كلام الشافعي رحمه الله، وهو الصواب."]], "ic": "book"}, {"story": ["الباب الأول في فضيلة العلم والتعلم والتعليم فضيلة العلم: (١٠ من ١٣)، ص٢٧", ["وأخرجه ابن عبد البر في (جامع بيان العلم) ١/٢٥، بإسناد ضعيف، عن الثوري بلفظ: (لا أعلم من العبادة شيئا أفضل من أن يعلم الناس العلم).", "وقال المعافى بن عمران: كتابة حديث واحد أحب إلي من صلاة ليلة(١).", "وقال عبد الله بن المبارك: عجبت لمن لم يطلب العلم كيف تدعوه نفسه إلى مكرمة(٢).", "وقال الشافعي رحمه الله: طلب العلم أفضل من صلاة نافلة(٣).", "وسأل رجل أحمد بن حنبل رحمه الله، فقال: أنسخ في الليل أو أصلي؟ فقال له: إن كنت متعلما تنسخ.", "وقال يوسف بن أسباط: باب من العلم تتعلمه أفضل من سبعين غزوة(٤).", "**فضيلة التعليم**", "أما الآيات: فقد قال الله عز وجل: ﴿وَإِذْ أَخَذَ اللَّهُ مِيثَاقَ الَّذِينَ أُوتُوا الْكِتَابَ لَتُبَيِّنُنَّهُ لِلنَّاسِ وَلَا تَكْتُمُونَهُ﴾، [آل عمران: ١٨٧]. وقال عز وجل: ﴿وَلِيُنذِرُوا قَوْمَهُمْ إِذَا رَجَعُوا إِلَيْهِمْ﴾، [التوبة: ١٢٢]. وقال الله عز وجل: ﴿ادْعُ إِلَىٰ سَبِيلِ رَبِّكَ بِالْحِكْمَةِ وَالْمَوْعِظَةِ الْحَسَنَةِ﴾، [النحل: ١٢٥]. وقال سبحانه وتعالى: ﴿وَمَنْ أَحْسَنُ قَوْلًا مِّمَّن دَعَا إِلَى اللَّهِ وَعَمِلَ صَالِحًا﴾، [فصلت: ٣٣]، وقال الله تعالى: ﴿قُلْ هَٰذِهِ سَبِيلِي أَدْعُو إِلَى اللَّهِ عَلَىٰ بَصِيرَةٍ أَنَا وَمَنِ اتَّبَعَنِي﴾ [يوسف: ١٠٨].", "وأما الأخبار: فأخبرنا هبة الله بن محمد بن الحصين، قال: أخبرنا أبو علي الحسن بن علي ابن المذهب، قال: أخبرنا أبو بكر أحمد بن جعفر القطيعي، قال: حدثنا عبد الله بن أحمد، قال: حدثني أبي، قال: حدثنا قتيبة، قال: حدثنا يعقوب بن عبد الرحمن، عن أبي حازم، عن سهل بن سعد، أن رسول الله صلى الله عليه وسلم قال", "حاشية: (١) أخرجه الخطيب في «شرف أصحاب الحديث»: (١٨٤)، وذكره ابن عبد البر في «جامع بيان العلم» ١/٢٤.", "حاشية: (٢) ذكره ابن عبد البر في «جامع بيان العلم» ١/٥٧ و٦٠.", "حاشية: (٣) أخرجه أبو نعيم في «الحلية» ٩/١١٩، والبيهقي في «مناقب الشافعي» ٢/١٣٨، وابن عبد البر في «جامع بيان العلم» ١/٢٥، والرازي في آداب الشافعي: ٩٧.", "حاشية: (٤) أخرجه الخطيب في «الفقيه والمتفقه» ١/١٦ عن أبي هريرة بنحوه موقوفا عليه.", "لعلي رضي الله عنه: «والله لأن يهدي الله بك رجلا واحدا خير لك من أن يكون لك حمر النعم» أخرجاه في الصحيحين(١)."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "فانظر ـ رحمك الله ـ إلى هذا الحديث، ما أوقعه على الخلق!! فإن الفقهاء أولي الفهم كمثل البقاع التي قبلت الماء فأنبتت؛ لأنهم علموا وفهموا، وفرعوا وعلموا، وإن عامة الناقلين من المحدثين الذين لم يرزقوا الفقه والفهم، كمثل ____، حفظت الماء، وهؤلاء حفظوا ما عندهم فانتفع به", "o": ["الأجادب", "العذر", "فيكونوا", "الخطيب"], "h": "راجع: ص٢٩"}, {"t": "fill", "d": 2, "q": "والقسم الثاني: ما هو كالخ لاء حفظوا ما عندهم فانتفع به. وأما الذين سمعوا ولم يتعلموا ولم يحفظوا، فهم العوام الجهلة.", "أخبرنا هبة الله بن محمد، قال: أخبرنا الحسن بن علي(٦)، قال: أخبرنا أبو بكر بن مالك، قال: حدثنا عبد الله بن أحمد، قال: حدثني أبي، قال: حدثنا", "حاشية: (١) أخرجه البخاري (٢٩٤٢)، ومسلم (٢٤٠٦).", "حاشية: (٢) كذا في الأصل والبخاري، وعند مسلم: «ورعوا».", "حاشية: (٣) كذا في الأصل، وفي الصحيحين: «بذلك».", "حاشية: (٤) أخرجه البخاري (٧٩)، ومسلم (٢٢٨٢).", "حاشية: (٥) ما أوقعه على الخلق، أي: كم هو موافق لأحوال وأنواع الخلق.", "حاشية: (٦) هو: ابن المذهب.", "وكيع، قال: أخبرنا هشام، عن أبيه، عن عبد الله بن عمرو رضي الله عنهما قال: قال رسول الله صلى الله عليه وسلم: «إن الله عز وجل لا يقبض العلم انتزاعا ينتزعه من الناس، ولكن يقبض العلم بقبض العلماء، حتى إذا لم يبق عالما اتخذ الناس رؤوسا جهالا، فسئلوا، فأفتوا بغير علم، فضلوا وأضلوا» أخرجاه في الصحيحين(١).", "أخبرنا سعيد بن أحمد بن الحسن ابن البناء، قال: أخبرنا أبو القاسم بن البسري، قال: أخبرنا أبو طاهر المخلص، قال: أخبرنا ابن صاعد، قال: حدثنا الربيع بن سليمان، قال: حدثنا عبد الله بن وهب، عن سليمان بن بلال، قال: أخبرنا العلاء، عن أبيه، عن أبي هريرة رضي الله عنه، أن النبي صلى الله عليه وسلم قال: «إذا مات الإنسان انقطع عمله إلا من ثلاث: صدقة جارية، أو علم ينتفع به، أو ولد صالح يدعو له» انفرد بإخراجه مسلم(٢).", "وقد روي عن النبي صلى الله عليه وسلم أنه قال: «رحمة الله على خلفائي» قيل: ومن خلفاؤك؟ قال: «الذين يحيون سنتي، ويعلمونها عباد الله عز وجل»(٣)."]], "ic": "book"}, {"story": ["الباب الأول في فضيلة العلم والتعلم والتعليم فضيلة العلم: (١٢ من ١٣)، ص٣٠", ["وأما الآثار: فقال عمر بن الخطاب رضي الله عنه: من حدث بحديث فعمل به فله مثل أجر ذلك العمل(٤).", "وقال أيضا: الأمة: الذي يعلم الناس الخير(٥). وكذلك قال ابن مسعود رضي الله عنه: الأمة: متعلم الخير ومعلمه(٦).", "أخبرنا عبد الوهاب الأنماطي، قال: أخبرنا أبو محمد الصريفيني، قال:", "حاشية: (١) أخرجه البخاري (١٠٠)، ومسلم (٢٦٧٣).", "حاشية: (٢) أخرجه مسلم (١٦٣١)، والبخاري في «الأدب المفرد»: (٣٨)، وأبو داود (٢٨٨٠)، والترمذي (١٣٧٦)، والنسائي ٦/٢٥١.", "حاشية: (٣) أخرجه الطبراني في «الأوسط»: (٥٨٤٢)، والرامهرمزي "sum": [["الصفحات", "ص١٤ - ص٣٢"]], "_nq": 18}, {"id": "l6", "title": "الباب الثاني في بيان العلم المحمود والمذموم وما هو فرض عين", "group": "كتاب العلم", "map": {"center": "الباب\nالثاني في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الثاني في بيان العلم المحمود والمذموم وما هو فرض عين", "b": [{"pic": ["books", "book"], "cap": "ص٣٣ - ص٣٧"}, {"story": ["الباب الثاني في بيان العلم المحمود والمذموم وما هو فرض عين (١ من ٤)، ص٣٣", ["أخبرنا محمد بن أبي منصور، قال: أخبرنا أبو سهل بن سعدويه، قال: أخبرنا أبو الفضل محمد بن الفضل الفرشي، قال: أخبرنا أبو بكر بن مردويه، قال: حدثني علي بن الفضل، قال: أخبرنا عبد الله بن سليمان، قال: أخبرنا جعفر بن مسافر، قال: أخبرنا يحيى بن حسان، عن سليمان بن قرم، عن ثابت، عن أنس بن مالك رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «طلب العلم فريضة على كل مسلم»(١).", "قال علي بن الفضل: قال ابن أبي داود: سمعت أبي يقول: ليس في: «طلب العلم فريضة» أصح من هذا.", "قلت: وقد اختلف الناس في العلم الذي هو فريضة على كل مسلم:", "فقال المتكلمون: هو علم الكلام، إذ به يدرك التوحيد ومعرفة الله عز وجل.", "وقال الفقهاء: هو علم الفقه، إذ به يعرف الحلال والحرام.", "وقال المفسرون والمحدثون: هو علم الكتاب والسنة، إذ بهما يتوصل إلى العلوم كلها.", "وقالت الصوفية: هو علم الإخلاص، وآفات النفوس. إلى غير ذلك من الأقوال التي ليس فيها مرضي:", "حاشية: (١) إسناده ضعيف، وهذا حديث حسن بطرقه وشواهده، أخرجه ابن ماجه (٢٢٤) بإسناد ضعيف، لكن ذكر في الزوائد نقلا عن السيوطي أنه روي من طرق تبلغ رتبة الحسن، رآها نحوا من خمسين طريقا، والله أعلم.", "وقد روي عن جميع من الصحابة بطرق لا يخلو إسناد واحد منهم من مقال، ترتقي بمجموعها إلى رتبة الحسن إن شاء الله تعالى.", "وقال أبو طالب المكي رحمه الله: هو العلم بمباني الإسلام الخمس.", "والصحيح: أنه علم معاملة العبد لربه. والمعاملة التي كلفها على ثلاثة أقسام: اعتقاد، وفعل، وترك.", "فإذا بلغ الصبي فأول واجب عليه تعلم كلمتي الشهادة، وفهم معناها، وإن لم يحصل ذلك بالنظر والدليل، فإن النبي صلى الله عليه وسلم اكتفى من أجلاف العرب بالتصديق من غير تعليم دليل، فذلك فرض الوقت، ثم يجب عليه النظر والاستدلال المؤديان إلى معرفة الله عز وجل، فإذا جاء وقت الصلاة وجب عليه تعلم الطهارة والصلاة، فإذا عاش إلى رمضان وجب عليه تعلم الصوم، فإن كان له مال، فدار عليه الحول، وجب عليه تعلم الزكاة، فإذا جاء وقت الحج، وهو مستطيع، وجب عليه تعلم المناسك.", "وأما المتروك فبحسب ما يتجدد من الأحوال، إذ لا يجب على الأعمى تعلم ما يحرم من النظر، ولا على الأبكم تعلم ما يحرم من الكلام، فإن كان في بلد يتعاطى فيه شرب الخمر ولبس الحرير وجب أن يعرف تحريم ذلك.", "وأما الاعتقادات فيجب علمها بحسب الخواطر، فإن خطر له شك في المعاني التي تدل عليها كلمتا الشهادة، وجب عليه تعلم ما يتوصل به إلى إزالة الشك، وإن كان في بلد قد كثرت فيه البدع، وجب أن يلقن الحق، كما لو كان تاجرا في بلد قد شاع فيه التعامل بالربا، وجب عليه تعلم الحذر من الربا.", "وينبغي أن يتعلم الإيمان بالبعث والجنة والنار، فبان بما ذكرنا أن المراد بطلب العلم الذي هو فرض عين ما يتعين وجوبه على الشخص."]], "ic": "book"}, {"story": ["الباب الثاني في بيان العلم المحمود والمذموم وما هو فرض عين (٢ من ٤)، ص٣٤", ["**بيان العلم الذي هو فرض كفاية**", "العلوم بالإضافة إلى الغرض الذي نحن بصدده تنقسم إلى:", "شرعية: وهي ما يستفاد من الأنبياء، ولا يرشد العقل إليها كالحساب، ولا التجربة كالطب، ولا السماع كاللغة.", "والعلوم التي ليست شرعية تنقسم إلى ثلاثة أقسام:", "١ـ محمود ٢ـ ومذموم ٣ـ ومباح.", "١ـ فالمحمود ما ترتبط به مصالح الدنيا، كالطب والحساب، وذلك ينقسم إلى:", "أ ـ ما هو فرض كفاية. ب ـ وإلى ما هو فضيلة لا فريضة:", "أ ـ أما فرض الكفاية: فهو كل علم لا يستغنى عنه في قوام أمور الدنيا كالطب، إذ هو ضروري في حاجة بقاء الأبدان على الصحة، وكالحساب، فإنه ضروري في قسمة المواريث والوصايا وغيرها، فهذه العلوم هي التي لو خلا البلد عمن يقوم بها حرج(١) أهل البلد، وإذا قام بها واحد كفى، وسقط الفرض عن الآخرين، ولا تتعجب من قولنا: إن الطب والحساب من فروض الكفاية، فإن أصول الصناعات أيضا من فروض الكفاية، كالفلاحة والحياكة والسياسة، بل الحجامة، فإنه لو خلا البلد عن حجام لأسرع الهلاك إليهم، ولحرجوا بتعريضهم أنفسهم للهلاك، فإن الذي أنزل الداء أنزل الدواء، وأرشد إلى استعماله، فلا يجوز التعرض للهلاك بإهماله.", "ب ـ وأما ما يعد فضيلة لا فريضة؛ فالتعمق في دقائق الحساب، وحقائق الطب وغير ذلك، مما يستغنى عنه، ولكنه يفيد زيادة قوة في قدر ما يحتاج إليه.", "٢ـ وأما المذموم منه فعلم السحر والطلسمات(٢) والشعبذة(٣) والتلبيسات(٤).", "٣ـ وأما المباح منه؛ فالعلم بالأشعار التي لا سخف فيها، وتواريخ الأخبار، وما يجري مجرى ذلك.", "فأما العلوم الشرعية، فكلها محمود، ولكن قد يلتبس بها ما يظن أنه شرعي، ويكون مذموما، فلنقسم المحمودة والمذمومة، فنقول:", "حاشية: (١) حرج: أثم. اللسان (حرج).", "حاشية: (٢) الطلسمات: جمع طلسم، وهو لفظ غير عربي، معناه: عبارة عن علم بأحوال تمزيج القوى الفعالة السماوية بالقوى المنفعلة لأجل التمكن من إظهار ما يخالف العادة، والمنع مما يوافقها «قصد السبيل فيما في اللغة العربية من الدخيل»: ٢/٢٦٤، وفي «المحيط في اللغة» ٨/٤٢٦: هي ضرب من السحر.", "حاشية: (٣) الشعبذة: بمعنى الشعوذة، وهي خفة في اليد وشيء كالسحر. «اللسان»: (شعوذ).", "حاشية: (٤) التلبيس: هو تخليط الأمر، والتدليس فيه «اللسان»: (لبس).", "أما المحمودة، فلها أصول وفروع ومقدمات ومتممات، فهي أربعة أضرب:", "الضرب الأول: الأصول، وهي أربعة: كتاب الله تعالى، وسنة رسوله صلى الله عليه وسلم، وإجماع الأمة، وآثار الصحابة رضوان الله عليهم.", "وإنما كان الإجماع أصلا لأنه يدل على السنة، وكذلك أقوال الصحابة؛ لأنهم قد شاهدوا الوحي والتنزيل، وأدركوا بقرائن الأحوال ما غاب عن غيرهم، وربما لا تحيط العبارات بما أدركوا بالقرائن."]], "ic": "book"}, {"story": ["الباب الثاني في بيان العلم المحمود والمذموم وما هو فرض عين (٣ من ٤)، ص٣٦", ["الضرب الثاني: الفروع، وهو ما فهم من هذه الأصول، لا بموجب ألفاظها، بل بمعان تنبهت لها العقول، فاتسع بسببها الفهم، حتى فهم من اللفظ الملفوظ وغيره، كما فهم من قوله صلى الله عليه وسلم: «لا يقضي القاضي وهو غضبان»(١) أنه لا يقضي حاقنا(٢) ولا جائعا.", "الضرب الثالث: المقدمات، وهي التي تجري مجرى الآلات، كعلم النحو واللغة، فإنهما آلة لعلم كتاب الله تعالى وسنة رسوله صلى الله عليه وسلم.", "الضرب الرابع: المتممات، وذلك ينقسم في علم القرآن إلى ما يتعلق باللفظ، كعلم القراءات، ومخارج الحروف، وإلى ما يتعلق بالمعنى كالتفسير، وإلى ما يتعلق بأحكامه، كمعرفة الناسخ والمنسوخ، والعام والخاص، والنص والظاهر، وهو العلم الذي يسمى: أصول الفقه، ويتناول السنة أيضا.", "وأما المتممات في الأخبار والآثار، فهي: العلم بالرجال وأسمائهم، وأسماء الصحابة وصفاتهم، وعدالة الرواة وأحوالهم، والعلم بأعمارهم لتمييز المسند من المرسل.", "فهذه هي العلوم الشرعية، وكلها محمود، بل كلها من فروض الكفايات.", "حاشية: (١) أخرجه البخاري (٧١٥٨)، ومسلم (١٧١٧)، من حديث أبي بكرة مرفوعا، ولفظ البخاري: «لا يقضين حكم بين اثنين وهو غضبان»، ولفظ مسلم: «لا يحكم أحد بين اثنين وهو غضبان».", "حاشية: (٢) الحاقن: من زحمة البول أو احتبس عليه: «اللسان»: (حقن).", "**فصل [في بيان علم المعاملة]**", "فأما علم المعاملة، وهو علم أحوال القلب، كالخوف والرجاء، والرضا، والصدق، والإخلاص، إلى غير ذلك فيه ارتفع كبار العلماء، وبتحقيقه اشتهرت أذكارهم، كسفيان، ومالك، والشافعي، وأحمد رحمهم الله، وسيأتي من أخبارهم في غضون كتابنا ما يدل على بلوغهم نهاية المعاملة.", "وقد أفردت لسفيان كتابا كبيرا(١)، جمعت فيه أخباره وفضائله، وللإمام أحمد أيضا(٢)، وذكرت مالكا والشافعي(٣) في كتابي المسمى بـ«صفة الصفوة»، فلتطالع أخبارهم من تلك المواضع.", "وإنما انحطت رتب المتسمين بالفقهاء والعلماء عن تلك المقامات لتشاغلهم بصور العلم من غير أخذ على النفس أن تبلغ إلى حقائقه، وتعمل بخفاياه، وأنت تجد الفقيه يتكلم في اللعان، والظهار، والسبق، والرمي، ويفرع التفريعات التي تمضي الدهور ولا يحتاج إلى مسألة منها، ولا يتكلم في الإخلاص، ولا يحذر من الرياء، وهذا فرض عينه الذي في إهماله هلاكه، والأول فرض كفاية.", "ولو أنه سئل عن علة تركه المنافسة للنفس في الإخلاص والرياء لم يكن له جواب، ولو سئل عن علة تشاغله بمسائل اللعان والرمي لقال: هذا فرض كفاية. ولقد صدق، ولكن خفي عليه أن الحساب فرض كفاية أيضا، فهلا تشاغل به؟! وإنما تبهرج(٤) عليه النفس، لأن مقصودها من الرياء والسمعة يحصل بالمناظرة لا بالحساب.", "حاشية: (١) يعني كتابه: «مناقب سفيان الثوري». انظر «مؤلفات ابن الجوزي» لعبد الحميد العلوجي: ٢٢٦ـ٢٢٧."]], "ic": "book"}, {"story": ["الباب الثاني في بيان العلم المحمود والمذموم وما هو فرض عين (٤ من ٤)، ص٣٧", ["حاشية: (٢) يعني كتابه: «مناقب الإمام أحمد» وقد طبع بدار هجر في القاهرة سنة ١٤٠٩هـ، ١٩٩٨م، بتحقيق الدكتور عبد الله التركي.", "حاشية: (٣) للمؤلف كتاب بعنوان «مناقب الشافعي». انظر «مؤلفات ابن الجوزي»: ٢٢٤.", "حاشية: (٤) البهرج: الباطل والردي، والبهرجة: أن يعدل بالشيء عن الجادة، أي: أن ينحرف عن الصواب. القاموس واللسان: (بهرج)."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "وإنما كان الإجماع أصلا لأنه يدل على السنة، وكذلك أقوال الصحابة؛ لأنهم قد شاهدوا الوحي والتنزيل، وأدركوا بقرائن الأحوال ما غاب عن غيرهم، وربما لا تحيط العبارات بما أدركوا ____", "o": ["بالقرائن", "حامدون", "سبابته", "كالحدادة"], "h": "راجع: ص٣٦"}, {"t": "fill", "d": 2, "q": "وأما المتروك فبحسب ما يتجدد من الأحوال، إذ لا يجب على الأعمى تعلم ما يحرم من النظر، ولا على الأبكم تعلم ما يحرم من الكلام، فإن كان في بلد ____ فيه شرب الخمر ولبس الحرير وجب أن يعرف تحريم ذلك", "o": ["يتعاطى", "يثيب", "لفريضة", "ويقول"], "h": "راجع: ص٣٤"}, {"t": "fill", "d": 2, "q": "شرعية: وهي ما يستفاد من الأنبياء، ولا يرشد العقل إليها كالحساب، ولا ____ كالطب، ولا السماع", "o": ["التجربة", "العاقل", "اشترط", "بمحبة"], "h": "راجع: ص٣٤"}, {"t": "fill", "d": 2, "q": "وإنما انحطت رتب المتسمين بالفقهاء والعلماء عن تلك المقامات لتشاغلهم بصور العلم من غير أخذ على النفس أن تبلغ إلى حقائقه، وتعمل بخفاياه، وأنت تجد الفقيه يتكلم في اللعان، والظهار، والسبق، والرمي، ____ التفريعات التي تمضي الدهور ولا يحتاج إلى مسألة منها، ولا يتكلم في الإخلاص، ولا يحذر من الرياء، وهذا فرض عينه الذي في إهماله هلاكه، والأول فرض كفاية", "o": ["ويفرع", "أجناس", "يهدي", "ورياضات"], "h": "راجع: ص٣٧"}, {"t": "fill", "d": 2, "q": "الضرب الأول: الأصول، وهي أربعة: كتاب الله تعالى، وسنة رسوله صلى الله عليه وسلم، ____ الأمة، وآثار الصحابة رضوان الله", "o": ["وإجماع", "استرجع", "جمعه", "أخبرت"], "h": "راجع: ص٣٦"}, {"t": "fill", "d": 2, "q": "الضرب الثاني: الفروع، وهو ما فهم من هذه الأصول، لا بموجب ألفاظها، بل بمعان تنبهت لها العقول، فاتسع بسببها الفهم، حتى فهم من ____ الملفوظ وغيره، كما فهم من قوله صلى الله عليه وسلم: «لا يقضي القاضي", "o": ["اللفظ", "كلهم", "بقوته", "والآجري"], "h": "راجع: ص٣٦"}]}], "sum": [["الصفحات", "ص٣٣ - ص٣٧"]], "_nq": 6}, {"id": "l7", "title": "الباب الثالث فيما يعده العامة من العلوم المحمودة وليس منها وفيه بيان الوجه الذي يكون به بعض العلوم مذموما…", "group": "كتاب العلم", "map": {"center": "الباب\nالثالث فيما", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الثالث فيما يعده العامة من العلوم المحمودة وليس منها وفيه بيان ا - القسم ١ من ٢", "b": [{"pic": ["books", "book"], "cap": "ص٣٨ - ص٥٠"}, {"story": ["الباب الثالث فيما يعده العامة من العلوم المحمودة وليس منها و (١ من ١٠)، ص٣٨", ["**فيما يعده العامة من العلوم المحمودة وليس منها وفيه بيان الوجه الذي يكون به بعض العلوم مذموما وبيان تبديل أسامي العلوم وهي الفقه والعلم والتوحيد والتذكير والحكمة وبيان القدر المحمود من العلوم الشرعية والقدر المذموم منها**", "اعلم أن العلم لا يذم لعينه، إنما يذم في حق الناس لأحد أسباب ثلاثة:", "الأول: أن يكون مؤديا إلى ضرر، إما بصاحبه أو بغيره، كما يذم علم السحر والطلسمات، وقد سحر رسول الله صلى الله عليه وسلم ومرض بسببه(١).", "والسحر نوع يستفاد من العلم بخواص الجوهر بأمور حسابية في مطالع النجوم، فيتخذ من تلك الجواهر هيكل على صورة الشخص المسحور، ويترصد له وقت مخصوص في المطالع، ويقرن به كلمات يتلفظ بها من الكفر والفحش، ويتوسل بسببها إلى الاستعانة بالشياطين، ويحصل من مجموع ذلك بحكم إجراء الله سبحانه العادة(٢) أحوال غريبة في الشخص المسحور، فمعرفة(٣) هذه الأسباب من", "حاشية: (١) حديث سحر لبيد بن الأعصم لرسول الله صلى الله عليه وسلم حديث صحيح، أخرجه البخاري (٥٧٦٣) ومسلم (٢١٨٩)، وغيرهما، وهذا الأمر لا ينافي العصمة كما يعتقد جهلة الناس، بل هو كأي مرض، لم يؤثر على الوحي والرسالة، ولا على قلبه وعقله عليه الصلاة والسلام.", "حاشية: (٢) من هنا بدأت نسخة المكتبة الظاهرية، وما قبله ساقط، ضاعت أوراقه بما يعادل اثنتي عشرة ورقة، فحسبه بعضهم أنه إحياء علوم الدين، فكتب اثنتا عشرة ورقة من الإحياء، وجعلها في أول الكتاب بدل الأوراق الساقطة، وهي مكتوبة بخط مختلف ونوع الورق مختلف أيضا.", "حاشية: (٣) سقطت من (ظ)، وجاء بعدها: (فهذه) بدل: (هذه).", "حيث أنها معرفة ليست مذمومة، ولكنها ليست تصلح إلا للإضرار بالخلق، والوسيلة إلى الشر شر(١)، فلذلك وقع الذم(٢).", "والثاني: أن أحكام النجوم تخمين محض، فالحكم به حكم بجهل، وإنما تقع الإصابة اتفاقا في بعض الأحوال(٣).", "والثالث: أنه خوض في فضول لا تغني، وتضييع العمر النفيس بغير فائدة.", "وأما السبب الثالث في ذم بعض العلوم: فهو الخوض في علم لا يستقل الخائض فيه به، كتعلم(٤) دقيق العلوم قبل جليها، والبحث عن أسرار الإلهية، فإن الفلاسفة والمتكلمين تطلعوا إلى ذلك ولم يستقلوا به، فيجب كف الناس عن البحث عن ذلك، وردهم إلى ما نطق الشرع به، ففيه مقنع، فكم ممن خاض في ذلك فاستضر، وقد يضر العلم بعض الناس، كما يضر اللحم الطفل الصغير(٥)، فاقتصر على اتباع السنة، واحذر من البحث عما لا تؤمن عاقبة البحث فيه(٦).", "واعلم أن الأنبياء كالأطباء، وهم أعرف بالدواء، ورب شاك إلى الطبيب مرض يده اليمنى وصف له أن يعالج اليد الأخرى، فاستبعد ذلك لجهله بانشعاب", "حاشية: (١) سقطت من (ظ)."]], "ic": "book"}, {"story": ["الباب الثالث فيما يعده العامة من العلوم المحمودة وليس منها و (٢ من ١٠)، ص٣٩", ["حاشية: (٢) جمهور العلماء على تحريم تعلم السحر، أما ما هو مشهور على ألسنة الناس «تعلموا السحر ولا تعملوا به» فهو حديث باطل لا أصل له، وهو كذب وافتراء على رسول الله صلى الله عليه وسلم بل الصحيح حديث رسول الله صلى الله عليه وسلم: «اجتنبوا السبع الموبقات: الشرك بالله والسحر» الحديث أخرجه البخاري (٢٧٦٦)، ومسلم (٨٩).", "حاشية: (٣) ومثل هذا ما هو منتشر بين الجهلة من الناس من سماع وقراءة الأبراج من وسائل الإعلام، وهذه بدعة قبيحة منكرة، يصدق عليها حديث رسول الله صلى الله عليه وسلم: «من أتى كاهنا أو عرافا فصدقه بما يقول فقد كفر بما أنزل على محمد صلى الله عليه وسلم» وهذا حديث صحيح، أخرجه أحمد في المسند ٢/٤٣٩، ورجاله رجال الشيخين. وانظر البخاري (٥٧٦٢)، ومسلم (٢٢٢٨).", "حاشية: (٤) كذا في (ظ) والإحياء، وفي الأصل: «كتعليم».", "حاشية: (٥) سقطت من (ظ).", "حاشية: (٦) كذا في (ظ)، وفي الأصل: «عنه».", "الأعصاب ومنابتها(١)، فكذلك أمور العقائد والآخرة، فيها لطائف ليس في قوة العقل الإحاطة بها، كما أن في خواص الأحجار أمورا خفي علمها على(٢) أرباب الصناعة، حتى إنه لم يعرف أحد(٣) منهم السبب الذي به يجذب المغناطيس الحديد، فليكفك من منفعة العقل أن يدلك على صدق الرسول صلى الله عليه وسلم، ويفهمك موارد إشاراته، ثم اعزله عن التصرف(٤)، ولازم الاتباع تسلم.", "**بيان ما بدل من ألفاظ العلوم**", "اعلم أن منشأ التباس العلوم المذمومة بالعلوم الشرعية تحريف الأسامي المحمودة وتبديلها، ونقلها بالأغراض الفاسدة إلى معان لم يردها السلف الصالح، وهي خمسة ألفاظ: الفقه والعلم والتوحيد والتذكير والحكمة.", "أما الفقه فإنهم تصرفوا فيه بالنقل لا بالتخصيص، فخصوه بمعرفة الفروع وعللها، ولقد كان اسم الفقه في العصر الأول مطلقا على علم طريق الآخرة، ومعرفة دقائق آفات النفوس ومفسدات الأعمال، وقوة الإحاطة بحقارة الدنيا، وشدة التطلع إلى نعيم الآخرة، واستيلاء الخوف على القلب، ويدلك على ذلك قوله تعالى: ﴿لِيَتَفَقَّهُوا فِي الدِّينِ وَلِيُنذِرُوا قَوْمَهُمْ﴾ [التوبة: ١٢٢]، وإنما يحصل(٥) الإنذار بما ذكرنا.", "وقد سئل سعد بن إبراهيم(٦): أي أهل المدينة أفقه؟ فقال: أتقاهم. وقال الحسن(٧): إنما الفقيه الزاهد في الدنيا، الراغب في الآخرة، البصير بدينه،", "حاشية: (١) كذا في الأصل والإحياء، وفي (ظ): (مبانيها).", "حاشية: (٢) في (ظ): «عن».", "حاشية: (٣) كذا في (ظ) والإحياء، وفي الأصل: «واحدة».", "حاشية: (٤) في (ظ): «النظر».", "حاشية: (٥) في (ظ): «الأصل».", "حاشية: (٦) هو سعد بن إبراهيم بن عبد الرحمن بن عوف، تابعي جليل، توفي سنة ١٢٥هـ. «سير أعلام النبلاء» ٥/٤١٨.", "حاشية: (٧) يعني الحسن البصري.", "المداوم على عبادة ربه، الورع، الكاف عن أعراض المسلمين، العفيف عن أموالهم، الناصح لهم."]], "ic": "book"}, {"story": ["الباب الثالث فيما يعده العامة من العلوم المحمودة وليس منها و (٣ من ١٠)، ص٤١", ["قلت(١): ولسنا نعني أن اسم الفقه لم يكن متناولا للفتاوي، ولكن كان بطريق العموم والشمول واستتباع، وكان إطلاقهم له على علم الآخرة أكثر، فبان من هذا التخصيص تلبيس بعث الناس على التجرد(٢) لعلم الفتاوى الظاهرة، والإعراض عن علم المعاملة للآخرة.", "اللفظ الثاني: العلم، وقد كان ذلك(٣) يطلق على العلم بالله تعالى وبآياته، وأفعاله في عباده، فخصصوه، وسموا به في الغالب المناظر في مسائل الفقه، وإن كان جاهلا بالتفسير والأخبار.", "اللفظ الثالث: التوحيد، وقد كان ذلك إشارة إلى أن ترى الأمور كلها من الله رؤية تقطع الالتفات إلى الأسباب والوسائط، فيثمر ذلك التوكل والرضا، وقد جعل الآن عبارة عن صناعة(٤) الكلام في الأصول، وذلك من المنكرات عند السلف.", "اللفظ الرابع: الذكر والتذكير، وقد قال الله تعالى: ﴿وَذَكِّرْ فَإِنَّ الذِّكْرَىٰ تَنفَعُ الْمُؤْمِنِينَ﴾ [الذاريات: ٥٥]، وقال صلى الله عليه وسلم: «إذا مررتم برياض الجنة فارتعوا» قالوا: وما رياض الجنة؟ قال: «مجالس الذكر»(٥).", "فنقلوا ذلك إلى القصص وما يحتوي عليه اليوم مجلس القاص من الشطح(٦)", "حاشية: (١) في (ظ): «قال المصنف».", "حاشية: (٢) تجرد للأمر: جد فيه وتفرغ له دون غيره.", "حاشية: (٣) سقطت من الأصل.", "حاشية: (٤) في (ظ): «صياغة».", "حاشية: (٥) أخرجه أحمد ٣/١٥٠، والترمذي (٣٥١٠)، وأبو يعلى (٣٤٤٢) من حديث أنس، وقال الترمذي حديث حسن غريب. وأخرجه الحاكم ١/٤٩٤ من حديث جابر، والطبراني في (الكبير) (١١١٥٨) من حديث ابن عباس، فالحديث حسن بشواهده.", "حاشية: (٦) الشطح: هو كلام غير متزن، فيه رائحة رعونة ودعوى، يصدر في حال اضطراب، لا مساغ له في الشريعة، فلا يقبل بحال؛ لأنه صادر ممن لا عصمة له، ولأن ظاهره مخالف", "حاشية (تتمة): للشريعة، ولم يذكر هذا اللفظ أئمة اللغة في كتبهم، والظاهر أنها لفظة عامية. «تاج العروس»، و«كشاف اصطلاحات الفنون والعلوم»: (شطح).", "والطامات. وقد جمعت كتابا في القصاص والمذكرين(١)، وذكرت المحمود والمذموم هنالك، إلا أني أشير هاهنا إلى ذلك، فأقول:", "من تشاغل بقصص الأولين في مجلس وعظه، فليعلم أن أكثر ما يحكى في ذلك لا يثبت، كما ينقلون أن يوسف عليه السلام حل تكته(٢)، وأنه رأى يعقوب عليه السلام عاضا على يده، وأن داود عليه السلام بذرق(٣) بأوريا حتى قتل(٤)، ومثل هذا يضر(٥) سماعه، وإن كانت تلك القصة(٦) من مجاهدات الرهبان فأكثر ما ينقل عنهم لا يجوز في شرعنا، فيستنصر العامي بسماع ذلك؛ لأنه يظن أن مثل ذلك يحتذى، كما يروى أن بعضهم ثقب ترقوته(٧)."]], "ic": "book"}, {"story": ["الباب الثالث فيما يعده العامة من العلوم المحمودة وليس منها و (٤ من ١٠)، ص٤٢", ["وأما الشطح والطامات فمن أشد ما يؤذي العوام؛ لأنها تشتمل على ذكر المحبة والوصال، وألم الفراق، وعامة الحاضرين أجلاف، وبواطنهم محشوة بالشهوات، وقلوبهم ممتلئة بحب الصور، فلا يحرك ذلك من قلوبهم إلا ما هو مستكن فيها، فتشتعل فيها نار الشهوة، فيصيحون، وكل ذلك فساد، وربما احتوى الشطح على الدعاوى العريضة في محبة الله عز وجل، وربما استشهدوا بقول أبي", "حاشية: (١) هو كتاب «القصاص والمذكرين» صدر عن المكتب الإسلامي، بتحقيق د. محمد لطفي الصباغ.", "حاشية: (٢) التكة: بكسر التاء: رباط السراويل، «القاموس المحيط»: (تك).", "حاشية: (٣) البذرقة: الحراسة والخفارة، وبذرق بالرجل: أرسله يقاتل حتى يقتل. «تاج العروس»: (بذرق).", "حاشية: (٤) يدعي اليهود كذبا أن داود عليه السلام أرسل أوريا ـ أحد قادة جنده ـ إلى الحرب، وتركه يقاتل حتى قتل، ليتزوج زوجته، وهذا من الإسرائيليات الباطلة، التي يجب على المسلم تنزيه سمعه عنها.", "حاشية: (٥) في (ظ): «مضر».", "حاشية: (٦) في (ظ): «القصة».", "حاشية: (٧) الترقوة: بفتح التاء ليس غير، وهو العظم بين ثغرة النحر والعاتق، والجمع: تراقي وتراقيق. «القاموس المحيط»: (ترق).", "يزيد(١): سبحاني. وبقول الحلاج(٢): أنا الحق. وهذا فن عظم ضرره، حتى ترك جماعة من الفلاحين فلاحتهم، وأظهروا مثل هذه الدعاوي.", "اللفظ الخامس: الحكمة، والحكمة: العلم والعمل به. قال ابن قتيبة(٣) رحمه الله: لا يكون الرجل حكيما حتى يجمع العلم والعمل. وقد صار هذا الاسم يطلق على الطبيب والمنجم.", "**بيان القدر المحمود من العلوم المحمودة**", "اعلم أن العلم بهذا الاعتبار ثلاثة أقسام:", "١ـ قسم هو(٤) مذموم قليله وكثيره.", "٢ـ وقسم هو محمود قليله وكثيره، وكلما كان أكثر كان أحسن وأفضل.", "٣ـ وقسم يحمد منه مقدار الكفاية، ولا يحمد الفاضل عليه والاستقصاء فيه. وهو مثل أحوال البدن، فإن منه ما يحمد قليله وكثيره، كالصحة والجمال، ومنه ما يذم قليله وكثيره، كالقبح وسوء الخلق، ومنه ما يحمد الاقتصاد فيه، كبذل المال،", "حاشية: (١) هو أبو يزيد طيفور بن عيسى البسطامي، زاهد متصوف، كان جده مجوسيا فأسلم، قال الذهبي: وردت عنه أشياء مشكلة لا مساغ لها، فتطوى ولا يحتج بها، توفي ببسطام سنة ٢٦١هـ. «سير أعلام النبلاء» ١٣/٨٦.", "حاشية: (٢) هو حسين بن منصور الحلاج، متأله زنديق، كان يدعي العلم وهو فارغ من ذلك، ادعى النبوة أول أمره، ثم الإلهية، وقال بالحلول، روج له أهل الضلال والجهلة من الناس، أفتى علماء عصره بقتله بالإجماع لكفره وزندقته، فقبض عليه وسجن سنة ٣٠١هـ، ثم أمر الخليفة المقتدر بقتله وإحراق جثته، فقطعت يداه ورجلاه، وضربت عنقه، وأحرقت جثته، ونصب رأسه على جسر بغداد، وذلك سنة ٣٠٩هـ. وقد صنف ابن الجوزي فيه كتابا بعنوان: «القاطع بمحال المحاج بحال الحلاج». ينظر سير أعلام النبلاء ١٤/٣١٣."]], "ic": "book"}, {"story": ["الباب الثالث فيما يعده العامة من العلوم المحمودة وليس منها و (٥ من ١٠)، ص٤٣", ["حاشية: (٣) هو أبو محمد عبد الله بن مسلم بن قتيبة الدينوري، لغوي أديب، وعلامة مصنف من أهم كتبه: تأويل مختلف الحديث، أدب الكاتب، أدب القاضي، الشعر والشعراء، عيون الأخبار، وغيرها كثير، توفي سنة ٢٧٦هـ. «سير أعلام النبلاء» ١٣/٢٩٦.", "حاشية: (٤) سقطت من الأصل، وأثبتت من (ظ) والإحياء.", "فإن التبذير لا يحمد فيه وهو بذل، وكالشجاعة، فإن التهور لا يحمد فيها، وإن كان من جنس الشجاعة، وكذلك العلم.", "فالقسم المذموم قليله وكثيره: ما لا فائدة فيه في دين ولا دنيا، أو فيه ضرر يغلب(١) نفعه، كعلم السحر والطلسمات والنجوم، فصرف العمر ـ الذي هو أنفس ما يملكه الإنسان ـ إليه إضاعة، وإضاعة النفائس مذموم.", "وأما القسم المحمود إلى أقصى غايات(٢) الاستقصاء: فهو العلم بالله تعالى بصفاته وأفعاله، وحكمته في ترتيب الآخرة على الدنيا، فإن هذا علم مطلوب لذاته، وللتوصل به إلى سعادة الآخرة، وهو البحر الذي لا يدرك غوره(٣)، وإنما يحوم المحومون على سواحله وأطرافه بقدر ما يسر لهم، وما خاض أطرافه إلا الأنبياء، والأولياء، والراسخون في العلم على اختلاف درجاتهم، بحسب اختلاف قوتهم، ويعين على نيل بعضه المجاهدة والرياضة، وتصفية القلب، وتفريغه من علائق الدنيا.", "وأما العلوم التي لا يحمد منها إلا مقدار مخصوص: فهي العلوم التي أوردناها في فروض الكفايات، فإن في كل علم منها اقتصارا، وهو الأقل، واقتصادا، وهو الوسط، واستقصاء وراء الاقتصاد، لا مرد له إلى آخر العمر.", "فكن أحد رجلين: إما مشغولا بنفسك، وإما متفرغا إلى غيرك بعد الفراغ من نفسك، وإياك أن تشتغل بما يصلح غيرك قبل إصلاح نفسك، فإن كنت مشغولا بنفسك، فلا تشتغل إلا بالعلم الذي هو فرض عينك، بحسب ما يقتضيه حالك، وانظر في المهم المهمل، وهو صفات القلب وما يحمد منها ويذم، كالحرص والحسد والرياء والعجب ونحو ذلك، فكلها مهلكات، والاشتغال", "حاشية: (١) بعدها في (ظ): «على».", "حاشية: (٢) في الأصل: «غاية».", "حاشية: (٣) الغور: القعر من الشيء وعمقه وبعده. «اللسان»: (غور).", "بالأعمال الظاهرة عن إصلاح هذه الأحوال، كطلاء ظاهر البدن عند التأذي بالجرب والدماميل(١)، مع التهاون بإخراج المادة بالفصد(٢) والإسهال.", "وعلماء الآخرة إنما يشيرون إلى تطهير الباطن، وقطع مواد الشر بقلع مغارسه التي في القلب، وإنما فزع الأكثرون إلى الأعمال الظاهرة، وأعرضوا عن تطهير القلوب لسهولة أعمال الجوارح، وصعوبة أعمال القلوب، كما يختار طلي البدن من يستصعب شرب الدواء المر."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "اللفظ الثالث: التوحيد، وقد كان ذلك إشارة إلى أن ترى الأمور كلها من الله رؤية تقطع الالتفات إلى الأسباب والوسائط، فيثمر ذلك التوكل والرضا، وقد جعل الآن عبارة عن صناعة الكلام في ____، وذلك من", "o": ["الأصول", "بنهاية", "الفيء", "وتراقيق"], "h": "راجع: ص٤١"}, {"t": "fill", "d": 2, "q": "الأعصاب ومنابتها، فكذلك أمور العقائد والآخرة، فيها لطائف ليس في قوة العقل الإحاطة بها، كما أن في خواص الأحجار أمورا خفي علمها على أرباب الصناعة، حتى إنه لم يعرف أحد منهم السبب الذي به يجذب المغناطيس الحديد، فليكفك من منفعة العقل أن يدلك على صدق الرسول صلى الله عليه وسلم، ويفهمك موارد إشاراته، ثم ____ عن التصرف، ولازم الاتباع تسلم", "o": ["اعزله", "استمع", "وليشد", "السعي"], "h": "راجع: ص٤٠"}, {"t": "fill", "d": 2, "q": "واعلم أن الأنبياء كالأطباء، وهم أعرف بالدواء، ورب شاك إلى الطبيب مرض يده اليمنى وصف له أن ____ اليد الأخرى، فاستبعد ذلك لجهله بانشعاب", "o": ["يعالج", "الجدل", "بإظهار", "تفكر"], "h": "راجع: ص٣٩"}, {"t": "fill", "d": 2, "q": "ومما يفتقر إلى معرفته في الكلام ____ بين الناس كتاب", "o": ["الدائر", "عالة", "نبات", "استطاع"], "h": "راجع: ص٤٧"}, {"t": "fill", "d": 2, "q": "يزيد: سبحاني. وبقول الحلاج: أنا الحق. وهذا فن عظم ضرره، حتى ترك جماعة من ____ فلاحتهم، وأظهروا مثل هذه", "o": ["الفلاحين", "العابدين", "فليتجوز", "بيرحاء"], "h": "راجع: ص٤٣"}, {"t": "fill", "d": 2, "q": "حيث أنها معرفة ليست مذمومة، ولكنها ليست تصلح إلا للإضرار بالخلق، ____ إلى الشر شر، فلذلك وقع الذم", "o": ["والوسيلة", "يستخرج", "أصفيائه", "التفريط"], "h": "راجع: ص٣٩"}]}, {"t": "الباب الثالث فيما يعده العامة من العلوم المحمودة وليس منها وفيه بيان ا - القسم ٢ من ٢", "b": [{"story": ["الباب الثالث فيما يعده العامة من العلوم المحمودة وليس منها و (٦ من ١٠)، ص٤٥", ["فإن كنت مريدا للآخرة وطالبا للنجاة، فانظر إلى العلل الباطنة، وعالجها بما سيأتي في ربع المهلكات، فحينئذ تتأهل للمقامات المحمودة، وإن لم تتفرغ لذلك، فلا تشتغل بفروض الكفايات، ففي الخلق خلق كثير يقومون بذلك، فإن مهلك نفسه في طلب صلاح غيره سفيه، ومثله كمثل من دخلت العقارب تحت ثيابه، وهو يذب الذباب عن غيره، وإن تفرغت من نفسك وتطهيرها، وقدرت على ترك ظاهر الإثم وباطنه ـ وما أبعد ذلك ـ فاشتغل بفروض الكفايات، وراع التدريج في ذلك، فابتدئ بكتاب الله عز وجل، ثم بسنة رسوله صلى الله عليه وسلم، ثم بعلوم القرآن من تفسير، وناسخ ومنسوخ، ومحكم ومتشابه، إلى غير ذلك، وكذلك في السنة، ثم اشتغل بالفروع، وأصول الفقه، وهكذا إلى بقية العلوم(٣)، على ما يتسع له العمر، ويساعد فيه الوقت، ولا تستغرق عمرك في فن واحد منه طالبا للاستقصاء، فإن العلم كثير، والعمر قصير، وهذه العلوم آلات، يراد بها غيرها، وكل شيء يطلب(٤) لغيره، فلا ينبغي أن ينسى فيه المطلوب، وقد بينا: أنه ما من علم إلا وله اقتصار واقتصاد واستقصاء، ونحن نشير إلى ذلك:", "حاشية: (١) الدماميل: جمع دمل ودمل، وهي: القروح. «اللسان»: (دمل).", "حاشية: (٢) الفصد: هو إخراج الدم عن طريق شق العرق للتداوي. «اللسان»: (فصد).", "حاشية: (٣) في (ظ): «العلم».", "حاشية: (٤) تحرفت في (ظ) إلى: «مطلب».", "**بيان الكتب المهمة لطالب العلم**", "فأما الاقتصار في الأصول: فالاعتماد فيه يصلح على ما رتبناه في كتاب: «منتقد المعتقد»(١)، وأبسط(٢) منه ما رتبناه في كتاب: «منهاج الوصول إلى علم الأصول»(٣)، ولا يصلح ما يزيد على ذلك.", "وأما الاقتصار في النحو: فيصلح الاعتماد(٤) فيه على «اللمع»(٥)، وكتاب الجرمي(٦)، وإذا اتسع الزمان لما يزيد على ذلك من الكتب التي هي أكثر من ذلك، فلا بأس.", "وأما اللغة: فينبغي الاعتماد منها على معرفة ما في كتاب الله عز وجل، وسنة رسوله صلى الله عليه وسلم، وكلام السلف، ويكفي في ذلك كتاب: «الغريبين»(٧) للهروي(٨).", "حاشية: (١) كتاب «منتقد المعتقد»: هو جزء في علم أصول الفقه للمصنف، ذكره سبط ابن الجوزي في «مرآة الزمان»، وابن رجب الحنبلي في «الذيل على طبقات الحنابلة»، وانظر «مؤلفات ابن الجوزي»: (٥٠٢).", "حاشية: (٢) في (ظ): «أوسط».", "حاشية: (٣) كتاب «منهاج الوصول» ذكره سبط ابن الجوزي في «مرآة الزمان»، وابن رجب في «الذيل»، والذهبي في «تاريخ الإسلام»، وحاجي خليفة في «كشف الظنون»، وانظر «مؤلفات ابن الجوزي».", "حاشية: (٤) في (ظ): «الاقتصار».", "حاشية: (٥) هو كتاب «اللمع في العربية»؛ ومؤلفه: أبو الفتح عثمان بن جني، من أحذق أئمة العربية في النحو والأدب والتصريف، مولده بالموصل قبل ٣٣٠هـ، توفي ببغداد سنة ٣٩٢هـ. سير أعلام النبلاء ١٧/١٧، ومعجم الأدباء ٤/٣٨١."]], "ic": "book"}, {"story": ["الباب الثالث فيما يعده العامة من العلوم المحمودة وليس منها و (٧ من ١٠)، ص٤٦", ["حاشية: (٦) هو كتاب «مقدمة في النحو» ويعرف بالمختصر، كان الجرمي كلما صنف منه بابا صلى ركعتين بالمقام، ودعا بأن ينتفع به. والجرمي هو: أبو عمر صالح بن إسحاق البصري النحوي. من كبار علماء العربية، من كتبه: شرح غريب سيبويه، الأبنية، العروض، السير، القوافي، التثنية والجمع، التنبيه في النحو، توفي سنة ٢٢٥هـ: «سير أعلام النبلاء» ١٠/٥٦١.", "حاشية: (٧) هما كتاب: «غريب القرآن» و«غريب الحديث».", "حاشية: (٨) هو: أبو عبيد القاسم بن سلام الهروي، من رؤوس اللغة والحديث والفقه في عصره، من", "حاشية (تتمة): كتبه: «الطهور»، و«الأمثال»، و«الأموال»، وغيرها، توفي سنة ٢٢٤هـ. «سير أعلام النبلاء» ١٠/٤٩٠.", "ومما يفتقر إلى معرفته في الكلام الدائر بين الناس كتاب: «إصلاح المنطق»(١)، و«أدب الكاتب»(٢)، و«معرفة ما يلحن فيه العوام»(٣)، وفي كتابنا المسمى بـ«تقويم اللسان»(٤) كفاية في ذلك.", "وأما الاقتصار في التفسير، فيصلح الاعتماد(٥-٥) فيه على كتابنا المسمى بـ«تذكرة الأريب في غريب الغريب»(٦)، وأما الاقتصاد فيه فيصلح الاعتماد فيه(٥-٥) على كتابنا المسمى بـ«زاد المسير في علم التفسير»(٧)، وأما الاستقصاء فيه، فيصلح الاعتماد فيه(٨)", "حاشية: (١) كتاب «إصلاح المنطق» هو لابن السكيت، طبع في دار المعارف (مصر)، بتحقيق الأستاذين أحمد شاكر وعبد السلام هارون، وابن السكيت هو: أبو يوسف، يعقوب بن إسحاق البغدادي النحوي، إمام حجة في العربية، من كتبه: «الألفاظ»، «الأضداد»، «القلب والإبدال»، «الأجناس»، توفي سنة ٢٢٤هـ. «سير أعلام النبلاء» ١٢/٩٦.", "حاشية: (٢) كتاب «أدب الكاتب» هو لأبي محمد عبد الله بن مسلم بن قتيبة الدينوري، طبع في مؤسسة الرسالة بتحقيق الدكتور محمد الدالي.", "حاشية: (٣) كتاب «معرفة ما يلحن فيه العوام» هو لأبي الحسين علي بن حمزة الكسائي، نشرته مكتبة الخانجي بتحقيق رمضان عبد التواب.", "وفي هذا الباب كتب منها: «خطأ العوام» للجواليقي، و«لحن العوام» لأبي بكر الزبيدي، ولابن الجوزي «غلطات العوام» منه نسخة مخطوطة في مكتبة يحيى أفندي (استنبول) برقم (٤٣٩)، وله «ما يلحن فيه العامة» منه نسخة مخطوطة في مكتبة جامعة برنستون (أمريكا) برقم (٢٧٤٥).", "حاشية: (٤) كتاب: «تقويم اللسان» طبع بدار المعرفة بالقاهرة، بتحقيق عبد العزيز مطر، ولابن الجوزي كتاب آخر بعنوان: «تقويم اللغة»، وانظر «مؤلفات ابن الجوزي»: (١٠٠) و(١٠١).", "حاشية: (٥-٥) سقط من (ظ).", "حاشية: (٦) هذا الكتاب طبع بعنوان: «تذكرة الأريب في تفسير الغريب» بدار المعارف (الرياض) بتحقيق علي حسين البواب، وانظر (مؤلفات ابن الجوزي) فله أسماء أخرى.", "حاشية: (٧) كتاب «زاد المسير» صدر عن المكتب الإسلامي في تسعة أجزاء محققا، سنة ١٣٨٤هـ.", "حاشية: (٨) سقطت من (ظ)."]], "ic": "book"}, {"story": ["الباب الثالث فيما يعده العامة من العلوم المحمودة وليس منها و (٨ من ١٠)، ص٤٨", ["على كتابنا المسمى بـ«المغني في التفسير»(١)، وما وراء ذلك لا منتهى له.", "وأما الحديث: فاعتمد على الصحيحين، وقد لخص متونهما أبو عبد الله الحميدي(٢) فأحسن، وقد فسرناهما في كتابنا المسمى بـ«الكشف لمشكل الصحيحين»(٣)، فإن شئت أن تضيف إلى ذلك زيادة ففي كتابنا المسمى(٤) بـ«الحدائق»(٥) مقصودك، وإذا أردت الزيادة فطالع مسند الإمام أحمد(٦) رحمه الله، وسنن أبي داود رحمه الله،(٧-٧) وكتابنا الجامع للمسانيد(٨) علله يغني عن غيره،(٧-٧) وأما", "حاشية: (١) كتاب «المغني في التفسير» ذكره ابن الجوزي في «القصاص والمذكرين» وابن رجب في «الذيل على الطبقات» والذهبي في «تاريخ الإسلام»، وانظر «مؤلفات ابن الجوزي»: (٤٥٣).", "حاشية: (٢) هو: أبو عبد الله محمد بن فتوح بن عبد الله الأزدي الحميدي، الإمام الحافظ، من كتبه: «الذهب المسبوك في وعظ الملوك»، و«تسهيل السبيل إلى علم الترسيل» و«تفسير غريب ما في الصحيحين» توفي ببغداد سنة ٤٨٨هـ. «سير أعلام النبلاء» ١٩/١٢٠.", "أما كتابه الذي أشار إليه المصنف فهو: «الجمع بين الصحيحين» رتبه مؤلفه على المسانيد لتسهيل مراجعة الطرق، وقد صدر عن دار ابن حزم في أربع مجلدات، بتحقيق: علي حسين البواب. وممن صنف في الجمع بين الصحيحين: أبو الفضائل الصاغاني، وأبو حفص عمر الموصلي.", "حاشية: (٣) كتاب «الكشف لمشكل الصحيحين» صدر عن دار الحديث بتحقيق د. مصطفى الذهبي، وقد رتبه محققه على صحيح البخاري، وهذا أنفع، وكان مؤلفه قد رتبه على المسانيد.", "حاشية: (٤) سقط من (ظ).", "حاشية: (٥) كتاب «الحدائق» صدر عن دار الكتب العلمية بتحقيق مصطفى السبكي، وتوجد نسخة منه مخطوطة في مكتبة بايزيد خان في استنبول، وانظر (مؤلفات ابن الجوزي): (١٢٨).", "حاشية: (٦) صدر «مسند الإمام أحمد» عن مؤسسة الرسالة مؤخرا في طبعة جديدة في (٥٠) جزءا بتحقيق عدد من الأساتذة وإشراف الشيخ شعيب الأرناؤوط، وقد حققت هذه الطبعة تحقيقا علميا من حيث ضبط النص، والحكم على الحديث، وجمع طرقه، وبيان علله وكشف مشكله، وحل معضلاته، وأتبعت بفهارس علمية كثيرة تجعل المسند داني الجنى لكل طالب علم.", "ومن فضل الله علي أني كنت من المشاركين في تحقيق هذا السفر العظيم.", "حاشية: (٧-٧) سقط من (ظ).", "حاشية: (٨) هو كتاب «الجامع للمسانيد بالأخص الأسانيد» ذكره ابن الجوزي في كتاب: «القصاص والمذكرين»، وابن رجب في «الذيل على طبقات الحنابلة»، وسبط ابن الجوزي في «مرآة الزمان»، وورد في (فهرست كتب ابن الجوزي): أنه استوعب غالب مسند أحمد"]], "ic": "book"}, {"story": ["الباب الثالث فيما يعده العامة من العلوم المحمودة وليس منها و (٩ من ١٠)، ص٤٩", ["الاستقصاء فهو الذي لا يسعه العمر، من معرفة الرجال وأسمائهم، وجرحهم وتعديلهم، واستيعاب الطرق(١)، وكل ذلك فضيلة في حق كل شخص، ولو أن العمر يتسع كنا أمرنا بالاقتصاد في شيء من هذه العلوم؛ لأن الزيادة فيها مطلوبة، غير أن العمر يضيق، فمتى صح التزيد مع إحكام الأصول المتعلقة بتهذيب النفس، فذلك الغاية.", "وأما الفقه: فالاقتصار فيه على كتابنا المسمى بـ«أسباب الهداية لأرباب البداية»(٢)، فإنا قد أشرنا فيه إلى العبادات الخمس(٣)، فمن(٤-٤) أراد الاطلاع على ما يزيد على ذلك، فكتابنا المسمى بـ«المذهب في المذهب»(٥)، فمن(٦) أراد الاطلاع على ما يزيد على ذلك، فكتاب الخرقي(٧)، فإن أراد أكثر من ذلك فكتاب «الهداية»(٨) لأبي الخطاب(٤-٤)، ومن طلب الاستقصاء فعليه بكتاب", "حاشية (تتمة): والصحيحين وجامع الترمذي، ومنه نسخة مخطوطة في جامعة الدول العربية. انظر (مؤلفات ابن الجوزي): (١١٢) و(١١٣).", "حاشية: (١) من الكتب التي تختص بها: «تهذيب الكمال» للمزي، و«الجرح والتعديل» للرازي، و«ميزان الاعتدال» للذهبي، و«لسان الميزان» لابن حجر، و«التاريخ الكبير»، و«الأوسط» للبخاري، وكتب الضعفاء وغيرها.", "حاشية: (٢) كتاب «أسباب الهداية» ذكره سبط ابن الجوزي في «مرآة الزمان» وابن رجب في «الذيل على طبقات الحنابلة»، والذهبي في «تاريخ الإسلام». انظر «مؤلفات ابن الجوزي»: (٣١).", "حاشية: (٣) سقطت من الأصل.", "حاشية: (٤-٤) سقط من (ظ).", "حاشية: (٥) كتاب «المذهب في المذهب» ذكره سبط ابن الجوزي في «مرآة الزمان»، وابن رجب في «الذيل»، والذهبي في «تاريخ الإسلام»، وانظر «مؤلفات ابن الجوزي»: (٤٢٠).", "حاشية: (٦) سقط من الأصل.", "حاشية: (٧) هو الكتاب المشهور بـ(مختصر الخرقي) صدر عن المكتب الإسلامي بتحقيق الأستاذ زهير شاويش، وللكتاب شروح من أجلها: (المغني) لابن قدامة، صدر عن دار هجر بتحقيق د. عبد الله التركي.", "أما الخرقي فهو: أبو القاسم عمر بن الحسين بن عبد الله البغدادي الخرقي الحنبلي، من كبار شيوخ الحنابلة، من أهل بغداد، ونسبه إلى بيع الثياب والخرق، تفقه بوالده، وأكثر التصنيف، رحل عن بغداد لما ظهر فيها سب الصحابة، وأودع كتبه دارا فاحترقت، بقي من كتبه «المختصر»، قدم دمشق وتوفي فيها سنة ٣٣٤هـ، ودفن في مقبرة الباب الصغير. «تاريخ بغداد» ١١/٢٣٤، و«سير أعلام النبلاء» ١٥/٣٦٣.", "حاشية: (٨) كتاب «الهداية» في الفروع، ذكره حاجي خليفة في (كشف الظنون) ٢/٢٠٣١، والذهبي", "«الفصول»(١) لابن عقيل رحمه الله."]], "ic": "book"}, {"story": ["الباب الثالث فيما يعده العامة من العلوم المحمودة وليس منها و (١٠ من ١٠)، ص٥٠", ["وأما علم الخلاف والمناظرة فقد رتبنا فيه كتبا منها (جنة النظر)(٢)، ومنها «الدلائل الزواهر في المسائل الظواهر»(٣)، فمن حسن قصده لمعرفة الدليل فلا بأس له بالمناظرة، وقد كان السلف رضي الله عنهم يقصدون بالنظر استخراج الحق والاطلاع على علل الشرع، فأحدث المتأخرون الجدل(٤) الذي يبعد عن ذوق الفقه، ويخرج إلى المنافسة والمباهاة.", "حاشية (تتمة): في «السير» ١٩/٣٤٩، وإسماعيل البغدادي في «هدية العارفين» ٦/٦، ومصنفه هو أبو الخطاب محفوظ بن أحمد بن الحسن الكلوذاني البغدادي شيخ الحنابلة في عصره، صنف: التمهيد، والانتصار، وعقيدة أهل الأثر، توفي ببغداد سنة (٥١٠هـ). «سير أعلام النبلاء» ١٩/٣٤٨.", "حاشية: (١) كتاب «الفصول» ذكره إسماعيل البغدادي في «هدية العارفين» ٥/٦٩٥، وابن رجب في «الذيل» ترجمة (٦٦)، وتوجد قطعة منه في مكتبة الأسد بدمشق برقم (٢٧٥٢)، ومصنفه هو: أبو الوفاء علي بن عقيل البغدادي الظفري شيخ الحنابلة في وقته، من تصانيفه كتاب «الفنون»، و«الواضح» في أصول الفقه، والجدل وغيرها، توفي سنة (٥١٣)هـ. «سير أعلام النبلاء» ١٩/٤٤٣.", "حاشية: (٢) كتاب «جنة النظر» ذكره ابن رجب في «الذيل» والبغدادي في «هدية العارفين»، وانظر «مؤلفات ابن الجوزي»: (١٢٠).", "حاشية: (٣) لم نقف عليه بهذا الاسم، لكن ورد في «تذكرة الحفاظ» للذهبي «الدلائل في منثور المسائل»، وفي «الوافي بالوفيات» للصفدي: «الدلائل في مشتبه المسائل» وفي «مرآة الزمان» لسبط ابن الجوزي: «الدلائل في مشهور المسائل». وينظر «مؤلفات ابن الجوزي»: (١٥٠) و(١٧٧).", "حاشية: (٤) الجدل: طريقة في المن في سبب إقبال الناس على علم الخلاف وتفصيل آفات المناظرة وا", "b": [{"pic": ["books", "book"], "cap": "ص٥١ - ص٥٤"}, {"story": ["الباب الرابع في سبب إقبال الناس على علم الخلاف وتفصيل آفات ا (١ من ٣)، ص٥١", ["**في سبب إقبال الناس على علم الخلاف وتفصيل آفات المناظرة والجدل، وشروط إباحتها**", "لما تولى الخلافة بعد رسول الله صلى الله عليه وسلم الخلفاء الراشدون رضوان الله عليهم، وكانوا أئمة علماء بالله، فقهاء في أحكام شرعه، فلم يحتاجوا إلى الاستعانة بالفقهاء إلا على سبيل الندور، في وقائع لا يستغنى فيها عن المشاورة، فتفرغ العلماء لعلم الآخرة، وتجردوا لها، وكانوا يتدافعون الفتوى.", "فلما صارت السلطنة إلى أقوام يفتقرون إلى الفقهاء، طلبوا الفقهاء، وكان قد بقي من التابعين من هو مستمر على الطريق الأول، فكانوا يهربون منهم، فاشتغل أقوام بالفقه ـ إذ رأوا عزة أهله ـ لإدراك الجاه، وتحصيل الدنيا، وطلب الولايات، ثم مال بعض السلاطين إلى الكلام في المعتقدات، فاشتغل الناس بعلم الكلام، وصنفوا فيه، وزعموا: إن غرضنا الذب عن دين الله.", "ثم ظهر من السلاطين من لم يستصوب الخوض في الأصول، واستحسن النظر في الفقه، فاشتغل الناس بمسائل الخلاف بين أبي حنيفة والشافعي، وأعرضوا عن الخلاف مع مالك وسفيان وأحمد رحمهم الله.", "وزعموا أن غرضهم استنباط دقائق الشرع، وتقرير علل المذهب، ورتبوا(١) أنواع المجادلات، والله أعلم بالضمائر، وعليها يجازي، ومن هذا الجنس ميل أكثر الناس إلى الوعظ لاستجلاب العوام بما يميلهم، و«إنما الأعمال بالنيات»(٢).", "حاشية: (١) في (ظ): «وزينوا».", "حاشية: (٢) أخرجه البخاري (١)، ومسلم (١٩٠٧) من حديث عمر رضي الله عنه.", "**بيان التلبيس في تشبيه هذه المناظرات بمشاورات(١) الصحابة ومفاوضات السلف**", "أما التعاون على طلب الحق فمن الدين، إلا أن له علامات، منها:", "أن لا يشتغل بالمناظرة ـ التي هي من فروض الكفايات ـ من لم يتفرغ من فروض الأعيان، فإنه إن فعل ذلك وزعم أن مقصوده الحق، فهو كاذب، ويكون كمن يترك الصلاة ثم ينسج الثياب ويتجر فيها، ويزعم أن غرضه من ذلك ستر عورة من يصلي عريانا ولا يجد ثوبا، أو كمن توجه عليه رد وديعة في الحال، فقام يحرم بالصلاة فإنه لا يجوز له.", "ومنه أن يقصد الحق لا الغلبة.", "ويذعن للصواب.", "وأن تكون المناظرة في الخلوة أحب إليه من المناظرة في المحافل، وللأكابر الذين يستفاد منهم، لا لمن يظن به العجز فينقطع.", "ولا يمنع مناظره من الانتقال عن دليل إلى دليل، إن كان المقصود إصابة الصواب.", "وأكثر المجالس اليوم تنقضي في المدافعات والمجادلات، حتى إن المستدل يقيس على أصل بعلة يظنها، فيقال له: وما الدليل على أن الحكم في الأصل معلل بهذه العلة؟ فيقول: هذا(٢) الذي ظهر لي، فإن ظهر لك ما هو أوضح من هذا فاذكره لي حتى أنظر فيه. فيقول المعترض: فيه معان غير ما ذكرت، ولا أذكره لك، ولا يلزمني ذكره. فإن كان لا يعرف معنى فقد كذب بدعواه: أني أعرف(٣)، وإن كان صادقا فقد أخفى ما علمه(٤) من أمر الشرع عن أخيه المسلم، «ومن كتم"]], "ic": "book"}, {"story": ["الباب الرابع في سبب إقبال الناس على علم الخلاف وتفصيل آفات ا (٢ من ٣)، ص٥٢", ["حاشية: (١) في (ظ): «ومشاورات».", "حاشية: (٢) في (ظ): «هو».", "حاشية: (٣) سقطت من الأصل.", "حاشية: (٤) في (ظ): «عرفه».", "علما علمه ألجمه الله يوم القيامة بلجام من نار»(١). وإنما يريد بقوله: لا يلزمني ذكره. أي: في شرع الجدل الذي ابتدعناه.", "فأما مناظرات السلف فليس فيها من هذا الجنس، بل كانوا ينتقلون من دليل إلى دليل، ويذكرون كل ما يخطر لهم.", "**فصل في بيان آفات المناظرة ومذموم أخلاق المناظر**", "واعلم أن المناظرة الموضوعة لقصد الغلبة والمباهاة منبع الأخلاق(٢) المذمومة، ولا يسلم صاحب هذه المناظرة من كبر لاحتقار المقصرين عنه، وعجب بنفسه لارتفاعه على كثير من نظرائه، وحسد لمن هو أنظر منه، وحقد على مناظره إذا أحس منه بقلة مبالاة بكلامه، وغيبة يحكي بها من كلام مناظره ما يدل على قصوره. فإن كذب عليه فبهتان، وكراهية لظهور الحق على لسان خصمه. وقد قال الشافعي رحمه الله: ما ناظرني أحد فباليت مع أينا كانت الحجة، فإن(٣) كانت معه صرت إليه(٤).", "ومكابرة(٥) على الحق بعد وضوحه، قال الشافعي رحمه الله: ما قبل أحد مني الحجة إلا عظم في عيني، ولا دفعها إلا هان عندي.", "ورياء(٦)؛ لأن جمهور مقصود المناظر اليوم علم الناس بغلبته، وانطلاق", "حاشية: (١) أخرجه أبو داود (٣٦٥٨)، والترمذي (٢٦٤٩)، وابن ماجه (٢٦١) وغيرهم من حديث أبي هريرة رضي الله عنه.", "وروي عن عبد الله بن عمرو، وابن عمر، وابن عباس، وابن مسعود، وأبي سعيد الخدري، وعمرو بن عبسة، وجابر بن عبد الله، وأنس بن مالك وطلق بن علي رضي الله عنهم، ولا يخلو إسناد واحد منهم من مقال، وأجودها حديث أبي هريرة رضي الله عنه.", "حاشية: (٢) في (ظ): «للأخلاق».", "حاشية: (٣) في (ظ): «إن».", "حاشية: (٤) «مناقب الشافعي» للبيهقي ١/١٧٣.", "حاشية: (٥) في (ظ): «ولا أكابره».", "حاشية: (٦) في (ظ): «ثم لا يسلم من رياء الخلق».", "ألسنتهم بشكره(١) ومدحه، فهو يذهب عمره في العلوم التي تعين على المناظرة، مما لا ينفع في الآخرة، كتحسين(٢) اللفظ، وحفظ النوادر.", "وتزكية النفس بمدح كلامها، وفرح بمساءة خصمه، فأين الإخاء المنعقد بالعلم بين أهله؟!", "قال الشافعي رحمه الله: العلم(٣) بين أهل العقل رحم متصل.", "وكان الإمام أحمد رحمه الله يقول لابن الشافعي(٤) رحمه الله: أبوك من الستة الذين أدعو لهم وقت السحر(٥).", "وهذه الرذائل لا يكاد المناظر يخلو من بعضها، وإنما غاية العاقل منهم أن يجاهد النفس في الحاصل منها.", "فأما الرعاع(٦) من المناظرين فربما خرجوا إلى المجالدة(٧) عن المجادلة.", "وهذه الآفات المذكورة للواعظ أيضا، ولكل من يطلب علما، إلا من وفقه الله لحسن قصده، وقد قال النبي صلى الله عليه وسلم: «أشد الناس عذابا يوم القيامة عالم لا ينفعه الله بعلمه»(٨).", "حاشية: (١) في (ظ): «بكثرة».", "حاشية: (٢) في (ظ): «التحسين».", "حاشية: (٣) سقطت من (ظ)."]], "ic": "book"}, {"story": ["الباب الرابع في سبب إقبال الناس على علم الخلاف وتفصيل آفات ا (٣ من ٣)، ص٥٤", ["حاشية: (٤) هو محمد ابن الشافعي رحمهما الله، أكبر أولاد الشافعي، كان من أهل العلم، وتولى القضاء بالجزيرة وأعمالها، توفي فيها بعد سنة (٢٤٠ هـ). «طبقات الشافعية» للسبكي ٢/٧١.", "حاشية: (٥) أخرجه السبكي في «طبقات الشافعية» ٢/٧٢.", "حاشية: (٦) الرعاع هم سفلة الناس وسقاطهم وغوغاؤهم. «اللسان»: (رعع).", "حاشية: (٧) المجالدة: أن يضرب القوم بعضهم. «اللسان»: (جلد).", "حاشية: (٨) أخرجه الطبراني في «الصغير» (٥٠٧)، وابن عدي في «الكامل» ٣/٤٧٤ و٦/٢٦٩، والبيهقي في «شعب الإيمان»: (١٧٧٨)، والخطيب في «الكفاية» ص ٢١ ـ ٢٢، وابن عبد البر في (جامع بيان العلم) ١/١٦٢، وأخرجه أبو القاسم الهمداني في «الفوائد» ١/١٩٦ والبيهقي في «الشعب»: (٧٨٨٨) عن ابن عباس، وأخرجه ابن المبارك في «الزهد»: (٤٠)، وأبو نعيم في «الحلية» ١/٢٢٣ عن أبي الدرداء."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "وروي عن عبد الله بن عمرو، وابن عمر، وابن عباس، وابن مسعود، وأبي سعيد الخدري، وعمرو بن عبسة، وجا
