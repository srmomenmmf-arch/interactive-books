)، وشبه صاحبها بأكل لحم الميتة، فقال تعالى: ﴿وَلَا يَغْتَب بَعْضُكُم بَعْضًا أَيُحِبُّ أَحَدُكُمْ أَن يَأْكُلَ لَحْمَ أَخِيهِ مَيْتًا فَكَرِهْتُمُوهُ﴾ [الحجرات: ١٢].", "وقد صح عن رسول الله ﷺ أنه قال: «إن دماءكم وأموالكم وأعراضكم عليكم حرام».", "وفي حديث آخر: «كل المسلم على المسلم حرام؛ دمه وماله وعرضه».", "والغيبة هي تناول العرض، فجمع بينه وبين الدماء والأموال، أخبرنا أبو غالب محمد بن الحسن الماوردي قال: أخبرنا شيبان(٤) بن عبد الله الأسدي قال: أخبرنا أبو عبد الله بن مندة، قال: أخبرنا محمد بن يحيى الطائي قال: حدثنا علي بن حرب قال: حدثنا سفيان بن عيينة قال: حدثنا زياد بن علاقة عن أسامة بن شريك قال: سمعت الأعاريب يسألون رسول الله ﷺ: هل علينا جناح في كذا وكذا؟", "حاشية: (١) وهي تعني مسجده في بيته لكي لا تكون كاذبة.", "حاشية: (٢) وهو حديث أبي هريرة المطول في الشفاعة، أخرجه البخاري (٣٣٤٠) و(٣٣٦١) و(٤٧١٢)، ومسلم (١٩٤) (٣٢٧).", "حاشية: (٣) في (ظ): (عنه).", "حاشية: (٤) تصحف في الأصل إلى: (سنان).", "فقال: «عباد الله، وضع الله الحرج إلا امرأ اقترض(١) من عرض أخيه، فذاك الذي حرج(٢)».", "وروى أبو هريرة عن النبي ﷺ قال: «أربا الربا استطالة الرجل في عرض أخيه»(٣)."]], "ic": "book"}, {"story": ["كتاب آفات اللسان (١٨ من ٣٠)، ص٦٧٥", ["أخبرنا هبة الله بن محمد قال: أخبرنا الحسن بن علي قال: أخبرنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا أسود بن عامر قال: حدثنا أبو بكر بن عياش عن الأعمش عن سعيد بن عبد الله عن أبي برزة الأسلمي قال: قال رسول الله ﷺ: «يا معشر من آمن بلسانه ولم يدخل الإيمان قلبه، لا تغتابوا المسلمين، ولا تتبعوا عوراتهم، فإنه من يتبع عوراتهم يتبع الله عورته، ومن يتبع الله عورته يفضحه في بيته»(٤).", "وروى جابر عن النبي ﷺ أنه قال: «إياكم والغيبة، فإن الغيبة أشد من الزنا، إن الرجل قد يزني فيتوب فيتوب الله عليه، وإن صاحب الغيبة لا يغفر له حتى يغفر له صاحبه».", "وروى أنس عن النبي ﷺ أنه قال: «مررت ليلة أسري بي على قوم يخمشون وجوههم بأظافيرهم، فقلت: يا جبريل، من هؤلاء؟ قال: هؤلاء الذين يغتابون الناس، ويقعون في أعراضهم»(٥).", "وقال عمر بن الخطاب: إياكم وذكر الناس، فإنه داء.", "وقال الأحنف: ما ذكرت أحدا بسوء بعد أن يقوم من عندي.", "حاشية: (١) أي اقتطع ونال منه بالغيبة.", "حاشية: (٢) أخرجه أحمد (١٨٤٥٤)، وينظر بقية تخريجه ثمة.", "حاشية: (٣) أخرجه ابن عدي في الكامل ٦/ ٢٥٩، والبيهقي في شعب الإيمان (٦٧٦٩).", "حاشية: (٤) أخرجه أحمد (١٩٧٧٦) وأبو داود (٤٨٨٠)، وأبو يعلى (٧٤٢٤) وابن أبي الدنيا في الصمت (١٦٨) والبيهقي في السنن ١٠/ ٢٤٧ وفي الشعب (٦٧٠٤).", "حاشية: (٥) أخرجه أحمد (١٣٣٤٠).", "وقال بكر بن عبد الله: إذا رأيتم الرجل موكلا بعيوب الناس ناسيا لعيبه، فاعلموا أنه قد مكر به.", "وكان ميمون بن سياه لا يغتاب أحدا ولا يدع أحدا(١) يغتاب عنده، ينهاه، فإن انتهى وإلا قام عنه.", "وكتب فتح بن شخرف على باب بيته: رحم الله ميتا دخل على هذا الميت فلم يذكر الموتى عنده إلا بخير.", "أخبرنا عبد الخالق بن عبد الصمد قال: أخبرنا أبو الحسين بن النقور قال: أخبرنا أبو طاهر المخلص قال: حدثنا البغوي البلدي قال: حدثنا أبو روح البلدي قال: حدثنا مخلد بن الحسين عن أبان بن خالد(٢) الربعي قال: دخلت المسجد فإذا قوم يغتابون رجلا، فقلت: لا تفعلوا، فكفوا ثم ذكروه، فنلت معهم منه، فلما نمت جاءني آت ومعه قطعة لحم خنزير، فقال لي: كلها. فأبيت عليه، فقال: كلها. فأبيت عليه، فقال لي: كلها. فخفت منه، فوضعتها في في، فجعلت ألوكها ولا أقدر أن ألفظها مخافته، وكنت هويا(٣) من الليل وهي في في، ثم أصبحت شهرا أعده وأنا لا آكل طعاما ولا أشرب شرابا إلا وجدت طعمه في في(٤).", "وكان الحسن يقول: ابن آدم إنك لن تصيب حقيقة الإيمان حتى لا تعيب الناس بعيب هو فيك، وحتى تبدأ بذلك العيب فتصلحه من نفسك، فإذا فعلت ذلك كان شغلك في خاصة نفسك، وأحب العباد إلى الله من كان كذلك."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "واعلم أنه يدخل في هذا فتوى العالم بما لا يتحققه وروايته للحديث الذي لا يتثبت فيه، إذ غرضه أن ____ فضل نفسه، فهو لذلك يستنكف أن يقول", "o": ["يظهر", "العشرة", "فذكروا", "عذرتك"], "h": "راجع: ص٦٧١"}, {"t": "fill", "d": 2, "q": "أحمده ما كبر عبد أو هلله، وأشهد أن الواحد لا شريك له، وأصلي على رسوله محمد الذي أرسله، ونبيه الذي فخمه وبجله، وعلى من صحبه وتبعه ____، وسلم تسليما كثيرا", "o": ["وقبله", "وتخشعا", "بجملة", "للسباع"], "h": "راجع: ص٦٤٥"}, {"t": "fill", "d": 2, "q": "وقد روينا عن عمر أنه سمع ____ يثني على رجل فقال", "o": ["رجلا", "للشهوة", "أصوم", "يبدؤوه"], "h": "راجع: ص٦٩٦"}, {"t": "fill", "d": 2, "q": "عرفت من عبدك السرقة أو الفسق، فلك أن تذكر ذلك للمشتري؛ لأن مراعاة جانبه أولى من مراعاة جانب العبد، وكذلك المزكي إذا سئل عن الشاهد فله الطعن، وكذلك المستشار في التزويج ____ الأمانة له أن يذكر ما يعرفه على قصد النصح للمستشير لا على قصد الوقيعة، إذا علم أنه لا ينزجر إلا بالتصريح، وإن علم أنه يترك التزويج بمجرد قوله", "o": ["وإيداع", "العينين", "إنكاره", "القرني"], "h": "راجع: ص٦٩٠"}, {"t": "fill", "d": 2, "q": "وروي عن علي رضي الله عنه أن رجلا أتاه ____ إليه برجل، فقال", "o": ["يسعى", "واسم", "ويفتضح", "مالي"], "h": "راجع: ص٦٩٣"}, {"t": "fill", "d": 2, "q": "الثالث: أنه كان نادرا، فلا ينبغي أن يحتج به من يريد الدوام عليه، فإن حكم النادر ليس كحكم الدائم، ولو أن إنسانا دار مع ____ ليلا ونهارا ينظر إلى لعبهم، واحتج بأن رسول الله ﷺ وقف لعائشة وأذن لها", "o": ["الحبشة", "يعجبني", "يتبعونها", "سبيلها"], "h": "راجع: ص٦٦١"}]}, {"t": "كتاب آفات اللسان - القسم ٤ من ٥", "b": [{"story": ["كتاب آفات اللسان (١٩ من ٣٠)، ص٦٧٦", ["وروي(٥) أن عيسى عليه السلام مر مع الحواريين على جيفة كلب، فقال الحواريون: ما أنتن ريح هذا. فقال عيسى: ما أشد بياض أسنانه. يعظهم وينهاهم عن الغيبة.", "حاشية: (١) سقطت من (ظ).", "حاشية: (٢) هكذا في النسخ، وفي شعب الإيمان: (عن هشام بن حسان عن خالد الربعي).", "حاشية: (٣) الهوي: الساعة من الليل.", "حاشية: (٤) أخرجه البيهقي في الشعب (٦٧١٣).", "حاشية: (٥) في (ظ): (وقد روينا).", "وقال علي بن الحسين: إياك والغيبة، فإنها إدام كلاب الناس.", "وسمع قتيبة بن مسلم رجلا يغتاب رجلا، فقال: أما والله لقد تلمظت(١) بمضغة طالما لفظها الكرام.", "حاشية: (١) يقال: تلمظ ولمظ الشيء أي: ذاقه وأكله.", "**بيان**", "**معنى الغيبة**", "اعلم أن حد الغيبة أن تذكر أخاك الغائب بما يكرهه إذا بلغه، سواء ذكرت نقصانا في بدنه، أو في نسبه، أو في خلقه، أو في فعله ودينه، أو في دنياه، أو في ثوبه.", "أما في البدن؛ فكذكرك العمش والحول والقرع والطول والقصر، وكل ما يكره ذكره من وصف(١).", "وأما النسب؛ فأن تقول: أبوه نبطي أو هندي أو فاسق أو خسيس أو إسكاف(٢) أو زبال أو نحو ذلك.", "وأما الخلق؛ فأن تقول: هو سيء الخلق بخيل، متكبر، مراء، جبان، عاجز، ونحو ذلك.", "وأما في أفعاله المتعلقة بالدين، فقولك: كاذب، شارب، خائن(٣)، ظالم، متهاون بالصلاة، لا يحسن أن يصلي، لا يحترز عن النجاسات ونحو ذلك.", "وأما أفعاله المتعلقة بالدنيا؛ فكقولك: إنه سيء الأدب، كثير الكلام، كثير الأكل، لا يرى لأحد حقا.", "وأما في ثوبه؛ فمثل أن تقول: هو طويل الذيل، واسع الكم، وسخ الثياب.", "ويدل على أن الغيبة ذكر ما في الإنسان ما أخبرنا به ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أبو بكر بن مالك قال: أخبرنا عبد الله بن أحمد قال:", "حاشية: (١) في (ظ): (وصفه).", "حاشية: (٢) الإسكاف: صانع الأحذية ومصلحها.", "حاشية: (٣) في (ظ): (جائر).", "حدثني أبي قال: حدثنا عفان قال: حدثنا عبد الرحمن بن إبراهيم قال: حدثنا العلاء عن أبيه عن أبي هريرة عن رسول الله ﷺ أنه قيل له: ما الغيبة يا رسول الله؟ قال: «ذكرك أخاك بما يكره». قال: أفرأيت إن كان في أخي ما أقول أي رسول الله؟ قال: «إن كان في أخيك ما تقول فقد اغتبته، وإن لم يكن فيه ما تقول فقد بهته»(١).", "أخبرنا ظفر(٢) بن علي قال: أخبرنا طلحة بن الحسين الصالحاني قال: أخبرنا محمد بن عبد الله بن أحمد بن ريذة قال: أخبرنا سليمان بن أحمد الطبراني، قال: حدثنا إدريس بن عبد الكريم قال: حدثنا عاصم بن علي قال: حدثني أبي عن المثنى ابن الصباح عن عمرو بن شعيب عن أبيه عن جده عن معاذ بن جبل قال: كنت عند النبي ﷺ، فذكروا عنده رجلا، فقالوا: ما أعجزه. فقال النبي ﷺ: «اغتبتم أخاكم». قالوا: يا رسول الله، قلنا ما فيه! قال: «إن قلتم ما ليس فيه فقد بهتموه».", "حاشية: (١) أخرجه أحمد (٧١٤٦) و(٨٩٨٥).", "حاشية: (٢) تحرفت في (ظ) إلى: (مظفر)."]], "ic": "book"}, {"story": ["كتاب آفات اللسان (٢٠ من ٣٠)، ص٦٨٠", ["**بيان**", "**أن الغيبة لا تقتصر على اللسان**", "اعلم أن الذكر باللسان إنما حرم لأن فيه تفهيم الغير نقصان أخيك، فالتعريض بذلك كالتصريح من الإشارة والإيماء والغمز وكل ما يفهم منه مقصود الذم، فهو داخل في الغيبة، فهو حرام.", "وقد حكت عائشة امرأة عند رسول الله ﷺ فذكرت قصرها، فقال: «قد اغتبتيها».", "وقال عليه الصلاة والسلام: «ما يسرني أني حكيت إنسانا(١) وأن لي كذا وكذا».", "ويدخل في هذا الغيبة بالكتاب، فإن القلم أحد اللسانين، مثل أن يذكر المصنف شخصا معينا ويهجن(٢) كلامه، إلا أن يكون ذكر ذلك غير مذموم، فإن قال: قال قوم كذا، ولم يدر من القائل فليس بغيبة، فإن فهم المشار إليهم فهو غيبة.", "وأخبث أنواع الغيبة غيبة المتزهدين المرائين، فإنهم يجمعون بين ذم المذكور ومدح أنفسهم، ولا يدرون بجهلم أنهم قد جمعوا بين فاحشتين: الغيبة والرياء، مثل أن يذكر عندهم إنسان فيقولون: الحمد لله الذي لم يبلنا بالدخول على السلطان والتبذل في طلب الحطام. أو يقولون: نعوذ بالله من قلة الحياء، نسأل الله أن يعصمنا منه.", "وإنما مقصودهم تفهيم عيب الغير، وقد يقدمون مدح المذكور قبل عيبه، فيقولون: ما أحسن ما كانت أحوال فلان، ماكان يقصر في العبادات، لكن قد", "حاشية: (١) في الأصل: (أحدا).", "حاشية: (٢) هجن كلامه: صار معيبا مرذولا.", "اعتراه فتور وابتلي بما لا نسلم نحن منه من قلة الصبر. فيذكرون أنفسهم ومقصودهم ذم غيرهم ومدح أنفسهم(١) بالتشبه بالصالحين في ذم النفوس، فيجمعون بين الغيبة والرياء وتزكية النفس، ويظنون أنهم من المتعففين عن الغيبة.", "وربما ذكر عيب إنسان فلم يتنبه له بعض الحاضرين، فيقول المتزهد: سبحان الله، ما أعجب هذا! ليتنبه على الحال من لم يدر، وربما قال: لقد ساءني ما قد جرى على صديقنا فلان من الاستخفاف به(٢)، فنسأل الله تعالى أن يروح سره. ويكون كاذبا في دعوى الاغتمام، وفي إظهار الدعاء، إذ لو قصد الدعاء لأخفاه في خلوة، ولو كان صادقا في الاغتمام لاغتم بإظهار حال الرجل، وربما قال: ذلك المسكين قد بلي بآفة عظيمة تاب الله علينا وعليه. فهو يظهر الدعاء له ويخفي قصده.", "ومن ذلك الإصغاء إلى الغيبة على سبيل التعجب، فإنه إنما يظهر التعجب ليزيد نشاط المغتاب في الغيبة، فيندفع فيها، فكأنه يستخرج الغيبة منه بهذا الطريق، فيقول: عجيب! ما علمت أنه كذلك، ما عرفته إلى الآن إلا بالخير، كنت أحسب فيه غير هذا! عافانا الله من بلائه."]], "ic": "book"}, {"story": ["كتاب آفات اللسان (٢١ من ٣٠)، ص٦٨١", ["واعلم أن المستمع شريك القائل، ولا يتخلص المستمع من إثم سماع الغيبة إلا أن ينكر بلسانه فإن خاف فبقلبه، وإن قدر على القيام أو قطع الكلام بكلام آخر لزمه ذلك، وإن قال بلسانه: اسكت وقلبه يشتهي الغيبة، فذلك نفاق ولا يكفي أن يسكت القائل بأن يشير إليه بيده أو بحاجبه؛ لأن ذلك استحقار للمذكور، بل ينبغي أن يعظمه فيذب عنه صريحا، وقد قال النبي ﷺ: «من أذل عنده مؤمن وهو يقدر على أن ينصره فلم ينصره أذله الله على رؤوس الخلائق».", "وقال: «من ذب عن عرض أخيه بالمغيبة، كان حقا على الله أن يعتقه من النار».", "حاشية: (١) في (ظ): (نفوسهم).", "حاشية: (٢) ليست في (ظ).", "وقال: «ما من امرئ(١) يخذل امرأ مسلما في موطن تنتهك فيه حرمته، وينتقص فيه من عرضه إلا خذله الله عز وجل في موطن يحب فيه نصرته، وما من امرئ مسلم ينصر امرأ مسلما في موطن ينتقص فيه من عرضه وتنتهك فيه حرمته إلا نصره الله عز وجل في موطن يحب فيه نصرته»(٢).", "وقال: «من حمى مؤمنا من منافق يعيبه بعث الله عز وجل ملكا يحمي لحمه يوم القيامة من نار جهنم، ومن بغى(٣) مسلما بشيء يريد به شينه حبسه الله على جسر جهنم حتى يخرج مما قال»(٤).", "وقال مولى لعمرو بن عتبة: رآني عمرو وأنا مع رجل وهو يقع في آخر، فقال لي: ويلك! نزه سمعك عن استماع الخنا كما تنزه لسانك عن القول به، فإن المستمع شريك القائل، وإنما نظر إلى شر ما في وعائه فأفرغه في وعائك، ولو رددت كلمة سفيه في فيه، لسعد بها رادها كما شقي بها قائلها.", "وقد وردت أحاديث في حق المسلم على المسلم ووجوب نصرته، قد تقدمت في كتاب آداب الصحبة(٥).", "حاشية: (١) بعدها في (ظ): (مسلم).", "حاشية: (٢) أخرجه أحمد (١٦٣٦٨)، وأبو داود (٤٨٨٤)، والطبراني في الكبير (٤٧٣٥)، وأبو نعيم في الحلية ٨/ ١٨٩، والبيهقي في السنن ٨/ ١٦٧ - ١٦٨، وابن أبي الدنيا في الصمت وآداب اللسان (٢٤١) من حديث جابر بن عبد الله وأبي طلحة بن سهل.", "حاشية: (٣) بغى: طلب.", "حاشية: (٤) أخرجه أحمد (١٥٦٤٤)، وأبو داود (٤٨٨٣)، وابن المبارك في الزهد (٦٨٦)، والطبراني في الكبير ٢٠/ (٤٣٣)، وأبو نعيم في الحلية ٨/ ١٨٨، والبيهقي في شعب الإيمان (٧٦٣١)، والبغوي في شرح السنة (٣٥٢٧) من حديث معاذ بن أنس الجهني.", "حاشية: (٥) سقطت من (ظ).", "**بيان**", "**الأسباب الباعثة على الغيبة**", "البواعث على الغيبة كثيرة، ولكن يجمعها أحد عشر سببا، ثمانية تطرد في حق العامة، وثلاثة تخص بأهل(١) الدين والخاصة.", "أما الثمانية:", "**فالأول**: تشفي الغيظ وذلك أنه يجري من الإنسان سبب يوجب غيظ هذا الآخر، فكلما هاج غضبه تشفى بغيبة ذاك، وقد يحتقن غيظه في باطنه فيصير حقدا ثابتا فيكون سببا لذكر المساوئ دائما، فالغضب والحقد من البواعث العظيمة على الغيبة."]], "ic": "book"}, {"story": ["كتاب آفات اللسان (٢٢ من ٣٠)، ص٦٨٣", ["**الثاني**: موافقة الأقران ومجاملة الرفقاء ومساعدتهم على الكلام، فإنهم إذا كانوا يتفكهون بذكر الأعراض رأى هذا أنه إن أنكر أو قطع كلامهم استثقلوه ونفروا عنه، فيساعدهم ويرى ذلك من حسن المعاشرة.", "**الثالث**: أن يستشعر من إنسان أنه سيقصده ويبسط لسانه فيه، أو يقبح حاله عند محتشم، فيبادره قبل ذلك بالطعن فيه، لئلا يبقى لشهادته أثر، وقد يبتدئ بالصدق في شرح حال من يعتابه ليكذب عليه بعد ذلك فيروج كذبه بالصدق الأول، ويقول: ما من عاداتي الكذب، فقد أخبرتكم بحاله وكان كما قلت.", "**والرابع**: أن ينسب إلى شيء فيريد أن يتبرأ منه، فيذكر الذي فعله أو الذي شاركه فيه ليمهد بذلك عذر نفسه، ولو أنصف لاقتصر على تنزيه نفسه فقط.", "**والخامس**: إرادة التصنع والمباهاة، وهو أن يرفع نفسه بتنقيص غيره فيقول: فلان جاهل، وفهمه ركيك، وكلامه ضعيف. وغرضه أن يثبت في ضمن ذلك فضل نفسه، ويريهم أنه أعلم منه، أو يحذر أن يعظم مثل تعظيمه، فيقدح فيه لذلك.", "حاشية: (١) تحرفت في (ظ) إلى: (بأمر).", "**والسادس**: الحسد، وهو أنه ربما يحسد من يثني الناس عليه ويحبونه ويكرمونه، ويثقل عليه سماع ثنائهم عليه وإكرامهم له فيريد زوال تلك النعمة عنه، فلا يجد سبيلا إلى ذلك إلا بالقدح فيه، وهذا هو الحسد، ويفارق الغضب والحقد؛ لأن ذلك يستدعي جناية من المغضوب عليه، والحسد قد يكون مع الصديق المحسن والقريب الموافق.", "**والسابع**: اللعب والهزل والمطايبة وتزجية الوقت بالضحك، فيذكر غيره بما يضحك الناس به على سبيل المحاكاة، وقد رأينا من كان كسبه من هذا، فكان يعيب القراء، والوعاظ، والباعة، والأعاجم وغيرهم.", "**والثامن**: السخرية والاستهزاء استحقارا له ومنشؤ ذلك التكبر(١) واستصغار المستهزأ به.", "أما الأسباب الثلاثة التي في الخاصة، فهي أغمضها وأدقها؛ لأنها شرور أخرجها الشيطان في معرض الخير.", "**الأول**: التعجب، فيقول: ما أعجب ما رأيت من فلان! فإنه قد يكون صادقا(٢)، ويكون تعجبه من المنكر، ولكن كان حقه أن يتعجب ولا يذكر اسم الرجل، فسهل عليه الشيطان ذكر اسمه في تعجبه، فصار بذلك مغتابا، وكذلك قول الرجل: تعجبت من فلان كيف يحب جاريته وهي قبيحة، وكيف يجلس بين يدي فلان وهو جاهل.", "**والثاني**: الرحمة، وهو أن يغتم بسبب ما ابتلي به إنسان فيقول: مسكين فلان قد غمني أمره وما ابتلي به. فيكون صادقا في اغتمامه، ويلهيه الغم عن الحذر عن ذكر اسمه فيذكره، فيصير مغتابا، فيبطل ثواب اغتمامه بغيبته.", "**الثالث**: الغضب لله، فإنه قد يغضب على منكر قارفه إنسان، فيظهر غضبه ويذكر اسم الرجل فيعلم بالرجل من لم يعلم.", "حاشية: (١) في (ظ): (الكبر).", "حاشية: (٢) في الأصل: (صدقا).", "**بيان**", "**العلاج الذي به يمنع اللسان من الغيبة**"]], "ic": "book"}, {"story": ["كتاب آفات اللسان (٢٣ من ٣٠)، ص٦٨٥", ["اعلم أن مساوئ الأخلاق كلها إنما تعالج بمعجون العلم والعمل، وإنما علاج كل علة بمضادة سببها فلنفحص عن سببها.", "وعلاج كف اللسان عن الغيبة على وجهين: أحدهما على الجملة، والآخر على التفصيل.", "**أما على الجملة**: فهو أن يعلم تعرضه بالغيبة لسخط الله عز وجل ومقته، وأنها تنقل حسناته إلى من اغتابه، فإن لم تكن له حسنات نقل إليه من سيئات خصمه، فمن آمن بذلك لم ينطلق(١) لسانه بالغيبة، وينفعه إذا عرضت له الغيبة أن يتفكر في عيوب نفسه فيشتغل بإصلاحها، أو أن(٢) يستحيي من أن يعيب عليه(٣) وهو معيب، كما قال الشاعر:", "فإن عبت قوما بالذي فيك مثله  فكيف يعيب العور(٤) من هو أعور", "وإن عبت قوما بالذي ليس فيهم  فذلك عند الله والناس أكبر", "فإن لم يجد في نفسه عيبا تشاغل بالشكر، ولم يلوث نفسه بأقبح العيوب وهو الغيبة، على (٥-٥)أن ظنه(٥-٥) أنه سليم من العيوب أعظمها.", "وينفعه أن يعلم أن تألم غيره لغيبته كتألمه بغيبة غيره له فإذا كان لا يرضى لنفسه أن يغتاب، فينبغي أن لا يرضى لغيره ما لا يرضاه لنفسه، فهذه معالجات جملية.", "حاشية: (١) في (ظ): (ينطق).", "حاشية: (٢) ليست في الأصل.", "حاشية: (٣) ليست في (ظ).", "حاشية: (٤) في (ظ): (الناس).", "حاشية: (٥-٥) سقط من الأصل.", "**وأما التفصيل**: فهو أن ينظر في السبب الباعث له على الغيبة، فإن علاج العلة بقطع سببها، وقد قدمنا ذكر الأسباب.", "فأما الغضب، فيعالجه بما سيأتي في كتاب آفات(١) الغضب.", "وجملته: أن يقول: إن أمضيت غضبي على هذا الشخص فربما أمضى الله علي غضبه بسبب غيبتي إياه، إذ نهاني عنه، وقد جاء في بعض كتب الله تعالى: (يا ابن آدم، اذكرني حين تغضب، أذكرك حين أغضب، فلا أمحقك فيمن أمحق).", "وأما الموافقة للجلاس(٢) فمعالجتها بأن يعلم أن الله تعالى يغضب على من طلب رضا المخلوقين بسخطه(٣)، فكيف يرضى أن يوقر جلساءه ويستهين بأمر ناهيه؟! بل ينبغي أن تغضب على رفقائك لله إذ عصوه، وعلى نحو هذا معالجة البواقي.", "والعجب لمن يقصد إقامة جاهه بذم غيره، وينسى أنه قد ابتدأ بإسقاط جاهه عند ربه، ولمن يذم شخصا بين نفر وينسى أنه يشتهر بالعقوبة غدا بين الخلائق.", "حاشية: (١) في ن اغتبت(١) أن تستغفر له».", "وقال مجاهد: كفارة أكلك لحم أخيك أن تثني عليه وتدعو له بخير. وكذلك إن كان قد مات.", "فأما قول أبي ضمضم: وقد تصدقت بعرضي.. فمعناه: أني لا أطالب به في يوم(٢) القيامة من تناوله، لا أن التناول يحل.", "**الآفة السادسة عشرة: النميمة**", "قال الله عز وجل: ﴿هَمَّازٍ مَّشَّآءٍۭ بِنَمِيمٍ﴾ [القلم: ١١].", "حاشية: (١) في (ظ): (اغتيب).", "حاشية: (٢) ليست في (ظ).", "أخبرنا عبد الأول قال: أخبرنا الداودي، قال: أخبرنا ابن أعين قال: أخبرنا الفربري قال: حدثنا البخاري قال: حدثنا أبو نعيم قال: حدثنا سفيان عن منصور عن إبراهيم عن همام بن الحارث قال: كنا عند حذيفة فقيل: له إن فلانا يرفع إلى عثمان الأحاديث، فقال: سمعت رسول الله ﷺ يقول: «لا يدخل الجنة قتات». أخرجاه في الصحيحين، وفي بعض ألفاظه: «لا يدخل الجنة نمام»."]], "ic": "book"}, {"story": ["كتاب آفات اللسان (٢٦ من ٣٠)، ص٦٩٢", ["وأخرجا من حديث ابن عباس عن النبي ﷺ أنه مر بقبرين فقال: «إنهما ليعذبان، وما يعذبان في كبير، أما أحدهما فكان لا يستبرئ من بوله، وأما الآخر فكان يمشي بين الناس بالنميمة».", "وروت أسماء بنت يزيد عن النبي ﷺ أنه قال: «ألا أخبركم بشراركم؟» قالوا: بلى. قال: «المشاؤون بالنميمة، المفرقون بين الأحبة، الباغون للبراء العنت».", "وروى أبو هريرة عن النبي ﷺ قال: «تجدون من شرار عباد الله عز وجل يوم القيامة ذا الوجهين، الذي يأتي هؤلاء بحديث هؤلاء، وهؤلاء بحديث هؤلاء».", "**فصل**", "واعلم أن النميمة تطلق في الأغلب على نقل قول إنسان في إنسان مثل أن يقول له: قال فيك فلان كذا وكذا. وليست النميمة مخصوصة بهذا، بل حدها كشف ما يكره كشفه، سواء كان من الأقوال أو من الأعمال حتى لو رآه يدفن مالا لنفسه فذكره فهو نميمة.", "والباعث على النميمة إما إرادة السوء بالمحكي عنه، أو إظهار الحب للمحكي له، أو التفرج بالحديث والخوض في الفضول.", "**فصل**", "وكل من نقلت إليه النميمة مثل أن يقال له: قال فيك فلان كذا، أو فعل في حقك كذا، أو هو يدبر في إفساد أمرك، ونحو هذا، فعليه ستة أشياء:", "**الأول**: أن لا يصدق الناقل؛ لأن النمام فاسق مردود الشهادة قال الله عز وجل: ﴿إِن جَآءَكُمْ فَاسِقٌۢ بِنَبَإٍ فَتَبَيَّنُوٓا۟ أَن تُصِيبُوا۟ قَوْمًۢا بِجَهَٰلَةٍ﴾ [الحجرات: ٦].", "**الثاني**: أن ينهاه عن ذلك وينصحه ويقبح له فعله، قال الله تعالى: ﴿وَأْمُرْ بِٱلْمَعْرُوفِ وَٱنْهَ عَنِ ٱلْمُنكَرِ﴾ [لقمان: ١٧].", "**الثالث**: أن يبغضه في الله، فإنه بغيض عند الله ويجب بغض من يبغضه الله عز وجل.", "**الرابع**: أن لا يظن بأخيه الغائب السوء؛ لقوله تعالى: ﴿ٱجْتَنِبُوا۟ كَثِيرًا مِّنَ ٱلظَّنِّ﴾ [الحجرات: ١٢] وقد ثبت فسق هذا الناقل فلا تقويل على خبره.", "**والخامس**: أن لا يحمله ما حكى له على التجسس والتبحث ليتحقق الأمر لقوله تعالى: ﴿وَلَا تَجَسَّسُوا۟﴾ [الحجرات: ١٢].", "**السادس**: أن لا ترضى لنفسك ما نهيت النمام عنه، فلا تحكي نميمته وتقول: فلان قد حكى كذا وكذا، فتكون بهذا نماما ومغتابا، فتكون قد أتيت بما عنه قد نهيت.", "وقال سليمان بن عبد الملك لرجل: بلغني أنك وقعت في، وقلت كذا وكذا. فقال الرجل: ما فعلت ولا قلت. فقال سليمان: إن الذي أخبرني صادق. فقال الزهري: النمام لا يكون صادقا، فقال سليمان: صدقت، اذهب بسلام.", "وقال الحسن: من نم(١) إليك نم عليك. وهذا إشارة إلى أن النمام ينبغي أن يبغض ولا يوثق بصداقته، وكيف لا يبغض وهو لا ينفك عن الكذب والغيبة والغدر والخيانة والغل والحسد والنفاق والإفساد بين الناس والخديعة، وهو ممن يسعى في قطع ما قد أمر به أن يوصل."]], "ic": "book"}, {"story": ["كتاب آفات اللسان (٢٧ من ٣٠)، ص٦٩٣", ["وروي عن علي رضي الله عنه أن رجلا أتاه يسعى إليه برجل، فقال: يا هذا، نحن نسأل عما قلت، فإن كنت صادقا مقتناك، وإن كنت كاذبا عاقبناك، وإن شئت أن نقيلك أقلناك. قال: أقلني يا أمير المؤمنين.", "وقال كعب: اتقوا النميمة، فإن صاحبها لا يستريح من عذاب القبر.", "حاشية: (١) في الأصل: (لك).", "وقال رجل لرجل: إن فلانا يذكرك بسوء. فقال: ما رعيت حق مجالسة الرجل حيث نقلت حديثه إلينا، ولا أديت حقنا حين أبلغتنا، أعلمه أن الموت يعمنا، والقبر يضمنا، والله يحكم بيننا، وهو خير الحاكمين.", "وذكرت السعاية عند بعض الحكماء، فقال: ما ظنك بقوم يحمد الصدق من كل طبقة إلا منهم.", "وقال يحيى بن أبي كثير: يفسد النمام في ساعة ما لا يفسد الساحر في شهر.", "أخبرنا علي بن محمد بن حسون قال: أخبرنا القاضي أبو القاسم بن المنذر قال: أخبرنا أبو محمد بن أبي عثمان قال: أخبرنا الحسين بن صفوان قال: حدثنا أبو بكر بن أبي الدنيا قال: حدثنا إبراهيم أبو إسحاق قال: حدثنا زيد بن عوف قال: حدثنا حماد بن سلمة عن حميد أن رجلا ساوم بعبد فقال مولاه: إني أبرأ إليك من النميمة فقال: نعم، أنت بريء منها. قال: فاشتراه فجعل يقول لمولاه: إن امرأتك تبغي، وتفعل وتفعل، وإنها تريد أن تقتلك. ويقول للمرأة: إن زوجك يريد أن يتزود عليك ويتسرى(١) فإن أردت أن أعطفه عليك فلا يتزوج عليك ولا يتسرى فخذي الموسى واحلقي شعرة من خلفه إذا نام. وقال للزوج: إنها تريد أن تقتلك إذا نمت. قال: فذهب فتناوم لها، فجاءت بموسى تحلق شعرة من خلفه، فأخذ بيدها فقتلها، فجاء أهلها فاستعدوا عليه فقتلوه.", "**الآفة السابعة عشرة: كلام ذي اللسانين**", "الذي يتردد بين المتعاديين وينقل كلام واحد في الآخر إليه، ويكلم كل واحد بكلام يوافقه، أو يعده بأن ينصره، أو يثني على الواحد في وجهه، ويذمه عند الآخر.", "وفي الصحيحين من حديث أبي هريرة عن النبي ﷺ أنه قال: «إن شر الناس ذو الوجهين، الذي يأتي هؤلاء بوجه وهؤلاء بوجه».", "حاشية: (١) يتسرى: أي يشتري سرية، وهي الجارية يصيبها.", "وروى أنس عن النبي ﷺ أنه قال: «من كان له لسانان في الدنيا جعل له لسانان من نار يوم القيامة».", "وفي أفراد البخاري أنه قيل لابن عمر: إنا ندخل على أمرائنا فنقول القول، فإذا خرجنا قلنا غيره؟! فقال: كنا نعد هذا على عهد رسول الله ﷺ من النفاق.", "واعلم أن هذا فيمن لم يضطر إلى ذلك، فأما إذا اضطر في مدارة الأمراء جاز، ومتى قدر أن لا يظهر موافقتهم لم يجز له، فلو صدق قولهم الباطل وحرك رأسه في معرض تقرير كلامهم الباطل، أو أثنى عليهم، فهو منافق، إلا أن يكون ذلك لضرورة وإكراه يباح الكذب بمثله.", "قال أبو الدرداء: إنا لنكشر(١) في وجوه أقوام وإن قلوبنا تلعنهم.", "**الآفة الثامنة عشرة: المدح**", "وتدخله ست آفات؛ أربع في المادح، واثنتان في الممدوح.", "**فأما آفات المادح**:"]], "ic": "book"}, {"story": ["كتاب آفات اللسان (٢٨ من ٣٠)، ص٦٩٥", ["**فالأولى**: أنه قد يقول ما لا يتحققه، ولا سبيل له إلى الاطلاع عليه، مثل أن يقول: إنه ورع، إنه زاهد.", "أخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا عفان، قال: حدثنا وهيب ويزيد يعني ابن زريع قالا: حدثنا خالد الحذاء عن عبد الرحمن بن أبي بكرة قال: مدح رجل رجلا عند النبي ﷺ فقال رسول الله ﷺ: «ويلك؟ قطعت عنق صاحبك(٢) - مرارا. إذا كان أحدكم مادحا صاحبه لا محالة، فليقل: أحسب فلانا، والله حسيبه، ولا أزكي على الله أحدا، أحسبه كذا وكذا، إن كان يعلم ذلك». أخرجه في الصحيحين(٣).", "حاشية: (١) لنكشر: أي نظهر لهم الأنس والفرح والضحك والملاطفة.", "حاشية: (٢) في (ظ): (أخيك).", "حاشية: (٣) أخرجه البخاري (٦١٦٢)، ومسلم (٣٠٠٠) (٦٥)، وأحمد (٢٠٤٦٢).", "وقد روينا عن عمر أنه سمع رجلا يثني على رجل فقال: أسافرت معه؟ قال: لا.؟ قال: أخالطته قال: لا. قال: والله الذي لا إله إلا هو ما تعرفه.", "**والثانية**: أنه قد يفرط فينتهي إلى الكذب.", "قال خالد بن معدان: من مدح أحدا بما ليس فيه على رؤوس الأشهاد بعثه الله يوم القيامة يتعثر لسانه.", "**والثالثة**: أنه قد يدخله الرياء، فإنه بالمدح مظهر للحب، وقد لا يكون مضمرا له ولا معتقدا لجميع ما يقوله، فيصير به مرائيا منافقا.", "**والرابعة**: أنه قد يمدح من ينبغي أن يذم.", "وقد روي عن رسول الله ﷺ أنه قال: «إن الله تعالى يغضب إذا مدح الفاسق».", "وقال الحسن: من دعا لظالم بالبقاء، فقد أحب أن يعصى الله.", "**وأما الممدوح**: فيضره من وجهين:", "**أحدهما**: أنه يحدث فيه كبرا وإعجابا، وهما مهلكان، وقد روينا عن الحسن أنه قال: كان عمر قاعدا ومعه الدرة، والناس حوله إذ أقبل الجارود، فقال رجل: هذا سيد ربيعة. فسمعها عمر ومن حوله، وسمعها الجارود، فلما دنا منه خفقه بالدرة، فقال: مالي ولك يا أمير المؤمنين؟ فقال: مالي ولك؟ أما والله لقد سمعتها. قال: سمعتها، فمه(١)؟ قال: خشيت أن يخالط قلبك منها شيء، فأحببت أن أطأطئ منك.", "**الثانية**: أنه إذا أثني عليه بالخير رضي عن نفسه وظن أنه قد بلغ المقصود ففتر عن العمل، وإنما يشمر للعمل من يرى نفسه مقصرا، ولهذا قال ﷺ: «قطعت عنق صاحبك»(٢).", "حاشية: (١) يعني: فأي شيء؟ وهي ما الاستفهامية حذفت ألفها عند الوقف، وجاءت في الأصل: (من فيه) وهو تحريف.", "حاشية: (٢) يعني في الحديث المتقدم قبل قليل.", "وقال عمر: المدح ذبح. وهذا لأن المذبوح يفتر عن الحركة.", "وأثنى رجل على عمر فقال: أتهلكني وتهلك نفسك!.", "واعلم أنه إذا سلم المدح من هذه الآفات لم يكن به بأس، فقد مدح رسول الله ﷺ، وقد أثنى رسول الله ﷺ على أبي بكر وعمر وغيرهما من الصحابة، إلا أنه لما كان ذلك حقا ولم يغير الممدوح حسن.", "**بيان ما على الممدوح**"]], "ic": "book"}, {"story": ["كتاب آفات اللسان (٢٩ من ٣٠)، ص٦٩٧", ["عليه أن يكون شديد الاحتراز من آفة الكبر والعجب والفتور، ولا ينجو من هذه الآفات(١-١) إلا أن يعرف(١-١) نفسه، ويتفكر في أن المادح لو عرف منه ما يعرف من نفسه ما مدحه، ثم يكون خائفا من دقائق الرياء وآفات الأعمال، ثم يتأمل خطر الخاتمة، ثم يكره المدح.", "قال مطرف: ما سمعت مدحتي إلا تصاغرت إلي نفسي.", "وقال ابن عيينة: ليس يضر المدح من عرف نفسه.", "وأثني على رجل من الصالحين، فقال: اللهم إن هؤلاء لا يعرفونني وأنت تعرفني.", "**الآفة التاسعة عشرة: في الغفلة عن دقائق الخطأ في فحوى الكلام**", "لا سيما فيما يتعلق بالله وصفاته، ويرتبط بأمور الدين، فلا يقدر على تقويم اللفظ فيه إلا العلماء الفصحاء، فمن قصر في علم أو فصاحة لم يحل كلامه عن الزلل، لكن الله يعفو عن جهله.", "مثال هذا: ما روى حذيفة عن النبي ﷺ أنه قال: «لا يقل أحدكم: ما شاء الله وشئت، ولكن ليقل: ما شاء الله ثم شئت». وذلك لأن في العطف المطلق تشريك أو تسوية، وذلك على خلاف الاحترام.", "حاشية: (١-١) تحرفت في الأصل إلى: (أن لا يعرف).", "وقد روى ابن عباس رضي الله عنهما قال: جاء رجل إلى النبي ﷺ، فكلمه، فقال: ما شاء الله وشئت. فقال رسول الله ﷺ: «أجعلتني لله عدلا! بل ما شاء الله وحده»(١).", "وخطب رجل عند رسول الله ﷺ فقال: من يطع الله ورسوله فقد رشد، ومن يعصهما فقد غوى. فقال ﷺ: «قل: ومن يعص الله ورسوله». فكره قوله: ومن يعصهما؛ لأنه تسوية وجمع.", "وقال ﷺ: «لا يقل أحدكم: عبدي وأمتي، كلكم عبيد الله، وكل نسائكم إماء الله، ولكن ليقل: غلامي وجاريتي».", "وكره إبراهيم النخعي أن يقول الرجل: أعوذ بالله وبك. ورخص أن يقول: أعوذ بالله ثم بك. وكره أن يقول: لولا الله وفلان. ورخص أن يقول: لولا الله ثم فلان.", "وقال أبو عمران الجوني: أدركت أربعة من أفضل من أدركت كانوا يكرهون أن يقولوا: اللهم أعتقنا من النار، ويقولون: إنما يعتق منها من دخلها، وكانوا يقولون: نعوذ بالله من النار.", "وقال النخعي: إذا قال الرجل للرجل: يا حمار، يا خنزير، قيل له يوم القيامة: أرأيتني خلقته حمارا؟ أرأيتني خلقته خنزيرا؟ فهذا وأمثاله مما يدخل في الكلام ولا يمكن حصره، ومن تأمل ما أوردناه في آفات اللسان علم أنه إذا أطلق لسانه لم يسلم، وعند ذلك يعرف سر قوله عليه الصلاة والسلام: «من صمت نجا»؛ لأن هذه الآفات مهالك، وهي على طريق المتكلم، فإن سكت سلم، وإن تكلم خاطر، إلا أن يرافقه علم وورع ومراقبة، فمن لم يتيقن أنه بكلامه يغنم، فليسكت يسلم، فإن السلامة إحدى الغنيمتين.", "**الآفة العشرون: سؤال العوام عن صفات الله سبحانه وكلامه**", "واعلم أن الشيطان يخيل إلى العامي(٢): إنك بخوضك في العلم تكون من العلماء وأهل الفضل، فلا يزال يحبب إليه ذلك حتى يتكلم بما هو كفر، فلا", "حاشية: (١) ليست في الأصل.", "حاشية: (٢) في الأصل: (العوام)."]], "ic": "book"}, {"story": ["كتاب آفات اللسان (٣٠ من ٣٠)، ص٦٩٩", ["يدري، والأولى بالعامي الإيمان بما ورد به القرآن، والتسليم لما جاء به الرسول ﷺ، من غير بحث، والإقبال على العبادات، فاشتغاله بالبحث عن أسرار العلم كبحث ساسة الدواب عن أسرار الملك.", "وقد قال عليه الصلاة والسلام: «ذروني ما تركتكم، فإنما هلك من كان قبلكم بسؤالهم واختلافهم على أنبيائهم، إذا نهيتكم عن شيء، فاجتنبوه، وإذا أمرتكم بأمر، فأتوا منه ما استطعتم».", "وقال عليه الصلاة والسلام: «يوشك الناس أن يتساءلوا حتى يقولوا: هذا الله خلق الخلق، فمن خلق الله؟».", "فسؤال العوام(١) عن غوامض العلم من أعظم الآفات، وبحثهم(٢) عن معاني الصفات مما يفسدهم لا مما يصلحهم، إذ الواجب عليهم التسليم.", "**آخر كتاب آفات اللسان**", "حاشية: (١) تحرفت في الأصل إلى: (العامي).", "حاشية: (٢) في (ظ): (وسؤالهم)."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "فإنه دليل على انبساط وطيب قلب، فلا ينهى عما كان يسيرا وكان صدقا، فقد كان عليه الصلاة والسلام يمزح، وكان من مزاحه ﷺ أنه قال ____", "o": ["لرجل", "طاهرة", "لينظر", "وسلم"], "h": "راجع: ص٦٦٠"}, {"t": "fill", "d": 2, "q": "اعلم أن خطر اللسان عظيم لكثرة آفات الكلام، ولهذه الآفات في القلب حلاوة، ولها من الطبع بواعث، ولا نجاة من هذا الخطر إلا ____، فلذلك مدح الشرع الصمت، ففي الصمت نجاة من الآفات مع أنه يجمع الهم ويفرغ الفكر", "o": ["بالصمت", "جاهلا", "وردت", "ينهى"], "h": "راجع: ص٦٤٧"}, {"t": "fill", "d": 2, "q": "وربما ذكر عيب إنسان فلم ____ له بعض الحاضرين، فيقول المتزهد", "o": ["يتنبه", "حببه", "وأثبت", "الحديد"], "h": "راجع: ص٦٨١"}, {"t": "fill", "d": 2, "q": "فسؤال العوام عن غوامض العلم من أعظم الآفات، وبحثهم عن معاني الصفات مما يفسدهم لا مما يصلحهم، إذ الواجب عليهم ____", "o": ["التسليم", "واندرس", "للأكل", "لأهله"], "h": "راجع: ص٦٩٩"}, {"t": "fill", "d": 2, "q": "وأخرجا من حديث أبي ____ عن النبي ﷺ أنه قال", "o": ["هريرة  إن كان وينفيه، ويعالجه إن رسخ في قلبه ويداويه؛ لأن من لا يعرف الشر يقع فيه، ومن عرفه فالمعرفة لا تكفيه مالم يعرف الطريق الذي به يدفع الشر ويقصيه(١).", "ونحن نذكر ذم الغضب وآفات الحقد والحسد في هذا الكتاب ويجمعها: بيان ذم الغضب، ثم بيان حقيقة الغضب، ثم بيان هل يمكن إزالة أصل الغضب بالرياضة أم لا، ثم بيان الأسباب المهيجة للغضب، ثم بيان علاج الغضب بعد هيجانه، ثم بيان فضيلة كظم الغيظ، ثم بيان فضيلة الحلم، ثم بيان القدر الذي يجوز به الانتصار والتشفي من الكلام، ثم القول في معنى الحقد ونتائجه، وفضيلة العفو والرفق، ثم القول في ذم الحسد، وفي حقيقته وأسبابه ومعالجته، والواجب في إزالته، ثم بيان السبب في كثرة الحسد بين الأمثال والأقران والإخوة والأقارب وتآكده، وقلته في غيرهم وضعفه، ثم بيان الدواء الذي به ينفى(٢) مرض الحسد عن القلب، ثم بيان القدر الواجب في نفي الحسد عن القلب.", "حاشية: (١) تصحفت في الأصل إلى: (يقتضيه).", "حاشية: (٢) في الأصل: (يشفى).", "**بيان**", "**ذم الغضب**"]], "ic": "book"}, {"story": ["كتاب ذم الغضب والحقد والحسد (٢ من ٣٢)، ص٧٠٣", ["أخبرنا عبد الأول قال: أخبرنا الداودي قال: أخبرنا ابن أعين، قال: حدثنا الفربري قال: حدثنا البخاري قال: حدثنا يحيى بن يوسف قال: حدثنا أبو بكر بن عياش عن أبي حصين عن أبي صالح عن أبي هريرة قال: أتى النبي ﷺ رجل، فقال: أوصني. قال: «لا تغضب» فردد ذلك مرارا، قال: «لا تغضب».", "قال البخاري: وحدثنا عبد الله بن يوسف قال: أخبرنا مالك عن ابن شهاب عن ابن المسيب عن أبي هريرة قال: قال رسول الله ﷺ: «ليس الشديد بالصرعة(١)، إنما الشديد الذي يملك نفسه عند الغضب». أخرجاه وانفرد البخاري بالأول.", "أخبرنا إسماعيل بن أحمد قال: أخبرنا محمد بن هبة الطبري وعبد الله بن يحيى الموصلي قالا: أخبرنا أبو الحسين بن بشران، قال: حدثنا ابن صفوان قال: حدثنا أبو بكر القرشي، قال: حدثنا أبو خيثمة قال: حدثنا الحسن بن موسى عن ابن لهيعة عن دراج عن عبد الرحمن بن جبير بن عبد الله بن عمرو أنه سأل رسول الله ﷺ: ماذا يبعدني من غضب الله تعالى؟ قال: «لا تغضب».", "قال القرشي: وحدثنا أبو يوسف الفلوسي قال: أخبرنا محمد بن عزعرة، قال: حدثنا سكين - وهو ابن أبي سراج - قال: حدثني عبد الله بن دينار عن عبدالله بن عمر عن النبي ﷺ قال: «من كف غضبه ستر الله عورته».", "وقد رواه أنس فقال: فيه: «من كف غضبه كف الله عنه عذابه».", "وقال سليمان بن داود لابنه: يا بني، إياك وكثرة الغضب، فإن كثرة الغضب تستخف فؤاد الرجل الحليم.", "حاشية: (١) الصرعة: الذي يغلب الناس في الصراع.", "وقال ابن مسعود: انظروا إلى حلم الرجل عند غضبه، وإلى أمانته عند طمعه.", "وقال عكرمة في قوله تعالى: ﴿وَسَيِّدًا وَحَصُورًا﴾ [آل عمران: ٣٩]. قال: السيد الذي لا يغلبه غضبه.", "وقال الحسن: ابن آدم، كلما غضبت ووثبت(١-١)يوشك أن تثب(١-١) وثبة تقع في النار.", "وقد روينا أن ذا القرنين لقي ملكا من الملائكة فقال: علمني علما أزداد به إيمانا ويقينا. قال: لا تغضب، فإن الشيطان أقدر ما يكون على ابن آدم حين يغضب، فرد الغضب بالكظم، وسكنه بالتؤدة، وإياك والعجلة، فإنك إذا عجلت أخطأت حظك، وكن سهلا ولينا للقريب والبعيد، ولا تكن جبارا عنيدا.", "وقد روينا أن إبليس تبدى(٢) لموسى عليه السلام، فقال له: يا موسى، إياك والحدة فإني ألعب بالرجل الحديد كما يلعب الصبيان بالكرة، وإياك والنساء، فإني لم أنصب فخا قط أثبت في نفسي من فخ أنصبه بامرأة، وإياك والشح، فإني أفسد على الشحيح الدنيا والآخرة.", "وقال خيثمة: كانوا يقولون: إن الشيطان يقول: وكيف يغلبني ابن آدم وإذا رضي جئت حتى أكون في قلبه وإذا غضب طرت حتى أكون في رأسه؟!.", "وقال جعفر بن محمد: الغضب مفتاح كل شر.", "وقال بعض الأنصار: رأس الحمق الحدة، وقائده الغضب.", "وقال وهب بن منبه: الكفر أربعة أركان؛ فركن منه الغضب، وركن منه الشهوة، وركن منه الخوف، وركن منه الطمع."]], "ic": "book"}, {"story": ["كتاب ذم الغضب والحقد والحسد (٣ من ٣٢)، ص٧٠٤", ["وقيل لابن المبارك: اجمع لنا حسن الخلق في كلمة. فقال: ترك الغضب.", "حاشية: (١-١) في الأصل: (يوشك بعد أن وثبت).", "حاشية: (٢) تبدى: ظهر.", "وقيل لبعض الحكماء: ما أملك فلانا لنفسه! قال: إذا لا تذله الشهوة، ولا يصرعه الغضب، ولا يغلبه الهوى.", "وكان يقال: إياك وعزة الغضب، فإنها تؤول بك إلى ذل الاعتذار.", "وكان يقال: اتقوا الغضب، فإنه يفسد الإيمان كما يفسد الصبر(١) العسل، والغضب عدو العقل.", "**بيان حقيقة الغضب**", "اعلم أن الله تعالى لما خلق الحيوان معرضا للفساد والتوى(٢) بأسباب في داخل بدنه، وأسباب خارجة عنه، أنعم عليه بما يحميه من الفساد ويدفع عنه الهلاك إلى أجل معلوم.", "**أما السبب الداخل؛** فهو أنه ركبه من الرطوبة والحرارة وجعل بين الحرارة والرطوبة عداوة ومضادة فلا تزال الحرارة تحلل الرطوبة وتجففها حتى يتغشى أجزاؤها بخارا يتصاعد منها، فلو لم يتصل بالرطوبة مدد من الغذاء يجبر ما انحل لفسد الحيوان، فخلق الله الغذاء الموافق لبدن الحيوان، وخلق في الحيوان شهوة تبعثه على تناول الغذاء كالموكل به في جبر ما انكسر وسد ما انثلم ليكون ذلك حافظا له من الهلاك لهذا السبب.", "**وأما الأسباب الخارجة** التي يتعرض لها الإنسان فكالسيف والسنان وسائر المهلكات التي يقصد بها، فافتقر إلى قوة وحمية تثور من باطنه فتدفع المهلكات عنه، فخلق الله سبحانه الغضب من النار، وغرزه في الإنسان وعجنه بطينته(٣-٣)فمتى قصد في غرض من أغراضه(٣-٣) اشتعلت نار الغضب وثارت ثورانا يغلي به دم القلب وينتشر في العروق ويرتفع إلى أعالي البدن كما ترتفع النار، وكما يرتفع الماء الذي", "حاشية: (١) الصبر: عصارة شجر مر، واحدته: صبرة.", "حاشية: (٢) التوى: الهلاك.", "حاشية: (٣-٣) وردت العبارة في الإحياء: (فمهما صد عن غرض من أغراضه).", "يغلي في القدر ولذلك يحمر الوجه والعين والبشرة، وكل ذلك يحكي لونا ما وراءه من حمرة الدم كما تحكي الزجاجة لون مافيها.", "وإنما ينبسط الدم إذا غضب على من دونه واستشعر القدرة عليه، فإن صدر الغضب ممن فوقه وكان معه يأس من الانتقام تولد منه انقباض الدم من ظاهر الجلد إلى جوف القلب، فصار حزنا، ولذلك يصفر اللون، وإن كان على نظير يشك فيه تردد الدم بين انقباض وانبساط فيحمر ويصفر ويضطرب.", "وفي الجملة فقوة الغضب محلها القلب، ومعناها غليان دم القلب لطلب الانتقام، وإنما تتوجه هذه القوة عند ثورانها إلى دفع المؤذيات قبل وقوعها وإلى التشفي والانتقام بعد وقوعها، والانتقام قوت هذه القوة وشهوتها، وفيه لذتها، فلا تسكن إلا به، ثم الناس في هذه القوة على درجات ثلاث في أول الفطرة من التفريط والإفراط والاعتدال."]], "ic": "book"}, {"story": ["كتاب ذم الغضب والحقد والحسد (٤ من ٣٢)، ص٧٠٦", ["أما التفريط؛ فبفقد هذه القوة أو ضعفها، وذلك مذموم، وهو صفة من لا حمية له، قال الشافعي: من استغضب فلم يغضب فهو حمار. فمن فقد قوة الحمية والغضب أصلا فهو ناقص جدا؛ لأنه دليل على صغر النفس، ومن ثمراته عدم الغيرة على الحرم، وقال النبي ﷺ: «إن سعدا لغيور، وأنا أغير من سعد، والله أغير مني».", "وإنما خلقت الغيرة لحفظ الأنساب(١)، ومن ضعف غضبه سكت عند رؤية المنكرات، وقد قال تعالى: ﴿وَلَا تَأْخُذْكُم بِهِمَا رَأْفَةٌ فِى دِينِ ٱللَّهِ﴾ [النور: ٢]، وقال لنبيه: ﴿جَٰهِدِ ٱلْكُفَّارَ وَٱلْمُنَٰفِقِينَ وَٱغْلُظْ عَلَيْهِمْ﴾ [التوبة: ٧٣]، وإنما الغلظة من آثار قوة الحمية وهو الغضب، ووصف الله تعالى الصحابة به فقال: ﴿أَشِدَّآءُ عَلَى ٱلْكُفَّارِ﴾ [الفتح: ٢٩].", "ومن فقد الغضب عجز عن رياضة نفسه، إذ الرياضة إنما تتم بتسليط الغضب على الشهوة، فيغضب على نفسه عند الميل إلى الشهوات الخسيسة، ففقد الغضب مذموم.", "حاشية: (١) تصحفت في الأصل إلى: (الإنسان).", "وأما الإفراط؛ فهو أن تغلب هذه الصفة حتى تخرج عن سياسة العقل والدين وطاعته، فلا يبقى للإنسان مع الغضب نظر ولا فكر ولا اختيار، بل يصير في صورة المضطر.", "وسبب هذه الغلبة(١) أمور غريزية وأمور اعتيادية، فرب إنسان هو بالفطرة مستعد لسرعة الغضب حتى كأن صورته في الفطرة صورة غضبان، ويعين على ذلك حرارة مزاج القلب؛ لأن الغضب من النار.", "أخبرنا إسماعيل بن أحمد قال: أخبرنا محمد بن هبة الطبري قال: أخبرنا ابن بشران قال: حدثنا ابن صفوان قال: حدثنا أبو بكر القرشي قال: حدثنا خالد ابن خداش قال: حدثنا حماد بن زيد عن علي بن زيد عن أبي نضرة عن أبي سعيد عن النبي ﷺ قال: «ألا إن الغضب جمرة في قلب ابن آدم، ألا ترون إلى حمرة عينيه وانتفاخ أوداجه، (٢-٢)فمن وجد من ذلك شيئا(٢-٢)، فليلصق خده بالأرض».", "وأما الأسباب الاعتيادية؛ فأن يخالط قوما يتبجحون بتشفي الغيظ وطاعة الغضب ويسمون ذلك شجاعة ورجولية، فيقول الواحد منهم: أنا الذي لا أحتمل من أحد شيئا، ومعنى هذا القول: لا عقل لي ولا حلم. فيذكر ذلك في معرض الفخر بجهله، فيرسخ في نفس الجاهل الذي يسمعه حسن الغضب وحب التشبه بالقوم، فيقوى بذلك الغضب.", "ومتى قويت نار الغضب والتهبت أعمت صاحبها وأصمته عن كل موعظة، وربما زاده الوعظ غضبا؛ لأن معدن الفكر الدماغ، وقد تصاعد عند شدة الغضب من غليان دم القلب دخان إلى الدماغ مظلم فاستولى على معادن الفكر، وربما تعدى إلى معادن الحس فتظلم عينه حتى لا يرى بعينه، وتسود الدنيا في وجهه ويكون دماغه على مثال كهف أضرمت فيه نار فاسود جوه، وحمي مستقره، وامتلأ بالدخان جوانبه، وكان فيه سراج ضعيف فانطفأ، فلا تثبت فيه قدم ولا تسمع فيه", "حاشية: (١) سقطت من الأصل.", "حاشية: (٢-٢) تكررت في الأصل."]], "ic": "book"}, {"story": ["كتاب ذم الغضب والحقد والحسد (٥ من ٣٢)، ص٧٠٨", ["كلمة، ولا ترى فيه صورة، ولا يقدر على إطفاء النار المتضرمة فيه لا من داخل ولا من خارج بل ينبغي أن يصبر إلى أن يحترق جميع ما يقبل الاحتراق، فكذلك يفعل الغضب بالقلب والدماغ.", "وربما تقوى نار الغضب فتفني الرطوبة التي بها حياة القلب، فيموت صاحبه غيظا، كما تقوى النار في الكهف فيتشقق وتنهد أعاليه على أسافله، وذلك لإبطال النار ما في جوانبه من القوة الممسكة الجامعة لأجزائه، فهكذا حال القلب مع الغضب.", "وعلى الحقيقة فإن السفينة في ملتطم الأمواج عند اضطراب الرياح في لجة البحر أحسن حالا وأرجى سلامة من النفس المضطربة غيظا، إذ في السفينة من يحتال لتسكينها وتدبيرها وينظر لها ويسويها، وها هنا صاحب السفينة القلب، وقد سقطت حيلته، إذ أعماه الغضب وأصمه.", "ومن آثار هذا الغضب في الظاهر تغير اللون، وشدة الرعدة في الأطراف، وخروج الأفعال عن الترتيب والانتظام واضطراب الحركة والكلام حتى تحمر الأحداق، ويظهر الزبد على الأشداق، وتنقلب المناخر وتستحيل الخلقة، ولو رأى الغضبان في حال غضبه قبح صورته واستحالة خلقته لأنف لنفسه من تلك الحال، ومعلوم أن قبح الباطن أعظم من قبح الظاهر؛ لأنه إنما قبح الباطن أولا ثم انتشر القبح إلى الظاهر، فكان الظاهر كالعنوان لما في الباطن، فهذا أثره في الجسد.", "فأما أثره في اللسان؛ فانطلاقه بالشتم والفحش وقبائح الكلام الذي يستحيي منه ذوو العقول، ثم يستحيي منه قائله عند سكون الغضب، وذلك مع اضطراب اللفظ وتخبط النظم.", "وأما أثره على الأعضاء فبالتهجم بالضرب والجرح والقتل، فإن هرب المغضوب عليه أو عجز الغضبان عن التشفي منه، يرجع الغضب على الغضبان فيمزق ثوب نفسه ويلطم نفسه ويضرب بيديه على الأرض، وقد يعدو وراء المغضوب عليه عدو الوالة المدهوش، وربما سقط صريعا لا يطيق العدو ولا", "النهوض لشدة الغضب، ويعتريه مثل الغشي، وربما ضرب الجمادات والحيوانات، وقد يكون على المائدة فيغضب فيكسر المائدة ويتعاطى أفعال المجانين، وقد يغضب على البهيمة فيشتمها ويقول: إلى متى يا كيت وكيت كأنه يخاطب عاقلا، وربما رفسته البهيمة فرفسها مقابلة لها.", "وأما أثره في القلب مع المغضوب عليه، فالحقد والحسد وإضمار السوء والشماتة بالمساءات، والحزن بالسرور، والعزم على إفشاء السر وهتك الستر، والاستهزاء وغير ذلك من المقابح، فهذه ثمرة الغضب المفرط."]], "ic": "book"}, {"story": ["كتاب ذم الغضب والحقد والحسد (٦ من ٣٢)، ص٧٠٩", ["وقد بينا عيب عدم الغضب، فالمحمود غضب ينتظر(١) إشارة العقل والدين، فينبعث حيث تجب الحمية، وينطفئ حيث يحسن الحلم، وحفظه على حد(٢) الاعتدال هو الاستقامة، وخير الأمور أوساطها، فمن كان غضبه إلى الفتور فأحس من نفسه باحتمال الذل والضيم في غير محله وضعف الغيرة، فينبغي أن يعالج نفسه (٣-٣)حتى يقوى غضبه، ومن مال غضبه إلى الإفراط حتى جره إلى التهور واقتحام الفواحش، فينبغي أن يعالج نفسه(٣-٣) ليغض من سورة الغضب ويقف على الوسط بين الطرفين، فهو الصراط المستقيم، فإن عجز عنه، فليطلب القرب منه، فقد قال تعالى: ﴿وَلَن تَسْتَطِيعُوٓا۟ أَن تَعْدِلُوا۟ بَيْنَ ٱلنِّسَآءِ وَلَوْ حَرَصْتُمْ فَلَا تَمِيلُوا۟ كُلَّ ٱلْمَيْلِ فَتَذَرُوهَا كَٱلْمُعَلَّقَةِ﴾ [النساء: ١٢٩].", "**بيان هل يمكن إزالة أصل الغضب بالرياضة أم لا ؟**", "قد ظن قوم أنه يتصور بالرياضة محو الغضب بالكلية ، وظن آخرون أنه لا يقبل العلاج، وكلا الظنين فاسد، والتحقيق أن يقال: مادام الإنسان يحب شيئا (٤-٤)ويكره شيئا(٤-٤) فلا يخلو من الغيظ والغضب، ومادام يوافقه شيء ويخالفه شيء آخر، فلا بد", "حاشية: (١) في (ظ): (بتنظم).", "حاشية: (٢) في (ظ): (هذا).", "حاشية: (٣-٣) سقط من الأصل.", "حاشية: (٤-٤) سقط من الأصل.", "أن يحب ما يوافقه ويكره ما يخالفه، والغضب يتبع ذلك، فإنه مهما أخذ منه محبوبه غضب لا محالة، وإذا قصد بمكروه غضب لا محالة، إلا أن ما يحبه الإنسان ينقسم إلى ثلاثة أقسام:", "**الأول**: ما هو ضرورة في حق الناس كافة، و هو القوت والمسكن والملبس وصحة البدن، فمن قصد بدنه بالضرب والجرح، فلا بد أن يغضب، وكذلك إذا أخذ منه ثوبه الذي يستر عورته، وكذلك إذا أخرج من داره التي يسكنها، أو أريق ماؤه الذي هو لعطشه، فهذه ضرورة لا يخلو الإنسان من كراهة زوالها من غيظ على من يتعرض لها.", "**القسم الثاني**: ما ليس ضروريا لأحد من الخلق، كالجاه والمال الكثير و الغلمان والدواب، فإن هذه الأمور صارت محبوبة بالعادة والجهل بمقاصد الأمور حتى صار الذهب والفضة محبوبين في أنفسهما فيكنزان، ويغضب الإنسان على من يسرقهما، وإن كان مستغنيا عنهما في القوت، فهذا الجنس مما يتصور أن ينفك الإنسان عن أصل الغيظ فيه، فإذا كانت له دار زائدة على مسكنه فهدمها ظالم فيجوز أن لا يغضب، إذ يجوز أن يكون بصيرا بأمور الدنيا فيزهد في الزيادة على الحاجة، فلا يغضب بأخذها، (١-١)فإنه لا يحب وجودها، ولو أحب وجودها لغضب على الضرورة بأخذها(١-١)."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "قال القرشي: وحدثني سعيد بن محمد الجرمي، قال: حدثنا أبو عبيدة الحداد قال: حدثنا سعيد بن أبي عروبة عن قتادة عن أنس قال: قال رسول الله ﷺ: «إن الله رفيق يحب الرفق، ويعطي ____ ما لا يعطي على", "o": ["عليه", "ثلمة", "فينتفي", "الشرع"], "h": "راجع: ص٧٣١"}, {"t": "fill", "d": 2, "q": "وأما الأسباب الاعتيادية؛ فأن يخالط قوما يتبجحون بتشفي الغيظ وطاعة الغضب ويسمون ذلك ____ ورجولية، فيقول الواحد منهم", "o": ["شجاعة", "يعصهما", "خليفة", "العليا"], "h": "راجع: ص٧٠٧"}, {"t": "fill", "d": 2, "q": "وأما الهزل؛ فتزيله بالجد في طلب الفضائل والأخلاق الحسنة والعلوم الدينية التي تبلغك إلى سعادة ____", "o": ["الآخرة", "ويؤمن", "استرخاؤه", "أعزها"], "h": "راجع: ص٧١٥"}, {"t": "fill", "d": 2, "q": "يغلي في القدر ولذلك يحمر الوجه والعين والبشرة، وكل ذلك يحكي لونا ما وراءه من حمرة الدم كما تحكي ____ لون مافيها", "o": ["الزجاجة", "اللذان", "فاستحله", "نجراني"], "h": "راجع: ص٧٠٦"}, {"t": "fill", "d": 2, "q": "وغرضهم المنزلة عند الله ولا ضيق فيها أيضا فيما عند الله؛ لأن أجل ما عند الله من التنعيم لذة بقائه وليس فيها ممانعة ولا مزاحمة، ولا يضيق بعض الناظرين على بعض، بل يزيد الأنس بكثرتهم، إلا أنه إذا قصد العلماء بالعلم المال والجاه تحاسدوا، لأن المال هو أعيان وأجسام إذا وقعت في يد واحد خلت عنها يد الآخر، ومعنى الجاه ملك القلوب، ومتى امتلأ قلب شخص بتعظيم عالم انصرف عن تعظيم الآخر أو نقص منه لا محالة، فيكون ذلك سببا للمحاسدة، وإذا امتلأ قلب شخص بالفرح بمعرفة الله تعالى لم يمنع ذلك أن يمتلئ قلب غيره به وأن يفرح به، فالفرق بين العلم والمال أن المال لا يحل في يد ما لم يرتحل عن يد أخرى، والعلم في قلب العالم مستقر ويحل في قلب غيره بتعليمه من غير أن يرتحل عن قلبه، فالمال أجسام وأعيان ولها نهاية، فلو ملك الإنسان جميع ما في الأرض لم يبق بعده مال ليملكه غيره، والعلم لا نهاية له، ولا يتصور استيعابه، فمن عود نفسه الفكر في جلال الله وعظمته وملكوته صار ذلك ألذ عنده من كل نعيم، ولم يكن ممنوعا عنه ولا مزاحما فيه، فلا يكون في قلبه حسد لواحد من الخلق؛ لأن غيره لو عرف مثل معرفته لما نقص من لذته بل زادت لذته بمؤانسته، فتكون لذة هذا في مطالعة عجائب الملكوت على الدوام أعظم من لذة من ينظر إلى أشجار الجنة وبساتينها بالعين الظاهرة، فإن نعيم العارف وجنته معرفته التي هي صفة ذاته يأمن زوالها ويجني أبدا ثمارها، فهو بروحه وقلبه معتنق بفاكهة علمه، وهي فاكهة قطوفها ____، غير مقطوعة ولا ممنوعة، فإن وجد كثير من العارفين لم يكونوا متحاسدين، بل إخوانا على سرر متقابلين، فهذه حالهم وهم في الدنيا، فما يظن بهم عند انكشاف الغطاء ومشاهدة المحبوب في العقبى", "o": ["دانية", "مذرة", "الكواكب", "معاطبه"], "h": "راجع: ص٧٤٥"}, {"t": "fill", "d": 2, "q": "والحالة الثانية: أن لا تحب زوالها ولا تكره وجودها ودوامها لكنك تشتهي لنفسك مثلها، وهذا ____", "o": ["يسمى", "ناسيا", "أنواع", "والمكر"], "h": "راجع: ص٧٣٧"}]}, {"t": "كتاب ذم الغضب والحقد والحسد - القسم ٢ من ٦", "b": [{"story": ["كتاب ذم الغضب والحقد والحسد (٧ من ٣٢)، ص٧١٠", ["وأكثر غضب الإنسان على ما هو غير ضروري، كالجاه والصيت والتصدر في المجالس و المباهاة بالعلم، فمن غلب هذا الحب عليه فإنه يغضب لا محالة إذا زاحمه مزاحم على الصدر في المحافل، ومن لا يحب ذلك ولا يبالي لو جلس في صف النعال فإنه لا يغضب إذا جلس غيره فوقه، وهذه العادات الرديئة هي التي أكثرت محاب الإنسان ومكارهه، فأكثرت غضبه.", "وكلما كانت الإرادات والشهوات أكثر كان صاحبها أحط رتبة وأنقص؛ لأن الحاجة صفة نقص، فمهما كثرت كثر النقص، والجاهل أبدا جهده في أن يزيد في", "حاشية: (١-١) سقط من الأصل.", "حاجاته وشهواته، وهو لا يدري أنه مستكثر من أسباب الغم والحزن، حتى ينتهي بعض الجهال بالعادات الردية ومخالطة قرناء السوء إلى أن يغضب لو قيل له: إنك لا تحسن اللعب بالطيور واللعب بالشطرنج، ولا تقدر على شرب الخمر الكثير وتناول الطعام الكثير، وما يجري مجراه من الرذائل.", "والغضب على هذا الجنس ليس بضروري؛ لأن حبه ليس بضروري.", "**القسم الثالث**: ما يكون ضروريا في حق بعض الناس دون بعض كالكتاب - مثلا - للعالم، فإنه مضطر إليه فيحبه، فيغضب على من يحرقه ويغرقه، وكذلك أدوات الصناعات في حق المكتسب الذي لا يمكنه التوصل إلى القوت إلا بها، فإن ما هو وسيلة إلى الضروري والمحبوب يصير ضروريا ومحبوبا، وهذا يختلف بالأشخاص. وإنما الحب الضروري ما أشار إليه رسول الله ﷺ بقوله: «من أصبح آمنا في سربه، معافى في بدنه، عنده قوت يومه، فكأنما حيزت له الدنيا بحذافيرها».", "فمن كان بصيرا بحقائق الأمور، وسلم له هذه الثلاث تصور أن لا يغضب في غيرها.", "هذه ثلاثة أقسام، فلنذكر غاية الرياضة في كل واحد منها:", "**أما القسم الأول**: فليست الرياضة فيه لينعدم غيظ القلب، ولكن لكي يقدر على أن لا يطيع الغضب ولا يستعمله في الظاهر إلا على حد يستحبه الشرع ويستحسنه العقل، وذلك ممكن بالمجاهدة وتكلف الحلم والاحتمال مدة حتى يصير الحلم والاحتمال خلقا راسخا.", "فأما قمع أصل الغيظ من القلب، فذلك مقتضى الطبع، وهو غير ممكن، إلا أنه يمكن كسر فورته ووهنه حتى لا يشتد هيجان الغيظ في الباطن وينتهي وهنه إلى أن لا يظهر أثره في الوجه، ولكن ذلك شديد جدا، وهذا حكم القسم الثالث أيضا؛ لأن ما صار ضروريا في حق شخص، فلا يمنعه من الغيظ(١) استغناء غيره عنه، والرياضة فيه تمنع العمل به وتضعف هيجانه في الباطن حتى لا يشتد التألم بالصبر عليه.", "حاشية: (١) بعدها في الأصل: (فيه)."]], "ic": "book"}, {"story": ["كتاب ذم الغضب والحقد والحسد (٨ من ٣٢)، ص٧١٢", ["وأما القسم الثاني: فيمكن التوصل بالرياضة إلى الانفكاك عن الغضب عليه إذ يمكن إخراج حبه من القلب، وذلك بأن يعلم الإنسان أن وطنه القبر ومستقره الآخرة، وإنما الدنيا معبر، وإنما يؤخذ منها قدر الضرورة، وما وراء ذلك وبال على صاحبه، فيزهد في الدنيا، وينمحي حبها من قلبه، ولو كان للإنسان كلب لا يحبه لم يغضب إذا ضرب، فالغضب تبع(١) للحب، والرياضة في هذا قد تنتهي إلى قمع أصل الغضب، وهو نادر جدا، وقد تنتهي إلى المنع من استعمال الغضب والعمل بموجبه، وهو أهون.", "فإن قيل: فالضروري من القسم الأول هو التألم بفوات المحتاج إليه دون الغضب، فإن من ماتت له شاة وهي قوته لم يغضب على أحد، وإن حصلت له كراهة لذلك، وليس من ضرورة كل كراهة غضب، فإن الإنسان يتألم بالفصد والحجامة، ولا يغضب على الفصاد والحجام، فمن غلب عليه التوحيد حتى يرى الأشياء كلها من الله تعالى لم يغضب على أحد من خلقه، إذ يراهم مسخرين في قبضة قدرته، كالقلم في يد الكاتب، ومن وقع ملك بضرب عنقه لم يغضب على القلم، فلا يغضب على من ذبح شاته التي هي قوته، كما لا يغضب إذا مات؛ لأنه يرى الذبح والموت من الله تعالى، فيندفع الغضب بغلبة التوحيد، ويندفع أيضا لحسن ظنه بالله، وهو أن يرى أن الكل منه، وأنه لا يقدر له إلا ما فيه الخيرة، وربما تكون الخيرة في جوعه، ومرضه وجرحه وقتله، فلا يغضب كما لا يغضب على الفصاد؛ لأنه يرى أن الخيرة في الفصد.", "فالجواب: أن هذا على هذا الوجه غير محال، ولكن غلبة التوحيد إلى هذا الحد إنما تكون كالبرق الخاطف يغلب في أوقات مختطفة ولا يدوم، ثم يرجع القلب إلى الالتفات إلى الوسائط رجوعا طبعيا لا يندفع عنه، ولو تصور ذلك على الدوام لبشر لتصور لرسول الله ﷺ، فإنه كان يغضب حتى تحمر وجنتاه، حتى قال في رواية جابر: «إنما أنا بشر، وإني أشترط على ربي عز وجل أي عبد من المسلمين شتمته أو سببته أن يكون ذلك له زكاة وأجرا» انفرد بإخراجه مسلم.", "حاشية: (١) تحرفت في الأصل إلى: (مع).", "وفي الصحيحين من حديث أبي هريرة عنه عليه الصلاة والسلام أنه قال: «اللهم وأيما عبد مؤمن سببته، فاجعل ذلك له إليك قربة يوم القيامة».", "وفي أفراد مسلم من حديث عائشة أن رسول الله ﷺ خرج من عندها ليلا، قالت: فغرت عليه فجاء فرأى ما أصنع، فقال: «مالك يا عائشة؟ أغرت؟» فقلت: ومالي لا يغار مثلي على مثلك؟ فقال: «أقد جاءك شيطانك؟» قلت: يا رسول الله، أو معي شيطان؟ قال: «نعم»، قلت: ومع كل إنسان؟ قال: «نعم». قلت: ومعك يا رسول الله؟ قال: «نعم، ولكن ربي عز وجل أعانني عليه حتى أسلم»(١)."]], "ic": "book"}, {"story": ["كتاب ذم الغضب والحقد والحسد (٩ من ٣٢)، ص٧١٣", ["وفي أفراده من حديث ابن مسعود عن النبي ﷺ أنه قال: «ما منكم من أحد إلا وقد وكل الله به قرينه من الجن». قالوا: وإياك يا رسول الله؟ قال: «وإياي، ولكن الله عزوجل أعانني عليه فأسلم، فلا يأمرني إلا بخير»(٢). وأراد ﷺ أنه لا يحملني على الشر، فقد بان بما ذكرنا أن رسول الله ﷺ كان يلتفت إلى الوسائط في الجملة.", "وقد يفقد أصل الغيظ فيما هو ضروري إذا كان القلب مشغولا بضروري أهم منه، فلا يكون في القلب متسع للغضب لاشتغاله بغيره، فإن استغراق القلب ببعض المهمات يمنع الإحساس بما عداه، وهذا كما روي أن سلمان الفارسي شتم، فقال: إن خفت موازيني فأنا شر مما تقول، وإن ثقلت موازيني لم يضرني ما تقول. فهذا قد كان قلبه مصروفا إلى الآخرة(٣) فلم يتأثر قلبه بالشتم.", "وشتم الربيع بن خثيم فقال للشاتم: يا هذا، قد سمع الله كلامك، وإن دون الجنة عقبة إن قطعتها لم يضرني ما تقول، وإن لم أقطعها فأنا شر مما تقول.", "وسب رجل الشعبي فقال: إن كنت صادقا فغفر الله لي، وإن كنت كاذبا فغفر الله لك.", "وقالت امرأة لمالك بن دينار: يا مرائي. فقال: ما عرفني غيرك.", "حاشية: (١) صحيح مسلم (٢٨١٥).", "حاشية: (٢) صحيح مسلم (٢٨١٤).", "حاشية: (٣) في الأصل: (مشغولا بالآخرة).", "فهذا كان مشغولا(١-١) بنفي آفة الرياء عن نفسه منكرا عليه ما يلقيه الشيطان من ذلك فلم يغضب لما نسب إليه. وسب رجل رجلا فقال له: ما ستر الله عنك أكثر. فهذا كان مشغولا(١-١) بالنظر في تقصيره عن تقوى الله عز وجل حق تقاته، فلم يغضبه أن ينسب إليه نقص.", "فهذه الأخبار عن هؤلاء تحتمل أن يكونوا لم يغضبوا لاشتغال قلوبهم بمهمات دينهم واحتقار نفوسهم التي يكون الغضب لها، ويحتمل أن يكون ذلك أثر في قلوبهم لكن شغلهم عن النظر فيه ما هو أهم منه، ويحتمل أن يكونوا علموا شرف العفو والحلم، فاستعملوا ذلك لتحصيل ثوابه، وأعظم طريق للخلاص من نار الغضب محو حب الدنيا من القلب، وذلك بمعرفة آفاتها وغوائلها على ما سيأتي في كتاب ذم الدنيا.", "ومن أخرج حب المزايا من قلبه تخلص من أكثر أسباب الغضب، وما لا يمكن محوه يمكن كسره ووهنه، فيضعف الغضب بالوهن، ويهون حينئذ الدفع.", "**بيان الأسباب المهيجة للغضب**", "قد عرفت أن علاج كل علة بحسم مادتها وإزالة أسبابها، فلا بد من معرفة أسباب الغضب.", "والأسباب المهيجة للغضب: الزهو والعجب والمزح والهزء والتعيير والمماراة والمضادة والغدر وشدة الحرص على فضول المال والجاه، وهي بأجمعها أخلاق ردية مذمومة شرعا، ولا خلاص من الغضب مع بقاء هذه الأسباب، فلا بد من إزالتها بأضدادها، فينبغي أن تميت الزهو بالتواضع والعجب بالمعرفة بنفسك كما سيأتي بيانه في كتاب الكبر والعجب، وتزيل الفخر بأنك من جنس عبدك إذ الناس يجمعهم في الانتساب أب، وإنما الفخر بالفضائل.", "حاشية: (١-١) سقط من الأصل."]], "ic": "book"}, {"story": ["كتاب ذم الغضب والحقد والحسد (١٠ من ٣٢)، ص٧١٥", ["والفخر والعجب أكبر الرذائل، وهي رأسها وأصلها، فإذا لم تخل عنها فلا فضل لك على غيرك، فلم تفتخر وأنت من جنس عبدك من حيث البنية والنسب والأعضاء الظاهرة والباطنة؟.", "وأما المزح؛ فتزيله بالتشاغل بالمهمات الدينية التي تستوعب العمر وتفضل عنه إذا عرفت ذلك.", "وأما الهزل؛ فتزيله بالجد في طلب الفضائل والأخلاق الحسنة والعلوم الدينية التي تبلغك إلى سعادة الآخرة.", "وأما الهزء؛ فتزيله بالتكرم عن إيذاء الناس وبصيانة النفس عن أن يستهزأ بك.", "وأما التعيير؛ فتزيله(١) بالتحرز(٢) عن القول القبيح وصيانة النفس عن مر الجواب.", "وأما شدة الحرص على فضول العيش؛ فتزال بالقناعة بقدر الضرورة طلبا(٣) لعز الاستغناء وترفعا عن ذل الحاجة.", "وكل خلق من هذه الأخلاق وصفة من هذه الصفات يفتقر في علاجه إلى رياضة وتحمل مشقة، وحاصل رياضتها يرجع إلى معرفة غوائلها لترغب النفس عنها وتنفر عن قبحها، ثم المواظبة عن مباشرة أضدادها مدة مديدة حتى تصير بالعادة مألوفة هينة على النفس، وإذا انمحت عن النفس فقد زكت وطهرت عن هذه الرذائل وتخلصت أيضا عن الغضب الذي يتولد منها.", "ومن أشد البواعث على الغضب عند أكثر الجهال تسميتهم الغضب شجاعة ورجولية وعزة نفس وكبر همة، وتلقيبه بالألقاب المحمودة غباوة وجهلا حتى تميل النفس إليه وتستحسنه، وقد يتأكد ذلك بحكاية شدة الغضب عن الأكابر في معرض المدح بالشجاعة، والنفس مائلة إلى التشبه بالأكابر، فيهيج الغضب في القلب بسببه، وتسمية هذا عزة نفس وشجاعة جهل، بل هو مرض قلب ونقصان عقل،", "حاشية: (١) ليست في (ظ).", "حاشية: (٢) في (ظ): (فبالحذر).", "حاشية: (٣) في (ظ): (طالبا).", "وهذا لضعف النفس ونقصانها وآية أنه لضعف النفس أن المريض أسرع غضبا من الصحيح، والمرأة أسرع غضبا من الرجل، وكذلك الصبي والشيخ الضعيف أسرع غضبا من الشاب ومن الكهل، وذو الخلق السيء والرذائل القبيحة أسرع غضبا من صاحب الفضائل فالمرذول يغضب لشهوته إذا فاتته اللقمة، ولبخله إذا فاتته الحبة حتى يغضب على أهله وولده وأصحابه، بل القوي من يملك نفسه عند الغضب، كما روينا عن النبي ﷺ أنه قال: «ليس الشديد بالصرعة، إنما الشديد الذي يملك نفسه عند الغضب».", "وينبغي أن يعالج هذا الجاهل بأن تتلى عليه حكايات أهل الحلم(١) والعفو وما استحسن منهم من كظم الغيظ، فإن ذلك منقول عن الأنبياء والحكماء والعلماء وأكابر الملوك الفضلاء، وضد ذلك منقول عن الأتراك والأكراد والجهلة والأغبياء الذين لا عقل لهم ولا فضل.", "حاشية: (١) تحرفت في الأصل إلى: (العلم).", "**بيان**", "**علاج الغضب بعد هيجانه**", "الذي قدمنا ذكره هو حسم لمواد الغضب، وقطع لأسبابه حتى لا يهيج، فإذا جرى سبب هيجه فعنده يجب التثبت حتى لا يضطر صاحبه إلى العمل به على الوجه المذموم.", "وإنما يعالج الغضب عند هيجانه بمعجون العلم والعمل.", "أما العلم؛ فهو ستة أمور:"]], "ic": "book"}, {"story": ["كتاب ذم الغضب والحقد والحسد (١١ من ٣٢)، ص٧١٧", ["**الأول**: أن يتفكر في الأخبار التي سنوردها في فضل كظم الغيظ والعفو والحلم والاحتمال، فيرغب في ثوابه، فتمنعه شدة الحرص على ثواب الكظم عن التشفي والانتقام، فينطفئ(١) غيظه.", "وفي أفراد البخاري من حديث ابن عباس قال: استأذن الحر بن قيس لعيينة بن حصن على عمر بن الخطاب فأذن له، فقال: يا ابن الخطاب والله ما تعطينا الجزل، ولا تحكم بيننا بالعدل. فغضب عمر حتى هم أن يوقع به، فقال الحر: يا أمير المؤمنين، إن الله تعالى قال لنبيه ﷺ: ﴿خُذِ ٱلْعَفْوَ وَأْمُرْ بِٱلْعُرْفِ وَأَعْرِضْ عَنِ ٱلْجَٰهِلِينَ﴾ [الأعراف: ١٩٩].", "وإن هذا من الجاهلين، فوالله ما جاوزها عمر حين تلاها عليه، وكان وقافا عند كتاب الله عز وجل.", "**والثاني**: أن يخوف نفسه عقاب(٢) الله، وهو أن يقول: قدرة الله علي أعظم من قدرتي على هذا الإنسان، فلو أمضيت غضبي عليه لم آمن أن يمضي الله عز وجل", "حاشية: (١) في الأصل: (فينتفي).", "حاشية: (٢) في (ظ): (عذاب).", "غضبه علي يوم القيامة أحوج ما أكون إلى العفو، وقد قال الله تعالى في بعض الكتب: يا ابن آدم، اذكرني حين تغضب، أذكرك حين أغضب فلا أمحقك فيمن أمحق.", "**الثالث**: أن يحذر نفسه عاقبة العداوة والانتقام، وتشمر العدو لمقابلته والسعي في هدم أغراضه، (١-١)والشماتة بمصائبه، وهو لا يخلو عن المصائب، فيخوف نفسه عواقب الغضب في الدنيا(١-١) إن كان لا يخاف من الآخرة، وهذا هو تسليط شهوة على غضب، ولا ثواب عليه؛ لأنه تقديم لبعض الحظوظ على بعض إلا أن يكون محذوره أن يتغير عليه أمر(٢) يعينه على الآخرة، فيثاب على ذلك.", "**الرابع**: أن يتفكر في قبح صورته عند الغضب، بأن يتذكر صورة غيره في حالة الغضب، ويتفكر في قبح الغضب في نفسه ومشابهة صاحبه للكلب الضاري والسبع العادي، ومشابهة الحليم الهادي التارك للغضب للأنبياء والعلماء والحكماء، ويخير نفسه بين أن يشبه الكلاب والسباع أو أراذل الناس، وبين أن يشبه الأنبياء والعلماء في عادتهم لتميل نفسه إلى حب الاقتداء بهؤلاء إن كان قد بقي معه مسكة من عقل.", "**الخامس**: أن يتفكر في السبب الذي يدعوه إلى الانتقام ويمنعه من كظم الغيظ، ولا بد أن يكون له سبب مثل قول الشيطان له: إن هذا يحمل منك على العجز وصغر النفس والذلة والمهانة، فتصير حقيرا في أعين الناس. فليقل لنفسه: ما أعجبك تأنفين من الاحتمال الآن ولا تأنفين من خزي يوم القيامة والافتضاح إذا أخذ هذا بيدك وانتقم منك؟ وتحذرين من أن تصغري في أعين الناس ولا تحذرين من أن تصغري عند الله وعند الملائكة والنبيين؟ فمهما كظم الغيظ فينبغي أن يكظمه لله عز وجل، وذلك يعظمه عند الله، فما له وللناس؟ وذل من ظلمه يوم القيامة أشد من ذله لو انتقم منه الآن، أفلا يحب أن يكون هو القائم إذا نودي يوم القيامة: ليقم", "حاشية: (١-١) سقط من (ظ).", "حاشية: (٢) سقطت من (ظ)."]], "ic": "book"}, {"story": ["كتاب ذم الغضب والحقد والحسد (١٢ من ٣٢)، ص٧١٩", ["من وقع أجره على الله. فلا يقوم إلا من عفا، فهذا وأمثاله ينبغي أن يقرره على قلبه.", "**السادس**: أن يعلم أن غضبه إنما كان من شيء جرى على وفق مراد الله لا على وفق مراده، فكيف يقدم مراده على مراد الله؟", "**وأما العمل**: فمنه السكوت، ومنه التعوذ، ومنه تغيير الحال، فإن كان قائما جلس، وإن كان جالسا اضطجع، وقد أمر بالوضوء أيضا، أخبرنا هبة الله بن محمد قال: أخبرنا الحسن بن علي التميمي قال: أخبرنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا محمد بن جعفر قال: حدثنا شعبة قال: سمعت ليثا قال: سمعت طاووسا يحدث عن ابن عباس عن النبي ﷺ: «إني لأعلم كلمة لو قالها لذهب ما يجده، لو قال: أعوذ بالله من الشيطان الرجيم ذهب عنه ما يجده». فقالوا له: إن النبي ﷺ قد قال: «تعوذ بالله من الشيطان الرجيم». فقال: وهل بي من جنون؟!", "وقد روى أبو ذر رضي الله عنه عن النبي ﷺ أنه قال: «إذا غضب أحدكم وهو قائم فليجلس، فإن ذهب عنه الغضب، وإلا فليضطجع».", "واعلم أن القائم متهيئ للحركة والبطش، والقاعد دونه في هذا المعنى، والمضطجع ممنوع منهما، فيشبه أن يكون أمره بالقعود والاضطجاع لئلا يبدر منه في حال قيامه وقعوده بادرة يندم عليها فيما بعد، ويمكن أن يكون أمره بالقعود والاضطجاع لتسكن الحرارة، فإن سبب الغضب اشتداد الحرارة، ولذلك أمر بالوضوء.", "أخبرنا إسماعيل بن أحمد قال: أخبرنا إسماعيل بن أحمد قال: أخبرنا محمد ابن هبة الله الطبري قال: أخبرنا ابن بشران، قال: حدثنا ابن صفوان. قال: حدثنا أبو بكر القرشي، قال: حدثنا إبراهيم بن محمد بن عرعرة قال: حدثنا إبراهيم بن خالد الصنعاني قال: حدثنا أبو وائل القاص قال: كنا عند عروة بن محمد فكلمه رجل بكلام، فغضب غضبا شديدا، فقام فتوضأ ثم جاء، فقال: حدثني أبي عن", "جدي عطية، وكانت له صحبة، قال: قال رسول الله ﷺ: «إن الغضب من الشيطان، وإن الشيطان خلق من النار، وإنما تطفأ النار بالماء، فإذا غضب أحدكم فليتوضأ».", "وغضب عمر بن الخطاب يوما فدعى بماء فاستنشق وقال: إن الغضب من الشيطان، وهذا يذهب بالغضب.", "ويمكن أن يكون إنما أمر بالجلوس والاضطجاع ليقرب إلى الأرض التي منها خلق فيذكر أصله فيذل(١)، ويمكن أن يكون ليتواضع بذله؛ لأن الغضب ينشأ عن الكبر، وقد روينا آنفا من حديث أبي سعيد عن النبي ﷺ أنه ذكر الغضب فقال: «من وجد من ذلك شيئا فليلصق خده بالأرض».", "وهذا يبين أن المراد إذلال أعز الأشياء لتستشعر النفس بذلك الذل وتزايل العزة والزهو اللذين هما سبب الغضب."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "وفي حديث آخر عن أنس أن النبي ﷺ قال: «يطلع عليكم من هذا الفج رجل من أهل الجنة»، فطلع رجل، فسئل عن عمله فقال: إني لا أجد لأحد من المسلمين في نفسي غشا ولا ____ على خير أعطاه الله", "o": ["حسدا", "ويتجدد", "فالكبر", "بحذائه"], "h": "راجع: ص٧٣٤"}, {"t": "fill", "d": 2, "q": "وقال معاوية: عليكم بالحلم والاحتمال حتى تمكنكم الفرصة، ____ أمكنتكم فعليكم بالصفح", "o": ["فإذا", "بكير", "الدال", "يحملكم"], "h": "راجع: ص٧٣٠"}, {"t": "fill", "d": 2, "q": "أما العمل النافع فيه، فهو أن تتكلف بقيض ما يأمرك به الحسد، فإذا بعثه على القدح في المحسود كلف نفسه المدح له والثناء عليه، وإن حمله التكبر عليه ألزم نفسه التواضع له والاعتذار إليه، وإن بعثه على كف الإنعام عنه ألزم نفسه الزيادة في الإنعام، وقد كان جماعة من السلف إذا بلغهم أن ____ اغتابهم أهدوا إليه وأعطوه، وأخبرنا أبو منصور القزاز قال", "o": ["شخصا", "يبني", "مستلذا", "تغضبن"], "h": "راجع: ص٧٥١"}, {"t": "fill", "d": 2, "q": "وقال ابن السماك: أذنب غلام لامرأة من قريش، فأخذت السوط ومضت ____، حتى إذا قاربته رمت بالسوط، وقالت: ما تركت التقوى أحدا يشفي", "o": ["نحوه", "عديم", "ومجامع", "فشغفت"], "h": "راجع: ص٧٢٢"}, {"t": "fill", "d": 2, "q": "أما القسم الأول: فليست الرياضة فيه لينعدم غيظ القلب، ولكن لكي يقدر على أن لا يطيع الغضب ولا يستعمله في الظاهر إلا على حد يستحبه الشرع ____ العقل، وذلك ممكن بالمجاهدة وتكلف الحلم والاحتمال مدة", "o": ["ويستحسنه", "النعمة", "أرسلنني", "التلاوة"], "h": "راجع: ص٧١١"}, {"t": "fill", "d": 2, "q": "وقيل لبعض الحكماء: ما أملك فلانا لنفسه! قال: إذا لا تذله الشهوة، ولا ____ الغضب، ولا يغلبه", "o": ["يصرعه", "فاكهة", "إسلام", "فطلب"], "h": "راجع: ص٧٠٥"}]}, {"t": "كتاب ذم الغضب والحقد والحسد - القسم ٣ من ٦", "b": [{"story": ["كتاب ذم الغضب والحقد والحسد (١٣ من ٣٢)، ص٧٢٠", ["أخبرنا إسماعيل بن أحمد قال: أخبرنا محمد بن هبة الله قال: أخبرنا ابن بشران قال: أخبرنا ابن صفوان قال: حدثنا عبد الله بن محمد القرشي قال: حدثني محمد بن عمر بن علي بن الزبير قال: حدثنا سعيد بن عامر قال: حدثنا المعتمر بن سليمان قال: كان رجل ممن كان قبلكم يغضب فيشتد غضبه، فكتب ثلاث صحائف، فأعطى كل صحيفة رجلا، وقال لصاحب الصحيفة الأولى: إذا رأيتني قد غضبت فاشتد غضبي، فقم إلي بهذه الصحيفة. قال: وأعطى الصحيفة الأخرى رجلا وقال: إذا رأيتني قد سكن بعض غضبي فقم إلي بهذه الصحيفة. قال: وأعطى الصحيفة الثالثة رجلا وقال: إذا رأيتني قد ذهب بعض غضبي فقم إلي بهذه الصحيفة. قال: فغضب يوما فاشتد غضبه، فقام إليه صاحب الصحيفة الأولى فإذا في صحيفته: أقصر، ما أنت وهذا الغضب؟ إنك لست بإله، إنما أنت بشر أوشك أن يأكل بعضك بعضا. قال: فسكن بعض غضبه، فقام إليه صاحب الصحيفة الثانية، فإذا في صحيفته: ارحم من في الأرض يرحمك من في السماء. فسكن", "حاشية: (١) في الأصل: (فيتبدل).", "بعض غضبه، فقام إليه صاحب الصحيفة الثالثة، وإذا في صحيفته: خذ الناس بحق الله، فإنه لا يصلحهم إلا ذاك.", "قال سعيد بن عامر: يقول: لا تعطل الحدود.", "قال القرشي: وحدثني القاسم بن هاشم قال: حدثنا أحمد بن يونس البزار قال: غضب المهدي على رجل، فدعا بالسياط، فلما رأى شبيب شدة غضبه وإطراق الناس فلم يتكلموا بشيء، قال شبيب: يا أمير المؤمنين، لا تغضبن لله بأشد مما غضب لنفسه. فقال: خلوا سبيله.", "**فضيلة كظم الغيظ**", "قال الله عز وجل: ﴿وَٱلْكَٰظِمِينَ ٱلْغَيْظَ وَٱلْعَافِينَ عَنِ ٱلنَّاسِ﴾ [آل عمران: ١٣٤]، فذكر ذلك في معرض المدح.", "أخبرنا هبة الله بن محمد قال: أخبرنا الحسن بن علي التميمي قال: أخبرنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا عبد الله ابن يزيد قال: حدثنا سعيد - يعني: ابن أبي أيوب - قال: حدثني أبو مرحوم عن سهل بن معاذ عن أبيه أن رسول الله ﷺ قال: «من كظم غيظا وهو قادر(١) على أن ينفذه، دعاه الله تبارك وتعالى على رؤوس الخلائق حتى يخيره من أي الحور العين شاء»(٢).", "قال الإمام أحمد: حدثنا علي بن عاصم عن يونس بن عبيد قال: أخبرنا الحسن عن ابن عمر قال: قال رسول الله ﷺ: «ما تجرع عبد جرعة أفضل عند الله من جرعة غيظ يكظمها ابتغاء وجه الله تبارك وتعالى»(٣).", "حاشية: (١) في الأصل: (يقدر) وهي رواية.", "حاشية: (٢) أخرجه أحمد (١٥٦٣٧)، والترمذي (٢٠٢١) و(٢٤٩٣)، وأبو داود (٤٧٧٧)، وابن ماجه (٤١٨٦) وأبو يعلى (٤٩٧).", "حاشية: (٣) أخرجه أحمد (٦١١٤)، والطبراني في مكارم الأخلاق(٥١)، والبيهقي في الشعب (٨٣٠٧).", "وفي رواية أخرى عن ابن عمر عن النبي ﷺ قال: «من كظم غيظا ولو شاء أن يمضيه أمضاه، ملأ الله قلبه يوم القيامة رضا»."]], "ic": "book"}, {"story": ["كتاب ذم الغضب والحقد والحسد (١٤ من ٣٢)، ص٧٢٢", ["وفي رواية أبي هريرة عن النبي ﷺ قال: «من كظم غيظا وهو يقدر على إنفاذه، ملأ الله قلبه أمنا وإيمانا».", "ومر النبي ﷺ على قوم يتحادون مهراسا(١) فقال: أتحسبون أن الشدة في حمل الحجارة؟! إنما الشدة أن يمتلئ أحدكم غيظا ثم يغلبه».", "وروينا عن ابن عباس عن النبي ﷺ أنه قال: «إن لجهنم بابا لا يدخله إلا من يشفي غيظه بمعصية الله».", "وقد روي عن عمر بن الخطاب أنه قال: من اتقى الله لم يشف غيظه، ومن خاف الله لم يفعل ما يريد، ولولا يوم القيامة لكان غير ما ترون.", "وقال مالك بن زياد الأشجعي: من كظم غيظه وهو يقدر على إمضائه حشى الله قلبه إيمانا كما تحشى الرمانة حبا.", "وقال ابن السماك: أذنب غلام لامرأة من قريش، فأخذت السوط ومضت نحوه، حتى إذا قاربته رمت بالسوط، وقالت: ما تركت التقوى أحدا يشفي غيظه.", "**فضيلة الحلم**", "اعلم أن الحلم أفضل من كظم الغيظ؛ لأن كظم الغيظ عبارة عن التحلم، أي تكلف الحلم، فلا يحتاج إلى كظم الغيظ إلا من هاج غيظه، ويحتاج فيه إلى مجاهدة شديدة، ولكن إذا تعود ذلك مدة صار ذلك اعتيادا، فلا يهيج الغيظ، وإن هاج فلا يكون في كظمه تعب، وهو الحلم الطبعي، وهودلالة كمال العقل واستيلائه وانكسار قوة الغضب وخضوعها للعقل: ولكن ابتداؤه التحلم وكظم الغيظ تكلفا.", "حاشية: (١) المهراس: حجر مستطيل منقور يتوضأ منه، وهو حجر ضخم لا يقله الرجال ولا يحركونه لثقله، يسع ماء كثيرا. تاج العروس (هرس).", "وقد روى أبو هريرة عن النبي ﷺ أنه قال: «إنما العلم بالتعلم، والحلم بالتحلم، اطلبوا العلم واطلبوا مع العلم السكينة والحلم، لينوا لمن تعلمون ولمن تتعلمون منه، ولا تكونوا من جبابرة العلماء فيغلب جهلكم علمكم».", "وقال عليه الصلاة والسلام لأشج عبد القيس: «إن فيك خلتين يحبهما الله ورسوله: الحلم والأناة».", "وقال عليه الصلاة والسلام: «أيعجز أحدكم أن يكون كأبي ضمضم؟ رجل كان قبلكم، كان يقول إذا أصبح: اللهم إني قد تصدقت بعرضي على من ظلمني».", "وقال عليه الصلاة والسلام: «إذا جمع الله الخلائق يوم القيامة نادى مناد: أين أهل الفضل؟ فيقوم ناس وهم يسير، فينطلقون سريعا إلى الجنة، فتتلقاهم الملائكة، فيقولون: إنا نراكم سراعا إلى الجنة، فمن أنتم؟ فيقولون: نحن أهل الفضل. فيقولون: ما كان فضلكم؟ فيقولون: كنا إذا ظلمنا صبرنا، وإذا أسيء إلينا غفرنا، وإذا جهل علينا حلمنا. فيقال لهم: ادخلوا الجنة فنعم أجر العاملين».", "وقال أبو الدرداء: إن ناقدت الناس ناقدوك، وإن تركتهم لم يتركوك، وإن هربت منهم أدركوك. قال: فما تأمرني؟ قال: هب عرضك ليوم فقرك.", "وقال عمرو بن الأهتم: أشجع الناس من رد جهله بحلمه.", "وقال الخليل بن أحمد: كان يقال: من أساء فأحسن إليه جعل له حاجز من قلبه يردعه عن مثل إساءته.", "وقال سنان بن لقيط: إذا لم تنكأ عدوك إلا بما يؤذي دينك، فبنفسك بدأت."]], "ic": "book"}, {"story": ["كتاب ذم الغضب والحقد والحسد (١٥ من ٣٢)، ص٧٢٣", ["**ذكر طرف من أخبار الحلماء**", "سب رجل الحسن بن علي فلم يرد عليه، ثم قال له: لو استحملتنا حملناك، وإن استرفدتنا أرفدناك، وإن استعنت بنا أعناك. وبعث إليه مروان يسبه فقال للرسول: قل له: موعدك الله عز وجل.", "شتم رجل ابن عباس، فلما قضى مقالته قال: يا عكرمة، انظر هل للرجل حاجة فنقضيها. فنكس الرجل رأسه واستحيا.", "وأسمع رجل معاوية كلاما شديدا، فقيل له: لو عاقبته. فقال: إني لأستحيي من الله أن يضيق حلمي عن ذنب أحد من رعيتي.", "وقسم معاوية قطفا، فبعث منها بقطيفة إلى شيخ من أهل دمشق، فلم تعجبه، فجعل عليه يمينا أن يضرب بها رأس معاوية، فأتى معاوية فأخبره، فقال له معاوية: أوف بنذرك، وليرفق الشيخ بالشيخ.", "وشهد عنده أعرابي شهادة، فقال له معاوية: كذبت. فقال: الكاذب المتزمل في ثيابك. فقال معاوية: هذا جواب من عجل.", "وجاء غلام لأبي ذر وقد كسر رجل شاة له، فقال له: من كسر رجل هذه؟ قال: أنا فعلته عمدا لأغيظك فتضربني فتأثم. فقال: لأغيظن من حرضك على غيظي. فأعتقه.", "وشتم رجل عدي بن حاتم وهو ساكت، فلما فرغ من مقالته قال: إن كان بقي عندك شيء فقل قبل أن يأتي شباب الحي، فإنهم إن سمعوك تقول هذا لشيخهم لم يرضوه.", "وكان بين عاصم بن عمر بن الخطاب وبين رجل من قريش خصومة في أرض، فقال القرشي لعاصم: فإن كنت صادقا فادخلها. فقال عاصم: وقد بلغ بك الغضب هذا! هي لك. فقال القرشي: سبقتني، هي لك. فتركاها لا يأخذها واحد منهما حتى هلكا، ولم يعرض لها أولادهما.", "وزحمت راحلة سالم بن عبد الله رجلا، فقال له الرجل: ما أراك إلا رجل سوء. فقال: ما أحسبك أبعدت.", "ودخل عمر بن عبد العزيز المسجد ليلة في الظلمة، فمر برجل نائم(١) فعثر به،", "حاشية: (١) تحرفت في الأصل إلى: (قائم).", "فرفع رأسه وقال: أمجنون أنت؟! فقال عمر: لا، فهم به الحرس، فقال عمر: مه، إنما سألني أمجنون أنت؟ فقلت: لا.", "وقام إليه رجل وهو على المنبر فقال: أشهد إنك من الفاسقين. فقال: وما يدريك؟ أنت شاهد زور، ولا نجيز شهادتك. وكلمه رجل فأغلظ له، فقال: أردت أن يستفزني الشيطان بعز السلطان فأنال منك اليوم ما تناله مني غدا.", "ولقي رجل علي بن الحسين فسبه، فثارت إليه العبيد(١)، فقال: مهلا، ثم أقبل عليه فقال: ما ستر عنك من أمرنا أكثر، ألك حاجة نعينك عليها؟ فاستحيا الرجل فألقى إليه خميصة كانت عليه وأمر له بألف درهم، فكان الرجل بعد ذلك يقول: أشهد إنك من أولاد الرسل.", "واستطال عليه يوما رجل فتغافل عنه، فقال له الرجل: إياك أعني. فقال له: وعنك أغضي.", "وأغلظ له رجل فقال له: يا أخي، إن كنت صادقا فيما قلت، فغفر الله لي، وإن كنت كاذبا، فغفر الله لك.", "وكان عنده ضيف فاستعجل خادمه بشواء كان في التنور، فأقبل به، فسقط السفود من يده على بني لعلي فأصاب رأسه فقتله، فقال علي للغلام: أنت حر، إنك لم تتعمده."]], "ic": "book"}, {"story": ["كتاب ذم الغضب والحقد والحسد (١٦ من ٣٢)، ص٧٢٥", ["ومر الربيع بن خثيم في السوق فسقط عليه حجر فشجه، فجعل يمسح الدم عن وجهه ويقول: اللهم اغفر له فإنه لم يتعمدني.", "وقال رجل لوهب بن منبه: إن فلانا شتمك. فقال: ما وجد الشيطان بريدا غيرك؟!", "وقال رجل للفضل بن مروان(٢): إن فلانا يقع فيك. فقال: لأغيظن من أمره، غفر الله له. قيل له: من أمره؟ قال: الشيطان.", "حاشية: (١) تحرف في الأصل إلى: (البعيد).", "حاشية: (٢) تحرف في الأصل إلى: (الفضيل بن بزوان).", "وكان الرجل يأتي الحارث بن سويد فيسبه فإذا فرغ قال الحارث: ﴿فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُۥ وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُۥ﴾ [الزلزلة: ٧-٨].", "وكان أبو السوار العدوي يعرض له الرجل فيشتمه، فيقول: إن كنت كما قلت إني إذن لرجل سوء.", "وشتم رجل محمد بن واسع وهو لا يرد عليه شيئا، فلما سكت قال: يا مغرور يوشك أن تندم.", "ونازع رجل ابن عون فقال: لولا أن يكتب علي لقلت.", "وشتم رجل الوليد بن أبي حبرة، فقال له: هي صحيفتك فأمل فيها ما شئت.", "وشتم رجل ابن ذر فقال له: يا هذا، لا تغرق في شتمنا، ودع للصلح موضعا، فإنا لا نكافئ من عصى الله فينا بأكثر من أن نطيع الله فيه.", "ومر المهلب بن أبي صفرة بقوم فعظموه، فقال رجل: ألهذا الأعور تسودون! والله لو أخرج إلى السوق ما جاء إلا بألفي درهم. فلما رجع إلى منزله أرسل إلى الرجل بألفي درهم، فقال: أما إنك لو زدتنا في القيمة لزدناك في العطية.", "وكان بين رجلين منازعة، فتسرع أحدهما إلى صاحبه، فقال الساكت: أما لولا أن الله عز وجل يسمع كلامي لتكلمت.", "وقال رجل لرجل: إني لأرحمك مما يقول الناس فيك. قال: أفتسمعني أقول فيهم؟ قال: لا. قال: فإياهم فارحم.", "وشتم رجل رجلا، فقال له: أجرك الله على الصواب، وغفر لك الخطأ.", "وقال رجل لرجل: والله لأشتمنك شتما يدخل معك قبرك. فقال: معك والله يدخل لا معي.", "**بيان**", "**القدر الذي يجوز الانتصار والتشفي به من الكلام**", "اعلم أن كل ظلم صدر من شخص فلا يجوز مقابلته بمثله، فلا يجوز مقابلة الغيبة بالغيبة، ولا مقابلة التجسس بالتجسس ولا مقابلة السب بالسب، وكذا سائر المعاصي، وإنما القصاص والغرامة على ما ورد الشرع به، قال النبي ﷺ: «فإن امرؤ عيرك بما فيك فلا تعيره بما فيه».", "وشتم رجل أبا بكر والنبي ﷺ ساكت، فلما ابتدأ أبو بكر ينتصر قام رسول الله ﷺ، فقال: إنك كنت ساكتا لما شتمني، فلما تكلمت قمت؟ فقال: «لأن الملك كان يجيب عنك، فلما تكلمت ذهب الملك وجاء الشيطان، فلم أكن لأجلس في مجلس فيه الشيطان»."]], "ic": "book"}, {"story": ["كتاب ذم الغضب والحقد والحسد (١٧ من ٣٢)، ص٧٢٧", ["وقال قوم: تجوز المقابلة بما لا كذب فيه؛ مثل أن يقول لمن أساء الأدب عليه: يا جاهل، ونحو ذلك، واستدلوا بما أخبرنا به ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا محمد بن جعفر قال: حدثنا شعبة قال: سمعت العلاء يحدث عن أبيه عن أبي هريرة قال: قال رسول الله ﷺ: «المستبان ما قالا فعلى البادئ، ما لم يعتد المظلوم». انفرد بإخراجه مسلم.", "وفي الصحيحين من حديث عائشة قالت: دخلت زينب فقالت: يا رسول الله، إن أزواجك أرسلنني إليك يسألنك العدل في ابنة أبي قحافة(١). قالت ثم وقعت بي زينب، فطفقت أنظر إلى النبي ﷺ متى يأذن لي فيها، فلم أزل حتى عرفت أنه لا", "حاشية: (١) أي يسألونه التسوية في المحبة، أو في إرسال الناس الهدايا، فإنهم كانوا يتحرون يومها بالهدايا، فأردن أن يتركوا التحري ويرسلوا إليه الهدايا حيث كان.", "يكره أن أنتصر فوقعت بزينب، فلم أنشبها(١) أن أفحمتها(٢)، فتبسم رسول الله ﷺ ثم قال: «إنها ابنة أبي بكر»(٣). فهذا وأمثاله رخصة على سبيل القصاص، والأفضل تركه؛ لأنه يجر إلى ما وراءه، ولا يمكن الاقتصار على مقدار الحق فيه؛ لأن أكثر الناس لا يضبط نفسه في فورة الغضب.", "ولهذا لا ينبغي للسلطان أن يعاقب في حال غضبه؛ لئلا يتعدى الحق انتصارا لنفسه لا لله تعالى، قال عمر بن عبد العزيز لرجل أغضبه: لولا أنك أغضبتني لعاقبتك.", "**القول في معنى الحقد ونتائجه وفضيلة العفو والرفق**", "اعلم أن الغيظ إذا كظم لعجز عن التشفي في الحال رجع إلى الباطن واحتقن فيه، فصار حقدا.", "وعلامة الحقد دوام بغض ذلك الشخص واستثقاله(٤) والنفور منه.", "والحقد ثمرة الغضب، والحقد يثمر ثمانية أشياء:", "**الأول**: الحسد، وذلك أنه يحمل الإنسان على أن يتمنى زوال النعمة على المحقود عليه، والغم بنعمة إن أصابها، والسرور بمصيبة إن نزلت به، وسيأتي في ذم الحسد.", "**والثاني**: أن يزيد على إضمار الحسد في الباطن، فيشمت ظاهرا بما يصيبه من البلاء.", "**والثالث**: أن يهجره ويصارمه.", "**والرابع**: أن يعرض عنه استصغارا له.", "حاشية: (١) لم أنشبها: أي لم أمهلها.", "حاشية: (٢) أفحمتها: أسكتها.", "حاشية: (٣) أخرجه البخاري (٢٥٨١)، ومسلم (٢٤٤٢).", "حاشية: (٤) تحرفت في الأصل: (اشتغاله).", "**والخامس**: أن يتكلم فيه بما لا يحل من كذب وغيبة، وإفشاء سر، وهتك ستر.", "**والسادس**: أن يحكيه استهزاء به، وسخرية منه.", "**والسابع**: أن يؤذيه بالضرب والإيلام.", "**والثامن**: أن يمنعه حقه من صلة رحم، أو قضاء دين، أو رد مظلمة، وكل ذلك حرام، فيجب على من وجدفي قلبه حقدا على مسلم أن لا يخرج بالحقد إلى معصية، والأولى له أن يزيد في بر ذلك الشخص والإحسان إليه مجاهدة للنفس وإرغاما للشيطان، ويجتهد في إزالة أثر الحقد من باطنه.", "فللحقود ثلاثة أحوال عند القدرة:"]], "ic": "book"}, {"story": ["كتاب ذم الغضب والحقد والحسد (١٨ من ٣٢)، ص٧٢٩", ["**أحدها**: أن يستوفي حقه الذي يستحقه من غير زيادة ولا نقصان، وهو العدل، وهو درجة الصالحين.", "**الثاني**: أن يحسن إليه بالعفو والصلة، وذلك هو الفضل، وهو اختيار الصديقين.", "**والثالث**: أن يظلمه بما لا يستحقه، وذلك هو الجور، وهو اختيار الأرذلين.", "**ذكر فضيلة العفو**", "اعلم أن معنى العفو أن يستحق حقا فيسقطه ويبرأ عنه من قصاص أو غرامة، وهو غير الحلم وكظم الغيظ، فلذلك أفردناه.", "قال الله عز وجل: ﴿وَأَن تَعْفُوٓا۟ أَقْرَبُ لِلتَّقْوَىٰ﴾ [البقرة: ٢٣٧]، وقال: ﴿وَٱلْعَافِينَ عَنِ ٱلنَّاسِ﴾ [آل عمران: ١٣٤]، وقال: ﴿فَمَنْ عَفَا وَأَصْلَحَ فَأَجْرُهُۥ عَلَى ٱللَّهِ﴾ [الشورى: ٤٠].", "أخبرنا إسماعيل بن أحمد قال: أخبرنا محمد بن هبة الله الطبري قال: أخبرنا ابن بشران قال: أخبرنا ابن صفوان قال: حدثنا أبو بكر القرشي قال: حدثنا يحيى", "ابن أيوب قال: حدثنا إسماعيل بن جعفر قال: أخبرني العلاء بن عبد الرحمن عن أبيه عن أبي هريرة عن رسول الله ﷺ قال: «ما نقصت صدقة من مال، وما زاد الله عبدا بعفو إلا عزا».", "وروى عبد الرحمن بن عوف أن النبي ﷺ قال: «ثلاث - والذي نفسي بيده - إن كنت لحالفا عليهن: ما نقصت صدقة من مال، فتصدقوا، ولا عفا رجل عن مظلمة يبتغي بها وجه الله عز وجل إلا زاده الله بها عزا يوم القيامة، ولا فتح رجل باب مسألة إلا فتح الله عز وجل عليه باب فقر».", "وروى عقبة بن عامر قال: قال لي رسول الله ﷺ: «يا عقبة، ألا أخبرك بأفضل أخلاق أهل الدنيا والآخرة؟ تصل من قطعك، وتعطي من حرمك وتعفو عمن ظلمك».", "سأل موسى عليه السلام ربه عز وجل: أي عبادك أعز؟ قال: الذي إذا قدر عفا.", "وقال علي رضي الله عنه: إذا قدرت على عدوك فاجعل العفو عنه شكرا للقدرة عليه.", "وقال معاوية: عليكم بالحلم والاحتمال حتى تمكنكم الفرصة، فإذا أمكنتكم فعليكم بالصفح والإفضال.", "وقال الحسن البصري: أفضل أخلاق المؤمنين العفو.", "وقال: ينادي مناد يوم القيامة: ليقم من وقع أجره على الله عز وجل. فلا يقوم إلا رجل قد عفا عن مظلمة.", "وأتي عبد الملك بأسارى ابن الأشعث، فقال لرجاء بن حيوة: ما ترى؟ فقال: إن الله عز وجل قد أعطاك ما تحب من الظفر، فأعطه ما يحب من العفو. فعفا عنهم.", "وقال أيوب السختياني: لا ينبل الرجل حتى تكون فيه خصلتان: العفة عما في أيدي الناس، والتجاوز عن ما يكون منهم.", "وسرقت دنانير من رجل فبكى، فقيل له: على المال تبكي؟ قال: لا، ولكن مثلتني أنا وإياه بين يدي الله، فأشرف عقلي على إدحاض حجته، فبكيت رحمة له.", "وكتب ابن المقفع إلى صديق له يسأله العفو عن بعض إخوانه: فلان هارب من زلته إلى عفوك لائذ منك بك، واعلم أنه لن يزداد الذنب عظما إلا ازداد العفو فضلا(١).", "**فضيلة الرفق**", "الرفق نتيجة حسن الخلق، ولا يحسن الخلق إلا بضبط قوة الغضب وقوة الشهوة وحفظهما على الاعتدال."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "اعلم أن الحسد إنما يكثر بين قوم تكثر بينهم الأسباب التي ذكرناها وإنما يقوى بين قوم تجتمع فيهم جملة من هذه الأسباب وتتظاهر، إذ الشخص الواحد يجوز أن يحسد لأنه يمتنع من قبول التكبر، ولأنه ____، ولأنه عدو، ولغير ذلك من الأسباب", "o": ["يتكبر", "التراب", "الطامع", "أبلغتنا"], "h": "راجع: ص٧٤٣"}, {"t": "fill", "d": 2, "q": "وشتم رجل عدي بن حاتم وهو ساكت، ____ فرغ من مقالته قال", "o": ["فلما", "مرضا", "اشتريت", "الصيت"], "h": "راجع: ص٧٢٤"}, {"t": "fill", "d": 2, "q": "والفخر والعجب أكبر الرذائل، وهي رأسها وأصلها، فإذا لم تخل عنها فلا فضل لك على غيرك، فلم ____ وأنت من جنس عبدك من حيث البنية والنسب والأعضاء الظاهرة والباطنة", "o": ["تفتخر", "أسماؤهم", "قادرا", "لفسد"], "h": "راجع: ص٧١٥"}, {"t": "fill", "d": 2, "q": "السبب الثالث: أن يكون في طبعه أن يتكبر عليه ويستصغره ويستخدمه، ويتوقع منه الانقياد له والمتابعة في أغراضه، فإذا نال نعمة خاف أن لا يحتمل تكبره ____ عن متابعته، وربما يتشوف إلى مساواته أو إلى أن", "o": ["ويترفع", "التحقيق", "بحلمه", "ركيك"], "h": "راجع: ص٧٤٠"}, {"t": "fill", "d": 2, "q": "فهذه أسباب الحسد، وقد يجتمع بعضها أو أكثرها أو جميعها في شخص واحد، فيعظم فيه الحسد لذلك، فلا يقدر على إخفاء ما عنده ____ العداوة بالمكاشفة، وأكثر المحاسدات يجتمع فيها جملة من هذه الأسباب وقلما يتجرد سبب منها", "o": ["فيظهر", "المولى", "استغضب", "يغار"], "h": "راجع: ص٧٤٢"}, {"t": "fill", "d": 2, "q": "القسم الثالث: ما يكون ضروريا في حق بعض الناس دون بعض كالكتاب - مثلا - للعالم، فإنه مضطر إليه فيحبه، فيغضب على من ____ ويغرقه، وكذلك أدوات الصناعات في حق المكتسب الذي لا يمكنه التوصل إلى القوت", "o": ["يحرقه", "ومركبه", "استغضب", "وعاء"], "h": "راجع: ص٧١١"}]}, {"t": "كتاب ذم الغضب والحقد والحسد - القسم ٤ من ٦", "b": [{"story": ["كتاب ذم الغضب والحقد والحسد (١٩ من ٣٢)، ص٧٣١", ["أخبرنا إسماعيل بن أحمد قال: أخبرنا محمد بن هبة الله الطبري قال: أخبرنا أبو الحسين بن بشران قال: أخبرنا ابن صفوان قال: أخبرنا أبو بكر القرشي قال: حدثني علي بن الجعد قال: أخبرني عبد الرحمن بن أبي بكر عن القاسم بن محمد قال: سمعت عائشة رضي الله عنها تقول: قال رسول الله ﷺ: «يا عائشة، إنه من أعطي حظه من الرفق أعطي حظه من خير الدنيا والآخرة، ومن حرم حظه من الرفق، حرم حظه من خير الدنيا والآخرة».", "قال القرشي: وحدثني سعيد بن محمد الجرمي، قال: حدثنا أبو عبيدة الحداد قال: حدثنا سعيد بن أبي عروبة عن قتادة عن أنس قال: قال رسول الله ﷺ: «إن الله رفيق يحب الرفق، ويعطي عليه ما لا يعطي على العنف».", "وفي الصحيحين من حديث عائشة عن النبي ﷺ أنه قال: «إن الله عز وجل يحب الرفق في الأمر كله».", "وفي أفراد مسلم من حديث عائشة عن النبي ﷺ أنه قال: «إن الرفق لا يكون في شيء إلا زانه، ولا ينزع من شيء إلا شانه».", "حاشية: (١) في (ظ): (عظما).", "وفي أفراده من حديث جرير بن عبد الله عن النبي ﷺ قال: «من يحرم الرفق، يحرم الخير».", "**القول**", "**في ذم الحسد وفي حقيقته وأسبابه ومعالجته وغاية الواجب في إزالته**", "**بيان**", "**ذم الحسد**", "اعلم أن الحسد من نتائج الحقد، والحقد من نتائج الغضب، فهو فرع فرع(١) الغضب.", "ثم للحسد من الفروع المذمومة ما لا يكاد يحصى، أخبرنا هبة الله بن محمد قال: أخبرنا الحسن بن علي التميمي قال: أخبرنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا يزيد قال: حدثنا هشام عن يحيى بن أبي كثير عن يعيش بن الوليد عن الزبير بن العوام قال: قال رسول الله ﷺ: «دب إليكم داء الأمم قبلكم: الحسد والبغضاء، والبغضاء هي الحالقة، حالقة الدين لا حالقة الشعر، والذي نفس محمد بيده، لا تؤمنوا حتى تحابوا، أفلا أنبئكم بشيء إذا فعلتموه تحاببتم، أفشوا السلام بينكم».", "وفي الصحيحين من حديث أنس عن النبي ﷺ أنه قال: «لا تباغضوا، ولا تقاطعوا، ولا تحاسدوا، ولا تدابروا، وكونوا عباد الله إخوانا».", "وروي عن أنس عن النبي ﷺ أنه قال: «الحسد يأكل الحسنات كما تأكل النار الحطب».", "حاشية: (١) سقطت من الأصل.", "وفي حديث آخر عن أنس أن النبي ﷺ قال: «يطلع عليكم من هذا الفج رجل من أهل الجنة»، فطلع رجل، فسئل عن عمله فقال: إني لا أجد لأحد من المسلمين في نفسي(١) غشا ولا حسدا على خير أعطاه الله إياه.", "وروى أبو هريرة عن النبي ﷺ أنه قال: «ثلاث لا ينجو منهن أحد: الظن، والطيرة، والحسد، وسأحدثكم بالمخرج من ذلك؛ إذا ظننت فلا تحقق، وإذا تطيرت فامض، وإذا حسدت فلا تبغ».", "وروى وائلة بن الأسقع عن النبي ﷺ قال: «لا تظهر الشماتة بأخيك، فيرحمه الله ويبتليك»."]], "ic": "book"}, {"story": ["كتاب ذم الغضب والحقد والحسد (٢٠ من ٣٢)، ص٧٣٤", ["وقال عمرو بن ميمون: رأى موسى عليه السلام رجلا عند العرش فغبطه بمكانه فسأل عنه فقالوا: نخبرك بعمله؛ لا يحسد الناس على ما آتاهم الله من فضله، ولا يمشي بالنميمة، ولا يعق والديه.", "وقال عبد الملك بن عمير: استعمل عمر أبا عبيدة على الشام وعزل خالد بن الوليد، فقال خالد: بعث عليكم أمين هذه الأمة، سمعت رسول الله ﷺ يقول: «أمين هذه الأمة أبو عبيدة بن الجراح»، وقال أبو عبيدة: سمعت رسول الله ﷺ يقول: «خالد سيف من سيوف الله عز وجل ونعم فتى العشيرة».", "وروينا أن الله تعالى يقول: الحاسد عدو لنعمتي، متسخط لقضائي، غير راض بقسمتي التي قسمت بين عبادي.", "وقال معاوية: كل الناس أقدر على رضاه إلا حاسد نعمة، فإنه لا يرضيه إلا زوالها.", "وقال الأصمعي: سمعت أعرابيا يقول: ما رأيت ظالما أشبه بمظلوم من الحاسد، حزن لازم، ونفس دائم، وعقل هائم، وحسرة لا تنقضي.", "حدثنا المبارك بن علي الصيرفي قال: أخبرنا هبة الله بن أحمد بن ثابت قال: أخبرنا محمد بن علي بن الفتح قال: أخبرنا ابن أخي ميمي قال: أخبرنا أحمد بن", "حاشية: (١) في الأصل: (قلبي)."]], "ic": "book"}, {"story": ["كتاب ذم الغضب والحقد والحسد (٢١ من ٣٢)، ص٧٣٥", ["محمد بن جعفر قال: حدثنا أبو بكر القرشي قال: حدثنا الحسن(١) بن علي قال: حدثنا عفان قال: حدثنا حماد بن سلمة قال: حدثنا حميد عن بكر بن عبد الله أن رجلا كان يغشى بعض الملوك، فيقوم بحذاء الملك فيقول: أحسن إلى المحسن بإحسانه، والمسيء تكفيه مساوئه. فحسده رجل على ذلك المقام والكلام، فسعى به إلى الملك، فقال: إن هذا الذي يقوم بحذائك ويقول ما يقول زعم أن الملك أبخر. فقال له الملك: وكيف يصح عندي ذلك؟ فقال: تدعو به إليك، فإنه إذا دنا منك وضع يده على أنفه(٢-٢) لئلا يشم ريح البخر. فقال له: انصرف حتى أنظر، فخرج من عند الملك(٢-٢)، فدعا الرجل إلى منزله فأطعمه طعاما فيه ثوم، فخرج الرجل من عنده فجاء إلى الملك، فقام بحذائه، فقال: أحسن إلى المحسن بإحسانه والمسيء ستكفيه مساوئه. فقال: أدن مني. فدنا منه، فوضع يده على فمه مخافة أن يشم الملك منه ريح الثوم، فقال الملك في نفسه: ما أرى فلانا إلا قد صدقني. وكان الملك لا يكتب بخطه إلا بجائزة أو صلة أو معروف، فكتب له كتابا بخطه إلى عامل من عماله: إذا أتاك صاحب كتابي هذا فاذبحه واسلخه واحش جلده تبنا، وابعث به إلي. فأخذ الكتاب وخرج، فلقيه الرجل الذي سعى به، فقال: ما هذا الكتاب؟ قال: كتب لي الملك بخطه إلى عامل من عماله. قال: هبه لي أجزني به. قال: هو لك، فأخذ الكتاب ومضى إلى العامل، فقرأه العامل فقال: أتدري ما في كتابك؟ يأمرني أن أذبحك وأسلخك وأحشو جلدك تبنا وأبعث بك إليه. فقال: إن هذا الكتاب ليس هو لي، الله الله، راجع الملك! قال: ليس لكتاب الملك مراجعة، فذبحه وسلخه وحشا جلده تبنا وبعث به إلى الملك، وجاء الرجل كما يجيء فقال: أحسن إلى المحسن بإحسانه، والمسيء ستكفيه مساوئه. فقال له الملك: ما فعل الذي كتبت لك بخطي؟ قال: لقيني فلان فاستوهبه مني فوهبته له. قال: إنه ذكر لي أنك تزعم أني أبخر. قال: ما فعلت. قال: فلم وضعت يدك على أنفك حين دنوت مني؟ قال: إنما وضعتها على فمي لأنه أطعمني طعاما فيه ثوم", "حاشية: (١) في الأصل: (أبو الحسن).", "حاشية: (٢-٢) سقط من (ظ).", "فكرهت أن يشم الملك ريح الثوم. قال: صدقت، فقم ذلك المقام وقل ما كنت تقول.", "وقال ابن سيرين: ما حسدت أحدا على شيء من أمر الدنيا؛ لأنه إن كان من أهل الجنة فكيف أحسده على شيء من أمر الدنيا وهو يصير إلى الجنة؟ وإن كان من أهل النار فكيف أحسده على شيء من أمر الدنيا وهو يصير إلى النار؟", "وقال الحسن في قوله تعالى: ﴿وَلَا يَجِدُونَ فِى صُدُورِهِمْ حَاجَةً مِّمَّآ أُوتُوا۟﴾ [الحشر: ٩]، قال: حسدا.", "وقال إبليس لنوح عليه السلام: احذر الحسد، فإنه صيرني إلى هذه الحال، والحرص فإنه أخرج آدم من الجنة."]], "ic": "book"}, {"story": ["كتاب ذم الغضب والحقد والحسد (٢٢ من ٣٢)، ص٧٣٦", ["وقد روينا أن رجلا انقطع إلى بعض الكرماء فالحقه(١) بحشمه وكفاه مؤنته، فبطر النعمة وسعى بالكريم إلى الأمير، فأرسل إليه الأمير فذكر له ما قال عنه فأنكر، فقال: فلان يخبر عنك بذلك. فسكت متعجبا، فقال الأمير: مالك؟فقال: أخاف أن أكون قصرت في الإحسان إليه فحملته على مساوئ أخلاقه. فقال الأمير: سب
