، فليس بمستحب، وهل يكره", "o": ["الوضوء", "الدول", "الجوع", "فليقم"], "h": "راجع: ص٩٣"}]}, {"t": "كتاب أسرار الطهارة ومهماتها - القسم ٢ من ٣", "b": [{"story": ["كتاب أسرار الطهارة ومهماتها (٦ من ١٤)، ص٩٢", ["حاشية: (١) تحرفت في الأصل إلى: «الإزار».", "حاشية: (٢) في (ظ): «فإن نكسه».", "حاشية: (٣) في (ظ): «المشهور».", "حاشية: (٤) ليست في الأصل.", "وتفريق الوضوء إن كان يسيرا ـ وحده أن لا ينشف ما غسله قبله ـ لم يبطل، وإن كان فاحشا أبطل في أصح الروايتين.", "ويكره الإكثار من الماء في الوضوء، فقد أخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد قال: حدثني محمد بن المثنى قال: حدثنا أبو داود قال: حدثنا خارجة بن مصعب عن يونس بن عبيد عن الحسن عن يحيى(١) عن أبي عن النبي صلى الله عليه وسلم أنه قال: «للوضوء شيطان يقال له: الولهان، فاتقوه ـ أو قال: فاحذروه»(٢). قال عبد الله بن أحمد: وحدثني أبي قال: حدثنا قتيبة قال: حدثنا ابن لهيعة عن يحيى بن عبد الله عن أبي عبد الرحمن الحبلي عن عبد الله بن عمرو بن العاص أن رسول الله صلى الله عليه وسلم، مر بسعد وهو يتوضأ، فقال: «ما هذا السرف يا سعد؟!» قال: أفي الوضوء سرف؟ فقال: «نعم، وإن كنت على نهر جار»(٣).", "فأما تنشيف الأعضاء عند الفراغ من الوضوء(٤)، فليس بمستحب، وهل يكره؟ فيه روايتان عن أحمد رضي الله عنه(٥) فإذا فرغ من الوضوء استحب له أن يقول: أشهد أن لا إله إلا الله، وأشهد أن محمدا عبده ورسوله، فإنه قد روى مسلم في أفراده من حديث عمر بن الخطاب أنه قال: «ما منكم من أحد يتوضأ، فيبلغ أو فيسبغ الوضوء، ثم يقول: أشهد أن لا إله إلا الله وأن محمدا عبده ورسوله إلا فتحت له أبواب الجنة الثمانية»، وفي بعض الألفاظ: «وحده لا شريك له»(٦).", "حاشية: (١) تحرفت في النسخ إلى: «عتي». ويحيى هو ابن ضمرة السعدي.", "حاشية: (٢) أخرجه أحمد (٢١٢٣٨)، والطيالسي (٥٤٧)، وابن ماجه (٤٢١)، والترمذي (٥٧)، وابن خزيمة (١٢٢)، وابن عدي في الكامل ٣/٩٢٣، والضياء في المختارة (١٢٤٧) و(١٢٤٩)، والحاكم ١/١٦٢، والبيهقي في السنن ١/١٩٧.", "حاشية: (٣) أخرجه أحمد (٧٠٦٥)، وابن ماجه (٤٢٥).", "حاشية: (٤) ليس في (ظ).", "حاشية: (٥) ليس في الأصل.", "حاشية: (٦) أخرجه مسلم (٢٣٤)، وأحمد (١٧٣١٤)، وابن أبي شيبة ٣/١ ـ ٤، وأبو عوانة ١/٢٢٤، والترمذي (٥٥)، والبيهقي في السنن ١/٧٨، والنسائي في الكبرى (١٤١).", "فأما ما يذكره أقوام من الذكر عند غسل الأعضاء، كقولهم عند غسل الوجه: اللهم بيض وجهي يوم تسود فيه وجوه. وعند غسل اليد: اللهم أعطني كتابي بيميني ولا تعطني بشمالي ولا من وراء ظهري. وعند مسح الرأس: اللهم أظلني بظل عرشك يوم لا ظل إلا ظلك. وعند غسل الرجلين: «اللهم ثبت قدمي على الصراط يوم تزل فيه الأقدام. فإنه لم يثبت عندنا في ذلك سنة، فلذلك لم نذكره، وإن قيل، فلا بأس به».", "**ذكر ما يشتمل عليه الوضوء من واجب وسنة**"]], "ic": "book"}, {"story": ["كتاب أسرار الطهارة ومهماتها (٧ من ١٤)، ص٩٤", ["واجبات الوضوء عشرة: النية، والتسمية، والمضمضة، والاستنشاق، وغسل الوجه، وغسل اليدين، ومسح جميع الرأس، وغسل الرجلين، والترتيب، والموالاة.", "ومسنوناته عشرة: غسل اليدين قبل إدخالهما الإناء، والسواك، والمبالغة في المضمضة والاستنشاق، وتخليل اللحية، وغسل داخل العينين، والبداية باليمين، وأخذ ماء جديد للأذنين، ومسح العنق، وتخليل مابين الأصابع، والغسلة الثانية والثالثة(١).", "**ذكر فضائل الوضوء**", "روى مسلم في أفراده من حديث عثمان بن عفان رضي الله عنه عن النبي صلى الله عليه وسلم، أنه قال: «من توضأ فأحسن الوضوء خرجت خطاياه من جسده حتى تخرج من تحت أظفاره»(٢). وفي أفراده من حديث أبي هريرة عن النبي صلى الله عليه وسلم أنه قال: «إذا توضأ العبد المسلم أو المؤمن فغسل وجهه خرجت من وجهه كل خطيئة نظر إليها بعينيه مع الماء أو مع آخر قطر الماء، فإذا غسل يديه خرجت من يديه كل خطيئة", "حاشية: (١) ورد في هامش النسخة (ظ) ما نصه: «آخر الجزء الأول من أجزاء الشيخ المصنف».", "حاشية: (٢) أخرجه مسلم (٢٤٥) (٣٣)، وأحمد (٤٧٦)، والبزار (٤٣٣)، وابن أبي شيبة ٧/١، وأبو عوانة ١/٢٢٩.", "بطشتها يداه مع الماء أو مع آخر الماء، فإذا غسل رجليه خرجت كل خطيئة مشتها رجلاه مع الماء أو مع آخر قطر الماء حتى يخرج نقيا من الذنوب»(١). وفي أفراده من حديث عمرو بن عبسة قال: قلت: يا نبي الله، أخبرني عن الوضوء. قال: «ما منكم أحد يقرب وضوءه ثم يتمضمض وينتشق إلا خرت خطايا وجهه من أطراف لحيته مع الماء، ثم يغسل يديه إلى المرفقين إلا خرت خطايا يديه من أطراف أنامله، ثم يمسح برأسه إلا خرت خطايا رأسه من أطراف شعره مع الماء، ثم يغسل قدميه إلى الكعبين كما أمره الله عز وجل إلا خرت خطايا قدميه من أطراف أصابعه مع الماء»(٢). وفي أفراده من حديث أبي هريرة عن النبي صلى الله عليه وسلم، أنه قال: «ألا أدلكم على ما يرفع الله به الدرجات ويمحو به الخطايا: إسباغ الوضوء في المكاره، وكثرة الخطا إلى المساجد، وانتظار الصلاة بعد الصلاة»(٣). وفي الصحيحين من حديث أبي هريرة عن النبي صلى الله عليه وسلم أنه قال: «إن أمتي يدعون يوم القيامة غرا محجلين من آثار الوضوء، فمن استطاع منكم أن يطيل غرته فليفعل»(٤).", "ويستحب لمن توضأ أن يركع ركعتين، فقد ذكرنا في أول الفصل حديث بلال: ما أحدثت إلا توضأت وصليت ركعتين(٥). وفي الصحيحين من حديث عثمان بن عفان رضي الله عنه أنه توضأ، وقال: رأيت رسول الله صلى الله عليه وسلم توضأ نحوا من وضوئي هذا ثم قال: «من توضأ وضوئي هذا ثم صلى ركعتين لا يحدث فيهما نفسه غفر له ما تقدم من ذنبه»(٦). وفي أفراد مسلم من حديث عقبة بن عامر عن النبي صلى الله عليه وسلم أنه"]], "ic": "book"}, {"story": ["كتاب أسرار الطهارة ومهماتها (٨ من ١٤)، ص٩٥", ["حاشية: (١) أخرجه مسلم (٢٤٤)، وأحمد (٨٠٢٠)، والترمذي (٢)، والدارمي (٧١٨)، وابن خزيمة (٤)، وابن حبان (١٠٤٠)، والبيهقي ١/٨١.", "حاشية: (٢) أخرجه مسلم (٨٣٢)، وأحمد (١٧٠١٩)، وأبو عوانة ١/٣٨٦، والبيهقي في السنن ١/٨١ و٢/٤٥٤، وابن عبد البر في التمهيد ٤/٥٣.", "حاشية: (٣) أخرجه مسلم (٢٥١)، وأحمد (٨٠٢١)، ومالك في الموطأ ١/١٦١، وابن حبان (١٠٣٨)، والبيهقي في السنن ١/٨٢.", "حاشية: (٤) أخرجه البخاري (١٣٦)، ومسلم (٢٤٦)(٣٥).", "حاشية: (٥) تقدم في الصفحة ٩٠.", "حاشية: (٦) أخرجه البخاري (٦٤٣٣)، ومسلم (٢٢٦) و(٢٢٧) و(٢٢٩).", "قال: «ما من مسلم يتوضأ فيحسن وضوءه ثم يقوم فيصلي ركعتين مقبلا عليهما بقلبه ووجهه إلا وجبت له الجنة»(١).", "**فصل**", "**ونواقض الوضوء سبعة:** الخارج من السبيلين سواء كان طاهرا، كالريح، أو نجسا، كالبول والدود، وسواء كان قليلا أو كثيرا، نادرا أو معتادا.", "**والثاني:** خروج النجاسات من بقية البدن، فإن كانت بولا أو عذرة فلا فرق بين قليلها وكثيرها، وإن كانت غير ذلك لم ينقض قليلها ونقض كثيرها، وهو ما فحش في النفس.", "**والثالث:** زوال العقل إلا بالنوم اليسير جالسا أو قائما أو راكعا أو ساجدا، وعن الإمام أحمد: أن نوم الراكع والساجد ينقض بكل حال، وعنه: أن النوم ينقض في جميع الأحوال إلا اليسير في حال الجلوس(٢).", "**والرابع:** أن تمس بشرته بشرة أنثى لشهوة، وفي نقض وضوء الملموس روايتان.", "**والخامس:** مس فرج الآدمي قبلا كان أو دبرا، كبيرا أو صغيرا، حيا أو ميتا، وهل ينقض مس الذكر بالذراع؟ على روايتين، وعن الإمام أحمد: لا ينقض مس الفرج بحال.", "**والسادس:** أكل لحم الجزور في أظهر الروايتين، فإن شرب من ألبانها، فعلى روايتين، فإن أكل من كبدها أو طحالها، فعلى وجهين.", "**والسابع:** غسل الميت.", "حاشية: (١) أخرجه مسلم (٢٣٤).", "حاشية: (٢) ينظر شرح منتهى الإرادات لمنصور البهوتي ١/١٣٩.", "**فصول في ذكر الغسل(١)**", "**فصل فيما يوجب الغسل**", "الموجب للغسل سبعة أشياء(٢):", "**أحدها:** خروج المني على وجه الدفق واللذة، فأما إذا خرج لمرض أو إبردة(٣) لم يجب الغسل، فإن أحس بانتقال المني عند الشهوة فأمسك ذكره فلم يخرج، وجب الغسل في المشهور من الروايتين، فإن خرج بعد الغسل، فهو كبقية المني إذا ظهر بعد الغسل، وفي ذلك ثلاث روايات، إحداها: لا يجب الغسل، والثانية: يجب، والثالثة: إن ظهر قبل البول وجب الغسل، وإن ظهر بعده لم يجب.", "**والثاني:** تغييب الحشفة في الفرج، وسواء في ذلك القبل والدبر من جميع الحيوان الناطق والبهيم الحي من ذلك والميت.", "**والثالث:** إسلام الكافر سواء كان أصليا أو مرتدا، وقال أبو بكر(٤) من أصحابنا: هو مستحب.", "**والرابع:** الموت، فهذه الأربعة يشترك فيها الرجال والنساء، ويختص النساء بوجوب الغسل من الحيض والنفاس والولادة على أحد الوجهين.", "**فصل**"]], "ic": "book"}, {"story": ["كتاب أسرار الطهارة ومهماتها (٩ من ١٤)، ص٩٧", ["**في ذكر كيفية الغسل**", "الغسل على ضربين؛ كامل، ومجزئ، فالكامل يأتي فيه بعشرة أشياء: النية،", "حاشية: (١) ليس في (ظ).", "حاشية: (٢) ليست في (ظ).", "حاشية: (٣) الإبردة: برد في الجوف. القاموس المحيط: (برد).", "حاشية: (٤) هو أبو بكر عبد العزيز بن جعفر بن أحمد بن يزداد البغدادي المعروف بغلام الخلال صنف الشافي والتنبيه وزاد المسافر، وغيرها، توفي سنة ٣٦٣ هـ. طبقات الحنابلة ٢/١٢٠.", "والتسمية، وغسل اليدين ثلاثا، وغسل ما به من أذى، والوضوء، وأن يحثي على رأسه ثلاث حثيات من الماء يروي بها أصول شعره، ويفيض الماء على سائر بدنه ثلاثا، ويدلك بدنه بيده، ويبدأ بشقه الأيمن(١)، وينتقل من موضع غسله، فيغسل قدميه؛ لأنه إذا غسلهما ثم وضعهما على الأرض احتاج إلى غسلهما مرة أخرى وضاع الماء الأول.", "والمجزئ: أن يغسل فرجه، وينوي، ويسمي، ويعم بدنه بالغسل، وبأي مقدار من الماء أسبغ أجزاه، غير أنه يستحب أن لا ينقص في الغسل من صاع، وفي الوضوء من مد.", "**ذكر الأغسال المستحبة**", "**وهي ثلاثة عشر غسلا:** للجمعة، والعيدين، والكسوفين، والاستسقاء، ومن غسل الميت، وغسل المجنون والمغمى عليه، إذا أفاقا من غير احتلام، وغسل المستحاضة لكل صلاة، والغسل للإحرام، ولدخول مكة، والوقوف بعرفة، وللمبيت بمزدلفة، ولرمي الجمار، والطواف.", "**ذكر التيمم**", "من فقد الماء أو منعه من استعماله مانع، كسبع، أو جراح، أو كان يحتاج إلى شربه، أو لم يبع إلا بزيادة كثيرة جاز له التيمم.", "ولا يجوز أن يتيمم لفريضة حتى يدخل وقتها، ولا لنافلة في وقت النهي عن فعلها، فإذا تيمم صلى المكتوبة وقضى به فوائت إن كانت عليه ما دام الوقت(٢)، فإن كان بعض بدنه صحيحا وبعضه جريحا غسل الصحيح وتيمم للجريح، وإن كان معه ماء يسير(٣) يكفي بعض أعضائه استعمله وتيمم لما لم يصبه الماء، وإذا كان", "حاشية: (١) ليست في الأصل.", "حاشية: (٢) ليست في (ظ).", "حاشية: (٣) ليست في (ظ).", "معه إناآن نجس وطاهر واشتبها عليه أراقهما وتيمم، ومتى رجا وجود الماء استحب له تأخير التيمم إلى آخر الوقت."]], "ic": "book"}, {"story": ["كتاب أسرار الطهارة ومهماتها (١٠ من ١٤)، ص٩٩", ["ويقصد الصعيد الطيب، وهو التراب الطاهر الذي له غبار يعلق باليد، فإن خالطه ما لا يجوز التيمم به كالنورة(١) والجص، فحكمه حكم الماء إذا خالطته الطاهرات، وينوي بتيممه استباحة صلاة مفروضة، فإن نوى نفلا أو أطلق النية لم يجز أن يصلي به إلا النافلة، فإن كان جنبا وجب عليه أن ينوي الجنابة والحدث، ثم يسمي، وينزع خاتمه إن كان في يده خاتم، ويضرب بيديه وهما مفرجتا الأصابع ضربة واحدة على التراب، ويمسح وجهه بباطن أصابع يديه، وظاهر كفيه بباطن راحتيه. قال أبو الخطاب: هذا هو المسنون عند الإمام أحمد رحمه الله، وقال القاضي أبو يعلى: هذا صفة المجزئ، وإنما المسنون أن يضرب ضربتين يمسح بإحداهما جميع ما يجب غسله من الوجه مما لا يشق، ويمسح بالأخرى يديه إلى المرفقين، فيضع بطون أصابع يده اليسرى على ظهور أصابع يده اليمنى، ويمرها على ظهر الكف، فإذا بلغ الكوع قبض أطراف أصابعه على حرف الذراع، ثم يمرها إلى مرفقه، ثم يدير بطن كفه إلى بطن الذراع ويمره عليها، ويرفع إبهامه، فإذا بلغ الكوع أمر الإبهام على ظهر إبهام يده اليمنى، ثم يمسح بيده اليمنى يده اليسرى كذلك، ثم يمسح إحدى الراحتين بالأخرى ويخلل بين أصابعهما، ويجب ترتيب الوجه على اليدين والموالاة في إحدى الروايتين.", "وأما القسم الثالث من النظافة، وهو: التنظف عن الفضلات الظاهرة، وهي نوعان: أوساخ تزال، وأجزاء تحذف.", "فأما الأوساخ فثمانية:", "**الأول:** ما يجتمع في شعر الرأس من الدرن والقمل، فيستحب تنظيفه بالغسل والترجل والتدهين لإزالة الشعث، وقد كان رسول الله صلى الله عليه وسلم يدهن الشعر ويرجله", "حاشية: (١) النورة: حجر الكلس، ثم غلبت على أخلاط تضاف إلى الكلس من زرنيخ وغيره، وتستعمل لإزالة الشعر. «المصباح المنير»: (نور).", "ويأمر بذلك، ويقول: «ادهنوا غبا»(١). وروي أن رجلا دخل عليه وهو ثائر الرأس أشعث اللحية، فقال: «أما كان لهذا دهن يسكن به شعره»(٢).", "**الثاني:** ما يجتمع من الوسخ في معاطف الأذن، والمسح يزيل ذلك، وما يجتمع في قعر الصماخ، فينبغي أن ينظف برفق عند الخروج من الحمام، فإن كثرة ذلك ربما أضر بالسمع.", "**الثالث:** ما يجتمع في داخل الأنف من الرطوبات، والاستنشاق والاستنثار يزيل ذلك.", "**الرابع:** ما يجتمع على الأسنان وأطراف اللسان من القلح، والسواك، والمضمضة يزيلانه.", "**الخامس:** ما يجتمع في اللحية من الوسخ والقمل، وإزالة ذلك بالغسل والتسريح، وقد كان رسول الله صلى الله عليه وسلم لا يفارقه المشط والمدرى في سفر ولا حضر(٣). وكان ينظر في المرآة، وربما ظن الجاهل أن هذا من حب التزين المذموم وليس كذلك، لأن الإنسان لا يؤثر أن يرى إلا على وجه حسن، وإذا قصد ذلك كان قصده صحيحا.", "**السادس:** وسخ البراجم(٤)."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "من فقد الماء أو منعه من استعماله مانع، كسبع، أو جراح، أو كان يحتاج إلى شربه، أو لم يبع إلا ____ كثيرة جاز له التيمم", "o": ["بزيادة", "للمعتبر", "تفضل", "الوحش"], "h": "راجع: ص٩٨"}, {"t": "fill", "d": 2, "q": "الحمد لله الذي بنى الأبدان على الأدران وأمر بالنظافة، وخلق الماء ذا رقة وقوة ولطافة، وأكثر من ____ لعموم الحاجة إليه رحمة ورأفة", "o": ["إيجاده", "مفروضة", "المنكر", "ليؤثر"], "h": "راجع: ص٨٥"}, {"t": "fill", "d": 2, "q": "ويستجلب درور البول، وليس من الشريعة في شيء، وليرش المتوسوس على فرجه الماء ليدفع ____ إن عرضت", "o": ["وسوسته", "المكي", "والأفكار", "بالموصل"], "h": "راجع: ص٨٩"}, {"t": "fill", "d": 2, "q": "ويكره الإكثار من الماء في ____، فقد أخبرنا ابن الحصين قال", "o": ["الوضوء", "خطئي", "صيانة", "الأوغاد"], "h": "راجع: ص٩٣"}, {"t": "fill", "d": 2, "q": "والثاني: خروج النجاسات من بقية البدن، فإن كانت بولا أو عذرة فلا فرق بين قليلها وكثيرها، وإن كانت غير ذلك لم ____ قليلها ونقض كثيرها، وهو ما فحش في", "o": ["ينقض", "أجذم", "لأرى", "اللائق"], "h": "راجع: ص٩٦"}, {"t": "fill", "d": 2, "q": "والثاني: تغييب الحشفة في الفرج، وسواء في ذلك القبل والدبر من ____ الحيوان الناطق والبهيم الحي من ذلك", "o": ["جميع", "النبوة", "معقبات", "والأرض"], "h": "راجع: ص٩٧"}]}, {"t": "كتاب أسرار الطهارة ومهماتها - القسم ٣ من ٣", "b": [{"story": ["كتاب أسرار الطهارة ومهماتها (١١ من ١٤)، ص١٠٠", ["**السابع:** تنظيف الرواجب، فإن الوسخ قد يجتمع فيهن، قال ابن الأنباري: البراجم عند العرب القصوص التي في فصول ظهور الأصابع تبدو إذا جمعت وتغمض إذا بسطت، والرواجب: ما بين البراجم بين كل برجمتين راجبة.", "**الثامن:** الدرن الذي يجتمع على جميع البدن برشح العرق وغبار الطريق وذلك يزيله الحمام.", "حاشية: (١) قال الزبيدي في إتحاف السادة المتقين ٢/٦٢٦: وأما قوله: ادهنوا غبا. فقال ابن الصلاح: لم أجد له أصلا، وقال النووي: غير معروف.", "حاشية: (٢) أورده الزبيدي في الإتحاف ٢/٦٢٧.", "حاشية: (٣) أورده الزبيدي في الإتحاف ٢/٦٢٨، والمدرى: المرآة.", "حاشية: (٤) البراجم: معاطف ظهور الأنامل.", "**فصل**", "ولا بأس بدخول الحمام، فقد دخله جماعة من أصحاب رسول الله صلى الله عليه وسلم، لكن على داخله صيانة عورته من نظر الغير إليها ولمسه إياها.", "وينبغي للداخل أن يتحين وقت فراغ الحمام فإنه أستر إذ لو اجتمع فيه أهل خير ودين لم يؤمن في حركاتهم من انعطاف الأزر فيقع بصر بعضهم على عورة بعض.", "وينبغي دخول الحمام بتدريج إلى أن يدخل إلى المكان الحار، وأن لا يصب من الماء إلا ما يحتاج إليه خصوصا من الماء الحار؛ لأن كلفته أكثر، وأن يتذكر بحرارته حر النار، فإن فكرة المؤمن لا تزال تجول في كل شيء من أمور الدنيا، فتذكر به أمور الآخرة؛ لأن الغالب على المؤمن أمر الآخرة، وكل إناء ينضح بما فيه، ألا ترى أنه لو دخل بزاز ونجار وبناء وحائك إلى دار معمورة رأيت البزاز ينظر إلى الفرش يتأمل قيمته، والحائك ينظر إلى نسج الثياب، والنجار إلى السقف، والبناء إلى الحيطان، فكذلك المؤمن إن رأى ظلمة ذكر ظلمة القبر، وإن سمع صوتا هائلا تذكر نفخ الصور، وإن رأى نعيما ذكر الجنة، وإن رأى عذابا ذكر النار.", "ولا يسن في الحمام سلام، ويكره دخوله قريبا من الغروب وما بين العشائين، فإنه وقت انتشار الشياطين، ولا بأس بالتدليك والتغميز لكنه يمنع المدلك من مس عورته، وقد ذكرت مما يستعمل في الحمام من جهة الطب في كتاب «لقط المنافع» أشياء نافعة ليس هذا الكتاب موضعها، فلتطالع من ثم.", "**فصل**", "وأما الأجزاء التي تحذف فثمانية أيضا:", "**الأول:** شعر الرأس، وما كان رسول الله صلى الله عليه وسلم يحلق رأسه إلا في الحج، وكذلك أصحابه، وعامة العلماء بعدهم، واختلفت الرواية عن الإمام أحمد رحمه الله: هل يكره حلق الرأس أم لا؟ ويكره القزع، وهو: أن يحلق بعض الشعر ويترك بعضه.", "**والثاني:** شعر الشارب، وقد قال عليه الصلاة والسلام: «احفوا الشوارب»(١). وذلك يكون بالاستقصاء في القص، ولما كانت الفرس تطيل شواربها وتقص لحاها أمر رسول الله صلى الله عليه وسلم بعكس ذلك فقال: «احفوا الشوارب واعفوا اللحى». وأما حلق الشارب فمكروه."]], "ic": "book"}, {"story": ["كتاب أسرار الطهارة ومهماتها (١٢ من ١٤)، ص١٠٢", ["**الثالث:** شعر الإبط ويستحب نتفه، وقد كان الشافعي رحمه الله يقول: إني لأعلم أن السنة نتفه، ولكني لا أقوى على ذلك. وإذا كان المقصود النظافة جاز خلعه إما بالنورة أو بالحديد.", "**الرابع:** شعر العانة، ويستحب حلقه بالموسى أو بالنورة، ولا يؤخر أكثر من أربعين يوما.", "**الخامس:** تقليم الأظفار، وفي ذلك تحسين للصورة وإزالة للوسخ، وقد روي أن النبي صلى الله عليه وسلم بدأ بمسبحة يده اليمنى إلى الخنصر، وابتدأ في اليسرى بالخنصر إلى الإبهام، ختم بإبهام اليمنى(٢)، فإن ثبت هذا عنه فوجهه أنه بدأ باليد؛ لأنها أشرف من الرجل، ثم باليمنى؛ لأنها أشرف من اليسار، ثم بالمسبحة؛ لأنها المشيرة بالتوحيد، ثم بما عن يمينها لاستحباب إدارة الظهور وغيره عن اليمين، ثم إذا وضعت الكف على الكف كانت في حكم دائرة فاقتضى ترتيب الدور البداية بخنصر اليسرى.", "فأما أصابع الرجل، فالأولى أن يبتدئ بخنصر اليمنى ويختم بخنصر اليسرى، كما في التخليل إذ لا مسبحة في الرجل.", "فهذه الأسرار لا تكاد تقع للعالم ابتداء إنما يدركها الأنبياء بنور النبوة ثم تنبه العلماء لاستنباط معانيها ليتحقق الفضل بين الوارث والموروث، فإن الموروث هو الذي حصل المال له فاستقل بتحصيله، والوارث لم يحصله ابتداء إنما تلقاه من المحصل.", "حاشية: (١) أخرجه البخاري (٥٨٩٣)، ومسلم (٢٥٩)(٥٢)، والنسائي في الكبرى (٩٢٩٤) وابن أبي شيبة ٨/٥٦٤، والترمذي (٢٧٦٣)، وأحمد (٤٦٥٤) من حديث ابن عمر.", "حاشية: (٢) ينظر المقنع مع الشرح الكبير والإنصاف ١/٢٥٢ ـ ٢٥٣.", "**السادس:** زيادة السرة، وذلك يقطع في أول زمان الولادة.", "**السابع:** القلفة، وقد ذهب بعض العلماء إلى أن الختان سنة، وهو عندنا واجب، وينبغي أن لا يبالغ في خفض(١) المرأة، فقد قال صلى الله عليه وسلم لأم عطية وكانت تخفض: «أشمي ولا تنهكي، فإنه أسرى للوجه، وأحظى عند الزوج»(٢) أي: أكثر لماء الوجه ودمه، وأجود في الجماع، فانظر إلى ما لاحظه صلى الله عليه وسلم من مصالح الدين والدنيا لتعلم أنه أعطي الكمال.", "**الثامن:** ما طال من اللحية، فقد كان ابن عمر في جماعة يقبضون على لحاهم ويأخذون ما بعد القبضة وكرهه آخرون لقوله: «اعفوا اللحى»، والأول أصح؛ لأن التكثير ينبغي أن يكون إلى حد ولا يخرج إلى التشويه.", "**فصل**"]], "ic": "book"}, {"story": ["كتاب أسرار الطهارة ومهماتها (١٣ من ١٤)، ص١٠٣", ["ويكره للانسان نتف الشيب، والمسنون خضابه، وقد أمر رسول الله صلى الله عليه وسلم بتغيير الشيب، فروى الزبير، وعبد الرحمن بن عوف، وابن عمر، وأبو هريرة، وأنس، وعائشة، وأسماء عن رسول الله صلى الله عليه وسلم أنه قال: «غيروا الشيب»(٣)، وفي بعض رواياتهم: «ولا تشبهوا باليهود والنصارى». وأمر صلى الله عليه وسلم بالخضاب؛ ففي الصحيحين من حديث أبي هريرة عن النبي صلى الله عليه وسلم أنه قال: «إن اليهود والنصارى لا يصبغون، فخالفوهم»(٤). وروى ابن عباس عن النبي صلى الله عليه وسلم أنه قال: «اختضبوا فإن الملائكة", "حاشية: (١) الخفض للمرأة كالختان للرجل.", "حاشية: (٢) أخرجه الطبراني في المعجم الكبير (٨١٣٧)، والحاكم ٣/٥٢٥، من حديث الضحاك بن قيس.", "حاشية: (٣) أخرجه من حديث الزبير: أحمد في المسند (١٤١٥)، ومن حديث ابن عمر: النسائي ٨/١٣٧، ومن حديث أبي هريرة: الترمذي (١٧٥٢)، والبيهقي ٧/٣١١، ومن حديث أنس أحمد (١٣٥٨٨)، والبزار (٢٩٨٠). ومن حديث أسماء: أحمد (٢٦٩٥٦)، وابن حبان (٣٢٠٨)، والطبراني في الكبير ٢٤/٢٣٧، والحاكم ٣/٤٦، والبيهقي ٩/١٢١، ولم أقف عليه من حديث ابن عوف وعائشة.", "حاشية: (٤) أخرجه البخاري (٥٨٩٩)، ومسلم (٢٦٠٣)(٨٠).", "لتستبشر لخضاب المؤمن»(١). وروى صالح ابن الإمام أحمد بن حنبل قال: دخل على أبي رجل قد خضب، فقال: إني لأرى الرجل يحيي شيئا من السنة فأفرح به(٢).", "فأما من يختضب فقد كان قوم يخضبون بالحناء والكتم، أخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا عبد الرحمن بن مهدي قال: حدثنا سلام بن أبي مطيع عن عثمان بن عبد الله بن موهب، قال: دخلنا على أم سلمة، فأخرجت إلينا شعرا من شعر رسول الله صلى الله عليه وسلم مخضوبا بالحناء والكتم(٣). وكذلك(٤) روى أبو رمثة قال: كان رسول الله صلى الله عليه وسلم يخضب بالحناء، والكتم(٥). وكذلك(٤) كان يفعل أبو بكر الصديق، وعمر بن الخطاب، وأبو عبيدة، ووائلة رضي الله عنهم، وكان آخرون يختضبون بالحناء البحت، أخبرنا علي بن عبيد الله قال: أخبرنا أبو محمد عبد الله بن محمد الصريفيني قال: أخبرتنا أمة السلام بنت أحمد بن كامل، قالت: أخبرنا محمد بن إسماعيل البندار، قال: أخبرنا أحمد بن عبد الله بن علي بن سويد بن منجوف، قال: حدثنا عبد الرحمن بن مهدي، قال: حدثنا سفيان عن إياد ابن لقيط عن أبي رمثة، قال: أتيت النبي صلى الله عليه وسلم فرأيته قد لطخ لحيته بالحناء(٦). وقد روينا عن عمر بن الخطاب، وصهيب، وأبي هريرة، وعبد الله بن أبي أوفى، وأنس بن مالك أنهم كانوا يخضبون بالحناء، وفعله من كبار التابعين ومن بعدهم محمد ابن الحنفية، وعطاء، وابن سيرين، وعمرو بن دينار، وجعفر بن محمد"]], "ic": "book"}, {"story": ["كتاب أسرار الطهارة ومهماتها (١٤ من ١٤)، ص١٠٤", ["حاشية: (١) أورده العجلوني في كشف الخفاء ١/٦٦، وقال: كذب موضوع.", "حاشية: (٢) المقنع مع الشرح الكبير والإنصاف ١/٢٦٤.", "حاشية: (٣) أخرجه البخاري (٥٨٩٦) و(٥٨٩٨)، وأحمد (٢٦٥٣٥)، وابن ماجه (٣٦٢٣)، والطبراني في الكبير ٢٣/٧٦٥.", "حاشية: (٤) سقط من (ظ).", "حاشية: (٥) أخرجه أحمد (١٧٤٩٧)، والطبراني في الكبير ٢٢/٧٢٦، والبيهقي في دلائل النبوة ١/٢٣٨.", "حاشية: (٦) أخرجه أبو داود (٤٢٠٨).", "ومنصور بن المعتمر، والثوري، وابن مهدي، وأبو سليمان الداراني، والشافعي وأحمد بن حنبل في آخرين.", "وكان آخرون يخضبون بالصفرة؛ أخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا القطيعي، قال: أخبرنا عبد الله بن أحمد، قال: حدثني أبي، قال: حدثنا عبد الرزاق، قال: حدثنا مالك عن سعيد بن أبي سعيد المقبري عن عبيد بن جريج أنه قال لعبد الله بن عمر: يا أبا عبد الرحمن، رأيتك تصبغ بالصفرة. فقال: إني رأيت رسول الله صلى الله عليه وسلم يصبغ بها، فأنا أحب أن أصبغ بها. أخرجاه في الصحيحين(١). وروى زيد بن أسلم عن عبيد قال: رأيت ابن عمر يصفر لحيته، فقلت له في ذلك، فقال: إني رأيت رسول الله صلى الله عليه وسلم يصفر لحيته(٢). وممن كان يفعل ذلك عثمان بن عفان، ومعاوية، وابن عمر، والمقداد، وابن عباس، والمغيرة بن شعبة، وأنس، وسهل بن سعد، وجابر بن عبد الله في آخرين.", "وكان آخرون يخضبون بالسواد منهم: الحسن، والحسين، وعبد الله بن جعفر، وسعد بن أبي وقاص، وعقبة بن عامر، والمغيرة بن شعبة، وجرير بن عبد الله، وقد روينا عن عثمان بن عفان أيضا، ومن كبار التابعين ومن بعدهم: عمرو بن عثمان بن عفان، وعلي بن عبد الله بن العباس، وموسى بن طلحة، وأبو سلمة بن عبد الرحمن، والزهري، وهشام بن عبد الملك، والمنصور، وعبد الله بن المعتمر، والحجاج بن أرطاة، ومحمد بن إسحاق، وابن أبي ليلى، وأيوب السختياني، وأبو عبيد القاسم بن سلام في آخرين.", "وإنما يكره هذا إذا قصد به التدليس، فإذا سلم من تدليس، فلا بأس به.", "**آخر كتاب الطهارة.**", "حاشية: (١) أخرجه البخاري (١٦٦) و(٥٨٥١)، ومسلم (١١٨٧) (٢٥).", "حاشية: (٢) ينظر التخريج السابق."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "والخامس: مس فرج الآدمي قبلا كان أو دبرا، كبيرا أو صغيرا، حيا أو ميتا، وهل ينقض مس الذكر بالذراع؟ على ____، وعن الإمام أحمد: لا ينقض مس الفرج", "o": ["روايتين", "مبرورا", "التصحيف", "واتباعا"], "h": "راجع: ص٩٦"}, {"t": "fill", "d": 2, "q": "ويأمر بذلك، ويقول: «ادهنوا غبا». وروي أن رجلا دخل عليه وهو ____ الرأس أشعث اللحية، فقال: «أما كان لهذا دهن يسكن به", "o": ["ثائر", "أهوال", "كسفيان", "أعلى"], "h": "راجع: ص١٠٠"}, {"t": "fill", "d": 2, "q": "والتسمية، وغسل اليدين ثلاثا، وغسل ما به من أذى، والوضوء، وأن يحثي على رأسه ثلاث حثيات من الماء يروي بها أصول شعره، ويفيض الماء على سائر بدنه ثلاثا، ويدلك بدنه بيده، ويبدأ بشقه الأيمن، وينتقل من موضع غسله، ____ قدميه؛ لأنه إذا غسلهما ثم وضعهما على الأرض احتاج إلى غسلهما مرة أخرى وضاع الماء الأول", "o": ["فيغسل", "ركوعها", "بيوت", "اصطلح"], "h": "راجع: ص٩٨"}, {"t": "fill", "d": 2, "q": "من المستحب لمن أحدث أن يتطهر ليستديم ____، أخبرنا ابن الحصين قال", "o": ["الطهارة", "الدمثة", "لخلوص", "بقارئه"], "h": "راجع: ص٩٠"}, {"t": "fill", "d": 2, "q": "والرابع: الموت، فهذه الأربعة يشترك فيها الرجال والنساء، ويختص النساء ____ الغسل من الحيض والنفاس والولادة على أحد", "o": ["بوجوب", "الألباب", "ويقرأ", "يسيرا"], "h": "راجع: ص٩٧"}, {"t": "fill", "d": 2, "q": "وفي حديث أبي بكر رضي الله عنه عن النبي صلى الله عليه ____ أنه قال", "o": ["وسلم", "جمام", "بباله", "أخاف"], "h": "راجع: ص٩١"}]}], "sum": [["الصفحات", "ص٨٥ - ص١٠٦"]], "_nq": 18}, {"id": "l14", "title": "كتاب أسرار الصلاة ومهماتها", "group": "كتاب أسرار الصلاة ومهماتها", "map": {"center": "كتاب\nأسرار الصلاة", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "كتاب أسرار الصلاة ومهماتها", "b": [{"pic": ["books", "book"], "cap": "ص١٠٧ - ص١٠٧"}, {"story": ["كتاب أسرار الصلاة ومهماتها، ص١٠٧", ["الحمد لله الذي لا حاجب له يرشى، ولا وزير يؤتى، ولا باب يغلق عن من يناجي أو يطلب قوتا، من شاء دخل عليه بالصلاة فقد هيأ لها بيوتا جعل المتفل بها محبوبا، وكتب التارك لفرضها ممقوتا ﴿إِنَّ ٱلصَّلَوٰةَ كَانَتْ عَلَى ٱلْمُؤْمِنِينَ كِتَٰبًا مَّوْقُوتًا﴾ [النساء: ١٠٣]، أحمده حمد من إذا سجد اقترب، وأصلي على رسوله محمد أشرف العجم والعرب، وعلى أصحابه وأتباعه ما دخل وقت فرض فوجب، وسلم تسليما كثيرا.", "أما بعد: فإن الصلاة عماد الدين، ونحن نذكر ما لا بد للمريد منه من أعمالها الظاهرة وأسرارها الباطنة، ونكشف من دقائق معانيها الخفية في الخشوع والإخلاص والنية ما يصلح كشفه، فأما تفاريعها النادرة ووقائعها الشاذة، فإنما يؤخذ من كتب الفقه، وقد رتبنا هذا الكتاب سبعة أبواب:", "الباب الأول: في فضائل الصلوات.", "الباب الثاني: في تفصيل الأعمال الظاهرة من الصلوات.", "الباب الثالث: في تفصيل الأعمال الباطنة منها.", "الباب الرابع: في الإمامة والقدوة.", "الباب الخامس: في صلاة الجماعة(١) وآدابها.", "الباب السادس: في مسائل متفرقة تعم بها البلوى.", "الباب السابع: في التطوعات.", "حاشية: (١) في (ظ): «الجمعة»."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "أما بعد: فإن الصلاة عماد الدين، ونحن نذكر ما لا بد للمريد منه من أعمالها الظاهرة وأسرارها الباطنة، ونكشف من دقائق ____ الخفية في الخشوع والإخلاص والنية ما يصلح كشفه، فأما تفاريعها النادرة ووقائعها", "o": ["معانيها", "الكاسد", "صحبتني", "والأهل"], "h": "راجع: ص١٠٧"}]}], "sum": [["الصفحات", "ص١٠٧ - ص١٠٧"]], "_nq": 1}, {"id": "l15", "title": "الباب الأول في فضائل الصلوات والركوع والسجود والجماعة والأذان وغير ذلك", "group": "كتاب أسرار الصلاة ومهماتها", "map": {"center": "الباب\nالأول في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الأول في فضائل الصلوات والركوع والسجود والجماعة والأذان وغير ذلك - القسم ١ من ٢", "b": [{"pic": ["books", "book"], "cap": "ص١٠٨ - ص١١٨"}, {"story": ["الباب الأول في فضائل الصلوات والركوع والسجود والجماعة والأذا (١ من ٨)، ص١٠٨", ["**في فضائل الصلوات والركوع والسجود والجماعة والأذان وغير ذلك**", "**فضيلة الأذان والمؤذنين**", "قال الله عز وجل: ﴿وَمَنْ أَحْسَنُ قَوْلًا مِمَّن دَعَا إِلَىٰ ٱللَّهِ﴾ [فصلت: ٣٣]، قيل: هو المؤذن، أخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أحمد بن جعفر، قال: حدثنا عبد الله بن أحمد، قال: حدثني أبي قال: حدثنا عبد الملك بن عمرو، قال: حدثنا هشام عن يحيى عن أبي سلمة عن أبي هريرة عن النبي صلى الله عليه وسلم قال: «إذا نودي للصلاة أدبر الشيطان وله ضراط حتى لا يسمع الأذان، فإذا قضي الأذان أقبل، فإذا ثوب بها أدبر، فإذا قضي التثويب أقبل حتى يخطر بين المرء وقلبه ـ أو قال: ونفسه ـ فيقول: اذكر كذا وكذا، لما لم يكن يذكر، حتى يظل الرجل لا يدري كم صلى» أخرجاه في الصحيحين(١). والتثويب ههنا الإقامة، كذلك قال الخطابي. وفي أفراد مسلم من حديث جابر عن النبي صلى الله عليه وسلم أنه قال: «إذا أذن المؤذن هرب الشيطان حتى يكون بالروحاء»(٢) وهي من المدينة على ستة وثلاثين ميلا. أخبرنا هبة الله بن محمد قال: أخبرنا أبو علي بن المذهب، قال: أخبرنا أحمد بن جعفر قال: أخبرنا عبد الله بن أحمد، قال: حدثني أبي قال: حدثنا ابن النمير ويعلى قالا: حدثنا طلحة ـ يعني بن يحيى ـ عن عيسى بن طلحة قال: سمعت معاوية يقول: سمعت رسول الله صلى الله عليه وسلم يقول: «إن المؤذنين أطول الناس أعناقا يوم القيامة»", "حاشية: (١) أخرجه البخاري (٦٠٨)، ومسلم (٣٨٦)(١١).", "حاشية: (٢) أخرجه مسلم (٣٨٨).", "انفرد بإخراجه مسلم(١). وروى ابن عمر عن النبي صلى الله عليه وسلم أنه قال: «من أذن سبع سنين كتب الله له براءة من النار»(٢).", "**رفع الصوت بالأذان**", "أخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: حدثنا القطيعي قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: قرأت على عبد الرحمن: مالك عن عبد الرحمن بن عبد الله بن عبد الرحمن بن أبي صعصعة المازني عن أبيه أنه أخبره أن أبا سعيد قال له: إني أراك تحب الغنم والبادية، فإذا كنت في غنمك أو باديتك فأذنت بالصلاة، فارفع صوتك بالنداء، فإنه لا يسمع مدى صوت المؤذن جن ولا إنس ولا شيء إلا شهد له يوم القيامة. قال أبو سعيد: سمعته من رسول الله صلى الله عليه وسلم. انفرد بإخراجه البخاري(٣). وروى أبو داود في سننه من حديث أبي هريرة عن النبي صلى الله عليه وسلم أنه قال: «المؤذن يغفر له مدى صوته، ويشهد له كل رطب ويابس»(٤).", "**إجابة المؤذن بمثل قوله**"]], "ic": "book"}, {"story": ["الباب الأول في فضائل الصلوات والركوع والسجود والجماعة والأذا (٢ من ٨)، ص١٠٩", ["أخبرنا هبة الله بن محمد قال: أخبرنا الحسن بن علي قال: أخبرنا أحمد بن جعفر قال: أخبرنا عبد الله بن أحمد قال: حدثنا مصعب الزبيري وعبد الله بن عون قالا: حدثنا مالك بن أنس عن الزهري عن عطاء بن يزيد عن أبي سعيد الخدري قال: قال رسول الله صلى الله عليه وسلم: «إذا سمعتم النداء فقولوا كما يقول المؤذن» أخرجاه في الصحيحين(٥). وفي أفراد مسلم من حديث عمر بن الخطاب قال: قال", "حاشية: (١) أخرجه مسلم (٣٨٧)(١٤).", "حاشية: (٢) أخرجه المصنف في العلل المتناهية في الأحاديث الواهية (٦٦٧)، وقال: هذا حديث لا يصح.", "حاشية: (٣) أخرجه البخاري (٦٠٩)، و(٣٢٩٦)، و(٧٥٤٨)، وهو في موطأ مالك ١/٦٩، ومسند الإمام أحمد (١١٣٠٥).", "حاشية: (٤) أخرجه أبو داود (٥١٥).", "حاشية: (٥) أخرجه البخاري (٦١١) ومسلم (٣٨٣)(١٠).", "رسول الله صلى الله عليه وسلم: «إذا قال المؤذن: الله أكبر الله أكبر، فقال أحدكم: الله أكبر الله أكبر، فقال: أشهد أن لا إله إلا الله، فقال: أشهد أن لا إله إلا الله، ثم قال: أشهد أن محمدا رسول الله، فقال: أشهد أن محمدا رسول الله، ثم قال: حي على الصلاة، فقال: لا حول ولا قوة إلا بالله، ثم قال: حي على الفلاح، فقال: لا حول ولا قوة إلا بالله، ثم قال: الله أكبر الله أكبر فقال: الله أكبر الله أكبر، ثم قال: لا إله ه عز وجل، أو أجلس في مجالس ينتقى فيها طيب الكلام، كما ينتقى جيد التمر، أو أن أسير في سبيل الله عز وجل. وقال كعب: إن العبد ليحط عنه الخطايا ما دام ساجدا. وكان علي بن عبد الله بن العباس يسجد كل يوم ألف سجدة فسمي السجاد. وقال سعيد بن جبير: ما آسى على شيء من الدنيا إلا على السجود.", "حاشية: (١) أخرجه مسلم (٤٨٨).", "حاشية: (٢) أخرجه مسلم (٤٨٩)(٢٦).", "حاشية: (٣) أخرجه مسلم (٨١).", "حاشية: (٤) أخرجه مسلم (٤٨٢)(٢١٥).", "**فضيلة الخشوع وجمع الهم في الصلاة**"]], "ic": "book"}, {"story": ["الباب الأول في فضائل الصلوات والركوع والسجود والجماعة والأذا (٨ من ٨)، ص١١٧", ["قد ذكرنا آنفا من حديث عثمان بن عفان: «ما من امرئ مسلم تحضره صلاة مكتوبة، فيحسن وضوءها وخشوعها وركوعها إلا كانت كفارة لما قبلها من الذنوب، ما لم تؤت كبيرة»(١). ومن حديثه أيضا عن النبي صلى الله عليه وسلم أنه قال: «من صلى ركعتين لا يحدث فيهما نفسه، غفر له»(٢). وذكرنا عن عقبة بن عامر نحو ذلك(٣). وقد أخبرنا ابن المذهب قال: أخبرنا ابن الحصين قال: أخبرنا أحمد بن جعفر قال: أخبرنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا شريح قال: حدثنا عبد العزيز ـ يعني الدراوردي ـ عن زيد بن أسلم عن زيد بن خالد الجهني قال: قال رسول الله صلى الله عليه وسلم: «من صلى سجدتين لا يسهو فيهما غفر الله له ما تقدم من ذنبه»(٤). وقال ابن عباس: ركعتان مقتصدتان في تفكر خير من قيام ليلة والقلب ساه. وكان ابن الزبير إذا قام في(٥) الصلاة كأنه عود من الخشوع، وكان يسجد فتنزل العصافير على ظهره ولا تحسبه إلا جذم حائط. وصلى يوما في الحجر فجاء حجر قذافة فذهب ببعض ثوبه فما انفتل. وقال ميمون بن جابان: ما رأيت مسلم بن يسار ملتفتا في صلاة قط، ولقد انهدمت ناحية من المسجد ففزع أهل السوق لهدمه وإنه لفي المسجد في صلاة فما التفت. وروى عنه ابنه عبد الله قال: كان أبي مسلم بن يسار إذا دخل المنزل سكت أهل البيت فلا يسمع لهم كلام وإذا قام يصلي تكلموا وضحكوا. وكان علي بن الحسين إذا توضأ اصفر لونه فيقول له أهله: ما هذا الذي يعتادك عند الوضوء؟ فيقول: أتدرون بين يدي من أريد أن أقوم؟!", "حاشية: (١) تقدم تخريجه في الصفحة ١١٤.", "حاشية: (٢) أخرجه البخاري (١٥٩) و(١٩٣٤)، ومسلم (٢٢٦) (٣).", "حاشية: (٣) تقدم في الصفحة ٩٥ ـ ٩٦.", "حاشية: (٤) أخرجه أحمد (٢١٦٩١).", "حاشية: (٥) في (ظ): «
