الطلاق", "group": "الكتاب التاسع: النكاح والطلاق", "map": {"center": "الباب الرابع\nالنكاح والطلاق", "nodes": [{"t": "معناه، وأدلة مشروعيته، وحكمته", "s": []}, {"t": "حكم الطلاق، ومتى يكون؟", "s": []}, {"t": "ألفاظ الطلاق", "s": []}, {"t": "طلاق السنة وحكمه", "s": []}, {"t": "الطلاق البدعي وحكمه", "s": []}]}, "paras": [{"t": "الباب الرابع: في الطلاق", "b": [{"pic": ["scroll", "book"], "cap": "ص313-319"}, {"story": ["المسألة الأولى: معناه، وأدلة مشروعيته، وحكمته", ["أ- تعريف الطلاق:", "الطلاق لغة: التخلية، يقال: طلقت الناقة إذا سرحت حيث شاءت.", "وشرعا: حل قيد النكاح أو بعضه.", "ب- من يصح طلاقه:", "يصح إيقاع الطلاق من الزوج البالغ العاقل المميز المختار الذي يعقله، أو من وكيله، فلا يقع طلاق غير الزوج، ولا الصبي، ولا المجنون، ولا السكران، ولا المكره، ولا الغضبان غضبا شديدا لا يدري معه ما يقول.", "ج- مشروعية الطلاق:", "الأصل في الزواج استمرار الحياة الزوجية بين الزوجين، وقد شرع الله تعالى أحكاما كثيرة وآدابا جمة في الزواج لاستمراره، وضمان بقائه. إلا أن هذه الآداب قد لا تكون مرعية من قبل الزوجين أو أحدهما، فيقع التنافر بينهما حتى لا يبقى مجال للإصلاح، فكان لا بد من تشريع أحكام تؤدي إلى حل عقدة الزواج على نحو لا تهدر فيه حقوق أحد الزوجين، ما دامت أسباب التعايش قد باتت معدومة فيما بينهما.", "والطلاق مشروع بالكتاب والسنة والإجماع:", "أما الكتاب: فقد قال تعالى: ﴿الطلاق مرتان فإمساك بمعروف أو تسريح بإحسان﴾ [البقرة: 229]. وقال عز وجل: ﴿يا أيها النبي إذا طلقتم النساء فطلقوهن لعدتهن﴾ [الطلاق: 1]. ومن السنة: حديث ابن عمر رضي الله عنهما أنه طلق امرأته وهي حائض، فقال النبي ﷺ لعمر: «ليراجعها، فإذا طهرت فإن شاء فليطلقها».", "وأجمع علماء الأمة على جواز الطلاق ومشروعيته.", "د- حكمة مشروعيته:", "شرع الطلاق لأن فيه حلا للمشكلات الزوجية عند الحاجة إليه، وبخاصة عند عدم الوفاق، وحلول البغضاء التي لا يتمكن الزوجان معها من إقامة حدود الله، واستمرار الحياة الزوجية، وهو بذلك من محاسن الدين الإسلامي."]], "ic": "scroll"}, {"story": ["المسألة الثانية: حكم الطلاق، ومتى يكون؟", ["الأصل في الطلاق أن يكون جائزا، مباحا، عند الضرورة والحاجة إليه؛ كسوء خلق المرأة وسوء عشرتها، ويكره من غير حاجة إليه؛ لإزالته النكاح المشتمل على المصالح المندوب إليها: من إعفاف نفسه، وطلب النسل، وغير ذلك.", "ويحرم الطلاق في بعض الأحوال، كما سيأتي بيانه في الكلام على الطلاق البدعي، وقد يكون واجبا على الشخص؛ كما لو علم بفجور زوجته وتبين زناها؛ لئلا يكون ديوثا، ولئلا تلحق به ولدا من غيره، وكذا لو كانت الزوجة غير مستقيمة في دينها، كما لو كانت تترك الصلاة، ولم يستطع تقويمها."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: ألفاظ الطلاق", ["وألفاظ الطلاق تنقسم إلى قسمين:", "1- ألفاظ صريحة: وهي الألفاظ الموضوعة له، التي لا تحتمل غيره، وهي لفظ الطلاق وما تصرف منه، من فعل ماض، مثل: طلقتك، أو اسم فاعل، مثل: أنت طالق، أو اسم مفعول، مثل: أنت مطلقة. فهذه الألفاظ تدل على إيقاع الطلاق، دون الفعل المضارع أو الأمر، مثل: تطلقين واطلقي.", "2- ألفاظ كنائية: وهي الألفاظ التي تحتمل الطلاق وغيره، مثل قوله لزوجته: أنت خلية، وبرية، وبائن، وحبلك على غاربك، والحقي بأهلك، ونحوها.", "والفرق بين الألفاظ الصريحة وألفاظ الكناية في الطلاق: أن الصريحة يقع بها الطلاق ولو لم ينوه، سواء كان جادا أو هازلا أو مازحا؛ لقوله ﷺ: «ثلاث جدهن جد، وهزلهن جد: النكاح، والطلاق، والرجعة». وأما الكناية فلا يقع بها طلاق، إلا إذا نواه بنية مقارنة للفظه؛ لأن هذه الألفاظ تحتمل الطلاق وغيره، فلا يقع إلا بنيته، إلا إذا وجدت قرينة تدل على أنه نواه، فلا يصدق قوله."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: طلاق السنة وحكمه", ["أ- طلاق السنة:", "يقصد بطلاق السنة: الطلاق الذي أذن فيه الشارع، وهو الواقع طبقا لتعاليم الشريعة الإسلامية، ويكون ذلك بأمرين:", "1- عدد الطلاق.", "2- حال إيقاعه.", "فالسنة إذا اضطر الزوج إلى الطلاق: أن يطلق طلقة واحدة في طهر لم يجامعها فيه، ويتركها فلا يتبعها طلاقا آخر حتى تنقضي عدتها؛ لقوله تعالى: ﴿يا أيها النبي إذا طلقتم النساء فطلقوهن لعدتهن﴾ [الطلاق: 1]، أي: في الوقت الذي يشرعن فيه في استقبال العدة وهو الطهر؛ إذ زمن الحيض لا يحسب من العدة.", "قال ابن عمر وابن عباس وجماعة في هذه الآية: الطهر من غير جماع.", "ب- حكم طلاق السنة:", "أجمع العلماء على أن طلاق السنة واقع؛ لقوله تعالى: ﴿يا أيها النبي إذا طلقتم النساء فطلقوهن لعدتهن﴾ [الطلاق: 1]، أي: في زمن الطهر."]], "ic": "scroll"}, {"story": ["المسألة الخامسة: الطلاق البدعي وحكمه", ["أ- الطلاق البدعي:", "هو الطلاق الذي يوقعه الرجل على الوجه المحرم الذي نهى عنه الشارع، ويكون بأحد أمرين:", "1- عدد الطلاق.", "2- حال إيقاعه.", "فإن طلقها ثلاثا بلفظ واحد، أو متفرقات في طهر واحد، أو طلقها وهي حائض أو نفساء، أو طلقها في طهر جامعها فيه، ولم يتبين حملها؛ فإن هذا طلاق بدعي محرم، منهي عنه شرعا، وفاعله آثم.", "فالطلاق البدعي في العدد يحرمها عليه حتى تنكح زوجا غيره، لقوله تعالى: ﴿فإن طلقها فلا تحل له من بعد حتى تنكح زوجا غيره﴾ [البقرة: 230]. - يعني: الثالثة -", "والطلاق البدعي في الوقت يستحب له مراجعتها منه؛ لحديث ابن عمر رضي الله عنهما أنه طلق امرأته وهي حائض، فأمره النبي ﷺ بمراجعتها. وإذا راجعها وجب عليه إمساكها حتى تطهر، ثم إن شاء طلقها، وإن شاء أمسكها.", "ب- حكم الطلاق البدعي:", "يحرم على الزوج أن يطلق طلاقا بدعيا، سواء في العدد أو الوقت؛ لقوله تعالى: ﴿الطلاق مرتان فإمساك بمعروف أو تسريح بإحسان﴾ [البقرة: 229]، وقوله تعالى: ﴿يا أيها النبي إذا طلقتم النساء فطلقوهن لعدتهن﴾ [الطلاق: 1]، أي: طاهرات من غير جماع، ولأن ابن عمر رضي الله عنهما لما طلق زوجته وهي حائض، أمره النبي ﷺ بمراجعتها.", "ويقع الطلاق البدعي كالسني؛ لأن النبي ﷺ أمر ابن عمر بمراجعة زوجته، ولا تكون الرجعة إلا بعد وقوع طلاق، وحينئذ تحسب هذه التطليقة من طلاقها."]], "ic": "scroll"}, {"story": ["المسألة السادسة: الرجعة", ["أ- تعريفها: لغة: المرة من الرجوع.", "وشرعا: إعادة زوجته المطلقة طلاقا غير بائن إلى ما كانت عليه قبل الطلاق بدون عقد.", "ب- مشروعيتها: دل على مشروعية الرجعة الكتاب والسنة والإجماع. أما الكتاب فقوله تعالى: ﴿وبعولتهن أحق بردهن في ذلك إن أرادوا إصلاحا﴾ [البقرة: 228] وقوله تعالى: ﴿وإذا طلقتم النساء فبلغن أجلهن فأمسكوهن بمعروف﴾ [البقرة: 231] أي: بالرجعة.", "وأما السنة: فحديث ابن عمر الماضي ذكره، وقول النبي ﷺ: «مره فليراجعها» وأجمع العلماء على أن من طلق دون الثلاث فإن له الرجعة في العدة.", "ج- الحكمة منها: الحكمة من الرجعة إعطاء الزوج الفرصة إذا ندم على إيقاع الطلاق وأراد استئناف العشرة الزوجية، فيجد الباب مفتوحا أمامه، وهذا من رحمة الله عز وجل بعباده ولطفه بهم.", "د- شروطها: تصح الرجعة بشروط، وهي:", "1- أن يكون الطلاق دون العدد الذي يملكه الزوج، وهو ثلاث تطليقات للحر واثنتان للعبد، فإن استوفى عدد الطلاق لا تحل له حتى تنكح زوجا غيره.", "2- أن تكون المطلقة مدخولا بها؛ لأن الرجعة لا تكون إلا في العدة وغير المدخول بها لا عدة عليها؛ لقوله تعالى: ﴿يا أيها الذين آمنوا إذا نكحتم المؤمنات ثم طلقتموهن من قبل أن تمسوهن فما لكم عليهن من عدة تعتدونها﴾ [الأحزاب: 49].", "3- أن يكون الطلاق بغير عوض؛ لأن العوض في الطلاق جعل لتفتدي المرأة نفسها من الزوج، ولا يحصل لها ذلك مع الرجعة، فلا تحل إلا بعقد جديد برضاها.", "4- أن يكون النكاح صحيحا، فلا رجعة إذا طلق في نكاح فاسد. فإذا لم يصح الزواج لم يصح الطلاق؛ لأنه فرعه، وإذا لم يصح الطلاق، لم تصح الرجعة.", "5- أن تكون الرجعة في العدة؛ لقوله تعالى: ﴿وبعولتهن أحق بردهن في ذلك﴾ [البقرة: 228] أي: في العدة.", "6- أن تكون الرجعة منجزة، فلا تصح معلقة؛ كقوله: إذا حصل كذا فقد راجعتك.", "هـ- بم تحصل الرجعة؟", "1- تحصل الرجعة باللفظ، كقوله: راجعت امرأتي، ورددتها، وأعدتها، وأمسكتها، ورجعتها.", "2- وتحصل بوطء الزوجة إذا نوى بذلك رجعتها.", "و- من أحكام الطلاق الرجعي:", "1- المطلقة طلاقا رجعيا زوجة ما دامت في العدة، لها ما للزوجات من نفقة وكسوة ومسكن، وعليها ما عليهن من لزوم المسكن، ولها أن تتزين له، ويخلو بها ويطؤها، ويرث كل منهما صاحبه.", "2- لا يشترط في الرجعة رضا المرأة أو وليها؛ لقوله تعالى: ﴿وبعولتهن أحق بردهن في ذلك إن أرادوا إصلاحا﴾ [البقرة: 228].", "3- ينتهي وقت الرجعة بانتهاء العدة، وتعتد بثلاث حيض، فإذا طهرت الرجعية من الحيضة الثالثة ولم يرتجعها زوجها، بانت منه بينونة صغرى، فلم تحل له إلا بعقد جديد بشروطه: من ولي وشاهدي عدل.", "4- تعود الرجعية، والبائن التي تزوجها زوجها، على ما بقي لها من عدد الطلاق.", "5- فإذا استوفى ما يملك من عدد الطلاق فطلقها ثلاثا، حرمت عليه، وبانت منه بينونة كبرى، فلا تحل له حتى يطأها زوج غيره، بنكاح صحيح."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "ما معنى الطلاق شرعا؟", "o": ["حل قيد النكاح أو بعضه", "إعادة المطلقة إلى زوجها", "حلف الزوج على ترك الوطء", "تشبيه الزوجة بمحرمة"], "h": "راجع: ص313 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "الألفاظ الصريحة للطلاق يقع بها الطلاق:", "o": ["ولو لم ينو", "ولا يقع إلا بالنية", "ولا يقع إلا بحضور شاهدين", "ولا يقع إلا عند القاضي"], "h": "راجع: ص315 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "يحرم على الزوج أن يطلق طلاقا بدعيا.", "a": true, "h": "راجع: ص317 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "متى ينتهي وقت الرجعة؟", "o": ["بانتهاء العدة", "بعد سنة", "بعد شهر", "لا ينتهي"], "h": "راجع: ص319 (المسألة السادسة)"}]}], "sum": [["معناه، وأدلة مشروعيته، وحكمته", "ص313-319"], ["حكم الطلاق، ومتى يكون؟", "ص313-319"], ["ألفاظ الطلاق", "ص313-319"], ["طلاق السنة وحكمه", "ص313-319"]]}, {"id": "l80", "title": "الباب الخامس: في الإيلاء", "group": "الكتاب التاسع: النكاح والطلاق", "map": {"center": "الباب الخامس\nالنكاح والطلاق", "nodes": [{"t": "1- تعريف الإيلاء، ودليله", "s": []}, {"t": "2- شروط الإيلاء", "s": []}, {"t": "3- حكمه", "s": []}, {"t": "4- من أحكام الإيلاء", "s": []}]}, "paras": [{"t": "الباب الخامس: في الإيلاء", "b": [{"pic": ["scroll", "book"], "cap": "ص319-321"}, {"story": ["1- تعريف الإيلاء، ودليله", ["أ- تعريف الإيلاء:", "الإيلاء لغة: مأخوذ من الألية بمعنى اليمين، يقال: آلى فلان يولي إيلاء وألية أي: أقسم.", "وشرعا: أن يحلف زوج بالله أو بصفة من صفاته - وهو قادر على الوطء - على ترك وطء زوجته في قبلها أبدا، أو أكثر من أربعة أشهر.", "ب- دليله:", "قوله تعالى: ﴿للذين يؤلون من نسائهم تربص أربعة أشهر فإن فاءو فإن الله غفور رحيم وإن عزموا الطلاق فإن الله سميع عليم﴾ [البقرة: 226، 227]."]], "ic": "scroll"}, {"story": ["2- شروط الإيلاء", ["أ- أن يكون من زوج يمكنه الوطء، فلا يصح من عاجز عن الوطء لمرض لا يرجى برؤه، أو شلل، أو جب كامل.", "ب- أن يحلف بالله أو صفة من صفاته، لا بطلاق أو عتق أو نذر.", "ج- أن يحلف على ترك الوطء أكثر من أربعة أشهر.", "د- أن يحلف على ترك الوطء في القبل - الفرج -، فلو حلف على ترك الوطء في الدبر لم يكن مواليا؛ لأنه لم يترك الوطء الواجب.", "هـ- أن تكون الزوجة ممن يمكن وطؤها، أما المرأة المتعذر وطؤها كالرتقاء والقرناء، فلا يصح الإيلاء منها.", {"note": "حاشية (ص320): (1) هي التي انضم فرجها والتصق فلا يمكن جماعها، من الرتق: ضد الفتق. (2) هي المرأة التي في فرجها مانع يمنع من ولوج الذكر فيه، إما غدة غليظة، أو لحمة ملتصقة، أو عظم."}]], "ic": "scroll"}, {"story": ["3- حكمه", ["الإيلاء محرم في الإسلام؛ لأنه يمين على ترك واجب، فإذا أقسم الزوج على عدم جماع زوجته أبدا أو أكثر من أربعة أشهر فهو مول، فإن حصل منه وطء لها وتكفير عن يمينه قبل انتهاء الأربعة أشهر فقد فاء، أي: رجع إلى فعل ما تركه، والله يغفر له ما حصل منه، وإن أبى أن يطأ بعد مضي المدة، وطلبت المرأة ذلك منه، فإن الحاكم يأمره بأحد أمرين:", "1- الرجوع عن يمينه ووطء زوجته، ويكفر عن اليمين.", "2- أو الطلاق، إن أبى إلا التمسك بيمينه.", "فإن رفض الأمرين السابقين فإن القاضي يطلق عليه، أو يفسخ؛ لأنه يقوم مقام المولي عند امتناعه، والطلاق تدخله النيابة. فإن انقضت مدة الإيلاء، وبأحد الزوجين عذر يمنع الجماع، أمر الزوج أن يفيء بلسانه فيقول: متى قدرت جامعتك؛ لأن القصد بالفيئة ترك ما قصده من الإضرار بها. وألحق الفقهاء بالمولي في هذه الأحكام من ترك وطء زوجته إضرارا بها بلا يمين، أكثر من أربعة أشهر، وهو غير معذور."]], "ic": "scroll"}, {"story": ["4- من أحكام الإيلاء", ["- ينعقد الإيلاء من كل زوج يصح طلاقه، مسلما كان أم كافرا، حرا أم عبدا، ومن الغضبان والمريض، ومن الزوجة التي لم يدخل بها؛ لعموم الآية.", "- في هذا التشريع الحكيم من الله سبحانه - بأمر المولي بالوطء أو الطلاق - إزالة للظلم والضرر عن المرأة، وإبطال لما كانوا عليه في الجاهلية من إطالة مدة الإيلاء.", "- لا ينعقد الإيلاء من مجنون، ومغمى عليه؛ لعدم تصورهما ما يقولان، فالقصد معدوم منهما."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "ما الإيلاء شرعا؟", "o": ["أن يحلف زوج بالله أو بصفة من صفاته على ترك وطء زوجته في قبلها أبدا، أو أكثر من أربعة أشهر", "أن يشبه الرجل زوجته بمحرمة", "حل قيد النكاح", "فرقة على عوض"], "h": "راجع: ص319 (تعريف الإيلاء)"}, {"t": "tf", "d": 2, "q": "الإيلاء محرم في الإسلام لأنه يمين على ترك واجب.", "a": true, "h": "راجع: ص320 (حكمه)"}, {"t": "tf", "d": 2, "q": "لا ينعقد الإيلاء من مجنون ولا من مغمى عليه.", "a": true, "h": "راجع: ص321 (من أحكام الإيلاء)"}]}], "sum": [["1- تعريف الإيلاء، ودليله", "ص319-321"], ["2- شروط الإيلاء", "ص319-321"], ["3- حكمه", "ص319-321"], ["4- من أحكام الإيلاء", "ص319-321"]]}, {"id": "l81", "title": "الباب السادس: في الظهار", "group": "الكتاب التاسع: النكاح والطلاق", "map": {"center": "الباب السادس\nالنكاح والطلاق", "nodes": [{"t": "1- تعريف الظهار وحكمه", "s": []}, {"t": "2- كفارة الظهار", "s": []}]}, "paras": [{"t": "الباب السادس: في الظهار", "b": [{"pic": ["scroll", "book"], "cap": "ص321-322"}, {"story": ["1- تعريف الظهار وحكمه", ["أ- تعريف الظهار:", "الظهار لغة: مأخوذ من الظهر.", "وشرعا: أن يشبه الرجل زوجته في الحرمة بإحدى محارمه، بنسب، أو رضاع أو مصاهرة، أو ببعضها، فيقول الرجل إذا أراد الامتناع عن الاستمتاع بزوجته: أنت علي كظهر أمي، أو أختي أو غيرهما، فمتى فعل ذلك فقد ظاهر من امرأته.", "ب- حكمه:", "الظهار حرام؛ لقوله تعالى: ﴿الذين يظاهرون منكم من نسائهم﴾ إلى قوله تعالى: ﴿وإنهم ليقولون منكرا من القول وزورا﴾ [المجادلة: 2]. وكان الظهار طلاقا في الجاهلية، فلما جاء الإسلام أنكره واعتبره يمينا مكفرة؛ رحمة من الله سبحانه وتيسيرا على عباده.", "فيحرم على المظاهر والمظاهر منها استمتاع كل منهما بالآخر - بجماع ودواعيه، كالقبلة، والاستمتاع بما دون الفرج - قبل التكفير، لقوله تعالى: ﴿والذين يظاهرون من نسائهم ثم يعودون لما قالوا فتحرير رقبة من قبل أن يتماسا﴾ [المجادلة: 3]. وقال النبي ﷺ للمظاهر: «لا تقربها حتى تفعل ما أمرك الله به»."]], "ic": "scroll"}, {"story": ["2- كفارة الظهار", ["كفارة الظهار مرتبة على النحو الآتي:", "أ- عتق رقبة مؤمنة، سليمة من العيوب.", "ب- فإن لم يجد الرقبة أو لم يجد ثمنها، صام شهرين قمريين متتابعين، لا يفصل بين الشهرين إلا بصوم واجب كصوم رمضان، أو إفطار واجب كالإفطار للعيد وأيام التشريق، والإفطار للمرض والسفر.", "ج- فإن لم يستطع الصوم، فيطعم ستين مسكينا لكل مسكين مد من البر، أو نصف صاع من غيره، من قوت البلد؛ لقوله تعالى: ﴿والذين يظاهرون من نسائهم ثم يعودون لما قالوا فتحرير رقبة من قبل أن يتماسا﴾ الآيتين [المجادلة: 3، 4]...", "ولحديث سلمة بن صخر البياضي رضي الله عنه لما جعل امرأته عليه كظهر أمه أمره النبي ﷺ بعتق رقبة، فإن لم يجد فصيام شهرين متتابعين، فإن لم يجد فالإطعام.", "فإن جامع المظاهر قبل أن يكفر، كان آثما عاصيا، ولا تلزمه إلا كفارة واحدة، وتبقى الكفارة معلقة في ذمته حتى يكفر، وتحريم زوجته عليه باق أيضا حتى يكفر."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "ما الظهار شرعا؟", "o": ["أن يشبه الرجل زوجته في الحرمة بإحدى محارمه", "أن يحلف على ترك وطء زوجته", "حل قيد النكاح", "شهادات مؤكدات بالأيمان"], "h": "راجع: ص321 (تعريف الظهار)"}, {"t": "mcq", "d": 2, "q": "أول خصال كفارة الظهار:", "o": ["عتق رقبة مؤمنة", "صيام شهرين", "إطعام ستين مسكينا", "صيام ثلاثة أيام"], "h": "راجع: ص322 (كفارة الظهار)"}, {"t": "tf", "d": 2, "q": "يحرم على المظاهر الاستمتاع بزوجته قبل التكفير.", "a": true, "h": "راجع: ص321 (حكمه)"}]}], "sum": [["1- تعريف الظهار وحكمه", "ص321-322"], ["2- كفارة الظهار", "ص321-322"]]}, {"id": "l82", "title": "الباب السابع: في اللعان", "group": "الكتاب التاسع: النكاح والطلاق", "map": {"center": "الباب السابع\nالنكاح والطلاق", "nodes": [{"t": "تعريف اللعان، ودليل مشروعيته، وحكم", "s": []}, {"t": "شروطه وكيفيته", "s": []}, {"t": "الأحكام المترتبة على اللعان", "s": []}]}, "paras": [{"t": "الباب السابع: في اللعان", "b": [{"pic": ["scroll", "book"], "cap": "ص322-325"}, {"story": ["المسألة الأولى: تعريف اللعان، ودليل مشروعيته، وحكمته", ["1- تعريف اللعان:", "اللعان لغة: مصدر لاعن، مأخوذ من اللعن وهو الطرد والإبعاد.", "وشرعا: شهادات مؤكدات بالأيمان، مقرونة باللعن من جهة الزوج وبالغضب من جهة الزوجة، قائمة مقام حد القذف في حق الزوج، ومقام حد الزنى في حق الزوجة. وسمي اللعان بذلك؛ لقول الرجل في الخامسة: أن لعنة الله عليه إن كان من الكاذبين، ولأن أحدهما كاذب لا محالة، فيكون ملعونا.", "2- دليل مشروعية اللعان:", "يستدل على تشريع اللعان بقوله تعالى: ﴿والذين يرمون أزواجهم ولم يكن لهم شهداء إلا أنفسهم فشهادة أحدهم أربع شهادات بالله إنه لمن الصادقين﴾ الآيات [النور: 6-10].", "وبحديث سهل بن سعد رضي الله عنه أن رجلا من الأنصار جاء إلى رسول الله ﷺ فقال: يا رسول الله، أرأيت رجلا وجد مع امرأته رجلا، أيقتله أم كيف يفعل؟ فأنزل الله في شأنه ما ذكر في القرآن من أمر المتلاعنين، فقال النبي ﷺ: «قد قضى الله فيك وفي امرأتك» قال: فتلاعنا في المسجد، وأنا شاهد.", "وفي رواية: فتلاعنا وأنا مع الناس عند رسول الله ﷺ.", "3- الحكمة من مشروعية اللعان:", "والحكمة من مشروعية اللعان للزوج: ألا يلحقه العار بزناها، ويفسد فراشه، ولئلا يلحقه ولد غيره، وهو لا يمكنه إقامة البينة عليها في الغالب، وهي لا تقر بجريمتها، وقوله غير مقبول عليها، فلم يبق سوى حلفهما بأغلظ الأيمان، فكان في تشريع اللعان؛ حل لمشكلته، وإزالة للحرج، ودرء لحد القذف عنه، ولما لم يكن له شاهد إلا نفسه مكنت المرأة أن تعارض أيمانه بأيمان مكررة مثله، تدرأ بها الحد عنها، وإلا وجب عليها الحد. وإن نكل الزوج عن الأيمان وجب عليه حد القذف، وإن نكلت هي بعد حلفه صارت أيمانه مع نكولها بينة قوية، لا معارض لها، ويقام عليها الحد حينئذ.", {"note": "حاشية (ص323): النكول: القعود والكوس والامتناع."}]], "ic": "scroll"}, {"story": ["المسألة الثانية: شروطه وكيفيته", ["1- شروط صحة اللعان:", "1- أن يكون بين زوجين مكلفين (بالغين عاقلين)؛ لقوله تعالى: ﴿والذين يرمون أزواجهم﴾ [النور: 6].", "2- أن يقذف الرجل امرأته بالزنى، كقوله: يا زانية، أو: رأيتك تزنين، أو: زنيت.", "3- أن تكذب المرأة الرجل في قذفه هذا، ويستمر تكذيبها له إلى انقضاء اللعان.", "4- أن يتم اللعان بحكم حاكم.", "2- كيفية اللعان وصفته:", "صفة اللعان: أن يقول الزوج عند الحاكم أمام جمع من الناس: أشهد بالله إني لمن الصادقين فيما رميت به زوجتي فلانة من الزنى، يقول ذلك أربع مرات، ويشير إليها إن كانت حاضرة، ويسميها إن كانت غائبة بما تتميز به. ثم يزيد في الشهادة الخامسة - بعد أن يعظه الحاكم ويحذره من الكذب -: وعلي لعنة الله، إن كنت من الكاذبين.", "ثم تقول المرأة أربع مرات: أشهد بالله لقد كذب فيما رماني به من الزنى، ثم تزيد في الشهادة الخامسة: وأن غضب الله عليها إن كان من الصادقين.", "لقوله تعالى: ﴿والذين يرمون أزواجهم ولم يكن لهم شهداء إلا أنفسهم فشهادة أحدهم أربع شهادات بالله إنه لمن الصادقين والخامسة أن لعنة الله عليه إن كان من الكاذبين ويدرأ عنها العذاب أن تشهد أربع شهادات بالله إنه لمن الكاذبين والخامسة أن غضب الله عليها إن كان من الصادقين﴾ [النور: 6-9]."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: الأحكام المترتبة على اللعان", ["إذا تم اللعان فإنه يترتب عليه ما يأتي:", "1- سقوط حد القذف عن الزوج.", "2- ثبوت الفرقة بين الزوجين، وتحريمها عليه تحريما مؤبدا، ولو لم يفرق الحاكم بينهما.", "3- ينتفي عنه نسب ولدها ويلحق بالزوجة، ويتطلب نفي الولد ذكره صراحة في اللعان، كقوله: «أشهد بالله إني لمن الصادقين فيما رميتها به من الزنى، وما هذا بولدي». لحديث ابن عمر رضي الله عنهما: أن النبي ﷺ لاعن بين رجل وامرأته ففرق بينهما، وألحق الولد بالمرأة.", "4- وجوب حد الزنى على المرأة، إلا أن تلاعن هي أيضا؛ فإن نكولها عن الأيمان مع أيمانه بينة قوية، توجب إقامة الحد عليها."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "ما اللعان لغة؟", "o": ["الطرد والإبعاد", "التخلية", "الرجوع", "التشبيه بالظهر"], "h": "راجع: ص322 (المسألة الأولى)"}, {"t": "tf", "d": 2, "q": "إذا تم اللعان ثبتت الفرقة بين الزوجين وحرمت عليه تحريما مؤبدا.", "a": true, "h": "راجع: ص325 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "عدد شهادات الزوج في اللعان:", "o": ["أربع مرات ثم خامسة باللعنة", "مرتان", "ثلاث مرات", "مرة واحدة"], "h": "راجع: ص324 (المسألة الثانية)"}]}], "sum": [["تعريف اللعان، ودليل مشروعيته، وحكم", "ص322-325"], ["شروطه وكيفيته", "ص322-325"], ["الأحكام المترتبة على اللعان", "ص322-325"]]}, {"id": "l83", "title": "الباب الثامن: في العدة والإحداد", "group": "الكتاب التاسع: النكاح والطلاق", "map": {"center": "الباب الثامن\nالنكاح والطلاق", "nodes": [{"t": "تعريف العدة، ودليل مشروعيتها، والح", "s": []}, {"t": "أنواع العدة", "s": []}, {"t": "التزامات العدة، وما يترتب عليها", "s": []}, {"t": "في الإحداد", "s": []}]}, "paras": [{"t": "الباب الثامن: في العدة والإحداد", "b": [{"pic": ["scroll", "book"], "cap": "ص325-331"}, {"story": ["المسألة الأولى: تعريف العدة، ودليل مشروعيتها، والحكمة منها", ["1- تعريف العدة:", "العدة لغة: اسم مصدر من عد يعد، عدا، وهي مأخوذة من العدد والإحصاء؛ لاشتمالها عليه من الأقراء والأشهر.", "وشرعا: اسم لمدة معينة تتربصها المرأة؛ تعبدا لله عز وجل، أو تفجعا على زوج، أو تأكدا من براءة رحم.", "والعدة من آثار الطلاق، أو الوفاة.", "2- دليل مشروعية العدة:", "الأصل في وجوب العدة ومشروعيتها: الكتاب، والسنة، والإجماع.", "أما الكتاب: فقوله تعالى: ﴿والمطلقات يتربصن بأنفسهن ثلاثة قروء﴾ [البقرة: 228]. وقوله تعالى: ﴿واللائي يئسن من المحيض من نسائكم إن ارتبتم فعدتهن ثلاثة أشهر واللائي لم يحضن وأولات الأحمال أجلهن أن يضعن حملهن﴾ [الطلاق: 4].", "وقوله تعالى: ﴿والذين يتوفون منكم ويذرون أزواجا يتربصن بأنفسهن أربعة أشهر وعشرا﴾ [البقرة: 234].", "وأما السنة: فحديث المسور بن مخرمة رضي الله عنه: «أن سبيعة الأسلمية نفست بعد وفاة زوجها بليال، فجاءت إلى النبي ﷺ، فاستأذنته أن تنكح فأذن لها فنكحت»، وغير ذلك من الأحاديث.", {"note": "حاشية (ص325): نفست بضم النون وكسر الفاء، أي: ولدت."}, "3- الحكمة من مشروعية العدة:", "الحكمة من ذلك: استبراء رحم المرأة من الحمل؛ لئلا يحصل اختلاط الأنساب. وأيضا: إتاحة الفرصة للزوج المطلق ليراجع نفسه إذا ندم، وكان طلاقه رجعيا. وأيضا: صيانة حق الحمل إذا كانت المفارقة عن حمل."]], "ic": "scroll"}, {"story": ["المسألة الثانية: أنواع العدة", ["تنقسم عدة المرأة إلى قسمين:", "1- عدة وفاة.", "2- عدة فراق.", "أولا: عدة الوفاة:", "هي عدة تجب على من مات عنها زوجها، ولا يخلو الحال فيها من أمرين:", "- إما أن تكون حاملا.", "- أو تكون غير حامل.", "فإن كانت حاملا: فعدتها تنتهي بوضع الحمل ولو بعد ساعة من وفاة زوجها؛ لقوله تعالى: ﴿وأولات الأحمال أجلهن أن يضعن حملهن﴾ [الطلاق: 4].", "ولحديث المسور بن مخرمة: «أن سبيعة الأسلمية نفست بعد وفاة زوجها بليال، فجاءت إلى النبي ﷺ، فاستأذنته أن تنكح فأذن لها فنكحت».", "وإن كانت غير حامل: فعدتها أربعة أشهر وعشرة أيام، وهذه تعتد مطلقا سواء دخل بها الزوج، أم لم يدخل؛ لعموم قوله تعالى: ﴿والذين يتوفون منكم ويذرون أزواجا يتربصن بأنفسهن أربعة أشهر وعشرا فإذا بلغن أجلهن فلا جناح عليكم فيما فعلن في أنفسهن بالمعروف والله بما تعملون خبير﴾ [البقرة: 234]، ولم يرد ما يخصص هذه الآية.", "ثانيا: عدة الفراق:", "هي العدة التي تجب على المرأة التي فارقت زوجها بفسخ، أو طلاق، أو خلع بعد الوطء، ولا يخلو الحال فيها من أمور:", "- أن تكون حاملا.", "- أن تكون غير حامل.", "- لا ترى الحيض لصغر، أو آيسة لكبر.", "فإن كانت حاملا: فعدتها تنتهي بوضع الحمل؛ لعموم قوله تعالى: ﴿وأولات الأحمال أجلهن أن يضعن حملهن﴾ [الطلاق: 4].", "وإن كانت غير حامل وهي من ذوات الحيض: فعدتها بمرور ثلاثة أطهار بعد الفراق؛ لقوله تعالى: ﴿والمطلقات يتربصن بأنفسهن ثلاثة قروء ولا يحل لهن أن يكتمن ما خلق الله في أرحامهن إن كن يؤمن بالله واليوم الآخر﴾ [البقرة: 228].", "وإن كانت لا ترى الحيض بأن كانت صغيرة أو آيسة لكبر سن: فعدتها تنتهي بمرور ثلاثة أشهر على فراقها. لقوله تعالى: ﴿واللائي يئسن من المحيض من نسائكم إن ارتبتم فعدتهن ثلاثة أشهر واللائي لم يحضن﴾ [الطلاق: 4].", "حكم المطلقة قبل الدخول بها:", "إذا فارق الزوج زوجته بفسخ أو طلاق قبل الدخول بها فلا عدة عليها؛ لقوله تعالى: ﴿يا أيها الذين آمنوا إذا نكحتم المؤمنات ثم طلقتموهن من قبل أن تمسوهن فما لكم عليهن من عدة تعتدونها فمتعوهن وسرحوهن سراحا جميلا﴾ [الأحزاب: 49]. ولا فرق بين الزوجات المؤمنات، والكتابيات، في هذا الحكم باتفاق أهل العلم، وذكر المؤمنات هنا من باب التغليب."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: التزامات العدة، وما يترتب عليها", ["1- عدة الطلاق:", "إذا كانت المرأة معتدة من زوجها عدة طلاق، فلا يخلو الحال من أمرين:", "- أن يكون طلاقها رجعيا.", "- أن يكون طلاقها بائنا.", "أولا: المعتدة من طلاق رجعي:", "يترتب للمعتدة من طلاق رجعي ما يلي:", "1- وجوب السكنى لها مع الزوج إذا لم يكن هناك مانع شرعي.", "2- وجوب النفقة لها من مؤنة، وكسوة، وغير ذلك.", "3- يجب عليها ملازمة المسكن ولا تفارقه إلا لضرورة؛ لقوله تعالى: ﴿أسكنوهن من حيث سكنتم من وجدكم...﴾ [الطلاق: 6]، ولقوله تعالى: ﴿لا تخرجوهن من بيوتهن ولا يخرجن إلا أن يأتين بفاحشة مبينة﴾ [الطلاق: 1].", "4- يحرم عليها التعرض لخطبة الرجال؛ إذ هي حبيسة على زوجها، فهي في حكم الزوجة؛ لقوله تعالى: ﴿وبعولتهن أحق بردهن في ذلك إن أرادوا إصلاحا﴾ [البقرة: 228].", "ثانيا: إذا كانت معتدة بطلاق بائن:", "ولا يخلو الحال فيها من أمرين:", "- إما أن تكون حاملا.", "- وإما أن تكون غير حامل.", "أولا: إن كانت حاملا: فيترتب لها ما يلي:", "1- وجوب السكنى على الزوج؛ لقوله تعالى: ﴿يا أيها النبي إذا طلقتم النساء فطلقوهن لعدتهن وأحصوا العدة واتقوا الله ربكم لا تخرجوهن من بيوتهن ولا يخرجن إلا أن يأتين بفاحشة مبينة﴾ [الطلاق: 1].", "2- النفقة؛ لقوله تعالى: ﴿وإن كن أولات حمل فأنفقوا عليهن حتى يضعن حملهن﴾ [الطلاق: 6].", "3- ملازمة البيت الذي تعتد فيه، وعدم الخروج منه إلا لحاجة؛ لقوله تعالى: ﴿لا تخرجوهن من بيوتهن ولا يخرجن﴾ [الطلاق: 1]. ودليل خروجها لحاجة: حديث جابر رضي الله عنه قال: طلقت خالتي، فأرادت أن تجد نخلها، فزجرها رجل أن تخرج، فأتت النبي ﷺ، فقال: «بلى اخرجي، فجدي نخلك، فإنك عسى أن تصدقي، أو تفعلي معروفا».", {"note": "حاشية (ص329): الجداد - بالفتح والكسر -: صرام النخل، وهو قطع ثمرتها."}, "ثانيا: إن كانت غير حامل: فيثبت لها ما يثبت للحامل إلا النفقة، وما يتبعها كالملبس فلا يثبت لها؛ لحديث فاطمة بنت قيس رضي الله عنها حين طلقها زوجها تطليقة كانت بقيت لها، أن النبي ﷺ قال لها: «لا نفقة لك إلا أن تكوني حاملا».", "2- عدة المتوفى عنها:", "يلزم المعتدة من وفاة زوجها الأحكام التالية:", "1- يجب عليها أن تعتد في المنزل الذي مات فيه زوجها، وهي فيه، ولو مؤجرا أو معارا؛ لقوله ﷺ للفريعة بنت مالك: «امكثي في بيتك حتى يبلغ الكتاب أجله». وفي رواية: «امكثي في بيتك الذي جاء فيه نعي زوجك...». ولا يجوز تحولها إلى غيره إلا لعذر، كأن تخاف على نفسها البقاء فيه، أو تحول عنه قهرا أو لغير ذلك، فيجوز لها التحول حيث شاءت؛ للضرورة.", "2- ملازمة البيت الذي تعتد فيه وعدم الخروج منه لغير حاجة. ويجوز لها الخروج من بيتها لحوائجها نهارا لا في الليل؛ لأن الليل مظنة الفساد، فلا تخرج فيه من غير ضرورة، بخلاف النهار فإنه مظنة قضاء الحاجات.", "3- يجب عليها الإحداد على زوجها مدة العدة، وسيأتي الكلام على أحكام الإحداد تفصيلا.", "4- ليس لها النفقة، لانتهاء الزوجية بالموت."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: في الإحداد", ["تعريف الإحداد، ودليل مشروعيته:", "1- تعريف الإحداد:", "الإحداد لغة: الامتناع، يقال: حاد ومحد، إذا تركت المرأة الزينة والطيب.", "وشرعا: هو ترك المرأة الزينة، والطيب، وغير ذلك مما يرغب فيها، ويدعو إلى جماعها.", "2- دليل مشروعية الإحداد:", "الإحداد واجب على المرأة المتوفى عنها؛ لحديث أم حبيبة رضي الله عنها أن النبي ﷺ قال: «لا يحل لامرأة تؤمن بالله واليوم الآخر أن تحد على ميت فوق ثلاث ليال، إلا على زوج أربعة أشهر وعشرا».", "وحديث أم عطية الأنصارية رضي الله عنها قالت: «كنا ننهى أن نحد على ميت فوق ثلاث، إلا على زوج أربعة أشهر وعشرا، ولا نكتحل، ولا نتطيب، ولا نلبس ثوبا مصبوغا، إلا ثوب عصب...» الحديث.", {"note": "حاشية (ص331): العصب: برد يصبغ غزله ثم ينسج، ولا يثنى ولا يجمع وإنما يثنى ويجمع ما يضاف إليه، فيقال: بردا عصب، وبرود عصب. والممشق من الثياب: المصبوغ بالمشق، وهو صبغ أحمر."}, "ويجب في حق المرأة المحدة ما يلي:", "1- المنع عن مظاهر الزينة والطيب، فتمنع من لبس الثياب ذات الألوان الزاهية، ولا تكتحل، ولا تلبس الحلي ذهبا أو فضة أو غيرهما، ولا تستعمل شيئا من الأصباغ؛ لحديث أم سلمة رضي الله عنها مرفوعا: «المتوفى عنها لا تلبس المعصفر من الثياب، ولا الممشق، ولا الحلي ولا تختضب ولا تكتحل»، ولحديث أم عطية الأنصارية المتقدم قبل قليل.", "2- وجوب ملازمتها بيتها الذي تعتد فيه ولا تخرج إلا لحاجة؛ لحديث الفريعة بنت مالك الماضي ذكره."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "ما العدة شرعا؟", "o": ["اسم لمدة معينة تتربصها المرأة؛ تعبدا لله عز وجل، أو تفجعا على زوج، أو تأكدا من براءة رحم", "ترك الزينة والطيب", "حل قيد النكاح", "الحلف على ترك الوطء"], "h": "راجع: ص325 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "عدة المتوفى عنها زوجها إذا كانت غير حامل:", "o": ["أربعة أشهر وعشرة أيام", "ثلاثة أشهر", "ثلاثة أطهار", "سنة"], "h": "راجع: ص327 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "المطلقة قبل الدخول بها لا عدة عليها.", "a": true, "h": "راجع: ص328 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "يجب الإحداد على المرأة المتوفى عنها زوجها.", "a": true, "h": "راجع: ص330 (المسألة الرابعة)"}]}], "sum": [["تعريف العدة، ودليل مشروعيتها، والح", "ص325-331"], ["أنواع العدة", "ص325-331"], ["التزامات العدة، وما يترتب عليها", "ص325-331"], ["في الإحداد", "ص325-331"]]}, {"id": "l84", "title": "الباب التاسع: في الرضاع", "group": "الكتاب التاسع: النكاح والطلاق", "map": {"center": "الباب التاسع\nالنكاح والطلاق", "nodes": [{"t": "تعريف الرضاع، ودليل مشروعيته، وحكم", "s": []}, {"t": "شروط الرضاع المحرم، وما يترتب على ", "s": []}, {"t": "إثبات الرضاع", "s": []}]}, "paras": [{"t": "الباب التاسع: في الرضاع", "b": [{"pic": ["scroll", "book"], "cap": "ص331-334"}, {"story": ["المسألة الأولى: تعريف الرضاع، ودليل مشروعيته، وحكمه", ["1- تعريف الرضاع:", "الرضاع لغة - بفتح الراء ويجوز كسرها -: مص اللبن من الثدي، أو شربه.", "وشرعا: هو مص طفل دون الحولين لبنا ثاب عن حمل، أو شربه أو نحوه.", "2- دليل مشروعية الرضاع:", "الرضاع مشروع؛ لقوله تعالى: ﴿وإن تعاسرتم فسترضع له أخرى﴾ [الطلاق: 6]. ولقوله تعالى: ﴿وإن أردتم أن تسترضعوا أولادكم فلا جناح عليكم﴾ [البقرة: 233].", "3- حكم الرضاع:", "حكم الرضاع حكم النسب في تحريم النكاح، وثبوت المحرمية، وإباحة الخلوة والنظر. فهو موجب للقرابة ناشر للتحريم بشروطه.", "والدليل على التحريم بالرضاع: الكتاب، والسنة، والإجماع؛", "أما الكتاب: فقوله تعالى: ﴿وأمهاتكم اللاتي أرضعنكم وأخواتكم من الرضاعة﴾ [النساء: 23] وذلك في سياق بيان المحرمات من النساء.", "وأما السنة: فحديث عائشة رضي الله عنها قالت: قال رسول الله ﷺ: «إن الرضاعة تحرم ما تحرم الولادة». وحديث ابن عباس رضي الله عنهما قال: قال رسول الله ﷺ في بنت حمزة: «إنها لا تحل لي، إنها ابنة أخي من الرضاعة، ويحرم من الرضاعة ما يحرم من الرحم».", "وأما الإجماع: فقد أجمع علماء الأمة على التحريم بالرضاعة."]], "ic": "scroll"}, {"story": ["المسألة الثانية: شروط الرضاع المحرم، وما يترتب على قرابة الرضاع", ["1- شروط الرضاع المحرم:", "لا يعد الرضاع موجبا للقرابة، وناشرا للتحريم، إلا بشرطين وهما:", "1- أن يكون الإرضاع خلال السنتين الأوليين من عمر الرضيع، فلا يؤثر الرضاع بعد السنتين؛ لقوله تعالى: ﴿والوالدات يرضعن أولادهن حولين كاملين لمن أراد أن يتم الرضاعة﴾ [البقرة: 233]، مع قوله تعالى: ﴿وفصاله في عامين﴾ [لقمان: 14].", "ولحديث أم سلمة رضي الله عنها قالت: قال رسول الله ﷺ: «لا يحرم من الرضاعة إلا ما فتق الأمعاء في الثدي، وكان قبل الفطام». ومعنى فتق الأمعاء: وصل إليها ووسعها؛ فالرضاع المحرم هو ما كان في الصغر، وقام مقام الغذاء، وذلك حيث يكون الرضيع طفلا فيسد اللبن جوعه وينبت لحمه.", "2- أن ترضعه خمس رضعات مشبعات فأكثر؛ لحديث عائشة رضي الله عنها قالت: «كان فيما نزل من القرآن (عشر رضعات معلومات يحرمن)، ثم نسخن بخمس معلومات فتوفي رسول الله ﷺ وهي فيما يقرأ من القرآن». وهذا مما نسخت تلاوته وبقي حكمه.", "ولو وصل اللبن إلى جوف الطفل بغير الرضاع، كأن يقطر في فمه، أو يشربه في إناء ونحوه، فحكمه حكم الرضاع، بشرط أن يحصل من ذلك خمس مرات.", "2- ما يترتب على قرابة الرضاع:", "يترتب على القرابة الناشئة بسبب الرضاع حكمان، وهما:", "1- حكم يتعلق بالحرمة.", "2- حكم يتعلق بالحل.", "أما ما يتعلق بالحرمة: فإن الإرضاع له من التأثير في حرمة النكاح، مثل ما لقرابة النسب؛ فأمك من الرضاع وإن علت، وبنتك وإن سفلت، وأختك لأبويك، أو لأحدهما، محرمات عليك بسبب هذه القرابة التي جاءت عن طريق الرضاع.", "وأما ما يتعلق بأثر الحل: فإن كل ما يحل بينك وبين قريبة لك من النسب كالأم والبنت، يحل بينك وبين من بينك وبينها رضاعة، فيحل بينهما النظر والخلوة؛ لحديث عائشة رضي الله عنها، قالت: قال رسول الله ﷺ: «إن الرضاعة تحرم ما تحرم الولادة»."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: إثبات الرضاع", ["يثبت الرضاع بشهادة امرأة واحدة مرضية، معروفة بالصدق، شهدت بذلك على نفسها، أو على غيرها، أنها أرضعت طفلا في الحولين خمس رضعات؛ وذلك لحديث عقبة بن الحارث، قال: تزوجت امرأة، فجاءت امرأة، فقالت: إني قد أرضعتكما، فأتيت النبي ﷺ، فقال: «كيف وقد قيل، دعها عنك»، ولأن هذه شهادة على عورة، فتقبل فيها شهادة النساء منفردات عن الرجال، كالولادة."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "ما الرضاع لغة؟", "o": ["مص اللبن من الثدي، أو شربه", "حفظ الصغير", "ترك الزينة", "التفريق بين الزوجين"], "h": "راجع: ص331 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "ما شروط الرضاع المحرم؟", "o": ["أن يكون خلال السنتين الأوليين، وخمس رضعات مشبعات فأكثر", "رضعة واحدة بعد الحولين", "ثلاث رضعات بعد الفطام", "أن يكون بعد الفطام"], "h": "راجع: ص332-333 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "حكم الرضاع حكم النسب في تحريم النكاح.", "a": true, "h": "راجع: ص332 (المسألة الأولى)"}, {"t": "tf", "d": 3, "q": "لا يثبت الرضاع بشهادة امرأة واحدة مرضية.", "a": false, "h": "راجع: ص334 (المسألة الثالثة)"}]}], "sum": [["تعريف الرضاع، ودليل مشروعيته، وحكم", "ص331-334"], ["شروط الرضاع المحرم، وما يترتب على ", "ص331-334"], ["إثبات الرضاع", "ص331-334"]]}, {"id": "l85", "title": "الباب العاشر: في الحضانة، وأحكامها", "group": "الكتاب التاسع: النكاح والطلاق", "map": {"center": "الباب العاشر\nالنكاح والطلاق", "nodes": [{"t": "في تعريف الحضانة، وحكمها، ولمن تكو", "s": []}, {"t": "في شروط الحاضن، وموانع الحضانة", "s": []}, {"t": "من الأحكام المتعلقة بالحضانة", "s": []}, {"t": "تتمة أحكام الحضانة", "s": []}]}, "paras": [{"t": "الباب العاشر: في الحضانة، وأحكامها", "b": [{"pic": ["scroll", "book"], "cap": "ص334-337"}, {"story": ["المسألة الأولى: في تعريف الحضانة، وحكمها، ولمن تكون؟", ["أ- تعريف الحضانة:", "لغة: تربية الصغير ورعايته، مشتقة من الحضن، وهو الجنب؛ لأن المربي والكافل يضم الطفل إلى جنبه.", "والحاضن والحاضنة: الموكلان بالصبي يحفظانه ويرعيانه.", "والحضانة شرعا: هي القيام بحفظ من لا يميز ولا يستقل بأمره، وتربيته بما يصلحه بدنيا ومعنويا، ووقايته عما يؤذيه.", "ب- حكمها: وهي واجبة في حق الحاضن إذا لم يوجد غيره، أو وجد ولكن المحضون لم يقبل غيره؛ لأنه قد يهلك، أو يتضرر بترك الحفظ، فيجب حفظه عن الهلاك، والوجوب الكفائي يكون عند تعدد الحاضنين.", "ج- لمن تكون؟ والحضانة تكون للنساء والرجال من المستحقين لها، إلا أن النساء يقدمن في الحضانة على الرجال؛ لأنهن أشفق وأرفق بالصغار، وإذا لم يكن لهن حق في الحضانة تصرف إلى الرجال؛ لأنهم على الحماية والصيانة وإقامة مصالح الصغار أقدر.", "وحضانة الطفل تكون لوالديه إذا كان النكاح قائما بينهما، أما إذا تفرقا فالحضانة للأم ما لم تنكح زوجا أجنبيا من المحضون؛ لقوله ﷺ للمرأة التي طلقها زوجها وأراد أن ينتزع ولدها منها: «أنت أحق به ما لم تنكحي».", "ومقتضى الحضانة: حفظ المحضون، وإمساكه عما يؤذيه، وتربيته حتى يكبر، وعمل جميع ما هو في صالحه: من تعهد طعامه، وشرابه، وغسله، ونظافته ظاهرا وباطنا، وتيقظه، وتعهد نومه، والقيام بجميع حاجاته، ومتطلباته."]], "ic": "scroll"}, {"story": ["المسألة الثانية: في شروط الحاضن، وموانع الحضانة", ["1- الإسلام: فلا حضانة لكافر على مسلم؛ لأنه لا ولاية له على المسلم، وللخشية على المحضون من الفتنة في دينه وإخراجه من الإسلام إلى الكفر.", "2- البلوغ والعقل: فلا حضانة لصغير ولا مجنون ولا معتوه؛ لأنهم عاجزون عن إدارة أمورهم، وفي حاجة لمن يحضنهم.", "3- الأمانة في الدين والعفة: فلا حضانة لخائن وفاسق؛ لأنه غير مؤتمن، وفي بقاء المحضون عندهما ضرر عليه في نفسه وماله.", "4- القدرة على القيام بشؤون المحضون بدنيا وماليا: فلا حضانة لعاجز لكبير سن، أو صاحب عاهة كخرس وصمم، ولا حضانة لفقير معدم، أو مشغول بأعمال كثيرة يترتب عليها ضياع المحضون.", "5- أن يكون الحاضن سليما من الأمراض المعدية: كالجذام ونحوه.", "6- أن يكون رشيدا: فلا حضانة لسفيه مبذر لئلا يتلف مال المحضون.", "7- أن يكون الحاضن حرا: فلا حضانة لرقيق؛ لأن الحضانة ولاية، وليس الرقيق من أهل الولاية.", "وهذه الشروط عامة في الرجال والنساء. وتزيد المرأة شرطا آخر، وهو: أن لا تكون متزوجة من أجنبي من المحضون؛ لأنها تكون مشغولة بحق الزوج. ولقوله ﷺ: «أنت أحق به ما لم تنكحي». وتسقط الحضانة بوجود مانع من الموانع المذكورة، أو زوال شرط من شروط استحقاقها السابقة."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: من الأحكام المتعلقة بالحضانة", ["- إذا سافر أحد أبوي المحضون سفرا طويلا، ولم يقصد به المضارة، وكان الطريق آمنا، فالأب أحق بالحضانة، سواء أكان هو المسافر أم المقيم؛ لأنه هو الذي يقوم بتأديب الولد والمحافظة عليه، فإذا كان بعيدا ضاع الولد.", "- إذا كان السفر لبلد قريب دون مسافة القصر، فالحضانة للأم، سواء أكانت هي المسافرة أم المقيمة؛ لأنها أتم شفقة، ويمكن لأبيه الإشراف عليه، وتعهد حاله.", "أما إذا كان السفر طويلا ولحاجة، وكان الطريق غير آمن فالحضانة تكون للمقيم منهما.", "- وتنتهي الحضانة عند سن السابعة، ويخير الذكر بعدها بين أبويه، فيكون عند من اختار منهما؛ لقوله ﷺ: «يا غلام، هذا أبوك وهذه أمك فخذ بيد أيهما شئت» فأخذ بيد أمه، فانطلقت به، وقضى بالتخيير أيضا: عمر وعلي رضي الله عنهما، ولا يخير إلا إذا بلغ عاقلا، وكان الأبوان من أهل الحضانة."]], "ic": "scroll"}, {"story": ["تتمة أحكام الحضانة", ["وقيد التخيير بالسبع؛ لأنه أول سن أمر فيه الشارع بمخاطبته بالصلاة. فإن اختار الولد أباه كان عنده ليلا ونهارا ليؤدبه ويربيه، ولا يمنعه من زيارة أمه، وإن اختار أمه صار عندها ليلا وعند أبيه نهارا؛ ليؤدبه ويربيه، ولأن النهار وقت قضاء الحوائج، وعمل الصنائع.", "والأنثى إذا بلغت سبع سنين فإنها تكون عند أبيها؛ لأنه أحفظ لها وأحق بولايتها من غيره، ولقربها من سن التزويج، والأب وليها وإنما تخطب منه، وهو الأعلم بالكفء ممن يتقدمون لها، ولا تمنع الأم من زيارتها عند عدم المحظور كخوف الفساد عليها أو غير ذلك. فإن كان الأب عاجزا عن حفظها؛ لشغله، أو لكبر، أو لمرضه، أو لقلة دينه. فالأم أصلح وأقدر فإنها أحق بها.", "وكذلك إذا تزوج الأب وجعلها عند زوجته، تؤذيها وتقصر في حقها، فالأم أحق بالحضانة.", "- أجرة الحضانة - سواء أكان الحاضن أما أم غيرها - مستحقة من مال المحضون إن كان له مال، أو من مال وليه ومن تلزمه نفقته، إن لم يكن له مال."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "ما الحضانة شرعا؟", "o": ["القيام بحفظ من لا يميز ولا يستقل بأمره، وتربيته بما يصلحه، ووقايته عما يؤذيه", "مص اللبن من الثدي", "الإنفاق على الزوجة", "ترك الزينة"], "h": "راجع: ص334 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "إذا تفرق الزوجان فالحضانة تكون للأم ما لم:", "o": ["تنكح زوجا أجنبيا من المحضون", "تسافر", "تفتقر", "تمرض"], "h": "راجع: ص335 (المسألة الأولى)"}, {"t": "tf", "d": 2, "q": "لا حضانة لكافر على مسلم.", "a": true, "h": "راجع: ص335 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "تنتهي الحضانة عند سن السابعة ويخير الذكر بعدها بين أبويه.", "a": true, "h": "راجع: ص336 (المسألة الثالثة)"}]}], "sum": [["في تعريف الحضانة، وحكمها، ولمن تكو", "ص334-337"], ["في شروط الحاضن، وموانع الحضانة", "ص334-337"], ["من الأحكام المتعلقة بالحضانة", "ص334-337"], ["تتمة أحكام الحضانة", "ص334-337"]]}, {"id": "l86", "title": "الباب الحادي عشر: في النفقات", "group": "الكتاب التاسع: النكاح والطلاق", "map": {"center": "الباب الحادي عشر\nالنكاح والطلاق", "nodes": [{"t": "تعريف النفقة وأنواعها", "s": []}, {"t": "نفقة المماليك والبهائم", "s": []}]}, "paras": [{"t": "الباب الحادي عشر: في النفقات", "b": [{"pic": ["scroll", "book"], "cap": "ص337-340"}, {"story": ["المسألة الأولى: تعريف النفقة وأنواعها", ["أ- تعريف النفقة:", "النفقة لغة: مأخوذة من الإنفاق، وهو في الأصل بمعنى الإخراج والنفاد، ولا يستعمل الإنفاق إلا في الخير.", "وشرعا: كفاية من يمونه بالمعروف قوتا وكسوة ومسكنا وتوابعها.", {"note": "حاشية (ص337): مان الرجل أهله يمونهم مونا ومؤونة: كفاهم وعالهم وأنفق عليهم."}, "ب- أنواع النفقات:", "1- نفقة الإنسان على نفسه.", "2- نفقة الفروع على الأصول.", "3- نفقة الأصول على الفروع.", "4- نفقة الزوجة على الزوج.", "أولا: نفقة الإنسان على نفسه:", "يجب على المرء أن يبدأ في الإنفاق على نفسه إن قدر على ذلك؛ لحديث جابر رضي الله عنه قال: أعتق رجل من بني عذرة عبدا له عن دبر، إلى أن قال رسول الله ﷺ فيه: «ابدأ بنفسك فتصدق عليها، فإن فضل شيء فلأهلك، فإن فضل عن أهلك شيء فلذي قرابتك...» الحديث.", {"note": "حاشية (ص338): تدبير العبد: هو تعليق عتقه بموت سيده، فيقول: أنت حر يوم أموت."}, "ثانيا: نفقة الفروع:", "فيجب على الوالد وإن علا نفقة ولده وإن سفل؛ لقوله تعالى: ﴿وعلى المولود له رزقهن وكسوتهن بالمعروف﴾ [البقرة: 233]. فأوجب على الوالد نفقات رضاعة الولد، ولحديث عائشة رضي الله عنها أن هند بنت عتبة قالت: يا رسول الله إن أبا سفيان رجل شحيح وليس يعطيني ما يكفيني وولدي، إلا ما أخذت منه وهو لا يعلم، فقال: «خذي ما يكفيك وولدك بالمعروف».", "ثالثا: نفقة الأصول:", "فتجب نفقة الوالدين على ولدهما، لقوله تعالى: ﴿وصاحبهما في الدنيا معروفا﴾ [لقمان: 15]. وقوله تعالى: ﴿وبالوالدين إحسانا﴾ [الإسراء: 23]، ومن الإحسان الإنفاق عليهما، بل إن ذلك من أعظم الإحسان إلى الوالدين.", "ولحديث عائشة رضي الله عنها قالت: قال رسول الله ﷺ: «إن أطيب ما أكل الرجل من كسبه وولده من كسبه»، ولحديث عمرو بن العاص رضي الله عنه: أن النبي ﷺ قال: «أنت ومالك لوالدك، إن أولادكم من أطيب كسبكم، فكلوا من كسب أولادكم».", "رابعا: نفقة الزوجة:", "تجب نفقة الزوجة على الزوج؛ لقوله تعالى: ﴿الرجال قوامون على النساء بما فضل الله بعضهم على بعض وبما أنفقوا من أموالهم﴾ [النساء: 34]، ولحديث جابر رضي الله عنه في سياق حجة النبي ﷺ وفيه: «ولهن عليكم رزقهن وكسوتهن بالمعروف»، ولقوله ﷺ في حديث جابر المتقدم: «فإن فضل شيء فلأهلك».", "ولحديث عائشة المتقدم أيضا، وفيه قوله ﷺ لهند: «خذي ما يكفيك وولدك بالمعروف».", "فيلزم الزوج نفقة زوجه قوتا، وسكنى، وكسوة بما يصلح لمثلها.", "وهذه النفقة تجب للزوجة التي في عصمته، وكذا المطلقة طلاقا رجعيا ما دامت في العدة. وأما المطلقة البائن فلا نفقة لها، ولا سكنى، إلا أن تكون حاملا فلها النفقة؛ لقوله تعالى: ﴿وإن كن أولات حمل فأنفقوا عليهن حتى يضعن حملهن﴾ [الطلاق: 6]."]], "ic": "scroll"}, {"story": ["المسألة الثانية: نفقة المماليك والبهائم", ["أولا: نفقة المماليك:", "أ- حكم النفقة على المماليك: يجب على السيد نفقة مملوكه من قوت وكسوة وسكن بالمعروف؛ لقوله تعالى: ﴿قد علمنا ما فرضنا عليهم في أزواجهم وما ملكت أيمانهم﴾ [الأحزاب: 50]. ولقوله ﷺ: «للمملوك طعامه وكسوته».", "ويجب الرفق بهم وعدم تحميلهم فوق طاقتهم؛ لقوله ﷺ: «ولا تكلفوهم ما يغلبهم، فإن كلفتموهم فأعينوهم».", "ب- تزويج المملوك وإنكاحه: إن طلب الرقيق نكاحا فلسيده زوجه؛ لقوله تعالى: ﴿وأنكحوا الأيامى منكم والصالحين من عبادكم وإمائكم﴾ [النور: 32]، ولأنه يخشى وقوعه في الفاحشة إذا ترك إعفافه. وإذا طلبت الأمة نكاحا؛ خيرها سيدها بين وطئها، أو تزويجها، أو بيعها إزالة للضرر عنها.", "ثانيا: نفقة البهائم:", "يجب على من ملك بهيمة إطعامها، وسقيها، والقيام بشؤونها، ورعايتها؛ لقوله ﷺ: «دخلت امرأة النار في هرة ربطتها، فلا هي أطعمتها، ولا هي أرسلتها تأكل من خشاش الأرض، حتى ماتت هزلا».", "فدل ذلك على وجوب النفقة على الحيوان المملوك؛ لأن دخول المرأة النار كان بسبب ترك الإنفاق على الهرة، ومثلها باقي الحيوانات المملوكة.", "فإن عجز مالك البهيمة عن الإنفاق عليها، أجبر على بيعها، أو تأجيرها، أو ذبحها إن كانت مما يؤكل؛ لأن بقاءها في ملكه مع عدم الإنفاق عليها ظلم، والظلم تجب إزالته."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "ما النفقة شرعا؟", "o": ["كفاية من يمونه بالمعروف قوتا وكسوة ومسكنا وتوابعها", "القيام بحفظ الصغير", "مص اللبن", "التعدي على البدن"], "h": "راجع: ص337 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "بمن يبدأ المرء في الإنفاق؟", "o": ["بنفسه", "بأقاربه", "بالجيران", "بالفقراء"], "h": "راجع: ص338 (المسألة الأولى)"}, {"t": "tf", "d": 2, "q": "تجب نفقة الوالدين على ولدهما.", "a": true, "h": "راجع: ص338 (المسألة الأولى)"}, {"t": "tf", "d": 2, "q": "المطلقة طلاقا بائنا غير الحامل لها النفقة.", "a": false, "h": "راجع: ص339 (المسألة الأولى)"}, {"t": "tf", "d": 2, "q": "إذا عجز مالك البهيمة عن الإنفاق عليها أجبر على بيعها أو تأجيرها أو ذبحها إن كانت مما يؤكل.", "a": true, "h": "راجع: ص340 (المسألة الثانية)"}]}], "sum": [["تعريف النفقة وأنواعها", "ص337-340"], ["نفقة المماليك والبهائم", "ص337-340"]]}, {"id": "l87", "title": "الباب الأول: في الجنايات", "group": "الكتاب العاشر: الجنايات", "map": {"center": "الباب الأول\nالجنايات", "nodes": [{"t": "تعريف الجناية وأقسامها", "s": []}, {"t": "الجناية على النفس", "s": []}, {"t": "أنواع القتل (القسم الأول: قتل العم", "s": []}, {"t": "قتل شبه العمد", "s": []}, {"t": "قتل الخطأ", "s": []}]}, "paras": [{"t": "الباب الأول: في الجنايات", "b": [{"pic": ["scroll", "book"], "cap": "ص341-354"}, {"story": ["المسألة الأولى: تعريف الجناية وأقسامها", ["أ- تعريف الجناية:", "الجناية جمعها جنايات، وهي لغة: التعدي على بدن أو مال أو عرض، وقد جعل الفقهاء كتاب الجنايات خاصا بالتعدي على البدن، وكتاب الحدود خاصا بالتعدي على المال والعرض.", "فالجناية شرعا: التعدي على البدن بما يوجب قصاصا، أو مالا، أو كفارة.", "ب- أقسام الجناية: تنقسم الجناية إلى قسمين:", "1- جناية على النفس.", "2- جناية على ما دون النفس."]], "ic": "scroll"}, {"story": ["المسألة الثانية: الجناية على النفس", ["وهي كل فعل يؤدي إلى زهوق النفس، وهي القتل. وأجمع المسلمون على تحريم القتل بغير حق؛ لقوله تعالى: ﴿ولا تقتلوا النفس التي حرم الله إلا بالحق﴾ [الإسراء: 33]. ولحديث عبد الله بن مسعود رضي الله عنه قال: قال رسول الله ﷺ: «لا يحل دم امرئ مسلم، يشهد أن لا إله إلا الله وأني رسول الله، إلا بإحدى ثلاث: الثيب الزاني، والنفس بالنفس، والتارك لدينه المفارق للجماعة». فتحريم القتل بغير حق ثابت بالكتاب، والسنة، والإجماع.", "حكم قاتل النفس بغير حق:", "إذا قتل شخص شخصا متعمدا بغير حق فحكمه أنه فاسق؛ لارتكابه كبيرة من كبائر الذنوب، وقد عظم الله شأن القتل، فقال سبحانه: ﴿من قتل نفسا بغير نفس أو فساد في الأرض فكأنما قتل الناس جميعا﴾ [المائدة: 32]. وقال ﷺ: «لن يزال المؤمن في فسحة من دينه، ما لم يصب دما حراما». وقد توعده الله سبحانه، فقال: ﴿ومن يقتل مؤمنا متعمدا فجزاؤه جهنم خالدا فيها...﴾ [النساء: 93].", "وأمره إلى الله تعالى إن شاء عذبه وإن شاء غفر له؛ لقوله تعالى: ﴿إن الله لا يغفر أن يشرك به ويغفر ما دون ذلك لمن يشاء﴾ [النساء: 48]. فهو داخل تحت المشيئة؛ لأن ذنبه دون الشرك. هذا إن لم يتب، أما إذا تاب فتوبته مقبولة؛ لقوله عز وجل: ﴿قل يا عبادي الذين أسرفوا على أنفسهم لا تقنطوا من رحمة الله إن الله يغفر الذنوب جميعا إنه هو الغفور الرحيم﴾ [الزمر: 53] ولكن لا يسقط حق المقتول في الآخرة بمجرد توبة القاتل."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: أنواع القتل (القسم الأول: قتل العمد)", ["ينقسم القتل إلى ثلاثة أقسام: القتل العمد، وشبه العمد، والخطأ.", "والخطأ والعمد ورد ذكرهما في قوله تعالى: ﴿وما كان لمؤمن أن يقتل مؤمنا إلا خطأ ومن قتل مؤمنا خطأ فتحرير رقبة مؤمنة ودية مسلمة إلى أهله إلا أن يصدقوا﴾ [النساء: 92]. وقوله تعالى: ﴿ومن يقتل مؤمنا متعمدا فجزاؤه جهنم خالدا فيها وغضب الله عليه ولعنه وأعد له عذابا عظيما﴾ [النساء: 93].", "وأما شبه العمد: فثبت في السنة المطهرة أن النبي ﷺ قال: «عقل شبه العمد مغلظ مثل عقل العمد».", "وإلى تفصيل القول في هذه الأقسام الثلاثة:", "القسم الأول: قتل العمد:", "حقيقته: أن يقصد القاتل آدميا معصوما، فيقتله بما يغلب على الظن موته به.", "فعلى هذا لا بد من توافر ثلاثة شروط، حتى يكون القتل عمدا:", "1- وجود القصد من القاتل، وهو إرادة القتل.", "2- أن يعلم أن الشخص الذي قصد قتله آدمي معصوم الدم.", "3- أن تكون الآلة التي قتله بها مما تصلح أن تكون للقتل عادة، سواء أكانت محددة أم غير محددة.", "فإن اختل شرط من هذه الشروط لم يكن القتل عمدا.", "صور القتل العمد:", "1- أن يضربه بمحدد، وهو ما يقطع، ويدخل في البدن، كالسيف والسكين والرمح وما في معناها.", "2- أن يقتله بمثقل كبير، كالحجر الكبير والمطرقة ونحوها؛ لحديث أنس بن مالك رضي الله عنه أن جارية وجد رأسها قد رض بين حجرين. فسألوها: من صنع هذا بك؟ فلان؟ فلان؟ حتى ذكروا يهوديا، فأومت برأسها، فأخذ اليهودي فأقر، فأمر به رسول الله ﷺ أن يرض رأسه بالحجارة.", {"note": "حاشية (ص343): الرض: الدق والكسر."}, "3- أن يمنع خروج نفسه، كأن يخنقه بحبل ونحوه، أو يسد فمه، وأنفه، حتى يموت.", "4- أن يسقيه سما لا يعلم به، أو يطعمه شيئا قاتلا، فيموت به.", "5- أن يلقيه في مهلكة يكثر فيها السباع، أو ينعدم فيها الماء.", "6- أن يلقيه في ماء يغرقه، أو نار تحرقه، ولا يمكنه التخلص منهما.", "7- أن يحبسه، ويمنع عنه الطعام والشراب زمنا يموت فيه غالبا، فيموت بذلك جوعا أو عطشا.", "8- أن يلقيه إلى حيوان مفترس كأسد، أو حية قاتلة، فيموت من ذلك.", "9- أن يتسبب في قتله بما يقتل غالبا، كأن يشهد عليه بما يوجب قتله من زنى، أو ردة، أو قتل، فيقتل، ثم يرجع الشهود عن شهادتهم ويقولون: تعمدنا قتله، فيقتلون به.", "حكم قتل العمد:", "لقتل العمد حكمان:", "1- حكم أخروي: وهو تحريم القتل، ولفاعله الإثم العظيم، والعذاب الأليم، إن لم يتب، أو يعفو الله عنه؛ لقوله تعالى: ﴿ومن يقتل مؤمنا متعمدا فجزاؤه جهنم خالدا فيها وغضب الله عليه ولعنه وأعد له عذابا عظيما﴾ [النساء: 93].", "2- حكم دنيوي: فيترتب على قتل العمد القصاص إن لم يعف أولياء المقتول؛ لقوله تعالى: ﴿يا أيها الذين آمنوا كتب عليكم القصاص في القتلى الحر بالحر والعبد بالعبد والأنثى بالأنثى فمن عفي له من أخيه شيء فاتباع بالمعروف وأداء إليه بإحسان﴾ [البقرة: 178]، ولحديث أبي هريرة رضي الله عنه، قال: قال رسول الله ﷺ: «من قتل له قتيل فهو بخير النظرين إما أن يعفو وإما أن يقتل» وفي رواية: «إما أن يقاد وإما أن يفدى». فلولي الدم مخير بين القصاص، أو العفو بلا مقابل، أو أخذ الدية، وهي بدل عن القصاص وله الصلح على أكثر منها. قال الموفق: لا أعلم فيه خلافا؛ لحديث عمرو بن شعيب، عن أبيه، عن جده، مرفوعا: «من قتل عمدا دفع إلى أولياء المقتول، فإن شاءوا قتلوا، وإن شاءوا أخذوا الدية، وهي ثلاثون حقة، وثلاثون جذعة، وأربعون خلفة، وما صولحوا عليه فهو لهم، وذلك تشديد القتل». وعفوه بلا مقابل أفضل؛ لقوله تعالى: ﴿وأن تعفوا أقرب للتقوى﴾ [البقرة: 237].", {"note": "حاشية (ص345): والحقة من الإبل: ما أتمت ثلاث سنين ودخلت في الرابعة، والجذعة: ما أتمت أربع سنين، ودخلت في الخامسة، والخلفة: الحامل من الإبل، وجمعها مخاض من غير لفظها."}, "شروط القصاص في النفس: يستحق القصاص ولي القتيل بشروط أربعة:", "1- أن يكون القاتل مكلفا، وهو البالغ العاقل. فلا قصاص على الصغير والمجنون والمعتوه والنائم؛ لقوله ﷺ: «رفع القلم عن ثلاثة: عن النائم حتى يستيقظ، وعن الصبي حتى يبلغ، وعن المجنون حتى يفيق»، ولأن هؤلاء ليس لهم قصد صحيح، أو لعدم وجود القصد منهم.", "2- أن يكون المقتول معصوم الدم؛ لأن القصاص شرع لحقن الدماء، ومهدر الدم غير محقون، فلو قتل مسلم كافرا حربيا، أو مرتدا قبل توبته، أو زانيا محصنا، فلا قصاص عليه، ولا دية، لكنه يعزر لتعديه على الحاكم.", "3- التكافؤ بين القاتل والمقتول، فيساويه في الحرية والدين والرق، فلا يقتل مسلم بكافر، ولو كان المسلم عبدا والكافر حرا؛ لقوله ﷺ: «لا يقتل مسلم بكافر»، ولا يقتل حر بعبد؛ لقوله تعالى: ﴿الحر بالحر والعبد بالعبد﴾ [البقرة: 178] وما سوى ذلك فلا يؤثر التفاضل في شيء منها في القصاص، فيقتل الشريف بالوضيع، والذكر بالأنثى، والصحيح بالمجنون والمعتوه؛ لعموم قوله تعالى: ﴿وكتبنا عليهم فيها أن النفس بالنفس﴾ [المائدة: 45].", "4- عدم الولادة، فلا يكون المقتول ولدا للقاتل ولا لولده وإن سفل، فلا يقتل أحد الأبوين وإن علا بالولد وإن سفل؛ لقوله ﷺ: «لا يقتل والد بولده». ويقتل الولد بكل من الأبوين؛ لعموم قوله تعالى: ﴿كتب عليكم القصاص في القتلى﴾ [البقرة: 178].", "الحكمة من القصاص:", "شرع الله سبحانه القصاص رحمة بالناس، وحفظا لدمائهم، وزجرا عن العدوان، وإذاقة للجاني ما أذاقه غيره، وفيه إذهاب لحرارة الغيظ من قلوب أولياء المجني عليه، وفيه حياة للناس، وبقاء للنوع الإنساني، كما قال سبحانه: ﴿ولكم في القصاص حياة يا أولي الألباب﴾ [البقرة: 179].", "شروط استيفاء القصاص:", "إذا توافرت شروط استحقاق القصاص ووجوبه، فإنه لا يستوفى من الجاني ولا توقع العقوبة عليه إلا بشروط ثلاثة، وهي:", "1- أن يكون مستحق القصاص مكلفا - بالغا عاقلا - فإن كان مستحقه - أو بعضهم - صبيا أو مجنونا، لم ينب عنهما غيرهما في استيفائه، وإنما يحبس الجاني إلى حين بلوغ الصغير، وإفاقة المجنون. وقد فعله معاوية رضي الله عنه وأقرته الصحابة، فكان كالإجماع منهم.", "2- اتفاق أولياء الدم المستحقين للقصاص جميعا على استيفائه، وليس لبعضهم الانفراد به، لئلا يكون مستوفيا لحق غيره بغير إذنه، فينتظر قدوم الغائب، وبلوغ الصغير، وإفاقة المجنون، ومن مات من مستحقي القصاص قام وارثه مقامه. وإن عفا بعض مستحقي القصاص سقط القصاص.", "3- أن يؤمن من عدم تعدي القصاص إلى غير الجاني؛ لقوله تعالى: ﴿فلا يسرف في القتل﴾ [الإسراء: 33].", "فإن وجب القصاص على حامل لا تقتل حتى تضع حملها؛ لأن قتلها يتعدى إلى الجنين. فإن وضعت ما في بطنها: فإن وجد من يقوم مقامه في إرضاع الولد أقيم عليها الحد، وإن لم يوجد تركت حتى تفطمه لحولين؛ لقوله ﷺ في حديث الغامدية: «إذا لا نرجمها وندع ولدها صغيرا ليس له من يرضعه»، فقام رجل من الأنصار، فقال: إلي رضاعته يا نبي الله، فرجمها.", "من أحكام القصاص:", "1- ينفذ القصاص بحضور الحاكم - الإمام - أو نائبه، فهو الذي يقيمه أو يأذن فيه؛ ليمنع من الجور فيه، ولإقامته على الوجه الشرعي، ودرءا للفساد والتخريب والفوضى.", "2- الأصل أن يفعل بالجاني كما فعل بالمجني عليه؛ لقوله تعالى: ﴿وإن عاقبتم فعاقبوا بمثل ما عوقبتم به﴾ [النحل: 126]. ولأن النبي ﷺ رض رأس اليهودي الذي قتل الجارية بين حجرين، كما فعل بها. وكذا إن قطع يديه، ثم قتله، فعل به ذلك.", "3- لا بد أن تكون الآلة التي ينفذ بها القصاص ماضية، كسيف وسكين ونحوه؛ لقوله ﷺ: «إذا قتلتم فأحسنوا القتلة».", "4- إن كان ولي المقتول يحسن الاستيفاء على الوجه الشرعي، مكنه الحاكم من ذلك، وإلا أمره أن يوكل من يقتص له، ممن يحسن ذلك."]], "ic": "scroll"}, {"story": ["القسم الثاني: قتل شبه العمد", ["حقيقته: أن يقصد الاعتداء على شخص بما لا يقتل غالبا، فيموت المجني عليه، ويسمى أيضا خطأ العمد، فهو يشبه العمد من جهة قصد ضربه، ويشبه الخطأ من جهة ضربه بما لا يقصد به القتل، فلذلك كان حكمه مترددا بين العمد والخطأ، وسواء في ذلك قصد العدوان عليه أو تأديبه.", "من صور قتل شبه العمد وأمثلته:", "1- أن يضربه في غير مقتل بسوط أو حجر صغير أو عصا صغيرة، أو يلكمه أو يلكزه في غير مقتل فيموت. واللكم: الضرب بجمع الكف، واللكز: الضرب بجمع الكف في الصدر.", "2- أن يربطه ويلقيه إلى جانب ماء قد يزيد وقد لا يزيد، فيزيد الماء، ويموت منه، وكذا لو ألقاه في ماء قليل لا يغرق مثله فغرق.", "3- أن يصيح بعاقل في حال غفلته فيموت، أو يصيح بصغير، أو معتوه، على سطح، فيسقط، فيموت.", "حكم قتل شبه العمد:", "لقتل شبه العمد حكمان:", "1- حكم أخروي: وهو الحرمة والإثم والعقاب في الآخرة؛ لأنه تسبب بفعله في قتل معصوم الدم، إلا أن عقابه دون قتل العمد.", "2- حكم دنيوي: فيترتب عليه الدية مغلظة، ولا يترتب عليه قصاص كالعمد وإن طالب به ولي الدم، وتجب الكفارة في مال الجاني، وهي عتق رقبة، فإن لم يجد صام شهرين متتابعين.", "وتثبت الدية لولي الدم على عاقلة القاتل مؤجلة في ثلاث سنوات؛ لحديث عبد الله بن عمرو رضي الله عنهما أن رسول الله ﷺ قال: «عقل شبه العمد مغلظ مثل عقل العمد، ولا يقتل صاحبه»، وحديث المغيرة بن شعبة رضي الله عنه قال: «ضربت امرأة ضرة لها بعمود فسطاط، وهي حبلى فقتلتها، فجعل رسول الله ﷺ دية المقتولة على عصبة القاتلة».", {"note": "حاشية (ص348): العاقلة: هم العصبة، وهم القرابة من قبل الأب الذين يعطون دية قتل الخطأ."}]], "ic": "scroll"}, {"story": ["القسم الثالث: قتل الخطأ", ["حقيقته: أن يقتل شخصا من غير قصد لقتله.", "أنواع قتل الخطأ:", "1- الخطأ في الفعل، وهو: أن يفعل ما يجوز له فعله فيصيب آدميا معصوما لم يقصده، كأن يرمي صيدا، فيصيب إنسانا فيقتله، أو ينقلب وهو نائم على إنسان فيموت.", "2- الخطأ في القصد، كأن يرمي ما يظنه مباحا فيتبين آدميا، كما لو رمى شيئا يظنه صيدا، فيتبين آدميا معصوما.", "3- أن يكون القاتل عمدا صغيرا أو مجنونا، فعمد الصبي والمجنون يجري مجرى الخطأ؛ لأنهما ليس لهما قصد.", "ويلحق بقتل الخطأ: القتل بالتسبب، كما لو حفر بئرا، أو حفرة في طريق، فتلف بسبب ذلك إنسان.", "حكم قتل الخطأ:", "لهذا القتل حكمان:", "1- حكم أخروي: وهو عدم الإثم والعقاب؛ لحديث ابن عباس رضي الله عنهما أن النبي ﷺ قال: «إن الله تجاوز عن أمتي الخطأ والنسيان وما استكرهوا عليه».", "2- حكم دنيوي: وهو وجوب الدية على عاقلة القاتل مؤجلة ثلاث سنين ومخففة في خمسة أنواع من الإبل؛ لقوله تعالى: ﴿وما كان لمؤمن أن يقتل مؤمنا إلا خطأ ومن قتل مؤمنا خطأ فتحرير رقبة مؤمنة ودية مسلمة إلى أهله إلا أن يصدقوا﴾ [النساء: 92]، ولحديث أبي هريرة رضي الله عنه قال: «قضى رسول الله ﷺ في جنين امرأة من بني لحيان سقط ميتا بغرة عبد أو أمة، ثم إن المرأة التي قضي عليها بالغرة توفيت، فقضى رسول الله ﷺ أن ميراثها لزوجها وبنيها، وأن العقل على عصبتها».", {"note": "حاشية (ص350): المراد أن المرأة التي قضي لها بالغرة - وهي المجني عليها - هي التي توفيت. (شرح النووي على مسلم 11/177)."}, "وتجب على من قتل خطأ مع الدية كفارة وهي كالآتي:", "1- عتق رقبة مؤمنة: وهذا إذا كان يستطيع العتق، ويشترط في الرقبة أن تكون مؤمنة سليمة من العيوب؛ لقوله تعالى: ﴿وما كان لمؤمن أن يقتل مؤمنا إلا خطأ ومن قتل مؤمنا خطأ فتحرير رقبة﴾ [النساء: 92]. فإن لم يتمكن من العتق؛ لفقره أو لعدم وجود الرقيق، فإنه ينتقل إلى:", "2- صوم شهرين متتابعين إن كان يستطيع؛ لقوله تعالى: ﴿فمن لم يجد فصيام شهرين متتابعين توبة من الله﴾ [النساء: 92]. فإن عجز عن الصوم لمرض أو كبر سن بقيت الكفارة متعلقة في ذمته، ولا يجزئ عنه الإطعام؛ لأن الله تعالى لم يذكره، والأبدال في الكفارة تتوقف على النص دون القياس."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: الجناية على ما دون النفس", ["وهي كل أذى يقع على الإنسان مما لا يودي بحياته، من الجراح وقطع الأعضاء ونحو ذلك، ويجب في ذلك القصاص لثبوت ذلك بالكتاب والسنة والإجماع:", "أما الكتاب: فقوله تعالى: ﴿وكتبنا عليهم فيها أن النفس بالنفس والعين بالعين والأنف بالأنف والأذن بالأذن والسن بالسن والجروح قصاص﴾ [المائدة: 45].", "وأما السنة: فقوله ﷺ - في قصة كسر الربيع ثنية جارية -: «كتاب الله القصاص». وأجمع العلماء على وجوب القصاص فيما دون النفس، إن أمكن.", "وهي ثلاثة أنواع:", "1- الجناية بالجرح.", "2- قطع طرف.", "3- إبطال منفعة عضو.", "النوع الأول: الجناية بالجرح:", "وهذه الجناية تنقسم إلى قسمين:", "أ- الجراح الواقعة على الوجه والرأس وتسمى الشجاج، جمع شجة.", "ب- الجراحات في سائر البدن، وتسمى جرحا، ولا تسمى شجة.", "القسم الأول: الجراحات الواقعة في الرأس والوجه، وهي عشرة أنواع:", "1- الحارصة، وهي التي تحرص الجلد، أي: تشقه قليلا، ولا تدميه، كالخدش، وتسمى القاشرة والملطاء، من الحرص، وهو الشق.", "2- الدامية، وهي التي تدمي موضعها من الشق (تدمي الجلد) فيخرج منها دم يسير، وتسمى البازلة والدامعة، تشبيها بخروج الدمع من العين.", "3- الباضعة، وهي التي تبضع اللحم بعد الجلد، أي تشقه شقا خفيفا، ولا تبلغ العظم.", "4- المتلاحمة، وهي التي تغوص في اللحم، ولا تبلغ الجلدة التي بين اللحم والعظم.", "5- السمحاق، وهي التي تبلغ الجلدة الرقيقة بين اللحم والعظم من الرأس، سميت الجراحة باسمها.", "وهذه الخمس ليس فيها قصاص ولا دية، وإنما يجب فيها حكومة، والحكومة هي أن يقوم المجني عليه قبل الجناية كأنه عبد، ثم يقوم، وهي به قد برئت، فما نقص من القيمة، فللمجني عليه مثل نسبته من الدية.", "6- الموضحة، وهي التي تخرق السمحاق وتوضح العظم أي تكشفه، وفيها خمس من الإبل، نصف عشر الدية.", "7- الهاشمة، وهي التي توضح العظم وتهشمه أي تكسره، وفيها عشر من الإبل.", "8- المنقلة، وهي التي تنقل العظم من موضع لآخر، سواء أوضحته، وهشمته، أو لا، وفيها خمس عشرة من الإبل.", "9- المأمومة، وهي التي تبلغ أم الدماغ أي: جلدة الدماغ المحيطة به، ويقال لها الآمة، وفيها ثلث دية النفس.", "10- الدامغة، وهي التي تخرق جلدة الدماغ، وتصل إليه، وفيها ثلث دية النفس أيضا.", "ويضاف إلى ذلك الجائفة، وهي التي تصل إلى باطن الجوف، مما لا يظهر للرائي، كداخل بطن، وداخل ظهر، وصدر، وحلق، ومثانة، وهذه ليست من الشجاج، لأنها ليست في الرأس أو الوجه، إلا أنهم يذكرونها تبعا بجامع التقدير فيها، وفيها ثلث دية النفس.", "ودليل هذه الجراح:", "1- حديث أبي بكر بن محمد بن عمرو بن حزم عن أبيه عن جده رضي الله عنه: أن النبي ﷺ كتب إلى أهل اليمن كتابا، وذكر فيه: «وفي المأمومة ثلث الدية، وفي المنقلة خمس عشرة من الإبل،... وفي الموضحة خمس من الإبل».", "2- إجماع العلماء على أن دية المنقلة خمس عشرة من الإبل.", "3- اتفاق العلماء على أن في الجائفة ثلث الدية؛ لما في حديث عمرو ابن حزم: «وفي الجائفة ثلث الدية».", "4- أثر زيد بن ثابت رضي الله عنه أنه قضى في الهاشمة عشرا من الإبل، ولم يعرف له مخالف.", "5- ولما جاء في كتاب عمرو بن حزم السابق أن في المأمومة ثلث الدية، والدامغة أبلغ منها، فهي أولى منها بأن تكون فيها ثلث الدية.", "وهذه الشجاج لا يجب القصاص فيها فقط لتيسر ضبطها واستيفاء مثلها في الموضحة، إلا في الموضحة، بخلاف ما عداها، فإنه لا يؤمن فيها الزيادة والنقص في طول الجراحة وعرضها، ولا يوثق باستيفاء المثل.", "القسم الثاني: الجراحات في سائر البدن:", "وهذه الجراحات تختلف باختلاف النوع، فما لا قصاص فيه إذا كان في الرأس أو الوجه فلا قصاص فيه أيضا، إذا كان في سائر البدن، إلا الموضحة التي تقطع جزءا من أجزاء البدن، كالصدر والعنق.", "النوع الثاني: قطع الطرف:", "تنقسم هذه الجناية إلى ثلاثة أقسام:", "1- عمد.", "2- شبه عمد.", "3- خطأ.", "ولا يجب القصاص في الخطأ وشبه العمد، وإنما يجب في العمد كالقتل بشروط ثلاثة:", "1- إمكان الاستيفاء بلا حيف، وذلك بأن يكون القطع من مفصل، أو له حد ينتهي إليه كالأنامل والكوع والمرفق. فلا قصاص في جراحة لا تنتهي إلى حد كالجائفة، ولا قصاص في كسر عظم غير السن، كعظم الفخذ والذراع والساق.", "2- التماثل بين عضوي الجاني والمجني عليه في الاسم والموضع، فلا تؤخذ يمين بيسار، ولا خنصر ببنصر، ولا عضو أصلي بزائد.", "3- استواء العضوين من الجاني والمجني عليه في الصحة والكمال، فلا تؤخذ صحيحة بشلاء، ولا كاملة الأصابع بناقصتها، وهكذا.", "النوع الثالث: إبطال منفعة عضو:", "إذا أبطل الجاني منفعة عضو المجني عليه فإنه لا قصاص عليه؛ لعدم إمكان الاستيفاء بلا حيف، وعليه في ذلك دية نفس كاملة.", "ومن نقصت منفعة عضوه، فإن عرف قدره وجب له من الدية قسط الذاهب، كنصف الدية أو ربعها مثلا، إذا كان الذاهب نصف المنفعة أو ربعها، وهكذا.", "وإن لم يمكن معرفة قدر الذاهب من المنفعة، وجبت حكومة، يقدرها الحاكم باجتهاده.", "ومن المنافع: إزالة العقل والسمع والبصر، وإبطال الشم، وذهاب النطق والصوت والذوق، وزوال المضغ وزوال الإمناء، وإبطال قوة الإحبال، وغير ذلك."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "ما الجناية شرعا؟", "o": ["التعدي على البدن بما يوجب قصاصا، أو مالا، أو كفارة", "التعدي على المال فقط", "ترك الصلاة", "الإنفاق على الأولاد"], "h": "راجع: ص341 (المسألة الأولى)"}, {"t": "mcq", "d": 1, "q": "إلى كم قسم ينقسم القتل؟", "o": ["ثلاثة: العمد، وشبه العمد، والخطأ", "قسمين", "أربعة", "خمسة"], "h": "راجع: ص342 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "ما شروط القتل العمد الثلاثة؟", "o": ["وجود القصد، وعلمه بأن المقتول آدمي معصوم الدم، وأن تكون الآلة مما تصلح للقتل عادة", "الغضب والعداوة والسلاح", "الليل والنهار والمكان", "القرابة والمال والدين"], "h": "راجع: ص343 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "لا يقتل مسلم بكافر.", "a": true, "h": "راجع: ص345 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "لا يقتل أحد الأبوين بالولد.", "a": true, "h": "راجع: ص346 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "يجب القصاص في الخطأ وشبه العمد.", "a": false, "h": "راجع: ص353 (المسألة الرابعة)"}, {"t": "tf", "d": 2, "q": "إذا أبطل الجاني منفعة عضو المجني عليه فإنه لا قصاص عليه.", "a": true, "h": "راجع: ص354 (المسألة الرابعة)"}]}], "sum": [["تعريف الجناية وأقسامها", "ص341-354"], ["الجناية على النفس", "ص341-354"], ["أنواع القتل (القسم الأول: قتل العم", "ص341-354"], ["قتل شبه العمد", "ص341-354"]]}, {"id": "l88", "title": "الباب الثاني: في الديات", "group": "الكتاب العاشر: الجنايات", "map": {"center": "الباب الثاني\nالجنايات", "nodes": [{"t": "تعريفها", "s": []}, {"t": "مشروعيتها، ودليل ذلك، والحكمة منها", "s": []}, {"t": "على من تجب الدية؟ ومن يتحملها؟", "s": []}, {"t": "أنواع الديات ومقاديرها", "s": []}]}, "paras": [{"t": "الباب الثاني: في الديات", "b": [{"pic": ["scroll", "book"], "cap": "ص354-357"}, {"story": ["المسألة الأولى: تعريفها", ["الدية لغة: من: وديت القتيل أديه دية، إذا أعطيت ديته، والجمع: ديات.", "وشرعا: هي المال المؤدى للمجني عليه أو لوليه بسبب الجناية.", "وتسمى أيضا (العقل)؛ لأن القاتل كان يجمع الدية من الإبل، فيعقلها بفناء أولياء المقتول؛ ليسلمها إليهم."]], "ic": "scroll"}, {"story": ["المسألة الثانية: مشروعيتها، ودليل ذلك، والحكمة منها", ["1- أدلة مشروعيتها: الدية واجبة بالكتاب، والسنة، والإجماع.", "أما الكتاب: فقوله تعالى: ﴿ومن قتل مؤمنا خطأ فتحرير رقبة مؤمنة ودية مسلمة إلى أهله﴾ [النساء: 92].", "وأما السنة: فحديث أبي هريرة المتقدم ذكره: «من قتل له قتيل، فهو بخير النظرين إما أن يفدي وإما أن يقتل». وكذا حديث عمرو بن حزم في الكتاب الذي كتبه له النبي ﷺ وفيه مقادير الديات.", "وأجمع أهل العلم على وجوب الدية.", "2- حكمة مشروعيتها: أما الحكمة من مشروعيتها: فهي حفظ الأرواح، وحقن دماء الأبرياء، والزجر، والردع عن الاستهانة بالأنفس."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: على من تجب الدية؟ ومن يتحملها؟", ["من أتلف إنسانا أو جزءا منه، لا يخلو من أحد أمرين:", "- إن كانت الجناية التي فسدت بسببها النفس عمدا محضا، وجبت الدية كلها في مال القاتل، إن حصل العفو وسقط القصاص. فإن بدل المتلف يجب على متلفه، قال تعالى: ﴿ولا تزر وازرة وزر أخرى﴾ [الأنعام: 164].", "- وأما إن كانت الجناية خطأ أو شبه عمد، فإن الدية تكون على عاقلة القاتل؛ لحديث أبي هريرة رضي الله عنه: «قضى رسول الله ﷺ في جنين امرأة من بني لحيان سقط ميتا، بغرة عبد أو أمة، ثم إن المرأة التي قضي عليها بالغرة توفيت، فقضى رسول الله ﷺ أن ميراثها لزوجها، وبنيها، وأن العقل على عصبتها».", "وإنما وجبت على العاقلة؛ لأن جنايات الخطأ كثيرة، والجاني فيها معذور، فوجبت مواساته، والتخفيف عنه بخلاف المتعمد؛ ولأن المتعمد يدفع الدية فداء عن نفسه؛ لأنه يجب عليه القصاص، فإن عفي عنه تحمل الدية."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: أنواع الديات ومقاديرها", ["1- أنواع الديات:", "الأصل في الدية هو الإبل؛ لقوله ﷺ: «في النفس المؤمنة مائة من الإبل...». وقوله ﷺ: «ألا وإن قتيل الخطأ شبه العمد ما كان بالسوط والعصا، مائة من الإبل».", "وعن عمرو بن شعيب، عن أبيه، عن جده، قال: «كانت قيمة الدية على عهد رسول الله ﷺ ثمانمائة دينار أو ثمانية آلاف درهم، فكان ذلك كذلك حتى استخلف عمر فقام خطيبا فقال: ألا إن الإبل قد غلت، قال: ففرضها عمر - وفي رواية: فقوم - على أهل الذهب ألف دينار، وعلى أهل الورق اثني عشر ألفا، وعلى أهل البقر مائتي بقرة، وعلى أهل الشاء ألفي شاة، وعلى أهل الحلل مائتي حلة».", "وعلى هذا، فإن الأصل في الدية الإبل. وهذه الأشياء المذكورة سواها يكون معتبرا بها من باب التقويم، وقد كان ذلك من عمر رضي الله عنه بمحضر من الصحابة، ولم ينكروا ذلك عليه، فيكون إجماعا، فتدفع الدية إبلا، أو قيمتها، من هذه الأشياء المذكورة.", "2- مقادير الدية:", "- دية الحر المسلم: تكون مائة من الإبل، وتغلظ في قتل العمد وشبهه، وتغليظ الدية: أن يكون في بطون أربعين منها أولادها، كما تقدم في حديث عمرو بن شعيب، عن أبيه، عن جده، وفيه: «وأربعون خلفة».", "- دية الحر الكتابي: دية الحر الكتابي - ذميا كان أو غيره - نصف دية المسلم، لحديث عمرو بن شعيب، عن أبيه، عن جده: أن النبي ﷺ قال: «عقل أهل الذمة نصف عقل المسلمين». وفي لفظ: «دية المعاهد نصف دية المسلم».", "- دية المرأة: دية الحرة المسلمة على النصف من دية الرجل الحر المسلم، كما في كتاب عمرو بن حزم: «دية المرأة على النصف من دية الرجل». ونقل ابن عبد البر، وابن المنذر، الإجماع على ذلك.", "- دية المجوسي: دية المجوسي الحر - ذميا كان أو معاهدا أو غيره - وكذا الوثني: ثمانمائة درهم؛ لحديث عقبة بن عامر مرفوعا: «دية المجوسي ثمانمائة درهم».", "- دية المجوسية ونساء أهل الكتاب وعبدة الأوثان: على النصف من دية ذكرانهم، كما أن دية نساء المسلمين على النصف من دية ذكرانهم؛ لعموم حديث عمرو بن شعيب المتقدم: «عقل أهل الكتاب نصف عقل المسلمين».", "- دية الجنين: دية الجنين إذا سقط ميتا بسبب جناية على أمه عمدا أو خطأ: غرة عبد أو أمة، لحديث أبي هريرة قال: «قضى رسول الله ﷺ في جنين امرأة من بني لحيان سقط ميتا بغرة، عبد أو أمة». وتقدر الدية بعشر دية أمه وهي: خمس من الإبل. وتورث الغرة عنه، كأنه سقط حيا."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "ما الدية شرعا؟", "o": ["المال المؤدى للمجني عليه أو لوليه بسبب الجناية", "القصاص من الجاني", "الكفارة بالصيام", "نفقة الأقارب"], "h": "راجع: ص354 (المسألة الأولى)"}, {"t": "mcq", "d": 1, "q": "ما الأصل في الدية؟", "o": ["الإبل", "الذهب", "البقر", "الشاء"], "h": "راجع: ص356 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "على من تجب دية قتل الخطأ وشبه العمد؟", "o": ["على عاقلة القاتل", "في مال القاتل وحده", "على بيت المال", "على أولياء المقتول"], "h": "راجع: ص355 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "دية المرأة على النصف من دية الرجل.", "a": true, "h": "راجع: ص357 (المسألة الرابعة)"}, {"t": "tf", "d": 2, "q": "دية الحر الكتابي نصف دية المسلم.", "a": true, "h": "راجع: ص356-357 (المسألة الرابعة)"}]}], "sum": [["تعريفها", "ص354-357"], ["مشروعيتها، ودليل ذلك، والحكمة منها", "ص354-357"], ["على من تجب الدية؟ ومن يتحملها؟", "ص354-357"], ["أنواع الديات ومقاديرها", "ص354-357"]]}, {"id": "l89", "title": "الباب الثالث: في القسامة", "group": "الكتاب العاشر: الجنايات", "map": {"center": "الباب الثالث\nالجنايات", "nodes": [{"t": "تعريفها، وحكمها، وحكمتها", "s": []}, {"t": "شروط القسامة", "s": []}, {"t": "صفة القسامة", "s": []}]}, "paras": [{"t": "الباب الثالث: في القسامة", "b": [{"pic": ["scroll", "book"], "cap": "ص357-360"}, {"story": ["المسألة الأولى: تعريفها، وحكمها، وحكمتها", ["1- تعريفها: القسامة لغة: مصدر قولهم: أقسم يقسم إقساما وقسامة، أي: حلف حلفا.", "وشرعا: هي الأيمان المكررة في دعوى القتيل المعصوم، سميت بذلك؛ لأن الأيمان تقسم على أولياء القتيل فيحلفون خمسين يمينا أن المدعى عليه قتل صاحبهم. وصورتها: أن يوجد قتيل لا يعرف قاتله، فتجري القسامة على الجماعة التي ينحصر فيها إمكان قتله، وذلك إذا توافرت الشروط الآتي ذكرها.", "2- مشروعيتها: وهي مشروعة، ويثبت بها القصاص، أو الدية، إذا لم تقترن الدعوى ببينة أو إقرار، ووجد اللوث، وهو العداوة الظاهرة بين القتيل والمتهم بقتله؛ كالقبائل التي يطلب بعضها بعضا بالثأر، وقيل: لا يختص بذلك، بل يتناول كل ما يغلب على الظن صحة الدعوى.", "والدليل على مشروعيتها: حديث سهل بن أبي حثمة: أن عبد الله بن سهل ومحيصة بن مسعود خرجا إلى خيبر من جهد أصابهم؛ فأتى محيصة، فأخبر أن عبد الله بن سهل قد قتل وطرح في عين - أو فقير -، فأتى يهود فقال: أنتم والله قتلتموه، فقالوا: والله ما قتلناه، ثم أقبل حتى أتى على قومه، فذكر لهم ذلك، ثم أقبل هو وأخوه حويصة وهو أكبر منه - وعبد الرحمن بن سهل... فقال رسول الله ﷺ لحويصة ومحيصة وعبد الرحمن: «أتحلفون، وتستحقون دم صاحبكم»؟ وفي رواية: «تأتون بالبينة»، قالوا: ما لنا بينة. فقال: «أتحلفون»؟ قالوا: وكيف نحلف ولم نشهد ولم نر؟ قال: «فتحلف لكم يهود»؟ قالوا: ليسوا بمسلمين، فوداه رسول الله ﷺ من عنده، فبعث إليهم رسول الله ﷺ مائة ناقة حتى أدخلت عليهم الدار، فقال سهل: فلقد ركضتني منها ناقة حمراء.", {"note": "حاشية (ص358): الفقير: البئر الواسعة الفم، القريبة القعر، وقيل: الحفيرة تكون حول النخل."}, "فدل ذلك على مشروعية القسامة، وأنها أصل من أصول الشرع مستقل بنفسه.", "3- حكمتها: شرعت القسامة لصيانة الدماء وعدم إهدارها؛ فالشريعة الإسلامية تحرص أشد الحرص على حفظ الدماء، وصيانتها، وعدم إهدارها، ولما كان القتل يكثر، بينما تقل الشهادة عليه؛ لأن القاتل يتحرى بالقتل مواضع الخلوات، جعلت القسامة حفظا للدماء."]], "ic": "scroll"}, {"story": ["المسألة الثانية: شروط القسامة", ["1- أن يكون هناك لوث، وقد سبق بيان معناه.", "2- أن يكون المدعى عليه مكلفا، فلا تصح الدعوى فيها على صغير ولا مجنون.", "3- أن يكون المدعي مكلفا أيضا، فلا تسمع دعوى صبي ولا مجنون.", "4- أن يكون المدعى عليه معينا، فلا تقبل الدعوى على شخص مبهم.", "5- إمكان القتل من المدعى عليه، فإن لم يمكن منه القتل لبعده عن مكان الحادث وقت وقوعه ونحو ذلك، لم تسمع الدعوى.", "6- ألا تتناقض دعوى المدعي.", "7- أن تكون دعوى القسامة مفصلة موصوفة، فيقول: أدعي أن هذا قتل وليي فلان بن فلان، عمدا أو شبه عمد أو خطأ، ويصف القتل."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: صفة القسامة", ["إذا توافرت شروط القسامة، يبدأ بالمدعين فيحلفون خمسين يمينا توزع عليهم على قدر إرثهم من القتيل، أن فلانا هو الذي قتله. ويكون ذلك بحضور المدعى عليه؛ لقوله ﷺ في حديث ابن أبي حثمة الماضي: «أفتستحقون الدية بأيمان خمسين منكم؟».", "فإن أبى الورثة أن يحلفوا، أو امتنعوا من تكميل الخمسين يمينا، فإنه يحلف المدعى عليه خمسين يمينا إذا رضي المدعون بأيمانه؛ لقوله ﷺ في الحديث المتقدم: «فتحلف لكم يهود»؟ قالوا: ليسوا بمسلمين، ولم يرضوا بأيمانهم. فإذا حلف برئ، وإن لم يرض المدعون بتحليف المدعى عليه فدى الإمام القتيل بالدية من بيت المال، كما فعل النبي ﷺ عندما امتنع الأنصار من قبول أيمان اليهود؛ لأنه لم يبق سبيل لإثبات الدم على المدعى عليه، فوجب الغرم من بيت المال؛ لئلا يضيع دم المعصوم هدرا.", "ومن قتل في الزحام فإنه تدفع ديته من بيت المال؛ لما روي عن علي رضي الله عنه أنه قال لعمر في رجل قتل في زحام الناس بعرفة: «يا أمير المؤمنين، لا يطل دم امرئ مسلم، إن علمت قاتله، وإلا فأعط ديته من بيت المال».", {"note": "حاشية (ص360): أي يهدر، يقال: طل السلطان الدم، طلا - من باب قتل -: أهدره."}]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "ما القسامة شرعا؟", "o": ["الأيمان المكررة في دعوى القتيل المعصوم", "دية الجنين", "كفارة القتل", "عقوبة السرقة"], "h": "راجع: ص358 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "كم يمينا يحلف المدعون في القسامة؟", "o": ["خمسين يمينا", "عشرة أيمان", "مائة يمين", "يمينا واحدة"], "h": "راجع: ص359 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "من قتل في الزحام فإن ديته تدفع من بيت المال.", "a": true, "h": "راجع: ص360 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "تصح دعوى القسامة على شخص مبهم.", "a": false, "h": "راجع: ص359 (المسألة الثانية)"}]}], "sum": [["تعريفها، وحكمها، وحكمتها", "ص357-360"], ["شروط القسامة", "ص357-360"], ["صفة القسامة", "ص357-360"]]}, {"id": "l90", "title": "الباب الأول: في تعريف الحدود، ومشروعيتها، والحكمة منها، ومسا", "group": "الكتاب الحادي عشر: الحدود", "map": {"center": "الباب الأول\nالحدود", "nodes": [{"t": "تعريفها، ومشروعيتها، والحكمة منها،", "s": []}]}, "paras": [{"t": "الباب الأول: في تعريف الحدود، ومشروعيتها، والحكمة منها، ومسائل أخرى", "b": [{"pic": ["scroll", "book"], "cap": "ص361-363"}, {"story": ["تعريفها، ومشروعيتها، والحكمة منها، ومسائل أخرى", ["1- تعريفها: الحد لغة: هو المنع، وحدود الله: محارمه التي نهى عن ارتكابها وانتهاكها، قال تعالى: ﴿تلك حدود الله فلا تقربوها﴾ [البقرة: 187] سميت بذلك لأنها تمنع من الإقدام على الوقوع فيها.", "وشرعا: عقوبة مقدرة؛ لأجل حق الله تعالى. وقيل: عقوبة مقدرة شرعا في معصية؛ لتمنع من الوقوع في مثلها أو في مثل الذنب الذي شرع له العقاب.", "2- دليل مشروعيتها: الأصل في مشروعية الحدود الكتاب والسنة والإجماع؛ فقد قرر الكتاب والسنة عقوبات محددة لجرائم ومعاص معينة، كالزنى، والسرقة، وشرب الخمر، وغيرها، مما سيأتي تفصيله في الأبواب التالية إن شاء الله، مع ذكر أدلة ذلك كله.", "3- الحكمة من مشروعية الحدود: شرعت الحدود؛ زجرا للنفوس عن ارتكاب المعاصي والتعدي على حرمات الله سبحانه، فتتحقق الطمأنينة في المجتمع ويشيع الأمن بين أفراده، ويسود الاستقرار، ويطيب العيش.", "كما أن فيها تطهيرا للعبد في الدنيا؛ لحديث عبادة بن الصامت مرفوعا في البيعة، وفيه: «ومن أصاب من ذلك شيئا فعوقب به فهو كفارة له». وحديث خزيمة بن ثابت مرفوعا: «من أصاب حدا أقيم عليه ذلك الحد فهو كفارة ذنبه».", "وهذه الحدود مع كونها محققة لمصلحة العباد، فإنها عدل كلها وإنصاف، بل هي غاية العدل.", "4- وجوب إقامة الحدود وتحريم الشفاعة فيها:", "تجب إقامة الحدود بين الناس منعا للمعاصي وردعا للعصاة، وقد قال رسول الله ﷺ مرغبا في إقامة الحدود: «إقامة حد من حدود الله، خير من مطر أربعين ليلة في بلاد الله عز وجل».", "وتحرم الشفاعة في الحدود لإسقاطها وعدم إقامتها، إذا بلغت الإمام وثبتت عنده، كما يحرم على ولي الأمر قبول الشفاعة في ذلك؛ لقوله ﷺ: «من حالت شفاعته دون حد من حدود الله، فقد ضاد الله في أمره»، ولرده شفاعة أسامة بن زيد في المخزومية التي سرقت، وغضبه لذلك، حتى قال ﷺ: «وايم الله لو أن فاطمة بنت محمد سرقت لقطع محمد يدها».", "وأما العفو عن الحد قبل أن يبلغ الإمام فجائز؛ لقوله ﷺ للذي سرق رداؤه: «فهلا قبل أن تأتيني به تركته». فأراد أن يعفو عن السارق.", "5- من يقيم الحد ومكان إقامته:", "الذي يقيم الحد هو الإمام أو نائبه، فقد كان النبي ﷺ يقيم الحدود في حياته، ثم خلفاؤه من بعده. وقد وكل النبي ﷺ من يقيم الحد نيابة عنه، فقال: «واغد يا أنيس إلى امرأة هذا، فإن اعترفت فارجمها».", "ووجب ذلك على الإمام؛ ضمانا للعدالة، ومنعا للحيف والظلم.", "ويقام الحد في أي مكان غير المسجد؛ فقد نهى النبي ﷺ أن يستقاد في المسجد، وأن تنشد فيه الأشعار، وأن تقام فيه الحدود، وذلك صيانة للمسجد عن التلوث ونحوه. وجاء في بعض الروايات في قصة رجم ماعز: «فأخرج إلى الحرة فرجم»."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "ما الحد لغة؟", "o": ["المنع", "الحبس", "الجلد", "القطع"], "h": "راجع: ص361 (تعريفها)"}, {"t": "mcq", "d": 2, "q": "من الذي يقيم الحد؟", "o": ["الإمام أو نائبه", "أي شخص", "ولي المجني عليه", "القاضي فقط دون الإمام"], "h": "راجع: ص362 (من يقيم الحد)"}, {"t": "tf", "d": 2, "q": "تحرم الشفاعة في الحدود إذا بلغت الإمام وثبتت عنده.", "a": true, "h": "راجع: ص362 (وجوب إقامة الحدود)"}, {"t": "tf", "d": 2, "q": "تقام الحدود في المسجد.", "a": false, "h": "راجع: ص363 (من يقيم الحد ومكان إقامته)"}]}], "sum": [["تعريفها، ومشروعيتها، والحكمة منها،", "ص361-363"]]}, {"id": "l91", "title": "الباب الثاني: في حد الزنى", "group": "الكتاب الحادي عشر: الحدود", "map": {"center": "الباب الثاني\nالحدود", "nodes": [{"t": "تعريف الزنى وحكمه وخطورته", "s": []}, {"t": "حد الزنى", "s": []}, {"t": "بم يثبت الزنى؟", "s": []}]}, "paras": [{"t": "الباب الثاني: في حد الزنى", "b": [{"pic": ["scroll", "book"], "cap": "ص363-367"}, {"story": ["المسألة الأولى: تعريف الزنى وحكمه وخطورته", ["1- تعريف الزنى:", "الزنى لغة: يطلق على وطء المرأة من غير عقد شرعي، وعلى مباشرة المرأة الأجنبية.", "وشرعا: وطء الرجل المرأة في القبل من غير الملك وشبهته. أو: هو فعل الفاحشة في قبل أو دبر.", "2- حكم الزنى:", "الزنى محرم، وهو من كبائر الذنوب؛ لقوله تعالى: ﴿ولا تقربوا الزنى إنه كان فاحشة وساء سبيلا﴾ [الإسراء: 32].", "ولحديث ابن مسعود رضي الله عنه قال: سألت رسول الله ﷺ عن أي الذنب أعظم؟ قال: «أن تجعل لله ندا وهو خلقك» قلت: ثم أي؟ قال: «أن تقتل ولدك خشية أن يطعم معك» قلت: ثم أي؟ قال: «أن تزاني بحليلة جارك».", "وأجمع العلماء على تحريمه.", "3- خطورة جريمة الزنى، وشناعتها، ومفاسدها:", "الزنى من أعظم الجرائم وأشنعها وأكثرها خطرا على الأفراد والمجتمعات؛ لما يترتب عليه من اختلاط الأنساب، مما يؤدي إلى ضياع الحقوق عند التوارث، وضياع التعارف، والتناصر على الحق. وهو سبب في تفكك الأسرة، وضياع الأبناء، وسوء تربيتهم، وفساد أخلاقهم. وفيه تغرير بالزوج؛ إذ قد ينتج عن الزنى حمل، فيربي الزوج غير ابنه. وأضراره كثيرة لا يخفى أثرها في الأفراد والمجتمعات: من ضياع وانحلال وتفكك.", "لذا حذر منه الإسلام أشد التحذير، ورتب على ارتكابه أشد العقوبة، كما سيأتي بيانه."]], "ic": "scroll"}, {"story": ["المسألة الثانية: حد الزنى", ["لا يخلو حال الزاني من أحد أمرين:", "1- أن يكون محصنا.", "2- أو يكون غير محصن.", "أولا: الزاني المحصن:", "ويشترط للإحصان الموجب للحد الشروط التالية:", "أ- أن يحصل منه الوطء في القبل، وذلك بأن يتقدم للزاني والزانية وطء مباح في الفرج.", "ب- أن يكون الوطء في نكاح صحيح.", "ج- أن يكون الرجل والمرأة حال الوطء بالغين حرين عاقلين.", "فالمحصن: هو من وطئ زوجته في قبلها، بنكاح صحيح، وكانا بالغين عاقلين حرين.", "فهذه خمسة شروط لا بد منها لحصول الإحصان الموجب للحد، وهي: البلوغ، والعقل، والحرية، والوطء في الفرج، وأن يكون الوطء بنكاح صحيح.", "حده: إذا زنى المحصن فإن حده الرجم بالحجارة حتى الموت، رجلا كان، أو امرأة. والرجم ثابت عن النبي ﷺ بالتواتر من قوله وفعله. وقد كان الرجم مذكورا في القرآن، ثم نسخ لفظه وبقي حكمه، وذلك في قوله عز وجل: (الشيخ والشيخة إذا زنيا فارجموهما البتة نكالا من الله والله عزيز حكيم).", "فعن عمر بن الخطاب رضي الله عنه أنه خطب فقال: «إن الله بعث محمدا بالحق وأنزل عليه الكتاب، فكان فيما أنزل الله آية الرجم، فقرأناها ووعيناها وعقلناها، فرجم رسول الله ﷺ ورجمنا بعده، فأخشى إن طال بالناس زمان أن يقول قائل: ما نجد الرجم في كتاب الله فيضلوا بترك فريضة أنزلها الله، وإن الرجم حق في كتاب الله على من زنى إذا أحصن من الرجال والنساء، إذا قامت البينة، أو كان الحبل، أو الاعتراف». ولحديث أبي هريرة رضي الله عنه قال: أتى رجل من المسلمين رسول الله ﷺ وهو في المسجد فناداه، فقال: يا رسول الله، إني زنيت، فأعرض عنه فتنحى تلقاء وجهه، فقال: يا رسول الله، إني زنيت، فأعرض عنه، حتى ثنى ذلك عليه أربع مرات، فلما شهد على نفسه أربع شهادات دعاه رسول الله ﷺ، فقال: «أبك جنون؟» قال: لا، قال: «فهل أحصنت؟» قال: نعم، فقال رسول الله ﷺ: «اذهبوا به فارجموه».", "وأجمع العلماء على أن من زنى، وهو محصن، فحكمه الرجم بالحجارة حتى الموت.", "ثانيا: الزاني غير المحصن:", "وهو من لم تتوافر فيه الشروط السابقة في الزاني المحصن.", "حده: إذا زنى غير المحصن فإن حده الجلد مائة جلدة، وتغريب عام، إلا أنه يشترط في تغريب المرأة وجود محرم معها؛ لقوله تعالى: ﴿الزانية والزاني فاجلدوا كل واحد منهما مائة جلدة﴾ [النور: 2]. ولحديث عبادة بن الصامت رضي الله عنه قال: قال رسول الله ﷺ: «خذوا عني، خذوا عني، قد جعل الله لهن سبيلا، البكر بالبكر جلد مائة، ونفي عام». وتغريب الزاني: نفيه وإبعاده عن وطنه.", "وإن زنى الرقيق - محصنا كان أو غير محصن، عبدا كان أو أمة - فإن حده أن يجلد خمسين جلدة؛ لقوله تعالى: ﴿فعليهن نصف ما على المحصنات من العذاب﴾ [النساء: 25]. فالعذاب المذكور في الآية هو الجلد مائة جلدة، فينصرف التنصيف إليه، ولأن الرجم لا يمكن تنصيفه.", "ولا تغريب على الرقيق، إذ لم ترد السنة بتغريب المملوك إذا زنى، ولأن في تغريبه إضرارا بسيده. ولا تغرب المرأة إلا بمحرم كما سبق."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: بم يثبت الزنى؟", ["لإقامة حد الزنى لا بد من إثبات وقوعه، ولا يثبت وقوعه إلا بأحد أمرين:", "الأمر الأول: أن يقر به الزاني أربع مرات، ولو في مجالس متعددة؛ فقد أخذ النبي ﷺ باعتراف ماعز والغامدية. وأما اشتراط الأربع: فلأن ماعزا اعترف عند النبي ﷺ ثلاث مرات فرده، فلما اعترف الرابعة أقام عليه الحد.", "- ولا بد أن يصرح في إقراره بحقيقة الزنى والوطء؛ لاحتمال أنه أراد غير الزنا من الاستمتاع الذي لا يوجب حدا، فقد قال النبي ﷺ لماعز حين أقر عنده: «لعلك قبلت أو غمزت؟» قال: لا. وكرر معه الاستيضاح عدة مرات حتى زال كل احتمال.", "أن يثبت على إقراره حتى إقامة الحد، ولا يرجع عنه، فقد قرر النبي ﷺ مرة، لعله يرجع عن إقراره، ولأن ماعزا لما هرب أثناء رجمه قال رسول الله ﷺ: «هلا تركتموه؟!».", "الأمر الثاني: أن يشهد عليه بالزنى أربعة شهود؛ لقوله تعالى: ﴿لولا جاءوا عليه بأربعة شهداء﴾ [النور: 13]. وقوله: ﴿فاستشهدوا عليهن أربعة منكم﴾ [النساء: 15].", "ويشترط لصحة شهادتهم عليه بالزنى شروط:", "1- أن يكون الشهود أربعة، للآيات المتقدمة، فإن كانوا أقل من أربعة لم تقبل.", "2- أن يكونوا مكلفين - بالغين عاقلين -، فلا تقبل شهادة الصبيان والمجانين.", "3- أن يكونوا رجالا عدولا، فلا تقبل شهادة النساء في حد الزنى، صيانة لهن وتكريما؛ لأن الزنى فاحشة. ولا تقبل شهادة الفاسق أيضا؛ لقوله تعالى: ﴿وأشهدوا ذوي عدل منكم﴾ [الطلاق: 2] وقوله تعالى: ﴿يا أيها الذين آمنوا إن جاءكم فاسق بنبأ فتبينوا﴾ [الحجرات: 6].", "4- أن يعاين الشهود الزنى ويصفوا ذلك وصفا صريحا يدفع كل الاحتمالات عن إرادة غيره من الاستمتاع المحرم، فيقولون: رأينا ذكره في فرجها كالميل في المكحلة، وإنما أبيح النظر في مثل ذلك للضرورة.", "5- أن يكون الشهود مسلمين، فلا تقبل شهادة الكافر لعدم تحقق عدالته.", "6- أن يشهدوا عليه في مجلس واحد، سواء جاءوا مجتمعين أو متفرقين في المجلس نفسه.", "فإن اختل شرط من هذه الشروط، وجب إقامة حد القذف على الشهود جميعا؛ لأنهم قذفة."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "ما الزنى شرعا؟", "o": ["وطء الرجل المرأة في القبل من غير الملك وشبهته", "الرمي بالحجارة", "شرب الخمر", "أخذ المال خفية"], "h": "راجع: ص363 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "ما حد الزاني المحصن؟", "o": ["الرجم بالحجارة حتى الموت", "الجلد مائة وتغريب عام", "القطع", "الحبس"], "h": "راجع: ص365 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "ما حد الزاني غير المحصن؟", "o": ["الجلد مائة جلدة وتغريب عام", "الرجم", "جلد ثمانين", "القطع"], "h": "راجع: ص365-366 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "بم يثبت الزنى؟", "o": ["بإقرار الزاني أربع مرات، أو بشهادة أربعة شهود", "بشهادة شاهدين", "بشهادة امرأتين", "بالظن"], "h": "راجع: ص366 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "حد الرقيق إذا زنى أن يجلد خمسين جلدة.", "a": true, "h": "راجع: ص366 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "تقبل شهادة النساء في حد الزنى.", "a": false, "h": "راجع: ص367 (المسألة الثالثة)"}]}], "sum": [["تعريف الزنى وحكمه وخطورته", "ص363-367"], ["حد الزنى", "ص363-367"], ["بم يثبت الزنى؟", "ص363-367"]]}, {"id": "l92", "title": "الباب الثالث: في حد القذف", "group": "الكتاب الحادي عشر: الحدود", "map": {"center": "الباب الثالث\nالحدود", "nodes": [{"t": "معنى القذف وحكمه", "s": []}, {"t": "حد القذف والحكمة منه", "s": []}, {"t": "شروط إيجاب حد القذف", "s": []}, {"t": "شروط إقامة حد القذف", "s": []}]}, "paras": [{"t": "الباب الثالث: في حد القذف", "b": [{"pic": ["scroll", "book"], "cap": "ص368-371"}, {"story": ["المسألة الأولى: معنى القذف وحكمه", ["1- تعريف القذف:", "القذف لغة: الرمي، ومنه القذف بالحجارة وغيرها، ثم استعمل في الرمي بالمكاره كالزنى واللواط ونحوهما؛ لعلاقة المشابهة بينهما، وهي الأذى.", "وشرعا: الرمي بزنى أو لواط، أو شهادة بأحدهما ولم تكمل البينة، أو نفي نسب موجب للحد فيهما.", "2- حكم القذف:", "القذف في الأصل حرام بالكتاب، والسنة، والإجماع، وكبيرة من كبائر الذنوب، فيحرم الرمي بالفاحشة.", "لقوله تعالى: ﴿إن الذين يرمون المحصنات الغافلات المؤمنات لعنوا في الدنيا والآخرة ولهم عذاب عظيم﴾ [النور: 23].", "ولحديث أبي هريرة رضي الله عنه أن النبي ﷺ قال: «اجتنبوا السبع الموبقات»، وذكر منها: «قذف المحصنات المؤمنات الغافلات».", "وقد أجمع المسلمون على تحريم القذف وعدوه من كبائر الذنوب.", "ويجب القذف على من يرى زوجته تزني، ثم تلد ولدا يقوى في ظنه أنه من الزاني؛ لئلا يلحقه الولد، ويدخله على قومه وليس منهم. ويباح القذف لمن رأى زوجته تزني، ولم تلد من ذلك الزنى."]], "ic": "scroll"}, {"story": ["المسألة الثانية: حد القذف والحكمة منه", ["1- حد القذف:", "قد قرر الشارع أن من قذف مسلما بالزنى، ولم تقم بينة على صدقه فيما قذف به، أنه يجلد ثمانين جلدة إن كان حرا، وأربعين إن كان عبدا، رجلا كان أو امرأة؛ لقوله تعالى: ﴿والذين يرمون المحصنات ثم لم يأتوا بأربعة شهداء فاجلدوهم ثمانين جلدة﴾ [النور: 4]. ويجب على القاذف - مع إقامة الحد عليه - عقوبة، وهي رد شهادته والحكم بفسقه؛ لقوله تعالى: ﴿ولا تقبلوا لهم شهادة أبدا وأولئك هم الفاسقون﴾ [النور: 4].", "فإذا تاب القاذف قبلت شهادته، وتوبته: أن يكذب نفسه فيما قذف به غيره، وينـدم ويستغفر ربه؛ لقوله تعالى: ﴿إلا الذين تابوا من بعد ذلك وأصلحوا فإن الله غفور رحيم﴾ [النور: 5].", "2- الحكمة من
