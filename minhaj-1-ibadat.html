صلى الله عليه وسلم قال له ولفاطمة: «إذا أخذتما مضاجعكما، أو أويتما إلى فراشكما، فسبحا الله(١) ثلاثا وثلاثين، واحمدا ثلاثا وثلاثين، وكبرا أربعا وثلاثين، فهو خير لكما من خادم».", "وفي أفراد البخاري من حديث حذيفة قال: كان رسول الله صلى الله عليه وسلم إذا أوى إلى فراشه وضع يده تحت خده وقال: «اللهم باسمك أموت، وباسمك أحيا».", "وفي أفراده من حديث أبي هريرة أن شيطانا قال له: إذا أويت إلى فراشك فاقرأ آية الكرسي فإنه لن يزال عليك من الله حافظ، ولا يقربك شيطان حتى تصبح. فأخبر رسول الله صلى الله عليه وسلم فقال: «أما إنه قد صدقك وهو كذوب».", "وفي أفراد مسلم من حديث أنس قال: كان رسول الله صلى الله عليه وسلم إذا أوى إلى فراشه قال: «الحمد لله الذي أطعمنا وسقانا، وكفانا وآوانا، فكم ممن لا كافي له ولا مؤوي»."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "وفي أفراد مسلم من حديث عثمان بن أبي العاص أنه شكا إلى رسول الله صلى الله عليه وسلم وجعا يجده في ____ منذ أسلم، فقال له رسول الله صلى الله عليه وسلم", "o": ["جسده", "لرتبة", "والحوض", "وتسمى"], "h": "راجع: ص٢٨٦"}, {"t": "fill", "d": 2, "q": "فإذا غضبت، فقل: أعوذ بالله من الشيطان الرجيم، وفي الصحيحين من حديث سليمان بن صرد قال: كنت جالسا مع النبي صلى الله عليه وسلم ورجلان يستبان، وأحدهما قد ____ وجهه وانتفخت أوداجه، فقال النبي صلى الله", "o": ["احمر", "أسامة", "وقاية", "كنزك"], "h": "راجع: ص٢٨٤"}, {"t": "fill", "d": 2, "q": "وفي أفراده من حديث كعب بن عجرة عن رسول الله صلى الله ____ وسلم أنه قال", "o": ["عليه", "ليلهم", "والريح", "يردف"], "h": "راجع: ص٢٨٣"}, {"t": "fill", "d": 2, "q": "أخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا ابن المغيرة قال: حدثنا أبو بكر قال: حدثني ضمرة بن ____ عن أبي الدرداء عن زيد بن", "o": ["حبيب", "تعتريه", "السحور", "العلي"], "h": "راجع: ص٢٨٩"}, {"t": "fill", "d": 2, "q": "وفي أفراده من حديث أبي هريرة أن ____ قال له", "o": ["شيطانا", "وجلسوا", "تجمعها", "بالتكبير"], "h": "راجع: ص٢٨٧"}, {"t": "fill", "d": 2, "q": "وفي الصحيحين من حديث البراء بن عازب أن رسول الله صلى الله عليه ____ قال له", "o": ["وسلم", "للقرب", "يأكل", "المرئي"], "h": "راجع: ص٢٨٦"}]}, {"t": "الباب الرابع في الأدعية المأثورة عند الحوادث - القسم ٢ من ٢", "b": [{"story": ["الباب الرابع في الأدعية المأثورة عند الحوادث (٥ من ٧)، ص٢٨٧", ["**فإذا استيقظت لقيام الليل،** فادع بدعاء رسول الله صلى الله عليه وسلم حينئذ؛ أخبرنا عبد الأول قال: أخبرنا الداودي قال: أخبرنا ابن أعين قال: حدثنا الفربري قال: حدثنا البخاري قال: حدثنا علي بن عبد الله قال: حدثنا سفيان قال: حدثنا سليمان عن طاوس سمع ابن عباس قال: كان النبي صلى الله عليه وسلم إذا قام من الليل يتهجد قال: «اللهم لك الحمد، أنت قيم السماوات والأرض ومن فيهن، ولك الحمد، بديع السماوات والأرض ومن فيهن، ولك الحمد، أنت نور السماوات والأرض ومن فيهن، ولك الحمد، أنت ملك السماوات والأرض ومن فيهن، ولك الحمد، أنت الحق، ووعدك الحق(٢)، ولقاؤك حق، والجنة حق، والنار حق، والنبيون حق،", "حاشية: (١) ليست في (ظ).", "حاشية: (٢) في (ظ): «حق».", "ومحمد حق، والساعة حق، اللهم لك أسلمت، وبك آمنت وعليك توكلت، وإليك أنبت، وبك خاصمت، وإليك حاكمت، فاغفر لي ما قدمت وأخرت، وما أسررت وأعلنت، أنت المقدم، وأنت المؤخر، لا إله إلا أنت، ولا إله غيرك». أخرجاه في الصحيحين.", "**فإذا استيقظت من نومك عند الصباح،** ففي أفراد البخاري من حديث حذيفة أن النبي صلى الله عليه وسلم كان إذا استيقظ قال: «الحمد لله الذي أحيانا بعدما أماتنا، وإليه النشور».", "وفي أفراد مسلم من حديث ابن مسعود قال: كان رسول الله صلى الله عليه وسلم إذا أمسى قال: «أمسينا وأمسى الملك لله والحمد لله، لا إله إلا الله، وحده لا شريك له، له الملك وله الحمد، وهو على كل شيء قدير، رب أسألك خير ما في هذه الليلة، وخير ما بعدها، وأعوذ بك من شر ما في هذه الليلة، وشر ما بعدها، رب أعوذ بك من الكسل، وسوء الكبر، رب أعوذ بك من عذاب في النار، وعذاب في القبر». وإذا أصبح قال ذلك أيضا: «أصبحنا وأصبح الملك لله».", "وفي حديث عثمان بن عفان عن النبي صلى الله عليه وسلم أنه قال: «من قال(١-١) في أول يومه، أو في أول ليلته: بسم الله الذي لا يضر مع اسمه شيء في الأرض ولا في السماء، وهو السميع العليم. لم يضره شيء في ذلك اليوم، أو في تلك الليلة».", "وفي حديث أبي أيوب الأنصاري عن النبي صلى الله عليه وسلم أنه قال: «من قال(١-١) حين يصبح: لا إله إلا الله، وحده لا شريك له، له الملك، وله الحمد، وهو على كل شيء قدير. عشر مرات، كتب الله له بكل واحدة قالها عشر حسنات، وكن له كعشر رقاب، وكن له مسلحة(٢) من أول النهار إلى آخره، ولم يعمل يومئذ عملا يقهرهن».", "وفي حديث أبي ذر عن النبي صلى الله عليه وسلم: «من قال في دبر صلاة الفجر، وهو ثان رجليه قبل أن يتكلم: لا إله إلا الله، فذكر الكلمات عشر مرات، كتبت له عشر", "حاشية: (١-١) ساقط من (ظ).", "حاشية: (٢) المسلحة: القوم المسلحون في ثغر أو مخفر للمحافظة والمدافعة."]], "ic": "book"}, {"story": ["الباب الرابع في الأدعية المأثورة عند الحوادث (٦ من ٧)، ص٢٨٩", ["حسنات، ومحي عنه عشر سيئات، ورفع له عشر درجات، وكان يومه ذلك كله في حرز من كل مكروه، وحرس من الشيطان، ولم ينبغ لذنب أن يدركه في ذلك اليوم إلا الشرك بالله» رواه الترمذي وصححه، وقد ذكرنا لهذه الكلمات ثوابا آخر في فضائل التهليل، وذكرنا في فضائل الاستغفار حديث شداد بن أوس، وثواب من قاله في الصباح والمساء.", "أخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا ابن المغيرة قال: حدثنا أبو بكر قال: حدثني ضمرة بن حبيب عن أبي الدرداء عن زيد بن ثابت أن رسول الله صلى الله عليه وسلم علمه دعاء، وأمره أن يتعاهد به أهله كل يوم قال: «قل حين تصبح: لبيك اللهم، لبيك وسعديك، والخير في يديك، ومنك وبك وإليك، اللهم ما قلت من قول أو نذرت من نذر، أو حلفت من حلف، فمشيئتك بين يديه، ما شئت كان، وما لم تشأ لم يكن، ولا حول ولا قوة إلا بك، إنك على كل شيء قدير، اللهم وما صليت من صلاة فعلى من صليت، وما لعنت من لعنة فعلى من لعنت، إنك أنت وليي في الدنيا والآخرة، توفني مسلما وألحقني بالصالحين، أسألك اللهم الرضا بعد القضاء، وبرد العيش بعد الممات، ولذة نظر إلى وجهك، وشوق إلى لقائك من غير ضراء مضرة، ولا فتنة مضلة، أعوذ بك من أن أظلم أو أظلم، أو أعتدي أو يعتدى علي، أو أكتسب خطيئة محبطة أو ذنبا لا يغفر، اللهم فاطر السماوات والأرض، عالم الغيب والشهادة، ذا الجلال والإكرام، فإني أعهد إليك في هذه الحياة الدنيا، وأشهدك وكفى بك شهيدا أني أشهد أن لا إله إلا أنت، وحدك لا شريك لك، لك الملك، ولك الحمد، وأنت على كل شيء قدير، وأشهد أن محمدا عبدك ورسولك، وأشهد أن وعدك حق، ولقاءك حق، والجنة حق، والساعة آتية لا ريب فيها، وأنت تبعث من في القبور، وأشهد أنك إن تكلني إلى نفسي تكلني إلى ضيعة وعورة، وذنب وخطيئة، وإني لا أثق إلا برحمتك، فاغفر لي ذنبي كله، إنه لا يغفر الذنوب إلا أنت، وتب علي إنك أنت التواب الرحيم».", "وفي حديث عبد الرحمن بن أبزى أن النبي صلى الله عليه وسلم كان يقول إذا أصبح وإذا أمسى: «أصبحنا على فطرة الإسلام» أو «أمسينا على فطرة الإسلام، وعلى كلمة الإخلاص، وعلى دين نبينا محمد صلى الله عليه وسلم، وعلى ملة أبينا إبراهيم حنيفا مسلما، وما كان من المشركين».", "وفي حديث أبي موسى قال: كان النبي صلى الله عليه وسلم إذا صلى الصبح يرفع صوته حتى يسمع أصحابه يقول: «اللهم أصلح لي ديني الذي جعلته لي عصمة ـ ثلاث مرات ـ اللهم أصلح لي دنياي التي جعلت فيها معاشي ـ ثلاث مرات ـ اللهم إني أعوذ برضاك من سخطك، اللهم إني أعوذ بعفوك من نقمتك، اللهم إني أعوذ بك منك ـ لا مانع لما أعطيت، ولا معطي لما منعت، ولا ينفع ذا الجد جده» مرة واحدة."]], "ic": "book"}, {"story": ["الباب الرابع في الأدعية المأثورة عند الحوادث (٧ من ٧)، ص٢٩٠", ["وفي حديث معقل بن يسار عن النبي صلى الله عليه وسلم أنه قال: «من قال حين يصبح ثلاث مرات: أعوذ بالله، السميع العليم من الشيطان الرجيم. ثم قرأ الثلاث آيات من آخر سورة الحشر، وكل الله به سبعين ألف ملك يصلون عليه حين يمسي، وإن مات في ذلك اليوم كان شهيدا، ومن قالها حين يمسي كان بتلك المنزلة».", "أخبرنا إسماعيل بن أحمد قال: أخبرنا ابن النقور قال: أخبرنا ابن حبابة قال: حدثنا البغوي قال: حدثنا هدبة بن خالد قال: حدثنا الأغلب بن تميم قال: حدثنا الحجاج بن فرافصة عن طلق قال: جاء رجل إلى أبي الدرداء فقال: يا أبا الدرداء، احترق بيتك. فقال: ما احترق. ثم جاء رجل آخر فقال: يا أبا الدرداء، احترق بيتك، قال: ما احترق. ثم جاء رجل آخر (١-١)فقال: يا أبا الدرداء(١-١) لما انتهت النار إلى بيتك طفئت. قال: قد علمت أن الله عز وجل لم يكن ليفعل. قالوا: يا أبا الدرداء، ما ندري أي كلامك أعجب، قولك: ما احترق أو قولك: قد علمت أن الله عز وجل لم يكن ليفعل؟! قال: ذلك لكلمات سمعتهن من رسول الله صلى الله عليه وسلم من قالها أول النهار لم تصبه مصيبة حتى يمسي، ومن قالها آخر النهار لم تصبه مصيبة حتى يصبح: «اللهم إنك ربي لا إله إلا أنت، عليك توكلت، وأنت رب العرش", "حاشية: (١-١) سقط من الأصل.", "الكريم، ما شاء الله كان، وما لم يشأ لم يكن، ولا حول ولا قوة إلا بالله العلي العظيم، أعلم أن الله على كل شيء قدير، وأن الله قد أحاط بكل شيء علما، اللهم إني أعوذ بك من شر نفسي، ومن شر كل دابة أنت آخذ بناصيتها، إن ربي على صراط مستقيم».", "فهذه أدعية لا يستغني المريد عن حفظها، وقد تنكبنا(١) من جنسها ما لا يثبت، وأما ما يتعلق من الأدعية بأشياء سوى ما ذكرنا، كالوضوء والصلاة والسفر، فقد ذكرناه في مواضعه، فإن قال قائل: إذا كان القضاء لا يرد فما فائدة الدعاء؟ فالجواب: أن من القضاء رد البلاء بالدعاء، كما أن المجن سبب لرد السهم، وليس من شرط الإقرار بالقضاء ترك حمل السلاح، كيف وقد قال تعالى: ﴿خُذُوا حِذْرَكُمْ﴾ [النساء: ٧١]، فقد قدر المقدر لكل مقدور سببا، ثم إن الدعاء يستدعي حضور القلب، ويرده إلى الله سبحانه بعد إعراضه عنه، ثم يستخرج من الباطن صدق اللجأ والذل، وذلك كله مقصود.", "آخر كتاب الأذكار والدعوات.", "حاشية: (١) في (ظ): «تركنا»."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "وفي حديث أبي ذر عن ____ صلى الله عليه وسلم", "o": ["النبي", "منقادا", "مستجيرا", "شواربها"], "h": "راجع: ص٢٨٨"}, {"t": "fill", "d": 2, "q": "فإذا فرغت من الصلاة، ففي الصحيحين من حديث المغيرة عن النبي صلى الله ____ وسلم أنه كان يقول في دبر كل صلاة", "o": ["عليه", "لشكر", "ورمضان", "نكشف"], "h": "راجع: ص٢٨٢"}, {"t": "fill", "d": 2, "q": "فإذا دخلت السوق، ففي حديث بريدة عن النبي صلى الله ____ وسلم أنه كان إذا دخل السوق قال", "o": ["عليه", "المنبر", "أشار", "بصناعة"], "h": "راجع: ص٢٨٣"}, {"t": "fill", "d": 2, "q": "وفي حديث أبي أيوب الأنصاري عن ____ صلى الله عليه وسلم أنه قال", "o": ["النبي", "نهاره", "تسمى", "مغيث"], "h": "راجع: ص٢٨٨"}, {"t": "fill", "d": 2, "q": "وإذا وجدت وجعا في جسدك أو في جسد غيرك، فاسترق برقية رسول الله صلى الله عليه وسلم، ففي الصحيحين من حديث عائشة أن رسول الله صلى الله عليه وسلم كان ____ بعض أهله يمسح بيده اليمنى ويقول", "o": ["يعوذ", "تخرز", "أفقه", "تزكية"], "h": "راجع: ص٢٨٥"}, {"t": "fill", "d": 2, "q": "أخبرنا هبة الله بن محمد قال: أخبرنا أبو علي التميمي قال: أخبرنا أبو بكر بن مالك قال: حدثنا عبد الله بن ____ قال: حدثني أبي قال: حدثنا يزيد قال: أخبرنا فضيل بن مرزوق قال: حدثنا أبو سلمة الجهني عن", "o": ["أحمد", "عقله", "يتكرر", "لحديث"], "h": "راجع: ص٢٨٥"}]}], "sum": [["الصفحات", "ص٢٨٢ - ص٢٩٢"]], "_nq": 12}, {"id": "l39", "title": "كتاب ترتيب الأوراد", "group": "كتاب ترتيب الأوراد", "map": {"center": "كتاب\nترتيب الأوراد", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "كتاب ترتيب الأوراد", "b": [{"pic": ["books", "book"], "cap": "ص٢٩٣ - ص٢٩٤"}, {"story": ["كتاب ترتيب الأوراد، ص٢٩٣", ["**وتفصيل إحياء الليل**", "الحمد لله الذي حث على خدمته ودعا، وأكرم من بادر إلى طاعته وسعى، واختار للخلوة به من فهم عنه ووعى، فخلع عليهم من حلل السهر خلعا، وسقاهم من كأس محبته جرعا، تتجافى جنوبهم عن المضاجع يدعون ربهم خوفا وطمعا.", "أحمده حمد من قوي تقواه ورعى ورعا، وأصلي على رسوله محمد الذي علا على الأنبياء والملائكة معا، وعلى من تبعه عالما أو متعلما، أو محبا أو مستمعا، وأسلم تسليما كثيرا.", "أما بعد: فإن الناس في هذه الدنيا سفر، وأول منازلهم المهد، وآخرها اللحد، والوطن الجنة أو النار، والعمر مسافة السفر، فسنوه مراحله، وشهوره فراسخه، وأيامه أمياله، وأنفاسه خطواته، وطاعته بضاعته، وأوقاته رؤوس أمواله، وشهواته قطاع طريقه، وربحه الفوز بلقاء الله في دار السلام مع الملك الكبير والنعيم المقيم، وخسرانه البعد من الله مع العذاب الأليم في دركات الجحيم والغافل عن نفس من أنفاسه حتى يذهب في غير طاعة تقربه إلى الله متعرض لغبينة(١) وحسرة ما لها منتهى، ولهذا الخطر العظيم والخطب الجسيم، شمر الموفقون عن ساق الجد، وودعوا بالكلية ملاذ النفس، واغتنموا لحظات العمر، ورتبوا بحسب تكرر الأوقات وظائف الأوراد طلبا للتقرب إلى الله سبحانه، وسعيا إلى دار القرار، فصار من", "حاشية: (١) الغبينة: الخديعة، يقال: لحقته في تجارته غبينة.", "مهمات علم طريق الآخرة تفصيل القول في كيفية قسمة(١) الأوراد، وتوزيع العبادات على مقادير الأوقات.", "ويتضح هذا المهم بذكر بابين، والله الموفق.", "**الباب الأول:** في فضيلة الأوراد، وترتيبها في الليل والنهار.", "**الباب الثاني:** في كيفية إحياء الليل، وفضيلته وما يتعلق به.", "حاشية: (١) ليست في (ظ)."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "أحمده حمد من قوي تقواه ورعى ورعا، وأصلي على رسوله محمد الذي علا على الأنبياء والملائكة معا، وعلى من تبعه عالما أو متعلما، أو محبا أو مستمعا، وأسلم ____ كثيرا", "o": ["تسليما", "والقضاعي", "والبدن", "استتمام"], "h": "راجع: ص٢٩٣"}, {"t": "fill", "d": 2, "q": "مهمات علم طريق الآخرة تفصيل القول في كيفية قسمة الأوراد، وتوزيع ____ على مقادير الأوقات", "o": ["العبادات", "ويفتتح", "الزوزني", "الظاهر"], "h": "راجع: ص٢٩٤"}, {"t": "fill", "d": 2, "q": "أما بعد: فإن الناس في هذه الدنيا سفر، وأول منازلهم المهد، وآخرها اللحد، والوطن الجنة أو النار، والعمر مسافة ____، فسنوه مراحله، وشهوره فراسخه، وأيامه أمياله، وأنفاسه خطواته، وطاعته بضاعته، وأوقاته", "o": ["السفر", "الزيادة", "يميلهم", "ووعيد"], "h": "راجع: ص٢٩٣"}, {"t": "fill", "d": 2, "q": "الحمد لله الذي حث على خدمته ودعا، وأكرم من بادر إلى طاعته وسعى، واختار للخلوة به من فهم عنه ووعى، فخلع عليهم من حلل السهر خلعا، وسقاهم من كأس محبته جرعا، تتجافى جنوبهم عن المضاجع يدعون ربهم ____ وطمعا", "o": ["خوفا", "بإصبعه", "والمسر", "أترك"], "h": "راجع: ص٢٩٣"}]}], "sum": [["الصفحات", "ص٢٩٣ - ص٢٩٤"]], "_nq": 4}, {"id": "l40", "title": "الباب الأول في فضيلة الأوراد وترتيبها، وبيان أن المواظبة عليها هو الطريق إلى الله عز وجل", "group": "كتاب ترتيب الأوراد", "map": {"center": "الباب\nالأول في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الأول في فضيلة الأوراد وترتيبها، وبيان أن المواظبة عليها هو الطر - القسم ١ من ٢", "b": [{"pic": ["books", "book"], "cap": "ص٢٩٥ - ص٣٠٧"}, {"story": ["الباب الأول في فضيلة الأوراد وترتيبها، وبيان أن المواظبة علي (١ من ٩)، ص٢٩٥", ["**في فضيلة الأوراد وترتيبها، وبيان أن المواظبة عليها هو الطريق إلى الله عز وجل**", "اعلم أنه إذا حصلت المعرفة لله سبحانه، والتصديق بوعده، والعلم بقصر العمر، وجب ترك التقصير في هذا العمر القصير، والنفس متى وقفت على فن واحد ملت، فمن التلطف بها نقلها من فن إلى فن، وقد قال الله تعالى: ﴿وَاذْكُرِ اسْمَ رَبِّكَ بُكْرَةً وَأَصِيلًا وَمِنَ اللَّيْلِ فَاسْجُدْ لَهُ وَسَبِّحْهُ لَيْلًا طَوِيلًا﴾ [الإنسان: ٢٥ ـ ٢٦]، وقال تعالى: ﴿وَمِنْ آنَاءِ اللَّيْلِ فَسَبِّحْ وَأَطْرَافَ النَّهَارِ لَعَلَّكَ تَرْضَى﴾ [طه: ١٣٠]، وقال: ﴿وَسَبِّحْ بِحَمْدِ رَبِّكَ قَبْلَ طُلُوعِ الشَّمْسِ وَقَبْلَ الْغُرُوبِ وَمِنَ اللَّيْلِ فَسَبِّحْهُ وَأَدْبَارَ السُّجُودِ﴾ [ق: ٣٩ ـ ٤٠]، فهذه الآيات في نظائرها تدلك على أن الطريق إلى الله سبحانه مراقبة الأوقات وعمارتها بالأوراد على الدوام، وقد قال النبي صلى الله عليه وسلم: «أحب عباد الله إلى الله الذين يراعون الشمس والقمر والأظلة لذكر الله»، وقال الله عز وجل: ﴿وَهُوَ الَّذِي جَعَلَ اللَّيْلَ وَالنَّهَارَ خِلْفَةً لِمَنْ أَرَادَ أَنْ يَذَّكَّرَ أَوْ أَرَادَ شُكُورًا﴾ [الفرقان: ٦٢] أي يخلف أحدهما الآخر ليتدارك في أحدهما ما فات من الآخر.", "**بيان عدد الأوراد وترتيبها**", "اعلم أن أوراد النهار سبعة، وأوراد الليل خمسة، فلنذكر فضيلة كل ورد، ووظيفته وما يتعلق به.", "**أوراد النهار**", "**الورد الأول:** ما بين طلوع الفجر إلى طلوع الشمس، وهو وقت شريف، قد أقسم الله سبحانه به فقال: ﴿وَالصُّبْحِ إِذَا تَنَفَّسَ﴾ [التكوير: ١٨]، وتمدح بإيجاده فقال: ﴿فَالِقُ الْإِصْبَاحِ﴾ [الأنعام: ٩٦]، وأمر بالتسبيح فيه فقال: ﴿فَسُبْحَانَ اللَّهِ حِينَ تُمْسُونَ", "وَحِينَ تُصْبِحُونَ﴾ [الروم: ١٧]، وقال: ﴿وَسَبِّحْ بِحَمْدِ رَبِّكَ قَبْلَ طُلُوعِ الشَّمْسِ﴾ [طه: ١٣٠]، وقال: ﴿وَاذْكُرِ اسْمَ رَبِّكَ بُكْرَةً وَأَصِيلًا﴾ [الإنسان: ٢٥]."]], "ic": "book"}, {"story": ["الباب الأول في فضيلة الأوراد وترتيبها، وبيان أن المواظبة علي (٢ من ٩)، ص٢٩٦", ["وأما وظيفته؛ فينبغي للمريد إذا انتبه أن يذكر الله عز وجل، فيقول: الحمد لله الذي أحيانا بعدما أماتنا وإليه النشور، إلى آخر ما قد سبق ذكره في دعاء الصبح من كتاب الأدعية، ثم يلبس ثوبه ناويا بذلك ستر عورته لامتثال أمر الله سبحانه، والاستعانة على عبادته من غير قصد رياء ولا رعونة، ثم يذهب إلى الخلاء إن احتاج، وقد ذكرنا آدابه في كتاب الطهارة، ثم يتوضأ، وقد سبق ذكر الوضوء، ثم يصلي سنة الصبح في منزله، ثم يخرج من البيت متوجها إلى المسجد، وقد سبق ذكر(١) ما يدعو به في سعيه وليمش بالسكينة، ويقدم رجله اليمنى في الدخول، وقد سبق ذكر ما يدعو به، ثم يطلب الصف الأول إن أمكنه ويجلس(٢) منتظرا للجماعة ذاكرا، وقد سبق من الأذكار والدعاء في أول النهار ما يكفي، فليأت بما أمكنه من ذلك، ثم يصلي الفريضة، فإذا فرغ لم يبرح من مكانه حتى تطلع الشمس، وفي الصحيحين من حديث أبي هريرة عن النبي صلى الله عليه وسلم أنه قال: «إن أحدكم إذا توضأ فأحسن الوضوء، ثم دخل المسجد كان في صلاة ما كانت الصلاة تحبسه، والملائكة يصلون على أحدهم ما دام في مجلسه الذي صلى فيه، يقولون: اللهم اغفر له، اللهم ارحمه، اللهم تب عليه، ما لم يؤذ فيه ما لم يحدث فيه».", "وفي أفراد مسلم من حديث جابر بن سمرة قال: كان رسول الله صلى الله عليه وسلم إذا صلى الغداة جلس في مصلاه حتى تطلع الشمس حسنا.", "وروى الترمذي من حديث أنس عن النبي صلى الله عليه وسلم أنه قال: «من صلى الفجر في جماعة، ثم قعد يذكر الله تعالى حتى تطلع الشمس، ثم صلى ركعتين كانت له كأجر حجة وعمرة تامة تامة تامة».", "حاشية: (١) ليست في الأصل.", "حاشية: (٢) سقطت من الأصل.", "ولتكن وظائف وقته أربعا: الدعاء، والذكر، والقراءة، والفكر، فليأت بما (١-١)أمكنه من الدعاء والذكر مما قد سبق ذكره، وليقرأ ما أمكنه(١-١).", "وليتفكر في فنين: ＊＊أحدهما:＊＊ (٢-٢)تدبير دفع الصوارف، وقطع القواطع(٢-٢) الشاغلة له عن الخير، ليؤدي وظائف يومه.", "**الثاني:** يعم الله عليه ليتوخى شكره.", "**الورد الثاني:** ما بين طلوع الشمس إلى الضحى، وذلك بمضي ثلاث ساعات من النهار إذا فرض النهار اثنتي عشرة ساعة، (٣-٣)وهو الربع(٣-٣)، وهذا وقت شريف أقسم الله تعالى به فقال: ﴿وَالضُّحَى وَاللَّيْلِ إِذَا سَجَى﴾ [الضحى: ١ ـ ٢]، وقال: ﴿يُسَبِّحْنَ بِالْعَشِيِّ وَالْإِشْرَاقِ﴾ [ص: ١٨]، وفي هذا الربع وظيفتان: **إحداهما:** صلاة الضحى، وقد سبق ذكرها، فإن صلى منها ركعتين عند انبساط الشمس وارتفاعها، وترك البواقي إلى أن يشتد ارتفاع الشمس كان حسنا.", "**الوظيفة الثانية:** ما يتعلق بالناس من عيادة مريض، وتشييع جنازة، وحضور مجلس علم وقضاء حاجة مسلم، فإن لم يفعل شيئا من ذلك تشاغل بالقراءة والذكر."]], "ic": "book"}, {"story": ["الباب الأول في فضيلة الأوراد وترتيبها، وبيان أن المواظبة علي (٣ من ٩)، ص٢٩٧", ["**الورد الثالث:** من وقت الضحى الأعلى إلى الزوال، والوظيفة في هذا الوقت الأقسام الأربعة وزيادة أمرين: **أحدهما:** الاشتغال بالكسب وتدبير المعاش، وحضور السوق، فإن كان تاجرا فليتجر بصدق وأمانة، وإن كان صاحب صناعة فبنصح وشفقة، ولا ينسى ذكر الله تعالى في جميع أشغاله، وليقنع بالقليل توفيرا للزمان على العبادة.", "**والثاني:** القيلولة، وهي مما يعين على قيام الليل كما يعين السحور على صيام النهار، فإن نام فليجتهد في الانتباه قبيل الزوال بقدر الاستعداد للصلاة بالوضوء،", "حاشية: (١-١) سقط من الأصل.", "حاشية: (٢-٢) سقط من (ظ).", "حاشية: (٣-٣) سقط من (ظ).", "وحضور المسجد قبل دخول الوقت، وإن لم يكسب ولم ينم اشتغل بالصلاة والذكر.", "**الورد الرابع:** ما بين الزوال إلى الفراغ من صلاة الظهر، وهو أقصر أوراد النهار، وأفضلها، فإذا كان قد توضأ قبل الزوال وحضر المسجد، فإذا زالت الشمس وأذن المؤذن وأجاب المؤذن بمثل قوله، فليقم إلى التعبد ما بين الأذانين، وليصل أربع ركعات، وقد ذكرناها في صلاة التطوع، وليطول فيها، فإن أبواب السماء تفتح حينئذ، ثم يصلي الظهر، ثم يصلي سنتها ركعتين، ثم يتطوع بأربع.", "**الورد الخامس:** ما بعد ذلك إلى العصر، وقد استحبوا له العكوف في المسجد شغلا بالذكر أو الصلاة أو فنون الخير، والذي أراه أن يصلي في بيته إذا لم يقدر على خلوة في المسجد، ففي الصحيحين من حديث زيد بن ثابت عن النبي صلى الله عليه وسلم أنه قال: «أفضل صلاة الرجل في بيته إلا المكتوبة».", "فإن كان قد نام قبل الزوال، فلا ينبغي أن ينام بعده.", "واعلم أن الليل والنهار أربع وعشرون ساعة، فالاعتدال في النوم أن يكون ثمان ساعات، وهو الثلث، فمن نام أقل من هذا لم يؤمن اضطراب بدنه، وغلبة اليبس عليه، ومن نام أكثر زاد كسله، فمن نام هذا المقدار في الليل، فلا وجه لنومه في النهار، بلى من نقص منه استوفى ما نقص بالنهار، وليعلم النائم ثمان ساعات أنه قد مضى ثلث عمره غير أنه لا بقاء للبدن إلا بالنوم، فإنه كالقوت، وله فائدتان:", "**إحداهما:** انعكاس الحرارة إلى الباطن، فينهضم الطعام.", "**والثانية:** استراحة الأعضاء التي قد كلت بالأعمال.", "**الورد السادس:** إذا دخل وقت العصر إلى أن تصفر الشمس، وليس في هذا الورد سوى أربع ركعات بين الأذانين، ثم فرض العصر، ثم يشتغل بالأقسام الأربعة التي سبق ذكرها في الورد الأول، والأفضل فيه تلاوة القرآن بالتدبر والتفهم، فيجمع ذلك الذكر والدعاء والفكر."]], "ic": "book"}, {"story": ["الباب الأول في فضيلة الأوراد وترتيبها، وبيان أن المواظبة علي (٤ من ٩)، ص٢٩٩", ["**الورد السابع:** إذا اصفرت الشمس إلى أن تغرب، فهو وقت شريف، قال الحسن(١): كانوا أشد تعظيما للعشي(٢) من أول النهار، فيستحب في هذا الوقت التسبيح والاستغفار خاصة، وقد ذكرنا ما يدعى به ويقال عند المساء، وبالغروب تنتهي أوراد النهار، فينبغي أن يلاحظ العبد أحواله ويحاسب نفسه، فقد انقضت من طريقه مرحلة، وليعلم أن العمر أيام تنقضي جملتها بانقضاء آحادها، قال الحسن: يا ابن آدم، إنما أنت أيام إذا مضى يومك مضى بعضك.", "وليتفكر في أن نهار العمر له آخر تغرب فيه شمس الحياة، ولينظر هل ساوى يومه أمسه؟ فيكون مغبونا، أو كان شرا منه، فيكون ملعونا، فإن رأى أنه قد توفر على الخير طول نهاره، فليشكر الله سبحانه على التوفيق، وإن تكن الأخرى، فليتب، وليعزم على تلافي ما سبق من التفريط بالليل، فإن الحسنات يذهبن السيئات، وليشكر الله تعالى على صحة جسمه، وبقاء بقية من عمره يمكن فيها استدراك التقصير، وقد كان جماعة من السلف يستحبون أن لا ينقضي يوم إلا عن صدقة، ويجتهدون بما يمكن من كل خير كعيادة المريض وتشييع الجنائز وغير ذلك.", "**أوراد الليل**", "**الورد الأول:** إذا غربت الشمس إلى وقت العشاء، وإذا غربت صلى المغرب، واشتغل بإحياء ما بين العشاءين، فقد قال أنس بن مالك في قوله تعالى: ﴿تَتَجَافَى جُنُوبُهُمْ عَنِ الْمَضَاجِعِ﴾ [السجدة: ١٦]. نزلت في ناس من أصحاب رسول الله صلى الله عليه وسلم، كانوا يصلون ما بين المغرب والعشاء، وأما فضل إحياء ما بين العشاءين، فقد ذكرناه في صلاة(٣) التطوع.", "حاشية: (١) يعني الحسن البصري.", "حاشية: (٢) في (ظ): «العشاء».", "حاشية: (٣) في (ظ): «كتاب».", "فإن أقام في المسجد معتكفا منتظرا للعشاء، فهو أفضل، وإن صلى في بيته يقصد الخلوة فحسن.", "**الورد الثاني:** من وقت غيبوبة الشفق الأحمر إلى وقت نوم الناس، فليصل ما بين الأذانين ما أمكنه، وليكن في قراءته: ﴿الم تَنزِيلُ﴾ السجدة، و﴿تَبَارَكَ﴾ الملك، فقد كان رسول الله صلى الله عليه وسلم لا ينام حتى يقرأهما، وفي حديث ابن مسعود عن النبي صلى الله عليه وسلم أنه قال(١): «من قرأ سورة الواقعة في كل ليلة لم تصبه فاقة».", "**الورد الثالث:** الوتر، وليوتر قبل النوم إن لم تكن عادته القيام، قال أبو هريرة: أوصاني رسول الله صلى الله عليه وسلم أن لا أنام إلا على وتر. وإن كان معتادا للصلاة بالليل، فتأخير الوتر أفضل، قالت عائشة: أوتر رسول الله صلى الله عليه وسلم أول الليل، وأوسطه، وانتهى وتره إلى السحر.", "ثم ليقل بعد الوتر: سبحان الملك القدوس، ثلاث مرات.", "**الورد الرابع:** النوم، وإنما عددناه في الأوراد؛ لأنه إذا روعيت آدابه وحسن المقصود به احتسب عبادة، وقد قال معاذ: إني لأحتسب في نومتي ما أحتسب في قومتي."]], "ic": "book"}, {"story": ["الباب الأول في فضيلة الأوراد وترتيبها، وبيان أن المواظبة علي (٥ من ٩)، ص٣٠٠", ["وآداب النوم عشرة: ＊＊الأول:＊＊ الطهارة، فقد أخبرنا علي بن عبيد الله قال: أخبرنا عبد الصمد بن المأمون، قال: أخبرنا عبيد الله بن محمد بن حبابة قال: أخبرنا يحيى بن محمد بن صاعد قال: أخبرنا العباس بن الوليد بن مزيد(٢) قال: أخبرني أبي قال: سمعت الأوزاعي يقول: حدثني الزهري عن عروة عن عائشة قالت: كان رسول الله صلى الله عليه وسلم إذا أراد أن ينام توضأ وضوءه للصلاة. وقال عبد الله بن عمرو بن العاص: إن الأرواح يعرج بها في منامها إلى السماء فتؤمر بالسجود عند العرش، فما كان منها طاهرا سجد عند العرش، وما كان ليس بطاهر سجد بعيدا من العرش.", "حاشية: (١) ليس في الأصل.", "حاشية: (٢) تصحف في (ظ) إلى: «مرتد».", "**الثاني:** أن يتوب قبل نومه؛ لأنه ينبغي لمن طهر ظاهرهن أن يجتهد في طهارة باطنه قبل النوم، لوجوه، أهمها أمران: أحدهما: أنه ربما مات في نومه فليأخذ أهبة الرحيل.", "**والثاني:** أن النوم مظنة الرؤيا، ولقاء أرواح الأنبياء والصالحين، وإلقاء ما يلقى من حجب الغيب، وذلك لا يصلح إلا لوعاء نظيف.", "**الثالث:** أن يزيل كل غش في قلبه لمسلم، ولا ينوي ظلمه، ولا يعزم على خطيئة إن استيقظ.", "**الرابع:** أن لا يبيت من له شيء يوصي فيه إلا ووصيته مكتوبة عنده، ففي الصحيحين من حديث ابن عمر عن النبي صلى الله عليه وسلم أنه قال: «ما حق امرئ مسلم يبيت ليلتين، وله شيء يوصي فيه إلا وصيته مكتوبة عنده».", "**الخامس:** أن لا يبالغ في تمهيد الفراش متنعما بذلك، فإن ذلك يزيد في النوم، فإن النبي صلى الله عليه وسلم نبئ له فراشه فقال: «منعتني وطأته صلاتي الليلة».", "**السادس:** أن لا ينام ما لم يغلبه النوم، فقد كان السلف لا ينامون إلا عن غلبة.", "**السابع:** أن ينام مستقبل القبلة، والاستقبال على ضربين: الأول: استقبال المحتضر، وهو للمستلقي على قفاه، فيكون وجهه وأخمصاه إلى القبلة، والثاني: استقبال اللحد، وهو لمن ينام على جنب، بأن يكون وجهه إليها إذا نام على الشق الأيمن.", "**الثامن:** الدعاء عند النوم، وقد سبقت الأذكار التي تقال عند النوم في كتاب الدعوات.", "**التاسع:** أن يتذكر عند النوم أنه نوع وفاة، وأن التيقظ نوع بعث، فلينظر على ماذا ينام من العزائم والنيات خوفا من أن يفجأه الموت على ما لا يصلح.", "**العاشر:** ذكر الله تعالى عند التيقظ، وشكره على السلامة والعافية، وليجتهد أن", "يكون آخر ما يجري على قلبه ولسانه عند النوم ذكر الله تعالى، وأول ما يجري عليهما عند التيقظ ذكر الله تعالى، فهاتان علامتان على الإيمان، وعلى قدر وجود الصفاء في الذكر تكون المعرفة للمذكور والمحبة له."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "الرابع: أن لا يبيت من له شيء يوصي فيه إلا ووصيته مكتوبة عنده، ففي الصحيحين من حديث ابن عمر عن ____ صلى الله عليه وسلم أنه قال: «ما حق امرئ مسلم يبيت ليلتين، وله شيء يوصي فيه إلا وصيته مكتوبة", "o": ["النبي", "نهرا", "المحرر", "بالسواد"], "h": "راجع: ص٣٠١"}, {"t": "fill", "d": 2, "q": "فإذا فرغ المريد من صلاة السحر، فليستغفر. قال نافع: كان ابن عمر يحيي الليل صلاة، ثم يقول: يا نافع، أسحرنا؟ فأقول: لا، فيعاود الصلاة، ثم يقول: يا نافع، أسحرنا؟ فأقول: نعم، فيقعد ويستغفر ____ حتى", "o": ["ويدعو", "يعفى", "الشعر", "سفلة"], "h": "راجع: ص٣٠٣"}, {"t": "fill", "d": 2, "q": "وأما وظيفته؛ فينبغي للمريد إذا انتبه أن ____ الله عز وجل، فيقول", "o": ["يذكر", "قمعها", "وتكتفي", "اكتحل"], "h": "راجع: ص٢٩٦"}, {"t": "fill", "d": 2, "q": "قال عمار الراهب: رأيت مسكينة الطفاوية في منامي وكانت من المواظبات على حلق ____، فقلت: مرحبا يا مسكينة مرحبا. قالت: هيهات", "o": ["الذكر", "الدالي", "تلزم", "يأخذ"], "h": "راجع: ص٣٠٥"}, {"t": "fill", "d": 2, "q": "وروى الترمذي من حديث أنس عن النبي صلى ____ عليه وسلم أنه قال", "o": ["الله", "أشغاله", "أقرب", "وهشام"], "h": "راجع: ص٢٩٦"}, {"t": "fill", "d": 2, "q": "وأما الليل فأحسن قسمة فيه قسمة الشافعي، فإنه كان يقسم الليل ثلاثة ____", "o": ["أجزاء", "والتعلم", "الخوض", "تسليما"], "h": "راجع: ص٣٠٥"}]}, {"t": "الباب الأول في فضيلة الأوراد وترتيبها، وبيان أن المواظبة عليها هو الطر - القسم ٢ من ٢", "b": [{"story": ["الباب الأول في فضيلة الأوراد وترتيبها، وبيان أن المواظبة علي (٦ من ٩)، ص٣٠٢", ["**الورد الرابع:** يدخل بمضي النصف الأول من الليل إلى أن يبقى من الليل سدسه، وذلك وقت شريف، وقد روى أبو ذر قال: سألت النبي صلى الله عليه وسلم: أي صلاة الليل أفضل؟ فقال: «نصف الليل، وقليل فاعله». وروي أن داود عليه السلام قال: يا رب، أي ساعة أقوم لك؟ فأوحى الله تعالى إليه: يا داود، لا تقم أول الليل ولا آخره، ولكن قم في شطر الليل حين تخلوا بي وأخلوا بك، فارفع إلي حوائجك.", "فإذا قام حينئذ للتهجد، ففي الصحيحين من حديث ابن عباس قال: بت عند خالتي ميمونة، فاستيقظ رسول الله صلى الله عليه وسلم فجعل يمسح النوم عن وجهه ثم قرأ العشر الآيات الخواتم من سورة آل عمران.", "وليدع بدعاء رسول الله صلى الله عليه وسلم عند قيامه بالليل، وقد سبق في كتاب الدعوات، ثم يصلي ركعتين خفيفتين، ففي أفراد مسلم من حديث أبي هريرة عن النبي صلى الله عليه وسلم أنه قال: «إذا قام أحدكم يصلي بالليل، فليبدأ بركعتين خفيفتين». وفي أفراده من حديث عائشة قالت: كان رسول الله صلى الله عليه وسلم إذا قام من الليل يصلي افتتح صلاته بركعتين خفيفتين، ثم يصلي مثنى مثنى. وفي أفراد البخاري من حديث ابن عمر قال: قال رجل يا رسول الله، كيف تأمرنا أن نصلي من الليل؟ قال: «يصلي أحدكم مثنى مثنى، فإذا خشي الصبح صلى واحدة، فأوترت له ما قد صلى من الليل». وأكثر ما روي عن رسول الله صلى الله عليه وسلم أنه كان يصلي من الليل ثلاث عشرة ركعة مع الوتر، وأقلهن سبع.", "**الورد الخامس:** السدس الأخير من الليل وهو وقت السحر. قال الله تعالى: ﴿وَبِالْأَسْحَارِ هُمْ يَسْتَغْفِرُونَ﴾ [الذاريات: ١٨]، وفي الصحيحين من حديث عائشة قالت: كان رسول الله صلى الله عليه وسلم ينام أول الليل ويقوم آخره، وفي أفراد مسلم من حديث جابر عن النبي صلى الله عليه وسلم أنه قال: «من خشي منكم أن لا يقوم من آخر الليل، فليوتر من أوله،", "ثم ليرقد، ومن طمع منكم في أن يقوم من آخر الليل، فإن قراءة آخر الليل محضورة، وذلك أفضل». وفي حديث عمرو بن عبسة عن النبي صلى الله عليه وسلم أنه قال: «أقرب ما يكون الرب من العبد في جوف الليل الآخر، فإن استطعت أن تكون ممن يذكر الله في تلك الساعة فكن». رواه الترمذي وصححه، ورواه أبو داود عن عمرو بن عبسة قال: قلت: يا رسول الله، أي الليل أسمع؟ قال: «جوف الليل الآخر، فصل ما شئت فإن الصلاة مشهودة مكتوبة حتى تصلي الصبح». وجاء رجل إلى طاوس وقت السحر فقال: أهو نائم؟ فقال: ما كنت أرى أن أحدا ينام في السحر.", "فإذا فرغ المريد من صلاة السحر، فليستغفر. قال نافع: كان ابن عمر يحيي الليل صلاة، ثم يقول: يا نافع، أسحرنا؟ فأقول: لا، فيعاود الصلاة، ثم يقول: يا نافع، أسحرنا؟ فأقول: نعم، فيقعد ويستغفر ويدعو حتى يصبح.", "**بيان اختلاف الأوراد باختلاف الأحوال**"]], "ic": "book"}, {"story": ["الباب الأول في فضيلة الأوراد وترتيبها، وبيان أن المواظبة علي (٧ من ٩)، ص٣٠٣", ["اعلم أن السالك لطريق الآخرة لا يخلو من ستة أحوال: إما أن يكون عابدا، أو عالما أو متعلما، أو واليا، أو محترفا، أو مستغرقا بمحبة الله(١) عز وجل مشغولا عن غيره.", "**الأول: العابد،** وهو المنقطع عن الأشغال كلها إلى التعبد، فهذا يستعمل ما ذكرناه من الأوراد، وقد تختلف وظائفه فقد كانت أحوال المتعبدين من السلف تختلف، فمنهم من كان يغلب عليه حب التلاوة، فكان يختم كل يوم (٢-٢)ومنهم من يختم(٢-٢) مرتين وثلاثا، وكان فيهم من يكثر من الصلاة فيصلي مئة ركعة، وخمسمئة، وألف ركعة، ومنهم من غلب عليه حب الطواف بالبيت فكان يطوف كل يوم سبعين أسبوعا(٣)، وهو يقرأ القرآن مع ذلك مرة أو مرتين.", "حاشية: (١) في (ظ): «الحق».", "حاشية: (٢-٢) سقط من الأصل.", "حاشية: (٣) الأسبوع: سبع مرات.", "فإن قيل: فما الأولى أن يصرف إليه أكثر الأوقات من هذه الأوراد؟", "فاعلم أن قراءة القرآن في الصلاة قائما مع التدبر تجمع الجميع، ولكن ربما عسرت المواظبة على ذلك، فالأفضل يختلف باختلاف حال(١) الشخص.", "ومقصود الأوراد تزكية القلب وتطهيره وتخليته للذكر والأنس، فلينظر المريد إلى ما يراه من التعبد أشد تأثيرا فيه، فليواظب عليه، فإذا أحس بممل انتقل عنه، وقال أبو سليمان الداراني: إذا وجدت قلبك في القيام، فلا تركع، أو في الركوع، فلا ترفع، أو في السجود، فلا ترفع.", "**الثاني: العالم،** وهو الذي ينتفع الناس بعلمه في فتوى أو تدريس أو تصنيف أو تذكير، فترتيبه للأوراد يخالف ترتيب العابد، فإنه يحتاج إلى المطالعة للكتب، وإلى التصنيف والإفادة، فإن استغرق الأوقات في ذلك فهو أفضل ما يشتغل به بعد المكتوبات، وقد دل على صحة ما قلنا ما سبق في بيان فضيلة العلم والتعليم، وكيف لا يكون كذلك وقد قال عليه الصلاة والسلام لعلي(٢): «والله لأن يهدي الله بك رجلا واحدا خير لك مما طلعت عليه الشمس». وهل يهتدي الناس إلا بالعلم؟ فرب مسألة تعلمها الإنسان صلحت بها عبادة عمره، ولو لم يتعلمها كان عمله ضائعا، وإنما يعنى بالعلم المقدم على العبادة العلم الذي يرغب في الآخرة ويعين على سلوك طريقها.", "فالأولى بالعالم أن يقسم أوقاته أيضا؛ لأن استغراق الأوقات في العلم لا تصبر عليه النفس، فينبغي أن يخص ما بعد الصبح إلى طلوع الشمس بالأذكار والأوراد على ما ذكرنا، ثم بعد طلوع الشمس إلى الضحى في الإفادة والتعليم، فإن لم يكن عنده من يتعلم صرف ذلك الزمان إلى التفكير في العلوم فإن صفاء القلب بعد الفراغ من الذكر وقبل الاشتغال بهموم الدنيا يعين على التفطن للمشكلات، ثم من ضحوة النهار إلى العصر للتصنيف والمطالعة لا يترك ذلك إلا في وقت أكل وطهارة، أو", "حاشية: (١) في الأصل: «بحال اختلاف».", "حاشية: (٢) ليست في الأصل."]], "ic": "book"}, {"story": ["الباب الأول في فضيلة الأوراد وترتيبها، وبيان أن المواظبة علي (٨ من ٩)، ص٣٠٥", ["في مكتوبة وقيلولة، ومن العصر إلى الاصفرار يشتغل بسماع ما يقرأ، عليه من تفسير أو حديث أو علم نافع، ومن الاصفرار إلى الغروب يشتغل(١) بالاستغفار والتسبيح، فيكون ورده الأول قبل طلوع الشمس في عمل اللسان، وورده الثاني في عمل القلب بالفكر إلى ضحوة، وورده الثالث إلى العصر في عمل العين واليد بالمطالعة والنسخ، وورده الرابع بعد العصر في عمل السمع ليروح فيه العين واليد، فإن المطالعة والنسخ بعد العصر ربما أضرت بالعين، وعند الاصفرار يعود ذكر اللسان(٢) فلا يخلو جزء من النهار من عمل بالجوارح مع حضور القلب في الجميع.", "وأما الليل فأحسن قسمة فيه قسمة الشافعي، فإنه كان يقسم الليل ثلاثة أجزاء: الثلث الأول لكتابة العلم، الثلث الثاني للصلاة، الثلث الثالث للنوم، وأما الصيف فربما لا يحتمل ذلك إلا إذا كان أكثر النوم بالنهار.", "**الثالث: المتعلم،** فإن التشاغل بالتعلم أفضل من التشاغل بالأذكار والنوافل، وقد سبق فضل ذلك في كتاب العلم، وحكم المتعلم حكم العالم في ترتيب الأوراد لكنه يشتغل بالاستفادة حين يشتغل العالم بالإفادة، وبالتعليق والنسخ حين يشتغل العالم بالتصنيف، فإن كان من العوام فحضوره(٣) مجالس الذكر والعلم والوعظ أفضل من اشتغاله بالأوراد المتطوع بها، قال عليه الصلاة والسلام: «إذا مررتم برياض الجنة فارتعوا» قيل: وما رياض الجنة؟ قال: «حلق الذكر».", "قال عمار الراهب(٤): رأيت مسكينة الطفاوية(٥) في منامي وكانت من المواظبات على حلق الذكر، فقلت: مرحبا يا مسكينة مرحبا. قالت: هيهات يا", "حاشية: (١) ليست في الأصل.", "حاشية: (٢) تحرفت في (ظ) إلى: «الليل».", "حاشية: (٣) في الأصل: (فحضور).", "حاشية: (٤) هكذا في النسخ وصفة الصفوة للمصنف، وفي الإحياء: «الزاهد».", "حاشية: (٥) هي مسكينة الطفاوية، منسوبة إلى بني طفاوة بطن من العرب كانت من العابدات الزاهدات ذكرها المصنف في صفة الصفوة ٤/٤٢.", "عمار، ذهبت المسكنة وجاء الغنى الأكبر. قلت: هيه(١). قالت: ما تسأل عن من أبيح الجنة بحذافيرها يظل منها حيث يشاء؟ قلت: وبم ذلك؟ قالت: بمجالس الذكر، والصبر على الحق. قال عمار: وكانت تحضر معنا مجلس عيسى بن زاذان بالأبلة(٢)، تنحدر من البصرة حتى تأتيه قاصدة.", "وينبغي أن يعلم أن حضور مجلس الوعظ أنفع شيء للعامي إذا كان الواعظ صدوقا متحريا طريقة السلف فيما يورده فإن تكرار الوعظ على العامي يثقب باطن قلبه، فيستخرج حب الزلل ويودعه جواهر التقوى، وذلك أنفع للعامي من ركعات كثيرة وتسبيحات طويلة."]], "ic": "book"}, {"story": ["الباب الأول في فضيلة الأوراد وترتيبها، وبيان أن المواظبة علي (٩ من ٩)، ص٣٠٦", ["**الرابع: المحترف،** وهو المحتاج إلى الكسب له ولعياله، فليس له أن يستغرق الزمان في التعبد بل يجتهد في الكسب مع دوام الذكر، فإذا حصل له ما يكفيه عاود الأوراد، فإن اكتسب أكثر من كفايته فادخر لحاجة أو غرض(٣) له أو لعائلته فهذه نية حسنة، فإن رسول الله صلى الله عليه وسلم قال: «لأن تدع ورثتك أغنياء خير لك من أن تدعهم عالة يتكففون الناس». وإن هو تصدق بما يفضل عن حاجته كان ذلك أفضل من الأوراد؛ لأن نفع الصدقة يتعدى، والكسب على هذه النيات عبادة في نفسه وقربة إلى الله عز وجل.", "**الخامس: الوالي،** مثل الإمام والقاضي والمتولي للنظر في أمر من أمور المسلمين، فقيامه بحاجات المسلمين وأغراضهم على وفق الشرع وقصد الإخلاص أفضل من الأوراد المذكورة، لأنه عبادة، ثم يفضل على العبادات بتعدي نفعه، كما قلنا في العلم، فينبغي له أن يقتصر في النهار على المكتوبات، ثم يستفرغ باقي الزمان في ذلك ويقنع بأوراد الليل.", "**السادس: المستغرق بمحبة الله تعالى،** فهذا ورده بعد المكتوبات حضور القلب", "حاشية: (١) هيه: كلمة استزادة.", "حاشية: (٢) الأبلة: مدينة على شاطئ دجلة قرب البصرة.", "حاشية: (٣) في الأصل: «تعرض».", "مع الله سبحانه، وهو يحركه إلى ما يريد من ورد، ولن يصل إلى هذا واصل إلا بعد المواظبة على الأوراد، فلا ينبغي للمريد أن يغتر بما يسمعه من حال هذا فيدعيه لنفسه، ويفتر عن وظائف عبادته، بل ينبغي أن يدوم على الأوراد لتتغير صفات الباطن، فإنه إن لم يردف الفعل بمثله امحى أثر الأول، وقد قال عليه الصلاة والسلام: «أحب الأعمال إلى الله أدومها وإن قل». وسئلت عائشة عن عمل رسول الله صلى الله عليه وسلم فقالت: كان عمله ديمة."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "الخامس: الوالي، مثل الإمام والقاضي والمتولي للنظر في أمر من أمور المسلمين، فقيامه بحاجات المسلمين ____ على وفق الشرع وقصد الإخلاص أفضل من الأوراد المذكورة، لأنه عبادة، ثم يفضل على العبادات", "o": ["وأغراضهم", "فالناقد", "والمدينة", "اتباعه"], "h": "راجع: ص٣٠٦"}, {"t": "fill", "d": 2, "q": "الثالث: المتعلم، فإن التشاغل بالتعلم أفضل من التشاغل بالأذكار والنوافل، وقد سبق فضل ذلك في كتاب العلم، وحكم المتعلم حكم العالم في ترتيب ____ لكنه يشتغل بالاستفادة حين يشتغل العالم بالإفادة،", "o": ["الأوراد", "العبودية", "يحفظه", "تنهكي"], "h": "راجع: ص٣٠٥"}, {"t": "fill", "d": 2, "q": "واعلم أن الليل والنهار أربع وعشرون ساعة، فالاعتدال في النوم أن يكون ثمان ساعات، وهو الثلث، فمن نام أقل من هذا لم يؤمن اضطراب بدنه، وغلبة اليبس عليه، ومن نام أكثر زاد كسله، فمن نام هذا المقدار في الليل، فلا وجه لنومه في النهار، بلى من نقص منه استوفى ما نقص بالنهار، وليعلم ____ ثمان ساعات أنه قد مضى ثلث عمره غير أنه لا بقاء للبدن إلا بالنوم، فإنه كالقوت، وله فائدتان", "o": ["النائم", "أفعال", "البيع", "والشقاق"], "h": "راجع: ص٢٩٨"}, {"t": "fill", "d": 2, "q": "اعلم أن السالك لطريق الآخرة لا يخلو من ستة ____", "o": ["أحوال", "ولدت", "تنادوا", "راحلة"], "h": "راجع: ص٣٠٣"}, {"t": "fill", "d": 2, "q": "التاسع: أن يتذكر عند النوم أنه نوع وفاة، وأن التيقظ نوع بعث، فلينظر على ____ ينام من العزائم والنيات خوفا من أن يفجأه الموت على ما لا", "o": ["ماذا", "الأضحى", "فأعرف", "بمباني"], "h": "راجع: ص٣٠١"}, {"t": "fill", "d": 2, "q": "الورد الثالث: من وقت الضحى الأعلى إلى الزوال، والوظيفة في هذا الوقت الأقسام الأربعة وزيادة أمرين: أحدهما: الاشتغال بالكسب ____ المعاش، وحضور السوق، فإن كان تاجرا فليتجر بصدق وأمانة، وإن كان", "o": ["وتدبير", "المفرطين", "يموت", "ينسج"], "h": "راجع: ص٢٩٧"}]}], "sum": [["الصفحات", "ص٢٩٥ - ص٣٠٧"]], "_nq": 12}, {"id": "l41", "title": "الباب الثاني في الأسباب الميسرة لقيام الليل، وفي الليالي اللواتي يستحب إحياؤها وفي فضيلة إحياء الليل، وما بين…", "group": "كتاب ترتيب الأوراد", "map": {"center": "الباب\nالثاني في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الثاني في الأسباب الميسرة لقيام الليل، وفي الليالي اللواتي يستحب - القسم ١ من ٢", "b": [{"pic": ["books", "book"], "cap": "ص٣٠٨ - ص٣١٧"}, {"story": ["الباب الثاني في الأسباب الميسرة لقيام الليل، وفي الليالي الل (١ من ٧)، ص٣٠٨", ["**في الأسباب الميسرة لقيام الليل، وفي الليالي اللواتي يستحب إحياؤها وفي فضيلة إحياء الليل، وما بين العشاءين وكيفية قسمة الليل**", "ذكر فضيلة قيام الليل: قال الله عز وجل: ﴿تَتَجَافَى جُنُوبُهُمْ عَنِ الْمَضَاجِعِ﴾ [السجدة: ١٦]، وقال: ﴿وَالَّذِينَ يَبِيتُونَ لِرَبِّهِمْ سُجَّدًا وَقِيَامًا﴾ [الفرقان: ٦٤]، وقال: ﴿أَمَّنْ هُوَ قَانِتٌ آنَاءَ اللَّيْلِ سَاجِدًا وَقَائِمًا﴾ [الزمر: ٩].", "فأما الأحاديث: فأخبرنا عبد الأول قال: أخبرنا الداودي قال: أخبرنا ابن أعين قال: أخبرنا الفربري قال: حدثنا البخاري قال: حدثنا عبد الله بن يوسف قال: أخبرنا مالك عن ابن أبي الزناد عن الأعرج عن أبي هريرة أن رسول الله صلى الله عليه وسلم قال: «يعقد الشيطان على قافية رأس أحدكم إذا هو نام ثلاث عقد، يضرب على كل عقدة: عليك ليل طويل فارقد. فإن استيقظ فذكر الله تعالى انحلت عقدة، فإن توضأ انحلت عقدة، فإن صلى انحلت عقدة فأصبح نشيطا طيب النفس، وإلا أصبح خبيث النفس كسلان».", "قال البخاري: وحدثنا مسدد قال: حدثنا أبو الأحوص قال: أخبرنا منصور عن أبي وائل عن عبد الله(١) قال: ذكر عند النبي صلى الله عليه وسلم رجل فقيل: ما زال نائما حتى أصبح ما قام إلى الصلاة. فقال: «بال الشيطان في أذنيه» أخرجاهما في الصحيحين. أخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أحمد بن جعفر قال: أخبرنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا روح وعفان", "حاشية: (١) يعني: ابن مسعود.", "قالا: حدثنا حماد بن سلمة قال: أخبرنا عطاء بن السائب عن مرة عن ابن مسعود عن النبي صلى الله عليه وسلم قال: «عجب ربنا من رجلين؛ رجل ثار عن فراشه(١) ووطائه ولحافه من بين حبه وأهله إلى صلاته، فيقول ربنا: يا ملائكتي، انظروا إلى عبدي، ثار من فراشه ووطائه من بين حبه وأهله إلى صلاته رغبة فيما عندي، وشفقة مما عندي، ورجل غزا في سبيل الله عز وجل، فانهزموا، فعلم ما عليه في الفرار وماله في الرجوع، فرجع حتى أهريق دمه، فيقول الله عز وجل للملائكة: انظروا إلى عبدي رجع رغبة فيما عندي ورهبة مما عندي حتى أهريق دمه»."]], "ic": "book"}, {"story": ["الباب الثاني في الأسباب الميسرة لقيام الليل، وفي الليالي الل (٢ من ٧)، ص٣٠٩", ["قال أحمد: وحدثنا علي بن عبد الله قال: حدثنا هشيم قال: حدثنا مجالد، أخبرنا عن أبي الوداك عن أبي سعيد الخدري قال: قال رسول الله صلى الله عليه وسلم: «ثلاثة يضحك الله عز وجل إليهم: رجل يقوم من الليل، والقوم إذا صفوا للصلاة، والقوم إذا صفوا للقتال». أخبرنا عبد الوهاب قال: أخبرنا المبارك بن عبد الجبار قال: أخبرنا أبو طالب العشاري قال: أخبرنا أبو الحسين بن أخي ميمي قال: حدثنا أبو علي بن صفوان قال: حدثنا أبو بكر القرشي قال: حدثني محمد بن سهل التميمي قال: حدثنا عبد الله بن صالح قال: حدثني معاوية بن صالح عن ربيعة بن يزيد عن أبي إدريس الخولاني عن أبي أمامة الباهلي قال: قال رسول الله صلى الله عليه وسلم: «عليكم بقيام الليل، فإنه دأب الصالحين قبلكم، وهو قربة إلى ربكم، ومغفرة للسيئات ومنهاة عن الإثم».", "وكان الحسن البصري يقول: إني لم أجد من العبادة شيئا أشد من الصلاة في جوف هذا الليل. وقيل له: ما بال المتهجدين أحسن الناس وجوها؟ فقال: لأنهم خلوا بالرحمن، فألبسهم من نوره.", "**بيان الأسباب التي بها يتيسر قيام الليل**", "اعلم أن قيام الليل صعب على الناس إلا من وفق للقيام بشروطه الميسرة له، ومنها ظاهر، ومنها باطن؛ فأما الظاهرة، فأربعة:", "حاشية: (١) ليست في (ظ).", "**الأول:** أن لا يكثر من الأكل، فيكثر الشرب، فيغلبه النوم، وكان بعضهم يقول: يا معاشر(١) المريدين، لا تأكلوا كثيرا، فتشربوا كثيرا، فتناموا كثيرا، فتخسروا كثيرا.", "**الثاني:** أن لا يتعب نفسه بالنهار في الأعمال التي تنصب الجوارح وتضعف الأعصاب، فإن ذلك مجلبة للنوم.", "**الثالث:** أن لا يترك القيلولة بالنهار، فإنها تعين على قيام الليل، وكان الحسن إذا دخل السوق فيسمع لغطهم قال: أظن ليل هؤلاء ليل سوء، أما يقيلون؟!", "**الرابع:** أن لا يحتقب الأوزار بالنهار، قال رجل للحسن: إني أبيت وقد أعددت طهوري فما أقوم حتى أصبح. فقال: ذنوبك قيدتك.", "وقال الثوري: حرمت قيام الليل خمسة أشهر بذنب أذنبته. قيل: وما هو؟ قال: رأيت رجلا يبكي، فقلت في نفسي: هذا مرائي.", "ودخلوا على كرز بن وبرة وهو يبكي فقيل: ما لك؟ قال: بابي مغلق، وستري مسبل، ولم أقرأ جزيي(٢) البارحة، وما ذاك إلا بذنب أحدثته.", "واعلم أن الذنوب كلها تورث قساوة القلب، وتمنع من قيام الليل، وأخصها بالتأثير تناول الحرام، وبالعكس اللقمة الحلال، فإنها تؤثر في تصفية القلب وتحريكه إلى الخير ما لا يؤثره غيرها.", "فأما الميسرات الباطنة، فأربعة:", "**الأول:** سلامة القلب للمسلمين، وخلوه من البدع، وإعراضه عن فضول الدنيا فإن مشغول القلب بهموم الدنيا لا يتيسر له القيام، فإن قام، لم يتفكر إلا في مهماته.", "**الثاني:** خوف غالب يلزم القلب مع قصر الأمل، فإنه إذا تفكر في أهوال", "حاشية: (١) في الأصل: «معشر».", "حاشية: (٢) في (ظ): «جزئي»."]], "ic": "book"}, {"story": ["الباب الثاني في الأسباب الميسرة لقيام الليل، وفي الليالي الل (٣ من ٧)، ص٣١١", ["الآخرة ودركات جهنم طار نومه، وعظم حذره، كان شداد بن أوس إذا أوى إلى فراشه كأنه حبة على مقلى، ثم يقول: اللهم إن ذكر جهنم لا يدعني أنام. فيقوم إلى مصلاه. وكان طاووس يفرش فراشه، ثم يضطجع فيتقلى كما تقلى الحبة على المقلى، ثم يثب، فيدرجه(١) ويستقبل القبلة حتى الصباح، ويقول: طير ذكر جهنم نوم العابدين.", "وقالت بنت الربيع بن خثيم له: يا أبت، مالي أرى الناس ينامون ولا أراك تنام؟ فقال: يا بنيتي، إن أباك يخاف البيات.", "**الثالث:** أن يعرف فضل قيام الليل بما ذكرناه في فضائله حتى يقوى شوقه إلى الثواب.", "**الرابع:** وهو أشرف البواعث، الحب لله وقوة الإيمان بأنه إذا قام ناجى ربه، وأنه حاضره ومشاهده، فإذا أحب الله أحب الخلوة به، وتلذذ بمناجاته، فتحمله لذة المناجاة للحبيب على طول ا لقيام، ولا ينبغي أن تستبعد هذه اللذة فإنه يشهد لها العقل والنقل، أما العقل؛ فليعتبر حال المحب لشخص بسبب جماله، أو لملك بسبب إنعامه كيف يتلذذ بالخلوة به وبمناجاته حتى لا يأتيه النوم طول ليلته.", "فإن قيل: فالجميل يتلذذ بالنظر إليه والله سبحانه لا يرى في حال المناجاة.", "فالجواب: أنه لو كان الجميل المحبوب وراء ستر، أو كان في بيت مظلم لكان المحب يتلذذ بمحاورته المجردة دون النظر ودون الطمع في أمر آخر سواه، وكان يتنعم بإظهار حبه عليه، وذكره بلسانه بمسمع منه، وإن كان ذلك أيضا معلوما عنده.", "فإن قيل: فإنه ينتظر جوابه (٢-٢)فيتلذذ بسماع جوابه(٢-٢)، وليس يسمع كلام الله.", "فالجواب: أنه إن كان يعلم أنه لا يجيبه فقد بقيت أيضا لذة في عرض أحواله عليه، ورفع سره إليه، كيف والمؤمن يستمع من الله كل ما يرد على خاطره في أثناء", "حاشية: (١) أي: يطويه ويثني بعضه على بعض.", "حاشية: (٢-٢) سقط من (ظ).", "مناجاته، فيتلذذ به، وكذا الذي يخلو بالملك ويعرض عليه حاجاته في جنح الليل يتلذذ به في رجاء إنعامه، والرجاء في حق الله أصدق، وما عند الله أبقى مما عند غيره، فكيف لا يلتذ بعرض الحاجات إليه في الخلوات؟!"]], "ic": "book"}, {"story": ["الباب الثاني في الأسباب الميسرة لقيام الليل، وفي الليالي الل (٤ من ٧)، ص٣١٢", ["وأما النقل، فتشهد له أحوال قوام الليل في تلذذهم بقيام الليل، واستقصارهم له، كما يستقصر المحب ليلة وصال الحبيب حتى قيل لبعضهم: كيف أنت والليل؟ فقال: يريني وجهه ثم ينصرف وما تأملته بعد. وقال آخر: أنا والليل فرسا رهان، مرة يسبقني إلى الفجر، ومرة يقطعني عن الفكر، وقال علي بن بكار: منذ أربعين سنة ما أحزنني شيء إلا طلوع الفجر. وقال الفضيل: إذا غربت الشمس فرحت بالظلام لخلوتي بربي، وإذا طلعت حزنت لدخول الناس علي. وقال أبو سليمان: أهل الليل في ليلهم ألذ من أهل اللهو في لهوهم، ولولا الليل ما أحببت البقاء في الدنيا، وأوحى الله عز وجل إلى بعض من أوحى إليه: إن لي عبادا من عبادي(١) يحبونني وأحبهم، ويشتاقون إلي وأشتاق إليهم، ويذكرونني وأذكرهم، وينظرون إلي وأنظر إليهم، فإن حذوت طريقهم أحببتك، وإن عدلت عنهم مقتك. قال: يا رب، وما علامتهم؟ قال: يراعون الظلال بالنهار كما يراعي الراعي غنمه، ويحنون إلى غروب الشمس كما تحن الطير إلى أوكارها، فإذا جنهم(٢) الليل، واختلط الظلام، وخلا كل حبيب بحبيبه نصبوا لي أقدامهم، وافترشوا لي وجوههم، وناجوني بكلامي، وتملقوني بإنعامي، فبين صارخ وباك، وبين متأوه وشاك، بعيني ما يتحملون من أجلي، وبسمعي ما يشكون من حبي، إن أول ما أعطيهم أقذف من نوري في قلوبهم فيخبرون عني كما أخبر عنهم، والثانية: لو كانت السماوات السبع والأرضون وما فيهما في موازينهم لاستقللتها لهم، والثالثة: أقبل عليهم بوجهي، فترى من أقبلت بوجهي عليه أيعلم أحد ما أريد أن أعطيه؟", "وشكى بعض المريدين إلى شيخه طول سهر الليل، وسأله ما يجتلب به النوم، فقال له: يا بني، إن لله نفحات في الليل والنهار تصيب القلوب المتيقظة وتخطي", "حاشية: (١) في (ظ): «عبيدي».", "حاشية: (٢) جنهم الليل: أي سترهم وأظلم عليهم.", "القلوب النائمة، فتعرض لتلك النفحات. فقال: يا أستاذ تركتني لا أنام بالليل ولا بالنهار.", "واعلم أن هذه النفحات بالليل أرجى لما في قيام الليل من صفاء القلب واندفاع الشواغل، وفي أفراد مسلم من حديث جابر عن النبي صلى الله عليه وسلم أنه قال: «إن في الليل لساعة لا يوافقها عبد مسلم يسأل الله فيها خيرا إلا آتاه إياه، وذلك كل ليلة».", "**بيان طرق القسمة لأجزاء الليل**", "للقيام من حيث المقدار سبع مراتب:"]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "وأما الأيام الفاضلة فتسعة عشر؛ يوم عرفة، ويوم عاشوراء، وقد ذكرنا فضلهما، ويوم سبعة ____ من رجب، فقد قال أبو هريرة", "o": ["وعشرين", "بشأن", "والتضرع", "أوامره"], "h": "راجع: ص٣١٧"}, {"t": "fill", "d": 2, "q": "وقالت بنت الربيع بن خثيم له: يا أبت، مالي أرى الناس ينامون ولا أراك تنام؟ فقال: يا بنيتي، إن أباك ____", "o": ["يخاف", "العاصي", "المصاب", "فمذهب"], "h": "راجع: ص٣١١"}, {"t": "fill", "d": 2, "q": "الرابع: وهو أشرف البواعث، الحب لله وقوة الإيمان بأنه إذا قام ناجى ربه، وأنه حاضره ومشاهده، فإذا أحب الله أحب ____ به، وتلذذ بمناجاته، فتحمله لذة المناجاة للحبيب على طول ا لقيام، ولا ينبغي أن", "o": ["الخلوة", "يحضره", "مقدمته", "حبابة"], "h": "راجع: ص٣١١"}, {"t": "fill", "d": 2, "q": "ومن فواضل الأيام في الأسبوع؛ الاثنين والخميس، وقد سبق ذكر فضلهما، ____ الأشهر الحرم، وأيام البيض، وغير ذلك في كتاب الصيام", "o": ["وفضل", "يطلب", "فخذه", "يغتسل"], "h": "راجع: ص٣١٧"}, {"t": "fill", "d": 2, "q": "وقال الثوري: حرمت قيام الليل خمسة أشهر بذنب أذنبته. قيل: وما هو؟ قال: رأيت رجلا ____، فقلت في نفسي: هذا", "o": ["يبكي", "توقع", "آيات", "متعرض"], "h": "راجع: ص٣١٠"}, {"t": "fill", "d": 2, "q": "فهذه طرق قسمة الليل فليتخير المريد لنفسه ما يسهل عليه، فإن صعب عليه القيام في وسط الليل، فلا ينبغي أن يخل بإحياء ما بين العشاءين وورد ____ ليكون قائما في الطرفين، وهذه مرتبة سابعة", "o": ["السحر", "متحريا", "ترجمت", "بعدهم"], "h": "راجع: ص٣١٥"}]}, {"t": "الباب الثاني في الأسباب الميسرة لقيام الليل، وفي الليالي اللواتي يستحب - القسم ٢ من ٢", "b": [{"story": ["الباب الثاني في الأسباب الميسرة لقيام الليل، وفي الليالي الل (٥ من ٧)، ص٣١٣", ["**المرتبة الأولى:** إحياء كل الليل، وقد كان هذا طريق جماعة من السلف، وكان فيهم من يصلي الصبح بوضوء العشاء، وقد روينا عن ابن عمر أنه كان يحيي الليل صلاة، وعن عبدة بن هلال أنه قال: لا يشهد علي الليل بنوم. وقالت خادم عامر بن عبد قيس: ما فرشت له فراشا بالليل فاضطجع عليه إلا بالنهار. وقالت أم عمر ابن المنكدر: يا بني، إني لأشتهي أن أراك نائما. فقال: يا أماه، والله إن الليل ليرد علي أمورا فيهولني، فيقضي عني ما قضيت منه أربي، وروينا عن عطاء الخراساني أنه كان يحيي الليل صلاة(١)، وعن سليمان التيمي أنه صلى الفجر بوضوء العشاء أربعين سنة، وأن منصور بن زاذان صلى الفجر بوضوء العشاء عشرين سنة، ومكث هشيم يصلي الفجر بوضوء العشاء عشرين سنة، وممن اشتهر بقيام الليل كله سعيد بن المسيب، وصفوان بن سليم المدنيان، وفضيل بن عياض، ووهيب بن الورد المكيان، وطاوس ووهب بن منبه اليمانيان، والربيع بن خثيم والحكم الكوفيان، وأبو سليمان الداراني وعلي بن بكار الشاميان، وأبو عبد الله الخواص وأبو عاصم العبادانيان(٢)، وحبيب أبو محمد وأبو جابر السلماني الفارسيان، ومالك بن دينار وسليمان التيمي ويزيد الرقاشي وحبيب بن أبي ثابت ويحيى البكاء البصريون في جماعة يطول ذكرهم.", "حاشية: (١) سقطت من (ظ).", "حاشية: (٢) نسبة إلى عبادان، جزيرة في بحر فارس.", "**المرتبة الثانية:** أن يقوم نصف الليل، وقد كان جماعة من السلف يفعلون ذلك منهم: ابن عباس، قال ابن أبي مليكة: صحبته من المدينة إلى مكة، ومن مكة إلى المدينة، فكان يقوم شطر الليل يكثر، والله في ذلكم التسبيح.", "وأحسن طريق في هذا أن ينام الثلث الأول من الليل، والسدس الأخير منه حتى يقع قيامه في جوف الليل ووسطه، فهو الأفضل.", "**المرتبة الثالثة:** أن يقوم ثلث الليل، فينبغي أن ينام النصف الأول والسدس الأخير، وهو قيام داود عليه السلام، وفي الصحيحين من حديث عبد الله بن عمرو قال: قال لي رسول الله صلى الله عليه وسلم: «أحب الصلاة إلى الله صلاة داود، كان ينام نصف الليل، ويقوم ثلثه وينام سدسه». وفي الصحيحين من حديث ابن عباس أنه قال: بت عند خالتي ميمونة، فنام رسول الله صلى الله عليه وسلم حتى انتصف الليل، أو قبله بقليل، أو بعده بقليل، فاستيقظ فتوضأ، ثم صلى اثنتي عشرة ركعة، ثم أوتر، ثم اضطجع."]], "ic": "book"}, {"story": ["الباب الثاني في الأسباب الميسرة لقيام الليل، وفي الليالي الل (٦ من ٧)، ص٣١٤", ["وفي الجملة نوم آخر الليل حسن؛ لأنه يذهب بآثار النعاس من الوجه بالغداة، ويقلل صفرته، وفيه إجمام(١) للبدن لتلقي أوراد النهار، وفي الصحيحين من حديث عائشة قالت: كان رسول الله صلى الله عليه وسلم إذا قام توضأ وصلى ما قضى الله له، فإن كانت به حاجة إلى أهله أتى أهله، وإلا مال إلى فراشه، فإن كان أتى أهله نام كهيأته لم يمس ماء، حتى إذا كان عند أول الأذان وثب، فإن كان جنبا أفاض عليه الماء، ثم صلى ركعتين، ثم خرج إلى المسجد.", "**المرتبة الرابعة:** أن يقوم سدس الليل أو خمسه، وأفضل ذلك ما كان في النصف الأخير، وبعضهم يقول: أفضله السدس الأخير.", "**المرتبة الخامسة:** أن لا يراعي التقدير، فإن مراعاة ذلك تصعب، ثم في ما يفعله طريقان: أحدهما: أن يقوم أول الليل إلى أن يغلبه النوم فينم، فإذا انتبه قام، فإذا غلبه النوم نام، وهذا من أشد المكابدة لليل، وهو طريق جماعة من السلف، وفي الصحيحين من حديث أنس قال: ما كنا نشاء أن نرى رسول الله صلى الله عليه وسلم مصليا من", "حاشية: (١) إجمام: راحة.", "الليل إلا رأيناه، وما كنا نشاء أن نراه نائما إلا رأيناه. وقد قال أسلم: كان عمر بن الخطاب يصلي من الليل ما شاء الله، حتى إذا كان من آخر الليل أيقظ أهله يقول: الصلاة الصلاة. وقال الضحاك: أدركت أقواما يستحيون من الله في سواد هذا الليل من طول الضجعة.", "والطريق الثاني: أن ينام أول الليل، فإذا أخذ حظه من النوم وانتبه قام الباقي، قال سفيان الثوري: إنما هي أول نومة فإذا انتبهت لم أقلها.", "**المرتبة(١) السادسة:** وهي الأقل أن يقوم أربع ركعات أو ركعتين، فقد روينا عن النبي صلى الله عليه وسلم أنه قال: «صلوا من الليل، صلوا أربعا، صلوا ولو ركعتين، ما من أهل بيت تعرف لهم صلاة من الليل إلا نادى مناد: يا أهل البيت قوموا لصلاتكم». وروى أبو داود من حديث أبي سعيد وأبي هريرة قالا: قال رسول الله صلى الله عليه وسلم: «من استيقظ من الليل وأيقظ امرأته فصليا جميعا ركعتين كتبا من الذاكرين الله كثيرا والذاكرات».", "وكان طلحة بن مصرف يأمر أهله بقيام الليل (٢-٢)ويقول: صلوا ولو ركعتين، فإن الصلاة في جوف الليل تحط الأوزار.", "فهذه طرق قسمة الليل(٢-٢) فليتخير المريد لنفسه ما يسهل عليه، فإن صعب عليه القيام في وسط الليل، فلا ينبغي أن يخل بإحياء ما بين العشاءين وورد السحر ليكون قائما في الطرفين، وهذه مرتبة سابعة.", "**فصل**", "فأما من صعبت عليه الطهارة بالليل، وثقلت عليه الصلاة، فليجلس مستقبل القبلة، وليذكر الله تعالى، وليدع مهما قدر، فإن لم يجلس فليذكر الله وهو مضطجع، وفي أفراد البخاري من حديث عبادة بن الصامت عن النبي صلى الله عليه وسلم أنه قال:", "حاشية: (١) في (ظ): «الرتبة».", "حاشية: (٢-٢) سقط من (ظ)."]], "ic": "book"}, {"story": ["الباب الثاني في الأسباب الميسرة لقيام الليل، وفي الليالي الل (٧ من ٧)، ص٣١٦", ["«من تعار(١) من الليل، فقال: لا إله إلا الله، وحده لا شريك له، له الملك، وله الحمد، وهو على كل شيء قدير، الحمد لله، وسبحان الله، والله أكبر، ولا حول ولا قوة إلا بالله، ثم قال: اللهم اغفر لي، أو دعا استجيب له، فإن توضأ - يعني - وصلى، قبلت صلاته».", "**فصل**", "ومن كان عليه ورد، فغلبه النوم وفاته، فليأت به بعد صلاة الضحى، ففي أفراد مسلم من حديث عمر بن الخطاب عن النبي صلى الله عليه وسلم أنه قال: «من نام عن حزبه أو عن شيء منه، فقرأه ما بين صلاة الفجر وصلاة الظهر كتب له كأنما قرأه من الليل».", "وليحذر من له عادة بقيام الليل أن يتركها، ففي الصحيحين من حديث عبد الله بن عمرو قال: قال رسول الله صلى الله عليه وسلم: «يا عبد الله، لا تكونن مثل فلان كان يقوم الليل، فترك قيام الليل».", "**بيان الليالي والأيام الفاضلة**", "أما الليالي المخصوصات بمزيد من الفضل اللواتي يستحب إحياؤها في السنة فخمس عشرة ليلة، ولا يصلح للمريد أن يغفل عنهن؛ لأنه إذا غفل التاجر عن موسم الربح فمتى يربح؟", "فست(٢) من هذه الليالي في رمضان؛ الليلة السابعة عشرة، فهي ليلة في صبيحتها كانت موقعة بدر، وخمس(٣) هن أوتار العشر، إذ فيهن تطلب ليلة القدر، وأما التسع(٤) الأخر؛ فأول ليلة من المحرم، وليلة عاشوراء، وأول ليلة من رجب،", "حاشية: (١) تعار: أي أرق وتقلب في فراشه ولم ينم.", "حاشية: (٢) في النسخ: «فسبع»، والمثبت من الإحياء، وهو الصواب.", "حاشية: (٣) في النسخ: «وست»، والمثبت من الإحياء.", "حاشية: (٤) في النسخ: «الثمان»، مع أن المصنف قد عد تسع ليال.", "وليلة النصف منه، وليلة سبع وعشرين منه، فإنها ليلة المعراج، وليلة النصف من شعبان، وليلة عرفة، وليلتا العيدين، وقد رويت صلوات لبعض هذه ا لليالي وليس فيها ما يثبت فتنكبناها.", "وأما الأيام الفاضلة فتسعة عشر؛ يوم عرفة، ويوم عاشوراء، وقد ذكرنا فضلهما، ويوم سبعة وعشرين من رجب، فقد قال أبو هريرة: من صام يوم سبعة وعشرين من رجب كتب الله له صيام ستين شهرا، وهو اليوم الذي نزل فيه جبريل على النبي صلى الله عليه وسلم أول ي   const stext = (x, y, s, cls, extra) => '<text x="' + f1(x) + '" y="' + f1(y) + '" text-anchor="middle"' + (cls ? ' class="' + cls + '"' : '') + (extra || '') + '>' + esc(neg(s)) + '</text>';
  const svgOpen = (w, h, label) => '<svg class="fg" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + esc(label || 'شكل توضيحي') + '">';

  /* التمثيل البياني */
  function figGraph(f) {
    const W = 300, H = 240, L = 44, R = 22, T = 20, B = 46, pw = W - L - R, ph = H - T - B;
    const X = v => L + v / f.xmax * pw, Y = v => T + ph - v / f.ymax * ph;
    let g = svgOpen(W, H, 'تمثيل بياني');
    for (let v = 0; v <= f.xmax + 1e-9; v += f.xs) g += '<line class="gr" x1="' + f1(X(v)) + '" y1="' + T + '" x2="' + f1(X(v)) + '" y2="' + (T + ph) + '"/>' + (v ? stext(X(v), T + ph + 15, v, 'tk') : '');
    for (let v = 0; v <= f.ymax + 1e-9; v += f.ys) g += '<line class="gr" x1="' + L + '" y1="' + f1(Y(v)) + '" x2="' + (L + pw) + '" y2="' + f1(Y(v)) + '"/>' + '<text class="tk" text-anchor="end" x="' + (L - 7) + '" y="' + f1(Y(v) + 4) + '">' + v + '</text>';
    g += '<path class="ax" d="M' + L + ' ' + (T - 10) + 'V' + (T + ph) + 'H' + (L + pw + 12) + '"/><path class="ax" d="M' + (L - 4) + ' ' + (T - 5) + 'l4 -6 4 6M' + (L + pw + 7) + ' ' + (T + ph - 4) + 'l6 4 -6 4"/>';
    g += '<text class="it" x="' + (L + pw + 14) + '" y="' + (T + ph + 16) + '" text-anchor="middle" style="font-size:15px">x</text><text class="it" x="' + (L - 12) + '" y="' + (T - 8) + '" text-anchor="middle" style="font-size:15px">y</text>';
    if (f.seg) g += '<line class="ln" x1="' + f1(X(f.seg[0][0])) + '" y1="' + f1(Y(f.seg[0][1])) + '" x2="' + f1(X(f.seg[1][0])) + '" y2="' + f1(Y(f.seg[1][1])) + '"/>';
    if (f.poly) g += '<polyline class="ln" points="' + f.pts.map(p => f1(X(p[0])) + ',' + f1(Y(p[1]))).join(' ') + '"/>';
    (f.pts || []).forEach(p => { g += '<circle class="pt" cx="' + f1(X(p[0])) + '" cy="' + f1(Y(p[1])) + '" r="5"/>'; });

    if (f.yl) g += '<text class="arx" text-anchor="middle" transform="translate(11 ' + f1(T + ph / 2) + ') rotate(-90)">' + esc(f.yl) + '</text>';
    return g + '</svg>';
  }

  /* شكل ڤن */
  function vItems(items, cx0, cy0, cols, dx, dy) {
    const n = (items || []).length; if (!n) return '';
    cols = Math.min(cols || (n > 3 ? 2 : 1), n); const rows = Math.ceil(n / cols);
    return items.map((it, i) => {
      const r = Math.floor(i / cols), c = i % cols, inRow = r === rows - 1 ? n - r * cols : cols;
      const x = cx0 + (c - (inRow - 1) / 2) * dx, y = cy0 + (r - (rows - 1) / 2) * dy, s = String(it);
      if (isAr(s)) return stext(x, y + 4, s, 'vel sm');
      return '<circle class="vdot" cx="' + f1(x - 5 - s.length * 4.2) + '" cy="' + f1(y) + '" r="2.4"/>' + stext(x + 3, y + 5, s, 'vel');
    }).join('');
  }
  function figVenn(f) {
    const nm = f.names || ['A', 'B', 'C'], c = FCOL;
    const set = (shape, i) => shape.replace('/>', ' class="vset" fill="' + c[i] + '" stroke="' + c[i] + '"/>');
    const name = (x, y, i) => '<text class="vname" x="' + x + '" y="' + y + '" text-anchor="middle" fill="' + c[i] + '">' + esc(nm[i]) + '</text>';
    let g = '';
    if (f.form === '1') {
      g = svgOpen(320, 170, 'شكل ڤن') + set('<ellipse cx="160" cy="92" rx="118" ry="64"/>', 0) + name(40, 26, 0) + vItems(f.A, 160, 92, Math.min(4, (f.A || []).length), 46, 34);
    } else if (f.form === 'dis') {
      g = svgOpen(320, 190, 'شكل ڤن') + set('<circle cx="84" cy="106" r="68"/>', 0) + set('<circle cx="236" cy="106" r="68"/>', 1) + name(84, 26, 0) + name(236, 26, 1) + vItems(f.A, 84, 106, 2, 46, 34) + vItems(f.B, 236, 106, 2, 46, 34);
    } else if (f.form === 'sub') {
      g = svgOpen(320, 200, 'شكل ڤن') + set('<ellipse cx="160" cy="108" rx="140" ry="82"/>', 0) + set('<circle cx="210" cy="112" r="56"/>', 1) + name(34, 30, 0) + name(210, 50, 1) + vItems(f.A, 86, 108, 2, 44, 34) + vItems(f.B, 210, 118, 2, 42, 32);
    } else if (f.form === '3') {

        name(52, 26, 0) + name(268, 26, 1) + name(252, 232, 2) +
        vItems(f.A, 84, 78, 1, 30, 26) + vItems(f.B, 236, 78, 1, 30, 26) + vItems(f.C, 160, 208, 3, 34, 26) +
        vItems(f.AB, 160, 66, 1, 30, 24) + vItems(f.AC, 110, 146, 1, 30, 24) + vItems(f.BC, 210, 146, 1, 30, 24) + vItems(f.ABC, 160, 122, 1, 30, 24);
      void id;
    } else {

      g = svgOpen(320, 190, 'شكل ڤن') + '<defs><clipPath id="' + id + '"><circle cx="118" cy="106" r="74"/></clipPath></defs>';
      if (f.shade === 'u') g += '<circle cx="118" cy="106" r="74" fill="#99F6E4"/><circle cx="202" cy="106" r="74" fill="#99F6E4"/>';
      if (f.shade === 'i') g += '<circle cx="202" cy="106" r="74" fill="#5EEAD4" clip-path="url(#' + id + ')"/>';
      g += set('<circle cx="118" cy="106" r="74"/>', 0) + set('<circle cx="202" cy="106" r="74"/>', 1) + name(70, 26, 0) + name(250, 26, 1) +
        vItems(f.A, 78, 106, 1, 40, 30) + vItems(f.AB, 160, 106, 1, 40, 30) + vItems(f.B, 242, 106, 1, 40, 30);
    }
    return g + '</svg>';
  }

  /* خط الأعداد */
  function figNline(f) {
    const n = f.max - f.min, W = 320, L = 20, R = 20, st = (W - L - R) / n, hops = f.hops || [];
    const rows = f.flat ? Math.min(1, hops.length) : hops.length;
    const top = rows ? 20 + 24 * rows : 14, y0 = top + 8, H = y0 + 34;
    const X = v => L + (v - f.min) * st;
    let g = svgOpen(W, H, 'خط الأعداد');
    g += '<path class="nl" d="M6 ' + y0 + 'H' + (W - 6) + 'M12 ' + (y0 - 5) + 'l-7 5 7 5M' + (W - 12) + ' ' + (y0 - 5) + 'l7 5 -7 5"/>';
    for (let v = f.min; v <= f.max; v++) {
      const on = (f.mark || []).indexOf(v) >= 0;
      g += '<line class="nl" x1="' + f1(X(v)) + '" y1="' + (y0 - 6) + '" x2="' + f1(X(v)) + '" y2="' + (y0 + 6) + '"/>';
      if (on) g += '<circle cx="' + f1(X(v)) + '" cy="' + (y0 + 20) + '" r="11" fill="#FEF08A" stroke="#EAB308" stroke-width="2"/>';
      g += stext(X(v), y0 + 24.5, v, 'tk', n > 12 ? ' style="font-size:10px"' : (on ? ' style="fill:#713F12;font-weight:800"' : ''));
    }
    hops.forEach((h, i) => {
      const y = y0 - 16 - (f.flat ? 0 : (hops.length - 1 - i) * 24), col = FCOL[[1, 0, 2, 3][i % 4]], a = X(h[0]), b = X(h[1]), d = b > a ? -1 : 1;
      g += '<line class="guide" stroke="' + col + '" x1="' + f1(a) + '" y1="' + y + '" x2="' + f1(a) + '" y2="' + (y0 - 7) + '"/><line class="guide" stroke="' + col + '" x1="' + f1(b) + '" y1="' + y + '" x2="' + f1(b) + '" y2="' + (y0 - 7) + '"/>';
      g += '<path class="hop" stroke="' + col + '" d="M' + f1(a) + ' ' + y + 'H' + f1(b) + 'm' + (7 * d) + ' -5l' + (-7 * d) + ' 5 ' + (7 * d) + ' 5"/>';
      if (h[2]) g += stext((a + b) / 2, y - 6, h[2], '', ' fill="' + col + '" style="font-size:12.5px"');
    });
    return g + '</svg>';
  }

  /* نموذج الأجزاء المتساوية (للتقسيم التناسبي) */
  function figTape(f) {
    const tot = f.parts.reduce((a, p) => a + p[0], 0), W = 320, bw = Math.min(54, 296 / tot), x0 = (W - bw * tot) / 2;
    let g = svgOpen(W, 96, 'نموذج الأجزاء'), x = x0;
    f.parts.forEach((p, i) => {
      const xs = x;
      for (let k = 0; k < p[0]; k++) { g += '<rect x="' + f1(x + 1.5) + '" y="10" width="' + f1(bw - 3) + '" height="40" rx="9" fill="' + FSOFT[i % 6] + '" stroke="' + FCOL[i % 6] + '" stroke-width="2.5"/>' + (f.each ? stext(x + bw / 2, 35, f.each, '', ' style="font-size:' + (String(f.each).length > 5 ? 9.5 : 12.5) + 'px"') : ''); x += bw; }
      g += '<path d="M' + f1(xs + 4) + ' 58v5H' + f1(x - 4) + 'v-5" fill="none" stroke="' + FCOL[i % 6] + '" stroke-width="2" stroke-linecap="round"/>' + stext((xs + x) / 2, 82, p[1], 'arx', ' fill="' + FCOL[i % 6] + '"');
    });
    return g + '</svg>';
  }

  /* المقياس الخطي للخريطة */
  function figSbar(f) {
    const n = f.vals.length - 1, W = 320, L = 34, st = 232 / n;
    let g = svgOpen(W, 62, 'مقياس رسم خطي');
    for (let i = 0; i < n; i++) g += '<rect x="' + f1(L + i * st) + '" y="34" width="' + f1(st) + '" height="9" fill="' + (i % 2 ? '#fff' : '#1E1B3A') + '" stroke="#1E1B3A" stroke-width="1.6"/>';
    f.vals.forEach((v, i) => { g += stext(L + i * st, 26, v, 'tk', ' style="font-size:12.5px"'); });
    g += stext(L + n * st + 26, 26, f.unit, 'arx');
    return g + stext(L + st / 2, 58, '1 سم', 'arx', ' style="font-size:11px"') + '</svg>';
  }

  /* بطاقات العد +1 و −1 */
  function figChips(f) {
    const cols = Math.max(f.pos, f.neg), W = 320, cw = Math.min(40, 300 / cols), x0 = (W - cw * cols) / 2, pairs = Math.min(f.pos, f.neg);
    let g = svgOpen(W, 112, 'بطاقات العد');
    const card = (x, y, t, a, b, c) => '<rect x="' + f1(x + 3) + '" y="' + y + '" width="' + f1(cw - 6) + '" height="28" rx="8" fill="' + a + '" stroke="' + b + '" stroke-width="2"/>' + stext(x + cw / 2, y + 19, t, '', ' fill="' + c + '" style="font-size:13px"');
    for (let i = 0; i < cols; i++) {
      const x = x0 + i * cw;
      if (i < pairs) g += '<rect x="' + f1(x + .5) + '" y="5" width="' + f1(cw - 1) + '" height="80" rx="12" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="4 4"/>' + stext(x + cw / 2, 104, '0', 'tk');
      if (i < f.pos) g += card(x, 12, '+1', '#FEF08A', '#EAB308', '#713F12');
      if (i < f.neg) g += card(x, 50, '−1', '#99F6E4', '#14B8A6', '#881337');
    }
    return g + '</svg>';
  }

  /* مستطيل بأبعاده (نموذج/مخطط) */
  function figRect(f) {
    const k = f.ratio || 1.3, h = 92, w = Math.min(230, h * k), x = (320 - w) / 2 + 12, y = 16;

  };
  let EID = 0;
  const ngon = (cx0, cy0, R, n, rot) => Array.from({ length: n }, (_, k) => { const a = (rot + k * 360 / n) * Math.PI / 180; return f1(cx0 + R * Math.cos(a)) + ',' + f1(cy0 + R * Math.sin(a)); }).join(' ');
  function laurel() {
    let s = '';
    [-1, 1].forEach(side => {
      for (let k = 0; k < 7; k++) {
        const t = (20 + k * 19.5) * Math.PI / 180, px = 60 + side * 50 * Math.sin(t), py = 60 + 50 * Math.cos(t);
        const rot = Math.atan2(-Math.sin(t), side * Math.cos(t)) * 180 / Math.PI + side * 26;
        s += '<ellipse cx="' + f1(px) + '" cy="' + f1(py) + '" rx="8" ry="3.7" transform="rotate(' + f1(rot) + ' ' + f1(px) + ' ' + f1(py) + ')"/>';
      }
    });
    return s;
  }
  function emblem(i, cls) {
    const b = BADGES[i], id = 'em' + (++EID), R = 'url(#' + id + 'r)', D = 'url(#' + id + 'd)';

      '<linearGradient id="' + id + 'd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + b.d[0] + '"/><stop offset="1" stop-color="' + b.d[1] + '"/></linearGradient></defs>';
    let cyD = 58, rD = 31, gs = 1.95;
    const two = fn => fn(4, b.c[2]) + fn(0, R);   /* حافة ثلاثية الأبعاد ثم الوجه */
    if (b.rays) { s += '<g fill="' + b.c[1] + '" opacity=".85">'; for (let k = 0; k < 16; k++) s += '<path d="M60 0 64 24h-8z" transform="rotate(' + (k * 22.5 + 11.25) + ' 60 60)"/>'; s += '</g>'; }
    if (b.laurel) s += '<g fill="' + (b.rays ? '#16A34A' : b.c[2]) + '">' + laurel() + '</g>';
    if (b.ribbon) s += '<path d="M38 2h18l10 34H48z" fill="#EF4444"/><path d="M82 2H64L54 36h18z" fill="#3B82F6"/>';
    switch (b.plate) {
      case 'coin': {
        const r = b.laurel ? 38 : b.ribbon ? 39 : 47, cy = b.ribbon ? 70 : b.laurel ? 58 : 58;
        cyD = cy; rD = b.laurel ? 30 : b.ribbon ? 29 : 34; gs = b.laurel ? 2.1 : b.ribbon ? 1.55 : 1.95;
        s += two((dy, fill) => '<circle cx="60" cy="' + (cy + dy) + '" r="' + r + '" fill="' + fill + '"/>'); break;
      }
      case 'star5': rD = 0;
        s += two((dy, fill) => '<path d="' + STAR5 + '" transform="translate(60 ' + (57 + dy) + ') scale(5.4) translate(-12 -12.2)" fill="' + fill + '" stroke="' + fill + '" stroke-width="1.2" stroke-linejoin="round"/>'); break;
      case 'star8': s += two((dy, fill) => '<polygon points="' + starPts(60, 58 + dy, 54, 41.5) + '" fill="' + fill + '"/>'); rD = 31; break;
      case 'hex': s += two((dy, fill) => '<polygon points="' + ngon(60, 58 + dy, 50, 6, -90) + '" fill="' + fill + '" stroke="' + fill + '" stroke-width="6" stroke-linejoin="round"/>'); rD = 33; break;
      case 'shield': s += two((dy, fill) => '<path transform="translate(0 ' + dy + ')" d="M60 5 105 19v36c0 27-19 46-45 57C34 101 15 82 15 55V19z" fill="' + fill + '"/>'); cyD = 54; rD = 31; break;
      case 'burst': s += two((dy, fill) => '<polygon points="' + starPts(60, 58 + dy, 55, 45, 12) + '" fill="' + fill + '"/>'); rD = 34; break;
      case 'wings': {
        const w = 'M38 50C27 36 13 31 1 34c3 5 7 8 12 10-5 0-9 2-11 5 4 3 9 4 14 3-4 2-6 5-7 9 5 1 10 0 14-3-2 3-3 6-2 9 8-1 14-6 18-13z';
        s += two((dy, fill) => '<path d="' + w + '" fill="' + fill + '" transform="translate(0 ' + dy + ')"/><path d="' + w + '" fill="' + fill + '" transform="translate(120 ' + dy + ') scale(-1 1)"/>');
        s += two((dy, fill) => '<circle cx="60" cy="' + (56 + dy) + '" r="32" fill="' + fill + '"/>'); cyD = 56; rD = 24; gs = 1.5; break;
      }
      case 'grand': s += two((dy, fill) => '<polygon points="' + starPts(60, 60 + dy, 42, 35, 16) + '" fill="' + fill + '"/>'); cyD = 60; rD = 29; gs = 2.2; break;
    }
    if (rD) s += '<circle cx="60" cy="' + cyD + '" r="' + rD + '" fill="' + D + '" stroke="rgba(255,255,255,.65)" stroke-width="2"/>' +
      '<path d="M' + f1(60 - rD * .8) + ' ' + f1(cyD - rD * .28) + 'a' + f1(rD * .86) + ' ' + f1(rD * .86) + ' 0 0 1 ' + f1(rD * 1.05) + ' ' + f1(-rD * .5) + '" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="3" stroke-linecap="round"/>';

    else s += '<g transform="translate(60 ' + (cyD - (b.pips ? 4 : 0)) + ') scale(' + gs + ') translate(-12 -12)" fill="' + b.gc + '">' + GLYPH[b.g] + '</g>';

    return s + '</svg>';
  }

    if (b.chips) return '<div class="blk b-chips">' + (b.title ? '<div class="lt">' + md(b.title) + '</div>' : '') + '<div class="chips">' + b.chips.map((x, k) => '<span class="chip" style="--i:' + k + '">' + md(x) + '</span>').join('') + '</div></div>';

  /* عُقد الطريق المتعرج بأسلوبه الأصلي نفسه؛ تُستخدم لقائمة المسارات ولمحطات كل مسار */
  function roadRows(nodes) {
    const W = appEl.clientWidth || 360;
    const amp = Math.max(28, Math.min(80, (W - 32) / 2 - 92));
    return nodes.map((nd, i) => {
      const x = Math.round(Math.sin(i * 0.95) * amp), id = nd.id, state = nd.state;
      return '<div class="pnode ' + state + (nd.extra || '') + '" data-x="' + x + '" data-col="' + th(id)[0] + '" style="' + tv(id) + ';--x:' + x + 'px;--i:' + i + '">' +
        (nd.bubble ? '<span class="bubble">' + nd.bubble + '</span>' : '') +
        '<button class="med khatam" ' + nd.attrs + ' aria-label="' + esc(nd.label) + '">' +
        (state === 'current' ? '<span class="rip"></span><span class="rip r2"></span>' : '') + nd.num +
        (state === 'done' ? '<span class="donecheck">' + IC.check + '</span>' : '') + (state === 'locked' ? '<span class="lock">' + IC.lock + '</span>' : '') + '</button>' +
        '<div class="plabel">' + (nd.label.indexOf(nd.group) === 0 ? '' : '<span class="pg">' + esc(nd.group) + '</span>') + '<span class="pt">' + esc(nd.label) + '</span>' + (nd.pill || '') + '</div></div>';
    }).join('');
  }
  const starPill = (got, mx) => '<span class="ppill' + (got >= mx ? ' full' : '') + '">' + IC.star + got + ' / ' + mx + '</span>';
  function roadWatch(el, after) {
    requestAnimationFrame(() => requestAnimationFrame(after));
    const pathEl = el.querySelector('.path');
    if (window.ResizeObserver && pathEl) { let lastH = 0; const ro = new ResizeObserver(() => { if (!el.isConnected) { ro.disconnect(); return; } if (pathEl.offsetHeight !== lastH) { lastH = pathEl.offsetHeight; drawPath(el, false); } }); ro.observe(pathEl); }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (el.isConnected) drawPath(el, false); });
  }

    const el = mount('<header class="bar home-bar"><h1 class="home-title grad-text long">منهاج القاصدين<br><span style="font-size:.55em;display:inline-block;line-height:1.5">ربع العبادات (الربع الأول من أربعة)</span></h1>' +

      '<button class="tool sq" data-act="sound" aria-label="' + (S.sound ? 'كتم الصوت' : 'تشغيل الصوت') + '">' + (S.sound ? IC.sound : IC.mute) + '</button><button class="tool sq" data-act="settings" aria-label="الإعدادات">' + IC.gear + '</button></div></header>' +
      '<div class="body home-body"><div class="hello slim">' + mascot(doneN ? 'wave' : 'idle') + '<div class="hello-t"><strong>' + (doneN === 0 ? 'لنبدأ الرحلة معاً!' : doneN === MAIN.length ? (allBxDone() ? 'أتممت الرحلة كلها، ما شاء الله!' : 'بقيت امتحانات الأبواب!') : 'رائع! أنجزت ' + ar(doneN) + ' من ' + ar(MAIN.length) + (MAIN.length > 10 ? ' محطة' : ' محطات')) + '</strong><span>' + (doneN === MAIN.length ? 'أعد أي محطة لتحسّن نجومك فيها' : 'اختر باباً لتفتح فصوله، ثم ادخل الفصل الذي تريده') + '</span><div class="track"><i style="width:' + Math.max(4, doneN / MAIN.length * 100) + '%"></i></div></div></div>' +
      '<div class="path"><svg class="pline" aria-hidden="true"></svg>' + roadRows(nodes) + '</div><p class="path-end">كل الأبواب مفتوحة لك؛ ادخل أي باب تريده بأي ترتيب، وفي آخر كل باب امتحانه.<br>' + (allBxDone() ? '<button class="btn btn-link" data-act="cert" data-b="-1">' + IC.medal + 'شهادة إتمام الكتاب</button><br>' : '') + '<button class="btn btn-link" data-act="reset">' + IC.reset + 'إعادة الرحلة من البداية</button></p></div>', dir);

  /* صفحة المسار: الطريق نفسه، وعليه محطات هذا المسار وحده */
  function showPath(gi, dir) {
    const p = PATHS[gi]; if (!p) { VIEW = 'home'; showHome(dir); return; }
    setTheme(p.lv[0].id); VIEW = 'path';
    const focus = focusId(), first = p.lv.find(l => !S.done[l.id]);

    const nodes = p.lv.map(l => {
      const id = l.id, state = S.done[id] ? 'done' : id === curId ? 'current' : 'open';
      const got = lvStars(l), mx = lvMax(l);
      return { id, state, attrs: 'data-act="open" data-id="' + id + '"', num: '<span class="mn">' + ar(levelNum(l)) + '</span>', group: l.group, label: l.title,
        bubble: state === 'current' ? (S.pos[id] ? 'أكمل' : 'ابدأ هنا') : '', pill: state === 'done' || got ? starPill(got, mx) : '' };
    });

      '<div class="body home-body"><div class="path"><svg class="pline" aria-hidden="true"></svg>' + roadRows(nodes) + '</div>' +
      '<p class="path-end">' + stWord(p.lv.length) + ' في هذا الفصل، وكلها مفتوحة لك.<br><button class="btn btn-link" data-act="bab" data-b="' + babOf(gi) + '" data-dir="back">' + IC.back + 'العودة إلى الباب</button></p></div>', dir);
    /* المسار قصير: لا نحرّك الصفحة إلا إذا كانت المحطة الحالية أسفل الشاشة */
    roadWatch(el, () => {
      drawPath(el, false);
      const cur = el.querySelector('.pnode.current'), body = el.querySelector('.body'), pathEl = el.querySelector('.path');
      if (cur && body && pathEl) { const bot = pathEl.offsetTop - body.offsetTop + cur.offsetTop + cur.offsetHeight; if (bot > body.clientHeight - 12) body.scrollTop = bot - body.clientHeight + 24; }
    });
  }
  function drawPath(el, scroll) {
    const path = el.querySelector('.path'); if (!path) return;
    const svg = path.querySelector('.pline');
    const pts = Array.from(path.querySelectorAll('.pnode')).map(nd => {
      const m = nd.querySelector('.med'); const cxp = nd.offsetLeft + nd.offsetWidth / 2 + (+nd.dataset.x || 0);
      return { x: cxp, top: nd.offsetTop + m.offsetTop + 6, bot: nd.offsetTop + nd.offsetHeight + 4, done: nd.classList.contains('done'), col: nd.dataset.col };
    });
    svg.setAttribute('viewBox', '0 0 ' + path.offsetWidth + ' ' + path.offsetHeight);
    let segs = '';
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i], y1 = a.bot, y2 = b.top, my = (y1 + y2) / 2;
      segs += '<path class="' + (a.done && b.done ? 'done' : '') + '"' + (a.done ? ' style="stroke:' + b.col + '"' : '') + ' d="M' + a.x.toFixed(1) + ' ' + y1.toFixed(1) + ' C' + a.x.toFixed(1) + ' ' + my.toFixed(1) + ' ' + b.x.toFixed(1) + ' ' + my.toFixed(1) + ' ' + b.x.toFixed(1) + ' ' + y2.toFixed(1) + '"/>';
    }
    svg.innerHTML = segs;
    const cur = path.querySelector('.pnode.current'); const body = el.querySelector('.body');
    if (scroll && cur && body && (S.resume || MAIN.some(l => S.done[l.id]))) { const br = body.getBoundingClientRect(), cr = cur.getBoundingClientRect(); body.scrollTop = Math.max(0, body.scrollTop + (cr.top - br.top) - body.clientHeight / 2 + cr.height / 2); }
  }

    mount('<header class="bar"><button class="ib" ' + (B ? 'data-act="bab" data-b="' + bi + '" data-dir="back"' : 'data-act="home"') + ' aria-label="رجوع">' + IC.back + '</button><div class="bar-t"><div class="eyebrow">' + (B ? 'اجتزت امتحان الباب ' + ORD[bi] : 'أتممت ما نُشر من الكتاب') + '</div><h2 class="h-display sm">شهادتك</h2></div></header>' +
