لهرة", "ليست بنجس، إنما هي من الطوافين"], ["سؤر الكلب", "نجس"], ["سؤر الخنزير", "نجس"]], "h": "راجع: ص26 (المسألة السادسة)"}, {"t": "mcq", "d": 2, "q": "كم مرة يغسل الإناء إذا ولغ فيه الكلب؟", "o": ["سبع مرات أولاهن بالتراب", "ثلاث مرات", "مرتين", "مرة واحدة"], "h": "راجع: ص26 (المسألة السادسة)"}]}], "sum": [["في التعريف بالطهارة، وبيان أهميتها", "ص22-26"], ["الماء الذي تحصل به الطهارة", "ص22-26"], ["الماء إذا خالطته نجاسة", "ص22-26"], ["الماء إذا خالطه طاهر", "ص22-26"]]}, {"id": "l4", "title": "الباب الثاني: في الآنية", "group": "الكتاب الأول: الطهارة", "map": {"center": "الباب الثاني\nالطهارة", "nodes": [{"t": "استعمال آنية الذهب والفضة وغيرهما ", "s": []}, {"t": "حكم استعمال الإناء المضبب بالذهب و", "s": []}, {"t": "آنية الكفار", "s": []}, {"t": "الطهارة في الآنية المتخذة من جلود ", "s": []}]}, "paras": [{"t": "الباب الثاني: في الآنية، وفيه عدة مسائل", "b": [{"pic": ["book", "scroll", "open-book"], "cap": "ص27-29: الآنية: هي الأوعية، التي يحفظ فيها الماء وغيره"}, {"story": ["المسألة الأولى: استعمال آنية الذهب والفضة وغيرهما في الطهارة", ["الآنية: هي الأوعية، التي يحفظ فيها الماء وغيره، سواء كانت من الحديد، أو من غيره، والأصل فيها الإباحة؛ لقوله تعالى: ﴿هو الذي خلق لكم ما في الأرض جميعا﴾ [البقرة: 29].", "يجوز استعمال جميع الأواني في الأكل والشرب وسائر الاستعمال، إذا كانت طاهرة مباحة، ولو كانت ثمينة؛ لبقائها على الأصل وهو الإباحة، ما عدا آنية الذهب والفضة، فإنه يحرم الأكل والشرب فيهما خاصة، دون سائر الاستعمال؛ لقوله ﷺ: «لا تشربوا في آنية الذهب والفضة، ولا تأكلوا في صحافها، فإنها لهم في الدنيا ولكم في الآخرة»، وقوله ﷺ: «الذي يشرب في آنية الفضة، إنما يجرجر في بطنه نار جهنم» فهذا نص على تحريم الأكل والشرب دون سائر الاستعمال، دل على جواز استعمالها في الطهارة خاصة. والنهي عام يتناول الإناء الخالص، أو المموه بالذهب أو الفضة، أو الذي فيه شيء من الذهب والفضة."]], "ic": "book"}, {"note": "حاشية (ص27): المموه: المطلي."}, {"story": ["المسألة الثانية: حكم استعمال الإناء المضبب بالذهب والفضة", ["إن كانت الضبة من الذهب حرم استعمال الإناء مطلقا؛ لدخوله تحت عموم نص، أما إن كانت الضبة من الفضة وهي يسيرة فإنه يجوز استعمال الإناء؛ لحديث أنس قال: «انكسر قدح رسول الله ﷺ فاتخذ مكان الشعب سلسلة من فضة»."]], "ic": "scroll"}, {"note": "حاشية (ص27): التضبيب: هو وصل الإناء المكسور بالحديد ونحوه."}, {"story": ["المسألة الثالثة: آنية الكفار", ["الأصل في آنية الكفار الحل، إلا إذا علمت نجاستها، فإنه لا يجوز استعمالها إلا بعد غسلها؛ لحديث أبي ثعلبة الخشني، قال: قلت: يا رسول الله، إنا بأرض قوم أهل كتاب، أفنأكل في آنيتهم؟ قال: «لا تأكلوا فيها، إلا أن لا تجدوا غيرها، فاغسلوها، ثم كلوا فيها».", "وأما إذا لم تعلم نجاستها بأن يكون أهلها غير معروفين بمباشرة النجاسة، فإنه يجوز استعمالها؛ لأنه ثبت أن النبي ﷺ وأصحابه أخذوا الماء للوضوء من مزادة امرأة مشركة، ولأن الله سبحانه قد أباح لنا طعام أهل الكتاب، وقد يقدمونه إلينا في أوانيهم، كما دعا غلام يهودي النبي ﷺ على خبز شعير وإهالة سنخة فأكل منها."]], "ic": "book"}, {"note": "حاشية (ص28): المزادة: قربة كبيرة يزاد فيها جلد من غيرها. الإهالة: الشحم والزيت. والسنخة: المتغيرة الريح."}, {"story": ["المسألة الرابعة: الطهارة في الآنية المتخذة من جلود الميتة", ["جلد الميتة إذا دبغ طهر وجاز استعماله؛ لقوله ﷺ: «أيما إهاب دبغ فقد طهر». ولأنه ﷺ مر على شاة ميتة فقال: «هلا أخذوا إهابها فدبغوه، فانتفعوا به؟» فقالوا: إنها ميتة، قال: «فإنما حرم أكلها». وهذا فيما إذا كانت الميتة مما تحلها الذكاة وإلا فلا.", "أما شعرها فهو طاهر -أي شعر الميتة المباحة الأكل في حال الحياة- وأما اللحم فإنه نجس، ومحرم أكله؛ لقوله تعالى: ﴿إلا أن يكون ميتة أو دما مسفوحا أو لحم خنزير فإنه رجس﴾ [الأنعام: 145].", "ويحصل الدبغ بتنظيف الأذى والقذر الذي كان في الجلد، بواسطة مواد تضاف إلى الماء كالملح وغيره، أو بالنبات المعروف كالقرظ والعرعر ونحوهما.", "وأما ما لا تحله الذكاة فإنه لا يطهر، وعلى هذا فجلد الهرة وما دونها في الخلقة لا يطهر بالدبغ، ولو كان في حال الحياة طاهرا.", "وجلد ما يحرم أكله ولو كان طاهرا في الحياة فإنه لا يطهر بالدباغ.", "والخلاصة: أن كل حيوان مات، وهو من مأكول اللحم، فإن جلده يطهر بالدباغ، وكل حيوان مات، وليس من مأكول اللحم، فإن جلده لا يطهر بالدباغ."]], "ic": "scroll"}, {"note": "حاشية (ص28): الإهاب: الجلد قبل أن يدبغ."}], "q": [{"t": "mcq", "d": 1, "q": "ما الأصل في الآنية؟", "o": ["الإباحة", "التحريم", "الكراهة", "التوقف"], "h": "راجع: ص27 (الباب الثاني)"}, {"t": "mcq", "d": 2, "q": "ما الآنية التي يحرم الأكل والشرب فيها خاصة؟", "o": ["آنية الذهب والفضة", "آنية الحديد", "آنية الفخار", "آنية الزجاج"], "h": "راجع: ص27 (المسألة الأولى)"}, {"t": "tf", "d": 2, "q": "يحرم استعمال آنية الذهب والفضة في الطهارة كما يحرم الأكل والشرب فيها.", "a": false, "h": "راجع: ص27 (المسألة الأولى)", "s": "النص نهى عن الأكل والشرب، فدل على جواز استعمالها في الطهارة في هذه المسألة."}, {"t": "fill", "d": 1, "q": "قال ﷺ: «الذي يشرب في آنية الفضة، إنما ____ في بطنه نار جهنم».", "o": ["يجرجر", "يضع", "يدخل", "يشعل"], "h": "راجع: ص27 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "ما حكم الإناء المضبب بضبة من الذهب؟", "o": ["يحرم استعماله مطلقا", "يجوز", "يكره", "يجوز إن كانت الضبة يسيرة"], "h": "راجع: ص27 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "ما حكم الإناء المضبب بضبة يسيرة من الفضة؟", "o": ["يجوز استعماله", "يحرم", "نجس", "لا يجوز إلا للمرأة"], "h": "راجع: ص27 (المسألة الثانية)"}, {"t": "tf", "d": 1, "q": "الأصل في آنية الكفار الحل إلا إذا علمت نجاستها.", "a": true, "h": "راجع: ص28 (المسألة الثالثة)"}, {"t": "fill", "d": 2, "q": "أخذ النبي ﷺ وأصحابه الماء للوضوء من مزادة امرأة ____.", "o": ["مشركة", "مسلمة", "يهودية", "حائض"], "h": "راجع: ص28 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "جلد الميتة إذا دبغ:", "o": ["طهر وجاز استعماله", "بقي نجسا", "حرم لمسه", "لا يستعمل إلا في الطهارة"], "h": "راجع: ص28 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "ما حكم شعر الميتة المباحة الأكل في حال الحياة؟", "o": ["طاهر", "نجس", "مكروه", "حرام"], "h": "راجع: ص29 (المسألة الرابعة)"}, {"t": "tf", "d": 2, "q": "يطهر جلد الهرة بالدبغ.", "a": false, "h": "راجع: ص29 (المسألة الرابعة)", "s": "ما لا تحله الذكاة لا يطهر جلده بالدبغ."}, {"t": "match", "d": 2, "q": "وصل بين المادة وحكمها:", "o": [["لحم الميتة", "نجس ومحرم الأكل"], ["شعر الميتة المباحة", "طاهر"], ["جلد مأكول اللحم بعد الموت", "يطهر بالدباغ"], ["جلد غير مأكول اللحم", "لا يطهر بالدباغ"]], "h": "راجع: ص29 (المسألة الرابعة)"}]}], "sum": [["استعمال آنية الذهب والفضة وغيرهما ", "ص27-29"], ["حكم استعمال الإناء المضبب بالذهب و", "ص27-29"], ["آنية الكفار", "ص27-29"], ["الطهارة في الآنية المتخذة من جلود ", "ص27-29"]]}, {"id": "l5", "title": "الباب الثالث: في قضاء الحاجة وآدابها", "group": "الكتاب الأول: الطهارة", "map": {"center": "الباب الثالث\nالطهارة", "nodes": [{"t": "الاستنجاء والاستجمار وقيام أحدهما ", "s": []}, {"t": "استقبال القبلة واستدبارها حال قضاء", "s": []}, {"t": "ما يسن فعله لداخل الخلاء", "s": []}, {"t": "ما يحرم فعله على من أراد قضاء الحا", "s": []}, {"t": "ما يكره فعله للمتخلي", "s": []}]}, "paras": [{"t": "الباب الثالث: في قضاء الحاجة وآدابها، وفيه عدة مسائل", "b": [{"pic": ["door", "scroll", "book"], "cap": "ص29-33"}, {"story": ["المسألة الأولى: الاستنجاء والاستجمار وقيام أحدهما مقام الآخر", ["الاستنجاء: إزالة الخارج من السبيلين بالماء. والاستجمار: مسحه بطاهر مباح منق كالحجر ونحوه. ويجزئ أحدهما عن الآخر؛ لثبوت ذلك عن النبي ﷺ، فعن أنس قال: «كان النبي ﷺ يدخل الخلاء فأحمل أنا، وغلام نحوي، إداوة من ماء، وعنزة فيستنجي بالماء». وعن عائشة ﵂، عن النبي ﷺ قال: «إذا ذهب أحدكم إلى الغائط، فليستطب بثلاثة أحجار، فإنها تجزئ عنه». والجمع بينهما أفضل.", "والاستجمار يحصل بالحجارة أو ما يقوم مقامها من كل طاهر منق مباح، كمناديل الورق والخشب ونحو ذلك؛ لأن النبي ﷺ كان يستجمر بالحجارة فيلحق بها ما يماثلها في الإنقاء. ولا يجزئ في الاستجمار أقل من ثلاث مسحات؛ لحديث سلمان ﵁: «نهانا -يعني النبي ﷺ- أن نستنجي باليمين، وأن نستنجي بأقل من ثلاثة أحجار، وأن نستنجي برجيع أو عظم»."]], "ic": "book"}, {"note": "حاشية (ص29): الإداوة: إناء صغير من جلد. (ص30) الرجيع: العذرة والروث."}, {"story": ["المسألة الثانية: استقبال القبلة واستدبارها حال قضاء الحاجة", ["لا يجوز استقبال القبلة ولا استدبارها حال قضاء الحاجة في الصحراء بلا حائل؛ لحديث أبي أيوب الأنصاري ﵁: قال رسول الله ﷺ: «إذا أتيتم الغائط فلا تستقبلوا القبلة، ولا تستدبروها ولكن شرقوا أو غربوا» قال أبو أيوب: «فقدمنا الشأم فوجدنا مراحيض قد بنيت نحو الكعبة، فننحرف عنها، ونستغفر الله».", "أما إن كان في بنيان، أو كان بينه وبين القبلة شيء يستره، فلا بأس بذلك؛ لحديث ابن عمر ﵄: «أنه رأى رسول الله ﷺ يبول في بيته مستقبل الشام مستدبر الكعبة»، ولحديث مروان الأصفر قال: «أناخ ابن عمر بعيره مستقبل القبلة، ثم جلس يبول إليه، فقلت: أبا عبد الرحمن! أليس قد نهي عن هذا؟ قال: بلى إنما نهي عن ذلك في الفضاء، أما إذا كان بينك وبين القبلة شيء يستر فلا بأس»، والأفضل ترك ذلك حتى في البنيان، والله أعلم."]], "ic": "book"}, {"story": ["المسألة الثالثة: ما يسن فعله لداخل الخلاء", ["يسن لداخل الخلاء قول: «بسم الله، اللهم إني أعوذ بك من الخبث والخبائث». وعند الانتهاء والخروج: «غفرانك». وتقديم رجله اليسرى عند الدخول واليمنى عند الخروج، وأن لا يكشف عورته حتى يدنو من الأرض.", "وإذا كان في الفضاء يستحب له الإبعاد والاستتار حتى لا يرى. وأدلة ذلك كلها: حديث جابر ﵁ قال: «خرجنا مع رسول الله ﷺ في سفر وكان رسول الله ﷺ لا يأتي البراز حتى يتغيب فلا يرى».", "وحديث علي ﵁ قال: قال رسول الله ﷺ: «ستر ما بين الجن وعورات بني آدم إذا دخل الخلاء، أن يقول: بسم الله».", "وحديث أنس ﵁: كان النبي ﷺ إذا دخل الخلاء قال: «اللهم إني أعوذ بك من الخبث والخبائث». وحديث عائشة ﵂: كان ﷺ إذا خرج من الخلاء قال: «غفرانك». وحديث ابن عمر ﵄: «أن النبي ﷺ كان إذا أراد الحاجة لا يرفع ثوبه حتى يدنو من الأرض»."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: ما يحرم فعله على من أراد قضاء الحاجة", ["يحرم البول في الماء الراكد؛ لحديث جابر عن النبي ﷺ: أنه: «نهى عن البول في الماء الراكد».", "ولا يمسك ذكره بيمينه وهو يبول، ولا يستنجي بها؛ لقوله ﷺ: «إذا بال أحدكم فلا يأخذن ذكره بيمينه، ولا يستنجي بيمينه».", "ويحرم عليه البول والغائط في الطريق أو في الظل أو في الحدائق العامة أو تحت شجرة مثمرة أو موارد المياه؛ لما روى معاذ قال: قال رسول الله ﷺ: «اتقوا الملاعن الثلاث: البراز في الموارد، وقارعة الطريق، والظل»، ولحديث أبي هريرة ﵁ أن النبي ﷺ قال: «اتقوا اللاعنين» قالوا: وما اللاعنان يا رسول الله؟ قال: «الذي يتخلى في طريق الناس أو في ظلهم». كما يحرم عليه قراءة القرآن، ويحرم عليه الاستجمار بالروث والعظم أو بالطعام المحترم؛ لحديث جابر ﵁: «نهى النبي ﷺ أن يتمسح بعظم، أو ببعر». ويحرم قضاء الحاجة بين قبور المسلمين، قال النبي ﷺ: «لا أبالي أوسط القبور قضيت حاجتي، أو وسط السوق»."]], "ic": "warning"}, {"note": "حاشية (ص31): الراكد: هو الساكن الذي لا يجري."}, {"story": ["المسألة الخامسة: ما يكره فعله للمتخلي", ["يكره حال قضاء الحاجة استقبال مهب الريح بلا حائل؛ لئلا يرتد البول إليه، ويكره الكلام؛ فقد مر رجل والنبي ﷺ يبول، فسلم عليه، فلم يرد عليه.", "ويكره أن يبول في شق ونحوه؛ لحديث قتادة عن عبد الله بن سرجس: «أن النبي ﷺ نهى أن يبال في الجحر، قيل لقتادة: فما بال الجحر؟ قال: يقال: إنها مساكن الجن». ولأنه لا يأمن أن يكون فيه حيوان فيؤذيه، أو يكون مسكنا للجن فيؤذيهم.", "ويكره أن يدخل الخلاء بشيء فيه ذكر الله إلا لحاجة؛ لأن النبي ﷺ «كان إذا دخل الخلاء وضع خاتمه».", "أما عند الحاجة والضرورة فلا بأس، كالحاجة إلى الدخول بالأوراق النقدية التي فيها اسم الله؛ فإنه إن تركها خارجا كانت عرضة للسرقة أو النسيان.", "أما المصحف فإنه يحرم الدخول به سواء كان ظاهرا أو خفيا؛ لأنه كلام الله وهو أشرف الكلام، ودخول الخلاء به فيه نوع من الإهانة."]], "ic": "book"}], "q": [{"t": "mcq", "d": 1, "q": "ما الاستنجاء؟", "o": ["إزالة الخارج من السبيلين بالماء", "مسحه بالحجر", "الوضوء", "الغسل"], "h": "راجع: ص29 (المسألة الأولى)"}, {"t": "mcq", "d": 1, "q": "ما الاستجمار؟", "o": ["مسح الخارج من السبيلين بطاهر مباح منق كالحجر ونحوه", "غسله بالماء", "تركه", "التيمم"], "h": "راجع: ص29 (المسألة الأولى)"}, {"t": "tf", "d": 1, "q": "يجزئ الاستنجاء بالماء أو الاستجمار بالحجارة، والجمع بينهما أفضل.", "a": true, "h": "راجع: ص29 (المسألة الأولى)"}, {"t": "fill", "d": 2, "q": "لا يجزئ في الاستجمار أقل من ____ مسحات.", "o": ["ثلاث", "اثنتين", "أربع", "خمس"], "h": "راجع: ص30 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "ما حكم استقبال القبلة أو استدبارها حال قضاء الحاجة في الصحراء بلا حائل؟", "o": ["لا يجوز", "يجوز", "يكره فقط", "يستحب"], "h": "راجع: ص30 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "ما حكم ذلك إذا كان في بنيان أو بينه وبين القبلة شيء يستره؟", "o": ["لا بأس به، والأفضل تركه", "محرم", "واجب", "مكروه كراهة شديدة"], "h": "راجع: ص30 (المسألة الثانية)"}, {"t": "fill", "d": 1, "q": "يسن لداخل الخلاء قول: «بسم الله، اللهم إني أعوذ بك من ____ والخبائث».", "o": ["الخبث", "الشر", "الشيطان", "الجن"], "h": "راجع: ص30 (المسألة الثالثة)"}, {"t": "mcq", "d": 1, "q": "ماذا يقول عند الخروج من الخلاء؟", "o": ["غفرانك", "بسم الله", "الحمد لله", "اللهم إني أعوذ بك"], "h": "راجع: ص31 (المسألة الثالثة)"}, {"t": "order", "d": 2, "q": "رتب ما يسن في دخول الخلاء والخروج منه:", "o": ["تقديم الرجل اليسرى عند الدخول", "أن لا يكشف عورته حتى يدنو من الأرض", "قول: غفرانك عند الخروج", "تقديم الرجل اليمنى عند الخروج"], "h": "راجع: ص30 (المسألة الثالثة)"}, {"t": "tf", "d": 1, "q": "يحرم البول في الماء الراكد.", "a": true, "h": "راجع: ص31 (المسألة الرابعة)"}, {"t": "match", "d": 2, "q": "وصل بين الفعل وحكمه:", "o": [["البول في الماء الراكد", "يحرم"], ["قضاء الحاجة بين قبور المسلمين", "يحرم"], ["استقبال مهب الريح بلا حائل", "يكره"], ["الكلام حال قضاء الحاجة", "يكره"]], "h": "راجع: ص32 (المسألة الرابعة والخامسة)"}, {"t": "mcq", "d": 2, "q": "ما حكم دخول الخلاء بالمصحف؟", "o": ["يحرم سواء كان ظاهرا أو خفيا", "يكره", "يجوز", "يستحب"], "h": "راجع: ص33 (المسألة الخامسة)"}, {"t": "fill", "d": 2, "q": "قال النبي ﷺ: «اتقوا الملاعن الثلاث: البراز في ____، وقارعة الطريق، والظل».", "o": ["الموارد", "المساجد", "البيوت", "الأسواق"], "h": "راجع: ص32 (المسألة الرابعة)"}]}], "sum": [["الاستنجاء والاستجمار وقيام أحدهما ", "ص29-33"], ["استقبال القبلة واستدبارها حال قضاء", "ص29-33"], ["ما يسن فعله لداخل الخلاء", "ص29-33"], ["ما يحرم فعله على من أراد قضاء الحا", "ص29-33"]]}, {"id": "l6", "title": "الباب الرابع: في السواك وسنن الفطرة", "group": "الكتاب الأول: الطهارة", "map": {"center": "الباب الرابع\nالطهارة", "nodes": [{"t": "حكمه", "s": []}, {"t": "متى يتأكد؟", "s": []}, {"t": "بم يكون؟", "s": []}, {"t": "فوائد السواك", "s": []}, {"t": "سنن الفطرة", "s": []}]}, "paras": [{"t": "الباب الرابع: في السواك وسنن الفطرة، وفيه عدة مسائل", "b": [{"pic": ["book", "scroll", "open-book"], "cap": "ص33-37"}, {"story": ["المسألة الأولى: حكمه", ["السواك: هو استعمال عود أو نحوه في الأسنان أو اللثة؛ لإزالة ما يعلق بهما من الأطعمة والروائح.", "السواك مسنون في جميع الأوقات، حتى الصائم لو تسوك في حال صيامه فلا بأس بذلك سواء كان أول النهار أو آخره؛ لأن النبي ﷺ رغب فيه ترغيبا مطلقا، ولم يقيده بوقت دون آخر، حيث قال ﷺ: «السواك مطهرة للفم مرضاة للرب»، وقال ﷺ: «لولا أن أشق على أمتي، لأمرتهم بالسواك عند كل صلاة»."]], "ic": "book"}, {"story": ["المسألة الثانية: متى يتأكد؟", ["ويتأكد عند الوضوء، وعند الانتباه من النوم، وعند تغير رائحة الفم، وعند قراءة القرآن، وعند الصلاة. وكذا عند دخول المسجد والمنزل؛ لحديث المقدام بن شريح، عن أبيه قال: سألت عائشة، قلت: بأي شيء كان النبي ﷺ يبدأ إذا دخل بيته؟ قالت: بالسواك. ويتأكد كذلك عند طول السكوت، وصفرة الأسنان؛ للأحاديث السابقة.", "وكان رسول الله ﷺ إذا قام من الليل يشوص فاه بالسواك، والمسلم مأمور عند العبادة والتقرب إلى الله، أن يكون على أحسن حال من النظافة والطهارة."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: بم يكون؟", ["يسن أن يكون التسوك بعود رطب لا يتفتت، ولا يجرح الفم؛ فإن النبي ﷺ كان يستاك بعود أراك. وله أن يتسوك بيده اليمنى أو اليسرى، فالأمر في هذا واسع.", "فإن لم يكن عنده عود يستاك به، أجزأه التسوك بأصبعه، كما روى ذلك علي بن أبي طالب ﵁ في صفة وضوء النبي ﷺ."]], "ic": "book"}, {"story": ["المسألة الرابعة: فوائد السواك", ["ومن أهمها ما ورد في الحديث السابق: أنه مطهرة للفم في الدنيا مرضاة للرب في الآخرة. فينبغي للمسلم أن يتعاهد هذه السنة، ولا يتركها؛ لما فيها من فوائد عظيمة. وقد يمر على بعض المسلمين مدة من الوقت كالشهر والشهرين وهم لم يتسوكوا؛ إما تكاسلا وإما جهلا، وهؤلاء قد فاتهم الأجر العظيم والفوائد الكثيرة؛ بسبب تركهم هذه السنة التي كان يحافظ عليها النبي ﷺ، وكاد يأمر بها أمته أمر إيجاب، لولا خوف المشقة.", "وقد ذكروا فوائد أخرى للسواك، منها: أنه يقوي الأسنان، ويشد اللثة، وينقي الصوت، وينشط العبد."]], "ic": "scroll"}, {"story": ["المسألة الخامسة: سنن الفطرة", ["وتسمى أيضا: خصال الفطرة؛ وذلك لأن فاعلها يتصف بالفطرة التي فطر الله الناس عليها واستحبها لهم؛ ليكونوا على أحسن هيئة وأكمل صورة.", "عن أبي هريرة ﵁ قال: قال رسول الله ﷺ: «خمس من الفطرة: الاستحداد، والختان، وقص الشارب، ونتف الإبط، وتقليم الأظفار».", "1- الاستحداد: وهو حلق العانة، وهي الشعر النابت حول الفرج، سمي بذلك لاستعمال الحديدة فيه وهي الموسى. وفي إزالته جمال ونظافة، ويمكن إزالته بغير الحلق كالمزيلات المصنعة.", "2- الختان: وهو إزالة الجلدة التي تغطي الحشفة حتى تبرز الحشفة، وهذا في حق الذكر. أما الأنثى: فقطع لحمة زائدة فوق محل الإيلاج. قيل: إنها تشبه عرف الديك. والصحيح: أنه واجب في حق الرجال، سنة في حق النساء.", "والحكمة في ختان الرجل: تطهير الذكر من النجاسة المحتقنة في القلفة. وفوائده كثيرة.", "أما المرأة: فإنه يقلل من غلمتها أي: شدة شهوتها.", "ويستحب أن يكون في اليوم السابع للمولود؛ لأنه أسرع للبرء، ولينشأ صغير على أكمل حال.", "3- قص الشارب وإحفاؤه: وهو المبالغة في قصه؛ لما في ذلك من التجمل والنظافة، ومخالفة الكفار.", "وقد وردت الأحاديث الصحيحة في الحث على قصه، وإعفاء اللحية، وإرسالها وإكرامها؛ لما في بقاء اللحية من الجمال ومظهر الرجولة، وقد عكس كثير من الناس الأمر، فصاروا يوفرون شواربهم، ويحلقون لحاهم، أو يقصرونها.", "وفي كل هذا مخالفة للسنة والأوامر الواردة في وجوب إعفائها؛ منها: حديث أبي هريرة ﵁ قال: قال رسول الله ﷺ: «جزوا الشوارب، وأرخوا اللحى، خالفوا المجوس». وحديث ابن عمر ﵄ عن النبي ﷺ قال: «خالفوا المشركين: وفروا اللحى، وأحفوا الشوارب».", "فعلى المسلم أن يلتزم بهذا الهدي النبوي، ويخالف الأعداء، ويتميز عن التشبه بالنساء.", "4- تقليم الأظافر: وهو قصها بحيث لا تترك حتى تطول. والتقليم يجملها، ويزيل الأوساخ المتراكمة تحتها، وقد خالف هذه الفطرة النبوية بعض المسلمين فصاروا يطيلون أظافرهم، أو أظافر أصبع معين من أيديهم. كل ذلك من تزيين الشيطان والتقليد لأعداء الله.", "5- نتف الإبط: أي إزالة الشعر النابت فيه، فيسن إزالة هذا الشعر بالتنف أو الحلق أو غيرهما؛ لما في إزالته من النظافة وقطع الروائح الكريهة التي تتجمع مع وجود هذا الشعر، فهذا هو ديننا الحنيف، أمرنا بهذه الخصال؛ لما فيها من التجمل والتطهر والنظافة، وليكون المسلم على أحسن حال، مبتعدا عن تقليد الكفار والجهال، مفتخرا بدينه، مطيعا لربه، متبعا لسنة نبيه ﷺ.", "ويضاف إلى هذه الخصال الخمس: السواك، واستنشاق الماء، والمضمضة، وغسل البراجم -وهي العقد التي في ظهور الأصابع، يجتمع فيها الوسخ-، والاستنجاء. وذلك لحديث عائشة ﵂ قالت: قال رسول الله ﷺ: «عشر من الفطرة: قص الشارب، وإعفاء اللحية، والسواك، واستنشاق الماء، وقص الأظفار، وغسل البراجم، ونتف الإبط، وحلق العانة، وانتقاص الماء». يعني: الاستنجاء. قال مصعب بن شيبة -أحد رواة الحديث-: «ونسيت العاشرة، إلا أن تكون المضمضة»."]], "ic": "book"}, {"note": "حاشية (ص34-36): الشوص: الدلك. الأراك: شجر من الحمض يستاك بقضبانه، واسمه الكباث. الحشفة: هي رأس الذكر. القلفة: وهي الجلدة التي تغطي الحشفة، والتي تقطع في الختان. جز الشارب: القص. وإرخاء اللحية: تركها وعدم التعرض لها."}], "q": [{"t": "mcq", "d": 1, "q": "ما السواك؟", "o": ["استعمال عود أو نحوه في الأسنان أو اللثة؛ لإزالة ما يعلق بهما من الأطعمة والروائح", "غسل اليدين", "المضمضة فقط", "قص الشارب"], "h": "راجع: ص33 (المسألة الأولى)"}, {"t": "tf", "d": 2, "q": "السواك مسنون في جميع الأوقات، حتى الصائم.", "a": true, "h": "راجع: ص33 (المسألة الأولى)"}, {"t": "fill", "d": 1, "q": "قال ﷺ: «السواك ____ للفم مرضاة للرب».", "o": ["مطهرة", "منظف", "مقوي", "علامة"], "h": "راجع: ص33 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "متى يتأكد السواك؟", "o": ["عند الوضوء وعند الانتباه من النوم وعند تغير رائحة الفم وعند قراءة القرآن وعند الصلاة", "بعد الأكل فقط", "عند السفر فقط", "يوم الجمعة فقط"], "h": "راجع: ص34 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "بم كان النبي ﷺ يبدأ إذا دخل بيته؟", "o": ["بالسواك", "بالوضوء", "بالصلاة", "بالسلام"], "h": "راجع: ص34 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "بم يكون التسوك؟", "o": ["بعود رطب لا يتفتت ولا يجرح الفم", "بعود يابس فقط", "بالحجر", "لا يكون إلا بالمسواك الجديد"], "h": "راجع: ص34 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "إن لم يكن عنده عود يستاك به أجزأه:", "o": ["التسوك بأصبعه", "ترك السواك", "الغسل", "المضمضة فقط"], "h": "راجع: ص34 (المسألة الثالثة)"}, {"t": "order", "d": 2, "q": "رتب الخصال الخمس من الفطرة كما وردت في حديث أبي هريرة:", "o": ["الاستحداد", "الختان", "قص الشارب", "نتف الإبط", "تقليم الأظفار"], "h": "راجع: ص35 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "الاستحداد هو:", "o": ["حلق العانة", "قص الشارب", "نتف الإبط", "تقليم الأظفار"], "h": "راجع: ص35 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "ما حكم الختان على الصحيح؟", "o": ["واجب في حق الرجال، سنة في حق النساء", "سنة للجميع", "واجب للجميع", "مباح"], "h": "راجع: ص35 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "متى يستحب ختان المولود؟", "o": ["في اليوم السابع", "في اليوم الأول", "بعد سنة", "بعد البلوغ"], "h": "راجع: ص35 (المسألة الخامسة)"}, {"t": "fill", "d": 2, "q": "حديث عائشة: «____ من الفطرة: قص الشارب، وإعفاء اللحية، والسواك...».", "o": ["عشر", "خمس", "سبع", "ثلاث"], "h": "راجع: ص37 (المسألة الخامسة)"}, {"t": "match", "d": 2, "q": "وصل بين الخصلة وتعريفها:", "o": [["الاستحداد", "حلق العانة"], ["الختان", "إزالة الجلدة التي تغطي الحشفة"], ["تقليم الأظافر", "قصها بحيث لا تترك حتى تطول"], ["نتف الإبط", "إزالة الشعر النابت فيه"]], "h": "راجع: ص35-36 (المسألة الخامسة)"}]}], "sum": [["حكمه", "ص33-37"], ["متى يتأكد؟", "ص33-37"], ["بم يكون؟", "ص33-37"], ["فوائد السواك", "ص33-37"]]}, {"id": "l7", "title": "الباب الخامس: في الوضوء", "group": "الكتاب الأول: الطهارة", "map": {"center": "الباب الخامس\nالطهارة", "nodes": [{"t": "تعريفه، وحكمه", "s": []}, {"t": "الدليل على وجوبه، وعلى من يجب، ومت", "s": []}, {"t": "في شروطه", "s": []}, {"t": "فروضه -أي أعضاؤه-", "s": []}, {"t": "سننه", "s": []}]}, "paras": [{"t": "الباب الخامس: في الوضوء، وفيه مسائل", "b": [{"pic": ["open-book", "book", "scroll"], "cap": "ص37-44"}, {"story": ["المسألة الأولى: تعريفه، وحكمه", ["الوضوء لغة: مشتق من الوضاءة، وهي الحسن والنظافة.", "وشرعا: استعمال الماء في الأعضاء الأربعة - وهي الوجه واليدان والرأس والرجلان - على صفة مخصوصة في الشرع، على وجه التعبد لله تعالى.", "وحكمه: أنه واجب على المحدث إذا أراد الصلاة وما في حكمها، كالطواف ومس المصحف."]], "ic": "book"}, {"story": ["المسألة الثانية: الدليل على وجوبه، وعلى من يجب، ومتى يجب؟", ["أما الدليل على وجوبه: فقوله تعالى: ﴿يا أيها الذين آمنوا إذا قمتم إلى الصلاة فاغسلوا وجوهكم وأيديكم إلى المرافق وامسحوا برءوسكم وأرجلكم إلى الكعبين وإن كنتم جنبا فاطهروا وإن كنتم مرضى أو على سفر أو جاء أحد منكم من الغائط أو لامستم النساء فلم تجدوا ماء فتيمموا صعيدا طيبا فامسحوا بوجوهكم وأيديكم منه ما يريد الله ليجعل عليكم من حرج ولكن يريد ليطهركم وليتم نعمته عليكم لعلكم تشكرون﴾ [المائدة: 6].", "وقوله ﷺ: «لا يقبل الله صلاة بغير طهور، ولا صدقة من غلول». وقوله ﷺ: «لا يقبل الله صلاة من أحدث حتى يتوضأ».", "ولم ينقل عن أحد من المسلمين في ذلك خلاف؛ فثبتت بذلك مشروعية الوضوء: بالكتاب، والسنة، والإجماع.", "وأما على من يجب؟ فيجب على المسلم البالغ العاقل إذا أراد الصلاة وما في حكمها.", "وأما متى يجب؟ فإذا دخل وقت الصلاة أو أراد الإنسان الفعل الذي يشترط له الوضوء، وإن لم يكن ذلك متعلقا بوقت، كالطواف ومس المصحف."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: في شروطه", ["ويشترط لصحة الوضوء ما يأتي:", "أ) الإسلام، والعقل، والتمييز، فلا يصح من الكافر، ولا المجنون، ولا يكون معتبرا من الصغير الذي دون سن التمييز.", "ب) النية: لحديث: «إنما الأعمال بالنيات». ولا يشرع التلفظ بها؛ لعدم ثبوته عن النبي ﷺ.", "ج) الماء الطهور: لما تقدم في المياه، أما الماء النجس فلا يصح الوضوء به.", "د) إزالة ما يمنع وصول الماء إلى البشرة، من شمع أو عجين ونحوهما: كطلاء الأظافر الذي يعرف بين النساء اليوم.", "هـ) الاستجمار أو الاستنجاء عند وجود سببهما لما تقدم.", "و) الموالاة.", "ز) الترتيب. وسيأتي الكلام عليهما بعد قليل.", "ح) غسل جميع الأعضاء الواجب غسلها."]], "ic": "book"}, {"story": ["المسألة الرابعة: فروضه -أي أعضاؤه-", ["وهي ستة:", "1- غسل الوجه بكامله؛ لقوله تعالى: ﴿إذا قمتم إلى الصلاة فاغسلوا وجوهكم﴾ [المائدة: 6]، ومنه المضمضة والاستنشاق؛ لأن الفم والأنف من الوجه.", "2- غسل اليدين إلى المرفقين؛ لقوله تعالى: ﴿وأيديكم إلى المرافق﴾ [المائدة: 6].", "3- مسح الرأس كله مع الأذنين؛ لقوله تعالى: ﴿وامسحوا برءوسكم﴾ [المائدة: 6]. وقوله ﷺ: «الأذنان من الرأس». فلا يجزئ مسح بعض الرأس دون بعضه.", "4- غسل الرجلين إلى الكعبين؛ لقوله تعالى: ﴿وأرجلكم إلى الكعبين﴾ [المائدة: 6].", "5- الترتيب: لأن الله تعالى ذكره مرتبا؛ وتوضأ رسول الله ﷺ مرتبا على حسب ما ذكر الله سبحانه: الوجه، فاليدين، فالرأس، فالرجلين، كما ورد ذلك في صفة وضوئه ﷺ في حديث عبد الله بن زيد وغيره.", "6- الموالاة: بأن يكون غسل العضو الذي قبله مباشرة بدون تأخير، فقد كان النبي ﷺ يتوضأ متواليا، ولحديث خالد بن معدان: «أن النبي ﷺ رأى رجلا يصلي، وفي ظهر قدمه لمعة قدر الدرهم لم يصبها الماء، فأمره أن يعيد الوضوء»، فلو لم تكن الموالاة شرطا لأمره بغسل ما فاته، ولم يأمره بإعادة الوضوء كله.", "واللمعة: الموضع الذي لم يصبه الماء في الوضوء أو الغسل."]], "ic": "scroll"}, {"story": ["المسألة الخامسة: سننه", ["هناك أفعال يستحب فعلها عند الوضوء ويؤجر عليها من فعلها، ومن تركها فلا حرج عليه، وتسمى هذه الأفعال بسنن الوضوء، وهي:", "1- التسمية في أوله: لقوله ﷺ: «لا وضوء لمن لم يذكر اسم الله عليه».", "2- السواك: لقوله ﷺ: «لولا أن أشق على أمتي لأمرتهم بالسواك مع كل وضوء».", "3- غسل الكفين ثلاثا في أول الوضوء: لفعله ﷺ ذلك، إذ كان يغسل كفيه ثلاثا كما ورد في صفة وضوئه.", "4- المبالغة في المضمضة والاستنشاق لغير الصائم: فقد ورد في صفة وضوئه ﷺ: «فمضمض واستنثر»، ولقوله ﷺ: «وبالغ في الاستنشاق إلا أن تكون صائما».", "5- الدلك، وتخليل اللحية الكثيفة بالماء حتى يدخل الماء في داخلها: لفعله ﷺ، فإنه «كان إذا توضأ يدلك ذراعيه»، وكذلك «كان يدخل الماء تحت حنكه ويخلل به لحيته».", "6- تقديم اليمنى على اليسرى في اليدين والرجلين: لفعله ﷺ، فإنه كان يحب التيامن في تنعله وترجله وطهوره وفي شأنه كله.", "7- تثليث الغسل في الوجه واليدين والرجلين: فالواجب مرة واحدة، ويستحب ثلاثا؛ لفعله ﷺ فقد ثبت عنه: «أنه توضأ مرة مرة ومرتين مرتين وثلاثا ثلاثا».", "8- الذكر الوارد بعد الوضوء: لقوله ﷺ: «ما منكم من أحد يتوضأ فيسبغ الوضوء ثم يقول: أشهد أن لا إله إلا الله وحده لا شريك له، وأشهد أن محمدا عبده ورسوله؛ إلا فتحت له أبواب الجنة الثمانية يدخل من أيها شاء»."]], "ic": "book"}, {"story": ["المسألة السادسة: في نواقضه", ["والنواقض: هي الأشياء التي تبطل الوضوء وتفسده.", "وهي ستة:", "1- الخارج من السبيلين: أي من مخرج البول والغائط، والخارج: إما أن يكون بولا أو غائطا أو منيا أو مذيا أو ريحا أو دم استحاضة قليلا كان أو كثيرا؛ لقوله تعالى: ﴿أو جاء أحد منكم من الغائط﴾ [النساء: 43]. وقوله ﷺ: «لا يقبل الله صلاة أحدكم إذا أحدث حتى يتوضأ» وقد تقدم. وقوله: «ولكن من غائط، أو بول ونوم». وقوله ﷺ فيمن شك هل خرج منه ريح أو لا: «فلا ينصرف حتى يسمع صوتا، أو يجد ريحا».", "2- خروج النجاسة من بقية البدن: فإن كان بولا أو غائطا نقض مطلقا لدخوله في النصوص السابقة، وإن كان غيرهما كالدم والقيء: فإن فحش وكثر فالأولى أن يتوضأ منه؛ عملا بالأحوط، وإن كان يسيرا فلا يتوضأ منه بالاتفاق.", "3- زوال العقل أو تغطيته بإغماء أو نوم: لقوله ﷺ: «ولكن من غائط وبول ونوم». وقوله: «العين وكاء السه، فمن نام فليتوضأ». وأما الجنون والإغماء والسكر ونحوه فينقض إجماعا، والنوم الناقض هو المستغرق الذي لا يبقى معه إدراك على أي هيئة كان النوم، أما النوم اليسير فإنه لا ينقض الوضوء؛ لأن الصحابة كان يصيبهم النعاس وهم في انتظار الصلاة ويقومون، ويصلون، ولا يتوضئون.", "4- مس فرج الآدمي بلا حائل: لحديث بسرة بنت صفوان، أن النبي ﷺ قال: «من مس ذكره فليتوضأ». وفي حديث أبي أيوب وأم حبيبة: «من مس فرجه فليتوضأ».", "5- أكل لحم الإبل: لحديث جابر بن سمرة، أن رجلا سأل النبي ﷺ: أنتوضأ من لحوم الغنم؟ قال: «إن شئت توضأ، وإن شئت لا تتوضأ»، قال: أنتوضأ من لحوم الإبل؟ قال: «نعم توضأ من لحوم الإبل».", "6- الردة عن الإسلام: لقوله تعالى: ﴿ومن يكفر بالإيمان فقد حبط عمله﴾ [المائدة: 5]. وكل ما أوجب الغسل أوجب الوضوء غير الموت."]], "ic": "scroll"}, {"note": "حاشية (ص41-42): الوكاء: الخيط الذي يربط به الخريطة والقربة. السه: الدبر. والمعنى: أن العينين في يقظتهما بمنزلة الحبل الذي يربط به، فزوال اليقظة كزوال هذا الرباط."}, {"story": ["المسألة السابعة: ما يجب له الوضوء", ["ويجب على المكلف فعل الوضوء للأمور الآتية:", "1- الصلاة: لحديث ابن عمر مرفوعا: «لا يقبل الله صلاة بغير طهور، ولا صدقة من غلول».", "2- الطواف بالبيت الحرام فرضا كان أو نفلا: لفعله ﷺ «فإنه توضأ ثم طاف بالبيت»، ولقوله ﷺ: «الطواف بالبيت صلاة إلا أن الله أباح فيه الكلام»، ولمنعه الحائض من الطواف حتى تطهر.", "3- مس المصحف ببشرته بلا حائل: لقوله تعالى: ﴿لا يمسه إلا المطهرون﴾ [الواقعة: 79]. ولقوله ﷺ: «لا يمس القرآن إلا طاهر»."]], "ic": "book"}, {"story": ["المسألة الثامنة: ما يستحب له الوضوء", ["يستحب الوضوء ويندب في الأحوال التالية:", "1- عند ذكر الله تعالى وقراءة القرآن.", "2- عند كل صلاة: لمواظبته ﷺ على ذلك، كما في حديث أنس ﵁ قال: «كان النبي ﷺ يتوضأ عند كل صلاة».", "3- يستحب الوضوء للجنب إذا أراد أن يعود للجماع، أو أراد النوم أو الأكل أو الشرب: لحديث أبي سعيد الخدري ﵁ أن رسول الله ﷺ قال: «إذا أتى أحدكم أهله ثم أراد أن يعود، فليتوضأ». ولحديث عائشة ﵂: «أن رسول الله ﷺ كان إذا أراد أن ينام وهو جنب، توضأ وضوءه للصلاة، قبل أن ينام». وفي رواية لها: «فإذا أراد أن يأكل أو ينام».", "4- الوضوء قبل الغسل: لحديث عائشة ﵂ قالت: «كان رسول الله ﷺ إذا اغتسل من الجنابة يبدأ فيغسل يديه، ثم يفرغ بيمينه على شماله فيغسل فرجه، ثم يتوضأ وضوءه للصلاة...» الحديث.", "5- عند النوم: لحديث البراء بن عازب ﵁ قال: قال النبي ﷺ: «إذا أتيت مضجعك، فتوضأ وضوءك للصلاة، ثم اضطجع على شقك الأيمن..» الحديث."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "الوضوء لغة مشتق من:", "o": ["الوضاءة، وهي الحسن والنظافة", "الوضع", "الوضوح", "الوقاية"], "h": "راجع: ص37 (المسألة الأولى)"}, {"t": "mcq", "d": 1, "q": "الأعضاء الأربعة في الوضوء هي:", "o": ["الوجه واليدان والرأس والرجلان", "الوجه والأذنان والعنق واليدان", "اليدان والرجلان فقط", "الوجه والرأس فقط"], "h": "راجع: ص37 (المسألة الأولى)"}, {"t": "tf", "d": 1, "q": "لم ينقل عن أحد من المسلمين خلاف في مشروعية الوضوء.", "a": true, "h": "راجع: ص38 (المسألة الثانية)"}, {"t": "mcq", "d": 1, "q": "من تثبت مشروعية الوضوء؟", "o": ["بالكتاب والسنة والإجماع", "بالكتاب فقط", "بالقياس فقط", "بالعرف"], "h": "راجع: ص38 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "ما حكم التلفظ بالنية في الوضوء؟", "o": ["لا يشرع؛ لعدم ثبوته عن النبي ﷺ", "واجب", "سنة مؤكدة", "شرط"], "h": "راجع: ص38 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "أي مما يلي من شروط صحة الوضوء؟", "o": ["إزالة ما يمنع وصول الماء إلى البشرة", "التسمية", "السواك", "تثليث الغسل"], "h": "راجع: ص38 (المسألة الثالثة)"}, {"t": "order", "d": 2, "q": "رتب فروض الوضوء كما ورد في المسألة الرابعة:", "o": ["غسل الوجه", "غسل اليدين إلى المرفقين", "مسح الرأس مع الأذنين", "غسل الرجلين إلى الكعبين"], "h": "راجع: ص39 (المسألة الرابعة)"}, {"t": "fill", "d": 2, "q": "قال ﷺ: «الأذنان من ____».", "o": ["الرأس", "الوجه", "العنق", "الوضوء"], "h": "راجع: ص39 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "ما الدليل على اشتراط الموالاة؟", "o": ["أمره ﷺ من رأى في قدمه لمعة لم يصبها الماء أن يعيد الوضوء", "قوله تعالى: ﴿وأرجلكم﴾", "حديث النية", "حديث السواك"], "h": "راجع: ص39 (المسألة الرابعة)"}, {"t": "match", "d": 2, "q": "وصل بين الفعل وحكمه في الوضوء:", "o": [["التسمية", "من سنن الوضوء"], ["غسل الوجه", "من فروض الوضوء"], ["تثليث الغسل", "من سنن الوضوء"], ["الموالاة", "من فروض الوضوء"]], "h": "راجع: ص39-41 (المسألة الرابعة والخامسة)"}, {"t": "mcq", "d": 2, "q": "ما الواجب في غسل الوجه واليدين والرجلين؟", "o": ["مرة واحدة، ويستحب ثلاثا", "ثلاث مرات", "مرتان", "خمس مرات"], "h": "راجع: ص41 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "أي مما يلي ينقض الوضوء؟", "o": ["أكل لحم الإبل", "أكل لحم الغنم", "السواك", "غسل الكفين"], "h": "راجع: ص42 (المسألة السادسة)"}, {"t": "tf", "d": 2, "q": "النوم اليسير ينقض الوضوء.", "a": false, "h": "راجع: ص42 (المسألة السادسة)", "s": "النوم الناقض هو المستغرق الذي لا يبقى معه إدراك."}, {"t": "fill", "d": 2, "q": "الذي يشك هل خرج منه ريح أو لا: «فلا ينصرف حتى يسمع ____ أو يجد ريحا».", "o": ["صوتا", "شيئا", "خبرا", "أثرا"], "h": "راجع: ص41 (المسألة السادسة)"}, {"t": "mcq", "d": 2, "q": "أي مما يلي يجب له الوضوء؟", "o": ["الصلاة والطواف ومس المصحف", "قراءة القرآن", "الأكل", "النوم"], "h": "راجع: ص43 (المسألة السابعة)"}, {"t": "mcq", "d": 2, "q": "من أحوال استحباب الوضوء:", "o": ["عند كل صلاة وعند النوم وقبل الغسل", "عند الأكل دائما", "عند الخروج من البيت", "عند الكلام"], "h": "راجع: ص43-44 (المسألة الثامنة)"}]}], "sum": [["تعريفه، وحكمه", "ص37-44"], ["الدليل على وجوبه، وعلى من يجب، ومت", "ص37-44"], ["في شروطه", "ص37-44"], ["فروضه -أي أعضاؤه-", "ص37-44"]]}, {"id": "l8", "title": "الباب السادس: في المسح على الخفين والعمامة والجبيرة", "group": "الكتاب الأول: الطهارة", "map": {"center": "الباب السادس\nالطهارة", "nodes": [{"t": "تعريف الخف", "s": []}, {"t": "حكم المسح على الخفين ودليله", "s": []}, {"t": "شروط المسح على الخفين، وما يقوم مق", "s": []}, {"t": "كيفية المسح وصفته", "s": []}, {"t": "مدته", "s": []}]}, "paras": [{"t": "الباب السادس: في المسح على الخفين والعمامة والجبيرة، وفيه مسائل", "b": [{"pic": ["book", "scroll", "open-book"], "cap": "ص44-48"}, {"story": ["تعريف الخف", ["الخف: هو ما يلبس على الرجل من جلد ونحوه، وجمعه: خفاف. ويلحق بالخفين كل ما يلبس على الرجلين من صوف ونحوه."]], "ic": "book"}, {"story": ["المسألة الأولى: حكم المسح على الخفين ودليله", ["المسح على الخفين جائز باتفاق أهل السنة والجماعة. وهو رخصة من الله -عز وجل- تخفيفا منه على عباده ودفعا للحرج والمشقة عنهم. وقد دل على جوازه السنة والإجماع.", "أما السنة: فقد تواترت الأحاديث الصحيحة على ثبوته عن النبي ﷺ من فعله وأمره بذلك وترخيصه فيه.", "قال الإمام أحمد رحمه الله: ليس في قلبي من المسح شيء، فيه أربعون حديثا عن النبي ﷺ. والمراد بقوله: ليس في قلبي أدنى شك في جوازه.", "وقال الحسن البصري: حدثني سبعون من أصحاب رسول الله ﷺ أنه مسح على الخفين. ومن هذه الأحاديث: حديث جرير بن عبد الله قال: «رأيت رسول الله ﷺ بال، ثم توضأ ومسح على خفيه». قال الأعمش عن إبراهيم: كان يعجبهم هذا الحديث؛ لأن إسلام جرير كان بعد نزول المائدة -يعني آية الوضوء-.", "وقد أجمع العلماء من أهل السنة والجماعة على مشروعيته في السفر والحضر لحاجة أو غيرها.", "وكذلك يجوز المسح على الجوارب، وهي ما يلبس على الرجل من غير الجلد كالخرق ونحوها، وهو ما يسمى الآن بالشراب؛ لأنهما كالخف في حاجة الرجل إليهما، والعلة فيهما واحدة، وقد انتشر لبسها أكثر من الخف، فيجوز المسح عليها إذا كانت ساترة."]], "ic": "scroll"}, {"story": ["المسألة الثانية: شروط المسح على الخفين، وما يقوم مقامهما", ["وهذه الشروط هي:", "1- لبسهما على طهارة: لما روى المغيرة قال: كنت مع النبي ﷺ في سفر، فأهويت لأنزع خفيه، فقال: «دعهما، فإني أدخلتهما طاهرتين». فمسح عليهما.", "2- سترهما لمحل الفرض: أي: المفروض غسله من الرجل، فلو ظهر من محل الفرض شيء، لم يصح المسح.", "3- إباحتهما: فلا يجوز المسح على المغصوب، والمسروق، ولا الحرير لرجل؛ لأن لبسه معصية، فلا تستباح به الرخصة.", "4- طهارة عينيهما: فلا يصح المسح على النجس، كالمتخذ من جلد حمار.", "5- أن يكون المسح في المدة المحددة شرعا: وهي للمقيم يوم وليلة، وللمسافر ثلاثة أيام بلياليهن.", "هذه شروط خمسة استنبطها أهل العلم لصحة المسح على الخفين من النصوص النبوية والقواعد العامة، لابد من مراعاتها عند إرادة المسح."]], "ic": "book"}, {"story": ["المسألة الثالثة: كيفية المسح وصفته", ["المحل المشروع مسحه ظاهر الخف، والواجب في ذلك ما يطلق عليه اسم المسح. وكيفية المسح: أن يمسح أكثر أعلى الخف؛ لحديث المغيرة بن شعبة الذي بين فيه وصف مسح رسول الله ﷺ على خفيه في الوضوء، فقال: «رأيت النبي ﷺ يمسح على الخفين على ظاهرهما».", "ولا يجزئ مسح أسفله وعقبه ولا يسن؛ لقول علي ﵁: لو كان الدين بالرأي لكان أسفل الخف أولى بالمسح من أعلاه، وقد «رأيت النبي ﷺ يمسح على ظاهر خفيه». ولو جمع بين الأعلى والأسفل صح مع الكراهة."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: مدته", ["ومدة المسح على الخفين، بالنسبة للمقيم ومن سفره لا يبيح له القصر: يوم وليلة، وبالنسبة للمسافر سفرا يبيح له القصر: ثلاثة أيام بلياليها؛ لحديث علي ﵁ قال: «جعل رسول الله ﷺ ثلاثة أيام ولياليهن للمسافر، ويوما وليلة للمقيم»."]], "ic": "book"}, {"story": ["المسألة الخامسة: مبطلاته", ["ويبطل المسح بما يأتي:", "1- إذا حصل ما يوجب الغسل بطل المسح، لحديث صفوان بن عسال، قال: «كان النبي ﷺ يأمرنا إذا كنا سفرا، ألا ننزع خفافنا ثلاثة أيام ولياليهن، إلا من جنابة».", "2- إذا ظهر بعض محل الفرض، أي: ظهور بعض القدم، بطل المسح.", "3- نزع الخفين يبطل المسح، ونزع أحد الخفين كنزعهما في قول أكثر أهل العلم.", "4- انقضاء مدة المسح مبطل له؛ لأن المسح مؤقت بزمن معين من قبل الشارع، فلا تجوز الزيادة على المدة المقررة لمفهوم أحاديث التوقيت."]], "ic": "scroll"}, {"story": ["المسألة السادسة: ابتداء مدة المسح", ["وتبتدئ مدة المسح من الحدث بعد اللبس، كمن توضأ لصلاة الفجر، ولبس الخفين، وبعد طلوع الشمس أحدث، ولم يتوضأ، ثم توضأ قبل صلاة الظهر، فابتداء المدة من طلوع الشمس وقت الحدث. وقال بعض العلماء: ابتداؤها من حيث توضأ قبل صلاة الظهر، أي: من المسح بعد الحدث."]], "ic": "book"}, {"story": ["المسألة السابعة: المسح على الجبيرة والعمامة وخمر النساء", ["الجبيرة: هي أعواد ونحوها كالجبس مما يربط على الكسر ليجبر ويلتئم، ويمسح عليها. وكذلك يمسح على اللصوق واللفائف التي توضع على الجروح، فكل هذه الأشياء يمسح عليها بشرط أن تكون على قدر الحاجة، فإن تجاوزت قدر الحاجة لزمه نزع ما زاد على الحاجة.", "ويجوز المسح عليها في الحدث الأكبر والأصغر، وليس للمسح عليها وقت محدد بل يمسح عليها إلى نزعها أو شفاء ما تحتها. والدليل على ذلك: أن المسح على الجبيرة ضرورة والضرورة تقدر بقدرها ولا فرق فيها بين الحدثين.", "وكذلك يجوز المسح على العمامة، وهي ما يعمم به الرأس، ويكور عليه، والدليل على ذلك: حديث المغيرة بن شعبة «أن النبي ﷺ مسح على عمامته وعلى الناصية والخفين». وحديث: «أنه ﷺ مسح على الخفين والخمار». يعني العمامة.", "والمسح عليها ليس له وقت محدد، ولكن لو سلك سبيل الاحتياط فلم يمسحها إلا إذا لبسها على طهارة وفي المدة المحددة للمسح على الخفين لكان حسنا.", "أما خمار المرأة وهو ما تغطي به رأسها، فالأولى ألا تمسح عليه، إلا إذا كان هناك مشقة في نزعه، أو لمرض في الرأس أو نحو ذلك. ولو كان الرأس ملبدا بحناء أو غيره فيجوز المسح عليه؛ لفعل النبي ﷺ. وعموما طهارة الرأس فيها شيء من التسهيل والتيسير على هذه الأمة."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "الخف هو:", "o": ["ما يلبس على الرجل من جلد ونحوه", "ما يلبس على الرأس", "ما يلبس على اليد", "ما يلبس على الكتف"], "h": "راجع: ص44 (تعريف الخف)"}, {"t": "mcq", "d": 1, "q": "المسح على الخفين جائز باتفاق:", "o": ["أهل السنة والجماعة", "الحنابلة فقط", "المالكية فقط", "لا خلاف في منعه"], "h": "راجع: ص44 (المسألة الأولى)"}, {"t": "tf", "d": 1, "q": "المسح على الخفين رخصة من الله تخفيفا على عباده.", "a": true, "h": "راجع: ص44 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "كم حديثا ذكر الإمام أحمد في المسح على الخفين؟", "o": ["أربعين حديثا", "عشرة أحاديث", "حديثا واحدا", "مائة حديث"], "h": "راجع: ص44 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "يجوز المسح على الجوارب إذا كانت:", "o": ["ساترة", "شفافة", "قصيرة", "جديدة فقط"], "h": "راجع: ص45 (المسألة الأولى)"}, {"t": "order", "d": 2, "q": "رتب شروط المسح على الخفين الأولى:", "o": ["لبسهما على طهارة", "ستر محل الفرض", "إباحتهما", "طهارة عينيهما", "أن يكون في المدة المحددة"], "h": "راجع: ص45 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "ماذا قال النبي ﷺ للمغيرة حين أهوى لينزع خفيه؟", "o": ["دعهما فإني أدخلتهما طاهرتين", "انزعهما", "اغسل رجليك", "امسح عليهما بعد الصلاة"], "h": "راجع: ص45 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "المحل المشروع مسحه من الخف هو:", "o": ["ظاهره", "أسفله", "عقبه", "باطنه"], "h": "راجع: ص46 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "مدة المسح للمقيم:", "o": ["يوم وليلة", "ثلاثة أيام", "يومان", "أسبوع"], "h": "راجع: ص46 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "مدة المسح للمسافر سفرا ي اء الله.", "3- موجباته: ويجب الغسل للأسباب الآتية:", "1- خروج المني من مخرجه: ويشترط أن يكون دفقا بلذة من ذكر أو أنثى؛ لقوله تعالى: ﴿وإن كنتم جنبا فاطهروا﴾ [المائدة: 6]، ولقوله ﷺ لعلي: «إذا فضخت الماء فاغتسل». ما لم يكن نائما ونحوه فلا تشترط اللذة؛ لأن النائم قد لا يحس به، ولقوله ﷺ لما سئل: هل على المرأة غسل إذا احتلمت؟ قال: «نعم إذا رأت الماء». وهذا كله مجمع عليه.", "2- تغييب حشفة الذكر كلها، أو قدرها في الفرج، وإن لم يحصل إنزال بلا حائل؛ لقوله ﷺ: «إذا جلس بين شعبها الأربع، ومس الختان الختان؛ وجب الغسل». لكن لا يجب الغسل في هذه الحالة، إلا على ابن عشر، أو بنت تسع فما فوق.", "3- إسلام الكافر، ولو مرتدا: «لأن النبي ﷺ أمر قيس بن عاصم، حين أسلم أن يغتسل».", "4- انقطاع دم الحيض والنفاس: لحديث عائشة أن النبي ﷺ قال لفاطمة بنت أبي حبيش: «إذا أقبلت الحيضة فدعي الصلاة، وإذا أدبرت فاغتسلي وصلي». والنفاس كالحيض بالإجماع.", "5- الموت: لقوله ﷺ في حديث غسل ابنته زينب، حين توفيت: «اغسلنها». وقال في المحرم: «اغسلوه بماء وسدر». وذلك تعبدا؛ لأنه لو كان عن حدث لم يرتفع مع بقاء سببه."]], "ic": "book"}, {"note": "حاشية (ص49): فضخ الماء: أي دفقه، والمراد المني."}, {"story": ["المسألة الثانية: في صفة الغسل وكيفيته", ["للغسل من الجنابة كيفيتان: كيفية استحباب، وكيفية إجزاء.", "أما كيفية الاستحباب: فهي أن يغسل يديه، ثم يغسل فرجه، وما أصابه من الأذى، ثم يتوضأ وضوءه للصلاة، ثم يأخذ بيده ماء فيخلل به شعر رأسه، مدخلا أصابعه في أصول الشعر حتى يروي بشرته، ثم يحثو على رأسه ثلاث حثيات، ثم يفيض الماء على سائر بدنه؛ لحديث عائشة المتفق عليه.", "وأما كيفية الإجزاء: أن يعم بدنه بالماء ابتداء مع النية لحديث ميمونة: «وضع رسول الله ﷺ وضوء الجنابة، فأفرغ على يديه فغسلهما مرتين أو ثلاثا، ثم تمضمض، واستنشق، وغسل وجهه وذراعيه، ثم أفاض الماء على رأسه، ثم غسل جسده، فأتيته بالمنديل فلم يردها، وجعل ينفض الماء بيديه».", "ومثله حديث عائشة وفيه: «ثم يخلل شعره بيده، حتى إذا ظن أنه قد روى بشرته، أفاض عليه الماء ثلاث مرات، ثم غسل سائر جسده». ولا يجب على المرأة نقض شعرها في الغسل من الجنابة، ويلزمها ذلك في الغسل من الحيض؛ لحديث أم سلمة قالت: قلت: يا رسول الله إني امرأة أشد ضفر رأسي، أفأنقضه لغسل الجنابة؟ قال: «لا، إنما يكفيك أن تحثي على رأسك ثلاث حثيات ثم تفيضين عليك الماء فتطهرين»."]], "ic": "scroll"}, {"note": "حاشية (ص50): وكيفية الإجزاء: هي التي تشتمل على: ما يجب فقط، وكيفية الاستحباب والكمال: هي التي تشتمل على: الواجب والمسنون."}, {"story": ["المسألة الثالثة: الأغسال المستحبة", ["تقدم بيان الأغسال الواجبة، وأما الأغسال المسنونة والمستحبة، فهي:", "1- الاغتسال عند كل جماع: لحديث أبي رافع: أن النبي ﷺ كان ذات ليلة يغتسل عند هذه وعند هذه قال: فقلت: يا رسول الله ألا تجعله واحدا؟ قال: «هذا أزكى وأطيب وأطهر».", "2- الغسل للجمعة: لقوله ﷺ: «إذا جاء أحدكم الجمعة، فليغتسل». وهو آكد الأغسال المستحبة.", "3- الاغتسال للعيدين.", "4- الاغتسال عند الإحرام بالعمرة والحج: فإنه ﷺ اغتسل لإحرامه.", "5- الغسل من غسل الميت: لقوله ﷺ: «من غسل ميتا، فليغتسل»."]], "ic": "book"}, {"story": ["المسألة الرابعة: الأحكام المترتبة على من وجب عليه الغسل", ["الأحكام المترتبة على ذلك يمكن إجمالها في ما يأتي:", "1- لا يجوز له المكث في المسجد إلا عابر سبيل لقوله تعالى: ﴿ولا جنبا إلا عابري سبيل حتى تغتسلوا﴾ [النساء: 43]، فإذا توضأ جاز له المكث في المسجد، لثبوت ذلك عن جماعة من الصحابة على عهد النبي ﷺ، ولأن الوضوء يخفف حدث، والوضوء أحد الطهورين.", "2- لا يجوز له مس المصحف؛ لقوله تعالى: ﴿لا يمسه إلا المطهرون﴾ [الواقعة: 79]. وقوله ﷺ: «لا يمس المصحف إلا طاهر».", "3- لا يجوز له قراءة القرآن. فلا يقرأ الجنب شيئا من القرآن حتى يغتسل لحديث علي قال: «كان عليه الصلاة والسلام لا يمنعه من قراءة القرآن شيء إلا الجنابة»، ولأن في منعه من القراءة حثا له على المبادرة إلى الاغتسال، وإزالة المانع له من القراءة.", "ويحرم عليه أيضا:", "4- الصلاة. 5- والطواف بالبيت.", "كما سبق بيان ذلك عند الكلام على مسألة: «ما يجب له الوضوء». من الباب الخامس."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "الغسل شرعا هو:", "o": ["تعميم البدن بالماء، أو استعمال ماء طهور في جميع البدن على صفة مخصوصة تعبدا لله", "غسل اليدين فقط", "غسل الرأس فقط", "مسح البدن"], "h": "راجع: ص48 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "يشترط في خروج المني الموجب للغسل أن يكون:", "o": ["دفقا بلذة", "بغير لذة دائما", "قليلا", "في اليقظة فقط"], "h": "راجع: ص48 (المسألة ", "العيد", "السفر", "المسجد"], "h": "راجع: ص51 (المسألة الثالثة)"}]}], "sum": [["معنى الغسل، وحكمه، ودليله", "ص48-52"], ["في صفة الغسل وكيفيته", "ص48-52"], ["الأغسال المستحبة", "ص48-52"], ["الأحكام المترتبة على من وجب عليه ا", "ص48-52"]]}, {"id": "l10", "title": "الباب الثامن: في التيمم", "group": "الكتاب الأول: الطهارة", "map": {"center": "الباب الثامن\nالطهارة", "nodes": [{"t": "تعريف التيمم", "s": []}, {"t": "حكم التيمم ودليل مشروعيته", "s": []}, {"t": "شروط التيمم، والأسباب المبيحة له", "s": []}, {"t": "مبطلات التيمم", "s": []}, {"t": "صفة التيمم", "s": []}]}, "paras": [{"t": "الباب الثامن: في التيمم، وفيه مسائل", "b": [{"pic": ["scroll", "book", "open-book"], "cap": "ص52-55"}, {"story": ["تعريف التيمم", ["التيمم لغة: القصد. وشرعا: هو مسح الوجه واليدين بالصعيد الطيب، على وجه مخصوص؛ تعبدا لله تعالى."]], "ic": "book"}, {"story": ["المسألة الأولى: حكم التيمم ودليل مشروعيته", ["التيمم مشروع، وهو رخصة من الله عز وجل لعباده، وهو من محاسن هذه الشريعة، ومن خصائص هذه الأمة، لقوله تعالى: ﴿يا أيها الذين آمنوا إذا قمتم إلى الصلاة فاغسلوا وجوهكم وأيديكم إلى المرافق وامسحوا برءوسكم وأرجلكم إلى الكعبين وإن كنتم جنبا فاطهروا وإن كنتم مرضى أو على سفر أو جاء أحد منكم من الغائط أو لامستم النساء فلم تجدوا ماء فتيمموا صعيدا طيبا فامسحوا بوجوهكم وأيديكم منه ما يريد الله ليجعل عليكم من حرج ولكن يريد ليطهركم وليتم نعمته عليكم لعلكم تشكرون﴾ [المائدة: 6].", "ولقوله ﷺ: «الصعيد الطيب كافيك وإن لم تجد الماء عشر حجج، فإذا وجدت الماء فأمسه بشرتك». ولقوله ﷺ: «جعلت لي الأرض مسجدا وطهورا».", "وقد أجمع أهل العلم على مشروعية التيمم إذا توافرت شرائطه، وأنه قائم مقام الطهارة بالماء، فيباح به ما يباح بالتطهر بالماء من الصلاة والطواف وقراءة القرآن وغير ذلك. وبذلك ثبتت مشروعية التيمم بالكتاب والسنة والإجماع."]], "ic": "scroll"}, {"story": ["المسألة الثانية: شروط التيمم، والأسباب المبيحة له", ["يباح التيمم عند العجز عن استعمال الماء: إما لفقده، أو لخوف الضرر من استعماله لمرض في الجسم أو شدة برد؛ لحديث عمران بن حصين: «عليك بالصعيد الطيب فإنه يكفيك». وسيأتي مزيد بسط لذلك بعد قليل. ويصح التيمم بالشروط الآتية:", "1- النية: وهي نية استباحة الصلاة، والنية شرط في جميع العبادات، والتيمم عبادة.", "2- الإسلام: فلا يصح من الكافر؛ لأنه عبادة.", "3- العقل: فلا يصح من غير العاقل، كالمجنون والمغمى عليه.", "4- التمييز: فلا يصح من غير المميز، وهو من كان دون السابعة.", "5- تعذر استعمال الماء: إما لعدمه؛ لقوله تعالى: ﴿فلم تجدوا ماء فتيمموا صعيدا طيبا﴾ [المائدة: 6]، وقوله ﷺ: «إن الصعيد الطيب طهور المسلم، وإن لم يجد الماء عشر سنين. فإذا وجد الماء فليمسه بشرته، فإن ذلك خير». أو لخوفه ضرر باستعماله، إما لمرض يخشى زيادته أو تأخر شفائه باستعمال الماء؛ لقوله تعالى: ﴿وإن كنتم مرضى﴾، ولحديث صاحب الشجة، وفيه قوله ﷺ: «قتلوه قتلهم الله، هلا سألوا إذ لم يعلموا إنما شفاء العي السؤال». أو لشدة برد يخشى معه الضرر، أو الهلاك، باستعمال الماء؛ لحديث عمرو بن العاص أنه لما بعث في غزوة ذات السلاسل قال: «احتلمت في ليلة باردة شديدة البرد، فأشفقت إن اغتسلت أن أهلك، فتيممت، وصليت بأصحابي صلاة الصبح».", "6- أن يكون التيمم بتراب طهور غير نجس -كالتراب الذي أصابته بول ولم يطهر منه- له غبار يعلق باليد إن وجده؛ لقوله تعالى: ﴿فتيمموا صعيدا طيبا فامسحوا بوجوهكم وأيديكم منه﴾ [المائدة: 6]. قال ابن عباس: «الصعيد: تراب الحرث، والطيب: الطاهر»، فإن لم يجد ترابا تيمم بما يقدر عليه من رمل أو حجر؛ لقوله تعالى: ﴿فاتقوا الله ما استطعتم﴾ [التغابن: 16]. قال الأوزاعي: الرمل من الصعيد."]], "ic": "book"}, {"story": ["المسألة الثالثة: مبطلات التيمم", ["وهي الأشياء التي تفسده، ومبطلاته ثلاثة:", "1- يبطل التيمم عن حدث أصغر بمبطلات الوضوء، وعن حدث أكبر بموجبات الغسل من جنابة وحيض ونفاس، فإذا تيمم عن حدث أصغر، ثم بال أو تغوط، بطل تيممه؛ لأن التيمم بدل عن الوضوء، والبدل له حكم المبدل، وكذا التيمم عن الحدث الأكبر.", "2- وجود الماء: إن كان التيمم لعدمه؛ لقوله ﷺ: «فإذا وجدت الماء فأمسه بشرتك» وقد تقدم.", "3- زوال العذر الذي من أجله شرع التيمم من مرض ونحوه."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: صفة التيمم", ["وكيفيته: أن ينوي، ثم يسمي، ويضرب الأرض بيديه ضربة واحدة، ثم ينفخهما -أو ينفضهما-، ثم يمسح بهما وجهه ويديه إلى الرسغين؛ لحديث عمار، وفيه: التيمم ضربة للوجه والكفين، وحديث عمار، أن النبي ﷺ قال له: «إنما كان يكفيك أن تصنع هكذا»، فضرب بكفه ضربة على الأرض، ثم نفضها، ثم مسح بها ظهر كفه بشماله، أو ظهر شماله بكفه، ثم مسح بهما وجهه."]], "ic": "book"}], "q": [{"t": "mcq", "d": 1, "q": "التيمم لغة:", "o": ["القصد", "المسح", "الغسل", "الطهارة"], "h": "راجع: ص52 (تعريف التيمم)"}, {"t": "mcq", "d": 1, "q": "التيمم شرعا هو:", "o": ["مسح الوجه واليدين بالصعيد الطيب على وجه مخصوص تعبدا لله", "غسل اليدين بالتراب", "مسح الرأس بالتراب", "غسل الوجه بالماء"], "h": "راجع: ص52 (تعريف التيمم)"}, {"t": "tf", "d": 1, "q": "التيمم رخصة من الله ومن خصائص هذه الأمة.", "a": true, "h": "راجع: ص52 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «جعلت لي الأرض ____ وطهورا».", "o": ["مسجدا", "بساطا", "مصلى", "فراشا"], "h": "راجع: ص53 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "تثبت مشروعية التيمم:", "o": ["بالكتاب والسنة والإجماع", "بالكتاب فقط", "بالقياس فقط", "بالإجماع فقط"], "h": "راجع: ص53 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "يباح التيمم عند العجز عن استعمال الماء بسبب:", "o": ["فقده أو خوف الضرر من استعماله لمرض أو شدة برد", "الكسل", "السفر فقط", "ضيق الوقت دائما"], "h": "راجع: ص53 (المسألة الثانية)"}, {"t": "order", "d": 2, "q": "رتب شروط التيمم كما وردت:", "o": ["النية", "الإسلام", "العقل", "التمييز", "تعذر استعمال الماء", "التراب الطهور"], "h": "راجع: ص53-54 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "لا يصح التيمم من غير المميز، وهو:", "o": ["من كان دون السابعة", "من كان دون العاشرة", "من كان دون البلوغ", "من كان دون الثلاثين"], "h": "راجع: ص53 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "ماذا قال ابن عباس في الصعيد؟", "o": ["الصعيد: تراب الحرث، والطيب: الطاهر", "الصعيد: الماء", "الصعيد: الحجر فقط", "الصعيد: الرمل فقط"], "h": "راجع: ص54 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "ما قصة عمرو بن العاص في غزوة ذات السلاسل؟", "o": ["احتلم في ليلة شديدة البرد فتيمم وصلى بأصحابه", "فقد الماء في الصحراء", "كان مريضا", "نسي الوضوء"], "h": "راجع: ص54 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "مبطلات التيمم ثلاثة، منها:", "o": ["وجود الماء إن كان التيمم لعدمه", "النوم دائما", "الكلام", "الأكل"], "h": "راجع: ص54 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "يبطل التيمم عن حدث أصغر بمبطلات الوضوء.", "a": true, "h": "راجع: ص54 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "كيفية التيمم: أن ينوي، ثم يسمي، ويضرب الأرض بيديه:", "o": ["ضربة واحدة", "ثلاث ضربات", "ضربتين دائما", "سبع ضربات"], "h": "راجع: ص54 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "بعد الضرب ينفخ يديه أو ينفضهما ثم يمسح بهما:", "o": ["وجهه ويديه إلى الرسغين", "رأسه ورجليه", "وجهه فقط", "ذراعيه إلى المرفقين"], "h": "راجع: ص55 (المسألة الرابعة)"}]}], "sum": [["تعريف التيمم", "ص52-55"], ["حكم التيمم ودليل مشروعيته", "ص52-55"], ["شروط التيمم، والأسباب المبيحة له", "ص52-55"], ["مبطلات التيمم", "ص52-55"]]}, {"id": "l11", "title": "الباب التاسع: في النجاسات وكيفية تطهيرها", "group": "الكتاب الأول: الطهارة", "map": {"center": "الباب التاسع\nالطهارة", "nodes": [{"t": "تعريف النجاسة، ونوعاها", "s": []}, {"t": "الأشياء التي قام الدليل على نجاسته", "s": []}, {"t": "كيفية تطهير النجاسة", "s": []}]}, "paras": [{"t": "الباب التاسع: في النجاسات وكيفية تطهيرها، وفيه مسائل", "b": [{"pic": ["book", "scroll", "open-book"], "cap": "ص55-58"}, {"story": ["المسألة الأولى: تعريف النجاسة، ونوعاها", ["النجاسة: هي كل عين مستقذرة أمر الشارع باجتنابها.", "وهي نوعان:", "1- نجاسة عينية أو حقيقية: وهي التي لا تطهر بحال؛ لأن عينها نجسة، كروث الحمار، والدم، والبول.", "2- نجاسة حكمية: وهي أمر اعتباري يقوم بالأعضاء، ويمنع من صحة صلاة، ويشمل الحدث الأصغر الذي يزول بالوضوء كالغائط، والحدث الأكبر الذي يزول بالغسل كالجنابة.", "والأصل الذي تزال به النجاسة هو الماء، فهو الأصل في التطهير؛ لقوله تعالى: ﴿وينزل عليكم من السماء ماء ليطهركم به﴾ [الأنفال: 11].", "وهي على ثلاثة أقسام:", "نجاسة مغلظة: وهي نجاسة الكلب، وما تولد منه.", "نجاسة مخففة: وهي نجاسة بول الغلام الذي لم يأكل الطعام.", "نجاسة متوسطة: وهي بقية النجاسات. كالبول، والغائط، والميتة."]], "ic": "book"}, {"story": ["المسألة الثانية: الأشياء التي قام الدليل على نجاستها", ["1- بول الآدمي وعذرته وقيؤه: إلا بول الصبي الذي لم يأكل الطعام، فيكتفى برشه؛ لحديث أم قيس بنت محصن: «أنها أتت بابن لها صغير، لم يأكل الطعام، إلى رسول الله ﷺ، فأجلسه في حجره، فبال على ثوبه، فدعا بماء، فنضحه ولم يغسله». أما بول الغلام الذي يأكل الطعام، وكذا بول الجارية، فإنه يغسل كبول الكبير.", "2- الدم المسفوح من الحيوان المأكول، أما الدم الذي يبقى في اللحم والعروق، فإنه طاهر؛ لقوله تعالى: ﴿أو دما مسفوحا﴾ [الأنعام: 145]، وهو الذي يهراق وينصب.", "3- بول وروث كل حيوان غير مأكول اللحم، كالهر، والفأر.", "4- الميتة: وهي ما مات حتف أنفه من غير ذكاة شرعية؛ لقوله تعالى: ﴿إلا أن يكون ميتة﴾ [الأنعام: 145]. ويستثنى من ذلك ميتة السمك، والجراد، وما لا نفس له سائلة، فإنها طاهرة.", "5- المذي: وهو ماء أبيض رقيق لزج، يخرج عند الملاعبة أو تذكر الجماع، لا بشهوة ولا دفق، ولا يعقبه فتور، وربما لا يحس بخروجه، وهو نجس؛ لقوله ﷺ في حديث علي بن أبي طالب ﵁: «توضأ واغسل ذكرك». يعني من المذي، ولم يؤمر فيه بالغسل تخفيفا ورفعا للحرج؛ لأنه مما يشق الاحتراز منه.", "6- الودي: وهو ماء أبيض ثخين يخرج بعد البول، ومن أصابه فإنه يغسل ذكره ويتوضأ، ولا يغتسل.", "7- دم الحيض: كما في حديث أسماء بنت أبي بكر ﵄ قالت: جاءت امرأة إلى النبي ﷺ فقالت: إحدانا يصيب ثوبها من دم الحيضة، كيف تصنع؟ فقال: «تحته، ثم تقرصه بالماء، ثم تنضحه، ثم تصلي فيه»."]], "ic": "scroll"}, {"note": "حاشية (ص56-57): تحته: تحكه بطرف حجر أو عود، وتقرصه: تدلكه بأطراف الأصابع والأظفار دلكا شديدا وتصب عليه الماء حتى يزول عينه وأثره."}, {"story": ["المسألة الثالثة: كيفية تطهير النجاسة", ["1- إذا كانت النجاسة في الأرض والمكان: فهذه يكفي في تطهيرها غسلة واحدة، تذهب بعين النجاسة، فيصب عليها الماء مرة واحدة؛ لأمره ﷺ بصب ماء على بول الأعرابي الذي بال في المسجد.", "2- إذا كانت النجاسة على غير الأرض: كأن تكون في الثوب أو في الإناء. فإن كانت من كلب ولغ في الإناء، فلابد من غسله سبع غسلات إحداهن بالتراب؛ لقوله ﷺ: «إذا ولغ الكلب في إناء أحدكم فليغسله سبعا، أولاهن بالتراب». وهذا الحكم عام في الإناء وغيره، كالثياب، والفرش.", "أما نجاسة الخنزير: فالصحيح أنها كسائر النجاسات يكفي غسلها مرة واحدة، تذهب بعين النجاسة، ولا يشترط غسلها سبع مرات.", "وإن كانت النجاسة من البول والغائط والدم ونحوها: فإنها تغسل بالماء مع فركها والعصر حتى تذهب وتزول، ولا يبقى لها أثر، ويكفي في غسلها مرة واحدة.", "ويكفي في تطهير بول الغلام الذي لم يأكل الطعام النضح، وهو رشه بالماء؛ لقوله ﷺ: «يغسل من بول الجارية، وينضح من بول الغلام»، ولحديث أم قيس بنت محصن المتقدم.", "أما جلد الميتة مأكولة اللحم: فإنه يطهر بالدباغ؛ لقوله ﷺ: «أيما إهاب دبغ فقد طهر».", "ودم الحيض تغسله المرأة من ثوبها بالماء، ثم تنضحه، ثم تصلي فيه.", "فعلى المسلم أن يهتم بالطهارة من النجاسات في بدنه ومكانه وثوبه الذي يصلي فيه؛ لأنها شرط لصحة الصلاة."]], "ic": "book"}], "q": [{"t": "mcq", "d": 1, "q": "النجاسة هي:", "o": ["كل عين مستقذرة أمر الشارع باجتنابها", "كل ما له رائحة", "كل سائل", "كل ما يخرج من الإنسان"], "h": "راجع: ص55 (المسألة الأولى)"}, {"t": "mcq", "d": 1, "q": "النجاسة نوعان:", "o": ["عينية أو حقيقية، وحكمية", "كبرى وصغرى", "ظاهرة وباطنة", "قليلة وكثيرة"], "h": "راجع: ص55 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "الأصل الذي تزال به النجاسة:", "o": ["الماء", "التراب", "الهواء", "الشمس"], "h": "راجع: ص55 (المسألة الأولى)"}, {"t": "match", "d": 2, "q": "وصل بين نوع النجاسة وما يندرج تحتها:", "o": [["مغلظة", "نجاسة الكلب وما تولد منه"], ["مخففة", "بول الغلام الذي لم يأكل الطعام"], ["متوسطة", "بقية النجاسات كالبول والغائط والميتة"]], "h": "راجع: ص55 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "ما حكم بول الصبي الذي لم يأكل الطعام؟", "o": ["يكتفى برشه", "يغسل سبع مرات", "طاهر لا شيء فيه", "يغسل بالتراب"], "h": "راجع: ص56 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "الدم النجس هو:", "o": ["الدم المسفوح", "الدم الذي يبقى في اللحم والعروق", "كل دم", "لا دم نجس"], "h": "راجع: ص56 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "أي مما يلي طاهر من الميتة؟", "o": ["ميتة السمك والجراد", "ميتة الغنم", "ميتة البقر", "ميتة الدجاج"], "h": "راجع: ص56 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "المذي: ماذا قال النبي ﷺ لعلي فيه؟", "o": ["توضأ واغسل ذكرك", "اغتسل", "لا شيء عليك", "أعد الصلاة"], "h": "راجع: ص56 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "من أصابه الودي فإنه:", "o": ["يغسل ذكره ويتوضأ ولا يغتسل", "يغتسل", "لا شيء عليه", "يتيمم"], "h": "راجع: ص56 (المسألة الثانية)"}, {"t": "order", "d": 2, "q": "رتب ما أمر به النبي ﷺ في دم الحيض يصيب الثوب:", "o": ["تحته", "تقرصه بالماء", "تنضحه", "تصلي فيه"], "h": "راجع: ص56-57 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "كيف تطهر النجاسة التي في الأرض؟", "o": ["بغسلة واحدة تذهب بعين النجاسة", "بسبع غسلات", "بالتراب فقط", "لا تطهر"], "h": "راجع: ص57 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "إذا ولغ الكلب في الإناء فلابد من غسله:", "o": ["سبع غسلات إحداهن بالتراب", "مرة واحدة", "ثلاث مرات", "مرتين"], "h": "راجع: ص57 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "الصحيح أن نجاسة الخنزير يكفي غسلها مرة واحدة تذهب بعين النجاسة.", "a": true, "h": "راجع: ص57 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "جلد الميتة مأكولة اللحم يطهر بـ:", "o": ["الدباغ", "التراب", "الشمس", "الغسل بالماء فقط"], "h": "راجع: ص58 (المسألة الثالثة)"}]}], "sum": [["تعريف النجاسة، ونوعاها", "ص55-58"], ["الأشياء التي قام الدليل على نجاسته", "ص55-58"], ["كيفية تطهير النجاسة", "ص55-58"]]}, {"id": "l12", "title": "الباب العاشر: في الحيض والنفاس", "group": "الكتاب الأول: الطهارة", "map": {"center": "الباب العاشر\nالطهارة", "nodes": [{"t": "تعريف الحيض والنفاس", "s": []}, {"t": "بداية وقت الحيض ونهايته", "s": []}, {"t": "أقل مدة الحيض وأكثرها", "s": []}, {"t": "غالب الحيض", "s": []}, {"t": "ما يحرم بالحيض والنفاس", "s": []}]}, "paras": [{"t": "الباب العاشر: في الحيض والنفاس، وفيه مسائل", "b": [{"pic": ["scroll", "book", "open-book"], "cap": "ص58-63"}, {"story": ["تعريف الحيض والنفاس", ["الحيض لغة: السيلان. وشرعا: دم طبيعة وجبلة، يخرج من قعر الرحم في أوقات معلومة، حال صحة المرأة، من غير سبب ولادة.", "والنفاس: دم يخرج من المرأة عند الولادة."]], "ic": "book"}, {"story": ["المسألة الأولى: بداية وقت الحيض ونهايته", ["لا حيض قبل تمام تسع سنين؛ لأنه لم يثبت في الوجود أن لامرأة حيض قبل ذلك. وقد روي عن عائشة ﵂ أنها قالت: «إذا بلغت الجارية تسع سنين فهي امرأة».", "ولا حيض بعد خمسين سنة في الغالب على الصحيح. وقد روي عن عائشة ﵂ أنها قالت: «إذا بلغت المرأة خمسين سنة خرجت من حد الحيض»."]], "ic": "scroll"}, {"story": ["المسألة الثانية: أقل مدة الحيض وأكثرها", ["الصحيح: أنه لا حد لأقله ولا لأكثره، وإنما يرجع فيه إلى العادة والعرف."]], "ic": "book"}, {"story": ["المسألة الثالثة: غالب الحيض", ["وغالبه ست أو سبع؛ لقوله ﷺ لحمنة بنت جحش: «تحيضي في علم الله ستة أيام، أو سبعة أيام، ثم اغتسلي وصلي أربعة وعشرين يوما، أو ثلاثة وعشرين يوما، كما تحيض النساء ويطهرن لميقات حيضهن وطهرهن»."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: ما يحرم بالحيض والنفاس", ["يحرم بسبب الحيض والنفاس أمور:", "1- الوطء في الفرج: لقوله تعالى: ﴿فاعتزلوا النساء في المحيض ولا تقربوهن حتى يطهرن﴾ [البقرة: 222]، فقال النبي ﷺ -حين نزلت-: «اصنعوا كل شيء، إلا النكاح».", "2- الطلاق: لقوله تعالى: ﴿فطلقوهن لعدتهن﴾ [الطلاق: 1]. وقوله ﷺ لعمر لما طلق ابنه عبد الله امرأته في الحيض: «مره فليراجعها» الحديث.", "3- الصلاة: لقوله ﷺ لفاطمة بنت أبي حبيش: «إذا أقبلت الحيضة، فدعي الصلاة».", "4- الصوم: لقوله ﷺ: «أليس إحداكن، إذا حاضت لم تصم، ولم تصل؟». قلن: بلى.", "5- الطواف: لقوله ﷺ لعائشة لما حاضت: «افعلي ما يفعل الحاج، غير ألا تطوفي بالبيت حتى تطهري».", "6- قراءة القرآن: وهو قول كثير من أهل العلم من الصحابة والتابعين، ومن بعدهم؛ لكن إذا احتاجت إلى القراءة -كأن تحتاج إلى مراجعة محفوظها حتى لا ينسى، أو تعليم البنات في المدارس، أو قراءة وردها- جاز لها ذلك، وإن لم تحتج فلا تقرأ، كما قال به بعض أهل العلم.", "7- مس المصحف: لقوله تعالى: ﴿لا يمسه إلا المطهرون﴾ [الواقعة: 79].", "8- دخول المسجد واللبث فيه: لقوله ﷺ: «لا أحل المسجد لجنب، ولا حائض»، ولأنه كان يدني رأسه لعائشة، وهي في حجرتها، فترجله وهي حائض، وهو حينئذ مجاور في المسجد. وكذا يحرم عليها المرور في المسجد إن خافت تلويثه، فإن أمنت تلويثه لم يحرم."]], "ic": "book"}, {"story": ["المسألة الخامسة: ما يوجبه الحيض", ["1- يوجب الغسل: لقوله ﷺ: «دعي الصلاة قدر الأيام التي كنت تحيضين فيها، ثم اغتسلي وصلي».", "2- البلوغ: لقوله ﷺ: «لا يقبل الله صلاة حائض إلا بخمار». فقد أوجب عليها الستر بحصول الحيض، فدل على أن التكليف حصل به، وإنما يحصل ذلك بالبلوغ.", "3- الاعتداد به: فتنقضي العدة في حق المطلقة ونحوها بالحيض لمن كانت تحيض، لقوله تعالى: ﴿والمطلقات يتربصن بأنفسهن ثلاثة قروء﴾ [البقرة: 228]. يعني: ثلاث حيض.", "4- الحكم ببراءة الرحم في الاعتداد بالحيض.", "تنبيه: إذا طهرت الحائض أو النفساء قبل غروب الشمس، لزمها صلاة الظهر والعصر من هذا اليوم، ومن طهرت منهما قبل طلوع الفجر لزمها أن تصلي المغرب والعشاء من هذه الليلة؛ لأن وقت الصلاة الثانية وقت للصلاة الأولى في حال العذر. وبه قال الجمهور: مالك والشافعي وأحمد."]], "ic": "scroll"}, {"story": ["المسألة السادسة: أقل النفاس وأكثره", ["لا حد لأقل النفاس؛ لأنه لم يرد فيه تحديد، فرجع فيه إلى الوجود، وقد وجد قليلا وكثيرا. وأكثره أربعون يوما. قال الترمذي: أجمع أهل العلم من أصحاب النبي ﷺ ومن بعدهم على أن النفساء تدع الصلاة أربعين يوما إلا أن ترى الطهر قبل ذلك، فتغتسل وتصلي، ولحديث أم سلمة: «كانت النفساء على عهد النبي ﷺ تجلس أربعين يوما»."]], "ic": "book"}, {"story": ["المسألة السابعة: في دم المستحاضة", ["الاستحاضة: سيلان الدم في غير وقته على سبيل النزيف، من عرق يسمى عاذل.", "ودم الاستحاضة يخالف دم الحيض في أحكامه وفي صفته، وهو عرق ينفجر في الرحم، سواء كان في أوقات الحيض أو غيرها، وهو لا يمنع الصلاة ولا الصيام ولا الوطء؛ لأنها في حكم الطاهرات. ودليلها حديث فاطمة بنت أبي حبيش: قالت: يا رسول الله إني أستحاض، فلا أطهر، أفأدع الصلاة؟ فقال: «لا، إن ذلك عرق وليس بالحيضة، فإذا أقبلت الحيضة فدعي الصلاة، فإذا أدبرت فاغسلي عنك الدم وصلي». فيجب عليها أن تغتسل عند نهاية حيضتها المعتبرة، وعند الاستحاضة تغسل فرجها، وتجعل في المخرج قطنا ونحوه يمنع الخارج، وتشد عليه ما يمسكه عن السقوط، ويغني عن ذلك الحفائظ الصحية في هذا الوقت، ثم تتوضأ عند دخول وقت كل صلاة.", "والمستحاضة لها ثلاث حالات:", "الحالة الأولى: أن تكون لها عادة معروفة، بأن تكون مدة الحيض معلومة لديها قبل الاستحاضة، فهذه تجلس قدر عادتها، وتدع الصلاة والصيام، وتعد حائضا، فإذا انتهت عادتها اغتسلت وصلت وعدت الدم الخارج دم استحاضة؛ لقوله ﷺ لأم حبيبة: «امكثي قدر ما كانت تحبسك حيضتك، ثم اغتسلي وصلي».", "الحالة الثانية: إذا لم تكن لها عادة معروفة، لكن دمها متميز بعضه يحمل صفة الحيض: بأن يكون أسود ثخينا أو له رائحة، والباقي يحمل صفة الاستحاضة، دم أحمر ليس له رائحة.", "ففي هذه الحالة ترد إلى العمل بالتمييز؛ لقوله ﷺ لفاطمة بنت أبي حبيش: «إذا كان دم الحيض فإنه أسود يعرف، فأمسكي عن الصلاة، فإذا كان الآخر فتوضئي وصلي فإنما هو عرق».", "الحالة الثالثة: إذا لم تكن لها عادة ولا صفة تميز بها الحيض من غيره، فهذه تجلس غالب الحيض ستا أو سبعا؛ لأن هذه عادة غالب النساء، وما بعد هذه الأيام من الدم يكون دم استحاضة تغسله، ثم تصلي، وتصوم؛ لقوله ﷺ لحمنة بنت جحش: «إنما هي ركضة من الشيطان، فتحيضي ستة أيام أو سبعة أيام ثم اغتسلي، فإذا استنقأت فصلي وصومي فإن ذلك يجزئك».", "ومعنى «ركضة من الشيطان» يعني: دفعة، أي: إن الشيطان هو الذي حركك هذا دم."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "الحيض لغة:", "o": ["السيلان", "الانقطاع", "الطهارة", "الألم"], "h": "راجع: ص58 (تعريف)"}, {"t": "mcq", "d": 1, "q": "النفاس هو:", "o": ["دم يخرج من المرأة عند الولادة", "دم الاستحاضة", "دم الحيض", "دم الجرح"], "h": "راجع: ص58 (تعريف)"}, {"t": "mcq", "d": 2, "q": "لا حيض قبل تمام:", "o": ["تسع سنين", "عشر سنين", "ست سنين", "اثنتي عشرة سنة"], "h": "راجع: ص58 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "ما الصحيح في أقل مدة الحيض وأكثرها؟", "o": ["لا حد لأقله ولا لأكثره، ويرجع فيه إلى العادة والعرف", "أقله يوم وأكثره عشرة", "أقله ثلاثة وأكثره خمسة عشر", "أكثره سبعة أيام"], "h": "راجع: ص58 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "غالب الحيض:", "o": ["ست أو سبع", "ثلاث أو أربع", "عشرة", "خمسة عشر"], "h": "راجع: ص58 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "قال النبي ﷺ حين نزلت آية المحيض:", "o": ["اصنعوا كل شيء إلا النكاح", "اعتزلوا النساء", "لا تقربوهن", "لا شيء عليكم"], "h": "راجع: ص59 (المسألة الرابعة)"}, {"t": "order", "d": 2, "q": "رتب ما يحرم بالحيض والنفاس كما ورد:", "o": ["الوطء في الفرج", "الطلاق", "الصلاة", "الصوم", "الطواف"], "h": "راجع: ص59 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "ما قال النبي ﷺ لعائشة لما حاضت في الحج؟", "o": ["افعلي ما يفعل الحاج غير ألا تطوفي بالبيت حتى تطهري", "لا تحجي", "ارجعي", "أعيدي الإحرام"], "h": "راجع: ص59 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "ما يوجبه الحيض:", "o": ["الغسل، والبلوغ، والاعتداد به، والحكم ببراءة الرحم", "الصيام", "الحج", "الوضوء فقط"], "h": "راجع: ص60-61 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "إذا طهرت الحائض قبل طلوع الفجر لزمها أن تصلي:", "o": ["المغرب والعشاء من هذه الليلة", "الفجر فقط", "العشاء فقط", "لا شيء"], "h": "راجع: ص61 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "أكثر النفاس:", "o": ["أربعون يوما", "ثلاثون يوما", "ستون يوما", "سبعة أيام"], "h": "راجع: ص61 (المسألة السادسة)"}, {"t": "tf", "d": 2, "q": "دم الاستحاضة لا يمنع الصلاة ولا الصيام ولا الوطء.", "a": true, "h": "راجع: ص61 (المسألة السابعة)"}, {"t": "mcq", "d": 2, "q": "المستحاضة لها كم حالة؟", "o": ["ثلاث حالات", "حالتان", "أربع حالات", "حالة واحدة"], "h": "راجع: ص62 (المسألة السابعة)"}, {"t": "mcq", "d": 2, "q": "المستحاضة التي لها عادة معروفة:", "o": ["تجلس قدر عادتها ثم تغتسل وتصلي", "ترد إلى التمييز", "تجلس ستا أو سبعا", "تصلي دائما"], "h": "راجع: ص62 (المسألة السابعة)"}, {"t": "mcq", "d": 2, "q": "المستحاضة التي لا عادة لها ولا تمييز:", "o": ["تجلس غالب الحيض ستا أو سبعا", "تجلس عشرة", "تجلس شهرا", "تصلي دائما"], "h": "راجع: ص62 (المسألة السابعة)"}, {"t": "mcq", "d": 1, "q": "معنى «ركضة من الشيطان»:", "o": ["دفعة", "وسوسة", "خطأ", "ذنب"], "h": "راجع: ص63 (المسألة السابعة)"}]}], "sum": [["تعريف الحيض والنفاس", "ص58-63"], ["بداية وقت الحيض ونهايته", "ص58-63"], ["أقل مدة الحيض وأكثرها", "ص58-63"], ["غالب الحيض", "ص58-63"]]}, {"id": "l13", "title": "الباب الأول: في تعريف الصلاة وفضلها ووجوب الصلوات الخمس", "group": "الكتاب الثاني: الصلاة", "map": {"center": "الباب الأول\nالصلاة", "nodes": [{"t": "الباب", "s": []}]}, "paras": [{"t": "الباب الأول: في تعريف الصلاة وفضلها ووجوب الصلوات الخمس", "b": [{"pic": ["open-book", "scroll", "book"], "cap": "ص64-65"}, [{"story": ["تعريف الصلاة وفضلها ووجوب الصلوات الخمس", ["1- تعريفها: الصلاة لغة: الدعاء.", "وشرعا: عبادة ذات أقوال وأفعال مخصوصة، مفتتحة بالتكبير، مختتمة بالتسليم.", "ويأتي تفصيلها في الأبواب التالية إن شاء الله.", "2- فضلها: الصلاة من آكد أركان الإسلام بعد الشهادتين، بل هي عمود الإسلام، وقد فرضها الله على نبيه محمد ﷺ ليلة المعراج فوق سبع سموات.", "وذلك دليل على أهميتها في حياة المسلم، وقد كان ﷺ إذا حزبه أمر فزع إلى الصلاة. وقد جاء في فضلها والحث عليها أحاديث كثيرة منها:", "قوله ﷺ: «الصلوات الخمس، والجمعة إلى الجمعة، ورمضان إلى رمضان مكفرات لما بينهن إذا اجتنبت الكبائر».", "وقوله ﷺ: «أرأيتم لو أن نهرا بباب أحدكم يغتسل منه كل يوم خمس مرات، هل يبقى من درنه شيء؟» قالوا: لا يبقى من درنه شيء. قال: «فذلك مثل الصلوات الخمس، يمحو الله بهن الخطايا». والدرن: الوسخ.", "3- وجوبها: وفرضيتها معلومة بالكتاب، والسنة، والإجماع المعلوم من الدين بالضرورة، قال تعالى: ﴿وأقيموا الصلاة﴾ [البقرة: 43] في آيات كثيرة من كتاب الله، وقال تعالى: ﴿قل لعبادي الذين آمنوا يقيموا الصلاة﴾ [إبراهيم: 31].", "ومن السنة: حديث المعراج وفيه: «هي خمس، وهي خمسون». وفي الصحيحين: قوله ﷺ لمن سأله عن شرائع الإسلام: «خمس صلوات في اليوم والليلة» قال السائل: هل علي غيرهن؟ قال: «لا، إلا أن تطوع».", "وتجب الصلاة على المسلم البالغ العاقل، فلا تجب على الكافر، ولا صغير، ولا المجنون؛ لقوله ﷺ: «رفع القلم عن ثلاثة: عن النائم حتى يستيقظ، وعن المجنون حتى يفيق، وعن الصغير حتى يبلغ». ولكن يؤمر بها الأولاد لتمام سبع سنين، ويضربون على تركها لعشر. فمن جحدها أو تركها فقد كفر، وارتد عن دين الإسلام لقوله ﷺ: «العهد الذي بيننا وبينهم الصلاة، فمن تركها فقد كفر»."]], "ic": "book"}], {"note": "حاشية (ص64): حزبه: أي أصابه."}], "q": [{"t": "mcq", "d": 1, "q": "الصلاة لغة:", "o": ["الدعاء", "الذكر", "الركوع", "القيام"], "h": "راجع: ص64 (تعريفها)"}, {"t": "mcq", "d": 2, "q": "الصلاة شرعا:", "o": ["عبادة ذات أقوال وأفعال مخصوصة، مفتتحة بالتكبير، مختتمة بالتسليم", "قول باللسان فقط", "سجود فقط", "ذكر الله في القلب"], "h": "راجع: ص64 (تعريفها)"}, {"t": "mcq", "d": 1, "q": "الصلاة من آكد أركان الإسلام بعد:", "o": ["الشهادتين", "الزكاة", "الصيام", "الحج"], "h": "راجع: ص64 (فضلها)"}, {"t": "mcq", "d": 2, "q": "متى فرض الله الصلاة على نبيه ﷺ؟", "o": ["ليلة المعراج فوق سبع سموات", "في المدينة بعد الهجرة", "يوم بدر", "يوم الفتح"], "h": "راجع: ص64 (فضلها)"}, {"t": "fill", "d": 2, "q": "قال ﷺ: «الصلوات الخمس، والجمعة إلى الجمعة، ورمضان إلى رمضان ____ لما بينهن إذا اجتنبت الكبائر».", "o": ["مكفرات", "مطهرات", "منجيات", "موجبات"], "h": "راجع: ص64 (فضلها)"}, {"t": "mcq", "d": 2, "q": "ما الد لإقامة، وحكمهما", ["أ- تعريف الأذان والإقامة:", "الأذان لغة: الإعلام. قال تعالى: ﴿وأذان من الله ورسوله﴾ [التوبة: 3]. أي إعلام.", "وشرعا: الإعلام بدخول وقت الصلاة بذكر مخصوص.", "والإقامة لغة هي: مصدر أقام، وحقيقتها: إقامة القاعد.", "وشرعا: الإعلام بالقيام إلى الصلاة بذكر مخصوص ورد به الشارع.", "ب- حكمهما: الأذان والإقامة مشروعان في حق الرجال للصلوات الخمس دون غيرها، وهما من فروض الكفايات إذا قام بهما من يكفي سقط الإثم عن الباقين؛ لأنهما من شعائر الإسلام الظاهرة، فلا يجوز تعطيلهما."]], "ic": "scroll"}, {"story": ["المسألة الثانية: شروط صحتهما", ["1- الإسلام: فلا يصحان من الكافر.", "2- العقل: فلا يصحان من المجنون والسكران وغير المميز، كسائر العبادات.", "3- الذكورية: فلا يصحان من المرأة للفتنة بصوتها، ولا من الخنثى لعدم العلم بكونه ذكرا.", "4- أن يكون الأذان في وقت الصلاة: فلا يصح قبل دخول وقتها، غير الأذان الأول للفجر والجمعة، فيجوز قبل الوقت، وأن تكون الإقامة عند إرادة القيام للصلاة.", "5- أن يكون الأذان مرتبا متواليا: كما وردت بذلك السنة، وكذا الإقامة، وسيأتي بيانه في الكلام على صفة الأذان والإقامة.", "6- أن يكون الأذان، وكذا الإقامة، باللغة العربية وبالألفاظ التي وردت بها السنة."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: في الصفات المستحبة في المؤذن", ["1- أن يكون عدلا أمينا؛ لأنه مؤتمن يرجع إليه في الصلاة والصيام، فلا يؤمن أن يغرهم بأذانه إذا لم يكن كذلك.", "2- أن يكون بالغا عاقلا، ويصح أذان الصبي المميز.", "3- أن يكون عالما بالأوقات ليتحراها فيؤذن في أولها؛ لأنه إن لم يكن عالما ربما غلط أو أخطأ.", "4- أن يكون صيتا ليسمع الناس.", "5- أن يكون متطهرا من الحدث الأصغر والأكبر.", "6- أن يؤذن قائما مستقبل القبلة.", "7- أن يجعل أصبعيه في أذنيه، وأن يدير وجهه على يمينه إذا قال: حي على الصلاة، وعلى يساره إذا قال: حي على الفلاح.", "8- أن يترسل في الأذان -أي يتمهل- ويحدر الإقامة أي يسرع فيها."]], "ic": "scroll"}, {"note": "حاشية (ص66): صيتا: أي قوي الصوت."}, {"story": ["المسألة الرابعة: في صفة الأذان والإقامة", ["كيفية الأذان والإقامة: ولهما كيفيات وردت بها النصوص النبوية، ومنها ما جاء في حديث أبي محذورة، أن النبي ﷺ علمه الأذان بنفسه، فقال: «تقول: الله أكبر، الله أكبر، الله أكبر، الله أكبر، أشهد أن لا إله إلا الله، أشهد أن لا إله إلا الله، أشهد أن محمدا رسول الله، أشهد أن محمدا رسول الله، حي على الصلاة، حي على الصلاة، حي على الفلاح، حي على الفلاح، الله أكبر، الله أكبر، لا إله إلا الله».", "وأما صفة الإقامة فهي: «الله أكبر الله أكبر، أشهد أن لا إله إلا الله، أشهد أن محمدا رسول الله، حي على الصلاة، حي على الفلاح، قد قامت الصلاة، قد قامت الصلاة، الله أكبر الله أكبر، لا إله إلا الله»؛ لحديث أنس قال: «أمر بلال أن يشفع الأذان، وأن يوتر الإقامة، إلا الإقامة». فتكون كلمات الأذان مرتين مرتين، وكلمات الإقامة مرة مرة، إلا في قوله: «قد قامت الصلاة» فتكون مرتين؛ للحديث الماضي.", "فهذه صفة الأذان والإقامة المستحبة؛ لأن بلالا كان يؤذن به حضرا وسفرا مع رسول الله ﷺ إلى أن مات. وإن رجع في الأذان، أو ثنى الإقامة، فلا بأس؛ لأنه من الاختلاف المباح. ويستحب أن يقول في أذان الصبح بعد حي على الفلاح: الصلاة خير من النوم مرتين؛ لما روى أبو محذورة أن رسول الله ﷺ قال له: «إن كان في أذان الصبح فقلت: الصلاة خير من النوم»."]], "ic": "scroll"}, {"note": "حاشية (ص67): الترجيع: الترديد، بمعنى أنه يخفض صوته في الشهادتين، ثم يعيدهما برفع الصوت."}, {"story": ["المسألة الخامسة: ما يقوله سامع الأذان، وما يدعو به بعده", ["يستحب لمن سمع الأذان أن يقول مثل ما يقول المؤذن؛ لحديث أبي سعيد أن النبي ﷺ قال: «إذا سمعتم النداء، فقولوا مثل ما يقول المؤذن». إلا في الحيعلتين، فيشرع لسامع الأذان أن يقول: «لا حول ولا قوة إلا بالله» عقب قول المؤذن: حي على الصلاة، وكذا عقب قوله: حي على الفلاح؛ لحديث عمر بن الخطاب ﷺ في ذلك.", "وإذا قال المؤذن في صلاة الصبح: الصلاة خير من النوم، فإن المستمع يقول مثله، ولا يسن ذلك عند الإقامة.", "ثم يصلي على النبي ﷺ، ثم يقول: «اللهم رب هذه الدعوة التامة، والصلاة القائمة آت محمدا الوسيلة والفضيلة، وابعثه مقاما محمودا الذي وعدته»."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "الأذان لغة:", "o": ["الإعلام", "الدعاء", "الذكر", "النداء بالصوت العالي فقط"], "h": "راجع: ص65 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "الأذان شرعا:", "o": ["الإعلام بدخول وقت الصلاة بذكر مخصوص", "الإعلام بالقيام إلى الصلاة", "دعاء بعد الصلاة", "ذكر عند الصلاة"], "h": "ر اة الصبح من طلوع الفجر ما لم تطلع الشمس»."]], "ic": "scroll"}, {"story": ["وقت الظهر", ["فصلاة الظهر يبدأ وقتها بزوال الشمس، أي: ميلها عن كبد السماء إلى جهة مغرب، ويمتد وقتها إلى أن يصير ظل كل شيء مثله في الطول، ويستحب تعجيلها في أول وقتها، إلا إذا اشتد الحر فيستحب تأخيرها إلى الإبراد، لقوله ﷺ: «إذا اشتد الحر فأبردوا بالصلاة، فإن شدة الحر من فيح جهنم»."]], "ic": "scroll"}, {"story": ["وقت العصر", ["وصلاة العصر يبدأ وقتها من نهاية وقت الظهر -أي من صيرورة ظل كل شيء مثله- وينتهي بغروب الشمس، أي عند آخر الاصفرار، ويسن تعجيلها في أول الوقت، وهي الصلاة الوسطى التي نص الله عليها في قوله تعالى: ﴿حافظوا على الصلوات والصلاة الوسطى وقوموا لله قانتين﴾ [البقرة: 238].", "وقد أمر النبي ﷺ بالمحافظة عليها، فقال: «من فاتته صلاة العصر فكأنما وتر أهله وماله». وقال أيضا: «من ترك صلاة العصر فقد حبط عمله»."]], "ic": "scroll"}, {"note": "حاشية (ص69): ومعنى (وتر أهله وماله): انتزع منه أهله وماله، أو: فقد أهله وماله."}, {"story": ["وقت المغرب", ["ووقت صلاة المغرب من غروب الشمس إلى مغيب الشفق الأحمر؛ لقوله ﷺ: «وقت صلاة المغرب ما لم يغب الشفق». ويسن تعجيلها في أول وقتها؛ لقوله ﷺ: «لا تزال أمتي بخير ما لم يؤخروا المغرب حتى تشتبك النجوم»، إلا ليلة المزدلفة للمحرم بالحج، فيسن تأخيرها حتى تصلى مع العشاء جمع تأخير."]], "ic": "scroll"}, {"note": "حاشية (ص69): الشفق: الحمرة التي تكون من غروب الشمس إلى وقت العشاء الآخرة، وترى هذه الحمرة بعد سقوط الشمس."}, {"story": ["وقت العشاء", ["أما صلاة العشاء فيبدأ وقتها من مغيب الشفق الأحمر إلى نصف الليل؛ لقوله ﷺ: «وقت صلاة العشاء إلى نصف الليل الأوسط». ويستحب تأخيرها إلى آخر الوقت المختار ما لم تكن مشقة، ويكره النوم قبلها، والحديث بعدها لغير مصلحة؛ لحديث أبي برزة: «أن رسول الله ﷺ كان يكره النوم قبل العشاء، والحديث بعدها»."]], "ic": "scroll"}, {"story": ["وقت الفجر", ["ووقت صلاة الفجر من طلوع الفجر الثاني إلى طلوع الشمس، ويستحب تعجيلها إذا تحقق طلوع الفجر."]], "ic": "scroll"}, {"story": ["وجوب المحافظة على الأوقات", ["هذه هي الأوقات التي يشرع أداء الصلوات الخمس فيها، فيجب على المسلمين التقيد بذلك، والمحافظة عليها في وقتها، وترك تأخيرها؛ لأن الله توعد الذين يؤخرونها عن وقتها فقال تعالى: ﴿فويل للمصلين ٤ الذين هم عن صلاتهم ساهون﴾ [الماعون: 4، 5]. وقال تعالى: ﴿فخلف من بعدهم خلف أضاعوا الصلاة واتبعوا الشهوات فسوف يلقون غيا﴾ [مريم: 59]. والغي: هو العذاب الشديد المضاعف والشر والخيبة في جهنم عياذا بالله.", "وأداء الصلوات في أوقاتها من أحب الأعمال إلى الله، وأفضلها، فقد سئل النبي ﷺ: أي العمل أحب إلى الله؟ قال: «الصلاة على وقتها»."]], "ic": "book"}], "q": [{"t": "mcq", "d": 1, "q": "كم الصلوات المفروضات في اليوم والليلة؟", "o": ["خمس", "ست", "ثلاث", "سبع"], "h": "راجع: ص68 (مواقيت الصلاة)"}, {"t": "fill", "d": 2, "q": "قال تعالى: ﴿إن الصلاة كانت على المؤمنين كتابا ____﴾ [النساء: 103].", "o": ["موقوتا", "مفروضا", "مكتوبا", "واجبا"], "h": "راجع: ص68 (مواقيت الصلاة)"}, {"t": "mcq", "d": 2, "q": "لا تجزئ الصلاة:", "o": ["قبل دخول وقتها", "بعد الزوال", "في أول وقتها", "في وسط وقتها"], "h": "راجع: ص68 (مواقيت الصلاة)"}, {"t": "mcq", "d": 2, "q": "يبدأ وقت الظهر بـ:", "o": ["زوال الشمس", "طلوع الشمس", "غروب الشمس", "اصفرار الشمس"], "h": "راجع: ص69 (وقت الظهر)"}, {"t": "mcq", "d": 2, "q": "ينتهي وقت الظهر إذا صار ظل كل شيء:", "o": ["مثله في الطول", "مثليه", "نصفه", "ضعفه"], "h": "راجع: ص69 (وقت الظهر)"}, {"t": "mcq", "d": 2, "q": "يستحب تأخير الظهر إلى الإبراد إذا:", "o": ["اشتد الحر", "اشتد البرد", "هطل المطر", "كان يوم جمعة"], "h": "راجع: ص69 (وقت الظهر)"}, {"t": "fill", "d": 2, "q": "قال ﷺ: «إذا اشتد الحر فأبردوا بالصلاة، فإن شدة الحر من ____ جهنم».", "o": ["فيح", "لهب", "نار", "حر"], "h": "راجع: ص69 (وقت الظهر)"}, {"t": "mcq", "d": 2, "q": "ما الصلاة الوسطى المنصوص عليها في الآية؟", "o": ["العصر", "الظهر", "المغرب", "الفجر"], "h": "راجع: ص69 (وقت العصر)"}, {"t": "mcq", "d": 2, "q": "ينتهي وقت العصر بـ:", "o": ["غروب الشمس", "نصف الليل", "طلوع الفجر", "مغيب الشفق"], "h": "راجع: ص69 (وقت العصر)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «من ترك صلاة العصر فقد»:", "o": ["حبط عمله", "فاته الخير", "ضيع أهله", "أثم"], "h": "راجع: ص69 (وقت العصر)"}, {"t": "mcq", "d": 2, "q": "وقت المغرب من غروب الشمس إلى:", "o": ["مغيب الشفق الأحمر", "نصف الليل", "ط
