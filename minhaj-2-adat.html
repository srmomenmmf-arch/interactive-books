لنفس، فعرفت في وجهه أن قد حفزه شيء، فما تكلم حتى توضأ وخرج، فلصقت بالحجرة، فصعد المنبر، فحمد الله عز وجل وأثنى", "عليه، ثم قال: «أيها الناس، إن الله عز وجل يقول لكم: مروا بالمعروف وانهوا عن المنكر قبل أن تدعوني فلا أجيبكم، وتسألوني فلا أعطيكم، وتستنصروني فلا أنصركم». وفي حديث ابن مسعود عن النبي ﷺ أنه قال: «كيف بكم إذا كثرت أمراؤكم، وطغت نساؤكم» قالوا: وإن ذلك لكائن يا رسول الله؟ قال: «نعم، وأشد من ذلك» قالوا: وما هو يا رسول الله؟ قال: «لا تأمرون بمعروف، ولا تنهون عن منكر» قالوا: وإن ذلك لكائن يا رسول الله؟ قال: «نعم، وأكثر منه» قالوا: وما هو يا رسول الله؟ قال: «لا تعرفون المعروف، ولا تنكرون المنكر» قالوا: وإن ذلك لكائن؟ قال: «نعم، وأكثر من ذلك، يكون المعروف فيكم منكرا، والمنكر فيكم معروفا».", "وقال مالك بن دينار: قرأت في التوراة: من كان له جار يعمل بالمعاصي فلم ينهه، فهو شريكه.", "وقال مسعر: أمر ملك أن يخسف بقرية فقال: يا رب، فيها فلان العابد. فأوحى الله إليه: أن به فابدأ، فإنه لم يتمعر(١) وجهه في ساعة قط.", "حاشية: (١) تمعر وجهه: تغير وعلته صفرة."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "الجد في الأمر بالمعروف وترك المحاباة: أخبرنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا أبو بكر بن مالك قال: حدثنا عبد الله بن أحمد قال حدثني أبي قال: حدثنا عبد ____ بن محمد المحاربي قال:", "o": ["الرحمن", "والتودد", "بالسبب", "يستقل"], "h": "راجع: ص٥٠٧"}, {"t": "fill", "d": 2, "q": "وقال مسعر: أمر ملك أن يخسف بقرية فقال: يا رب، فيها فلان العابد. فأوحى الله ____: أن به فابدأ، فإنه لم يتمعر وجهه في ساعة", "o": ["إليه", "عليا", "المولى", "عزلته"], "h": "راجع: ص٥٠٩"}, {"t": "fill", "d": 2, "q": "ذكر مراتب الإنكار: أنبأنا ابن الحصين قال: أخبرنا ابن المذهب قال: أخبرنا ابن مالك قال: حدثنا عبد الله بن ____ قال: حدثني أبي قال: حدثنا أبو معاوية قال: حدثنا الأعمش عن إسماعيل بن رجاء عن أبيه عن", "o": ["أحمد", "بقول", "فغبنه", "يعفو"], "h": "راجع: ص٥٠٦"}, {"t": "fill", "d": 2, "q": "عليه، ثم قال: «أيها الناس، إن الله عز وجل يقول لكم: مروا بالمعروف وانهوا عن المنكر قبل أن تدعوني فلا أجيبكم، وتسألوني فلا ____، وتستنصروني فلا أنصركم». وفي حديث ابن مسعود عن النبي ﷺ أنه قال: «كيف", "o": ["أعطيكم", "تنتهي", "أوصني", "لبيان"], "h": "راجع: ص٥٠٩"}]}], "sum": [["الصفحات", "ص٥٠٥ - ص٥٠٩"]], "_nq": 4}, {"id": "l38", "title": "الباب الثاني في أركان الأمر بالمعروف وشروطه", "group": "كتاب الأمر بالمعروف والنهي عن المنكر", "map": {"center": "الباب\nالثاني في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الثاني في أركان الأمر بالمعروف وشروطه - القسم ١ من ٢", "b": [{"pic": ["books", "book"], "cap": "ص٥١٠ - ص٥٢٦"}, {"story": ["الباب الثاني في أركان الأمر بالمعروف وشروطه (١ من ١٢)، ص٥١٠", ["**في أركان الأمر بالمعروف وشروطه**", "اعلم أن الأركان في الحسبة التي هي عبارة شاملة للأمر بالمعروف والنهي عن المنكر أربعة: المحتسب، والمحتسب عليه، والمحتسب فيه، ونفس الاحتساب، فهذه أربعة أركان ولكل واحد منها شروط.", "**الركن الأول:** المحتسب: وله شروط؛ وهو أن يكون مكلفا مسلما قادرا، فيخرج منه المجنون والصبي والكافر، ويدخل فيه آحاد الرعايا، وإن لم يكونوا مأذونين، ويدخل فيه الفاسق والرقيق والمرأة، فلنذكر وجه اشتراط ما اشترطناه ووجه اطراح ما اطرحناه:", "**أما الشرط الأول: وهو التكليف:** فلا يخفى وجه اشتراطه، فإن غير المكلف لا يلومه أمر، وما ذكرناه أردنا به أنه شرط الوجوب، فأما إمكان العقل وجوازه فلا يستدعي إلا العقل حتى إن الصبي المميز المراهق وإن لم يكن مكلفا، فله إنكار المنكر، وله أن يريق الخمر، ويكسر الملاهي، وإذا فعل ذلك نال به ثوابا، ولم يكن لأحد منعه من حيث إنه ليس بمكلف، فإن هذه قربة، وهو من أهلها، كالصلاة والإمامة فيها، وسائر القربات، وليس حكمه حكم الولايات حتى يشترط فيه التكليف، ولذلك أثبتناه للعبد وآحاد الرعية، وإن كان في ذلك نوع ولاية، إلا أنها تستفاد بمجرد الإيمان، كقتل المشرك، فإن للصبي أن يفعل ذلك، فالمنع من الفسق كالمنع من الكفر.", "**وأما الشرط الثاني: وهو الإيمان:** فلا يخفى وجه اشتراطه؛ لأن هذه نصرة للدين فكيف يكون من أهلها من هو جاحد لأصل الدين وعدو له؟ فإن منع هذا الكافر المسلم بالقهر فليس له أن يقهر مسلما، ولا هذه مرتبته.", "**وأما الشرط الثالث: فهو العدالة:** فقد اعتبرها قوم، وقالوا: ليس للفاسق أن", "يحتسب. وربما استدلوا بقوله تعالى: ﴿أَتَأْمُرُونَ ٱلنَّاسَ بِٱلْبِرِّ وَتَنسَوْنَ أَنفُسَكُمْ﴾ [البقرة: ٤٤]، وبما أوحى الله إلى عيسى عليه السلام: عظ نفسك، فإن اتعظت، فعظ الناس، وإلا فاستحي مني."]], "ic": "book"}, {"story": ["الباب الثاني في أركان الأمر بالمعروف وشروطه (٢ من ١٢)، ص٥١١", ["ومن حيث القياس فإن هداية الغير فرع للاهتداء، وكذلك تقويم الغير فرع للاستقامة، والإصلاح زكاة نصاب الصلاح، فمن ليس بصالح في نفسه كيف يصلح غيره؟ ومتى يستقيم الظل والعود أعوج؟ وهذا كله لا حجة فيه؛ لأن إنكار لترك المعروف لا لأجل الأمر به، والحق أن للفاسق أن يحتسب، وبرهان ذلك أن نقول: هل يشترط في الاحتساب أن يكون متعاطيه معصوما عن المعاصي كلها؟ فإن شرط ذلك، فهو خرق للإجماع وحسم لباب الاحتساب، إذ لا عصمة للصحابة فمن دونهم، وقد اختلف في عصمة الأنبياء عليهم السلام، وإن زعموا أن ذلك لا يشترط عن الصغائر حتى يجوز للابس الحرير أن يمنع من الزنا وشرب الخمر فنقول: وهل لشارب الخمر أن يغزو الكفار؟ فإن قالوا: لا. خرقوا الإجماع، إذ جنود المسلمين مشتملة على البر والفاجر، ولم يمنعوا من الغزو قط، فإن قالوا: نعم. قلنا: فهل لشارب الخمر أن يمنع من القتل؟ فإن قالوا: لا. قلنا: فما الفرق بينه وبين لابس الحرير إذ جاز له المنع من الخمر؟ والقتل كبيرة بالنسبة إلى الشرب، كالشرب بالنسبة إلى لبس الحرير، ولا فرق. فإن قالوا: نعم. وفصلوا الأمر فيه بأن كل مقدم على شيء لا يمنع عن مثله ولا عما هو دونه، وإنما يمنع عما هو فوقه، فهذا تحكم، فإنه كما لا يبعد أن يمنع الشارب من الزنا والقتل، فمن أين يبعد أن يمنع الزاني من الشرب؟ بل من أين يبعد أن يشرب ويمنع غلمانه وخدمه من الشرب؟ ويقول: قد وجب علي الانتهاء والنهي، فمن أين يلزمني بالعصيان في أحدهما أن أعصي الله بالثاني؟ وإذا كان النهي واجبا علي فمن أين وجب سقوطه بإقدامي؟ إذ يستحيل أن يقال: يجب النهي عن شرب الخمر عليه ما لم يشرب، فإذا شرب سقط عنه النهي.", "فإن قيل: فيلزم على هذا أن يقول القاتل: قد وجب علي الوضوء والصلاة فأنا أتوضأ وإن لم أصل. قلنا: الوضوء لازم والصلاة أيضا، فمن توضأ ولم يصل كان", "مؤديا أحد الفرضين، وكان عقابه أقل ممن يترك الوضوء والصلاة جميعا، فليكن من ترك النهي والانتهاء أكبر عقابا ممن نهى ولم ينته، كيف والوضوء شرط لا يراد لنفسه بل للصلاة، فلا حكم له دون الصلاة، فأما الحسبة فليست شرطا في الانتهاء والائتمار، فلا مشابهة بينهما.", "فإن قيل: فيلزم على هذا أنه لو زنا بامرأة وهي مكرهة مستورة الوجه فكشفت وجهها باختيارها، فقال لها: استري وجهك لأنك مكرهة في الزنا لا في كشف الوجه. فإن هذا احتساب شنيع.", "قلنا: إنما كان شنيعا؛ لأنه اشتغال بمهم عما هو أهم منه، كمن غصب منه فرس بلجامها فأخذ يطلب اللجام ويترك ذكر الفرس.", "واعلم أن أمر الفاسق بالمعروف (١-١)ونهيه عن المنكر(١-١) لا يفيد، لعلم الناس بفسقه، بل إن قدر على المنع أفاد، كإراقته الخمور وكسره للملاهي."]], "ic": "book"}, {"story": ["الباب الثاني في أركان الأمر بالمعروف وشروطه (٣ من ١٢)، ص٥١٢", ["**الشرط الرابع:** كونه مأذونا من جهة الإمام والوالي: فقد شرط قوم هذا ولم يجيزوا لآحاد الرعية الحسبة، وهذا الاشتراط فاسد، فإن الآيات والأخبار التي أوردناها تدل على أن كل من رأى منكرا فسكت عنه عصى فالتخصيص بشرط التفويض من الإمام تحكم لا أصل له، والعجب أن الروافض زادوا على هذا فقالوا: لا يجوز الأمر بالمعروف ما لم يخرج الإمام المعصوم وهؤلاء أخس رتبة من أن يكلموا، بل جوابهم أن يقال لهم إذا جاؤوا إلى القضاة طالبين حقوقهم في دمائهم وأموالهم: إن نصرتكم أمر بالمعروف، واستخراج حقوقكم ممن يدين ظلمكم نهي عن المنكر، وطلبكم لحقوقكم من جملة المعروف، وما هذا زمان النهي عن الظلم وطلب الحقوق؛ لأن الإمام لم يخرج بعد.", "فإن قيل: في الأمر بالمعروف إثبات سلطنة وولاية على المحكوم عليه، ولذلك لم يثبت للكافر على المسلم مع كونه حقا، فينبغي أن لا يثبت لآحاد الرعية إلا بتفويض من السلطان.", "حاشية: (١-١) سقط من (ظ).", "قلنا: أما الكافر، فممنوع لما في ذلك من السلطنة وعز الاحتكام ولا يستحق الكافر الذليل أن ينال عز التحكم على المسلم، وأما آحاد المسلمين، فيستحقون هذا العز بالدين والمعرفة، وما في ذلك من عز السلطنة والاحتكام لا يحوج إلى تفويض كعز التعليم(١) والتعريف، إذ لا خلاف في أن تعريف التحريم والإيجاب لمن هو جاهل ومقدم على المنكر لجهله لا يحتاج إلى إذن الوالي، وفيه عز الإرشاد، وعلى المعرف ذل التجهيل وذلك يكفي فيه مجرد الدين، فكذلك النهي.", "وشرح هذا أن الحسبة لها خمس مراتب:", "**الأولى:** التعريف.", "**والثانية:** الوعظ بالكلام اللطيف.", "**والثالثة:** السب والتعنيف، ولسنا نعني السب الفاحش، بل أن يقول له: يا جاهل، يا أحمق، ألا تخاف من الله، ونحو هذا.", "**والرابعة:** المنع بالقهر ككسر الملاهي، وإراقة الخمر.", "**والخامسة:** التخويف والتهديد بالضرب، أو مباشرة الضرب له حتى يمتنع عما هو عليه، فهذه المرتبة تحتاج إلى الإمام دون ما قبلها؛ لأنه ربما جر إلى فتنة.", "واستمرار عادات السلف على الحسبة على الولاة قاطع بإجماعهم على الاستغناء عن التفويض، وكل من أمر بمعروف فإن كان الوالي راضيا بذلك، فهو المقصود، وإن كان ساخطا فسخطه منكر يجب فيه الإنكار عليه، فكيف يحتاج إلى إذنه في الإنكار عليه؟ وقد روينا أن رجلا قام إلى مروان فأنكر عليه، فقال أبو سعيد الخدري: أما هذا فقد قضى ما عليه.", "وقد كان خلق(٢) كثير يعظون السلاطين وينبسطون(٣) عليهم ويتحملهم السلاطين لعلمهم بحسن قصدهم، وسيأتي ذكر طرف من أخبارهم.", "حاشية: (١) في (ظ): «التعظيم».", "حاشية: (٢) ليست في (ظ).", "حاشية: (٣) في الأصل: «يتسلطون».", "فإن قيل: فهل تثبت الحسبة للولد على الوالد؟ والعبد على السيد؟ والزوجة على الزوج؟ والرعية على الوالي؟"]], "ic": "book"}, {"story": ["الباب الثاني في أركان الأمر بالمعروف وشروطه (٤ من ١٢)، ص٥١٤", ["قلنا: أصل الولاية ثابت للكل، وقد رتبنا للحسبة خمس مراتب، فللولد الحسبة بالرتبتين الأوليين، وهما: التعريف ثم الوعظ والنصح باللطف، وله من المرتبة الخامسة أن يكسر العود، ويريق الخمر، ويرد الغصب، ويبطل الصور المنقوشة على حيطانه، وهذا الترتيب ينبغي أن يجري في العبد والزوجة، فإن السيد والزوج قريبان من مرتبة الوالد، وأما الرعية مع السلطان، فالأمر فيه أشد من الوالد، فليس له معه إلا التعريف والنصح.", "**الشرط الخامس: كونه قادرا:** ولا يخفى أن العاجز ليس عليه حسبة إلا بقلبه، ولا يقف سقوط الوجوب على العجز الحسي، بل يلتحق به خوف مكروه يناله وذلك في معنى العجز، وكذلك إذا علم أن إنكاره لا ينفع، فيخرج في حق الآمر بالمعروف أربعة أحوال:", "أحدها: أن يعلم أن المنكر يزول بقوله وفعله، ولا يقدر له على مكروه، فيجب عليه الإنكار.", "الحالة الثانية: أن يعلم أن كلامه لا ينفع، وأنه إن تكلم ضرب، فيرتفع الوجوب عنه.", "**والثالثة:** أن يعلم أن إنكاره لا يفيد، لكنه لا يخاف مكروها، فلا(١) يجب عليه الأمر لعدم الفائدة، لكن يستحب لإظهار شعار الإسلام والتذكير بالدين.", "**والرابعة:** أن يعلم أنه يصاب بمكروه، ولكن يبطل المنكر بفعله، مثل أن يكسر العود ويريق الخمر، ويعلم أنه يضرب عقيب ذلك، فيرتفع الوجوب عنه، ويبقى مستحبا، للحديث الذي أوردناه في فضل كلمة الحق عند الإمام الجائر.", "فإن قيل: فما معنى قوله: ﴿وَلَا تُلْقُوا۟ بِأَيْدِيكُمْ إِلَى ٱلتَّهْلُكَةِ﴾ [البقرة: ١٩٥].", "حاشية: (١) في الأصل: «ولا».", "قلنا: قال ابن عباس: المراد بها ترك النفقة في سبيل الله، وقال البراء بن عازب: هو أن يذنب الذنب ثم يقول: لا يتاب علي ـ. ولا خلاف أن المسلم الواحد له أن يهجم على صف الكفار ويقاتل، وإن علم أنه يقتل؛ لأن ذلك يكسر قلوب الكفار، ويبين لهم قوة دليل الإسلام، وإذا جاز ذلك في القتال جاز في الحسبة، بلى لو علم أنه لا نكاية لهجومه على الكفار، كالأعمى يطرح نفسه على الصف حرم ذلك ودخل تحت عموم الآية، وكذلك لو رأى فاسقا وحده وعنده سيف وبيده قدح، وعلم أنه إن أنكر عليه لشرب القدح وضرب عنقه، لم يجز له الإقدام على ذلك؛ لأن هذا لا يؤثر في الدين أثرا يفديه بنفسه، وإنما يستحب له الإنكار إذا قدر على إبطال المنكر، أو ظهر لفعله فائدة، فإن علم أنه يضرب معه غيره من أصحابه وأقاربه ورفقائه لم يجز له الحسبة؛ لأنه عجز عن دفع المنكر إلا بأن يفضي ذلك إلى منكر آخر، وليس ذلك من القدرة في شيء."]], "ic": "book"}, {"story": ["الباب الثاني في أركان الأمر بالمعروف وشروطه (٥ من ١٢)، ص٥١٥", ["ولسنا نعني بالعلم في هذه المواضع إلا غلبة الظن، فمتى غلب على ظنه أنه يصيبه مكروه لم يجب عليه الإنكار، وإن غلب على ظنه أنه لا يصيبه مكروه وجب، فإن شك، فإن مجرد التجويز لا يسقط الوجوب، ولا اعتبار بحالة الجبان، فإنه يخاف وقوع ما لا يقع، ولا بالشجاع المتهور الذي يبعد وقوع المكروه، بل الاعتبار بالمعتدل الطبع السليم المزاج.", "ونعني بالمكروه: الضرب أو القتل، فلو علم أنه لا يضرب بل يسود وجهه ويشهر في البلد رخص له في السكوت؛ لأن هذا مؤلم للقلب أكثر من الضرب، وكذلك إذا علم أنه ينهب ماله، إلا أنه يبقى الاستحباب له في هذين الموضعين.", "فأما السب والشتم، فليس بعذر في السكوت؛ لأن الآمر بالمعروف لا بد أن يلقى ذلك.", "فإن قيل: فلو قصد إنسان قطع طرف آخر أفيقاتل على هذا؟", "فإن قلتم: نعم، وكيف يتعرض بإتلاف نفس لخوف إتلاف طرف؟ قلنا نمنعه عن ذلك ونقاتله؛ لأنه ليس غرضنا حفظ الطرف فقط، بل حسم سبيل المنكرات،", "وقتله في الإنكار عليه ليس بمعصية، وقطعه الطرف معصية، فصار كدفع الصائل على مال مسلم بما يأتي على قتله، فإنه جائز لا لأجل افتداء درهم بروح، بل لأن أخذ أموال المسلمين معصية، وقتله في الدفع عن المعصية ليس بمعصية.", "**الركن الثاني للحسبة:** ما فيه الحسبة: وهو كل منكر موجود في الحال ظاهر للمحتسب بغير تجسس، معلوم كونه منكرا بغير اجتهاد، فهذه أربعة شروط فلنبحث(١) عنها:", "**الأول:** كونه منكرا، ونعني بذلك كونه محذور الوقوع في الشرع، وعدلنا من لفظ المعصية إلى هذا؛ لأن المنكر أعم من المعصية، إذ من رأى صبيا أو مجنونا يشرب الخمر، فعليه أن (٢-٢)يريق خمره ويمنعه، وكذلك إذا رأى مجنونا يزني بمجنونة أو بهيمة، فعليه أن(٢-٢) يمنعه منه، وذلك لا يسمى معصية في حق المجنون، فلفظ المنكر أدل عليه وأعم من لفظ المعصية، وقد أدرجنا في عموم هذا الصغيرة والكبيرة.", "**الشرط الثاني:** أن يكون موجودا في الحال، وهو احتراز عن الحسبة على من فرغ من شرب الخمر، فإن ذلك ليس إلى الآحاد، واحتراز عما سيوجد في ثاني الحال، كمن يعلم بقرينة حاله أنه عازم على الشرب الليلة، فلا حسبة عليه إلا بالوعظ، وإن لم يعلم عزمه على ذلك لم يجز وعظه فيه؛ لأن في ذلك إساءة ظن بالمسلم.", "**الشرط الثالث:** أن يكون المنكر ظاهرا للمحتسب بغير تجسس، فكل من ستر معصية في داره وأغلق بابه لم يجز أن يتجسس عليه إلا أن يظهر من ذلك ما يعرفه من هو خارج الدار، كأصوات المزامير والعيدان، فلمن سمع ذلك أن يدخل ويكسر الملاهي، وكذلك إذا ارتفعت أصوات السكارى بالكلمات المألوفة بينهم، فسمعها أهل الشارع، فإن فاحت رائحة الخمر فالأظهر جواز الإنكار، وكذلك إذا", "حاشية: (١) تحرفت في (ظ) إلى: «فليجتنب».", "حاشية: (٢-٢) سقط من (ظ)."]], "ic": "book"}, {"story": ["الباب الثاني في أركان الأمر بالمعروف وشروطه (٦ من ١٢)، ص٥١٧", ["كان العود معطى، فإن شكله يعرف كما تعرف الخمر بالرائحة، فأما إذا كانت الآنية تحت ذيل فاسق لم يجز أن يتعرض بها لجواز أن يكون خلا، وليس لأحد أن يقول له: أرني لأنظر. فإنه تجسس.", "**الشرط الرابع:** أن يكون كونه منكرا معلوما بغير اجتهاد، فكل ما هو في محل الاجتهاد فلا حسبة فيه، فليس للحنفي أن ينكر على الشافعي أكله متروك التسمية، ولا للشافعي أن ينكر على الحنفي شربه النبيذ الذي ليس بمسكر.", "**الركن الثالث: المحتسب عليه:** وشرطه أن يكون بصفة يصير الفعل الممنوع منه في حقه منكرا، ويكفي في ذلك كونه إنسانا، ولا يشترط كونه مكلفا، فقد بينا أن الصبي لو شرب الخمر منع منه، واحتسب عليه، وإن كان قبل البلوغ، ولا يشترط كونه مميزا، فقد بينا أن المجنون لو كان يزني بمجنونة أو يأتي بهيمة وجب منعه.", "فإن قيل: فاكتف بكونه حيوانا ولا تشترط كونه إنسانا، فإن البهيمة لو أفسدت زرعا لمنعناها كما يمنع المجنون من الزنا.", "قلنا: لا وجه لتسمية منع البهيمة حسبة؛ لأن الحسبة منع عن منكر لحق الله تعالى، وصيانة للممنوع من مقارفة المنكر، ولسنا نمنع البهيمة صيانة لها، بل لحفظ مال المسلم.", "**الركن الرابع: نفس الاحتساب:** وله درجات وآداب.", "فأولها التعرف، ثم التعريف، ثم النهي ثم الوعظ والنصح، ثم السب والتعنيف، ثم التغيير باليد، ثم التهديد بالضرب، ثم إيقاع الضرب وتحقيقه، ثم شهر السلاح، ثم الاستظهار فيه بالأعوان والجنود.", "**أما الدرجة الأولى:** فهو التعرف، ونعني به طلب المعرفة بجريان المنكر، وذلك منهي عنه، وهو التجسس الذي ذكرناه، فلا ينبغي أن يسترق السمع على دار غيره ليسمع صوت الأوتار، ولا أن يتعرض للشم ليدرك رائحة الخمر، ولا أن", "يمس ما قد ستر بثوب ليعرف شكل المزمار، ولا أن يستخبر جيرانه ليخبروه بما يجري، بلى لو أخبره عدلان ابتداء من غير استخبار أن فلانا يشرب الخمر في داره، أو أن في داره خمرا أعده للشرب، فله إذ ذاك أن يدخل ولا يلزمه الاستئذان.", "**الدرجة الثانية: التعريف،** فإن الجاهل يقدم على الشيء لا يظنه منكرا، فإذا عرف أقلع عنه، كالسوادي(١) يصلي ولا يقيم الركوع والسجود، فيجب تعريفه باللطف أن هذه ليست صلاة، ولولا أنه يريد الصلاة لترك أصل الصلاة، ومن ضمن التعريف نسبة إلى الجهل، والتجهيل إيذاء، والطباع أحرص على ستر عورة الجهل أكثر منها على ستر العورة الحقيقية؛ لأن الجهل قبح في صورة النفس، وسواد في وجه القلب وقبح السوءة يرجع إلى صورة البدن، والنفس أشرف من البدن، وقبحها أشد من قبح البدن، فيعظم تألم الإنسان بظهور جهله، ويعظم ابتهاجه في نفسه بعلمه، ثم لذته عند ظهور جمال علمه لغيره."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "أحدهما: أن لا يباشر بيده التغيير ما لم يعجز عن تكليف المحتسب عليه ذلك، فإذا أمكنه أن يكلفه المشي في الخروج عن الأرض المغصوبة والمسجد، فلا ينبغي أن ____ أو يجره، وإذا قدر على أن يكلفه إراقة الخمر", "o": ["يدفعه", "كحامل", "بالربا", "فيتصدق"], "h": "راجع: ص٥٢٠"}, {"t": "fill", "d": 2, "q": "مؤديا أحد الفرضين، وكان عقابه أقل ممن يترك الوضوء والصلاة جميعا، فليكن من ترك النهي والانتهاء أكبر عقابا ممن نهى ولم ينته، كيف والوضوء شرط لا يراد لنفسه بل للصلاة، فلا حكم له دون الصلاة، فأما الحسبة فليست شرطا في الانتهاء والائتمار، فلا ____ بينهما", "o": ["مشابهة", "متقاضي", "المماراة", "معدي"], "h": "راجع: ص٥١٢"}, {"t": "fill", "d": 2, "q": "وقال فتح بن شخرف: تعلق رجل بامرأة وبيده سكين لا يدنو منه أحد إلا عقره، وكان شديد البدن، فبينا الناس كذلك والمرأة تصيح مر بشر بن الحارث فدنا منه وحك كتفه ____ الرجل إلى الأرض ومرت المرأة ومضى بشر،", "o": ["فوقع", "مودة", "أتلفه", "القصب"], "h": "راجع: ص٥٢٦"}, {"t": "fill", "d": 2, "q": "أنبأنا عبد الأول بن عيسى قال: أخبرنا الداودي قال: أخبرنا ابن أعين قال: حدثنا الفربري قال: حدثنا البخاري قال: حدثنا علي بن عبد ____ قال: حدثنا سفيان قال: حدثنا الأعمش عن أبي وائل عن أسامة عن النبي ﷺ", "o": ["الله", "أواني", "عذاب", "متنزها"], "h": "راجع: ص٥٢٤"}, {"t": "fill", "d": 2, "q": "فإن قيل: في الأمر بالمعروف إثبات سلطنة وولاية على المحكوم عليه، ولذلك لم يثبت للكافر على المسلم مع كونه حقا، فينبغي أن لا يثبت لآحاد الرعية إلا ____ من", "o": ["بتفويض", "فريق", "يوحش", "والأشنان"], "h": "راجع: ص٥١٢"}, {"t": "fill", "d": 2, "q": "الركن الثالث: المحتسب عليه: وشرطه أن يكون بصفة يصير الفعل الممنوع منه في حقه منكرا، ويكفي في ذلك كونه ____، ولا يشترط كونه مكلفا، فقد بينا أن الصبي لو شرب الخمر منع منه، واحتسب عليه، وإن كان", "o": ["إنسانا", "ومطلب", "والفطر", "بكتاب"], "h": "راجع: ص٥١٧"}]}, {"t": "الباب الثاني في أركان الأمر بالمعروف وشروطه - القسم ٢ من ٢", "b": [{"story": ["الباب الثاني في أركان الأمر بالمعروف وشروطه (٧ من ١٢)، ص٥١٨", ["وإذا كان التعريف كشفا للعورة مؤذيا للقلب، فلا بد أن يعالج دفع أذاه بلطف الرفق. فيقال له: يا هذا، إن الإنسان لا يولد عالما، ولقد كنا جاهلين بأمور الصلاة حتى علمنا العلماء، ولعل قريتك خالية عن أهل العلم، أو عالمها مقصر في شرح الصلاة وإيضاحها فهكذا يتلطف به ليحصل التعريف من غير إيذاء، ومن اجتنب محذور السكوت عن المنكر واستبدل عنه محذور الإيذاء للمسلم مع الاستغناء عنه، فقد غسل الدم بالبول.", "فأما إذا وقفت على خطأ من غير أمر الدين، فلا ينبغي أن ترده عليه، فإنه يستفيد منك علما ويصير لك عدوا، إلا إذا علمت أنه يغتنم العلم، وذلك عزيز جدا.", "**الدرجة الثالثة:** النهي بالوعظ والنصح والتخويف بالله، وذلك فيمن يقدم على الأمر وهو عالم بكون منكرا، أو فيمن أصر عليه بعد أن عرف أنه منكر، كالذي", "حاشية: (١) السوادي: المنسوب إلى السواد، وهو القرى والمزارع المحيطة بالمدينة.", "يواظب على الشرب، أو الظلم، أو الغيبة، فينبغي أن يوعظ ويخوف بالله تعالى، وتورد عليه الأخبار الواردة بالوعيد في ذلك ويحكى له سيرة السلف وعادة المتقين، وكل ذلك بشفقة ولطف من غير عنف وغضب(١)، بل ينظر إليه نظر الراحم له، ويرى إقدام ذلك على المعصية مصيبة في نفسه هو؛ لأن المسلمين كنفس واحدة وهاهنا آفة عظيمة، ينبغي أن يتوقاها فإنها مهلكة، وهي أن العالم يرى عند التعريف عز نفسه بالعلم، وذل غيره بالجهل، فربما يقصد بالتعريف الإذلال وإظهار التميز بشرف العلم، وإذلال صاحبه بالنسبة إلى خسة الجهل، فإن كان الباعث هذا فهذا المنكر أقبح في نفسه من المنكر الذي يعترض عليه، ومثال هذا المحتسب مثال من يخلص غيره من النار بإحراق نفسه، وهو غاية الجهل.", "وهذه مزلة(٢) عظيمة وغائلة هائلة، وغرور للشيطان يتدلى بحبله كل إنسان إلا من عرفه الله تعالى عيوب نفسه، وفتح بصيرته بنور هدايته، فإن في الاحتكام على الغير لذة للنفس عظيمة من وجهين: أحدهما: من جهة دالة العلم، والآخر من جهة دالة الاحتكام والسلطنة، وذلك يرجع إلى الرياء وطلب الجاه، وهو الشهوة الخفية المتداعية إلى الشرك الخفي، وله محك ومعيار ينبغي أن يمتحن به(٣) المحتسب نفسه، وهو أن يكون امتناع ذلك الإنسان عن المنكر بنفسه أو باحتساب غيره أحب إليه من امتناعه باحتسابه، فإن كانت الحسبة شاقة عليه ثقيلة على نفسه، وهو يود أن يكفى بغيره فليحتسب، فإن باعثه هو الدين، وإن كان اتعاظ ذلك العاصي بوعظه وانزجاره بزجره أحب إليه من اتعاظه بوعظ غيره، فما هو إلا متبع(٤) هوى نفسه ويتوسل إلى إظهاره جاه نفسه بواسطة حسبته، فليتق الله تعالى، وليحتسب أولا على نفسه، وعند هذا يقال له: عظ نفسك، فإن اتعظت، فعظ الناس وإلا فاستحي مني.", "حاشية: (١) ليست في الأصل.", "حاشية: (٢) تحرفت في (ظ) إلى: «منزلة».", "حاشية: (٣) سقطت من الأصل."]], "ic": "book"}, {"story": ["الباب الثاني في أركان الأمر بالمعروف وشروطه (٨ من ١٢)، ص٥١٩", ["حاشية: (٤) في الأصل: «متبع».", "وقيل لداود الطائي: أرأيت رجلا دخل على هؤلاء الأمراء فأمرهم بالمعروف ونهاهم عن المنكر؟ قال: أخاف عليه السوط. قيل: هو يقوى عليه. قال: أخاف عليه السيف. قيل: إنه يقوى. قال: أخاف عليه الداء الدفين العجب.", "إلا أن في هذا دقيقة خفية، وهي أنه يجب أن يزول المنكر بإنكاره ليكون له أجر الإنكار، لا نظرا إلى دالة العلم ولا إلى الاحتكام وهذا يندر.", "**الدرجة الرابعة:** السب والتعنيف بالقول الغليظ الخشن، وإنما يعدل إلى هذا عند العجز عن المنع باللطف وظهور مبادئ الإصرار والاستهزاء بالوعظ والنصح، وذلك مثل قول إبراهيم عليه السلام: ﴿أُفٍّ لَّكُمْ وَلِمَا تَعْبُدُونَ مِن دُونِ ٱللَّهِ ۖ أَفَلَا تَعْقِلُونَ﴾ [الأنبياء: ٦٧]، ولسنا نعني بالسب الفحش والكذب بل أن يخاطبه بما فيه مما لا يعد فحشا، كقوله: يا فاسق، يا أحمق، يا جاهل، ألا تخاف الله، وكقوله: يا سوادي، يا غبي وما يجري هذا المجرى، فإن كل فاسق أحمق وجاهل، ولولا حمقه لما عصى الله تعالى، ولهذه الرتبة أدبان:", "**أحدهما:** أن لا يقدم عليه إلا عند الضرورة والعجز عن اللطف.", "**والثاني:** أن لا ينطق إلا بالصدق، ولا يسترسل فيه، فينطلق لسانه بما لا يحتاج إليه، بل يقتصر على قدر الحاجة، فإن علم أن خطابه بهذه الكلمات لا يزجره، فليقتصر على إظهار الغضب والاحتقار له، والازدراء بمحله لأجل المعصية، وإن علم أنه إن تكلم ضرب ولو اكفهر وأظهر الكراهة بوجه لم يضرب لزمه ولم يكفه الإنكار بالقلب بل يلزمه أن يقطب وجهه ويظهر الإنكار.", "**الدرجة الخامسة:** التغيير باليد، وذلك ككسر الملاهي وإراقة الخمر وإخراجه من الدار المغصوبة، وفي هذه الدرجة أدبان:", "**أحدهما:** أن لا يباشر بيده التغيير ما لم يعجز عن تكليف المحتسب عليه ذلك، فإذا أمكنه أن يكلفه المشي في الخروج عن الأرض المغصوبة والمسجد، فلا ينبغي أن يدفعه أو يجره، وإذا قدر على أن يكلفه إراقة الخمر وكسر الملاهي، فلا ينبغي أن يباشر ذلك بنفسه."]], "ic": "book"}, {"story": ["الباب الثاني في أركان الأمر بالمعروف وشروطه (٩ من ١٢)، ص٥٢١", ["**الثاني:** أن يقتصر في طريق التغيير على القدر المحتاج إليه، وهو أن لا يجره برجله إذا قدر على جره بيده، فإن زيادة الأذى فيه مستغنى عنه ولا يحرق الملاهي بل يبطل صلاحيتها للفساد بالكسر، وحد الكسر أن تصير إلى حال يحتاج في استئناف إصلاحها إلى تعب يساوي تعب الاستئناف من الخشب ابتداء، ويتوقى في إراقة الخمور كسر الأواني إن وجد إليه سبيلا، فإن لم يقدر إلا بأن يرمي ظروفها بحجر فله ذلك، وتسقط قيمة الظروف لأنها كانت حائلا(١) بينه وبين الخمر، ولو ستر الخمر بيديه لكنا نقصد يديه بالضرب لنتوصل إلى إراقة الخمر فإنه لا تزيد حرمة ملكه في الظروف على حرمة نفسه، ولو كانت الخمر في قوارير ضيقة الرؤوس، فإذا اشتغل بإراقتها طال الزمان وأدركه الفساق فمنعوه، فله كسرها، فهذا عذر، وإن لم يحذر من الفساق لكن كان يضيع زمانه وتتعطل أشغاله في صبها فله كسرها، فإن تيسرت الإراقة كالكسر لم يجز له أن بكسر.", "فإن قيل: فهلا جاز الكسر زجرا والجر بالرجل في الإخراج من الدار المغصوبة زجرا؟", "قلنا: إنما يكون الزجر عن المستقبل، والعقوبة على الماضي، والدفع عن الحاضر الراهن، وليس إلى آحاد الرعية إلا الدفع، وهو إعدام المنكر، فما زاد على قدر إعدام المنكر فهو إما عقوبة على جريمة سابقة، أو زجر عن لاحق، وذلك إلى الولاة لا إلى الرعية، فللوالي أن يفعل ذلك إذا رأى المصلحة فيه.", "فإن قيل: فهلا جاز للسلطان تخريب ديار الفساق زجرا؟", "قلنا: لو ورد الشرع بذلك لم يكن خارجا عن سنن المصالح، ولكنا لا نبتدع المصالح بل نتبع فيها، وكسر الظروف قد كان في بداية الشرع عند شدة الحاجة إلى الزجر، وتركه بعد ذلك لعدم شدة الحاجة لا يكون نسخا، بل الحكم يزول بزوال العلة، ويعود بعودها، وإنما جوزنا ذلك للإمام بحكم الاتباع ومنعنا منه آحاد الرعية لخفاء وجه الاجتهاد فيه، فنقول: لو أريقت الخمور أولا لم يجز كسر الأواني", "حاشية: (١) في (ظ): «حائلة».", "بعدها، وإنما جاز كسرها تبعا للخمر، فإذا خلت عنها، فهو إتلاف مال إلا أن تكون ضارية(١) بالخمر لا تصلح إلا لها، فكأن الفعل المنقول عن العصر الأول كان مقرونا بمعنيين: أحدهما: شدة الحاجة إلى الزجر، والآخر: تبعية الظروف للخمر التي هي مشغولة بها، وهما معنيان مؤثران لا سبيل إلى حذفهما، ومعنى ثالث وهو صدور هذا عن رأي صاحب الأمر لعلمه بشدة الحاجة إلى الزجر، وهما معنيان مؤثران لا سبيل إلى حذفهما، ومعنى ثالث وهو صدور هذا عن رأي صاحب الأمر لعلمه بشدة الحاجة إلى الزجر، وهو معنى مؤثر، فلا سبيل إلى الغاية، فهذه تصرفات دقيقة فقهية يحتاج المحتسب إلى معرفتها.", "**الدرجة السادسة:** التهديد والتخويف، كقوله: دع عنك هذا وإلا فعلت بك كذا وكذا. وهذا ينبغي أن يقدم على تحقيق الضرب إذا أمكن تقديمه."]], "ic": "book"}, {"story": ["الباب الثاني في أركان الأمر بالمعروف وشروطه (١٠ من ١٢)، ص٥٢٢", ["والأدب في هذه الرتبة أن لا يهدده بوعيد لا يجوز له تحقيقه، كقوله: لأنهبن دارك أو لأسبين زوجتك؛ لأنه إن قال ذلك عن عزم، فهو حرام، وإن قال عن غير عزم، فهو كذاب، وله أن يزيد في الوعيد على ما هو عزمه الباطن إذا علم أن ذلك مما يردعه.", "**الدرجة السابعة:** مباشرة الضرب باليد والرجل وغير ذلك، مما ليس(٢) فيه إشهار سلاح، وذلك جائز للآحاد بشرط الضرورة، والاقتصار على قدر الحاجة في الدفع، فإذا اندفع المنكر فينبغي أن يكف.", "**الدرجة الثامنة:** أن لا يقدر عليه بنفسه، ويحتاج إلى أعوان يشهرون السلاح، وربما يستمد الفاسق أيضا بأعوانه ويؤدي إلى القتال، فهذا مما اختلف فيه، فقال قوم: لا يحتاج إلى إذن الإمام، فإن آحاد الغزاة يجوز لهم قتال الكفار، فكذلك آحاد الناس لهم قمع أهل الفساد. وقال آخرون: يحتاج إلى إذن الإمام؛ لأنه يؤدي إلى الفتن وهيجان الفساد، وهو الصحيح.", "حاشية: (١) ضارية: أي ملازمة للخمر لا تستخدم إلا لها.", "حاشية: (٢) سقطت من الأصل.", "**بيان آداب(١) المحتسب**", "قد ذكرنا تفاصيل الآداب في آحاد الدرجات، ونذكر الآن جملها ومصادرها فنقول: جميع آداب المحتسب مصدرها ثلاث صفات في المحتسب: العلم، والورع، وحسن الخلق.", "**أما العلم:** فليعلم مواقع الحسبة، وحدودها، ومجاريها، ومواقعها ليقتصر على حد الشرع فيه.", "**والورع:** ليزعه عن مخالفة معلومه، فما كل من علم عمل بعلمه، بل ربما يعلم أنه مسرف في الحسبة وزائد على الحد المأذون شرعا، ولكن يحمله عليه غرض من الأغراض، وليكون كلامه ووعظه مقبولا، فإن الفاسق يهزأ به إذا احتسب، ويورث ذلك جرأة.", "**وأما حسن الخلق:** فليتمكن من اللطف والرفق، وهو أصل الباب وأساسه، فإن الغضب إذا هاج لم يكف مجرد العلم والورع في قمعه ما لم يكن في الطبع قبول له بحسن الخلق، وعلى التحقيق فلا يتم الورع إلا مع حسن الخلق والقدرة على ضبط الشهوة والغضب، وبه يصبر المحتسب على ما أصابه في دين الله تعالى، وإلا فإذا أصيب بشتم أو ضرب نسي الحسبة وغفل عن دين الله تعالى، واشتغل بنفسه، بل ربما يقدم عليه ابتداء لطلب الجاه والاسم.", "فهذه الصفات الثلاث بها تصير الحسبة من القربات، وبها تندفع المنكرات، وإن فقدت لم يندفع المنكر.", "وربما كانت الحسبة أيضا منكرة لمجاوزة حد الشرع فيها، ولهذا قال بعض السلف: لا يأمر بالمعروف إلا رفيق فيما يأمر به، رفيق فيما ينهى عنه، حليم فيما يأمر به، حليم فيما ينهى عنه، فقيه فيما يأمر به، فقيه فيما ينهى عنه.", "حاشية: (١) في (ظ): «أدب».", "وقال الحسن البصري: إذا كنت ممن يأمر بالمعروف، فكن من آخذ الناس به، وإلا هلكت."]], "ic": "book"}, {"story": ["الباب الثاني في أركان الأمر بالمعروف وشروطه (١١ من ١٢)، ص٥٢٤", ["أنبأنا عبد الأول بن عيسى قال: أخبرنا الداودي قال: أخبرنا ابن أعين قال: حدثنا الفربري قال: حدثنا البخاري قال: حدثنا علي بن عبد الله قال: حدثنا سفيان قال: حدثنا الأعمش عن أبي وائل عن أسامة عن النبي ﷺ قال: «يجاء بالرجل يوم القيامة فيلقى في النار، فتندلق أقتابه(١) في النار، فيدور كما يدور الحمار برحاه، فيجتمع أهل النار عليه، فيقولون: أفلان؟ ما شأنك؟ أليس كنت تأمرنا بالمعروف وتنهانا عن المنكر؟ قال: كنت آمركم بالمعروف ولا آتيه، وأنهاكم عن المنكر وآتيه». أخرجاه في الصحيحين. وقد أنشدوا في هذا المعنى:", "لا تلم المرء على فعله  وأنت منسوب إلى مثله", "من عاب شيئا وأتى مثله  فإنما يزري على عقله", "**ومن الآداب:** تقليل العلائق، وقطع الطمع من الخلائق لتزول المداهنة، فقد حكي عن بعض المشايخ أنه كان له سنور، وكان يأخذ من قصاب في جواره كل يوم شيئا من الغدد لسنوره، فرأى على القصاب منكرا، فدخل الدار فأخرج السنور ثم جاء وأنكر على القصاب فقال له: لا أعطيتك بعد هذا شيئا لسنورك. فقال: ما أنكرت عليك إلا بعد إخراج السنور وقطع الطمع منك. وهذا صحيح فإن من لم يقطع الطمع من الناس من شيئين لم يقدر على الإنكار، أحدهما: من لطف ينالونه به، والثاني: من رضاهم عنه وثنائهم عليه.", "**وأما الرفق فمتعين،** فإن موسى عليه السلام لما بعث إلى فرعون قيل له: ﴿فَقُولَا لَهُۥ قَوْلًا لَّيِّنًا﴾ [طه: ٤٤] أخبرنا محمد بن أبي منصور قال: أخبرنا أبو المطهر الأصبهاني قال: أخبرنا أبو نعيم أحمد بن عبد الله قال: حدثنا سليمان بن أحمد قال: حدثنا إسحاق بن إبراهيم قال: حدثنا عبد الرزاق قال: حدثنا معمر عن أيوب عن أبي قلابة أن أبا الدرداء مر على رجل قد أصاب ذنبا، فكانوا يسبونه، فقال: أرأيتم", "حاشية: (١) أقتابه: أمعاؤه.", "لو وجدتموه في قليب(١) ألم تكونوا مستخرجيه؟ قالوا: بلى. قال: فلا تسبوا أخاكم، واحمدوا الله الذي عافاكم. قالوا: فلا تبغضه قال: إنما أبغض عمله، فإذا تركه فهو أخي.", "أخبرنا محمد بن أبي منصور قال: أخبرنا جعفر بن أحمد السراج قال: أخبرنا الحسن بن علي التميمي قال: أخبرنا أبو بكر بن جعفر قال: حدثنا عبد الله بن أحمد قال: حدثني هارون بن عبد الله قال: حدثنا سيار قال: حدثنا جعفر قال: حدثنا ثابت البناني قال: كان صلة بن أشيم يخرج إلى الجبان(٢) فيتعبد فيها، فكان يمر عليه شباب يلهون ويلعبون، فيقول لهم: أخبروني عن قوم أرادوا سفرا فحادوا النهار عن الطريق وباتوا بالليل، متى يقطعون سفرهم؟ قال: فكان كذلك يمر بهم فيعظهم قال: فمر بهم ذات يوم فقال لهم هذه المقالة فقال شاب منهم: يا قوم إنه والله ما يعني بهذا غيرنا نحن بالنهار نلهو وبالليل ننام. ثم اتبع صلة فلم يزل يختلف معه إلى الجبان ويتعبد معه حتى مات."]], "ic": "book"}, {"story": ["الباب الثاني في أركان الأمر بالمعروف وشروطه (١٢ من ١٢)، ص٥٢٥", ["ومر بصلة بن أشيم فتى يجر ثوبه فهم أصحاب صلة أن يأخذوه بألسنتهم أخذا شديدا، فقال صلة: دعوني أكفكم أمره. ثم قال له: يا ابن أخي إن لي إليك حاجة. قال: ما هي؟ قال: أحب أن ترفع إزارك. قال: نعم ونعمى عين. فرفع إزاره، فقال صلة لأصحابه: هذا كان أمثل مما أردتم لو شتمتموه وآذيتموه لشتمكم.", "وقال سليمان التيمي: ما أغضبت أحدا فقبل منك.", "ودعي الحسن البصري إلى عرس فجيء بجام من فضة فيه خبيص أو طعام، فتناوله فقلبه على رغيف فأصاب منه، فقال رجل: هذا نهي في سكون.", "ورأى محمد بن المنكدر رجلا مع امرأة في خراب وهو يكلمها، فقال: إن الله يراكما، سترنا الله وإياكما.", "حاشية: (١) القليب: البئر.", "حاشية: (٢) الجبان والجبانة: المقبرة.", "وقال فتح بن شخرف: تعلق رجل بامرأة وبيده سكين لا يدنو منه أحد إلا عقره، وكان شديد البدن، فبينا الناس كذلك والمرأة تصيح مر بشر بن الحارث فدنا منه وحك كتفه فوقع الرجل إلى الأرض ومرت المرأة ومضى بشر، فدنوا من الرجل وهو يرشح عرقا فسألوه: ما حالك؟ فقال: ما أدري، ولكن حاكني شيخ وقال: إن الله عز وجل ناظر إليك وإلى ما تعمل. فضعفت لقوله قدمي وهبته هيبة شديدة لا أدري من ذلك الرجل. فقالوا له: ذاك بشر بن الحارث. فقال: واسوأتاه، كيف ينظر إلي بعد اليوم؟ وحم الرجل من يومه ومات في اليوم السابع.", "وقد سبق في باب الحب والبغض في الله من هذا الجنس أيضا، وهذا تمام النظر في درجات الاحتساب."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "الدرجة الثامنة: أن لا يقدر عليه بنفسه، ويحتاج إلى أعوان يشهرون السلاح، وربما يستمد الفاسق أيضا بأعوانه ويؤدي إلى القتال، فهذا مما اختلف فيه، فقال قوم: لا يحتاج إلى إذن ____، فإن آحاد الغزاة", "o": ["الإمام", "اعتقادك", "مسروقا", "صحاحا"], "h": "راجع: ص٥٢٢"}, {"t": "fill", "d": 2, "q": "فإن قيل: فهل تثبت الحسبة للولد على الوالد؟ والعبد على ____؟ والزوجة على الزوج؟ والرعية على", "o": ["السيد", "النادرة", "بصره", "البر"], "h": "راجع: ص٥١٤"}, {"t": "fill", "d": 2, "q": "إلا أن في هذا دقيقة خفية، وهي أنه يجب أن يزول المنكر بإنكاره ليكون له أجر ____، لا نظرا إلى دالة العلم ولا إلى الاحتكام وهذا يندر", "o": ["الإنكار", "للشرب", "الخبز", "العورات"], "h": "راجع: ص٥٢٠"}, {"t": "fill", "d": 2, "q": "واعلم أن أمر الفاسق بالمعروف ونهيه عن المنكر لا يفيد، لعلم الناس بفسقه، بل إن قدر على ____ أفاد، كإراقته الخمور وكسره للملاهي", "o": ["المنع", "وراءهم", "بالبيان", "فانجر"], "h": "راجع: ص٥١٢"}, {"t": "fill", "d": 2, "q": "وقتله في الإنكار عليه ليس بمعصية، وقطعه الطرف معصية، فصار كدفع الصائل على مال مسلم بما يأتي على قتله، فإنه جائز لا لأجل افتداء درهم بروح، بل لأن أخذ ____ المسلمين معصية، وقتله في الدفع عن المعصية ليس بمعصية", "o": ["أموال", "وكمن", "الفكرة", "تلجئه"], "h": "راجع: ص٥١٦"}, {"t": "fill", "d": 2, "q": "فأما إذا وقفت على خطأ من غير أمر الدين، فلا ينبغي أن ترده عليه، فإنه يستفيد منك علما ويصير لك عدوا، إلا إذا علمت أنه ____ العلم، وذلك عزيز جدا", "o": ["يغتنم", "مؤثرا", "والمراد", "مجال"], "h": "راجع: ص٥١٨"}]}], "sum": [["الصفحات", "ص٥١٠ - ص٥٢٦"]], "_nq": 12}, {"id": "l39", "title": "الباب الثالث في المنكرات المألوفة في العادات", "group": "كتاب الأمر بالمعروف والنهي عن المنكر", "map": {"center": "الباب\nالثالث في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الثالث في المنكرات المألوفة في العادات", "b": [{"pic": ["books", "book"], "cap": "ص٥٢٧ - ص٥٣٢"}, {"story": ["الباب الثالث في المنكرات المألوفة في العادات (١ من ٤)، ص٥٢٧", ["**في المنكرات المألوفة في العادات**", "نشير منها إلى جمل يستدل بها على أمثالها إذ لا مطمع في حصرها واستقصائها، فمن ذلك:", "**منكرات المساجد:** اعلم أن المنكرات تنقسم إلى مكروهة وإلى محظورة، فإذا قلنا: هذا منكر مكروه، فاعلم أن المنع منه مستحب والسكوت عنه مكروه، وليس بحرام، إلا إذا لم يعلم الفاعل أنه مكروه، فينبغي أن يعرف؛ لأن الكراهة حكم في الشرع ينبغي تبليغه إلى من لا يعرفه، وإذا قلنا: منكر محظور، أو قلنا: منكر، مطلقا، فإنا نريد به المحظور، ويكون السكوت عنه مع القدرة محظورا.", "فمما يشاهد كثيرا في المساجد إساءة الصلاة بترك الطمأنينة في ركوعها وسجودها، وهو منكر مبطل للصلاة، فيجب النهي عنه، إلا للحنفي الذي يعتقد أن ذلك لا يمنع صحة الصلاة، ومن رأى منكرا فسكت عن إنكاره شارك(١) الفاعل في الإثم، وكذلك كل ما يقدح في الصلاة من نجاسة على ثوب المصلي لا يراها، وانحراف عن القبلة بسبب ظلام أو عمى، فكل ذلك تجب الحسبة فيه.", "ومنها: اللحن في القراءة، فإنه يجب النهي عنه، وتلقين الصحيح، واشتغال المعتكف بإنكار هذه الأشياء وتعريفها أفضل من ذكره وتطوعه؛ لأن هذا فرض، وفائدة الأمر به تتعدى، فهي أفضل من نافلة تقتصر عليه.", "ومنها: تراسل المؤذنين(٢) في الأذان وتطويلهم مد كلماته، أو انفراد كل واحد", "حاشية: (١) في الأصل: «يشارك».", "حاشية: (٢) تراسل المؤذنين: هو أن يجتمعوا على الأذان فيبدأ أحدهم ويمد صوته ثم يسكت ويأخذ غيره في مد الصوت ثم يرجع الأول وهكذا إلى آخر الأذان.", "منهم بأذان قبل إتمام الآخر، وذلك يوجب تخليط جواب الأذان على الحاضرين، فهذه منكرات مكروهة ينبغي أن تعرف ويمنع منها.", "ومنها: ما يخلط به المؤذن الأذان من التسبيحات والأذكار قبل الأذان وبعده حتى لا يتميز الأذان من غيره.", "ومن ذلك: أن يكون على الخطيب ثوب حرير، أو بيده سيف مذهب.", "ومن ذلك: ما يجري من القصاص في المساجد من الكذب والأشياء المنهي عنها، كالخوض الموجب للفتن، أو ذكر ما يوجب الرجاء وحده ويجري على المعاصي كان منكرا، أو كان الرجال مختلطين بالنساء، فينبغي إنكار ذلك عليهم، وقد ذكرت من هذا طرفا في كتاب القصاص.", "ومنها: الحلق(١) يوم الجمعة لبيع الأدوية والأطعمة والتعويذات، وقيام السؤال وإنشادهم الأشعار، ونحو هذا، فهذه منها ما هو حرام لكونه تلبيسا وكذبا كالكذابين من طرقية الأطباء وأهل الشعبذة وبيع التعويذات في الأغلب، فإن أصحابها يلبسون على الصبيان والسوادية، فهذا ممنوع منه في المسجد وخارج المسجد.", "ومنها: ما هو مباح خارج المسجد، كالخياطة وبيع الأدوية والكتب والأطعمة، فهذا في المسجد أيضا لا يحرم إذا كان في أوقات نادرة إلا بعارض، وهو أن يضيق المكان على المصلين ويكدر عليهم صلاتهم، فأما اتخاذ المسجد دكانا على الدوام فيحرم."]], "ic": "book"}, {"story": ["الباب الثالث في المنكرات المألوفة في العادات (٢ من ٤)، ص٥٢٨", ["ومنها: دخول الصبيان والمجانين والسكارى إلى المسجد، فأما الصبي؛ فيجوز دخوله إلا أن يتخذ المكان ملعبا على الدوام، فيمنع، وأما المجنون؛ فلا بأس بدخوله إلا أن يخشى تلويثه المكان أو نطقه بالفحش أو تعاطيه المنكر ككشف العورة، فأما المجنون الساكن الساكت، فلا يجب إخراجه من المسجد. والسكران", "حاشية: (١) الحلق: جمع حلقة، أي اتخاذ الحلق يوم الجمعة.", "في معنى المجنون، فإن خيف منه القيء أو الإيذاء باللسان، وجب إخراجه، وإن كان ريحه تفوح أخرج فإن النبي ﷺ نهى من أكل البصل والثوم أن يحضر المسجد، وهما مباحان فكيف بريح الخمر؟", "**منكرات الأسواق:** من المنكرات المعتادة في الأسواق الكذب في المرابحة وإخفاء العيب، فمن قال: اشتريت هذه السلعة بعشرة وأربح فيها درهما، وكان كاذبا، فهو فاسق، وعلى من عرف ذلك أن يخبر المشتري بكذبه فإن سكت مراعاة لقلب البائع كان شريكا له في الخيانة، وكذا إذا علم به عيبا لزمه أن ينبه المشتري عليه، لئلا يضيع مال المسلم، وكذلك بيع الثوب المقصور الذي يوهم أنه جديد، وكذلك تلبيس انخراق الثوب بالرفو، وكل تلبيس، وكذلك التفاوت في الميزان والذراع يجب على كل من عرفه تغييره بنفسه أو رفعه إلى الوالي حتى يغيره.", "ومنها: الشروط الفاسدة، واستعمال الربا، وبيع الملاهي، وبيع الصور المجسمة.", "**منكرات الشوارع:** من المنكر المعتاد في الشوارع وضع الأساطين وبناء الدكاك متصلة بالأبنية المملوكة، وإخراج الأجنحة، وغرس الأشجار، إذا كان ذلك يؤدي إلى تضييق الطريق واستضرار المارة به، فإن لم يؤد لم يمنع منه، وأما وضع الحطب والطعام في الطريق بمقدار ما ينقل إلى البيوت فجائز، فإن ذلك يشترك في الحاجة إليه الكافة، وكذلك ربط الدواب على الطريق بحيث يضيق الطريق ويؤذي المارين منكر يجب المنع منه إلا بمقدار حاجة النزول والركوب، وهذا لأن الشوارع مشتركة المنفعة، وليس لأحد أن يختص بها إلا بقدر الحاجة.", "ومنها سوق الدواب وعليها الشوك بحيث تمزق ثياب الناس، فذلك منكر إذا أمكن شده وضمه بحيث لا تمزق الثياب أو أمكن العدول بها إلى موضع واسع، فإن لم يمكن لم يمنع منه؛ لأن حاجة أهل البلد تمس إلى ذلك، ولكن لا تترك ملقاة على الشوارع إلا بقدر مدة نقلها، وكذلك تحميل الدواب من الأحمال ما لا تطيقه منكر يجب منع المالك منه، وكذلك ذبح القصاب على باب دكانه وتلويث", "الطريق بالدم منكر يجب المنع منه؛ لأنه إضرار بالناس من جهة تضييق الطريق وترشيش النجاسة واستقذار الطباع ذلك، وكذلك طرح الكناسة على جواد الطرق وتبديد قشور البطيخ أو رش الماء بحيث يخشى منه الزلق؛ والماء الذي يجتمع من ميزاب معين فعلى صاحبه رفعه، فإن كان من المطر فعلى الولاة تكليف الناس رفع ذلك، وليس للآحاد في ذلك إلا الوعظ فقط."]], "ic": "book"}, {"story": ["الباب الثالث في المنكرات المألوفة في العادات (٣ من ٤)، ص٥٣٠", ["**منكرات الحمامات:** من ذلك صور الحيوانات على باب الحمام أو داخله (١-١)فذلك منكر(١-١)، فيجب إزالته على كل من دخل الحمام أو رأى الصور إن قدر عليها، فإن كان الموضع مرتفعا لا تصل يده إليه لم يجز له الدخول إلا لضرورة، فليعدل إلى حمام آخر، ويكفيه أن يسوه وجوهها بحيث يبطل به تصويرها.", "ومنها: كشف العورات والنظر إليها، ومن جملتها كشف المدلك عن الفخذ وما تحت السرة لتنجية الوسخ أو مس العورة، ولا يجوز للمسلمة أن تكشف بدنها في الحمام للذميات.", "ومنها: غمس اليد والأواني النجسة في المياه القليلة، فإنه منجس للماء إلا أنه إذا فعل ذلك مالكي لم ينكر عليه بل يتلطف به ويقول له: يمكنك أن لا تؤذيني بتقويت الطهارة علي.", "ومن ذلك أن يكون في مداخل بيوت الحمام ومجاري مياهها حجارة مكسرة(٢) ملس مزلقة يزل فيها الغافلون، فهذا مما ينكر على الحمامي إهماله، وكذلك ترك السدر المزلق على أرض الحمام.", "**منكرات الضيافة:** فمن ذلك؛ فرش الحرير للرجال والبخور في مجمرة من فضة أو ذهب، وكذلك الشرب فيهما، واستعمال ماء الورد منهما أو مما رأسه منهما، وكذلك تعليق الستور وفيها الصور، وسماع القينات(٣) والأوتار واطلاع النساء على", "حاشية: (١-١) سقط من الأصل.", "حاشية: (٢) سقطت من الأصل.", "حاشية: (٣) القينات: جمع قينة، وهي المغنية.", "الشباب الذين يخاف فتنتهم، فكل ذلك منكر يجب تغييره، ومن عجز عن تغييره لزمه الخروج.", "وأما الصور على النمارق والبسط فليس بمنكر، ولا يجوز على الأطباق والقصاع، ولا يجوز القعود مع فاسق يلبس الحرير وخاتم الذهب من غير ضرورة.", "وأما تزين النساء بالذهب والحرير، فجائز، ولا رخصة في تثقيب أذن الصبية لأجل تعليق الذهب فيها، فإن ذلك جرح مؤلم ومثله موجب للقصاص، فلا يجوز إلا لحاجة مهمة كالفصد والحجامة والختان، والتزين بالحلق غير مهم بل تعليقه على الأذن تفريط وفي المخانق(١) والإسورة كفاية عنه، فهو حرام والمنع منه واجب، والاستئجار عليه غير صحيح، والأجرة المأخوذة عليه حرام.", "ومنها: أن يكون في الضيافة مبتدع يتكلم في بدعته، فيجوز الحضور لمن يقدر على الرد عليه على عزم الرد، فإن كان لا يقدر عليه لم يجز، وإن كان المبتدع لا يتكلم ببدعته جاز الحضور مع إظهار الكراهة له والإعراض عنه، وإن كان هناك مضحك بالفحش والكذب لم يجز له الحضور، وعند الحضور يجب الإنكار، فإن كان ذلك لمزح لا كذب فيه ولا فحش أبيح ما يقل من ذلك، فأما اتخاذه صناعة وعادة فممنوع."]], "ic": "book"}, {"story": ["الباب الثالث في المنكرات المألوفة في العادات (٤ من ٤)، ص٥٣١", ["ومنها: الإسراف في الطعام والبناء، فإنه منكر، وفي المال منكرات منها الإضاعة ومنها الإسراف، والإضاعة؛ تفويت مال بلا فائدة يعتد بها، كإحراق الثوب وتمزيقه، وهدم البناء من غير غرض، وإلقاء المال في البحر، وفي معناه صرف المال إلى النائحة والمطرب وفي أنواع الفساد؛ لأنها فوائد محرمة شرعا، فصارت كالمعدومة، وأمثال هذه المنكرات كثيرة ولا يمكن حصرها.", "**المنكرات العامة:** من تيقن أن في السوق منكرا يجري على الدوام أو في وقت بعينه وهو قادر على تغييره لم يجز له أن يسقط عنه ذلك بالقعود في بيته، بل يلزمه الخروج، فإن قدر على تغيير البعض لزمه.", "حاشية: (١) المخانق: القلائد التي تعلق في العنق.", "وحق على كل مسلم أن يبدأ بنفسه فيصلحها بالمواظبة على الفرائض وترك المحرمات، ثم يعلم ذلك أهله وأقاربه، ثم يتعدى إلى جيرانه، ثم إلى أهل محلته، ثم إلى أهل بلده، ثم إلى أهل(١) السواد كذلك إلى أقصى العالم، فإن قام بذلك الأدنى سقط عن الأبعد، وإلا خرج به كل قادر عليه.", "حاشية: (١) سقطت من (ظ)."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "ومنها: كشف العورات والنظر إليها، ومن جملتها كشف المدلك عن الفخذ وما تحت السرة لتنجية الوسخ أو مس العورة، ولا يجوز ____ أن تكشف بدنها في الحمام", "o": ["للمسلمة", "أهملها", "الإشارة", "فصولا"], "h": "راجع: ص٥٣٠"}, {"t": "fill", "d": 2, "q": "منكرات الحمامات: من ذلك صور الحيوانات على باب الحمام أو داخله فذلك منكر، فيجب إزالته على كل من دخل الحمام أو رأى الصور إن قدر عليها، فإن كان الموضع مرتفعا لا تصل يده ____ لم يجز له", "o": ["إليه", "تحريما", "وخاتمك", "الدرس"], "h": "راجع: ص٥٣٠"}, {"t": "fill", "d": 2, "q": "ومنها: دخول الصبيان والمجانين والسكارى إلى المسجد، فأما الصبي؛ فيجوز دخوله إلا أن يتخذ المكان ملعبا على الدوام، فيمنع، ____ المجنون؛ فلا بأس بدخوله إلا أن يخشى تلويثه المكان أو نطقه بالفحش أو تعاطيه", "o": ["وأما", "الحلم", "الستور", "تختار"], "h": "راجع: ص٥٢٨"}, {"t": "fill", "d": 2, "q": "المنكرات العامة: من تيقن أن في السوق منكرا يجري على الدوام أو في وقت بعينه وهو قادر على ____ لم يجز له أن يسقط عنه ذلك بالقعود في بيته، بل يلزمه الخروج، فإن قدر على تغيير البعض", "o": ["تغييره", "الأموات", "كالشدة", "ويدل"], "h": "راجع: ص٥٣١"}, {"t": "fill", "d": 2, "q": "ومن ذلك: ما يجري من القصاص في المساجد من الكذب والأشياء المنهي عنها، كالخوض الموجب للفتن، أو ذكر ما يوجب الرجاء وحده ويجري على ____ كان منكرا، أو كان الرجال مختلطين بالنساء، فينبغي إنكار ذلك", "o": ["المعاصي", "وعماله", "فيشترط", "أظلهم"], "h": "راجع: ص٥٢٨"}, {"t": "fill", "d": 2, "q": "منهم بأذان قبل إتمام الآخر، وذلك يوجب تخليط جواب الأذان على الحاضرين، فهذه منكرات ____ ينبغي أن تعرف ويمنع منها", "o": ["مكروهة", "النص", "الصداقة", "عملك"], "h": "راجع: ص٥٢٨"}]}], "sum": [["الصفحات", "ص٥٢٧ - ص٥٣٢"]], "_nq": 6}, {"id": "l40", "title": "الباب الرابع في أمر الأمراء والسلاطين بالمعروف ونهيهم عن المنكر", "group": "كتاب الأمر بالمعروف والنهي عن المنكر", "map": {"center": "الباب\nالرابع في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الرابع في أمر الأمراء والسلاطين بالمعروف ونهيهم عن المنكر - القسم ١ من ٣", "b": [{"pic": ["books", "book"], "cap": "ص٥٣٣ - ص٥٤٩"}, {"story": ["الباب الرابع في أمر الأمراء والسلاطين بالمعروف ونهيهم عن الم (١ من ١٦)، ص٥٣٣", ["**في أمر الأمراء والسلاطين بالمعروف ونهيهم عن المنكر**", "قد ذكرنا درجات الأمر بالمعروف، وأن أولها التعريف، وثانيها الوعظ، وثالثها تخشين القول، ورابعها المنع بالقهر، والجائز من جملة ذلك مع السلاطين الرتبتان الأوليان، وهما: التعريف والوعظ، وأما تخشين القول كقولك: يا ظالم، يا من لا يخاف الله ونحو هذا، فإن كان ذلك يحرك فتنة يتعدى شرها إلى الغير لم يجز، وإن كان لا يخاف إلا على نفس القائل فهو جائز عند جمهور العلماء، وقد كان من عادة السلف التعرض للأخطار من غير مبالاة بهلاك المهجة، والذي أراه المنع من ذلك؛ لأن المقصود إزالة المنكر، وحمل السلطان بالانبساط عليه على قتل المنكر أكبر من المنكر الذي قصد إزالته، وذلك أن قوت السلاطين التعظيم، فإذا سمعوا من آحاد الرعية: يا ظالم يا فاسق، رأوا غاية الذل، فلم يصبروا عليها.", "قال الإمام أحمد بن حنبل: لا تتعرض بالسلطان فسيفه مسلول.", "وأما ما جرى للسلف فإن أمراءهم كانوا يهابون العلماء والزهاد، فإذا انبسطوا عليهم احتملوهم في الأغلب، وقد جمعت مواعظ السلف للخلفاء والأمراء في كتاب «المصباح المضيء»(١) وأنا أنتخب منه هاهنا حكايات: أخبرنا عبد الوهاب الحافظ قال: أخبرنا المبارك بن عبد الجبار قال: أخبرنا أحمد بن علي قال: أخبرنا عمر بن ثابت قال: أخبرنا علي بن أحمد بن أبي قيس قال: حدثنا أبو بكر القرشي قال: حدثني يعقوب بن عبيد قال: حدثنا أبو مسهر، قال: حدثنا سعيد بن", "حاشية: (١) يعني كتابه «المصباح المضيء في خلافة المستضيء»، طبع بتحقيق ناجية عبد الله إبراهيم في بغداد سنة ١٩٩٧م. ينظر «قراءة جديدة في مؤلفات ابن الجوزي» ص١١٣.", "عبد العزيز قال: قال سعيد بن عامر بن حذيم لعمر(١): إني موصيك بكلمات من جوامع الإسلام ومعالمه؛ اخش الله في الناس، ولا تخش الناس في الله، ولا يخالف قولك فعلك، فإن خير القول ما صدقه الفعل، وأحب لقريب المسلمين وبعيدهم ما تحب لنفسك وأهل بيتك، وخض الغمرات إلى الحق حيث علمته، ولا تخف في الله لومة لائم. قال: ومن يستطيع ذلك يا سعيد؟ قال: من ركب في عنقه مثل الذي ركب في عنقك.", "وقال قتادة: خرج عمر بن الخطاب من المسجد ومعه الجارود العبدي فإذا امرأة برزة(٢) على ظهر الطريق، فسلم عليها عمر فردت عليه، أو سلمت عليه فرد عليها السلام، فقالت: هيه يا عمر عهدتك وأنت تسمى عميرا في سوق عكاظ تصارع الصبيان، فلم تذهب الأيام حتى سميت أمير المؤمنين فاتق الله في الرعية، واعلم أنه من خاف الموت خشي الفوت. فبكى عمر، فقال الجارود: هيه، فقد اجترأت على أمير المؤمنين وأبكيته فقال عمر: دعها، أما تعرف هذه؟ هذه خولة بنت حكيم التي سمع الله قولها من فوق سمائه، فعمر والله أحرى أن يسمع كلامها."]], "ic": "book"}, {"story": ["الباب الرابع في أمر الأمراء والسلاطين بالمعروف ونهيهم عن الم (٢ من ١٦)، ص٥٣٤", ["أنبأنا عبد الوهاب الحافظ قال: أخبرنا المبارك بن عبد الجبار قال: أخبرنا أحمد بن علي التوزي قال: أخبرنا عمر بن ثابت قال: أخبرنا علي بن أبي قيس قال: حدثنا العباس بن هشام بن محمد عن أبيه عن شيخ من الأزد أن أبا بكرة دخل على معاوية فقال: اتق الله يا معاوية، واعلم أنك في كل يوم يخرج عنك وفي كل ليلة تأتي عليك لا تزداد من الدنيا إلا بعدا ومن الآخرة إلا قربا، وعلى إثرك طالب لا تفوته وقد نصب لك علم لا تجوزه، فما أسرع ما تبلغ العلم، وما أوشك أو يلحقك الطالب وإنا وما نحن فيه أنت زائل، وفي الذي نحن صائرون إليه باق، إن خيرا فخيرا، وإن شرا فشرا.", "حاشية: (١) سقطت من الأصل.", "حاشية: (٢) البرزة: التي تظهر للرجال وتجالسهم.", "أخبرنا سلمان بن مسعود قال: أخبرنا المبارك بن عبد الجبار قال: أخبرنا محمد بن علي البيضاوي قال: حدثنا ابن حيوية قال: حدثنا ابن صفوان قال: حدثنا عبد الله بن محمد القرشي قال: حدثني محمد بن الحسين قال: حدثني شهاب بن عباد عن سويد الكلبي أن زر بن حبيش كتب إلى عبد الملك بن مروان كتابا(١) يعظه فيه، فكان في آخر كتابه: ولا يطمعنك يا أمير المؤمنين في طول الحياة ما يظهر من صحة بدنك فأنت أعلم بنفسك، واذكر ما تكلم به الأولون:", "إذا الرجال ولدت أولادها  وبليت من كبر أجسادها", "وجعلت أسقامها تعتادها  تلك زروع قد دنا حصادها", "فلما قرأ عبد الملك الكتاب بكى حتى بل طرف ثوبه، ثم قال: صدق، ولو كتب إلينا بغير هذا كان أرفق.", "أخبرنا عبد الخالق بن أحمد قال: أخبرنا علي بن محمد بن إسحاق قال: أخبرنا عبد الرحمن بن أحمد الرازي قال: أخبرنا جعفر بن عبد الله بن يعقوب قال: أخبرنا أبو بكر محمد بن هارون الرؤياني قال: حدثنا أبو سلمة يحيى بن المغيرة قال: حدثنا عبد الجبار بن عبد العزيز بن أبي حازم قال: حدثني أبي عن أبيه أبي حازم قال: دخل سليمان بن عبد الملك المدينة فأقام بها ثلاثا، فقال: ما هاهنا رجل ممن أدرك أصحاب رسول الله ﷺ يحدثنا؟ فقيل له: بلى ههنا رجل يقال له: أبو حازم، فبعث إليه فجاءه، فقال له سليمان: يا أبا حازم، ما هذا الجفاء؟ فقال له أبو حازم: وأي جفاء رأيت مني؟ فقال له سليمان: أتاني وجوه أهل المدينة كلهم، ولم تأتني. قال: ما جرى بيني وبينك معرفة آتيك عليها. قال: صدق الشيخ، يا أبا حازم ما لنا نكره الموت؟ قال: لأنكم أخربتم آخرتكم وعمرتم دنياكم وأنتم تكرهون أن تنتقلوا من العمران إلى الخراب. قال: صدقت، يا أبا حازم فكيف القدوم على الله؟ قال: أما المحسن فكالغائب يقدم على أهله، وأما المسيء", "حاشية: (١) سقطت من (ظ)."]], "ic": "book"}, {"story": ["الباب الرابع في أمر الأمراء والسلاطين بالمعروف ونهيهم عن الم (٣ من ١٦)، ص٥٣٦", ["فكالآبق(١) يقدم على مولاه. قال: فبكى سليمان وقال: ليت شعري مالنا عند الله يا أبا حازم؟ فقال أبو حازم: اعرض نفسك على كتاب الله فإنك تعلم مالك عند الله. قال: يا أبا حازم: وأنى أصيب تلك المعرفة من كتاب الله عز وجل؟ قال: عند قوله: ﴿إِنَّ ٱلْأَبْرَارَ لَفِى نَعِيمٍ وَإِنَّ ٱلْفُجَّارَ لَفِى جَحِيمٍ﴾ [الانفطار: ١٣-١٤] قال: يا أبا حازم فأين رحمة الله؟ قال: ﴿قَرِيبٌ مِّنَ ٱلْمُحْسِنِينَ﴾ [الأعراف: ٥٦] قال: يا أبا حازم من أعقل الناس؟ قال: من تعلم الحكمة وعلمها الناس. قال: فمن أحمق الناس؟ قال: من حط في هوى رجل وهو ظالم فباع آخرته بدنيا غيره. قال: يا أبا حازم، فما أسمع الدعاء؟ قال: دعاء المخبتين. قال: فما أزكى الصدقة؟ قال: جهد المقل. قال سليمان: نصيحة تلقيها. قال: فما نحن فيما تقول فيه؟ فقال: اعفني عن هذا. قال أبو حازم: إن ناسا أخذوا هذا الأمر عنوة من غير مشاورة من المؤمنين ولا إجماع من رأيهم، فسفكوا فيه الدماء على طلب الدنيا، ثم ارتحلوا عنها، فليست شعري ما قالوا وما قيل لهم فقال بعض جلسائه: بئس ما قلت يا شيخ. قال أبو حازم: كذبت إن الله تعالى أخذ على العلماء: ﴿لَتُبَيِّنُنَّهُۥ لِلنَّاسِ وَلَا تَكْتُمُونَهُۥ﴾ [آل عمران ١٨٧] قال سليمان: اصحبنا يا أبا حازم تصب منا ونصب منك. قال: أعوذ بالله من ذلك. قال: ولم؟ قال: أخاف أن أركن إليكم شيئا قليلا فيذيقني ضعف الحياة وضعف المماة قال: فأشر علي. قال: اتق الله أن يراك حيث نهاك وأن يفقدك حيث أمرك. قال: يا أبا حازم ادع لنا بخير فقال: اللهم(٢) إن كان سليمان وليك فيسره للخير، وإن كان عدوك فخذ إلى الخير بناصيته. فقال: يا غلام هات مئة دينار، ثم قال: خذها يا أبا حازم. قال: لا حاجة لي فيها، لي ولغيري في هذا المال أسوة، فإن آسيت بيننا، وإلا فلا حاجة لي فيها، إني أخاف أن يكون لما سمعت من كلامي. فكأن سليمان أعجب بأبي حازم فقال الزهري إنه لجاري منذ ثلاثين سنة ما كلمته قط. فقال أبو حازم: إنك نسيت الله فنسيتني. قال الزهري: أتشتمني؟ قال سليمان: بل أنت", "حاشية: (١) الآبق: العبد الهارب من سيده.", "حاشية: (٢) سقطت من الأصل.", "شتمت نفسك، أما علمت أن للجار على جاره حقا؟ قال أبو حازم: إن بني إسرائيل لما كانوا على الصواب كانت الأمراء تحتاج إلى العلماء، وكانت العلماء تفر بدينها من الأمراء، فلما رأى ذلك قوم من أذلة الناس تعلموا ذلك العلم وأتوا به إلى الأمراء، فاستغنت به عن العلماء، واجتمع القوم على المعصية فسقطوا وانتكسوا، ولو كان علماؤنا يصونون علمهم لم تزل الأمراء تهابهم. قال الزهري: كأنك إياي تريد وبي تعرض؟ قال: هو ما تسمع."]], "ic": "book"}, {"story": ["الباب الرابع في أمر الأمراء والسلاطين بالمعروف ونهيهم عن الم (٤ من ١٦)، ص٥٣٧", ["أخبرنا المبارك بن علي قال: أخبرتنا فاطمة بنت عبد الله الخبري قالت: أخبرنا علي بن الحسن بن الفضل قال: أخبرنا أحمد بن محمد بن خالد قال: أخبرنا علي بن عبد الله بن المغيرة قال: حدثنا أحمد بن سعيد الدمشقي قال: حدثني الزبير بن بكار قال: حدثني علي بن محمد المدائني قال: قال عمر بن عبد العزيز لسليمان بن عبد الملك: إن بالباب يا أمير المؤمنين رجلا له حزم ولسان. قال: أدخله، فدخل فقال: إني مكلمك يا أمير المؤمنين بكلام فاحتمله إن كرهته، فإن وراءه ما تحب إن قبلته. فقال: قل يا أعرابي. فقال: يا أمير المؤمنين، إنه قد اكتنفك رجال ابتاعوا دنياك بدينهم، ورضاك بسخط ربهم، خافوك في الله ولم يخافوه فيك، خربوا الآخرة وعمروا الدنيا، فهم حرب للآخرة، سلم للدنيا، فلا تأتمنهم على ما ائتمنك الله عليه، فإنه لن يألوا الأمانة تضييعا، والأمة خسفا، وأنت مسؤول عما اجترحت، وليسوا بمسؤولين عما اجترحوا، فلا تصلح دنياهم بفساد آخرتك، فإن أعظم الناس غبنا بائع آخرته بدنيا غيره. فقال سليمان: أما أنت فقد سللت لسانك وهو أقطع من سيفك. فقال: أجل يا أمير المؤمنين لك لا عليك. قال: فهل من حاجة في ذات نفسك؟ فقال: أما خاصة دون عامة فلا، ثم قام فخرج، فقال سليمان: لله دره ما أشرف أصله، وأجمع قلبه، وأذرب لسانه، وأصدق نيته، وأورع نفسه، هكذا فليكن الشرف والعقل.", "أنبأنا أبو البركات الأنماطي قال: أخبرنا أبو الحسين الحمامي قال: أخبرنا أحمد بن علي التوزي قال: أخبرنا عمر بن ثابت قال: أخبرنا أبو الحسن علي بن أحمد قال: حدثنا أبو بكر القرشي قال: حدثنا محمد بن الحسين قال: حدثنا", "يعقوب بن محمد بن عيسى الزهري عن عبد العزيز بن أبي حازم عن أبيه قال: قال لي عمر بن عبد العزيز: عظني. قلت: اضطجع، ثم اجعل الموت عند رأسك، ثم انظر ما تحب أن يكون فيك تلك الساعة فخذ فيه الآن، وما تكره أن يكون فيك تلك الساعة فدعه الآن."]], "ic": "book"}, {"story": ["الباب الرابع في أمر الأمراء والسلاطين بالمعروف ونهيهم عن الم (٥ من ١٦)، ص٥٣٨", ["أخبرنا إسماعيل بن أحمد قال: أخبرنا أبو محمد بن أبي عثمان قال: أخبرنا أحمد بن محمد بن الصلت قال: أخبرنا أحمد بن جعفر بن المنادي قال: حدثني جدي قال: حدثنا عبد الله بن بكر السهمي قال: حدثنا شيخ من بني سليم، قال: قال محمد بن كعب لعمر بن عبد العزيز: إنما الدنيا سوق من الأسواق، فمنها خرج الناس بما ضرهم، ومنها خرجوا بما نفعهم، وكم من قوم غرهم منها مثل الذي أصبحنا فيه حتى أتاهم الموت فاستوعبهم، فخرجوا منها ملومين لم يأخذوا منها لما أحبوا من الآخرة عدة، ولا لما كرهوا جنة، واقتسم ما جمعوا من لم يحمدهم، وصاروا إلى من لا يعذرهم، فنحن محقوقون يا أمير المؤمنين أن ننظر إلى تلك الأعمال التي نغبطهم بها فنخلفهم فيها، وإلى الأعمال التي نتخوف عليهم فيها فنكف عنها، فاتق الله فيها يا أمير المؤمنين وافتح الأبواب(١)، وسهل الحجاب، وانصر المظلوم، ورد الظالم، ثلاث من كن فيه استكمل الإيمان بالله عز وجل: من إذا رضي لم يدخله رضاه في الباطل، وإذا غضب لم يخرجه غضبه من الحق، وإذا قدر لم يتناول ما ليس له.", "أخبرنا عبد الله بن علي المقرئ قال: أخبرنا أبو منصور العكبري قال: أخبرنا عبد الله بن أبي مسلم الفرضي قال: أخبرنا علي بن عبد الله بن المغيرة الجوهري قال: أخبرنا أحمد بن سعيد الدمشقي قال: (٢-٢)حدثني الزبير بن بكار قال: حدثني الحارث بن محمد العوفي، قال: حدثني نوفل بن عمارة، قال(٢-٢): قال عمر بن عبد العزيز: إن أول من أيقظني لهذا الشأن مزاحم؛ حبست رجلا فجاوزت في حبسه القدر الذي يجب عليه، فكلمني في إطلاقه فقلت: ما أنا بمخرجه حتى أبلغ", "حاشية: (١) في (ظ): «الباب».", "حاشية: (٢-٢) سقط من (ظ).", "في الحيطة عليه بما هو أكثر مما مر عليه. فقال مزاحم: يا عمر بن عبد العزيز، إني أحذرك ليلة تمخض بالقيامة، في صبيحتها(١) تقوم الساعة، يا عمر ولقد كدت أنسى اسمك مما أسمع: قال الأمير، وقال الأمير. فوالله ما هو إلا أن قال ذاك فكأنما كشف عن وجهي غطاء، فاذكروا أنفسكم رحمكم الله، فإن الذكرى تنفع المؤمنين."]], "ic": "book"}, {"story": ["الباب الرابع في أمر الأمراء والسلاطين بالمعروف ونهيهم عن الم (٦ من ١٦)، ص٥٣٩", ["أنبأنا أبو منصور بن خيرون قال: أخبرنا أبو بكر أحمد بن علي الخطي حسوة من ماء فما فوقه."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "الوقت ـ فقال: يشهدان عندي وأسأل عنهما فإن زكيا قبلت شهادتهما، وإلا أمضيت ما قد ثبت عندي. فامتنع أولئك من الشهادة فزعا، ولم يدفع إلى ____", "o": ["المعتضد", "عندها", "البيوت", "ذمتكم"], "h": "راجع: ص٥٤٩"}, {"t": "fill", "d": 2, "q": "أنبأنا علي بن عبيد الله قال: أخبرنا محمد بن أبي نصر الحميدي قال: أخبرنا أبو محمد علي بن أحمد الفقيه قال: حدثنا الكناني قال: أخبرني أحمد بن ____ قال: حدثنا خالد بن سعد قال: أخبرني عمر بن حفص بن غالب", "o": ["خليل", "فعلك", "وتلاشى", "النقد"], "h": "راجع: ص٥٤٠"}, {"t": "fill", "d": 2, "q": "ما تقول في؟ قال: أويعفيني أمير المؤمنين؟ فقال: والله لتخبرني. فقال: أشهد إنك أخذت هذا المال من غير حقه، ____ في غير أهله. فوضع يده في قفا ابن أبي ذؤيب وجعل يقول له: أما والله لولا أنا لأخذت أبناء", "o": ["وجعلته", "فكلما", "أتحفكم", "الوازع"], "h": "راجع: ص٥٤١"}, {"t": "fill", "d": 2, "q": "الثاني: يتعلق بالموعوظ، فإن حب الدنيا قد شغل الأكثرين عن ذكر الآخرة، ____ لها أنساهم تعظيم العلماء، وليس للمؤمن أن يذل", "o": ["وتعظيمهم", "يؤثرون", "وتلتبس", "وهيجان"], "h": "راجع: ص٥٤٩"}, {"t": "fill", "d": 2, "q": "أخبرنا محمد بن أبي منصور قال: أخبرنا أحمد بن الحسن بن خيرون قال: أخبرنا الحسن بن أحمد بن شاذان قال: أخبرنا عبد الله بن إسحاق ____، قال: حدثنا أحمد بن عبيد بن ناصح، قال: حدثنا محمد بن مصعب", "o": ["الخراساني", "للمنهاج", "الأشراف", "بمثالها"], "h": "راجع: ص٥٤١"}, {"t": "fill", "d": 2, "q": "شفاعته، فلا يزال يؤمنك حتى إذا بلغت الخوف ____", "o": ["عطبت", "يرفعه", "يخشى", "فصحيح"], "h": "راجع: ص٥٤٧"}]}, {"t": "الباب الرابع في أمر الأمراء والسلاطين بالمعروف ونهيهم عن المنكر - القسم ٢ من ٣", "b": [{"story": ["الباب الرابع في أمر الأمراء والسلاطين بالمعروف ونهيهم عن الم (٧ من ١٦)، ص٥٤٠", ["أنبأنا علي بن عبيد الله قال: أخبرنا محمد بن أبي نصر الحميدي قال: أخبرنا أبو محمد علي بن أحمد الفقيه قال: حدثنا الكناني قال: أخبرني أحمد بن خليل قال: حدثنا خالد بن سعد قال: أخبرني عمر بن حفص بن غالب قال: حدثنا محمد بن عبد الله بن عبد الحكم قال: أخبرنا الشافعي عن محمد بن علي قال: إني لحاضر مجلس أمير المؤمنين المنصور، وفيه ابن أبي ذؤيب(١)، وكان والي المدينة الحسن بن زيد، فأتى الغفاريون فشكوا إلى أبي جعفر شيئا من أمر الحسن بن زيد، فقال الحسن: سل عنهم ابن أبي ذؤيب، قال: فسأله فقال: ما تقول فيهم يا ابن أبي ذؤيب؟ فقال: يا أمير المؤمنين أشهد إنهم أهل تحطم في أعراض الناس(٢)، كثيروا الأذى لهم. فقال أبو جعفر: قد سمعتم. فقال الغفاريون: يا أمير المؤمنين فسله عن الحسن بن زيد. فقال: يا ابن أبي ذؤيب، ما تقول في الحسن بن زيد؟ فقال: أشهد إنه يحكم بغير الحق. فقال: قد سمعت يا حسن ما قال ابن أبي ذؤيب؟ فقال: يا أمير المؤمنين سله عن نفسك. فقال:", "حاشية: (١) في النسخ «ابن أبي ذئب» والصواب «ذؤيب» وهو محمد بن عبد الرحمن بن المغيرة بن الحارث بن أبي ذؤيب ـ واسمه هشام ـ بن شعبة القرشي المدني، توفي بالكوفة سنة ١٥٩هـ.", "حاشية: (٢) أي: يقعون فيها كثيرا.", "ما تقول في؟ قال: أويعفيني أمير المؤمنين؟ فقال: والله لتخبرني. فقال: أشهد إنك أخذت هذا المال من غير حقه، وجعلته في غير أهله. فوضع يده في قفا ابن أبي ذؤيب وجعل يقول له: أما والله لولا أنا لأخذت أبناء فارس والروم والديلم والترك بهذا المكان منك. فقال ابن أبي ذؤيب: قد ولي أبو بكر وعمر فأخذا بالحق وقسما بالسوية وأخذا بأقفاء فارس والروم. فخلاه أبو جعفر وقال: والله لولا أني أعلم أنك صادق لقتلتك. فقال ابن أبي ذؤيب: والله يا أمير المؤمنين إني لأنصح لك من ابنك المهدي."]], "ic": "book"}, {"story": ["الباب الرابع في أمر الأمراء والسلاطين بالمعروف ونهيهم عن الم (٨ من ١٦)، ص٥٤١", ["أخبرنا محمد بن أبي منصور قال: أخبرنا أحمد بن الحسن بن خيرون قال: أخبرنا الحسن بن أحمد بن شاذان قال: أخبرنا عبد الله بن إسحاق الخراساني، قال: حدثنا أحمد بن عبيد بن ناصح، قال: حدثنا محمد بن مصعب القرقساني قال: حدثني الأوزاعي قال: بعث إلي المنصور أمير المؤمنين وأنا بالساحل، فأتيته، فلما وصلت إليه وسلمت عليه بالخلافة رد علي واستجلسني، ثم قال: ما الذي بطأ بك عنا يا أوزاعي؟ قلت: وما الذي تريد يا أمير المؤمنين؟ قال: أريد الأخذ عنكم والاقتباس منكم. قلت: فانظر يا أمير المؤمنين أن تسمع شيئا ثم لا تعمل به. فصاح بي الربيع(١) وأهوى بيده إلى السيف، فانتهزه المنصور وقال: هذا مجلس مثوبة لا مجلس عقوبة. فطابت نفسي وانبسطت في الكلام، فقلت: يا أمير المؤمنين حدثني مكحول عن عطية بن بشر قال: قال رسول الله ﷺ: «أيما وال بات غاشا لرعيته حرم الله عليه الجنة». يا أمير المؤمنين، قد كنت في شغل شاغل من خاصة نفسك عن عامة الناس الذين أصبحت تملكهم أحمرهم وأسودهم، ومسلمهم وكافرهم، وكل له عليك نصيب من العدل، فكيف بك إذا انبعث منهم فئام(٢) وراء فئام، وليس منهم أحد إلا وهو يشكو بلية أدخلتها عليه، أو ظلامة سقتها إليه، يا أمير المؤمنين، حدثني مكحول عن زياد بن جارية(٣) عن", "حاشية: (١) يعني حاجب المنصور.", "حاشية: (٢) الفئام: الجماعة الكثيرة من الناس.", "حاشية: (٣) تصحف في الأصل إلى: «حارثة»."]], "ic": "book"}, {"story": ["الباب الرابع في أمر الأمراء والسلاطين بالمعروف ونهيهم عن الم (٩ من ١٦)، ص٥٤٢", ["حبيب بن مسلمة أن رسول الله ﷺ دعى إلى القصاص من نفسه في خدش خدشه أعرابيا لم يتعمده، فأتاه جبريل فقال: يا محمد، إن الله لم يبعثك جبارا متكبرا. فدعى النبي ﷺ الأعرابي فقال: «اقتص مني» فقال الأعرابي: قد أحللتك بأبي أنت وأمي، وما كنت لأفعل ذلك أبدا ولو أتيت على نفسي. فدعا له بخير، يا أمير المؤمنين، رض نفسك لنفسك، وخذ لها الأمان من ربك، يا أمير المؤمنين، إن الملك لو بقي لمن قبلك لم يصل إليك، وكذا لا يبقى لك كما لم يبق لغيرك، يا أمير المؤمنين، جاء في تأويل هذه الآية عن جدك: ﴿مَالِ هَـٰذَا ٱلْكِتَـٰبِ لَا يُغَادِرُ صَغِيرَةً وَلَا كَبِيرَةً إِلَّآ أَحْصَىٰهَا﴾ [الكهف: ٤٩]، قال: الصغيرة التبسم والكبيرة الضحك، فكيف بما عملته الأيدي وحصدته الألسن؟! يا أمير المؤمنين، بلغني أن عمر بن الخطاب قال: لو ماتت سخلة على شاطئ الفرات ضيعة لخشيت أن أسأل عنها. فكيف بمن حرم عدلك وهو على بساطك؟! يا أمير المؤمنين، جاء في تأويل هذه الآية عن جدك ﴿يَـٰدَاوُۥدُ إِنَّا جَعَلْنَـٰكَ خَلِيفَةً فِى ٱلْأَرْضِ فَٱحْكُم بَيْنَ ٱلنَّاسِ بِٱلْحَقِّ وَلَا تَتَّبِعِ ٱلْهَوَىٰ﴾ [ص: ٢٦]، قال: يا داود إذا قعد الخصمان بين يديك وكان لك في أحدهما هوى فلا تتمنين في نفسك أن يكون الحق له فيفلج(١) على صاحبه فأمحوك من نبوتي ثم لا تكون خليفتي، يا داود، إنما جعلت رسلي إلى عبادي رعاة كرعاة الإبل لعلمهم بالرعاية ورفقهم بالسياسة ليجبروا الكسير، ويدلوا الهزيل على الكلأ والماء، يا أمير المؤمنين إنك قد بليت بأمر لو عرض على السماوات والأرض والجبال لأبين أن يحملنه وأشفقن منه، يا أمير المؤمنين، حدثني يزيد(٢) بن جابر عن عبد الرحمن بن أبي عمرة الأنصاري أن عمر بن الخطاب استعمل رجلا من الأنصار على الصدقة، فرآه بعد أيام مقيما، فقال له: ما منعك من الخروج إلى عملك، أما علمت أن لك مثل أجر المجاهد في سبيل الله؟ قال: لا. قال: وكيف ذاك؟ قال: لأنه بلغني أن رسول الله ﷺ قال: «ما من وال يلي شيئا من أمور الناس", "حاشية: (١) فلج: ظهر وظفر وفاز على خصمه.", "حاشية: (٢) تحرفت في الأصل إلى: «زيد». وهو يزيد بن يزيد بن جابر الأزدي الشامي توفي سنة ١٣٣هـ."]], "ic": "book"}, {"story": ["الباب الرابع في أمر الأمراء والسلاطين بالمعروف ونهيهم عن الم (١٠ من ١٦)، ص٥٤٣", ["إلا أتي به يوم القيامة مغلولا يده إلى عنقه يوقف على جسر في النار ينتفض به ذلك الجسر انتفاضة تزيل كل عضو منه عن موضعه، ثم يعاد فيحاسب، فإن كان محسنا نجا بإحسانه، وإن كان مسيئا انخرق به ذلك الجسر فهوى به في النار سبعين خريفا». فقال له: ممن سمعت هذا؟ فقال: من أبي ذر وسلمان، فأرسل إليهما عمر فسألهما، فقالا: نعم، سمعناه من رسول الله ﷺ فقال عمر: واغمراه، من يتولاها بما فيها؟ فقال أبو ذر: من سلت الله أنفه وألصق خده بالأرض. فأخذ المنديل ـ يعني المنصور ـ فوضعه على وجهه ثم بكى وانتحب حتى أبكاني، ثم قلت: يا أمير المؤمنين، قد سأل جدك العباس النبي ﷺ إمارة على مكة أو الطائف أو اليمن، فقال له النبي ﷺ: «يا عم، نفس تنجيها خير من إمارة لا تحصيها» نصيحة منه لعمه، وشفقة منه عليه، وإنه لا يغني عنه من الله شيئا إذ أوحى الله عز وجل إليه: ﴿وَأَنذِرْ عَشِيرَتَكَ ٱلْأَقْرَبِينَ﴾ [الشعراء: ٢١٤]، فقال: «يا عباس، ويا صفية، ويا فاطمة إني لست أغني عنكم من الله شيئا، لي عملي ولكم عملكم». وقد قال عمر بن الخطاب: لا يقيم أمر الناس إلا حصيف العقل لا تأخذه في الله لومة لائم، وقال: السلطان أربعة أمراء فأمير ظلف(١) نفسه وعماله، فذلك كالمجاهد في سبيل الله يد الله عليه باسطة بالرحمة، وأمير ضعيف ظلف نفسه وأرتع عماله لضعفه، فهو على شفا هلاك إلا أن يرحم، وأمير ظلف عماله وأرتع نفسه، فذلك الحطمة الذي قال رسول الله ﷺ: «شر الرعاء الحطمة، فهو الهالك وحده». وأمير أرتع نفسه وعماله، فهلكوا جميعا، وقد بلغني يا أمير المؤمنين أن جبرائيل أتى النبي ﷺ فقال: «أتيتك حين أمر الله بمنافيخ النار فوضعت على النار تسعر ليوم القيامة، فقال له: يا جبريل، صف لي النار. فقال: إن الله عز وجل أمر بها فأوقد عليها ألف عام حتى احمرت، ثم أوقد عليها ألف عام حتى اصفرت، ثم أوقد عليها ألف عام حتى اسودت، فهي سوداء مظلمة لا يضيء لهبها ولا يطفأ جمرها، والذي بعثك بالحق لو أن ثوبا من ثياب(٢) أهل النار أظهر لأهل الأرض لماتوا", "حاشية: (١) ظلف: أي منع.", "حاشية: (٢) في الأصل: «أثواب».", "جميعا، ولو أن ذنوبا من شرابها صب في ماء الأرض جميعا لقتل من ذاقه، ولو أن ذراعا من السلسلة التي ذكر الله عز وجل وضع على جبال الأرض جميعا لذابت وما استقلت، ولو أن رجلا دخل النار ثم أخرج منها لمات أهل الأرض من نتن ريحه وتشوه خلقه». فبكى النبي ﷺ وبكى جبريل لبكائه وقال: «أتبكي يا محمد وقد غفر الله لك ما تقدم من ذنبك وما تأخر؟ قال: أفلا أكون عبدا شكورا؟ ولم بكيت يا جبريل وأنت الروح الأمين؟ فقال: أخاف أن أبتلى بمثل ما ابتلي به هاروت وماروت»."]], "ic": "book"}, {"story": ["الباب الرابع في أمر الأمراء والسلاطين بالمعروف ونهيهم عن الم (١١ من ١٦)، ص٥٤٤", ["يا أمير المؤمنين، إن أشد الشدة القيام لله لحقه، وإن أكرم الكرم عند الله التقوى، وإنه من طلب العز بطاعة الله رفعه الله وأعزه، ومن طلبه بمعصية الله أذله الله ووضعه، فهي نصيحتي، والسلام عليك. ثم نهضت، فقال: إلى أين؟ فقلت: إلى الولد والوطن بإذن أمير المؤمنين إن شاء الله. فقال: قد أذنت لك وشكرت لك نصيحتك وقبلتها بقبولها، والله الموفق للخير، والمعين عليه، وبه أستعين، وعليه أتوكل، وهو حسبي ونعم الوكيل، فلا تخلني من مطالعتك إياي بمثلها، فإنك المقبول القول غير المتهم في النصيحة. قلت: أفعل إن شاء الله. قال محمد بن مصعب: وأمر له بمال يستعين به على خروجه فلم يقبله، وقال: أنا في غنى عنه، وما كنت لأبيع نصيحتي بعرض الدنيا كلها، وعرف المنصور مذهبه فلم يجد عليه في ذلك.", "أنبأنا محمد بن أبي طاهر قال: أنبأنا أبو الطيب الطبري قال: أخبرنا المعافى بن زكريا قال: حدثنا أحمد بن الحسن بن منصور قال: حدثنا أبو قلابة قال: حدثني نصر بن يزيد الشغافي قال: صلينا مع المهدي المغرب، ومعنى العوفي وكان على مظالم المهدي، فلما انصرف المهدي من المغرب جاء العوفي حتى قعد في قبلته، فقام يتنفل فجذب ثوبه، فقال: ما شأنك؟ قال: شيء أولى بك من النافلة. قال: وما ذاك؟ قال: سلام مولاك ـ قال: وهو قائم على رأسه ـ أوطأ قوما الخيل وغصبهم على ضيعتهم، وقد صح ذلك عندي، تأمر بردها وتبعث من يخرجهم. فقال المهدي: نصبح إن شاء الله. فقال العوفي:", "لا، إلا الساعة. فقال المهدي: فلان القائد، اذهب الساعة إلى موضع كذا وكذا فأخرج من فيه، وسلم الضيعة إلى فلان. قال: فما أصبحوا حتى ردت الضيعة على صاحبها.", "أخبرنا أبو منصور القزاز قال: أخبرنا أبو بكر أحمد بن علي الحافظ قال: أخبرنا القاضي أبو العلاء الواسطي قال: حدثنا محمد بن جعفر التميمي، قال: أخبرنا أبو القاسم الحسن بن محمد قال: أخبرنا وكيع قال: أخبرني إبراهيم بن أبي عثمان عن يحيى بن عبد الصمد قال: خوصم موسى أمير المؤمنين إلى أبي يوسف في بستانه، فكان الحكم في الظاهر لأمير المؤمنين، وكان الأمر على خلاف ذلك، فقال أمير المؤمنين لأبي يوسف: ما صنعت في الأمر الذي يتنازع إليك فيه؟ قال: خصم أمير المؤمنين يسألني أن أحلف أمير المؤمنين أن شهوده شهدوا على حق. فقال له موسى: وترى ذلك؟ قال: كان ابن أبي ليلى يراه. قال: فازدد البستان عليه. وإنما احتال عليه أبو يوسف."]], "ic": "book"}, {"story": ["الباب الرابع في أمر الأمراء والسلاطين بالمعروف ونهيهم عن الم (١٢ من ١٦)، ص٥٤٥", ["أخبرنا محمد بن ناصر قال: أخبرنا إبراهيم بن سعد الحبال قال: أخبرنا أبو العباس أحمد بن محمد بن الجراح قال: حدثنا محمد بن جعفر بن درآن قال: حدثنا هارون بن عبد العزيز العباسي قال: حدثنا محمد بن خلف بن حيان قال: حدثنا محمد بن إسحاق بن عبد الرحمن البغوي قال: سمعت سعيد بن سليمان يقول: كنت بمكة في زقاق الشطوي وإلى جنبي عبد الله بن عبد العزيز العمري، وقد حج هارون الرشيد فقال له إنسان: يا أبا عبد الله، هو ذا أمير المؤمنين يسعى قد أحلي له السعي. فقال العمري للرجل: لا جزاك الله عني خيرا، كلفتني أمرا كنت عنه غنيا. ثم تعلق نعليه وقام فتبعته، فأقبل الرشيد من المروة يريد الصفا، فصاح به: يا هارون. فلما نظر إليه قال: لبيك يا عم. قال: ارق الصفا، فلما رقيه قال: ارم بطرفك إلى البيت. قال: قد فعلت. قال: كم هم؟ قال: ومن يحصيهم؟ قال فكم في الناس مثلهم؟ قال: خلق لا يحصيهم إلا الله. قال: اعلم أيها الرجل أن كل واحد منهم يسأل عن خاصة نفسه، وأنت وحدك تسأل عنهم كلهم، فانظر كيف تكون. قال: فبكى هارون وجلس، وجعلوا يعطونه منديلا للدموع. قال", "العمري: وأخرى أقولها. قال: قل يا عم. قال: والله إن الرجل ليسرع في ماله فيستحق الحجر عليه، فكيف بمن أسرع في مال المسلمين؟ ثم مضى وهارون يبكي.", "قال محمد بن خلف: وسمعت محمد بن عبد الرحمن يقول: بلغني أن هارون الر هلكة، فإن أطعته عصيت الله، وإن عصيته أطعت الله، فهل ترايان في متابعتي إياه فرجا؟ فقال الحسن: يا أبا عمرو، أجب الأمير. فتكلم الشعبي فانحط في حبل ابن هبيرة. فقال: ما تقول أنت يا أبا سعيد؟ قال: أيها الأمير، قد قال الشعبي ما قد سمعت. فقال: ما تقول أنت؟ قال: أقول: يا عمر بن هبيرة أوشك أن ينزل بك ملك من ملائكة الله تعالى فظ غليظ لا يعصي الله ما أمره، فيخرجك من سعة قصرك إلى ضيق قبرك، يا عمر بن هبيرة، إن تتقي الله يعصمك من يزيد بن عبد الملك، ولن يعصمك يزيد بن عبد الملك من الله، يا عمر بن هبيرة لا تأمن أن ينظر الله إليك على أقبح ما تعمل في طاعة يزيد بن عبد الملك فتغلق به باب المغفرة دونك، يا عمر بن هبيرة، لقد أدركت ناسا من صدر هذه الأمة كانوا عن الدنيا وهي مقبلة عليهم أشد إدبارا من إقبالكم عليها وهي مدبرة، يا عمر بن هبيرة، إني أخوفك مقاما خوفكه الله فقال: ﴿ذَٰلِكَ لِمَنْ خَافَ مَقَامِى وَخَافَ وَعِيدِ﴾ [إبراهيم: ١٤] يا عمر بن هبيرة، إن تك مع الله في طاعته كفاك يزيد بن عبد الملك، وإن تك مع يزيد على معاصي الله وكلك الله إليه. فبكى عمر بن هبيرة وقام لعبرته، فلما كان من الغد أرسل إليهما بإذنهما وجوائزهما، وأكثر فيها للحسن، وكان في جائزة الشعبي بعض الإقتار، فخرج", "حاشية: (١) سقطت من الأصل.", "الشعبي إلى المسجد فقال: أيها الناس، من استطاع منكم أن يؤثر الله على خلقه فليفعل، فوالذي نفسي في يده ما علم الحسن منه شيئا فجهلته، ولكني أردت وجه ابن هبيرة، فأقصاني الله منه."]], "ic": "book"}, {"story": ["الباب الرابع في أمر الأمراء والسلاطين بالمعروف ونهيهم عن الم (١٥ من ١٦)، ص٥٤٨", ["أنبأنا عبد الوهاب قال: أخبرنا المبارك بن عبد الجبار قال: أخبرنا أحمد بن علي التوزي قال: أخبرنا عمر بن ثابت قال: أخبرنا علي بن أبي قيس قال: حدثنا أبو بكر القرشي قال: حدثنامحمد بن يحيى قال: سمعت الخطاب أبا عمر يقول: دخل محمد بن واسع على بلال بن أبي بردة في يوم حار وبلال في خيشه وعنده الثلج(١)، فقال: يا أبا عبد الله، كيف ترى بيتنا هذا؟ قال: إن بيتك لطيب والجنة أطيب منه، وذكر النار يلهي عنه. قال: ما تقول في القدر؟ قال: جيرانك أهل القبور ففكر فيهم، فإن فيهم شغلا عن القدر. قال: ادع لي. قال: وما تصنع بدعائي وعلى بابك كذا وكذا كل يقولون: إنك ظلمتهم يرتفع دعاؤهم قبل دعائي؟ لا تظلم فلا تحتاج إلى دعائي.", "أخبرنا عبد الرحمن بن محمد القزاز قال: أخبرنا أحمد بن علي بن ثابت قال: أخبرنا علي بن المحسن قال: أخبرنا طلحة بن محمد بن جعفر قال: قال لي ابن حبيب الدارع: كنا ونحن أحداث مع أبي حازم عبد الحميد بن عبد العزيز القاضي، فكنا نقعده قاضيا ونتقدم إليه في الخصومات فما مضت الأيام والليالي حتى صار قاضيا. قال طلحة: وقال أبو الحسين عبد الواحد بن محمد الخضيبي وبلغ من شدته في الحكم أن المعتضد وجه إليه بطريف المخلدي فقال له: إن لي على الصيمري بيع كان للمعتضد ولغيره مالا، وقد بلغني أن غرماءه ثبتوا عندك وقد قسطت(٢) لهم من ماله فاجعلنا كأحدهم. فقال له أبو حازم: أمير المؤمنين أطال الله بقاءه ذاكر لما قال لي وقت أن قلدني أنه قد أخرج الأمر من عنقه وجعله في عنقي، فلا يجوز لي أن أحكم في مال رجل لمدع إلا ببينة. فرجع إليه طريف فأخبره فقال: قل له: فلان وفلان يشهدان ـ يعني رجلين جليلين كانا في ذلك", "حاشية: (١) تصحفت في الأصل إلى: «البلح».", "حاشية: (٢) في (ظ): «بسطت».", "الوقت ـ فقال: يشهدان عندي وأسأل عنهما فإن زكيا قبلت شهادتهما، وإلا أمضيت ما قد ثبت عندي. فامتنع أولئك من الشهادة فزعا، ولم يدفع إلى المعتضد شيئا.", "فهذا(١) مختصر من أخبار من وعظ الأمراء، فمن أراد الزيادة، فلينظر في كتاب «المصباح المضيء» وهذه كانت سيرة العلماء وعادتهم في الأمر والنهي، وقلة مبالاتهم بسطوات السلاطين إيثارا لإقامة حق الله سبحانه على بقائهم، واختيارا لإعزاز الشرع على حفظ مهجهم، واستسلاما للشهادة إن حصلت لهم، إلا أن السلاطين كانوا يعرفون حق العلم وفضله فيصبرون على مضض مواعظ هؤلاء، والذي أراه الآن الهرب من السلاطين، فهو الأولى، فإن قدر لقاء اقتنع بلطيف الموعظة فحسب، ولذلك سببان:", "أحدهما: يتعلق بالواعظ وهو سوء قصده وسيلة إلى الدنيا والرياء، فلا يخلص له وعظه.", "الثاني: يتعلق بالموعوظ، فإن حب الدنيا قد شغل الأكثرين عن ذكر الآخرة، وتعظيمهم لها أنساهم تعظيم العلماء، وليس للمؤمن أن يذل نفسه.", "**آخر كتاب الأمر بالمعروف والنهي عن المنكر**"]], "ic": "book"}, {"story": ["الباب الرابع في أمر الأمراء والسلاطين بالمعروف ونهيهم عن الم (١٦ من ١٦)، ص٥٤٩", ["حاشية: (١) قبلها في (ط): «قال المصنف»."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "أنبأنا أبو البركات الأنماطي قال: أخبرنا أبو الحسين الحمامي قال: أخبرنا أحمد بن علي التوزي قال للاقتداء به من أراد تهذيبه، فصلى الله عليه وعلى أصحابه وآله ما طلب نجم طالع معيبه، وسلم تسليما كثيرا.", "أما بعد؛ فإن آداب الظواهر عنوان أدب البواطن، وحركات الجوارح ثمرات الخواطر، والأعمال نتائج الأخلاق، والآداب رشح المعارف، وسرائر القلوب هي مغارس الأفعال ومنابعها، وأنوار(٢) السرائر هي التي تشرق على الظواهر فتزينها وتحليها، وتبدل بالمحاسن مساويها، ومن لم يخشع قلبه لم تخشع جوارحه، ومن لم يكن صدره مشكاة الأنوار الإلهية لم يفض على ظاهره جمال الآداب النبوية، وقد كان يصلح أن نختم هذا الربع بكتاب جامع لآداب العيش، إلا أن ربع العبادات وربع العادات قد أتنا على جملة من الآداب، فلا يصلح إعادتها؛ لأن الطباع مجبولة على معاداة المعادات، فاقتصرنا في هذا الكتاب على ذكر آداب رسول الله ﷺ وأخلاقه ليجتمع مع جمع الآداب تأكيد الإيمان بمشاهدة أخلاقه الكريمة التي تشهد آحادها بأنه أكرم الخلق وأعلاهم رتبة وأجلهم قدرا، فكيف مجموعها؟", "حاشية: (١) النجيب: واحد النجائب، وهي خيار الإبل.", "حاشية: (٢) تحرفت في الأصل إلى: «أنواع».", "ولنذكر فيه أولا: بيان تأديب الله تعالى إياه بالقرآن، ثم بيان جوامع من محاسن أخلاقه وآدابه وكلامه وحلمه وسخائه وشجاعته وتواضعه وصورته ومعجزاته وآياته ﷺ.", "**بيان تأديب الله عز وجل حبيبه محمدا ﷺ بالقرآن**"]], "ic": "book"}, {"story": ["كتاب آداب المعيشة وأخلاق النبوة (٢ من ٦)، ص٥٥٣", ["كان (١-١)رسول الله ﷺ(١-١) كثير الابتهال، دائم السؤال لله عز وجل أن يزينه بمحاسن الآداب ومكارم الأخلاق، فكان يقول في دعائه: «اللهم حسن خلقي وخلقي، اللهم جنبني منكرات الأخلاق». فاستجاب الله عز وجل دعاءه فأدبه بالقرآن، فقالت عائشة وقد سئلت عن خلق رسول الله فقالت: كان خلقه القرآن. وإنما أدبه بمثل قوله: ﴿خُذِ ٱلْعَفْوَ وَأْمُرْ بِٱلْعُرْفِ وَأَعْرِضْ عَنِ ٱلْجَـٰهِلِينَ﴾ [الأعراف: ١٩٩]، وقوله: ﴿إِنَّ ٱللَّهَ يَأْمُرُ بِٱلْعَدْلِ وَٱلْإِحْسَـٰنِ وَإِيتَآئِ ذِى ٱلْقُرْبَىٰ وَيَنْهَىٰ عَنِ ٱلْفَحْشَآءِ وَٱلْمُنكَرِ وَٱلْبَغْىِ﴾ [النحل: ٩٠]، وقوله: ﴿وَٱصْبِرْ وَمَا صَبْرُكَ إِلَّا بِٱللَّهِ﴾ [النحل:١٢٧]، وقوله: ﴿وَلَمَن صَبَرَ وَغَفَرَ﴾ [الشورى: ٤٣] إلى غير ذلك من الآداب(٢) التي تضمنها القرآن، ولما كسرت رباعيته فقال: «فكيف يفلح قوم فعلوا هذا بنبيهم»؟ أنزل الله تعالى عليه: ﴿لَيْسَ لَكَ مِنَ ٱلْأَمْرِ شَىْءٌ﴾ [آل عمران: ١٢٨] تأديبا له وحثا له على الصفح، ثم لما أكمل الله تعال خلقه أثنى عليه فقال: ﴿وَإِنَّكَ لَعَلَىٰ خُلُقٍ عَظِيمٍ﴾ [القلم: ٤]، فسبحان من أعطى ثم أثنى.", "ثم بين رسول الله ﷺ للخلق أن الله عز وجل يحب مكارم الأخلاق ويبغض سفسافها، ومن مكارم الأخلاق حسن المعاشرة، وكرم الصنيعة، ولين الجانب، وبذل المعروف، وإطعام الطعام، وإفشاء السلام، وعيادة المريض، وتشييع الجنائز، وحسن الجوار، وتوقير ذي الشيبة المسلم، وإجابة الطعام(٣)، والعفو، والإصلاح بين الناس، والجود، والكرم، والسماحة، والابتداء بالسلام، وكظم", "حاشية: (١-١) ليس في (ظ).", "حاشية: (٢) في الأصل: «الآيات».", "حاشية: (٣) يعني إجابة الداعي لدعوة الطعام.", "الغيظ، والعفو، وترك الكذب، والغيبة، والبخل، والشح، والجفاء، والمكر والخديعة، والنميمة، والقطيعة، وسوء الخلق، والتكبر(١)، والفخر، والاختيال، والفحش(٢) والحقد، والحسد، والطيرة، والبغي، والظلم.", "حاشية: (١) في الأصل: «الكبر».", "حاشية: (٢) ليس في (ظ).", "**بيان جملة من محاسن أخلاقه ﷺ**"]], "ic": "book"}, {"story": ["كتاب آداب المعيشة وأخلاق النبوة (٣ من ٦)، ص٥٥٥", ["كان رسول الله ﷺ أحلم(١) الناس، وأشجع الناس، وأسخى الناس، وأعف الناس، لم تمس يده يد امرأة لا يملكها، لا يرد سائلا، وكان يخصف النعل(٢)، ويرقع الثوب وهو في مهنة(٣) أهله، وكان أشد حياء من العذراء في خدرها، وكان يجيب دعوة المملوك، ويعود المرضى، ويمشي وحده، ويردف خلفه، ويقبل الهدية، ويكافئ عليها، ويأكلها ولا يأكل الصدقة، وكان لا يجد من الدقل(٤) ما يملأ بطنه، ولم يشبع من خبز بر ثلاثة أيام تباعا، ويعصب على بطنه الحجر من الجوع، وكان يأكل ما حضر، ولا يذم طعاما قط، ولا يأكل متكئا، ويأكل مما يليه، وكان أحب الطعام إليه اللحم، ومن الشاة الكتف، ومن البقول الدباء(٥)، ومن الصباغ(٦) الخل، ومن التمر العجوة، ويلبس ما وجد، فمرة برد حبرة، ومرة جبة صوف، ويركب تارة بعيرا، وتارة بغلة، وتارة حمارا، ويمشي مرة راجلا حافيا، يحب الطيب ويكره الرائحة الرديئة، ويكرم أهل الفضل، ويتألف أهل الشرف، ولا يجفو على أحد، يقبل معذرة المعتذر إليه، يمزح ولا يقول إلا حقا، يضحك من غير قهقهة، ويدخل إلى بساتين أصحابه، ولا يمضي عليه وقت في غير عمل لله تعالى أو فيما لا بد منه من صلاح نفسه، وما لعن امرأة ولا خادما قط، وقال: «من سببته من المسلمين فاجعل ذلك له زكاة وأجرا». وما ضرب بيده أحدا", "حاشية: (١) في (ظ): «أحكم».", "حاشية: (٢) يخصف النعل: أي يصلحها بترقيع وخرز.", "حاشية: (٣) أي في خدمتهم.", "حاشية: (٤) الدقل: التمر الرديء.", "حاشية: (٥) الدباء: القرع وهو اليقطين.", "حاشية: (٦) الصباغ: الإدام المائع.", "قط إلا أن يضرب بها في سبيل الله، وما انتقم لنفسه قط، إلا أن تنتهك محارم الله، وما خير بين أمرين قط(١) إلا اختار أيسرهما، إلا أن يكون مأثما أو قطيعة رحم، فيكون أبعد الناس منه.", "وقال أنس: خدمته تسع سنين فما قال لي لشيء فعلته: لم فعلته؟ ولا: ألا فعلت كذا.", "ومن صفته في التوراة: محمد رسول الله عبدي المختار، لا فظ ولا غليظ، ولا صخاب في الأسواق، ولا يجزي بالسيئة السيئة، ولكن يعفو ويصفح.", "وكان من خلقه أن يبدأ بالسلام من لقيه ومن قاومه(٢) لحاجة صابره حتى يكون هو المنصرف، وما أخذ أحد يده فأرسل يده حتى يرسلها الآخذ، وكان لا يدعوه أحد إلا قال له: لبيك. وكان يجلس حيث انتهى به المجلس مختلطا بأصحابه كأنه أحدهم، فيأتي الغريب فلا يدري أيهم هو حتى يسأل عنه، وكان يعطي كل جليس نصيبه من وجهه وأتي برجل فأرعد من هيبته فقال: «هون عليك، فلست بملك، إنما أنا ابن امرأة من قريش، كانت تأكل القديد».", "وكان طويل السكوت، فإذا تكلم لم يسرد الكلام: بل يثبت فيه ويكرره ليفهم، وكان يعفو مع القدرة، وقال له رجل: اعدل فما عدلت. فقال: «فمن يعدل إذا لم أعدل»؟. وقال: «رحم الله أخي موسى قد أوذي بأكثر من هذا فصبر»."]], "ic": "book"}, {"story": ["كتاب آداب المعيشة وأخلاق النبوة (٤ من ٦)، ص٥٥٦", ["وكان رقيق البشرة يعرف في وجهه غضبه ورضاه، وكان إذا اشتد وجده أكثر من مس لحيته، وكان لا يواجه أحدا بما يكره، رأى على رجل صفرة فقال: «لو قلتم لهذا أن يدع هذه» يعني: الصفرة.", "وكان أصدق الناس لهجة، وأوفاهم ذمة، وألينهم عريكة، وأكرمهم عشيرة، من رآه بديهة هابه، ومن خالطه معرفة أحبه.", "حاشية: (١) ليست في الأصل.", "حاشية: (٢) قاومه: أي قام معه ووقف.", "وكان أصحابه إذا تكلموا في أمور الدنيا تكلم(١) معهم، وكانوا يتذاكرون أمر الجاهلية فيضحكون ويبتسم، وأتاه رجل، فسأله غنما بين جبلين، فرجع إلى قومه فقال: أسلموا فإن محمدا يعطي عطاء من لا يخشى الفاقة.", "وقال: «لو كان عندي عدد(٢) هذه العضاه(٣) نعما لقسمته بينكم، ثم لا تجدوني بخيلا، ولا كذابا، ولا جبانا».", "وكان أشجع الناس، قال بعض أصحابه: كنا إذا احمر البأس اتقينا برسول الله.", "ولم يكن بالطويل البائن، ولا بالقصير المتردد(٤)، وكان ربعة من القوم، وكان أزهر اللون، ولم يكن بالآدم(٥)، وكان رجل الشعر ليس بالسبط ولا الجعد القطط(٦) واسع الجبهة أزج الحواجب(٧)، أدعج العينين(٨) أهدب الأشفار، أقنى العرنين(٩)، سهل الخدين، كث اللحية، كأن عنقه جيد دمية، عريض الصدر، سواء البطن والصدر، رحب الراحتين، طويل الزندين، كفه ألين من الحرير.", "وكان إذا مشى كأنه يتقلع وينحدر من صبب، يخطو متكفئا، ويمشي الهوينا.", "وأما أسماؤه: فأحمد، ومحمد، والماحي، والحاشر، والعاقب، والمقفي، ونبي الرحمة، ونبي التوبة، ونبي الملاحم، والشاهد، والمبشر، والنذير، والضحوك، والقتال، والمتوكل، والفاتح، والأمين، والخاتم، والمصطفى، والرسول، والنبي، والأمي، والقثم.", "حاشية: (١) في (ظ): «تحدث».", "حاشية: (٢) تحرفت في (ظ) إلى: «عقد».", "حاشية: (٣) العضاه: جمع عضاهه، وهي الشجرة لها شوك.", "حاشية: (٤) أي الذي يتردد بعض خلقه على بعض من القصر المفرط.", "حاشية: (٥) الآدم: الشديد السمرة.", "حاشية: (٦) الجعد القطط: الشديد الجعودة.", "حاشية: (٧) أزج الحواجب: أي حاجباه مقوسان مع كثرة شعرهما.", "حاشية: (٨) أدعج العينين: شديد سواد حدقتهما.", "حاشية: (٩) أقنى العرنين: العرنين أول الأنف، والقنى في الأنف طوله ورقة أرنبته مع حدب في وسطه.", "فالماحي الذي يمحى به الكفر، والحاشر الذي يحشر الناس على قدمه، أي: يقدمهم وهم خلفه، والعاقب: آخر الأنبياء، والمقفي بمعنى العاقب لأنه تبع الأنبياء، والملاحم الحروب، والضحوك صفته في التوراة، وإنما قيل له: الضحوك؛ لأنه كان(١) طيب النفس فكها.", "والقثم من معنيين: أحدهما: من القثم الذي هو الإعطاء، يقال: قثم له من الخير يقثم: إذا أعطاه، وكان أجود بالخير من الريح الهابة. والثاني: من القثم الذي هو الجمع، يقال للرجل الجموع للخير: قثوم وقثم."]], "ic": "book"}, {"story": ["كتاب آداب المعيشة وأخلاق النبوة (٥ من ٦)، ص٥٥٨", ["وأما معجزاته ﷺ، فإن من شاهد أحواله وتسمع أخباره المشتملة على أخلاقه وأفعاله وآدابه وبدائع تدبيراته لمصالح الخلق، ومحاسن إشاراته في تفصيل ظاهر الشرع الذي يعجز العقلاء والفقهاء عن إدراك أوائل دقائقها في طول أعمارهم لم يبق له ريب في أن ذلك لم يكن مكتسبا بحيلة تقوم بها القوة البشرية وأنه لا يتصور ذلك إلا باستمداد من تأييد سماوي وقوة إلهية، فإن ذلك لا يصح لملبس ولا لكذاب، بل كانت شمائله وأحواله شواهد قاطعة بصدقه، ولهذا قال من رآه من المتيقظين، منهم عبد الله بن سلام: رأيته فعلمت أنه ليس بوجه كذاب. فعرف بما آتاه الله تعالى من ذلك صدقه، فإنه رجل أمي لم يمارس العلم، ولم يطالع الكتب، ولم يسافر في طلب العلوم، ولم يزل بين أظهر الجهال من العرب يتيما ضعيفا مستضعفا، فلولا الوحي لم يستقل بذلك، ولو لم يكن من معجزاته إلا هذا لكفى، وقد ظهر على يديه ما أعظمه القرآن العزيز الذي عجز الخلائق عن الإتيان بمثله، فمعجز كل نبي انقضى بذهابه، وهذا المعجز باق أبدا، وقد وقع التعجيز بلفظه تارة، وبما يحتوي عليه من الإخبار بالغائبات، وأنها ستكون على وصف فكانت كما أخبر كقوله تعالى: ﴿فَتَمَنَّوُا۟ ٱلْمَوْتَ﴾ [البقرة: ٩٤]. ثم قال: ﴿وَلَن يَتَمَنَّوْهُ﴾ [البقرة: ٩٥]، وقوله: ﴿فَسَيُنفِقُونَهَا ثُمَّ تَكُونُ عَلَيْهِمْ حَسْرَةً ثُمَّ يُغْلَبُونَ﴾ [الأنفال: ٣٦].", "حاشية: (١) ليست في الأصل.", "ثم أضيف إلى هذا المعجز مثل انشقاق القمر، ونبع الماء من بين أصابعه، وإطعامه الخلق الكثير من الطعام اليسير، ورميه بحصيات يسيرة فوصلت إلى أعين الخلق الكثير، وحنين الجذع إليه كما تحن العشار.", "ثم إخباره بالغائبات، فكانت مثل قوله، كقوله لعثمان: «سيصيبك بلاء»، ولعمار: «تقتلك الفئة الباغية»، وللحسن: «يصلح الله به(١) بين فئتين عظيمتين»، وأخبر فاطمة أنها أول أهله لحاقا به، فكان كذلك، وأخبر نساءه أن أطولهن يدا أسرعهن لحاقا به، فكانت زينب بنت جحش أطولهن يدا بالصدقة وأولهن لحاقا به، وندرت(٢) عين قتادة بن النعمان فردها بيده، فكانت أحسن عينيه، وتفل في عين علي رضي الله عنه وهو أرمد فصح من وقته، إلى غير ذلك من المعجزات التي شاعت بين العدو والصديق، ولم يوجد سبيل إلى نكرها(٣) لشياعها، فمن استراب بها كان كالمستريب بسخاء حاتم وشجاعة علي، ومعلوم أن آحاد أخبارهم غير متواترة، ولكن مجموع الوقائع أورث علما ضروريا، فأعظم بغباوة من ينظر في أحواله، ثم في أقواله، ثم في أخلاقه، ثم في معجزاته، ثم في استمرار شرعه إلى الآن، ثم في انتشاره في أقطار العالم، ثم إذعان الملوك له في عصره وبعده، ثم يتمارى في صدقه.", "فنسأل الله عز وجل أن يوفقنا للإيمان به، والاقتداء بأخلاقه، إنه كريم مجيب.", "**آخر كتاب أخلاق النبوة**", "**(٤-٤)وهو آخر ربع العاد
