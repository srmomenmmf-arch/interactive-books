كول، والمشروب، والملبوس، والمركوب، والعقار، ونحو ذلك، فلا يصح بيع ما يحرم الانتفاع به، كالخمر، والميتة، والخنزير، وآلات اللهو، والمعازف.", "لحديث جابر رضي الله عنه قال: قال رسول الله ﷺ: «إن الله حرم بيع الخمر والميتة والخنزير، والأصنام».", "وعن ابن عباس رضي الله عنه أن النبي ﷺ قال: «إن الله إذا حرم على قوم أكل شيء حرم ثمنه».", "ولا يجوز بيع الكلب؛ لحديث أبي مسعود رضي الله عنه، قال: «نهى رسول الله ﷺ عن ثمن الكلب...».", "خامسا: أن يكون المعقود عليه مقدورا على تسليمه؛ لأن غير المقدور عليه كالمعدوم، فلا يصح بيعه؛ إذ هو داخل في بيع الغرر، فإن المشتري قد يدفع الثمن ولا يحصل على المبيع؛ فلا يجوز بيع السمك في الماء، ولا النوى في التمر، ولا الطير في الهواء، ولا اللبن في الضرع، ولا الحمل الذي في بطن أمه، ولا الحيوان الشارد.", {"note": "حاشية (ص225): بيع الغرر: ما كان له ظاهر يغر المشتري، وباطن مجهول."}, "لحديث أبي هريرة رضي الله عنه قال: «نهى رسول الله ﷺ عن بيع الغرر».", "سادسا: أن يكون المعقود عليه معلوما لكل منهما عند العقد، أو وصفا يميزه عن غيره، ومشاهدته برؤيته ومعرفته؛ لأن الجهالة غرر، والغرر منهي عنه، فلا يصح أن يشتري شيئا لم يره، أو رآه وجهله، وهو غائب عن مجلس العقد.", "سابعا: أن يكون الثمن معلوما؛ بتحديد سعر السلعة المبيعة، ومعرفة قيمتها."]], "ic": "scroll"}, {"story": ["المسألة السادسة: البيوع المنهي عنها", ["نهى الشارع الحكيم عن بعض البيوع إذا ترتب عليها تضييع لما هو أهم؛ كأن تشغل عن أداء عبادة واجبة، أو يترتب عليها إضرار بالآخرين. ومن هذه البيوع المنهي عنها:", "1- البيع والشراء بعد الأذان الثاني يوم الجمعة.", "لا يصح البيع ولا الشراء ممن تلزمه صلاة الجمعة بعد الأذان الثاني؛ لقوله تعالى: ﴿يا أيها الذين آمنوا إذا نودي للصلاة من يوم الجمعة فاسعوا إلى ذكر الله وذروا البيع﴾ [الجمعة: 9].", "فقد نهى الله تعالى عن البيع في هذا الوقت، والنهي يقتضي التحريم، وعدم صحة البيع.", "2- بيع الأشياء لمن يستعين بها على معصية الله، أو يستخدمها في المحرمات. فلا يصح بيع العصير لمن تتخذه خمرا، ولا الأواني لمن يشرب بها الخمر، ولا بيع السلاح في وقت الفتنة بين المسلمين. قال تعالى: ﴿وتعاونوا على البر والتقوى ولا تعاونوا على الإثم والعدوان﴾ [المائدة: 2].", "3- بيع المسلم على بيع أخيه.", "مثاله: أن يقول لمن اشترى شيئا بعشرة: أنا أبيعك مثله بأرخص منه، أو أبيعك أحسن منه بنفس الثمن؛ لحديث ابن عمر رضي الله عنه، قال: قال رسول الله ﷺ: «ولا يبع بعضكم على بيع بعض».", "4- الشراء على الشراء.", "مثاله: أن يقول لمن باع شيئا: افسخ البيع، وأنا أشتريه منك بأكثر، بعد أن اتفق البائع والمشتري على الثمن. وهذه الصورة داخلة في النهي الوارد في الحديث السابق.", "5- بيع العينة.", "وصورتها: أن يبيع شخص سلعة لآخر بثمن معلوم إلى أجل، ثم يشتريها منه البائع بثمن حاضر أقل، وفي نهاية الأجل يدفع المشتري الثمن الأول. كأن يبيع أرضا بخمسين ألفا يدفعها بعد سنة، ثم يشتريها البائع منه بأربعين ألفا نقدا، ويبقى في ذمته الخمسون ألفا يدفعها المشتري على رأس السنة؛ وسميت عينة لأن المشتري يأخذ مكان السلعة عينا؛ أي: نقدا حاضرا.", "وحرم هذا البيع؛ لأنه حيلة يتوصل بها إلى الربا؛ فعن ابن عمر رضي الله عنه، قال: قال رسول الله ﷺ: «إذا تبايعتم بالعينة وأخذتم أذناب البقر وتركتم الجهاد سلط الله عليكم ذلا لا يرفعه حتى ترجعوا إلى دينكم».", "6- بيع المبيع قبل قبضه.", "مثاله: أن يشتري سلعة من شخص، ثم يبيعها قبل أن يقبضها ويحوزها.", "عن أبي هريرة رضي الله عنه: قال رسول الله ﷺ: «من ابتاع طعاما فلا يبعه حتى يقبضه»، وعن زيد بن ثابت: «أن رسول الله ﷺ نهى أن تباع السلع حيث تبتاع، حتى يحوزها التجار إلى رحالهم».", "فلا يجوز لمن اشترى شيئا أن يبيعه حتى يقبضه قبضا تاما.", "7- بيع الثمار قبل بدو صلاحها.", "لا يجوز بيع الثمرة قبل أن يبدو صلاحها؛ خوفا من تلفها وحدوث عيب بها قبل أخذها، فعن أنس رضي الله عنه قال: قال رسول الله ﷺ: «أرأيت إن منع الله الثمرة، بم يأخذ أحدكم مال أخيه؟».", "وعن ابن عمر رضي الله عنه: «نهى رسول الله ﷺ عن بيع الثمار حتى يبدو صلاحها، نهى البائع والمبتاع».", "ويعرف بدو صلاحها: باحمرار ثمار النخيل أو اصفرارها، وفي العنب أن يسود وتبدو الحلاوة فيه، وفي الحب أن ييبس ويشتد، ونحو ذلك في بقية الثمار.", "8- النجش.", "وهو أن يزيد شخص في ثمن السلعة المعروضة للبيع، ولا يريد شراءها، وإنما ليغر غيره بها، ويرغبه فيها، ويرفع سعرها.", "عن ابن عمر رضي الله عنه: «أن رسول الله ﷺ نهى عن النجش»."]], "ic": "scroll"}, {"story": ["المسألة السابعة: الإقالة في البيع", ["الإقالة: رفع العقد الذي وقع بين المتعاقدين برضاهما. وتحصل بسبب ندم أحد العاقدين على العقد، أو يتبين للمشتري أنه ليس محتاجا للسلعة، أو لم يستطع دفع ثمنها، فيرجع كل من البائع والمشتري بما كان له من غير زيادة ولا نقص.", "والإقالة مشروعة، وحث عليها رسول الله ﷺ بقوله: «من أقال مسلما بيعته أقال الله عثرته يوم القيامة»."]], "ic": "scroll"}, {"story": ["المسألة الثامنة: عقد المرابحة", ["المرابحة: بيع السلعة بثمنها المعلوم بين المتعاقدين، بربح معلوم بينهما.", "مثالها: يقول صاحب السلعة: رأس مالي فيها مائة ريال، أبيعك إياها بالمائة، وربح عشرة ريالات.", "فالبيع على هذه الصورة صحيح، إذا علم البائع والمشتري مقدار الثمن، ومقدار الربح.", "قال تعالى: ﴿وأحل الله البيع﴾ [البقرة: 275]، وقال جل شأنه: ﴿إلا أن تكون تجارة عن تراض منكم﴾ [النساء: 29].", "والمرابحة بيع تحقق فيه رضا المتعاقدين، والحاجة ماسة إلى جوازه؛ لأن بعض الناس لا يحسن الشراء ابتداء، فيعتمد على غيره في الشراء، ويزيده ربحا محددا معلوما بينهما."]], "ic": "scroll"}, {"story": ["المسألة التاسعة: البيع بالتقسيط", ["هو بيع السلعة إلى أجل محدد، يقسط فيه الثمن أقساطا متعددة، لكل قسط أجل معلوم يدفعه المشتري.", "مثاله: أن تكون عند البائع سيارة، قيمتها نقدا أربعون ألف ريال، ومؤجلة ستون ألف ريال، فيتفق مع المشتري على أن يسدده المبلغ على اثني عشر قسطا، يدفع في نهاية كل شهر خمسة آلاف ريال.", "حكمه: الجواز؛ عن عائشة رضي الله عنها قالت: «اشترى رسول الله ﷺ من يهودي طعاما بنسيئة -أي بالأجل- ورهنه درعا له من حديد».", "والبيع بهذه الطريقة فيه فائدة لكل من البائع والمشتري، فإن البائع يزيد في مبيعاته، ويعدد من أساليبه في تسويق بضاعته، فيبيع نقدا وتقسيطا، ويستفيد في حال التقسيط من زيادة الثمن مقابل الأجل. كما أن المشتري يحصل على السلعة وإن لم تكن عنده قيمتها، ويسدد ثمنها فيما بعد أقساطا.", "شروط صحة بيع التقسيط:", "يشترط لصحة بيع التقسيط إضافة إلى شروط البيع المتقدمة ما يلي:", "1- أن تكون السلعة بحوزة البائع وتحت تصرفه عند العقد، فلا يجوز لهما الاتفاق على ثمنها، وتحديد مواعيد السداد والأقساط، ثم بعد ذلك يشتريها البائع ويسلمها للمشتري؛ فإن هذا محرم؛ لقوله ﷺ: «لا تبع ما ليس عندك».", "2- لا يجوز إلزام المشتري -عند العقد أو فيما بعد- بدفع مبلغ زائد على ما اتفقا عليه عند العقد في حال تأخره عن دفع الأقساط؛ لأن ذلك ربا محرم.", "3- يحرم على المشتري المليء المماطلة في سداد ما حل من الأقساط.", "4- لا حق للبائع في الاحتفاظ بملكية المبيع بعد البيع، ولكن يجوز له أن يشترط على المشتري رهن المبيع عنده؛ لضمان حقه في استيفاء الأقساط المؤجلة."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "البيع في اللغة:", "o": ["أخذ شيء، وإعطاء شيء", "مبادلة مال بمال فقط", "هبة المال", "إعارة المال"], "h": "راجع: ص221 (المسألة الأولى)"}, {"t": "mcq", "d": 1, "q": "أركان البيع:", "o": ["عاقد، ومعقود عليه، وصيغة", "بائع ومشتري فقط", "ثمن ومثمن فقط", "شهود وكتابة وصيغة"], "h": "راجع: ص221 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "الإيجاب هو:", "o": ["اللفظ الصادر من البائع", "اللفظ الصادر من المشتري", "الأخذ والإعطاء", "كتابة العقد"], "h": "راجع: ص221 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "المعاطاة هي:", "o": ["الأخذ والإعطاء بدون قول", "الإيجاب والقبول باللفظ", "الإشهاد", "الخيار"], "h": "راجع: ص222 (المسألة الثانية)"}, {"t": "tf", "d": 1, "q": "الإشهاد على البيع مستحب وليس بواجب.", "a": true, "h": "راجع: ص222 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "خيار المجلس يكون للعاقدين:", "o": ["ما داما في مجلس العقد ولم يتفرقا", "مدة شهر", "بعد التفرق", "لا يثبت لهما"], "h": "راجع: ص223 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "خيار العيب يثبت للمشتري إذا:", "o": ["وجد عيبا في السلعة لم يخبره به البائع", "ندم على الشراء فقط", "رأى سلعة أرخص", "تأخر في الدفع"], "h": "راجع: ص224 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "من غش في البيع فقد قال ﷺ:", "o": ["من غشنا فليس منا", "من غشنا فقد أثم فقط", "البيعان بالخيار", "لا ضرر ولا ضرار"], "h": "راجع: ص224 (المسألة الرابعة)"}, {"t": "tf", "d": 2, "q": "يصح البيع إذا أكره أحد المتعاقدين بغير حق.", "a": false, "h": "راجع: ص224 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ لحكيم بن حزام:", "o": ["لا تبع ما ليس عندك", "بع ما شئت", "لا تبع إلا بشهود", "بع نقدا فقط"], "h": "راجع: ص225 (المسألة الخامسة)"}, {"t": "tf", "d": 1, "q": "يجوز بيع الكلب.", "a": false, "h": "راجع: ص225 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "لا يجوز بيع السمك في الماء لأنه:", "o": ["غير مقدور على تسليمه، وهو من بيع الغرر", "غير مباح", "محرم الأكل", "رخيص الثمن"], "h": "راجع: ص225 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "البيع والشراء بعد الأذان الثاني يوم الجمعة:", "o": ["لا يصح", "يصح", "مكروه فقط", "مستحب"], "h": "راجع: ص226 (المسألة السادسة)"}, {"t": "mcq", "d": 2, "q": "النجش هو أن:", "o": ["يزيد شخص في ثمن السلعة وهو لا يريد شراءها", "يبيع المسلم على بيع أخيه", "يشتري قبل القبض", "يبيع الثمار قبل صلاحها"], "h": "راجع: ص228 (المسألة السادسة)"}, {"t": "mcq", "d": 3, "q": "سميت العينة بهذا الاسم لأن المشتري:", "o": ["يأخذ مكان السلعة عينا؛ أي نقدا حاضرا", "يعين السلعة", "يعين الثمن", "يعين الأجل"], "h": "راجع: ص227 (المسألة السادسة)"}, {"t": "mcq", "d": 2, "q": "الإقالة هي:", "o": ["رفع العقد الذي وقع بين المتعاقدين برضاهما", "فسخ العقد بغير رضا", "تأجيل الثمن", "رد السلعة بالعيب"], "h": "راجع: ص228 (المسألة السابعة)"}, {"t": "mcq", "d": 2, "q": "المرابحة هي:", "o": ["بيع السلعة بثمنها المعلوم بين المتعاقدين، بربح معلوم بينهما", "بيع السلعة بأقل من ثمنها", "بيع السلعة بالأجل فقط", "بيع السلعة بثمن مجهول"], "h": "راجع: ص229 (المسألة الثامنة)"}, {"t": "tf", "d": 2, "q": "لا يجوز للبائع أن يزيد على المشتري مبلغا إذا تأخر عن دفع الأقساط؛ لأن ذلك ربا محرم.", "a": true, "h": "راجع: ص230 (المسألة التاسعة)"}, {"t": "tf", "d": 2, "q": "اشترى رسول الله ﷺ من يهودي طعاما بنسيئة ورهنه درعا له من حديد.", "a": true, "h": "راجع: ص229 (المسألة التاسعة)"}]}], "sum": [["تعريف البيع وحكمه", "ص221-230"], ["أركان البيع", "ص221-230"], ["الإشهاد على البيع", "ص221-230"], ["الخيار في البيع", "ص221-230"]]}, {"id": "l50", "title": "الباب الثاني: في الربا", "group": "الكتاب السابع: المعاملات", "map": {"center": "الباب الثاني\nالمعاملات", "nodes": [{"t": "تعريف الربا وحكمه", "s": []}, {"t": "الحكمة في تحريمه", "s": []}, {"t": "أنواع الربا", "s": []}, {"t": "صور لبعض المسائل الربوية", "s": []}]}, "paras": [{"t": "الباب الثاني: في الربا", "b": [{"pic": ["scroll", "book"], "cap": "ص230-234"}, {"story": ["المسألة الأولى: تعريف الربا وحكمه", ["1- تعريفه:", "الربا في اللغة: الزيادة.", "وشرعا: زيادة أحد البدلين المتجانسين من غير أن يقابل هذه الزيادة عوض.", "2- حكمه: الربا محرم في كتاب الله تعالى، قال جل شأنه: ﴿وأحل الله البيع وحرم الربا﴾ [البقرة: 275]. وقال عز وجل: ﴿يا أيها الذين آمنوا اتقوا الله وذروا ما بقي من الربا إن كنتم مؤمنين﴾ [البقرة: 278].", "وتوعد سبحانه وتعالى المتعامل بالربا بأشد الوعيد، فقال تعالى: ﴿الذين يأكلون الربا لا يقومون إلا كما يقوم الذي يتخبطه الشيطان من المس﴾ [البقرة: 275]، أي: لا يقومون من قبورهم يوم البعث، إلا كقيام المصروع حالة صرعه؛ وذلك لتضخم بطونهم بسبب أكلهم الربا في الدنيا.", "وعده رسول الله ﷺ من الكبائر، ولعن كل المتعاملين بالربا، على أي حال كانوا، فعن جابر رضي الله عنه قال: لعن رسول الله ﷺ آكل الربا وموكله، وكاتبه وشاهديه، وقال: «هم سواء». وقد أجمعت الأمة على تحريمه."]], "ic": "scroll"}, {"story": ["المسألة الثانية: الحكمة في تحريمه", ["التعامل بالربا يحمل على حب الذات، والتكالب على جمع الأموال وتحصيلها من غير الطرق المشروعة، وتحريمه رحمة بالعباد، فإن فيه أخذا لأموال الآخرين بغير عوض؛ إذ المرابي يأكل أموال الناس دون أن يستفيدوا شيئا في مقابله، كما أنه يؤدي إلى تضخم الأموال وزيادتها على حساب سلب أموال الفقراء، ويعود المرابي الكسل والخمول، والابتعاد عن الاشتغال بالمكاسب المباحة النافعة.", "كما أن فيه قطعا للمعروف بين الناس، وسدا لباب القرض الحسن، وتحكم طبقة من المرابين بأموال الأمة واقتصاد البلاد، وهو وإن زاد مال المرابي فإن الله تعالى يمحق بركته، ولا يبارك فيه، وهو معصية عظيمة لله تعالى. قال تعالى: ﴿يمحق الله الربا ويربي الصدقات﴾ [البقرة: 276]."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: أنواع الربا", ["أولا: ربا الفضل:", "هو الزيادة في أحد البدلين الربويين المتفقين جنسا.", "مثاله: أن يشتري شخص من آخر ألف صاع من القمح بألف ومائتي صاع من القمح، ويتقابض المتعاقدان العوضين في مجلس العقد. فهذه الزيادة، وهي مائتا صاع من القمح، لا مقابل لها، وإنما هي فضل.", "حكمه: حرمت الشريعة الإسلامية ربا الفضل في ستة أشياء: الذهب، والفضة، والبر، والشعير، والتمر، والملح. فإذا بيع واحد من هذه الأشياء الستة بجنسه حرمت الزيادة والتفاضل بينهما؛ لحديث أبي سعيد الخدري رضي الله عنه: أن رسول الله ﷺ قال: «الذهب بالذهب، والفضة بالفضة، والبر بالبر، والشعير بالشعير، والتمر بالتمر، والملح بالملح، مثلا بمثل، يدا بيد، فمن زاد أو استزاد فقد أربى، الآخذ والمعطي سواء». ويقاس على هذه الأشياء الستة ما شاركها في العلة، فيحرم فيه التفاضل.", "فعلة الربا في هذه الأشياء: الكيل والوزن، فيحرم التفاضل في كل مكيل وموزون.", "ثانيا: ربا النسيئة:", "هو الزيادة في أحد العوضين مقابل تأخير الدفع، أو تأخير القبض في بيع كل جنسين اتفقا في علة ربا الفضل، ليس أحدهما نقدا.", "مثاله: أن يبيع شخص ألف صاع من القمح بألف ومائتي صاع من القمح لمدة سنة، فتكون الزيادة مقابل امتداد الأجل، أو يبيع كيلو شعير بكيلو بر ولا يتقابضان.", "حكمه: التحريم، فإن النصوص الواردة في القرآن والسنة المحرمة للربا والمحذرة من التعامل به، يدخل فيها هذا النوع من الربا دخولا أوليا، وهذا هو الذي كان معروفا في الجاهلية، وهو الذي تتعامل به البنوك الربوية في هذا العصر.", "عن أبي سعيد الخدري رضي الله عنه قال: قال رسول الله ﷺ بعد أن ذكر الذهب والفضة: «ولا تبيعوا منها غائبا بناجز» والناجز: الحاضر. وفي لفظ: «ما كان يدا بيد فلا بأس به، وما كان نسيئة فهو ربا»."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: صور لبعض المسائل الربوية", ["يتبين لنا من خلال تطبيق القاعدة الآتية وما اشتملت عليه، معرفة إن كانت المسألة من مسائل الربا، أو هي من الصور المباحة. وهذه القاعدة هي: إذا بيع الربوي بجنسه، اشترط فيه شرطان:", "1- التقابض من الطرفين في مجلس العقد قبل أن يفترقا.", "2- التساوي بينهما بالمعيار الشرعي، المكيل بالمكيل، والموزون بالموزون.", {"note": "حاشية (ص233): المراد به: إن كان واحدا من الأصناف الستة المتقدم ذكرها في حديث أبي سعيد الخدري رضي الله عنه، أو ما في معناها."}, "أما إذا بيع الربوي بربوي من غير جنسه فليس شرطا، وإذا بيع الربوي بغير ربوي جاز التفاضل والتفرق قبل القبض.", "وفيما يلي بعض الصور وأحكامها:", "1) باع مائة جرام من الذهب، بمائة جرام من الذهب بعد شهر. هذا محرم، وهو من الربا؛ لأنهما لم يتقابضا في المجلس.", "2) اشترى كيلو جرام من الشعير بكيلو جرام من البر، جاز لاختلاف الجنس، ويشترط التقابض في المجلس.", "3) إذا باع خمسين كيلو جراما من البر بشاة جاز مطلقا، سواء تقابضا في المجلس أو لا.", "4) باع مائة دولار، بمائة وعشرة دولارات. لا يجوز.", "5) اقترض ألف دولار على أن يعيدها بعد شهر بألف وأكثر بألف ومائتي دولار. لا يجوز.", "6) باع مائة درهم من الفضة بعشرة جنيهات من الذهب، يدفعها بعد سنة. لا يجوز، إذ لا بد من التقابض يدا بيد.", "7) لا يجوز بيع أو شراء أسهم البنوك الربوية؛ لأنها من باب بيع النقد بالنقد بغير تساو ولا تقابض."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "الربا في اللغة:", "o": ["الزيادة", "النقص", "الدين", "الرهن"], "h": "راجع: ص230 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "الربا شرعا:", "o": ["زيادة أحد البدلين المتجانسين من غير أن يقابل هذه الزيادة عوض", "كل بيع فيه ربح", "كل قرض", "كل زيادة في الثمن"], "h": "راجع: ص230 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ في آكل الربا وموكله وكاتبه وشاهديه:", "o": ["هم سواء", "الآكل أشدهم إثما", "الشاهدان لا إثم عليهما", "الكاتب بريء"], "h": "راجع: ص231 (المسألة الأولى)"}, {"t": "tf", "d": 1, "q": "أجمعت الأمة على تحريم الربا.", "a": true, "h": "راجع: ص231 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "من الحكمة في تحريم الربا:", "o": ["أن فيه أخذا لأموال الآخرين بغير عوض", "أنه يزيد الأموال", "أنه يشجع على العمل", "أنه يقوي المعروف"], "h": "راجع: ص231 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "ربا الفضل هو:", "o": ["الزيادة في أحد البدلين الربويين المتفقين جنسا", "تأخير القبض فقط", "الزيادة مقابل الأجل", "بيع غير الربوي"], "h": "راجع: ص231 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "الأشياء الستة التي حرم فيها ربا الفضل:", "o": ["الذهب والفضة والبر والشعير والتمر والملح", "الذهب والفضة والحديد والنحاس والملح والتمر", "الأرز والقمح والزبيب والتين والملح والسكر", "الذهب والفضة والتمر فقط"], "h": "راجع: ص232 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "علة الربا في هذه الأشياء:", "o": ["الكيل والوزن", "اللون", "الطعم", "الندرة"], "h": "راجع: ص232 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "ربا النسيئة هو:", "o": ["الزيادة في أحد العوضين مقابل تأخير الدفع أو القبض", "الزيادة في الكيل", "بيع الغرر", "بيع العينة"], "h": "راجع: ص232 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "معنى «الناجز» في الحديث:", "o": ["الحاضر", "الغائب", "المؤجل", "الزائد"], "h": "راجع: ص233 (المسألة الثالثة)"}, {"t": "mcq", "d": 3, "q": "إذا بيع الربوي بجنسه اشترط:", "o": ["التقابض في المجلس والتساوي بالمعيار الشرعي", "التقابض فقط", "التساوي فقط", "الأجل"], "h": "راجع: ص233 (المسألة الرابعة)"}, {"t": "tf", "d": 2, "q": "شراء كيلو جرام من الشعير بكيلو جرام من البر جائز لاختلاف الجنس، ويشترط التقابض في المجلس.", "a": true, "h": "راجع: ص233 (المسألة الرابعة)"}, {"t": "tf", "d": 2, "q": "بيع خمسين كيلو جراما من البر بشاة جائز مطلقا.", "a": true, "h": "راجع: ص233 (المسألة الرابعة)"}, {"t": "tf", "d": 2, "q": "يجوز بيع أو شراء أسهم البنوك الربوية.", "a": false, "h": "راجع: ص234 (المسألة الرابعة)"}]}], "sum": [["تعريف الربا وحكمه", "ص230-234"], ["الحكمة في تحريمه", "ص230-234"], ["أنواع الربا", "ص230-234"], ["صور لبعض المسائل الربوية", "ص230-234"]]}, {"id": "l51", "title": "الباب الثالث: في القرض", "group": "الكتاب السابع: المعاملات", "map": {"center": "الباب الثالث\nالمعاملات", "nodes": [{"t": "في تعريفه، وأدلة مشروعيته", "s": []}, {"t": "في شروطه وبعض الأحكام المتعلقة به", "s": []}]}, "paras": [{"t": "الباب الثالث: في القرض", "b": [{"pic": ["scroll", "book"], "cap": "ص234-235"}, {"story": ["المسألة الأولى: في تعريفه، وأدلة مشروعيته", ["القرض: دفع مال لمن ينتفع به ويرد بدله.", "وهو مشروع، ويدل عليه عموم الآيات القرآنية والأحاديث الدالة على فضل المعاونة، وقضاء حاجة المسلم، وتفريج كربته، وسد فاقته، وأجمع المسلمون على جوازه.", "روى أبو هريرة رضي الله عنه أن رسول الله ﷺ استلف من رجل بكرا، فقدمت عليه إبل الصدقة، فأمر أبا رافع أن يقضي الرجل بكره، فرجع إليه أبو رافع فقال: لم أجد فيها إلا خيارا رباعيا، فقال: «أعطه إياه فإن خيار الناس أحسنهم قضاء».", {"note": "حاشية (ص234): البكر: الفتي من الإبل. الرباعي: هو ما استكمل ست سنوات ودخل في السابعة."}, "ومن الأدلة على فضله: حديث ابن مسعود أن النبي ﷺ قال: «ما من مسلم يقرض مسلما قرضا مرتين إلا كان كصدقتها مرة»."]], "ic": "scroll"}, {"story": ["المسألة الثانية: في شروطه وبعض الأحكام المتعلقة به", ["1- لا يجوز للمسلم أن يقرض أخاه بشرط أن يقرضه بعد ذلك إذا رد عليه قرضه؛ لأن المقرض اشترط نفعا، وكل قرض جر منفعة فهو ربا، كأن يسكنه دارا مجانا أو رخيصة، أو يعيره دابته، أو أي شيء آخر، أو غير ذلك من المنافع. فإن جماعة من أصحاب النبي ﷺ أفتوا بما يدل على عدم جواز ذلك، وأجمع الفقهاء على منعه.", "2- أن يكون المقرض جائز التصرف، بالغا عاقلا رشيدا، بحيث يصح تبرعه.", "3- ليس للمقرض أن يشترط زيادة في ماله الذي أقرضه؛ لأن ذلك من الربا، فلا يجوز له أخذها، بل يقتصر على المبلغ الذي دفعه للمقترض أولا.", "4- إذا رد المقترض على المقرض أحسن مما أخذ منه، أو أعطاه زيادة دون شرط أو قصد، صح ذلك؛ لأنه تبرع من المقترض وحسن قضاء، ويدل عليه حديث أبي رافع السابق.", "5- أن يكون المقترض مالكا لما يقرضه، ولا يجوز له أن يقرض ما لا يملك.", "6- من المعاملات الربوية المحرمة: ما تقوم به البنوك في وقتنا الحاضر من عقد قروض بينها وبين ذوي الحاجات، فتدفع لهم مبالغ من المال نظير فائدة محددة تأخذها زيادة على مبلغ القرض، أو يتفق البنك مع المقترض على قيمة القرض، ثم يدفع له البنك أقل من القيمة المتفق عليها، على أن يردها المقترض كاملة. فمثلا: يطلب المقترض من البنك مبلغ مائة ألف، فيعطي له البنك ثمانين ألفا، ويشترط عليه أن يردها مائة. وهذا من الربا المحرم أيضا."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "القرض:", "o": ["دفع مال لمن ينتفع به ويرد بدله", "هبة المال", "بيع المال", "رهن المال"], "h": "راجع: ص234 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "استلف رسول الله ﷺ من رجل:", "o": ["بكرا", "فرسا", "دينارا", "طعاما"], "h": "راجع: ص234 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «إن خيار الناس»:", "o": ["أحسنهم قضاء", "أكثرهم مالا", "أكثرهم قرضا", "أسرعهم بيعا"], "h": "راجع: ص234 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «ما من مسلم يقرض مسلما قرضا مرتين إلا كان»:", "o": ["كصدقتها مرة", "كحجة", "كعمرة", "كصيام يوم"], "h": "راجع: ص234 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "كل قرض جر منفعة فهو:", "o": ["ربا", "مباح", "مستحب", "صدقة"], "h": "راجع: ص234 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "إذا رد المقترض أحسن مما أخذ دون شرط صح ذلك.", "a": true, "h": "راجع: ص235 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "يجوز للمقرض أن يشترط زيادة في المال الذي أقرضه.", "a": false, "h": "راجع: ص235 (المسألة الثانية)"}]}], "sum": [["في تعريفه، وأدلة مشروعيته", "ص234-235"], ["في شروطه وبعض الأحكام المتعلقة به", "ص234-235"]]}, {"id": "l52", "title": "الباب الرابع: في الرهن", "group": "الكتاب السابع: المعاملات", "map": {"center": "الباب الرابع\nالمعاملات", "nodes": [{"t": "معناه وأدلة مشروعيته", "s": []}, {"t": "الأحكام المتعلقة به", "s": []}]}, "paras": [{"t": "الباب الرابع: في الرهن", "b": [{"pic": ["scroll", "book"], "cap": "ص235-236"}, {"story": ["المسألة الأولى: معناه وأدلة مشروعيته", ["الرهن: جعل عين مالية، وثيقة بدين؛ ليستوفى منها أو من ثمنها، إذا تعذر الوفاء.", "والأصل في مشروعية الرهن، قوله تعالى: ﴿وإن كنتم على سفر ولم تجدوا كاتبا فرهان مقبوضة﴾ [البقرة: 283]. والتقييد بالسفر في الآية خرج مخرج الغالب فلا مفهوم له؛ لدلالة السنة على مشروعيته في الحضر. فعن عائشة رضي الله عنها: «أن النبي ﷺ اشترى طعاما من يهودي إلى أجل، ورهنه درعا من حديد»."]], "ic": "scroll"}, {"story": ["المسألة الثانية: الأحكام المتعلقة به", ["1- لا يصح رهن ما لا يجوز بيعه كالوقف والكلب؛ لأنه لا يمكن إيفاء الدين منه، ولا رهن ما لا يملك.", "2- ويشترط معرفة قدر الرهن وجنسه وصفته.", "3- أن يكون الراهن جائز التصرف، مالكا للمرهون أو مأذونا له فيه.", "4- ليس للراهن التصرف في الرهن بغير رضى المرتهن، ولا يملك المرتهن ذلك بغير رضى الراهن.", "5- لا يجوز للمرتهن الانتفاع بالرهن، إلا أن يكون الرهن مركوبا أو محلوبا فيجوز له أن يركب المركوب ويحلب المحلوب إذا أنفق عليه.", "6- المرهون أمانة في يد المرتهن، لا يضمنه إلا بالتعدي، فإذا حل الدين الذي به رهن، وجب على المدين سداده، فإن امتنع أجبره الحاكم، فإن امتنع حبسه، وعزره، حتى يوفي ما عليه من الدين، أو يبيع الرهن، ويسدد من قيمته."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "الرهن:", "o": ["جعل عين مالية وثيقة بدين", "بيع عين مالية", "هبة عين مالية", "إجارة عين مالية"], "h": "راجع: ص235 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "قوله تعالى: ﴿فرهان مقبوضة﴾ ورد في سورة:", "o": ["البقرة", "النساء", "المائدة", "الأنفال"], "h": "راجع: ص235 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "رهن النبي ﷺ درعه عند:", "o": ["يهودي", "أبي بكر", "عمر", "أبي رافع"], "h": "راجع: ص236 (المسألة الأولى)"}, {"t": "tf", "d": 2, "q": "يجوز للمرتهن الانتفاع بالرهن مطلقا.", "a": false, "h": "راجع: ص236 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "المرهون في يد المرتهن:", "o": ["أمانة لا يضمنه إلا بالتعدي", "مضمون دائما", "ملك له", "هبة"], "h": "راجع: ص236 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "إذا حل الدين وامتنع المدين عن السداد:", "o": ["أجبره الحاكم", "سقط الدين", "بقي الرهن للمرتهن", "أعفي"], "h": "راجع: ص236 (المسألة الثانية)"}]}], "sum": [["معناه وأدلة مشروعيته", "ص235-236"], ["الأحكام المتعلقة به", "ص235-236"]]}, {"id": "l53", "title": "الباب الخامس: في السلم", "group": "الكتاب السابع: المعاملات", "map": {"center": "الباب الخامس\nالمعاملات", "nodes": [{"t": "في معناه وأدلة مشروعيته والحكمة من", "s": []}, {"t": "في شروطه", "s": []}]}, "paras": [{"t": "الباب الخامس: في السلم", "b": [{"pic": ["scroll", "book"], "cap": "ص236-237"}, {"story": ["المسألة الأولى: في معناه وأدلة مشروعيته والحكمة من ذلك", ["تعريفه: السلم والسلف بمعنى واحد، وهو: بيع سلعة آجلة موصوفة في الذمة بثمن مقدم.", "دليل مشروعيته: وهو مشروع، فعن ابن عباس رضي الله عنه قال: قدم رسول الله ﷺ المدينة، وهم يسلفون في الثمار السنة والسنتين، فقال: «من أسلف، فليسلف في كيل معلوم ووزن معلوم إلى أجل معلوم».", "الحكمة من مشروعيته: وأجازته الشريعة الإسلامية توسيعا على أفرادها، فالمزارع مثلا قد لا يملك نقدا ينفقه في إصلاح أرضه وزراعته، ولا يجد من يقرضه، فأبيح له السلم حتى لا تفوته مصلحة استثمار أرضه."]], "ic": "scroll"}, {"story": ["المسألة الثانية: في شروطه", ["السلم نوع من أنواع البيع؛ ولذلك يشترط لصحته الشروط المتقدمة في عقد البيع، ويضاف عليها الآتي:", "1) أن يكون المسلم فيه مما يمكن انضباط صفاته بكيل أو وزن أو ذرع، حتى لا يؤدي إلى التنازع.", "2) معرفة قدر المسلم فيه بمعياره الشرعي، فلا يصح في مكيل وزنا، ولا في موزون كيلا.", "3) أن يذكر جنس المسلم فيه، ونوعه، بصفاته المميزة له.", "4) أن يكون دينا في الذمة.", "5) أن يكون مؤجلا.", "6) أن يكون الأجل معلوما ومحددا من الطرفين.", "7) أن يقبض الثمن كاملا معلوما في مجلس العقد قبل تفرقهما.", "8) كون المسلم فيه مما يغلب وجوده عند حلول الأجل، حتى يسلمه له في وقته، فإن لم يكن موجودا -كالرطب في الشتاء- لم يصح؛ لأنه غرر."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "السلم والسلف:", "o": ["بمعنى واحد", "مختلفان", "السلم قرض", "السلف رهن"], "h": "راجع: ص236 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "السلم هو:", "o": ["بيع سلعة آجلة موصوفة في الذمة بثمن مقدم", "بيع سلعة حاضرة بثمن مؤجل", "قرض بزيادة", "رهن سلعة"], "h": "راجع: ص236 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «من أسلف، فليسلف في»:", "o": ["كيل معلوم ووزن معلوم إلى أجل معلوم", "سلعة معلومة فقط", "ثمن معلوم فقط", "أجل معلوم فقط"], "h": "راجع: ص236 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "يقبض الثمن في السلم:", "o": ["كاملا في مجلس العقد قبل التفرق", "بعد حلول الأجل", "بالتقسيط", "عند التسليم"], "h": "راجع: ص237 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "يشترط في السلم أن يكون المسلم فيه مؤجلا.", "a": true, "h": "راجع: ص237 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "لا يصح السلم في الرطب في الشتاء لأنه:", "o": ["غرر", "محرم", "ربا", "غير معلوم الجنس"], "h": "راجع: ص237 (المسألة الثانية)"}]}], "sum": [["في معناه وأدلة مشروعيته والحكمة من", "ص236-237"], ["في شروطه", "ص236-237"]]}, {"id": "l54", "title": "الباب السادس: في الحوالة", "group": "الكتاب السابع: المعاملات", "map": {"center": "الباب السادس\nالمعاملات", "nodes": [{"t": "معناها وأدلة مشروعيتها", "s": []}, {"t": "في شروط صحتها", "s": []}]}, "paras": [{"t": "الباب السادس: في الحوالة", "b": [{"pic": ["scroll", "book"], "cap": "ص237-239"}, {"story": ["المسألة الأولى: معناها وأدلة مشروعيتها", ["الحوالة: نقل الدين من ذمة المحيل إلى ذمة المحال عليه.", "وهي مشروعة؛ لما فيها من الإرفاق، وتبادل المصالح بين أفراد الأمة، والتسامح وتسهيل المعاملات.", "عن أبي هريرة رضي الله عنه أن رسول الله ﷺ قال: «إذا أتبع أحدكم على مليء فليتبع».", "ومعناه: إذا أحيل بالدين الذي له على موسر فليحتل، وليقبل الحوالة. فإذا أحال المدين دائنه على مفلس رجع بحقه على من أحاله؛ لأن الفلس عيب ولم يرض به، فله حق الرجوع."]], "ic": "scroll"}, {"story": ["المسألة الثانية: في شروط صحتها", ["يشترط لصحتها الآتي:", "1- رضا المحيل؛ لأنه مخير في جهات قضاء الدين، فلا تتعين عليه جهة قهرا.", "2- كون المالين المحال به وعليه، متفقين قدرا وجنسا وصفة.", "3- أن يكون المحال به دينا مستقرا في ذمة المحال عليه.", "ويترتب على انعقاد الحوالة الصحيحة حسب ما ذكر: انتقال الحق من ذمة المحيل إلى ذمة المحال عليه.", "ومن الصور المعاصرة للحوالة:", "- الحوالة المصرفية: وهي وسيلة لسداد مبالغ نقدية مقابل تسديد مقابلها في جهة أخرى. وصورتها: أن يقوم الشخص بدفع مبلغ نقدي إلى بنك من البنوك، طالبا منه سداد قيمة هذا المبلغ لشخص آخر في بلد آخر نظير عمولة يتقاضاها البنك.", "- السفتجة: وهي مما يلحق بالحوالة أيضا، وهي عبارة عن كتاب أو رقعة يكتبها المستقرض للمقرض أو نائبه إلى نائبه في بلد آخر ليوفيه المقرض، أو أن يقرض إنسان آخر قرضا في بلد؛ ليوفيه المقترض أو نائبه إلى المقرض أو نائبه في بلد آخر. فالورقة التي يكتبها المقترض بذلك تسمى سفتجة -وهي كلمة فارسية معربة-. وقد منعها قوم، والصحيح جوازها؛ إذ فيها مصلحة للطرفين، من غير ضرر على واحد منهما، ولا محظور شرعي."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "الحوالة هي:", "o": ["نقل الدين من ذمة المحيل إلى ذمة المحال عليه", "نقل المال من بلد إلى بلد", "رهن الدين", "بيع الدين"], "h": "راجع: ص237 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «إذا أتبع أحدكم على مليء»:", "o": ["فليتبع", "فليرفض", "فليسأل", "فليشهد"], "h": "راجع: ص238 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "إذا أحال المدين دائنه على مفلس:", "o": ["رجع بحقه على من أحاله", "سقط حقه", "لزمته الحوالة", "بطل الدين"], "h": "راجع: ص238 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "يشترط لصحة الحوالة:", "o": ["رضا المحيل", "رضا الشهود", "كتابة العقد", "وجود رهن"], "h": "راجع: ص238 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "الحوالة المصرفية:", "o": ["وسيلة لسداد مبالغ نقدية مقابل تسديد مقابلها في جهة أخرى", "بيع للذهب", "قرض بفائدة", "رهن مال"], "h": "راجع: ص238 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "السفتجة كلمة:", "o": ["فارسية معربة", "عربية أصيلة", "إنجليزية", "تركية"], "h": "راجع: ص238 (المسألة الثانية)"}, {"t": "tf", "d": 3, "q": "الصحيح في السفتجة الجواز؛ إذ فيها مصلحة للطرفين من غير ضرر.", "a": true, "h": "راجع: ص239 (المسألة الثانية)"}]}], "sum": [["معناها وأدلة مشروعيتها", "ص237-239"], ["في شروط صحتها", "ص237-239"]]}, {"id": "l55", "title": "الباب السابع: في الوكالة", "group": "الكتاب السابع: المعاملات", "map": {"center": "الباب السابع\nالمعاملات", "nodes": [{"t": "تعريفها، وحكمها، وأدلة مشروعيتها", "s": []}, {"t": "شروطها، والأحكام المتعلقة بها", "s": []}]}, "paras": [{"t": "الباب السابع: في الوكالة", "b": [{"pic": ["scroll", "book"], "cap": "ص239-240"}, {"story": ["المسألة الأولى: تعريفها، وحكمها، وأدلة مشروعيتها", ["1- تعريفها: الوكالة تفويض شخص غيره؛ ليقوم مقامه فيما تدخله النيابة.", "2- حكمها وأدلة مشروعيتها: وهي مشروعة، قال تعالى: ﴿فابعثوا أحدكم بورقكم هذه إلى المدينة﴾ [الكهف: 19]، وقال جل شأنه: ﴿إنما الصدقات للفقراء والمساكين والعاملين عليها﴾ [التوبة: 60]. فجوز سبحانه العمل عليها، وذلك بحكم النيابة عن المستحقين.", "وعن جابر رضي الله عنه قال: أردت الخروج إلى خيبر، فقال النبي ﷺ: «إذا أتيت وكيلي فخذ منه خمسة عشر وسقا...».", "وعن عروة بن أبي الجعد قال: عرض للنبي ﷺ جلب، فأعطاني دينارا، فقال: «يا عروة ائت الجلب فاشتر لنا شاة...» الحديث.", "وأجمع المسلمون على جواز الوكالة في الجملة؛ لأن الحاجة داعية إليها، فإنه لما كان لا يمكن لكل واحد فعل كل ما يحتاج إليه بنفسه، دعت الحاجة إلى مشروعيتها."]], "ic": "scroll"}, {"story": ["المسألة الثانية: شروطها، والأحكام المتعلقة بها", ["1- يشترط في كل من الوكيل والموكل أن يكون جائز التصرف، بالغا، عاقلا، رشيدا.", "2- تصح الوكالة في كل ما تدخله النيابة، كالبيع والشراء وسائر العقود والفسوخ كالطلاق والخلع، وكذلك تصح في كل ما تدخله النيابة من العبادات، كإخراج الزكاة والكفارة، والنذر، والحج، ونحو ذلك.", "3- لا تصح الوكالة فيما لا تدخله النيابة من حقوق الله تعالى، كالطهارة والصلاة.", "4- يملك الوكيل من التصرف ما يقتضيه إذن الموكل، أو ما تعارف عليه الناس، بشرط ألا يترتب على هذا الإذن ضرر بالموكل.", "5- لا يصح للوكيل أن يوكل غيره، إلا إذا أجاز له الموكل ذلك، أو عجز الوكيل عن العمل، أو كان لا يحسنه، فيوكل أمينا يقوم مقامه فيما وكل فيه.", "6- الوكيل أمين فيما وكل فيه، لا يضمن، إلا إذا فرط أو تعدى.", "7- الوكالة عقد جائز، لكل من الطرفين فسخه.", "8- تبطل الوكالة بموت أحد الطرفين، أو جنونه، أو فسخه لها، أو عزله من قبل الموكل، أو الحجر عليه لسفهه."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "الوكالة هي:", "o": ["تفويض شخص غيره ليقوم مقامه فيما تدخله النيابة", "بيع الشيء", "رهن الشيء", "هبة الشيء"], "h": "راجع: ص239 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "من أدلة الوكالة قوله تعالى:", "o": ["﴿فابعثوا أحدكم بورقكم هذه إلى المدينة﴾", "﴿وأقيموا الصلاة﴾", "﴿وأحل الله البيع﴾", "﴿قل هو الله أحد﴾"], "h": "راجع: ص239 (المسألة الأولى)"}, {"t": "tf", "d": 1, "q": "أجمع المسلمون على جواز الوكالة في الجملة.", "a": true, "h": "راجع: ص239 (المسألة الأولى)"}, {"t": "tf", "d": 2, "q": "تصح الوكالة في الصلاة والطهارة.", "a": false, "h": "راجع: ص240 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "الوكيل أمين فيما وكل فيه، فلا يضمن إلا إذا:", "o": ["فرط أو تعدى", "خسر", "تأخر", "اختلف مع الموكل"], "h": "راجع: ص240 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "الوكالة عقد:", "o": ["جائز لكل من الطرفين فسخه", "لازم", "محرم", "باطل"], "h": "راجع: ص240 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "تبطل الوكالة بـ:", "o": ["موت أحد الطرفين أو جنونه", "سفر الوكيل", "غنى الموكل", "مرور شهر"], "h": "راجع: ص240 (المسألة الثانية)"}]}], "sum": [["تعريفها، وحكمها، وأدلة مشروعيتها", "ص239-240"], ["شروطها، والأحكام المتعلقة بها", "ص239-240"]]}, {"id": "l56", "title": "الباب الثامن: في الكفالة والضمان", "group": "الكتاب السابع: المعاملات", "map": {"center": "الباب الثامن\nالمعاملات", "nodes": [{"t": "في معنى الكفالة وأدلة مشروعيتها", "s": []}, {"t": "أركان الكفالة وشروطها", "s": []}, {"t": "في بعض أحكام الكفالة", "s": []}, {"t": "في الضمان", "s": []}]}, "paras": [{"t": "الباب الثامن: في الكفالة والضمان", "b": [{"pic": ["scroll", "book"], "cap": "ص240-243"}, {"story": ["المسألة الأولى: في معنى الكفالة وأدلة مشروعيتها", ["1- تعريفها: الكفالة هي التزام إحضار من عليه حق مالي لربه، إلى مجلس الحكم.", "2- أدلة مشروعيتها: وهي مشروعة بالكتاب والسنة والإجماع.", "فمن الكتاب قوله تعالى: ﴿قالوا نفقد صواع الملك ولمن جاء به حمل بعير وأنا به زعيم﴾ [يوسف: 72] أي كفيل ضامن، وقوله تعالى: ﴿سلهم أيهم بذلك زعيم﴾ [القلم: 40] أي كفيل.", "ومن السنة قوله ﷺ: «العارية مؤداة، والزعيم غارم، والدين مقضي». فالزعيم هو الكفيل، والزعامة الكفالة.", "وقد أجمع العلماء على جواز الكفالة لحاجة الناس إليها ودفع الضرر عن المدين."]], "ic": "scroll"}, {"story": ["المسألة الثانية: أركان الكفالة وشروطها", ["أركان الكفالة خمسة: الصيغة، والكفيل، والمكفول له، والمكفول عنه، والمكفول به.", "وصيغتها تتم بإيجاب الكفيل وحده، ولا تتوقف على قبول المكفول له.", "أما الكفيل: فيشترط فيه أن يكون أهلا للتبرع سواء كان رجلا أو امرأة؛ لأن الكفالة من التبرعات.", "وعلى ذلك لا تصح الكفالة من المجنون أو المعتوه أو الصبي، وكذلك المحجور عليه لسفهه، فلا تصح كفالته، ولا ضمانته.", "وأما المكفول عنه: فلا يشترط رضاه لصحة الكفالة، بخلاف الكفيل فإن رضاه شرط لصحة الكفالة.", "أما محل الكفالة: فقد تكون الكفالة بالمال، ويطلق عليها الضمان، وقد تكون بالنفس، ويطلق عليها كفالة البدن والوجه."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: في بعض أحكام الكفالة", ["1- تصح الكفالة ببدن كل إنسان عليه حق مالي.", "2- لا تصح الكفالة ببدن من عليه حد.", "3- لا تصح الكفالة ببدن من عليه قصاص.", "4- يبرأ الكفيل بموت المكفول المتعذر إحضاره.", "5- الكفيل الغارم ضامن إذا ماطل الأصيل، ولم يسدد، أو أفلس.", "6- الكفيل غير الغارم -الحضوري- لا يضمن؛ لأن كفالته كفالة تعريف وإحضار للمكفول أو للكفيل الغارم.", "7- تصح الكفالة بالنفس، وهي التزام الكفيل بإحضار المكفول إلى المكفول له، أو إلى مجلس الحكم، أو نحو ذلك."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: في الضمان", ["الضمان: هو التزام ما وجب على غيره، وهو جائز؛ لقوله تعالى: ﴿ولمن جاء به حمل بعير وأنا به زعيم﴾ [يوسف: 72] أي ضامن.", "وقوله ﷺ: «الزعيم غارم».", "وقد أجمع العلماء على جوازه؛ لأن الحاجة تدعو إليه، وهو من باب قضاء الحاجات والتعاون المأمور به شرعا.", "أحكام الضمان وشروطه:", "1- لا يجوز أخذ العوض عليه.", "2- يجوز تعدد الضامنين، فيجوز أن يضمن الحق اثنان فأكثر.", "3- لا يشترط في صحته معرفة الضامن للمضمون عنه.", "4- يصح ضمان المعلوم والمجهول إذا كان يؤول إلى العلم، وكذلك يصح ضمان عهدة المبيع.", "5- يصح الضمان بكل لفظ يؤدي معناه: كأنا ضامن، أو ضمين، أو زعيم، أو نحو ذلك.", "6- لا تبرأ ذمة الضامن، إلا إذا برئت ذمة المضمون عنه من الدين، بإبراء أو قضاء.", "7- يشترط لصحته: رضا الضامن، فإن أكره على الضمان لم يصح، ولا يشترط رضا المضمون عنه، ولا رضا المضمون له.", "كما يشترط لصحته: أن يكون الضامن جائز التصرف، بأن يكون: بالغا عاقلا رشيدا."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "الكفالة هي:", "o": ["التزام إحضار من عليه حق مالي لربه إلى مجلس الحكم", "هبة المال", "رهن المال", "بيع الدين"], "h": "راجع: ص240 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "الزعيم في الحديث هو:", "o": ["الكفيل", "القاضي", "الشاهد", "المدين"], "h": "راجع: ص241 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «العارية مؤداة، والزعيم غارم، و»:", "o": ["الدين مقضي", "المال مصون", "الحق ثابت", "البيع لازم"], "h": "راجع: ص241 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "أركان الكفالة:", "o": ["خمسة", "ثلاثة", "أربعة", "ستة"], "h": "راجع: ص241 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "يشترط رضا المكفول عنه لصحة الكفالة.", "a": false, "h": "راجع: ص241 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "لا تصح الكفالة ببدن من عليه حد.", "a": true, "h": "راجع: ص241 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "الكفالة بالمال يطلق عليها:", "o": ["الضمان", "الرهن", "الحوالة", "الوكالة"], "h": "راجع: ص241 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «الزعيم»:", "o": ["غارم", "أمين", "شاهد", "وكيل"], "h": "راجع: ص242 (المسألة الرابعة)"}, {"t": "tf", "d": 2, "q": "يجوز تعدد الضامنين، فيضمن الحق اثنان فأكثر.", "a": true, "h": "راجع: ص242 (المسألة الرابعة)"}, {"t": "tf", "d": 2, "q": "لا يجوز أخذ العوض على الضمان.", "a": true, "h": "راجع: ص242 (المسألة الرابعة)"}, {"t": "mcq", "d": 3, "q": "لا تبرأ ذمة الضامن إلا إذا:", "o": ["برئت ذمة المضمون عنه من الدين بإبراء أو قضاء", "مرت سنة", "مات الضامن", "سافر المضمون له"], "h": "راجع: ص242 (المسألة الرابعة)"}]}], "sum": [["في معنى الكفالة وأدلة مشروعيتها", "ص240-243"], ["أركان الكفالة وشروطها", "ص240-243"], ["في بعض أحكام الكفالة", "ص240-243"], ["في الضمان", "ص240-243"]]}, {"id": "l57", "title": "الباب التاسع: في الحجر", "group": "الكتاب السابع: المعاملات", "map": {"center": "الباب التاسع\nالمعاملات", "nodes": [{"t": "معناه وأدلة مشروعيته وأنواعه", "s": []}, {"t": "الأحكام المتعلقة بالنوع الأول من ا", "s": []}, {"t": "الأحكام المتعلقة بالنوع الثاني من ", "s": []}]}, "paras": [{"t": "الباب التاسع: في الحجر", "b": [{"pic": ["scroll", "book"], "cap": "ص243-245"}, {"story": ["المسألة الأولى: معناه وأدلة مشروعيته وأنواعه", ["1- تعريف الحجر: الحجر لغة: المنع.", "وفي الشرع: منع إنسان من تصرفه في ماله.", "2- أدلة مشروعيته: والأصل فيه قوله تعالى: ﴿ولا تؤتوا السفهاء أموالكم﴾ [النساء: 5].", "أي: أموالهم، لكن أضيف إلى الأولياء؛ لأنهم قائمون عليها مدبرون لها.", "وقوله تعالى: ﴿وابتلوا اليتامى حتى إذا بلغوا النكاح فإن آنستم منهم رشدا فادفعوا إليهم أموالهم﴾ [النساء: 6]، وقوله تعالى: ﴿فإن كان الذي عليه الحق سفيها أو ضعيفا أو لا يستطيع أن يمل هو فليملل وليه بالعدل واستشهدوا شهيدين﴾ [البقرة: 282].", "فدلت هذه الآيات على جواز الحجر على السفيه واليتيم ومن في معناهما -كالمجنون والصغير- في أموالهم؛ لئلا تتعرض للضياع والفساد، ولا تدفع إليهم، إلا إذا تحقق رشدهم، وللولي أن يتصرف في أموالهم، إذا دعت المصلحة لذلك.", "3- أنواعه: الحجر على نوعين:", "النوع الأول: الحجر لمصلحة المحجور عليه، كالحجر على الصبي والسفيه والمجنون، قال تعالى: ﴿ولا تؤتوا السفهاء أموالكم﴾ [النساء: 5].", "النوع الثاني: الحجر على الإنسان لمصلحة غيره، كالحجر على المفلس، فيمنع من التصرف في ماله لئلا يضر بأصحاب الديون. والحجر على المريض مرض الموت فيما زاد على الثلث من ماله لحق الورثة. وكذلك العبد يحجر عليه لحق سيده، فلا يصح تصرفه بغير إذن سيده."]], "ic": "scroll"}, {"story": ["المسألة الثانية: الأحكام المتعلقة بالنوع الأول من الحجر، وهو الحجر على الإنسان لمصلحة نفسه", ["1- إذا تعدى المحجور عليه لصغره ونحوه، على نفس أو مال بجناية، فإنه يضمن ويتحمل ما يترتب على ذلك من غرامة؛ لأن المتعدى عليه لم يفرط، ولم يأذن بذلك، وأما إذا دفع ماله إلى صغير أو سفيه أو مجنون، فأتلفه، لم يضمنه؛ لأنه سلطه عليه برضاه، فهو مفرط.", "2- يزول الحجر عن الصغير بأمرين:", "الأمر الأول: البلوغ، ويعرف ذلك بعلامات، وهي: إنزال المني، أو إنبات الشعر الخشن حول القبل، أو بلوغه الخامسة عشرة، أو الحيض في حق الجارية.", "الأمر الثاني: الرشد، وهو الصلاح في المال، لقوله تعالى: ﴿وابتلوا اليتامى حتى إذا بلغوا النكاح فإن آنستم منهم رشدا فادفعوا إليهم أموالهم﴾ [النساء: 6].", "ويعرف رشده بالامتحان، فيمنح شيئا من التصرف، ويترك يتصرف مرارا في المال، فإن لم يغبن غبنا فاحشا، ولم ينفق ماله في حرام أو فيما لا فائدة فيه، كان ذلك دليل رشده.", "3- يزول الحجر عن المجنون بأمرين أيضا:", "الأول: زوال الجنون ورجوع عقله إليه.", "والثاني: الرشد. أما السفيه: فيزول عنه بزوال السفه والطيش واتصافه بالصلاح في التصرفات المالية.", "4- يتولى أمر المحجور عليهم الأب إذا كان عدلا رشيدا، ثم وصيه. ويجب على من يتولى أمرهم أن يتصرف بما فيه الأحظ والأنفع لهم؛ لقوله تعالى: ﴿ولا تقربوا مال اليتيم إلا بالتي هي أحسن﴾ [الأنعام: 152]. والآية نصت على اليتيم، ويقاس عليه غيره ممن هو في معناه.", "5- على ولي اليتيم أن يحافظ على ماله، ولا يأكله، أو يتصرف فيه ظلما وبهتانا؛ لقوله تعالى: ﴿إن الذين يأكلون أموال اليتامى ظلما إنما يأكلون في بطونهم نارا وسيصلون سعيرا﴾ [النساء: 10]."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: الأحكام المتعلقة بالنوع الثاني من الحجر، وهو الحجر على الإنسان لمصلحة غيره", ["1- لا يحجر على المدين بدين لم يحل أجله؛ لأنه لا يلزمه الأداء قبل حلوله، لكن لو أراد سفرا طويلا يحل الدين قبل قدومه منه، فللغريم منعه من السفر، حتى يوثقه برهن أو كفيل مليء.", "2- إذا كان مال المحجور عليه أكثر من الدين الذي عليه، فهذا لا يحجر عليه في ماله ولكن يؤمر بالوفاء عند المطالبة، فإن امتنع حبس وعزر حتى يوفي الدين، فإن امتنع تدخل في ماله بوفاء ديونه. أما إذا كان ماله أقل مما عليه الدين الحال، فهذا يحجر عليه التصرف في ماله عند المطالبة؛ لئلا يضر بالغرماء. ولا يمكن المدين من التصرف في ماله بتبرع أو غيره إذا كان هذا الأمر يضر بأصحاب الديون.", "3- من باع للمحجور عليه أو أقرضه شيئا بعد الحجر، فلا يحق له المطالبة إلا بعد فك الحجر عنه.", "4- للحاكم أن يبيع ماله ويقسم ثمنه بقدر ديون غرمائه الحالة؛ لأن هذا هو المقصود من الحجر عليه، وفي تأخير ذلك مطل وظلم لهم، ويترك له الحاكم ما يحتاج إليه كالنفقة والسكن."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "الحجر لغة:", "o": ["المنع", "الإذن", "البيع", "الهبة"], "h": "راجع: ص243 (المسألة الأولى)"}, {"t": "mcq", "d": 1, "q": "الحجر في الشرع:", "o": ["منع إنسان من تصرفه في ماله", "بيع المال", "رهن المال", "حفظ المال"], "h": "راجع: ص243 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "الحجر على نوعين: لمصلحة المحجور عليه، و:", "o": ["لمصلحة غيره", "للعقوبة", "للتجارة", "للسفر"], "h": "راجع: ص243 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "من أمثلة الحجر لمصلحة المحجور عليه:", "o": ["الحجر على الصبي والسفيه والمجنون", "الحجر على المفلس", "الحجر على المريض", "الحجر على العبد"], "h": "راجع: ص243 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "يزول الحجر عن الصغير بأمرين:", "o": ["البلوغ والرشد", "الزواج والسفر", "الغنى والعمل", "التجارة والتعليم"], "h": "راجع: ص244 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "من علامات البلوغ:", "o": ["بلوغه الخامسة عشرة", "بلوغه العاشرة", "طول القامة", "كثرة الكلام"], "h": "راجع: ص244 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "الرشد هو:", "o": ["الصلاح في المال", "القوة في البدن", "كثرة العلم", "الغنى"], "h": "راجع: ص244 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "إذا دفع شخص ماله إلى صغير فأتلفه فإنه يضمنه.", "a": false, "h": "راجع: ص244 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "يتولى أمر المحجور عليهم:", "o": ["الأب إذا كان عدلا رشيدا ثم وصيه", "الجار", "الشاهد", "الغريم"], "h": "راجع: ص245 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "لا يحجر على المدين بدين لم يحل أجله.", "a": true, "h": "راجع: ص245 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "من باع للمحجور عليه شيئا بعد الحجر فلا يحق له المطالبة إلا بعد فك الحجر عنه.", "a": true, "h": "راجع: ص245 (المسألة الثالثة)"}, {"t": "mcq", "d": 3, "q": "للحاكم أن يبيع مال المحجور عليه ويقسم ثمنه:", "o": ["بقدر ديون غرمائه الحالة", "على الفقراء", "على الورثة", "بالتساوي"], "h": "راجع: ص245 (المسألة الثالثة)"}]}], "sum": [["معناه وأدلة مشروعيته وأنواعه", "ص243-245"], ["الأحكام المتعلقة بالنوع الأول من ا", "ص243-245"], ["الأحكام المتعلقة بالنوع الثاني من ", "ص243-245"]]}, {"id": "l58", "title": "الباب العاشر: الشركة", "group": "الكتاب السابع: المعاملات", "map": {"center": "الباب العاشر\nالمعاملات", "nodes": [{"t": "تعريف الشركة وحكمها وأدلة مشروعيته", "s": []}, {"t": "أنواع شركة العقود", "s": []}]}, "paras": [{"t": "الباب العاشر: الشركة", "b": [{"pic": ["scroll", "book"], "cap": "ص246-247"}, {"story": ["المسألة الأولى: تعريف الشركة وحكمها وأدلة مشروعيتها", ["1- تعريف الشركة:", "الشركة لغة: الاختلاط، أي: خلط أحد المالين بالآخر بحيث لا يتميزان عن بعضهما.", "وشرعا: هي الاجتماع في استحقاق أو تصرف.", "فالاجتماع في الاستحقاق: كشركة الإرث والوصية والهبة في عين أو منفعة، وتسمى هذه أيضا: «شركة الأملاك».", "والاجتماع في التصرف: وهو ما يعرف بـ «شركة العقود»، وهي المقصودة هنا بالبحث. فهذان قسمان للشركة وفق هذا التعريف.", "2- أدلة مشروعيتها: الشركة مشروعة، وجاءت الآيات القرآنية الكريمة، والأحاديث النبوية الشريفة، بجوازها.", "وقال تعالى: ﴿وإن كثيرا من الخلطاء ليبغي بعضهم على بعض﴾ [ص: 24]. والخلطاء: الشركاء. وقال سبحانه: ﴿فهم شركاء في الثلث﴾ [النساء: 12].", "وهي من العقود الجائزة، والمجتمع بحاجة ماسة إليها ولا سيما في المشروعات الضخمة التي لا يستطيع الشخص القيام بها بمفرده."]], "ic": "scroll"}, {"story": ["المسألة الثانية: أنواع شركة العقود", ["أولا: شركة العنان: وهي أن يشترك اثنان فأكثر في مال يتجران فيه، وسميت بذلك؛ لاستواء الشريكين فيها في المال والتصرف، كاستواء عنان فرسيهما إذا استويا في السير، ويشترط في صحتها كون رأس المال من كل منهما أو منهما نقدا معلوما حاضرا، وأن يحدد لكل واحد منهما جزء معلوم من الربح.", "ثانيا: شركة المضاربة: وهي أن يدفع أحد الشريكين للآخر مالا يتجر به، بجزء معلوم من الربح.", "ثالثا: شركة الوجوه: وهي أن يشتركا في ربح ما يشتريان بجاههما، دون أن يكون لهما رأس مال، اعتمادا على ثقة التجار بهما.", "رابعا: شركة الأبدان: وهي أن يشتركا فيما يكتسبانه بأبدانهما من المباح، كالاحتشاش، والاصطياد، والمعدن، والاحتطاب، أو يشتركا فيما يتقبلان في ذمتهما من العمل، كنسج وخياطة ونحوهما.", "يوزع الربح بين الشركاء على حسب ما يتفقان عليه، وكذلك الخسارة تكون بينهما على قدر مالهما، وهذا في غير المضاربة، ولكل منهما فسخ عقد الشركة متى شاء، كما تنفسخ بموت أحدهما أو جنونه."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "الشركة لغة:", "o": ["الاختلاط", "التفرق", "البيع", "الرهن"], "h": "راجع: ص246 (المسألة الأولى)"}, {"t": "mcq", "d": 1, "q": "الشركة شرعا:", "o": ["الاجتماع في استحقاق أو تصرف", "بيع المال", "هبة المال", "حفظ المال"], "h": "راجع: ص246 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "شركة الإرث والوصية والهبة تسمى:", "o": ["شركة الأملاك", "شركة العقود", "شركة العنان", "شركة الأبدان"], "h": "راجع: ص246 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "الخلطاء في قوله تعالى: ﴿وإن كثيرا من الخلطاء﴾ هم:", "o": ["الشركاء", "الجيران", "الأعداء", "التجار"], "h": "راجع: ص246 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "شركة العنان هي أن يشترك:", "o": ["اثنان فأكثر في مال يتجران فيه", "اثنان في ربح ما يشتريان بجاههما", "اثنان فيما يكتسبانه بأبدانهما", "اثنان في الإرث"], "h": "راجع: ص246 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "شركة المضاربة هي أن يدفع أحد الشريكين للآخر:", "o": ["مالا يتجر به بجزء معلوم من الربح", "عملا بلا أجر", "دينا بفائدة", "هبة"], "h": "راجع: ص246 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "شركة الوجوه يشترك فيها الشريكان:", "o": ["في ربح ما يشتريان بجاههما", "بأبدانهما", "بأموالهما", "بأرضهما"], "h": "راجع: ص247 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "من أمثلة شركة الأبدان:", "o": ["الاحتطاب والاصطياد", "التجارة بالمال", "الإرث", "الهبة"], "h": "راجع: ص247 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "الخسارة تكون بين الشريكين على قدر مالهما في غير المضاربة.", "a": true, "h": "راجع: ص247 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "تنفسخ الشركة بموت أحد الشريكين أو جنونه.", "a": true, "h": "راجع: ص247 (المسألة الثانية)"}]}], "sum": [["تعريف الشركة وحكمها وأدلة مشروعيته", "ص246-247"], ["أنواع شركة العقود", "ص246-247"]]}, {"id": "l59", "title": "الباب الحادي عشر: الإجارة", "group": "الكتاب السابع: المعاملات", "map": {"center": "الباب الحادي عشر\nالمعاملات", "nodes": [{"t": "معناها وأدلة مشروعيتها", "s": []}, {"t": "شروطها", "s": []}, {"t": "الأحكام المتعلقة بها", "s": []}]}, "paras": [{"t": "الباب الحادي عشر: الإجارة", "b": [{"pic": ["scroll", "book"], "cap": "ص247-249"}, {"story": ["المسألة الأولى: معناها وأدلة مشروعيتها", ["1- معنى الإجارة وتعريفها:", "لغة: مشتقة من الأجر، وهو العوض، ومنه تسمية الثواب أجرا.", "وشرعا: عقد على منفعة مباحة معلومة تؤخذ شيئا فشيئا، مدة معلومة، من عين معلومة أو موصوفة في الذمة. أو على عمل معلوم بعوض معلوم.", "2- أدلة مشروعيتها: ودليل مشروعيتها قوله تعالى: ﴿فإن أرضعن لكم فآتوهن أجورهن﴾ [الطلاق: 6]، وقوله جل شأنه: ﴿قالت إحداهما يا أبت استأجره إن خير من استأجرت القوي الأمين﴾ [القصص: 26].", "وقد ثبت «أن النبي ﷺ وأبا بكر استأجرا رجلا من بني الديل هاديا خريتا».", "وجاء الوعيد لمن لم يوف الأجير أجرته، فعن أبي هريرة رضي الله عنه قال: قال رسول الله ﷺ: « قال الله تعالى: ثلاثة أنا خصمهم يوم القيامة»... وذكر منهم: «رجل استأجر أجيرا فاستوفى منه ولم يعطه أجره». وعن ابن عمر رضي الله عنهما قال: قال رسول الله ﷺ: «أعطوا الأجير أجره، قبل أن يجف عرقه»."]], "ic": "scroll"}, {"story": ["المسألة الثانية: شروطها", ["1- لا تصح إلا من جائز التصرف، عاقلا، بالغا، حرا، رشيدا.", "2- أن تكون المنفعة معلومة؛ لأن المنفعة هي المعقود عليها، فاشترط العلم بها كالبيع.", "3- أن تكون الأجرة معلومة؛ لأنها عوض في عقد معاوضة، فوجب العلم بها كالثمن.", "4- أن تكون المنفعة مباحة، فلا تصح الإجارة على الزنى، والغناء، وبيع آلات اللهو.", "5- كون المنفعة قابلة للاستيفاء، فلا تصح الإجارة لشيء يتعذر استيفاء المنفعة منه، كإجارة أعمى لحفظ شيء يحتاج إلى الرؤية.", "6- أن تكون المنفعة مملوكة للمؤجر أو مأذونا له فيها؛ لأن الإجارة بيع المنافع، فاشترط ذلك فيها كالبيع.", "7- أن تكون المدة معلومة، فلا تجوز الإجارة لمدة مجهولة؛ لأنها تؤدي إلى التنازع."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: الأحكام المتعلقة بها", ["ويتعلق بعقد الإجارة الأحكام الآتية:", "1- لا يجوز الاستئجار على أعمال القرب والعبادات، كالأذان والحج والفتيا والقضاء والإمامة وتعليم القرآن؛ لأنها قربة إلى الله تعالى، ويجوز للإنسان أن يأخذ على ذلك رزقا من بيت مال المسلمين.", "2- على المؤجر أن يدفع العين المؤجرة للمستأجر ويمكنه من الانتفاع بها، ويجب على المستأجر المحافظة على العين المستأجرة، وأن يدفع الأجرة عند حلولها.", "3- لا يجوز فسخ عقد الإجارة إلا برضا الآخر، وإذا مات أحدهما والعين المؤجرة باقية لم يبطل العقد، ويقوم وارثه مقامه.", "4- تنفسخ الإجارة إذا تلفت العين المؤجرة، أو انقطع نفعها، كدابة ماتت، أو دار انهدمت."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "الإجارة لغة مشتقة من:", "o": ["الأجر وهو العوض", "الأجل", "الأمر", "الإذن"], "h": "راجع: ص247 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "الإجارة شرعا عقد على:", "o": ["منفعة مباحة معلومة مدة معلومة", "عين بلا مقابل", "هبة", "دين"], "h": "راجع: ص247 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "من أدلة الإجارة قوله تعالى:", "o": ["﴿فإن أرضعن لكم فآتوهن أجورهن﴾", "﴿وأقيموا الصلاة﴾", "﴿قل هو الله أحد﴾", "﴿والعصر﴾"], "h": "راجع: ص247 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «أعطوا الأجير أجره»:", "o": ["قبل أن يجف عرقه", "بعد شهر", "عند الحاجة", "إن شاء"], "h": "راجع: ص248 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "يشترط في الأجرة أن تكون:", "o": ["معلومة", "مؤجلة", "مجهولة", "غالية"], "h": "راجع: ص248 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "تصح الإجارة على الزنى والغناء.", "a": false, "h": "راجع: ص248 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "لا تجوز الإجارة لمدة مجهولة.", "a": true, "h": "راجع: ص248 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "لا يجوز الاستئجار على الأذان والإمامة وتعليم القرآن.", "a": true, "h": "راجع: ص249 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "إذا مات أحد المتعاقدين في الإجارة والعين المؤجرة باقية:", "o": ["لم يبطل العقد ويقوم وارثه مقامه", "بطل العقد", "وجب البيع", "حل الدين"], "h": "راجع: ص249 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "تنفسخ الإجارة إذا:", "o": ["تلفت العين المؤجرة أو انقطع نفعها", "مر يوم", "تغير السعر", "سافر المؤجر"], "h": "راجع: ص249 (المسألة الثالثة)"}]}], "sum": [["معناها وأدلة مشروعيتها", "ص247-249"], ["شروطها", "ص247-249"], ["الأحكام المتعلقة بها", "ص247-249"]]}, {"id": "l60", "title": "الباب الثاني عشر: المزارعة والمساقاة", "group": "الكتاب السابع: المعاملات", "map": {"center": "الباب الثاني عشر\nالمعاملات", "nodes": [{"t": "معناهما وحكمهما", "s": []}, {"t": "شروطهما", "s": []}, {"t": "الأحكام المتعلقة بهما", "s": []}]}, "paras": [{"t": "الباب الثاني عشر: المزارعة والمساقاة", "b": [{"pic": ["scroll", "book"], "cap": "ص249-250"}, {"story": ["المسألة الأولى: معناهما وحكمهما", ["1- معناهما: المزارعة: دفع أرض لمن يزرعها، أو حب لمن يزرعه ويقوم عليه بجزء معلوم مشاع من الثمرة.", "المساقاة: دفع شجر مغروس معلوم، له ثمر مأكول لمن يعمل عليه بجزء مشاع معلوم من الثمرة.", "والعلاقة بين المزارعة والمساقاة: أن المزارعة تقع على الزرع كالحبوب، والمساقاة تقع على الشجر كالنخيل، وفي كل منهما للعامل جزء من الإنتاج.", "2- حكمهما: مشروعتان، وهما من العقود الجائزة، لحاجة الناس إليهما.", "فعن ابن عمر رضي الله عنهما: «أن النبي ﷺ عامل أهل خيبر بشطر ما يخرج منها من ثمر أو زرع»."]], "ic": "scroll"}, {"story": ["المسألة الثانية: شروطهما", ["1- أن يكون عاقدهما جائز التصرف، فلا يقعان إلا من بالغ، حر، رشيد.", "2- أن يكون الشجر معلوما في المساقاة، والبذر معلوما في المزارعة.", "3- أن يكون للشجر ثمر مأكول، من نخل وغيره.", "4- أن يكون للعامل جزء مشاع معلوم مما يحصل من ثمر الشجر، أو من الغلة، كالثلث أو الربع أو نحو ذلك."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: الأحكام المتعلقة بهما", ["ويتعلق بهما الأحكام الآتية:", "1- يلزم العامل أن يعمل كل ما يؤدي إلى صلاح الثمرة، من حرث، وسقي، ونظافة، وصيانة، وتلقيح النخل، وتجفيف الثمر، وغير ذلك.", "2- على صاحب الأرض العمل على كل ما يحفظ الأصل، كحفر البئر، وتوفير المياه، وإقامة الجدران والحواجز، وجلب الآلات ومضخات المياه.", "3- يملك العامل حصته بظهور الثمرة.", "4- لكل عاقد فسخ العقد متى شاء؛ لأنهما عقد جائز غير لازم، فإن انفسخ العقد وقد ظهر الثمر، فهو بين العاقدين على ما شرطا، فإن فسخ العامل قبل طلوع الزرع وظهور الثمرة، فلا شيء له؛ لأنه رضي بإسقاط حقه كعامل المضاربة، أما إن فسخ رب المال قبل ظهور الثمرة وبعد الشروع في العمل، فللعامل أجرة عمله.", "5- لو ساقاه أو زارعه في مدة تكمل فيها الثمرة غالبا، فلم تحمل تلك السنة، فلا شيء للعامل."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "المزارعة هي دفع:", "o": ["أرض لمن يزرعها بجزء معلوم مشاع من الثمرة", "مال للتجارة", "دابة للركوب", "دار للسكن"], "h": "راجع: ص249 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "المساقاة تقع على:", "o": ["الشجر كالنخيل", "الحبوب", "الأنعام", "الدور"], "h": "راجع: ص249 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "عامل النبي ﷺ أهل خيبر:", "o": ["بشطر ما يخرج منها من ثمر أو زرع", "بأجرة نقدية", "بالثلث", "بلا مقابل"], "h": "راجع: ص249 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "يشترط أن يكون للعامل:", "o": ["جزء مشاع معلوم من الثمر أو الغلة", "أجرة مجهولة", "نصف الأرض", "الأرض كلها"], "h": "راجع: ص250 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "على صاحب الأرض العمل على كل ما:", "o": ["يحفظ الأصل", "يصلح الثمرة", "يؤدي إلى السقي", "يجفف الثمر"], "h": "راجع: ص250 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "يملك العامل حصته بظهور الثمرة.", "a": true, "h": "راجع: ص250 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "إذا ساقاه في مدة فلم تحمل تلك السنة فلا شيء للعامل.", "a": true, "h": "راجع: ص250 (المسألة الثالثة)"}]}], "sum": [["معناهما وحكمهما", "ص249-250"], ["شروطهما", "ص249-250"], ["الأحكام المتعلقة بهما", "ص249-250"]]}, {"id": "l61", "title": "الباب الثالث عشر: الشفعة والجوار", "group": "الكتاب السابع: المعاملات", "map": {"center": "الباب الثالث عشر\nالمعاملات", "nodes": [{"t": "في معناها وأدلة مشروعيتها", "s": []}, {"t": "الأحكام المتعلقة بالشفعة", "s": []}, {"t": "في أحكام الجوار", "s": []}, {"t": "في الطرقات", "s": []}]}, "paras": [{"t": "الباب الثالث عشر: الشفعة والجوار", "b": [{"pic": ["scroll", "book"], "cap": "ص250-253"}, {"story": ["المسألة الأولى: في معناها وأدلة مشروعيتها", ["1- معناها: الشفعة هي استحقاق الشريك انتزاع حصة شريكه ممن انتقلت إليه بعوض مالي. وسميت بذلك؛ لأن صاحبها ضم المبيع إلى ملكه، فصار شفعا، بعد أن كان نصيبه منفردا في ملكه. وقيل: هي حق تملك قهري يثبت للشريك القديم على الشريك الحادث بسبب الشركة؛ لدفع الضرر.", "2- أدلة مشروعيتها: الأصل فيها حديث جابر رضي الله عنه قال: «قضى رسول الله ﷺ بالشفعة في كل ما لم يقسم، فإذا وقعت الحدود، وصرفت الطرق فلا شفعة». وفي رواية أخرى: «قضى رسول الله ﷺ بالشفعة في كل شركة لم تقسم ربعة أو حائط، لا يحل له أن يبيع حتى يؤذن شريكه، فإن شاء ترك، فإذا باع ولم يؤذنه فهو أحق به». وعنه ﷺ قال: «جار الدار أحق بالدار».", "وقد أجمع العلماء على إثبات حق الشفعة للشريك الذي لم يقاسم فيما بيع من أرض، أو دار، أو حائط.", "فتبين من ذلك ثبوت مشروعية الشفعة بالسنة والإجماع."]], "ic": "scroll"}, {"story": ["المسألة الثانية: الأحكام المتعلقة بالشفعة", ["1- لا يجوز للشريك أن يبيع نصيبه حتى يؤذن ويعرض على شريكه، فإن باع، ولم يؤذنه فهو أحق به.", "2- لا تثبت الشفعة في غير الأرض والعقار، كالمنقولات من الأمتعة والحيوان ونحو ذلك.", "3- الشفعة حق شرعي لا يجوز التحيل لإسقاطه؛ لأنها شرعت لدفع الضرر عن الشريك.", "4- تثبت الشفعة للشركاء على قدر ملكهم، ومن ثبتت له الشفعة أخذه بالثمن الذي بيعت به سواء كان مؤجلا أو حالا.", "5- تثبت الشفعة بكون الحصة المنتقلة عن الشريك مبيعة بيعا صريحا أو ما في معناه، فلا شفعة فيما انتقل عن ملك الشريك بغير بيع: كموهوب بغير عوض، وموروث، وموصى به.", "6- لا بد أن يكون العقار المنتقل بالبيع قابلا للقسمة، فلا شفعة فيما لا يقسم: كحمام صغير، وبئر، وطريق.", "7- الشفعة تثبت المطالبة بها فور علمه بالبيع، وإن لم يطالب بها وقت البيع سقطت، إلا إذا لم يعلم فهو على شفعته، كذلك لو أخر طلبه لعذر، كالجهل بالحكم أو غير ذلك من الأعذار.", "8- محل الشفعة الأرض التي لم تقسم، ولم تحد، وما فيها من غراس وبناء فهو تابع لها. فإذا قسمت لكن بقي بعض المرافق المشتركة بين الجيران كالطريق والماء ونحو ذلك، فالشفعة باقية في أصح قولي أهل العلم.", "9- ولا بد للشفيع من أخذ جميع المبيع، فلا يأخذ بعضه ويترك بعضه، وذلك دفعا للضرر عن المشتري."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: في أحكام الجوار", ["الجار له حق على جاره، وقد أوصى النبي ﷺ بالجار حتى كاد أن يورثه.", "فمن احتاج إلى جاره كأن يحتاج إلى إجراء الماء في أرضه، أو ممر في ملكه، أو نحو ذلك، فعلى جاره أن يحقق له حاجته، سواء كانت بعوض أو بغير عوض.", "ولا يجوز للإنسان أن يحدث في ملكه ما يضر بجاره، كفتح نافذة تطل على بيته، أو مصنع يقلق جاره بأصواته، أو نحو ذلك، وإذا كان بينهما جدار مشترك لا يتصرف فيه، ويضع عليه الخشب إلا عند الضرورة، كأن يحتاج إليه عند التسقيف، فلا يمنعن من ذلك؛ لقوله ﷺ: «لا يمنع جار جاره أن يغرز خشبة في جداره»."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: في الطرقات", ["1- لا يجوز مضايقة المسلمين في طرقاتهم.", "2- لا يجوز أن يحدث في ملكه ما يضايق الطريق.", "3- لا يجوز أن يتخذ موقفا لدابته أو سيارته بطريق المارة.", "4- الطريق حق للجميع فتجب المحافظة عليه، من جميع ما يضر المارة عليه، كوضع المخلفات والقمائم فيه ونحو ذلك؛ لأن إماطة الأذى عن الطريق شعبة من شعب الإيمان."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "الشفعة هي استحقاق الشريك:", "o": ["انتزاع حصة شريكه ممن انتقلت إليه بعوض مالي", "بيع حصته", "هبة حصته", "رهن حصته"], "h": "راجع: ص250 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "قضى رسول الله ﷺ بالشفعة في كل:", "o": ["ما لم يقسم", "ما قسم", "ما بيع", "ما وهب"], "h": "راجع: ص251 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «جار الدار»:", "o": ["أحق بالدار", "شريك فيها", "وارث لها", "وكيل عليها"], "h": "راجع: ص251 (المسألة الأولى)"}, {"t": "tf", "d": 2, "q": "لا تثبت الشفعة في المنقولات من الأمتعة والحيوان.", "a": true, "h": "راجع: ص251 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "يجوز التحيل لإسقاط الشفعة.", "a": false, "h": "راجع: ص251 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "لا شفعة فيما انتقل عن ملك الشريك بغير بيع، مثل:", "o": ["الموهوب بغير عوض والموروث والموصى به", "المبيع بيعا صريحا", "المباع بثمن مؤجل", "المباع بثمن حال"], "h": "راجع: ص252 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "لا شفعة فيما لا يقسم، مثل:", "o": ["حمام صغير وبئر وطريق", "أرض واسعة", "بستان كبير", "دار كبيرة"], "h": "راجع: ص252 (المسألة الثانية)"}, {"t": "mcq", "d": 3, "q": "لا بد للشفيع من:", "o": ["أخذ جميع المبيع", "أخذ بعضه", "ترك الثمن", "تأخير الطلب"], "h": "راجع: ص252 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «لا يمنع جار جاره أن»:", "o": ["يغرز خشبة في جداره", "يبيع داره", "يسكن بيته", "يفتح بابه"], "h": "راجع: ص252 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "إماطة الأذى عن الطريق شعبة من شعب الإيمان.", "a": true, "h": "راجع: ص253 (المسألة الرابعة)"}, {"t": "tf", "d": 2, "q": "لا يجوز مضايقة المسلمين في طرقاتهم.", "a": true, "h": "راجع: ص253 (المسألة الرابعة)"}]}], "sum": [["في معناها وأدلة مشروعيتها", "ص250-253"], ["الأحكام المتعلقة بالشفعة", "ص250-253"], ["في أحكام الجوار", "ص250-253"], ["في الطرقات", "ص250-253"]]}, {"id": "l62", "title": "الباب الرابع عشر: الوديعة والإتلافات", "group": "الكتاب السابع: المعاملات", "map": {"center": "الباب الرابع عشر\nالمعاملات", "nodes": [{"t": "تعريفها وأدلة مشروعيتها", "s": []}, {"t": "شرط صحتها", "s": []}, {"t": "في الأحكام المتعلقة بالوديعة", "s": []}, {"t": "في الإتلافات", "s": []}]}, "paras": [{"t": "الباب الرابع عشر: الوديعة والإتلافات", "b": [{"pic": ["scroll", "book"], "cap": "ص253-256"}, {"story": ["المسألة الأولى: تعريفها وأدلة مشروعيتها", ["1- تعريفها: الوديعة هي عين يضعها مالكها أو نائبه عند من يحفظها بلا عوض.", "2- أدلة مشروعيتها: الأصل فيها قوله تعالى: ﴿فليؤد الذي اؤتمن أمانته﴾ [البقرة: 283]، وقال تعالى: ﴿إن الله يأمركم أن تؤدوا الأمانات إلى أهلها﴾ [النساء: 58].", "وقال ﷺ: «أد الأمانة لمن ائتمنك ولا تخن من خانك». ولأن الضرورة والحاجة داعية للإيداع.", "فمن وجد في نفسه القدرة على حفظ الأمانة فإنه يستحب له أن يقبل الوديعة؛ لقوله ﷺ: «والله في عون العبد ما دام العبد في عون أخيه».", "أما إذا علم من نفسه عدم القدرة على حفظ الوديعة فإنه لا يجوز له قبولها."]], "ic": "scroll"}, {"story": ["المسألة الثانية: شرط صحتها", ["أن تكون من جائز التصرف لمثله، فلو أودع إنسان جائز التصرف ماله عند صغير أو مجنون أو سفيه، فأتلفه فلا ضمان؛ لتفريطه. وإن أودع الصغير ونحوه ماله عند آخر، صار الوديع ضامنا؛ لتعديه بأخذه."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: في الأحكام المتعلقة بالوديعة", ["1- الوديعة أمانة في يد المستودع، فلا ضمان عليه إن لم يفرط؛ لأنها أمانة كسائر الأمانات، والأمين لا يضمن إن لم يتعد؛ لقوله ﷺ: «لا ضمان على مؤتمن».", "2- إذا تعدى على الوديعة، أو فرط في حفظها، فإنه يضمنها إذا تلفت؛ لأنه متلف لمال غيره.", "3- يجب على المستودع حفظ الوديعة في حرز مثلها عرفا؛ لأن الله عز وجل أمر بأداء الأمانات إلى أهلها، ولا يمكن ذلك إلا بحفظها، ولأن المقصود من الإيداع الحفظ، والوديع ملتزم بذلك، فإن لم يحفظها فقد لم يفعل ما التزمه.", "4- يجوز للمستودع أن يدفع الوديعة إلى من يحفظ ماله عادة، كزوجته وعبده وخازنه وخادمه، وإن تلفت عندهم من غير تعد ولا تفريط، فلا ضمان عليهم.", "5- لا يجوز أن يودعها عند غيره من غير عذر، وأما لعذر: كسفر أو حضور موت فجائز. وعليه: فإن أودعها عند الغير بعذر، فتلفت، لم يضمن، وإن كان بغير عذر ضمن؛ لتعديه وتفريطه.", "6- إذا خاف المستودع على الوديعة، أو أراد السفر، فإنه يجب عليه ردها إلى صاحبها، أو وكيله، فإن لم يجدهما فإنه يحملها معه في السفر، إذا كان ذلك أحفظ لها، وإلا دفعها إلى الحاكم، فإن لم يتمكن أودعها عند من يثق به؛ لأن النبي ﷺ قبل الهجرة إلى المدينة أودع الودائع لأم أيمن، وأمر عليا أن يردها إلى أهلها. وكذلك إذا مرض المستودع مرضا مخوفا، وعنده ودائع، فإنه يجب عليه ردها إلى أصحابها، فإن لم يتمكن أودعها عند الحاكم، أو عند من يثق به.", "7- إذا كانت الوديعة دابة لزم المستودع إعلافها، وتغذيتها، فإن أهملها، وتلفت، ضمنها، ويأثم بهذا الإهمال لحرمتها، ولأن كل كبد رطب فيها أجر.", "8- المستودع أمين يقبل قوله، إذا ادعى أنه رد الوديعة إلى صاحبها، أو من يقوم مقامه، ويقبل قوله مع يمينه، إذا ادعى أنها تلفت من غير تعد ولا تفريط.", "وعلى المستودع ألا يؤخر الوديعة عند طلب صاحبها لها، فإن أخرها من غير عذر، فتلفت، فإنه يضمن.", "9- من الصور المعاصرة للوديعة: الودائع المصرفية: وهي ما يقوم به الأفراد من إيداع مبالغ نقدية في البنوك، إلى أجل محدد أو مطلقا، ويقوم البنك بالتصرف في هذه المبالغ، ويدفع لصاحبها فائدة مالية ثابتة، وهذه تصير في معنى القرض، من حيث تملك البنك لعينها، وتعلقها بذمته، وتعهده برد مثلها عند المطالبة، وهي بهذه الصورة من الربا المحرم، فليحذر المسلمون من الوقوع فيه.", "أما الودائع التي لا يتقاضى صاحبها عليها فائدة، كالذي يعرف اليوم بالحساب الجاري، فلا شيء فيه؛ لأنه لا يأخذ زيادة على أصل ماله. أما إذا ألزم الشخص بقبض الزيادة، وكان مضطرا إلى الإيداع في مثل هذه البنوك بحيث يلحقه ضرر محقق بترك ذلك، فإنه يقبض هذه الزيادة، وينفقها في مصالح المسلمين العامة."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: في الإتلافات", ["يحرم الاعتداء على أموال الناس، وأخذها بغير حق، ومن اعتدى على مال غيره فأتلفه، وكان هذا المال محترما، فإنه يجب عليه الضمان، وكذلك من تسبب في إتلاف مال غيره، بحل قيد، أو بفتح باب أو نحو ذلك.", "وإذا كان له مواش وجب عليه حفظها في الليل، من إفساد زروع الناس أو فساد أنفسهم، فإن أهملها وحصل الفساد ضمن؛ لأن النبي ﷺ قضى أن على أهل الأموال حفظها بالنهار، وعلى أهل المواشي حفظها بالليل، فما أفسدت بالليل فإنه مضمون عليهم؛ لأن أموال المسلمين وأرواحهم محترمة، فيحرم التعدي عليها، أو التسبب في إفسادها أو هلاكها.", "والصائل من الإنسان أو الحيوان، إذا لم يندفع إلا بالقتل، فقتله، فلا ضمان عليه؛ لأنه قتله دفاعا عن نفسه؛ لقوله ﷺ: «من أريد ماله بغير حق فقاتل فقتل فهو شهيد».", {"note": "حاشية (ص256): الصائل من الإنسان: هو الذي يسطو على غيره عاديا، يريد نفسه، أو عرضه، أو ماله."}, "ومن أتلف ما حرم الله كآلات اللهو، والصليب، وأواني الخمر، وكتب الضلال والبدعة، وأشرطة ومجلات المجون، والخلاعة، فإنه لا ضمان عليه، لكن لا يكون الإتلاف على إطلاقه، بل لا بد من تقييده بأمر الحاكم، وتحت رقابته؛ ضمانا للمصلحة، ودفعا للمفسدة، ودرءا للفتن."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "الوديعة هي عين يضعها مالكها أو نائبه عند من:", "o": ["يحفظها بلا عوض", "يبيعها", "يستعملها", "يرهنها"], "h": "راجع: ص253 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "من أدلة الوديعة قوله تعالى:", "o": ["﴿فليؤد الذي اؤتمن أمانته﴾", "﴿وأقيموا الصلاة﴾", "﴿والعصر﴾", "﴿قل هو الله أحد﴾"], "h": "راجع: ص253 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «والله في عون العبد ما دام العبد في»:", "o": ["عون أخيه", "طاعة ربه", "بيته", "سفره"], "h": "راجع: ص253 (المسألة الأولى)"}, {"t": "tf", "d": 2, "q": "الوديعة أمانة في يد المستودع، فلا ضمان عليه إن لم يفرط.", "a": true, "h": "راجع: ص254 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "يجب على المستودع حفظ الوديعة في:", "o": ["حرز مثلها عرفا", "أي مكان", "بيت جاره", "السوق"], "h": "راجع: ص254 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «لا ضمان على»:", "o": ["مؤتمن", "وكيل", "أجير", "شريك"], "h": "راجع: ص254 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "إذا كانت الوديعة دابة لزم المستودع إعلافها وتغذيتها.", "a": true, "h": "راجع: ص255 (المسألة الثالثة)"}, {"t": "mcq", "d": 3, "q": "الودائع المصرفية التي يدفع البنك لصاحبها فائدة ثابتة:", "o": ["في معنى القرض وهي من الربا المحرم", "جائزة", "مستحبة", "مباحة"], "h": "راجع: ص255 (المسألة الثالثة)"}, {"t": "mcq", "d": 3, "q": "قضى النبي ﷺ أن على أهل المواشي حفظها:", "o": ["بالليل", "بالنهار", "في الصيف", "في الشتاء"], "h": "راجع: ص256 (المسألة الرابعة)"}, {"t": "tf", "d": 2, "q": "من أريد ماله بغير حق فقاتل فقتل فهو شهيد.", "a": true, "h": "راجع: ص256 (المسألة الرابعة)"}]}], "sum": [["تعريفها وأدلة مشروعيتها", "ص253-256"], ["شرط صحتها", "ص253-256"], ["في الأحكام المتعلقة بالوديعة", "ص253-256"], ["في الإتلافات", "ص253-256"]]}, {"id": "l63", "title": "الباب الخامس عشر: في الغصب", "group": "الكتاب السابع: المعاملات", "map": {"center": "الباب الخامس عشر\nالمعاملات", "nodes": [{"t": "تعريفه وحكمه", "s": []}, {"t": "في الأحكام المتعلقة بالغصب", "s": []}]}, "paras": [{"t": "الباب الخامس عشر: في الغصب", "b": [{"pic": ["scroll", "book"], "cap": "ص256-257"}, {"story": ["المسألة الأولى: تعريفه وحكمه", ["1- تعريفه: الغصب لغة: أخذ الشيء ظلما.", "وشرعا: الاستيلاء على حق الغير، ظلما وعدوانا بغير حق.", "2- حكمه: وهو محرم بإجماع المسلمين؛ لقوله تعالى: ﴿ولا تأكلوا أموالكم بينكم بالباطل﴾ [البقرة: 188]. وقوله ﷺ: «لا يحل مال امرئ مسلم إلا بطيب نفسه»، وقال ﷺ: «من اقتطع شبرا من الأرض ظلما، طوقه يوم القيامة من سبع أرضين».", "فعلى كل من عنده مظلمة لأخيه أن يتوب إلى الله، ويتحلل من أخيه، ويطلب منه العفو في الدنيا؛ لقوله ﷺ: «من كانت له مظلمة لأخيه من عرضه أو شيء، فليتحلله منه اليوم، قبل أن لا يكون دينار ولا درهم، إن كان له عمل صالح أخذ منه بقدر مظلمته، وإن لم يكن له حسنات أخذ من سيئات صاحبه فحمل عليه»."]], "ic": "scroll"}, {"story": ["المسألة الثانية: في الأحكام المتعلقة بالغصب", ["1- يجب على الغاصب رد المغصوب بحاله، وإن أتلفه رد بدلا منه.", "2- يلزم الغاصب رد المغصوب بزيادته، سواء كانت منفصلة أو متصلة.", "3- الغاصب إذا تصرف في المغصوب ببناء أو غرس، أمر بقلعه إذا طالبه المالك بذلك.", "4- المغصوب إذا تغير، أو قل، أو رخص، ضمن الغاصب النقص.", "5- الاغتصاب قد يكون بالخصومة والأيمان الفاجرة.", "6- جميع تصرفات الغاصب باطلة، إن لم يأذن بها المالك."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "الغصب لغة:", "o": ["أخذ الشيء ظلما", "أخذ الشيء بإذن", "بيع الشيء", "هبة الشيء"], "h": "راجع: ص256 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "الغصب شرعا:", "o": ["الاستيلاء على حق الغير ظلما وعدوانا بغير حق", "أخذ الدين", "بيع المال", "رهن المال"], "h": "راجع: ص256 (المسألة الأولى)"}, {"t": "tf", "d": 1, "q": "الغصب محرم بإجماع المسلمين.", "a": true, "h": "راجع: ص256 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «من اقتطع شبرا من الأرض ظلما»:", "o": ["طوقه يوم القيامة من سبع أرضين", "غفر له", "أجر", "عفي عنه"], "h": "راجع: ص256 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «لا يحل مال امرئ مسلم إلا»:", "o": ["بطيب نفسه", "بإذن القاضي", "بالشراء", "بالبيع"], "h": "راجع: ص256 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "يجب على الغاصب رد المغصوب:", "o": ["بزيادته منفصلة كانت أو متصلة", "دون زيادته", "بنصف ثمنه", "بعد سنة"], "h": "راجع: ص257 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "إذا تغير المغصوب أو قل أو رخص ضمن الغاصب النقص.", "a": true, "h": "راجع: ص257 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "جميع تصرفات الغاصب باطلة إن لم يأذن بها المالك.", "a": true, "h": "راجع: ص257 (المسألة الثانية)"}]}], "sum": [["تعريفه وحكمه", "ص256-257"], ["في الأحكام المتعلقة بالغصب", "ص256-257"]]}, {"id": "l64", "title": "الباب السادس عشر: في الصلح", "group": "الكتاب السابع: المعاملات", "map": {"center": "الباب السادس عشر\nالمعاملات", "nodes": [{"t": "معناه وأدلة مشروعيته", "s": []}, {"t": "في أنواع الصلح العامة", "s": []}, {"t": "الأحكام المتعلقة بالصلح", "s": []}]}, "paras": [{"t": "الباب السادس عشر: في الصلح", "b": [{"pic": ["scroll", "book"], "cap": "ص257-259"}, {"story": ["المسألة الأولى: معناه وأدلة مشروعيته", ["1- معناه: الصلح في اللغة: التوفيق، أي: قطع المنازعة.", "وفي الشرع: هو العقد الذي ينقطع به خصومة المتخاصمين.", "2- أدلة مشروعيته: وقد دل على مشروعيته الكتاب، والسنة، والإجماع.", "فمن الكتاب قوله تعالى: ﴿والصلح خير﴾ [النساء: 128]، وقوله تعالى: ﴿وإن طائفتان من المؤمنين اقتتلوا فأصلحوا بينهما﴾ [الحجرات: 9]، وقوله تعالى: ﴿لا خير في كثير من نجواهم إلا من أمر بصدقة أو معروف أو إصلاح بين الناس ومن يفعل ذلك ابتغاء مرضات الله فسوف نؤتيه أجرا عظيما﴾ [النساء: 114].", "ومن السنة قوله ﷺ: «الصلح جائز بين المسلمين إلا صلحا أحل حراما أو حرم حلالا». وكان النبي ﷺ يقوم بالإصلاح بين الناس.", "وقد أجمعت الأمة على مشروعية الصلح بين الناس بقصد رضا الله، ثم رضا المتخاصمين.", "فدل على مشروعية الصلح: الكتاب والسنة والإجماع."]], "ic": "scroll"}, {"story": ["المسألة الثانية: في أنواع الصلح العامة", ["الصلح بين الناس على أنواع:", "1- الصلح بين الزوجين إذا خيف الشقاق بينهما. قال تعالى: ﴿وإن خفتم شقاق بينهما فابعثوا حكما من أهله وحكما من أهلها إن يريدا إصلاحا يوفق الله بينهما﴾ [النساء: 35]، أو خافت إعراضه، أي: ترفعه عنها وعدم رغبته فيها؛ قال تعالى: ﴿وإن امرأة خافت من بعلها نشوزا أو إعراضا فلا جناح عليهما أن يصلحا بينهما صلحا والصلح خير﴾ [النساء: 128].", "2- الصلح بين الطائفتين المتقاتلتين من المسلمين. قال تعالى: ﴿وإن طائفتان من المؤمنين اقتتلوا فأصلحوا بينهما﴾ [الحجرات: 9].", "3- الصلح بين المسلمين والكفار المحاربين.", "4- الصلح بين المتخاصمين في غير المال.", "5- الصلح بين المتخاصمين في المال، وهو المقصود في بحثنا، وهو على نوعين:", "أ- الصلح مع الإقرار، وهو على نوعين أيضا:", "1- صلح الإبراء: وهو صلح على جنس الحق المقر به، كأن يقر رشيد لآخر بدين أو عين، ثم يسقط عنه المقر له بعض العين أو الدين، ويأخذ الباقي، فهو إبراء عن بعض الدين بلفظ الصلح. وهذا جائز بشرط أن يكون صاحب الحق ممن يصح تبرعه، وألا يكون مشروطا في الإقرار.", "2- صلح المعاوضة: وهو أن يصالح عن الحق المقر به بغير جنسه، كما لو اعترف له بدين أو عين ثم تصالحا على أخذ العوض من غير جنسه. فهذا حكمه حكم البيع، وإن وقع على منفعة فحكمه حكم الإجارة.", "ب- الصلح مع الإنكار، وهو أن يدعي شخص على آخر بعين له عنده أو بدين في ذمته، فينكر المدعى عليه، أو يسكت وهو يجهل المدعى به، ثم يصالح المدعي عن دعواه بمال حال أو مؤجل؛ فيصح الصلح في هذه الحالة، إذا كان المنكر معتقدا بطلان الدعوى، فيدفع المال؛ دفعا للخصومة عن نفسه، وافتداء ليمينه، والمدعي يعتقد صحة الدعوى، فأخذ المال عوضا عن حقه الثابت."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: الأحكام المتعلقة بالصلح", ["1- يصح الصلح عن الحق المجهول، وهو ما تعذر علمه من دين أو عين، كأن يكون بين شخصين معاملة وحساب مضى عليه زمن، ولا علم لواحد منهما بما عليه لصاحبه.", "2- يصح الصلح عن كل ما يجوز أخذ العوض عنه، كالصلح عن القصاص بالدية المحددة شرعا، أو أقل، أو أكثر.", "3- لا يصح الصلح عن كل ما لا يجوز أخذ العوض عنه، كالصلح عن الحدود؛ لأنها شرعت للزجر."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "الصلح في اللغة:", "o": ["التوفيق أي قطع المنازعة", "الخصومة", "البيع", "الهبة"], "h": "راجع: ص257 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "الصلح في الشرع هو العقد الذي:", "o": ["ينقطع به خصومة المتخاصمين", "يباع به المال", "يرهن به المال", "يوكل به"], "h": "راجع: ص257 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "قال تعالى: ﴿والصلح﴾:", "o": ["خير", "واجب", "ممنوع", "مكروه"], "h": "راجع: ص257 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «الصلح جائز بين المسلمين إلا صلحا»:", "o": ["أحل حراما أو حرم حلالا", "في الأموال", "بين الجيران", "في البيع"], "h": "راجع: ص258 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "دل على مشروعية الصلح:", "o": ["الكتاب والسنة والإجماع", "الكتاب فقط", "السنة فقط", "القياس فقط"], "h": "راجع: ص258 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "من أنواع الصلح العامة:", "o": ["الصلح بين الزوجين إذا خيف الشقاق", "الصلح في البيع", "الصلح في الصلاة", "الصلح في الحج"], "h": "راجع: ص258 (المسألة الثانية)"}, {"t": "mcq", "d": 3, "q": "الصلح بين المتخاصمين في المال على نوعين:", "o": ["صلح مع الإقرار وصلح مع الإنكار", "صلح مؤقت ودائم", "صلح بحرب وسلم", "صلح بيع وهبة"], "h": "راجع: ص258 (المسألة الثانية)"}, {"t": "mcq", "d": 3, "q": "صلح المعاوضة حكمه حكم:", "o": ["البيع", "الهبة", "الوقف", "الوصية"], "h": "راجع: ص259 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "يصح الصلح عن الحق المجهول الذي تعذر علمه.", "a": true, "h": "راجع: ص259 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "يصح الصلح عن الحدود.", "a": false, "h": "راجع: ص259 (المسألة الثالثة)"}]}], "sum": [["معناه وأدلة مشروعيته", "ص257-259"], ["في أنواع الصلح العامة", "ص257-259"], ["الأحكام المتعلقة بالصلح", "ص257-259"]]}, {"id": "l65", "title": "الباب السابع عشر: المسابقة", "group": "الكتاب السابع: المعاملات", "map": {"center": "الباب السابع عشر\nالمعاملات", "nodes": [{"t": "معناها وحكمها", "s": []}, {"t": "الأحكام المتعلقة بها", "s": []}, {"t": "شروط أخذ العوض في المسابقة", "s": []}]}, "paras": [{"t": "الباب السابع عشر: المسابقة", "b": [{"pic": ["scroll", "book"], "cap": "ص259-261"}, {"story": ["المسألة الأولى: معناها وحكمها", ["1- معناها: السبق ما يتراهن عليه المتسابقون في الخيل، والإبل، وفي النصال، فمن سبق أخذه.", "والمسابقة هي المجاراة بين الحيوان وغيره. والمناضلة والنضال: المسابقة بالرمي بالسهام ونحوها.", "2- حكمها وأدلتها: والمسابقة جائزة بالكتاب، والسنة، والإجماع.", "أما الكتاب: فقوله تعالى: ﴿وأعدوا لهم ما استطعتم من قوة﴾ [الأنفال: 60].", "ومن السنة: ما رواه ابن عمر رضي الله عنهما: «أن النبي ﷺ سابق بين الخيل المضمرة من الحفياء إلى ثنية الوداع، وبين التي لم تضمر من ثنية الوداع إلى مسجد بني زريق»، وقوله ﷺ: «لا سبق إلا في خف، أو نصل، أو حافر».", {"note": "حاشية (ص260): تضمير الخيل: هو أن يظاهر عليها بالعلف حتى تسمن، ثم لا تعلف إلا قوتا لتخف، ويكون تضمير الخيل للغزو أو السباق."}, "والخف: البعير، والنصل: السهم ذو النصل، والحافر: الفرس.", "وقد أجمع المسلمون على جواز المسابقة في الجملة."]], "ic": "scroll"}, {"story": ["المسألة الثانية: الأحكام المتعلقة بها", ["1- تجوز المسابقة على الخيل، وغيرها من الدواب والمراكب، وعلى الأقدام، وكذا الترامي بالسهام، واستعمال الأسلحة.", "2- تجوز المسابقة على عوض في الإبل، والخيل، والسهام؛ لقوله ﷺ: «لا سبق إلا في خف، أو نصل، أو حافر».", "3- كل ما يترتب عليه مصلحة شرعية، كالتدرب على الجهاد، والتدرب على مسائل العلم، فالمسابقة فيه مباحة، ويجوز أخذ العوض عليها.", "4- كل ما يقصد منه اللعب والمرح الذي لا مضرة منه، مما أباحه الشرع، تجوز فيه المسابقة، بشرط ألا يشغل عن أمور الدين الواجبة كالصلاة ونحوها. وهذا النوع لا يجوز أخذ العوض عليه.", "5- لكل واحد من المتسابقين فسخ المسابقة ما لم يظهر الفضل لصاحبه، فإن ظهر فللفاضل الفسخ دون المفضول.", "6- تبطل المسابقة بموت أحد المتسابقين، أو أحد المركوبين.", "7- يكره للأمين أو الحضور مدح أحد المتسابقين، أو عيبه."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: شروط أخذ العوض في المسابقة", ["1- تعيين الرماة في المناضلة، أو المركوبين في المسابقة، وذلك بالرؤية.", "2- اتحاد المراكب في المسابقة، أو القوسين في المناضلة، وذلك بالنوع؛ فلا تصح بين عربي وهجين، ولا بين قوس عربية وفارسية.", "3- تحديد المسافة أو الغاية، وذلك إما بالمشاهدة أو بالذرع.", "4- أن يكون العوض معلوما ومباحا؛ لأنه مال في عقد، فوجب العلم به وإباحته كسائر العقود.", "5- أن يكون العوض من غير المتسابقين؛ ليخرج بذلك عن شبه القمار، أما إذا كان منهما، أو من أحدهما، فلا تصح المسابقة."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "قال تعالى: ﴿وأعدوا لهم ما استطعتم من﴾:", "o": ["قوة", "مال", "طعام", "علم"], "h": "راجع: ص260 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «لا سبق إلا في خف، أو نصل، أو»:", "o": ["حافر", "سيف", "رمح", "ظهر"], "h": "راجع: ص260 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "الخف في الحديث هو:", "o": ["البعير", "الفرس", "السهم", "الحذاء"], "h": "راجع: ص260 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "الحافر في الحديث هو:", "o": ["الفرس", "البعير", "السهم", "الحمار"], "h": "راجع: ص260 (المسألة الأولى)"}, {"t": "tf", "d": 2, "q": "أجمع المسلمون على جواز المسابقة في الجملة.", "a": true, "h": "راجع: ص260 (المسألة الأولى)"}, {"t": "tf", "d": 2, "q": "اللعب المباح الذي لا مضرة منه تجوز فيه المسابقة، لكن لا يجوز أخذ العوض عليه.", "a": true, "h": "راجع: ص261 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "تبطل المسابقة بـ:", "o": ["موت أحد المتسابقين أو أحد المركوبين", "مرور يوم", "تغير الطقس", "كثرة الحضور"], "h": "راجع: ص261 (المسألة الثانية)"}, {"t": "mcq", "d": 3, "q": "من شروط أخذ العوض أن يكون العوض:", "o": ["من غير المتسابقين", "من المتسابقين", "من أحدهما", "مجهولا"], "h": "راجع: ص261 (المسألة الثالثة)"}, {"t": "mcq", "d": 3, "q": "يشترط في المسابقة اتحاد:", "o": ["المراكب أو القوسين بالنوع", "الأسماء", "الألوان", "الأعمار"], "h": "راجع: ص261 (المسألة الثالثة)"}]}], "sum": [["معناها وحكمها", "ص259-261"], ["الأحكام المتعلقة بها", "ص259-261"], ["شروط أخذ العوض في المسابقة", "ص259-261"]]}, {"id": "l66", "title": "الباب الثامن عشر: العارية", "group": "الكتاب السابع: المعاملات", "map": {"center": "الباب الثامن عشر\nالمعاملات", "nodes": [{"t": "معناها وأدلة مشروعيتها", "s": []}, {"t": "شروطها", "s": []}, {"t": "بعض الأحكام المتعلقة بها", "s": []}]}, "paras": [{"t": "الباب الثامن عشر: العارية", "b": [{"pic": ["scroll", "book"], "cap": "ص261-263"}, {"story": ["المسألة الأولى: معناها وأدلة مشروعيتها", ["1- معناها: الإعارة: إباحة الانتفاع بالشيء مع بقاء عينه.", "والعارية: هي العين المأخوذة للانتفاع، كأن يستعير إنسان من آخر سيارته ليسافر بها ثم يعيدها إليه.", "2- أدلة مشروعيتها: وهي مشروعة مستحبة؛ لعموم قوله تعالى: ﴿وتعاونوا على البر والتقوى﴾ [المائدة: 2].", "وقال تعالى: ﴿ويمنعون الماعون﴾ [الماعون: 7]، والمراد ما يستعير الجيران من بعضهم، كالأواني والقدور ونحو ذلك؛ فقد ذمهم الله سبحانه لمنعهم العارية، فدل ذلك على أنها مستحبة مندوب إليها. وروى صفوان بن أمية رضي الله عنه: «أن النبي ﷺ استعار منه أدرعا يوم حنين». وعن أنس رضي الله عنه: «أن النبي ﷺ استعار فرسا من أبي طلحة رضي الله عنه»."]], "ic": "scroll"}, {"story": ["المسألة الثانية: شروطها", ["1- أن يكون المعير والمستعير أهلا للتبرع شرعا، والعين المعارة ملكا للمعير.", "2- أن تكون العين المعارة مباحة النفع، فلا تصح الإعارة لغناء ونحوه، ولا تصح استعارة إناء من ذهب أو فضة للشرب فيه، وكذا سائر ما يحرم الانتفاع به شرعا.", "3- أن تبقى العين المعارة بعد الانتفاع بها، فإن كانت من الأعيان التي تستهلك كالطعام، فلا تصح إعارتها."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: بعض الأحكام المتعلقة بها", ["1- لا يجوز للمستعير إعارة العين التي استعارها؛ لأنه غير مالك لها، وكذا لا يجوز له تأجيرها، إلا إذا أذن المالك في ذلك.", "2- أنها أمانة في يد المستعير، يجب أن يحافظ عليها، ويردها سليمة، كما أخذها، فإن تعدى أو فرط ضمنها.", "3- الإعارة عقد غير لازم، فللمعير الرجوع فيه متى شاء، ما لم يضر بالمستعير، فإن أضر به لم يجز الرجوع.", "4- تنتهي الإعارة، وترد العارية بأمور:", "- مطالبة المالك بذلك، ولو لم يتحقق غرض المستعير منها.", "- وبانقضاء الغرض من العين المعارة.", "- انقضاء الوقت إذا كانت العارية مؤقتة.", "- موت المعير أو المستعير، لبطلان الإعارة بذلك.", "5- المستعير في استيفاء النفع كالمستأجر، له أن ينتفع بنفسه، وبمن يقوم مقامه، وذلك لملكه التصرف فيها بإذن مالكها."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "الإعارة هي:", "o": ["إباحة الانتفاع بالشيء مع بقاء عينه", "بيع الشيء", "هبة الشيء", "رهن الشيء"], "h": "راجع: ص261 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "العارية حكمها:", "o": ["مشروعة مستحبة", "واجبة", "محرمة", "مكروهة"], "h": "راجع: ص261 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "قال تعالى: ﴿ويمنعون﴾:", "o": ["الماعون", "الصدقة", "الزكاة", "الحق"], "h": "راجع: ص262 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "استعار النبي ﷺ من صفوان بن أمية رضي الله عنه:", "o": ["أدرعا يوم حنين", "فرسا", "سيفا", "جملا"], "h": "راجع: ص262 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "استعار النبي ﷺ فرسا من:", "o": ["أبي طلحة رضي الله عنه", "أنس رضي الله عنه", "أبي بكر رضي الله عنه", "عمر رضي الله عنه"], "h": "راجع: ص262 (المسألة الأولى)"}, {"t": "tf", "d": 2, "q": "لا تصح إعارة الأعيان التي تستهلك كالطعام.", "a": true, "h": "راجع: ص262 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "لا تصح استعارة إناء من ذهب أو فضة للشرب فيه.", "a": true, "h": "راجع: ص262 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "العارية أمانة في يد المستعير.", "a": true, "h": "راجع: ص262 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "الإعارة عقد:", "o": ["غير لازم، فللمعير الرجوع فيه ما لم يضر بالمستعير", "لازم", "باطل", "محرم"], "h": "راجع: ص262 (المسألة الثالثة)"}]}], "sum": [["معناها وأدلة مشروعيتها", "ص261-263"], ["شروطها", "ص261-263"], ["بعض الأحكام المتعلقة بها", "ص261-263"]]}, {"id": "l67", "title": "الباب التاسع عشر: إحياء الموات", "group": "الكتاب السابع: المعاملات", "map": {"center": "الباب التاسع عشر\nالمعاملات", "nodes": [{"t": "في معناه وحكمه", "s": []}, {"t": "شروطه وما يحصل به", "s": []}, {"t": "بعض الأحكام المتع
