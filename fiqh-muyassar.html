سيما إذا كانت المقبرة بعيدة، وعلى المتبع لها المشاركة في الحمل.", "ويشرع دفن الميت في مقبرة المسلمين خاصة بالموتى؛ لأن النبي ﷺ كان يدفن الموتى في مقبرة البقيع، كما تواترت الأخبار بذلك، ولم ينقل عن أحد من السلف أنه دفن في غير المقبرة.", "ويسن الإسراع بالجنازة، في غسلها، وتكفينها، والصلاة عليها، ودفنها؛ لقوله ﷺ: «إذا مات أحدكم فلا تحبسوه، وأسرعوا به إلى قبره». وما يفعله بعض الناس من تأخيرها أو نقلها من مكان إلى آخر أو اختيار يوم من الأسبوع تدفن فيه، فهذا كله خلاف السنة. كما يسن الإسراع في المشي بها أثناء حملها لقوله ﷺ: «أسرعوا بالجنازة فإن تك صالحة فخير تقدمونها إليه، وإن تك سوى ذلك فشر تضعونه عن رقابكم»، لكن لا يكون إسراعا شديدا، بل دون الخبب كما اختاره بعض العلماء.", "وعلى الحاملين للجنازة السكينة والوقار، وعدم رفع الصوت، لا بقراءة ولا بغيره؛ لأنه لم يثبت عن النبي ﷺ شيء في ذلك، ومن فعله فقد خالف السنة.", "ولا يجوز للنساء الخروج مع الجنازة؛ لحديث أم عطية: «نهينا عن اتباع جنائز»، فحمل الجنازة وتشييعها خاص بالرجال، ويكره للمشيع الجلوس حتى توضع الجنازة على الأرض؛ لنهيه ﷺ عن الجلوس حتى توضع."]], "ic": "scroll"}, {"note": "حاشية (ص134): يجصص: أي يطلى بالجص، وهو الكلس أو الكج الذي تطلى به البيوت."}, {"story": ["المسألة الثامنة: دفن الميت وصفة القبر وما يسن فيه", ["ويسن أن يعمق القبر ويوسع، وأن يلحد له فيه، وهو: أن يحفر في قاع القبر حفرة في جانبه إلى جهة القبلة، فإن تعذر اللحد فلا بأس بالشق، وهو: أن يحفر للميت في وسط القبر، لكن اللحد أفضل؛ لقوله ﷺ: «اللحد لنا والشق لغيرنا».", "ويوضع الميت في لحده على شقه الأيمن مستقبل القبلة، وتسد فتحة اللحد باللبن والطين، ثم يهال عليه التراب، ويرفع القبر عن الأرض قدر شبر مسنما -أي على هيئة السنام- لثبوت ذلك في صفة قبر النبي ﷺ وصاحبيه، ويعلم أنه قبر فلا يهان، ولا بأس بوضع أحجار أو غيرها على أطرافه لبيان حدوده ومعرفته، ويحرم البناء على القبور وتجصيصها والجلوس عليها، كما يكره الكتابة عليها، إلا بقدر الحاجة للإعلام؛ لحديث جابر رضي الله عنه قال: «نهى النبي ﷺ أن يجصص القبر، وأن يقعد عليه، وأن يبنى عليه». زاد الترمذي: «وأن يكتب عليها».", "ولأن هذا من وسائل الشرك والتعلق بالأضرحة، وهذا مما يغتر به الجهال ويتعلقون به.", "ويحرم أيضا إسراج القبور أي إضاءتها؛ لما فيه من التشبه بالكفار، وإضاعة المال، وبناء المساجد عليها، والصلاة عندها أو إليها؛ لقوله ﷺ: «لعن الله اليهود والنصارى اتخذوا قبور أنبيائهم مساجد».", "وتحرم إهانتها بالمشي عليها أو وطئها بالنعال أو الجلوس عليها وغير ذلك؛ لحديث أبي هريرة رضي الله عنه قال: قال رسول الله ﷺ: «لأن يجلس أحدكم على جمرة فتحرق ثيابه، فتخلص إلى جلده، خير من أن يجلس على قبر»، ولنهيه ﷺ عن الوطء على القبور.", "ويستحب عند الفراغ من الدفن الدعاء للميت؛ لفعله ﷺ، فإنه كان إذا فرغ من دفن الميت وقف عليه، وقال: «استغفروا لأخيكم واسألوا له التثبيت فإنه الآن يسأل». وأما قراءة الفاتحة أو شيء من القرآن عند القبر فإنه بدعة منكرة؛ لأنه لم يفعله النبي ﷺ ولا صحابته الكرام، وقد قال ﷺ: «من عمل عملا ليس عليه أمرنا فهو رد»."]], "ic": "scroll"}, {"story": ["المسألة التاسعة: التعزية، حكمها وكيفيتها", ["والتعزية: هي تسلية المصاب وتقويته على تحمل مصيبته، فتذكر له الأدعية والأذكار الواردة في فضيلة الصبر والاحتساب.", "وتشرع تعزية أهل الميت بما يخفف عنهم من مصابهم، ويحملهم على الرضا والصبر، بما ثبت عنه ﷺ إن كان يعلمه، ويستحضره، وإلا فبما تيسر له من الكلام الحسن الذي يحقق الغرض، ولا يخالف الشرع. فعن أسامة بن زيد رضي الله عنهما قال: كنا عند النبي ﷺ فأرسلت إليه إحدى بناته تدعوه وتخبره أن صبيا لها أو ابنا لها في الموت، فقال رسول الله ﷺ: «ارجع إليها فأخبرها أن لله ما أخذ وله ما أعطى، وكل شيء عنده بأجل مسمى، فمرها فلتصبر ولتحتسب». وهذا من حسن الألفاظ الواردة في التعزية. وينبغي عند العزاء تجنب بعض الأمور التي انتشرت بين الناس، وليس لها أصل في الشرع، منها:", "1- الاجتماع للتعزية في مكان خاص بجلب الكراسي والإضاءة والقراء.", "2- عمل الطعام خلال أيام العزاء من قبل أهل الميت لضيافة الواردين للعزاء. لحديث جرير البجلي رضي الله عنه قال: «كنا نعد الاجتماع إلى أهل الميت وصنيعة الطعام بعد دفنه من النياحة».", "3- تكرار التعزية، فبعض الناس يذهب إلى أهل الميت أكثر من مرة ويعزيهم، والأصل أن تكون التعزية مرة واحدة، ولكن إذا كان القصد من تكرارها التذكير والأمر بالصبر، والرضا بقضاء الله وقدره، فلا بأس. أما إن كان تكرارها لغير هذا القصد فلا ينبغي؛ لعدم ثبوت ذلك عن النبي ﷺ وأصحابه.", "والسنة أن يعمل أقرباء الميت وجيرانه لأهل الميت طعاما؛ لقوله ﷺ: «اصنعوا لآل جعفر طعاما، فقد أتاهم أمر يشغلهم -أو أتاهم ما يشغلهم-».", "وأما البكاء والحزن على الميت فلا بأس به ويحصل في الغالب، وهو الذي تمليه الطبيعة دون تكلف، فقد بكى النبي ﷺ على ابنه إبراهيم حين مات، وقال: «إن العين تدمع، والقلب يحزن، ولا نقول إلا ما يرضي ربنا...».", "لكن لا يكون ذلك على وجه التسخط والجزع والتشكي. ويحرم الندب، والنياحة، وضرب الخدود، وشق الجيوب؛ لقوله ﷺ: «ليس منا من لطم الخدود، وشق الجيوب، ودعا بدعوى الجاهلية»، كقوله: يا ويلاه، يا ثبوراه وما أشبه ذلك، ولقوله ﷺ: «النائحة إذا لم تتب قبل موتها، تقام يوم القيامة وعليها سربال من قطران، ودرع من جرب»."]], "ic": "scroll"}, {"note": "حاشية (ص136): الجرب: مرض معروف، وهو بثور تعلو الجلد، ويكون معها حكة."}], "q": [{"t": "mcq", "d": 1, "q": "حكم غسل الميت:", "o": ["واجب، وهو فرض كفاية", "سنة", "مباح", "مكروه"], "h": "راجع: ص127 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "قال النبي ﷺ في ابنته زينب رضي الله عنها: «اغسلنها ____ أو خمسا أو سبعا»", "o": ["ثلاثا", "اثنتين", "أربعا", "ستا"], "h": "راجع: ص127 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "يستحب أن يجعل في الغسلة الأخيرة:", "o": ["كافورا", "ملحا", "عطرا", "زيتا"], "h": "راجع: ص128 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "إذا تعذر غسل الميت لعدم الماء فإنه:", "o": ["ييمم بالتراب", "يترك", "يصلى عليه بلا غسل", "يغسل بغير الماء"], "h": "راجع: ص128 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "ممن يجوز لكل واحد منهما تغسيل الآخر:", "o": ["الزوجان", "الأخوان", "الجاران", "الصديقان"], "h": "راجع: ص129 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "شهيد المعركة:", "o": ["لا يغسل ولا يكفن ولا يصلى عليه", "يغسل", "يكفن", "يصلى عليه"], "h": "راجع: ص129 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "السقط يغسل ويكفن ويصلى عليه إذا بلغ:", "o": ["أربعة أشهر", "شهرين", "ثلاثة أشهر", "ستة أشهر"], "h": "راجع: ص129 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "السنة في تكفين الرجل:", "o": ["ثلاث لفائف بيض من قطن", "ثوب واحد", "خمسة أثواب", "لفافتان"], "h": "راجع: ص130 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "الأنثى تكفن في:", "o": ["خمسة أثواب", "ثلاثة أثواب", "ثوب واحد", "ثوبين"], "h": "راجع: ص130 (المسألة الثالثة)"}, {"t": "mcq", "d": 1, "q": "حكم الصلاة على الميت:", "o": ["فرض كفاية", "سنة", "مباحة", "مكروهة"], "h": "راجع: ص130 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "عدد تكبيرات صلاة الجنازة:", "o": ["أربع", "ثلاث", "خمس", "اثنتان"], "h": "راجع: ص131 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "من سنن صلاة الجنازة:", "o": ["رفع اليدين مع كل تكبيرة", "الجهر بالقراءة", "الركوع", "السجود"], "h": "راجع: ص131 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "من شهد الجنازة حتى يصلى عليها فله:", "o": ["قيراط", "قيراطان", "ثلاثة قراريط", "أربعة قراريط"], "h": "راجع: ص131 (المسألة السادسة)"}, {"t": "mcq", "d": 2, "q": "من شهدها حتى تدفن فله:", "o": ["قيراطان", "قيراط", "نصف قيراط", "ثلاثة قراريط"], "h": "راجع: ص131 (المسألة السادسة)"}, {"t": "mcq", "d": 2, "q": "قال النبي ﷺ: «أسرعوا بالجنازة فإن تك صالحة فخير ____ إليه»", "o": ["تقدمونها", "تؤخرونها", "تحملونها", "تتركونها"], "h": "راجع: ص133 (المسألة السابعة)"}, {"t": "mcq", "d": 2, "q": "يحرم على القبور:", "o": ["البناء عليها وتجصيصها والجلوس عليها", "زيارتها", "رفعها قدر شبر", "وضع أحجار على أطرافها لبيان حدودها"], "h": "راجع: ص134 (المسألة الثامنة)"}, {"t": "mcq", "d": 2, "q": "الأفضل في القبر:", "o": ["اللحد", "الشق", "القبر المبني", "الحفر المربع"], "h": "راجع: ص134 (المسألة الثامنة)"}, {"t": "mcq", "d": 2, "q": "قراءة الفاتحة أو شيء من القرآن عند القبر:", "o": ["بدعة منكرة", "سنة", "واجبة", "مستحبة"], "h": "راجع: ص135 (المسألة الثامنة)"}, {"t": "mcq", "d": 1, "q": "التعزية هي:", "o": ["تسلية المصاب وتقويته على تحمل مصيبته", "البكاء على الميت", "إعداد الطعام", "زيارة القبور"], "h": "راجع: ص135 (المسألة التاسعة)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «اصنعوا لآل ____ طعاما»", "o": ["جعفر", "علي", "عمر", "زيد"], "h": "راجع: ص136 (المسألة التاسعة)"}, {"t": "tf", "d": 2, "q": "يجوز للنساء الخروج مع الجنازة.", "a": false, "h": "راجع: ص133 (المسألة السابعة)"}, {"t": "tf", "d": 2, "q": "يحرم الندب والنياحة وضرب الخدود وشق الجيوب.", "a": true, "h": "راجع: ص136 (المسألة التاسعة)"}, {"t": "tf", "d": 2, "q": "يصلى على الغائب عن البلد عند العلم بوفاته.", "a": true, "h": "راجع: ص132 (المسألة السادسة)"}]}], "sum": [["في صلاة الجنازة وأحكام الجنائز", "ص127-136"], ["حكم غسل الميت وكيفيته", "ص127-136"], ["من يتولى الغسل", "ص127-136"], ["حكم تكفينه وكيفيته", "ص127-136"]]}, {"id": "l28", "title": "الباب الأول: في مقدمات الزكاة", "group": "الكتاب الثالث: الزكاة", "map": {"center": "الباب الأول\nالزكاة", "nodes": [{"t": "كتاب الزكاة", "s": []}, {"t": "في تعريف الزكاة", "s": []}, {"t": "حكم الزكاة ودليل ذلك", "s": []}, {"t": "حكم من أنكرها", "s": []}, {"t": "حكم مانعها بخلا", "s": []}]}, "paras": [{"t": "الباب الأول: في مقدمات الزكاة", "b": [{"pic": ["money-bag", "book", "scroll"], "cap": "ص137-142"}, {"story": ["ثالثا: كتاب الزكاة", ["ويشتمل على ستة أبواب:", "الباب الأول: في مقدمات الزكاة، وفيه مسائل:"]], "ic": "scroll"}, {"story": ["المسألة الأولى: في تعريف الزكاة", ["الزكاة في اللغة: النماء والزيادة. يقال: زكا الزرع إذا نما.", "وشرعا: عبارة عن حق يجب في المال الذي بلغ نصابا معينا بشروط معينة، لطائفة مخصوصة. وهي طهرة للعبد، وتزكية لنفسه، قال تعالى: ﴿خذ من أموالهم صدقة تطهرهم وتزكيهم بها﴾ [التوبة: 103]، وهي سبب من أسباب إشاعة الألفة والمحبة، والتكافل بين أفراد المجتمع المسلم."]], "ic": "scroll"}, {"story": ["المسألة الثانية: حكم الزكاة ودليل ذلك", ["الزكاة فريضة من فرائض الإسلام، وركن من أركانه الخمسة، وهي أهم أركانه بعد الصلاة؛ لقوله تعالى: ﴿وأقيموا الصلاة وآتوا الزكاة﴾ [البقرة: 43]، وقوله تعالى: ﴿خذ من أموالهم صدقة تطهرهم وتزكيهم بها﴾ [التوبة: 103].", "ولقوله ﷺ: «بني الإسلام على خمس: شهادة أن لا إله إلا الله وأن محمدا رسول الله، وإقام الصلاة، وإيتاء الزكاة، وحج البيت، وصوم رمضان». وقوله ﷺ في وصيته لمعاذ بن جبل رضي الله عنه لما بعثه إلى اليمن: «ادعهم إلى شهادة أن لا إله إلا الله، وأني رسول الله، فإن هم أطاعوا لذلك، فأعلمهم أن الله افترض عليهم خمس صلوات في كل يوم وليلة، فإن هم أطاعوا لذلك، فأعلمهم أن الله افترض عليهم صدقة في أموالهم تؤخذ من أغنيائهم وترد على فقرائهم».", "وقد أجمع المسلمون في جميع الأمصار على وجوبها، واتفق الصحابة على قتال مانعيها. فثبت بذلك فرضية الزكاة بالكتاب، والسنة، والإجماع."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: حكم من أنكرها", ["من أنكر وجوب الزكاة جهلا بها، وكان ممن يجهل مثله ذلك: إما لحداثة عهده بالإسلام، أو لكونه نشأ ببادية بعيدة عن الأمصار، عرف وجوبها، ولم يحكم بكفره؛ لأنه معذور.", "وإن كان منكرها مسلما ناشئا ببلاد الإسلام وبين أهل العلم، فهو مرتد تجري عليه أحكام الردة، ويستتاب ثلاثا، فإن تاب وإلا قتل؛ لأن أدلة وجوب الزكاة ظاهرة في الكتاب والسنة وإجماع الأمة، فلا تكاد تخفى على من هذا حاله، فإذا جحدها لا يكون إلا لتكذيبه الكتاب والسنة، وكفره بهما."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: حكم مانعها بخلا", ["من منع أداء الزكاة بخلا بها مع اعتقاده بوجوبها، فهو آثم بامتناعها ولا يخرجه ذلك عن الإسلام؛ لأن الزكاة فرع من فروع الدين، فلم يكفر تاركه بمجرد تركه، لقوله ﷺ عن مانع الزكاة: «ثم يرى سبيله، إما إلى الجنة، وإما إلى النار». ولو كان كافرا لما كان له سبيل إلى الجنة، وهذا تؤخذ منه الزكاة قهرا مع التعزير، فإن قاتل دونها قوتل حتى يخضع لأمر الله تعالى، ويؤدي الزكاة؛ لقوله تعالى: ﴿فإن تابوا وأقاموا الصلاة وآتوا الزكاة فخلوا سبيلهم﴾ [التوبة: 5].", "وقوله ﷺ: «أمرت أن أقاتل الناس حتى يشهدوا أن لا إله إلا الله، وأن محمدا رسول الله، ويقيموا الصلاة، ويؤتوا الزكاة، فإذا فعلوا ذلك عصموا مني دماءهم وأموالهم إلا بحق الإسلام، وحسابهم على الله».", "ولقول أبي بكر الصديق: «لو منعوني عناقا كانوا يؤدونها إلى رسول الله ﷺ لقاتلتهم عليها». والعناق: الأنثى من ولد المعز، ما لم تستكمل سنة.", "وكان معه في رأيه الخلفاء الثلاثة وسائر الصحابة، فكان ذلك إجماعا منهم على قتال مانعي الزكاة، ومانعها بخلا يدخل تحت هذه النصوص."]], "ic": "scroll"}, {"story": ["المسألة الخامسة: في الأموال التي تجب فيها الزكاة", ["تجب الزكاة في خمسة أجناس من الأموال وهي:", "1- بهيمة الأنعام: وهي الإبل، والبقر، والغنم؛ لقوله ﷺ: «ما من صاحب إبل، ولا بقر، ولا غنم لا يؤدي زكاتها إلا جاءت يوم القيامة أعظم ما كانت، وأسمنه تنطحه بقرونها وتطؤه بأظلافها، كلما نفذت أخراها، عادت عليه أولاها، حتى يقضى بين الناس».", "2- النقدان: وهما الذهب والفضة، وكذلك ما يقوم مقامهما من العملات الورقية المتداولة اليوم؛ لقوله تعالى: ﴿والذين يكنزون الذهب والفضة ولا ينفقونها في سبيل الله فبشرهم بعذاب أليم﴾ [التوبة: 34]. وقوله ﷺ: «ما من صاحب ذهب ولا فضة، لا يؤدي منها حقها، إلا إذا كان يوم القيامة، صفحت له صفائح من نار، فأحمي عليها في نار جهنم، فيكوى بها جنبه وجبينه وظهره، كلما بردت ردت له، في يوم كان مقداره خمسين ألف سنة».", "3- عروض التجارة: وهي كل ما أعد للبيع والشراء لأجل الربح؛ لقوله تعالى: ﴿يا أيها الذين آمنوا أنفقوا من طيبات ما كسبتم﴾ [البقرة: 267]، فقد ذكر عامة أهل العلم أن المراد بهذه الآية زكاة عروض التجارة.", "4- الحبوب والثمار: الحبوب: هي كل حب مدخر مقتات من شعير وقمح وغيرهما. والثمار: هي التمر والزبيب؛ لقوله تعالى: ﴿ومما أخرجنا لكم من الأرض﴾ [البقرة: 267]. وقوله تعالى: ﴿وآتوا حقه يوم حصاده﴾ [الأنعام: 141]. وقوله ﷺ: «فيما سقت السماء والعيون أو كان عثريا العشر، وفيما سقي بالنضح نصف العشر».", "5- المعادن والركاز: المعادن: هي كل ما خرج من الأرض مما يخلق فيها، من غير وضع واضع مما له قيمة؛ كالذهب، والفضة، والنحاس، وغير ذلك.", "والركاز: هو ما يوجد في الأرض من دفائن الجاهلية، ودليل وجوب الزكاة في المعادن والركاز عموم قوله تعالى: ﴿أنفقوا من طيبات ما كسبتم وما أخرجنا لكم من الأرض﴾ [البقرة: 267]. قال الإمام القرطبي في تفسيره: يعني النبات والمعادن والركاز، ولقوله ﷺ: «وفي الركاز الخمس». وأجمعت الأمة على وجوب الزكاة في المعادن."]], "ic": "scroll"}, {"note": "حاشية (ص140): العثري: وهو الذي يشرب بعروقه من غير سقي، كأن يكون في بركة ونحوها يصب إليه من ماء المطر في سواق تشق له، أو يكون الماء قريبا منه فيشرب بعروقه، كالذي يكون قريبا من الأنهار. النضح: يعني بالإبل التي يحمل عليها الماء لسقي الزرع، وتسمى: ناضح، والأنثى: ناضحة."}, {"story": ["المسألة السادسة: في الحكمة من إيجاب الزكاة، وعلى من تجب (شروط وجوبها)", ["أ- الحكمة في إيجاب الزكاة:", "شرعت الزكاة لحكم سامية، وأهداف نبيلة، لا تحصى كثرة، منها:", "1- تطهير المال وتنميته، وإحلال البركة فيه، وذهاب شره وبائه، ووقايته من الآفات والفساد.", "2- تطهير المزكي من الشح والبخل، وأرجاس الذنوب والخطايا، وتدريبه على البذل والإنفاق في سبيل الله.", "3- مواساة الفقير وسد حاجة المعوزين والبائسين والمحرومين.", "4- تحقيق التكافل والتعاون والمحبة بين أفراد المجتمع، فحينما يعطي الغني أخاه الفقير زكاة ماله يستل بها ما عسى أن يكون في قلبه من حقد وتمن لزوال ما هو فيه من نعمة الغنى، وبذلك تزول الأحقاد ويعم الأمن.", "5- إن في أدائها شكرا لله تعالى على ما أسبغ على المسلم من نعمة المال، وطاعة لله سبحانه وتعالى في تنفيذ أمره.", "6- أنها تدل على صدق إيمان المزكي؛ لأن المال المحبوب لا يخرج إلا لمحبوب أكثر محبة، ولهذا سميت صدقة؛ لصدق طلب صاحبها لمحبة الله، ورضاه.", "7- أنها سبب لرضا الرب، ونزول الخيرات، وتكفير الخطايا، وغيرها.", "ب- على من تجب الزكاة (شروط وجوبها):", "تجب الزكاة على من توافرت فيه الشروط الآتية:", "1- الإسلام: فلا تجب الزكاة على الكافر؛ لأنها عبادة مالية يتقرب بها المسلم إلى الله، والكافر لا تقبل منه العبادة حتى يدخل في الإسلام؛ لقوله تعالى: ﴿وما منعهم أن تقبل منهم نفقاتهم إلا أنهم كفروا بالله وبرسوله﴾ [التوبة: 54] فإذا كانت لا تقبل منهم فلا فائدة في إلزامهم بها، ولمفهوم قول أبي بكر الصديق رضي الله عنه: «هذه فريضة الصدقة التي فرضها رسول الله ﷺ على المسلمين»، لكنه مع ذلك محاسب عليها؛ لأنه مخاطب بفروع الشريعة على الصحيح.", "2- الحرية: فلا تجب الزكاة على العبد والمكاتب؛ لأن العبد لا يملك شيئا، والمكاتب ملكه ضعيف، وأن العبد وما في يده ملك لسيده، فتجب زكاته عليه.", "3- ملك النصاب ملكا تاما مستقرا: وكونه فاضلا عن الحاجات الضرورية التي لا غنى للمرء عنها، كالمطعم، والملبس، والمسكن؛ لأن الزكاة تجب مواساة للفقراء، فوجب أن يعتبر ملك النصاب الذي يحصل به الغنى المعتبر، لقوله ﷺ: «ليس فيما دون خمسة أوسق صدقة، وليس فيما دون خمس ذود صدقة، وليس فيما دون خمس أواق صدقة».", "4- حولان الحول على المال: وذلك بأن يمر على النصاب في حوزة مالكه اثنا عشر شهرا قمريا؛ لقوله ﷺ: «لا زكاة في مال حتى يحول عليه الحول».", "وهذا الشرط خاص ببهيمة الأنعام والنقدين وعروض التجارة، أما الزروع والثمار والمعادن والركاز فلا يشترط لها الحول؛ لقوله تعالى: ﴿وآتوا حقه يوم حصاده﴾ [الأنعام: 141]، ولأن المعادن والركاز مال مستفاد من الأرض، فلا يعتبر في وجوب زكاته حول، كالزروع والثمار."]], "ic": "scroll"}, {"note": "حاشية (ص141): ومعنى كونه مستقرا: أي أنه ليس بعرضة للتلف، فإن كان عرضة للتلف وعدم التمكن فلا زكاة فيه."}, {"story": ["المسألة السابعة: في أقسامها", ["الزكاة قسمان:", "1- زكاة الأموال: وهي التي تتعلق بالمال.", "2- زكاة الأبدان: وهي التي تتعلق بالبدن، وهي زكاة الفطر."]], "ic": "scroll"}, {"story": ["المسألة الثامنة: زكاة الدين", ["الدين إذا كان على معسر فإن صاحب الدين يزكيه إذا قبضه لعام واحد في سنة قبضه، وإن كان على مليء قادر فإنه يزكيه لكل عام؛ لأنه في حكم الموجود عنده."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "الزكاة في اللغة:", "o": ["النماء والزيادة", "النقص", "الصدقة فقط", "الجمع"], "h": "راجع: ص137 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "قال تعالى: ﴿خذ من أموالهم صدقة تطهرهم وتزكيهم بها﴾ وهذه الآية في سورة:", "o": ["التوبة", "البقرة", "الأنعام", "الأعراف"], "h": "راجع: ص137 (المسألة الأولى)"}, {"t": "mcq", "d": 1, "q": "الزكاة ركن من أركان الإسلام:", "o": ["الخمسة", "الأربعة", "الستة", "الثلاثة"], "h": "راجع: ص137 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «تؤخذ من أغنيائهم و____ على فقرائهم»", "o": ["ترد", "تعطى", "توزع", "تجمع"], "h": "راجع: ص137 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "من أنكر وجوب الزكاة جهلا وكان مثله يجهل ذلك:", "o": ["يعرف وجوبها ولا يحكم بكفره", "يكفر", "يقتل", "يحبس"], "h": "راجع: ص138 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "من منع الزكاة بخلا مع اعتقاده وجوبها:", "o": ["آثم ولا يخرجه ذلك عن الإسلام", "كافر", "مرتد", "يعذر"], "h": "راجع: ص138 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "العناق هي:", "o": ["الأنثى من ولد المعز ما لم تستكمل سنة", "الذكر من الضأن", "الناقة", "البقرة"], "h": "راجع: ص139 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "تجب الزكاة في كم جنس من الأموال؟", "o": ["خمسة أجناس", "ثلاثة", "أربعة", "ستة"], "h": "راجع: ص139 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "بهيمة الأنعام هي:", "o": ["الإبل والبقر والغنم", "الخيل والبغال", "الإبل والخيل", "الغنم والدجاج"], "h": "راجع: ص139 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "الركاز هو:", "o": ["ما يوجد في الأرض من دفائن الجاهلية", "ما يخرج من البحر", "الحبوب", "الثمار"], "h": "راجع: ص140 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "قال ﷺ: «وفي الركاز ____»", "o": ["الخمس", "العشر", "نصف العشر", "ربع العشر"], "h": "راجع: ص140 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "من الحكمة في إيجاب الزكاة:", "o": ["تطهير المال وتنميته", "إهلاك المال", "إضعاف الفقراء", "منع الأغنياء"], "h": "راجع: ص140 (المسألة السادسة)"}, {"t": "mcq", "d": 2, "q": "من شروط وجوب الزكاة:", "o": ["الإسلام", "الكفر", "الصغر", "الفقر"], "h": "راجع: ص141 (المسألة السادسة)"}, {"t": "mcq", "d": 2, "q": "مدة الحول:", "o": ["اثنا عشر شهرا قمريا", "ستة أشهر", "سنة شمسية", "ثلاثة أشهر"], "h": "راجع: ص142 (المسألة السادسة)"}, {"t": "mcq", "d": 2, "q": "زكاة الأبدان هي:", "o": ["زكاة الفطر", "زكاة المال", "زكاة التجارة", "زكاة الزروع"], "h": "راجع: ص142 (المسألة السابعة)"}, {"t": "tf", "d": 2, "q": "يشترط الحول في زكاة الزروع والثمار.", "a": false, "h": "راجع: ص142 (المسألة السادسة)"}, {"t": "tf", "d": 2, "q": "الزكاة تجب على العبد والمكاتب.", "a": false, "h": "راجع: ص141 (المسألة السادسة)"}, {"t": "tf", "d": 2, "q": "الدين على المعسر يزكيه صاحبه إذا قبضه لعام واحد.", "a": true, "h": "راجع: ص142 (المسألة الثامنة)"}]}], "sum": [["كتاب الزكاة", "ص137-142"], ["في تعريف الزكاة", "ص137-142"], ["حكم الزكاة ودليل ذلك", "ص137-142"], ["حكم من أنكرها", "ص137-142"]]}, {"id": "l29", "title": "الباب الثاني: في زكاة الذهب والفضة", "group": "الكتاب الثالث: الزكاة", "map": {"center": "الباب الثاني\nالزكاة", "nodes": [{"t": "في زكاة الذهب والفضة", "s": []}, {"t": "حكم الزكاة فيهما، وأدلة ذلك", "s": []}, {"t": "مقدارها", "s": []}, {"t": "شروطها", "s": []}, {"t": "في ضم أحدهما -الذهب والفضة- إلى ال", "s": []}]}, "paras": [{"t": "الباب الثاني: في زكاة الذهب والفضة", "b": [{"pic": ["money-bag", "book", "scroll"], "cap": "ص142-146"}, {"story": ["الباب الثاني: في زكاة الذهب والفضة", ["وفيه مسائل:"]], "ic": "scroll"}, {"story": ["المسألة الأولى: حكم الزكاة فيهما، وأدلة ذلك", ["تجب الزكاة في الذهب والفضة لقوله تعالى: ﴿والذين يكنزون الذهب والفضة ولا ينفقونها في سبيل الله فبشرهم بعذاب أليم﴾ [التوبة: 34] ولا يتوعد بهذه العقوبة إلا على ترك واجب.", "ولقوله ﷺ: «ما من صاحب ذهب ولا فضة، لا يؤدي منها حقها، إلا إذا كان يوم القيامة، صفحت له صفائح من نار، فأحمي عليها في نار جهنم، فيكوى بها جنبه وجبينه وظهره، كلما بردت أعيدت عليه في يوم كان مقداره خمسين ألف سنة، حتى يقضى الله بين العباد».", "ولإجماع أهل العلم على أن في مائتي درهم خمسة دراهم، وعلى أن الذهب إذا كان عشرين مثقالا، وقيمتها مائتا درهم، تجب الزكاة فيه."]], "ic": "scroll"}, {"story": ["المسألة الثانية: مقدارها", ["مقدار الزكاة الواجبة في الذهب والفضة ربع العشر، أي في كل عشرين دينارا من الذهب نصف دينار، وما زاد فبحسابه قل أو كثر، وفي كل مائتي درهم من الفضة خمسة دراهم، وما زاد فبحسابه؛ لقوله ﷺ في كتاب الصدقة: «وفي الرقة كل مائتي درهم ربع العشر». ولحديث: «... وليس عليك شيء -يعني- في الذهب حتى يكون لك عشرون دينارا، فإذا كان لك عشرون دينارا، وحال عليها الحول، ففيها نصف مثقال». ولما جاء عن النبي ﷺ من أنه «كان يأخذ من كل عشرين مثقالا نصف مثقال»."]], "ic": "scroll"}, {"note": "حاشية (ص143): الرقة: -بتخفيف القاف- الفضة والدراهم المضروبة منها، وأصله (الورق) فحذفت الواو وعوض منها الهاء."}, {"story": ["المسألة الثالثة: شروطها", ["يشترط لوجوب الزكاة في الذهب والفضة الشروط التالية:", "1- بلوغ النصاب، وهو عشرون مثقالا من الذهب؛ لحديث علي: «.. وليس عليك شيء -يعني- في الذهب حتى يكون لك عشرون دينارا، وحال عليها الحول، ففيها نصف مثقال» ويساوي بالجرامات (85) جراما.", "ونصاب الفضة مائتا درهم؛ لقوله ﷺ: «ليس فيما دون خمس أواق صدقة». والأوقية أربعون درهما، فخمس أواق تساوي مائتي درهم، وقوله: «وفي الرقة ربع العشر، فإن لم تكن إلا تسعين ومائة، فليس فيها شيء إلا أن يشاء ربها».", "وقد أجمع العلماء على أن نصاب الفضة خمس أواق، ونصاب الذهب عشرون مثقالا.", "2- بقية الشروط العامة التي سبقت فيمن تجب عليه الزكاة، وهي: الإسلام، والحرية، والملك التام، وحولان الحول، وقد سبق الكلام عليها."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: في ضم أحدهما -الذهب والفضة- إلى الآخر", ["لا يضم أحدهما إلى الآخر في إكمال النصاب على القول الراجح؛ لأنهما جنسان مختلفان، فلم يضم أحدهما إلى الآخر، كالإبل والبقر، والشعير والقمح، مع أن المقصود منهما واحد، وهو التنمية في الإبل والبقر، والقوت في الشعير والقمح، ولقوله: «ليس فيما دون خمس أواق صدقة». ويلزم من القول بضم أحدهما إلى الآخر في إكمال النصاب وجوب الزكاة في أقل من خمس أواق من الفضة، إذا كان عنده ما يكمل به من الذهب. ويشمل الحديث ما إذا كان عنده من الذهب ما يكمل به خمس أواق، أو لا. وعلى هذا إذا كان عنده عشرة دنانير ومائة درهم، فلا زكاة عليه؛ لأن الذهب يزكى وحده، وكذلك الفضة."]], "ic": "scroll"}, {"story": ["المسألة الخامسة: في زكاة الحلي", ["لا خلاف بين أهل العلم في وجوب الزكاة في الحلي المعد للادخار والكراء، وفي الحلي المحرم؛ كالرجل يتخذ خاتما من ذهب، أو المرأة تتخذ حليا صنع على صورة حيوان، أو فيه صورة حيوان. أما الحلي المعد للاستعمال المباح والعارية، فالصحيح من قولي أهل العلم وجوب الزكاة فيه؛ وذلك كما يلي:", "1- عموم النصوص الواردة في وجوب الزكاة في الذهب والفضة، وهذا العموم يشمل الحلي وغيره.", "2- ما رواه أهل السنن عن عمرو بن شعيب عن أبيه عن جده: «أن امرأة أتت إلى رسول الله ومعها ابنة لها وفي يد ابنتها مسكتان غليظتان من ذهب، فقال: «أتؤدين زكاة هذا؟» قالت: لا، قال: «أيسرك أن يسورك الله بهما سوارين من نار»، فخلعتهما وألقتهما إلى النبي ﷺ». وهذا الحديث نص في الموضوع، وله شاهد في الصحيح وغيره.", "3- ولأن هذا القول أحوط، وأبرأ للذمة؛ لقوله ﷺ: «دع ما يريبك إلى ما لا يريبك»."]], "ic": "scroll"}, {"note": "حاشية (ص145): مسكتان: بفتحات، أي: سواران، والواحدة: مسكة."}, {"story": ["المسألة السادسة: في زكاة عروض التجارة", ["العروض: جمع عرض وعرض، وهو ما أعده المسلم للتجارة من أي صنف كان، وهو أعم أموال الزكاة وأشملها. وسمي بذلك: لأنه لا يستقر، بل يعرض ثم يزول، فإن التاجر لا يريد هذه السلعة بعينها، وإنما يريد ربحها من النقدين.", "والزكاة واجبة فيه؛ لعموم قوله تعالى: ﴿وفي أموالهم حق للسائل والمحروم﴾ [الذاريات: 19]، وقوله تعالى: ﴿يا أيها الذين آمنوا أنفقوا من طيبات ما كسبتم﴾ [البقرة: 267]. ولقوله ﷺ لمعاذ بن جبل: «أعلمهم أن الله افترض عليهم صدقة في أموالهم تؤخذ من أغنيائهم، فترد على فقرائهم»، ولا شك أن عروض التجارة مال.", "وشروط وجوب الزكاة فيها:", "1- أن يملكها بفعله كالشراء، وقبول الهدية، فلا يدخل في ذلك الإرث ونحوه، مما يدخل قهرا.", "2- أن يملكها بنية التجارة.", "3- أن تبلغ قيمتها نصابا، بالإضافة إلى الشروط الخمسة السابقة في أول الزكاة.", "فإذا حال عليها الحول قومت بأحد النقدين الذهب أو الفضة، فإذا بلغت القيمة نصابا وجب فيها ربع العشر.", "ولا اعتبار في التقويم لما اشتريت به العروض؛ لأن قيمتها تختلف ارتفاعا ونزولا، وإنما العبرة بقيمتها وقت تمام الحول."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "تجب الزكاة في الذهب والفضة لقوله تعالى: ﴿والذين يكنزون الذهب والفضة...﴾ وهي في سورة:", "o": ["التوبة", "البقرة", "الأنعام", "الذاريات"], "h": "راجع: ص142 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "مقدار الزكاة الواجبة في الذهب والفضة:", "o": ["ربع العشر", "العشر", "نصف العشر", "الخمس"], "h": "راجع: ص143 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "نصاب الذهب:", "o": ["عشرون مثقالا", "عشرة مثاقيل", "أربعون مثقالا", "مائتا مثقال"], "h": "راجع: ص143 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "نصاب الفضة:", "o": ["مائتا درهم", "مائة درهم", "خمسة دراهم", "أربعون درهما"], "h": "راجع: ص144 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "الأوقية تساوي:", "o": ["أربعين درهما", "عشرين درهما", "مائة درهم", "خمسة دراهم"], "h": "راجع: ص144 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "عشرون دينارا تساوي بالجرامات:", "o": ["85 جراما", "20 جراما", "100 جرام", "50 جراما"], "h": "راجع: ص144 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "على القول الراجح، الذهب والفضة:", "o": ["لا يضم أحدهما إلى الآخر في إكمال النصاب", "يضم أحدهما إلى الآخر", "يضمان دائما", "لا زكاة فيهما"], "h": "راجع: ص144 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "الصحيح من قولي أهل العلم في الحلي المعد للاستعمال المباح:", "o": ["وجوب الزكاة فيه", "لا زكاة فيه", "يزكى مرة واحدة", "يباع"], "h": "راجع: ص145 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "العروض في زكاة التجارة هي:", "o": ["ما أعده المسلم للتجارة من أي صنف كان", "الذهب فقط", "الحبوب", "الأنعام"], "h": "راجع: ص145 (المسألة السادسة)"}, {"t": "mcq", "d": 2, "q": "إذا حال الحول على عروض التجارة:", "o": ["قومت بأحد النقدين", "تباع", "تقسم", "لا شيء فيها"], "h": "راجع: ص146 (المسألة السادسة)"}, {"t": "mcq", "d": 2, "q": "في زكاة العروض العبرة بقيمتها:", "o": ["وقت تمام الحول", "وقت الشراء", "وقت البيع", "وقت الإرث"], "h": "راجع: ص146 (المسألة السادسة)"}, {"t": "tf", "d": 2, "q": "الإرث من طرق الملك التي تدخل في شروط وجوب زكاة العروض.", "a": false, "h": "راجع: ص146 (المسألة السادسة)"}, {"t": "tf", "d": 2, "q": "يشترط أن يملك عروض التجارة بنية التجارة.", "a": true, "h": "راجع: ص146 (المسألة السادسة)"}]}], "sum": [["في زكاة الذهب والفضة", "ص142-146"], ["حكم الزكاة فيهما، وأدلة ذلك", "ص142-146"], ["مقدارها", "ص142-146"], ["شروطها", "ص142-146"]]}, {"id": "l30", "title": "الباب الثالث: في زكاة الخارج من الأرض", "group": "الكتاب الثالث: الزكاة", "map": {"center": "الباب الثالث\nالزكاة", "nodes": [{"t": "متى تجب؟ ودليل ذلك", "s": []}, {"t": "شروطها", "s": []}, {"t": "في مقدار الواجب", "s": []}, {"t": "في زكاة العسل", "s": []}, {"t": "في الركاز", "s": []}]}, "paras": [{"t": "الباب الثالث: في زكاة الخارج من الأرض", "b": [{"pic": ["money-bag", "book", "scroll"], "cap": "ص146-148"}, {"story": ["المسألة الأولى: متى تجب؟ ودليل ذلك", ["الأصل في وجوبها قوله تعالى: ﴿يا أيها الذين آمنوا أنفقوا من طيبات ما كسبتم ومما أخرجنا لكم من الأرض﴾ [البقرة: 267].", "وتجب الزكاة في الحبوب إذا اشتد الحب، وصار فريكا، وتجب في الثمار عند بدو صلاحها، بحيث تصبح ثمرا طيبا يؤكل، ولا يشترط له الحول؛ لقوله تعالى: ﴿وآتوا حقه يوم حصاده﴾ [الأنعام: 141].", "فتجب الزكاة في كل مكيل مدخر من الحبوب والثمار، كالحنطة، والشعير، والذرة، والأرز، والتمر، والزبيب. ولا تجب في الفواكه، والخضروات.", "فالمكيل: لكون النبي ﷺ اعتبر التوسيق فيه، وهو التحميل. والمدخر: لوجود المعنى المناسب لإيجاب الزكاة فيه.", "وعلى هذا، فما لم يكن مكيلا ولا مدخرا من الحبوب والثمار، فلا زكاة فيه."]], "ic": "scroll"}, {"story": ["المسألة الثانية: شروطها", ["يشترط لوجوب الزكاة في الحبوب والثمار شرطان:", "1- بلوغ النصاب، وهو خمسة أوسق؛ لقوله ﷺ: «ليس فيما دون خمسة أوسق صدقة».", "والوسق حمل البعير، وهو ستون صاعا بصاع النبي ﷺ، وخمسة الأوسق ثلاثمائة صاع، فيكون زنة النصاب بالبر الجيد ما يقارب ستمائة واثني عشر كيلو جراما، على اعتبار أن وزن الصاع 2 ,40 كيلو جراما.", "2- أن يكون النصاب مملوكا له وقت وجوب الزكاة."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: في مقدار الواجب", ["والواجب في الحبوب والثمار: العشر فيما سقي بلا كلفة، بأن كانت عثرية، أو تسقى بماء العيون، ونصف العشر فيما سقي بمؤونة، بأن كانت تسقى بالدلاء والسواني ونحوها؛ لقوله ﷺ: «فيما سقت السماء والأنهار والعيون، أو كان بعلا العشر، وفيما سقي بالسواني، أو النضح نصف العشر»."]], "ic": "scroll"}, {"note": "حاشية (ص147): الدلاء: جمع دلو، وهو ما يستقى به من البئر ونحوه. والسواني: جمع سانية، وهي الناقة التي يستقى عليها، وهي النواضح أيضا، كما مضى. والبعل: النخل يشرب بعروقه فلا يحتاج إلى سقي."}, {"story": ["المسألة الرابعة: في زكاة العسل", ["حكى ابن عبد البر -رحمه الله- عن الجمهور أنه لا زكاة فيه، وهو الأظهر؛ لأنه ليس في الكتاب، ولا في السنة، دليل صحيح صريح على وجوبها، والأصل براءة الذمة حتى يقوم دليل على الوجوب. قال الإمام الشافعي -رحمه الله-: «الحديث في أن في العسل العشر ضعيف وفي أن لا يؤخذ منه العشر ضعيف، إلا عن عمر بن عبد العزيز، واختياري أنه لا يؤخذ منه لأن السنن والآثار ثابتة فيما يؤخذ منه وليست ثابتة فيه فكأنه عفو». وقال ابن المنذر: «ليس في وجوب الصدقة في العسل خبر يثبت»."]], "ic": "scroll"}, {"story": ["المسألة الخامسة: في الركاز", ["الركاز: هو ما وجد من دفائن الجاهلية ذهبا أو فضة أو غيرهما مما عليه علامة الكفر، ولم يطلب بمال، ولم يتكلف فيه نفقة وكبير عمل، وأما ما طلب بمال وتطلب كبير عمل، فليس بركاز، ويجب فيه الخمس في قليله وكثيره، ولا يشترط له الحول ولا النصاب؛ لعموم قوله ﷺ: «وفي الركاز الخمس»، وهو فيء يصرف في مصالح المسلمين العامة، ولا يشترط أن يكون من مال معين، سواء كان من الذهب أو الفضة أو غيرهما.", "ويعرف كونه من دفائن الجاهلية: بوجود علامات الكفر عليه، ككتابة أسمائهم، ونقش صورهم، ونحو ذلك من العلامات.", "وأما المعدن: فهو كل ما تولد من الأرض من غير جنسها، ليس نباتا، سواء أكان جاريا، كالنفط والقار، أم جامدا؛ كالحديد والنحاس والذهب والفضة والزئبق. فتجب فيه الزكاة بالإجماع كما سبق، لعموم النصوص الواردة في وجوب الزكاة في الخارج من الأرض، كقوله تعالى: ﴿أنفقوا من طيبات ما كسبتم ومما أخرجنا لكم من الأرض﴾ [البقرة: 267]."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 2, "q": "تجب الزكاة في الحبوب إذا:", "o": ["اشتد الحب وصار فريكا", "زرعت", "سقيت", "بيعت"], "h": "راجع: ص146 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "تجب الزكاة في كل:", "o": ["مكيل مدخر من الحبوب والثمار", "فاكهة", "خضروات", "ثمرة"], "h": "راجع: ص146 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "نصاب الحبوب والثمار:", "o": ["خمسة أوسق", "عشرة أوسق", "ثلاثة أوسق", "وسق واحد"], "h": "راجع: ص147 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "الوسق هو:", "o": ["حمل البعير", "حمل الحمار", "ثلاثون صاعا", "كيل صغير"], "h": "راجع: ص147 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "الواجب فيما سقي بلا كلفة:", "o": ["العشر", "نصف العشر", "ربع العشر", "الخمس"], "h": "راجع: ص147 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "الواجب فيما سقي بمؤونة:", "o": ["نصف العشر", "العشر", "الخمس", "ربع العشر"], "h": "راجع: ص147 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "الأظهر في زكاة العسل عن الجمهور:", "o": ["لا زكاة فيه", "فيه العشر", "فيه الخمس", "فيه نصف العشر"], "h": "راجع: ص147 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "الواجب في الركاز:", "o": ["الخمس", "العشر", "نصف العشر", "ربع العشر"], "h": "راجع: ص148 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "يشترط في الركاز:", "o": ["لا يشترط له الحول ولا النصاب", "الحول فقط", "النصاب فقط", "الحول والنصاب"], "h": "راجع: ص148 (المسألة الخامسة)"}, {"t": "tf", "d": 2, "q": "تجب الزكاة في الفواكه والخضروات.", "a": false, "h": "راجع: ص146 (المسألة الأولى)"}, {"t": "tf", "d": 2, "q": "تجب الزكاة في المعادن بالإجماع.", "a": true, "h": "راجع: ص148 (المسألة الخامسة)"}, {"t": "tf", "d": 2, "q": "يشترط أن يكون النصاب مملوكا له وقت وجوب الزكاة.", "a": true, "h": "راجع: ص147 (المسألة الثانية)"}]}], "sum": [["متى تجب؟ ودليل ذلك", "ص146-148"], ["شروطها", "ص146-148"], ["في مقدار الواجب", "ص146-148"], ["في زكاة العسل", "ص146-148"]]}, {"id": "l31", "title": "الباب الرابع: في زكاة بهيمة الأنعام", "group": "الكتاب الثالث: الزكاة", "map": {"center": "الباب الرابع\nالزكاة", "nodes": [{"t": "مقدمة", "s": []}, {"t": "شروط وجوبها", "s": []}, {"t": "في قدر الواجب", "s": []}, {"t": "تتمة قدر الواجب في الإبل", "s": []}, {"t": "قدر الواجب في البقر", "s": []}]}, "paras": [{"t": "الباب الرابع: في زكاة بهيمة الأنعام", "b": [{"pic": ["money-bag", "book", "scroll"], "cap": "ص148-154"}, {"story": ["مقدمة", ["وبهيمة الأنعام هي: الإبل، والبقر، والغنم، والبقر يشمل الجاموس أيضا، فهو نوع من البقر. والغنم يشمل الماعز، والضأن. وسميت بهيمة الأنعام؛ لأنها لا تتكلم، من الإبهام وهو الإخفاء، وعدم الإيضاح."]], "ic": "scroll"}, {"story": ["المسألة الأولى: شروط وجوبها", ["يشترط لوجوب الزكاة في بهيمة الأنعام الشروط التالية:", "1- أن تبلغ الأنعام النصاب الشرعي، وهو في الإبل خمس، وفي البقر ثلاثون، وفي الغنم أربعون؛ لقول رسول الله ﷺ: «ليس فيما دون خمس ذود صدقة»، ولحديث معاذ: «بعثني رسول الله ﷺ أصدق أهل اليمن، فأمرني أن آخذ من البقر: من كل ثلاثين تبيعا ومن كل أربعين مسنة»، ولقوله ﷺ: «فإذا كانت سائمة الرجل ناقصة من أربعين شاة فليس فيها صدقة...».", "2- أن يحول على الأنعام حول كامل عند مالكها وهي نصاب؛ لحديث: «لا زكاة في مال حتى يحول عليه الحول».", "3- أن تكون سائمة، وهي التي ترعى الكلأ المباح -وهو الذي نبت بفعل الله سبحانه دون أن يزرعه أحد- في الحول أو أكثره؛ لقوله ﷺ: «وفي صدقة الغنم في سائمتها إذا كانت أربعين إلى مائة وعشرين شاة»، وقوله ﷺ: «وفي إبل كل سائمة في أربعين بنت لبون»، فإن كانت ترعى أقل الحول ويعلفها أكثره، فليست سائمة، ولا زكاة فيها.", "4- أن لا تكون عاملة، وهي التي يستخدمها صاحبها في حرث الأرض، أو نقل المتاع، أو حمل الأثقال؛ لأنها تدخل في حاجات الإنسان الأصلية كالثياب. أما إذا أعدت للكراء، فإن الزكاة تكون فيما يحصل من أجرتها، إذا حال عليه الحول."]], "ic": "scroll"}, {"story": ["المسألة الثانية: في قدر الواجب", ["1- قدر الواجب في الإبل:", "ومقدار الزكاة الواجبة: في الخمس من الإبل شاة جذعة من الضأن، أو ثنية من المعز، وفي العشر شاتان، وفي الخمس عشرة ثلاث شياه، وفي العشرين أربع شياه، وفي خمس وعشرين إلى خمس وثلاثين بنت مخاض من الإبل، وهي ما تم لها سنة، ودخلت في الثانية. وسميت بذلك لأن الغالب أن أمها قد حملت، فهي ماخض أي: حامل، فإن لم يجدها أجزأه ابن لبون ذكر، وهو ما تم له سنتان ودخل في الثالثة، وسمي بذلك؛ لأن أمه وضعت الحمل الثاني في الغالب فهي ذات لبن. وفي ست وثلاثين إلى خمس وأربعين بنت لبون، لها سنتان.", "وفي ست وأربعين إلى ستين حقة، وهي ما تم لها ثلاث سنين، ودخلت في الرابعة، وسميت بذلك لأنها استحقت أن يطرقها الفحل. وقيل: لأنها استحقت الركوب، والتحميل.", "وفي إحدى وستين إلى خمس وسبعين جذعة، وهي ما تم لها أربع سنين ودخلت في الخامسة، وسميت بذلك لأنها جذعت مقدم أسنانها أي: أسقطته.", "وفي ست وسبعين إلى تسعين بنتا لبون.", "وفي إحدى وتسعين إلى مائة وعشرين حقتان.", "فإذا زادت على مائة وعشرين ففي كل أربعين بنت لبون، وفي كل خمسين حقة؛ وذلك لحديث أنس في كتاب الصدقة وفيه: «في أربع وعشرين من الإبل فما دونها من الغنم من كل خمس شاة، فإذا بلغت خمسا وعشرين إلى خمس وثلاثين، ففيها بنت مخاض أنثى...» الحديث.", "وهذا جدول يبين كيفية الزكاة في الإبل:"]], "ic": "scroll"}, {"cmp": {"h": ["من", "إلى", "المقدار الواجب"], "r": [["5", "9", "شاة"], ["10", "14", "شاتان"], ["15", "19", "ثلاث شياه"], ["20", "24", "أربع شياه"], ["25", "35", "بنت مخاض"], ["36", "45", "بنت لبون"], ["46", "60", "حقة"], ["61", "75", "جذعة"], ["76", "90", "بنتا لبون"], ["91", "120", "حقتان"]]}}, {"story": ["تتمة قدر الواجب في الإبل", ["فما زاد على 120 فالواجب في كل أربعين بنت لبون، وفي كل خمسين حقة."]], "ic": "scroll"}, {"note": "حاشية (ص150): الجذع: الصغير السن، وهو من الغنم ما تم له سنة ودخل في الثانية. الثنية: ما تم له سنتان ودخل في الثالثة."}, {"story": ["قدر الواجب في البقر", ["2- قدر الواجب في البقر:", "يجب في ثلاثين بقرة إلى تسع وثلاثين تبيع، وهو ما تم له سنة، وسمي بذلك لأنه يتبع أمه، وفي أربعين إلى تسع وخمسين مسنة، وهي ما تم لها سنتان، وسميت بذلك؛ لأنها طلعت لها أسنان.", "وفي ستين إلى تسع وستين تبيعان.", "ثم في كل ثلاثين تبيع، وفي كل أربعين مسنة، وهكذا مهما بلغت.", "وذلك لحديث معاذ وفيه: «فأمرني أن آخذ من البقر من كل ثلاثين تبيعا ومن كل أربعين مسنة».", "وهذا جدول يبين كيفية الزكاة في البقر:"]], "ic": "scroll"}, {"cmp": {"h": ["من", "إلى", "المقدار الواجب"], "r": [["30", "39", "تبيع"], ["40", "59", "مسنة"], ["60", "69", "تبيعان"], ["70", "79", "تبيع ومسنة"]]}}, {"story": ["بقية قدر الواجب في البقر والغنم", ["فما زاد ففي كل ثلاثين تبيع وفي كل أربعين مسنة.", "3- قدر الواجب في الغنم:", "ويجب في أربعين من الغنم إلى مائة وعشرين، شاة، وفي مائة وإحدى وعشرين إلى مائتين، شاتان، وفي مائتين وواحدة إلى ثلاثمائة، ثلاث شياه، ثم تستقر الفريضة فيها بعد هذا المقدار، فيكون في كل مائة شاة، مهما بلغت.", "وذلك لما جاء في حديث أنس في كتاب الصدقة وفيه: «وفي صدقة الغنم في سائمتها إذا كانت أربعين إلى عشرين ومائة شاة، فإذا زادت على مائة وعشرين إلى مائتين شاتان، فإذا زادت على مائتين إلى ثلاث مائة، ففيها ثلاث، فإذا زادت على ثلاث مائة، ففي كل مائة شاة».", "وهذا جدول يبين كيفية زكاة الغنم:"]], "ic": "scroll"}, {"cmp": {"h": ["من", "إلى", "المقدار الواجب"], "r": [["40", "120", "شاة"], ["121", "200", "شاتان"], ["201", "300", "ثلاث شياه"]]}}, {"story": ["فما زاد على ذلك", ["فما زاد على ذلك ففي كل مائة شاة."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: في صفة الواجب", ["وازن الإسلام بتشريعه العادل، بين المصالح للفقراء والأغنياء، فندب إلى أخذ الفقير حقوقه كاملة، غير منقوصة، وندب إلى مراعاة حقوق الأغنياء في أموالهم، ولذلك حدد الواجب في الزكاة، بأن يكون من وسط المال، لا من خياره، ولا من شراره، فيجب على الساعي مراعاة السن الواجبة؛ إذ لا يجزئ قل منها؛ لأنه إضرار بالفقراء، ولا يأخذ أعلى منها؛ لأنه إجحاف بالأغنياء.", "ولا يأخذ المريضة، والمعيبة، والكبيرة الهرمة؛ لأنها لا تنفع الفقير، وبالمقابل لا يأخذ الأكولة، وهي السمينة المعدة للأكل، ولا الربى، وهي التي تربي ولدها، ولا الماخض وهي الحامل، ولا الفحل المعد للضراب، ولا حزرات المال، وهي خيارها التي تحرزها العين؛ لأنها من كرائم الأموال، وأخذها إضرار بالغني؛ لقوله ﷺ: «... وإياك وكرائم أموالهم».", "ولما روي عن عمر أنه قال لعامله سفيان: «قل لقومك إنا ندع لكم الربى والماخض وذات اللحم وفحل الغنم ونأخذ الجذع والثني وذلك وسط بيننا وبينكم في المال»."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: في الخلطة في بهيمة الأنعام", ["وهي على نوعين:", "النوع الأول: خلطة أعيان، وهي: أن يكون المال مشتركا بين اثنين في الملك، مشاعا بينهما، لم يتميز نصيب أحدهما عن الآخر، وتكون خلطة الأعيان بالإرث، وتكون بالشراء.", "النوع الثاني: خلطة أوصاف، وهي أن يكون نصيب كل منهما متميزا معروفا، ويجمع بينهما الجوار فقط.", "وهي بنوعيها تصير المالين المختلطين كالمال الواحد كما كان مجموع المالين نصابا، وأن يكون الخليطان من أهل وجوب الزكاة. فلو كان أحدهما كافرا لم تصح الخلطة، ولا تؤثر، وأن يشترك المالان المختلطان في المراح، وهو المبيت والمأوى، ويشتركا في المسرح فيسرحن جميعا، ويرجعن جميعا، والمحلب والمرعى، والفحل، فيكون فحل الضراب واحدا مشتركا لها جميعا.", "فإذا توافرت هذه الشروط أصبح المالان كالمال الواحد بتأثير الخلطة.", "لقوله ﷺ: «لا يجمع بين متفرق ولا يفرق بين مجتمع خشية الصدقة وما كان من خليطين فإنهما يتراجعان بينهما بالسوية». فالخلطة تؤثر في إيجاب الزكاة وفي إسقاطها، وذلك في بهيمة الأنعام خاصة دون غيرها.", "ومثال الجمع بين المتفرق: أشخاص ثلاثة كل واحد منهم يملك أربعين من الغنم، فجميعها مائة وعشرون، فلو اعتبرنا كل واحد لوحده لوجب عليهم ثلاث شياه، لكن إذا جمعنا الغنم كلها فلا يكون فيها إلا شاة واحدة. فهنا: جمعوا بين متفرق؛ لئلا يجب عليهم ثلاث شياه، بل واحدة.", "ومثال التفريق بين مجتمع: شخص عنده أربعون شاة، فإذا علم بمجيء العامل فرق بينها فجعل عشرين منها في مكان وعشرين منها في مكان آخر، فلا يؤخذ عليها زكاة لعدم بلوغها النصاب متفرقة."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 2, "q": "نصاب الإبل:", "o": ["خمس", "ثلاثون", "أربعون", "عشر"], "h": "راجع: ص149 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "نصاب البقر:", "o": ["ثلاثون", "خمس", "أربعون", "عشرون"], "h": "راجع: ص149 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "نصاب الغنم:", "o": ["أربعون", "ثلاثون", "خمس", "مائة"], "h": "راجع: ص149 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "السائمة هي التي:", "o": ["ترعى الكلأ المباح في الحول أو أكثره", "يعلفها صاحبها", "تعمل في الحرث", "تحمل الأثقال"], "h": "راجع: ص149 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "الواجب في خمس من الإبل:", "o": ["شاة", "شاتان", "بنت مخاض", "حقة"], "h": "راجع: ص150 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "الواجب في خمس وعشرين إلى خمس وثلاثين من الإبل:", "o": ["بنت مخاض", "بنت لبون", "حقة", "جذعة"], "h": "راجع: ص150 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "الواجب في ستين بقرة:", "o": ["تبيعان", "تبيع", "مسنة", "مسنتان"], "h": "راجع: ص152 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "الواجب في مائة وإحدى وعشرين شاة إلى مائتين:", "o": ["شاتان", "شاة", "ثلاث شياه", "أربع شياه"], "h": "راجع: ص152 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "لا يأخذ الساعي في الزكاة:", "o": ["الأكولة والماخض وحزرات المال", "الوسط من المال", "الجذع", "الثني"], "h": "راجع: ص153 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "خلطة الأعيان تكون:", "o": ["بالإرث وبالشراء", "بالجوار فقط", "بالإعارة", "بالهبة فقط"], "h": "راجع: ص153 (المسألة الرابعة)"}, {"t": "tf", "d": 2, "q": "إذا كانت الأنعام عاملة فلا زكاة فيها.", "a": true, "h": "راجع: ص149 (المسألة الأولى)"}, {"t": "tf", "d": 2, "q": "يجب على الساعي أن يأخذ من خيار المال.", "a": false, "h": "راجع: ص153 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "تؤثر الخلطة في بهيمة الأنعام خاصة دون غيرها.", "a": true, "h": "راجع: ص154 (المسألة الرابعة)"}, {"t": "order", "d": 2, "q": "رتب الواجب في زكاة الإبل بحسب الزيادة في العدد:", "o": ["بنت مخاض", "بنت لبون", "حقة", "جذعة"], "h": "راجع: ص150 (المسألة الثانية)"}]}], "sum": [["مقدمة", "ص148-154"], ["شروط وجوبها", "ص148-154"], ["في قدر الواجب", "ص148-154"], ["تتمة قدر الواجب في الإبل", "ص148-154"]]}, {"id": "l32", "title": "الباب الخامس: في زكاة الفطر، ويقال لها: صدقة الفطر", "group": "الكتاب الثالث: الزكاة", "map": {"center": "الباب الخامس\nالزكاة", "nodes": [{"t": "مقدمة", "s": []}, {"t": "في حكمها ودليل ذلك", "s": []}, {"t": "شروطها وعلى من تجب", "s": []}, {"t": "في حكمة وجوبها", "s": []}, {"t": "مقدار الواجب، وممن يخرج؟", "s": []}]}, "paras": [{"t": "الباب الخامس: في زكاة الفطر، ويقال لها: صدقة الفطر", "b": [{"pic": ["money-bag", "book", "scroll"], "cap": "ص154-157"}, {"story": ["مقدمة", ["وفيه مسائل:", "وسميت بذلك: لأنها تجب بالفطر من رمضان، ولا تعلق لها بالمال، وإنما هي متعلقة بالذمة، فهي زكاة عن النفس والبدن."]], "ic": "scroll"}, {"story": ["المسألة الأولى: في حكمها ودليل ذلك", ["زكاة الفطر واجبة على كل مسلم؛ لما روى ابن عمر رضي الله عنهما: «فرض رسول الله ﷺ صدقة الفطر من رمضان صاعا من تمر، أو صاعا من شعير على العبد والحر، والذكر والأنثى، والصغير والكبير من المسلمين»."]], "ic": "scroll"}, {"story": ["المسألة الثانية: شروطها وعلى من تجب", ["تجب زكاة الفطر على كل مسلم كبير وصغير، وذكر وأنثى، وحر وعبد؛ لحديث ابن عمر رضي الله عنهما السابق.", "ويستحب إخراجها عن الجنين إذا نفخت فيه الروح، وهو ما صار له أربعة أشهر؛ فقد كان السلف يخرجونها عنه، كما ثبت عن عثمان وغيره.", "ويجب أن يخرجها عن نفسه، وعمن تلزمه نفقته، من زوجة أو قريب، وكذا العبد، فإن صدقة الفطر تجب على سيده؛ لقوله ﷺ: «ليس في العبد صدقة إلا صدقة الفطر». ولا تجب إلا على من فضل عن قوته، وقوت من تلزمه نفقته وحوائجه الضرورية في يوم العيد وليلته ما يؤدي به الفطرة.", "فزكاة الفطر لا تجب إلا بشرطين:", "1- الإسلام، فلا تجب على الكافر.", "2- وجود ما يفضل عن قوته، وقوت عياله، وحوائجه الأصلية في يوم العيد وليلته."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: في حكمة وجوبها", ["من الحكم في وجوب زكاة الفطر ما يلي:", "1- تطهير الصائم مما عسى أن يكون قد وقع فيه في صيامه، من اللغو والرفث.", "2- إغناء الفقراء والمساكين عن السؤال في يوم العيد، وإدخال السرور عليهم؛ ليكون العيد يوم فرح وسرور لجميع فئات المجتمع، وذلك لحديث ابن عباس رضي الله عنهما: «فرض رسول الله ﷺ زكاة الفطر طهرة للصائم من اللغو والرفث، وطعمة للمساكين».", "3- وفيها إظهار شكر نعمة الله على العبد بإتمام صيام شهر رمضان وقيامه، وفعل ما تيسر من الأعمال الصالحة في هذا الشهر المبارك."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: مقدار الواجب، وممن يخرج؟", ["الواجب في زكاة الفطر صاع من غالب قوت أهل البلد من بر، أو شعير، أو تمر، أو زبيب، أو أقط، أو أرز، أو ذرة، أو غير ذلك؛ لثبوت ذلك عن النبي ﷺ في الأحاديث الصحيحة، كحديث ابن عمر رضي الله عنهما المتقدم.", "ويجوز أن تعطي الجماعة زكاة فطرها لشخص واحد، وأن يعطي الواحد زكاته لجماعة.", "ولا يجزئ إخراج قيمة الطعام؛ لأن ذلك خلاف ما أمر به رسول الله ﷺ؛ ولأنه مخالف لعمل الصحابة، فقد كانوا يخرجونها صاعا من طعام؛ ولأن زكاة الفطر عبادة مفروضة من جنس معين وهو الطعام، فلا يجزئ إخراجها من غير الجنس المعين."]], "ic": "scroll"}, {"note": "حاشية (ص156): الأقط: هو لبن مجفف يابس مستحجر، يتخذ من اللبن المخيض."}, {"story": ["المسألة الخامسة: في وقت وجوبها وإخراجها", ["تجب زكاة الفطر بغروب الشمس من ليلة العيد؛ لأنه الوقت الذي يكون به الفطر من رمضان. ولإخراجها وقتان: وقت فضيلة وأداء، ووقت جواز.", "فأما وقت الفضيلة: فهو من طلوع فجر يوم العيد إلى قبيل أداء صلاة العيد؛ لحديث ابن عمر رضي الله عنهما: «أن النبي ﷺ أمر بزكاة الفطر قبل خروج الناس إلى الصلاة».", "وأما وقت الجواز: فهو قبل العيد بيوم أو يومين؛ لفعل ابن عمر وغيره من الصحابة لذلك.", "ولا يجوز تأخيرها عن صلاة العيد، فإن أخرها فهي صدقة من الصدقات، ويأثم على هذا التأخير؛ لقوله ﷺ: «من أداها قبل الصلاة، فهي زكاة مقبولة، ومن أداها بعد الصلاة، فهي صدقة من الصدقات»."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 2, "q": "سميت زكاة الفطر بذلك لأنها:", "o": ["تجب بالفطر من رمضان", "تجب في الشتاء", "تؤخذ من الأغنياء فقط", "تجب على المال"], "h": "راجع: ص154 (مقدمة)"}, {"t": "mcq", "d": 2, "q": "مقدار زكاة الفطر:", "o": ["صاع من غالب قوت أهل البلد", "نصف صاع", "مد", "صاعان"], "h": "راجع: ص156 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "تجب زكاة الفطر بـ:", "o": ["غروب الشمس من ليلة العيد", "طلوع الشمس يوم العيد", "منتصف رمضان", "ظهر يوم العيد"], "h": "راجع: ص156 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "وقت الفضيلة لإخراجها:", "o": ["من طلوع فجر يوم العيد إلى قبيل الصلاة", "بعد الصلاة", "قبل رمضان", "بعد العيد بيوم"], "h": "راجع: ص156 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "وقت الجواز لإخراجها:", "o": ["قبل العيد بيوم أو يومين", "قبل العيد بشهر", "بعد العيد بيوم", "بعد العيد بشهر"], "h": "راجع: ص157 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "من الحكمة في وجوب زكاة الفطر:", "o": ["تطهير الصائم من اللغو والرفث", "جمع المال", "شراء الأضاحي", "زيادة الأموال"], "h": "راجع: ص156 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "لا تجب زكاة الفطر على:", "o": ["الكافر", "الصغير", "الأنثى", "العبد"], "h": "راجع: ص155 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "يجزئ إخراج قيمة الطعام في زكاة الفطر.", "a": false, "h": "راجع: ص156 (المسألة الرابعة)"}, {"t": "tf", "d": 2, "q": "يجوز أن تعطي الجماعة زكاة فطرها لشخص واحد.", "a": true, "h": "راجع: ص156 (المسألة الرابعة)"}, {"t": "tf", "d": 2, "q": "إذا أخر زكاة الفطر عن صلاة العيد فهي صدقة من الصدقات.", "a": true, "h": "راجع: ص157 (المسألة الخامسة)"}, {"t": "tf", "d": 2, "q": "يستحب إخراجها عن الجنين إذا نفخت فيه الروح.", "a": true, "h": "راجع: ص155 (المسألة الثانية)"}]}], "sum": [["مقدمة", "ص154-157"], ["في حكمها ودليل ذلك", "ص154-157"], ["شروطها وعلى من تجب", "ص154-157"], ["في حكمة وجوبها", "ص154-157"]]}, {"id": "l33", "title": "الباب السادس: في أهل الزكاة", "group": "الكتاب الثالث: الزكاة", "map": {"center": "الباب السادس\nالزكاة", "nodes": [{"t": "من هم أهل الزكاة؟ ودليل ذلك", "s": []}, {"t": "في حد الذين لا تدفع لهم الزكاة", "s": []}, {"t": "هل يشترط استيعاب الأصناف الثمانية ", "s": []}, {"t": "في نقل الزكاة من بلدها إلى بلد آخر", "s": []}]}, "paras": [{"t": "الباب السادس: في أهل الزكاة", "b": [{"pic": ["money-bag", "book", "scroll"], "cap": "ص157-160"}, {"story": ["المسألة الأولى: من هم أهل الزكاة؟ ودليل ذلك", ["أهل الزكاة هم المستحقون لها، وهم الأصناف الثمانية الذين حصرهم الله عز وجل في قوله: ﴿إنما الصدقات للفقراء والمساكين والعاملين عليها والمؤلفة قلوبهم وفي الرقاب والغارمين وفي سبيل الله وابن السبيل فريضة من الله والله عليم حكيم﴾ [التوبة: 60].", "وإيضاح هذه الأصناف كما يلي:", "1- الفقراء: جمع فقير، وهو من ليس لديه ما يسد حاجته، وحاجة من يعول، من طعام وشراب وملبس ومسكن، بألا يجد شيئا، أو يجد أقل من نصف الكفاية، ويعطى من الزكاة ما يكفيه سنة كاملة.", "2- المساكين: جمع مسكين، وهو من يجد نصف كفايته أو أكثر من النصف، كمن معه مائة ويحتاج إلى مائتين، ويعطى من الزكاة ما يكفيه لمدة عام.", "3- العاملون عليها: جمع عامل، وهو من يبعثه الإمام لجباية الصدقات، فيعطيه الإمام ما يكفيه مدة ذهابه وإيابه ولو كان غنيا؛ لأن العامل قد فرغ نفسه لهذا العمل، والعاملون عليها هم كل من يعمل في جبايتها، وكتابتها، وحراستها، وتفريقها على مستحقيها.", "4- المؤلفة قلوبهم: وهم قوم يعطون الزكاة؛ تأليفا لقلوبهم على الإسلام إن كانوا كفارا، وتثبيتا لإيمانهم، إن كانوا من ضعاف الإيمان المتهاونين في عباداتهم، أو لترغيب ذويهم في الإسلام، أو طلبا لمعونتهم أو كف أذاهم.", "5- في الرقاب: جمع رقبة، والمراد بها العبد المسلم أو الأمة يشترى من مال الزكاة ويعتق، أو يكون مكاتبا فيعطى من الزكاة ما يسدد به نجوم كتابته؛ ليصبح حرا نافذ التصرف، وعضوا نافعا في المجتمع، ويتمكن من عبادة الله تعالى على الوجه الأكمل، وكذا الأسير المسلم يفك من الأعداء من مال الزكاة.", "6- الغارمون: جمع غارم، وهو المدين الذي تحمل دينا في غير معصية الله، سواء لنفسه في أمر مباح، أو لغيره لإصلاح ذات البين، فهذا يعطى من الزكاة ما يسدد به دينه، والغارم للإصلاح بين الناس يعطى من الزكاة، وإن كان غنيا.", "7- في سبيل الله: المراد به الغزاة في سبيل الله، المتطوعون الذين ليس لهم راتب في بيت المال، فيعطون من الزكاة، سواء أكانوا أغنياء أم فقراء.", "8- ابن السبيل: وهو المسافر المنقطع عن بلده الذي يحتاج إلى مال؛ ليواصل السفر إلى بلده، إذا لم يجد من يقرضه."]], "ic": "scroll"}, {"story": ["المسألة الثانية: في حد الذين لا تدفع لهم الزكاة", ["الأصناف الذين لا يجوز صرف الزكاة لهم هم:", "1- الأغنياء، والأقوياء المكتسبون؛ لقوله ﷺ: «لا حظ فيها لغني ولا لقوي مكتسب»، لكن يعطى العامل عليها والغارم وإن كانوا أغنياء، كما تقدم.", "والقادر على الكسب إذا كان متفرغا لطلب العلم الشرعي، وليس له مال، فإنه يعطى من الزكاة؛ لأن طلب العلم جهاد في سبيل الله؛ وأما إن كان القادر على كسب عابدا ترك العمل للتفرغ لنوافل العبادات فلا يعطى؛ لأن العبادة نفعها قاصر على العابد بخلاف العلم.", "2- الأصول والفروع والزوجة الذين تجب نفقتهم عليه، فلا يجوز دفع الزكاة إلى من تجب على المسلم نفقتهم كالآباء والأمهات، والأجداد والجدات، والأولاد، وأولاد الأولاد؛ لأن دفع الزكاة إلى هؤلاء يغنيهم عن النفقة الواجبة عليه، ويسقطها عنه، ومن ثم يعود نفع الزكاة إليه، فكأنه دفعها إلى نفسه.", "3- الكفار غير المؤلفين، فلا يجوز دفع الزكاة إلى الكفار؛ لقوله ﷺ: «تؤخذ من أغنيائهم وترد على فقرائهم» أي: أغنياء المسلمين وفقرائهم دون غيرهم، ولأن من مقاصد الزكاة إغناء فقراء المسلمين، وتوطيد دعائم المحبة والإخاء بين أفراد المجتمع المسلم، وذلك لا يجوز مع الكفار.", "4- آل النبي ﷺ: لا تحل الزكاة لآل النبي ﷺ إكراما لهم لشرفهم؛ لقوله: «إنها لا تحل لآل محمد إنما هي أوساخ الناس». وآل النبي ﷺ قيل: هم بنو هاشم، وبنو المطلب؛ وقيل: هم بنو هاشم فقط، وهو الصحيح. وعليه يصح دفع الزكاة إلى بني المطلب؛ لأنهم ليسوا من آل محمد ﷺ، ولعموم الآية: ﴿إنما الصدقات للفقراء﴾ [التوبة: 60]، فيدخل فيهم بنو المطلب.", "5- وكذلك لا يجوز دفع الزكاة لموالي آل النبي؛ لحديث: «إن الصدقة لا تحل لنا، وإن موالي القوم من أنفسهم». ومعنى (من أنفسهم): أي: فحكمهم كحكمهم، فتحرم الزكاة على موالي آل بني هاشم. وموالي القوم: عتقاؤهم.", "6- العبد: لا تدفع الزكاة إلى العبد؛ لأن مال العبد ملك لسيده، فإذا أعطي الزكاة انتقلت إلى ملك سيده، ولأن نفقته تلزم سيده. ويستثنى من ذلك: المكاتب فإنه يعطى من الزكاة ما يقضي به دين كتابته، والعامل على الزكاة، فإذا كان العبد عاملا على الزكاة أعطي منها لأنه كالأجير، والعبد يجوز أن يستأجر بإذن سيده.", "فمن دفعها لهذه الأصناف مع علمه بأنه لا يجوز دفعها لهم، فهو آثم."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: هل يشترط استيعاب الأصناف الثمانية المذكورة عند تفريق الزكاة؟", ["لا يشترط استيعاب الأصناف الثمانية المذكورة عند تفريق الزكاة على القول الصحيح، بل يجزئ دفعها لأي صنف من الأصناف الثمانية؛ لقوله تعالى: ﴿إن تبدوا الصدقات فنعما هي وإن تخفوها وتؤتوها الفقراء فهو خير لكم﴾ [البقرة: 271]", "وقوله ﷺ: «تؤخذ من أغنيائهم وترد على فقرائهم» متفق عليه، ولقوله لقبيصة: «أقم عندنا حتى تأتينا الصدقة، فنأمر لك بها».", "فهذه الأدلة تدل على أن المراد بقوله تعالى: ﴿إنما الصدقات للفقراء﴾ الآية [التوبة: 60]، بيان المستحقين للزكاة لا تعميم المستحقين عند تفريقها."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: في نقل الزكاة من بلدها إلى بلد آخر", ["يجوز نقل الزكاة من بلدها، إلى بلد آخر قريب، أو بعيد للحاجة، مثل أن يكون البلد البعيد أشد فقرا، أو يكون لصاحب الزكاة أقارب فقراء في بلد بعيد مثل: فقراء بلده، فإن في دفعها إلى أقاربه تحصيل المصلحتين، وهي الصدقة والصلة.", "وهذا القول بجواز نقل الزكاة هو الصحيح؛ لعموم قوله تعالى: ﴿إنما الصدقات للفقراء والمساكين﴾ [التوبة: 60] أي: الفقراء والمساكين في كل مكان."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 2, "q": "الفقير هو من:", "o": ["ليس لديه ما يسد حاجته أو يجد أقل من نصف الكفاية", "يجد نصف كفايته أو أكثر", "يجبي الصدقات", "عليه دين"], "h": "راجع: ص157 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "المسكين هو من:", "o": ["يجد نصف كفايته أو أكثر من النصف", "لا يجد شيئا", "يبعثه الإمام", "مسافر منقطع"], "h": "راجع: ص157 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "العاملون عليها هم:", "o": ["من يعمل في جبايتها وكتابتها وحراستها وتفريقها", "الفقراء", "الغارمون", "الغزاة"], "h": "راجع: ص158 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "المؤلفة قلوبهم:", "o": ["قوم يعطون تأليفا لقلوبهم على الإسلام وتثبيتا لإيمانهم", "الأسرى", "المسافرون", "الأقارب"], "h": "راجع: ص158 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "الغارم هو:", "o": ["المدين الذي تحمل دينا في غير معصية الله", "العبد", "المسافر", "الغازي"], "h": "راجع: ص158 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "ابن السبيل هو:", "o": ["المسافر المنقطع عن بلده", "الغازي", "المدين", "العبد"], "h": "راجع: ص158 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "لا يجوز دفع الزكاة إلى:", "o": ["الأصول والفروع الذين تجب نفقتهم عليه", "الفقراء", "الغارمين", "المساكين"], "h": "راجع: ص159 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "الصحيح أن آل النبي ﷺ هم:", "o": ["بنو هاشم فقط", "بنو هاشم وبنو المطلب", "كل قريش", "الصحابة"], "h": "راجع: ص159 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "يشترط استيعاب الأصناف الثمانية عند تفريق الزكاة.", "a": false, "h": "راجع: ص160 (المسألة الثالثة)"}, {"t": "tf", "d": 2, "q": "يجوز نقل الزكاة من بلدها إلى بلد آخر للحاجة.", "a": true, "h": "راجع: ص160 (المسألة الرابعة)"}, {"t": "tf", "d": 2, "q": "لا يجوز دفع الزكاة إلى الكفار غير المؤلفين.", "a": true, "h": "راجع: ص159 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "يعطى الغارم للإصلاح بين الناس من الزكاة وإن كان غنيا.", "a": true, "h": "راجع: ص158 (المسألة الأولى)"}]}], "sum": [["من هم أهل الزكاة؟ ودليل ذلك", "ص157-160"], ["في حد الذين لا تدفع لهم الزكاة", "ص157-160"], ["هل يشترط استيعاب الأصناف الثمانية ", "ص157-160"], ["في نقل الزكاة من بلدها إلى بلد آخر", "ص157-160"]]}, {"id": "l34", "title": "الباب الأول: في مقدمات الصيام", "group": "الكتاب الرابع: الصيام", "map": {"center": "الباب الأول\nالصيام", "nodes": [{"t": "كتاب الصيام", "s": []}, {"t": "تعريف الصيام، وبيان أركانه", "s": []}, {"t": "حكم صيام رمضان ودليل ذلك", "s": []}, {"t": "أقسام الصيام", "s": []}, {"t": "فضل صيام شهر رمضان، والحكمة من مشر", "s": []}]}, "paras": [{"t": "الباب الأول: في مقدمات الصيام", "b": [{"pic": ["crescent-moon", "book", "scroll"], "cap": "ص161-165"}, {"story": ["كتاب الصيام", ["رابعا: كتاب الصيام، ويشتمل على خمسة أبواب.", "الباب الأول: في مقدمات الصيام، وفيه مسائل:"]], "ic": "scroll"}, {"story": ["المسألة الأولى: تعريف الصيام، وبيان أركانه", ["1- تعريفه: الصيام في اللغة: الإمساك عن الشيء.", "وفي الشرع: الإمساك عن الأكل، والشرب، وسائر المفطرات، مع النية، من طلوع الفجر الصادق إلى غروب الشمس.", "2- أركانه: من خلال تعريف الصيام في الاصطلاح، يتضح أن له ركنين أساسيين، هما:", "الأول: الإمساك عن المفطرات من طلوع الفجر إلى غروب الشمس.", "ودليل هذا الركن، قوله تعالى: ﴿فالآن باشروهن وابتغوا ما كتب الله لكم وكلوا واشربوا حتى يتبين لكم الخيط الأبيض من الخيط الأسود من الفجر ثم أتموا الصيام إلى الليل﴾ [البقرة: 187]. والمراد بالخيط الأبيض والخيط الأسود: بياض النهار وسواد الليل.", "الثاني: النية، بأن يقصد الصائم بهذا الإمساك عن المفطرات عبادة الله عز وجل، فبالنية تتميز الأعمال المقصودة للعبادة عن غيرها من الأعمال، وبالنية تتميز العبادات بعضها عن بعض، فيقصد الصائم بهذا الصيام: إما صيام رمضان، أو غيره من أنواع الصيام.", "ودليل هذا الركن قوله ﷺ: «إنما الأعمال بالنيات، وإنما لكل امرئ ما نوى»."]], "ic": "scroll"}, {"story": ["المسألة الثانية: حكم صيام رمضان ودليل ذلك", ["فرض الله عز وجل صيام شهر رمضان، وجعله أحد أركان الإسلام الخمسة؛ وذلك في قوله تعالى: ﴿يا أيها الذين آمنوا كتب عليكم الصيام كما كتب على الذين من قبلكم لعلكم تتقون﴾ [البقرة: 183]. وقوله تعالى: ﴿شهر رمضان الذي أنزل فيه القرآن هدى للناس وبينات من الهدى والفرقان فمن شهد منكم الشهر فليصمه﴾ [البقرة: 185].", "ولما رواه عبد الله بن عمر رضي الله عنهما قال: قال رسول الله ﷺ: «بني الإسلام على خمس: شهادة أن لا إله إلا الله وأن محمدا رسول الله، وإقام الصلاة، وإيتاء الزكاة، وصوم رمضان، وحج بيت الله الحرام من استطاع إليه سبيلا».", "ولما رواه طلحة بن عبيد الله رضي الله عنه أن أعرابيا جاء إلى النبي ﷺ ثائر الرأس، فقال: يا رسول الله أخبرني ماذا فرض الله علي من الصيام؟ قال: «شهر رمضان». قال: هل علي غيره؟ قال: «لا، إلا أن تطوع شيئا...» الحديث.", "وقد أجمعت الأمة على وجوب صيام رمضان، وأنه أحد أركان الإسلام التي علمت من الدين بالضرورة، وأن منكره كافر، مرتد عن الإسلام.", "فثبتت بذلك فرضية الصوم بالكتاب والسنة والإجماع، وأجمع المسلمون على كفر من أنكره."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: أقسام الصيام", ["الصيام قسمان: واجب، وتطوع؛ والواجب ينقسم إلى ثلاثة أقسام:", "1- صوم رمضان. 2- صوم الكفارات. 3- صوم النذر.", "والكلام هنا ينحصر في صوم رمضان، وفي صوم التطوع، أما بقية الأقسام فتأتي في مواضعها، إن شاء الله تعالى."]], "ic": "scroll"}, {"story": ["المسألة الرابعة: فضل صيام شهر رمضان، والحكمة من مشروعية صومه", ["1- فضله: عن أبي هريرة رضي الله عنه، عن النبي ﷺ قال: «من قام ليلة القدر، إيمانا واحتسابا، غفر له ما تقدم من ذنبه، ومن صام رمضان؛ إيمانا واحتسابا غفر له ما تقدم من ذنبه».", "وعنه رضي الله عنه أن النبي ﷺ قال: «الصلوات الخمس والجمعة إلى الجمعة ورمضان إلى رمضان مكفرات لما بينهن إذا اجتنبت الكبائر».", "هذا بعض ما ورد في فضل صيام شهر رمضان، وفضائله كثيرة.", "2- الحكمة من مشروعية صومه: شرع الله سبحانه الصوم لحكم عديدة، وفوائد كثيرة، فمن ذلك:", "1- تزكية النفس، وتطهيرها، وتنقيتها من الأخلاط الرديئة والأخلاق الرذيلة؛ لأن الصوم يضيق مجاري الشيطان في بدن الإنسان.", "2- في الصوم تزهيد في الدنيا وشهواتها، وترغيب في الآخرة ونعيمها.", "3- الصوم يبعث على العطف على المساكين، والشعور بآلامهم؛ لأن الصائم يذوق ألم الجوع والعطش.", "إلى غير ذلك من الحكم البليغة، والفوائد العديدة."]], "ic": "scroll"}, {"story": ["المسألة الخامسة: شروط وجوب صيام رمضان", ["يجب صيام رمضان على من توافرت فيه الشروط التالية:", "1- الإسلام: فلا يجب، ولا يصح الصيام من الكافر؛ لأن الصيام عبادة، والعبادة لا تصح من الكافر، فإذا أسلم لم يلزم بقضاء ما فاته.", "2- البلوغ: فلا يجب الصيام على من لم يبلغ حد التكليف؛ لقوله ﷺ: «رفع القلم عن ثلاثة»، فذكر منهم: الصبي حتى يحتلم؛ ولكنه يصح الصيام من غير البالغ لو صام؛ إذا كان مميزا، وينبغي لوليّ أمره أن يأمره بالصيام؛ ليعتاده ويألفه.", "3- العقل: فلا يجب الصيام على المجنون والمعتوه؛ لقوله ﷺ: «رفع القلم عن ثلاثة...» فذكر منهم المجنون حتى يفيق.", "4- الصحة: فمن كان مريضا لا يطيق الصيام لم يجب عليه، وإن صام صح صيامه؛ لقوله تعالى: ﴿ومن كان مريضا أو على سفر فعدة من أيام أخر﴾ [البقرة: 185]. فإن زال المرض وجب عليه قضاء ما أفطر من أيام.", "5- الإقامة: فلا يجب الصوم على المسافر؛ لقوله تعالى: ﴿ومن كان مريضا أو على سفر فعدة من أيام أخر﴾ الآية؛ فلو صام المسافر صح صيامه، ويجب عليه قضاء ما أفطر في السفر.", "6- الخلو من الحيض والنفاس: فالحائض والنفساء لا يجب عليهما الصيام، بل يحرم عليهما؛ لقوله ﷺ: «أليس إذا حاضت لم تصل ولم تصم؟ فذلك من نقصان دينها». ويجب القضاء عليهما؛ لقول عائشة رضي الله عنها: «كان يصيبنا ذلك، فنؤمر بقضاء الصوم، ولا نؤمر بقضاء الصلاة»."]], "ic": "scroll"}, {"story": ["المسألة السادسة: ثبوت دخول شهر رمضان وانقضائه", ["يثبت دخول شهر رمضان برؤية الهلال، بنفسه أو بشهادة غيره على رؤيته، أو إخباره بذلك؛ فإذا شهد مسلم عدل برؤية هلال رمضان ثبت بهذه الشهادة دخول شهر رمضان؛ لقوله تعالى: ﴿فمن شهد منكم الشهر فليصمه﴾ [البقرة: 185]، ولقوله ﷺ: «إذا رأيتموه فصوموا»، ولحديث ابن عمر رضي الله عنهما: «أخبرت النبي ﷺ برؤية رمضان فصامه، وأمر الناس بصيامه».", "فإن لم ير الهلال، أو لم يشهد مسلم عدل برؤيته، وجب إكمال عدة شعبان ثلاثين يوما. ولا يثبت دخول الشهر بغير هذين الأمرين -رؤية الهلال، أو إتمام شعبان ثلاثين يوما؛ لقوله ﷺ: «صوموا لرؤيته وأفطروا لرؤيته، فإن غبي عليكم فأكملوا عدة شعبان ثلاثين».", "ويثبت انقضاء رمضان برؤية هلال شهر شوال، بشهادة مسلمين عدلين، فإن لم يشهد مسلمان عدلان برؤية الهلال، وجب إكمال عدة رمضان ثلاثين يوما."]], "ic": "scroll"}, {"note": "حاشية (ص164): وفي بعض الروايات: (غمي) وبعضها (غم) والمعنى: غطي وخفي ولم يظهر."}, {"story": ["المسألة السابعة: وقت النية في الصوم وحكمها", ["يجب على الصائم أن ينوي الصيام، وهي ركن من أركانه كما مضى؛ لقوله ﷺ: «إنما الأعمال بالنيات، وإنما لكل امرئ ما نوى». وينويها من الليل في الصيام الواجب؛ كصوم رمضان والكفارة والقضاء والنذر، ولو قبل الفجر بدقيقة واحدة؛ لقوله ﷺ: «من لم يبيت الصيام قبل الفجر، فلا صيام له».", "فمن نوى صوما في النهار، ولم يطعم شيئا، لم يجزئه إلا في صيام التطوع، فيجوز بنيته من النهار، إذا لم يطعم شيئا من أكل أو شرب؛ لحديث عائشة رضي الله عنها قالت: دخل علي النبي ﷺ ذات يوم فقال: «هل عندكم من شيء؟» فقلنا: لا قال: «فإني إذن صائم». أما صيام الواجب فلا ينعقد بنية من النهار، ولا بد فيه من نية الليل.", "وتكفي نية واحدة في بداية رمضان، لجميع الشهر، ويستحب تجديدها في كل يوم."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "الصيام في اللغة:", "o": ["الإمساك عن الشيء", "الأكل", "الشرب", "النوم"], "h": "راجع: ص161 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "للصيام ركنان هما:", "o": ["الإمساك عن المفطرات والنية", "الإمساك والسحور", "النية والإفطار", "الأكل والشرب"], "h": "راجع: ص161 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "المراد بالخيط الأبيض والخيط الأسود:", "o": ["بياض النهار وسواد الليل", "السحاب", "النجوم", "الغيم"], "h": "راجع: ص161 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "أقسام الصيام الواجب ثلاثة، من بينها:", "o": ["صوم الكفارات", "صوم عاشوراء", "صوم عرفة", "صوم الاثنين"], "h": "راجع: ص162 (المسألة الثالثة)"}, {"t": "mcq", "d": 2, "q": "من الحكمة في مشروعية الصوم:", "o": ["أن الصوم يضيق مجاري الشيطان في بدن الإنسان", "جمع المال", "النوم", "الراحة"], "h": "راجع: ص163 (المسألة الرابعة)"}, {"t": "mcq", "d": 2, "q": "من شروط وجوب صيام رمضان:", "o": ["الإسلام والبلوغ والعقل", "الغنى", "الذكورة", "الحرية"], "h": "راجع: ص163 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "الحائض والنفساء:", "o": ["يحرم عليهما الصيام ويجب القضاء", "يجب عليهما الصيام", "لا قضاء عليهما", "يقضيان الصلاة"], "h": "راجع: ص164 (المسألة الخامسة)"}, {"t": "mcq", "d": 2, "q": "يثبت دخول شهر رمضان:", "o": ["برؤية الهلال أو إكمال شعبان ثلاثين يوما", "بالحساب فقط", "بالظن", "بقول أي أحد"], "h": "راجع: ص164 (المسألة السادسة)"}, {"t": "mcq", "d": 2, "q": "وقت النية في صيام رمضان:", "o": ["من الليل", "بعد الظهر", "في النهار", "بعد الغروب"], "h": "راجع: ص165 (المسألة السابعة)"}, {"t": "tf", "d": 2, "q": "إذا أسلم الكافر لزمه قضاء ما فاته من رمضان.", "a": false, "h": "راجع: ص163 (المسألة الخامسة)"}, {"t": "tf", "d": 2, "q": "يجوز في صيام التطوع النية من النهار إذا لم يطعم شيئا.", "a": true, "h": "راجع: ص165 (المسألة السابعة)"}, {"t": "tf", "d": 2, "q": "تكفي نية واحدة في بداية رمضان لجميع الشهر.", "a": true, "h": "راجع: ص165 (المسألة السابعة)"}, {"t": "tf", "d": 2, "q": "يجب قضاء الصلاة على الحائض.", "a": false, "h": "راجع: ص164 (المسألة الخامسة)"}]}], "sum": [["كتاب الصيام", "ص161-165"], ["تعريف الصيام، وبيان أركانه", "ص161-165"], ["حكم صيام رمضان ودليل ذلك", "ص161-165"], ["أقسام الصيام", "ص161-165"]]}, {"id": "l35", "title": "الباب الثاني: في الأعذار المبيحة للفطر ومفطرات الصائم", "group": "الكتاب الرابع: الصيام", "map": {"center": "الباب الثاني\nالصيام", "nodes": [{"t": "في الأعذار المبيحة للفطر ومفطرات ا", "s": []}, {"t": "الأعذار المبيحة للفطر في رمضان", "s": []}, {"t": "مفطرات الصائم", "s": []}]}, "paras": [{"t": "الباب الثاني: في الأعذار المبيحة للفطر ومفطرات الصائم", "b": [{"pic": ["crescent-moon", "book", "scroll"], "cap": "ص165-171"}, {"story": ["الباب الثاني: في الأعذار المبيحة للفطر ومفطرات الصائم", ["وفيه مسألتان:"]], "ic": "scroll"}, {"story": ["المسألة الأولى: الأعذار المبيحة للفطر في رمضان", ["يباح الفطر في رمضان لأحد الأعذار التالية:", "الأول: المرض والكبر، فيجوز للمريض الذي يرجى برؤه الفطر، فإذا برئ وجب عليه قضاء الأيام التي أفطرها؛ لقوله تعالى: ﴿أياما معدودات فمن كان منكم مريضا أو على سفر فعدة من أيام أخر﴾ [البقرة: 184]، وقوله تعالى: ﴿فمن شهد منكم الشهر فليصمه ومن كان مريضا أو على سفر فعدة من أيام أخر﴾ [البقرة: 185].", "والمرض الذي يرخص معه في الفطر هو المرض الذي يشق على المريض الصيام بسببه.", "أما المريض الذي لا يرجى برؤه، أو العاجز عن الصيام عجزا مستمرا كالكبير، فإنه يفطر، ولا يجب عليه القضاء، وإنما تلزمه فدية، بأن يطعم عن كل يوم مسكينا؛ لأن الله -عز وجل- جعل الإطعام معادلا للصيام حين كان التخيير بينهما في أول ما فرض الصيام، فتعين أن يكون بدلا عنه عند العذر.", "يقول الإمام البخاري -رحمه الله-: «وأما الشيخ الكبير إذا لم يطق الصيام، فقد أطعم أنس بعدما كبر عاما أو عامين عن كل يوم مسكينا». وقال ابن عباس رضي الله عنهما في الشيخ الكبير والمرأة الكبيرة، لا يستطيعان أن يصوما: فليطعما مكان كل يوم مسكينا».", "فيطعم العاجز عن الصيام عجزا لا يرجى زواله، بمرض كان أو كبر، عن كل يوم مسكينا نصف صاع من بر، أو أرز، أو تمر، أو نحوها من قوت البلد، ومقدار الصاع كيلوان وربع تقريبا (2 ,25) فيكون الإطعام عن كل يوم: كيلو جرام ومائة وخمسة وعشرين جراما (1125 جرام) تقريبا.", "هذا وإن صام المريض صح صيامه وأجزأه.", "الثاني: السفر، فيباح للمسافر الفطر في رمضان، ويجب عليه القضاء؛ لقوله تعالى: ﴿فمن كان منكم مريضا أو على سفر فعدة من أيام أخر﴾ [البقرة: 184]. وقوله تعالى: ﴿فمن شهد منكم الشهر فليصمه ومن كان مريضا أو على سفر فعدة من أيام أخر﴾ [البقرة: 185].", "ولقوله ﷺ لمن سأله عن الصيام في السفر: «إن شئت فصم، وإن شئت فأفطر». وخرج إلى مكة صائما في رمضان، فلما بلغ الكديد أفطر، فأفطر الناس.", "ويباح الفطر في السفر الطويل الذي يباح فيه قصر الصلاة، وهو ما يقدر بثمانية وأربعين ميلا، أي: حوالي ثمانين كيلو مترا.", "والسفر المبيح للفطر في رمضان هو السفر المباح، فإن كان سفر معصية أو سفرا يراد به التحايل على الفطر، لم يبح له الفطر بهذا السفر.", "وإن صام المسافر صح صومه وأجزأه؛ لحديث أنس رضي الله عنه: «كنا نسافر مع النبي ﷺ فلم يعب الصائم على المفطر، ولا المفطر على الصائم». ولكن بشرط ألا يشق عليه الصوم في السفر، فإن شق عليه، أو أضر به، فالفطر في حقه أفضل؛ أخذا بالرخصة؛ لأن النبي ﷺ رأى في السفر رجلا صائما قد ظلل عليه من شدة الحر، وتجمع الناس حوله، فقال: «ليس من البر الصيام في السفر».", "الثالث: الحيض والنفاس، فالمرأة التي أتاها الحيض أو النفاس تفطر في رمضان وجوبا، ويحرم عليها الصوم، ولو صامت لم يصح منها؛ لحديث أبي سعيد الخدري رضي الله عنه أن النبي ﷺ قال: «أليس إذا حاضت لم تصل ولم تصم؟ فذلك من نقصان دينها». ويجب عليهما القضاء؛ لقول عائشة رضي الله عنها: «كان يصيبنا ذلك، فنؤمر بقضاء الصوم، ولا نؤمر بقضاء الصلاة».", "الرابع: الحمل والرضاع، فالمرأة إذا كانت حاملا أو مرضعا، وخافت على نفسها أو ولدها بسبب الصوم جاز لها الفطر؛ لما رواه أنس رضي الله عنه قال: قال رسول الله ﷺ: «إن الله وضع عن المسافر شطر الصلاة والصوم، وعن الحبلى والمرضع الصوم»، وتقضي الحامل والمرضع مكان الأيام التي أفطرتاها، وذلك إن خافتا على نفسيهما، فإن خافت الحامل مع ذلك على جنينها، أو المرضع على رضيعها؛ أطعمت مع القضاء عن كل يوم مسكينا؛ لقول ابن عباس رضي الله عنهما: «والمرضع والحبلى إذا خافتا على أولادهما أفطرتا وأطعمتا».", "فتلخص من ذلك أن الأسباب المبيحة للفطر أربعة: السفر، والمرض، والحيض، والنفاس، والخوف من الهلاك، كما في الحامل والمرضع."]], "ic": "scroll"}, {"story": ["المسألة الثانية: مفطرات الصائم", ["وهي الأشياء التي تفسد على الصائم صومه وتفطره. ويفطر الصائم بفعل أحد الأمور التالية:", "الأول: الأكل أو الشرب عمدا؛ لقوله تعالى: ﴿وكلوا واشربوا حتى يتبين لكم الخيط الأبيض من الخيط الأسود من الفجر ثم أتموا الصيام إلى الليل﴾ [البقرة: 187].", "فقد بينت الآية أنه لا يباح للصائم الأكل والشرب بعد طلوع الفجر حتى الليل -غروب الشمس- أما من أكل أو شرب ناسيا فصيامه صحيح، ويجب عليه الإمساك إذا تذكر، أو ذكر أنه صائم؛ لقوله ﷺ: «من نسي وهو صائم، فأكل أو شرب، فليتم صومه، فإنما أطعمه الله وسقاه».", "ويفسد الصوم بالسعوط، وبكل ما يصل إلى الجوف، ولو من غير الفم مما هو في حكم الأكل والشرب كالإبر المغذية.", "الثاني: الجماع، يبطل الصيام بالجماع، فمن جامع وهو صائم بطل صيامه، وعليه التوبة والاستغفار، وقضاء اليوم الذي جامع فيه، وعليه مع القضاء الكفارة، وهي عتق رقبة، فإن لم يجد صام شهرين متتابعين، فإن لم يستطع أطعم ستين مسكينا؛ لحديث أبي هريرة رضي الله عنه، قال: بينما نحن جلوس عند النبي ﷺ إذ جاءه رجل فقال: يا رسول الله هلكت، فقال: «ما لك؟»، قال: وقعت على امرأتي وأنا صائم، فقال رسول الله ﷺ: «هل تجد رقبة تعتقها؟» قال: لا، قال: «فهل تستطيع أن تصوم شهرين متتابعين»، قال: لا، قال: «فهل تجد إطعام ستين مسكينا؟» قال: لا، قال: فمكث النبي ﷺ، فبينما نحن على ذلك أتي النبي ﷺ بعرق فيها تمر -والعرق المكتل- قال: «أين السائل؟». فقال: أنا، قال: «خذ هذا، فتصدق به». فقال الرجل: أعلى أفقر مني يا رسول الله؟ فوالله ما بين لابتيها -يريد الحرتين- أهل بيت أفقر من أهل بيتي، فضحك النبي ﷺ حتى بدت أنيابه، ثم قال: «أطعمه أهلك».", "وفي معنى الجماع: إنزال المني اختيارا؛ فإذا أنزل الصائم مختارا بتقبيل، أو لمس، أو استمناء، أو غير ذلك فسد صومه؛ لأن ذلك من الشهوة التي تناقض صوم، وعليه القضاء دون الكفارة؛ لأن الكفارة لا تلزم إلا بالجماع فقط، لورود النص خاصا به.", "أما إذا نام الصائم فاحتلم، أو أنزل من غير شهوة كمن به مرض، فلا يبطل صيامه؛ لأنه لا اختيار له في ذلك.", "الثالث: التقيؤ عمدا، وهو إخراج ما في المعدة من طعام أو شراب عن طريق الفم عمدا، أما إذا غلبه القيء وخرج منه بغير اختياره، فلا يؤثر في صيامه؛ لقوله ﷺ: «من ذرعه القيء، فليس عليه قضاء، ومن استقاء عمدا فليقض».", "الرابع: الحجامة، وهي إخراج الدم من الجلد دون العروق، فمتى احتجم الصائم فقد أفسد صومه؛ لقوله ﷺ: «أفطر الحاجم والمحجوم»، وكذا يفسد صوم الحاجم أيضا، إلا إذا حجمه بآلات منفصلة، ولم يحتج إلى مص الدم، فإنه -والله أعلم- لا يفطر.", "وفي معنى الحجامة: إخراج الدم بالفصد، وإخراجه من أجل التبرع به.", "أما خروج الدم بالجرح، أو قلع الضرس، أو الرعاف فلا يضر؛ لأنه ليس بحجامة، ولا في معناها.", "الخامس: خروج دم الحيض والنفاس، فمتى رأت المرأة دم الحيض أو النفاس أفطرت، ووجب عليها القضاء؛ لقوله ﷺ في المرأة: «أليس إذا حاضت لم تصل ولم تصم؟».", "السادس: نية الفطر، فمن نوى الفطر قبل وقت الإفطار وهو صائم، بطل صومه، وإن لم يتناول مفطرا، فإن النية أحد ركني الصيام، فإذا نقضها قاصدا الفطر، ومتعمدا، انتقض صيامه.", "السابع: الردة، لمنافاتها للعبادة؛ ولقوله تعالى: ﴿لئن أشركت ليحبطن عملك﴾ [الزمر: 65]."]], "ic": "scroll"}, {"note": "حاشية (ص170): أي: سبقه وغلبه في الخروج. الفصد: شق العرق."}, {"note": "حاشية (ص169): وهو دواء يصب في الأنف."}], "q": [{"t": "mcq", "d": 2, "q": "من لا يرجى برؤه أو العاجز عن الصيام عجزا مستمرا:", "o": ["يفطر ولا قضاء عليه وإنما تلزمه فدية", "يصوم", "يقضي فقط", "لا شيء عليه"], "h": "راجع: ص166 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "الفدية عن كل يوم:", "o": ["إطعام مسكين", "عتق رقبة", "صيام شهرين", "شاة"], "h": "راجع: ص166 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "السفر المبيح للفطر هو السفر:", "o": ["الطويل المباح", "القصير", "سفر المعصية", "أي سفر"], "h": "راجع: ص167 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "الحامل والمرضع إذا خافتا على أنفسهما:", "o": ["تفطران وتقضيان", "تصومان", "تطعمان فقط", "لا شيء عليهما"], "h": "راجع: ص168 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "من أكل أو شرب ناسيا:", "o": ["صيامه صحيح", "صيامه باطل", "يقضي", "يكفر"], "h": "راجع: ص168 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "كفارة الجماع في نهار رمضان الأولى:", "o": ["عتق رقبة", "صيام شهرين", "إطعام ستين مسكينا", "شاة"], "h": "راجع: ص169 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "من استقاء عمدا:", "o": ["فليقض", "لا قضاء عليه", "يكفر", "صومه صحيح"], "h": "راجع: ص170 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "من مفطرات الصائم:", "o": ["الحجامة", "السواك", "الغسل", "الشم"], "h": "راجع: ص170 (المسألة الثانية)"}, {"t": "mcq", "d": 2, "q": "من نوى الفطر قبل وقت الإفطار وهو صائم:", "o": ["بطل صومه", "صح صومه", "يقضي ساعة", "لا شيء"], "h": "راجع: ص170 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "الكفارة تلزم بإنزال المني اختيارا دون جماع.", "a": false, "h": "راجع: ص169 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "من ذرعه القيء فليس عليه قضاء.", "a": true, "h": "راجع: ص170 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "الردة من مفطرات الصائم.", "a": true, "h": "راجع: ص171 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "إذا صام المريض صح صيامه وأجزأه.", "a": true, "h": "راجع: ص166 (المسألة الأولى)"}]}], "sum": [["في الأعذار المبيحة للفطر ومفطرات ا", "ص165-171"], ["الأعذار المبيحة للفطر في رمضان", "ص165-171"], ["مفطرات الصائم", "ص165-171"]]}, {"id": "l36", "title": "الباب الثالث: مستحبات الصيام ومكروهاته", "group": "الكتاب الرابع: الصيام", "map": {"center": "الباب الثالث\nالصيام", "nodes": [{"t": "مستحبات الصيام", "s": []}, {"t": "مكروهات الصيام", "s": []}]}, "paras": [{"t": "الباب الثالث: مستحبات الصيام ومكروهاته", "b": [{"pic": ["crescent-moon", "book", "scroll"], "cap": "ص171-173"}, {"story": ["المسألة الأولى: مستحبات الصيام", ["وفيه مسألتان:", "يستحب للصائم أن يراعي في صيامه الأمور التالية:", "1- السحور: لقوله ﷺ: «تسحروا فإن في السحور بركة». ويتحقق السحور بكثير الطعام وقليله، ولو بجرعة ماء. ووقت السحور من منتصف الليل إلى طلوع الفجر.", "2- تأخير السحور: لحديث زيد بن ثابت رضي الله عنه قال: تسحرنا مع رسول الله ﷺ، ثم قمنا إلى الصلاة. قلت: كم قدر ما بينهما؟ قال: خمسين آية.", "3- تعجيل الفطر: فيستحب للصائم تعجيل الفطر متى تحقق غروب الشمس، فعن سهل بن سعد رضي الله عنه أن النبي ﷺ قال: «لا يزال الناس بخير ما عجلوا الفطر».", "4- الإفطار على رطبات: فإن لم يجد فتمرات، وأن تكون وترا، فإن لم يجد فعلى جرعات من ماء؛ لحديث أنس رضي الله عنه قال: «كان رسول الله ﷺ يفطر على رطبات قبل أن يصلي، فإن لم تكن رطبات، فعلى تمرات، فإن لم تكن حسا حسوات من ماء» فإن لم يجد شيئا نوى الفطر بقلبه، ويكفيه ذلك.", "5- الدعاء عند الفطر، وأثناء الصيام؛ لقوله ﷺ: «ثلاثة لا ترد دعوتهم: الصائم حتى يفطر، والإمام العادل والمظلوم».", "6- الإكثار من الصدقة، وتلاوة القرآن، وتفطير الصائمين، وسائر أعمال البر: فعن ابن عباس رضي الله عنهما قال: «كان رسول الله ﷺ أجود الناس بالخير، وكان أجود ما يكون في رمضان حين يلقاه جبريل، وكان جبريل يلقاه كل ليلة في رمضان، فيدارسه القرآن، فرسول الله ﷺ حين يلقاه جبريل أجود بالخير من الريح المرسلة».", "7- الاجتهاد في صلاة الليل: وبالأخص في العشر الأواخر من رمضان؛ فعن عائشة رضي الله عنها: «كان النبي ﷺ إذا دخل العشر شد مئزره، وأحيا ليله، وأيقظ أهله»، ولعموم قوله ﷺ: «من قام رمضان إيمانا واحتسابا، غفر له ما تقدم من ذنبه».", "8- الاعتمار: لقوله ﷺ: «عمرة في رمضان تعدل حجة».", "9- قول: «إني صائم» لمن شتمه: وذلك لقوله ﷺ: «وإذا كان يوم صوم أحدكم فلا يرفث ولا يصخب، فإن سابه أحد أو قاتله، فليقل إني امرؤ صائم»."]], "ic": "scroll"}, {"story": ["المسألة الثانية: مكروهات الصيام", ["يكره في حق الصائم بعض الأمور التي قد تؤدي إلى جرح صومه، ونقص أجره، وهي:", "1- المبالغة في المضمضة والاستنشاق: وذلك خشية أن يذهب الماء إلى جوفه؛ لقوله ﷺ: «وبالغ في الاستنشاق إلا أن تكون صائما».", "2- القبلة: لمن تحرك شهوته، وكان ممن لا يأمن على نفسه: فيكره للصائم أن يقبل زوجته، أو أمته؛ لأنها قد تؤدي إلى إثارة الشهوة التي تجر إلى فساد الصوم بالإمناء أو الجماع، فإن أمن على نفسه من فساد صومه فلا بأس؛ لأن النبي ﷺ كان يقبل وهو صائم، قالت عائشة رضي الله عنها: «وكان أملككم لإربه» -أي: حاجته-. وكذلك عليه تجنب كل ما من شأنه إثارة شهوته وتحريكها؛ كإدامة النظر إلى الزوجة، والأمة، أو التفكر في شأن الجماع؛ لأنه قد يؤدي إلى الإمناء، أو الجماع.", "3- بلع النخامة: لأن ذلك يصل إلى الجوف، ويتقوى به، إلى جانب الاستقذار والضرر الذي يحصل من هذا الفعل.", "4- ذوق الطعام لغير الحاجة: فإن كان محتاجا إلى ذلك -كأن يكون طباخا يحتاج لذوق ملحه وما أشبهه- فلا بأس، مع الحذر من وصول شيء من ذلك إلى حلقه."]], "ic": "scroll"}], "q": [{"t": "mcq", "d": 1, "q": "قال ﷺ عن السحور:", "o": ["تسحروا فإن في السحور بركة", "لا تتسحروا", "السحور بدعة", "السحور واجب"], "h": "راجع: ص171 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "وقت السحور:", "o": ["من منتصف الليل إلى طلوع الفجر", "من العصر", "بعد الفجر", "من الظهر"], "h": "راجع: ص171 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "الإفطار يكون على:", "o": ["رطبات فإن لم يجد فتمرات فإن لم يجد فجرعات ماء", "لحم", "خبز", "حلوى"], "h": "راجع: ص171 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "قدر ما بين سحور زيد بن ثابت والصلاة:", "o": ["خمسون آية", "عشر آيات", "مائة آية", "ساعة"], "h": "راجع: ص171 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "عمرة في رمضان تعدل:", "o": ["حجة", "صدقة", "شهرا", "صلاة"], "h": "راجع: ص172 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "من سابه أحد وهو صائم فليقل:", "o": ["إني امرؤ صائم", "اذهب", "لا أكلمك", "سأرد عليك"], "h": "راجع: ص172 (المسألة الأولى)"}, {"t": "mcq", "d": 2, "q": "يكره للصائم:", "o": ["المبالغة في المضمضة والاستنشاق", "السواك", "الشرب ناسيا", "النوم"], "h": "راجع: ص172 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "يستحب تعجيل الفطر متى تحقق غروب الشمس.", "a": true, "h": "راجع: ص171 (المسألة الأولى)"}, {"t": "tf", "d": 2, "q": "يكره بلع النخامة للصائم.", "a": true, "h": "راجع: ص173 (المسألة الثانية)"}, {"t": "tf", "d": 2, "q": "يستحب تأخير الفطر.", "a": false, "h": "راجع: ص171 (المسألة الأولى)"}]}], "sum": [["مستحبات الصيام", "ص171-173"], ["مكروهات الصيام", "ص171-173"]]}, {"id": "l37", "title": "الباب الرابع: في القضاء، والصيام المستحب، وما يكره ويحرم من ", "group": "الكتاب الرابع: الصيام", "map": {"center": "الباب الرابع\nالصيام", "nodes": [{"t": "قضاء الصيام", "s": []}, {"t": "الصيام المستحب", "s": []}, {"t": "ما يكره ويحرم من الصيام", "s": []}]}, "paras": [{"t": "الباب الرابع: في القضاء، والصيام المستحب، وما يكره ويحرم من الصيام", "b": [{"pic": ["crescent-moon", "book", "scroll"], "cap": "ص173-178"}, {"story": ["المسألة الأولى: قضاء الصيام", ["وفيه مسائل:", "إذا أفطر المسلم يوما من رمضان بغير عذر، وجب عليه أن يتوب إلى الله، ويستغفره؛ لأن ذلك جرم عظيم، ومنكر كبير، ويجب عليه مع التوبة والاستغفار القضاء بقدر ما أفطر بعد رمضان، ووجوب القضاء هنا على الفور على الصحيح من أقوال أهل العلم؛ لأنه غير مرخص له في الفطر، والأصل أن يؤديه في وقته.", "أما إذا أفطر بعذر كحيض أو نفاس أو مرض أو سفر وغير ذلك من الأعذار المبيحة للفطر فإنه يجب عليه القضاء؛ غير أنه لا يجب على الفور، بل على التراخي إلى رمضان الآخر، لكن يندب له، ويستحب التعجيل بالقضاء؛ لأن فيه إسراعا في إبراء الذمة، ولأنه أحوط للعبد؛ فقد يطرأ له ما يمنعه من الصوم كمرض ونحوه. فإن أخره حتى رمضان الثاني، وكان له عذر في تأخيره، كأن استمر عذره، فعليه القضاء بعد رمضان الثاني.", "أما إن أخره إلى رمضان الثاني بغير عذر، فعليه مع القضاء إطعام مسكين عن كل يوم.", "ولا يشترط في القضاء التتابع، بل يصح متتابعا ومتفرقا؛ لقوله تعالى: ﴿فمن كان منكم مريضا أو على سفر فعدة من أيام أخر﴾ [البقرة: 184] فلم يشترط سبحانه في هذه الأيام التتابع، ولو كان شرطا لبينه سبحانه وتعالى."]], "ic": "scroll"}, {"story": ["المسألة الثانية: الصيام المستحب", ["من حكمة الله عز وجل ورحمته بعباده: أن جعل لهم من التطوع ما يماثل الفرائض، وذلك زيادة في الأجر والثواب للعاملين، وجبرا للنقص والخلل الذي قد يطرأ على الفريضة، فقد سبق معنا: أن الفرائض تكمل من النوافل يوم القيامة. والأيام التي يستحب صيامها هي:", "1- صيام ستة أيام من شوال: لحديث أبي أيوب الأنصاري رضي الله عنه قال: سمعت رسول الله ﷺ يقول: «من صام رمضان ثم أتبعه ستا من شوال، كان كصيام الدهر».", "2- صيام يوم عرفة لغير الحاج: لحديث أبي قتادة رضي الله عنه قال: قال رسول الله ﷺ: «صيام يوم عرفة، أحتسب على الله أن يكفر السنة التي قبله، والسنة التي بعده». أما الحاج فلا يسن له صيام يوم عرفة؛ لأن النبي ﷺ أفطر في ذلك اليوم والناس ينظرون إليه، ولأنه أقوى للحاج على العبادة والدعاء في ذلك اليوم.", "3- صيام يوم عاشوراء: فقد سئل النبي ﷺ عن صوم عاشوراء؟ فقال: «أحتسب على الله أن يكفر السنة التي قبله». ويستحب صيام يوم قبله أو يوم بعده؛ لقوله ﷺ: «لئن بقيت إلى قابل لأصومن التاسع»، ولقوله ﷺ: «صوموا يوما قبله أو يوما بعده، خالفوا اليهود».", "4- صوم الاثنين والخميس من كل أسبوع: لحديث عائشة رضي الله عنها: «كان النبي ﷺ يتحرى صيام الاثنين والخميس»، ولقوله ﷺ: «تعرض الأعمال يوم الاثنين والخميس، فأحب أن يعرض عملي وأنا صائم».", "5- صيام ثلاثة أيام من كل شهر: لقوله ﷺ لعبد الله بن عمرو: «صم من الشهر ثلاثة أيام؛ فإن الحسنة بعشر أمثالها، وذلك مثل صيام الدهر». وعن أبي هريرة رضي الله عنه قال: أوصاني خليلي بثلاث: «صيام ثلاثة أيام من كل شهر، وركعتي الضحى، وأن أوتر قبل أن أنام».", "ويستحب أن تكون الأيام البيض، وهي الثالث عشر، والرابع عشر، والخامس عشر؛ لحديث أبي ذر رضي الله عنه قال: قال رسول الله ﷺ: «من كان منكم صائما من الشهر فليصم الثلاث البيض».", "6- صوم يوم وإفطار يوم: لقوله ﷺ: «أفضل الصيام صيام داود عليه السلام، كان يصوم يوما ويفطر يوما». وهذا من أفضل أنواع التطوع.", "7- صيام شهر الله المحرم: لحديث أبي هريرة رضي الله عنه قال: قال رسول الله ﷺ: «أفضل الصيام، بعد رمضان، شهر الله المحرم، وأفضل الصلاة بعد الفريضة، صلاة الليل».", "8- صيام تسع ذي الحجة، وتبدأ من أول يوم من شهر ذي الحجة، وتنتهي باليوم التاسع، وهو يوم عرفة؛ وذلك لعموم الأحاديث الواردة في فضل العمل فيها؛ فقد قال ﷺ: «ما من أيام العمل الصالح فيهن أحب إلى الله من هذه العشر». والصوم من العمل الصالح."]], "ic": "scroll"}, {"story": ["المسألة الثالثة: ما يكره ويحرم من الصيام", ["1- يكره إفراد شهر رجب بالصيام؛ لأن ذلك من شعائر الجاهلية، وقد كانوا يعظمون هذا الشهر، فلو صامه مع غيره لم يكره؛ لأنه لا يكون حينئذ مخصصا له بالصيام. روى أحمد بن خرشة بن الحر قال: رأيت عمر بن الخطاب يضرب أكف المترجبين، حتى يضعوها في الطعام. ويقول: «كلوا، فإنما هو شهر كانت تعظمه الجاهلية».", "2- يكره إفراد يوم الجمعة بصيام؛ لقوله ﷺ: «لا تصوموا يوم الجمعة إلا أن تصوموا يوما قبله أو يوما بعده». فإن صامه مع غيره فلا بأس بذلك، للحديث الماضي.", "3- يكره إفراد يوم السبت بصيام؛ لقوله ﷺ: «لا تصوموا يوم السبت إلا فيما افترض عليكم». والمقصود: النهي عن إفراده، وتخصيصه بالصيام، أما إذا ضم إلى غيره فلا بأس، لقوله ﷺ لأم المؤمنين جويرية وقد دخل عليها يوم الجمعة وهي صائمة، فقال: «أصمت أمس؟»، قالت: لا، قال: «تريدين أن تصومي غدا؟» قالت: لا، قال: «فأفطري». فدل قوله ﷺ: «تريدين أن تصومي غدا؟» على جواز صيام يوم السبت مع غيره. قال الإمام الترمذي -رحمه الله- عقب إخراجه حديث النهي الماضي: «ومعنى الكراهية في هذا: أن يختص الرجل يوم السبت بصيام؛ لأن اليهود يعظمون يوم السبت».", "4- تحريم صيام يوم الشك، وهو يوم الثلاثين
