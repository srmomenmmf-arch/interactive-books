      '<div class="cert-name" id="cert-out">' + esc(S.name || 'اسم الطالب') + '</div><br><button class="btn btn-link" data-act="settings">' + (S.name ? 'تعديل الاسم' : 'اكتب اسمك') + '</button>' +
      '<p>' + body + '</p>' +
      (r ? '<div class="cert-badge">' + emblem(r - 1) + '<strong>' + esc(BADGES[r - 1].n) + '</strong></div>' : '') +
      '<div class="cert-meta"><span>النجوم: ' + ar(totalStars()) + '</span><span>' + (B ? 'نجوم امتحان الباب: ' + ar(S.bx[bi] || 0) : 'نجوم الامتحانات: ' + ar(bxSum())) + '</span><span>' + esc(date) + '</span></div></div>' +
      '<p class="note-s">خذ لقطة شاشة للشهادة لتحتفظ بها.<br>المادة العلمية من كتاب «منهاج القاصدين»</p></div>' +
      '<div class="foot">' + (B && allBxDone() ? '<button class="btn btn-main" data-act="cert" data-b="-1">شهادة إتمام الكتاب ' + IC.arrow + '</button>' : '') +
      (B ? '<button class="btn ' + (allBxDone() ? 'btn-ghost' : 'btn-main') + '" data-act="bab" data-b="' + bi + '" data-dir="back">العودة إلى الباب</button>' : '<button class="btn btn-main" data-act="paths">العودة إلى الأبواب</button>') + '</div>', dir);
    VIEW = 'cert';
  }
  let VIEW = '';

  /* ================= LESSON SESSION ================= */
  let SES = null;
  function shell() {
    return '<header class="lbar"><button class="ib" data-act="quit" aria-label="خروج">' + IC.x + '</button><div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div class="prog-f"></div></div><span class="lxp" title="' + (SES && SES.kind === 'exam' ? 'نجوم الامتحان' : 'نجومي') + '">' + IC.star + '<span>' + ar(pillVal()) + '</span></span><div class="hearts" aria-live="polite"></div></header><div class="stage"></div>';
  }
  const pillVal = () => SES && SES.kind === 'exam' ? SES.stars : totalStars();
  /* ترتيب أسئلة الفقرة: تتدرج تصاعدياً، مع خلط ما تساوى منها */
  const orderQ = p => shuffle(p.q.map((_, i) => i)).sort((a, b) => p.q[a].d - p.q[b].d);
  function openLevel(id, dir, fromEl, saved) {
    const lv = LEVELS.find(l => l.id === id);
    const label = '<span class="wn">' + ar(levelNum(lv)) + '</span><span class="wt">' + esc(lv.title) + '</span>';
    if (fromEl) { wipe(fromEl, id, label, () => openLevel(id, dir)); return; }
    setTheme(id);
    const steps = [{ k: 'map' }];
    lv.paras.forEach((p, pi) => { steps.push({ k: 'ex', p: pi }); p.q.forEach((_, n) => steps.push({ k: 'q', p: pi, n })); });
    steps.push({ k: 'sum' }, { k: 'done' });
    SES = { kind: 'level', lv, steps, idx: 0, hearts: HEARTS, max: HEARTS, mistakes: 0, stars: 0, doubles: 0, combo: 0, order: {}, revisit: {}, reveal: 0 };
    lv.paras.forEach((p, pi) => { SES.order[pi] = orderQ(p); });
    const back = !!saved && applyPos(saved);
    SES.screen = mount(shell(), dir); VIEW = 'level';
    if (back) enterSaved(); else renderStep('fwd');
  }
  function openExam(bi, dir, fromEl, saved) {
    const B = BABS[bi]; if (!B) return;
    if (fromEl) { wipe(fromEl, 'exam', '<span class="wn">' + IC.crown.replace('<svg', '<svg style="width:90px;height:90px"') + '</span><span class="wt">امتحان الباب ' + ORD[bi] + '</span>', () => openExam(bi, dir)); return; }
    setTheme('exam');
    /* عند الرجوع إلى امتحان محفوظ تُستعاد الأسئلة نفسها بترتيبها */
    let qs = saved && Array.isArray(saved.qs) && saved.qs.length && saved.qs.every(id => QBYID[id]) ? saved.qs.map(id => QBYID[id]) : null;
    if (!qs) {
      saved = null;
      /* من كل فصل في الباب: سؤال من الأسئلة الأصعب، والبقية موزّعة على محطاته بالتناوب */
      const picks = [], per = Math.max(3, Math.ceil(16 / B.g.length));
      B.g.forEach(gi => {
        const lo = [], hi2 = [], got = [], byLv = {};
        PATHS[gi].lv.forEach(l => { const li = MAIN.indexOf(l); l.paras.forEach(p => p.q.forEach(q => (q.d <= 2 ? lo : hi2).push({ q, li }))); });
        if (hi2.length) got.push(pick(hi2));
        shuffle(lo).forEach(x => (byLv[x.li] = byLv[x.li] || []).push(x));
        const ks = shuffle(Object.keys(byLv)); let k = 0;
        while (got.length < per && ks.some(x => byLv[x].length)) { const a = byLv[ks[k++ % ks.length]]; if (a.length) got.push(a.pop()); }
        got.forEach(x => picks.push(x));
      });
      qs = shuffle(picks);
    }
    const steps = [{ k: 'examintro' }].concat(qs.map((x, n) => ({ k: 'q', q: x.q, n, from: x.li })));
    SES = { kind: 'exam', bab: bi, steps, idx: 0, hearts: EXAM_HEARTS, max: EXAM_HEARTS, mistakes: 0, stars: 0, doubles: 0, combo: 0, total: qs.length };
    const back = !!saved && applyPos(saved);
    SES.screen = mount(shell(), dir); VIEW = 'exam';
    if (back) enterSaved(); else renderStep('fwd');
  }
  const curStep = () => SES.steps[SES.idx];
  function getQ(st) { return SES.kind === 'exam' ? st.q : SES.lv.paras[st.p].q[SES.order[st.p][st.n]]; }

  /* ---------- حفظ مكان الطالب بدقة ----------
     S.pos[id]  آخر موضع داخل كل محطة (وداخل الامتحان بالمفتاح exam): الخطوة والقلوب وترتيب الأسئلة
     S.at       الجلسة المفتوحة الآن؛ عند فتح الصفحة من جديد تُفتح عليها مباشرة
     يُحفظ الموضع مع كل خطوة وكل إجابة، فلا يضيع شيء إذا أُغلق المتصفح فجأة. */
  const sesKey = () => SES.kind === 'exam' ? 'x' + SES.bab : SES.lv.id;
  function snap() {
    if (!SES || !SES.steps) return;
    const st = curStep(), key = sesKey();
    if (st.k === 'done') { delete S.pos[key]; S.at = null; save(); return; }
    S.at = key;
    if (st.k === 'map') { save(); return; }
    const o = { idx: SES.idx, hearts: SES.hearts, mistakes: SES.mistakes, stars: SES.stars, doubles: SES.doubles, combo: SES.combo };
    if (SES.kind === 'exam') o.qs = SES.steps.filter(x => x.k === 'q').map(x => x.q.id);
    else { o.order = SES.order; o.revisit = SES.revisit; S.resume = { id: key, p: st.p || 0 }; }
    if (st.k === 'ex') o.reveal = SES.reveal;
    const c = SES.cur;
    if (st.k === 'q' && c && c.q === getQ(st)) {
      o.tries = c.tries; o.solved = !!c.solved;
      /* وقت المضاعفة يُحفظ كساعة حائط، فيستمر العدّ والصفحة مغلقة كما يستمر وهي في الخلفية */
      if (c.deadline) o.dl = Math.round(Date.now() + c.deadline - performance.now());
    }
    S.pos[key] = o; save();
  }
  /* يضع الجلسة الحالية على موضع محفوظ بعد التحقق من سلامته */
  function applyPos(p) {
    const num = v => typeof v === 'number' && isFinite(v);
    if (!p || !num(p.idx) || p.idx < 0 || p.idx >= SES.steps.length) return false;
    const k = SES.steps[p.idx | 0].k; if (k === 'map' || k === 'done') return false;
    SES.idx = p.idx | 0;
    SES.hearts = num(p.hearts) ? Math.max(0, Math.min(SES.max, p.hearts | 0)) : SES.max;
    ['mistakes', 'stars', 'doubles', 'combo'].forEach(f => { SES[f] = num(p[f]) ? Math.max(0, p[f] | 0) : 0; });
    if (SES.kind === 'level') SES.lv.paras.forEach((pa, pi) => {
      const o = p.order && p.order[pi];
      if (Array.isArray(o) && o.length === pa.q.length && o.slice().sort((a, b) => a - b).every((v, i) => v === i)) SES.order[pi] = o.slice();
      SES.revisit[pi] = !!(p.revisit && p.revisit[pi]);
    });
    SES.re = { tries: num(p.tries) ? Math.max(0, p.tries | 0) : 0, solved: !!p.solved, dl: num(p.dl) ? p.dl : 0, reveal: num(p.reveal) ? p.reveal | 0 : 0 };
    return true;
  }
  /* سؤال أُجيب قبل الإغلاق: نجومه محفوظة، فننتقل إلى ما بعده ولا نعيده */
  function enterSaved() {
    if (curStep().k === 'q' && SES.re && SES.re.solved) { SES.re = null; advance(); return; }
    renderStep('fwd');
  }
  /* عند فتح الصفحة: الرجوع إلى الجلسة التي كانت مفتوحة */
  function restore() {
    const key = S.at; if (!key) return false;
    const p = S.pos[key] || null;
    try {
      if (/^x\d+$/.test(key) && BABS[+key.slice(1)]) {
        if (p && Array.isArray(p.qs) && p.qs.length && p.qs.every(id => QBYID[id])) { openExam(+key.slice(1), 'fwd', null, p); return true; }
      } else if (LEVELS.some(l => l.id === key)) { openLevel(key, 'fwd', null, p); return true; }
    } catch (e) { /* موضع تالف: نتجاهله */ }
    stopTimer(); closeSheet(); SES = null; S.at = null; delete S.pos[key]; save();
    return false;
  }

  function renderStep(dir) {
    const st = curStep(); let html = '';
    stopTimer();
    if (st.k === 'map') html = stepMap();
    else if (st.k === 'ex') html = stepEx();
    else if (st.k === 'q') html = stepQ();
    else if (st.k === 'sum') html = stepSum();
    else if (st.k === 'done') html = stepDone();
    else if (st.k === 'examintro') html = stepExamIntro();
    SES.slide = swapIn(SES.screen.querySelector('.stage'), 'slide', html, dir);
    const f = SES.screen.querySelector('.prog-f'); const pct = Math.round(SES.idx / (SES.steps.length - (SES.kind === 'exam' ? 0 : 1)) * 100);
    f.style.width = pct + '%'; SES.screen.querySelector('.prog').setAttribute('aria-valuenow', pct);
    SES.screen.querySelector('.hearts').classList.toggle('hide', !(st.k === 'ex' || st.k === 'q'));
    renderHearts(-1);
    if (st.k === 'q') startTimer();
    if (st.k === 'done') { celebrate(SES.slide.querySelector('.done-hero')); const b = SES.slide.querySelector('[data-count]'); setTimeout(() => countUp(b, 0, +b.dataset.count), 1300); }
    /* استكمال سؤال محفوظ: المحاولات السابقة والوقت المتبقي والقلوب كما كانت */
    const re = SES.re; SES.re = null;
    if (re && st.k === 'q') {
      const c = SES.cur;
      if (c.tries > 0) timerState('miss');
      else if (re.dl) { const left = Math.min(c.q.sec * 1000, re.dl - Date.now()); c.deadline = performance.now() + left; if (left <= 0) timerState('late'); }
      if (SES.hearts <= 0) { c.busy = true; heartsOut(); }
    }
    snap();
  }
  function renderHearts(breakIdx) {
    const el = SES.screen.querySelector('.hearts'); if (!el) return;
    el.setAttribute('aria-label', 'القلوب: ' + ar(SES.hearts) + ' من ' + ar(SES.max));
    el.innerHTML = Array.from({ length: SES.max }, (_, i) => '<span class="heart' + (i < SES.hearts ? '' : ' lost') + (i === breakIdx ? ' breaking' : '') + '">' + IC.heart + '</span>').join('');
  }

  /* ----- map step ----- */
  /* تنقّل حر بين فقرات المحطة: القراءة مفتوحة دائماً، وأسئلة كل فقرة تُفتح بعد إتمام قراءتها */
  function paraNav(cur) {
    if (!SES || SES.kind !== 'level') return '';
    const ps = SES.lv.paras; if (ps.length < 2) return '';
    return '<nav class="pnav" aria-label="فقرات المحطة">' + ps.map((pa, i) => {
      const ok = pa.q.length && pa.q.every(q => S.q[q.id]);
      return '<button type="button" class="pn' + (i === cur ? ' on' : '') + (ok ? ' ok' : '') + '" data-act="gopara" data-p="' + i + '" aria-label="الفقرة ' + (i + 1) + '"' + (i === cur ? ' aria-current="true"' : '') + '>' + ar(i + 1) + '</button>';
    }).join('') + '</nav>';
  }
  function stepMap() {
    const lv = SES.lv; const hasResume = !!S.pos[lv.id];
    return '<div class="body"><div class="eyebrow">المحطة ' + ar(levelNum(lv)) + ' · ' + esc(lv.group) + '</div>' +
      '<h2 class="h-display grad-text">' + esc(lv.title) + '</h2><p class="lede">خريطة المحطة: ' + paraWord(lv.paras.length) + '، وبعد كل فقرة أسئلة لا تنتقل قبل أن تجيبها صحيحة. أجب قبل أن ينتهي شريط الوقت تنل <b>ضعف النجوم</b>.</p>' + radial(lv.map) + paraNav(-1) + '</div>' +
      '<div class="foot">' + (hasResume
        ? '<button class="btn btn-main" data-act="resume">أكمل من حيث توقفت ' + IC.arrow + '</button><button class="btn btn-link" data-act="next">ابدأ المحطة من الأول</button>'
        : '<button class="btn btn-main" data-act="next">ابدأ الشرح ' + IC.arrow + '</button>') + '</div>';
  }

  /* ----- explanation step ----- */
  function stepEx() {
    const st = curStep(); const p = SES.lv.paras[st.p]; const rv = !!SES.revisit[st.p];
    SES.reveal = rv ? p.b.length : Math.max(1, Math.min(p.b.length, (SES.re && SES.re.reveal) || 1));
    return '<div class="body ex">' + paraNav(st.p) + '<div class="eyebrow">الفقرة ' + ar(st.p + 1) + ' من ' + ar(SES.lv.paras.length) + (rv ? ' · مراجعة' : '') + '</div>' +
      '<h2 class="stitle">' + md(p.t) + '</h2>' + (rv ? '<div class="revisit">' + mascot('idle') + '<span>اقرأ الفقرة بتمهل، ثم أعد المحاولة؛ ستعود القلوب كاملة وتتغير الأسئلة في ترتيبها.</span></div>' : '') +
      '<div class="blocks">' + p.b.slice(0, SES.reveal).map(block).join('') + '</div>' +
      '<div class="dots" aria-hidden="true">' + p.b.map((_, i) => '<i class="' + (i < SES.reveal ? 'on' : '') + '"></i>').join('') + '</div></div>' +
      '<div class="foot">' + exFoot(p) + '</div>';
  }
  function exFoot(p) {
    return SES.reveal >= p.b.length
      ? '<button class="btn btn-main" data-act="next">' + (p.q.length ? 'إلى الأسئلة ' : 'هيا نبدأ ') + IC.arrow + '</button>'
      : '<button class="btn btn-main" data-act="reveal">التالي ' + IC.arrow + '</button><button class="btn btn-link" data-act="revealall">اعرض الفقرة كاملة</button>';
  }
  function revealMore(all) {
    const st = curStep(); const p = SES.lv.paras[st.p]; if (SES.reveal >= p.b.length) return;
    const wrap = SES.slide.querySelector('.blocks'); const body = SES.slide.querySelector('.body');
    const upto = all ? p.b.length : SES.reveal + 1; let firstNew = null;
    for (let i = SES.reveal; i < upto; i++) { wrap.insertAdjacentHTML('beforeend', block(p.b[i])); if (!firstNew) firstNew = wrap.lastElementChild; }
    SES.reveal = upto; snap();
    SES.slide.querySelectorAll('.dots i').forEach((d, i) => d.classList.toggle('on', i < SES.reveal));
    SES.slide.querySelector('.foot').innerHTML = exFoot(p);
    sfx('reveal');
    if (firstNew) setTimeout(() => { body.scrollTop = Math.max(0, firstNew.offsetTop - 16); }, 40);
  }

  /* ----- question step ----- */
  function stepQ() {
    const st = curStep(); const q = getQ(st);
    const c = SES.cur = { q, solved: false, tries: (SES.re && SES.re.tries) || 0, busy: false, val: '' };
    if (q.t === 'mcq' || q.t === 'fill') c.ord = shuffle(q.o.map((_, i) => i));
    if (q.t === 'order') { let pool = shuffle(q.o.map((_, i) => i)); for (let g = 0; g < 6 && pool.every((v, i) => v === i); g++) pool = shuffle(pool); c.pool = pool; c.placed = q.o.map(() => null); c.locked = new Set(); }
    if (q.t === 'match') { c.tOrd = shuffle(q.o.map((_, i) => i)); c.dOrd = shuffle(q.o.map((_, i) => i)); c.sel = { t: null, d: null }; c.matched = 0; }
    const meta = SES.kind === 'exam'
      ? 'سؤال ' + ar(st.n + 1) + ' من ' + ar(SES.total) + ' · من المحطة ' + ar(st.from + 1)
      : 'سؤال ' + ar(st.n + 1) + ' من ' + ar(SES.lv.paras[st.p].q.length) + ' · الفقرة ' + ar(st.p + 1);
    return '<div class="body q"><div class="qmeta"><span class="eyebrow">' + meta + '</span><span class="qtype">' + (q.lab || TYPE_LABEL[q.t]) + '</span></div>' +
      '<div class="qtimer" data-z="a" role="timer" aria-label="وقت النجوم المضاعفة"><span class="qt-rw">' + IC.star + '<b>' + (q.base * 2) + '</b><em>×2</em></span><div class="qt-bar"><i></i></div><span class="qt-msg"></span></div>' +
      '<div class="qcard"><div class="qtext">' + qText(q) + '</div>' + (q.fig ? '<figure class="qfig">' + fig(q.fig) + '</figure>' : '') + '<div class="qbody">' + qBody(q, c) + '</div></div><div class="hint-slot" aria-live="assertive"></div></div>' +
      '<div class="foot">' + qFoot(q) + '</div>';
  }
  function qText(q) {
    if (q.t === 'tf') return '<span class="lead">هل العبارة الآتية صحيحة؟</span><span class="stmt">' + md(q.q) + '</span>';
    if (q.t === 'fill') return md(q.q).replace('____', '<span class="blank">…</span>');
    return md(q.q);
  }
  const PAD = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', 'neg', '.', 'del'];
  const padHTML = () => '<div class="pad">' + PAD.map((k, i) => '<button class="key' + (/\d/.test(k) ? '' : ' fn') + '" data-act="key" data-k="' + k + '" style="animation-delay:' + (i * .02).toFixed(2) + 's" aria-label="' + ({ del: 'حذف', neg: 'سالب', '.': 'علامة عشرية' }[k] || k) + '">' + ({ del: IC.del, neg: '−' }[k] || k) + '</button>').join('') + '<button class="key go" data-act="check" disabled>تحقق</button></div>';
  function qBody(q, c) {
    if (q.t === 'mcq') return '<div class="opts">' + c.ord.map((oi, k) => '<button class="opt" data-act="pick" data-o="' + oi + '" style="animation-delay:' + (k * .06).toFixed(2) + 's"><span class="k">' + LETTERS[k] + '</span><span class="ot">' + md(q.o[oi]) + '</span></button>').join('') + '</div>';
    if (q.t === 'tf') return '<div class="tf"><button class="opt" data-act="tf" data-v="1">' + IC.check + '<span>صح</span></button><button class="opt" data-act="tf" data-v="0">' + IC.x + '<span>خطأ</span></button></div>';
    if (q.t === 'fill') return '<p class="help">' + IC.tap + 'اختر ما يكمل الفراغ</p><div class="fchips">' + c.ord.map((oi, k) => '<button class="fchip" data-act="fill" data-o="' + oi + '" style="--i:' + k + '">' + md(q.o[oi]) + '</button>').join('') + '</div>';
    if (q.t === 'order') return '<p class="help">' + IC.order + 'اضغط على العناصر بالترتيب الصحيح، واضغط على خانة لإرجاع عنصرها</p><ol class="slots">' + q.o.map((_, k) => '<li class="slot" data-act="unslot" data-k="' + k + '"><span class="sn">' + ar(k + 1) + '</span><span class="st"></span></li>').join('') + '</ol><div class="pool">' + c.pool.map(oi => '<button class="pitem" data-act="slot" data-o="' + oi + '">' + md(q.o[oi]) + '</button>').join('') + '</div>';
    if (q.t === 'match') return '<p class="help">' + IC.tap + 'اختر عنصراً ثم ما يناسبه من الأسفل</p><div class="mterms">' + c.tOrd.map(ti => '<button class="mterm" data-act="mt" data-i="' + ti + '"><span class="mk"></span>' + md(q.o[ti][0]) + '</button>').join('') + '</div><div class="mdefs">' + c.dOrd.map(di => '<button class="mdef" data-act="md" data-i="' + di + '"><span class="mk"></span><span>' + md(q.o[di][1]) + '</span></button>').join('') + '</div>';
    if (q.t === 'num') return '<p class="help">' + IC.keys + 'اكتب الناتج بلوحة الأرقام ثم اضغط «تحقق»</p><div class="numbox"><span class="nb-l">الإجابة</span><output class="nb-v" aria-live="polite"></output>' + (q.u ? '<span class="nb-u">' + md(q.u) + '</span>' : '') + '</div>';
    return '';
  }
  function qFoot(q) {
    const peek = SES.kind === 'level' ? '<button class="btn btn-link" data-act="peek">' + IC.book + 'راجع الفقرة</button>' : '';
    if (q.t === 'num') return padHTML() + peek;
    if (q.t === 'order') return '<button class="btn btn-main" data-act="check" disabled>تحقق</button>' + peek;

    badges: () => { VIEW = 'badges'; showBadges('fwd'); },
    badge: t => showBadge(+t.dataset.i),
    sound: t => { S.sound = !S.sound; save(); t.innerHTML = S.sound ? IC.sound : IC.mute; t.setAttribute('aria-label', S.sound ? 'كتم الصوت' : 'تشغيل الصوت'); if (S.sound) sfx('ok'); toast(S.sound ? 'تم تشغيل الصوت' : 'تم كتم الصوت'); },
    reset: () => sheet('<div class="sh-h"><strong>إعادة الرحلة من البداية؟</strong></div><p class="msg">ستُمحى النجوم والأوسمة وتقدّمك في المحطات على هذا الجهاز. يبقى اسمك كما هو.</p><div class="sh-actions"><button class="btn btn-bad" data-act="resetyes">نعم، ابدأ من جديد</button><button class="btn btn-ghost" data-act="sheetclose">إلغاء</button></div>'),
    resetyes: () => { const snd = S.sound, nm = S.name; S = JSON.parse(JSON.stringify(DEF)); S.sound = snd; S.name = nm; save(); closeSheet(); showSplash('back'); },
    sheetclose: () => { closeSheet(); const b = SES && SES.slide && SES.slide.querySelector('.foot .btn'); if (b) { try { b.focus({ preventScroll: true }); } catch (e) { /* ignore */ } } },
    open: t => {
      const id = t.dataset.id;
      sfx('tap'); openLevel(id, 'fwd', t);
    },
    exam: t => {
      const bi = +t.dataset.b; if (!BABS[bi]) return;
      if (!babReady(bi)) {
        const left = babLeft(bi), gi = pathOf(left[0]);
        sfx('tap');
        sheet('<div class="sh-h"><strong>امتحان الباب ' + ORD[bi] + ' مغلق</strong></div><p class="msg">يُفتح امتحان الباب حين تُتمّ محطات فصوله كلها. باقٍ لك ' + textHTML(stWord(left.length)) + ' في هذا الباب.</p>' +
          '<div class="sh-actions"><button class="btn btn-main" data-act="path" data-g="' + gi + '">أكمل «' + esc(PATHS[gi].name) + '» ' + IC.arrow + '</button><button class="btn btn-ghost" data-act="sheetclose">حسناً</button></div>');
        return;
      }
      if (bxDone(bi)) { sheet('<div class="sh-h"><strong>امتحان الباب ' + ORD[bi] + '</strong></div><p class="msg">اجتزت امتحان هذا الباب من قبل، وأفضل نتيجة لك فيه ' + textHTML(starWord(S.bx[bi] || 0)) + '. ماذا تريد؟</p><div class="sh-actions"><button class="btn btn-main" data-act="cert" data-b="' + bi + '">عرض الشهادة</button><button class="btn btn-ghost" data-act="examretry" data-b="' + bi + '">إعادة الامتحان</button></div>'); return; }
      openExam(bi, 'fwd', t);
    },
    examretry: t => { closeSheet(); openExam(t && t.dataset.b != null ? +t.dataset.b : SES && SES.kind === 'exam' ? SES.bab : 0, 'fwd'); },
    cert: t => showCert(t && t.dataset.b != null ? +t.dataset.b : -1, 'fwd'),
    rnode: t => openNode(t),
    gopara: t => {
      if (!SES || SES.kind !== 'level') return;
      const p = +t.dataset.p, i = SES.steps.findIndex(x => x.k === 'ex' && x.p === p); if (i < 0) return;
      closeSheet(); stopTimer(); sfx('tap');
      SES.idx = i; SES.hearts = SES.max; SES.revisit[p] = false; SES.re = null; renderStep('fwd');
    },
    next: () => advance(),
    resume: () => { if (applyPos(S.pos[SES.lv.id])) enterSaved(); else advance(); },
    reveal: () => revealMore(false),
    revealall: () => revealMore(true),
    pick: t => mcqPick(t),
    tf: t => tfPick(t),
    fill: t => fillPick(t),
    slot: t => orderSlot(t),
    unslot: t => orderUnslot(t),
    check: () => (SES.cur.q.t === 'num' ? numCheck() : orderCheck()),
    key: t => numKey(t.dataset.k),
    mt: t => matchPick(t, 't'),
    md: t => matchPick(t, 'd'),
    reread: () => reread(),
    peek: () => { const p = SES.lv.paras[curStep().p]; sheet('<div class="sh-h"><strong>' + md(p.t) + '</strong><button class="ib" data-act="sheetclose" aria-label="إغلاق">' + IC.x + '</button></div><div class="sh-body still">' + p.b.map(block).join('') + '</div>'); },
    flip: t => { t.classList.toggle('on'); sfx('tap'); },
    finish: () => finishLevel(),
    quit: () => sheet('<div class="sh-h"><strong>' + (SES && SES.kind === 'exam' ? 'الخروج من الامتحان؟' : 'الخروج من المحطة؟') + '</strong></div><p class="msg">' + (SES && SES.kind === 'exam' ? 'لن يُحفظ تقدمك في الامتحان، وستبدؤه من جديد لاحقاً.' : 'نجومك محفوظة، ومكانك محفوظ؛ ستكمل من نفس النقطة حين تعود.') + '</p><div class="sh-actions"><button class="btn btn-main" data-act="sheetclose">متابعة الدراسة</button><button class="btn btn-ghost" data-act="home">' + (SES && SES.kind === 'exam' ? 'خروج إلى الباب' : 'خروج إلى الفصل') + '</button></div>')
  };

  appEl.addEventListener('click', e => {
    const t = e.target.closest('[data-act]'); if (!t || !appEl.contains(t) || t.disabled) return;
    const fn = ACT[t.dataset.act]; if (fn) { e.preventDefault(); fn(t, e); }
  });
  document.addEventListener('keydown', e => {
    const inField = /INPUT|TEXTAREA/.test((e.target || {}).tagName || '');
    const open = appEl.querySelector('.sheet-wrap');
    if (e.key === 'Escape') { if (open && open.dataset.locked !== '1') ACT.sheetclose(); return; }
    if (inField || open) return;
    if (e.key === 'ArrowLeft') primaryAction();
    const c = SES && SES.cur, st = SES && curStep();
    if (c && st && st.k === 'q' && c.q.t === 'num' && !c.solved) {
      if (/^[0-9]$/.test(e.key)) numKey(e.key);
      else if (e.key === 'Backspace') { e.preventDefault(); numKey('del'); }
      else if (e.key === '-') numKey('neg');
      else if (e.key === '.' || e.key === ',') numKey('.');
      else if (e.key === 'Enter') { e.preventDefault(); numCheck(); }
    }
  });
  let tx = 0, ty = 0;
  host.addEventListener('touchstart', e => { const t = e.touches[0]; tx = t.clientX; ty = t.clientY; }, { passive: true });
  host.addEventListener('touchend', e => {
    const t = e.changedTouches[0]; const dx = t.clientX - tx, dy = t.clientY - ty;
    if (dx > 70 && Math.abs(dy) < 45) primaryAction();
  }, { passive: true });

  window.__MJ = { get S() { return S; }, get SES() { return SES; }, LEVELS, BADGES, emblem, fig, md, totalStars, rankOf, lvMax };

  /* إذا فُتحت الصفحة في أكثر من تبويب: التبويب القديم لا يكتب فوق التقدم الأحدث،
     بل يعيد تحميل نفسه عند الرجوع إليه فيكمل من أحدث موضع محفوظ. */
  const syncTab = () => { if (changedElsewhere()) location.reload(); };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncTab(); });
  window.addEventListener('pageshow', e => { if (e.persisted) syncTab(); });

  if (!restore()) { if (S.intro) { VIEW = 'home'; showHome('fwd'); } else showSplash('fwd'); }
  if (!canStore()) setTimeout(() => toast('تنبيه: المتصفح لا يسمح بالحفظ، فلن يبقى تقدمك بعد إغلاق الصفحة'), 1200);
})();

</script>
</body>
</html>
