 الصريفيني قال: أخبرنا أبو بكر بن عبدان قال: حدثنا عبد الواحد بن المهتدي بالله قال: حدثنا أيوب بن سليمان الصغدي قال: حدثنا أبو اليمان قال: حدثنا شعيب عن الزهري قال: أخبرني أبو سلمة أن عبد الله بن عدي بن الحمراء أخبره أنه سمع رسول الله صلى الله عليه وسلم يقول وهو واقف بالحزورة من سوق مكة: «والله إنك لخير أرض الله، وأحب أرض الله إلى الله تعالى، ولولا أني أخرجت منك ما خرجت»(٢).", "**ذكر قبول الحاج**", "أخبرنا أبو منصور القزاز قال: أخبرنا أبو بكر الخطيب قال: أخبرنا مكي بن علي قال: حدثنا أبو إسحاق المزكي قال: سمعت أبا الحسن البلخي يقول: سمعت عبد الرحمن بن عبد الباقي يقول: سمعت بعض مشايخنا يقول: قال علي بن الموفق(٣): لما تم لي ستون حجة خرجت من الطواف، وجلست بجذاء الميزاب، وجعلت أفكر لا أدري أي شيء حالي عند الله عز وجل، وقد كثر ترددي إلى هذا المكان، فغلبتني عيني، وكأن قائلا يقول لي: يا علي، أتدعوا إلى بيتك إلا من تحبه؟ قال: فانتبهت وقد سري عني ما كنت فيه(٤).", "حاشية: (١) أخرجه الترمذي (٦٦٦)، وقال: هذا حديث غريب، والمصنف في العلل ٢/ ٨٣.", "حاشية: (٢) أخرجه الدارمي (٢٥١٠)، وأحمد (١٨٧١٥) و(١٨٧١٦)، والترمذي (٣٩٢٥)، والنسائي في الكبرى (٤٢٥٢)، وابن ماجه (٣١٠٨)، وابن حبان (٣٧٠٨)، والحاكم ٣/ ٧.", "حاشية: (٣) هو علي بن الموفق، أبو الحسن البغدادي العابد الزاهد، توفي سنة ٢٦٥ هـ. تاريخ بغداد ١٢/ ١١٠، حلية الأولياء ١٠/ ٣١٢، صفة الصفوة ٢/ ٣٨٦.", "حاشية: (٤) تاريخ بغداد ١٢/ ١١١.", "وبلغنا من طريق آخر عن علي بن الموفق قال: حججت في بعض السنين، فنمت ليلة عرفة في مسجد الخيف، فرأيت في المنام كأن ملكين قد نزلا من السماء، فنادى أحدهما صاحبه: يا عبد الله. فقال: لبيك يا عبد الله، قال: تدري كم حج بيت ربنا في هذه السنة؟ قال: لا أدري. قال: حج بيت ربنا ست مئة ألف، فتدري كم قبل منهم؟ قال: لا. قال: قبل منهم ستة أنفس. قال: ثم ارتفعا في الهواء، فغابا عني، فانتبهت فزعا، فاغتممت غما شديدا، وأهمني أمري، وقلت: إذا قبل ستة أنفس فأين أكون أنا في ستة أنفس؟ فلما أفضت من عرفة وبت عند المشعر الحرام جعلت أفكر في كثرة الخلق وفي قلة من قبل منهم، فحملني النوم، فإذا الشخصان قد نزلا على هيئتهما، فنادى أحدهما صاحبه، فأعاد ذلك الكلام بعينه، ثم قال: أفتدري ماذا حكم ربنا في هذه الليلة؟ قال: لا. قال: فإنه وهب لكل واحد من الستة مئة ألف. فانتبهت وبي من السرور ما يجل عن الوصف.", "**ذكر المجاورة بمكة**", "اختلف العلماء في المجاورة بمكة، فكرهها أبو حنيفة، ولم يكرهها الإمام أحمد بن حنبل في خلق كثير من العلماء، بل استحبوها، فمن كرهها، فلأربعة أوجه:", "أحدها: خوف الملل.", "والثاني: قلة الاحترام لمداومة الأنس بالمكان."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "أخبرنا أبو منصور محمد بن عبد الملك ____ الرحمن بن محمد قالا", "o": ["وعبد", "أهلك", "وراءه", "وأيوب"], "h": "راجع: ص٢٠٠"}, {"t": "fill", "d": 2, "q": "اختلف العلماء في المجاورة بمكة، فكرهها أبو حنيفة، ولم يكرهها الإمام أحمد بن حنبل في خلق كثير من العلماء، بل استحبوها، فمن كرهها، فلأربعة ____", "o": ["أوجه", "يباهي", "شفتاه", "زكاة"], "h": "راجع: ص٢٠٤"}, {"t": "fill", "d": 2, "q": "والرواية الثانية: أنها ثلاثة، والسعي سنة، إذا تركه فلا شيء عليه، ____ أصحابنا: عليه بتركه دم؛ لأنهم رأوه", "o": ["وقال", "ويشرب", "يكابد", "عادوا"], "h": "راجع: ص٢٠٨"}, {"t": "fill", "d": 2, "q": "فإن حلق ثلاث شعرات فعليه دم، فإن حلق ما دون الثلاث ففي كل شعرة مد من طعام، وعن الإمام ____", "o": ["أحمد", "يلتبس", "وغير", "بقاع"], "h": "راجع: ص٢١١"}, {"t": "fill", "d": 2, "q": "أخبرنا عبد الوهاب ويحيى بن علي قالا: أخبرنا أبو محمد الصريفيني قال: أخبرنا أبو بكر بن عبدان قال: حدثنا عبد الواحد بن المهتدي بالله قال: حدثنا ____ بن سليمان الصغدي قال: حدثنا أبو اليمان قال: حدثنا", "o": ["أيوب", "يفرش", "رجال", "والسعي"], "h": "راجع: ص٢٠٣"}, {"t": "fill", "d": 2, "q": "فمن ترك ركنا لم يتم نسكه إلا به، ومن ترك واجبا ____ دم، ومن ترك سنة أو هيئة، فلا شيء عليه", "o": ["فعليه", "وصححه", "مظلم", "ولبس"], "h": "راجع: ص٢٠٩"}]}, {"t": "الباب الأول - القسم ٢ من ٢", "b": [{"story": ["الباب الأول (٦ من ١٠)، ص٢٠٤", ["والثالث: يهيج الشوق بالمفارقة فتنشأ داعية العود، فإن تعلق القلب بالكعبة والإنسان في بيته خير من تعلق القلب بالبيت والإنسان عند الكعبة.", "والرابع: خوف ارتكاب الذنوب هناك، فإن الخطأ ثم ليس كالخطأ في غيره؛ لأن المعصية هناك تتضاعف عقوبتها، ولا تظن أن كراهة المكان تناقض فضل البقعة؛ لأن علة هذه الكراهة ضعف الخلق وقصورهم عن القيام بحق الموضع، وأما من استحبهما، فإنه نظر إلى فضل المكان ومضاعفة ا لحسنات.", "**فضل المدينة**", "أخبرنا أبو القاسم هبة الله بن محمد قال: أخبرنا أبو علي التميمي قال: حدثنا أبو بكر بن مالك قال: حدثنا عبد الله بن أحمد قال: حدثني أبي، قال: حدثنا أنس بن عياض قال: حدثني يزيد(١) بن خصيفة عن عبد الله بن عبد الرحمن بن أبي صعصعة عن عطاء بن يسار عن السائب بن خلاد، أن رسول الله صلى الله عليه وسلم قال: «من أخاف أهل المدينة ظلما أخافه الله، وعليه لعنة الله والملائكة والناس أجمعين، لا يقبل الله منه يوم القيامة صرفا ولا عدلا»(٢). أخبرنا علي بن عبيد الله قال: أخبرنا ابن النقور قال: حدثنا ابن مرذك قال: حدثنا الحسن بن محمد قال: حدثنا محمد بن عزيز قال: حدثني سلامة عن عقيل عن ابن شهاب قال: أخبرني أنس بن مالك أنه سمع رسول الله صلى الله عليه وسلم يقول: «اللهم اجعل بالمدينة ضعفي ما جعلت بمكة من البركة»(٣). وفي الصحيحين من حديث عبد الله بن زيد بن عاصم، عن النبي صلى الله عليه وسلم أنه قال: «إن إبراهيم حرم مكة ودعى لأهلها، وإني حرمت المدينة كما حرم إبراهيم مكة، وإني دعوت في صاعها ومدها بمثلي ما دعى به إبراهيم لأهل مكة»(٤). وفي الصحيحين من حديث أبي هريرة عن النبي صلى الله عليه وسلم أنه قال: «على أنقاب المدينة ملائكة، لا يدخلها الطاعون ولا الدجال»(٥). وفي أفراد البخاري من حديث سعد بن أبي وقاص عن النبي صلى الله عليه وسلم أنه قال: «لا يكيد أهل المدينة أحد إلا انماع كما ينماع الملح في الماء»(٦). وفي أفراد مسلم من حديث سعد أيضا عن النبي صلى الله عليه وسلم أنه قال: «لا يثبت أحد على لأوائها وجهدها إلا كنت له شفيعا أو شهيدا يوم", "حاشية: (١) تحرفت في (ظ) إلى: «زيد».", "حاشية: (٢) أخرجه أحمد (١٦٥٥٧) و(١٦٥٥٩) و(١٦٥٦٢) و(١٦٥٦٥)، والطبراني في الكبير (٦٦٣٢) و(٦٦٣٣) و(٦٦٣٥) و(٦٦٣٧)، وابن أبي عاصم في الآحاد والمثاني (٥٢).", "حاشية: (٣) أخرجه البخاري (١٨٨٥)، ومسلم (١٣٦٩)، وأحمد (١٢٤٥٢)، وأبو يعلى (٣٥٧٨) و(٣٦٢٠).", "حاشية: (٤) أخرجه البخاري (٢١٢٩)، ومسلم (١٣٦٠) و(٤٥٤).", "حاشية: (٥) أخرجه البخاري (١٨٨٠) و(٧١٣٣)، ومسلم (١٣٧٩).", "حاشية: (٦) أخرجه البخاري (١٨٧٧)."]], "ic": "book"}, {"story": ["الباب الأول (٧ من ١٠)، ص٢٠٦", ["القيامة»(١). وفي حديث معقل بن يسار قال: قال رسول الله صلى الله عليه وسلم: «المدينة مهاجري، فيها مضجعي، ومنها مبعثي، حقيق على أمتي حفظ جيراني ما اجتنبوا الكبائر، من حفظهم كنت له شهيدا أو شفيعا يوم القيامة، ومن لم يحفظهم سقي من طينة الخبال» قيل للمزني وهو معقل: ما طينة الخبال؟ قال: عصارة أهل النار(٢). وفي حديث ابن عمر عن النبي صلى الله عليه وسلم أنه قال: «من استطاع أن يموت بالمدينة فليمت، فإن من مات بالمدينة شفعت له يوم القيامة»(٣). وفي حديث ثابت بن قيس بن شماس عن النبي صلى الله عليه وسلم أنه قال: «غبار المدينة شفاء من الجذام»(٤).", "**فضيلة مسجد رسول الله صلى الله عليه وسلم**", "أخبرنا عبد الأول بن عيسى، قال: أخبرنا محمد بن عبد العزيز، قال: أخبرنا عبد الرحمن بن أبي شريح قال: حدثنا يحيى بن صاعد قال: حدثنا هارون بن موسى قال: حدثنا عمر بن أبي بكر المؤملي عن القاسم بن عبد الله عن كثير المزني عن نافع عن ابن عمر قال: قال رسول الله صلى الله عليه وسلم: «صلاة في مسجدي هذا كألف صلاة فيما سواه، إلا المسجد الحرام». أخرجه مسلم في أفراده، وقال فيه: «أفضل من ألف صلاة»(٥). أخبرنا عبد الوهاب ويحيى بن علي قالا: أخبرنا أبو محمد الصريفيني قال: حدثنا أبو بكر بن عبدان قال: حدثنا عبد الواحد بن المهتدي بالله قال: حدثنا أيوب بن سليمان الصغدي قال: حدثنا أبو اليمان قال: حدثنا العطاف بن خالد عن عبد الله بن عثمان بن الأرقم بن أبي الأرقم عن أبيه عن جده قال: قلت لرسول الله صلى الله عليه وسلم: إني أريد أن أخرج إلى بيت المقدس، قال: «فلم؟»", "حاشية: (١) أخرجه مسلم (١٣٦٣).", "حاشية: (٢) أخرجه الطبراني في الكبير ٢٠/ (٤٧٠).", "حاشية: (٣) أخرجه أحمد (٥٤٣٧) و(٥٨١٨)، والترمذي (٣٩١٧)، وابن ماجه (٣١١٢)، وابن حبان (٣٧٤١)، والبيهقي في الشعب (٤١٨٥) و(٤١٨٦).", "حاشية: (٤) ذكره الفيروزآبادي في المغانم المطابة ١/ ٣٨٥، والسيوطي في الحجج المبينة: ٨٥، والمتقي الهندي في الكنز (٣٤٨٢٨) ونسبه لأبي نعيم في الطب.", "حاشية: (٥) أخرجه مسلم (١٣٩٥).", "قلت: لصلاة فيه قال: «الصلاة ها هنا أفضل من الصلاة هناك ألف مرة»(١).", "**فضل الروضة**", "روى البخاري ومسلم في الصحيحين، من حديث أبي هريرة رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «ما بين بيتي ومنبري روضة من رياض الجنة»(٢).", "**فضل صلاة الجمعة وصيام رمضان بالمدينة**", "أخبرنا السجزي، قال: أخبرنا محمد بن عبد العزيز، قال: أخبرنا ابن أبي شريح، قال: حدثنا ابن صاعد، قال: حدثنا هارون بن موسى، قال: حدثنا عمر بن أبي بكر المؤملي، عن القاسم بن عبد الله، عن كثير بن عبد الله، عن عوف، عن نافع، عن ابن عمر رضي الله عنهما قال: قال رسول الله صلى الله عليه وسلم: «صلاة الجمعة بالمدينة، كصيام ألف شهر فيما سواها»(٣)."]], "ic": "book"}, {"story": ["الباب الأول (٨ من ١٠)، ص٢٠٧", ["ويتبع هذين الموضعين في الفضل بيت المقدس، وقد قال صلى الله عليه وسلم: «لا تشد الرحال إلا إلى ثلاثة مساجد، المسجد الحرام، ومسجدي هذا، والمسجد الأقصى»(٤).", "ثم يتبع هذه المواضع الثغور التي يرابط فيها.", "**الفصل الثاني**", "**في شروط وجوب الحج وأركانه وواجباته ومحظوراته**", "الحج يشتمل على خمسة أشياء: شرائط، وأركان، وواجبات، ومسنونات، وهيئات.", "حاشية: (١) أخرجه أحمد (٢٤٠٠٩/ ١)، والضياء في المختارة (١٣٠٠)، و(١٣٠١) و(١٣٠٢)، والطبراني في الكبير (٩٠٧)، والحاكم ٣/ ٥٠٤، وابن أبي عاصم في الآحاد والمثاني (١٨٨) والطحاوي في شرح مشكل الآثار (٦٠٧)، وابن كثير في البداية والنهاية ٨/ ٣٢٦.", "حاشية: (٢) أخرجه البخاري (١١٩٦) و(١٨٨٨) و(٦٥٨٨) و(٧٣٣٥)، ومسلم (١٣٩١).", "حاشية: (٣) أخرجه المصنف في العلل المتناهية ٢/ ٨٧، وقال: هذا حديث لا يصح.", "حاشية: (٤) أخرجه البخاري (١١٨٩)، ومسلم (١٣٩٧)(٥١١) من حديث أبي هريرة.", "**فأما الشرائط:** فقد اشترط في محل الوجوب وجود خمس شرائط: البلوغ، والعقل، والحرية، والإسلام، والزاد والراحلة(١).", "وأما شرائط الأداء على العموم، فثلاثة:", "**[الأول]:** تخلية الطريق، وهو أن لا يكون مانع يمنع ما يخاف منه على النفس والمال.", "**والثاني:** أن يمكن الأداء، وهو أن يكون الوقت متسعا للفعل أو المسافة إن كان على مسافة.", "**والثالث:** أن يكون ممن يستمسك على الراحلة.", "واشترط في حق الضرير أن يكون له قائد يلائمه، واشترط في حق المرأة المحرم، والمحرم: الزوج أو من لا يحل له نكاحها من المناسبين.", "واختلفت الرواية عن الإمام أحمد في المحرم، هل هو من شرائط الوجوب، أو من شرائط الأداء؟ على روايتين(٢).", "**وأما الأركان:** ففيها ثلاث روايات عن الإمام أحمد، إحداهن: أنها أربعة: الإحرام، والوقوف، وطواف الزيارة، والسعي.", "والرواية الثانية: أنها ثلاثة، والسعي سنة، إذا تركه فلا شيء عليه، وقال أصحابنا: عليه بتركه دم؛ لأنهم رأوه واجبا.", "والرواية الثالثة: أنها ركنان: الوقوف، والطواف. فإنه قال فيمن وقف وزار البيت: عليه دم، وحجته صحيحة.", "**وأما الواجبات:** فسبعة: الإحرام من الميقات، والوقوف بعرفة إلى الليل، والمبيت بمزدلفة إلى بعد نصف الليل، والمبيت بمنى في ليالي منى، إلا لأهل السقاية والرعاء، والرمي، والحلاق، وطواف الوداع.", "حاشية: (١) الزاد والراحلة شرط واحد وهو الاستطاعة.", "حاشية: (٢) ينظر الكافي لابن قدامة ٢/ ٣٠٣ ـ ٣٠٤.", "**وأما المسنونات:** فهي [عشرة]: الاغتسال، وصلاة الركعتين عند عقد الإحرام، وطواف القدوم، والجمع بين الليل والنهار في عرفات ما لم يكن بدأ بالوقوف نهارا؛ لأنه مخير قبل الدخول في الوقوف بين الجمع بين الزمانين وبين إفراد الليل، فإن وقف بالنهار وجب عليه أن يقف جزءا من الليل، فإن أخل بذلك وجب عليه دم."]], "ic": "book"}, {"story": ["الباب الأول (٩ من ١٠)، ص٢٠٩", ["والتلبية، وركعتا الطواف، واستلام الركنين، والتقبيل، والمبيت بمنى ليلة عرفة إن كان خارجا إلى عرفات من مكة إلى غداة عرفة، وجميع الأذكار في الحج.", "**وأما الهيئات [فعشرة]:** رفع الصوت بالتلبية للرجال، والدخول إلى مكة من أعلاها، وإلى المسجد الحرام من باب بني شيبة، والاضطباع في الطواف والسعي، والإسراع في موضع الإسراع، والمشي في موضع المشي، والعلو على الصفا والمروة، حتى يشاهد البيت، وشدة السعي عند محسر، والوقوف على المشعر الحرام، وعند الجمرات.", "فمن ترك ركنا لم يتم نسكه إلا به، ومن ترك واجبا فعليه دم، ومن ترك سنة أو هيئة، فلا شيء عليه.", "فإذا تكاملت الشروط وجب البدار إلى الحج، وهو قول عامة العلماء، خلافا للشافعي رحمه الله.", "ولا خلاف في جواز التمتع والإفراد والقران.", "والتمتع: أن يحرم بالعمرة في أشهر الحج من الميقات، ويدخل مكة، ويطوف ويسعى، ويفعل أفعال العمرة، ويتحلل، فإذا كان يوم التروية أحرم بالحج من مكة، ثم يخرج إلى عرفة، ويفعل أفعال الحج.", "والإفراد: أن يحرم بالعمرة في أشهر الحج من الميقات، ويدخل مكة، ويطوف ويسعى، ويفعل أفعال الحج، فإذا تحلل خرج إلى التنعيم، فأحرم بالعمرة، وفعل أفعالها.", "والقران: أن ينوي الحج والعمرة من الميقات، ويطوف لهما.", "والكل جائز، لكن الخلاف في الأفضل، فمذهب أحمد أن التمتع أفضل، وعند أبي حنيفة أن القران أفضل، وعند مالك والشافعي أن الإفراد أفضل.", "فأما محظورات الإحرام فتسعة:", "لبس المخيط، وتغطية الرأس، وحلق الشعر، وتقليم الأظفار، وشم الطيب، وقتل الصيد، والوطء في الفرج، ودون الفرج، والمباشرة لشهوة.", "فإن لبس ناسيا، أو تطيب ناسيا، فعليه الفدية، وكذلك لو لبس بعض يوم.", "ولا يجوز له تغطية رأسه، وهل يجوز له تغطية وجهه؟ فيه روايتان.", "ولا يجوز له تظليل المحمل رواية واحدة، فإن ظلل، ففي وجوب الفدية روايتان. فإن حمل على رأسه شيئا، أو نصب حياله ثوبا يقيه الشمس والبرد، أو جلس في خيمة أو ظل شجرة، أو تحت سقف، فلا شيء عليه.", "فإن طين رأسه أو عصبه لوجع أو جرح، فجعل عليه قرطاسا فيه دواء أو خرقة لزمه الفدية.", "ويجوز للمحرم أن يتشح بالرداء والقميص، ولا يعقده، ويتزر بالإزار ويعقده، فإن طرح على كتفيه القباء(١) فعليه الفدية، وإن لم يدخل يديه في الكمين(٢).", "فإن طيب المحرم بعض عضو، وجبت الفدية.", "ولا يجوز له لبس ثوب مبخر، وإذا ادهن بالشيرج(٣) والزيت، ففي وجوب الفدية روايتان.", "ويحرم عليه شم الأدهان المطيبة، وأكل ما فيه طيب يظهر ريحه أو طعمه في", "حاشية: (١) القباء ثوب يلبس فوق الثياب.", "حاشية: (٢) في (ظ): «كمه».", "حاشية: (٣) الشيرج: زيت السمسم.", "فمه، وشم المسك والكافور والعنبر والزعفران والورس(١). وهل تلزمه الفدية بشم شيء من الرياحين؟ فيه روايتان.", "ويجوز له شم السفرجل والتفاح والبطيخ والأترج والشيح والقيصوم."]], "ic": "book"}, {"story": ["الباب الأول (١٠ من ١٠)، ص٢١١", ["فإن مس من الطيب ما يعلق بيده(٢-٢)كالغالية(٣) وماء الورد متعمدا فعليه الفدية، وإن مس ما لا يعلق بيده(٢-٢)، كقطع الكافور والعنبر فلا فدية. فإن شم ذلك ففيه الفدية.", "فإن حلق ثلاث شعرات فعليه دم، فإن حلق ما دون الثلاث ففي كل شعرة مد من طعام، وعن الإمام أحمد: قبضة من طعام.", "وإذا غسل المحرم رأسه بالسدر والخطمي، فهل تلزمه الفدية؟ فيه روايتان.", "فإن قلم ثلاثة أظفار لزمه دم.", "ولا يصح أن يعقد المحرم عقد نكاح لا لنفسه ولا لغيره، وهل تصح مراجعته؟ فيه روايتان عن الإمام أحمد.", "ويكره له الخطبة والشهادة على النكاح، ويحرم عليه المباشرة في الفرج ودونه لشهوة، والاستمناء، فإن فعل وجبت عليه الكفارة. فإن جامع قبل الوقوف، وجبت عليه بدنة، فإن جامع بعد الوقوف وقبل التحلل الأول؛ فسد حجه وعليه بدنة، فإن وطئ بعد التحلل الأول(٤)، لم يفسد حجه، وهل تلزمه بدنة أم شاة؟ فيه روايتان، ويستأنف إحرامه من التنعيم ويأتي بعمل عمرة وبالطواف والسعي وبقية أفعال الحج.", "فإن وطئ ناسيا فسد حجه، فإن أفسد العمرة بالوطء لزمه شاة، فإن وطئ القارن لزمه دم واحد.", "حاشية: (١) الورس: نبات كالسمسم يصبغ به.", "حاشية: (٢-٢) سقط من الأصل.", "حاشية: (٣) الغالية: أخلاط من الطيب.", "حاشية: (٤) تكرر في الأصل.", "وإذا صاد المحرم صيدا لم يملكه، فإن قتل المحرم صيدا فعليه مثل ضمنه بمثله إن كان له مثل من النعم، ففي النعامة بدنة، وفي حمار الوحش والوعل بقرة، وفي الضبع والضب كبش، وفي الغزال والثعلب عنز، وفي الأرنب عناق(١)، فإن كان الصيد لا مثل له، كالعصافير والقنابر، ضمنه بقيمته إلا الحمام وما عب(٢) وهدر(٣) كالفواخت(٤) والقطا والقبج(٥)، ففي الواحدة شاة، فإن جنى على صيد ضمنه بما نقص، فإن قتله خطأ، ففي وجوب الجزاء روايتان.", "حاشية: (١) العناق: هي الأنثى من أولاد المعز.", "حاشية: (٢) أي: وضع منقاره في الماء وكرع كما تركه الشاة، ولا بأخذ قطرة قطرة.", "حاشية: (٣) هدر: أي صوت.", "حاشية: (٤) الفواخت: جمع فاختة، وهي طائر معروف.", "حاشية: (٥) القبج: الحجل."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "والتمتع: أن يحرم بالعمرة في أشهر الحج من الميقات، ويدخل مكة، ويطوف ويسعى، ويفعل أفعال العمرة، ويتحلل، فإذا كان يوم التروية أحرم بالحج من مكة، ثم ____ إلى عرفة، ويفعل أفعال", "o": ["يخرج", "قارعة", "وصهيب", "القيم"], "h": "راجع: ص٢٠٩"}, {"t": "fill", "d": 2, "q": "أخبرنا الكرخي قال: أخبرني الغورجي قال: أخبرنا الجراحي قال: حدثنا المحبوبي قال: حدثنا الترمذي قال: حدثنا قتيبة قال: حدثنا جرير عن عطاء بن السائب عن سعيد بن جبير عن ابن ____ قال: قال رسول الله صلى الله", "o": ["عباس", "متعبد", "مبدأ", "لأبناء"], "h": "راجع: ص٢٠١"}, {"t": "fill", "d": 2, "q": "والكل جائز، لكن الخلاف في الأفضل، فمذهب أحمد أن التمتع أفضل، وعند أبي حنيفة أن ____ أفضل، وعند مالك والشافعي أن الإفراد أفضل", "o": ["القران", "للأنوار", "ووضعه", "أضرت"], "h": "راجع: ص٢١٠"}, {"t": "fill", "d": 2, "q": "ويكره له الخطبة والشهادة على النكاح، ويحرم عليه المباشرة في الفرج ____ لشهوة، والاستمناء، فإن فعل وجبت عليه الكفارة", "o": ["ودونه", "وشفع", "يلزمني", "أجناس"], "h": "راجع: ص٢١١"}, {"t": "fill", "d": 2, "q": "ولا يجوز له تظليل المحمل رواية واحدة، فإن ظلل، ففي وجوب الفدية ____", "o": ["روايتان", "ووجوبها", "بالتصنيف", "بالعمل"], "h": "راجع: ص٢١٠"}, {"t": "fill", "d": 2, "q": "وقد روى ابن مسعود عن النبي صلى ____ عليه وسلم أنه قال", "o": ["الله", "أعانهم", "بعنبة", "يعير"], "h": "راجع: ص١٩٩"}]}], "sum": [["الصفحات", "ص١٩٨ - ص٢١٢"]], "_nq": 12}, {"id": "l26", "title": "الباب الثاني في ترتيب الأعمال الظاهرة من أول السفر إلى الرجوع", "group": "كتاب أسرار الحج ومهماته", "map": {"center": "الباب\nالثاني في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الثاني في ترتيب الأعمال الظاهرة من أول السفر إلى الرجوع - القسم ١ من ٣", "b": [{"pic": ["books", "book"], "cap": "ص٢١٣ - ص٢٣١"}, {"story": ["الباب الثاني في ترتيب الأعمال الظاهرة من أول السفر إلى الرجو (١ من ١٤)، ص٢١٣", ["**في ترتيب الأعمال الظاهرة من أول السفر إلى الرجوع**", "وهي عشرة جمل:", "**الجملة الأولى:** في السنن من أول الخروج إلى الإحرام:", "وهي عشرة:", "**الأولى:** في المال، فينبغي أن يبدأ بالتوبة، ورد المظالم، وقضاء الديون، وإعداد النفقة لكل من يلزمه نفقته إلى وقت الرجوع، ويرد ما عنده من الودائع ويستصحب من المال الحلال ما يكفيه لذهابه وإيابه من غير تقتير على وجه يمكنه معه التوسع في الزاد، والرفق بالفقراء، ويستصحب ما يصلحه كالسواك والمشط والمرآة والمكحلة، ويتصدق بشيء قبل خروجه، وليشتر ما يحمله أو يكتريه، فإن اكترى فليظهر للمكري كل ما يريد أن يحمله من قليل أو كثير، ويحصل رضاه فيه، وقد قال رجل لابن المبارك: احمل لي هذه الرقعة إلى فلان، فقال: حتى أستأذن الجمال. وقد أخبرنا ظفر بن علي قال: أنبأنا أبو مطيع المصري قال: أخبرنا أبو بكر بن مردويه، قال: حدثنا محمد بن محمد المصري قال: حدثنا مسلم بن إبراهيم قال: حدثنا دجين بن ثابت قال: حدثنا أسلم عن عمر قال: قال رسول الله صلى الله عليه وسلم: «من حج بمال حرام، فقال: لبيك اللهم لبيك، قال الله عز وجل: لا لبيك لا وسعديك، وحجك مردود عليك»(١).", "وفي حديث ابن عمر عن النبي صلى الله عليه وسلم أنه قال: «رد دانق من حرام يعدل عند الله سبعين حجة»(٢).", "حاشية: (١) أخرجه المصنف في العلل ٢/ ٧٥ وقال: هذا لا يصح عن رسول الله صلى الله عليه وسلم، وأورده السيوطي في الدر المنثور ١/ ٣٤٧، والمتقي الهندي في الكنز (١١٩٠٠).", "حاشية: (٢) أورده السيوطي في اللآلئ المصنوعة ٢/ ١٧٥، والعجلوني في كشف الخفاء ١/ ٤٢٨", "**الثانية:** في الرفيق: ينبغي أن يلتمس رفيقا صالحا محبا للخير معينا عليه، إن نسي ذكره، وإن ذكر أعانه، وإن ضاق صدره صبره، وليؤمر الرفقاء أحسنهم خلقا، وأرفقهم بالأصحاب، وإنما يحتاجون إلى التأمير؛ لأن الآراء تختلف فلا ينتظم التدبير إلا أن ينفرد بالرأي أمير(١)، ثم على الأمير الرفق والنظر في مصلحة القوم، وأن يجعل نفسه وقاية لهم.", "قال عبد الله الرباطي: صحبت عبد الله المروزي، فقال: أينا الأمير؟ قلت: أنت. فلم يزل يحمل زاد نفسه وزادي، وجاء المطر فأجلسني في ظل ميل(٢) وقام وغطاني بكسائه، وكلما قلت له في شيء: لا تفعل. قال: ألم تقل: أنت الأمير؟! فوددت أني لم أصحبه لما كان يحمل على نفسه.", "وينبغي أن يطيب الكلام مع رفقائه، ويطعم الطعام، ويظهر محاسن الأخلاق، فإن السفر يخرج خبايا الباطن، ومن كان في السفر الذي هو مظنة الضجر حسن الخلق كان في الحضر أحسن خلقا.", "و(٣)قد قيل: إذا أثنى على الرجل معاملوه في الحضر، ورفقاؤه في السفر، فلا تشكوا في صلاحه(٣)."]], "ic": "book"}, {"story": ["الباب الثاني في ترتيب الأعمال الظاهرة من أول السفر إلى الرجو (٢ من ١٤)، ص٢١٤", ["**الثالثة:** أن يودع رفقاءه وإخوانه المقيمين، ويلتمس أدعيتهم، ويقول لمن يودعه: أستودع الله دينك وأمانتك وخواتيم عملك. كذلك روى ابن عمر وأبو هريرة أن النبي صلى الله عليه وسلم كان إذا ودع أحدا قال له ذلك(٤).", "حاشية (تتمة): والقاري في الأسرار المرفوعة: ٢٠٧.", "حاشية: (١) في (ظ): «آمر».", "حاشية: (٢) في (ظ): «جبل». والميل: منار يبنى للمسافر في الطريق يهتدي به ويدل على المسافة. «المعجم الوسيط»: (ميل).", "حاشية: (٣-٣) سقط من (ظ).", "حاشية: (٤) حديث ابن عمر أخرجه أحمد (٤٥٢٤) و(٥٦٠٥) و(٥٦٠٦)، والترمذي (٣٤٤٣)، والنسائي في الكبرى (٨٨٠٥) و(٨٨٠٦) و(١٠٣٥٧)، وابن خزيمة (٢٥٣١)، والحاكم ٢/ ٩٧، والبيهقي في السنن ٥/ ٢٥١، وابن ماجه (٢٨٢٦).", "وفي رواية أخرى عن النبي صلى الله عليه وسلم أنه كان إذا ودع رجلا قال له: «زودك الله التقوى، وغفر ذنبك، ووجهك للخير حيث ما توجهت»(١).", "**الرابعة:** أن يجعل خروجه بكرة، فقد قال عليه الصلاة والسلام: «اللهم بارك لأمتي في بكورها»(٢).", "ولتكن يوم الخميس، فقد روى كعب بن مالك، قال: قلما كان رسول الله صلى الله عليه وسلم يخرج إلى سفر إلا يوم الخميس(٣).", "**الخامسة:** في الخروج من الدار: إذا هم بالخروج فليصل ركعتين، ثم ليقل: اللهم اصحبني في سفري واخلفني في أهلي ومالي وولدي، اللهم إني أستودعك جميع أهلي ومالي. ولا يخصص، فقد أخبرنا إسماعيل بن أحمد قال: أنبأنا محمد بن علي بن سكينة قال: أنبأنا الحسين بن صفوان قال: أنبأنا أبو الحسين بن بشران قال: حدثني عبد الله بن محمد القرشي قال: حدثني محمد بن الحسين قال: حدثني عبيد بن إسحاق قال: حدثنا عاصم بن محمد العمري عن زيد بن أسلم عن أبيه قال: بينا عمر بن الخطاب يعرض به(٤) الناس إذ مر به رجل معه ابن له على عاتقه، فقال عمر: ما رأيت غرابا أشبه بغراب من هذا بهذا. فقال الرجل: أما والله", "حاشية (تتمة): وحديث أبي هريرة أخرجه أحمد (٨٦٩٤)، وابن ماجه (٢٨٢٥)، وابن السني في عمل اليوم والليلة (٥٠٧).", "حاشية: (١) أخرجه الترمذي (٣٤٤٤)، والحاكم ٢/ ٩٧ من حديث أنس.", "حاشية: (٢) أخرجه من حديث علي رضي الله عنه أحمد (١٣٢٠) و(١٣٢٣) و(١٣٢٩) و(٣٣١) و(١٣٣٩)، والبزار (٦٩٦)، وأبو يعلى (٤٢٥)، والمصنف في العلل ١/ ٣١٤ ـ ٣١٥، والترمذي في العلل الكبير (١٨٤)، والعقيلي في الضعفاء ٢/ ٣٢٣، والرامهرمزي في المحدث الفاصل ٢٥٦. وقال المنذري في الترغيب والترهيب ٢/ ٥٢٩: قد رواه جماعة عن النبي صلى الله عليه وسلم منهم: علي، وابن عباس، وابن مسعود، وابن عمر، وأبو هريرة، وأنس بن مالك، وعبد الله بن سلام، والنواس بن سمعان، وعمران بن حصين، وجابر بن عبد الله وبعض أسانيده جيدة."]], "ic": "book"}, {"story": ["الباب الثاني في ترتيب الأعمال الظاهرة من أول السفر إلى الرجو (٣ من ١٤)، ص٢١٥", ["حاشية: (٣) أخرجه البخاري (٢٩٤٩)، وأبو داود (٢٦٠٥)، وابن أبي شيبة ١٢/ ٥١٦، وأحمد (١٥٧٨١)، والطبراني في الكبير ١٩/ (١١٠)، والنسائي في الكبرى (٨٧٨٧).", "حاشية: (٤) سقطت من (ظ).", "يا أمير المؤمنين لقد ولدته أمه وهي ميتة. قال: ويحك، وكيف ذاك؟! قال: خرجت في بعث كذا وكذا وتركتها حاملا، وقلت: أستودع الله ما في بطنك. فلما قدمت من سفري أخبرت أنها قد ماتت، فبينا أنا ذات ليلة قاعد في البقيع مع بني عم لي إذ نظرت فإذا ضوء شبيه بالسراج في المقابر، فقلت لبني عمي: ما هذا؟ قالوا: لا ندري، غير أنا نرى هذا الضوء كل ليلة عند قبر فلانة. فأخذت معي فأسا ثم انطلقت نحو القبر فإذا القبر مفتوح وإذا هو في حجر أمه، فدنوت فنادى لي مناد: أيها المستودع ربه خذ وديعتك أما والله لو استودعته أمه لوجدتها حية(١). فأخذت الصبي وانضم القبر.", "**السادسة:** إذا حصل على باب الدار فليقل: بسم الله، توكلت على الله، لا حول ولا قوة إلا بالله، رب أعوذ بك أن أضل أو أزل، أو أظلم أو أظلم، أو أجهل أو يجهل علي، اللهم إني لم أخرج أشرا ولا بطرا ولا رياء ولا سمعة، خرجت اتقاء سخطك وابتغاء مرضاتك وقضاء لفرضك، واتباعا لسنة نبيك، وشوقا إلى لقائك، فإذا مشى قال: اللهم بك انتشرت، وعليك توكلت، وبك اعتصمت وإليك توجهت، اللهم أنت ثقتي ورجائي فاكفني ما أهمني وما لا أهتم به وما أنت أعلم به مني، عز جارك، وجل ثناؤك ولا إله غيرك، اللهم زودني التقوى واغفر لي ذنبي، ووجهني للخير أينما توجهت. ويدعو بهذا الدعاء في كل منزل تحل عنه.", "**السابعة:** في الركوب؛ فإذا ركب الراحلة فليقل: بسم الله وبالله، الله أكبر الله أكبر، سبحان الذي سخر لنا هذا وما كنا له مقرنين، وإنا إلى ربنا لمنقلبون، اللهم أنت الصاحب في السفر، والخليفة في الأهل والمال والولد، اللهم إني أسألك في سفري هذا ا لبر والتقوى، ومن العمل ما ترضى، اللهم هون علينا السفر واطو لي البعيد، اللهم إني أعوذ بك من وعثاء السفر وكآبة المنظر وسوء المنقلب في المال والأهل، ومن الحور بعد الكور(٢)، اللهم اقبض لي الأرض وهون علي السفر.", "حاشية: (١) سقطت من (ظ).", "حاشية: (٢) ورد في هامش (ظ) ما نصه: «الوعثاء هي المشقة، والحور بعد الكور الانقلاب من طاعة إلى معصية».", "وليرفق بالدابة ولا يحملها ما لا تطيق، ولا يضرب وجهها ولا ينام عليها مهما أمكن، فقد قال أبو الدرداء لبعير له: أيها البعير لا تخاصمني إلى ربك فإني لم أكن أحملك فوق طاقتك. ولينزل عنها في وقت فيجمع بذلك بين ترويحها وطيب(١) قلب المكاري ورياضة بدنه بالمشي، فقد قال عليه الصلاة والسلام: «اركبوا هذه الدواب سالمة(٢) ولا تتخذوها كراسي»(٣).", "وليكن أكثر سيره بالليل، فقد قال عليه الصلاة والسلام: «عليكم بالدلجة، فإن الأرض تطوى بالليل»(٤)."]], "ic": "book"}, {"story": ["الباب الثاني في ترتيب الأعمال الظاهرة من أول السفر إلى الرجو (٤ من ١٤)، ص٢١٧", ["**الثامنة:** في النزول؛ فإذا نزل منزلا فليجتنب النزول في الطريق، روى مسلم في أفراده من حديث أبي هريرة عن النبي صلى الله عليه وسلم أنه قال: «إذا عرستم فاجتنبوا الطرق، فإنها طرق الدواب، ومأوى الهوام بالليل»(٥). وفي أفراده من حديث خولة بنت حكيم عن النبي صلى الله عليه وسلم أنه قال: «من نزل منزلا ثم قال: أعوذ بكلمات الله التامات من شر ما خلق، لم يضره شيء حتى يرتحل من منزله ذلك»(٦).", "وأخبرنا ابن الحصين قال: أنبأنا ابن المذهب قال: أنبأنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا أبو المغيرة قال: حدثنا صفوان عن شريح بن عبيد الحضرمي أنه سمع الزبير بين الوليد يحدث عن عبد الله بن", "حاشية: (١) تحرفت في الأصل إلى: «طلب».", "حاشية: (٢) في الأصل: «سائرة».", "حاشية: (٣) أخرجه أحمد (١٥٦٣٩) و(١٥٦٤١)، والدارمي ٢/ ٢٨٦، وابن خزيمة (٢٥٤٤)، وابن حبان (٥٦١٩)، والطبراني في الكبير ٢٠/ (٤٣١)، والحاكم ١/ ٤٤٤، والبيهقي في السنن ٥/ ٢٥٥ من حديث معاذ بن أنس.", "حاشية: (٤) أخرجه أحمد (١٤٢٧٧) و(١٥٠٩١)، وعبد الرزاق (٩٢٤٧) وابن خزيمة (٢٥٤٨) و(٢٥٤٩)، وابن السني في عمل اليوم والليلة (٥٢٣) وابن ماجه (٣٢٩) بأطول مما هنا من حديث جابر. والدلجة: السير بالليل.", "حاشية: (٥) أخرجه مسلم (١٩٢٦)، وأحمد (٨٩١٨)، والترمذي (٢٨٥٨) وابن خزيمة (٢٥٥٠) و(٢٥٥٦)، وقوله: «عرستم» أي: نزلتم آخر الليل.", "حاشية: (٦) أخرجه مسلم (٢٧٠٨)(٥٤)، وأحمد (٢٧١٢٠ ـ ٢٧١٢٣) و(٢٧١٢٦) و(٢٧٣١٠)، والبخاري في خلق أفعال العباد: ٨٩ ـ ٩٠، والترمذي (٣٤٣٧)، والنسائي في الكبرى (١٠٣٩٤).", "عمر قال: كان رسول الله صلى الله عليه وسلم إذا غزا أو سافر فأدركه الليل قال: «يا أرض ربي وربك الله، أعوذ بالله من شرك وشر ما فيك، وشر ما خلق فيك، وشر ما دب عليك، أعوذ بالله من شر كل أسد وأسود، وحية وعقرب، ومن شر ساكن البلدن ومن شر والد وما ولد»(١).", "فإذا أراد أن يرتحل من المنزل صلى ركعتين، فقد روى أنس بن مالك عن النبي صلى الله عليه وسلم أنه كان إذا سافر فنزل منزلا، فأراد أن يرتحل صلى ركعتين(٢).", "**التاسعة:** في الحراسة، ينبغي أن لا يمشي وحده خصوصا بالليل، وفي أفراد البخاري من حديث ابن عمر عن النبي صلى الله عليه وسلم أنه قال: «لو يعلم الناس ما في الوحدة ما سار أحد وحده بليل أبدا»(٣).", "وليتناوب الرفقاء بالليل في الحراسة لئلا تفوت الصلاة.", "**العاشرة:** أنه إذا علا نشزا(٤) من الأرض كبر ثلاثا، وقال: «اللهم لك الشرف على كل شرف، ولك الحمد على كل حال»(٥) فإذا هبط سبح(٦)."]], "ic": "book"}, {"story": ["الباب الثاني في ترتيب الأعمال الظاهرة من أول السفر إلى الرجو (٥ من ١٤)، ص٢١٨", ["حاشية: (١) أخرجه أحمد (٦١٦١)، وأبو داود (٢٦٠٣)، وابن خزيمة (٢٥٧٢)، والنسائي في الكبرى (١٠٣٩٨)، والحاكم ١/ ٤٤٦ ـ ٤٤٧ و٢/ ١٠٠، والبيهقي في السنن ٥/ ٢٥٣، والأسود: هو الحية العظيمة التي فيها سواد، وهو أخبث الحيات، وساكن البلد: هم الجن الذين هم سكان الأرض، فالبلد من الأرض ما كان مأولى للحيوان، وإن لم يكن فيه بناء ومنزل، وقيل: يحتمل أن المراد بالوالد إبليس، وما ولد: الشياطين، وقيل: يحتمل أن المراد كل والد ومولود على عموم النكرة في الإثبات.", "حاشية: (٢) أخرجه أبو يعلى (٣٣١٥) و(٤٣١٦)، والدارمي ٢/ ٢٨٩، والبزار (٧٤٧).", "حاشية: (٣) أخرجه البخاري (٢٩٩٨)، وأحمد (٤٧٤٨) و(٤٧٧٠) و(٥٢٥٢)، وعبد بن حميد (٨٢٤) والدارمي ٢/ ٢٨٩، والبيهقي في السنن ٥/ ٢٥٧، وابن خزيمة (٢٥٦٩)، والحاكم ٢/ ١٠١.", "حاشية: (٤) أي: عاليا من الأرض.", "حاشية: (٥) أخرجه أحمد (١٢٢٨١)، وأبو يعلى (٤٢٩٧)، والطبراني في الدعاء (٨٤٩) وابن السني في عمل اليوم والليلة (٥٢٢)، وابن عدي في الكامل ٥/ ١٧٣٥ والبيهقي في الدعوات الكبير (٤١٣).", "حاشية: (٦) لحديث جابر رضي الله عنه قال: كنا إذا صعدنا كبرنا، وإذا نزلنا سبحنا. أخرجه البخاري (٢٩٩٣) و(٢٩٩٤).", "**الجملة الثانية:** في آداب الإحرام من الميقات إلى دخول مكة، وهي خمسة:", "**الأول:** أن يغتسل إذا بلغ الميقات، وينوي به غسل الإحرام، ويتنظف بتقليم الأظفار، وحلق العانة، وقص الشارب إلى غير ذلك، فإن لم يجد ماء تيمم.", "**الثاني:** أن يفارق مخيط الثياب ويلبس ثوبي إحرامه، فيأتزر بإزار ويرتدي برداء أبيضين نظيفين ويتطيب لإحرامه، وفي الصحيحين من حديث عائشة قالت: طيبت رسول الله صلى الله عليه وسلم لحرمه حين أحرم ولحله حين أحل بطيب فيه مسك(١).", "**الثالث:** أن يصلي ركعتين ثم يحرم عقيبهما، وإن شاء أحرم إذا استوت به راحلته، فينوي الإحرام بقلبه ثم يلبي، فيقول: لبيك اللهم لبيك، لبيك لا شريك لك لبيك، إن الحمد والنعمة لك والملك لا شريك لك(٢).", "**الرابع:** أن يعين ما أحرم به، ويشترط فيقول: اللهم إني أريد النسك الفلاني فيسره لي وتقبل مني، ومحلي حيث حبستني.", "**الخامس:** تجديد التلبية عقيب الصلوات وإذا علا نشزا أو هبط واديا، وإذا لقي ركبا، وفي إقبال الليل والنهار وبالأسحار، وإذا سمع ملبيا أو فعل محظورا ناسيا، وفي جميع مساجد الحرم وبقاعه.", "**الجملة الثالثة:** في آداب دخول مكة إلى الطواف، وهي ستة:", "**الأول:** أن يغتسل لدخول مكة، وقد ذكرنا الأغسال المستحبة فيما يتعلق بالحج في كتاب الطهارة(٣).", "**الثاني:** أن يقول عند الدخول إلى الحرم: اللهم هذا حرمك وأمنك، فحرم لحمي ودمي وبشري على النار، وآمني من عذابك، واجعلني من أوليائك."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "الأول: شروط الصلاة؛ من طهارة الحدث والنجس في الثوب والبدن والمطاف وستر العورة، فإن الطواف بالبيت صلاة لكن الله تعالى أباح فيه الكلام، وليضطبع قبل الابتداء بالطواف، وهو أن ____ وسط ردائه تحت عاتقه", "o": ["يجعل", "مفارقة", "وبصمته", "مختصره"], "h": "راجع: ص٢٢٠"}, {"t": "fill", "d": 2, "q": "الرابع: أن يعين ما أحرم به، ويشترط فيقول: اللهم إني ____ النسك الفلاني فيسره لي وتقبل مني، ومحلي حيث", "o": ["أريد", "وأوحده", "كافرا", "داره"], "h": "راجع: ص٢١٩"}, {"t": "fill", "d": 2, "q": "السادس: أن ينصرف بعد ذلك إلى المقام فيصلي خلفه ركعتين يقرأ في الأولى بعد الفاتحة بقل يا أيها الكافرون، وفي الثانية بقل هو ____ أحد، ثم يعد إلى الحجر", "o": ["الله", "الفرجة", "روعي", "ومردود"], "h": "راجع: ص٢٢٢"}, {"t": "fill", "d": 2, "q": "التاسعة: في الحراسة، ينبغي أن لا يمشي وحده خصوصا بالليل، وفي أفراد البخاري من حديث ابن عمر عن النبي صلى الله عليه ____ أنه قال: «لو يعلم الناس ما في الوحدة ما سار أحد وحده بليل", "o": ["وسلم", "تضرعت", "عياش", "أبقى"], "h": "راجع: ص٢١٨"}, {"t": "fill", "d": 2, "q": "وليكن أكثر سيره بالليل، فقد قال عليه ____ والسلام", "o": ["الصلاة", "منقولة", "فيتلذذ", "الابتلاء"], "h": "راجع: ص٢١٧"}, {"t": "fill", "d": 2, "q": "الخامس: أنه إذا وقع بصره على البيت يرفع يديه ويقول: اللهم أنت السلام ومنك السلام فحينا ربنا بالسلام، اللهم زد هذا البيت تعظيما وتكريما ____ ومهابة وبرا، وزد من عظمه وشرفه ممن حجه أو اعتمره", "o": ["وتشريفا", "مستوفى", "وصلاته", "الجلي"], "h": "راجع: ص٢٢٠"}]}, {"t": "الباب الثاني في ترتيب الأعمال الظاهرة من أول السفر إلى الرجوع - القسم ٢ من ٣", "b": [{"story": ["الباب الثاني في ترتيب الأعمال الظاهرة من أول السفر إلى الرجو (٦ من ١٤)، ص٢١٩", ["حاشية: (١) أخرجه البخاري (١٥٣٩) و(١٧٥٤) و(٥٩٢٢) و(٥٩٢٨)، ومسلم (١١٨٩) دون قولها: «بطيب فيه مسك» وهي رواية عند مسلم (١١٩١).", "حاشية: (٢) أخرجه البخاري (١٥٤٩)، ومسلم (١١٨٤) من حديث ابن عمر.", "حاشية: (٣) تقدم في الصفحة ٩٨.", "**الثالث:** أن يدخل مكة من أعلاها من ثنية كداء، فإذا خرج خرج من أسفلها من ثنية كدى، والأول بفتح الكاف مع المد والثاني بضمها مع القصر.", "ففي الصحيحين من حديث عائشة أن النبي صلى الله عليه وسلم لما جاء إلى مكة دخلها من أعلاها وخرج من أسفلها(١).", "**الرابع:** أن يدخل المسجد الحرام من باب بني شيبة، وليقل: بسم الله، ومن الله، وإلى الله، اللهم افتح لي أبواب فضلك.", "**الخامس:** أنه إذا وقع بصره على البيت يرفع يديه ويقول: اللهم أنت السلام ومنك السلام فحينا ربنا بالسلام، اللهم زد هذا البيت تعظيما وتكريما وتشريفا ومهابة وبرا، وزد من عظمه وشرفه ممن حجه أو اعتمره تعظيما وتشريفا ومهابة وبرا(٢)، الحمد لله رب العالمين كثيرا كما هو أهله، وكما ينبغي لكرم وجهه وعز جلاله، والحمد لله الذي بلغني بيته ورآني لذلك أهلا، والحمد لله على كل حال، اللهم إنك دعوت إلى حج بيتك وقد جئناك لذلك، اللهم تقبل مني واعف عني، وأصلح لي شأني كله، لا إله إلا أنت. يرفع بذلك صوته.", "**السادس:** أن يقصد الحجر الأسود بعد ذلك ويمسه بيده اليمنى ويقبله، فإن لم يستطع وقف حياله، ثم يطوف طواف القدوم.", "**الجملة الرابعة: في الطواف:**", "ينبغي أن يراعى للطواف ستة أشياء:", "**الأول:** شروط الصلاة؛ من طهارة الحدث والنجس في الثوب والبدن والمطاف وستر العورة، فإن الطواف بالبيت صلاة لكن الله تعالى أباح فيه الكلام، وليضطبع قبل الابتداء بالطواف، وهو أن يجعل وسط ردائه تحت عاتقه الأيمن ويطرح طرفه على عاتقه الأيسر.", "حاشية: (١) أخرجه البخاري (١٥٧٧) ـ (١٥٨١) و(٤٢٩٠) و(٤٢٩١)، ومسلم (١٢٥٨).", "حاشية: (٢) إلى هنا أخرجه الشافعي في مسنده ١/ ٣٣٨ ـ ٣٣٩ موقوفا على سعيد بن المسيب.", "**الثاني:** أن يجعل البيت عن يساره، ويبتدئ من الحجر الأسود، وليكن قدامه ليمر الحجر بجميع بدنه في ابتداء طوافه، وليقرب في طوافه من البيت قدر ثلاث خطوات لئلا يطوف على الشاذروان(١)، فإنه لا يجزئه."]], "ic": "book"}, {"story": ["الباب الثاني في ترتيب الأعمال الظاهرة من أول السفر إلى الرجو (٧ من ١٤)، ص٢٢١", ["**الثالث:** أن يقول قبل مجاوزة الحجر في ابتداء الطواف: بسم الله والله أكبر، إيمانا بك، وتصديقا بكتابك، ووفاء بعهدك، واتباعا لسنة نبيك محمد صلى الله عليه وسلم. فأول ما يجاوز الحجر ينتهي إلى باب البيت فيقول: اللهم هذا البيت بيتك، وهذا الحرم حرمك، وهذا الأمن أمنك، وهذا مقام العائذ بك من النار. فإذا بلغ الركن العراقي فليقل: اللهم إني أعوذ بك من الشرك والشك والكفر والشقاق والنفاق وسوء الأخلاق. فإذا بلغ الميزاب قال: اللهم أظلني تحت عرشك يوم لا ظل إلا ظلك، اللهم اسقني بكأس محمد صلى الله عليه وسلم شربة لا أظمأ بعدها أبدا. فإذا بلغ الركن الشامي قال: اللهم اجعله حجا مبرورا، وسعيا مشكورا، وذنبا مغفورا، وتجارة لن تبور يا عزيز يا غفور، رب اغفر وارحم، وتجاوز عما تعلم، وأنت الأعز الأكرم. فإذا بلغ الركن اليماني قال: ربنا آتنا في الدنيا حسنة وفي الآخرة حسنة وقنا عذاب النار. فيطوف كذلك سبعة أشواط ويدعو في طوافه بما أحب.", "**الرابع:** أن يرمل في ثلاثة أشواط، ويمشي في الأربعة الأخيرة.", "والرمل أسرع من المشي مع تقارب الخطا، وكان المقصود منه ومن الاضطباع حين حج رسول الله صلى الله عليه وسلم إظهار القوة والجلد؛ لأن الكفار استضعفوا المسلمين فأمروا بذلك، فبقيت تلك السنة، وفي الصحيحين من حديث ابن عباس قال: قدم رسول الله صلى الله عليه وسلم وأصحابه وقد وهنتهم حمى يثرب فقال المشركون: إنه يقدم عليكم قوم قد وهنتهم حمى يثرب ولقوا منها شرا، فجلس المشركون(٢) من الناحية التي تلي الحجر، فأطلع الله نبيه على ما قالوا، فأمرهم رسول الله صلى الله عليه وسلم أن يرملوا الأشواط الثلاثة ليرى المشركون جلدهم، ولم يمنعه أن يأمرهم أن يرملوا الأشواط", "حاشية: (١) شاذروان الكعبة: هو القدر الذي ترك خارجا عن عرض الجدار، مرتفعا عن وجه الأرض قدر ثلثي ذراع، بعد أن ضيق أعلى الجدار، وهو من البيت.", "حاشية: (٢) في (ظ): «المسلمون».", "كلها إلا الإبقاء عليهم، فقال المشركون: هؤلاء الذين زعمتم أن الحمى قد وهنتهم؟! هؤلاء أجلد من كذا وكذا(١).", "ومن أمكنه أن يستلم الحجر في كل شوط فهو الأفضل، فإن منعه الزحام أشار إليه بيده وقبل يده، وكذلك يستلم الركن اليماني ويقبل يده ولا يقبله ليختص الحجر باللمس والتقبيل.", "**الخامس:** إذا أتم الطواف سبعا(٢) فليأت الملتزم، وهو ما بين الحجر والباب، وليلصق بطنه بالبيت، ويضع عليه خده الأيمن، ويبسط عليه ذراعيه وكفيه، ويقول: اللهم يا رب البيت العتيق اعتق رقبتي من النار، هذا مقام العائذ بك.", "**السادس:** أن ينصرف بعد ذلك إلى المقام فيصلي خلفه ركعتين يقرأ في الأولى بعد الفاتحة بقل يا أيها الكافرون، وفي الثانية بقل هو الله أحد، ثم يعد إلى الحجر فيستلمه.", "**الجملة الخامسة في السعي:**"]], "ic": "book"}, {"story": ["الباب الثاني في ترتيب الأعمال الظاهرة من أول السفر إلى الرجو (٨ من ١٤)، ص٢٢٢", ["فإذا فرغ من الطواف فليخرج من باب الصفا، فيرقى عليه بقدر قامة الرجل ثم يكبر ثلاثا ويقول: الحمد لله على ما هدانا، لا إله إلا الله وحده لا شريك له، له الملك وله الحمد يحيي ويميت بيده الخير، وهو على كل شيء قدير، لا إله إلا الله وحده لا شريك له، صدق وعده، ونصر عبده، (٣-٣)وأعز جنده(٣-٣)، وهزم الأحزاب وحده، لا إله إلا الله، لا نعبد إلا إياه مخلصين له الدين ولو كره الكافرون. ثم ينزل من الصفا ويمشي حتى يكون بينه وبين الميل الأخضر المعلق بفناء المسجد نحو ستة أذرع، ثم يسعى سعيا شديدا حتى يحاذي الميلين الأخضرين اللذين بفناء المسجد وحذاء دار العباس، ثم يمشي حتى يصعد المروة ويفعل مثل ما فعل على الصفا، ويستحب أن لا يسعى إلا متطهرا مستترا، وقد نقل الأثرم أن الطهارة في", "حاشية: (١) أخرجه البخاري (١٦٠٢) و(٤٢٥٦)، ومسلم (١٢٦٦).", "حاشية: (٢) تحرفت في الأصل إلى: «سعيا».", "حاشية: (٣-٣) سقط من (ظ).", "السعي كالطهارة في الطواف، والموالاة شرط في الطواف والسعي، فإن خرج لحاجة وتطاول الفصل ابتدأ، أو إن كان يسيرا بنى، ويتخرج أن الموالاة سنة.", "**الجملة السادسة في الوقوف وما قبله:**", "إن انتهى الحاج إلى عرفة يوم عرفة فإنه لا يتفرغ لطواف القدوم ودخول مكة قبل الوقوف، فإن وصل قبل ذلك بأيام وطاف طواف القدوم فمكث محرما، فإنه إذا كان يوم التروية، وهو اليوم الثامن من ذي الحجة، يخرج إلى منى فيصلي بها الظهر والعصر والمغرب والعشاء، ويبيت بها ثم يصلي بها الصبح، فإذا طلعت الشمس على ثبير(١) سار إلى الموقف(٢)، واغتسل للوقوف، وأقام بنمرة(٣)، وقيل: بعرنة(٤)، حتى تزول الشمس، فإذا زالت خطب الإمام خطبة يعلم الناس فيها مناسكهم من موضع الوقوف ووقته(٥)، والدفع من عرفة إلى غير ذلك، ثم ينزل فيصلي بالناس الظهر والعصر يجمع بينهما بإقامة لكل صلاة، ولا يجوز الجمع والقصر إلا لمن بينه وبين وطنه ستة عشر فرسخا(٦) فصاعدا، ثم يروح إلى الموقف، والمستحب أن يقف عند الصخرات وجبل الرحمة(٧) بقرب الإمام، ويستقبل القبلة ويكثر من الدعاء، وسيأتي في كتاب الأدعية ما ترومه من ذلك، فأما المختص بهذا اليوم؛ فقد أخبرنا أبو الفتح الكروخي قال: أخبرنا أبو عامر الأزدي وأبو نصر الترياقي وأبو بكر الغورجي قالوا: حدثنا أبو محمد الجراحي قال: حدثنا أبو العباس المحبوبي قال: أخبرني الترمذي قال: حدثنا مسلم بن عمرو(٨) الحذاء", "حاشية: (١) ثبير: جبل بين مكة ومنى على يمين الداخل منها إلى مكة.", "حاشية: (٢) أي: إلى عرفات، وهو موضع وقوف الحجيج.", "حاشية: (٣) نمرة: موضع قيل إنه من عرفات، وقيل: بقربها خارج عنها. المصباح المنير: (نمر).", "حاشية: (٤) عرنة: واد بحذاء عرفات غربي المسجد.", "حاشية: (٥) سقط من (ظ)."]], "ic": "book"}, {"story": ["الباب الثاني في ترتيب الأعمال الظاهرة من أول السفر إلى الرجو (٩ من ١٤)، ص٢٢٣", ["حاشية: (٦) الفرسخ مقياس طول يساوي ثلاثة أميال، ويقدر حاليا بنحو ستة كيلو مترات. المكاييل والأوزان الإسلامية وما يعادلها في النظام المتري ص ٩٤.", "حاشية: (٧) جبل الرحمة: جبل في وسط عرفات كانت العرب تسميه: الإل ـ بكسر الهمزة ـ.", "حاشية: (٨) سقط من الأصل.", "قال: حدثني عبد الله بن نافع عن حماد بن أبي حميد عن عمرو بن شعيب عن أبيه عن جده أن النبي صلى الله عليه وسلم قال: «خير الدعاء يوم عرفة، وخير ما قلت أنا والنبيون من قبلي: لا إله إلا الله، وحده لا شريك له، له الملك وله الحمد، وهو على كل شيء قدير»(١).", "وفي حديث علي رضي الله عنه قال: كان أكثر دعاء رسول الله صلى الله عليه وسلم عشية عرفة: «لا إله إلا الله، وحده لا شريك له، له الملك وله الحمد يحيي ويميت، بيده الخير، وهو على كل شيء قدير اللهم اجعل في سمعي نورا وفي بصري نورا وفي قلبي نورا، اللهم اغفر لي ذنبي، ويسر لي أمري، واشرح لي صدري، اللهم إني أعوذ بك من وسواس الصدر، ومن شتات الأمر، ومن عذاب القبر، اللهم إني أعوذ بك من شر ما يلج في الليل وشر ما يلج في النهار، وشر ما تهب به الرياح، وشر بوائق الدهر»(٢).", "ووقف مطرف وبكر بن عبد الله بعرفة فقال مطرف: اللهم لا تردهم من أجلي. وقال بكر: ما أشرفه من موقف وأرجاه لأهله لولا أني فيهم.", "ووقف الفضيل بعرفة والناس يدعون وهو يبكي بكاء الثكلى المحترقة، فلما كادت الشمس تسقط قبض على لحيته ثم رفع رأسه إلى السماء وقال: واسوءتا منك وإن عفوت.", "**الجملة السابعة: في بقية أعمال الحج بعد الوقوف من المبيت والرمي والنحر والحلاق والطواف:**", "إذا أراد أن يفيض من عرفات، فليدفع بعد الغروب إلى المزدلفة على طريق المأزمين(٣)، وحد المزدلفة ما بين المأزمين ووادي محسر، ويسير وعليه السكينة والوقار، فإذا وجد فرجة أسرع، فإذا وصل إلى المزدلفة صلى بها المغرب والعشاء", "حاشية: (١) أخرجه الترمذي (٣٥٨٥).", "حاشية: (٢) أخرجه البيهقي في السنن ٥/ ١٧٤.", "حاشية: (٣) هما جبلان بين عرفة ومزدلفة."]], "ic": "book"}, {"story": ["الباب الثاني في ترتيب الأعمال الظاهرة من أول السفر إلى الرجو (١٠ من ١٤)، ص٢٢٥", ["قبل حط الرحل(١)، وإن صلى المغرب في طريق المزدلفة أجزأه، ثم يبيت بها إلى أن يطلع الفجر الثاني، ويأخذ منها حصى الجمار، ومن حيث أخذ جاز، ويكون الحصى أكبر من الحمص ودون البندق، وعدده سبعون حصاة، وهل يسن غسله؟ فيه روايتان عن الإمام أحمد رحمه الله، وإن دفع بعد نصف الليل جاز، وإن دفع قبل نصف الليل لزمه دم، فإن وافى مزدلفة بعد نصف الليل، فلا دم عليه، وإن وافاه بعد طلوع الفجر، فعليه دم، ثم يصلي صلاة الفجر بالمزدلفة في أول الوقت، ثم يأتي المشعر الحرام، فيرقى عليه إن أمكنه وإلا وقف عنده، فيحمد الله ويهلله ويكبره ويدعو، ويقول في دعائه: اللهم كما وفقتنا فيه وأريتنا إياه، فوفقنا لذكرك كما هديتنا، واغفر لنا وارحمنا كما وعدتنا بقولك وقولك الحق: ﴿فَإِذَآ أَفَضْتُم مِّنْ عَرَفَٰتٍ﴾ يقرأ إلى قوله: ﴿غَفُورٌ رَّحِيمٌ﴾(٢) [البقرة: ١٩٨ ـ ١٩٩]. فإذا أسفر دفع قبل طلوع الشمس، فإذا بلغ وادي محسر سعى إن كان ماشيا، وحرك إن كان راكبا قدر رمية بحجر، فإذا وصل إلى منى بدأ بجمرة العقبة فيرمي إليها بسبع حصيات واحدة بعد واحدة يكبر مع كل حصاة، ويعلم حصولها في المرمى، فإن رمى بغير الحصى مثل الكحل والرخام والبرام(٣) والذهب والفضة، أو أخذ حجرا من المرمى قد رمي به فرمى به لم يجزه، ويرفع يده في الرمي حتى يرى بياض إبطه، والأولى أن يكون ماشيا، ويقطع التلبية والتكبير مع أول حصاة، إلا التكبير عند عقيب الفرائض، فإنه يكبر عقيب صلاة الظهر يوم النحر إلى عقيب العصر من آخر أيام التشريق، وصفة التكبير: الله أكبر الله أكبر، لا إله إلا الله، والله أكبر الله أكبر، ولله الحمد، وإنما يكبر إذا صلى في جماعة، وهل يكبر المنفرد؟ فيه روايتان عن الإمام أحمد.", "فإذا رمى السبع لم يقف عندها، ويرمي بعد طلوع الشمس، فإن رمى بعد نصف الليل أجزأه، ثم ليذبح الهدي إن كان معه، وقد روت عائشة عن النبي صلى الله عليه وسلم أنه قال:", "حاشية: (١) في الأصل: «الرحال».", "حاشية: (٢) هو جزء من حديث جابر الطويل في حجة النبي صلى الله عليه وسلم أخرجه مسلم (١٢١٨).", "حاشية: (٣) البرام: جمع برمة، وهي القدر من الحجر، فلا تجزئ الأحجار المكسرة منها في الرمي.", "«ما عمل ابن آدم يوم النحر من عمل أحب إلى الله من هراقة دم، وإنها لتأتي يوم القيامة بقرونها وأشعارها وأظلافها، وإن الدم ليقع من الله بمكان قبل أن يقع إلى الأرض، فطيبوا بها نفسا»(١).", "والأولى أن يذبحها بيده، أخبرنا عبد الرحمن بن محمد القزاز قال: أخبرنا عبد الصمد بن المأمون قال: أخبرنا ابن حبابة قال: حدثنا البغوي قال: حدثنا أبو نصر التمار قال: حدثنا أبان بن يزيد عن قتادة عن أنس بن مالك أن رسول الله صلى الله عليه وسلم ذبح أضحيته بيد نفسه وكبر عليها(٢)."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "الثالثة: أن يودع رفقاءه وإخوانه المقيمين، ويلتمس أدعيتهم، ويقول لمن يودعه: أستودع الله دينك وأمانتك وخواتيم عملك. كذلك روى ابن عمر وأبو هريرة أن النبي صلى الله ____ وسلم كان إذا ودع أحدا قال له", "o": ["عليه", "تجعلها", "معطي", "مفازة"], "h": "راجع: ص٢١٤"}, {"t": "fill", "d": 2, "q": "والرمل أسرع من المشي مع تقارب الخطا، وكان المقصود منه ومن الاضطباع حين حج رسول الله صلى الله عليه وسلم إظهار القوة والجلد؛ لأن الكفار استضعفوا المسلمين فأمروا بذلك، فبقيت تلك السنة، وفي الصحيحين من ____ ابن عباس قال", "o": ["حديث", "وسيلة", "عطاء", "منامي"], "h": "راجع: ص٢٢١"}, {"t": "fill", "d": 2, "q": "روى ابن عمر عن النبي صلى الله عليه ____ أنه قال", "o": ["وسلم", "الثمرة", "معرفة", "برضاك"], "h": "راجع: ص٢٢٩"}, {"t": "fill", "d": 2, "q": "الخامس: إذا أتم الطواف سبعا فليأت الملتزم، وهو ما بين الحجر والباب، وليلصق بطنه بالبيت، ويضع عليه خده الأيمن، ويبسط عليه ذراعيه وكفيه، ويقول: اللهم يا رب البيت العتيق اعتق ____ من النار، هذا", "o": ["رقبتي", "مبين", "بالتقدم", "للأوراد"], "h": "راجع: ص٢٢٢"}, {"t": "fill", "d": 2, "q": "وأخبرنا ابن الحصين قال: أنبأنا ابن المذهب قال: أنبأنا أحمد بن جعفر قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا أبو المغيرة قال: حدثنا صفوان عن ____ بن عبيد الحضرمي أنه سمع الزبير بين الوليد", "o": ["شريح", "يقبلها", "يدها", "فرجة"], "h": "راجع: ص٢١٧"}, {"t": "fill", "d": 2, "q": "فإن ترك المبيت ليالي منى لزمه دم، فإن ترك ليلة واحدة ____ الروايات الأربع", "o": ["ففيها", "سلوا", "قرنها", "وملبسه"], "h": "راجع: ص٢٢٨"}]}, {"t": "الباب الثاني في ترتيب الأعمال الظاهرة من أول السفر إلى الرجوع - القسم ٣ من ٣", "b": [{"story": ["الباب الثاني في ترتيب الأعمال الظاهرة من أول السفر إلى الرجو (١١ من ١٤)، ص٢٢٦", ["فإن لم يحسن الذبح فالأفضل أن يشهدها، فقد روى أبو سعيد عن النبي صلى الله عليه وسلم أنه قال لفاطمة رضي الله عنها: «قومي إلى أضحيتك فاشهديها، فإن لك بأول قطرة تقطر من دمها أن يغفر لك ما سلف من ذنوبك»(٣).", "والأفضل عندنا في الأضاحي الإبل ثم البقر ثم الغنم. وأفضل الأضاحي الشهب(٤) ثم الصفر ثم السود، وتجزئ الشاة الواحدة عن واحد، والبدنة والبقرة عن سبعة، والضأن أفضل من المعز، ولا يجزئ ما فيه عيب ينقص به اللحم، فلا تجزئ العضباء القرن والأذن، وهي التي ذهب أكثر قرنها وأذنها، ولأصحابنا في الجماء(٥) وجهان، ولا تجزئ(٦) العوراء البين عورها، وهي التي قد انخسفت عينها وذهبت، والعجفاء التي لا تنقى، وهي الهزيلة التي لا نقي(٧) لها، والعرجاء البين ظلعها فلا تقدر على المشي مع الغنم ولا على مشاركتهن في العلف،", "حاشية: (١) أخرجه الترمذي (١٤٩٣)، وابن ماجه (٣١٢٦)، والبغوي في شرح السنة ٤/ ٣٤٢، والحاكم ٤/ ٢٢١ ـ ٢٢٢.", "حاشية: (٢) أخرجه البخاري (٥٥٥٨) و(٥٥٦٥)، ومسلم (١٩٦٦).", "حاشية: (٣) أخرجه البيهقي في السنن ٦/ ٢٨٣، والحاكم ٤/ ٢٤٧، والبزار في كشف الأستار (١٢٠٢)، والمنذري في الترغيب والترهيب (١٦٢٢).", "حاشية: (٤) الشهب: جمع شهباء وهي البيضاء النقية البياض.", "حاشية: (٥) الجماء: هي التي لم يخلق لها قرن.", "حاشية: (٦) في (ظ): «لا يجوز».", "حاشية: (٧) سقط من (ظ).", "والمريضة البين مرضها، وهي الجرباء لأن جربها يفسد اللحم.", "فأما قول علي رضي الله عنه: «لا يضحى بمقابلة ولا مدابرة ولا خرقاء ولا شرقاء»(١). فإنه نهي تنزيه، والإجزاء بقع، والمقابلة: التي قطع شيء من مقدم أذنها وبقي معلقا، والمدابرة: التي قطع شيء من مؤخر أذنها، والخرقاء: التي قد ثقب الكي أذنها، والشرقاء: التي شق الكي أذنها، ويجزئ الخصي.", "ويستحب أن تنحر الإبل قائمة معقلة، ويذبح ما سواها. وأيام النحر ثلاثة؛ يوم العيد ويومان بعده، فإذا خرج وقت النحر ذبح الواجب قضاء، وهل يجوز ذبح الأضاحي في الليل؟ فيه عن الإمام أحمد روايتان. ولا يجوز بيع جلودها ولا جلالها بل يتصدق به، والمسنون أن يأكل الثلث، ويتصدق بالثلث، ويهدي الثلث."]], "ic": "book"}, {"story": ["الباب الثاني في ترتيب الأعمال الظاهرة من أول السفر إلى الرجو (١٢ من ١٤)، ص٢٢٧", ["فإذا ذبح حلق أو قصر جميع(٢) رأسه، وفي الأخرى يجزئه بعضه كالمسح(٣)، فإن لم يكن له شعر استحب أن يمر الموسى على رأسه، والمرأة تقصر من شعرها قدر الأنملة، وإذا حلق حل له كل محظور في الحج إلا النساء، ثم يفيض إلى مكة، ويطوف طواف الزيارة، وأول وقته بعد نصف الليل من ليلة النحر، وأفضل وقته يوم النحر، ولا آخر لوقته، إلا أنه يبقى معلقا بعلقة الإحرام فلا تحل له النساء حتى يطوف، فإذا طاف سعى إلا أن يكون قد سعى بعد طواف القدوم، فيكفي، والأحسن أن يرمي ثم يذبح ثم يحلق ثم يطوف، فإن قدم الحلاق على الرمي أو على النحر جاهلا بالسنة، فلا شيء عليه، فإذا فرغ من الطواف عاد إلى منى ليبيت بها ثلاث ليال إلا أن يختار التعجيل في يومين، ويرمي الجمرات الثلاث في أيام التشريق بعد الزوال كل جمرة كل يوم بسبع حصيات، كما وصفنا في جمرة العقبة، فيبدأ بالجمرة الأولى وهي أبعد الجمرات من مكة وتلي مسجد الخيف، فيجعلها عن يساره ويستقبل القبلة ويرميها، ثم يتقدم عنها إلى", "حاشية: (١) أخرجه أبو داود (٢٨٠٤)، والنسائي في الكبرى (٤٤٤٦ ـ ٤٤٤٩)، وابن ماجه (٣١٤٢ ـ ٣١٤٤)، والترمذي (١٤٩٨).", "حاشية: (٢) سقطت من الأصل.", "حاشية: (٣) سقطت من (ظ).", "موضع لا يصيبه الحصى، ويقف بقدر قراءة سورة البقرة يدعو الله تعالى، ثم يرمي الجمرة الوسطى ويجعلها عن يمينه ويستقبل القبلة ويقف ويدعو كما فعل في الأولى، ثم يرمي جمرة العقبة ويجعلها عن يمينه، ويستبطن الوادي ويستقبل ا لقبلة ولا يقف عندها.", "ومن ترك الرمي حتى انقضت أيام التشريق فعليه دم، فإن ترك حصاة ففيها أربع روايات: إحداهن: يلزمه دم، والثانية: مد، وفي حصاتين مدان، وفي ثلاثة دم. والثالثة: يلزمه نصف درهم. والرابعة: لا شيء عليه.", "فإن ترك المبيت ليالي منى لزمه دم، فإن ترك ليلة واحدة ففيها الروايات الأربع. ومن نفر في اليوم الثاني قبل غروب الشمس دفن ما بقي معه من الحصى، وإن أقام إلى غروب الشمس لزمه البيتوتة والرمي من الغد، وإذا نفر استحب له أن يأتي الأبطح وهو المحصب وحده ما بين الجبلين إلى المقبرة، فيصلي به الظهر والعصر والمغرب والعشاء، ثم يهجع يسيرا ثم يدخل مكة.", "**الجملة الثامنة في صفة العمرة وما بعدها إلى طواف الوداع:**", "العمرة واجبة، وأركانها: الإحرام، والطواف، والسعي على إحدى الروايتين.", "وواجبها: الحلاق على إحدى الروايتين.", "وأما سننها: فالغسل للإحرام، والأذكار المشروعة في الطواف والسعي، فمن أراد العمرة أحرم من الميقات بعد أن يغتسل ويتطيب، ويصلي ركعتين، فإن كان بمكة خرج إلى أدنى الحل فأحرم، والأفضل أن يحرم من التنعيم ثم يطوف بالبيت ويسعى ويحلق أو يقصر، وقد حل."]], "ic": "book"}, {"story": ["الباب الثاني في ترتيب الأعمال الظاهرة من أول السفر إلى الرجو (١٣ من ١٤)، ص٢٢٨", ["وينبغي للمقيم بمكة أن يكثر من الاعتمار والطواف والنظر إلى البيت، وإذا دخله صلى بين العمودين المقدمين، ويكثر من شرب ماء زمزم، فقد قال صلى الله عليه وسلم: «ماء زمزم لما شرب له»(١). ويستحب لمن شرب منه أن يقول: بسم الله، اللهم اجعله", "حاشية: (١) أخرجه أحمد (١٤٨٤٩)، والطبراني في الأوسط (٨٥٣) و(٩٠٢٣)، وابن عدي في الكامل ٤/ ١٤٥٥ وابن أبي شيبة ٨/ ٩٥، وابن ماجه (٣٠٦٢)، والعقيلي في الضعفاء ٢/", "حاشية (تتمة): ٣٠٣، والبيهقي في السنن ٥/ ١٤٨، والأزرقي في أخبار مكة ٢/ ٥٢ من حديث جابر.", "لنا علما نافعا، ورزقا واسعا، وشفاء من كل داء، واغسل به قلبي، واملأه من خشيتك.", "وليعتمر المقيم في رمضان، ففي الصحيحين من حديث ابن عباس أن النبي صلى الله عليه وسلم قال لامرأة من الأنصار يقال لها: أم سنان: «عمرة في رمضان تقضي حجة» أو قال: «حجة معي»(١).", "**الجملة التاسعة:** في طواف الوداع: إذا عزم على الخروج فلينجز أشغاله وليشد رحله، وليجعل آخر عمله وداع البيت، وهو أن يطوف به سبعا من غير رمل ولا اضطباع، فإذا فرغ صلى ركعتين خلف المقام وأتى الملتزم ودعا، قال مجاهد: لا يقوم عبد ثم فيدعو الله بشيء إلا استجاب له. وليكن من دعائه: اللهم هذا بيتك، وأنا عبدك وابن أمتك، حملتني على ما سخرت لي من خلقك، وسيرتني في بلادك حتى بلغتني بنعمتك بيتك، وأعنتني على قضاء نسكي فإن كنت رضيت عني فازدد عني رضا، وإلا فمن الآن قبل أن تنأى عن بيتك داري، هذا أوان انصرافي إن أذنت لي غير مستبدل بك ولا ببيتك، ولا راغب عنك ولا عن بيتك، اللهم فأصحبني العافية في بدني، والصحة في جسمي، والعصمة في ديني، وأحسن منقلبي، وارزقني طاعتك ما أبقيتني، واجمع لي خير الدنيا والآخرة، إنك على كل شيء قدير.", "**الجملة العاشرة في زيارة المدينة وآدابها:**", "روى ابن عمر عن النبي صلى الله عليه وسلم أنه قال: «من حج فزار قبري بعد موتي كان كمن زارني في حياتي وصحبني»(٢) وفي لفظ آخر: «من زار قبري فقد وجبت له شفاعتي»(٣).", "حاشية: (١) أخرجه البخاري (١٧٨٢) و(١٨٦٣)، ومسلم (١٢٥٦) (٢٢١) و(٢٢٢)، وأحمد (٢٠٢٥) و(٢٨٠٨)، وابن حبان (٣٦٩٩) و(٣٧٠٠).", "حاشية: (٢) أخرجه الطبراني في الكبير (١٣٤٩٦) و(١٣٤٩٧)، وفي الأوسط (٣٣٧٦)، وابن عدي في الكامل ٢/ ٧٩٠، والبيهقي في السنن ٥/ ٢٤٦، والدارقطني ٢/ ٢٧٨، وأورده السيوطي في الدر المنثور ٢/ ٤٧٠، والألباني في السلسلة الضعيفة (٤٧).", "حاشية: (٣) أخرجه الحكيم الترمذي في نوادر الأصول ٢/ ٦٧، والبزار في كشف الأستار (١١٩٨)", "حاشية (تتمة): وابن عدي في الكامل ٦/ ٢٣٥٠، والدارقطني في السنن ٢/ ٢٧٨، والبيهقي في السنن ٥/ ٢٤٥ وأورده السيوطي في الدر المنثور ٢/ ٤٧٠، وانظر إرواء الغليل (١١٢٨)."]], "ic": "book"}, {"story": ["الباب الثاني في ترتيب الأعمال الظاهرة من أول السفر إلى الرجو (١٤ من ١٤)، ص٢٣٠", ["فمن قصد زيارة المدينة، فإذا لاحت له فليقل: اللهم هذا حرم رسولك فاجعله لي وقاية من النار. وليدخلها متواضعا معظما، وليقصد المسجد وليصل فيه، فقد سبق فضل الصلاة فيه(١)، ولتكن صلاته بين المنبر والقبر فهي الروضة، وقد سبق فضلها(٢)، وليأت قبر النبي صلى الله عليه وسلم، وليقف عند وجهه وذلك بأن يستقبل القبر ويستدبر القبلة ويجعل القنديل الذي في القبلة عند القبر على رأسه، وقد ضرب مسمار من صفر(٣) في حائط الحجرة الشريفة فإذا حاذاه القائم كان القنديل تحت رأسه.", "وليس من السنة أن يمس الجدار، ولا أن يقبله بل الوقوف من بعد أقرب إلى الاحترام، وليسلم فليقل: السلام عليك يا نبي الله، السلام عليك يا رسول الله، السلام عليك يا سيد المرسلين، السلام عليك يا خاتم النبيين، جزاك الله عنا ما أنت أهله. ثم ليقرأ: ﴿إِنَّ ٱللَّهَ وَمَلَٰٓئِكَتَهُۥ يُصَلُّونَ عَلَى ٱلنَّبِيِّۚ يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ صَلُّوا۟ عَلَيْهِ وَسَلِّمُوا۟ تَسْلِيمًا﴾ [الأحزاب: ٥٦] ثم ليقل: اللهم صل على محمد وعلى آل محمد وسلم صلاة ترضيه، وآته الوسيلة والفضيلة، وارفعه الدرجة العظيمة والمقام المحمود الذي وعدته. ثم ليقل: أشهد أنك بلغت الرسالة، وأديت الأمانة، ونصحت الأمة، وجاهدت في الله حق جهاده، فصلى الله عليك وعلى آلك وسلم.", "ثم يتأخر قدر ذراع ويسلم على أبي بكر الصديق، ثم يتأخر قدر ذراع ويسلم على عمر بن الخطاب، ويقول: السلام عليكما يا وزيري رسول الله، جزاكما الله أحسن الجزاء. ثم ليرجع فليقف عند رأس رسول الله صلى الله عليه وسلم، وليكثر من الدعاء والصلاة عليه، ثم ليقل: اللهم إنك قلت: ﴿وَلَوْ أَنَّهُمْ إِذ ظَّلَمُوٓا۟ أَنفُسَهُمْ جَآءُوكَ فَٱسْتَغْفَرُوا۟ ٱللَّهَ وَٱسْتَغْفَرَ لَهُمُ ٱلرَّسُولُ لَوَجَدُوا۟ ٱللَّهَ تَوَّابًا رَّحِيمًا﴾ [النساء: ٦٤] وإني قد سمعت قولك، واتبعت أمرك، وقصدت نبيك مستشفعا به إليك في ذنوبي، وأنا", "حاشية: (١) تقدم في الصفحة ٢٠٦.", "حاشية: (٢) تقدم في الصفحة ٢٠٧.", "حاشية: (٣) الصفر: النحاس.", "تائب من زللي معترف بخطأي، فتب علي وشفع نبيك في. ثم يأتي الروضة فيصلي فيها، ويستحب له أن يزور أهل البقيع وشهداء أحد، وليزر مسجد قباء، وليصل فيه، وكل موضع يعرفه من المواضع التي كان رسول الله صلى الله عليه وسلم يصلي فيها، أو بئر كان يشرب منها، فإذا أراد الخروج ودع رسول الله صلى الله عليه وسلم."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "«ما عمل ابن آدم يوم النحر من عمل أحب إلى الله من هراقة دم، وإنها لتأتي يوم القيامة بقرونها ____ وأظلافها، وإن الدم ليقع من الله بمكان قبل أن يقع إلى الأرض، فطيبوا بها نفسا»", "o": ["وأشعارها", "ليلتين", "التسحر", "وأدركوا"], "h": "راجع: ص٢٢٦"}, {"t": "fill", "d": 2, "q": "وفي حديث ابن عمر عن النبي صلى الله عليه ____ أنه قال", "o": ["وسلم", "والغسل", "ويتقلب", "يعرض"], "h": "راجع: ص٢١٣"}, {"t": "fill", "d": 2, "q": "وينبغي أن يطيب الكلام مع رفقائه، ويطعم الطعام، ويظهر محاسن الأخلاق، فإن السفر يخرج خبايا الباطن، ومن كان في السفر الذي هو مظنة الضجر حسن ____ كان في الحضر أحسن خلقا", "o": ["الخلق", "يتوضأ", "ويحتاج", "وسبل"], "h": "راجع: ص٢١٤"}, {"t": "fill", "d": 2, "q": "الأولى: في المال، فينبغي أن يبدأ بالتوبة، ورد المظالم، وقضاء الديون، وإعداد النفقة لكل من يلزمه نفقته إلى وقت الرجوع، ويرد ما عنده من الودائع ويستصحب من المال ____ ما يكفيه لذهابه وإيابه من غير", "o": ["الحلال", "ملابس", "أخذه", "الأعراف"], "h": "راجع: ص٢١٣"}, {"t": "fill", "d": 2, "q": "الثاني: أن يفارق مخيط الثياب ويلبس ثوبي إحرامه، فيأتزر بإزار ويرتدي برداء أبيضين نظيفين ويتطيب لإحرامه، وفي الصحيحين من حديث عائشة قالت: طيبت رسول الله صلى الله عليه وسلم ____ حين أحرم ولحله حين", "o": ["لحرمه", "حصين", "أعطيهم", "ركبا"], "h": "راجع: ص٢١٩"}, {"t": "fill", "d": 2, "q": "فإذا ذبح حلق أو قصر جميع رأسه، وفي الأخرى يجزئه بعضه كالمسح، فإن لم يكن له شعر استحب أن يمر الموسى على رأسه، والمرأة تقصر من شعرها قدر الأنملة، وإذا حلق حل له كل محظور في الحج إلا النساء، ثم يفيض إلى مكة، ويطوف طواف الزيارة، وأول وقته بعد نصف الليل من ليلة النحر، وأفضل وقته يوم النحر، ولا آخر لوقته، إلا أنه يبقى معلقا بعلقة الإحرام فلا تحل له النساء حتى يطوف، فإذا طاف سعى إلا أن يكون قد سعى بعد طواف القدوم، فيكفي، والأحسن أن يرمي ثم يذبح ثم يحلق ثم يطوف، فإن قدم الحلاق على الرمي أو على النحر جاهلا بالسنة، فلا شيء عليه، فإذا فرغ من الطواف عاد إلى منى ليبيت بها ثلاث ليال إلا أن يختار التعجيل في يومين، ويرمي الجمرات الثلاث في ____ التشريق بعد الزوال كل جمرة كل يوم بسبع حصيات، كما وصفنا في جمرة العقبة، فيبدأ بالجمرة الأولى وهي أبعد الجمرات من مكة وتلي مسجد الخيف، فيجعلها عن يساره ويستقبل القبلة ويرميها، ثم يتقدم عنها إلى", "o": ["أيام", "كبرى", "واشتغل", "الحكمة"], "h": "راجع: ص٢٢٧"}]}], "sum": [["الصفحات", "ص٢١٣ - ص٢٣١"]], "_nq": 18}, {"id": "l27", "title": "فصل في سنن الرجوع من السفر", "group": "كتاب أسرار الحج ومهماته", "map": {"center": "فصل\nفي سنن", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "فصل في سنن الرجوع من السفر", "b": [{"pic": ["books", "book"], "cap": "ص٢٣١ - ص٢٣٢"}, {"story": ["فصل في سنن الرجوع من السفر، ص٢٣١", ["أخبرنا عبد الأول قال: أخبرنا الداودي قال: أخبرنا ابن أعين قال: حدثنا الفربري قال: حدثنا البخاري قال: حدثنا إسماعيل قال حدثني مالك عن نافع عن عبد الله بن عمر أن رسول الله صلى الله عليه وسلم كان إذا قفل من غزو أو حج أو عمرة يكبر على كل شرف من الأرض ثلاث تكبيرات، ثم يقول: «لا إله إلا الله وحده لا شريك له، له الملك وله الحمد، وهو على كل شيء قدير، آيبون تائبون، لربنا حامدون، صدق الله وعده، ونصر عبده، وهزم الأحزاب وحده». أخرجاه في الصحيحين(١).", "وينبغي أن يرسل إلى أهله من يعلمهم بقدومه ليتأهبوا له ولا يطرقهم ليلا، ففي الصحيحين من حديث أنس أن النبي صلى الله عليه وسلم كان لا يطرق أهله ليلا، كان يدخل غدوة أو عشيا(٢). وفي الصحيحين من حديث جابر عن النبي صلى الله عليه وسلم أنه قال: «إذا أطال أحدكم الغيبة فلا يطرق أهله ليلا»(٣). وإذا دخل البلد فليقصد المسجد أولا وليصل ركعتين، ففي الصحيحين من حديث كعب بن مالك قال: كان رسول الله صلى الله عليه وسلم إذا قدم من سفر بدأ بالمسجد فصلى فيه ركعتين ثم جلس فيه(٤). فإذا دخل إلى بيته فليقل: توبا توبا. ففي حديث ابن عباس عن النبي صلى الله عليه وسلم أنه كان إذا دخل إلى أهله ـ يعني من السفر ـ قال: «توبا توبا، لربنا أوبا، لا يغادر علينا حوبا»(٥). فإذا استقر", "حاشية: (١) أخرجه البخاري (١٧٩٧) و(٢٩٩٥) و(٤١١٦) و(٦٣٨٥)، ومسلم (١٣٤٤).", "حاشية: (٢) أخرجه البخاري (١٨٠٠)، ومسلم (١٩٢٨).", "حاشية: (٣) أخرجه البخاري (٥٢٤٤)، ومسلم في الإمارة ص ١٥٢٨ برقم خاص (١٨٣).", "حاشية: (٤) أخرجه البخاري (٣٠٨٨)، ومسلم (٧١٦).", "حاشية: (٥) أخرجه أحمد (٢٣١١)، وابن أبي شيبة ١٠/ ٣٥٨ و٣٦٠، و١٢/ ٥١٧، وأبو يعلى", "في منزله فليذكر نعمة الله عليه فيما رزقه من قضاء الحج وبلوغ تلك المنازل، وليستشعر غفران ما مضى من ذنوبه، وليحذر من العود إلى التدنس بالذنوب.", "حاشية (تتمة): (٢٣٥٣)، وابن حبان (٢٧١٦)، والطبراني في الكبير (١١٧٣٥) وفي الدعاء (٨٠٩)، وابن السني في عمل اليوم والليلة (٥٣١)، والبزار في كشف الأستار (٣١٢٧)، والحاكم ١/ ٤٨٨. والحوب: الذنب والإثم."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "وينبغي أن يرسل إلى أهله من يعلمهم بقدومه ليتأهبوا له ولا يطرقهم ليلا، ففي الصحيحين من حديث أنس أن النبي صلى الله عليه وسلم كان لا يطرق أهله ليلا، كان يدخل غدوة أو ____", "o": ["عشيا", "قبائل", "الخبري", "ماتع"], "h": "راجع: ص٢٣١"}, {"t": "fill", "d": 2, "q": "أخبرنا عبد الأول قال: أخبرنا الداودي قال: أخبرنا ابن أعين قال: حدثنا الفربري قال: حدثنا البخاري قال: حدثنا إسماعيل قال حدثني ____ عن نافع عن عبد الله بن عمر أن رسول الله صلى الله عليه وسلم كان إذا", "o": ["مالك", "ويمشون", "ودخول", "القيء"], "h": "راجع: ص٢٣١"}, {"t": "fill", "d": 2, "q": "في منزله فليذكر نعمة الله عليه فيما رزقه من قضاء الحج وبلوغ تلك ____، وليستشعر غفران ما مضى من ذنوبه، وليحذر من العود إلى التدنس بالذنوب", "o": ["المنازل", "بتقوية", "يستفتح", "فخصوه"], "h": "راجع: ص٢٣٢"}]}], "sum": [["الصفحات", "ص٢٣١ - ص٢٣٢"]], "_nq": 3}, {"id": "l28", "title": "الباب الثالث في الآداب الدقيقة والأعمال الباطنة", "group": "كتاب أسرار الحج ومهماته", "map": {"center": "الباب\nالثالث في", "nodes": [{"t": "النص", "s": []}]}, "paras": [{"t": "الباب الثالث في الآداب الدقيقة والأعمال الباطنة - القسم ١ من ٢", "b": [{"pic": ["books", "book"], "cap": "ص٢٣٣ - ص٢٤٢"}, {"story": ["الباب الثالث في الآداب الدقيقة والأعمال الباطنة (١ من ٨)، ص٢٣٣", ["**في الآداب الدقيقة والأعمال الباطنة**", "بيان دقائق الآداب، وهي عشرة:", "**الأول:** أن تكون النفقة حلالا، وتكون اليد خالية عن تجارة تشغل القلب وتفرق الهم ليجتمع في العبادة، أخبرنا أبو منصور القزاز قال: أخبرنا أبو بكر الخطيب قال: أخبرنا عبد الله بن أحمد بن خشويه قال: حدثنا عبد الرحمن بن الحسن السرخسي قال: حدثني إسماعيل بن جميع قال: حدثنا مغيث بن أحمد البلخي، قال: حدثني سليمان بن أبي عبد الرحمن عن مخلد بن عبد الرحمن الأندلسي عن محمد بن عطاء عن جعفر ـ يعني ابن سليمان ـ قال: حدثنا ثابت عن أنس بن مالك قال: قال رسول الله صلى الله عليه وسلم: «يأتي على الناس زمان يحج أغنياء أمتي للنزهة، وأوساطهم للتجارة، وقراؤهم للرياء والسمعة، وفقراؤهم للمسألة».", "**الثاني:** أن لا يعاون الصادين عن بيت الله بضرب المكس من الأعراب فإن تسليم المال إليهم إعانة على الظلم وتيسير لأسبابه عليهم، فهو كالإعانة بالنفس، وفي ذلك ذل وصغار على المسلم، وليتلطف في الخلاص منهم، فإن لم يقدر، فقد رأى بعض العلماء ترك التنفل بالحج لأجل ذلك.", "**الثالث:** التوسع في الزاد وطيب النفس بالبذل والإنفاق من غير تقتير ولا إسراف، فقد أخبرنا يحيى بن علي المدبر قال: أخبرنا القاضي أبو الحسين السمناني قال: أخبرنا أبو طاهر بن مهدي، قال: أخبرنا عثمان بن أحمد السمرقندي، قال: حدثنا أبو أمية قال: حدثنا عمرو بن عثمان قال: حدثنا موسى بن أعين عن عطاء بن السائب عن علقمة بن مرثد عن ابن بريدة عن أبيه عن النبي صلى الله عليه وسلم أنه قال: «النفقة في الحج تضاعف، كالنفقة في سبيل الله الدرهم بسبعمائة». وفي حديث جابر عن النبي صلى الله عليه وسلم أنه قال: «حج مبرور ليس له جزاء إلا الجنة» قالوا: يا", "رسول الله ما بر الحج؟ قال: «إطعام الطعام، وإفشاء السلام». وكان عبد الله بن المبارك يحج بإخوانه فيطعمهم أطيب الطعام وأطيب الحلوى، وكان أبو الشعثاء لا يماكس(١) في الكراء إلى مكة، ولا في الرقبة يشتريها للعتق، ولا في الأضحية ويقول: لا نماكس في كل شيء نتقرب به إلى الله عز وجل.", "واعلم أن بذل المال في تلك الطريق أولى من بذله في غيرها لأربعة معان:", "**أحدها:** أن مس الحاجة هناك أشد من مسها في غيره. **الثاني:** أنه لا بلد يلجأ إليه. **الثالث:** مجاهدة النفس لقوة بخلها بالشيء مخافة الحاجة إليه. **والرابع:** أنه إعانة للقاصدين على القصد.", "وقد رئيت زبيدة(٢) في المنام فقيل لها: ما فعل الله بك؟ فقالت: غفر لي في أول معول ضرب به في طريق مكة."]], "ic": "book"}, {"story": ["الباب الثالث في الآداب الدقيقة والأعمال الباطنة (٢ من ٨)، ص٢٣٤", ["**الرابع:** ترك الرفث والفسوق والجدال، والرفث اسم جامع للغو والخنا والفحش من الكلام، ويدخل فيه مغازلة النساء ومداعبتهن والتحدث بشأن الجماع ومقدماته، فإن ذلك يهيج داعية الجماع المحظور، والداعي إلى المحظور محظور. والفسوق اسم جامع لكل ما يخرج عن طاعة الله تعالى. والجدال المبالغة في الخصومة والمماراة مما يورث الضغائن وينقض حسن الخلق، فينبغي للمسافر إلى الحج حسن الخلق، وليس هو كف الأذى فحسب بل احتمال الأذى، وإنما سمي السفر سفرا؛ لأنه يسفر عن أخلاق الرجال. قال مجاهد: صحبت ابن عمر وأنا أريد أن أخدمه، فكان يخدمني أكثر.", "حاشية: (١) يقال: ماكسه في البيع مماكسة، أي طلب منه أن ينقص من الثمن.", "حاشية: (٢) هي زبيدة بنت جعفر بن المنصور العباسي، زوجة هارون الرشيد، تزوجها الرشيد سنة (٦٥) هجرية، وكانت شديدة البر تكثر من أعمال الخير، فقد سقت أهل مكة الماء بعد أن كانت الراوية عندهم بدينار، فأسالت المياه من عشرة أميال إليها، ومهدت طريق الحجاج من بغداد إلى مكة وعملت فيه البرك والآبار والمنازل، توفيت سنة (٢١٦ هـ). أعلام النساء ٢/ ١٧.", "**الخامس:** أن يحج ماشيا إن قدر، وقد سبق ذكر فضل حج الماشي، والاستحباب في المشي في المناسك والتردد من مكة إلى الموقف وإلى منى آكد منه في الطريق. وقد قال بعض العلماء الركوب أفضل لما فيه من الإنفاق والمؤونة، وهذا بعيد؛ لأن مشقة البدن عند أكثر الناس أعظم من مشقة إخراج المال، وقد علل بعضهم فقال: الركوب أبعد من ضجر النفس. ونحن نقول: من كان ضعيفا يتأذى بالمشي فيؤديه إلى سوء خلق وقصور عن عمل، فالركوب له أفضل، ومن سهل عليه المشي فهو أفضل.", "**السادس:** أن يجتنب المحمل ويركب الزاملة(١)، إلا أن يخاف أن لا يستمسك(٢) على الزاملة لعذر وفي ذلك معنيان: **أحدهما:** التخفيف عن البعير، فإن المحمل يؤذيه. **والثاني:** اجتناب زي المترفين والمتكبرين، فإن رسول الله صلى الله عليه وسلم حج على راحلة وتحته رحل رث. وقيل: إن أول من أحدث المحامل الحجاج.", "**السابع:** أن يكون رث الهيئة أشعث أغبر، غير مستكثر من الزينة، ولا مائل إلى أسباب التفاخر والتكاثر، ففي حديث جابر عن النبي صلى الله عليه وسلم: «إن الله تعالى يباهي بالحاج الملائكة، فيقول: انظروا إلى عبادي أتوني شعثا غبرا من كل فج عميق أشهدكم أني قد غفرت لهم. فتقول الملائكة: رب فيهم فلان وفلانة. فيقول الله عز وجل: قد غفرت لهم. فقال رسول الله صلى الله عليه وسلم: فما من يوم أكثر عتيقا من يوم عرفة ولا يغفر فيه(٣) لمختال».", "**الثامن:** أن يرفق بالدابة ولا يحملها ما لا تطيق، ولا ينام عليها، وقد سبق ذكر هذا في أول كتاب الحج(٤)."]], "ic": "book"}, {"story": ["الباب الثالث في الآداب الدقيقة والأعمال الباطنة (٣ من ٨)، ص٢٣٥", ["**التاسع:** أن يتقرب بإراقة دم، ويجتهد أن يكون من سمين النعم ونفيسه، وليأكل منه إن كان تطوعا ولا يماكس في شرائه، وقد سئل رسول الله صلى الله عليه وسلم: «ما بر", "حاشية: (١) الزاملة: البعير الذي يحمل عليه الزمالة وهي أداة المسافر.", "حاشية: (٢) في الأصل: «يتمسك».", "حاشية: (٣) سقطت من الأصل.", "حاشية: (٤) تقدم في الصفحة: ٢١٧.", "الحج؟ فقال: العج والثج»، والعج: رفع الصوت بالتلبية، والثج: صب الدم بالنحر. وقد سبق فضل الأضاحي(١).", "**العاشر:** أن يكون طيب النفس بما أنفقه وبما أصابه من أذى في مال أو بدن.", "**بيان الأعمال الباطنة ووجه الإخلاص في النية وطريق الاعتبار بالمشاهد الشريفة وكيفية الافتكار فيها والتذكر لأسرارها ومعانيها من أول الحج إلى آخره**", "اعلم أن أول الحج الفهم أعني: فهم موقع الحج من الدين، ثم الشوق إليه، ثم العزم عليه، ثم قطع العلائق المانعة منه، ثم شراء ثوب الإحرام، ثم شراء الزاد، ثم اكتراء الراحلة، ثم الخروج، ثم السير في البادية، ثم الإحرام من الميقات بالتلبية، ثم دخول مكة ثم استتمام الأفعال كما سبق، وفي كل واحد من هذه الأمور تذكرة للمتذكر، وعبرة للمعتبر، وتنبيه للمريد الصادق، وإشارة للفطن، فلنرمز إلى مفاتحها حتى إذا انفتح بابها وعرفت أسبابها انكشف لكل حاج من أسرارها ما يقتضيه صفاء قلبه وطهارة باطنه وغزارة علمه.", "أما الفهم: فاعلم أنه لا وصول إلى الله سبحانه إلا بالتجرد له، والانفراد بخدمته، وقد كان الرهبان ينفردون في الجبال طلبا للأنس بالله عز وجل، فجعل الحج رهبانية لهذه الأمة، فشرف الله تعالى البيت بإضافته إليه، ونصبه مقصدا لعباده، وجعل ما حواليه حرما له تفخيما لأمره، وجعل عرفة كالميدان على فناء حرمه، وأكد حرمة الموضع بتحريم صيده وشجره، وضعه على مثال حضرة الملوك يقصده الزوار من كل فج عميق شعثا غبرا متواضعين لرب البيت خضوعا لجلاله، واستكانة لعزته مع الاعتراف بتنزيهه عن أن يحويه بيت أو يكنه بلد ليكون ذلك أبلغ في عبوديتهم وأتم في دعائهم وانقيادهم، ولذلك وظف عليهم في الحج أعمالا لا تأنس بها النفوس ولا تهتدي إلى معانيها العقول، كرمي الجمار", "حاشية: (١) تقدم في الصفحة: ٢٢٦.", "بالأحجار، والتردد بين الصفا والمروة مرارا، وبمثل هذه الأعمال يظهر كمال الرق والعبودية، وفي ذلك عزل للعقل عن تصرفه، وصرف للطبع عن محل أنسه على ما أشرنا إليه في إخراج القيم في الزكاة.", "وأما الشوق فإنما ينبعث بعد الفهم والتحقق(١) بأن البيت بيت الله، وأن قاصده قاصد إلى الله سبحانه وزائر له، وأن هذا القاصد جدير بأن يرزق الزيارة في الآخرة، وأن يمد بصره بقوة يستعد معها للنظر إلى الله سبحانه."]], "ic": "book"}, {"story": ["الباب الثالث في الآداب الدقيقة والأعمال الباطنة (٤ من ٨)، ص٢٣٧", ["وأما العزم، فليعلم أنه بعزمه قاصد إلى مفارقة الأهل والوطن وهجر الشهوات، متوجه إلى زيارة بيت الله، فليعظم في نفسه قدر البيت، وليجعل عزمه خالصا لله سبحانه، والإخلاص بصحة القصد وإفراده له واجتناب كل ما فيه رياء وسمعة.", "وأما قطع العلائق، فمعناه: رد المظالم؛ لأن كل مظلمة علاقة، وكل علاقة غريم حاضر يتعلق بتلبيب(٢) هذا القاصد ويقول: أين تتوجه؟ أتقصد بيت الملك وأنت مضيع أمره في منزلك؟ أما تخاف أن يردك إذا قدمت عليه؟ فنفذ أوامره أولا، وتب إليه لتكون متوجها نحوه بوجه قلبك، كما أنك متوجه إلى بيته بوجه ظاهرك لئلا يكون نصيبك النصب.", "وليكتب وصية، فإن المسافر وماله لعلى قلت(٣) إلا ما وقى الله عز وجل، وليذكر بذلك قطع العلائق لسفر الآخرة.", "وأما الزاد، فليطلبه من حله، وإذا رأى نفسه تطلب من الزاد ما يبقى في طول السفر ولا يفسد، فليذكر زاد الآخرة، فليحذر أن تكون أعماله فاسدة بالرياء والتقصير فلا تصحبه، كالطعام الرطب الذي يفسد في أول منازل السفر، فيبقى صاحبه وقت الحاجة متحيرا.", "حاشية: (١) في الأصل: «التحقيق».", "حاشية: (٢) التلبيب واللبب: ما يقع على اللبة ـ وهي النحر ـ من الثياب.", "حاشية: (٣) القلت: الهلاك.", "وأما الراحلة، فإذا أحضرها فليشكر الله تعالى على ما سخر له، وليذكر ركوب الجنازة، وربما ركبها قبل ركوب الناقة.", "وأما شراء ثوب الإحرام، فليتذكر عنده الكفن، فإنه سيلقى الله في زي مخالف لزي أهل الدنيا.", "وأما الخروج عن البلد، فليحضر قلبه لذلك، وليتفكر في أنه زائر لربه وليرج الوصول والقبول ثقة بفضل الله لا إدلالا بأعماله، فإن لم يصل رجا أن يجعل مع الواصلين لقوله تعالى: ﴿وَمَن يَخْرُجْ مِنۢ بَيْتِهِۦ مُهَاجِرًا إِلَى ٱللَّهِ وَرَسُولِهِۦ ثُمَّ يُدْرِكْهُ ٱلْمَوْتُ فَقَدْ وَقَعَ أَجْرُهُۥ عَلَى ٱللَّهِۗ﴾ [النساء: ١٠٠].", "وأما دخول البادية ومشاهدة تلك العقاب، فليتذكر به ما بين الخروج من الدنيا بالموت إلى ميقات القيامة وما بينهما من الأهوال، وليذكر من هول قطاع الطريق هول سؤال منكر ونكير، ومن سباع الأودية عقارب القبر وديدانه، ومن انفراده عن أهله وحشة القبر ووحدته، فليتزود لتلك الشدائد."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "السابع: أن يكون رث الهيئة أشعث أغبر، غير مستكثر من الزينة، ولا مائل إلى أسباب التفاخر والتكاثر، ففي ____ جابر عن النبي صلى الله عليه وسلم: «إن الله تعالى يباهي بالحاج الملائكة، فيقول: انظروا إلى", "o": ["حديث", "بقطع", "يتلفظ", "مطرف"], "h": "راجع: ص٢٣٥"}, {"t": "fill", "d": 2, "q": "الثامن: أن يرفق بالدابة ولا يحملها ما لا تطيق، ولا ينام ____، وقد سبق ذكر هذا في أول كتاب", "o": ["عليها", "فعرضت", "الأبطح", "كالبيت"], "h": "راجع: ص٢٣٥"}, {"t": "fill", "d": 2, "q": "أخبرنا أبو بكر بن حبيب قال: أخبرنا علي بن أبي صادق قال: أخبرنا ابن باكويه قال: سمعت الحسن بن ____ الفارسي يقول: سمعت محمد بن داود الدينوري يقول: سمعت أبا عبد الله بن الجلاء يقول: كنت بذي", "o": ["أحمد", "أفراده", "وسموا", "يلغو"], "h": "راجع: ص٢٣٩"}, {"t": "fill", "d": 2, "q": "الخامس: أن يحج ماشيا إن قدر، وقد سبق ذكر فضل حج الماشي، والاستحباب في المشي في المناسك والتردد من مكة إلى الموقف وإلى منى آكد منه في الطريق. وقد قال بعض العلماء الركوب أفضل لما فيه من ____", "o": ["الإنفاق", "ينعدم", "ولوالديه", "فيذكر"], "h": "راجع: ص٢٣٥"}, {"t": "fill", "d": 2, "q": "وأما العزم، فليعلم أنه بعزمه قاصد إلى مفارقة الأهل والوطن وهجر الشهوات، متوجه إلى زيارة بيت الله، فليعظم في نفسه قدر البيت، وليجعل عزمه خالصا لله سبحانه، والإخلاص بصحة القصد ____ له واجتناب كل ما فيه رياء وسمعة", "o": ["وإفراده", "الأخيرة", "بالقليل", "الضرورية"], "h": "راجع: ص٢٣٧"}, {"t": "fill", "d": 2, "q": "الحج؟ فقال: العج والثج»، والعج: رفع الصوت بالتلبية، والثج: صب الدم ____. وقد سبق فضل", "o": ["بالنحر", "بيوتكم", "الجمل", "الأطعمة"], "h": "راجع: ص٢٣٦"}]}, {"t": "الباب الثالث في الآداب الدقيقة والأعمال الباطنة - القسم ٢ من ٢", "b": [{"story": ["الباب الثالث في الآداب الدقيقة والأعمال الباطنة (٥ من ٨)، ص٢٣٨", ["وأما الإحرام والتلبية، فليعلم أن معناه إجابة نداء الله تعالى، فليرج القبول، وليخش أن يقال له: لا لبيك ولا سعديك. فقد حج علي بن الحسين، فلما أحرم واستوت به راحلته اصفر لونه وارتعد ولم يستطع أن يلبي، فقيل: مالك لا تلبي؟ فقال: أخشى أن يقول لي: لا لبيك ولا سعديك. فلما لبى غشي عليه. ولما حج جعفر الصادق فأراد أن يلبي تغير وجهه، فقيل: ما لك يا ابن رسول الله؟ فقال: أريد أن ألبي فأخاف أن أسمع غير الجواب. وقال أحمد بن أبي الحواري: كنت مع أبي سليمان الداراني(١) حين أراد أن يحرم فلم يلب حتى سرنا ميلا ثم غشي عليه، فأفاق وقال: يا أحمد أوحى الله تعالى إلى موسى: مر ظلمة بني إسرائيل لا يذكروني، فإني أذكر من ذكرني منهم باللعنة، ويحك يا أحمد، بلغني أن من حج من غير حله ثم لبى قال الله عز وجل: لا لبيك ولا سعديك حتى ترد ما في يديك. فما نأمن أن يقال لنا ذلك.", "حاشية: (١) ليست في (ظ).", "أخبرنا أبو بكر بن حبيب قال: أخبرنا علي بن أبي صادق قال: أخبرنا ابن باكويه قال: (١-١)سمعت الحسن بن أحمد الفارسي يقول: سمعت محمد بن داود الدينوري يقول(١-١): سمعت أبا عبد الله بن الجلاء يقول: كنت بذي الحليفة وشاب يريد أن يحرم، فكان يقول: يا رب، أريد أن أقول: لبيك اللهم لبيك، فأخشى أن تجيبني بلا لبيك ولا سعديك. يردد ذلك مرارا، ثم قال: لبيك اللهم. مد بها صوته، وخرجت روحه.", "وليتذكر الملبي لإجابة نداء الله إذ قال: ﴿وَأَذِّن فِي ٱلنَّاسِ بِٱلْحَجِّ﴾ [الحج: ٢٧] إجابة الخلق لنداء الصور، وازدحامهم في عرصات القيامة منقسمين إلى مقبول ومردود.", "وأما دخول مكة، فليتذكر عنده أنه قد انتهى إلى حرم آمن، فليرج الأمن من العقوبة، وليخش أن لا يكون أهلا للقرب، غير أنه ينبغي أن يكون الرجاء غالبا؛ لأن الكرم عميم، وحق الزائر مرعي، وذمام(٢) المستجير لا يضيع.", "وأما وقوع البصر على البيت، فينبغي أن يحضر عنده عظمة البيت في القلب، فانظر إليه بعين الإضافة لا بعين أنه حجر، وقدر أنك مشاهد لرب البيت وارج أن يرزقك النظر إليه كما رزقك النظر إلى بيته، واشكر تبليغك هذه الرتبة، والحاقك بزمرة الوافدين.", "وأما الطواف بالبيت، فإنه صلاة، فأحضر قلبك من التعظيم والرجاء ما تحضره في الصلاة، واعلم أنك متشبه بالطواف بالملائكة الحاقين حول العرش، ولا تظن أن المقصود طواف جسمك بالبيت بل طواف قلبك بذكر رب البيت.", "وأما الاستلام، فاعتقد عنده أنك مبايع لله على طاعته، فصمم عزيمتك على الوفاء ببيعتك، فإن من غدر استحق المقت. قال ابن عباس: الحجر الأسود يمين الله في الأرض يصافح عباده كما يصافح أحدكم أخاه.", "حاشية: (١-١) سقط من (ظ).", "حاشية: (٢) الذمام: العهد والأمانة والحق والحرمة."]], "ic": "book"}, {"story": ["الباب الثالث في الآداب الدقيقة والأعمال الباطنة (٦ من ٨)، ص٢٤٠", ["وأما التعلق بأستار الكعبة والالتصاق بالملتزم، فتذكر به لجأ المذنب وقرب المحب، أخبرنا محمد بن ناصر قال: أخبرنا أبو الحسين بن يعقوب قال: قال لنا القاضي أبو الحسن بن صخر الأزدي: تعلق رجل بأستار الكعبة وأنشد:", "ستور بيتك ذيل الأمن منك وقد  علقتها مستجيرا أيها الباري", "وما أظنك لما أن علقت بها  خوفا من النار تدنيني إلى النار", "وها أنا جار بيت أنت قلت لنا  حجوا إليه وقد أوصيت بالجار", "وأما السعي بين الصفا والمروة، فإنه يضاهي تردد العبد بفناء دار الملك إظهارا لخلوص الخدمة، ورجاء للملاحظة بعين الرحمة، كالذي دخل على الملك ثم خرج ولا يدري ما يقضي به الملك في حقه من قبول أو رد، فهو يتردد على فناء الدار مرة بعد أخرى، وليتذكر عند تردده بين كفتي الميزان في عرصات القيامة، وليمثل الصفا كفة الحسنات، والمروة كفة السيئات.", "وأما الوقوف بعرفة، فاذكر بما ترى من ازدحام الخلق، وارتفاع الأصوات، واختلاف اللغات، واتباع كل فريق إمامهم في التردد في المشاعر اقتداء باتباع الأمم أنبياءها، وطمعهم في شفاعتهم، وما يخلو ذلك الجمع من الأولياء وأرباب القلوب، فإذا اجتمعت همتهم على طلب الرحمة، فلا تظنن أن أملهم يخيب.", "وأما رمي الجمار، فاقصد به الانقياد للأمر إظهارا للرق والعبودية، وانتهاضا لمجرد الامتثال من غير حظ للعقل والنفس، ثم اقصد به التشبه بالخليل حين عرض له إبليس هناك، فإن خطر لك أن إبليس إنما عرض لذلك ولم يعرض لي فارميه، فاعلم أن هذا من إلقاء الشيطان ليفتر عزمك ويخيل لك أن الرمي فعل لا فائدة فيه، فاطرد هذا عن نفسك بالجد في الرمي، وارمه لهذا الوسواس.", "وأما ذبح الهدي، فاعلم أنه يقرب إلى الله عز وجل بحكم الامتثال فجوده وارج ثوابه."]], "ic": "book"}, {"story": ["الباب الثالث في الآداب الدقيقة والأعمال الباطنة (٧ من ٨)، ص٢٤١", ["وأما زيارة المدينة، فإذا لاحت لك فتذكر أنها البلدة التي اختارها الله سبحانه لنبيه صلى الله عليه وسلم، وجعل إليها هجرته، وشرع فيها فرائضه وسننه، وجعل فيها تربته، ثم مثل في نفسك مواقع أقدام النبي صلى الله عليه وسلم عند تردده فيها، وتصور خشوعه وسكينته في المشي، وتذكر ما من الله به على أصحابه وتأسف على ما فاتك من ذلك، واذكر أنه قد فاتتك رؤيته في الدنيا، وأنت من رؤيته في الآخرة على خطر، ففي الصحيحين من حديث ابن مسعود عن النبي صلى الله عليه وسلم أنه قال: «أنا فرطكم على الحوض، ليختلجن رجال دوني، فأقول: يا رب أصحابي، فيقال: إنك لا تدري ما أحدثوا بعدك». وفي الصحيحين من حديث أبي حازم عن سهل بن سعد عن النبي صلى الله عليه وسلم أنه قال: «ليردن علي أقوام أعرفهم ويعرفوني، ثم يحال بيني وبينهم». قال أبو حازم: فسمعني النعمان بن أبي عياش وأنا أحدثهم هذا الحديث، فقال: وأنا أشهد على أبي سعيد الخدري لسمعته يزيد: «فيقول: إنهم مني. فيقال: لا تدري ما عملوا بعدك». فأقول: سحقا سحقا لمن بدل بعدي». ثم ليترجح في قلبك الرجاء بأنه لا يحال بينك وبينه، لما رزقك الله تعالى من الإيمان، وأشخصك لزيارته بمحض حب له(١) وشوق إليه.", "فإذا رأيت مسجده فتذكر أنها العرصة التي اختارها الله تعالى لنبيه، ولأول المسلمين وأفضلهم، وأن فرائض الله تعالى إنما أقيمت أولا هنالك.", "وأما زيارة قبره، فأحضر قلبك لتعظيمه والهيبة له، ومثل صورته الكريمة في خيالك موضوعا في اللحد بإزائك، وأحضر عظيم(٢) رتبته في قلبك، واعلم أنه عالم بحضورك وتسليمك؛ أخبرنا هبة الله بن محمد قال: أخبرنا الحسن بن علي قال: أخبرنا أبو بكر بن مالك قال: حدثنا عبد الله بن أحمد قال: حدثني أبي قال: حدثنا عبد الله بن يزيد قال: حدثنا حيوة قال: حدثني أبو صخر أن يزيد بن", "حاشية: (١) ليست في (ظ).", "حاشية: (٢) في الأصل: «عظم».", "عبد الله بن قسيط أخبره عن أبي هريرة عن رسول الله صلى الله عليه وسلم أنه قال: «ما من أحد يسلم علي إلا رد الله إلي(١) روحي حتى أرد عليه السلام»(٢).", "قال الإمام أحمد: وحدثنا ابن نمير قال: حدثنا سفيان بن عبد الله بن السائب عن زاذان قال: قال عبد الله(٣): قال رسول الله صلى الله عليه وسلم: «إن لله عز وجل في الأرض ملائكة سياحين، يبلغوني من أمتي السلام»(٤).", "ثم اثبت المنبر وتوهم صعوده صلى الله عليه وسلم عليه، ومثل في قلبك طلعته البهية، قائما على المنبر، وقد أحدق به المهاجرون والأنصار، وهو يحثهم على الخير."]], "ic": "book"}, {"story": ["الباب الثالث في الآداب الدقيقة والأعمال الباطنة (٨ من ٨)، ص٢٤٢", ["فهذه وظيفة القلب في أعمال الحج، فإذا فرغ منه كلها، فينبغي أن يلزم قلبه الخوف، فإنه لا يدري أقبل منه حجه أم رد؟ ويتعرف ذلك من قلبه وأعماله، فإن صادف قلبه قد تجافى عن دار الغرور وانصرف إلى الأنس بالله سبحانه، ورأى أعماله قد اتزنت بميزان الشرع، فليعلم أن هذا دليل القبول، وإن كان الأمر بخلاف ذلك، فيوشك أن يكون حظه من السفر النصب، نعوذ بالله من ذلك.", "**آخر كتاب أسرار الحج.**", "حاشية: (١) ليست في الأصل.", "حاشية: (٢) أخرجه أحمد (١٠٨١٥)، وأبو داود (٢٠٤١)، والبيهقي في السنن ٥/ ٢٤٥، والطبراني في الأوسط (٣١١٦).", "حاشية: (٣) يعني ابن مسعود رضي الله عنه.", "حاشية: (٤) أخرجه أحمد (٣٦٦٦) و(٤٢١٠) و(٤٣٢٠)، وعبد الرزاق (٣١١٦)، والنسائي في المجتبى ٣/ ٤٣، وفي عمل اليوم والليلة (٦٦)، والدارمي ٢/ ٣١٧، والبزار (٨٤٥) (زوائد)، والطبراني في الكبير (١٠٥٢٩) و(١٠٥٣٠)، والحاكم ٢/ ٤٢١، وأبو نعيم في الحلية ٤/ ٢٠٠، والبغوي في شرح السنة (٦٨٧)، والبيهقي في شعب الإيمان (١٥٨٢)."]], "ic": "book"}], "q": [{"t": "fill", "d": 2, "q": "وأما الشوق فإنما ينبعث بعد الفهم والتحقق بأن البيت بيت الله، وأن قاصده قاصد إلى الله سبحانه وزائر له، وأن هذا القاصد جدير بأن ____ الزيارة في الآخرة، وأن يمد بصره بقوة يستعد معها للنظر إلى الله سبحانه", "o": ["يرزق", "يزداد", "لتقاد", "عظمته"], "h": "راجع: ص٢٣٧"}, {"t": "fill", "d": 2, "q": "ثم اثبت المنبر وتوهم صعوده صلى الله عليه وسلم عليه، ومثل في قلبك طلعت
